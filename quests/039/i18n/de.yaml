title: Validierung
brief: "Der Fahrplan darf nur gültige Abfahrtsanzahlen akzeptieren. Behalten Sie die vorgegebene Anzahl bei;\
  \ ungültige Anfragen müssen eindeutig scheitern.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte\
  \ Eingabedateien: `main.tf`, `terraform.tfvars`.\n\n**Anforderungen:**\n- Pläne weisen diese `departures`-Werte\
  \ mit der exakten Meldung `departures must be an integer from 1 to 6` zurück:\n  - `0`, `7`, `2.5`\n- Dateien\
  \ in `~/quest` auf der Workstation:\n  - `timetable.txt`: `3`\n- Die Ausgabe `departures` liefert die Zahl\
  \ `3`.\n- Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.\n"
debrief: Typ und validation schützen verschiedene Teile des Eingabevertrags. Negative Pläne übten die Wache
  aus, ohne unsichere Eingaben zu machen.
stages.0.brief: Behalten Sie den gültigen Fahrplan bei und weisen Sie ungültige Abfahrtsanzahlen mit der geforderten
  Meldung zurück.
stages.0.objectives.0.text: Plans mit den Werten `0`, `7` oder `2.5` für `departures` werden abgelehnt und
  enthalten die Meldung `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` enthält `3`.'
stages.0.objectives.2.text: Output `departures` liefert die Zahl `3`.
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Nur ein numerischer Typ akzeptiert Brüche.
hints.1.text: |-
  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:

  Kombinieren Sie Bereichsgrenzen mit einem ganzzahligen Prädikat.

  ```sh
  cat main.tf
  cat terraform.tfvars
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Ein negativer Wert plan muss für validation fehlschlagen, nicht für die Syntax.

  Prüfen Sie das beobachtete Ergebnis:

  - Jeder Befehl muss mit `departures must be an integer from 1 to 6` scheitern.

    ```sh
    tofu plan -input=false -no-color -var=departures=0
    tofu plan -input=false -no-color -var=departures=7
    tofu plan -input=false -no-color -var=departures=2.5
    ```

  Prüfe beide zulässigen Grenzwerte im Plan, bevor du den regulären Eingabewert anwendest. Jeder Plan muss mit Exit-Code 0 enden. Lasse beide Pläne unangewendet.

  ```sh
  tofu plan -input=false -no-color -var=departures=1
  tofu plan -input=false -no-color -var=departures=6
  ```

  - Erwartet: Der Fahrplan enthält `3` und die Ausgabe ist die Zahl `3`.

    ```sh
    cat timetable.txt
    tofu output -json departures
    ```

  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
phrases.0: Ich habe den unterstützten Eingabebereich an der Modulgrenze validiert.
phrases.1: Ich habe abgelehnte Werte getestet, bevor ich die normale Konfiguration akzeptiert habe.
phrases.2: Ich habe den gerenderten Zeitplan und einen leeren normalen plan überprüft.
diagnostics.probe_0_0: Eine reine Bereichsprüfung kann Brüche zulassen, oder ein Plan scheitert aus dem falschen Grund; auch Python-/tofu-Start- oder Berichtsschreibfehler stoppen die Versuche. [Ursache und Prüfung](guides#guide=terraform-2&section=departures-negative-plans)
diagnostics.timetable_content: Die normale Eingabe kann geändert oder noch nicht auf timetable.txt angewendet sein; eine fehlende oder unlesbare Datei scheitert ebenfalls. [Ursache und Prüfung](guides#guide=terraform-2&section=departures-applied-result)
diagnostics.departures_output: Ein unangewendeter oder geänderter Output kann die Zahl 3 auslassen; auch Output-Lese- oder JSON-Verarbeitungsfehler verhindern die Prüfung. [Ursache und Prüfung](guides#guide=terraform-2&section=departures-applied-result)
diagnostics.validation_plan: Änderungen für normale Eingaben können noch ausstehen, oder ein Konfigurations-, Provider- beziehungsweise State-Fehler stoppt die Planung. [Ursache und Prüfung](guides#guide=terraform-2&section=departures-clean-plan)
