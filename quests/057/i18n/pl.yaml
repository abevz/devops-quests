title: Diagnostyka PVC
brief: 'Dołączyłeś do operacji SignalRail. Bufor trasy czekał na nieznany storage class. Pracuj w ~/quest..
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `spool.json`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Spool to Bound, a relay jest gotowy.'
stages.0.brief: 'Świeży, pusty spool używał nieznanej klasy. Napraw go bez usuwania wdrożenia.


  Kryteria sukcesu: Spool to Bound, a relay jest gotowy.'
stages.0.objectives.0.text: Spool to Bound, a relay jest gotowy.
hints.0.text: Opisz PVC i przeczytaj jego storage class.
hints.1.text: Twierdzenie to jest świeże i puste; jego class name nie można naprawić na miejscu.
hints.2.text: Zatrzymaj to wdrożenie, odtwórz tylko jego puste żądanie za pomocą standard i zweryfikuj
  Bound przed readiness.
debrief: Świeże, puste roszczenie wymagało nieznanego storage class. Odtworzyłeś tylko to jednorazowe
  roszczenie za pomocą standard i zweryfikowałeś Bound i gotowy reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
