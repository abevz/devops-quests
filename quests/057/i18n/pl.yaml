title: Diagnostyka PVC
brief: |-
  Żądane miejsce nie udostępnia jeszcze użytecznego zestawu danych trasy. Przywróć aplikację docelową z zachowanego źródła bez odtwarzania pierwotnych workload.

  Pracuj na stacji roboczej w `~/quest` z `storage-contract.json`; sprawdź udostępnione zasoby w namespace.

  **Wymagania:**
  - Dostarczony claim docelowy jest początkowo pusty i niezwiązany. Zachowaj pierwotne tożsamości źródłowego PVC i obu Deployment, niezmienne obrazy oraz wszystkie zadeklarowane pliki źródłowe.
  - Claim docelowy ma stan `Bound`. Oba czytniki mają jedną gotową replikę; czytnik źródłowy zachowuje montowanie tylko do odczytu, a oba używają zadeklarowanego PVC pod zadeklarowaną ścieżką.
  - Zadeklarowane zwykłe pliki znajdują się na tych claim z bieżącymi rozmiarami i sumami, bez montowań zasłaniających ich ścieżki. Oba zadeklarowane interfejsy HTTP publikują bieżący rekord źródłowy.

  Testy obserwują bieżące claim, montowania, pliki i odpowiedzi. Nie dowodzą historii kopiowania ani kopii poza hostem.
stages.0.brief: Oba czytniki są gotowe i publikują bieżące zwykłe pliki z zadeklarowanych PVC.
stages.0.objectives.0.text: Claim docelowy jest związany; pierwotne workload i claim źródłowy, dostarczone obrazy
  i montowanie źródła pozostają zachowane.
stages.0.objectives.1.text: Oba czytniki są gotowe i publikują bieżące zwykłe pliki z zadeklarowanych PVC.
hints.0.text: Związany wolumen zapewnia pojemność, a nie wymagane dane. Zachowaj istniejące źródło i oddziel provisioning
  od przywracania aplikacji.
hints.1.text: Porównaj `storage-contract.json`, `kubectl get pvc -o yaml` i `kubectl describe pod` z definicjami
  obu czytników oraz rzeczywistymi plikami źródłowymi. Zdrowy claim źródłowy pokazuje działające ustawienia przez
  API namespace.
hints.2.text: |-
  Po przywróceniu wiązania i przesłaniu danych sprawdź bieżący stan z kontraktem. Zachowaj źródło i tożsamości. Oczekiwane obserwacje:

  - `kubectl get pvc` — claim źródłowy i docelowy mają stan Bound.
  - `kubectl exec deployment/relay -c worker -- stat -c '%F:%s' /spool/index.html /spool/payload.bin` — zadeklarowane zwykłe typy plików i rozmiary są zgodne.
  - `kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin` — obie sumy odpowiadają kontraktowi.
  - `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080` — odpowiedź odpowiada bieżącej publikacji źródłowej.
debrief: Provisioning przywrócił pojemność; osobny transfer przywrócił bieżący rekord i payload na claim docelowym.
  Źródłowy wolumen i tożsamości workload pozostały zachowane.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
