title: Diagnostyka PVC
brief: |-
  Obciążenie tras oczekuje na dostępny magazyn danych. Przywróć dostępność, zachowując Deployment.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `spool.yaml`, `deployment.yaml`.

  **Wymagania:**

  - Claim magazynu żądany przez dostarczone obciążenie ma stan `Bound`.
  - Deployment `relay` kończy rollout.

  Powiązanie i gotowość nie dowodzą zachowania danych ani historii odzyskiwania.
stages.0.brief: Ogranicz odzyskiwanie do dostarczonego claimu obciążenia.
stages.0.objectives.0.text: Claim magazynu żądany przez dostarczone obciążenie ma stan Bound.
stages.0.objectives.1.text: Deployment `relay` kończy rollout.
hints.0.text: Twierdzenie to jest świeże i puste; jego class name nie można naprawić na miejscu.
hints.1.text: |-
  Sprawdź opis PVC i jego storage class. Dostarczone żądanie wskazuje nieznaną storage class.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl describe pvc
  kubectl get storageclass
  ```
hints.2.text: |-
  Zatrzymaj to wdrożenie, odtwórz tylko jego puste żądanie za pomocą standard i zweryfikuj Bound przed readiness.

  Sprawdź wynik z `~/quest` na workstation:

  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl get pvc spool` — Żądanie ma status `Bound`.
  - `kubectl rollout status deployment/relay --timeout=3s` — Rollout obciążenia jest zakończony.
debrief: Świeże, puste roszczenie wymagało nieznanego storage class. Odtworzyłeś tylko to jednorazowe
  roszczenie za pomocą standard i zweryfikowałeś Bound i gotowy reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
