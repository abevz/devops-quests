title: Diagnostyka PVC
brief: |
  Obciążenie tras oczekuje na dostępny magazyn danych. Przywróć dostępność, zachowując Deployment.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `spool.json`, `deployment.json`.

  **Wymagania:**
  - Żądanie magazynu danych jest związane:
    - PVC `spool`: `Bound`
  - Deployment `relay` kończy rollout.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl get pvc spool` — Żądanie ma status `Bound`.
  - `kubectl rollout status deployment/relay --timeout=3s` — Rollout obciążenia jest zakończony.
stages.0.brief: |
  Magazyn spool ma być związany, a rollout obciążenia zakończony.
stages.0.objectives.0.text: PVC `spool` ma stan Bound.
stages.0.objectives.1.text: Deployment `relay` kończy rollout.
hints.0.text: |
  Sprawdź opis PVC i jego storage class. Dostarczone żądanie wskazuje nieznaną storage class.
hints.1.text: Twierdzenie to jest świeże i puste; jego class name nie można naprawić na miejscu.
hints.2.text: Zatrzymaj to wdrożenie, odtwórz tylko jego puste żądanie za pomocą standard i zweryfikuj
  Bound przed readiness.
debrief: Świeże, puste roszczenie wymagało nieznanego storage class. Odtworzyłeś tylko to jednorazowe
  roszczenie za pomocą standard i zweryfikowałeś Bound i gotowy reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
