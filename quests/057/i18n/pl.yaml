title: Diagnostyka PVC
brief: |-
  Żądane miejsce nie udostępnia jeszcze użytecznego zestawu danych trasy. Przywróć aplikację docelową z zachowanego źródła bez odtwarzania pierwotnych workload.

  Pracuj na stacji roboczej w `~/quest` z `storage-contract.json`; sprawdź udostępnione zasoby w namespace.

  **Wymagania:**
  - Dostarczony claim docelowy jest początkowo pusty i niezwiązany. Zachowaj pierwotne tożsamości źródłowego PVC i obu Deployment, niezmienne obrazy oraz wszystkie zadeklarowane pliki źródłowe.
  - Claim docelowy ma stan `Bound`. Oba czytniki mają jedną gotową replikę; czytnik źródłowy zachowuje montowanie tylko do odczytu, a oba używają zadeklarowanego PVC pod zadeklarowaną ścieżką.
  - Zadeklarowane zwykłe pliki znajdują się na tych claim z bieżącymi rozmiarami i sumami, bez montowań zasłaniających ich ścieżki. Oba zadeklarowane interfejsy HTTP publikują bieżący rekord źródłowy.

  Testy obserwują bieżące claim, montowania, pliki i odpowiedzi. Nie dowodzą historii kopiowania ani kopii poza hostem.
stages.0.brief: Oba czytniki są gotowe i publikują bieżące zwykłe pliki z zadeklarowanych PVC.
stages.0.objectives.0.text: Claim docelowy jest związany; pierwotne workload i claim źródłowy, dostarczone obrazy
  i montowanie źródła pozostają zachowane.
stages.0.objectives.1.text: Oba czytniki są gotowe i publikują bieżące zwykłe pliki z zadeklarowanych PVC.
hints.0.text: Związany wolumen zapewnia pojemność, a nie wymagane dane. Zachowaj istniejące źródło i oddziel provisioning
  od przywracania aplikacji.
hints.1.text: Porównaj `storage-contract.json`, `kubectl get pvc -o yaml` i `kubectl describe pod` z definicjami
  obu czytników oraz rzeczywistymi plikami źródłowymi. Zdrowy claim źródłowy pokazuje działające ustawienia przez
  API namespace.
hints.2.text: |-
  Po przywróceniu wiązania i przesłaniu danych sprawdź bieżący stan z kontraktem. Zachowaj źródło i tożsamości. Oczekiwane obserwacje:

  - `kubectl get pvc` — claim źródłowy i docelowy mają stan Bound.
  - `kubectl exec deployment/relay -c worker -- stat -c '%F:%s' /spool/index.html /spool/payload.bin` — zadeklarowane zwykłe typy plików i rozmiary są zgodne.
  - `kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin` — obie sumy odpowiadają kontraktowi.
  - `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080` — odpowiedź odpowiada bieżącej publikacji źródłowej.
debrief: Provisioning przywrócił pojemność; osobny transfer przywrócił bieżący rekord i payload na claim docelowym.
  Źródłowy wolumen i tożsamości workload pozostały zachowane.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.storage_identity: Pierwotny Deployment lub źródłowy PVC zmienił UID albo jest nieczytelny; usunięcie i odtworzenie zachowuje nazwę, lecz traci tożsamość. Niezwiązany docelowy PVC nie należy do zachowanego zestawu UID. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-preserved-identities)
diagnostics.storage_source: Zachowany źródłowy PVC nie jest Bound lub obserwacja Pod/ReplicaSet zawiodła; utrata powiązania wolumenu lub niedostępne obiekty Kubernetes blokują potwierdzenie odtworzenia pierwotnych danych. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-source-availability)
diagnostics.storage_image: Sprawdzany obraz worker nie odpowiada dostarczonej referencji lub digest; zastąpienie obrazu dla uzyskania odpowiedzi omija wymagane odtworzenie zamontowanych danych. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-retained-worker-image)
diagnostics.probe_0_0: Docelowy PVC spool nie jest Bound lub obserwator polityki zakończył się bez markera; nieznana klasa pamięci może pozostawić go Pending, a brak chronionych danych, błędny JSON lub błąd startu także blokuje obserwację. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=storage-target-binding-gate)
diagnostics.probe_0_1: Rollout relay nie zakończył się w 3 sekundy lub obserwator danych zatrzymał się bez markera; przyczyną mogą być niezwiązany cel, niedostępne montowania lub brakujące i błędne dane chronione/API. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-rollout-observation-gate)
diagnostics.storage_mount_reserve: reserve nie udostępnia zadeklarowanego PVC w ścieżce danych lub źródło jest zapisywalne; błędny claim, brak montowania lub nakładka pliku może ukryć zachowane dane. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_reserve: reserve nie ukończył rollout z wymaganą liczbą replik i gotowymi własnymi Podami lub obserwacja zawiodła; oczekujący wolumen, błąd montowania lub zmieniona liczba replik blokują kontrolę danych. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_reserve: Plików źródła reserve brakuje, mają zły typ, rozmiar lub SHA-256 albo exec zawiódł; zmienione bajty źródła, przesłonięta ścieżka lub nieczytelny pierwotny wolumen blokują zachowanie oryginalnych danych. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_reserve: reserve nie serwuje dokładnej pierwotnej treści HTTP lub żądanie zawiodło; inny katalog, zmieniony index.html lub niedostępny proces źródła blokuje publikację zachowanego rekordu źródłowego. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
diagnostics.storage_mount_relay: relay nie udostępnia zadeklarowanego docelowego PVC w ścieżce danych; błędny claim, brak montowania lub nakładka pliku może ukryć dane celu. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_relay: relay nie ukończył rollout z wymaganą liczbą replik i gotowymi własnymi Podami lub obserwacja zawiodła; oczekujący wolumen, błąd montowania lub zmieniona liczba replik blokują kontrolę danych. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_relay: Plików danych relay brakuje, mają zły typ, rozmiar lub SHA-256 albo exec zawiódł; pusty wolumen celu, niepełna kopia, uszkodzone źródło lub podstawienie plików może psuć odtworzenie. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_relay: relay nie serwuje dokładnej zachowanej treści HTTP lub żądanie zawiodło; inny katalog, stary index.html lub niedostępny proces może ukrywać skopiowane dane. [Przyczyna i kontrola](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
