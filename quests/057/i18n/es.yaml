title: Diagnóstico PVC
brief: 'Te uniste a las operaciones de SignalRail. Un carrete route esperaba un storage class desconocido.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `spool.json`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Spool es Bound y relay está listo.'
stages.0.brief: 'Un spool nuevo y vacío usaba una clase desconocida. Repararlo sin quitar el despliegue.


  Criterios de éxito: Spool es Bound y relay está listo.'
stages.0.objectives.0.text: Spool es Bound y relay está listo.
hints.0.text: Describe el PVC y lee su storage class.
hints.1.text: Esta afirmación es nueva y vacía; su nombre class no se puede reparar en el lugar.
hints.2.text: Detenga esta implementación, vuelva a crear solo su reclamo vacío con standard y verifique
  Bound antes de readiness.
debrief: El nuevo reclamo vacío solicitaba un storage class desconocido. Usted recreó solo ese reclamo
  desechable con standard y verificó Bound y un reader listo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
