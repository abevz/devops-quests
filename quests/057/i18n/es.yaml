title: Diagnóstico PVC
brief: |-
  El almacenamiento solicitado todavía no entrega un conjunto de datos de ruta utilizable. Recupera la aplicación destino desde la fuente conservada sin recrear los workloads originales.

  Trabaja en la estación en `~/quest` con `storage-contract.json`; inspecciona los recursos proporcionados en el namespace.

  **Requisitos:**
  - El claim destino proporcionado empieza vacío y sin enlazar. Conserva las identidades del PVC fuente y ambos Deployment originales, las imágenes inmutables y todos los archivos fuente declarados.
  - El claim destino está `Bound`. Ambos lectores tienen una réplica lista; el lector fuente conserva su montaje de solo lectura y ambos usan el PVC declarado en la ruta declarada.
  - Los archivos regulares declarados residen en esos claims con los tamaños y sumas actuales, sin montajes que cubran sus rutas. Ambas interfaces HTTP declaradas publican el registro fuente actual.

  Se observan claims, montajes, archivos y respuestas actuales. No se demuestra el historial de copia ni una copia fuera del host.
stages.0.brief: Ambos lectores están listos y publican los archivos regulares actuales desde sus PVC declarados.
stages.0.objectives.0.text: El claim destino está enlazado; se conservan workloads y claim fuente originales, imágenes
  proporcionadas y montaje fuente.
stages.0.objectives.1.text: Ambos lectores están listos y publican los archivos regulares actuales desde sus PVC
  declarados.
hints.0.text: Un volumen enlazado proporciona capacidad, no los datos necesarios. Conserva la fuente existente y
  separa la provisión de la recuperación de la aplicación.
hints.1.text: Compara `storage-contract.json`, `kubectl get pvc -o yaml` y `kubectl describe pod` con las definiciones
  de ambos lectores y los archivos fuente reales. El claim fuente sano muestra su configuración funcional mediante
  la API del namespace.
hints.2.text: |-
  Tras recuperar el enlace y transferir los datos, verifica el estado actual frente al contrato. Conserva fuente e identidades. Observaciones esperadas:

  - `kubectl get pvc` — claims fuente y destino en Bound.
  - `kubectl exec deployment/relay -c worker -- stat -c '%F:%s' /spool/index.html /spool/payload.bin` — tipos regulares y tamaños declarados coinciden.
  - `kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin` — ambas sumas coinciden con el contrato.
  - `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080` — la respuesta coincide con la publicación fuente actual.
debrief: La provisión recuperó capacidad; otra transferencia recuperó el registro y payload actuales en el claim
  destino. Se conservaron el volumen fuente y las identidades de los workloads.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
