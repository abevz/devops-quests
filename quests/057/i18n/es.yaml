title: Diagnóstico PVC
brief: |
  La carga de rutas espera almacenamiento utilizable. Recupera su disponibilidad conservando el Deployment.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `spool.yaml`, `deployment.yaml`.

  **Requisitos:**
  - La solicitud de almacenamiento está vinculada:
    - PVC `spool`: `Bound`
  - El Deployment `relay` completa su rollout.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `kubectl get pvc spool` — La solicitud está `Bound`.
  - `kubectl rollout status deployment/relay --timeout=3s` — El rollout de la carga está completo.
stages.0.brief: |
  El almacenamiento spool debe estar vinculado y el rollout de la carga completado.
stages.0.objectives.0.text: El PVC `spool` está Bound.
stages.0.objectives.1.text: El Deployment `relay` completa su rollout.
hints.0.text: |
  Describe el PVC y lee su storage class. La solicitud suministrada indica una storage class desconocida.
hints.1.text: Esta afirmación es nueva y vacía; su nombre class no se puede reparar en el lugar.
hints.2.text: Detenga esta implementación, vuelva a crear solo su reclamo vacío con standard y verifique
  Bound antes de readiness.
debrief: El nuevo reclamo vacío solicitaba un storage class desconocido. Usted recreó solo ese reclamo
  desechable con standard y verificó Bound y un reader listo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
