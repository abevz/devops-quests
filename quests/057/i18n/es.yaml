  el lector fuente sigue en solo lectura.'
diagnostics.storage_ready_relay: 'relay: El lector original debe completar el rollout con una réplica lista.'
diagnostics.storage_data_relay: 'relay: Los archivos regulares reales deben coincidir con tamaños y SHA-256 proporcionados.'
diagnostics.storage_publication_relay: 'relay: La respuesta HTTP real debe coincidir con la publicación fuente actual.'
