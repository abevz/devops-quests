title: Diagnóstico PVC
brief: |-
  La carga de rutas espera almacenamiento utilizable. Recupera su disponibilidad conservando el Deployment.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `spool.yaml`, `deployment.yaml`.

  **Requisitos:**

  - El claim de almacenamiento solicitado por la carga suministrada está `Bound`.
  - El Deployment `relay` completa su rollout.

  La vinculación y disponibilidad no demuestran conservación de datos ni historial de recuperación.
stages.0.brief: Limita la recuperación al claim suministrado de la carga.
stages.0.objectives.0.text: El claim de almacenamiento solicitado por la carga suministrada está Bound.
stages.0.objectives.1.text: El Deployment `relay` completa su rollout.
hints.0.text: Esta afirmación es nueva y vacía; su nombre class no se puede reparar en el lugar.
hints.1.text: |-
  Describe el PVC y lee su storage class. La solicitud suministrada indica una storage class desconocida.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl describe pvc
  kubectl get storageclass
  ```
hints.2.text: |-
  Detenga esta implementación, vuelva a crear solo su reclamo vacío con standard y verifique Bound antes de readiness.

  Verifica el resultado desde `~/quest` en la workstation:

  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `kubectl get pvc spool` — La solicitud está `Bound`.
  - `kubectl rollout status deployment/relay --timeout=3s` — El rollout de la carga está completo.
debrief: El nuevo reclamo vacío solicitaba un storage class desconocido. Usted recreó solo ese reclamo
  desechable con standard y verificó Bound y un reader listo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
