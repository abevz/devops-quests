title: Diagnóstico PVC
brief: |-
  El almacenamiento solicitado todavía no entrega un conjunto de datos de ruta utilizable. Recupera la aplicación destino desde la fuente conservada sin recrear los workloads originales.

  Trabaja en la estación en `~/quest` con `storage-contract.json`; inspecciona los recursos proporcionados en el namespace.

  **Requisitos:**
  - El claim destino proporcionado empieza vacío y sin enlazar. Conserva las identidades del PVC fuente y ambos Deployment originales, las imágenes inmutables y todos los archivos fuente declarados.
  - El claim destino está `Bound`. Ambos lectores tienen una réplica lista; el lector fuente conserva su montaje de solo lectura y ambos usan el PVC declarado en la ruta declarada.
  - Los archivos regulares declarados residen en esos claims con los tamaños y sumas actuales, sin montajes que cubran sus rutas. Ambas interfaces HTTP declaradas publican el registro fuente actual.

  Se observan claims, montajes, archivos y respuestas actuales. No se demuestra el historial de copia ni una copia fuera del host.
stages.0.brief: Ambos lectores están listos y publican los archivos regulares actuales desde sus PVC declarados.
stages.0.objectives.0.text: El claim destino está enlazado; se conservan workloads y claim fuente originales, imágenes
  proporcionadas y montaje fuente.
stages.0.objectives.1.text: Ambos lectores están listos y publican los archivos regulares actuales desde sus PVC
  declarados.
hints.0.text: Un volumen enlazado proporciona capacidad, no los datos necesarios. Conserva la fuente existente y
  separa la provisión de la recuperación de la aplicación.
hints.1.text: |-
  Compara `storage-contract.json`, `kubectl get pvc -o yaml` y `kubectl describe pod` con las definiciones de ambos lectores y los archivos fuente reales. El claim fuente sano muestra su configuración funcional mediante la API del namespace.

  Antes de hacer cambios, anota los UID de ambos Deployment y de la PVC de origen, así como las referencias de imagen suministradas para worker. Usa `kubectl get deployments reserve relay -o yaml` y `kubectl get pvc reserve -o yaml`.
hints.2.text: |-
  Comprueba que ambas PVC estén en estado `Bound` y que cada Deployment tenga una réplica lista. Contrasta los montajes de las plantillas y los Pods activos con `storage-contract.json`. `reserve` debe montar `/archive` en solo lectura y `relay` debe montar `/spool`. Compara con el contrato los tipos de los dos archivos regulares, sus tamaños en bytes, sus sumas SHA-256 y la respuesta HTTP de cada aplicación. Compara los UID de ambos Deployment y de la PVC de origen, así como las imágenes de worker en las plantillas de Deployment y en los Pods listos, con tus observaciones iniciales.

  ```sh
  kubectl get pvc reserve spool -o yaml
  kubectl get deployments,pods,replicasets -o yaml
  for entry in reserve:/archive relay:/spool; do
    workload=${entry%%:*}; root=${entry#*:}
    kubectl rollout status "deployment/$workload" --timeout=10s
    kubectl exec "deployment/$workload" -c worker -- stat -c '%F:%s' "$root/index.html" "$root/payload.bin"
    kubectl exec "deployment/$workload" -c worker -- sha256sum "$root/index.html" "$root/payload.bin"
    kubectl exec "deployment/$workload" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/
  done
  ```
debrief: La provisión recuperó capacidad; otra transferencia recuperó el registro y payload actuales en el claim
  destino. Se conservaron el volumen fuente y las identidades de los workloads.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.storage_identity: Un Deployment original o PVC de origen cambió UID o no pudo leerse; recrearlo puede conservar nombre y perder identidad. El PVC destino sin enlazar no pertenece al conjunto de UID conservados. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-preserved-identities)
diagnostics.storage_source: El PVC de origen conservado no está Bound o falló observar Pod/ReplicaSet; perder el enlace del volumen o no acceder a objetos Kubernetes impide acreditar recuperación desde los datos originales. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-source-availability)
diagnostics.storage_image: La imagen worker comprobada no coincide con la referencia o digest suministrado; sustituir la imagen para fabricar una respuesta elude la recuperación de los datos montados. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-retained-worker-image)
diagnostics.probe_0_0: El PVC destino spool no está Bound o la prueba de política terminó sin marcador; la clase de almacenamiento desconocida puede dejarlo Pending, y datos protegidos ausentes, JSON inválido o fallos de inicio también impiden observar. [Causa y comprobación](guides#guide=kubernetes-20&section=storage-target-binding-gate)
diagnostics.probe_0_1: El rollout relay no terminó en 3 segundos o la observación de datos acabó sin marcador; destino sin enlazar, montajes no disponibles o datos protegidos/API ausentes o malformados pueden explicarlo. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-rollout-observation-gate)
diagnostics.storage_mount_reserve: reserve no expone su PVC declarado en la ruta de datos o el origen permite escritura; claim incorrecto, montaje ausente o archivo superpuesto puede ocultar los datos conservados. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_reserve: reserve no completó rollout con las réplicas contratadas y Pods propios listos o falló observarlo; volumen pendiente, montaje fallido o número de réplicas cambiado puede impedir comprobar datos recuperados. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_reserve: Faltan archivos de origen reserve, tienen tipo, tamaño o SHA-256 incorrectos, o falló exec; bytes de origen cambiados, ruta superpuesta o volumen original ilegible impiden conservar los datos originales. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_reserve: reserve no sirve el cuerpo HTTP original exacto o falló la petición; otro directorio, index.html alterado o proceso de origen no disponible impide publicar el registro de origen conservado. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
diagnostics.storage_mount_relay: relay no expone el PVC destino declarado en su ruta de datos; claim incorrecto, montaje ausente o archivo superpuesto puede ocultar los datos destino. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_relay: relay no completó rollout con las réplicas contratadas y Pods propios listos o falló observarlo; volumen pendiente, montaje fallido o número de réplicas cambiado puede impedir comprobar datos recuperados. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_relay: Faltan archivos de datos relay, tienen tipo, tamaño o SHA-256 incorrectos, o falló exec; volumen vacío, copia incompleta, origen dañado o sustitución de archivos puede romper la recuperación. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_relay: relay no sirve el cuerpo HTTP conservado exacto o falló la petición; otro directorio, index.html obsoleto o proceso no disponible puede ocultar datos ya copiados. [Causa y comprobación](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
