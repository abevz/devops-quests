title: PVC diagnosis
brief: 'You joined SignalRail operations. A route spool waited for an unknown storage class. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `spool.json`, `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Spool is Bound and relay is ready.'
stages.0.brief: 'A fresh empty spool used an unknown class. Repair it without removing the deployment.


  Success criteria: Spool is Bound and relay is ready.'
stages.0.objectives.0.text: Spool is Bound and relay is ready.
hints.0.text: Describe the PVC and read its storage class.
hints.1.text: This claim is fresh and empty; its class name cannot be repaired in place.
hints.2.text: Stop this deployment, recreate only its empty claim with standard and verify Bound before
  readiness.
debrief: The fresh empty claim requested an unknown storage class. You recreated only that disposable
  claim with standard and verified Bound and a ready reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
