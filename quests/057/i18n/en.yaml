title: PVC diagnosis
brief: |-
  The requested storage is not yet delivering a usable route dataset. Restore the target application from the retained source without replacing the original workloads.

  Work on the workstation in `~/quest` with `storage-contract.json`; inspect the supplied native resources in the namespace.

  **Requirements:**
  - The supplied target claim starts empty and unbound. Keep the original source PVC and both Deployment identities, supplied immutable images and every declared source file unchanged.
  - The target claim is `Bound`. Both workloads have one ready replica; the source workload keeps its read-only mount and both workloads use their declared PVC at the declared path.
  - The declared regular files reside on those claims with the current sizes and checksums, without mounts covering their file paths. Both declared HTTP interfaces publish the current source record.

  Checks observe current claims, mounts, files and responses. They do not prove copying history or an off-host backup.
stages.0.brief: Both workloads are ready and publish the current regular dataset from their declared PVCs.
stages.0.objectives.0.text: The target claim is Bound; original workloads/source claim, supplied images and source
  mount are retained.
stages.0.objectives.1.text: Both workloads are ready and publish the current regular dataset from their declared
  PVCs.
hints.0.text: A bound volume supplies capacity, not the required data. Keep the existing source intact while separating
  provisioning from application recovery.
hints.1.text: Compare `storage-contract.json`, `kubectl get pvc -o yaml` and `kubectl describe pod` with both workload
  definitions and actual source files. The healthy source claim exposes its working storage settings through the
  namespaced API.
hints.2.text: |-
  After recovering binding and transferring the dataset, verify current state against the contract. Keep source data and identities. Expected observations:

  - `kubectl get pvc` — source and target claims are Bound.
  - `kubectl exec deployment/relay -c worker -- stat -c '%F:%s' /spool/index.html /spool/payload.bin` — the declared regular-file types and sizes match.
  - `kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin` — both checksums match the contract.
  - `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080` — the response matches the current source publication.
debrief: Provisioning restored capacity; a separate data transfer restored the actual source record and payload
  on the target claim. The original source volume and workload identities remained.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.storage_identity: An original Deployment or the source PVC changed UID or could not be read; deleting and recreating it can preserve a name while losing the retained identity. The unbound target PVC is outside that retained identity set. [Cause and check](guides#guide=kubernetes-11&section=storage-preserved-identities)
diagnostics.storage_source: The retained source PVC is not Bound, or Pod/ReplicaSet observation failed; losing the source volume binding or unavailable Kubernetes objects can prevent proving recovery from the original dataset. [Cause and check](guides#guide=kubernetes-11&section=storage-source-availability)
diagnostics.storage_image: A checked worker image no longer matches the supplied reference or digest; replacing the application image to manufacture a response bypasses the required recovery of the mounted data. [Cause and check](guides#guide=kubernetes-11&section=storage-retained-worker-image)
diagnostics.probe_0_0: The target PVC spool is not Bound, or the policy observer stopped without a named marker; its supplied unknown storage class can leave it Pending, while missing frozen facts, malformed JSON or probe startup failures also prevent observation. [Cause and check](guides#guide=kubernetes-20&section=storage-target-binding-gate)
diagnostics.probe_0_1: The relay rollout did not complete within 3 seconds, or the data observer stopped without a named marker; the unbound target, unavailable mounts or missing/malformed protected and API data may explain it. [Cause and check](guides#guide=kubernetes-11&section=storage-rollout-observation-gate)
diagnostics.storage_mount_reserve: reserve does not expose its declared PVC at the dataset path, or the source is writable; a wrong claim, missing mount or file overlay can hide the preserved dataset instead of recovering it. [Cause and check](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_reserve: reserve is not rolled out with the contracted replica counts and ready owned Pods, or observation failed; a pending volume, failed mount or changed replica count can prevent checking the recovered data. [Cause and check](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_reserve: reserve source files are missing, have the wrong type, size or SHA-256, or exec failed; changed source bytes, an overlaid dataset path or an unreadable original volume can prevent preserving the original dataset. [Cause and check](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_reserve: reserve does not serve the exact original HTTP body or the request failed; serving the wrong directory, altered index.html or an unavailable source process can prevent publication of the retained source record. [Cause and check](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
diagnostics.storage_mount_relay: relay does not expose the declared target PVC at its dataset path; a wrong claim, missing mount or overlaid file can hide the target dataset instead of recovering it. [Cause and check](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_relay: relay is not rolled out with the contracted replica counts and ready owned Pods, or observation failed; a pending volume, failed mount or changed replica count can prevent checking the recovered data. [Cause and check](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_relay: relay dataset files are missing, have the wrong type, size or SHA-256, or exec failed; an empty target volume, incomplete copy, damaged source or file substitution can break recovery. [Cause and check](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_relay: relay does not serve the exact preserved HTTP body or the request failed; serving the wrong directory, stale index.html or an unavailable process can hide an otherwise copied dataset. [Cause and check](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
