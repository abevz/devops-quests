title: PVC diagnosis
brief: |-
  The route workload is waiting for usable storage. Restore its availability while keeping the Deployment.

  Work on the workstation in `~/quest` with the supplied files:
  - `spool.yaml`, `deployment.yaml`.

  **Requirements:**

  - The storage claim requested by the supplied workload is `Bound`.
  - Deployment `relay` completes its rollout.

  Binding and readiness do not prove data retention or recovery history.
stages.0.brief: Keep recovery scoped to the workload’s supplied claim.
stages.0.objectives.0.text: The storage claim requested by the supplied workload is Bound.
stages.0.objectives.1.text: Deployment `relay` completes its rollout.
hints.0.text: This claim is fresh and empty; its class name cannot be repaired in place.
hints.1.text: |-
  Describe the PVC and read its storage class. The supplied claim names an unknown storage class.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl describe pvc
  kubectl get storageclass
  ```
hints.2.text: |-
  Stop this deployment, recreate only its empty claim with standard and verify Bound before readiness.

  Verify the result from `~/quest` on the workstation:

  Run these observation commands from `~/quest` on the workstation.
  - `kubectl get pvc spool` — The claim is `Bound`.
  - `kubectl rollout status deployment/relay --timeout=3s` — The workload rollout is complete.
debrief: The fresh empty claim requested an unknown storage class. You recreated only that disposable
  claim with standard and verified Bound and a ready reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
