title: Диагностика PVC
brief: 'Вы в команде эксплуатации SignalRail. Том ожидал несуществующий storage class. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `spool.json`, `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Spool в Bound и relay готов.'
stages.0.brief: 'Пустой spool использует неизвестный класс. Исправьте его, сохранив Deployment.


  Результат проверки: Spool в Bound и relay готов.'
stages.0.objectives.0.text: Spool в Bound и relay готов.
hints.0.text: Выполните describe PVC и прочитайте storage class.
hints.1.text: Этот PVC новый и пустой; его class name нельзя исправить на месте.
hints.2.text: Остановите этот Deployment, пересоздайте только его пустой PVC с standard и проверьте Bound
  до readiness.
debrief: Новый пустой PVC запросил неизвестный storage class. Вы пересоздали только этот временный PVC
  с standard и проверили Bound и готовность reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
