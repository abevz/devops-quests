title: Диагностика PVC
brief: |-
  Запрошенное хранилище ещё не предоставляет пригодный набор данных маршрута. Восстановите целевое приложение из сохранённого источника без пересоздания исходных workload.

  Работайте на рабочей станции в `~/quest` с `storage-contract.json`; изучите предоставленные ресурсы в namespace.

  **Требования:**
  - Предоставленный целевой claim изначально пуст и не привязан. Сохраните идентичности исходного PVC-источника и обоих Deployment, неизменяемые образы и все объявленные исходные файлы.
  - Целевой claim имеет состояние `Bound`. У обоих читателей одна готовая реплика; читатель источника сохраняет read-only-монтирование, оба используют объявленный PVC по объявленному пути.
  - Объявленные обычные файлы находятся на этих claim с текущими размерами и контрольными суммами; другие монтирования не перекрывают их пути. Оба объявленных HTTP-интерфейса публикуют текущую запись источника.

  Проверяются текущие claim, монтирования, файлы и ответы. История копирования и off-host backup не доказываются.
stages.0.brief: Оба читателя готовы и публикуют текущие обычные файлы с объявленных PVC.
stages.0.objectives.0.text: Целевой claim привязан; исходные workload и PVC-источник, предоставленные образы и монтирование
  источника сохранены.
stages.0.objectives.1.text: Оба читателя готовы и публикуют текущие обычные файлы с объявленных PVC.
hints.0.text: Привязанный том предоставляет ёмкость, а не нужные данные. Сохраните источник, разделяя provisioning
  и восстановление приложения.
hints.1.text: Сопоставьте `storage-contract.json`, `kubectl get pvc -o yaml` и `kubectl describe pod` с определениями
  обоих читателей и фактическими исходными файлами. Рабочие настройки здорового claim-источника доступны через namespaced
  API.
hints.2.text: |-
  После восстановления привязки и переноса данных проверьте текущее состояние по контракту. Сохраните источник и идентичности. Ожидаемые наблюдения:

  - `kubectl get pvc` — исходный и целевой claim имеют состояние Bound.
  - `kubectl exec deployment/relay -c worker -- stat -c '%F:%s' /spool/index.html /spool/payload.bin` — типы обычных файлов и размеры совпадают с объявленными.
  - `kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin` — обе контрольные суммы совпадают с контрактом.
  - `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080` — ответ совпадает с текущей публикацией источника.
debrief: Provisioning вернул ёмкость, а отдельный перенос данных восстановил текущую запись источника и payload
  на целевом claim. Исходный том и идентичности workload сохранились.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.storage_identity: 'Исходный Deployment или PVC источника сменил UID либо недоступен: удаление и пересоздание сохраняет имя, но теряет исходную идентичность. Несвязанный целевой PVC не входит в набор сохраняемых UID. [Причина и проверка](guides#guide=kubernetes-11&section=storage-preserved-identities)'
diagnostics.storage_source: 'Сохранённый PVC источника не Bound либо не удалось прочитать Pod и ReplicaSet: потеря привязки исходного тома или недоступность объектов Kubernetes мешают доказать восстановление исходных данных. [Причина и проверка](guides#guide=kubernetes-11&section=storage-source-availability)'
diagnostics.storage_image: 'Проверяемый образ worker не совпадает с выданной ссылкой или digest: замена образа ради нужного ответа обходит требуемое восстановление смонтированных данных. [Причина и проверка](guides#guide=kubernetes-11&section=storage-retained-worker-image)'
diagnostics.probe_0_0: 'Целевой PVC spool не Bound либо проверка политики остановилась без именованного маркера: выданный неизвестный StorageClass оставляет его Pending; отсутствующие сохранённые данные, некорректный JSON или сбой запуска также мешают наблюдению. [Причина и проверка](guides#guide=kubernetes-20&section=storage-target-binding-gate)'
diagnostics.probe_0_1: 'Rollout relay не завершился за 3 секунды либо проверка данных остановилась без именованного маркера: причиной могут быть несвязанный целевой том, недоступные mount или отсутствующие и некорректные защищённые данные и ответы API. [Причина и проверка](guides#guide=kubernetes-11&section=storage-rollout-observation-gate)'
diagnostics.storage_mount_reserve: 'reserve не использует объявленный PVC по пути данных либо источник доступен для записи: неверный claim, отсутствующий mount или перекрывающий файл могут скрывать исходные данные вместо восстановления. [Причина и проверка](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)'
diagnostics.storage_ready_reserve: 'reserve не завершил rollout с нужным числом реплик и готовыми принадлежащими ему Pod либо наблюдение не удалось: ожидающий том, сбой mount или другое число реплик мешают проверке восстановленных данных. [Причина и проверка](guides#guide=kubernetes-11&section=storage-original-workload-readiness)'
diagnostics.storage_data_reserve: 'Исходные файлы reserve отсутствуют, имеют другой тип, размер или SHA-256 либо exec завершился ошибкой: изменённые байты источника, перекрытый путь данных или недоступный исходный том мешают сохранению исходных данных. [Причина и проверка](guides#guide=kubernetes-11&section=storage-regular-file-recovery)'
diagnostics.storage_publication_reserve: 'reserve не отдаёт точное исходное тело HTTP либо запрос завершился ошибкой: другой обслуживаемый каталог, изменённый index.html или недоступный процесс источника мешают публикации сохранённой исходной записи. [Причина и проверка](guides#guide=kubernetes-11&section=storage-mounted-http-publication)'
diagnostics.storage_mount_relay: 'relay не использует объявленный целевой PVC по пути данных: неверный claim, отсутствующий mount или перекрывающий файл могут скрывать целевые данные вместо восстановления. [Причина и проверка](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)'
diagnostics.storage_ready_relay: 'relay не завершил rollout с нужным числом реплик и готовыми принадлежащими ему Pod либо наблюдение не удалось: ожидающий том, сбой mount или другое число реплик мешают проверке восстановленных данных. [Причина и проверка](guides#guide=kubernetes-11&section=storage-original-workload-readiness)'
diagnostics.storage_data_relay: 'Файлы данных relay отсутствуют, имеют другой тип, размер или SHA-256 либо exec завершился ошибкой: причиной могут быть пустой целевой том, неполное копирование, повреждённый источник или подмена файлов. [Причина и проверка](guides#guide=kubernetes-11&section=storage-regular-file-recovery)'
diagnostics.storage_publication_relay: 'relay не отдаёт точное сохранённое тело HTTP либо запрос завершился ошибкой: другой обслуживаемый каталог, устаревший index.html или недоступный процесс могут скрывать уже скопированные данные. [Причина и проверка](guides#guide=kubernetes-11&section=storage-mounted-http-publication)'
