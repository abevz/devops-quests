title: Диагностика PVC
brief: |
  Нагрузка маршрута ожидает доступного хранилища. Восстановите её доступность с сохранением Deployment.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `spool.yaml`, `deployment.yaml`.

  **Требования:**
  - Claim хранилища привязан:
    - PVC `spool`: `Bound`
  - Deployment `relay` завершает rollout.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl get pvc spool` — Claim имеет статус `Bound`.
  - `kubectl rollout status deployment/relay --timeout=3s` — Rollout нагрузки завершён.
stages.0.brief: |
  Хранилище spool должно быть привязано, а rollout нагрузки — завершён.
stages.0.objectives.0.text: PVC `spool` находится в состоянии Bound.
stages.0.objectives.1.text: Deployment `relay` завершает rollout.
hints.0.text: |
  Просмотрите описание PVC и его storage class. Предоставленный claim указывает неизвестный storage class.
hints.1.text: Этот PVC новый и пустой; его class name нельзя исправить на месте.
hints.2.text: Остановите этот Deployment, пересоздайте только его пустой PVC с standard и проверьте Bound
  до readiness.
debrief: Новый пустой PVC запросил неизвестный storage class. Вы пересоздали только этот временный PVC
  с standard и проверили Bound и готовность reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
