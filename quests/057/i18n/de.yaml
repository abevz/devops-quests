title: PVC Diagnose
brief: |-
  Der angeforderte Speicher liefert noch keinen nutzbaren Routendatensatz. Stelle die Zielanwendung aus der erhaltenen Quelle wieder her, ohne ursprüngliche Workloads neu anzulegen.

  Arbeite auf der Workstation in `~/quest` mit `storage-contract.json`; untersuche die bereitgestellten Ressourcen im Namespace.

  **Anforderungen:**
  - Der bereitgestellte Ziel-Claim ist anfangs leer und ungebunden. Erhalte die ursprüngliche Quell-PVC- und beide Deployment-Identitäten, unveränderliche Images und alle deklarierten Quelldateien.
  - Der Ziel-Claim ist `Bound`. Beide Leser haben eine bereite Replik; der Quellleser behält seinen schreibgeschützten Mount und beide verwenden ihre deklarierte PVC am deklarierten Pfad.
  - Die deklarierten regulären Dateien liegen mit aktuellen Größen und Prüfsummen auf diesen Claims; andere Mounts überdecken ihre Dateipfade nicht. Beide deklarierten HTTP-Schnittstellen veröffentlichen den aktuellen Quelldatensatz.

  Geprüft werden aktuelle Claims, Mounts, Dateien und Antworten. Kopierhistorie oder eine externe Sicherung werden nicht nachgewiesen.
stages.0.brief: Beide Leser sind bereit und veröffentlichen den aktuellen regulären Datensatz aus ihren deklarierten
  PVCs.
stages.0.objectives.0.text: Der Ziel-Claim ist gebunden; ursprüngliche Workloads/Quell-Claim, bereitgestellte Images
  und Quell-Mount bleiben erhalten.
stages.0.objectives.1.text: Beide Leser sind bereit und veröffentlichen den aktuellen regulären Datensatz aus ihren
  deklarierten PVCs.
hints.0.text: Ein gebundenes Volume stellt Kapazität bereit, nicht die erforderlichen Daten. Erhalte die vorhandene
  Quelle und trenne Provisionierung von Anwendungswiederherstellung.
hints.1.text: Vergleiche `storage-contract.json`, `kubectl get pvc -o yaml` und `kubectl describe pod` mit beiden
  Leserdefinitionen und tatsächlichen Quelldateien. Der gesunde Quell-Claim zeigt seine funktionierenden Speichereinstellungen
  über die Namespace-API.
hints.2.text: |-
  Prüfe nach Bindung und Datenübertragung den aktuellen Zustand gegen den Vertrag. Erhalte Quelldaten und Identitäten. Erwartete Beobachtungen:

  - `kubectl get pvc` — Quell- und Ziel-Claim sind Bound.
  - `kubectl exec deployment/relay -c worker -- stat -c '%F:%s' /spool/index.html /spool/payload.bin` — deklarierte reguläre Dateitypen und Größen stimmen.
  - `kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin` — beide Prüfsummen entsprechen dem Vertrag.
  - `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080` — Antwort entspricht der aktuellen Quellveröffentlichung.
debrief: Die Provisionierung stellte Kapazität her; eine separate Datenübertragung stellte den aktuellen Quelldatensatz
  und Payload auf dem Ziel-Claim wieder her. Quell-Volume und Workload-Identitäten blieben erhalten.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
