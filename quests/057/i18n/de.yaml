title: PVC Diagnose
brief: |-
  Der Routen-Workload wartet auf nutzbaren Speicher. Stellen Sie seine Verfügbarkeit wieder her und behalten Sie das Deployment bei.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `spool.yaml`, `deployment.yaml`.

  **Anforderungen:**

  - Der vom bereitgestellten Workload angeforderte Storage-Claim ist `Bound`.
  - Deployment `relay` schließt seinen Rollout ab.

  Bindung und Bereitschaft beweisen weder Datenerhalt noch Wiederherstellungshistorie.
stages.0.brief: Beschränken Sie die Wiederherstellung auf den bereitgestellten Claim des Workloads.
stages.0.objectives.0.text: Der vom bereitgestellten Workload angeforderte Storage-Claim ist Bound.
stages.0.objectives.1.text: Deployment `relay` schließt seinen Rollout ab.
hints.0.text: Diese Behauptung ist frisch und leer; Sein class-Name kann nicht vor Ort repariert werden.
hints.1.text: |-
  Beschreiben Sie den PVC und lesen Sie seine Storage Class. Der bereitgestellte Claim nennt eine unbekannte Storage Class.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl describe pvc
  kubectl get storageclass
  ```
hints.2.text: |-
  Stoppen Sie diese Bereitstellung, erstellen Sie nur den leeren Anspruch mit standard neu und überprüfen Sie Bound vor readiness.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl get pvc spool` — Der Claim ist `Bound`.
  - `kubectl rollout status deployment/relay --timeout=3s` — Der Workload-Rollout ist abgeschlossen.
debrief: Für den neuen leeren Anspruch wurde ein unbekannter storage class angefordert. Sie haben nur
  diesen Einweganspruch mit standard neu erstellt und Bound sowie ein fertiges reader überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
