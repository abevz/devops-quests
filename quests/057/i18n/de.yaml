title: PVC Diagnose
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Eine route-Spule wartete auf einen unbekannten storage
  class. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingaben in `~/quest`: `spool.json`, `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Spool ist Bound und relay ist bereit.'
stages.0.brief: 'Ein frischer leerer spool verwendete eine unbekannte Klasse. Reparieren Sie es, ohne
  die Bereitstellung zu entfernen.


  Erfolgskriterium: Spool ist Bound und relay ist bereit.'
stages.0.objectives.0.text: Spool ist Bound und relay ist bereit.
hints.0.text: Beschreiben Sie den PVC und lesen Sie seinen storage class.
hints.1.text: Diese Behauptung ist frisch und leer; Sein class-Name kann nicht vor Ort repariert werden.
hints.2.text: Stoppen Sie diese Bereitstellung, erstellen Sie nur den leeren Anspruch mit standard neu
  und überprüfen Sie Bound vor readiness.
debrief: Für den neuen leeren Anspruch wurde ein unbekannter storage class angefordert. Sie haben nur
  diesen Einweganspruch mit standard neu erstellt und Bound sowie ein fertiges reader überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
