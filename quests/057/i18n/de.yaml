title: PVC Diagnose
brief: |-
  Der angeforderte Speicher liefert noch keinen nutzbaren Routendatensatz. Stelle die Zielanwendung aus der erhaltenen Quelle wieder her, ohne ursprüngliche Workloads neu anzulegen.

  Arbeite auf der Workstation in `~/quest` mit `storage-contract.json`; untersuche die bereitgestellten Ressourcen im Namespace.

  **Anforderungen:**
  - Der bereitgestellte Ziel-Claim ist anfangs leer und ungebunden. Erhalte die ursprüngliche Quell-PVC- und beide Deployment-Identitäten, unveränderliche Images und alle deklarierten Quelldateien.
  - Der Ziel-Claim ist `Bound`. Beide Leser haben eine bereite Replik; der Quellleser behält seinen schreibgeschützten Mount und beide verwenden ihre deklarierte PVC am deklarierten Pfad.
  - Die deklarierten regulären Dateien liegen mit aktuellen Größen und Prüfsummen auf diesen Claims; andere Mounts überdecken ihre Dateipfade nicht. Beide deklarierten HTTP-Schnittstellen veröffentlichen den aktuellen Quelldatensatz.

  Geprüft werden aktuelle Claims, Mounts, Dateien und Antworten. Kopierhistorie oder eine externe Sicherung werden nicht nachgewiesen.
stages.0.brief: Beide Leser sind bereit und veröffentlichen den aktuellen regulären Datensatz aus ihren deklarierten
  PVCs.
stages.0.objectives.0.text: Der Ziel-Claim ist gebunden; ursprüngliche Workloads/Quell-Claim, bereitgestellte Images
  und Quell-Mount bleiben erhalten.
stages.0.objectives.1.text: Beide Leser sind bereit und veröffentlichen den aktuellen regulären Datensatz aus ihren
  deklarierten PVCs.
hints.0.text: Ein gebundenes Volume stellt Kapazität bereit, nicht die erforderlichen Daten. Erhalte die vorhandene
  Quelle und trenne Provisionierung von Anwendungswiederherstellung.
hints.1.text: Vergleiche `storage-contract.json`, `kubectl get pvc -o yaml` und `kubectl describe pod` mit beiden
  Leserdefinitionen und tatsächlichen Quelldateien. Der gesunde Quell-Claim zeigt seine funktionierenden Speichereinstellungen
  über die Namespace-API.
hints.2.text: |-
  Prüfe nach Bindung und Datenübertragung den aktuellen Zustand gegen den Vertrag. Erhalte Quelldaten und Identitäten. Erwartete Beobachtungen:

  - `kubectl get pvc` — Quell- und Ziel-Claim sind Bound.
  - `kubectl exec deployment/relay -c worker -- stat -c '%F:%s' /spool/index.html /spool/payload.bin` — deklarierte reguläre Dateitypen und Größen stimmen.
  - `kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin` — beide Prüfsummen entsprechen dem Vertrag.
  - `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080` — Antwort entspricht der aktuellen Quellveröffentlichung.
debrief: Die Provisionierung stellte Kapazität her; eine separate Datenübertragung stellte den aktuellen Quelldatensatz
  und Payload auf dem Ziel-Claim wieder her. Quell-Volume und Workload-Identitäten blieben erhalten.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.storage_identity: Ein ursprüngliches Deployment oder die Quell-PVC hat ihre UID geändert oder konnte nicht gelesen werden; Neuerstellung kann den Namen erhalten und die Identität verlieren. Die ungebundene Ziel-PVC gehört nicht zu diesen erhaltenen UIDs. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-preserved-identities)
diagnostics.storage_source: Die erhaltene Quell-PVC ist nicht Bound oder die Pod-/ReplicaSet-Beobachtung schlug fehl; eine verlorene Volumenbindung oder unerreichbare Kubernetes-Objekte verhindern den Nachweis der Wiederherstellung aus dem ursprünglichen Datenbestand. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-source-availability)
diagnostics.storage_image: Das geprüfte worker Image entspricht nicht mehr der gelieferten Referenz oder dem Digest; ein Austausch des Anwendungsimages für eine passende Antwort umgeht die erforderliche Wiederherstellung der eingebundenen Daten. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-retained-worker-image)
diagnostics.probe_0_0: Die Ziel-PVC spool ist nicht Bound oder die Richtlinienbeobachtung endete ohne benannten Marker; die gelieferte unbekannte Speicherklasse kann sie Pending lassen, während fehlende geschützte Belege, fehlerhaftes JSON oder Startfehler ebenfalls die Beobachtung verhindern. [Ursache und Prüfung](guides#guide=kubernetes-20&section=storage-target-binding-gate)
diagnostics.probe_0_1: Der Rollout von relay wurde nicht innerhalb von 3 Sekunden abgeschlossen oder die Datenbeobachtung endete ohne benannten Marker; ungebundenes Ziel, nicht verfügbare Mounts oder fehlende beziehungsweise fehlerhafte geschützte/API-Daten können die Ursache sein. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-rollout-observation-gate)
diagnostics.storage_mount_reserve: reserve stellt die deklarierte PVC nicht am Datenpfad bereit oder die Quelle ist beschreibbar; falscher Claim, fehlender Mount oder Dateiüberlagerung kann den erhaltenen Datenbestand verdecken. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_reserve: reserve ist nicht mit den vereinbarten Replikazahlen und bereiten eigenen Pods ausgerollt oder die Beobachtung schlug fehl; ein wartendes Volumen, Mount-Fehler oder geänderte Replikazahl verhindert die Datenprüfung. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_reserve: Quelldateien von reserve fehlen, haben falschen Typ, Größe oder SHA-256 oder exec schlug fehl; geänderte Quellbytes, ein überlagerter Datenpfad oder ein unlesbares ursprüngliches Volumen verhindern den Erhalt der Originaldaten. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_reserve: reserve liefert nicht den exakten ursprünglichen HTTP-Inhalt oder die Anfrage schlug fehl; falsches Auslieferungsverzeichnis, geänderte index.html oder ein unerreichbarer Quellprozess verhindert die Veröffentlichung des erhaltenen Quelldatensatzes. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
diagnostics.storage_mount_relay: relay stellt die deklarierte Ziel-PVC nicht am Datenpfad bereit; falscher Claim, fehlender Mount oder Dateiüberlagerung kann den Zieldatenbestand verdecken. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-dataset-pvc-mounts)
diagnostics.storage_ready_relay: relay ist nicht mit den vereinbarten Replikazahlen und bereiten eigenen Pods ausgerollt oder die Beobachtung schlug fehl; ein wartendes Volumen, Mount-Fehler oder geänderte Replikazahl verhindert die Datenprüfung. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-original-workload-readiness)
diagnostics.storage_data_relay: Datendateien von relay fehlen, haben falschen Typ, Größe oder SHA-256 oder exec schlug fehl; ein leeres Zielvolumen, unvollständige Kopie, beschädigte Quelle oder Dateiersetzung kann die Wiederherstellung verletzen. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-regular-file-recovery)
diagnostics.storage_publication_relay: relay liefert nicht den exakt erhaltenen HTTP-Inhalt oder die Anfrage schlug fehl; falsches Auslieferungsverzeichnis, veraltete index.html oder ein unerreichbarer Prozess kann bereits kopierte Daten verdecken. [Ursache und Prüfung](guides#guide=kubernetes-11&section=storage-mounted-http-publication)
