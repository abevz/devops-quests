title: Resource requests
brief: |
  Departures information is unavailable.

  Work on the workstation in `~/quest` with `board.yaml`.

  **Requirements:**
  - Deployment `board` resource contract:
    - `replicas`: `1`.
    - CPU: `requests.cpu=100m`, `limits.cpu=300m`.
    - Memory: `requests.memory=16Mi`, `limits.memory=64Mi`.
  - Workload availability:
    - Deployment: `board`.
    - Status: Rollout completes.
  - HTTP response inside container `worker` of Pod `app=board`:
    - URL: `http://127.0.0.1:8080`.
    - Content: `north`.

  **Verify yourself before Check & finish:**
  - `kubectl get deployment board -o json` — shows `replicas=1`, CPU request/limit `100m`/`300m`, and memory request/limit `16Mi`/`64Mi`.
  - `kubectl rollout status deployment/board --timeout=3s` — exits `0` and reports a completed rollout.
  - `kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080` — prints `north` from the HTTP service inside the Pod.
debrief: Scheduling uses requested resources, not instantaneous node utilization.
stages.0.brief: |
  The display must serve its route within the stated resource budget.
stages.0.objectives.0.text: Deployment `board` keeps exactly one replica.
stages.0.objectives.1.text: The board container requests `100m` CPU and has a CPU limit of `300m`.
stages.0.objectives.2.text: The board container keeps its memory request of `16Mi` and memory limit of
  `64Mi`.
stages.0.objectives.3.text: Deployment `board` completes its rollout.
stages.0.objectives.4.text: HTTP from Pod `app=board` to `http://127.0.0.1:8080` returns `north`.
hints.0.text: |
  Pending is different from a process crash. The supplied board.yaml requests 4 CPUs on a node capped at 2; inspect scheduling events.
hints.1.text: Requests affect scheduling; limits bound runtime use.
hints.2.text: Verify placement and the actual HTTP response.
phrases.0: I distinguished CPU requests from CPU limits.
phrases.1: I restored a schedulable request within the intended budget.
phrases.2: I verified the live resource settings and application response.
questions.0.points.0: Requests reserve allocatable capacity.
questions.0.points.1: Allocatable differs from physical capacity.
questions.0.points.2: Events identify capacity, taint and affinity constraints.
questions.0.prompt: Why might an idle-looking node reject a Pod?
questions.1.points.0: Check throttling and downstream bottlenecks.
questions.1.points.1: Ensure additional replicas can be scheduled.
questions.1.points.2: Base requests on measurements and stated headroom.
questions.1.prompt: What should be checked before adding replicas to a slow service?
