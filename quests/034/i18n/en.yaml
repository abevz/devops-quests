title: Resource requests
brief: 'board.json requests four CPUs on a node capped at two. The board needs CPU request 100m and limit
  300m; preserve its memory values and one replica. Diagnose the scheduling events, then repair the resource
  contract.


  Quest files in `~/quest` (some appear in later stages): `board.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Board serves north with CPU request 100m and limit 300m.'
debrief: Scheduling uses requested resources, not instantaneous node utilization.
stages.0.brief: 'Board serves north with CPU request 100m and limit 300m.


  Success criteria: Board serves north with CPU request 100m and limit 300m.'
stages.0.objectives.0.text: Board serves north with CPU request 100m and limit 300m.
hints.0.text: Pending is different from a process crash.
hints.1.text: Requests affect scheduling; limits bound runtime use.
hints.2.text: Verify placement and the actual HTTP response.
phrases.0: I distinguished CPU requests from CPU limits.
phrases.1: I restored a schedulable request within the intended budget.
phrases.2: I verified the live resource settings and application response.
questions.0.points.0: Requests reserve allocatable capacity.
questions.0.points.1: Allocatable differs from physical capacity.
questions.0.points.2: Events identify capacity, taint and affinity constraints.
questions.0.prompt: Why might an idle-looking node reject a Pod?
questions.1.points.0: Check throttling and downstream bottlenecks.
questions.1.points.1: Ensure additional replicas can be scheduled.
questions.1.points.2: Base requests on measurements and stated headroom.
questions.1.prompt: What should be checked before adding replicas to a slow service?
