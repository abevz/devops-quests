diagnostics.cpu_image: Keep the supplied worker and initializer images.
diagnostics.cpu_phase: Effective CPU requests across every startup/application phase must fit the declared ceiling.
diagnostics.cpu_initializer: Keep the provided normal initializer and its successful completion before the worker.
diagnostics.cpu_source: Keep every supplied source ConfigMap data entry.
diagnostics.probe_0_3: The Deployment completes rollout and the provided initializer finishes successfully before
  the current worker.
