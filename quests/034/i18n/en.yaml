title: Resource requests
brief: |-
  The route workload is not completing startup. Restore its availability within the supplied resource envelope.

  Work on the workstation in `~/quest` with `cpu-contract.json`; inspect the supplied native resources in the namespace.

  **Requirements:**
  - Deployment `board` keeps one replica, original workload/source ConfigMap identities and supplied worker/initializer images. The worker memory request remains `16Mi` and memory limit `64Mi`.
  - Keep every supplied source data entry. The worker CPU budget and effective scheduling requests across application and startup phases match the contract.
  - The provided normal initializer finishes successfully before the current worker; the Deployment completes rollout.
  - From Pod `app=board`, HTTP at `http://127.0.0.1:8080` returns `north`.

  Checks observe current requests, initializer completion, resource identity and HTTP. They do not establish performance or capacity under load.
debrief: Both application and initialization requests contributed to scheduling. The original route preparation
  now completes within the envelope and the worker serves its output.
stages.0.brief: The Deployment completes rollout and the provided initializer finishes successfully before the current
  worker.
stages.0.objectives.0.text: Deployment `board` keeps exactly one replica.
stages.0.objectives.1.text: Original resources, source data and images are retained; worker CPU settings and effective
  startup requests match the supplied budget.
stages.0.objectives.2.text: The board container keeps its memory request of `16Mi` and memory limit of `64Mi`.
stages.0.objectives.3.text: The Deployment completes rollout and the provided initializer finishes successfully
  before the current worker.
stages.0.objectives.4.text: HTTP from Pod `app=board` to `http://127.0.0.1:8080` returns `north`.
hints.0.text: The scheduler accounts for startup phases as well as application containers. Low observed CPU usage
  does not make a reservation schedulable.
hints.1.text: Compare `cpu-contract.json`, `kubectl get deployment board -o yaml` and `kubectl describe pod -l app=board`.
  Inspect every contributing request and Pod scheduling events; the namespace observations contain the required
  evidence.
hints.2.text: |-
  Verify rollout, completed initialization and the actual interface:

  - `kubectl rollout status deployment/board` — rollout completes.
  - `kubectl get pods -l app=board -o jsonpath='{.items[*].status.initContainerStatuses}'` — the normal initializer terminated with exit code 0.
  - `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080` — the response is north.
phrases.0: I distinguished CPU requests from CPU limits.
phrases.1: I restored a schedulable request within the intended budget.
phrases.2: I verified the live resource settings and application response.
questions.0.points.0: Requests reserve allocatable capacity.
questions.0.points.1: Allocatable differs from physical capacity.
questions.0.points.2: Events identify capacity, taint and affinity constraints.
questions.0.prompt: Why might an idle-looking node reject a Pod?
questions.1.points.0: Check throttling and downstream bottlenecks.
questions.1.points.1: Ensure additional replicas can be scheduled.
questions.1.points.2: Base requests on measurements and stated headroom.
questions.1.prompt: What should be checked before adding replicas to a slow service?
