title: Żądania zasobów
brief: |-
  Workload trasy nie kończy uruchamiania. Przywróć dostępność w udostępnionym budżecie zasobów.

  Pracuj na stacji roboczej w `~/quest` z `cpu-contract.json`; sprawdź udostępnione zasoby w namespace.

  **Wymagania:**
  - Deployment `board` zachowuje jedną replikę, pierwotne tożsamości workload i źródłowego ConfigMap oraz dostarczone obrazy worker i inicjalizatora. Żądanie pamięci worker pozostaje `16Mi`, a limit `64Mi`.
  - Zachowaj wszystkie dostarczone wpisy danych źródłowych. Budżet CPU worker oraz efektywne żądania planowania faz aplikacji i startu spełniają kontrakt.
  - Dostarczony zwykły inicjalizator kończy się poprawnie przed bieżącym worker; Deployment kończy rollout.
  - Z Poda `app=board` HTTP pod `http://127.0.0.1:8080` zwraca `north`.

  Testy obserwują bieżące żądania, ukończenie init, tożsamość zasobów i HTTP. Nie potwierdzają wydajności ani pojemności pod obciążeniem.
debrief: Żądania aplikacji i inicjalizacji wpływały na planowanie. Pierwotne przygotowanie trasy kończy się teraz
  w budżecie, a worker udostępnia jego wynik.
stages.0.brief: Deployment kończy rollout, a dostarczony inicjalizator kończy się poprawnie przed bieżącym worker.
stages.0.objectives.0.text: Deployment `board` zachowuje dokładnie jedną replikę.
stages.0.objectives.1.text: Pierwotne zasoby, dane źródłowe i obrazy pozostają zachowane; ustawienia CPU worker
  i efektywne żądania startu spełniają udostępniony budżet.
stages.0.objectives.2.text: Kontener board zachowuje żądanie pamięci `16Mi` i limit pamięci `64Mi`.
stages.0.objectives.3.text: Deployment kończy rollout, a dostarczony inicjalizator kończy się poprawnie przed bieżącym
  worker.
stages.0.objectives.4.text: HTTP z Pod `app=board` do `http://127.0.0.1:8080` zwraca `north`.
hints.0.text: Scheduler uwzględnia fazy startu obok kontenerów aplikacji. Niskie obserwowane użycie CPU nie oznacza,
  że rezerwację da się zaplanować.
hints.1.text: Porównaj `cpu-contract.json`, `kubectl get deployment board -o yaml` i `kubectl describe pod -l app=board`.
  Sprawdź wszystkie składowe żądania i zdarzenia planowania Poda; potrzebne obserwacje są dostępne w namespace.
hints.2.text: |-
  Sprawdź rollout, ukończoną inicjalizację i rzeczywisty interfejs:

  - `kubectl rollout status deployment/board` — rollout ukończony.
  - `kubectl get pods -l app=board -o jsonpath='{.items[*].status.initContainerStatuses}'` — zwykły inicjalizator zakończył się kodem 0.
  - `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080` — odpowiedź to north.
phrases.0: Odróżniłem CPU requests od CPU limits.
phrases.1: Przywróciłem planowany request w ramach zamierzonego budżetu.
phrases.2: Sprawdziłem ustawienia zasobów na żywo i reakcję aplikacji.
questions.0.points.0: Requests pojemność rezerwowa allocatable.
questions.0.points.1: Allocatable różni się od pojemności fizycznej.
questions.0.points.2: Zdarzenia identyfikują pojemność, zniekształcenia i ograniczenia affinity.
questions.0.prompt: Dlaczego węzeł wyglądający na bezczynny może odrzucić Pod?
questions.1.points.0: Sprawdź throttling i wąskie gardła poniżej.
questions.1.points.1: Upewnij się, że można zaplanować dodatkowe repliki.
questions.1.points.2: Opieraj żądania na pomiarach i podanej wysokości nadproża.
questions.1.prompt: Co należy sprawdzić przed dodaniem replik do powolnego serwisu?
diagnostics.board_replicas: Skalowanie lub odtworzenie Deployment mogło zmienić liczbę replik; błąd API lub odczytu JSON też blokuje kontrolę. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-retained-objects)
diagnostics.cpu_identity: Usunięcie i odtworzenie Deployment lub źródłowego ConfigMap zmienia UID; niedostępny odczyt API może dać tę samą diagnostykę. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-retained-objects)
diagnostics.probe_0_1: CPU request lub limit worker może nadal podawać całe CPU albo pomijać wymaganą wartość; błędy Pythona, danych faktów lub API też przerywają sondę. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-worker-cpu)
diagnostics.cpu_phase: Inicjalizator lub dodatkowy kontener może nadal rezerwować zbyt dużo CPU w fazie startu; błędne wielkości lub niedostępny odczyt workload też zawodzi. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-startup-budget)
diagnostics.cpu_image: Zmieniony obraz lub restartowalny inicjalizator może naruszać dostarczony kontrakt startu, nawet gdy worker wygląda na gotowy. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.cpu_initializer: Zwykły inicjalizator może nie istnieć, być restartowalny lub niezakończony, albo bieżące Pody nie są gotowe; błędy API też blokują potwierdzenie. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.cpu_source: Wpis źródłowego ConfigMap mógł zostać zmieniony lub usunięty zamiast naprawy planowania; błąd odczytu API może zwrócić ten sam marker. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-source-data)
diagnostics.probe_0_2: Szeroka zmiana zasobów mogła zmienić lub pominąć pamięć worker; nieczytelny Deployment lub błąd Pythona/modułu też blokuje kontrolę. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-retained-memory)
diagnostics.probe_0_3: Nieschedulowalne żądania lub niezakończona inicjalizacja mogą blokować rollout; Python, dane faktów lub błędne obserwacje też mogą przerwać późniejszą sondę startu. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.board_http: Inicjalizator mógł nie skopiować źródła do wspólnego wolumenu albo worker go nie serwuje; błędy wyszukania Poda, exec lub HTTP też zawiodą. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=board-route-http)
