title: Żądania zasobów
brief: |-
  Tablica odjazdów jest niedostępna.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `board.yaml`.

  **Wymagania:**

  - Deployment `board` zachowuje dokładnie `1` replikę i kończy rollout.
  - Jego kontener `worker` ma stały budżet zasobów:
    - Żądanie CPU `100m`, limit CPU `300m`.
    - Żądanie pamięci `16Mi`, limit pamięci `64Mi`.
  - W Podzie `app=board` HTTP pod `http://127.0.0.1:8080` zwraca `north`.

  Te sprawdzenia nie dowodzą wydajności ani pojemności pod obciążeniem.
debrief: Planowanie wykorzystuje żądane zasoby, a nie chwilowe wykorzystanie węzła.
stages.0.brief: Zachowaj stały budżet zasobów i wymagany wynik HTTP.
stages.0.objectives.0.text: Deployment `board` zachowuje dokładnie jedną replikę.
stages.0.objectives.1.text: Kontener board żąda `100m` CPU i ma limit CPU `300m`.
stages.0.objectives.2.text: Kontener board zachowuje żądanie pamięci `16Mi` i limit pamięci `64Mi`.
stages.0.objectives.3.text: Deployment `board` kończy rollout.
stages.0.objectives.4.text: HTTP z Pod `app=board` do `http://127.0.0.1:8080` zwraca `north`.
hints.0.text: Requests wpływa na planowanie; limits powiązane użycie środowiska wykonawczego.
hints.1.text: |-
  Pending różni się od awarii procesu. Dostarczony board.yaml żąda 4 CPU na węźle ograniczonym do 2; sprawdź zdarzenia planowania.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get nodes
  kubectl describe pod -l app=board
  ```
hints.2.text: 'Sprawdź położenie i rzeczywistą odpowiedź HTTP.


  Sprawdź wynik z `~/quest` na workstation:


  - `kubectl get deployment board -o json` — pokazuje `replicas=1`, żądanie/limit CPU `100m`/`300m` oraz żądanie/limit pamięci `16Mi`/`64Mi`.

  - `kubectl rollout status deployment/board --timeout=3s` — kończy się kodem `0` i zgłasza zakończony rollout.

  - `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080` — wypisuje `north` z usługi HTTP wewnątrz Poda.'
phrases.0: Odróżniłem CPU requests od CPU limits.
phrases.1: Przywróciłem planowany request w ramach zamierzonego budżetu.
phrases.2: Sprawdziłem ustawienia zasobów na żywo i reakcję aplikacji.
questions.0.points.0: Requests pojemność rezerwowa allocatable.
questions.0.points.1: Allocatable różni się od pojemności fizycznej.
questions.0.points.2: Zdarzenia identyfikują pojemność, zniekształcenia i ograniczenia affinity.
questions.0.prompt: Dlaczego węzeł wyglądający na bezczynny może odrzucić Pod?
questions.1.points.0: Sprawdź throttling i wąskie gardła poniżej.
questions.1.points.1: Upewnij się, że można zaplanować dodatkowe repliki.
questions.1.points.2: Opieraj żądania na pomiarach i podanej wysokości nadproża.
questions.1.prompt: Co należy sprawdzić przed dodaniem replik do powolnego serwisu?
