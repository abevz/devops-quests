title: Запросы ресурсов
brief: |-
  Workload маршрута не завершает запуск. Восстановите доступность в рамках предоставленного бюджета ресурсов.

  Работайте на рабочей станции в `~/quest` с `cpu-contract.json`; изучите предоставленные ресурсы в namespace.

  **Требования:**
  - Deployment `board` сохраняет одну реплику, идентичности workload и исходного ConfigMap, а также образы worker и init-контейнера. Запрос памяти worker остаётся `16Mi`, лимит — `64Mi`.
  - Сохраните все предоставленные записи исходных данных. CPU-бюджет worker и эффективные запросы планирования фаз приложения и запуска соответствуют контракту.
  - Предоставленный обычный init-контейнер успешно завершается до текущего worker; Deployment завершает rollout.
  - Из Pod `app=board` HTTP по адресу `http://127.0.0.1:8080` возвращает `north`.

  Проверяются текущие запросы, завершение инициализации, идентичности ресурсов и HTTP. Производительность и ёмкость под нагрузкой не устанавливаются.
debrief: На планирование влияли запросы приложения и инициализации. Исходная подготовка маршрута теперь завершается
  в рамках бюджета, и worker обслуживает её результат.
stages.0.brief: Deployment завершает rollout, а предоставленный init-контейнер успешно завершается до текущего worker.
stages.0.objectives.0.text: Deployment `board` сохраняет ровно одну реплику.
stages.0.objectives.1.text: Исходные ресурсы, данные и образы сохранены; CPU-настройки worker и эффективные запросы
  запуска соответствуют предоставленному бюджету.
stages.0.objectives.2.text: Контейнер board сохраняет запрос памяти `16Mi` и лимит памяти `64Mi`.
stages.0.objectives.3.text: Deployment завершает rollout, а предоставленный init-контейнер успешно завершается до
  текущего worker.
stages.0.objectives.4.text: HTTP-запрос из Pod `app=board` к `http://127.0.0.1:8080` возвращает `north`.
hints.0.text: Планировщик учитывает фазы запуска наряду с контейнерами приложения. Низкое фактическое потребление
  CPU не означает, что запрошенный резерв можно разместить.
hints.1.text: Сопоставьте `cpu-contract.json`, `kubectl get deployment board -o yaml` и `kubectl describe pod -l
  app=board`. Изучите все участвующие запросы и события планирования Pod; нужные свидетельства доступны в namespace.
hints.2.text: |-
  Проверьте rollout, завершение инициализации и фактический интерфейс:

  - `kubectl rollout status deployment/board` — rollout завершён.
  - `kubectl get pods -l app=board -o jsonpath='{.items[*].status.initContainerStatuses}'` — обычный init-контейнер завершился с exit code 0.
  - `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080` — ответ — north.
phrases.0: Я различил CPU requests и CPU limits.
phrases.1: Я восстановил допустимый для планирования request в заданном бюджете.
phrases.2: Я проверил фактические настройки ресурсов и ответ приложения.
questions.0.points.0: Requests резервируют allocatable.
questions.0.points.1: Allocatable отличается от физической ёмкости.
questions.0.points.2: События показывают ограничения ёмкости, taints и affinity.
questions.0.prompt: Почему внешне свободный узел может не принять Pod?
questions.1.points.0: Проверьте throttling и узкие места зависимостей.
questions.1.points.1: Убедитесь, что дополнительные реплики можно разместить.
questions.1.points.2: Опирайтесь на замеры и обоснованный запас.
questions.1.prompt: Что проверить перед добавлением реплик медленного сервиса?
diagnostics.board_replicas: Масштабирование или пересоздание Deployment могло изменить число реплик; ошибка API или чтения JSON также мешает проверке. [Причина и проверка](guides#guide=kubernetes-9&section=board-retained-objects)
diagnostics.cpu_identity: Удаление и пересоздание Deployment или исходного ConfigMap меняет UID; недоступное наблюдение API может дать ту же диагностику. [Причина и проверка](guides#guide=kubernetes-9&section=board-retained-objects)
diagnostics.probe_0_1: CPU request или limit worker может всё ещё задавать целые CPU либо не содержать нужного значения; ошибки Python, фактов или API также могут прервать проверку. [Причина и проверка](guides#guide=kubernetes-9&section=board-worker-cpu)
diagnostics.cpu_phase: Инициализатор или дополнительный контейнер может резервировать слишком много CPU в фазе запуска; неверные величины или недоступные наблюдения workload также дают отказ. [Причина и проверка](guides#guide=kubernetes-9&section=board-startup-budget)
diagnostics.cpu_image: Заменённый образ или перезапускаемый инициализатор может нарушить исходный контракт запуска, даже если worker выглядит готовым. [Причина и проверка](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.cpu_initializer: Обычный инициализатор может отсутствовать, быть перезапускаемым или не завершиться, либо текущие Pod не готовы; ошибки API также мешают подтверждению. [Причина и проверка](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.cpu_source: Запись исходного ConfigMap могла быть изменена или удалена вместо исправления планирования; ошибка чтения API может дать тот же маркер. [Причина и проверка](guides#guide=kubernetes-9&section=board-source-data)
diagnostics.probe_0_2: Общее изменение ресурсов могло изменить или удалить параметры памяти worker; нечитаемый Deployment или ошибка Python/модуля также мешает проверке. [Причина и проверка](guides#guide=kubernetes-9&section=board-retained-memory)
diagnostics.probe_0_3: Невыполнимые запросы ресурсов или незавершённая инициализация могут блокировать rollout; Python, факты или неверные данные наблюдений также могут прервать последующую проверку запуска. [Причина и проверка](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.board_http: Инициализатор мог не скопировать источник в общий том, либо worker его не обслуживает; ошибки поиска Pod, exec или HTTP также дают отказ. [Причина и проверка](guides#guide=kubernetes-9&section=board-route-http)
