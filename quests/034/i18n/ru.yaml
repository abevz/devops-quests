title: Запросы ресурсов
brief: |
  Табло отправлений недоступно.

  Работайте на workstation в `~/quest` с файлами `board.json`.

  **Требования:**
  - Контракт ресурсов Deployment `board`:
    - `replicas`: `1`.
    - CPU: `requests.cpu=100m`, `limits.cpu=300m`.
    - Память: `requests.memory=16Mi`, `limits.memory=64Mi`.
  - Доступность нагрузки:
    - Deployment: `board`.
    - Состояние: Rollout завершён.
  - HTTP-ответ внутри контейнера `worker` Pod `app=board`:
    - URL: `http://127.0.0.1:8080`.
    - Содержимое: `north`.

  **Самопроверка перед Check & finish:**
  - `kubectl get deployment board -o json` — показывает `replicas=1`, запрос/лимит CPU `100m`/`300m` и запрос/лимит памяти `16Mi`/`64Mi`.
  - `kubectl rollout status deployment/board --timeout=3s` — завершается с кодом `0` и сообщает о завершённом rollout.
  - `kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080` — выводит `north` от HTTP-сервиса внутри Pod.
debrief: Планирование использует запрошенные ресурсы, а не мгновенную загрузку узла.
stages.0.brief: |
  Табло должно отдавать маршрут в рамках заданного бюджета ресурсов.
stages.0.objectives.0.text: Deployment `board` сохраняет ровно одну реплику.
stages.0.objectives.1.text: Контейнер board запрашивает `100m` CPU и имеет лимит CPU `300m`.
stages.0.objectives.2.text: Контейнер board сохраняет запрос памяти `16Mi` и лимит памяти `64Mi`.
stages.0.objectives.3.text: Deployment `board` завершает rollout.
stages.0.objectives.4.text: HTTP-запрос из Pod `app=board` к `http://127.0.0.1:8080` возвращает `north`.
hints.0.text: |
  Pending отличается от падения процесса. Выданный board.json запрашивает 4 CPU на узле с пределом 2; изучите события планирования.
hints.1.text: Requests влияют на размещение, limits — на потребление.
hints.2.text: Проверьте размещение и фактический HTTP-ответ.
phrases.0: Я различил CPU requests и CPU limits.
phrases.1: Я восстановил допустимый для планирования request в заданном бюджете.
phrases.2: Я проверил фактические настройки ресурсов и ответ приложения.
questions.0.points.0: Requests резервируют allocatable.
questions.0.points.1: Allocatable отличается от физической ёмкости.
questions.0.points.2: События показывают ограничения ёмкости, taints и affinity.
questions.0.prompt: Почему внешне свободный узел может не принять Pod?
questions.1.points.0: Проверьте throttling и узкие места зависимостей.
questions.1.points.1: Убедитесь, что дополнительные реплики можно разместить.
questions.1.points.2: Опирайтесь на замеры и обоснованный запас.
questions.1.prompt: Что проверить перед добавлением реплик медленного сервиса?
