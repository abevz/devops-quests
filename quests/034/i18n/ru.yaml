diagnostics.cpu_initializer: Сохраните обычный init-контейнер и его успешное завершение до worker.
diagnostics.cpu_source: Сохраните все предоставленные записи исходного ConfigMap.
diagnostics.probe_0_3: Deployment завершает rollout, а предоставленный init-контейнер успешно завершается до текущего
