title: Solicitudes de recursos
brief: |-
  El workload de ruta no completa el arranque. Recupera su disponibilidad dentro del presupuesto de recursos proporcionado.

  Trabaja en la estación en `~/quest` con `cpu-contract.json`; inspecciona los recursos proporcionados en el namespace.

  **Requisitos:**
  - Deployment `board` conserva una réplica, las identidades originales del workload y ConfigMap fuente y las imágenes proporcionadas del worker e inicializador. La solicitud de memoria del worker sigue en `16Mi` y el límite en `64Mi`.
  - Conserva todas las entradas de datos proporcionadas. El presupuesto CPU del worker y las solicitudes efectivas de planificación de las fases de aplicación y arranque cumplen el contrato.
  - El inicializador normal proporcionado termina correctamente antes del worker actual; el Deployment completa el rollout.
  - Desde el Pod `app=board`, HTTP en `http://127.0.0.1:8080` devuelve `north`.

  Se observan solicitudes actuales, finalización de init, identidad de recursos y HTTP. No se establece rendimiento ni capacidad bajo carga.
debrief: Las solicitudes de aplicación e inicialización influían en la planificación. La preparación original de
  la ruta ahora termina dentro del presupuesto y el worker sirve su resultado.
stages.0.brief: El Deployment completa el rollout y el inicializador proporcionado termina correctamente antes del
  worker actual.
stages.0.objectives.0.text: El Deployment `board` mantiene exactamente una réplica.
stages.0.objectives.1.text: Se conservan recursos, datos fuente e imágenes originales; la CPU del worker y las solicitudes
  efectivas de arranque cumplen el presupuesto proporcionado.
stages.0.objectives.2.text: El contenedor board conserva su solicitud de memoria de `16Mi` y su límite de memoria
  de `64Mi`.
stages.0.objectives.3.text: El Deployment completa el rollout y el inicializador proporcionado termina correctamente
  antes del worker actual.
stages.0.objectives.4.text: HTTP desde Pod `app=board` a `http://127.0.0.1:8080` devuelve `north`.
hints.0.text: El planificador considera las fases de arranque además de los contenedores de aplicación. Un consumo
  CPU observado bajo no vuelve planificable una reserva.
hints.1.text: Compara `cpu-contract.json`, `kubectl get deployment board -o yaml` y `kubectl describe pod -l app=board`.
  Inspecciona todas las solicitudes que contribuyen y los eventos de planificación; las observaciones necesarias
  están disponibles en el namespace.
hints.2.text: |-
  Verifica rollout, inicialización terminada e interfaz real:

  - `kubectl rollout status deployment/board` — rollout completo.
  - `kubectl get pods -l app=board -o jsonpath='{.items[*].status.initContainerStatuses}'` — el inicializador normal terminó con código 0.
  - `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080` — la respuesta es north.
phrases.0: Distinguí CPU requests de CPU limits.
phrases.1: Restauré un request programable dentro del presupuesto previsto.
phrases.2: Verifiqué la configuración de los recursos en vivo y la respuesta de la aplicación.
questions.0.points.0: Requests reserva de capacidad allocatable.
questions.0.points.1: Allocatable difiere de la capacidad física.
questions.0.points.2: Los eventos identifican limitaciones de capacidad, contaminación y affinity.
questions.0.prompt: ¿Por qué un nodo que parece inactivo podría rechazar un Pod?
questions.1.points.0: Verifique throttling y los cuellos de botella posteriores.
questions.1.points.1: Asegúrese de que se puedan programar réplicas adicionales.
questions.1.points.2: Base las solicitudes en las medidas y el espacio libre indicado.
questions.1.prompt: ¿Qué se debe comprobar antes de agregar réplicas a un servicio lento?
