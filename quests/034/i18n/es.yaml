title: Solicitudes de recursos
brief: |
  El panel de salidas no está disponible.

  Trabaja en la workstation en `~/quest` con `board.json`.

  **Requisitos:**
  - Contrato de recursos de Deployment `board`:
    - `replicas`: `1`.
    - CPU: `requests.cpu=100m`, `limits.cpu=300m`.
    - Memoria: `requests.memory=16Mi`, `limits.memory=64Mi`.
  - Disponibilidad de la carga:
    - Deployment: `board`.
    - Estado: Rollout completado.
  - Respuesta HTTP dentro del contenedor `worker` del Pod `app=board`:
    - URL: `http://127.0.0.1:8080`.
    - Contenido: `north`.

  **Verifica antes de Check & finish:**
  - `kubectl get deployment board -o json` — muestra `replicas=1`, solicitud/límite de CPU `100m`/`300m` y solicitud/límite de memoria `16Mi`/`64Mi`.
  - `kubectl rollout status deployment/board --timeout=3s` — termina con código `0` e informa de un rollout completado.
  - `kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080` — imprime `north` del servicio HTTP dentro del Pod.
debrief: La programación utiliza los recursos solicitados, no la utilización instantánea del nodo.
stages.0.brief: |
  El panel debe servir su ruta dentro del presupuesto de recursos indicado.
stages.0.objectives.0.text: El Deployment `board` mantiene exactamente una réplica.
stages.0.objectives.1.text: El contenedor board solicita `100m` de CPU y tiene un límite de CPU de `300m`.
stages.0.objectives.2.text: El contenedor board conserva su solicitud de memoria de `16Mi` y su límite
  de memoria de `64Mi`.
stages.0.objectives.3.text: El Deployment `board` completa su rollout.
stages.0.objectives.4.text: HTTP desde Pod `app=board` a `http://127.0.0.1:8080` devuelve `north`.
hints.0.text: |
  Pending es diferente de una falla del proceso. El archivo board.json suministrado solicita 4 CPU en un nodo limitado a 2; revisa los eventos de planificación.
hints.1.text: Requests afecta la programación; Uso del tiempo de ejecución vinculado a limits.
hints.2.text: Verifique la ubicación y la respuesta real de HTTP.
phrases.0: Distinguí CPU requests de CPU limits.
phrases.1: Restauré un request programable dentro del presupuesto previsto.
phrases.2: Verifiqué la configuración de los recursos en vivo y la respuesta de la aplicación.
questions.0.points.0: Requests reserva de capacidad allocatable.
questions.0.points.1: Allocatable difiere de la capacidad física.
questions.0.points.2: Los eventos identifican limitaciones de capacidad, contaminación y affinity.
questions.0.prompt: ¿Por qué un nodo que parece inactivo podría rechazar un Pod?
questions.1.points.0: Verifique throttling y los cuellos de botella posteriores.
questions.1.points.1: Asegúrese de que se puedan programar réplicas adicionales.
questions.1.points.2: Base las solicitudes en las medidas y el espacio libre indicado.
questions.1.prompt: ¿Qué se debe comprobar antes de agregar réplicas a un servicio lento?
