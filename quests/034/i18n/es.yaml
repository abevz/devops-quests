title: Solicitudes de recursos
brief: 'board.json solicita cuatro CPU en un nodo con un límite de dos. El board necesita CPU request
  100m y limit 300m; preservar sus valores de memoria y una réplica. Diagnosticar los eventos de programación
  y luego reparar el contrato de recursos.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Board sirve north con CPU request 100m y limit 300m.'
debrief: La programación utiliza los recursos solicitados, no la utilización instantánea del nodo.
stages.0.brief: 'Criterios de éxito: Board sirve north con CPU request 100m y limit 300m.'
stages.0.objectives.0.text: Board sirve para north con CPU request 100m y limit 300m.
hints.0.text: Pending es diferente de una falla del proceso.
hints.1.text: Requests afecta la programación; Uso del tiempo de ejecución vinculado a limits.
hints.2.text: Verifique la ubicación y la respuesta real de HTTP.
phrases.0: Distinguí CPU requests de CPU limits.
phrases.1: Restauré un request programable dentro del presupuesto previsto.
phrases.2: Verifiqué la configuración de los recursos en vivo y la respuesta de la aplicación.
questions.0.points.0: Requests reserva de capacidad allocatable.
questions.0.points.1: Allocatable difiere de la capacidad física.
questions.0.points.2: Los eventos identifican limitaciones de capacidad, contaminación y affinity.
questions.0.prompt: ¿Por qué un nodo que parece inactivo podría rechazar un Pod?
questions.1.points.0: Verifique throttling y los cuellos de botella posteriores.
questions.1.points.1: Asegúrese de que se puedan programar réplicas adicionales.
questions.1.points.2: Base las solicitudes en las medidas y el espacio libre indicado.
questions.1.prompt: ¿Qué se debe comprobar antes de agregar réplicas a un servicio lento?
