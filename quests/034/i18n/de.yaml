title: Ressourcenanfragen
brief: |-
  Die Abfahrtstafel ist nicht verfügbar.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `board.yaml`.

  **Anforderungen:**

  - Deployment `board` behält genau `1` Replik bei und schließt seinen Rollout ab.
  - Sein Container `worker` hat das feste Ressourcenbudget:
    - CPU-Anforderung `100m`, CPU-Limit `300m`.
    - Speicheranforderung `16Mi`, Speicherlimit `64Mi`.
  - In Pod `app=board` liefert HTTP unter `http://127.0.0.1:8080` den Wert `north`.

  Diese Prüfungen belegen keine Leistung oder Kapazität unter Last.
debrief: Bei der Planung werden angeforderte Ressourcen verwendet, nicht die momentane Knotenauslastung.
stages.0.brief: Erhalten Sie das feste Ressourcenbudget und die geforderte HTTP-Antwort.
stages.0.objectives.0.text: Deployment `board` behält genau eine Replik.
stages.0.objectives.1.text: Der board-Container fordert `100m` CPU an und hat ein CPU-Limit von `300m`.
stages.0.objectives.2.text: Der board-Container behält seine Speicheranforderung von `16Mi` und sein Speicherlimit
  von `64Mi`.
stages.0.objectives.3.text: Deployment `board` schließt seinen Rollout ab.
stages.0.objectives.4.text: HTTP von Pod `app=board` an `http://127.0.0.1:8080` liefert `north`.
hints.0.text: Requests wirkt sich auf die Planung aus; limits gebundene Laufzeitnutzung.
hints.1.text: |-
  Pending unterscheidet sich von einem Prozessabsturz. Die bereitgestellte board.yaml fordert 4 CPUs auf einem auf 2 begrenzten Knoten an; prüfen Sie Scheduling-Ereignisse.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get nodes
  kubectl describe pod -l app=board
  ```
hints.2.text: 'Überprüfen Sie die Platzierung und die tatsächliche HTTP-Antwort.


  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:


  - `kubectl get deployment board -o json` — zeigt `replicas=1`, CPU-Anforderung/-Limit `100m`/`300m` und Speicheranforderung/-Limit `16Mi`/`64Mi`.

  - `kubectl rollout status deployment/board --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.

  - `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080` — gibt `north` vom HTTP-Dienst im Pod aus.'
phrases.0: Ich habe CPU requests von CPU limits unterschieden.
phrases.1: Ich habe eine planbare Anfrage innerhalb des vorgesehenen Budgets wiederhergestellt.
phrases.2: Ich habe die Live-Ressourceneinstellungen und die Anwendungsantwort überprüft.
questions.0.points.0: Requests Reservekapazität allocatable.
questions.0.points.1: Allocatable unterscheidet sich von der physischen Kapazität.
questions.0.points.2: Ereignisse identifizieren Kapazitäts-, Taint- und affinity-Einschränkungen.
questions.0.prompt: Warum könnte ein inaktiver Knoten einen Pod ablehnen?
questions.1.points.0: Überprüfen Sie throttling und Downstream-Engpässe.
questions.1.points.1: Stellen Sie sicher, dass zusätzliche Replikate geplant werden können.
questions.1.points.2: Basieren Sie Anfragen auf den Maßen und der angegebenen Durchfahrtshöhe.
questions.1.prompt: Was sollte überprüft werden, bevor Replikate zu einem langsamen Dienst hinzugefügt
  werden?
