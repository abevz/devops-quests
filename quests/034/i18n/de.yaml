title: Ressourcenanfragen
brief: 'board.json fordert vier CPUs auf einem Knoten an, der auf zwei begrenzt ist. Der board benötigt
  die Anforderung CPU 100m und limit 300m; Behalten Sie seine Speicherwerte und ein Replikat bei. Diagnostizieren
  Sie die Planungsereignisse und reparieren Sie dann den Ressourcenvertrag.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Board bedient north mit CPU-Anfrage 100m und limit 300m.'
debrief: Bei der Planung werden angeforderte Ressourcen verwendet, nicht die momentane Knotenauslastung.
stages.0.brief: 'Erfolgskriterien: Board bedient north mit CPU-Anfrage 100m und limit 300m.'
