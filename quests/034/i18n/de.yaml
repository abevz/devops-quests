title: Ressourcenanfragen
brief: |-
  Der Routen-Workload schließt den Start nicht ab. Stelle die Verfügbarkeit innerhalb des bereitgestellten Ressourcenbudgets wieder her.

  Arbeite auf der Workstation in `~/quest` mit `cpu-contract.json`; untersuche die bereitgestellten Ressourcen im Namespace.

  **Anforderungen:**
  - Deployment `board` behält eine Replik, ursprüngliche Workload-/Quell-ConfigMap-Identitäten und bereitgestellte Worker-/Initialisierer-Images. Die Speicheranforderung des worker bleibt `16Mi`, das Speicherlimit `64Mi`.
  - Erhalte alle bereitgestellten Quelldateneinträge. Worker-CPU-Budget und effektive Scheduling-Anforderungen der Anwendungs- und Startphasen entsprechen dem Vertrag.
  - Der bereitgestellte normale Initialisierer endet erfolgreich vor dem aktuellen Worker; das Deployment schließt den Rollout ab.
  - Aus Pod `app=board` liefert HTTP unter `http://127.0.0.1:8080` den Wert `north`.

  Geprüft werden aktuelle Anforderungen, abgeschlossene Initialisierung, Ressourcenidentität und HTTP. Leistung oder Kapazität unter Last wird nicht nachgewiesen.
debrief: Anwendungs- und Initialisierungsanforderungen beeinflussten das Scheduling. Die ursprüngliche Routenvorbereitung
  endet jetzt innerhalb des Budgets und der Worker liefert ihr Ergebnis.
stages.0.brief: Das Deployment schließt den Rollout ab und der bereitgestellte Initialisierer endet erfolgreich
  vor dem aktuellen Worker.
stages.0.objectives.0.text: Deployment `board` behält genau eine Replik.
stages.0.objectives.1.text: Ursprüngliche Ressourcen, Quelldaten und Images bleiben erhalten; Worker-CPU-Einstellungen
  und effektive Startanforderungen entsprechen dem bereitgestellten Budget.
stages.0.objectives.2.text: Der board-Container behält seine Speicheranforderung von `16Mi` und sein Speicherlimit
  von `64Mi`.
stages.0.objectives.3.text: Das Deployment schließt den Rollout ab und der bereitgestellte Initialisierer endet
  erfolgreich vor dem aktuellen Worker.
stages.0.objectives.4.text: HTTP von Pod `app=board` an `http://127.0.0.1:8080` liefert `north`.
hints.0.text: Der Scheduler berücksichtigt Startphasen ebenso wie Anwendungscontainer. Niedrige beobachtete CPU-Nutzung
  macht eine Reservierung nicht automatisch platzierbar.
hints.1.text: Vergleiche `cpu-contract.json`, `kubectl get deployment board -o yaml` und `kubectl describe pod -l
  app=board`. Prüfe alle beitragenden Anforderungen und Pod-Scheduling-Ereignisse; die nötigen Beobachtungen sind
  im Namespace verfügbar.
hints.2.text: |-
  Prüfe Rollout, abgeschlossene Initialisierung und die tatsächliche Schnittstelle:

  - `kubectl rollout status deployment/board` — Rollout abgeschlossen.
  - `kubectl get pods -l app=board -o jsonpath='{.items[*].status.initContainerStatuses}'` — normaler Initialisierer mit Exit-Code 0 beendet.
  - `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080` — Antwort ist north.
phrases.0: Ich habe CPU requests von CPU limits unterschieden.
phrases.1: Ich habe eine planbare Anfrage innerhalb des vorgesehenen Budgets wiederhergestellt.
phrases.2: Ich habe die Live-Ressourceneinstellungen und die Anwendungsantwort überprüft.
questions.0.points.0: Requests Reservekapazität allocatable.
questions.0.points.1: Allocatable unterscheidet sich von der physischen Kapazität.
questions.0.points.2: Ereignisse identifizieren Kapazitäts-, Taint- und affinity-Einschränkungen.
questions.0.prompt: Warum könnte ein inaktiver Knoten einen Pod ablehnen?
questions.1.points.0: Überprüfen Sie throttling und Downstream-Engpässe.
questions.1.points.1: Stellen Sie sicher, dass zusätzliche Replikate geplant werden können.
questions.1.points.2: Basieren Sie Anfragen auf den Maßen und der angegebenen Durchfahrtshöhe.
questions.1.prompt: Was sollte überprüft werden, bevor Replikate zu einem langsamen Dienst hinzugefügt werden?
diagnostics.board_replicas: Skalieren oder Neuerstellen des Deployments kann die Replikazahl ändern; auch API- oder JSON-Lesefehler verhindern die Prüfung. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-retained-objects)
diagnostics.cpu_identity: Löschen und Neuerstellen des Deployments oder Quell-ConfigMaps ändert die UID; eine fehlgeschlagene API-Beobachtung kann dieselbe Diagnose auslösen. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-retained-objects)
diagnostics.probe_0_1: CPU-Request oder -Limit von worker kann noch ganze CPUs angeben oder Werte auslassen; auch Python-, Fakten- oder API-Lesefehler unterbrechen die Probe. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-worker-cpu)
diagnostics.cpu_phase: Ein Initialisierer oder zusätzlicher Container kann in einer Startphase zu viel CPU reservieren; ungültige Mengen oder fehlende Workload-Beobachtungen scheitern ebenfalls. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-startup-budget)
diagnostics.cpu_image: Ein ersetztes Image oder ein neustartbarer Initialisierer kann den vorgegebenen Startvertrag verletzen, auch wenn worker bereit erscheint. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.cpu_initializer: Der normale Initialisierer kann fehlen, neustartbar oder unvollendet sein, oder aktuelle Pods sind nicht bereit; auch API-Fehler verhindern die Bestätigung. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.cpu_source: Ein Eintrag im Quell-ConfigMap wurde möglicherweise statt der Planung geändert oder gelöscht; ein API-Lesefehler kann denselben Marker liefern. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-source-data)
diagnostics.probe_0_2: Eine umfassende Ressourcenänderung kann worker-Speicherwerte ändern oder auslassen; auch unlesbares Deployment oder Python-/Modulfehler verhindert die Prüfung. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-retained-memory)
diagnostics.probe_0_3: Nicht planbare Requests oder unvollendete Initialisierung können den Rollout blockieren; auch Python, Fakten oder fehlerhafte Beobachtungsdaten stoppen die spätere Startprobe. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-original-initializer)
diagnostics.board_http: Der Initialisierer hat die Quelle möglicherweise nicht in das gemeinsame Volume kopiert, oder worker liefert sie nicht aus; auch Pod-Suche, exec- oder HTTP-Fehler scheitern. [Ursache und Prüfung](guides#guide=kubernetes-9&section=board-route-http)
