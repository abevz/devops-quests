stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: kubectl get deployment board -o json | jq -e ' .spec.replicas==1' >/dev/null
  - text: stages.0.objectives.1.text
    check: kubectl get deployment board -o json | jq -e '.spec.template.spec.containers[0].resources |
      .requests.cpu=="100m" and .limits.cpu=="300m"' >/dev/null
  - text: stages.0.objectives.2.text
    check: kubectl get deployment board -o json | jq -e '.spec.template.spec.containers[0].resources |
      .requests.memory=="16Mi" and .limits.memory=="64Mi"' >/dev/null
  - text: stages.0.objectives.3.text
    check: kubectl rollout status deployment/board --timeout=3s
  - text: stages.0.objectives.4.text
    check: 'pod=$(kubectl get pods -l app=board -o jsonpath=''{.items[0].metadata.name}'')

      test "$(kubectl exec "$pod" -- wget -qO- http://127.0.0.1:8080)" = north'
