id: 34
title: title
track: Kubernetes
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    keep: true
    check: |-
      set +e
      (
      set -e
      kubectl get deployment board -o json | jq -e ' .spec.replicas==1' >/dev/null
      )
      code=$?
      set -e
      if [ "$code" -ne 0 ]; then
        printf '%s\n' 'The board replica count could not be verified as one: ✗ [DQ:board_replicas]' >&2
        exit "$code"
      fi
  - text: stages.0.objectives.1.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      timeout --kill-after=1s 8s bash -euo pipefail <<'DQ_LEGACY_CPU_1'
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      document=$(kubectl get deployment board -o json 2>/dev/null || true)
      python3 -I - /dev/fd/3 3<<<"$document" <<'DQ_QUANTITY'
      import json, sys
      from decimal import InvalidOperation
      from dq_check import quantity, read_argument, workload_worker as worker

      sys.argv = [read_argument(value) for value in sys.argv]

      try:
          resources=worker(json.loads(sys.argv[1])).get("resources",{})
      except (KeyError,ValueError,TypeError,AttributeError):
          resources={}
      failed=False
      for category,name,expected,marker,label in [('requests', 'cpu', '100m', None, None), ('limits', 'cpu', '300m', None, None)]:
          try:
              ok=quantity(resources.get(category,{}).get(name), dialect="typed_ascii")==quantity(expected, dialect="typed_ascii")
          except (KeyError,ValueError,TypeError,AttributeError,InvalidOperation,OverflowError):
              ok=False
          if not ok:
              failed=True
              if marker:
                  print(label+": ✗ [DQ:"+marker+"]")
      sys.exit(failed)
      DQ_QUANTITY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
      DQ_LEGACY_CPU_1
      python3 -I - <<'DQ_CPU_POLICY'
      import json
      import subprocess
      import sys
      import time
      from decimal import InvalidOperation
      from pathlib import Path

      from dq_check import current_pods, named, pod_worker, quantity, workload_worker

      failed = False
      deadline = time.monotonic() + 10

      def require(value, marker):
          global failed
          if not value:
              print('Startup CPU condition is unmet: ✗ [DQ:' + marker + ']')
              failed = True

      def command(args, marker):
          try:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise ValueError('Startup CPU observation budget exhausted')
              result = subprocess.run(args, capture_output=True, text=True, timeout=min(6, remaining))
              if result.returncode:
                  raise ValueError('Startup CPU observation failed')
              return result.stdout
          except (OSError, ValueError, subprocess.SubprocessError):
              print('Current startup CPU inputs are unavailable: ✗ [DQ:' + marker + ']')
              sys.exit(1)

      def get(kind, name, marker):
          return json.loads(command(['kubectl', 'get', kind] + ([name] if name else []) + ['-o', 'json'], marker))

      def same_image(actual, expected):
          digest = expected.partition('@')[2]
          return actual == expected or bool(digest) and isinstance(actual, str) and actual.partition('@')[2] == digest

      def startup_initializer(spec):
          try:
              return named(spec.get('initContainers', []), contract['initializer'])
          except (KeyError, ValueError, TypeError, AttributeError):
              require(False, 'cpu_initializer')
              sys.exit(1)

      def phase_request(spec):
          try:
              def request(container):
                  resources = container.get('resources', {})
                  value = resources.get('requests', {}).get('cpu', resources.get('limits', {}).get('cpu', '0'))
                  result = quantity(value, dialect='typed_ascii')
                  if result < 0:
                      raise ValueError('Negative CPU request')
                  return result
              applications = sum(request(c) for c in spec.get('containers', []))
              sidecars = 0
              peak_init = 0
              for container in spec.get('initContainers', []):
                  value = request(container)
                  if container.get('restartPolicy') == 'Always':
                      sidecars += value
                      peak_init = max(peak_init, sidecars)
                  else:
                      peak_init = max(peak_init, sidecars + value)
              parent = spec.get('resources', {}).get('requests', {}).get('cpu')
              effective = max(applications + sidecars, peak_init)
              if parent is not None:
                  effective = quantity(parent, dialect='typed_ascii')
              overhead = quantity(spec.get('overhead', {}).get('cpu', '0'), dialect='typed_ascii')
              if overhead < 0:
                  return False
              ceiling = quantity(contract['phaseRequestCeiling'], dialect='typed_ascii')
              return bool(spec.get('containers')) and 0 <= effective + overhead <= ceiling
          except (KeyError, ValueError, TypeError, AttributeError, InvalidOperation, OverflowError):
              return False

      facts = json.loads(Path('/run/dq/facts/0/cpu-identities.json').read_text())
      contract = facts['contract']
      for resource, uid in facts['identities'].items():
          kind, name = resource.split('/')
          require(get(kind, name, 'cpu_identity').get('metadata', {}).get('uid') == uid, 'cpu_identity')
      deployment = get('deployment', contract['deployment'], 'cpu_phase')
      spec = deployment['spec']['template']['spec']
      initializer = startup_initializer(spec)
      require(initializer.get('restartPolicy') != 'Always', 'cpu_initializer')
      require(same_image(workload_worker(deployment).get('image'), facts['image']) and same_image(initializer.get('image'), facts['image']), 'cpu_image')
      require(phase_request(spec), 'cpu_phase')
      source = get('configmap', contract['source']['configMap'], 'cpu_source')
      require(all(source.get('data', {}).get(k) == v for k, v in facts['sourceData'].items()), 'cpu_source')
      sys.exit(int(failed))
      DQ_CPU_POLICY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
       printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
