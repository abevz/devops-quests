title: Delegation
brief: 'The shared fleet report is incomplete.


  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  The report belongs at `~/quest/fleet.txt` on the workstation.


  **Requirements:**

  - On the workstation, fleet.txt lists app1, app2 and app3 in sorted order, one name per line.

  - The workstation file fleet.txt has mode 0644.

  - No `/srv/site/fleet.txt` is present on any managed host (`app1`, `app2`, `app3`).

  - The workstation report follows sorted current fleet membership instead of depending on a fixed host list.

  '
debrief: delegate_to selected the workstation; run_once selected one writer.
stages.0.brief: One complete sorted report must remain on the workstation.
stages.0.objectives.0.text: On the workstation, fleet.txt lists app1, app2 and app3 in sorted order, one name
  per line.
stages.0.objectives.1.text: The workstation file fleet.txt has mode 0644.
stages.0.objectives.2.text: No `/srv/site/fleet.txt` is present on any managed host (`app1`, `app2`, `app3`).
stages.0.objectives.3.text: The workstation report follows sorted current fleet membership instead of depending
  on a fixed host list.
hints.0.text: One shared report must represent the whole fleet, not only the last host processed.
hints.1.text: 'Delegation changes location, not host iterations. The supplied play overwrites the report with
  one name per target iteration.


  groups["fleet"] contains the full membership.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: |-
  Verify the observed result:

  - `cat ~/quest/fleet.txt` — prints app1, app2 and app3, one per line, in that order.

  - `ls -l ~/quest/fleet.txt` — shows permissions `-rw-r--r--` on the workstation file.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — returns rc=0 on every managed host: no remote report is present.

  With a temporary inventory that changes only fleet membership, rerun the playbook: fleet.txt must list that membership in sorted order. Restore the inventory and report afterward.
phrases.0: I distinguished delegated execution from per-host execution.
phrases.1: I aggregated inventory data on localhost.
phrases.2: I verified a complete sorted fleet list.
diagnostics.absent_1: No /srv/site/fleet.txt is present on app1.
diagnostics.absent_2: No /srv/site/fleet.txt is present on app2.
diagnostics.absent_3: No /srv/site/fleet.txt is present on app3.
diagnostics.probe_0_3: 'The current inputs could not verify this objective: The workstation report follows sorted
  current fleet membership instead of depending on a fixed host list.'
