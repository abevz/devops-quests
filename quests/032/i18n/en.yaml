title: Delegation
brief: 'rollout.yml delegates a summary to localhost, but every target overwrites
  it with one name. Produce one sorted fleet.txt on the workstation: app1, app2, app3,
  one per line, mode 0644. Use inventory membership rather than hardcoded names; do
  not deliver it to targets.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `fleet.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: fleet.txt contains the complete sorted inventory on localhost.
  Repair the single supplied copy task; delegate it to localhost with run_once.'
debrief: delegate_to selected the workstation; run_once selected one writer.
stages.0.brief: 'Success criteria: fleet.txt contains the complete sorted inventory
  on localhost.'
stages.0.objectives.0.text: fleet.txt contains the complete sorted inventory on localhost.
hints.0.text: Delegation changes location, not host iterations.
hints.1.text: groups["fleet"] contains the full membership.
hints.2.text: run_once avoids competing writes to a shared local output.
phrases.0: I distinguished delegated execution from per-host execution.
phrases.1: I aggregated inventory data on localhost.
phrases.2: I verified a complete sorted fleet list.
