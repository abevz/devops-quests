title: Delegation
brief: |-
  The shared fleet report is incomplete.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Workstation report:
    - Path: `~/quest/fleet.txt`.
    - Sorted current fleet membership, one name per line: `app1`, `app2`, `app3`.
    - Access mode: `0644`.
    - One configured workstation write operation.
  - Remote absence on all managed hosts (`app1`, `app2`, `app3`):
    - `/srv/site/fleet.txt` does not exist.

  **Verify yourself before Check & finish:**
  - `cat ~/quest/fleet.txt` — prints app1, app2 and app3, one per line, in that order.
  - `ls -l ~/quest/fleet.txt` — shows permissions `-rw-r--r--` on the workstation file.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — returns rc=0 on every managed host: no remote report is present.
debrief: delegate_to selected the workstation; run_once selected one writer.
stages.0.brief: One complete sorted report must remain on the workstation.
stages.0.objectives.0.text: On the workstation, fleet.txt lists app1, app2 and app3 in sorted order, one name per
  line.
stages.0.objectives.1.text: The workstation file fleet.txt has mode 0644.
stages.0.objectives.2.text: No `/srv/site/fleet.txt` is present on any managed host (`app1`, `app2`, `app3`).
stages.0.objectives.3.text: Workstation fleet.txt follows sorted current fleet membership with one configured write
  operation.
hints.0.text: Delegation changes location, not host iterations. The supplied play overwrites the report with one
  name per target iteration.
hints.1.text: groups["fleet"] contains the full membership.
hints.2.text: run_once avoids competing writes to a shared local output.
phrases.0: I distinguished delegated execution from per-host execution.
phrases.1: I aggregated inventory data on localhost.
phrases.2: I verified a complete sorted fleet list.
diagnostics.absent_1: No /srv/site/fleet.txt is present on app1.
diagnostics.absent_2: No /srv/site/fleet.txt is present on app2.
diagnostics.absent_3: No /srv/site/fleet.txt is present on app3.
