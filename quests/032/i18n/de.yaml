title: Delegation
brief: |-
  Der gemeinsame Flottenbericht ist unvollständig.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Host `app1`:
    - Auf app1 ist keine /srv/site/fleet.txt vorhanden.
  - Host `app2`:
    - Auf app2 ist keine /srv/site/fleet.txt vorhanden.
  - Host `app3`:
    - Auf app3 ist keine /srv/site/fleet.txt vorhanden.
  - Workstation- und Ausführungsergebnisse:
    - Auf der Workstation listet fleet.txt app1, app2 und app3 sortiert mit einem Namen pro Zeile auf.
    - Die Workstation-Datei fleet.txt hat Modus 0644.
    - Der Bericht folgt der sortierten aktuellen fleet-Mitgliedschaft und hat einen Schreiber auf der Workstation.

  **Selbstprüfung vor Check & finish:**
  - `cat ~/quest/fleet.txt` — gibt app1, app2 und app3 in dieser Reihenfolge mit einem Namen pro Zeile aus.
  - `ls -l ~/quest/fleet.txt` — zeigt Berechtigungen `-rw-r--r--` der Workstation-Datei.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — liefert rc=0 auf jedem verwalteten Host: Es gibt keinen entfernten Bericht.
debrief: delegate_to wählte den workstation; run_once hat einen Autor ausgewählt.
stages.0.brief: Ein vollständiger sortierter Bericht muss auf der Workstation vorliegen.
