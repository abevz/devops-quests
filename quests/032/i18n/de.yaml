title: Delegation
brief: |-
  Der gemeinsame Flottenbericht ist unvollständig.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Workstation-Bericht:
    - Pfad: `~/quest/fleet.txt`.
    - Sortierte aktuelle fleet-Mitgliedschaft, ein Name pro Zeile: `app1`, `app2`, `app3`.
    - Zugriffsmodus: `0644`.
    - Ein konfigurierter Schreibvorgang auf der Workstation.
  - Fehlender entfernter Bericht auf allen verwalteten Hosts (`app1`, `app2`, `app3`):
    - `/srv/site/fleet.txt` existiert nicht.

  **Selbstprüfung vor Check & finish:**
  - `cat ~/quest/fleet.txt` — gibt app1, app2 und app3 in dieser Reihenfolge mit einem Namen pro Zeile aus.
  - `ls -l ~/quest/fleet.txt` — zeigt Berechtigungen `-rw-r--r--` der Workstation-Datei.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — liefert rc=0 auf jedem verwalteten Host: Es gibt keinen entfernten Bericht.
debrief: delegate_to wählte den workstation; run_once hat einen Autor ausgewählt.
stages.0.brief: Ein vollständiger sortierter Bericht muss auf der Workstation vorliegen.
stages.0.objectives.0.text: Auf der Workstation listet fleet.txt app1, app2 und app3 sortiert mit einem Namen pro
  Zeile auf.
stages.0.objectives.1.text: Die Workstation-Datei fleet.txt hat Modus 0644.
stages.0.objectives.2.text: Auf keinem verwalteten Host (`app1`, `app2`, `app3`) ist `/srv/site/fleet.txt` vorhanden.
stages.0.objectives.3.text: Workstation fleet.txt folgt der sortierten aktuellen fleet-Mitgliedschaft mit einem
  konfigurierten Schreibvorgang.
hints.0.text: Die Delegation ändert den Standort, nicht die Host-Iterationen. Das bereitgestellte Play überschreibt
  den Bericht mit einem Namen pro Zieliteration.
hints.1.text: groups["fleet"] enthält die Vollmitgliedschaft.
hints.2.text: run_once vermeidet konkurrierende Schreibvorgänge auf einen gemeinsam genutzten lokalen Ausgang.
phrases.0: Ich habe die delegierte Ausführung von der Ausführung pro Host unterschieden.
phrases.1: Ich habe inventory-Daten auf localhost aggregiert.
phrases.2: Ich habe eine vollständig sortierte Flottenliste überprüft.
diagnostics.absent_1: Auf app1 ist keine /srv/site/fleet.txt vorhanden.
diagnostics.absent_2: Auf app2 ist keine /srv/site/fleet.txt vorhanden.
diagnostics.absent_3: Auf app3 ist keine /srv/site/fleet.txt vorhanden.
