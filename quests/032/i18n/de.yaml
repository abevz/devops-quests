title: Delegation
brief: 'Der gemeinsame Flottenbericht ist unvollständig.


  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Bericht gehört nach `~/quest/fleet.txt` auf die Workstation.


  **Anforderungen:**

  - Auf der Workstation listet fleet.txt app1, app2 und app3 sortiert mit einem Namen pro Zeile auf.

  - Die Workstation-Datei fleet.txt hat Modus 0644.

  - Auf keinem verwalteten Host (`app1`, `app2`, `app3`) ist `/srv/site/fleet.txt` vorhanden.

  - Der Bericht auf der Workstation folgt der sortierten aktuellen Flottenzugehörigkeit statt einer festen
  Hostliste.

  '
debrief: delegate_to wählte den workstation; run_once hat einen Autor ausgewählt.
stages.0.brief: Ein vollständiger sortierter Bericht muss auf der Workstation vorliegen.
stages.0.objectives.0.text: Auf der Workstation listet fleet.txt app1, app2 und app3 sortiert mit einem Namen
  pro Zeile auf.
stages.0.objectives.1.text: Die Workstation-Datei fleet.txt hat Modus 0644.
stages.0.objectives.2.text: Auf keinem verwalteten Host (`app1`, `app2`, `app3`) ist `/srv/site/fleet.txt`
  vorhanden.
stages.0.objectives.3.text: Der Bericht auf der Workstation folgt der sortierten aktuellen Flottenzugehörigkeit
  statt einer festen Hostliste.
hints.0.text: Ein gemeinsamer Bericht muss die gesamte Flotte abbilden, nicht nur den zuletzt verarbeiteten
  Host.
hints.1.text: 'Die Delegation ändert den Standort, nicht die Host-Iterationen. Das bereitgestellte Play überschreibt
  den Bericht mit einem Namen pro Zieliteration.


  groups["fleet"] enthält die Vollmitgliedschaft.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: |-
  Prüfen Sie das beobachtete Ergebnis:

  - `cat ~/quest/fleet.txt` — gibt app1, app2 und app3 in dieser Reihenfolge mit einem Namen pro Zeile aus.

  - `ls -l ~/quest/fleet.txt` — zeigt Berechtigungen `-rw-r--r--` der Workstation-Datei.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — liefert rc=0 auf jedem verwalteten Host: Es gibt keinen entfernten Bericht.

  Führe das Playbook mit einem temporären Inventar erneut aus, das nur die Mitglieder von fleet ändert: fleet.txt muss diese sortiert auflisten. Stelle danach Inventar und Bericht wieder her.
phrases.0: Ich habe die delegierte Ausführung von der Ausführung pro Host unterschieden.
phrases.1: Ich habe inventory-Daten auf localhost aggregiert.
phrases.2: Ich habe eine vollständig sortierte Flottenliste überprüft.
diagnostics.absent_1: Auf app1 ist keine /srv/site/fleet.txt vorhanden.
diagnostics.absent_2: Auf app2 ist keine /srv/site/fleet.txt vorhanden.
diagnostics.absent_3: Auf app3 ist keine /srv/site/fleet.txt vorhanden.
diagnostics.probe_0_3: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Der Bericht auf der
  Workstation folgt der sortierten aktuellen Flottenzugehörigkeit statt einer festen Hostliste.'
