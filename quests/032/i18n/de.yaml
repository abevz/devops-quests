title: Delegation
brief: 'rollout.yml delegiert eine Zusammenfassung an localhost, aber jedes Ziel überschreibt sie mit
  einem Namen. Erzeugen Sie einen sortierten fleet.txt auf dem workstation: app1, app2, app3, einen pro
  Zeile, Modus 0644. Verwenden Sie die inventory-Mitgliedschaft anstelle von fest codierten Namen. Liefern
  Sie es nicht an Ziele.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `fleet.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: fleet.txt enthält den komplett sortierten inventory auf localhost. Reparieren
  Sie die einzelne bereitgestellte Kopieraufgabe. Delegieren Sie es an localhost mit run_once.'
debrief: delegate_to wählte den workstation; run_once hat einen Autor ausgewählt.
stages.0.brief: 'Erfolgskriterium: fleet.txt enthält den komplett sortierten inventory auf localhost.'
stages.0.objectives.0.text: fleet.txt enthält den komplett sortierten inventory auf localhost.
hints.0.text: Die Delegation ändert den Standort, nicht die Host-Iterationen.
hints.1.text: groups["fleet"] enthält die Vollmitgliedschaft.
hints.2.text: run_once vermeidet konkurrierende Schreibvorgänge auf einen gemeinsam genutzten lokalen
  Ausgang.
phrases.0: Ich habe die delegierte Ausführung von der Ausführung pro Host unterschieden.
phrases.1: Ich habe inventory-Daten auf localhost aggregiert.
phrases.2: Ich habe eine vollständig sortierte Flottenliste überprüft.
