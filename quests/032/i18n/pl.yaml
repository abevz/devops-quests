title: Delegacja
brief: |-
  Wspólny raport hostów jest niekompletny.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Raport na workstation:
    - Ścieżka: `~/quest/fleet.txt`.
    - Posortowany bieżący skład fleet, po jednej nazwie w wierszu: `app1`, `app2`, `app3`.
    - Tryb dostępu: `0644`.
    - Jedna skonfigurowana operacja zapisu na workstation.
  - Brak zdalnego raportu na wszystkich zarządzanych hostach (`app1`, `app2`, `app3`):
    - `/srv/site/fleet.txt` nie istnieje.

  **Sprawdź przed Check & finish:**
  - `cat ~/quest/fleet.txt` — wypisuje app1, app2 i app3, po jednym w wierszu, w tej kolejności.
  - `ls -l ~/quest/fleet.txt` — pokazuje uprawnienia `-rw-r--r--` pliku na workstation.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — zwraca rc=0 na każdym zarządzanym hoście: nie ma zdalnego raportu.
debrief: delegate_to wybrał workstation; run_once wybrał jednego pisarza.
stages.0.brief: Jeden kompletny posortowany raport musi znajdować się na workstation.
stages.0.objectives.0.text: Na workstation plik fleet.txt zawiera app1, app2 i app3 w kolejności sortowania, po
  jednej nazwie w wierszu.
stages.0.objectives.1.text: Plik fleet.txt na workstation ma tryb 0644.
stages.0.objectives.2.text: Na żadnym zarządzanym hoście (`app1`, `app2`, `app3`) nie ma `/srv/site/fleet.txt`.
stages.0.objectives.3.text: Plik fleet.txt na workstation odzwierciedla posortowany bieżący skład fleet z jedną
  skonfigurowaną operacją zapisu.
hints.0.text: Delegowanie zmienia lokalizację, a nie iteracje hosta. Dostarczony play nadpisuje raport jedną nazwą
  w każdej iteracji hosta.
hints.1.text: groups["fleet"] zawiera pełne członkostwo.
hints.2.text: run_once pozwala uniknąć konkurencyjnych zapisów na współdzielonym lokalnym wyjściu.
phrases.0: Rozróżniłem wykonanie delegowane od wykonania na hoście.
phrases.1: Zagregowałem dane inventory na localhost.
phrases.2: Sprawdziłem kompletną, posortowaną listę floty.
diagnostics.absent_1: Na app1 nie ma /srv/site/fleet.txt.
diagnostics.absent_2: Na app2 nie ma /srv/site/fleet.txt.
diagnostics.absent_3: Na app3 nie ma /srv/site/fleet.txt.
