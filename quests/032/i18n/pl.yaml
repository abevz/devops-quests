title: Delegacja
brief: 'rollout.yml deleguje podsumowanie do localhost, ale każdy cel nadpisuje je jedną nazwą. Utwórz
  jedno posortowane fleet.txt na workstation: app1, app2, app3, po jednym w wierszu, mode 0644. Użyj członkostwa
  inventory zamiast zakodowanych na stałe nazw; nie dostarczaj go do celów.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `fleet.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: fleet.txt zawiera kompletne posortowane inventory na localhost. Napraw
  pojedyncze dostarczone zadanie kopiowania; deleguj to do localhost za pomocą run_once.'
debrief: delegate_to wybrał workstation; run_once wybrał jednego pisarza.
stages.0.brief: 'Kryteria sukcesu: fleet.txt zawiera kompletne posortowane inventory na localhost.'
stages.0.objectives.0.text: fleet.txt zawiera kompletne posortowane inventory na localhost.
hints.0.text: Delegowanie zmienia lokalizację, a nie iteracje hosta.
hints.1.text: groups["fleet"] zawiera pełne członkostwo.
hints.2.text: run_once pozwala uniknąć konkurencyjnych zapisów na współdzielonym lokalnym wyjściu.
phrases.0: Rozróżniłem wykonanie delegowane od wykonania na hoście.
phrases.1: Zagregowałem dane inventory na localhost.
phrases.2: Sprawdziłem kompletną, posortowaną listę floty.
