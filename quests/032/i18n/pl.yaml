title: Delegacja
brief: 'Wspólny raport hostów jest niekompletny.


  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Raport ma znajdować się w `~/quest/fleet.txt` na stacji roboczej.


  **Wymagania:**

  - Na workstation plik fleet.txt zawiera app1, app2 i app3 w kolejności sortowania, po jednej nazwie w wierszu.

  - Plik fleet.txt na workstation ma tryb 0644.

  - Na żadnym zarządzanym hoście (`app1`, `app2`, `app3`) nie ma `/srv/site/fleet.txt`.

  - Raport na stacji roboczej odpowiada posortowanemu bieżącemu składowi floty, a nie stałej liście hostów.

  '
debrief: delegate_to wybrał workstation; run_once wybrał jednego pisarza.
stages.0.brief: Jeden kompletny posortowany raport musi znajdować się na workstation.
stages.0.objectives.0.text: Na workstation plik fleet.txt zawiera app1, app2 i app3 w kolejności sortowania,
  po jednej nazwie w wierszu.
stages.0.objectives.1.text: Plik fleet.txt na workstation ma tryb 0644.
stages.0.objectives.2.text: Na żadnym zarządzanym hoście (`app1`, `app2`, `app3`) nie ma `/srv/site/fleet.txt`.
stages.0.objectives.3.text: Raport na stacji roboczej odpowiada posortowanemu bieżącemu składowi floty, a nie
  stałej liście hostów.
hints.0.text: Jeden wspólny raport musi przedstawiać całą flotę, nie tylko ostatnio przetworzony host.
hints.1.text: |-
  Delegowanie zmienia lokalizację, a nie iteracje hosta. Dostarczony play nadpisuje raport jedną nazwą w każdej iteracji hosta.

  groups["fleet"] zawiera pełne członkostwo.

  Sprawdź dostarczone dane wejściowe i zakres wykonania:

  ```sh
  cat inventory.ini
  cat rollout.yml
  ansible-inventory -i inventory.ini --graph
  ```
hints.2.text: |-
  Sprawdź obserwowany wynik:

  - `cat ~/quest/fleet.txt` — wypisuje app1, app2 i app3, po jednym w wierszu, w tej kolejności.

  - `ls -l ~/quest/fleet.txt` — pokazuje uprawnienia `-rw-r--r--` pliku na workstation.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — zwraca rc=0 na każdym zarządzanym hoście: nie ma zdalnego raportu.

  Uruchom playbook ponownie z tymczasowym inwentarzem zmieniającym tylko skład grupy fleet: fleet.txt musi zawierać ten skład w kolejności sortowania. Następnie przywróć inwentarz i raport.
phrases.0: Rozróżniłem wykonanie delegowane od wykonania na hoście.
phrases.1: Zagregowałem dane inventory na localhost.
phrases.2: Sprawdziłem kompletną, posortowaną listę floty.
diagnostics.report_content: Delegowane zapisy dla każdego hosta mogą nadpisywać wspólny raport jedną nazwą; lokalny raport może też nie istnieć lub być nieczytelny. [Przyczyna i kontrola](guides#guide=ansible-11&section=fleet-summary-membership)
diagnostics.report_mode: Zadanie copy może nie ustawiać trybu 0644 lub pisać gdzie indziej; brak raportu albo błąd stat też blokuje kontrolę uprawnień. [Przyczyna i kontrola](guides#guide=ansible-11&section=fleet-summary-mode)
diagnostics.probe_0_3: Stała lista lub konkurujące zapisy mogą zawieść przy zmianie składu; błędy startu Pythona, danych, Ansible, limit czasu lub odtwarzanie raportu też mogą przerwać obserwator. [Przyczyna i kontrola](guides#guide=ansible-11&section=fleet-summary-membership)
diagnostics.absent_1: Zadanie bez delegowania na localhost lub pozostały plik może pozostawić raport na app1; błąd SSH też uniemożliwia potwierdzenie jego braku. [Przyczyna i kontrola](guides#guide=ansible-11&section=fleet-summary-location)
diagnostics.absent_2: Zadanie bez delegowania na localhost lub pozostały plik może pozostawić raport na app2; błąd SSH też uniemożliwia potwierdzenie jego braku. [Przyczyna i kontrola](guides#guide=ansible-11&section=fleet-summary-location)
diagnostics.absent_3: Zadanie bez delegowania na localhost lub pozostały plik może pozostawić raport na app3; błąd SSH też uniemożliwia potwierdzenie jego braku. [Przyczyna i kontrola](guides#guide=ansible-11&section=fleet-summary-location)
