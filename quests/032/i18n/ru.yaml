title: Делегирование
brief: 'Общий отчёт о хостах неполон.


  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Отчёт должен находиться в `~/quest/fleet.txt` на рабочей станции.


  **Требования:**

  - На workstation файл fleet.txt перечисляет app1, app2 и app3 по порядку, по одному имени в строке.

  - Файл fleet.txt на workstation имеет режим 0644.

  - Ни на одном управляемом хосте (`app1`, `app2`, `app3`) нет `/srv/site/fleet.txt`.

  - Отчёт на рабочей станции соответствует отсортированному текущему составу парка, а не фиксированному списку
  хостов.

  '
debrief: delegate_to выбрал workstation, run_once — одного писателя.
stages.0.brief: Один полный отсортированный отчёт должен находиться на workstation.
stages.0.objectives.0.text: На workstation файл fleet.txt перечисляет app1, app2 и app3 по порядку, по одному
  имени в строке.
stages.0.objectives.1.text: Файл fleet.txt на workstation имеет режим 0644.
stages.0.objectives.2.text: Ни на одном управляемом хосте (`app1`, `app2`, `app3`) нет `/srv/site/fleet.txt`.
stages.0.objectives.3.text: Отчёт на рабочей станции соответствует отсортированному текущему составу парка,
  а не фиксированному списку хостов.
hints.0.text: Один общий отчёт должен представлять весь парк, а не только последний обработанный хост.
hints.1.text: 'Делегирование меняет место, а не число итераций по хостам. Выданный play перезаписывает отчёт
  одним именем на каждой итерации хоста.


  groups["fleet"] содержит полный состав.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: |-
  Проверьте наблюдаемый результат:

  - `cat ~/quest/fleet.txt` — выводит app1, app2 и app3, по одному в строке, в этом порядке.

  - `ls -l ~/quest/fleet.txt` — показывает права `-rw-r--r--` файла на workstation.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — возвращает rc=0 на каждом управляемом хосте: удалённого отчёта нет.

  Повторите запуск плейбука с временным инвентарём, меняющим только состав fleet: fleet.txt должен перечислять этот состав в отсортированном порядке. Затем восстановите инвентарь и отчёт.
phrases.0: Я различил делегированное выполнение и выполнение на каждом узле.
phrases.1: Я собрал данные inventory на localhost.
phrases.2: Я проверил полный отсортированный список узлов.
diagnostics.absent_1: На app1 нет /srv/site/fleet.txt.
diagnostics.absent_2: На app2 нет /srv/site/fleet.txt.
diagnostics.absent_3: На app3 нет /srv/site/fleet.txt.
diagnostics.probe_0_3: 'Текущие данные не позволили проверить эту цель: Отчёт на рабочей станции соответствует отсортированному
  текущему составу парка, а не фиксированному списку хостов.'
