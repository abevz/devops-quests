title: Делегирование
brief: 'rollout.yml делегирует отчёт localhost, но каждая цель перезаписывает его одним именем. Получите
  один fleet.txt на workstation: app1, app2, app3, по строке, mode 0644. Используйте состав inventory,
  а не жёстко заданные имена; на цели отчёт не доставляйте.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `fleet.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: fleet.txt содержит полный отсортированный inventory на localhost. Исправьте единственную
  выданную copy-задачу: delegate_to localhost и run_once.'
debrief: delegate_to выбрал workstation, run_once — одного писателя.
stages.0.brief: 'fleet.txt содержит полный отсортированный inventory на localhost.


  Результат проверки: fleet.txt содержит полный отсортированный inventory на localhost.'
stages.0.objectives.0.text: fleet.txt содержит полный отсортированный inventory на localhost.
hints.0.text: Делегирование меняет место, а не число итераций по хостам.
hints.1.text: groups["fleet"] содержит полный состав.
hints.2.text: run_once исключает конкуренцию за общий локальный результат.
phrases.0: Я различил делегированное выполнение и выполнение на каждом узле.
phrases.1: Я собрал данные inventory на localhost.
phrases.2: Я проверил полный отсортированный список узлов.
