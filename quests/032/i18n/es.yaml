title: Delegación
brief: 'El informe compartido de la flota está incompleto.


  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  El informe debe estar en `~/quest/fleet.txt` en la estación de trabajo.


  **Requisitos:**

  - En la workstation, fleet.txt enumera app1, app2 y app3 ordenados, un nombre por línea.

  - El archivo fleet.txt en la workstation tiene modo 0644.

  - No existe `/srv/site/fleet.txt` en ningún host administrado (`app1`, `app2`, `app3`).

  - El informe de la estación de trabajo sigue la pertenencia actual ordenada de la flota en vez de depender
  de una lista fija de hosts.

  '
debrief: delegate_to seleccionó el workstation; run_once seleccionó un escritor.
stages.0.brief: Un informe completo ordenado debe quedar en la workstation.
stages.0.objectives.0.text: En la workstation, fleet.txt enumera app1, app2 y app3 ordenados, un nombre por
  línea.
stages.0.objectives.1.text: El archivo fleet.txt en la workstation tiene modo 0644.
stages.0.objectives.2.text: No existe `/srv/site/fleet.txt` en ningún host administrado (`app1`, `app2`, `app3`).
stages.0.objectives.3.text: El informe de la estación de trabajo sigue la pertenencia actual ordenada de la
  flota en vez de depender de una lista fija de hosts.
hints.0.text: Un informe compartido debe representar toda la flota, no solo el último host procesado.
hints.1.text: 'La delegación cambia de ubicación, no de host de iteraciones. El play suministrado sobrescribe
  el informe con un nombre por iteración de destino.


  groups["fleet"] contiene la membresía completa.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: |-
  Verifica el resultado observado:

  - `cat ~/quest/fleet.txt` — imprime app1, app2 y app3, uno por línea, en ese orden.

  - `ls -l ~/quest/fleet.txt` — muestra permisos `-rw-r--r--` del archivo en la workstation.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — devuelve rc=0 en cada host administrado: no hay informe remoto.

  Vuelve a ejecutar el playbook con un inventario temporal que cambie solo los miembros de fleet: fleet.txt debe enumerarlos en orden. Después restaura el inventario y el informe.
phrases.0: Distinguí la ejecución delegada de la ejecución por host.
phrases.1: Agregué datos de inventory en localhost.
phrases.2: Verifiqué una lista completa de flotas ordenadas.
diagnostics.absent_1: No existe /srv/site/fleet.txt en app1.
diagnostics.absent_2: No existe /srv/site/fleet.txt en app2.
diagnostics.absent_3: No existe /srv/site/fleet.txt en app3.
diagnostics.probe_0_3: 'Los datos actuales no permiten verificar este objetivo: El informe de la estación de trabajo
  sigue la pertenencia actual ordenada de la flota en vez de depender de una lista fija de hosts.'
