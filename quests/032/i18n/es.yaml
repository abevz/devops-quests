title: Delegación
brief: |-
  El informe compartido de la flota está incompleto.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Informe en la workstation:
    - Ruta: `~/quest/fleet.txt`.
    - Miembros actuales ordenados de fleet, un nombre por línea: `app1`, `app2`, `app3`.
    - Modo de acceso: `0644`.
    - Una operación de escritura configurada en la workstation.
  - Ausencia remota en todos los hosts administrados (`app1`, `app2`, `app3`):
    - `/srv/site/fleet.txt` no existe.

  **Verifica antes de Check & finish:**
  - `cat ~/quest/fleet.txt` — imprime app1, app2 y app3, uno por línea, en ese orden.
  - `ls -l ~/quest/fleet.txt` — muestra permisos `-rw-r--r--` del archivo en la workstation.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'test ! -e /srv/site/fleet.txt'` — devuelve rc=0 en cada host administrado: no hay informe remoto.
debrief: delegate_to seleccionó el workstation; run_once seleccionó un escritor.
stages.0.brief: Un informe completo ordenado debe quedar en la workstation.
stages.0.objectives.0.text: En la workstation, fleet.txt enumera app1, app2 y app3 ordenados, un nombre por línea.
stages.0.objectives.1.text: El archivo fleet.txt en la workstation tiene modo 0644.
stages.0.objectives.2.text: No existe `/srv/site/fleet.txt` en ningún host administrado (`app1`, `app2`, `app3`).
stages.0.objectives.3.text: El archivo fleet.txt en la workstation refleja los miembros actuales ordenados de fleet
  con una sola operación de escritura configurada.
hints.0.text: La delegación cambia de ubicación, no de host de iteraciones. El play suministrado sobrescribe el
  informe con un nombre por iteración de destino.
hints.1.text: groups["fleet"] contiene la membresía completa.
hints.2.text: run_once evita escrituras competitivas en una salida local compartida.
phrases.0: Distinguí la ejecución delegada de la ejecución por host.
phrases.1: Agregué datos de inventory en localhost.
phrases.2: Verifiqué una lista completa de flotas ordenadas.
diagnostics.absent_1: No existe /srv/site/fleet.txt en app1.
diagnostics.absent_2: No existe /srv/site/fleet.txt en app2.
diagnostics.absent_3: No existe /srv/site/fleet.txt en app3.
