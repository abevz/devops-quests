title: Delegación
brief: 'rollout.yml delega un resumen en localhost, pero cada objetivo lo sobrescribe con un nombre. Produzca
  un fleet.txt ordenado en el workstation: app1, app2, app3, uno por línea, modo 0644. Utilice membresía
  inventory en lugar de nombres codificados; no lo entregue a los objetivos.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `fleet.txt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: fleet.txt contiene el inventory completo y ordenado en localhost. Repare
  la tarea de copia única suministrada; delegarlo a localhost con run_once.'
debrief: delegate_to seleccionó el workstation; run_once seleccionó un escritor.
stages.0.brief: 'Criterios de éxito: fleet.txt contiene el inventory completo ordenado en localhost.'
stages.0.objectives.0.text: fleet.txt contiene el inventory completo ordenado en localhost.
hints.0.text: La delegación cambia de ubicación, no de host de iteraciones.
hints.1.text: groups["fleet"] contiene la membresía completa.
hints.2.text: run_once evita escrituras competitivas en una salida local compartida.
phrases.0: Distinguí la ejecución delegada de la ejecución por host.
phrases.1: Agregué datos de inventory en localhost.
phrases.2: Verifiqué una lista completa de flotas ordenadas.
