title: CronJob scheduling
brief: 'The route-audit CronJob is suspended and allows overlapping jobs. Unsuspend
  it and set concurrencyPolicy: Forbid, retaining its every-minute schedule, explicit
  Etc/UTC time zone, bounded deadline and history limits. Wait for one real scheduled
  execution; creating a manual Job is not the scheduled-run evidence. The goal checks
  a completed Job owned by this CronJob, its controller-assigned scheduled timestamp
  and north-104 in its log. Only this bay''s Kubernetes schedule changes; no host
  timer is involved.


  Quest files in `~/quest` (some appear in later stages): `cronjob.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: A real controller-scheduled run completes with north-104;
  suspension is off, overlap is forbidden and schedule/time zone/deadline limits remain
  intact.'
debrief: Scheduling was verified through an actual completed controller-owned execution,
  not a manual substitute.
stages.0.brief: 'Success criteria: A real controller-scheduled run completes with
  north-104; suspension is off, overlap is forbidden and schedule/time zone/deadline
  limits remain intact.'
stages.0.objectives.0.text: A real controller-scheduled run completes with north-104;
  suspension is off, overlap is forbidden and schedule/time zone/deadline limits remain
  intact.
hints.0.text: A suspended CronJob keeps its definition but starts no new scheduled
  Jobs.
hints.1.text: Forbid prevents this CronJob from overlapping its own active Jobs.
hints.2.text: Unsuspend, choose Forbid and wait for the controller-created Job with
  a scheduled timestamp.
phrases.0: I distinguished a Job from its scheduling controller.
phrases.1: I configured an explicit time zone and overlap policy.
phrases.2: I verified a real scheduled run and its completion.
questions.0.points.0: No; it applies only to Jobs belonging to this CronJob.
questions.0.points.1: Application-level locks may still be needed for shared work.
questions.0.prompt: Does Forbid block every other CronJob in the namespace?
questions.1.points.0: No; it tests the job template without testing controller scheduling.
questions.1.points.1: Verify ownership, scheduled time and actual completion.
questions.1.prompt: Is a manual Job proof that the schedule works?
