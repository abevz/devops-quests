title: CronJob scheduling
brief: 'Scheduled auditing is not producing the required result. Restore a real scheduled execution and its
  completion evidence.


  Work in `~/quest` on the workstation. Supplied files: `cronjob.yaml`.


  **Requirements:**

  - The existing scheduled audit runs once per minute in `Etc/UTC`, without overlapping its own runs and with
  a `20`-second late-start window.

  - CronJob `route-audit` has history limits of `1` successful Job and `1` failed Job.

  - The latest controller-scheduled Job of `route-audit` completes successfully once and logs exactly `north-104`.


  A manually created Job does not prove scheduling; a new minute may advance the latest time before its Job
  completes, so recheck after completion.

  '
debrief: Scheduling was verified through an actual completed controller-owned execution, not a manual substitute.
stages.0.brief: The latest controller-scheduled execution must complete with the required log output.
hints.0.text: A suspended CronJob keeps its definition but starts no new scheduled Jobs.
hints.1.text: 'Forbid prevents this CronJob from overlapping its own active Jobs.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Unsuspend, choose Forbid and wait for the controller-created Job with a scheduled timestamp.
  Example repair: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Verify the observed result:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Expect a real latest scheduled Job that completed once; its entire log is north-104. Replace the placeholder
  with that Job name.


  Supplied constraints and details: CronJob `route-audit` is enabled on a once-per-minute schedule in `Etc/UTC`,
  with concurrency policy `Forbid` and a `20`-second late-start deadline.'
phrases.0: I distinguished a Job from its scheduling controller.
phrases.1: I configured an explicit time zone and overlap policy.
phrases.2: I verified a real scheduled run and its completion.
questions.0.points.0: No; it applies only to Jobs belonging to this CronJob.
questions.0.points.1: Application-level locks may still be needed for shared work.
questions.0.prompt: Does Forbid block every other CronJob in the namespace?
questions.1.points.0: No; it tests the job template without testing controller scheduling.
questions.1.points.1: Verify ownership, scheduled time and actual completion.
questions.1.prompt: Is a manual Job proof that the schedule works?
diagnostics.last_time: cronjob/route-audit lastScheduleTime must be nonempty.
diagnostics.owned: A Job must have a controlling CronJob owner reference matching the nonempty route-audit
  UID.
diagnostics.scheduled: The latest scheduled run of CronJob `route-audit` must have a controller-owned Job.
diagnostics.succeeded: A Job for lastScheduleTime must have succeeded=1 and a nonempty name.
diagnostics.logs: The successful Job for lastScheduleTime must have nonempty name and logs equal to north-104.
diagnostics.field_suspend: cronjob/route-audit suspend must equal false.
diagnostics.field_schedule: cronjob/route-audit must run once per minute.
diagnostics.field_timezone: cronjob/route-audit timeZone must equal Etc/UTC.
diagnostics.field_concurrencypolicy: cronjob/route-audit concurrencyPolicy must equal Forbid.
diagnostics.field_startingdeadlineseconds: cronjob/route-audit startingDeadlineSeconds must equal 20.
diagnostics.field_successfuljobshistorylimit: cronjob/route-audit successfulJobsHistoryLimit must equal 1.
diagnostics.field_failedjobshistorylimit: cronjob/route-audit failedJobsHistoryLimit must equal 1.
stages.0.objectives.0.text: The existing scheduled audit runs once per minute in `Etc/UTC`, without overlapping
  its own runs and with a `20`-second late-start window.
stages.0.objectives.1.text: CronJob `route-audit` has history limits of `1` successful Job and `1` failed Job.
stages.0.objectives.2.text: The latest controller-scheduled Job of `route-audit` completes successfully once
  and logs exactly `north-104`.
