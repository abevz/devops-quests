title: CronJob scheduling
brief: A CronJob creates Jobs on a schedule. In `~/quest`, read `cronjob.json`; repair the existing `route-audit` CronJob
  in the private cluster. Set `suspend` to false and `concurrencyPolicy` to `Forbid`. Keep `schedule` as `* * * * *`, `timeZone`
  as `Etc/UTC`, `startingDeadlineSeconds` as 20, and both `successfulJobsHistoryLimit` and `failedJobsHistoryLimit` as 1.
  The deadline bounds late starts and history limits bound retained Jobs. For example, patch the two broken fields with `kubectl
  patch cronjob route-audit --type=merge -p '{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}'`. Wait for a real scheduled
  execution. The latest `status.lastScheduleTime` must match the owned successful Job annotation `batch.kubernetes.io/cronjob-scheduled-timestamp`;
  that Job's logs must be `north-104`. A manually created Job is not evidence of scheduling. A new minute may advance the
  latest time before its Job finishes; wait and check again. Work only in this bay.
debrief: Scheduling was verified through an actual completed controller-owned execution, not a manual substitute.
stages.0.brief: The CronJob settings match the brief, and its latest scheduled owned Job succeeds with `north-104` in its
  logs.
stages.0.objectives.0.text: The CronJob settings match the brief, and its latest scheduled owned Job succeeds with `north-104`
  in its logs.
hints.0.text: A suspended CronJob keeps its definition but starts no new scheduled Jobs.
hints.1.text: Forbid prevents this CronJob from overlapping its own active Jobs.
hints.2.text: Unsuspend, choose Forbid and wait for the controller-created Job with a scheduled timestamp.
phrases.0: I distinguished a Job from its scheduling controller.
phrases.1: I configured an explicit time zone and overlap policy.
phrases.2: I verified a real scheduled run and its completion.
questions.0.points.0: No; it applies only to Jobs belonging to this CronJob.
questions.0.points.1: Application-level locks may still be needed for shared work.
questions.0.prompt: Does Forbid block every other CronJob in the namespace?
questions.1.points.0: No; it tests the job template without testing controller scheduling.
questions.1.points.1: Verify ownership, scheduled time and actual completion.
questions.1.prompt: Is a manual Job proof that the schedule works?
