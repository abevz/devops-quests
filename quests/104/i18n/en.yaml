title: CronJob scheduling
brief: 'Scheduled auditing is not producing the required result. Restore a real scheduled execution and its
  completion evidence.


  Work in `~/quest` on the workstation. Supplied files: `cronjob.yaml`.


  **Requirements:**

  - The existing scheduled audit runs once per minute in `Etc/UTC`, without overlapping its own runs and with
  a `20`-second late-start window.

  - CronJob `route-audit` has history limits of `1` successful Job and `1` failed Job.

  - The latest controller-scheduled Job of `route-audit` completes successfully once and logs exactly `north-104`.


  A manually created Job does not prove scheduling; a new minute may advance the latest time before its Job
  completes, so recheck after completion.

  '
debrief: Scheduling was verified through an actual completed controller-owned execution, not a manual substitute.
stages.0.brief: The latest controller-scheduled execution must complete with the required log output.
hints.0.text: A suspended CronJob keeps its definition but starts no new scheduled Jobs.
hints.1.text: |-
  Forbid prevents this CronJob from overlapping its own active Jobs.

  Inspect the supplied definitions, current resources and events.

  Unsuspend, choose Forbid and wait for the controller-created Job with a scheduled timestamp. Example repair: `kubectl patch cronjob route-audit --type=merge -p '{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}'`.

  ```sh
  cat cronjob.yaml
  kubectl get cronjob route-audit -o yaml
  kubectl get jobs -o yaml
  ```
hints.2.text: |-
  Verify the observed result:

  ```sh
  kubectl get cronjob route-audit
  kubectl get jobs
  # Use the latest controller-created Job name from hint 2.
  kubectl logs job/JOB_NAME
  ```

  Expect a real latest scheduled Job that completed once; its entire log is north-104. Replace the placeholder with that Job name.

  Supplied constraints and details: CronJob `route-audit` is enabled on a once-per-minute schedule in `Etc/UTC`, with concurrency policy `Forbid` and a `20`-second late-start deadline.
phrases.0: I distinguished a Job from its scheduling controller.
phrases.1: I configured an explicit time zone and overlap policy.
phrases.2: I verified a real scheduled run and its completion.
questions.0.points.0: No; it applies only to Jobs belonging to this CronJob.
questions.0.points.1: Application-level locks may still be needed for shared work.
questions.0.prompt: Does Forbid block every other CronJob in the namespace?
questions.1.points.0: No; it tests the job template without testing controller scheduling.
questions.1.points.1: Verify ownership, scheduled time and actual completion.
questions.1.prompt: Is a manual Job proof that the schedule works?
stages.0.objectives.0.text: The existing scheduled audit runs once per minute in `Etc/UTC`, without overlapping
  its own runs and with a `20`-second late-start window.
stages.0.objectives.1.text: CronJob `route-audit` has history limits of `1` successful Job and `1` failed Job.
stages.0.objectives.2.text: The latest controller-scheduled Job of `route-audit` completes successfully once
  and logs exactly `north-104`.
diagnostics.field_suspend: The scheduled job may still be suspended. Inspect route-audit and set suspend explicitly to false so the controller can start future runs. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-suspension)
diagnostics.field_schedule: The schedule may omit some minutes or use an invalid five-field expression. Check that the effective schedule triggers every minute across hours, days and months. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-minute-schedule)
diagnostics.field_timezone: A manifest change may have removed the explicit time zone or chosen a local zone. Inspect the live timeZone and keep Etc/UTC. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-time-zone)
diagnostics.field_concurrencypolicy: The CronJob may still allow overlapping runs. Inspect concurrencyPolicy and use Forbid to skip a scheduled run while the preceding Job is active. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-overlap-policy)
diagnostics.field_startingdeadlineseconds: The delayed-start allowance may have been removed or changed. Inspect startingDeadlineSeconds and keep the 20-second limit. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-start-deadline)
diagnostics.field_successfuljobshistorylimit: A replacement manifest or missing field may retain a different number of successful Jobs. Preserve successfulJobsHistoryLimit at 1. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-success-history)
diagnostics.field_failedjobshistorylimit: The configuration may retain a different number of unsuccessful Jobs. Preserve failedJobsHistoryLimit at 1. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-failure-history)
diagnostics.last_time: The controller may not have scheduled a run yet because the CronJob is suspended or no qualifying minute has passed. Check the live lastScheduleTime after resuming. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-last-scheduled-time)
diagnostics.owned: A Job with the right name or label may belong to another controller or have been started manually. Compare the controller owner reference with the current route-audit UID. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-job-owner)
diagnostics.scheduled: The owned Jobs may come from earlier scheduled runs. Compare their scheduling annotation with the CronJob’s current lastScheduleTime. [Cause and check](guides#guide=kubernetes-workloads&section=q104-job-matches-schedule)
diagnostics.succeeded: The Job for the latest scheduled time may still be pending, running or failed. Check that a matching owned Job reports exactly one success. [Cause and check](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-completion)
diagnostics.logs: A matching successful Job can still emit the wrong value, or its logs may be unavailable. Read logs for the selected scheduled Job and compare with north-104. [Cause and check](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-output)
diagnostics.probe_0_0: The scheduling observer may stop before reporting a field when the local process or its inputs fail. Check the workstation tools and access to route-audit. [Cause and check](guides#guide=kubernetes-workloads&section=q104-cronjob-observer-input)
