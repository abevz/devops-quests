title: CronJob Planung
brief: 'Der route-audit CronJob ist suspendiert und ermöglicht überlappende Jobs. Heben Sie die Suspendierung
  auf und legen Sie concurrencyPolicy fest: Forbid, wobei der Minutenplan, die explizite Etc/UTC-Zeitzone
  und die begrenzten deadline- und history-Grenzwerte beibehalten werden. Warten Sie auf eine echte scheduled-Ausführung.
  Das Erstellen eines manuellen Job ist nicht der geplante Beweis. Das Ziel überprüft in seinem Protokoll
  einen abgeschlossenen Job, der diesem CronJob gehört, seinen Controller-zugewiesenen scheduled timestamp
  und north-104. Lediglich der Kubernetes-Fahrplan dieser Bucht ändert sich; Es ist kein Host-Timer beteiligt.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `cronjob.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Ein echter Controller-geplanter Lauf wird mit north-104 abgeschlossen; Die Aussetzung
  ist deaktiviert, Überlappungen sind verboten und die Grenzwerte für schedule/time zone/deadline bleiben
  erhalten.'
debrief: Die Planung wurde durch eine tatsächlich abgeschlossene Ausführung durch den Controller überprüft,
  nicht durch einen manuellen Ersatz.
stages.0.brief: 'Erfolgskriterien: Ein echter Controller-geplanter Lauf wird mit north-104 abgeschlossen;
  Die Aussetzung ist deaktiviert, Überlappungen sind verboten und die Grenzwerte für schedule/time zone/deadline
  bleiben erhalten.'
stages.0.objectives.0.text: Ein echter Controller-geplanter Lauf wird mit north-104 abgeschlossen. Die
  Aussetzung ist deaktiviert, Überlappungen sind verboten und die Grenzwerte für schedule/time zone/deadline
  bleiben erhalten.
hints.0.text: Ein angehaltener CronJob behält seine Definition bei, startet jedoch keine neuen geplanten
  Jobs.
hints.1.text: Forbid verhindert, dass dieser CronJob seine eigenen aktiven Jobs überlappt.
hints.2.text: Heben Sie die Suspendierung auf, wählen Sie Forbid und warten Sie auf den vom Controller
  erstellten Job mit einem scheduled timestamp.
phrases.0: Ich habe einen Job anhand seines Scheduling-Controllers unterschieden.
phrases.1: Ich habe eine explizite Zeitzonen- und Überschneidungsrichtlinie konfiguriert.
phrases.2: Ich habe einen echten geplanten Lauf und dessen Abschluss überprüft.
questions.0.points.0: NEIN; es gilt nur für Jobs, die zu diesem CronJob gehören.
questions.0.points.1: Für die gemeinsame Arbeit sind möglicherweise weiterhin Sperren auf Anwendungsebene
  erforderlich.
questions.0.prompt: Blockiert Forbid jeden zweiten CronJob im namespace?
questions.1.points.0: NEIN; Es testet die Jobvorlage, ohne die Controller-Planung zu testen.
questions.1.points.1: Überprüfen Sie den Besitz, die scheduled-Zeit und den tatsächlichen Abschluss.
questions.1.prompt: Ist ein manuelles Job ein Beweis dafür, dass der Zeitplan funktioniert?
