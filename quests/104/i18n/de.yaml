title: CronJob Planung
brief: 'Die geplante Prüfung liefert nicht das geforderte Ergebnis. Stellen Sie eine echte geplante Ausführung
  und deren Abschlussnachweis her.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `cronjob.yaml`.


  **Anforderungen:**

  - Das bestehende geplante Audit läuft einmal pro Minute in `Etc/UTC`, ohne eigene Läufe zu überlappen und
  mit einem Verspätungsfenster von `20` Sekunden.

  - CronJob `route-audit` hat Verlaufslimits von `1` erfolgreichen und `1` fehlgeschlagenen Job.

  - Der letzte vom Controller geplante Job von `route-audit` endet einmal erfolgreich und protokolliert genau
  `north-104`.


  Ein manuell erstellter Job belegt keine Planung; eine neue Minute kann die letzte Zeit vor Job-Abschluss
  weiterstellen, prüfen Sie danach erneut.

  '
debrief: Die Planung wurde durch eine tatsächlich abgeschlossene Ausführung durch den Controller überprüft,
  nicht durch einen manuellen Ersatz.
stages.0.brief: Die letzte vom Controller geplante Ausführung muss mit der geforderten Log-Ausgabe enden.
hints.0.text: Ein angehaltener CronJob behält seine Definition bei, startet jedoch keine neuen geplanten Jobs.
hints.1.text: 'Forbid verhindert, dass dieser CronJob seine eigenen aktiven Jobs überlappt.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Heben Sie die Aussetzung auf, wählen Sie Forbid und warten Sie auf den Controller-Job mit geplantem
  Zeitstempel. Beispielkorrektur: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Erwartet wird der tatsächliche neueste geplante Job mit einem erfolgreichen Abschluss; sein gesamtes Log
  ist north-104. Den Platzhalter durch diesen Jobnamen ersetzen.


  Mitgelieferte Einschränkungen und Details: CronJob `route-audit` ist mit minütlichem Zeitplan in `Etc/UTC`,
  Parallelitätsrichtlinie `Forbid` und Frist von `20` Sekunden für verspäteten Start aktiviert.'
phrases.0: Ich habe einen Job anhand seines Scheduling-Controllers unterschieden.
phrases.1: Ich habe eine explizite Zeitzonen- und Überschneidungsrichtlinie konfiguriert.
phrases.2: Ich habe einen echten geplanten Lauf und dessen Abschluss überprüft.
questions.0.points.0: NEIN; es gilt nur für Jobs, die zu diesem CronJob gehören.
questions.0.points.1: Für die gemeinsame Arbeit sind möglicherweise weiterhin Sperren auf Anwendungsebene erforderlich.
questions.0.prompt: Blockiert Forbid jeden zweiten CronJob im namespace?
questions.1.points.0: NEIN; Es testet die Jobvorlage, ohne die Controller-Planung zu testen.
questions.1.points.1: Überprüfen Sie den Besitz, die scheduled-Zeit und den tatsächlichen Abschluss.
questions.1.prompt: Ist ein manuelles Job ein Beweis dafür, dass der Zeitplan funktioniert?
diagnostics.last_time: cronjob/route-audit lastScheduleTime darf nicht leer sein.
diagnostics.owned: Ein Job muss einen kontrollierenden CronJob-Owner mit der nichtleeren UID von route-audit
  haben.
diagnostics.scheduled: Der letzte geplante Lauf von CronJob `route-audit` muss einen Job besitzen, der seinem
  Controller gehört.
diagnostics.succeeded: Ein Job für lastScheduleTime muss succeeded=1 und einen nichtleeren Namen haben.
diagnostics.logs: Der erfolgreiche Job für lastScheduleTime muss einen nichtleeren Namen und Logs gleich north-104
  haben.
diagnostics.field_suspend: cronjob/route-audit suspend muss false entsprechen.
diagnostics.field_schedule: cronjob/route-audit schedule muss * * * * * entsprechen.
diagnostics.field_timezone: cronjob/route-audit timeZone muss Etc/UTC entsprechen.
diagnostics.field_concurrencypolicy: cronjob/route-audit concurrencyPolicy muss Forbid entsprechen.
diagnostics.field_startingdeadlineseconds: cronjob/route-audit startingDeadlineSeconds muss 20 entsprechen.
diagnostics.field_successfuljobshistorylimit: cronjob/route-audit successfulJobsHistoryLimit muss 1 entsprechen.
diagnostics.field_failedjobshistorylimit: cronjob/route-audit failedJobsHistoryLimit muss 1 entsprechen.
stages.0.objectives.0.text: Das bestehende geplante Audit läuft einmal pro Minute in `Etc/UTC`, ohne eigene
  Läufe zu überlappen und mit einem Verspätungsfenster von `20` Sekunden.
stages.0.objectives.1.text: CronJob `route-audit` hat Verlaufslimits von `1` erfolgreichen und `1` fehlgeschlagenen
  Job.
stages.0.objectives.2.text: Der letzte vom Controller geplante Job von `route-audit` endet einmal erfolgreich
  und protokolliert genau `north-104`.
