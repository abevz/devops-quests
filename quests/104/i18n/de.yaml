title: CronJob Planung
brief: Ein CronJob erstellt Jobs nach einem Zeitplan. Lies in `~/quest` die Datei `cronjob.json` und repariere den vorhandenen
  CronJob `route-audit` im privaten Cluster. Setze `suspend` auf false und `concurrencyPolicy` auf `Forbid`. Belasse `schedule`
  auf `* * * * *`, `timeZone` auf `Etc/UTC`, `startingDeadlineSeconds` auf 20 sowie `successfulJobsHistoryLimit` und `failedJobsHistoryLimit`
  auf 1. Die Deadline begrenzt verspätete Starts, die History-Limits die aufbewahrten Jobs. Ändere die beiden Felder beispielsweise
  mit `kubectl patch cronjob route-audit --type=merge -p '{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}'`. Warte
  auf eine echte geplante Ausführung. Das neueste `status.lastScheduleTime` muss der Annotation `batch.kubernetes.io/cronjob-scheduled-timestamp`
  eines erfolgreichen, dem CronJob gehörenden Jobs entsprechen; dessen Logs müssen `north-104` sein. Ein manuell erstellter
  Job beweist die Planung nicht. Eine neue Minute kann die letzte Zeit vor Abschluss ihres Jobs ändern; warte und prüfe erneut.
  Arbeite nur in dieser Umgebung.
debrief: Die Planung wurde durch eine tatsächlich abgeschlossene Ausführung durch den Controller überprüft, nicht durch einen
  manuellen Ersatz.
stages.0.brief: Die CronJob-Einstellungen entsprechen der Beschreibung, und sein zuletzt geplanter eigener Job endet erfolgreich
  mit `north-104` im Log.
stages.0.objectives.0.text: Die CronJob-Einstellungen entsprechen der Beschreibung, und sein zuletzt geplanter eigener Job
  endet erfolgreich mit `north-104` im Log.
hints.0.text: Ein angehaltener CronJob behält seine Definition bei, startet jedoch keine neuen geplanten Jobs.
hints.1.text: Forbid verhindert, dass dieser CronJob seine eigenen aktiven Jobs überlappt.
hints.2.text: Heben Sie die Suspendierung auf, wählen Sie Forbid und warten Sie auf den vom Controller erstellten Job mit
  einem scheduled timestamp.
phrases.0: Ich habe einen Job anhand seines Scheduling-Controllers unterschieden.
phrases.1: Ich habe eine explizite Zeitzonen- und Überschneidungsrichtlinie konfiguriert.
phrases.2: Ich habe einen echten geplanten Lauf und dessen Abschluss überprüft.
questions.0.points.0: NEIN; es gilt nur für Jobs, die zu diesem CronJob gehören.
questions.0.points.1: Für die gemeinsame Arbeit sind möglicherweise weiterhin Sperren auf Anwendungsebene erforderlich.
questions.0.prompt: Blockiert Forbid jeden zweiten CronJob im namespace?
questions.1.points.0: NEIN; Es testet die Jobvorlage, ohne die Controller-Planung zu testen.
questions.1.points.1: Überprüfen Sie den Besitz, die scheduled-Zeit und den tatsächlichen Abschluss.
questions.1.prompt: Ist ein manuelles Job ein Beweis dafür, dass der Zeitplan funktioniert?
