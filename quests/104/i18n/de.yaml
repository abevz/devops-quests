title: CronJob Planung
brief: 'Die geplante Prüfung liefert nicht das geforderte Ergebnis. Stellen Sie eine echte geplante Ausführung
  und deren Abschlussnachweis her.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `cronjob.yaml`.


  **Anforderungen:**

  - Das bestehende geplante Audit läuft einmal pro Minute in `Etc/UTC`, ohne eigene Läufe zu überlappen und
  mit einem Verspätungsfenster von `20` Sekunden.

  - CronJob `route-audit` hat Verlaufslimits von `1` erfolgreichen und `1` fehlgeschlagenen Job.

  - Der letzte vom Controller geplante Job von `route-audit` endet einmal erfolgreich und protokolliert genau
  `north-104`.


  Ein manuell erstellter Job belegt keine Planung; eine neue Minute kann die letzte Zeit vor Job-Abschluss
  weiterstellen, prüfen Sie danach erneut.

  '
debrief: Die Planung wurde durch eine tatsächlich abgeschlossene Ausführung durch den Controller überprüft,
  nicht durch einen manuellen Ersatz.
stages.0.brief: Die letzte vom Controller geplante Ausführung muss mit der geforderten Log-Ausgabe enden.
hints.0.text: Ein angehaltener CronJob behält seine Definition bei, startet jedoch keine neuen geplanten Jobs.
hints.1.text: |-
  Forbid verhindert, dass dieser CronJob seine eigenen aktiven Jobs überlappt.

  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.

  Heben Sie die Aussetzung auf, wählen Sie Forbid und warten Sie auf den Controller-Job mit geplantem Zeitstempel. Beispielkorrektur: `kubectl patch cronjob route-audit --type=merge -p '{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}'`.

  ```sh
  cat cronjob.yaml
  kubectl get cronjob route-audit -o yaml
  kubectl get jobs -o yaml
  ```
hints.2.text: |-
  Prüfen Sie das beobachtete Ergebnis:

  ```sh
  kubectl get cronjob route-audit
  kubectl get jobs
  # Use the latest controller-created Job name from hint 2.
  kubectl logs job/JOB_NAME
  ```

  Erwartet wird der tatsächliche neueste geplante Job mit einem erfolgreichen Abschluss; sein gesamtes Log ist north-104. Den Platzhalter durch diesen Jobnamen ersetzen.

  Mitgelieferte Einschränkungen und Details: CronJob `route-audit` ist mit minütlichem Zeitplan in `Etc/UTC`, Parallelitätsrichtlinie `Forbid` und Frist von `20` Sekunden für verspäteten Start aktiviert.
phrases.0: Ich habe einen Job anhand seines Scheduling-Controllers unterschieden.
phrases.1: Ich habe eine explizite Zeitzonen- und Überschneidungsrichtlinie konfiguriert.
phrases.2: Ich habe einen echten geplanten Lauf und dessen Abschluss überprüft.
questions.0.points.0: NEIN; es gilt nur für Jobs, die zu diesem CronJob gehören.
questions.0.points.1: Für die gemeinsame Arbeit sind möglicherweise weiterhin Sperren auf Anwendungsebene erforderlich.
questions.0.prompt: Blockiert Forbid jeden zweiten CronJob im namespace?
questions.1.points.0: NEIN; Es testet die Jobvorlage, ohne die Controller-Planung zu testen.
questions.1.points.1: Überprüfen Sie den Besitz, die scheduled-Zeit und den tatsächlichen Abschluss.
questions.1.prompt: Ist ein manuelles Job ein Beweis dafür, dass der Zeitplan funktioniert?
stages.0.objectives.0.text: Das bestehende geplante Audit läuft einmal pro Minute in `Etc/UTC`, ohne eigene
  Läufe zu überlappen und mit einem Verspätungsfenster von `20` Sekunden.
stages.0.objectives.1.text: CronJob `route-audit` hat Verlaufslimits von `1` erfolgreichen und `1` fehlgeschlagenen
  Job.
stages.0.objectives.2.text: Der letzte vom Controller geplante Job von `route-audit` endet einmal erfolgreich
  und protokolliert genau `north-104`.
diagnostics.field_suspend: Der CronJob ist möglicherweise noch ausgesetzt. Prüfen Sie route-audit und setzen Sie suspend ausdrücklich auf false, damit der Controller weitere Läufe startet. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-suspension)
diagnostics.field_schedule: Der Zeitplan lässt möglicherweise Minuten aus oder enthält einen ungültigen Ausdruck mit fünf Feldern. Prüfen Sie, dass er in allen Stunden, Tagen und Monaten jede Minute auslöst. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-minute-schedule)
diagnostics.field_timezone: Eine Manifeständerung hat die Zeitzone möglicherweise entfernt oder auf eine lokale Zone gesetzt. Prüfen Sie timeZone und behalten Sie Etc/UTC bei. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-time-zone)
diagnostics.field_concurrencypolicy: Der CronJob erlaubt möglicherweise weiterhin überlappende Läufe. Prüfen Sie concurrencyPolicy und nutzen Sie Forbid, um einen Termin bei aktivem Job auszulassen. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-overlap-policy)
diagnostics.field_startingdeadlineseconds: Die Frist für einen verspäteten Start fehlt möglicherweise oder wurde geändert. Prüfen Sie startingDeadlineSeconds und behalten Sie 20 Sekunden bei. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-start-deadline)
diagnostics.field_successfuljobshistorylimit: Ein anderes Manifest oder ein fehlendes Feld bewahrt möglicherweise eine andere Anzahl erfolgreicher Jobs auf. Belassen Sie successfulJobsHistoryLimit bei 1. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-success-history)
diagnostics.field_failedjobshistorylimit: Die Konfiguration bewahrt möglicherweise eine andere Anzahl fehlgeschlagener Jobs auf. Belassen Sie failedJobsHistoryLimit bei 1. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-failure-history)
diagnostics.last_time: Der Controller hat möglicherweise noch keinen Lauf geplant, weil der CronJob ausgesetzt ist oder keine passende Minute erreicht wurde. Prüfen Sie lastScheduleTime nach dem Fortsetzen. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-last-scheduled-time)
diagnostics.owned: Ein Job mit passendem Namen oder Label gehört möglicherweise zu einem anderen Controller oder wurde manuell gestartet. Vergleichen Sie den Controller-Verweis mit der aktuellen UID von route-audit. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-job-owner)
diagnostics.scheduled: Zugehörige Jobs stammen möglicherweise von früheren Terminen. Vergleichen Sie ihre Zeitplan-Annotation mit dem aktuellen lastScheduleTime des CronJobs. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-job-matches-schedule)
diagnostics.succeeded: Der Job für den letzten Termin ist möglicherweise ausstehend, läuft oder ist fehlgeschlagen. Prüfen Sie, ob ein passender zugehöriger Job genau einen Erfolg meldet. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-completion)
diagnostics.logs: Ein passender erfolgreicher Job liefert möglicherweise einen anderen Wert oder seine Logs sind nicht erreichbar. Lesen Sie die Logs des ausgewählten Jobs und vergleichen Sie sie mit north-104. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-output)
diagnostics.probe_0_0: Die Zeitplanprüfung kann vor der Feldmeldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Werkzeuge und Zugriff auf route-audit. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q104-cronjob-observer-input)
