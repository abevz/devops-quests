stages.0.objectives.5.text: 'CronJob `route-audit`: aufbewahrte erfolgreiche Jobs `1`.'
stages.0.objectives.6.text: 'CronJob `route-audit`: aufbewahrte fehlgeschlagene Jobs `1`.'
