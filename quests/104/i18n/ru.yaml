title: Планирование CronJob
brief: 'Плановый аудит не выдаёт требуемый результат. Восстановите реальное выполнение по расписанию и доказательства
  его завершения.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `cronjob.yaml`.


  **Требования:**

  - Существующий плановый аудит запускается раз в минуту в `Etc/UTC`, без перекрытия собственных запусков и
  с окном опоздания `20` секунд.

  - Лимиты истории CronJob `route-audit` — `1` успешный Job и `1` неудачный Job.

  - Последний запланированный контроллером Job `route-audit` успешно завершается один раз и выводит в логи
  ровно `north-104`.


  Созданный вручную Job не доказывает запуск по расписанию; новая минута может обновить последнее время до
  завершения Job, поэтому проверьте снова после завершения.

  '
debrief: Расписание проверено по реальному завершённому заданию контроллера, без ручной подмены.
stages.0.brief: Последнее запланированное контроллером выполнение должно завершиться с требуемым выводом логов.
hints.0.text: Приостановленный CronJob хранит определение, но не создаёт новые задания по расписанию.
hints.1.text: 'Forbid предотвращает пересечение активных заданий этого CronJob.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Снимите приостановку, выберите Forbid и дождитесь Job контроллера с временной меткой расписания.
  Пример исправления: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Ожидается настоящий последний плановый Job, успешно выполненный один раз; весь его лог — north-104. Замените
  заполнитель именем этого Job.


  Поставленные ограничения и подробности: CronJob `route-audit` включён с запуском раз в минуту в `Etc/UTC`,
  политикой параллельных запусков `Forbid` и сроком позднего запуска `20` секунд.'
phrases.0: Я различил Job и контроллер расписания.
phrases.1: Я задал явный часовой пояс и политику пересечения.
phrases.2: Я проверил реальный запуск по расписанию и его завершение.
questions.0.points.0: 'Нет: правило относится только к заданиям данного CronJob.'
questions.0.points.1: Для общей работы могут дополнительно требоваться блокировки приложения.
questions.0.prompt: Блокирует ли Forbid остальные CronJob namespace?
questions.1.points.0: 'Нет: он проверяет шаблон задания, но не работу расписания контроллера.'
questions.1.points.1: Проверяйте владельца, scheduled time и фактическое завершение.
questions.1.prompt: Доказывает ли ручной Job работоспособность расписания?
stages.0.objectives.0.text: Существующий плановый аудит запускается раз в минуту в `Etc/UTC`, без перекрытия
  собственных запусков и с окном опоздания `20` секунд.
stages.0.objectives.1.text: Лимиты истории CronJob `route-audit` — `1` успешный Job и `1` неудачный Job.
stages.0.objectives.2.text: Последний запланированный контроллером Job `route-audit` успешно завершается один
  раз и выводит в логи ровно `north-104`.
diagnostics.field_suspend: 'CronJob мог остаться приостановленным. Проверьте route-audit и явно задайте suspend: false, чтобы контроллер запускал следующие задания. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-suspension)'
diagnostics.field_schedule: Расписание могло пропустить часть минут или содержать неверное выражение из пяти полей. Проверьте запуск каждую минуту во всех часах, днях и месяцах. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-minute-schedule)
diagnostics.field_timezone: При правке манифеста могли удалить явную часовую зону или выбрать местную. Проверьте timeZone в кластере и сохраните Etc/UTC. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-time-zone)
diagnostics.field_concurrencypolicy: CronJob мог всё ещё разрешать одновременные запуски. Проверьте concurrencyPolicy и задайте Forbid, чтобы пропускать запуск, пока предыдущий активен. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-overlap-policy)
diagnostics.field_startingdeadlineseconds: Допустимую задержку старта могли убрать или изменить. Проверьте startingDeadlineSeconds и сохраните лимит 20 секунд. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-start-deadline)
diagnostics.field_successfuljobshistorylimit: Новый манифест или пропущенное поле могли изменить число сохранённых успешных Job. Сохраните successfulJobsHistoryLimit равным 1. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-success-history)
diagnostics.field_failedjobshistorylimit: Конфигурация могла сохранять другое число неуспешных Job. Сохраните failedJobsHistoryLimit равным 1. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-failure-history)
diagnostics.last_time: Контроллер мог ещё не запланировать запуск из-за паузы либо потому, что нужная минута ещё не наступила. После возобновления проверьте lastScheduleTime. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-last-scheduled-time)
diagnostics.owned: Job с подходящим именем или меткой мог принадлежать другому контроллеру либо быть запущен вручную. Сравните ссылку на контроллер с текущим UID route-audit. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-job-owner)
diagnostics.scheduled: Job этого CronJob могли остаться от предыдущих запусков. Сравните аннотацию времени запуска с текущим lastScheduleTime у CronJob. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-job-matches-schedule)
diagnostics.succeeded: Job последнего запуска мог ещё ожидать, выполняться или завершиться ошибкой. Убедитесь, что подходящий Job этого CronJob сообщает ровно одно успешное завершение. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-completion)
diagnostics.logs: Подходящий успешный Job мог вывести другое значение, либо его логи недоступны. Прочитайте логи выбранного Job и сравните с north-104. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-output)
diagnostics.probe_0_0: Проверка расписания может прерваться до указания поля при ошибке процесса или входных данных. Проверьте инструменты и доступ к route-audit. [Причина и проверка](guides#guide=kubernetes-workloads&section=q104-cronjob-observer-input)
