title: Планирование CronJob
brief: CronJob создаёт Job по расписанию. В `~/quest` изучите `cronjob.json` и исправьте существующий CronJob `route-audit`
  в приватном кластере. Установите `suspend` в false и `concurrencyPolicy` в `Forbid`. Сохраните `schedule` как `* * * * *`,
  `timeZone` как `Etc/UTC`, `startingDeadlineSeconds` равным 20, а `successfulJobsHistoryLimit` и `failedJobsHistoryLimit`
  равными 1. Deadline ограничивает запоздалый запуск, а лимиты истории — число сохранённых Job. Например, измените два поля
  командой `kubectl patch cronjob route-audit --type=merge -p '{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}'`.
  Дождитесь настоящего запуска по расписанию. Последнее `status.lastScheduleTime` должно совпадать с аннотацией `batch.kubernetes.io/cronjob-scheduled-timestamp`
  успешного Job, принадлежащего CronJob; его журнал должен быть `north-104`. Ручной Job не доказывает работу расписания. С
  наступлением новой минуты последнее время может измениться до завершения Job; подождите и проверьте снова. Работайте только
  в этой песочнице.
debrief: Расписание проверено по реальному завершённому заданию контроллера, без ручной подмены.
stages.0.brief: Настройки CronJob соответствуют описанию, а его последний запланированный Job успешно завершается с `north-104`
  в журнале.
stages.0.objectives.0.text: Настройки CronJob соответствуют описанию, а его последний запланированный Job успешно завершается
  с `north-104` в журнале.
hints.0.text: Приостановленный CronJob хранит определение, но не создаёт новые задания по расписанию.
hints.1.text: Forbid предотвращает пересечение активных заданий этого CronJob.
hints.2.text: Снимите suspend, выберите Forbid и дождитесь Job контроллера со scheduled timestamp.
phrases.0: Я различил Job и контроллер расписания.
phrases.1: Я задал явный часовой пояс и политику пересечения.
phrases.2: Я проверил реальный запуск по расписанию и его завершение.
questions.0.points.0: 'Нет: правило относится только к заданиям данного CronJob.'
questions.0.points.1: Для общей работы могут дополнительно требоваться блокировки приложения.
questions.0.prompt: Блокирует ли Forbid остальные CronJob namespace?
questions.1.points.0: 'Нет: он проверяет шаблон задания, но не работу расписания контроллера.'
questions.1.points.1: Проверяйте владельца, scheduled time и фактическое завершение.
questions.1.prompt: Доказывает ли ручной Job работоспособность расписания?
