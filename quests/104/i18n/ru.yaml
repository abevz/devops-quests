stages.0.objectives.3.text: 'CronJob `route-audit`: политика параллельных запусков `Forbid`.'
stages.0.objectives.4.text: 'CronJob `route-audit`: срок позднего запуска в секундах `20`.'
stages.0.objectives.5.text: 'CronJob `route-audit`: сохраняемые успешные Job `1`.'
stages.0.objectives.6.text: 'CronJob `route-audit`: сохраняемые неудачные Job `1`.'
