title: Планирование CronJob
brief: 'Плановый аудит не выдаёт требуемый результат. Восстановите реальное выполнение по расписанию и доказательства
  его завершения.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `cronjob.yaml`.


  **Требования:**

  - Существующий плановый аудит запускается раз в минуту в `Etc/UTC`, без перекрытия собственных запусков и
  с окном опоздания `20` секунд.

  - Лимиты истории CronJob `route-audit` — `1` успешный Job и `1` неудачный Job.

  - Последний запланированный контроллером Job `route-audit` успешно завершается один раз и выводит в логи
  ровно `north-104`.


  Созданный вручную Job не доказывает запуск по расписанию; новая минута может обновить последнее время до
  завершения Job, поэтому проверьте снова после завершения.

  '
debrief: Расписание проверено по реальному завершённому заданию контроллера, без ручной подмены.
stages.0.brief: Последнее запланированное контроллером выполнение должно завершиться с требуемым выводом логов.
hints.0.text: Приостановленный CronJob хранит определение, но не создаёт новые задания по расписанию.
hints.1.text: 'Forbid предотвращает пересечение активных заданий этого CronJob.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Снимите приостановку, выберите Forbid и дождитесь Job контроллера с временной меткой расписания.
  Пример исправления: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Ожидается настоящий последний плановый Job, успешно выполненный один раз; весь его лог — north-104. Замените
  заполнитель именем этого Job.


  Поставленные ограничения и подробности: CronJob `route-audit` включён с запуском раз в минуту в `Etc/UTC`,
  политикой параллельных запусков `Forbid` и сроком позднего запуска `20` секунд.'
phrases.0: Я различил Job и контроллер расписания.
phrases.1: Я задал явный часовой пояс и политику пересечения.
phrases.2: Я проверил реальный запуск по расписанию и его завершение.
questions.0.points.0: 'Нет: правило относится только к заданиям данного CronJob.'
questions.0.points.1: Для общей работы могут дополнительно требоваться блокировки приложения.
questions.0.prompt: Блокирует ли Forbid остальные CronJob namespace?
questions.1.points.0: 'Нет: он проверяет шаблон задания, но не работу расписания контроллера.'
questions.1.points.1: Проверяйте владельца, scheduled time и фактическое завершение.
questions.1.prompt: Доказывает ли ручной Job работоспособность расписания?
diagnostics.last_time: cronjob/route-audit lastScheduleTime должен быть непустым.
diagnostics.owned: У Job должна быть ссылка на управляющий CronJob с непустым UID route-audit.
diagnostics.scheduled: У последнего запланированного запуска CronJob `route-audit` должен быть Job, принадлежащий
  его контроллеру.
diagnostics.succeeded: У Job для lastScheduleTime должны быть succeeded=1 и непустое имя.
diagnostics.logs: У успешного Job для lastScheduleTime должно быть непустое имя, а логи должны совпадать с
  north-104.
diagnostics.field_suspend: cronjob/route-audit suspend должен совпадать с false.
diagnostics.field_schedule: cronjob/route-audit должен запускаться раз в минуту.
diagnostics.field_timezone: cronjob/route-audit timeZone должен совпадать с Etc/UTC.
diagnostics.field_concurrencypolicy: cronjob/route-audit concurrencyPolicy должен совпадать с Forbid.
diagnostics.field_startingdeadlineseconds: cronjob/route-audit startingDeadlineSeconds должен совпадать с 20.
diagnostics.field_successfuljobshistorylimit: cronjob/route-audit successfulJobsHistoryLimit должен совпадать
  с 1.
diagnostics.field_failedjobshistorylimit: cronjob/route-audit failedJobsHistoryLimit должен совпадать с 1.
stages.0.objectives.0.text: Существующий плановый аудит запускается раз в минуту в `Etc/UTC`, без перекрытия
  собственных запусков и с окном опоздания `20` секунд.
stages.0.objectives.1.text: Лимиты истории CronJob `route-audit` — `1` успешный Job и `1` неудачный Job.
stages.0.objectives.2.text: Последний запланированный контроллером Job `route-audit` успешно завершается один
  раз и выводит в логи ровно `north-104`.
diagnostics.probe_0_0: 'Текущие данные не позволили проверить эту цель: Существующий плановый аудит запускается
  раз в минуту в `Etc/UTC`, без перекрытия собственных запусков и с окном опоздания `20` секунд.'
