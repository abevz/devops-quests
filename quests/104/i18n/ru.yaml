title: Планирование CronJob
brief: 'CronJob route-audit приостановлен и допускает пересекающиеся задания. Снимите suspend и задайте
  concurrencyPolicy: Forbid, сохранив запуск каждую минуту, явный часовой пояс Etc/UTC, ограниченные deadline
  и history. Дождитесь одного настоящего запуска по расписанию; ручной Job не подтверждает расписание.
  Проверка использует завершённый Job этого CronJob, назначенный контроллером scheduled timestamp и north-104
  в журнале. Меняется только расписание Kubernetes этой песочницы, без таймеров хоста.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `cronjob.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Реальный запуск контроллера по расписанию завершился с north-104; suspend снят,
  пересечение запрещено, ограничения расписания, часового пояса и deadline сохранены.'
debrief: Расписание проверено по реальному завершённому заданию контроллера, без ручной подмены.
stages.0.brief: 'Реальный запуск контроллера по расписанию завершился с north-104; suspend снят, пересечение
  запрещено, ограничения расписания, часового пояса и deadline сохранены.


  Результат проверки: Реальный запуск контроллера по расписанию завершился с north-104; suspend снят,
  пересечение запрещено, ограничения расписания, часового пояса и deadline сохранены.'
stages.0.objectives.0.text: Реальный запуск контроллера по расписанию завершился с north-104; suspend
  снят, пересечение запрещено, ограничения расписания, часового пояса и deadline сохранены.
hints.0.text: Приостановленный CronJob хранит определение, но не создаёт новые задания по расписанию.
hints.1.text: Forbid предотвращает пересечение активных заданий этого CronJob.
hints.2.text: Снимите suspend, выберите Forbid и дождитесь Job контроллера со scheduled timestamp.
phrases.0: Я различил Job и контроллер расписания.
phrases.1: Я задал явный часовой пояс и политику пересечения.
phrases.2: Я проверил реальный запуск по расписанию и его завершение.
questions.0.points.0: 'Нет: правило относится только к заданиям данного CronJob.'
questions.0.points.1: Для общей работы могут дополнительно требоваться блокировки приложения.
questions.0.prompt: Блокирует ли Forbid остальные CronJob namespace?
questions.1.points.0: 'Нет: он проверяет шаблон задания, но не работу расписания контроллера.'
questions.1.points.1: Проверяйте владельца, scheduled time и фактическое завершение.
questions.1.prompt: Доказывает ли ручной Job работоспособность расписания?
