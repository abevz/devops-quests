title: Programación CronJob
brief: 'El route-audit CronJob está suspendido y permite superponer trabajos. Anímelo y configura concurrencyPolicy:
  Forbid, conservando su programación cada minuto, la zona horaria Etc/UTC explícita y los límites acotados
  de deadline y history. Espere una ejecución real de scheduled; La creación de un Job manual no es la
  evidencia de ejecución programada. El objetivo verifica un Job completo propiedad de este CronJob, su
  scheduled timestamp asignado por el controlador y north-104 en su registro. Sólo cambia el horario Kubernetes
  de esta bahía; no hay ningún temporizador de host involucrado.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `cronjob.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: una ejecución real programada por el controlador se completa con north-104;
  la suspensión está desactivada, el solapamiento está prohibido y los límites schedule/time zone/deadline
  permanecen intactos.'
debrief: La programación se verificó mediante una ejecución real completada por el controlador, no un
  sustituto manual.
stages.0.brief: 'Criterios de éxito: una ejecución real programada por el controlador se completa con
  north-104; la suspensión está desactivada, el solapamiento está prohibido y los límites schedule/time
  zone/deadline permanecen intactos.'
stages.0.objectives.0.text: Una ejecución real programada por el controlador se completa con north-104;
