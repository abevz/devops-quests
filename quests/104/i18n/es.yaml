title: Programación CronJob
brief: "La auditoría programada no produce el resultado requerido. Recupera una ejecución programada real y sus\
  \ pruebas de finalización.\n\nTrabaja en `~/quest` en la workstation. Archivos suministrados: `cronjob.json`.\n\
  \n**Requisitos:**\n- El CronJob `route-audit` no está suspendido.\n- CronJob `route-audit`:\n  - horario `* *\
  \ * * *`.\n- CronJob `route-audit`:\n  - zona horaria `Etc/UTC`.\n- CronJob `route-audit`:\n  - política de concurrencia\
  \ `Forbid`.\n- CronJob `route-audit`:\n  - plazo de inicio tardío en segundos `20`.\n- CronJob `route-audit`:\n\
  \  - Jobs exitosos conservados `1`.\n- CronJob `route-audit`:\n  - Jobs fallidos conservados `1`.\n- La última\
  \ hora programada del CronJob `route-audit` coincide con la marca de tiempo programada del Job que controla.\n\
  - Ese último Job programado termina correctamente una vez y sus logs contienen exactamente `north-104`.\n\n**Verifica\
  \ antes de Check & finish:**\nEjecuta estos comandos de observación desde `~/quest` en la workstation; `kubectl\
  \ exec` observa el contenedor de la carga indicada.\n- `kubectl get cronjob route-audit -o yaml` — Los ajustes,\
  \ la identidad y el estado coinciden con Requisitos.\n- `kubectl get jobs -o json` — El último Job programado\
  \ pertenece al controlador y su marca de tiempo coincide con la última hora programada del CronJob.\n- Los logs\
  \ del Job programado seleccionado contienen exactamente `north-104`.\n\n  ```sh\n  cron=$(kubectl get cronjob\
  \ route-audit -o json)\n  uid=$(jq -r .metadata.uid <<<\"$cron\")\n  at=$(jq -r .status.lastScheduleTime <<<\"\
  $cron\")\n  job=$(kubectl get jobs -o json | jq -r --arg uid \"$uid\" --arg at \"$at\" '.items[] | select(any(.metadata.ownerReferences[]?;\
  \ .uid==$uid and .controller==true)) | select(.metadata.annotations[\"batch.kubernetes.io/cronjob-scheduled-timestamp\"\
  ]==$at) | .metadata.name' | head -1)\n  kubectl logs \"job/$job\"\n  ```\n\nUn Job creado manualmente no demuestra\
  \ programación; un nuevo minuto puede avanzar la última hora antes de que termine su Job, así que vuelve a comprobar\
  \ al finalizar.\n"
debrief: La programación se verificó mediante una ejecución real completada por el controlador, no un sustituto
  manual.
stages.0.brief: 'La última ejecución programada por el controlador debe terminar con los logs requeridos.

  '
hints.0.text: Un CronJob suspendido mantiene su definición pero no inicia ningún nuevo trabajo programado.
hints.1.text: Forbid evita que este CronJob superponga sus propios trabajos activos.
hints.2.text: 'Quita la suspensión, elige Forbid y espera al Job del controlador con marca programada. Ejemplo de
  corrección: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.

  '
phrases.0: Distinguí un Job de su controlador de programación.
phrases.1: Configuré una zona horaria explícita y una política de superposición.
phrases.2: Verifiqué una ejecución programada real y su finalización.
questions.0.points.0: No; se aplica únicamente a trabajos que pertenecen a este CronJob.
questions.0.points.1: Es posible que aún se necesiten bloqueos a nivel de aplicación para el trabajo compartido.
questions.0.prompt: ¿Forbid bloquea todos los demás CronJob en el namespace?
questions.1.points.0: No; prueba la plantilla de trabajo sin probar la programación del controlador.
questions.1.points.1: Verifique la propiedad, el tiempo de scheduled y la finalización real.
questions.1.prompt: ¿Es un manual Job una prueba de que el cronograma funciona?
diagnostics.last_time: cronjob/route-audit lastScheduleTime no debe estar vacío.
diagnostics.owned: Un Job debe tener una referencia de propietario controlador CronJob con el UID no vacío de route-audit.
diagnostics.scheduled: Un Job perteneciente al CronJob debe tener una marca de programación igual a lastScheduleTime
  no vacío.
diagnostics.succeeded: Un Job para lastScheduleTime debe tener succeeded=1 y nombre no vacío.
diagnostics.logs: El Job exitoso de lastScheduleTime debe tener nombre no vacío y logs iguales a north-104.
diagnostics.field_suspend: cronjob/route-audit suspend debe ser igual a false.
diagnostics.field_schedule: cronjob/route-audit schedule debe ser igual a * * * * *.
diagnostics.field_timezone: cronjob/route-audit timeZone debe ser igual a Etc/UTC.
diagnostics.field_concurrencypolicy: cronjob/route-audit concurrencyPolicy debe ser igual a Forbid.
diagnostics.field_startingdeadlineseconds: cronjob/route-audit startingDeadlineSeconds debe ser igual a 20.
diagnostics.field_successfuljobshistorylimit: cronjob/route-audit successfulJobsHistoryLimit debe ser igual a 1.
diagnostics.field_failedjobshistorylimit: cronjob/route-audit failedJobsHistoryLimit debe ser igual a 1.
stages.0.objectives.0.text: El CronJob `route-audit` no está suspendido.
stages.0.objectives.1.text: 'CronJob `route-audit`: horario `* * * * *`.'
stages.0.objectives.2.text: 'CronJob `route-audit`: zona horaria `Etc/UTC`.'
stages.0.objectives.3.text: 'CronJob `route-audit`: política de concurrencia `Forbid`.'
stages.0.objectives.4.text: 'CronJob `route-audit`: plazo de inicio tardío en segundos `20`.'
stages.0.objectives.5.text: 'CronJob `route-audit`: Jobs exitosos conservados `1`.'
stages.0.objectives.6.text: 'CronJob `route-audit`: Jobs fallidos conservados `1`.'
stages.0.objectives.7.text: La última hora programada del CronJob `route-audit` coincide con la marca de tiempo
  programada del Job que controla.
stages.0.objectives.8.text: Ese último Job programado termina correctamente una vez y sus logs contienen exactamente
  `north-104`.
