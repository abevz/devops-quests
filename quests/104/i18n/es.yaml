title: Programación CronJob
brief: 'La auditoría programada no produce el resultado requerido. Recupera una ejecución programada real y
  sus pruebas de finalización.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `cronjob.yaml`.


  **Requisitos:**

  - La auditoría programada existente se ejecuta una vez por minuto en `Etc/UTC`, sin solapar sus propias ejecuciones
  y con una ventana de retraso de `20` segundos.

  - El CronJob `route-audit` tiene límites de historial de `1` Job exitoso y `1` fallido.

  - El último Job de `route-audit` programado por el controlador termina correctamente una vez y registra exactamente
  `north-104`.


  Un Job creado manualmente no demuestra programación; un nuevo minuto puede avanzar la última hora antes de
  que termine su Job, así que vuelve a comprobar al finalizar.

  '
debrief: La programación se verificó mediante una ejecución real completada por el controlador, no un sustituto
  manual.
stages.0.brief: La última ejecución programada por el controlador debe terminar con los logs requeridos.
hints.0.text: Un CronJob suspendido mantiene su definición pero no inicia ningún nuevo trabajo programado.
hints.1.text: 'Forbid evita que este CronJob superponga sus propios trabajos activos.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Quita la suspensión, elige Forbid y espera al Job del controlador con marca programada. Ejemplo
  de corrección: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Verifica el resultado observado:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Se espera el último Job realmente programado, completado una vez; su log completo es north-104. Sustituye
  el marcador por el nombre de ese Job.


  Restricciones y detalles suministrados: El CronJob `route-audit` está habilitado cada minuto en `Etc/UTC`,
  con política de concurrencia `Forbid` y plazo de inicio tardío de `20` segundos.'
phrases.0: Distinguí un Job de su controlador de programación.
phrases.1: Configuré una zona horaria explícita y una política de superposición.
phrases.2: Verifiqué una ejecución programada real y su finalización.
questions.0.points.0: No; se aplica únicamente a trabajos que pertenecen a este CronJob.
questions.0.points.1: Es posible que aún se necesiten bloqueos a nivel de aplicación para el trabajo compartido.
questions.0.prompt: ¿Forbid bloquea todos los demás CronJob en el namespace?
questions.1.points.0: No; prueba la plantilla de trabajo sin probar la programación del controlador.
questions.1.points.1: Verifique la propiedad, el tiempo de scheduled y la finalización real.
questions.1.prompt: ¿Es un manual Job una prueba de que el cronograma funciona?
diagnostics.last_time: cronjob/route-audit lastScheduleTime no debe estar vacío.
diagnostics.owned: Un Job debe tener una referencia de propietario controlador CronJob con el UID no vacío
  de route-audit.
diagnostics.scheduled: La última ejecución programada del CronJob `route-audit` debe tener un Job perteneciente
  a su controlador.
diagnostics.succeeded: Un Job para lastScheduleTime debe tener succeeded=1 y nombre no vacío.
diagnostics.logs: El Job exitoso de lastScheduleTime debe tener nombre no vacío y logs iguales a north-104.
diagnostics.field_suspend: cronjob/route-audit suspend debe ser igual a false.
diagnostics.field_schedule: cronjob/route-audit debe ejecutarse una vez por minuto.
diagnostics.field_timezone: cronjob/route-audit timeZone debe ser igual a Etc/UTC.
diagnostics.field_concurrencypolicy: cronjob/route-audit concurrencyPolicy debe ser igual a Forbid.
diagnostics.field_startingdeadlineseconds: cronjob/route-audit startingDeadlineSeconds debe ser igual a 20.
diagnostics.field_successfuljobshistorylimit: cronjob/route-audit successfulJobsHistoryLimit debe ser igual
  a 1.
diagnostics.field_failedjobshistorylimit: cronjob/route-audit failedJobsHistoryLimit debe ser igual a 1.
stages.0.objectives.0.text: La auditoría programada existente se ejecuta una vez por minuto en `Etc/UTC`, sin
  solapar sus propias ejecuciones y con una ventana de retraso de `20` segundos.
stages.0.objectives.1.text: El CronJob `route-audit` tiene límites de historial de `1` Job exitoso y `1` fallido.
stages.0.objectives.2.text: El último Job de `route-audit` programado por el controlador termina correctamente
  una vez y registra exactamente `north-104`.
