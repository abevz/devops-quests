title: Programación CronJob
brief: Un CronJob crea Jobs según un horario. En `~/quest`, lee `cronjob.json`; repara el CronJob `route-audit` existente
  en el clúster privado. Establece `suspend` en false y `concurrencyPolicy` en `Forbid`. Mantén `schedule` como `* * * * *`,
  `timeZone` como `Etc/UTC`, `startingDeadlineSeconds` en 20 y tanto `successfulJobsHistoryLimit` como `failedJobsHistoryLimit`
  en 1. El plazo limita inicios tardíos y los límites de historial, los Jobs conservados. Por ejemplo, modifica los dos campos
  con `kubectl patch cronjob route-audit --type=merge -p '{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}'`. Espera
  una ejecución programada real. El último `status.lastScheduleTime` debe coincidir con la anotación `batch.kubernetes.io/cronjob-scheduled-timestamp`
  del Job exitoso que pertenece al CronJob; sus logs deben ser `north-104`. Un Job manual no demuestra la programación. Un
  nuevo minuto puede adelantar la última hora antes de que termine su Job; espera y vuelve a comprobar. Trabaja solo en esta
  bahía.
debrief: La programación se verificó mediante una ejecución real completada por el controlador, no un sustituto manual.
stages.0.brief: La configuración del CronJob coincide con la descripción y su último Job programado termina con `north-104`
  en los logs.
stages.0.objectives.0.text: La configuración del CronJob coincide con la descripción y su último Job programado termina con
  `north-104` en los logs.
hints.0.text: Un CronJob suspendido mantiene su definición pero no inicia ningún nuevo trabajo programado.
hints.1.text: Forbid evita que este CronJob superponga sus propios trabajos activos.
hints.2.text: Dessuspender, elija Forbid y espere el Job creado por el controlador con un scheduled timestamp.
phrases.0: Distinguí un Job de su controlador de programación.
phrases.1: Configuré una zona horaria explícita y una política de superposición.
phrases.2: Verifiqué una ejecución programada real y su finalización.
questions.0.points.0: No; se aplica únicamente a trabajos que pertenecen a este CronJob.
questions.0.points.1: Es posible que aún se necesiten bloqueos a nivel de aplicación para el trabajo compartido.
questions.0.prompt: ¿Forbid bloquea todos los demás CronJob en el namespace?
questions.1.points.0: No; prueba la plantilla de trabajo sin probar la programación del controlador.
questions.1.points.1: Verifique la propiedad, el tiempo de scheduled y la finalización real.
questions.1.prompt: ¿Es un manual Job una prueba de que el cronograma funciona?
