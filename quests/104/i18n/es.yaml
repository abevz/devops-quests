title: Programación CronJob
brief: 'La auditoría programada no produce el resultado requerido. Recupera una ejecución programada real y
  sus pruebas de finalización.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `cronjob.yaml`.


  **Requisitos:**

  - La auditoría programada existente se ejecuta una vez por minuto en `Etc/UTC`, sin solapar sus propias ejecuciones
  y con una ventana de retraso de `20` segundos.

  - El CronJob `route-audit` tiene límites de historial de `1` Job exitoso y `1` fallido.

  - El último Job de `route-audit` programado por el controlador termina correctamente una vez y registra exactamente
  `north-104`.


  Un Job creado manualmente no demuestra programación; un nuevo minuto puede avanzar la última hora antes de
  que termine su Job, así que vuelve a comprobar al finalizar.

  '
debrief: La programación se verificó mediante una ejecución real completada por el controlador, no un sustituto
  manual.
stages.0.brief: La última ejecución programada por el controlador debe terminar con los logs requeridos.
hints.0.text: Un CronJob suspendido mantiene su definición pero no inicia ningún nuevo trabajo programado.
hints.1.text: 'Forbid evita que este CronJob superponga sus propios trabajos activos.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Quita la suspensión, elige Forbid y espera al Job del controlador con marca programada. Ejemplo
  de corrección: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Verifica el resultado observado:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Se espera el último Job realmente programado, completado una vez; su log completo es north-104. Sustituye
  el marcador por el nombre de ese Job.


  Restricciones y detalles suministrados: El CronJob `route-audit` está habilitado cada minuto en `Etc/UTC`,
  con política de concurrencia `Forbid` y plazo de inicio tardío de `20` segundos.'
phrases.0: Distinguí un Job de su controlador de programación.
phrases.1: Configuré una zona horaria explícita y una política de superposición.
phrases.2: Verifiqué una ejecución programada real y su finalización.
questions.0.points.0: No; se aplica únicamente a trabajos que pertenecen a este CronJob.
questions.0.points.1: Es posible que aún se necesiten bloqueos a nivel de aplicación para el trabajo compartido.
questions.0.prompt: ¿Forbid bloquea todos los demás CronJob en el namespace?
questions.1.points.0: No; prueba la plantilla de trabajo sin probar la programación del controlador.
questions.1.points.1: Verifique la propiedad, el tiempo de scheduled y la finalización real.
questions.1.prompt: ¿Es un manual Job una prueba de que el cronograma funciona?
stages.0.objectives.0.text: La auditoría programada existente se ejecuta una vez por minuto en `Etc/UTC`, sin
  solapar sus propias ejecuciones y con una ventana de retraso de `20` segundos.
stages.0.objectives.1.text: El CronJob `route-audit` tiene límites de historial de `1` Job exitoso y `1` fallido.
stages.0.objectives.2.text: El último Job de `route-audit` programado por el controlador termina correctamente
  una vez y registra exactamente `north-104`.
diagnostics.field_suspend: 'El CronJob puede seguir suspendido. Revise route-audit y configure suspend: false explícitamente para permitir próximas ejecuciones. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-suspension)'
diagnostics.field_schedule: El calendario puede omitir minutos o usar una expresión inválida de cinco campos. Compruebe que se ejecute cada minuto en todas las horas, días y meses. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-minute-schedule)
diagnostics.field_timezone: Un cambio puede haber eliminado la zona explícita o elegido una zona local. Revise timeZone en el objeto activo y conserve Etc/UTC. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-time-zone)
diagnostics.field_concurrencypolicy: El CronJob puede seguir permitiendo ejecuciones simultáneas. Revise concurrencyPolicy y use Forbid para omitir el turno si hay un Job activo. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-overlap-policy)
diagnostics.field_startingdeadlineseconds: El margen para iniciar tarde puede faltar o haber cambiado. Revise startingDeadlineSeconds y mantenga 20 segundos. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-start-deadline)
diagnostics.field_successfuljobshistorylimit: Otro manifiesto o un campo omitido puede retener otro número de Jobs exitosos. Mantenga successfulJobsHistoryLimit en 1. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-success-history)
diagnostics.field_failedjobshistorylimit: La configuración puede retener otro número de Jobs fallidos. Mantenga failedJobsHistoryLimit en 1. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-failure-history)
diagnostics.last_time: El controlador puede no haber programado una ejecución por suspensión o porque aún no ha pasado un minuto válido. Tras reanudar, revise lastScheduleTime. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-last-scheduled-time)
diagnostics.owned: Un Job con nombre o etiqueta coincidente puede pertenecer a otro controlador o haberse iniciado manualmente. Compare la referencia del controlador con el UID actual de route-audit. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-job-owner)
diagnostics.scheduled: Los Jobs propios pueden corresponder a ejecuciones anteriores. Compare la anotación de planificación con el lastScheduleTime actual del CronJob. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-job-matches-schedule)
diagnostics.succeeded: El Job del último turno puede estar pendiente, en ejecución o fallido. Compruebe que un Job propio coincidente indique exactamente un éxito. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-completion)
diagnostics.logs: Un Job exitoso coincidente puede emitir otro valor o no tener logs disponibles. Lea los logs del Job elegido y compárelos con north-104. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-output)
diagnostics.probe_0_0: El observador puede detenerse antes de indicar un campo si falla el proceso o su entrada. Revise las herramientas y el acceso a route-audit. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q104-cronjob-observer-input)
