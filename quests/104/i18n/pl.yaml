title: Planowanie CronJob
brief: CronJob tworzy Joby według harmonogramu. W `~/quest` przeczytaj `cronjob.json`; napraw istniejący CronJob `route-audit`
  w prywatnym klastrze. Ustaw `suspend` na false i `concurrencyPolicy` na `Forbid`. Zachowaj `schedule` jako `* * * * *`,
  `timeZone` jako `Etc/UTC`, `startingDeadlineSeconds` jako 20 oraz `successfulJobsHistoryLimit` i `failedJobsHistoryLimit`
  jako 1. Deadline ogranicza opóźniony start, a limity historii liczbę zachowanych Jobów. Na przykład popraw oba pola poleceniem
  `kubectl patch cronjob route-audit --type=merge -p '{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}'`. Poczekaj
  na rzeczywiste uruchomienie z harmonogramu. Najnowszy `status.lastScheduleTime` musi odpowiadać adnotacji `batch.kubernetes.io/cronjob-scheduled-timestamp`
  pomyślnego Joba należącego do CronJob; jego logi muszą zawierać `north-104`. Job utworzony ręcznie nie dowodzi działania
  harmonogramu. Nowa minuta może przesunąć ostatni czas przed zakończeniem Joba; poczekaj i sprawdź ponownie. Pracuj tylko
  w tej zatoce.
debrief: Planowanie zostało zweryfikowane poprzez faktycznie ukończone wykonanie należące do kontrolera, a nie poprzez jego
  ręczny substytut.
stages.0.brief: Ustawienia CronJob odpowiadają opisowi, a jego najnowszy zaplanowany Job kończy się pomyślnie z `north-104`
  w logach.
stages.0.objectives.0.text: Ustawienia CronJob odpowiadają opisowi, a jego najnowszy zaplanowany Job kończy się pomyślnie
  z `north-104` w logach.
hints.0.text: Zawieszony CronJob zachowuje swoją definicję, ale nie rozpoczyna żadnych nowych zaplanowanych zadań.
hints.1.text: Forbid zapobiega nakładaniu się tego CronJob na jego własne aktywne zadania.
hints.2.text: Cofnij zawieszenie, wybierz Forbid i poczekaj, aż kontroler Job zostanie utworzony z scheduled timestamp.
phrases.0: Odróżniłem Job od jego kontrolera planowania.
phrases.1: Skonfigurowałem wyraźną strefę czasową i zasady nakładania się.
phrases.2: Zweryfikowałem rzeczywisty zaplanowany bieg i jego ukończenie.
questions.0.points.0: NIE; dotyczy to tylko zadań należących do tego CronJob.
questions.0.points.1: Do pracy współdzielonej mogą być nadal potrzebne blokady na poziomie aplikacji.
questions.0.prompt: Czy Forbid blokuje wszystkie inne CronJob w przestrzeni nazw?
questions.1.points.0: NIE; testuje szablon zadania bez testowania harmonogramu kontrolera.
questions.1.points.1: Zweryfikuj własność, scheduled time i faktyczne ukończenie.
questions.1.prompt: Czy instrukcja Job jest dowodem na to, że harmonogram działa?
