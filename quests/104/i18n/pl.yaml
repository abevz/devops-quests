title: Planowanie CronJob
brief: 'CronJob route-audit jest zawieszony i umożliwia nakładanie się zadań. Odwiesz go i ustaw concurrencyPolicy:
  Forbid, zachowując harmonogram co minutę, jawną strefę czasową Etc/UTC, ograniczone limity deadline
  i history. Poczekaj na jedną naprawdę zaplanowaną egzekucję; utworzenie podręcznika Job nie jest dowodem
  zaplanowanego uruchomienia. Cel sprawdza w swoim dzienniku ukończone Job należące do tego CronJob, przypisane
  do niego kontrolery scheduled timestamp i north-104. Zmienia się tylko harmonogram Kubernetes tej zatoki;
  nie jest zaangażowany żaden licznik czasu hosta.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `cronjob.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Prawdziwy przebieg zaplanowany przez sterownik kończy się wydaniem north-104;
  zawieszenie jest wyłączone, nakładanie się jest zabronione, a harmonogram/strefa czasowa/terminy pozostają
  nienaruszone.'
debrief: Planowanie zostało zweryfikowane poprzez faktycznie ukończone wykonanie należące do kontrolera,
  a nie poprzez jego ręczny substytut.
stages.0.brief: 'Kryteria sukcesu: Prawdziwy przebieg zaplanowany przez sterownik kończy się z north-104;
  zawieszenie jest wyłączone, nakładanie się jest zabronione, a harmonogram/strefa czasowa/terminy pozostają
  nienaruszone.'
stages.0.objectives.0.text: Prawdziwy przebieg zaplanowany przez kontroler kończy się wraz z north-104;
  zawieszenie jest wyłączone, nakładanie się jest zabronione, a harmonogram/strefa czasowa/terminy pozostają
  nienaruszone.
hints.0.text: Zawieszony CronJob zachowuje swoją definicję, ale nie rozpoczyna żadnych nowych zaplanowanych
  zadań.
hints.1.text: Forbid zapobiega nakładaniu się tego CronJob na jego własne aktywne zadania.
hints.2.text: Cofnij zawieszenie, wybierz Forbid i poczekaj, aż kontroler Job zostanie utworzony z scheduled
  timestamp.
phrases.0: Odróżniłem Job od jego kontrolera planowania.
phrases.1: Skonfigurowałem wyraźną strefę czasową i zasady nakładania się.
phrases.2: Zweryfikowałem rzeczywisty zaplanowany bieg i jego ukończenie.
questions.0.points.0: NIE; dotyczy to tylko zadań należących do tego CronJob.
questions.0.points.1: Do pracy współdzielonej mogą być nadal potrzebne blokady na poziomie aplikacji.
questions.0.prompt: Czy Forbid blokuje wszystkie inne CronJob w przestrzeni nazw?
questions.1.points.0: NIE; testuje szablon zadania bez testowania harmonogramu kontrolera.
questions.1.points.1: Zweryfikuj własność, scheduled time i faktyczne ukończenie.
questions.1.prompt: Czy instrukcja Job jest dowodem na to, że harmonogram działa?
