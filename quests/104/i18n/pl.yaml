title: Planowanie CronJob
brief: 'Zaplanowany audyt nie daje wymaganego wyniku. Przywróć rzeczywiste wykonanie według harmonogramu i
  dowody jego zakończenia.


  Pracuj w `~/quest` na workstation. Dostarczone pliki: `cronjob.yaml`.


  **Wymagania:**

  - Istniejący zaplanowany audyt działa raz na minutę w `Etc/UTC`, bez nakładania własnych uruchomień i z oknem
  opóźnienia `20` sekund.

  - CronJob `route-audit` ma limity historii: `1` udany Job i `1` nieudany Job.

  - Ostatni Job `route-audit` zaplanowany przez kontroler kończy się raz powodzeniem i zapisuje dokładnie `north-104`.


  Ręcznie utworzony Job nie dowodzi działania harmonogramu; nowa minuta może zmienić ostatni czas przed zakończeniem
  Joba, więc sprawdź ponownie po zakończeniu.

  '
debrief: Planowanie zostało zweryfikowane poprzez faktycznie ukończone wykonanie należące do kontrolera, a
  nie poprzez jego ręczny substytut.
stages.0.brief: Ostatnie wykonanie zaplanowane przez kontroler ma zakończyć się wymaganym wynikiem logów.
hints.0.text: Zawieszony CronJob zachowuje swoją definicję, ale nie rozpoczyna żadnych nowych zaplanowanych
  zadań.
hints.1.text: 'Forbid zapobiega nakładaniu się tego CronJob na jego własne aktywne zadania.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Wyłącz wstrzymanie, wybierz Forbid i poczekaj na Job kontrolera z zaplanowanym znacznikiem czasu.
  Przykład poprawki: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Oczekuj rzeczywistego ostatniego zaplanowanego Joba, ukończonego raz; cały jego log to north-104. Zastąp
  symbol zastępczy nazwą tego Joba.


  Dostarczone ograniczenia i szczegóły: CronJob `route-audit` jest włączony z harmonogramem co minutę w `Etc/UTC`,
  zasadą współbieżności `Forbid` i terminem opóźnionego startu `20` sekund.'
phrases.0: Odróżniłem Job od jego kontrolera planowania.
phrases.1: Skonfigurowałem wyraźną strefę czasową i zasady nakładania się.
phrases.2: Zweryfikowałem rzeczywisty zaplanowany bieg i jego ukończenie.
questions.0.points.0: NIE; dotyczy to tylko zadań należących do tego CronJob.
questions.0.points.1: Do pracy współdzielonej mogą być nadal potrzebne blokady na poziomie aplikacji.
questions.0.prompt: Czy Forbid blokuje wszystkie inne CronJob w przestrzeni nazw?
questions.1.points.0: NIE; testuje szablon zadania bez testowania harmonogramu kontrolera.
questions.1.points.1: Zweryfikuj własność, scheduled time i faktyczne ukończenie.
questions.1.prompt: Czy instrukcja Job jest dowodem na to, że harmonogram działa?
diagnostics.last_time: cronjob/route-audit lastScheduleTime musi być niepuste.
diagnostics.owned: Job musi mieć kontrolującego właściciela CronJob z niepustym UID route-audit.
diagnostics.scheduled: Ostatnie zaplanowane uruchomienie CronJob `route-audit` musi mieć Job należący do jego
  kontrolera.
diagnostics.succeeded: Job dla lastScheduleTime musi mieć succeeded=1 i niepustą nazwę.
diagnostics.logs: Job zakończony powodzeniem dla lastScheduleTime musi mieć niepustą nazwę, a jego logi muszą
  być równe north-104.
diagnostics.field_suspend: cronjob/route-audit suspend musi być równe false.
diagnostics.field_schedule: cronjob/route-audit musi uruchamiać się raz na minutę.
diagnostics.field_timezone: cronjob/route-audit timeZone musi być równe Etc/UTC.
diagnostics.field_concurrencypolicy: cronjob/route-audit concurrencyPolicy musi być równe Forbid.
diagnostics.field_startingdeadlineseconds: cronjob/route-audit startingDeadlineSeconds musi być równe 20.
diagnostics.field_successfuljobshistorylimit: cronjob/route-audit successfulJobsHistoryLimit musi być równe
  1.
diagnostics.field_failedjobshistorylimit: cronjob/route-audit failedJobsHistoryLimit musi być równe 1.
stages.0.objectives.0.text: Istniejący zaplanowany audyt działa raz na minutę w `Etc/UTC`, bez nakładania własnych
  uruchomień i z oknem opóźnienia `20` sekund.
stages.0.objectives.1.text: 'CronJob `route-audit` ma limity historii: `1` udany Job i `1` nieudany Job.'
stages.0.objectives.2.text: Ostatni Job `route-audit` zaplanowany przez kontroler kończy się raz powodzeniem
  i zapisuje dokładnie `north-104`.
