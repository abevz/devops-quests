title: Planowanie CronJob
brief: "Zaplanowany audyt nie daje wymaganego wyniku. Przywróć rzeczywiste wykonanie według harmonogramu i dowody\
  \ jego zakończenia.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `cronjob.yaml`.\n\n**Wymagania:**\n\
  - CronJob `route-audit` jest włączony z harmonogramem co minutę w `Etc/UTC`, zasadą współbieżności `Forbid` i\
  \ terminem opóźnionego startu `20` sekund.\n- CronJob `route-audit` ma limity historii: `1` udany Job i `1` nieudany\
  \ Job.\n- Ostatni Job `route-audit` zaplanowany przez kontroler kończy się raz powodzeniem i zapisuje dokładnie\
  \ `north-104`.\n\n**Sprawdź samodzielnie przed Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest`\
  \ na workstation; `kubectl exec` obserwuje kontener wskazanego obciążenia.\n- `kubectl get cronjob route-audit\
  \ -o yaml` — Ustawienia, tożsamość i status odpowiadają wymaganiom.\n- `kubectl get jobs -o json` — CronJob ma\
  \ rzeczywisty Job zaplanowany przez kontroler dla ostatniego uruchomienia.\n- Logi wybranego zaplanowanego Joba\
  \ zawierają dokładnie `north-104`.\n\n  ```sh\n  uid=$(kubectl get cronjob route-audit -o jsonpath='{.metadata.uid}')\n\
  \  job=$(\n    kubectl get jobs -o json |\n    jq -r --arg uid \"$uid\" '\n      [.items[] |\n        select(any(.metadata.ownerReferences[]?;\n\
  \          .uid==$uid and .controller==true))]\n      | sort_by(.metadata.creationTimestamp)\n      | last | .metadata.name\n\
  \    '\n  )\n  kubectl logs \"job/$job\"\n  ```\n\nRęcznie utworzony Job nie dowodzi działania harmonogramu; nowa\
  \ minuta może zmienić ostatni czas przed zakończeniem Joba, więc sprawdź ponownie po zakończeniu.\n"
debrief: Planowanie zostało zweryfikowane poprzez faktycznie ukończone wykonanie należące do kontrolera, a nie poprzez
  jego ręczny substytut.
stages.0.brief: 'Ostatnie wykonanie zaplanowane przez kontroler ma zakończyć się wymaganym wynikiem logów.

  '
hints.0.text: Zawieszony CronJob zachowuje swoją definicję, ale nie rozpoczyna żadnych nowych zaplanowanych zadań.
hints.1.text: Forbid zapobiega nakładaniu się tego CronJob na jego własne aktywne zadania.
hints.2.text: 'Wyłącz wstrzymanie, wybierz Forbid i poczekaj na Job kontrolera z zaplanowanym znacznikiem czasu.
  Przykład poprawki: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.

  '
phrases.0: Odróżniłem Job od jego kontrolera planowania.
phrases.1: Skonfigurowałem wyraźną strefę czasową i zasady nakładania się.
phrases.2: Zweryfikowałem rzeczywisty zaplanowany bieg i jego ukończenie.
questions.0.points.0: NIE; dotyczy to tylko zadań należących do tego CronJob.
questions.0.points.1: Do pracy współdzielonej mogą być nadal potrzebne blokady na poziomie aplikacji.
questions.0.prompt: Czy Forbid blokuje wszystkie inne CronJob w przestrzeni nazw?
questions.1.points.0: NIE; testuje szablon zadania bez testowania harmonogramu kontrolera.
questions.1.points.1: Zweryfikuj własność, scheduled time i faktyczne ukończenie.
questions.1.prompt: Czy instrukcja Job jest dowodem na to, że harmonogram działa?
diagnostics.last_time: cronjob/route-audit lastScheduleTime musi być niepuste.
diagnostics.owned: Job musi mieć kontrolującego właściciela CronJob z niepustym UID route-audit.
diagnostics.scheduled: Ostatnie zaplanowane uruchomienie CronJob `route-audit` musi mieć Job należący do jego kontrolera.
diagnostics.succeeded: Job dla lastScheduleTime musi mieć succeeded=1 i niepustą nazwę.
diagnostics.logs: Job zakończony powodzeniem dla lastScheduleTime musi mieć niepustą nazwę, a jego logi muszą być
  równe north-104.
diagnostics.field_suspend: cronjob/route-audit suspend musi być równe false.
diagnostics.field_schedule: cronjob/route-audit schedule musi być równe * * * * *.
diagnostics.field_timezone: cronjob/route-audit timeZone musi być równe Etc/UTC.
diagnostics.field_concurrencypolicy: cronjob/route-audit concurrencyPolicy musi być równe Forbid.
diagnostics.field_startingdeadlineseconds: cronjob/route-audit startingDeadlineSeconds musi być równe 20.
diagnostics.field_successfuljobshistorylimit: cronjob/route-audit successfulJobsHistoryLimit musi być równe 1.
diagnostics.field_failedjobshistorylimit: cronjob/route-audit failedJobsHistoryLimit musi być równe 1.
stages.0.objectives.0.text: CronJob `route-audit` jest włączony z harmonogramem co minutę w `Etc/UTC`, zasadą współbieżności
  `Forbid` i terminem opóźnionego startu `20` sekund.
stages.0.objectives.1.text: 'CronJob `route-audit` ma limity historii: `1` udany Job i `1` nieudany Job.'
stages.0.objectives.2.text: Ostatni Job `route-audit` zaplanowany przez kontroler kończy się raz powodzeniem i zapisuje
  dokładnie `north-104`.
