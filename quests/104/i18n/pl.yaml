title: Planowanie CronJob
brief: 'Zaplanowany audyt nie daje wymaganego wyniku. Przywróć rzeczywiste wykonanie według harmonogramu i
  dowody jego zakończenia.


  Pracuj w `~/quest` na workstation. Dostarczone pliki: `cronjob.yaml`.


  **Wymagania:**

  - Istniejący zaplanowany audyt działa raz na minutę w `Etc/UTC`, bez nakładania własnych uruchomień i z oknem
  opóźnienia `20` sekund.

  - CronJob `route-audit` ma limity historii: `1` udany Job i `1` nieudany Job.

  - Ostatni Job `route-audit` zaplanowany przez kontroler kończy się raz powodzeniem i zapisuje dokładnie `north-104`.


  Ręcznie utworzony Job nie dowodzi działania harmonogramu; nowa minuta może zmienić ostatni czas przed zakończeniem
  Joba, więc sprawdź ponownie po zakończeniu.

  '
debrief: Planowanie zostało zweryfikowane poprzez faktycznie ukończone wykonanie należące do kontrolera, a
  nie poprzez jego ręczny substytut.
stages.0.brief: Ostatnie wykonanie zaplanowane przez kontroler ma zakończyć się wymaganym wynikiem logów.
hints.0.text: Zawieszony CronJob zachowuje swoją definicję, ale nie rozpoczyna żadnych nowych zaplanowanych
  zadań.
hints.1.text: 'Forbid zapobiega nakładaniu się tego CronJob na jego własne aktywne zadania.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat cronjob.yaml

  kubectl get cronjob route-audit -o yaml

  kubectl get jobs -o yaml

  ```'
hints.2.text: 'Wyłącz wstrzymanie, wybierz Forbid i poczekaj na Job kontrolera z zaplanowanym znacznikiem czasu.
  Przykład poprawki: `kubectl patch cronjob route-audit --type=merge -p ''{"spec":{"suspend":false,"concurrencyPolicy":"Forbid"}}''`.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl get cronjob route-audit

  kubectl get jobs

  # Use the latest controller-created Job name from hint 2.

  kubectl logs job/JOB_NAME

  ```


  Oczekuj rzeczywistego ostatniego zaplanowanego Joba, ukończonego raz; cały jego log to north-104. Zastąp
  symbol zastępczy nazwą tego Joba.


  Dostarczone ograniczenia i szczegóły: CronJob `route-audit` jest włączony z harmonogramem co minutę w `Etc/UTC`,
  zasadą współbieżności `Forbid` i terminem opóźnionego startu `20` sekund.'
phrases.0: Odróżniłem Job od jego kontrolera planowania.
phrases.1: Skonfigurowałem wyraźną strefę czasową i zasady nakładania się.
phrases.2: Zweryfikowałem rzeczywisty zaplanowany bieg i jego ukończenie.
questions.0.points.0: NIE; dotyczy to tylko zadań należących do tego CronJob.
questions.0.points.1: Do pracy współdzielonej mogą być nadal potrzebne blokady na poziomie aplikacji.
questions.0.prompt: Czy Forbid blokuje wszystkie inne CronJob w przestrzeni nazw?
questions.1.points.0: NIE; testuje szablon zadania bez testowania harmonogramu kontrolera.
questions.1.points.1: Zweryfikuj własność, scheduled time i faktyczne ukończenie.
questions.1.prompt: Czy instrukcja Job jest dowodem na to, że harmonogram działa?
stages.0.objectives.0.text: Istniejący zaplanowany audyt działa raz na minutę w `Etc/UTC`, bez nakładania własnych
  uruchomień i z oknem opóźnienia `20` sekund.
stages.0.objectives.1.text: 'CronJob `route-audit` ma limity historii: `1` udany Job i `1` nieudany Job.'
stages.0.objectives.2.text: Ostatni Job `route-audit` zaplanowany przez kontroler kończy się raz powodzeniem
  i zapisuje dokładnie `north-104`.
diagnostics.field_suspend: 'CronJob może nadal być wstrzymany. Sprawdź route-audit i jawnie ustaw suspend: false, aby kontroler mógł planować następne uruchomienia. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-suspension)'
diagnostics.field_schedule: Harmonogram może pomijać minuty albo mieć błędne wyrażenie pięciopolowe. Sprawdź uruchomienie co minutę we wszystkich godzinach, dniach i miesiącach. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-minute-schedule)
diagnostics.field_timezone: Zmiana manifestu mogła usunąć jawną strefę czasową lub wybrać lokalną. Sprawdź aktywne timeZone i zachowaj Etc/UTC. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-time-zone)
diagnostics.field_concurrencypolicy: CronJob może nadal zezwalać na nakładanie uruchomień. Sprawdź concurrencyPolicy i ustaw Forbid, aby pominąć termin, gdy poprzedni Job działa. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-overlap-policy)
diagnostics.field_startingdeadlineseconds: Dopuszczalne opóźnienie startu mogło zostać usunięte lub zmienione. Sprawdź startingDeadlineSeconds i zachowaj limit 20 sekund. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-start-deadline)
diagnostics.field_successfuljobshistorylimit: Inny manifest lub brak pola może zachowywać inną liczbę udanych Jobów. Zachowaj successfulJobsHistoryLimit równe 1. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-success-history)
diagnostics.field_failedjobshistorylimit: Konfiguracja może zachowywać inną liczbę nieudanych Jobów. Zachowaj failedJobsHistoryLimit równe 1. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-failure-history)
diagnostics.last_time: Kontroler mógł jeszcze nie zaplanować uruchomienia, bo CronJob jest wstrzymany lub nie minęła odpowiednia minuta. Po wznowieniu sprawdź lastScheduleTime. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-last-scheduled-time)
diagnostics.owned: Job z pasującą nazwą lub etykietą może należeć do innego kontrolera albo być uruchomiony ręcznie. Porównaj właściciela kontrolera z aktualnym UID route-audit. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-job-owner)
diagnostics.scheduled: Joby należące do CronJobu mogą pochodzić z wcześniejszych terminów. Porównaj adnotację harmonogramu z aktualnym lastScheduleTime CronJobu. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-job-matches-schedule)
diagnostics.succeeded: Job dla najnowszego terminu może czekać, działać lub zakończyć się błędem. Sprawdź, czy pasujący Job CronJobu zgłasza dokładnie jeden sukces. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-completion)
diagnostics.logs: Pasujący udany Job może wypisać inną wartość albo nie mieć dostępnych logów. Odczytaj logi wybranego Jobu i porównaj z north-104. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-latest-scheduled-job-output)
diagnostics.probe_0_0: Kontrola harmonogramu może skończyć się przed wskazaniem pola, gdy proces lub wejścia zawodzą. Sprawdź narzędzia i dostęp do route-audit. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q104-cronjob-observer-input)
