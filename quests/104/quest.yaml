  - text: stages.0.objectives.2.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\ncron=$(kubectl get cronjob route-audit -o json 2>/dev/null\
      \ || true)\nuid=$(jq -r '.metadata.uid // \"\"' <<<\"$cron\" 2>/dev/null || true)\nscheduled=$(jq -r '.status.lastScheduleTime\
      \ // \"\"' <<<\"$cron\" 2>/dev/null || true)\njobs=$(kubectl get jobs -o json 2>/dev/null || true)\nowned=$(jq\
      \ -c --arg uid \"$uid\" '[.items[]?|select(any(.metadata.ownerReferences[]?;.kind==\"CronJob\" and .uid==$uid\
      \ and .controller==true))]' <<<\"$jobs\" 2>/dev/null || echo '[]')\nlatest=$(jq -c --arg at \"$scheduled\"\
      \ '[.[]|select(.metadata.annotations[\"batch.kubernetes.io/cronjob-scheduled-timestamp\"]==$at)]' <<<\"$owned\"\
      \ 2>/dev/null || echo '[]')\njob=$(jq -r '[.[]|select(.status.succeeded==1)][0].metadata.name // \"\"' <<<\"\
      $latest\" 2>/dev/null || true)\nif ! test -n \"$scheduled\"; then\n  printf '%s\\n' 'cronjob/route-audit lastScheduleTime:\
      \ ✗ [DQ:last_time]'; failed=1\nfi\nif ! test -n \"$uid\" || ! jq -e 'length>0' <<<\"$owned\" >/dev/null 2>&1;\
      \ then printf '%s\\n' 'Job owned by cronjob/route-audit: ✗ [DQ:owned]'; failed=1; fi\nif ! test -n \"$scheduled\"\
      \ || ! jq -e 'length>0' <<<\"$latest\" >/dev/null 2>&1; then printf '%s\\n' 'latest CronJob run has a controller-owned\
      \ Job: ✗ [DQ:scheduled]'; failed=1; fi\nif ! test -n \"$job\"; then printf '%s\\n' 'latest scheduled Job succeeded\
      \ = 1: ✗ [DQ:succeeded]'; failed=1; fi\nif ! test -n \"$job\" || ! test \"$(kubectl logs \"job/$job\" 2>/dev/null)\"\
      \ = north-104; then\n  printf '%s\\n' 'latest scheduled Job logs = north-104: ✗ [DQ:logs]'; failed=1\nfi\n\
      exit \"$failed\"\n"
