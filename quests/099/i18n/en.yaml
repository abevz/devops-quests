title: Credential incident
brief: 'The private delivery board depends on a game-only Vault reader token that
  is considered compromised. Rotate only that reader: use the bounded rail-rotation
  issuer to create a 300s non-renewable rail-reader token with explicit_max_ttl 600s,
  store it as station-token with mode 0600, and revoke the compromised accessor from
  the frozen receipt. The manager can issue this role and revoke only that accessor;
  it cannot read KV or edit policies. sync-secret.sh uses station-token. Restore the
  existing Git → private image → Argo board using the replacement credential, and
  prove the old token gets HTTP 403. Never put tokens in Git.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `compromised-accessor`,
  `station-token`, `sync-secret.sh`, `private-release.json`, `repository/manifests/board.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The old reader is revoked, its least-privilege replacement
  is private and bounded, and the existing GitOps board serves north-99 from the pinned
  private image and Vault-backed Secret.'
debrief: The compromised credential was invalidated and private delivery recovered
  with a bounded least-privilege replacement.
