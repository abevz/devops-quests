diagnostics.incident_head: The working release-commit may be stale or the supplied platform input/private Git fetch may fail. Compare the fetched origin/main with the current receipt; credential rotation alone does not establish that the application is using that published revision. [Cause and check](guides#guide=gitops-delivery&section=credential-incident-current-private-git-head)
diagnostics.incident_source: Redirecting the Application to another repository, branch or directory bypasses the supplied delivery source. Keep its provided Git URL, main branch and relative path resolving to manifests without parent traversal; platform/API/JSON read failures also fail this source comparison. [Cause and check](guides#guide=gitops-delivery&section=credential-incident-retained-private-source)
diagnostics.incident_sync: The Application may still be unhealthy because image-pull or source Secret inputs are missing, or its observed revision and automation flags may differ. Wait for Synced and Healthy at release-commit with self-healing and pruning true after restoring the actual credentials and Secret publication. [Cause and check](guides#guide=gitops-delivery&section=credential-incident-reconciled-incident-revision)
diagnostics.incident_http: A ready declaration or successful credential API call does not prove the board Service serves north-99. Missing image pulls, source Secret adoption or ready endpoints can block the actual request; exec/HTTP timeouts and a different body also fail the original value comparison. [Cause and check](guides#guide=gitops-delivery&section=credential-incident-actual-incident-service)
diagnostics.probe_0_4: The worker may not use the frozen immutable image with Always policy, or no current owned ready Pod may satisfy that image, Always and a nonempty imagePullSecrets name set. Restore the missing registry credential Secret and wait for rollout. This observer checks actual image adoption and declared imagePullSecrets names; its unused credential helper definitions do not add a Secret-content comparison. Input, rollout, API, JSON and startup errors share this fallback. [Cause and check](guides#guide=gitops-delivery&section=credential-incident-actual-private-image-adoption)
diagnostics.probe_0_5: Issuing a new token does not publish the Vault value into Kubernetes. Use the replacement station-token with the provided synchronization script and keep the effective last ROUTE_SECRET environment entry bound to route-secret/value without an embedded value. The decoded Secret must contain the required north-secret line. Missing inputs, invalid worker/environment shape, API, JSON or decode errors all use this fallback. [Cause and check](guides#guide=vault-recovery&section=credential-incident-secret-publication-reference)
diagnostics.incident_token: The station-token file is initially absent; reusing the compromised reader or leaving mode other than 0600 fails recovery. Issue through the supplied synchronous manager role with the documented parameters, save the private response without printing it and use a distinct current token. The check requires source access, the exact policies [default, rail-reader] and a positive remaining TTL no greater than 600 seconds; lookup/read/API failures also fail this condition. [Cause and check](guides#guide=vault-recovery&section=credential-incident-private-bounded-replacement)
diagnostics.incident_revoked: A replacement token does not revoke the original compromised reader. Use the manager synchronous revoke-accessor endpoint with the frozen compromised-accessor receipt; the old supplied credential must receive HTTP 403 on the source request afterward. A network failure or another HTTP code is not proof of the required denial, and the static issuer-status snapshot does not establish revocation. [Cause and check](guides#guide=vault-recovery&section=credential-incident-compromised-accessor-revocation)
