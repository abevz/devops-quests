hints.0.text: Crear un reemplazo no invalida el token comprometido.
hints.1.text: Emita el reader limitado, distribúyalo de forma privada y luego revoque el accessor congelado.
hints.2.text: Verifique el token 403 antiguo y la entrega en vivo utilizando el nuevo token sin ampliar
  policy.
phrases.0: Roté el credential y revoqué explícitamente el comprometido.
phrases.1: Mantuve valores secretos fuera de Git y registros.
phrases.2: Verifiqué tanto la denegación de acceso como la entrega de un extremo a otro.
questions.0.points.0: No; es necesaria la revocación o caducidad explícita.
questions.0.points.1: Verifique que el antiguo credential falle después de la rotación.
questions.0.prompt: ¿La emisión de un nuevo token revoca el antiguo token?
questions.1.points.0: La recuperación no debería otorgar un nuevo administrador secreto sin restricciones.
questions.1.points.1: Restringir policy, duración y objetivo de revocación.
questions.1.prompt: ¿Por qué vincular la recuperación issuer?
