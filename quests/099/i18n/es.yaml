title: Incidente de credencial
brief: 'La entrega de private board depende de un Vault reader token de solo juego que se considera compromised.
  Gire solo ese reader: utilice el rail-rotation issuer delimitado para crear un 300s non-renewable rail-reader
  token con explicit_max_ttl 600s, guárdelo como station-token con modo 0600 y revoque el compromised
  accessor del recibo congelado. El administrador puede emitir este rol y revocar únicamente ese accessor;
  no puede leer KV ni editar policies. sync-secret.sh utiliza station-token. Restaure la imagen Git →
  private → Argo board utilizando el credential de reemplazo y demuestre que el antiguo token obtiene
  HTTP. 403. Nunca pongas tokens en Git.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `compromised-accessor`,
  `station-token`, `sync-secret.sh`, `private-release.json`, `repository/manifests/board.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos suministrados, imágenes precargadas
  y servicios private. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el antiguo reader está revocado, su reemplazo con privilegios mínimos
  es private y está limitado, y el GitOps board existente sirve north-99 desde la imagen fijada private
  y respaldada por Vault. Secret.'
debrief: El credential comprometido fue invalidado y la entrega privada se recuperó con un reemplazo limitado
  con privilegios mínimos.
stages.0.brief: 'Criterios de éxito: el antiguo reader está revocado, su reemplazo con privilegios mínimos
  es privado y limitado, y el GitOps board existente sirve a north-99 desde la imagen privada fijada y
