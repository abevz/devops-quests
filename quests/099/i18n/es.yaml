diagnostics.incident_head: release-commit puede estar obsoleto o fallar platform input/private Git fetch. Compare origin/main obtenido con recibo actual; rotación de credential por sí sola no establece revisión publicada usada por aplicación. [Causa y comprobación](guides#guide=gitops-delivery&section=credential-incident-current-private-git-head)
diagnostics.incident_source: Redirigir Application a otro repositorio, rama o directorio evita fuente suministrada. Conserve Git URL, main y ruta relativa a manifests sin recorrido al padre; errores platform/API/JSON también fallan comparación. [Causa y comprobación](guides#guide=gitops-delivery&section=credential-incident-retained-private-source)
diagnostics.incident_sync: Application puede seguir no saludable por entradas image-pull o source Secret ausentes o diferir en revisión y automation. Tras restaurar credentials y publicar Secret, espere Synced y Healthy en release-commit con self-healing y pruning true. [Causa y comprobación](guides#guide=gitops-delivery&section=credential-incident-reconciled-incident-revision)
diagnostics.incident_http: Declaración lista o API credential exitosa no prueba que board Service sirve north-99. Fallos image pull, adopción source Secret o ready endpoints bloquean petición; timeout exec/HTTP o cuerpo distinto también falla. [Causa y comprobación](guides#guide=gitops-delivery&section=credential-incident-actual-incident-service)
diagnostics.probe_0_4: Worker puede no usar image congelado con Always, o no haber Pod actual propio ready con image, Always y nombres imagePullSecrets no vacíos. Restaure registry Secret ausente y espere rollout. Observador comprueba adopción image y nombres imagePullSecrets; credential helpers sin uso no añaden comparación de contenido Secret. Entradas, rollout, API, JSON o arranque fallidos comparten fallback. [Causa y comprobación](guides#guide=gitops-delivery&section=credential-incident-actual-private-image-adoption)
diagnostics.probe_0_5: Emitir token no publica valor Vault en Kubernetes. Use station-token nuevo con script de sincronización y mantenga último ROUTE_SECRET efectivo ligado a route-secret/value sin valor incrustado. Secret decodificado debe contener línea north-secret requerida. Entradas ausentes, estructura worker/env inválida o errores API, JSON y decode dan fallback. [Causa y comprobación](guides#guide=vault-recovery&section=credential-incident-secret-publication-reference)
diagnostics.incident_token: station-token inicia ausente; reutilizar reader comprometido o modo distinto de 0600 falla. Emita por manager role síncrono con parámetros documentados, guarde respuesta privada sin imprimir y use token actual distinto. Se exige acceso fuente, policies exactas [default, rail-reader] y TTL positivo no mayor de 600 segundos; fallos lookup/read/API también fallan. [Causa y comprobación](guides#guide=vault-recovery&section=credential-incident-private-bounded-replacement)
diagnostics.incident_revoked: Token nuevo no revoca reader comprometido original. Use endpoint manager revoke-accessor síncrono con compromised-accessor congelado; credencial antigua debe recibir HTTP 403 en fuente después. Error de red u otro código no prueba denegación requerida y snapshot issuer-status estático no acredita revocación. [Causa y comprobación](guides#guide=vault-recovery&section=credential-incident-compromised-accessor-revocation)
