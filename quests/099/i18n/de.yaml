diagnostics.incident_head: release-commit ist möglicherweise veraltet oder Plattformeingabe beziehungsweise privater Git-Fetch scheitert. Vergleichen Sie abgerufenes origin/main mit dem aktuellen Beleg; Credential-Rotation allein belegt keine Nutzung dieser veröffentlichten Revision. [Ursache und Prüfung](guides#guide=gitops-delivery&section=credential-incident-current-private-git-head)
diagnostics.incident_source: Eine andere Repository-, Branch- oder Verzeichnisquelle der Application umgeht die gelieferte Auslieferung. Erhalten Sie Git-URL, main und relativen manifests-Pfad ohne Elternwechsel; Plattform-/API-/JSON-Lesefehler scheitern ebenfalls am Quellenvergleich. [Ursache und Prüfung](guides#guide=gitops-delivery&section=credential-incident-retained-private-source)
diagnostics.incident_sync: Die Application bleibt möglicherweise wegen fehlender image-pull- oder source-Secret-Eingaben ungesund oder meldet andere Revision und Automation. Stellen Sie Credentials und Secret-Publikation her und warten Sie auf Synced und Healthy bei release-commit mit self-healing und pruning true. [Ursache und Prüfung](guides#guide=gitops-delivery&section=credential-incident-reconciled-incident-revision)
diagnostics.incident_http: Bereite Deklaration oder erfolgreicher Credential-API-Aufruf belegt keine Antwort north-99 des board-Service. Image-Pull, Übernahme des source Secret oder fehlende bereite Endpunkte können den Aufruf blockieren; exec-/HTTP-Timeout und anderer Inhalt scheitern ebenfalls am Wertvergleich. [Ursache und Prüfung](guides#guide=gitops-delivery&section=credential-incident-actual-incident-service)
diagnostics.probe_0_4: Worker verwendet möglicherweise nicht das eingefrorene Image mit Always oder kein aktueller zugehöriger bereiter Pod erfüllt Image, Always und nicht leere imagePullSecrets-Namen. Stellen Sie das fehlende Registry-Secret her und warten Sie auf Rollout. Der Observer prüft Image-Übernahme und Secret-Namen; ungenutzte Credential-Helper ergänzen keinen Secret-Inhaltsvergleich. Eingabe-, Rollout-, API-, JSON- und Startfehler teilen den Fallback. [Ursache und Prüfung](guides#guide=gitops-delivery&section=credential-incident-actual-private-image-adoption)
diagnostics.probe_0_5: Ein neues Token veröffentlicht den Vault-Wert nicht in Kubernetes. Nutzen Sie neues station-token mit dem gelieferten Synchronisationsskript und halten Sie den effektiven letzten ROUTE_SECRET-Eintrag an route-secret/value ohne eingebetteten Wert gebunden. Dekodiertes Secret muss die geforderte Zeile north-secret enthalten. Fehlende Eingaben, ungültige worker/env-Struktur sowie API-, JSON- und Dekodierfehler teilen den Fallback. [Ursache und Prüfung](guides#guide=vault-recovery&section=credential-incident-secret-publication-reference)
diagnostics.incident_token: station-token fehlt anfangs; wiederverwendeter kompromittierter reader oder ein Modus ungleich 0600 scheitern. Stellen Sie über die synchrone Manager-Rolle mit dokumentierten Parametern aus, speichern Sie die private Antwort ohne Ausgabe und verwenden Sie ein anderes aktuelles Token. Geprüft werden Quellenzugriff, exakte policies [default, rail-reader] und positive Rest-TTL höchstens 600 Sekunden; Lookup-/Lese-/API-Fehler scheitern ebenfalls. [Ursache und Prüfung](guides#guide=vault-recovery&section=credential-incident-private-bounded-replacement)
diagnostics.incident_revoked: Ein Ersatztoken widerruft den ursprünglichen kompromittierten reader nicht. Nutzen Sie den synchronen Manager-Endpunkt revoke-accessor mit eingefrorenem compromised-accessor; das alte Credential muss danach HTTP 403 an der Quelle erhalten. Netzwerkfehler oder anderer Code beweist keine geforderte Ablehnung, der statische Snapshot issuer-status belegt keinen Widerruf. [Ursache und Prüfung](guides#guide=vault-recovery&section=credential-incident-compromised-accessor-revocation)
