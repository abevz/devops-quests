title: Vorfall mit Anmeldeinformationen
brief: 'Die private-Lieferung board hängt von einem Nur-Spiel-Vault reader token ab, das als compromised
  gilt. Drehen Sie nur das reader: Verwenden Sie das begrenzte rail-rotation issuer, um ein 300s non-renewable
  rail-reader token mit zu erstellen explicit_max_ttl 600s, speichern Sie es als station-token mit Modus
  0600 und entfernen Sie compromised accessor aus dem eingefrorenen Beleg. Der Manager kann diese Rolle
  nur vergeben und widerrufen accessor; KV kann nicht gelesen oder policies bearbeitet werden. sync-secret.sh
  verwendet station-token. Stellen Sie das vorhandene Bild Git → private → Argo board mit dem Ersatz credential
  wieder her und beweisen Sie, dass das alte token HTTP erhält 403. Setzen Sie tokens niemals in Git ein.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `compromised-accessor`,
  `station-token`, `sync-secret.sh`, `private-release.json`, `repository/manifests/board.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private-Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Das alte reader wird widerrufen, sein Ersatz mit den geringsten Privilegien
  ist private und ist begrenzt, und das vorhandene GitOps board stellt north-99 aus dem angehefteten private-Image
  und Vault-Backed bereit Secret.'
debrief: Der kompromittierte credential wurde ungültig gemacht und die private Lieferung wurde mit einem
  begrenzten Ersatz mit den geringsten Rechten wiederhergestellt.
stages.0.brief: 'Erfolgskriterien: Das alte reader wird widerrufen, sein Ersatz mit den geringsten Privilegien
  ist privat und begrenzt, und das vorhandene GitOps board bedient north-99 aus dem angehefteten privaten
  Image und dem Vault-gestützten Secret.'
stages.0.objectives.0.text: Das alte reader wird widerrufen, sein Ersatz mit den geringsten Privilegien
  ist privat und begrenzt, und das vorhandene GitOps board stellt north-99 aus dem angehefteten privaten
  Image und dem Vault-gestützten Secret bereit.
hints.0.text: Durch das Erstellen eines Ersatzes wird das kompromittierte token nicht ungültig.
hints.1.text: Geben Sie das gebundene reader aus, verteilen Sie es privat und widerrufen Sie dann das
  eingefrorene accessor.
hints.2.text: Überprüfen Sie den alten Token 403 und die Live-Zustellung mit dem neuen token, ohne policy
  zu erweitern.
phrases.0: Ich habe den credential rotiert und den kompromittierten explizit widerrufen.
phrases.1: Ich habe geheime Werte aus Git und Protokollen ferngehalten.
phrases.2: Ich habe sowohl die Zugriffsverweigerung als auch die End-to-End-Zustellung überprüft.
questions.0.points.0: NEIN; Es bedarf eines ausdrücklichen Widerrufs oder Erlöschens.
questions.0.points.1: Überprüfen Sie, ob der alte credential nach der Rotation ausfällt.
questions.0.prompt: Wird durch die Ausstellung eines neuen token das alte token widerrufen?
questions.1.points.0: Die Wiederherstellung sollte keinen neuen uneingeschränkten geheimen Administrator
  gewähren.
questions.1.points.1: Beschränken Sie policy, Lebensdauer und Widerrufsziel.
questions.1.prompt: Warum ist die Wiederherstellung issuer gebunden?
