title: Vorfall mit Anmeldeinformationen
brief: |-
  Die Vault-Zugangsdaten von board gelten als kompromittiert. Stellen Sie die private Auslieferung mit einem begrenzten Ersatz wieder her, während die alten Zugangsdaten ihren Zugriff verlieren.

  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `compromised-accessor`, `station-token`, `sync-secret.sh`, `private-release.json`, `release-commit`, `repository/`.

  Sofern nicht anders angegeben, liegen Kubernetes-Ressourcen im Bay-Namespace (`DQ_NAMESPACE`); Pfade unter `~/quest` liegen auf der Workstation.

  Die Steuerschnittstelle der Station ist in `~/quest/control/README.md` dokumentiert.

  **Requirements:**

  - Veröffentlichtes `origin/main` entspricht der Workstation-Datei `~/quest/release-commit`.
  - Application `board` behält die bereitgestellte private Git-Quelle, den Release-Branch und das vorhandene Workload-Verzeichnis bei.
  - Application `board` meldet `Synced` und `Healthy` für den Commit in der Workstation-Datei `~/quest/release-commit`.
  - In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-99`.
  - Deployment `board` und ein bereiter Container verwenden das vorhandene unveränderliche private Release-Image mit Pull-Policy `Always`; der Rollout wird abgeschlossen.
  - Die vorhandene Kubernetes-Konfiguration für `board` enthält den Dispatch-Wert `north-secret` und wird dem Workload bereitgestellt.
  - Die Ersatzzugangsdaten in der Workstation-Datei `~/quest/station-token` sind privat (`0600`), unterscheiden sich von den alten, lesen den vorhandenen Dispatch-Wert `north-secret`, behalten den bereitgestellten Reader-Richtliniensatz und haben TTL größer als `0` und höchstens `600` Sekunden.
  - Die alten bereitgestellten Zugangsdaten erhalten HTTP `403` beim Abruf der vorhandenen Dispatch-Daten.

  Die aktuelle Ablehnung beweist nicht, wie oder wann die alten Zugangsdaten ihren Zugriff verloren haben.
debrief: Der kompromittierte credential wurde ungültig gemacht und die private Lieferung wurde mit einem
  begrenzten Ersatz mit den geringsten Rechten wiederhergestellt.
stages.0.brief: Der Ersatz bleibt privat und begrenzt; die alten Zugangsdaten verlieren den Zugriff.
hints.0.text: Durch das Erstellen eines Ersatzes wird das kompromittierte token nicht ungültig.
hints.1.text: |-
  Prüfen Sie das Synchronisierungsskript und die aktuellen Konfigurationsreferenzen des Workloads ohne Ausgabe von Zugangsdaten.

  ```bash
  cat sync-secret.sh control/README.md
  kubectl describe deployment board
  ```
hints.2.text: |-
  Überprüfen Sie den alten Token 403 und die Live-Zustellung mit dem neuen token, ohne policy zu erweitern. Der begrenzte Aussteller heißt `rail-rotation`: Stellen Sie einen nicht verlängerbaren `rail-reader`-Token für `300s` mit `explicit_max_ttl` von `600s` aus, speichern Sie ihn privat in `station-token` und widerrufen Sie den Accessor aus dem eingefrorenen Beleg. `sync-secret.sh` liest `station-token`. Speichern Sie Tokens nie in Git. Geben Sie das gebundene reader aus, verteilen Sie es privat und widerrufen Sie dann das eingefrorene accessor.

  Prüfen Sie in `~/quest` auf der Workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$(cat station-token)") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`
  - `curl -sS -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$(cat station-token)") "$VAULT_ADDR/v1/auth/token/lookup-self" | jq '{policies:.data.policies,ttl:.data.ttl}'`
  - `stat -c %a station-token`

  Der Hash von Remote-`main` entspricht `release-commit`. Der Ersatz liest erfolgreich ohne Wertausgabe; der alte Token meldet `403`. Policies sind genau `default` / `rail-reader`, `0 < ttl <= 600`; Dateimodus ist `600`.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`

  `Synced`, `Healthy` und die Revision aus `release-commit`. Die Quelle ist das bereitgestellte private Repository, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  Der Rollout ist abgeschlossen; `north-99`.
phrases.0: Ich habe den credential rotiert und den kompromittierten explizit widerrufen.
phrases.1: Ich habe geheime Werte aus Git und Protokollen ferngehalten.
phrases.2: Ich habe sowohl die Zugriffsverweigerung als auch die End-to-End-Zustellung überprüft.
questions.0.points.0: NEIN; Es bedarf eines ausdrücklichen Widerrufs oder Erlöschens.
questions.0.points.1: Überprüfen Sie, ob der alte credential nach der Rotation ausfällt.
questions.0.prompt: Wird durch die Ausstellung eines neuen token das alte token widerrufen?
questions.1.points.0: Die Wiederherstellung sollte keinen neuen uneingeschränkten geheimen Administrator
  gewähren.
questions.1.points.1: Beschränken Sie policy, Lebensdauer und Widerrufsziel.
questions.1.prompt: Warum ist die Wiederherstellung issuer gebunden?
