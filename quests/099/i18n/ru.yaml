title: Инцидент credential
brief: 'Приватное табло зависит от игрового reader token Vault, который считается скомпрометированным.
  Замените только этот reader: через ограниченный issuer rail-rotation создайте non-renewable token rail-reader
  на 300s с explicit_max_ttl 600s, сохраните в station-token с правами 0600 и отзовите compromised accessor
  из сохранённой квитанции. Manager выдаёт только эту роль и отзывает только этот accessor; он не читает
  KV и не меняет policies. sync-secret.sh читает station-token. Восстановите существующую цепочку Git
  → private image → Argo с новым credential и докажите HTTP 403 для старого token. Не помещайте tokens
  в Git.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `compromised-accessor`,
  `station-token`, `sync-secret.sh`, `private-release.json`, `repository/manifests/board.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Старый reader отозван, новый ограничен и сохранён приватно; существующее GitOps-табло
  отдаёт north-99 из закреплённого приватного образа с Secret из Vault.'
debrief: Скомпрометированный credential отозван, приватная доставка восстановлена ограниченной заменой
  с минимальными правами.
