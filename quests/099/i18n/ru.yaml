hints.0.text: Создание замены не делает скомпрометированный token недействительным.
hints.1.text: Выдайте ограниченный reader, доставьте приватно и отзовите сохранённый accessor.
hints.2.text: Проверьте 403 для старого token и работающую доставку с новым, не расширяя policy.
phrases.0: Я заменил credential и явно отозвал скомпрометированный.
phrases.1: Я сохранил секреты вне Git и журналов.
phrases.2: Я проверил запрет старого доступа и всю цепочку доставки.
questions.0.points.0: 'Нет: нужен явный отзыв или истечение срока.'
questions.0.points.1: После замены проверьте отказ старого credential.
questions.0.prompt: Отзывает ли выдача нового token старый?
questions.1.points.0: Восстановление не должно создавать неограниченного администратора секретов.
questions.1.points.1: Ограничьте policy, срок жизни и цель отзыва.
questions.1.prompt: Зачем ограничивать issuer восстановления?
