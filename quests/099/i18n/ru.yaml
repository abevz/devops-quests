diagnostics.incident_head: Рабочий release-commit мог устареть либо не читается platform input или private Git fetch. Сравните полученный origin/main с текущей квитанцией; сама ротация credential не подтверждает использование приложением опубликованной ревизии. [Причина и проверка](guides#guide=gitops-delivery&section=credential-incident-current-private-git-head)
diagnostics.incident_source: Перенаправление Application в другой репозиторий, ветку или каталог обходит выданный источник. Сохраните Git URL, main и относительный путь к manifests без перехода к родителю; ошибки platform/API/JSON тоже нарушают сравнение источника. [Причина и проверка](guides#guide=gitops-delivery&section=credential-incident-retained-private-source)
diagnostics.incident_sync: Application может быть нездоровым из-за отсутствующих image-pull или source Secret либо показывать другую ревизию и флаги automation. После восстановления credential и публикации Secret дождитесь Synced и Healthy на release-commit с self-healing и pruning true. [Причина и проверка](guides#guide=gitops-delivery&section=credential-incident-reconciled-incident-revision)
diagnostics.incident_http: Готовая декларация или успешный credential API не доказывает ответ Service board north-99. Загрузка image, принятие source Secret или отсутствие ready endpoints блокируют запрос; timeout exec/HTTP и другое тело тоже нарушают исходное сравнение. [Причина и проверка](guides#guide=gitops-delivery&section=credential-incident-actual-incident-service)
diagnostics.probe_0_4: Worker может не использовать зафиксированный image с Always либо нет текущего принадлежащего ready Pod с этим image, Always и непустым набором imagePullSecrets names. Восстановите отсутствующий registry Secret и дождитесь rollout. Observer проверяет принятие image и имена imagePullSecrets; неиспользуемые credential helpers не добавляют сравнение содержимого Secret. Ошибки входов, rollout, API, JSON и запуска дают тот же fallback. [Причина и проверка](guides#guide=gitops-delivery&section=credential-incident-actual-private-image-adoption)
diagnostics.probe_0_5: Выпуск токена сам не публикует значение Vault в Kubernetes. Используйте новый station-token с выданным sync-script и сохраните эффективный последний ROUTE_SECRET связанным с route-secret/value без встроенного значения. Декодированный Secret должен содержать требуемую строку north-secret. Отсутствие входов, неверная структура worker/env, ошибки API, JSON и decode дают fallback. [Причина и проверка](guides#guide=vault-recovery&section=credential-incident-secret-publication-reference)
diagnostics.incident_token: station-token изначально отсутствует; повторное использование скомпрометированного reader или режим не 0600 нарушают восстановление. Выпустите токен через синхронный manager role с документированными параметрами, приватно сохраните ответ без печати и используйте новый отличный токен. Проверяются доступ к источнику, точные policies [default, rail-reader] и оставшийся TTL больше 0, не более 600 секунд; ошибки lookup/read/API тоже нарушают условие. [Причина и проверка](guides#guide=vault-recovery&section=credential-incident-private-bounded-replacement)
diagnostics.incident_revoked: Новый токен не отзывает исходный скомпрометированный reader. Вызовите синхронный manager revoke-accessor с зафиксированным compromised-accessor; старый выданный credential затем должен получить HTTP 403 на источнике. Ошибка сети или другой код не доказывает требуемый запрет, а статичный issuer-status не подтверждает отзыв. [Причина и проверка](guides#guide=vault-recovery&section=credential-incident-compromised-accessor-revocation)
