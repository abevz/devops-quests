diagnostics.incident_head: Roboczy release-commit może być stary albo platform input/private Git fetch zawodzi. Porównaj pobrany origin/main z bieżącym potwierdzeniem; sama rotacja credential nie dowodzi użycia opublikowanej rewizji przez aplikację. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=credential-incident-current-private-git-head)
diagnostics.incident_source: Przekierowanie Application do innego repozytorium, gałęzi lub katalogu omija dostarczone źródło. Zachowaj Git URL, main i względną ścieżkę do manifests bez przejścia do rodzica; błędy platform/API/JSON też naruszają porównanie źródła. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=credential-incident-retained-private-source)
diagnostics.incident_sync: Application może być niezdrowe przez brak image-pull lub source Secret albo mieć inną rewizję i automation. Po odtworzeniu credential i publikacji Secret poczekaj na Synced i Healthy dla release-commit z self-healing i pruning true. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=credential-incident-reconciled-incident-revision)
diagnostics.incident_http: Gotowa deklaracja lub udane credential API nie dowodzi odpowiedzi board Service north-99. Pobranie image, przyjęcie source Secret lub brak ready endpoints blokuje żądanie; timeout exec/HTTP i inna treść też narusza porównanie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=credential-incident-actual-incident-service)
diagnostics.probe_0_4: Worker może nie używać zamrożonego image z Always albo brak aktualnego należącego ready Pod z tym image, Always i niepustym zbiorem imagePullSecrets names. Odtwórz brakujący registry Secret i poczekaj na rollout. Observer bada przyjęcie image i nazwy imagePullSecrets; nieużywane credential helpers nie dodają porównania zawartości Secret. Błędy danych, rollout, API, JSON i startu dzielą fallback. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=credential-incident-actual-private-image-adoption)
diagnostics.probe_0_5: Wydanie tokenu samo nie publikuje wartości Vault w Kubernetes. Użyj nowego station-token z dostarczonym sync-script i zachowaj efektywny ostatni ROUTE_SECRET powiązany z route-secret/value bez osadzonej wartości. Odkodowany Secret ma zawierać wymaganą linię north-secret. Brak danych, zła struktura worker/env, błędy API, JSON i decode dają fallback. [Przyczyna i kontrola](guides#guide=vault-recovery&section=credential-incident-secret-publication-reference)
diagnostics.incident_token: station-token początkowo nie istnieje; ponowne użycie skompromitowanego reader lub tryb inny niż 0600 nie przejdzie. Wydaj token przez synchroniczny manager role z udokumentowanymi parametrami, zapisz prywatny wynik bez wypisywania i użyj innego nowego tokenu. Warunek wymaga dostępu do źródła, dokładnych policies [default, rail-reader] i TTL większego od 0, najwyżej 600 sekund; błędy lookup/read/API też zawodzą. [Przyczyna i kontrola](guides#guide=vault-recovery&section=credential-incident-private-bounded-replacement)
diagnostics.incident_revoked: Nowy token nie unieważnia pierwotnego skompromitowanego reader. Wywołaj synchroniczny manager revoke-accessor z zamrożonym compromised-accessor; stare dane mają potem otrzymać HTTP 403 przy źródle. Błąd sieci lub inny kod nie dowodzi wymaganej odmowy, a statyczny issuer-status nie potwierdza unieważnienia. [Przyczyna i kontrola](guides#guide=vault-recovery&section=credential-incident-compromised-accessor-revocation)
