title: Incydent związany z poświadczeniem
brief: 'Prywatna aplikacja board zależy od szkoleniowego tokenu reader w Vault, który uznano za przejęty.
  Wymień wyłącznie ten token reader: użyj wystawcy rail-rotation o ograniczonych uprawnieniach, aby utworzyć
  nieodnawialny token rail-reader z czasem życia 300s i explicit_max_ttl 600s. Zapisz go jako station-token
  z mode 0600 i unieważnij przejęty accessor wskazany w zapisanym potwierdzeniu. Menedżer może wystawiać
  tokeny tej roli i unieważnić tylko ten accessor; nie może odczytywać KV ani edytować policies. sync-secret.sh
  korzysta ze station-token. Przywróć istniejący board w przepływie Git → private image → Argo za pomocą
  nowego poświadczenia i potwierdź, że stary token otrzymuje HTTP 403. Nigdy nie zapisuj tokenów w Git.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `compromised-accessor`,
  `station-token`, `sync-secret.sh`, `private-release.json`, `repository/manifests/board.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: stary reader zostaje unieważniony, jego zamiennik o najniższych uprawnieniach
  jest prywatny i ograniczony, a istniejąca board GitOps obsługuje north-99 z przypiętych private image
  i Vault wspieranych przez Secret.'
debrief: Skompromitowany plik credential został unieważniony, a prywatna dostawa odzyskana dzięki ograniczonej
  wymianie o najniższych uprawnieniach.
stages.0.brief: 'Kryteria sukcesu: stary reader zostaje unieważniony, jego zamiennik o najniższych uprawnieniach
  jest prywatny i ograniczony, a istniejąca board GitOps obsługuje north-99 z przypiętego obrazu prywatnego
  i Vault wspieranego przez Secret.'
stages.0.objectives.0.text: Stary reader zostaje unieważniony, jego zamiennik o najniższych uprawnieniach
  jest prywatny i ograniczony, a istniejąca board GitOps obsługuje north-99 z przypiętego prywatnego obrazu
  i Vault wspieranego przez Secret.
hints.0.text: Utworzenie zamiennika nie unieważnia skompromitowanego token.
hints.1.text: Wydaj ograniczony plik reader, rozprowadź go prywatnie, a następnie unieważnij zamrożony
  plik accessor.
hints.2.text: Zweryfikuj stary token 403 i dostawę na żywo, używając nowego token bez poszerzania policy.
phrases.0: Obróciłem credential i wyraźnie unieważniłem skompromitowany.
phrases.1: Trzymałem tajne wartości poza Git i dziennikami.
phrases.2: Zweryfikowałem zarówno odmowę dostępu, jak i kompleksowe dostarczanie.
questions.0.points.0: NIE; konieczne jest wyraźne odwołanie lub wygaśnięcie.
questions.0.points.1: Sprawdź, czy stary credential nie działa po obróceniu.
questions.0.prompt: Czy wydanie nowego token unieważnia stary token?
questions.1.points.0: Odzyskiwanie nie powinno zapewniać nowego nieograniczonego tajnego administratora.
questions.1.points.1: Ogranicz policy, okres istnienia i cel odwołania.
questions.1.prompt: Po co wiązać odzyskiwanie issuer?
