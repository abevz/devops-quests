id: 99
title: title
track: Platform
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    keep: true
    check: |-
      source platform.env
      git -C repository fetch origin main >/dev/null 2>&1
      test "$(git -C repository rev-parse origin/main)" = "$(cat release-commit)"
  - text: stages.0.objectives.1.text
    keep: true
    check: |-
      source platform.env
      kubectl get application board -o json | jq -e --arg url "$GIT_URL" 'def same_dir($want): if type!="string" then false elif startswith("/") then false else (split("/") | map(select(.!="" and .!="."))) as $parts | ($parts | all(.!="..")) and ($parts | join("/")==$want) end; .spec.source.repoURL==$url and (.spec.source.path | same_dir("manifests")) and .spec.source.targetRevision=="main"' >/dev/null
  - text: stages.0.objectives.2.text
    check: |-
      source platform.env
      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" --arg url "$GIT_URL" '.spec.syncPolicy.automated.selfHeal==true and .spec.syncPolicy.automated.prune==true and .status.sync.status=="Synced" and .status.health.status=="Healthy" and .status.sync.revision==$rev' >/dev/null
  - text: stages.0.objectives.3.text
    check: |-
      test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -c worker -- wget -qO- -T 3 http://board:8080)" = north-99

  - text: stages.0.objectives.4.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      source platform.env
      image=$(jq -er .image /run/dq/facts/0/private-release.json)
      source platform.env
      kubectl rollout status deployment/board --timeout=3s >/dev/null
      document=$(kubectl get deployment board -o json 2>/dev/null || true)
      replicasets=$(kubectl get replicasets -o json 2>/dev/null || true)
      pods=$(kubectl get pods -o json 2>/dev/null || true)
      python3 -I - /dev/fd/3 /dev/fd/4 /dev/fd/5 "$image" "$REGISTRY" "$REGISTRY_USER" "$REGISTRY_PASSWORD" 3<<<"$document" 4<<<"$replicasets" 5<<<"$pods" <<'DQ_PRIVATE_IMAGE_POLICY'
      import base64,json,os,re,subprocess,sys

      from dq_check import read_argument as argument
      sys.argv=[sys.argv[0]]+[argument(value) for value in sys.argv[1:]]

      from dq_check import named

      from dq_check import workload_worker as _dq_worker

      def template_worker(document):
          return _dq_worker(document, error="application container identity", ignore_non_mappings=True)

      from dq_check import current_pods

      from dq_check import pod_worker
      from dq_check import pull_secret_names as pull_names



      from dq_check import ready_image


      from dq_check import registry_credentials as credentials

      def valid_secret(name,registry,user,password):
          try:return credentials(secret(name),registry,user,password)
          except Exception:return False

      def secret(name):
          if not re.fullmatch(r'[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?',name):raise ValueError('credential name')
          return json.loads(subprocess.check_output(['kubectl','get','secret',name,'-o','json'],stderr=subprocess.DEVNULL,timeout=2))

      try:
          deployment,replicasets,pods=[json.loads(value) for value in sys.argv[1:4]]
          image,registry,user,password=sys.argv[4:8]
          worker=template_worker(deployment)
          active=current_pods(deployment,replicasets,pods)
          assert worker.get('image')==image and worker.get('imagePullPolicy')=='Always'
          assert any(ready_image(pod,image) and pod_worker(pod).get('imagePullPolicy')=='Always' and bool(pull_names(pod)) for pod in active)
      except Exception:
          sys.exit(1)
      DQ_PRIVATE_IMAGE_POLICY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_4]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.5.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      source platform.env
      image=$(jq -er .image /run/dq/facts/0/private-release.json)
      kubectl get deployment board -o json | python3 -I -c 'import json,os,sys,subprocess
      try:
          deployment=json.load(sys.stdin)
          workers=[item for item in deployment['"'"'spec'"'"']['"'"'template'"'"']['"'"'spec'"'"']['"'"'containers'"'"'] if item.get('"'"'name'"'"')=='"'"'worker'"'"']
          assert len(workers)==1
          entries=[entry for entry in workers[0].get('"'"'env'"'"',[]) if entry.get('"'"'name'"'"')=='"'"'ROUTE_SECRET'"'"']
          assert entries
          effective=entries[-1]
          assert effective.get('"'"'value'"'"') in (None,'"'"''"'"')
          reference=effective.get('"'"'valueFrom'"'"',{}).get('"'"'secretKeyRef'"'"',{})
          assert reference.get('"'"'name'"'"')=='"'"'route-secret'"'"' and reference.get('"'"'key'"'"')=='"'"'value'"'"'
      except Exception:
          sys.exit(1)
      '
      kubectl get secret route-secret -o json | jq -er .data.value | base64 -d | grep -qx north-secret
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_5]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.6.text
    check: |-
      source platform.env
      test "$(stat -c %a station-token)" = 600
      test "$(cat station-token)" != "$VAULT_READER_TOKEN"
      curl -fsS -H "X-Vault-Token: $(cat station-token)" "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"' >/dev/null
      curl -fsS -H "X-Vault-Token: $(cat station-token)" "$VAULT_ADDR/v1/auth/token/lookup-self" | jq -e '.data.policies==["default","rail-reader"] and .data.ttl>0 and .data.ttl<=600' >/dev/null
  - text: stages.0.objectives.7.text
    check: |-
      source platform.env
      test "$(curl -sS -o /dev/null -w '%{http_code}' -H "X-Vault-Token: $VAULT_READER_TOKEN" "$VAULT_ADDR/v1/secret/data/dispatch")" = 403
