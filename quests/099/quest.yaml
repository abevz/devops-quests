  points:
  - questions.0.points.0
  - questions.0.points.1
- prompt: questions.1.prompt
  points:
  - questions.1.points.0
  - questions.1.points.1
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - platform.env
  - compromised-accessor
  - station-token
  - sync-secret.sh
  - private-release.json
  - repository/manifests/board.yaml
  services: []
book:
  chapter: 9
  topic: Credential incident
immutable:
