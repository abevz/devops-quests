title: Retención de registro
brief: 'La solicitud de retención y las etiquetas conservadas no describen un inventario coherente. Recupera una
  retención segura sin sustituir el registry ni su autoridad.


  Trabaja en `~/quest`. Los registros de fuente identifican la autoridad y publicación originales; las copias congeladas
  en `/run/dq/facts/0/` siguen siendo autoritativas. Conserva identidades, programas, límites de acceso y confianza
  TLS. No imprimas credenciales; no sustituyas la fuente protegida.


  Entradas: `platform.env`, `registry-ca.crt`, `release-catalog.json`, `registry-source.json`, `retention.json`
  y el borrador `prune.sh`. Construye las operaciones del registry; el borrador no implementa la eliminación completa.
  Eliminar manifiestos no demuestra recolección de blobs.


  **Requisitos:**


  - `~/quest/retention.json` en la estación de trabajo selecciona solo la versión obsoleta identificada en el catálogo
  autorizado.

  - Mediante la autoridad TLS original verificada, los manifiestos actual y de reversión devuelven `200`, el obsoleto
  `404`, y las etiquetas conservadas resuelven a los digest aprobados.'
debrief: Se conservaron identidades originales de fuentes y consumidores; la versión aprobada se verificó en cada
  límite afectado.
stages.0.brief: La solicitud de retención y las etiquetas conservadas no describen un inventario coherente. Recupera
  una retención segura sin sustituir el registry ni su autoridad.
hints.0.text: Una etiqueta mutable, un manifiesto inmutable y los bytes almacenados son objetos distintos.
hints.1.text: |-
  Antes de cambiar datos, compara plan de retención, catálogo aprobado y enlaces reales de etiquetas.

  Compara el digest de cada etiqueta activa con las entradas de retención aprobadas. Comprueba qué etiquetas comparten un digest.

  ```bash
  cat retention.json release-catalog.json
  jq '{endpoint,ca_sha256}' registry-source.json
  source platform.env
  curl -fsS --max-time 3 --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$REGISTRY/v2/parcel/tags/list" | jq '{tags}'
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'
  import urllib.error

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  catalog=json.loads(Path('/run/dq/facts/0/release-catalog.json').read_text())
  assert manifest('current')==catalog['current']
  assert manifest('1')==catalog['rollback']

  for role in ('current','rollback','obsolete'):
   digest=catalog[role]
   try:
    observed=manifest(digest)
    assert role!='obsolete' and observed==digest
   except urllib.error.HTTPError as error:
    assert role=='obsolete' and error.code==404

  print('OK')
  VERIFY_RELEASE
  ```

  Esperado: OK. No se muestran credenciales.
phrases.0: Protegí los resúmenes de reversión antes de eliminar el obsoleto manifests.
phrases.1: Verifiqué TLS en lugar de omitir las verificaciones de certificados.
phrases.2: Distinguí la eliminación de manifest del almacenamiento garbage collection.
