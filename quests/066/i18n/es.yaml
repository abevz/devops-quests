diagnostics.retention_plan: El plan retention no selecciona solo el digest obsolete protegido o no puede leerse; el plan inicial elige rollback y seleccionar por tag mutable o catálogo editado puede afectar una versión protegida. [Causa y comprobación](guides#guide=gitops-delivery&section=retention-approved-obsolete-selection)
diagnostics.probe_0_1: El registry original no verificó estados y alias; obsolete puede permanecer, faltar un digest protegido o current apuntar a rollback, y cambios de authority, credenciales, CA, encabezados digest o fallos de observación también lo explican. [Causa y comprobación](guides#guide=gitops-delivery&section=retention-original-registry-and-aliases)
