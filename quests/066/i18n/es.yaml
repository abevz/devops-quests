title: Retención de registro
brief: 'El registro tiene una solicitud de retención pendiente; las versiones protegidas deben seguir disponibles.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `registry-ca.crt`, `retention.json`, `prune.sh`.


  **Requisitos:**

  - `~/quest/retention.json` en la estación de trabajo selecciona solo la versión obsoleta identificada en
  el catálogo autorizado.

  - Mediante TLS verificado, los manifiestos actual y de reversión siguen disponibles con HTTP `200`, y el
  manifiesto obsoleto devuelve `404`.


  La comprobación observa la eliminación de manifiestos, no garbage collection; los archivos de `~/quest` son
  copias de trabajo, mientras `/run/dq/facts/0/` en la workstation es autoritativo.

  '
debrief: Retention eliminó un manifest obsoleto sin romper una referencia de reversión real.
stages.0.brief: El resultado de retención debe conservar ambas versiones protegidas.
hints.0.text: Las etiquetas son referencias mutables; La seguridad de retention depende del manifests protegido.
hints.1.text: 'El retention.json propuesto selecciona rollback. Las identidades de los digest protegidos proceden
  de /run/dq/facts/0/release-catalog.json de solo lectura, no de la copia de trabajo.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat retention.json

  cat /run/dq/facts/0/release-catalog.json

  ```'
hints.2.text: |-
  Selecciona solo obsolete y ejecuta bash prune.sh; el helper rechaza digest protegidos y verifica TLS mediante registry-ca.crt.

  Verifica el resultado observado:

  - `jq -e --slurpfile c /run/dq/facts/0/release-catalog.json '(.delete|type)=="array" and (.delete|unique)==[$c[0].obsolete]' retention.json` — Imprime `true` para la solicitud de eliminación guardada.
  - `source platform.env; for kind in current rollback obsolete; do digest=$(jq -r --arg kind "$kind" '.[$kind]' /run/dq/facts/0/release-catalog.json); code=$(curl -sS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' -o /dev/null -w '%{http_code}' "https://$REGISTRY/v2/parcel/manifests/$digest"); printf "%s %s\n" "$kind" "$code"; done` — Informa `current 200`, `rollback 200`, `obsolete 404`, con verificación del certificado activada.

phrases.0: Protegí los resúmenes de reversión antes de eliminar el obsoleto manifests.
phrases.1: Verifiqué TLS en lugar de omitir las verificaciones de certificados.
phrases.2: Distinguí la eliminación de manifest del almacenamiento garbage collection.
stages.0.objectives.0.text: '`~/quest/retention.json` en la estación de trabajo selecciona solo la versión
  obsoleta identificada en el catálogo autorizado.'
stages.0.objectives.1.text: Mediante TLS verificado, los manifiestos actual y de reversión siguen disponibles
  con HTTP `200`, y el manifiesto obsoleto devuelve `404`.
