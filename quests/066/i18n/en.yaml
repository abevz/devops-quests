title: Registry retention
brief: 'The private game registry holds three distinct manifests: rollback, current
  and obsolete, listed in release-catalog.json. The proposed retention.json incorrectly
  selects rollback. Correct it to remove only obsolete and execute bash prune.sh.
  The helper refuses protected digests and verifies TLS using registry-ca.crt. Current
  and rollback must remain retrievable by digest. This bay has no Kubernetes; deletion
  is enabled only for this disposable retention registry. Manifest deletion is not
  a garbage-collection exercise.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `registry-ca.crt`,
  `variant-context/Dockerfile`, `release-catalog.json`, `retention.json`, `prune.sh`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Only obsolete returns 404 by digest; current and rollback
  return 200 with verified TLS.


  The authoritative setup evidence is read-only under `/run/dq/facts/0/`; matching
  files in `~/quest` are working copies.'
debrief: Retention removed an obsolete manifest without breaking a real rollback reference.
stages.0.brief: 'Success criteria: Only obsolete returns 404 by digest; current and
  rollback return 200 with verified TLS.'
stages.0.objectives.0.text: Only obsolete returns 404 by digest; current and rollback
  return 200 with verified TLS.
hints.0.text: Tags are mutable references; retention safety depends on protected manifests.
hints.1.text: Inspect all three digest identities before executing deletion.
hints.2.text: Select obsolete only, run the guarded helper and test protected digests
  through the registry API.
phrases.0: I protected rollback digests before deleting obsolete manifests.
phrases.1: I verified TLS instead of bypassing certificate checks.
phrases.2: I distinguished manifest removal from storage garbage collection.
