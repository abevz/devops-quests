title: Registry retention
brief: 'The retention request and surviving release aliases do not describe a consistent release inventory. Recover
  safe retention without replacing the registry or its authority.


  Work in `~/quest`. Supplied source records identify the original authority and protected publication; backend-frozen
  copies under `/run/dq/facts/0/` remain authoritative. Preserve the original identities, programs, access boundaries
  and TLS trust. Keep credentials private; do not print them or replace the protected source.


  Inputs: `platform.env`, `registry-ca.crt`, `release-catalog.json`, `registry-source.json`, `retention.json` and
  the `prune.sh` workspace. Construct the required registry operations; the workspace contains no complete deletion
  implementation. Manifest removal does not prove blob garbage collection.


  **Requirements:**


  - Workstation `~/quest/retention.json` selects only the obsolete release identified by the authoritative catalog.

  - Over the original verified TLS authority, current and rollback manifests return `200`, the obsolete manifest
  returns `404`, and the surviving release aliases resolve to the approved digests.'
debrief: The original source and consumer identities were preserved, and the approved release was verified at each
  affected boundary.
stages.0.brief: The retention request and surviving release aliases do not describe a consistent release inventory.
  Recover safe retention without replacing the registry or its authority.
hints.0.text: A mutable tag, an immutable manifest and the bytes retained by storage are different objects.
hints.1.text: |-
  Compare the proposed retention plan, approved digest catalog and live tag bindings before changing registry data.

  Compare the digest referenced by each live tag with the approved retention entries. Check which tags still share a digest.

  ```bash
  cat retention.json release-catalog.json
  jq '{endpoint,ca_sha256}' registry-source.json
  source platform.env
  curl -fsS --max-time 3 --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$REGISTRY/v2/parcel/tags/list" | jq '{tags}'
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'
  import urllib.error

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  catalog=json.loads(Path('/run/dq/facts/0/release-catalog.json').read_text())
  assert manifest('current')==catalog['current']
  assert manifest('1')==catalog['rollback']

  for role in ('current','rollback','obsolete'):
   digest=catalog[role]
   try:
    observed=manifest(digest)
    assert role!='obsolete' and observed==digest
   except urllib.error.HTTPError as error:
    assert role=='obsolete' and error.code==404

  print('OK')
  VERIFY_RELEASE
  ```

  Expected: OK. Credentials are not displayed.
phrases.0: I protected rollback digests before deleting obsolete manifests.
phrases.1: I verified TLS instead of bypassing certificate checks.
phrases.2: I distinguished manifest removal from storage garbage collection.
stages.0.objectives.0.text: Workstation `~/quest/retention.json` selects only the obsolete release identified by
  the authoritative catalog.
stages.0.objectives.1.text: Over the original verified TLS authority, current and rollback manifests return `200`,
  the obsolete manifest returns `404`, and the surviving release aliases resolve to the approved digests.
