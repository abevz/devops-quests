diagnostics.retention_plan: The retention plan does not select only the frozen obsolete digest or cannot be read; the supplied plan selects rollback, and selecting by a mutable tag or editing the working catalog can target a protected release. [Cause and check](guides#guide=gitops-delivery&section=retention-approved-obsolete-selection)
diagnostics.probe_0_1: The original registry did not verify the required manifest states and surviving aliases; obsolete may remain, a protected digest may be missing or current may still point to rollback, while changed authority, credentials, CA trust, digest headers or failed observations can also explain it. [Cause and check](guides#guide=gitops-delivery&section=retention-original-registry-and-aliases)
