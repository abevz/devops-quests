title: Aufbewahrung der Registrierung
brief: 'Das private Spiel registry enthält drei verschiedene manifests: rollback, aktuell und obsolete,
  aufgeführt in release-catalog.json. Der vorgeschlagene retention.json wählt fälschlicherweise rollback
  aus. Korrigieren Sie es, um nur obsolete zu entfernen und bash prune.sh auszuführen. Der Helfer lehnt
  geschützte Digests ab und überprüft TLS mithilfe von registry-ca.crt. Strom und rollback müssen durch
  digest abrufbar bleiben. Dieser Schacht hat kein Kubernetes; Das Löschen ist nur für diese Einwegaufbewahrung
  registry aktiviert. Das Löschen von Manifesten ist keine Garbage-Collection-Übung.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `registry-ca.crt`,
  `variant-context/Dockerfile`, `release-catalog.json`, `retention.json`, `prune.sh`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Nur obsolete gibt 404 von digest zurück; Strom und rollback geben 200
  mit verifiziertem TLS zurück.


  Der maßgebliche Setup-Beweis ist unter `/run/dq/facts/0/` schreibgeschützt; übereinstimmende Dateien
  in `~/quest` sind Arbeitskopien.'
debrief: Retention hat einen veralteten manifest entfernt, ohne eine echte Rollback-Referenz zu zerstören.
stages.0.brief: 'Erfolgskriterien: Nur obsolete gibt 404 von digest zurück; Strom und rollback geben 200
  mit verifiziertem TLS zurück.'
stages.0.objectives.0.text: Nur obsolete gibt 404 von digest zurück; Strom und rollback geben 200 mit
