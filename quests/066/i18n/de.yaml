diagnostics.retention_plan: Der Retention-Plan wählt nicht ausschließlich den geschützten obsolete Digest oder ist unlesbar; der gelieferte Plan wählt rollback und die Auswahl nach veränderlichem Tag oder bearbeitetem Katalog kann ein geschütztes Release treffen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=retention-approved-obsolete-selection)
diagnostics.probe_0_1: Die ursprüngliche Registry bestätigte Manifestzustände und verbleibende Aliase nicht; obsolete kann verbleiben, ein geschützter Digest fehlen oder current noch auf rollback zeigen, während geänderte Gegenstelle, Zugangsdaten, CA-Vertrauen, Digest-Header oder Beobachtungsfehler dies ebenfalls erklären. [Ursache und Prüfung](guides#guide=gitops-delivery&section=retention-original-registry-and-aliases)
