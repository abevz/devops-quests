title: Aufbewahrung der Registrierung
brief: 'Aufbewahrungsanfrage und verbleibende Release-Tags beschreiben keinen konsistenten Bestand. Stellen Sie
  sichere Aufbewahrung ohne Ersatz der Registry oder ihrer Identität her.


  Arbeiten Sie in `~/quest`. Quellenaufzeichnungen beschreiben ursprüngliche Autorität und geschützte Publikation;
  eingefrorene Kopien unter `/run/dq/facts/0/` bleiben maßgeblich. Identitäten, Programme, Zugriffsgrenzen und TLS-Vertrauen
  bewahren. Zugangsdaten nicht ausgeben; die geschützte Quelle nicht ersetzen.


  Eingaben: `platform.env`, `registry-ca.crt`, `release-catalog.json`, `registry-source.json`, `retention.json`
  und Arbeitsbereich `prune.sh`. Konstruieren Sie die Registry-Operationen; das Gerüst enthält keine fertige Löschung.
  Manifest-Löschung belegt keine Blob-Garbage-Collection.


  **Anforderungen:**


  - `~/quest/retention.json` auf der Workstation wählt ausschließlich die im maßgeblichen Katalog bezeichnete veraltete
  Version aus.

  - Über die ursprüngliche geprüfte TLS-Autorität liefern aktuelles und Rollback-Manifest `200`, das veraltete `404`;
  verbleibende Release-Tags zeigen auf freigegebene Digests.'
debrief: Ursprüngliche Quellen- und Verbraucheridentitäten blieben erhalten; das freigegebene Release wurde an jeder
  betroffenen Grenze geprüft.
stages.0.brief: Aufbewahrungsanfrage und verbleibende Release-Tags beschreiben keinen konsistenten Bestand. Stellen
  Sie sichere Aufbewahrung ohne Ersatz der Registry oder ihrer Identität her.
hints.0.text: Veränderlicher Tag, unveränderliches Manifest und gespeicherte Bytes sind unterschiedliche Objekte.
hints.1.text: |-
  Vor Registry-Änderungen Aufbewahrungsplan, freigegebenen Digest-Katalog und aktive Tag-Bindungen vergleichen.

  Vergleiche den Digest jedes vorhandenen Tags mit den genehmigten Aufbewahrungseinträgen. Prüfe, welche Tags auf denselben Digest zeigen.

  ```bash
  cat retention.json release-catalog.json
  jq '{endpoint,ca_sha256}' registry-source.json
  source platform.env
  curl -fsS --max-time 3 --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$REGISTRY/v2/parcel/tags/list" | jq '{tags}'
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'
  import urllib.error

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  catalog=json.loads(Path('/run/dq/facts/0/release-catalog.json').read_text())
  assert manifest('current')==catalog['current']
  assert manifest('1')==catalog['rollback']

  for role in ('current','rollback','obsolete'):
   digest=catalog[role]
   try:
    observed=manifest(digest)
    assert role!='obsolete' and observed==digest
   except urllib.error.HTTPError as error:
    assert role=='obsolete' and error.code==404

  print('OK')
  VERIFY_RELEASE
  ```

  Erwartet: OK. Keine Zugangsdaten werden ausgegeben.
phrases.0: Ich habe Rollback-Digests geschützt, bevor ich veraltete manifests gelöscht habe.
phrases.1: Ich habe TLS verifiziert, anstatt die Zertifikatsprüfungen zu umgehen.
phrases.2: Ich habe die Entfernung von manifest aus dem Speicher garbage collection unterschieden.
stages.0.objectives.0.text: '`~/quest/retention.json` auf der Workstation wählt ausschließlich die im maßgeblichen
  Katalog bezeichnete veraltete Version aus.'
