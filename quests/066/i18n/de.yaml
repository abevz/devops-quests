hints.0.text: Tags sind veränderliche Referenzen; Die Sicherheit von retention hängt vom geschützten manifests
  ab.
hints.1.text: Überprüfen Sie alle drei digest-Identitäten, bevor Sie den Löschvorgang ausführen.
hints.2.text: Wählen Sie nur obsolete aus, führen Sie den geschützten helper aus und testen Sie geschützte
  Digests über registry API.
phrases.0: Ich habe Rollback-Digests geschützt, bevor ich veraltete manifests gelöscht habe.
phrases.1: Ich habe TLS verifiziert, anstatt die Zertifikatsprüfungen zu umgehen.
phrases.2: Ich habe die Entfernung von manifest aus dem Speicher garbage collection unterschieden.
