title: Хранение образов реестра
brief: 'Запрос хранения и теги сохраняемых релизов описывают несогласованное состояние. Восстановите безопасное
  хранение, сохранив исходный registry и его учётные данные.


  Работайте в `~/quest`. Исходные записи описывают доверенный источник и защищённую публикацию; замороженные копии
  в `/run/dq/facts/0/` остаются авторитетными. Сохраните исходные идентичности, программы, границы доступа и доверие
  TLS. Не выводите учётные данные и не заменяйте защищённый источник.


  Входы: `platform.env`, `registry-ca.crt`, `release-catalog.json`, `registry-source.json`, `retention.json` и заготовка
  `prune.sh`. Постройте нужные операции registry: заготовка не содержит готового удаления. Удаление манифеста не
  доказывает сборку мусора blob.


  **Требования:**


  - Файл `~/quest/retention.json` на рабочей станции выбирает только устаревший релиз, указанный в авторитетном
  каталоге.

  - Через исходный проверяемый TLS текущий и резервный манифесты возвращают `200`, устаревший — `404`, а теги сохраняемых
  релизов указывают на утверждённые digest.'
debrief: Идентичности исходных источников и потребителей сохранены; утверждённый релиз проверен на каждой затронутой
  границе.
stages.0.brief: Запрос хранения и теги сохраняемых релизов описывают несогласованное состояние. Восстановите безопасное
  хранение, сохранив исходный registry и его учётные данные.
hints.0.text: Изменяемый тег, неизменяемый манифест и байты в хранилище — разные объекты.
hints.1.text: |-
  До изменения registry сопоставьте предложенный план, каталог утверждённых digest и действующие привязки тегов.

  Сравните дайджесты действующих тегов с утверждённым списком хранения. Проверьте, какие теги указывают на один дайджест.

  ```bash
  cat retention.json release-catalog.json
  jq '{endpoint,ca_sha256}' registry-source.json
  source platform.env
  curl -fsS --max-time 3 --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$REGISTRY/v2/parcel/tags/list" | jq '{tags}'
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'
  import urllib.error

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  catalog=json.loads(Path('/run/dq/facts/0/release-catalog.json').read_text())
  assert manifest('current')==catalog['current']
  assert manifest('1')==catalog['rollback']

  for role in ('current','rollback','obsolete'):
   digest=catalog[role]
   try:
    observed=manifest(digest)
    assert role!='obsolete' and observed==digest
   except urllib.error.HTTPError as error:
    assert role=='obsolete' and error.code==404

  print('OK')
  VERIFY_RELEASE
  ```

  Ожидается OK. Учётные данные не выводятся.
phrases.0: Я защитил digest отката до удаления устаревших manifests.
phrases.1: Я проверил TLS вместо обхода проверки сертификата.
phrases.2: Я различал удаление manifest и garbage collection хранилища.
