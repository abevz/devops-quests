title: Хранение образов реестра
brief: 'Запрос хранения и теги сохраняемых релизов описывают несогласованное состояние. Восстановите безопасное
  хранение, сохранив исходный registry и его учётные данные.


  Работайте в `~/quest`. Исходные записи описывают доверенный источник и защищённую публикацию; замороженные копии
  в `/run/dq/facts/0/` остаются авторитетными. Сохраните исходные идентичности, программы, границы доступа и доверие
  TLS. Не выводите учётные данные и не заменяйте защищённый источник.


  Входы: `platform.env`, `registry-ca.crt`, `release-catalog.json`, `registry-source.json`, `retention.json` и заготовка
  `prune.sh`. Постройте нужные операции registry: заготовка не содержит готового удаления. Удаление манифеста не
  доказывает сборку мусора blob.


  **Требования:**


  - Файл `~/quest/retention.json` на рабочей станции выбирает только устаревший релиз, указанный в авторитетном
  каталоге.

  - Через исходный проверяемый TLS текущий и резервный манифесты возвращают `200`, устаревший — `404`, а теги сохраняемых
  релизов указывают на утверждённые digest.'
debrief: Идентичности исходных источников и потребителей сохранены; утверждённый релиз проверен на каждой затронутой
  границе.
stages.0.brief: Запрос хранения и теги сохраняемых релизов описывают несогласованное состояние. Восстановите безопасное
  хранение, сохранив исходный registry и его учётные данные.
hints.0.text: Изменяемый тег, неизменяемый манифест и байты в хранилище — разные объекты.
hints.1.text: 'До изменения registry сопоставьте предложенный план, каталог утверждённых digest и действующие привязки
  тегов.


  ```bash

  cat retention.json release-catalog.json registry-source.json

  source platform.env

  curl -fsS --max-time 3 --cacert registry-ca.crt --config <(printf ''user = "%s:%s"\n'' "$REGISTRY_USER" "$REGISTRY_PASSWORD")
  "https://$REGISTRY/v2/parcel/tags/list" | jq ''{tags}''

  ```'
hints.2.text: "\n\nВыберите только утверждённый устаревший digest. Постройте проверяемые DELETE-запросы к исходному\
  \ registry с сохранением приватной идентичности и CA; восстановите тег текущего релиза публикацией утверждённого\
  \ текущего манифеста. Сохраните резервный тег. Локальный тег образа не меняет registry.\n\n```bash\nset -euo pipefail\n\
  cd ~/quest\nsource platform.env\npython3 -I - <<'VERIFY_RELEASE'\nimport urllib.error\n\nimport base64,hashlib,json,os,ssl,urllib.request\n\
  from pathlib import Path\nsource=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())\nassert\
  \ os.environ['REGISTRY']==source['endpoint']\nassert os.environ['REGISTRY_USER']==source['username']\nassert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']\n\
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\
  \ def redirect_request(self,*args,**kwargs):\n  return None\nopener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),\n\
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))\nheaders={'Authorization':'Basic\
  \ '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),\n'Accept':'application/vnd.docker.distribution.manifest.v2+json,\
  \ application/vnd.oci.image.manifest.v1+json'}\ndef manifest(reference):\n request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)\n\
  \ with opener.open(request,timeout=2) as response:\n  body=response.read(2097153)\n  assert len(body)<=2097152\n\
  \  digest='sha256:'+hashlib.sha256(body).hexdigest()\n  assert response.headers.get('Docker-Content-Digest')==digest\n\
  \  return digest\n\ncatalog=json.loads(Path('/run/dq/facts/0/release-catalog.json').read_text())\nassert manifest('current')==catalog['current']\n\
  assert manifest('1')==catalog['rollback']\n\nfor role in ('current','rollback','obsolete'):\n digest=catalog[role]\n\
  \ try:\n  observed=manifest(digest)\n  assert role!='obsolete' and observed==digest\n except urllib.error.HTTPError\
  \ as error:\n  assert role=='obsolete' and error.code==404\n\nprint('OK')\nVERIFY_RELEASE\n```\n\nОжидается OK.\
  \ Учётные данные не выводятся."
phrases.0: Я защитил digest отката до удаления устаревших manifests.
phrases.1: Я проверил TLS вместо обхода проверки сертификата.
phrases.2: Я различал удаление manifest и garbage collection хранилища.
stages.0.objectives.0.text: Файл `~/quest/retention.json` на рабочей станции выбирает только устаревший релиз, указанный
  в авторитетном каталоге.
stages.0.objectives.1.text: Через исходный проверяемый TLS текущий и резервный манифесты возвращают `200`, устаревший
  — `404`, а теги сохраняемых релизов указывают на утверждённые digest.
