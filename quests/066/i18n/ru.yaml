title: Хранение образов реестра
brief: 'В приватном игровом registry три разных manifest: rollback, current и obsolete из release-catalog.json.
  План retention.json ошибочно выбирает rollback. Исправьте его на удаление только obsolete и выполните
  bash prune.sh. Helper отклоняет защищённые digest и проверяет TLS через registry-ca.crt. Current и rollback
  должны читаться по digest. Kubernetes здесь нет; удаление включено только в этом одноразовом registry.
  Удаление manifest не является упражнением garbage collection.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `registry-ca.crt`,
  `variant-context/Dockerfile`, `release-catalog.json`, `retention.json`, `prune.sh`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Только obsolete возвращает 404 по digest; current и rollback — 200 при проверенном
  TLS.


  Исходные метки проверки доступны только для чтения в `/run/dq/facts/0/`; одноимённые файлы в `~/quest`
  — рабочие копии.'
debrief: Retention удалил устаревший manifest, сохранив реальную ссылку отката.
