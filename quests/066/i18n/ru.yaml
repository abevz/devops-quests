hints.0.text: Теги — изменяемые ссылки; безопасность retention зависит от защищённых manifests.
hints.1.text: Изучите identity всех трёх digest до удаления.
hints.2.text: Выберите только obsolete, запустите helper с проверками и прочитайте защищённые digest через
  API registry.
