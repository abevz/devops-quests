diagnostics.retention_plan: 'План retention не выбирает только замороженный obsolete digest либо не читается: выданный план выбирает rollback, а выбор по изменяемому тегу или рабочему каталогу может затронуть защищённый выпуск. [Причина и проверка](guides#guide=gitops-delivery&section=retention-approved-obsolete-selection)'
diagnostics.probe_0_1: 'Исходный registry не подтвердил нужные состояния манифестов и ссылки: obsolete ещё доступен, защищённый digest отсутствует или current всё ещё указывает на rollback; изменённые authority, учётные данные, доверие CA, заголовки digest или ошибки наблюдения также могут быть причиной. [Причина и проверка](guides#guide=gitops-delivery&section=retention-original-registry-and-aliases)'
