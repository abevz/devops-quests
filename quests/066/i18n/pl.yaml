title: Przechowywanie rejestru
brief: 'Żądanie retencji i zachowane tagi nie opisują spójnego zestawu wydań. Przywróć bezpieczną retencję bez zastępowania
  registry lub jego tożsamości.


  Pracuj w `~/quest`. Zapisy źródła określają pierwotną tożsamość i chronioną publikację; zamrożone kopie w `/run/dq/facts/0/`
  pozostają autorytatywne. Zachowaj tożsamości, programy, granice dostępu i zaufanie TLS. Nie wypisuj danych uwierzytelniających;
  nie zastępuj chronionego źródła.


  Wejścia: `platform.env`, `registry-ca.crt`, `release-catalog.json`, `registry-source.json`, `retention.json` i
  szkielet `prune.sh`. Zbuduj operacje registry; szkielet nie zawiera gotowego usuwania. Usunięcie manifestu nie
  dowodzi oczyszczania blobów.


  **Wymagania:**


  - Plik `~/quest/retention.json` na stacji roboczej wybiera wyłącznie przestarzałe wydanie wskazane w autorytatywnym
  katalogu.

  - Przez pierwotne sprawdzone TLS manifesty bieżący i wycofania zwracają `200`, przestarzały `404`, a zachowane
  tagi wskazują zatwierdzone skróty.'
debrief: Zachowano pierwotne tożsamości źródeł i konsumentów; zatwierdzone wydanie sprawdzono na każdej dotkniętej
  granicy.
stages.0.brief: Żądanie retencji i zachowane tagi nie opisują spójnego zestawu wydań. Przywróć bezpieczną retencję
  bez zastępowania registry lub jego tożsamości.
hints.0.text: Zmienny tag, niezmienny manifest i przechowywane bajty to różne obiekty.
hints.1.text: |-
  Przed zmianą registry porównaj plan retencji, katalog zatwierdzonych skrótów i rzeczywiste powiązania tagów.

  Porównaj digest każdej aktywnej etykiety z zatwierdzonymi wpisami retencji. Sprawdź, które tagi wskazują ten sam digest.

  ```bash
  cat retention.json release-catalog.json
  jq '{endpoint,ca_sha256}' registry-source.json
  source platform.env
  curl -fsS --max-time 3 --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$REGISTRY/v2/parcel/tags/list" | jq '{tags}'
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'
  import urllib.error

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  catalog=json.loads(Path('/run/dq/facts/0/release-catalog.json').read_text())
  assert manifest('current')==catalog['current']
  assert manifest('1')==catalog['rollback']

  for role in ('current','rollback','obsolete'):
   digest=catalog[role]
   try:
    observed=manifest(digest)
    assert role!='obsolete' and observed==digest
   except urllib.error.HTTPError as error:
    assert role=='obsolete' and error.code==404

  print('OK')
  VERIFY_RELEASE
  ```

  Oczekiwane: OK. Dane uwierzytelniające nie są wypisywane.
phrases.0: Chroniłem podsumowania wycofania przed usunięciem przestarzałego manifests.
phrases.1: Zweryfikowałem TLS zamiast ominąć sprawdzanie certyfikatów.
phrases.2: Wyróżniłem usunięcie manifest z magazynu garbage collection.
stages.0.objectives.0.text: Plik `~/quest/retention.json` na stacji roboczej wybiera wyłącznie przestarzałe wydanie
  wskazane w autorytatywnym katalogu.
stages.0.objectives.1.text: Przez pierwotne sprawdzone TLS manifesty bieżący i wycofania zwracają `200`, przestarzały
  `404`, a zachowane tagi wskazują zatwierdzone skróty.
guides.reference_1: Dokumentacja API i diagnostyki
guides.reference_2: Dokumentacja weryfikacji publikacji i konsumentów
diagnostics.retention_plan: Plan retention nie wybiera wyłącznie chronionego obsolete digest lub jest nieczytelny; dostarczony plan wybiera rollback, a wybór według zmiennego tagu lub edytowanego katalogu może trafić w chronione wydanie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=retention-approved-obsolete-selection)
diagnostics.probe_0_1: Pierwotny registry nie potwierdził stanów manifestów i aliasów; obsolete może pozostać, chronionego digest brakować lub current wskazywać rollback, a zmieniona authority, dane logowania, zaufanie CA, nagłówki digest lub błędy obserwacji też to wyjaśniają. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=retention-original-registry-and-aliases)
