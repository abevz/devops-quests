title: Przechowywanie rejestru
brief: 'W rejestrze oczekuje żądanie retencji; chronione wydania muszą pozostać dostępne.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `registry-ca.crt`, `retention.json`, `prune.sh`.


  **Wymagania:**

  - Plik `~/quest/retention.json` na stacji roboczej wybiera wyłącznie przestarzałe wydanie wskazane w autorytatywnym
  katalogu.

  - Przez zweryfikowane TLS bieżący manifest i manifest wycofania pozostają dostępne z HTTP `200`, a przestarzały
  manifest zwraca `404`.


  Sprawdzenie obserwuje usunięcie manifestu, a nie garbage collection; pliki w `~/quest` są kopiami roboczymi,
  a `/run/dq/facts/0/` na workstation jest autorytatywne.

  '
debrief: Retention usunął przestarzały manifest bez przerywania prawdziwego odniesienia do wycofania.
stages.0.brief: Wynik retencji musi zachować oba chronione wydania.
hints.0.text: Tagi to zmienne odniesienia; Bezpieczeństwo retention zależy od chronionego manifests.
hints.1.text: 'Proponowany retention.json wybiera rollback. Tożsamości chronionych digestów pochodzą z /run/dq/facts/0/release-catalog.json
  tylko do odczytu, a nie z kopii roboczej.


  Sprawdź dostarczone dane wejściowe i obserwowany stan:


  ```sh

  cat retention.json

  cat /run/dq/facts/0/release-catalog.json

  ```'
hints.2.text: |-
  Wybierz tylko obsolete i uruchom bash prune.sh; helper odrzuca chronione digesty i weryfikuje TLS przez registry-ca.crt.

  Sprawdź obserwowany wynik:

  - `jq -e --slurpfile c /run/dq/facts/0/release-catalog.json '(.delete|type)=="array" and (.delete|unique)==[$c[0].obsolete]' retention.json` — Wypisuje `true` dla zapisanego żądania usunięcia.
  - `source platform.env; for kind in current rollback obsolete; do digest=$(jq -r --arg kind "$kind" '.[$kind]' /run/dq/facts/0/release-catalog.json); code=$(curl -sS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' -o /dev/null -w '%{http_code}' "https://$REGISTRY/v2/parcel/manifests/$digest"); printf "%s %s\n" "$kind" "$code"; done` — Podaje `current 200`, `rollback 200`, `obsolete 404`, z włączoną weryfikacją certyfikatu.

phrases.0: Chroniłem podsumowania wycofania przed usunięciem przestarzałego manifests.
phrases.1: Zweryfikowałem TLS zamiast ominąć sprawdzanie certyfikatów.
phrases.2: Wyróżniłem usunięcie manifest z magazynu garbage collection.
stages.0.objectives.0.text: Plik `~/quest/retention.json` na stacji roboczej wybiera wyłącznie przestarzałe
  wydanie wskazane w autorytatywnym katalogu.
stages.0.objectives.1.text: Przez zweryfikowane TLS bieżący manifest i manifest wycofania pozostają dostępne
  z HTTP `200`, a przestarzały manifest zwraca `404`.
