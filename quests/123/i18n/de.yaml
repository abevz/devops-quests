title: Argo CD ApplicationSet
brief: |-
  Die Station-Flotte liefert nicht beide erwarteten Dienste aus. Stellen Sie die generierten Anwendungen und ihre beobachtbaren Release-Ergebnisse wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `appset-target.json`, `applicationset.yaml`, `repository/`, `release-commit`, `wait-apps.sh`.

  Sofern nicht anders angegeben, liegen Kubernetes-Ressourcen im Bay-Namespace (`DQ_NAMESPACE`); Pfade unter `~/quest` liegen auf der Workstation.

  **Requirements:**

  - Das vorhandene ApplicationSet generiert genau die Applications `north` und `south`, jeweils mit dem zugehörigen Stationsinhalt aus dem bereitgestellten Repository und unverändertem vorgesehenem Projekt und Bay-Ziel.
  - Beide generierten Applications gehören weiterhin zum vorhandenen ApplicationSet.
  - Beide generierten Applications sind für die bereitgestellte Release-Revision `Synced` und `Healthy`.
  - Deployments `north` und `south` haben jeweils genau `1` bereite Replik.
  - In ihren Pods liefern `http://north:8080` und `http://south:8080` jeweils `north-123` und `south-123`.

    - Die generierten Applications und ihr ApplicationSet bleiben im bereitgestellten Controller-Namespace; Deployments und Services bleiben im Bay-Namespace.

  Der aktuelle generierte Zustand beweist nicht, dass nur der Vorlagenpfad geändert wurde.
debrief: ApplicationSet generiert Application-Spezifikationen; Jeder Application gleicht weiterhin seine
  Arbeitslast ab. Der begrenzte Übermittlungsadapter behält die privaten Werte project, repository und
  destination bei, während ein echter Namespace-Controller die Generierung durchführt.
stages.0.brief: Erhalten Sie den bereitgestellten Controller-Geltungsbereich und die generierte Eigentümerschaft.
hints.0.text: Der Listengenerator liefert station; Die Vorlage erweitert es in jeden Application-Quellpfad.
hints.1.text: |-
  Prüfen Sie das bereitgestellte ApplicationSet und die generierten Applications in ihrem Controller-Namespace.

  ```bash
  cat applicationset.yaml
  ns=$(jq -r .namespace appset-target.json)
  kubectl -n "$ns" get applications north south -o yaml
  ```
hints.2.text: |-
  Verwenden Sie stations/{{.station}}, lassen Sie alle Bereichsfelder unverändert und vergleichen Sie dann Besitzer UID, Revisionen und beide HTTP-Antworten. Die normale Zielabfrage übermittelt `applicationset.yaml` durch den begrenzten Adapter. Behalten Sie `goTemplate: true` und die geordneten Stationen `[north, south]` bei; akzeptiert werden nur das ursprüngliche Manifest oder seine Vorlagenpfadkorrektur. Überprüfen Sie applicationset.yaml und die schreibgeschützten generierten Anwendungen im namespace von appset-target.json.

  Prüfen Sie in `~/quest` auf der Workstation:

  - `ns=$(jq -r .namespace appset-target.json)`
  - `kubectl -n "$ns" get applications north south -o json | jq '.items[] | {name:.metadata.name,sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision,project:.spec.project,repo:.spec.source.repoURL,path:.spec.source.path,destination:.spec.destination.namespace,owners:.metadata.ownerReferences}'`

  Beide sind am Commit aus `release-commit` `Synced` und `Healthy`. Beide nutzen Projekt `station`, das aufgezeichnete Repository, ihre jeweiligen Pfade `stations/north` / `stations/south`, Ziel `DQ_NAMESPACE` und einen `ApplicationSet`-Eigentümer.

  - `kubectl get deployments north south -o json | jq '.items[] | {name:.metadata.name,ready:.status.readyReplicas}'`

  Jedes meldet `ready: 1`.

  ```bash
  for station in north south; do
    kubectl exec deployment/"$station" -- wget -qO- -T 3 "http://$station:8080"
  done
  ```

  `north-123`, `south-123`.

  - `bash wait-apps.sh` — Exit `0`; die Prüfungen des bereitgestellten Releases bestehen.
phrases.0: Ich habe die Application-Generierung von der Workload-Abstimmung getrennt.
phrases.1: Ich habe die Generatorwerte und die Vorlagenerweiterung überprüft.
phrases.2: Ich habe die Controller-Berechtigungen und Ziele begrenzt gehalten.
questions.0.points.0: Generatoren und Vorlagen erzeugen Application-Objekte.
questions.0.points.1: Der Anwendungscontroller gleicht jede generierte Application-Arbeitslast ab.
questions.0.prompt: Wie unterscheidet sich ein ApplicationSet von einem Application?
questions.1.points.0: Eine Vorlage kann Projekte, Repositorys und Ziele auswählen.
questions.1.points.1: Scope-Controller RBAC und validieren Sie die generierten Spezifikationen.
questions.1.prompt: Warum erfordert der Vorlagenzugriff Sorgfalt?
diagnostics.namespace: appset-target.json namespace muss vorhanden und nicht leer sein.
diagnostics.repo: appset-target.json repoURL muss vorhanden und nicht leer sein.
diagnostics.revision: release-commit muss vorhanden und nicht leer sein.
diagnostics.uid: applicationset/station UID muss vorhanden und nicht leer sein.
diagnostics.path: applicationset/station template.source.path muss stations/{{.station}} entsprechen.
diagnostics.gotemplate: applicationset/station goTemplate muss true entsprechen.
diagnostics.stations: applicationset/station generator stations muss [north,south] entsprechen.
diagnostics.count: Es muss genau zwei erzeugte Applications geben.
diagnostics.sync_north: application/north sync.status muss Synced entsprechen.
diagnostics.sync_south: application/south sync.status muss Synced entsprechen.
diagnostics.revision_north: application/north sync.revision muss release-commit entsprechen.
diagnostics.revision_south: application/south sync.revision muss release-commit entsprechen.
diagnostics.health_north: application/north health.status muss Healthy entsprechen.
diagnostics.health_south: application/south health.status muss Healthy entsprechen.
diagnostics.project_north: application/north project muss station entsprechen.
diagnostics.project_south: application/south project muss station entsprechen.
diagnostics.repo_north: application/north repoURL muss appset-target.json repoURL entsprechen.
diagnostics.repo_south: application/south repoURL muss appset-target.json repoURL entsprechen.
diagnostics.source_north: application/north source.path muss stations/north entsprechen.
diagnostics.source_south: application/south source.path muss stations/south entsprechen.
diagnostics.destination_north: application/north destination.namespace muss DQ_NAMESPACE entsprechen.
diagnostics.destination_south: application/south destination.namespace muss DQ_NAMESPACE entsprechen.
diagnostics.owner_north: application/north muss eine ownerReference vom Typ ApplicationSet mit der UID
  des ApplicationSet station haben.
diagnostics.owner_south: application/south muss eine ownerReference vom Typ ApplicationSet mit der UID
  des ApplicationSet station haben.
diagnostics.ready_north: deployment/north readyReplicas muss 1 entsprechen.
diagnostics.ready_south: deployment/south readyReplicas muss 1 entsprechen.
diagnostics.http_north: Die Anfrage an north:8080 muss north-123 liefern.
diagnostics.http_south: Die Anfrage an south:8080 muss south-123 liefern.
