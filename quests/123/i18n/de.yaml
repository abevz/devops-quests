title: Argo CD ApplicationSet
brief: 'Ein privater ApplicationSet-Controller verwendet einen Listengenerator mit zwei Elementen und
  einen Go template. template zeigt auf retired/{{.station}}, aber das private Repository enthält stations/north
  und stations/south.. Bearbeiten Sie nur den template-Pfad in applicationset.json zu stations/{{.station}}.
  Die normale Spieleumfrage sendet einen von zwei begrenzten manifests an den echten Controller; Die direkte
  template-Bearbeitung über API ist absichtlich nicht verfügbar, da dadurch der Repository- oder Zielzugriff
  erweitert werden könnte. Generierte Anwendungen sind im privaten Controller namespace von appset-target.json
  schreibgeschützt. Bestätigen Sie, dass beide Eigentümer dieses ApplicationSet sind, gleichen Sie dasselbe
  Git-Commit ab und stellen Sie ihre unterschiedlichen Antworten bereit.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `appset-target.json`,
  `applicationset.json`, `repository/stations/north/board.json`, `repository/stations/south/board.json`,
  `release-commit`, `wait-apps.sh`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der echte ApplicationSet besitzt zwei fehlerfreie, synchronisierte Anwendungen
  für die genauen privaten Git-Pfade und -Bay; north und south geben north-123 und south-123 zurück.'
debrief: ApplicationSet generiert Application-Spezifikationen; Jeder Application gleicht weiterhin seine
  Arbeitslast ab. Der begrenzte Übermittlungsadapter behält die privaten Werte project, repository und
  destination bei, während ein echter Namespace-Controller die Generierung durchführt.
stages.0.brief: 'Erfolgskriterien: Der echte ApplicationSet besitzt zwei gesunde, synchronisierte Anwendungen
  für die genauen privaten Git-Pfade und -Bay; north und south geben north-123 und south-123 zurück.'
stages.0.objectives.0.text: Der echte ApplicationSet besitzt zwei fehlerfreie, synchronisierte Anwendungen
  für die genauen privaten Git-Pfade und -Bay; north und south geben north-123 und south-123 zurück.
hints.0.text: Der Listengenerator liefert station; Die Vorlage erweitert es in jeden Application-Quellpfad.
hints.1.text: Überprüfen Sie applicationset.json und die schreibgeschützten generierten Anwendungen im
  namespace von appset-target.json.
hints.2.text: Verwenden Sie stations/{{.station}}, lassen Sie alle Bereichsfelder unverändert und vergleichen
  Sie dann Besitzer UID, Revisionen und beide HTTP-Antworten.
phrases.0: Ich habe die Application-Generierung von der Workload-Abstimmung getrennt.
phrases.1: Ich habe die Generatorwerte und die Vorlagenerweiterung überprüft.
phrases.2: Ich habe die Controller-Berechtigungen und Ziele begrenzt gehalten.
questions.0.points.0: Generatoren und Vorlagen erzeugen Application-Objekte.
questions.0.points.1: Der Anwendungscontroller gleicht jede generierte Application-Arbeitslast ab.
questions.0.prompt: Wie unterscheidet sich ein ApplicationSet von einem Application?
questions.1.points.0: Eine Vorlage kann Projekte, Repositorys und Ziele auswählen.
questions.1.points.1: Scope-Controller RBAC und validieren Sie die generierten Spezifikationen.
questions.1.prompt: Warum erfordert der Vorlagenzugriff Sorgfalt?
