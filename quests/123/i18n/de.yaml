diagnostics.namespace: Dem festgehaltenen ApplicationSet-Ziel fehlt möglicherweise ein lesbarer Namespace. Prüfen Sie den gelieferten Namespace vor der Suche nach generierten Applications. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-frozen-namespace)
diagnostics.repo: Der Zielbeleg ist möglicherweise nicht lesbar oder enthält keine Repository-URL. Prüfen Sie repoURL vor dem Vergleich der generierten Quellen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-frozen-repository)
diagnostics.revision: Der festgehaltene Release-Commit ist möglicherweise leer oder nicht lesbar. Prüfen Sie den Beleg vor dem Vergleich des Application-Status. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-approved-release-receipt)
diagnostics.uid: Das aktuelle ApplicationSet station fehlt möglicherweise oder ist nicht lesbar. Lesen Sie seine UID im gelieferten Namespace vor der Owner-Prüfung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-live-uid)
diagnostics.path: Die Vorlage verweist möglicherweise auf das alte Verzeichnis oder einen festen Stationspfad. Prüfen Sie den genauen parametrisierten Pfad stations/{{.station}}. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-template-directory)
diagnostics.gotemplate: Go-Templating ist möglicherweise deaktiviert oder fehlt und der Pfadausdruck wird nicht ersetzt. Prüfen Sie goTemplate auf den booleschen Wert true. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-go-template-mode)
diagnostics.stations: Der erste Listengenerator lässt möglicherweise eine Station aus oder ändert die Reihenfolge. Prüfen Sie station und behalten Sie north vor south bei. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-list-station-elements)
diagnostics.count: Eine erwartete Application fehlt möglicherweise oder der Abruf scheitert. Prüfen Sie, ob der Controller north und south im gelieferten Namespace erzeugt hat. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-expected-pair)
diagnostics.project_north: Die gemeldete Application hat möglicherweise einen anderen AppProject geerbt. Prüfen Sie die generierte Spezifikation und station als project in der Vorlage. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.project_south: Die gemeldete Application hat möglicherweise einen anderen AppProject geerbt. Prüfen Sie die generierte Spezifikation und station als project in der Vorlage. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.repo_north: Die gemeldete Application nutzt möglicherweise ein anderes Repository oder die ursprüngliche URL ist nicht lesbar. Vergleichen Sie repoURL mit dem festgehaltenen appset-target.json. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.repo_south: Die gemeldete Application nutzt möglicherweise ein anderes Repository oder die ursprüngliche URL ist nicht lesbar. Vergleichen Sie repoURL mit dem festgehaltenen appset-target.json. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.source_north: Der Vorlagenausdruck wurde möglicherweise zum falschen Verzeichnis aufgelöst. Prüfen Sie den genauen Pfad, stations/north für north oder stations/south für south. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.source_south: Der Vorlagenausdruck wurde möglicherweise zum falschen Verzeichnis aufgelöst. Prüfen Sie den genauen Pfad, stations/north für north oder stations/south für south. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.destination_north: Die generierte Application verweist möglicherweise auf einen anderen Namespace. Vergleichen Sie das gemeldete Ziel mit dem bereitgestellten Übungs-Namespace. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.destination_south: Die generierte Application verweist möglicherweise auf einen anderen Namespace. Vergleichen Sie das gemeldete Ziel mit dem bereitgestellten Übungs-Namespace. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.owner_north: Einer gleichnamigen Application fehlt möglicherweise der ApplicationSet-Owner oder sie verweist auf eine alte UID. Vergleichen Sie die Owner-UID mit dem aktuellen ApplicationSet station. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.owner_south: Einer gleichnamigen Application fehlt möglicherweise der ApplicationSet-Owner oder sie verweist auf eine alte UID. Vergleichen Sie die Owner-UID mit dem aktuellen ApplicationSet station. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.sync_north: Die gemeldete Application bleibt möglicherweise OutOfSync, weil Quelle oder Abgleich noch nicht fertig sind. Prüfen Sie Synchronisierungsstatus und Fehler. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.sync_south: Die gemeldete Application bleibt möglicherweise OutOfSync, weil Quelle oder Abgleich noch nicht fertig sind. Prüfen Sie Synchronisierungsstatus und Fehler. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.revision_north: Eine Application ist möglicherweise mit einem älteren Commit oder Wartungszweig synchronisiert. Vergleichen Sie die gemeldete Revision mit dem freigegebenen release-commit. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.revision_south: Eine Application ist möglicherweise mit einem älteren Commit oder Wartungszweig synchronisiert. Vergleichen Sie die gemeldete Revision mit dem freigegebenen release-commit. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.health_north: Die gemeldete Application kann die richtige Revision haben, obwohl die Arbeitslast noch nicht Healthy ist. Prüfen Sie Status und zugehörigen Rollout. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.health_south: Die gemeldete Application kann die richtige Revision haben, obwohl die Arbeitslast noch nicht Healthy ist. Prüfen Sie Status und zugehörigen Rollout. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.ready_north: Einer Station fehlt möglicherweise eine bereite Replik oder ihr Deployment fehlt. Prüfen Sie den Rollout der gemeldeten Station und warten Sie auf eine bereite Replik. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.ready_south: Einer Station fehlt möglicherweise eine bereite Replik oder ihr Deployment fehlt. Prüfen Sie den Rollout der gemeldeten Station und warten Sie auf eine bereite Replik. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.http_north: Die gemeldete Station liefert möglicherweise alte Inhalte oder hat keinen erreichbaren Endpoint. Fragen Sie beide ab und vergleichen Sie north mit north-123 und south mit south-123. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.http_south: Die gemeldete Station liefert möglicherweise alte Inhalte oder hat keinen erreichbaren Endpoint. Fragen Sie beide ab und vergleichen Sie north mit north-123 und south mit south-123. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.release_source: Die Vorlage oder eine erzeugte Application verfolgt möglicherweise noch main oder die Remote-Refs wurden verschoben. Vergleichen Sie den freigegebenen Release-Ref und unveränderten Wartungs-main mit dem Remote. Prüfen Sie targetRevision in Vorlage und beiden Applications. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q123-appset-frozen-release-source)
