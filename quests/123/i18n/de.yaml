title: Argo CD ApplicationSet
brief: 'Arbeite in `~/quest` mit `platform.env`, `appset-target.json`, `applicationset.json`, `repository/stations/north/board.json`,
  `repository/stations/south/board.json`, `release-commit` und `wait-apps.sh`. Ein ApplicationSet-Listengenerator liefert
  Werte an eine Go-Vorlage. Setze den Vorlagenpfad genau auf `stations/{{.station}}`, behalte `goTemplate: true` und die geordneten
  Stationen `[north, south]`. Die normale Spielabfrage sendet eines von zwei begrenzten Manifesten an den privaten Controller-Namespace
  aus `appset-target.json`; warte darauf und auf den Abgleich. Dieser Adapter erlaubt nur diese begrenzten Änderungen, keine
  beliebigen API-Edits.


  Die erzeugten Applications north und south müssen diesem ApplicationSet gehören, bei `release-commit` `Synced` und `Healthy`
  sein und Projekt, Repository, eintragsbezogenen Pfad und Namespace der Umgebung aus `wait-apps.sh` und `appset-target.json`
  behalten. Jedes Deployment muss ein bereites Replikat haben; `north:8080` und `south:8080` müssen `north-123` und `south-123`
  liefern. Der aktuelle erzeugte Zustand beweist nicht, dass nur der Vorlagenpfad geändert wurde. Nutze nur die Offline-Umgebung.'
debrief: ApplicationSet generiert Application-Spezifikationen; Jeder Application gleicht weiterhin seine Arbeitslast ab. Der
  begrenzte Übermittlungsadapter behält die privaten Werte project, repository und destination bei, während ein echter Namespace-Controller
  die Generierung durchführt.
stages.0.brief: ApplicationSet-Vorlage, Eigentümer und Status der erzeugten Applications und Antworten beider Deployments
  entsprechen der Beschreibung.
stages.0.objectives.0.text: ApplicationSet-Vorlage, Eigentümer und Status der erzeugten Applications und Antworten beider
  Deployments entsprechen der Beschreibung.
hints.0.text: Der Listengenerator liefert station; Die Vorlage erweitert es in jeden Application-Quellpfad.
hints.1.text: Überprüfen Sie applicationset.json und die schreibgeschützten generierten Anwendungen im namespace von appset-target.json.
hints.2.text: Verwenden Sie stations/{{.station}}, lassen Sie alle Bereichsfelder unverändert und vergleichen Sie dann Besitzer
  UID, Revisionen und beide HTTP-Antworten.
phrases.0: Ich habe die Application-Generierung von der Workload-Abstimmung getrennt.
phrases.1: Ich habe die Generatorwerte und die Vorlagenerweiterung überprüft.
phrases.2: Ich habe die Controller-Berechtigungen und Ziele begrenzt gehalten.
questions.0.points.0: Generatoren und Vorlagen erzeugen Application-Objekte.
questions.0.points.1: Der Anwendungscontroller gleicht jede generierte Application-Arbeitslast ab.
questions.0.prompt: Wie unterscheidet sich ein ApplicationSet von einem Application?
questions.1.points.0: Eine Vorlage kann Projekte, Repositorys und Ziele auswählen.
questions.1.points.1: Scope-Controller RBAC und validieren Sie die generierten Spezifikationen.
questions.1.prompt: Warum erfordert der Vorlagenzugriff Sorgfalt?
