title: Argo CD ApplicationSet
brief: 'Работайте в `~/quest` с `platform.env`, `appset-target.json`, `applicationset.json`, `repository/stations/north/board.json`,
  `repository/stations/south/board.json`, `release-commit` и `wait-apps.sh`. Генератор списка ApplicationSet передаёт значения
  шаблону Go. Установите путь шаблона ровно в `stations/{{.station}}`, сохраните `goTemplate: true` и порядок станций `[north,
  south]`. Обычный игровой опрос отправляет один из двух ограниченных манифестов в приватное пространство контроллера из `appset-target.json`;
  дождитесь отправки и согласования. Этот адаптер допускает только указанные изменения, а не произвольное редактирование API.


  Созданные Application north и south должны принадлежать этому ApplicationSet, быть `Synced` и `Healthy` на `release-commit`
  и сохранять проект, репозиторий, путь каждого элемента и пространство песочницы из `wait-apps.sh` и `appset-target.json`.
  Каждый Deployment должен иметь одну готовую реплику; `north:8080` и `south:8080` должны возвращать `north-123` и `south-123`.
  Текущее созданное состояние не доказывает, что изменён только путь шаблона. Используйте только офлайн-песочницу.'
debrief: ApplicationSet генерирует спецификации Application; каждое Application по-прежнему согласует свою нагрузку. Ограниченная
  передача манифеста сохраняет приватные project, repository и destination, а генерацию выполняет настоящий контроллер с областью
  одного namespace.
stages.0.brief: Шаблон ApplicationSet, владелец и статусы созданных Application и ответы обоих Deployment соответствуют описанию.
stages.0.objectives.0.text: Шаблон ApplicationSet, владелец и статусы созданных Application и ответы обоих Deployment соответствуют
  описанию.
hints.0.text: List-генератор задаёт station; шаблон подставляет его в source path каждого Application.
hints.1.text: Изучите applicationset.json и созданные Application только для чтения в namespace из appset-target.json.
hints.2.text: Укажите stations/{{.station}}, сохраните все поля области доступа, затем сравните UID владельца, ревизии и оба
  HTTP-ответа.
phrases.0: Я разделил генерацию Application и согласование нагрузки.
phrases.1: Я проверил значения генератора и развёртывание шаблона.
phrases.2: Я сохранил ограниченную область прав контроллера и назначений.
questions.0.points.0: Генераторы и шаблоны создают объекты Application.
questions.0.points.1: Контроллер приложений согласует нагрузку каждого созданного Application.
questions.0.prompt: Чем ApplicationSet отличается от Application?
questions.1.points.0: Шаблон может выбирать project, repository и destination.
questions.1.points.1: Ограничивайте RBAC контроллера и проверяйте создаваемые спецификации.
questions.1.prompt: Почему доступ к шаблону требует осторожности?
diagnostics.namespace: appset-target.json namespace должен существовать и быть непустым.
diagnostics.repo: appset-target.json repoURL должен существовать и быть непустым.
diagnostics.revision: release-commit должен существовать и быть непустым.
diagnostics.uid: applicationset/station UID должен существовать и быть непустым.
diagnostics.path: applicationset/station template.source.path должен совпадать с stations/{{.station}}.
diagnostics.gotemplate: applicationset/station goTemplate должен совпадать с true.
diagnostics.stations: applicationset/station generator stations должен совпадать с [north,south].
diagnostics.count: Должны существовать ровно два созданных Application.
diagnostics.sync_north: application/north sync.status должен совпадать с Synced.
diagnostics.sync_south: application/south sync.status должен совпадать с Synced.
diagnostics.revision_north: application/north sync.revision должен совпадать с release-commit.
diagnostics.revision_south: application/south sync.revision должен совпадать с release-commit.
diagnostics.health_north: application/north health.status должен совпадать с Healthy.
diagnostics.health_south: application/south health.status должен совпадать с Healthy.
diagnostics.project_north: application/north project должен совпадать с station.
diagnostics.project_south: application/south project должен совпадать с station.
diagnostics.repo_north: application/north repoURL должен совпадать с appset-target.json repoURL.
diagnostics.repo_south: application/south repoURL должен совпадать с appset-target.json repoURL.
diagnostics.source_north: application/north source.path должен совпадать с stations/north.
diagnostics.source_south: application/south source.path должен совпадать с stations/south.
diagnostics.destination_north: application/north destination.namespace должен совпадать с DQ_NAMESPACE.
diagnostics.destination_south: application/south destination.namespace должен совпадать с DQ_NAMESPACE.
diagnostics.owner_north: У application/north должна быть ownerReference типа ApplicationSet с UID ApplicationSet station.
diagnostics.owner_south: У application/south должна быть ownerReference типа ApplicationSet с UID ApplicationSet station.
diagnostics.ready_north: deployment/north readyReplicas должен совпадать с 1.
diagnostics.ready_south: deployment/south readyReplicas должен совпадать с 1.
diagnostics.http_north: Запрос к north:8080 должен вернуть north-123.
diagnostics.http_south: Запрос к south:8080 должен вернуть south-123.
