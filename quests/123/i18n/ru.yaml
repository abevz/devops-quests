diagnostics.namespace: В исходной записи ApplicationSet мог отсутствовать доступный для чтения namespace. Проверьте выданный namespace перед поиском созданных Application. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-frozen-namespace)
diagnostics.repo: Запись цели могла не читаться или не содержать URL. Проверьте repoURL в исходных данных перед сравнением источников созданных объектов. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-frozen-repository)
diagnostics.revision: Зафиксированный коммит релиза мог не читаться или быть пустым. Проверьте запись утверждённой ревизии перед сравнением статусов Application. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-approved-release-receipt)
diagnostics.uid: Текущий ApplicationSet station мог отсутствовать или не читаться. Получите его UID в выданном namespace перед проверкой владельцев. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-live-uid)
diagnostics.path: Шаблон мог указывать на старый каталог или путь одной станции. Проверьте точный параметризованный путь stations/{{.station}}. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-template-directory)
diagnostics.gotemplate: 'Go-шаблоны могли быть выключены или не заданы, из-за чего выражение пути не раскрывается. Проверьте логическое goTemplate: true. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-go-template-mode)'
diagnostics.stations: Первый list generator мог потерять станцию или сменить порядок. Проверьте station и сохраните north перед south. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-list-station-elements)
diagnostics.count: Один из ожидаемых Application мог отсутствовать либо не читаться. Проверьте, что контроллер создал north и south в выданном namespace. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-expected-pair)
diagnostics.project_north: Указанный Application мог унаследовать другой AppProject. Проверьте созданную спецификацию и проект station в шаблоне. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.project_south: Указанный Application мог унаследовать другой AppProject. Проверьте созданную спецификацию и проект station в шаблоне. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.repo_north: Указанный Application мог ссылаться на другой репозиторий либо исходный URL не читается. Сравните repoURL с зафиксированным appset-target.json. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.repo_south: Указанный Application мог ссылаться на другой репозиторий либо исходный URL не читается. Сравните repoURL с зафиксированным appset-target.json. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.source_north: Выражение шаблона могло раскрыться в неверный каталог. Проверьте точный путь указанного Application, stations/north для north или stations/south для south. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.source_south: Выражение шаблона могло раскрыться в неверный каталог. Проверьте точный путь указанного Application, stations/north для north или stations/south для south. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.destination_north: Созданный Application мог указывать на другой namespace. Сравните назначение указанного объекта с выданным namespace стенда. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.destination_south: Созданный Application мог указывать на другой namespace. Сравните назначение указанного объекта с выданным namespace стенда. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.owner_north: Application с тем же именем мог не иметь ссылки на ApplicationSet либо указывать на прежний UID. Сравните UID владельца с текущим ApplicationSet station. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.owner_south: Application с тем же именем мог не иметь ссылки на ApplicationSet либо указывать на прежний UID. Сравните UID владельца с текущим ApplicationSet station. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.sync_north: Указанный Application мог остаться OutOfSync, пока не готов источник или согласование. Проверьте sync status и ошибки. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.sync_south: Указанный Application мог остаться OutOfSync, пока не готов источник или согласование. Проверьте sync status и ошибки. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.revision_north: Application мог синхронизироваться на прежнем коммите или ветке обслуживания. Сравните наблюдаемую ревизию с утверждённым release-commit. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.revision_south: Application мог синхронизироваться на прежнем коммите или ветке обслуживания. Сравните наблюдаемую ревизию с утверждённым release-commit. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.health_north: У указанного Application может быть нужная ревизия, пока нагрузка не Healthy. Проверьте статус и rollout соответствующего Deployment. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.health_south: У указанного Application может быть нужная ревизия, пока нагрузка не Healthy. Проверьте статус и rollout соответствующего Deployment. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.ready_north: На одной станции могла ещё не появиться готовая реплика либо Deployment отсутствует. Проверьте rollout указанной станции и дождитесь одной готовой реплики. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.ready_south: На одной станции могла ещё не появиться готовая реплика либо Deployment отсутствует. Проверьте rollout указанной станции и дождитесь одной готовой реплики. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.http_north: Указанная станция могла отдавать старое значение либо быть недоступной. Запросите обе станции и сравните north с north-123, а south с south-123. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.http_south: Указанная станция могла отдавать старое значение либо быть недоступной. Запросите обе станции и сравните north с north-123, а south с south-123. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.release_source: Шаблон или созданный Application мог всё ещё отслеживать main, либо приватные refs сдвинулись. Сравните утверждённую ветку релиза и неизменный main с remote. Проверьте targetRevision в шаблоне и обоих созданных Application. [Причина и проверка](guides#guide=gitops-delivery&section=q123-appset-frozen-release-source)
