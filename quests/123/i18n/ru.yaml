title: Argo CD ApplicationSet
brief: 'Приватный контроллер ApplicationSet использует list-генератор из двух элементов
  и Go template. Шаблон ссылается на retired/{{.station}}, хотя в приватном репозитории
  есть stations/north и stations/south. Измените только путь шаблона в applicationset.json
  на stations/{{.station}}. Обычный опрос игры передаёт один из двух ограниченных
  манифестов настоящему контроллеру; прямое редактирование шаблона через API недоступно,
  поскольку могло бы расширить доступ к репозиторию или назначению. Созданные Application
  доступны для чтения в приватном namespace контроллера из appset-target.json. Подтвердите,
  что оба принадлежат этому ApplicationSet, согласовали один Git-коммит и отдают разные
  ответы.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `appset-target.json`, `applicationset.json`, `repository/stations/north/board.json`,
  `repository/stations/south/board.json`, `release-commit`, `wait-apps.sh`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Настоящий ApplicationSet владеет двумя здоровыми синхронизированными
  Application с точными приватными Git-путями и песочницей назначения; north и south
  отвечают north-123 и south-123.'
debrief: ApplicationSet генерирует спецификации Application; каждое Application по-прежнему
  согласует свою нагрузку. Ограниченная передача манифеста сохраняет приватные project,
  repository и destination, а генерацию выполняет настоящий контроллер с областью
  одного namespace.
stages.0.brief: 'Результат проверки: Настоящий ApplicationSet владеет двумя здоровыми
  синхронизированными Application с точными приватными Git-путями и песочницей назначения;
  north и south отвечают north-123 и south-123.'
stages.0.objectives.0.text: Настоящий ApplicationSet владеет двумя здоровыми синхронизированными
  Application с точными приватными Git-путями и песочницей назначения; north и south
  отвечают north-123 и south-123.
hints.0.text: List-генератор задаёт station; шаблон подставляет его в source path
  каждого Application.
hints.1.text: Изучите applicationset.json и созданные Application только для чтения
  в namespace из appset-target.json.
hints.2.text: Укажите stations/{{.station}}, сохраните все поля области доступа, затем
  сравните UID владельца, ревизии и оба HTTP-ответа.
phrases.0: Я разделил генерацию Application и согласование нагрузки.
phrases.1: Я проверил значения генератора и развёртывание шаблона.
phrases.2: Я сохранил ограниченную область прав контроллера и назначений.
questions.0.points.0: Генераторы и шаблоны создают объекты Application.
questions.0.points.1: Контроллер приложений согласует нагрузку каждого созданного
  Application.
questions.0.prompt: Чем ApplicationSet отличается от Application?
questions.1.points.0: Шаблон может выбирать project, repository и destination.
questions.1.points.1: Ограничивайте RBAC контроллера и проверяйте создаваемые спецификации.
questions.1.prompt: Почему доступ к шаблону требует осторожности?
