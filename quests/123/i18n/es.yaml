diagnostics.namespace: El destino fijado de ApplicationSet puede carecer de namespace legible. Revise el namespace suministrado antes de buscar las Application generadas. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-frozen-namespace)
diagnostics.repo: El registro de destino puede ser ilegible u omitir la URL del repositorio. Revise repoURL en la entrada fijada antes de comparar fuentes. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-frozen-repository)
diagnostics.revision: El commit fijado puede ser ilegible o estar vacío. Revise el registro de la revisión aprobada antes de comparar el estado de las Application. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-approved-release-receipt)
diagnostics.uid: El ApplicationSet station activo puede faltar o no ser legible. Lea su UID en el namespace suministrado antes de revisar propietarios. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-live-uid)
diagnostics.path: La plantilla puede señalar el directorio retirado o una estación fija. Revise la ruta parametrizada exacta stations/{{.station}}. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-template-directory)
diagnostics.gotemplate: Las plantillas Go pueden estar apagadas o sin configurar e impedir la expansión de la ruta. Compruebe goTemplate booleano true. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-go-template-mode)
diagnostics.stations: El primer generador de lista puede omitir una estación o cambiar el orden. Revise station y mantenga north seguido de south. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-list-station-elements)
diagnostics.count: Una Application esperada puede faltar o fallar su consulta. Compruebe que el controlador generó north y south en el namespace suministrado. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-expected-pair)
diagnostics.project_north: La Application indicada puede heredar otro AppProject. Revise la especificación generada y el project station en la plantilla. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.project_south: La Application indicada puede heredar otro AppProject. Revise la especificación generada y el project station en la plantilla. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.repo_north: La Application indicada puede apuntar a otro repositorio o carecer de una URL original legible. Compare repoURL con appset-target.json fijado. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.repo_south: La Application indicada puede apuntar a otro repositorio o carecer de una URL original legible. Compare repoURL con appset-target.json fijado. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.source_north: La expresión de plantilla puede expandirse a otro directorio. Revise la ruta exacta, stations/north para north o stations/south para south. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.source_south: La expresión de plantilla puede expandirse a otro directorio. Revise la ruta exacta, stations/north para north o stations/south para south. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.destination_north: La Application generada puede apuntar a otro namespace. Compare el destino afectado con el namespace suministrado del entorno. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.destination_south: La Application generada puede apuntar a otro namespace. Compare el destino afectado con el namespace suministrado del entorno. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.owner_north: Una Application con el mismo nombre puede carecer de propietario ApplicationSet o indicar un UID anterior. Compare el UID con el ApplicationSet station activo. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.owner_south: Una Application con el mismo nombre puede carecer de propietario ApplicationSet o indicar un UID anterior. Compare el UID con el ApplicationSet station activo. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.sync_north: La Application indicada puede seguir OutOfSync porque falta reconciliar la fuente. Revise su estado de sincronización y los errores. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.sync_south: La Application indicada puede seguir OutOfSync porque falta reconciliar la fuente. Revise su estado de sincronización y los errores. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.revision_north: Una Application puede estar Synced en un commit anterior o la rama de mantenimiento. Compare la revisión observada con el release-commit aprobado. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.revision_south: Una Application puede estar Synced en un commit anterior o la rama de mantenimiento. Compare la revisión observada con el release-commit aprobado. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.health_north: La Application indicada puede tener la revisión correcta mientras la carga aún no está Healthy. Revise el estado y el despliegue correspondiente. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.health_south: La Application indicada puede tener la revisión correcta mientras la carga aún no está Healthy. Revise el estado y el despliegue correspondiente. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.ready_north: Una estación puede no tener réplica lista o faltar su Deployment. Revise el despliegue de la estación indicada y espere una réplica lista. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.ready_south: Una estación puede no tener réplica lista o faltar su Deployment. Revise el despliegue de la estación indicada y espere una réplica lista. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.http_north: La estación indicada puede servir contenido anterior o no tener endpoint alcanzable. Consulte ambas y compare north con north-123 y south con south-123. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.http_south: La estación indicada puede servir contenido anterior o no tener endpoint alcanzable. Consulte ambas y compare north con north-123 y south con south-123. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.release_source: La plantilla o una Application generada puede seguir main, o las refs remotas pueden haberse movido. Compare la rama aprobada y main de mantenimiento sin cambios con el remoto. Revise targetRevision en la plantilla y ambas Application. [Causa y comprobación](guides#guide=gitops-delivery&section=q123-appset-frozen-release-source)
