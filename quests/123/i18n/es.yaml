title: Argo CD ApplicationSet
brief: 'Trabaja en `~/quest` con `platform.env`, `appset-target.json`, `applicationset.json`, `repository/stations/north/board.json`,
  `repository/stations/south/board.json`, `release-commit` y `wait-apps.sh`. Un generador de lista de ApplicationSet proporciona
  valores a una plantilla Go. Establece la ruta exactamente en `stations/{{.station}}`, conserva `goTemplate: true` y las
  estaciones ordenadas `[north, south]`. El sondeo normal del juego envía uno de dos manifiestos limitados al namespace privado
  del controlador de `appset-target.json`; espera el envío y la reconciliación. Este adaptador solo admite esos cambios limitados,
  no ediciones arbitrarias por API.


  Las Applications generadas north y south deben pertenecer a este ApplicationSet, estar `Synced` y `Healthy` en `release-commit`
  y conservar el proyecto, repositorio, ruta por entrada y namespace de la bahía que muestran `wait-apps.sh` y `appset-target.json`.
  Cada Deployment debe tener una réplica lista; `north:8080` y `south:8080` deben devolver `north-123` y `south-123`. El estado
  generado actual no demuestra que solo se editó la ruta de plantilla. Usa solo la bahía sin conexión.'
debrief: ApplicationSet genera especificaciones Application; cada Application todavía concilia su carga de trabajo. El adaptador
  de envío limitado conserva los project, repository y destination privados, mientras que un controlador con ámbito de espacio
  de nombres real realiza la generación.
stages.0.brief: La plantilla ApplicationSet, propiedad y estado de las Applications generadas y respuestas de ambos Deployments
  coinciden con la descripción.
stages.0.objectives.0.text: La plantilla ApplicationSet, propiedad y estado de las Applications generadas y respuestas de
  ambos Deployments coinciden con la descripción.
hints.0.text: El generador de listas suministra station; la plantilla la expande en cada ruta de origen Application.
hints.1.text: Inspeccione applicationset.json y las aplicaciones generadas de solo lectura en namespace desde appset-target.json.
hints.2.text: Utilice stations/{{.station}}, mantenga todos los campos de alcance sin cambios, luego compare el propietario
  UID, las revisiones y ambas respuestas de HTTP.
phrases.0: Separé la generación Application de la conciliación de cargas de trabajo.
phrases.1: Revisé los valores del generador y la expansión de la plantilla.
phrases.2: Mantuve los permisos del controlador y los destinos dentro del alcance.
questions.0.points.0: Los generadores y las plantillas producen objetos Application.
questions.0.points.1: El controlador de aplicaciones concilia cada carga de trabajo Application generada.
questions.0.prompt: ¿En qué se diferencia un ApplicationSet de un Application?
questions.1.points.0: Una plantilla puede seleccionar proyectos, repositorios y destinos.
questions.1.points.1: Controlador de alcance RBAC y validar las especificaciones generadas.
questions.1.prompt: ¿Por qué requiere cuidado el acceso a las plantillas?
