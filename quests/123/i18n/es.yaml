title: Argo CD ApplicationSet
brief: 'Un controlador ApplicationSet privado utiliza un generador de listas de dos elementos y un Go
  template. El template apunta a retired/{{.station}}, pero el repositorio privado contiene stations/north
  y stations/south.. Edite solo la ruta template en applicationset.json a stations/{{.station}}. La encuesta
  de juego ordinaria envía uno de los dos manifests limitados al controlador real; La edición directa
  de template a través de API no está disponible intencionalmente porque podría ampliar el acceso al repositorio
  o al destino. Las aplicaciones generadas son de solo lectura en el controlador privado namespace de
  appset-target.json. Confirme que ambos son propiedad de este ApplicationSet, concilie el mismo compromiso
  de Git y entregue sus distintas respuestas.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `appset-target.json`,
  `applicationset.json`, `repository/stations/north/board.json`, `repository/stations/south/board.json`,
  `release-commit`, `wait-apps.sh`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el ApplicationSet real posee dos aplicaciones sincronizadas y en buen
  estado para las rutas y bahías privadas exactas de Git; north y south devuelven north-123 y south-123.'
debrief: ApplicationSet genera especificaciones Application; cada Application todavía concilia su carga
  de trabajo. El adaptador de envío limitado conserva los project, repository y destination privados,
  mientras que un controlador con ámbito de espacio de nombres real realiza la generación.
stages.0.brief: 'Criterios de éxito: el ApplicationSet real posee dos aplicaciones sincronizadas y en
  buen estado para las rutas y bahías privadas exactas de Git; north y south devuelven north-123 y south-123.'
stages.0.objectives.0.text: El ApplicationSet real posee dos aplicaciones sincronizadas y en buen estado
  para las rutas y bahías privadas exactas de Git; north y south devuelven north-123 y south-123.
hints.0.text: El generador de listas suministra station; la plantilla la expande en cada ruta de origen
  Application.
hints.1.text: Inspeccione applicationset.json y las aplicaciones generadas de solo lectura en namespace
  desde appset-target.json.
hints.2.text: Utilice stations/{{.station}}, mantenga todos los campos de alcance sin cambios, luego compare
  el propietario UID, las revisiones y ambas respuestas de HTTP.
phrases.0: Separé la generación Application de la conciliación de cargas de trabajo.
phrases.1: Revisé los valores del generador y la expansión de la plantilla.
phrases.2: Mantuve los permisos del controlador y los destinos dentro del alcance.
questions.0.points.0: Los generadores y las plantillas producen objetos Application.
questions.0.points.1: El controlador de aplicaciones concilia cada carga de trabajo Application generada.
questions.0.prompt: ¿En qué se diferencia un ApplicationSet de un Application?
questions.1.points.0: Una plantilla puede seleccionar proyectos, repositorios y destinos.
questions.1.points.1: Controlador de alcance RBAC y validar las especificaciones generadas.
questions.1.prompt: ¿Por qué requiere cuidado el acceso a las plantillas?
