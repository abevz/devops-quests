title: Argo CD ApplicationSet
brief: |-
  La flota station no entrega ambos servicios esperados. Recupera las aplicaciones generadas y sus resultados de versión observables.

  Trabaja en la workstation en `~/quest` con `platform.env`, `appset-target.json`, `applicationset.yaml`, `repository/`, `release-commit`, `wait-apps.sh`.

  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas bajo `~/quest` están en la workstation.

  **Requirements:**

  - El ApplicationSet existente genera exactamente las Applications `north` y `south`, cada una con el contenido de su estación del repositorio suministrado, conservando el proyecto y destino de la bahía previstos.
  - Ambas Applications generadas siguen perteneciendo al ApplicationSet existente.
  - Ambas Applications generadas están `Synced` y `Healthy` en la revisión suministrada de la versión.
  - Los Deployments `north` y `south` tienen exactamente `1` réplica lista cada uno.
  - Dentro de sus Pods, `http://north:8080` y `http://south:8080` devuelven `north-123` y `south-123`, respectivamente.

    - Las Applications generadas y su ApplicationSet permanecen en el namespace del controlador suministrado; los Deployments y Services permanecen en el namespace de la bahía.

  El estado generado actual no demuestra que solo se editara la ruta de la plantilla.
debrief: ApplicationSet genera especificaciones Application; cada Application todavía concilia su carga
  de trabajo. El adaptador de envío limitado conserva los project, repository y destination privados,
  mientras que un controlador con ámbito de espacio de nombres real realiza la generación.
stages.0.brief: Conserva el ámbito del controlador suministrado y la propiedad generada.
hints.0.text: El generador de listas suministra station; la plantilla la expande en cada ruta de origen
  Application.
hints.1.text: |-
  Inspecciona el ApplicationSet suministrado y las Applications generadas en su namespace del controlador.

  ```bash
  cat applicationset.yaml
  ns=$(jq -r .namespace appset-target.json)
  kubectl -n "$ns" get applications north south -o yaml
  ```
hints.2.text: |-
  Utilice stations/{{.station}}, mantenga todos los campos de alcance sin cambios, luego compare el propietario UID, las revisiones y ambas respuestas de HTTP. La consulta normal de objetivos envía `applicationset.yaml` mediante el adaptador limitado. Conserva `goTemplate: true` y las estaciones ordenadas `[north, south]`; solo acepta el manifiesto original o su corrección de ruta de plantilla. Inspeccione applicationset.yaml y las aplicaciones generadas de solo lectura en namespace desde appset-target.json.

  Verifica desde `~/quest` en la workstation:

  - `ns=$(jq -r .namespace appset-target.json)`
  - `kubectl -n "$ns" get applications north south -o json | jq '.items[] | {name:.metadata.name,sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision,project:.spec.project,repo:.spec.source.repoURL,path:.spec.source.path,destination:.spec.destination.namespace,owners:.metadata.ownerReferences}'`

  Ambas están `Synced` y `Healthy` en `release-commit`. Ambas usan proyecto `station`, el repositorio registrado, sus rutas respectivas `stations/north` / `stations/south`, destino `DQ_NAMESPACE` y un propietario `ApplicationSet`.

  - `kubectl get deployments north south -o json | jq '.items[] | {name:.metadata.name,ready:.status.readyReplicas}'`

  Cada uno informa `ready: 1`.

  ```bash
  for station in north south; do
    kubectl exec deployment/"$station" -- wget -qO- -T 3 "http://$station:8080"
  done
  ```

  `north-123`, `south-123`.

  - `bash wait-apps.sh` — código `0`; pasan las comprobaciones de la versión suministrada.
phrases.0: Separé la generación Application de la conciliación de cargas de trabajo.
phrases.1: Revisé los valores del generador y la expansión de la plantilla.
phrases.2: Mantuve los permisos del controlador y los destinos dentro del alcance.
questions.0.points.0: Los generadores y las plantillas producen objetos Application.
questions.0.points.1: El controlador de aplicaciones concilia cada carga de trabajo Application generada.
questions.0.prompt: ¿En qué se diferencia un ApplicationSet de un Application?
questions.1.points.0: Una plantilla puede seleccionar proyectos, repositorios y destinos.
questions.1.points.1: Controlador de alcance RBAC y validar las especificaciones generadas.
questions.1.prompt: ¿Por qué requiere cuidado el acceso a las plantillas?
diagnostics.namespace: appset-target.json namespace debe existir y no estar vacío.
diagnostics.repo: appset-target.json repoURL debe existir y no estar vacío.
diagnostics.revision: release-commit debe existir y no estar vacío.
diagnostics.uid: applicationset/station UID debe existir y no estar vacío.
diagnostics.path: applicationset/station template.source.path debe ser igual a stations/{{.station}}.
diagnostics.gotemplate: applicationset/station goTemplate debe ser igual a true.
diagnostics.stations: applicationset/station generator stations debe ser igual a [north,south].
diagnostics.count: Debe haber exactamente dos Applications generadas.
diagnostics.sync_north: application/north sync.status debe ser igual a Synced.
diagnostics.sync_south: application/south sync.status debe ser igual a Synced.
diagnostics.revision_north: application/north sync.revision debe ser igual a release-commit.
diagnostics.revision_south: application/south sync.revision debe ser igual a release-commit.
diagnostics.health_north: application/north health.status debe ser igual a Healthy.
diagnostics.health_south: application/south health.status debe ser igual a Healthy.
diagnostics.project_north: application/north project debe ser igual a station.
diagnostics.project_south: application/south project debe ser igual a station.
diagnostics.repo_north: application/north repoURL debe ser igual a appset-target.json repoURL.
diagnostics.repo_south: application/south repoURL debe ser igual a appset-target.json repoURL.
diagnostics.source_north: application/north source.path debe ser igual a stations/north.
diagnostics.source_south: application/south source.path debe ser igual a stations/south.
diagnostics.destination_north: application/north destination.namespace debe ser igual a DQ_NAMESPACE.
diagnostics.destination_south: application/south destination.namespace debe ser igual a DQ_NAMESPACE.
diagnostics.owner_north: application/north debe tener ownerReference de tipo ApplicationSet con el UID
  de ApplicationSet station.
diagnostics.owner_south: application/south debe tener ownerReference de tipo ApplicationSet con el UID
  de ApplicationSet station.
diagnostics.ready_north: deployment/north readyReplicas debe ser igual a 1.
diagnostics.ready_south: deployment/south readyReplicas debe ser igual a 1.
diagnostics.http_north: La petición a north:8080 debe devolver north-123.
diagnostics.http_south: La petición a south:8080 debe devolver south-123.
