title: Argo CD ApplicationSet
brief: |-
  La flota station no entrega ambos servicios esperados. Recupera las aplicaciones generadas y sus resultados de versión observables.

  Trabaja en la workstation en `~/quest` con `platform.env`, `appset-target.json`, `applicationset.yaml`, `repository/`, `release-ref`, `release-commit`, `maintenance-commit`, `wait-apps.sh`.

  Al comprobar los objetivos, el adaptador acotado envía `applicationset.yaml` desde la estación de trabajo. Acepta la ruta inicial o la de la flota y la referencia de versión inicial o suministrada. El generador, proyecto, repositorio, ámbito y propietario se mantienen.

  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas bajo `~/quest` están en la workstation.

  **Requirements:**

  - El ApplicationSet existente genera exactamente las Applications `north` y `south`, cada una con el contenido de su estación del repositorio suministrado, conservando el proyecto y destino de la bahía previstos.
  - Ambas Applications generadas siguen perteneciendo al ApplicationSet existente.
  - Las dos Applications generadas usan la versión aprobada de `release-ref` y `release-commit` y están `Synced` y `Healthy`. La rama de mantenimiento publicada `main` conserva la revisión de `maintenance-commit`.
  - Los Deployments `north` y `south` tienen exactamente `1` réplica lista cada uno.
  - Dentro de sus Pods, `http://north:8080` y `http://south:8080` devuelven `north-123` y `south-123`, respectivamente.

  - Las Applications generadas y su ApplicationSet permanecen en el namespace del controlador suministrado; los Deployments y Services permanecen en el namespace de la bahía.
debrief: |-
  ApplicationSet expande la plantilla en especificaciones Application. Cada Application resuelve su propia revisión de origen. Contrasta el estado con la referencia y el commit aprobado.
stages.0.brief: Conserva el ámbito del controlador suministrado y la propiedad generada.
hints.0.text: |-
  Comprueba por separado la ruta de origen y la referencia de destino. Que los manifiestos funcionen en una rama no garantiza que el controlador use el commit aprobado.
hints.1.text: |-
  Compara la plantilla, las Applications generadas y las referencias del servidor Git. Los archivos de versión registran las dos revisiones esperadas.

  Localiza la ruta de origen generada y la revisión destino de cada Application generada. Compara las sustituciones de plantilla y los valores generados con las referencias exactas de los archivos de versión.

  ```bash
  ns=$(jq -r .namespace appset-target.json)
  cat applicationset.yaml release-ref release-commit maintenance-commit
  git -C repository ls-remote origin 'refs/heads/*'
  kubectl -n "$ns" get applications north south -o yaml
  ```
hints.2.text: |-
  Compara los orígenes activos con las referencias Git y comprueba la respuesta de ambos servicios.

  ```bash
  ns=$(jq -r .namespace appset-target.json)
  git -C repository ls-remote origin refs/heads/main "refs/heads/$(cat release-ref)"
  kubectl -n "$ns" get applications north south -o json | jq '.items[] | {name:.metadata.name,source:.spec.source,sync:.status.sync,health:.status.health.status,owners:.metadata.ownerReferences}'
  bash wait-apps.sh
  for station in north south; do
    kubectl exec deployment/"$station" -- wget -qO- -T 3 "http://$station:8080"
  done
  ```

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    facts=/run/dq/facts/0
    ns=$(jq -er .namespace "$facts/appset-target.json")
    repo=$(jq -er .repoURL "$facts/appset-target.json")
    release=$(cat "$facts/release-commit")
    ref=$(cat "$facts/release-ref")
    main=$(cat "$facts/maintenance-commit")
    refs=$(git -C repository ls-remote "$repo" refs/heads/main "refs/heads/$ref")
    grep -Fqx "$(printf '%s\trefs/heads/main' "$main")" <<<"$refs"
    grep -Fqx "$(printf '%s\trefs/heads/%s' "$release" "$ref")" <<<"$refs"
    appset=$(kubectl -n "$ns" get applicationset station -o json)
    uid=$(jq -er --arg ref "$ref" '
      select(.spec.goTemplate==true and .spec.template.spec.source.path=="stations/{{.station}}" and
        (.spec.generators[0].list.elements | map(.station))==["north","south"] and
        .spec.template.spec.source.targetRevision==$ref) | .metadata.uid' <<<"$appset")
    kubectl -n "$ns" get applications north south -o json |
      jq -e --arg uid "$uid" --arg release "$release" --arg repo "$repo" --arg bay "$DQ_NAMESPACE" --arg ref "$ref" '
        ([.items[].metadata.name] | sort)==["north","south"] and
        all(.items[]; .metadata.name as $station |
          .spec.source.repoURL==$repo and .spec.project=="station" and .spec.destination.namespace==$bay and
          .spec.source.path==("stations/"+$station) and .spec.source.targetRevision==$ref and
          .status.sync.revision==$release and .status.sync.status=="Synced" and .status.health.status=="Healthy" and
          any(.metadata.ownerReferences[]?; .kind=="ApplicationSet" and .uid==$uid))'
    for station in north south; do
      test "$(kubectl exec deployment/"$station" -- wget -qO- -T 3 "http://$station:8080")" = "$station-123"
    done
  )
  ```

  Ambas Applications muestran Synced y Healthy en release-commit. El main remoto conserva maintenance-commit. Los Services devuelven north-123 y south-123.
phrases.0: Separé la generación Application de la conciliación de cargas de trabajo.
phrases.1: Revisé los valores del generador y la expansión de la plantilla.
phrases.2: Mantuve los permisos del controlador y los destinos dentro del alcance.
questions.0.points.0: Los generadores y las plantillas producen objetos Application.
questions.0.points.1: El controlador de aplicaciones concilia cada carga de trabajo Application generada.
questions.0.prompt: ¿En qué se diferencia un ApplicationSet de un Application?
questions.1.points.0: Una plantilla puede seleccionar proyectos, repositorios y destinos.
questions.1.points.1: Controlador de alcance RBAC y validar las especificaciones generadas.
questions.1.prompt: ¿Por qué requiere cuidado el acceso a las plantillas?
