title: Argo CD ApplicationSet
brief: 'A private ApplicationSet controller uses a two-element list generator and
  a Go template. The template points to retired/{{.station}}, but the private repository
  contains stations/north and stations/south. Edit only the template path in applicationset.json
  to stations/{{.station}}. The ordinary game poll submits one of two bounded manifests
  to the real controller; direct template editing through the API is intentionally
  unavailable because it could widen repository or destination access. Generated Applications
  are read-only in the private controller namespace from appset-target.json. Confirm
  both are owned by this ApplicationSet, reconcile the same Git commit and serve their
  distinct responses.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `appset-target.json`,
  `applicationset.json`, `repository/stations/north/board.json`, `repository/stations/south/board.json`,
  `release-commit`, `wait-apps.sh`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The real ApplicationSet owns two healthy, synced Applications
  for the exact private Git paths and bay; north and south return north-123 and south-123.'
debrief: ApplicationSet generates Application specifications; each Application still
  reconciles its workload. The bounded submission adapter preserves the private project,
  repository and destination, while a real namespace-scoped controller performs generation.
stages.0.brief: 'Success criteria: The real ApplicationSet owns two healthy, synced
  Applications for the exact private Git paths and bay; north and south return north-123
  and south-123.'
stages.0.objectives.0.text: The real ApplicationSet owns two healthy, synced Applications
  for the exact private Git paths and bay; north and south return north-123 and south-123.
hints.0.text: The list generator supplies station; the template expands it into each
  Application source path.
hints.1.text: Inspect applicationset.json and the read-only generated Applications
  in the namespace from appset-target.json.
hints.2.text: Use stations/{{.station}}, keep all scope fields unchanged, then compare
  owner UID, revisions and both HTTP responses.
phrases.0: I separated Application generation from workload reconciliation.
phrases.1: I checked the generator values and template expansion.
phrases.2: I kept controller permissions and destinations scoped.
questions.0.points.0: Generators and templates produce Application objects.
questions.0.points.1: The application controller reconciles each generated Application
  workload.
questions.0.prompt: How does an ApplicationSet differ from an Application?
questions.1.points.0: A template can select projects, repositories and destinations.
questions.1.points.1: Scope controller RBAC and validate generated specifications.
questions.1.prompt: Why does template access require care?
