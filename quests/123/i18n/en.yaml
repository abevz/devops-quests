title: Argo CD ApplicationSet
brief: 'Work in `~/quest` with `platform.env`, `appset-target.json`, `applicationset.json`, `repository/stations/north/board.json`,
  `repository/stations/south/board.json`, `release-commit` and `wait-apps.sh`. An ApplicationSet list generator supplies values
  to a Go template. Set the template path to exactly `stations/{{.station}}`, keep `goTemplate: true` and the ordered stations
  `[north, south]`. The ordinary game poll submits one of two bounded manifests to the private controller namespace from `appset-target.json`;
  wait for it and for reconciliation. This adapter accepts only those bounded changes, not arbitrary API edits.


  The generated north and south Applications must be owned by this ApplicationSet, `Synced` and `Healthy` at `release-commit`,
  and retain the project, repository, per-entry path and bay namespace shown in `wait-apps.sh` and `appset-target.json`. Each
  Deployment must have one ready replica; `north:8080` and `south:8080` must return `north-123` and `south-123`. Current generated
  state does not prove only the template path was edited. Use only the offline bay.'
debrief: ApplicationSet generates Application specifications; each Application still reconciles its workload. The bounded
  submission adapter preserves the private project, repository and destination, while a real namespace-scoped controller performs
  generation.
stages.0.brief: The ApplicationSet template, generated Application ownership and status, and both Deployment responses match
  the brief.
stages.0.objectives.0.text: The ApplicationSet template, generated Application ownership and status, and both Deployment responses
  match the brief.
hints.0.text: The list generator supplies station; the template expands it into each Application source path.
hints.1.text: Inspect applicationset.json and the read-only generated Applications in the namespace from appset-target.json.
hints.2.text: Use stations/{{.station}}, keep all scope fields unchanged, then compare owner UID, revisions and both HTTP
  responses.
phrases.0: I separated Application generation from workload reconciliation.
phrases.1: I checked the generator values and template expansion.
phrases.2: I kept controller permissions and destinations scoped.
questions.0.points.0: Generators and templates produce Application objects.
questions.0.points.1: The application controller reconciles each generated Application workload.
questions.0.prompt: How does an ApplicationSet differ from an Application?
questions.1.points.0: A template can select projects, repositories and destinations.
questions.1.points.1: Scope controller RBAC and validate generated specifications.
questions.1.prompt: Why does template access require care?
