diagnostics.namespace: The frozen ApplicationSet target may lack a readable namespace. Check the supplied namespace before looking up the generated Applications. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-frozen-namespace)
diagnostics.repo: The target receipt may be unreadable or omit its repository URL. Verify repoURL in the frozen input before comparing generated sources. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-frozen-repository)
diagnostics.revision: The frozen release commit may be unreadable or empty. Verify the approved revision receipt before comparing either Application’s sync status. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-approved-release-receipt)
diagnostics.uid: The current station ApplicationSet may be absent or unreadable. Read its UID in the supplied namespace before checking generated owners. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-live-uid)
diagnostics.path: The template may still point at the retired directory or a fixed path. Check the exact parameterized path stations/{{.station}}. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-template-directory)
diagnostics.gotemplate: Go templating may be disabled or unset, preventing the path expression from expanding. Check that goTemplate is boolean true. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-go-template-mode)
diagnostics.stations: The first list generator may omit or reorder the supplied stations. Inspect its station values and keep north followed by south. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-list-station-elements)
diagnostics.count: Either expected Application may be missing or the named lookup may fail. Verify that the controller generated both north and south in the supplied namespace. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-expected-pair)
diagnostics.project_north: The affected Application may have inherited another AppProject. Inspect the generated spec and ensure the template assigns station as its project. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.project_south: The affected Application may have inherited another AppProject. Inspect the generated spec and ensure the template assigns station as its project. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.repo_north: The affected Application may target a different source repository or lack a readable original URL. Compare its repoURL with the frozen appset-target.json value. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.repo_south: The affected Application may target a different source repository or lack a readable original URL. Compare its repoURL with the frozen appset-target.json value. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.source_north: A template expression may have expanded to the wrong location. Inspect the affected Application’s exact path, stations/north for north or stations/south for south. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.source_south: A template expression may have expanded to the wrong location. Inspect the affected Application’s exact path, stations/north for north or stations/south for south. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.destination_north: The generated Application may target a namespace other than the bay. Compare the affected destination with the supplied runtime namespace. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.destination_south: The generated Application may target a namespace other than the bay. Compare the affected destination with the supplied runtime namespace. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.owner_north: A same-name Application may lack an ApplicationSet owner reference or refer to a stale UID. Compare its owner UID with the current station ApplicationSet. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.owner_south: A same-name Application may lack an ApplicationSet owner reference or refer to a stale UID. Compare its owner UID with the current station ApplicationSet. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.sync_north: The affected Application may still be OutOfSync because its source or controller reconciliation is unfinished. Inspect its sync status and reported errors. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.sync_south: The affected Application may still be OutOfSync because its source or controller reconciliation is unfinished. Inspect its sync status and reported errors. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
diagnostics.revision_north: An Application may be Synced to an earlier commit or the maintenance branch. Compare the affected observed revision with the approved release-commit. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.revision_south: An Application may be Synced to an earlier commit or the maintenance branch. Compare the affected observed revision with the approved release-commit. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.health_north: The affected Application can have the intended revision while its workload is still not Healthy. Inspect its health status and the corresponding deployment rollout. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.health_south: The affected Application can have the intended revision while its workload is still not Healthy. Inspect its health status and the corresponding deployment rollout. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
diagnostics.ready_north: The named Deployment may be missing or may have no ready replica yet. Check its rollout and wait for one replica to become ready. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.ready_south: The named Deployment may be missing or may have no ready replica yet. Check its rollout and wait for one replica to become ready. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-station-ready-replicas)
diagnostics.http_north: The affected Deployment may still serve a legacy body or have no reachable endpoint. Query both workloads and compare north with north-123 and south with south-123. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.http_south: The affected Deployment may still serve a legacy body or have no reachable endpoint. Query both workloads and compare north with north-123 and south with south-123. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
diagnostics.release_source: A template or generated Application may still track main, or the private refs may have moved. Compare the approved release ref and unchanged maintenance main against the remote and check the template and both generated targetRevision values. [Cause and check](guides#guide=gitops-delivery&section=q123-appset-frozen-release-source)
