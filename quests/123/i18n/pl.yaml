diagnostics.http_north: Wskazana stacja może zwracać starszą treść lub nie mieć osiągalnego endpointu. Odpytaj obie i porównaj north z north-123 oraz south z south-123. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-station-live-http)
