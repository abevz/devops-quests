diagnostics.revision_north: Application może być Synced ze starszym commitem lub gałęzią utrzymania. Porównaj wskazaną rewizję z zatwierdzonym release-commit. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.revision_south: Application może być Synced ze starszym commitem lub gałęzią utrzymania. Porównaj wskazaną rewizję z zatwierdzonym release-commit. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-release-revision)
diagnostics.health_north: Wskazane Application może mieć właściwą rewizję, choć obciążenie nie jest Healthy. Sprawdź status i wdrożenie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-application-health)
