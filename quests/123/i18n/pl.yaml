title: Argo CD ApplicationSet
brief: |-
  Flota station nie dostarcza obu oczekiwanych usług. Przywróć generowane aplikacje i obserwowalne wyniki wydania.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `appset-target.json`, `applicationset.yaml`, `repository/`, `release-commit`, `wait-apps.sh`.

  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki w `~/quest` są na workstation.

  **Requirements:**

  - Istniejący ApplicationSet generuje dokładnie Applications `north` i `south`, każdą z zawartością odpowiadającej stacji z dostarczonego repozytorium, zachowując właściwy projekt i cel w zatoce.
  - Obie wygenerowane Applications pozostają własnością istniejącego ApplicationSet.
  - Obie wygenerowane Applications mają stany `Synced` i `Healthy` dla dostarczonej rewizji wydania.
  - Deployments `north` i `south` mają po dokładnie `1` gotowej replice.
  - W ich Podach adresy `http://north:8080` i `http://south:8080` zwracają odpowiednio `north-123` i `south-123`.

    - Wygenerowane Applications i ich ApplicationSet pozostają w dostarczonej przestrzeni nazw kontrolera; Deployments i Services pozostają w przestrzeni nazw zatoki.

  Bieżący wygenerowany stan nie dowodzi, że zmieniono tylko ścieżkę szablonu.
debrief: ApplicationSet generuje specyfikacje Application; każdy Application nadal godzi swoje obciążenie
  pracą. Adapter ograniczonego przesyłania zachowuje prywatne project, repository i destination, podczas
  gdy prawdziwy kontroler o zasięgu namespace wykonuje generowanie.
stages.0.brief: Zachowaj dostarczony zakres kontrolera i własność generowanych obiektów.
hints.0.text: Generator list dostarcza station; szablon rozszerza go do każdego Application source path.
hints.1.text: |-
  Sprawdź dostarczony ApplicationSet i wygenerowane Applications w ich przestrzeni nazw kontrolera.

  ```bash
  cat applicationset.yaml
  ns=$(jq -r .namespace appset-target.json)
  kubectl -n "$ns" get applications north south -o yaml
  ```
hints.2.text: |-
  Użyj stations/{{.station}}, pozostaw wszystkie pola zakresu niezmienione, a następnie porównaj UID właściciela, wersje i obie odpowiedzi HTTP. Zwykłe sprawdzanie celów przesyła `applicationset.yaml` przez ograniczony adapter. Zachowaj `goTemplate: true` i kolejność stacji `[north, south]`; akceptowany jest tylko pierwotny manifest lub poprawka ścieżki jego szablonu. Sprawdź applicationset.yaml i wygenerowane aplikacje tylko do odczytu w namespace z appset-target.json.

  Sprawdź z `~/quest` na workstation:

  - `ns=$(jq -r .namespace appset-target.json)`
  - `kubectl -n "$ns" get applications north south -o json | jq '.items[] | {name:.metadata.name,sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision,project:.spec.project,repo:.spec.source.repoURL,path:.spec.source.path,destination:.spec.destination.namespace,owners:.metadata.ownerReferences}'`

  Obie mają stany `Synced` i `Healthy` dla `release-commit`. Obie używają projektu `station`, zapisanego repozytorium, odpowiednich ścieżek `stations/north` / `stations/south`, celu `DQ_NAMESPACE` i właściciela `ApplicationSet`.

  - `kubectl get deployments north south -o json | jq '.items[] | {name:.metadata.name,ready:.status.readyReplicas}'`

  Każdy zgłasza `ready: 1`.

  ```bash
  for station in north south; do
    kubectl exec deployment/"$station" -- wget -qO- -T 3 "http://$station:8080"
  done
  ```

  `north-123`, `south-123`.

  - `bash wait-apps.sh` — kod `0`; sprawdzenia dostarczonego wydania przechodzą.
phrases.0: Oddzieliłem generowanie Application od uzgadniania obciążenia.
phrases.1: Sprawdziłem wartości generatora i rozwinięcie szablonu.
phrases.2: Zachowałem zakres uprawnień kontrolera i miejsc docelowych.
questions.0.points.0: Generatory i szablony tworzą obiekty Application.
questions.0.points.1: Kontroler aplikacji uzgadnia każde wygenerowane obciążenie Application.
questions.0.prompt: Czym ApplicationSet różni się od Application?
questions.1.points.0: Szablon może wybierać projekty, repozytoria i miejsca docelowe.
questions.1.points.1: Kontroler oscyloskopu RBAC i sprawdź wygenerowane specyfikacje.
questions.1.prompt: Dlaczego dostęp do szablonów wymaga ostrożności?
diagnostics.namespace: appset-target.json namespace musi istnieć i być niepuste.
diagnostics.repo: appset-target.json repoURL musi istnieć i być niepuste.
diagnostics.revision: release-commit musi istnieć i być niepuste.
diagnostics.uid: applicationset/station UID musi istnieć i być niepuste.
diagnostics.path: applicationset/station template.source.path musi być równe stations/{{.station}}.
diagnostics.gotemplate: applicationset/station goTemplate musi być równe true.
diagnostics.stations: applicationset/station generator stations musi być równe [north,south].
diagnostics.count: Muszą istnieć dokładnie dwie wygenerowane Application.
diagnostics.sync_north: application/north sync.status musi być równe Synced.
diagnostics.sync_south: application/south sync.status musi być równe Synced.
diagnostics.revision_north: application/north sync.revision musi być równe release-commit.
diagnostics.revision_south: application/south sync.revision musi być równe release-commit.
diagnostics.health_north: application/north health.status musi być równe Healthy.
diagnostics.health_south: application/south health.status musi być równe Healthy.
diagnostics.project_north: application/north project musi być równe station.
diagnostics.project_south: application/south project musi być równe station.
diagnostics.repo_north: application/north repoURL musi być równe appset-target.json repoURL.
diagnostics.repo_south: application/south repoURL musi być równe appset-target.json repoURL.
diagnostics.source_north: application/north source.path musi być równe stations/north.
diagnostics.source_south: application/south source.path musi być równe stations/south.
diagnostics.destination_north: application/north destination.namespace musi być równe DQ_NAMESPACE.
diagnostics.destination_south: application/south destination.namespace musi być równe DQ_NAMESPACE.
diagnostics.owner_north: application/north musi mieć ownerReference typu ApplicationSet z UID ApplicationSet
  station.
diagnostics.owner_south: application/south musi mieć ownerReference typu ApplicationSet z UID ApplicationSet
  station.
diagnostics.ready_north: deployment/north readyReplicas musi być równe 1.
diagnostics.ready_south: deployment/south readyReplicas musi być równe 1.
diagnostics.http_north: Żądanie do north:8080 musi zwrócić north-123.
diagnostics.http_south: Żądanie do south:8080 musi zwrócić south-123.
