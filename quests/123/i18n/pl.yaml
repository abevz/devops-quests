title: Argo CD ApplicationSet
brief: 'Prywatny kontroler ApplicationSet wykorzystuje dwuelementowy generator list i Go template. Szablon
  wskazuje na retired/{{.station}}, ale prywatne repozytorium zawiera stations/north i stations/south.
  Edytuj tylko ścieżkę szablonu w applicationset.json do stations/{{.station}}. Zwykła ankieta gry przesyła
  jeden z dwóch ograniczonych manifestów do prawdziwego kontrolera; bezpośrednia edycja szablonów za pomocą
  API jest celowo niedostępna, ponieważ mogłaby poszerzyć dostęp do repozytorium lub miejsca docelowego.
  Wygenerowane aplikacje są przeznaczone tylko do odczytu w prywatnym sterowniku namespace od appset-target.json.
  Potwierdź, że oba są własnością tego ApplicationSet, uzgodnij to samo zatwierdzenie Git i podaj ich
  różne odpowiedzi.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `appset-target.json`,
  `applicationset.json`, `repository/stations/north/board.json`, `repository/stations/south/board.json`,
  `release-commit`, `wait-apps.sh`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: prawdziwy ApplicationSet posiada dwie sprawne, zsynchronizowane aplikacje
  dla dokładnie prywatnych ścieżek i zatoki Git; north i south zwracają north-123 i south-123.'
debrief: ApplicationSet generuje specyfikacje Application; każdy Application nadal godzi swoje obciążenie
  pracą. Adapter ograniczonego przesyłania zachowuje prywatne project, repository i destination, podczas
  gdy prawdziwy kontroler o zasięgu namespace wykonuje generowanie.
stages.0.brief: 'Kryteria sukcesu: Prawdziwy ApplicationSet posiada dwie sprawne, zsynchronizowane aplikacje
  dla dokładnie prywatnych ścieżek i zatoki Git; north i south zwracają north-123 i south-123.'
stages.0.objectives.0.text: Prawdziwy ApplicationSet posiada dwie sprawne, zsynchronizowane aplikacje
  dla dokładnie prywatnych ścieżek Git i zatoki; north i south zwracają north-123 i south-123.
hints.0.text: Generator list dostarcza station; szablon rozszerza go do każdego Application source path.
hints.1.text: Sprawdź applicationset.json i wygenerowane aplikacje tylko do odczytu w namespace z appset-target.json.
hints.2.text: Użyj stations/{{.station}}, pozostaw wszystkie pola zakresu niezmienione, a następnie porównaj
  UID właściciela, wersje i obie odpowiedzi HTTP.
phrases.0: Oddzieliłem generowanie Application od uzgadniania obciążenia.
phrases.1: Sprawdziłem wartości generatora i rozwinięcie szablonu.
phrases.2: Zachowałem zakres uprawnień kontrolera i miejsc docelowych.
questions.0.points.0: Generatory i szablony tworzą obiekty Application.
questions.0.points.1: Kontroler aplikacji uzgadnia każde wygenerowane obciążenie Application.
questions.0.prompt: Czym ApplicationSet różni się od Application?
questions.1.points.0: Szablon może wybierać projekty, repozytoria i miejsca docelowe.
questions.1.points.1: Kontroler oscyloskopu RBAC i sprawdź wygenerowane specyfikacje.
questions.1.prompt: Dlaczego dostęp do szablonów wymaga ostrożności?
