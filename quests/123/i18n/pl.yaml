diagnostics.namespace: Zamrożony cel ApplicationSet może nie mieć czytelnej przestrzeni nazw. Sprawdź podaną przestrzeń przed odczytem wygenerowanych Application. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-frozen-namespace)
diagnostics.repo: Zapis celu może być nieczytelny lub nie zawierać URL repozytorium. Sprawdź repoURL przed porównaniem wygenerowanych źródeł. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-frozen-repository)
diagnostics.revision: Zamrożony commit wydania może być nieczytelny lub pusty. Sprawdź zapis zatwierdzonej rewizji przed porównaniem stanu Application. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-approved-release-receipt)
diagnostics.uid: Bieżący ApplicationSet station może nie istnieć lub być nieczytelny. Odczytaj jego UID przed sprawdzeniem właścicieli. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-live-uid)
diagnostics.path: Szablon może wskazywać wycofany katalog lub stałą ścieżkę jednej stacji. Sprawdź dokładną ścieżkę stations/{{.station}}. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-template-directory)
diagnostics.gotemplate: 'Szablony Go mogą być wyłączone lub nieustawione, co blokuje rozwinięcie ścieżki. Sprawdź logiczne goTemplate: true. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-go-template-mode)'
diagnostics.stations: Pierwszy generator listy może pomijać stację lub zmieniać kolejność. Sprawdź wartości station i zachowaj north przed south. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-list-station-elements)
diagnostics.count: Jedno z oczekiwanych Application może nie istnieć lub nie dać się odczytać. Potwierdź north i south w podanej przestrzeni. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-expected-pair)
diagnostics.project_north: Wskazane Application może dziedziczyć inny AppProject. Sprawdź wygenerowaną specyfikację i projekt station w szablonie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.project_south: Wskazane Application może dziedziczyć inny AppProject. Sprawdź wygenerowaną specyfikację i projekt station w szablonie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-project)
diagnostics.repo_north: Wskazane Application może kierować do innego repozytorium lub źródłowy URL jest nieczytelny. Porównaj repoURL z zamrożonym appset-target.json. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.repo_south: Wskazane Application może kierować do innego repozytorium lub źródłowy URL jest nieczytelny. Porównaj repoURL z zamrożonym appset-target.json. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-repository)
diagnostics.source_north: Wyrażenie szablonu mogło rozwinąć się do złego katalogu. Sprawdź dokładną ścieżkę, stations/north dla north lub stations/south dla south. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.source_south: Wyrażenie szablonu mogło rozwinąć się do złego katalogu. Sprawdź dokładną ścieżkę, stations/north dla north lub stations/south dla south. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-station-directory)
diagnostics.destination_north: Wygenerowane Application może wskazywać inną przestrzeń. Porównaj cel z podaną przestrzenią stanowiska. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.destination_south: Wygenerowane Application może wskazywać inną przestrzeń. Porównaj cel z podaną przestrzenią stanowiska. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-bay-destination)
diagnostics.owner_north: Application o tej samej nazwie może nie mieć właściciela ApplicationSet lub wskazywać stary UID. Porównaj UID właściciela z bieżącym station. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.owner_south: Application o tej samej nazwie może nie mieć właściciela ApplicationSet lub wskazywać stary UID. Porównaj UID właściciela z bieżącym station. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-owner-reference)
diagnostics.sync_north: Wskazane Application może nadal być OutOfSync z powodu źródła lub niezakończonego uzgodnienia. Sprawdź stan synchronizacji i błędy. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q123-appset-generated-sync-state)
