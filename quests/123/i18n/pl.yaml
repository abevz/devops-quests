title: Argo CD ApplicationSet
brief: 'Pracuj w `~/quest` z `platform.env`, `appset-target.json`, `applicationset.json`, `repository/stations/north/board.json`,
  `repository/stations/south/board.json`, `release-commit` i `wait-apps.sh`. Generator listy ApplicationSet dostarcza wartości
  szablonowi Go. Ustaw ścieżkę szablonu dokładnie na `stations/{{.station}}`, zachowaj `goTemplate: true` i kolejność stacji
  `[north, south]`. Zwykły mechanizm odpytywania gry przesyła jeden z dwóch ograniczonych manifestów do prywatnej przestrzeni
  kontrolera z `appset-target.json`; poczekaj na to i na uzgodnienie. Adapter przyjmuje tylko te ograniczone zmiany, nie dowolne
  edycje API.


  Wygenerowane Application north i south muszą należeć do tego ApplicationSet, być `Synced` i `Healthy` przy `release-commit`
  oraz zachować projekt, repozytorium, ścieżkę każdego wpisu i przestrzeń zatoki z `wait-apps.sh` i `appset-target.json`.
  Każdy Deployment musi mieć jedną gotową replikę; `north:8080` i `south:8080` muszą zwrócić `north-123` i `south-123`. Bieżący
  wygenerowany stan nie dowodzi, że zmieniono tylko ścieżkę szablonu. Używaj tylko zatoki offline.'
debrief: ApplicationSet generuje specyfikacje Application; każdy Application nadal godzi swoje obciążenie pracą. Adapter ograniczonego
  przesyłania zachowuje prywatne project, repository i destination, podczas gdy prawdziwy kontroler o zasięgu namespace wykonuje
  generowanie.
stages.0.brief: Szablon ApplicationSet, właściciel i stany wygenerowanych Application oraz odpowiedzi obu Deploymentów odpowiadają
  opisowi.
stages.0.objectives.0.text: Szablon ApplicationSet, właściciel i stany wygenerowanych Application oraz odpowiedzi obu Deploymentów
  odpowiadają opisowi.
hints.0.text: Generator list dostarcza station; szablon rozszerza go do każdego Application source path.
hints.1.text: Sprawdź applicationset.json i wygenerowane aplikacje tylko do odczytu w namespace z appset-target.json.
hints.2.text: Użyj stations/{{.station}}, pozostaw wszystkie pola zakresu niezmienione, a następnie porównaj UID właściciela,
  wersje i obie odpowiedzi HTTP.
phrases.0: Oddzieliłem generowanie Application od uzgadniania obciążenia.
phrases.1: Sprawdziłem wartości generatora i rozwinięcie szablonu.
phrases.2: Zachowałem zakres uprawnień kontrolera i miejsc docelowych.
questions.0.points.0: Generatory i szablony tworzą obiekty Application.
questions.0.points.1: Kontroler aplikacji uzgadnia każde wygenerowane obciążenie Application.
questions.0.prompt: Czym ApplicationSet różni się od Application?
questions.1.points.0: Szablon może wybierać projekty, repozytoria i miejsca docelowe.
questions.1.points.1: Kontroler oscyloskopu RBAC i sprawdź wygenerowane specyfikacje.
questions.1.prompt: Dlaczego dostęp do szablonów wymaga ostrożności?
