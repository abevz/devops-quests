id: 83
title: title
track: Platform
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ndq_failed=0\n\
      set +e\n(\nset -euo pipefail\ntimeout --kill-after=1s 8s bash -euo pipefail <<'DQ_LEGACY'\nsource platform.env\n\
      umask 077\nheaders=$(mktemp -d)\ntrap 'rm -f \"$headers/reader\" \"$headers/manager\"; rmdir \"$headers\"\
      ' EXIT\nprintf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\" > \"$headers/reader\"\nfailed=0\nif ! test \"\
      $(curl -fsS -H @\"$headers/reader\" \"$VAULT_ADDR/v1/secret/data/dispatch\" 2>/dev/null | jq -er .data.data.value\
      \ 2>/dev/null)\" = north-secret; then\n  printf '%s\\n' 'reader secret/data/dispatch value = north-secret:\
      \ ✗ [DQ:reader]'\n  failed=1\nfi\n\nif ! test \"$(kubectl get secret route-secret -o jsonpath='{.data.value}'\
      \ 2>/dev/null | base64 -d 2>/dev/null)\" = north-secret; then\n  printf '%s\\n' 'Secret route-secret value\
      \ = north-secret: ✗ [DQ:secret]'\n  failed=1\nfi\n\nif ! test \"$(kubectl exec deployment/relay -c worker\
      \ -- printenv ROUTE_SECRET 2>/dev/null)\" = north-secret; then\n  printf '%s\\n' 'deployment/relay ROUTE_SECRET\
      \ = north-secret: ✗ [DQ:env]'\n  failed=1\nfi\nexit \"$failed\"\nDQ_LEGACY\n)\n[ $? -eq 0 ] || dq_failed=1\n\
      (\nset -euo pipefail\ntimeout --kill-after=1s 14s bash -euo pipefail <<'DQ_CURRENT'\ndq_probe_output=$(mktemp)\n\
      trap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\npython3 -I - <<'DQ_VAULT_APPLICATION'\n\
      \nimport hashlib,json,stat,urllib.request\nfrom pathlib import Path\nfacts=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())\n\
      opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))\ndef read(path,limit=8192):\n p=Path(path);\
      \ s=p.lstat()\n assert stat.S_ISREG(s.st_mode) and s.st_size<=limit\n return p.read_bytes()\ndef process(role):\n\
      \ old=facts[role]\n assert read(role+'/application.pid').decode().strip()==str(old['pid'])\n proc=Path('/proc')/str(old['pid'])\n\
      \ fields=(proc/'stat').read_text().rsplit(') ',1)[1].split()\n assert fields[0] not in ('Z','X') and fields[19]==old['start']\n\
      \ assert (proc/'cmdline').read_bytes().hex()==old['command']\n status=dict(line.split(':',1) for line in (proc/'status').read_text().splitlines()\
      \ if ':' in line)\n assert all(status[k].strip()==v for k,v in old['status'].items())\n assert hashlib.sha256(read('provided-vault-consumer.py',65536)).hexdigest()==facts['program_sha256']\n\
      def response(port):\n with opener.open('http://127.0.0.1:'+str(port)+'/',timeout=2) as r:\n  data=json.load(r)\n\
      \ assert data.get('ready') is True\n assert data.get('value_sha256')==facts['value_sha256']\n assert type(data.get('version'))\
      \ is int and data['version']==facts['version']\n return data\nprocess('consumer')\nconfig=json.loads(read('consumer/source.json',4096))\n\
      assert set(config)=={'url','path','token_file'}\nassert config['url']==facts['vault_url'] and config['path']==facts['path']\n\
      credential=Path(config['token_file'])\nassert stat.S_IMODE(credential.lstat().st_mode)==0o600\nassert credential.lstat().st_uid==1000\n\
      assert hashlib.sha256(read(credential,4096).strip()).hexdigest()==facts['reader_sha256']\ndata=response(18081)\n\
      assert data.get('kind')=='vault' and data.get('source')==facts['vault_url'] and data.get('path')==facts['path']\n\
      \nDQ_VAULT_APPLICATION\nsource platform.env\ncurl -fsS --max-time 2 -H @<(printf 'X-Vault-Token: %s\\n' \"\
      $VAULT_READER_TOKEN\") -H 'Content-Type: application/json' -X POST --data '{\"paths\":[\"secret/data/dispatch\"\
      ,\"secret/data/other\",\"sys/audit\"]}' \"$VAULT_ADDR/v1/sys/capabilities-self\" | jq -e '.\"secret/data/dispatch\"\
      ==[\"read\"] and .\"secret/data/other\"==[\"deny\"] and .\"sys/audit\"==[\"deny\"]' >/dev/null\n\n) >\"$dq_probe_output\"\
      \ 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\nif [ \"$dq_probe_status\" -ne 0 ] &&\
      \ ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\nprintf '%s\\n' 'Current inputs could not verify\
      \ this objective: ✗ [DQ:probe_0_0]'\nfi\nrm -f \"$dq_probe_output\"\ntrap - EXIT\ntest \"$dq_probe_status\"\
      \ -eq 0\n\nDQ_CURRENT\n)\n[ $? -eq 0 ] || dq_failed=1\nset -e\ntest \"$dq_failed\" -eq 0\n) >\"$dq_probe_output\"\
      \ 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\nif [ \"$dq_probe_status\" -ne 0 ] &&\
      \ ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\nprintf '%s\\n' 'Current inputs could not verify\
      \ this objective: ✗ [DQ:probe_0_0]'\nfi\nrm -f \"$dq_probe_output\"\ntrap - EXIT\ntest \"$dq_probe_status\"\
      \ -eq 0\n"
  - text: stages.0.objectives.1.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ndq_failed=0\n\
      set +e\n(\nset -euo pipefail\ntimeout --kill-after=1s 8s bash -euo pipefail <<'DQ_LEGACY'\nfailed=0\nif !\
      \ kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then\n  printf '%s\\n' 'deployment/relay\
      \ rollout → 0: ✗ [DQ:rollout]'\n  failed=1\nfi\nexit \"$failed\"\nDQ_LEGACY\n)\n[ $? -eq 0 ] || dq_failed=1\n\
      (\nset -euo pipefail\ntimeout --kill-after=1s 14s bash -euo pipefail <<'DQ_CURRENT'\ndq_probe_output=$(mktemp)\n\
      trap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\npython3 -I - <<'DQ_VAULT_APPLICATION'\n\
      \nimport json,subprocess\nfrom pathlib import Path\ndef kubectl(*args):\n return subprocess.check_output(['kubectl',*args],timeout=3)\n\
      old=json.loads(Path('/run/dq/facts/0/original-relay.json').read_text())\ncurrent=json.loads(kubectl('get','deployment','relay','-o','json'))\n\
      assert current['metadata']['uid']==old['metadata']['uid']\nassert current['spec']['template']['spec']==old['spec']['template']['spec']\n\
      assert current['spec']['selector']==old['spec']['selector']\nassert current['spec'].get('replicas',1)==old['spec'].get('replicas',1)==1\n\
      rs=json.loads(kubectl('get','replicasets','-o','json'))['items']\nowned={x['metadata']['uid'] for x in rs\
      \ if any(o.get('controller') is True and o['uid']==old['metadata']['uid'] for o in x['metadata'].get('ownerReferences',[]))}\n\
      pods=json.loads(kubectl('get','pods','-o','json'))['items']\nactive=[p for p in pods if not p['metadata'].get('deletionTimestamp')\
      \ and p['status'].get('phase') not in ('Succeeded','Failed') and any(o.get('controller') is True and o['uid']\
      \ in owned for o in p['metadata'].get('ownerReferences',[]))]\nassert len(active)==1\nfor p in active:\n assert\
      \ p['spec']['containers'][0]['image']==old['spec']['template']['spec']['containers'][0]['image']\n assert\
      \ any(c['type']=='Ready' and c['status']=='True' for c in p['status'].get('conditions',[]))\n assert kubectl('exec',p['metadata']['name'],'-c','worker','--','printenv','ROUTE_SECRET').strip()==b'north-secret'\n\
      \nDQ_VAULT_APPLICATION\n\n) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\
      \nif [ \"$dq_probe_status\" -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\nprintf\
      \ '%s\\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'\nfi\nrm -f \"$dq_probe_output\"\
      \ntrap - EXIT\ntest \"$dq_probe_status\" -eq 0\n\nDQ_CURRENT\n)\n[ $? -eq 0 ] || dq_failed=1\nset -e\ntest\
      \ \"$dq_failed\" -eq 0\n) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\
      \nif [ \"$dq_probe_status\" -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\nprintf\
      \ '%s\\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'\nfi\nrm -f \"$dq_probe_output\"\
      \ntrap - EXIT\ntest \"$dq_probe_status\" -eq 0\n"
