title: Secreto de Vault a pod
brief: 'Te uniste a las operaciones de SignalRail. Una política denegó el trabajo de sincronización secreto
  y el reader permaneció bloqueado. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía
  de entrenamiento.


  Entradas en `~/quest`: `deployment.json`, `platform.env`, `sync-secret.sh`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: una lectura real de Vault entrega route-secret al reader en ejecución.'
stages.0.brief: 'Vault se inicializó y se abrió. Su reader policy apunta a la ruta KV-v2 incorrecta. Repare
  solo rail-reader usando manager token, luego ejecute bash sync-secret.sh. El script es un sincronizador
  bajo demanda.


  Criterios de éxito: una lectura real de Vault entrega route-secret al reader en ejecución.'
stages.0.objectives.0.text: Una lectura real de Vault entrega route-secret al reader en ejecución.
hints.0.text: Inspeccione el estado de Vault HTTP sin imprimir tokens.
hints.1.text: Las lecturas de KV-v2 requieren la ruta secret/data/dispatch policy.
hints.2.text: Repare rail-reader a través del manager token, ejecute sync-secret.sh, luego inspect el
  entorno Secret y pod.
debrief: El KV-v2 ACL señaló el camino equivocado. Reparó rail-reader, ejecutó el script de sincronización
  explícito y verificó la lectura de Vault, el entorno Kubernetes Secret y pod.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 ruta de lectura
