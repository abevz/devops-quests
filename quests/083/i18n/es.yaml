title: Secreto de Vault a pod
brief: |-
  Relay no puede consumir su valor de Vault. Restablece el valor esperado en la cadena de entrega.

  Trabaja en la workstation en `~/quest` con `platform.env`, `reader.hcl`, `sync-secret.sh`, `deployment.yaml`.

  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas bajo `~/quest` están en la workstation.

  **Requirements:**

  - La identidad Vault suministrada, la configuración Kubernetes entregada y el proceso `relay` en ejecución proporcionan el valor dispatch `north-secret`.
  - El Deployment `relay` completa su rollout en el namespace de la bahía.

  La comprobación observa estos resultados; no demuestra qué cambios de política o pasos de sincronización los produjeron.
stages.0.brief: Todas las observaciones de entrega deben coincidir en el mismo valor.
hints.0.text: La autorización, la configuración entregada y el proceso activo son eslabones distintos
  de una cadena de entrega.
hints.1.text: |-
  Sigue el ayudante de sincronización suministrado y las referencias de configuración de la carga.

  ```bash
  cat sync-secret.sh
  kubectl describe deployment relay
  ```
hints.2.text: |-
  Repara rail-reader con el token manager, ejecuta sync-secret.sh y después comprueba el Secret y el entorno del pod. La lectura KV-v2 requiere la ruta de política secret/data/dispatch.

  Verifica desde `~/quest` en la workstation:

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`

  Código `0`; no se muestran credenciales ni valores secretos.

  - `kubectl get secret route-secret -o json | jq -e '.data.value | @base64d == "north-secret"' >/dev/null`

  Código `0`; no se muestran credenciales ni valores secretos.

  - `kubectl exec deployment/relay -- sh -c 'test "$ROUTE_SECRET" = north-secret'`
  - `kubectl rollout status deployment/relay --timeout=3s`

  Código `0`; no se muestran credenciales ni valores secretos. El rollout termina.
debrief: El valor de reader, la clave del Secret, el entorno de relay y el despliegue coincidieron con
  las comprobaciones.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 ruta de lectura
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
diagnostics.secret: El valor descodificado de route-secret debe ser north-secret.
diagnostics.env: ROUTE_SECRET del contenedor relay debe ser north-secret.
diagnostics.rollout: El despliegue del Deployment relay debe completarse.
stages.0.objectives.0.text: La identidad Vault suministrada, la configuración Kubernetes entregada y el
  proceso `relay` en ejecución proporcionan el valor dispatch `north-secret`.
stages.0.objectives.1.text: El Deployment `relay` completa su rollout en el namespace de la bahía.
