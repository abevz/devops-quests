title: Secreto de Vault a pod
brief: 'Trabaja en `~/quest` con `platform.env`, `reader.hcl`, `sync-secret.sh` y `deployment.json`. El Vault desechable del
  juego ya está inicializado y desellado. Su política `rail-reader` apunta a una ruta KV-v2 incorrecta. El token manager puede
  actualizar esa política; el token reader debe poder leer `secret/data/dispatch`. Nunca imprimas tokens ni respuestas secretas.
  La guía enlazada de Vault explica las rutas de políticas y las lecturas KV-v2 seguras.


  Repara `rail-reader`, ejecuta el `sync-secret.sh` suministrado bajo demanda y espera el despliegue de `deployment/relay`.
  Comprueba que reader recibe `north-secret` como `.data.data.value`, que el Secret de Kubernetes `route-secret` tiene una
  clave `value` que se decodifica a `north-secret` y que el proceso `relay` tiene `ROUTE_SECRET=north-secret`. El despliegue
  debe completarse. La comprobación observa esos resultados; no demuestra qué cambios de política o pasos de sincronización
  los produjeron. Trabaja solo en la bahía sin conexión.'
stages.0.brief: El valor de reader, la clave del Secret, el entorno de relay y el despliegue coinciden con el enunciado.
stages.0.objectives.0.text: El valor de reader, la clave del Secret, el entorno de relay y el despliegue coinciden con el
  enunciado.
