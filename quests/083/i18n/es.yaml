title: Secreto de Vault a pod
brief: 'Construye la entrega de la publicación existente de Vault a la carga original de Kubernetes y a la aplicación
  workstation. Conserva identidad del Deployment, selector, réplicas, programa, imagen, seguridad y referencia al
  Secret. Todos los pods activos propios deben estar Ready y usar el valor aprobado. Conserva las denegaciones reader
  para otros datos y auditoría indicadas en consumer/README.md. El borrador de sincronización no contiene una entrega
  implementada.


  Trabaja en `~/quest`. El directorio del consumidor contiene configuración, PID y registro. `consumer/README.md`
  describe la interfaz; `consumer-contract.json` registra los procesos originales, la fuente aprobada, el resumen
  de publicación y la versión. Conserva programas, identidades y privilegios originales. Cada consumidor debe servir
  la publicación aprobada desde la fuente original con la identidad privada reader suministrada. Una consulta manual
  a la fuente no basta. Las credenciales deben ser archivos regulares del usuario workstation con modo `0600`. No
  imprimas secretos ni credenciales.


  **Requisitos:**


  - La aplicación original adopta la publicación aprobada con la identidad privada reader; el acceso Vault, los
  datos Kubernetes y los consumidores coinciden sin ampliar permisos.

  - La carga original completa el despliegue conservando programa e identidad; todos los pods activos propios usan
  la configuración aprobada.'
stages.0.brief: Construye la entrega de la publicación existente de Vault a la carga original de Kubernetes y a
  la aplicación workstation. Conserva identidad del Deployment, selector, réplicas, programa, imagen, seguridad
  y referencia al Secret. Todos los pods activos propios deben estar Ready y usar el valor aprobado. Conserva las
  denegaciones reader para otros datos y auditoría indicadas en consumer/README.md. El borrador de sincronización
  no contiene una entrega implementada.
hints.0.text: Disponibilidad del servidor, autorización y publicación adoptada por el consumidor son observaciones
  distintas.
hints.1.text: |-
  Compara respuesta real, perfiles de fuente, registros y contrato original. Sigue primero el límite que falla.

  Revisa el perfil API activo y el comprobante de recarga del consumidor. Compara la referencia a Secret del Pod actual con los metadatos del destino del sincronizador.

  ```bash
  cat consumer/source.json
  cat consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json
  python3 -I - <<'VERIFY_PUBLICATION'
  import json
  from pathlib import Path
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  observed=json.loads(Path('observed-publication.json').read_text())
  assert observed['ready'] is True
  assert observed['source']==contract['vault_url']
  assert observed['path']==contract['path']
  assert observed['value_sha256']==contract['value_sha256']
  assert observed['version']==contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```


  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  kubectl rollout status deployment/relay --timeout=30s
  python3 -I - <<'VERIFY_OWNED_PODS'
  import hashlib,json,subprocess
  from pathlib import Path
  def k(*args):
   return subprocess.check_output(['kubectl',*args],timeout=3)
  old=json.loads(Path('/run/dq/facts/0/original-relay.json').read_text())
  current=json.loads(k('get','deployment','relay','-o','json'))
  assert current['metadata']['uid']==old['metadata']['uid']
  assert current['spec']['template']['spec']==old['spec']['template']['spec']
  assert current['spec']['selector']==old['spec']['selector']
  assert current['spec'].get('replicas', 1)==old['spec'].get('replicas', 1)==1
  sets=json.loads(k('get','replicasets','-o','json'))['items']
  owners={x['metadata']['uid'] for x in sets if any(o.get('controller') is True and o['uid']==old['metadata']['uid'] for o in x['metadata'].get('ownerReferences',[]))}
  pods=json.loads(k('get','pods','-o','json'))['items']
  active=[p for p in pods if not p['metadata'].get('deletionTimestamp') and p['status'].get('phase') not in ('Succeeded','Failed') and any(o.get('controller') is True and o['uid'] in owners for o in p['metadata'].get('ownerReferences',[]))]
  assert len(active)==1
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  for p in active:
   assert any(c['type']=='Ready' and c['status']=='True' for c in p['status'].get('conditions',[]))
   assert p['spec']['containers'][0]['image']==old['spec']['template']['spec']['containers'][0]['image']
   value=k('exec',p['metadata']['name'],'-c','worker','--','printenv','ROUTE_SECRET').rstrip(b'\n')
   assert hashlib.sha256(value).hexdigest()==contract['value_sha256']
  print('OK')
  VERIFY_OWNED_PODS
  ```

  Esperado: despliegue completado y OK.


  ```bash
  set -euo pipefail
  source platform.env
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' -X POST --data '{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq -e '."secret/data/dispatch"==["read"] and ."secret/data/other"==["deny"] and ."sys/audit"==["deny"]'
  ```

  Esperado: true; no se muestra ningún secreto.
debrief: Se conservaron las identidades de fuente y consumidores; las aplicaciones adoptaron la publicación aprobada.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
