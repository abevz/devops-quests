guides.reference_1: Consultar la API Vault pertinente
guides.reference_2: Referencia de publicación y consumidores
diagnostics.reader: La policy reader inicial apunta a ruta de datos incorrecta o falla lectura autenticada; permita read de ruta KV-v2 documentada conservando denegación other-data y audit. [Causa y comprobación](guides#guide=vault-recovery&section=vault-pod-narrow-source-read)
diagnostics.secret: El archivo de sincronización carece de implementación, por lo que Secret puede faltar o estar antiguo; construya lectura bajo demanda y entrega del valor aprobado a referencia secret existente. Errores de lectura de fuente o Kubernetes también dan marcador. [Causa y comprobación](guides#guide=vault-recovery&section=vault-pod-explicit-delivery)
diagnostics.env: Actualizar Secret no cambia entorno de proceso existente; el contenedor nombrado puede conservar valor antiguo o no iniciar. Renueve Pod mediante controlador original conservando referencia secret y programa suministrados. [Causa y comprobación](guides#guide=vault-recovery&section=vault-pod-effective-secret)
diagnostics.probe_0_0: La aplicación original puede usar manager credential suministrado o caché antiguo, o cambiar identidad de proceso, fuente o capabilities limitadas. Mantenga identidad privada reader, actualice mismo proceso con SIGHUP y verifique metadata aprobados; inicio, análisis y tiempos de observación también dan fallback agregado. [Causa y comprobación](guides#guide=vault-recovery&section=vault-pod-original-application-agreement)
diagnostics.rollout: El workload original puede bloquearse por Secret sin entregar u otro fallo de inicio; inspeccione eventos tras sincronizar fuente conservando Deployment. [Causa y comprobación](guides#guide=vault-recovery&section=vault-pod-secret-blocked-rollout)
diagnostics.probe_0_1: Puede cambiar identidad Deployment, selector, réplica única o pod specification completa, o su único Pod actual propio no estar Ready con valor efectivo aprobado. Conserve image, programa, security y referencia secret; errores API, inicio y tiempos comparten fallback. [Causa y comprobación](guides#guide=vault-recovery&section=vault-pod-retained-workload-contract)
