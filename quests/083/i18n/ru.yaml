title: Секрет из Vault в pod
brief: 'Постройте доставку существующей публикации Vault в исходную нагрузку Kubernetes и приложение workstation.
  Сохраните идентичность Deployment, селектор, число реплик, программу pod, образ, параметры безопасности и ссылку
  на Secret. Все активные принадлежащие ему pod должны быть Ready и использовать утверждённое значение. Сохраните
  запрет reader для путей других данных и аудита из consumer/README.md. В заготовке синхронизации нет готовой реализации
  доставки.


  Работайте в `~/quest`. В каталоге потребителя находятся конфигурация, запись PID и журнал приложения. Интерфейс
  описан в `consumer/README.md`; `consumer-contract.json` содержит исходные процессы, утверждённый источник, хеш
  публикации и версию. Сохраните программы, идентичность и привилегии исходных процессов. Каждый потребитель должен
  отдавать утверждённую публикацию через свой HTTP-интерфейс, используя исходный источник и выданную приватную reader-идентичность.
  Успешного ручного запроса к источнику недостаточно. Файлы учётных данных должны быть обычными, принадлежать пользователю
  workstation и иметь режим `0600`. Не выводите секреты и учётные данные.


  **Требования:**


  - Исходное приложение принимает утверждённую публикацию с выданной приватной reader-идентичностью; доступ Vault,
  доставленные данные Kubernetes и потребители согласованы без расширения полномочий.

  - Исходная нагрузка завершает rollout, сохраняя программу и идентичность; каждый активный принадлежащий ей pod
  использует утверждённую конфигурацию.'
stages.0.brief: Постройте доставку существующей публикации Vault в исходную нагрузку Kubernetes и приложение workstation.
  Сохраните идентичность Deployment, селектор, число реплик, программу pod, образ, параметры безопасности и ссылку
  на Secret. Все активные принадлежащие ему pod должны быть Ready и использовать утверждённое значение. Сохраните
  запрет reader для путей других данных и аудита из consumer/README.md. В заготовке синхронизации нет готовой реализации
  доставки.
hints.0.text: Доступность сервера, авторизация и принятая потребителем публикация — разные наблюдения.
hints.1.text: |-
  Сопоставьте живой ответ сервиса, профили источников, журналы приложений и исходный контракт. Проследите первую неисправную границу, прежде чем менять следующий компонент.

  Изучите активный профиль API и квитанцию об обновлении потребителя, затем сравните ссылку Secret у действующего Pod с метаданными назначения синхронизатора.

  ```bash
  cat consumer/source.json
  cat consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json
  python3 -I - <<'VERIFY_PUBLICATION'
  import json
  from pathlib import Path
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  observed=json.loads(Path('observed-publication.json').read_text())
  assert observed['ready'] is True
  assert observed['source']==contract['vault_url']
  assert observed['path']==contract['path']
  assert observed['value_sha256']==contract['value_sha256']
  assert observed['version']==contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```


  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  kubectl rollout status deployment/relay --timeout=30s
  python3 -I - <<'VERIFY_OWNED_PODS'
  import hashlib,json,subprocess
  from pathlib import Path
  def k(*args):
   return subprocess.check_output(['kubectl',*args],timeout=3)
  old=json.loads(Path('/run/dq/facts/0/original-relay.json').read_text())
  current=json.loads(k('get','deployment','relay','-o','json'))
  assert current['metadata']['uid']==old['metadata']['uid']
  assert current['spec']['template']['spec']==old['spec']['template']['spec']
  assert current['spec']['selector']==old['spec']['selector']
  assert current['spec'].get('replicas', 1)==old['spec'].get('replicas', 1)==1
  sets=json.loads(k('get','replicasets','-o','json'))['items']
  owners={x['metadata']['uid'] for x in sets if any(o.get('controller') is True and o['uid']==old['metadata']['uid'] for o in x['metadata'].get('ownerReferences',[]))}
  pods=json.loads(k('get','pods','-o','json'))['items']
  active=[p for p in pods if not p['metadata'].get('deletionTimestamp') and p['status'].get('phase') not in ('Succeeded','Failed') and any(o.get('controller') is True and o['uid'] in owners for o in p['metadata'].get('ownerReferences',[]))]
  assert len(active)==1
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  for p in active:
   assert any(c['type']=='Ready' and c['status']=='True' for c in p['status'].get('conditions',[]))
   assert p['spec']['containers'][0]['image']==old['spec']['template']['spec']['containers'][0]['image']
   value=k('exec',p['metadata']['name'],'-c','worker','--','printenv','ROUTE_SECRET').rstrip(b'\n')
   assert hashlib.sha256(value).hexdigest()==contract['value_sha256']
  print('OK')
  VERIFY_OWNED_PODS
  ```

  Ожидается завершённый rollout и OK.


  ```bash
  set -euo pipefail
  source platform.env
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' -X POST --data '{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq -e '."secret/data/dispatch"==["read"] and ."secret/data/other"==["deny"] and ."sys/audit"==["deny"]'
  ```

  Ожидается true; секрет не выводится.
debrief: Идентичность источника и потребителей сохранена; работающие приложения приняли утверждённую публикацию.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
