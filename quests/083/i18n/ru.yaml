title: Секрет из Vault в pod
brief: 'Работайте в `~/quest` с `platform.env`, `reader.hcl`, `sync-secret.sh` и `deployment.json`. Одноразовый игровой Vault уже инициализирован и распечатан. Его политика `rail-reader` указывает неверный путь KV-v2. Токен manager может изменить политику; токен reader должен иметь право читать `secret/data/dispatch`. Не выводите токены или ответы с секретами. Руководство Vault объясняет пути политик и безопасное чтение KV-v2.


  Исправьте `rail-reader`, запустите выданный скрипт `sync-secret.sh` по запросу и дождитесь развёртывания `deployment/relay`. Проверьте, что reader получает `north-secret` в `.data.data.value`, Kubernetes Secret `route-secret` содержит ключ `value`, декодируемый в `north-secret`, а процесс `relay` имеет `ROUTE_SECRET=north-secret`. Развёртывание должно завершиться успешно. Проверка наблюдает результаты, но не доказывает, какие изменения политики или действия синхронизации их вызвали. Работайте только в офлайн-песочнице.'
stages.0.brief: Значение reader, ключ Secret, окружение relay и развёртывание соответствуют заданию.
