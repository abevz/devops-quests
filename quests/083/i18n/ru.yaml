title: Секрет из Vault в pod
brief: |-
  Relay не получает значение из Vault. Восстановите ожидаемое значение по всей цепочке доставки.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `reader.hcl`, `sync-secret.sh`, `deployment.yaml`.

  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` — на workstation.

  **Requirements:**

  - Предоставленная идентичность Vault, доставленная конфигурация Kubernetes и работающий процесс `relay` предоставляют значение dispatch `north-secret`.
  - Deployment `relay` завершает rollout в namespace песочницы.

  Проверка наблюдает эти результаты, но не доказывает, какие изменения политики или шаги синхронизации к ним привели.
stages.0.brief: Все наблюдения доставки должны согласовываться с одним значением.
hints.0.text: Авторизация, доставленная конфигурация и работающий процесс — отдельные звенья цепочки доставки.
hints.1.text: |-
  Проследите предоставленный помощник синхронизации и ссылки на конфигурацию нагрузки.

  ```bash
  cat sync-secret.sh
  kubectl describe deployment relay
  ```
hints.2.text: |-
  Исправьте rail-reader токеном manager, запустите sync-secret.sh и проверьте Secret и окружение пода. Для чтения KV-v2 нужен путь политики secret/data/dispatch.

  Проверьте из `~/quest` на workstation:

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`

  Код `0`; учётные данные и секретные значения не выводятся.

  - `kubectl get secret route-secret -o json | jq -e '.data.value | @base64d == "north-secret"' >/dev/null`

  Код `0`; учётные данные и секретные значения не выводятся.

  - `kubectl exec deployment/relay -c worker -- sh -c 'test "$ROUTE_SECRET" = north-secret'`
  - `kubectl rollout status deployment/relay --timeout=3s`

  Код `0`; учётные данные и секретные значения не выводятся. Rollout завершён.
debrief: Значение reader, ключ Secret, окружение relay и развёртывание соответствовали проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
