guides.reference_1: Справочник наблюдаемого API Vault
guides.reference_2: Справочник проверки публикации и потребителей
diagnostics.reader: Выданная policy reader изначально указывает неверный data-путь, либо authenticated read не проходит; разрешите read документированного KV-v2 data-пути, сохранив запрет на other-data и audit. [Причина и проверка](guides#guide=vault-recovery&section=vault-pod-narrow-source-read)
diagnostics.secret: Рабочий файл синхронизации не содержит реализации, поэтому Kubernetes Secret может отсутствовать или устареть; создайте явное чтение источника и доставку одобренного значения по существующей secret-ссылке. Ошибки чтения источника или Kubernetes дают тот же маркер. [Причина и проверка](guides#guide=vault-recovery&section=vault-pod-explicit-delivery)
diagnostics.env: Изменение Secret не обновляет окружение существующего процесса; именованный контейнер может сохранять старое значение или не запускаться. Обновите Pod через исходный контроллер, сохранив выданную secret-ссылку и программу. [Причина и проверка](guides#guide=vault-recovery&section=vault-pod-effective-secret)
diagnostics.probe_0_0: Исходное приложение может использовать выданный manager credential или старый кэш, либо изменились идентичность процесса, источник или узкие capabilities. Сохраните приватную выданную идентичность reader, обновите тот же процесс через SIGHUP и проверьте одобренные metadata; запуск, разбор и таймауты наблюдения также дают общий fallback. [Причина и проверка](guides#guide=vault-recovery&section=vault-pod-original-application-agreement)
diagnostics.rollout: Исходный workload может блокироваться отсутствующей доставкой Secret или другой ошибкой запуска; изучите события после синхронизации источника, сохраняя Deployment. [Причина и проверка](guides#guide=vault-recovery&section=vault-pod-secret-blocked-rollout)
diagnostics.probe_0_1: Могли измениться UID Deployment, selector, единственная реплика или полная pod specification, либо один текущий принадлежащий Pod не Ready с одобренным эффективным значением. Сохраните image, программу, security и secret-ссылку; ошибки API, запуска и таймауты дают тот же fallback. [Причина и проверка](guides#guide=vault-recovery&section=vault-pod-retained-workload-contract)
