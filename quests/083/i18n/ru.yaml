title: Секрет из Vault в pod
brief: 'Вы в команде эксплуатации SignalRail. Политика Vault заблокировала получение секрета. Работайте
  в ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `deployment.json`, `platform.env`, `sync-secret.sh`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Реальное чтение Vault доставляет route-secret в работающий reader.'
stages.0.brief: 'Vault инициализирован и распечатан. Reader policy указывает неверный KV-v2 path. Исправьте
  rail-reader через manager token, затем bash sync-secret.sh. Это явная синхронизация по запросу.


  Результат проверки: Реальное чтение Vault доставляет route-secret в работающий reader.'
stages.0.objectives.0.text: Реальное чтение Vault доставляет route-secret в работающий reader.
hints.0.text: Проверьте HTTP-статус Vault, не выводя token.
hints.1.text: Для чтения KV-v2 нужен policy path secret/data/dispatch.
hints.2.text: Исправьте rail-reader через manager token, выполните sync-secret.sh и проверьте Secret и
  окружение pod.
debrief: ACL KV-v2 указывал неверный путь. Вы исправили rail-reader, запустили явную синхронизацию и проверили
  чтение Vault, Secret и окружение pod.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 read path
