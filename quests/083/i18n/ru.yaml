title: Секрет из Vault в pod
brief: 'Постройте доставку существующей публикации Vault в исходную нагрузку Kubernetes и приложение workstation.
  Сохраните идентичность Deployment, селектор, число реплик, программу pod, образ, параметры безопасности и ссылку
  на Secret. Все активные принадлежащие ему pod должны быть Ready и использовать утверждённое значение. Сохраните
  запрет reader для путей других данных и аудита из consumer/README.md. В заготовке синхронизации нет готовой реализации
  доставки.


  Работайте в `~/quest`. В каталоге потребителя находятся конфигурация, запись PID и журнал приложения. Интерфейс
  описан в `consumer/README.md`; `consumer-contract.json` содержит исходные процессы, утверждённый источник, хеш
  публикации и версию. Сохраните программы, идентичность и привилегии исходных процессов. Каждый потребитель должен
  отдавать утверждённую публикацию через свой HTTP-интерфейс, используя исходный источник и выданную приватную reader-идентичность.
  Успешного ручного запроса к источнику недостаточно. Файлы учётных данных должны быть обычными, принадлежать пользователю
  workstation и иметь режим `0600`. Не выводите секреты и учётные данные.


  **Требования:**


  - Исходное приложение принимает утверждённую публикацию с выданной приватной reader-идентичностью; доступ Vault,
  доставленные данные Kubernetes и потребители согласованы без расширения полномочий.

  - Исходная нагрузка завершает rollout, сохраняя программу и идентичность; каждый активный принадлежащий ей pod
  использует утверждённую конфигурацию.'
stages.0.brief: Постройте доставку существующей публикации Vault в исходную нагрузку Kubernetes и приложение workstation.
  Сохраните идентичность Deployment, селектор, число реплик, программу pod, образ, параметры безопасности и ссылку
  на Secret. Все активные принадлежащие ему pod должны быть Ready и использовать утверждённое значение. Сохраните
  запрет reader для путей других данных и аудита из consumer/README.md. В заготовке синхронизации нет готовой реализации
  доставки.
hints.0.text: Доступность сервера, авторизация и принятая потребителем публикация — разные наблюдения.
hints.1.text: 'Сопоставьте живой ответ сервиса, профили источников, журналы приложений и исходный контракт. Проследите
  первую неисправную границу, прежде чем менять следующий компонент.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```'
hints.2.text: "Постройте приватное чтение источника и доставку в Kubernetes Secret. Сохраните Deployment и его ссылку\
  \ на Secret, обновите потребителей окружения и передайте reader в профиль workstation. Путь API и ожидаемая публикация\
  \ записаны в исходном контракте. Сначала реализуйте заготовку синхронизатора.\n\nПриведите профиль к утверждённому\
  \ API-источнику и выданным учётным данным reader. Сохраните приватность файла и отправьте SIGHUP существующему\
  \ PID; manager — другая идентичность. Проверьте HTTP-публикацию, а не только источник. Ожидается OK.\n\n```bash\n\
  set -euo pipefail\ncd ~/quest\ncurl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json\npython3\
  \ -I - <<'VERIFY_PUBLICATION'\nimport json\nfrom pathlib import Path\ncontract=json.loads(Path('consumer-contract.json').read_text())\n\
  observed=json.loads(Path('observed-publication.json').read_text())\nassert observed['ready'] is True\nassert observed['source']==contract['vault_url']\n\
  assert observed['path']==contract['path']\nassert observed['value_sha256']==contract['value_sha256']\nassert observed['version']==contract['version']\n\
  print('OK')\nVERIFY_PUBLICATION\n```\n\n\n```bash\nset -euo pipefail\ncd ~/quest\nkubectl rollout status deployment/relay\
  \ --timeout=30s\npython3 -I - <<'VERIFY_OWNED_PODS'\nimport hashlib,json,subprocess\nfrom pathlib import Path\n\
  def k(*args):\n return subprocess.check_output(['kubectl',*args],timeout=3)\nold=json.loads(Path('original-relay.json').read_text())\n\
  current=json.loads(k('get','deployment','relay','-o','json'))\nassert current['metadata']['uid']==old['metadata']['uid']\n\
  assert current['spec']['template']['spec']==old['spec']['template']['spec']\nsets=json.loads(k('get','replicasets','-o','json'))['items']\n\
  owners={x['metadata']['uid'] for x in sets if any(o.get('controller') is True and o['uid']==old['metadata']['uid']\
  \ for o in x['metadata'].get('ownerReferences',[]))}\npods=json.loads(k('get','pods','-o','json'))['items']\n\
  active=[p for p in pods if not p['metadata'].get('deletionTimestamp') and p['status'].get('phase') not in ('Succeeded','Failed')\
  \ and any(o.get('controller') is True and o['uid'] in owners for o in p['metadata'].get('ownerReferences',[]))]\n\
  assert len(active)==1\ncontract=json.loads(Path('consumer-contract.json').read_text())\nfor p in active:\n assert\
  \ any(c['type']=='Ready' and c['status']=='True' for c in p['status'].get('conditions',[]))\n assert p['spec']['containers'][0]['image']==old['spec']['template']['spec']['containers'][0]['image']\n\
  \ value=k('exec',p['metadata']['name'],'-c','worker','--','printenv','ROUTE_SECRET').rstrip(b'\\n')\n assert hashlib.sha256(value).hexdigest()==contract['value_sha256']\n\
  print('OK')\nVERIFY_OWNED_PODS\n```\n\nОжидается завершённый rollout и OK.\n\n\n```bash\nset -euo pipefail\nsource\
  \ platform.env\ncurl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") -H 'Content-Type:\
  \ application/json' -X POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/other\",\"sys/audit\"]}'\
  \ \"$VAULT_ADDR/v1/sys/capabilities-self\" | jq -e '.\"secret/data/dispatch\"==[\"read\"] and .\"secret/data/other\"\
  ==[\"deny\"] and .\"sys/audit\"==[\"deny\"]'\n```\n\nОжидается true; секрет не выводится."
debrief: Идентичность источника и потребителей сохранена; работающие приложения приняли утверждённую публикацию.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
