diagnostics.reader: Токен читателя должен прочитать north-secret из secret/data/dispatch.
diagnostics.secret: Декодированное значение route-secret должно быть north-secret.
diagnostics.env: ROUTE_SECRET контейнера relay должен быть north-secret.
diagnostics.rollout: Выкатка Deployment relay должна завершиться.
stages.0.objectives.0.text: Исходное приложение принимает утверждённую публикацию с выданной приватной reader-идентичностью;
  доступ Vault, доставленные данные Kubernetes и потребители согласованы без расширения полномочий.
stages.0.objectives.1.text: Исходная нагрузка завершает rollout, сохраняя программу и идентичность; каждый активный
  принадлежащий ей pod использует утверждённую конфигурацию.
diagnostics.probe_0_0: Исходное приложение должно принять утверждённый API-источник с приватной reader-идентичностью.
  Сопоставьте профиль, запись процесса и HTTP-публикацию.
diagnostics.probe_0_1: Сохраните идентичность исходного Deployment и программу pod; каждый активный принадлежащий
  ему pod должен быть Ready и использовать утверждённое значение источника.
