title: Sekret Vault do pod
brief: 'Dołączyłeś do operacji SignalRail. Zasada odrzuciła tajne zadanie synchronizacji i reader pozostał
  zablokowany. Pracuj w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `deployment.json`, `platform.env`, `sync-secret.sh`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Prawdziwy odczyt Vault dostarcza route-secret do działającego reader.'
stages.0.brief: 'Vault został zainicjowany i rozpieczętowany. Jego polityka reader wskazuje na niewłaściwy
  KV-v2 path. Napraw tylko rail-reader za pomocą manager token, a następnie uruchom bash sync-secret.sh.
  Skrypt jest synchronizatorem na żądanie.


  Kryteria sukcesu: Prawdziwy odczyt Vault dostarcza route-secret do działającego reader.'
stages.0.objectives.0.text: Prawdziwy odczyt Vault dostarcza route-secret do działającego reader.
hints.0.text: Sprawdź status Vault HTTP bez drukowania tokenów.
hints.1.text: Odczyty KV-v2 wymagają ścieżki polityki tajnej/danych/wysyłania.
hints.2.text: Napraw rail-reader poprzez manager token, uruchom sync-secret.sh, następnie sprawdź środowisko
  Secret i pod.
debrief: KV-v2 ACL wskazywał niewłaściwą ścieżkę. Naprawiłeś rail-reader, uruchomiłeś jawny skrypt synchronizacji
  i zweryfikowałeś odczyt Vault, Kubernetes Secret i pod.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 read path
