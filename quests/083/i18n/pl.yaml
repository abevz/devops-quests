diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
diagnostics.secret: Odkodowana wartość route-secret musi wynosić north-secret.
diagnostics.env: ROUTE_SECRET kontenera relay musi wynosić north-secret.
diagnostics.rollout: Wdrożenie Deployment relay musi się zakończyć.
