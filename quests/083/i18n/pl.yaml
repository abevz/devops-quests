title: Sekret Vault do pod
brief: 'Pracuj w `~/quest` z `platform.env`, `reader.hcl`, `sync-secret.sh` i `deployment.json`. Jednorazowy Vault gry jest
  już zainicjowany i odpieczętowany. Jego polityka `rail-reader` wskazuje błędną ścieżkę KV-v2. Token manager może ją zmienić;
  token reader musi mieć prawo odczytu `secret/data/dispatch`. Nigdy nie wypisuj tokenów ani odpowiedzi zawierających sekrety.
  Połączony przewodnik Vault wyjaśnia ścieżki polityk i bezpieczny odczyt KV-v2.


  Napraw `rail-reader`, uruchom dostarczony na żądanie `sync-secret.sh` i poczekaj na wdrożenie `deployment/relay`. Sprawdź,
  czy reader otrzymuje `north-secret` jako `.data.data.value`, Kubernetes Secret `route-secret` ma klucz `value` dekodowany
  do `north-secret`, a proces `relay` ma `ROUTE_SECRET=north-secret`. Wdrożenie musi się powieść. Kontrola obserwuje wyniki,
  ale nie dowodzi, jakie zmiany polityki lub kroki synchronizacji je spowodowały. Pracuj tylko w zatoce offline.'
stages.0.brief: Wartość reader, klucz Secret, środowisko relay i wdrożenie odpowiadają opisowi.
stages.0.objectives.0.text: Wartość reader, klucz Secret, środowisko relay i wdrożenie odpowiadają opisowi.
hints.0.text: Sprawdź status HTTP Vault, nie wypisując tokenów.
hints.1.text: Odczyt KV-v2 wymaga ścieżki polityki secret/data/dispatch.
hints.2.text: Napraw rail-reader tokenem manager, uruchom sync-secret.sh, a następnie sprawdź Secret i środowisko poda.
debrief: Wartość reader, klucz Secret, środowisko relay i wdrożenie odpowiadały kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
