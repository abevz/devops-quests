title: Sekret Vault do pod
brief: |-
  Relay nie może korzystać z wartości z Vault. Przywróć oczekiwaną wartość w całym łańcuchu dostarczania.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `reader.hcl`, `sync-secret.sh`, `deployment.yaml`.

  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki w `~/quest` są na workstation.

  **Requirements:**

  - Dostarczona tożsamość Vault, dostarczona konfiguracja Kubernetes i działający proces `relay` udostępniają wartość dispatch `north-secret`.
  - Deployment `relay` kończy rollout w przestrzeni nazw zatoki.

  Sprawdzenie obserwuje te wyniki; nie dowodzi, jakie zmiany polityki lub kroki synchronizacji do nich doprowadziły.
stages.0.brief: Wszystkie obserwacje dostarczania muszą potwierdzać tę samą wartość.
hints.0.text: Autoryzacja, dostarczona konfiguracja i działający proces to oddzielne ogniwa łańcucha dostarczania.
hints.1.text: |-
  Prześledź dostarczony skrypt synchronizacji i odwołania do konfiguracji obciążenia.

  ```bash
  cat sync-secret.sh
  kubectl describe deployment relay
  ```
hints.2.text: |-
  Napraw rail-reader tokenem manager, uruchom sync-secret.sh, a następnie sprawdź Secret i środowisko poda. Odczyt KV-v2 wymaga ścieżki polityki secret/data/dispatch.

  Sprawdź z `~/quest` na workstation:

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`

  Kod `0`; dane uwierzytelniające i tajne wartości nie są wyświetlane.

  - `kubectl get secret route-secret -o json | jq -e '.data.value | @base64d == "north-secret"' >/dev/null`

  Kod `0`; dane uwierzytelniające i tajne wartości nie są wyświetlane.

  - `kubectl exec deployment/relay -- sh -c 'test "$ROUTE_SECRET" = north-secret'`
  - `kubectl rollout status deployment/relay --timeout=3s`

  Kod `0`; dane uwierzytelniające i tajne wartości nie są wyświetlane. Rollout kończy się.
debrief: Wartość reader, klucz Secret, środowisko relay i wdrożenie odpowiadały kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
hints.0.label: Vault docs · ACL policies
