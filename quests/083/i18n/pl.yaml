title: Sekret Vault do pod
brief: 'Zbuduj dostarczanie istniejącej publikacji Vault do pierwotnego obciążenia Kubernetes i aplikacji workstation.
  Zachowaj tożsamość Deployment, selektor, liczbę replik, program, obraz, zabezpieczenia i odwołanie do Secret.
  Wszystkie aktywne należące do niego pody muszą być Ready i używać zatwierdzonej wartości. Zachowaj odmowy reader
  dla innych danych i audytu opisane w consumer/README.md. Szkielet synchronizacji nie zawiera gotowej implementacji.


  Pracuj w `~/quest`. Katalog konsumenta zawiera konfigurację, PID i dziennik aplikacji. `consumer/README.md` opisuje
  interfejs; `consumer-contract.json` zapisuje pierwotne procesy, zatwierdzone źródło, skrót publikacji i wersję.
  Zachowaj programy, tożsamości i uprawnienia procesów. Każdy konsument ma udostępniać zatwierdzoną publikację przez
  istniejący HTTP, z pierwotnego źródła i dostarczoną prywatną tożsamością reader. Ręczny odczyt źródła nie wystarcza.
  Dane uwierzytelniające muszą być zwykłymi plikami użytkownika workstation z trybem `0600`. Nie wypisuj sekretów
  ani danych uwierzytelniających.


  **Wymagania:**


  - Pierwotna aplikacja przyjmuje zatwierdzoną publikację z prywatną tożsamością reader; dostęp Vault, dane Kubernetes
  i konsumenci są zgodni bez rozszerzania uprawnień.

  - Pierwotne obciążenie kończy rollout z zachowaniem programu i tożsamości; każdy aktywny należący do niego pod
  używa zatwierdzonej konfiguracji.'
stages.0.brief: Zbuduj dostarczanie istniejącej publikacji Vault do pierwotnego obciążenia Kubernetes i aplikacji
  workstation. Zachowaj tożsamość Deployment, selektor, liczbę replik, program, obraz, zabezpieczenia i odwołanie
  do Secret. Wszystkie aktywne należące do niego pody muszą być Ready i używać zatwierdzonej wartości. Zachowaj
  odmowy reader dla innych danych i audytu opisane w consumer/README.md. Szkielet synchronizacji nie zawiera gotowej
  implementacji.
hints.0.text: Dostępność serwera, autoryzacja i publikacja przyjęta przez konsumenta są odrębnymi obserwacjami.
hints.1.text: |-
  Porównaj odpowiedź usługi, profile źródeł, dzienniki aplikacji i pierwotny kontrakt. Najpierw prześledź pierwszą uszkodzoną granicę.

  Sprawdź aktywny profil API i potwierdzenie przeładowania konsumenta, a następnie porównaj odwołanie do Secretu w bieżącym Podzie z metadanymi celu synchronizatora.

  ```bash
  cat consumer/source.json
  cat consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json
  python3 -I - <<'VERIFY_PUBLICATION'
  import json
  from pathlib import Path
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  observed=json.loads(Path('observed-publication.json').read_text())
  assert observed['ready'] is True
  assert observed['source']==contract['vault_url']
  assert observed['path']==contract['path']
  assert observed['value_sha256']==contract['value_sha256']
  assert observed['version']==contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```


  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  kubectl rollout status deployment/relay --timeout=30s
  python3 -I - <<'VERIFY_OWNED_PODS'
  import hashlib,json,subprocess
  from pathlib import Path
  def k(*args):
   return subprocess.check_output(['kubectl',*args],timeout=3)
  old=json.loads(Path('/run/dq/facts/0/original-relay.json').read_text())
  current=json.loads(k('get','deployment','relay','-o','json'))
  assert current['metadata']['uid']==old['metadata']['uid']
  assert current['spec']['template']['spec']==old['spec']['template']['spec']
  assert current['spec']['selector']==old['spec']['selector']
  assert current['spec'].get('replicas', 1)==old['spec'].get('replicas', 1)==1
  sets=json.loads(k('get','replicasets','-o','json'))['items']
  owners={x['metadata']['uid'] for x in sets if any(o.get('controller') is True and o['uid']==old['metadata']['uid'] for o in x['metadata'].get('ownerReferences',[]))}
  pods=json.loads(k('get','pods','-o','json'))['items']
  active=[p for p in pods if not p['metadata'].get('deletionTimestamp') and p['status'].get('phase') not in ('Succeeded','Failed') and any(o.get('controller') is True and o['uid'] in owners for o in p['metadata'].get('ownerReferences',[]))]
  assert len(active)==1
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  for p in active:
   assert any(c['type']=='Ready' and c['status']=='True' for c in p['status'].get('conditions',[]))
   assert p['spec']['containers'][0]['image']==old['spec']['template']['spec']['containers'][0]['image']
   value=k('exec',p['metadata']['name'],'-c','worker','--','printenv','ROUTE_SECRET').rstrip(b'\n')
   assert hashlib.sha256(value).hexdigest()==contract['value_sha256']
  print('OK')
  VERIFY_OWNED_PODS
  ```

  Oczekiwane: zakończony rollout i OK.


  ```bash
  set -euo pipefail
  source platform.env
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' -X POST --data '{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq -e '."secret/data/dispatch"==["read"] and ."secret/data/other"==["deny"] and ."sys/audit"==["deny"]'
  ```

  Oczekiwane: true; sekret nie jest wypisywany.
debrief: Zachowano tożsamości źródła i konsumentów; aplikacje przyjęły zatwierdzoną publikację.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 read path
stages.0.objectives.0.text: Pierwotna aplikacja przyjmuje zatwierdzoną publikację z prywatną tożsamością reader;
  dostęp Vault, dane Kubernetes i konsumenci są zgodni bez rozszerzania uprawnień.
stages.0.objectives.1.text: Pierwotne obciążenie kończy rollout z zachowaniem programu i tożsamości; każdy aktywny
  należący do niego pod używa zatwierdzonej konfiguracji.
guides.reference_1: Sprawdź odpowiednie API Vault
guides.reference_2: Dokumentacja weryfikacji publikacji i konsumentów
diagnostics.reader: Dostarczona policy reader początkowo wskazuje błędną ścieżkę danych albo uwierzytelniony odczyt zawodzi; zezwól na read dokumentowanej ścieżki KV-v2, zachowując odmowę other-data i audit. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-pod-narrow-source-read)
diagnostics.secret: Plik synchronizacji nie zawiera implementacji, więc Kubernetes Secret może brakować lub być stary; zbuduj odczyt źródła na żądanie i dostarczenie zatwierdzonej wartości do istniejącego odwołania secret. Błędy odczytu źródła lub Kubernetes też dają ten marker. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-pod-explicit-delivery)
diagnostics.env: Zmiana Secret nie aktualizuje środowiska istniejącego procesu; nazwany kontener może zachować starą wartość lub nie startować. Odnów Pod przez pierwotny kontroler, zachowując dostarczone odwołanie secret i program. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-pod-effective-secret)
diagnostics.probe_0_0: Pierwotna aplikacja może nadal używać dostarczonego manager credential lub starego cache, albo zmieniła się tożsamość procesu, konfiguracja źródła lub wąskie capabilities. Zachowaj prywatną dostarczoną tożsamość reader, odśwież ten sam proces przez SIGHUP i sprawdź zatwierdzone metadata; start, parsowanie i limity obserwacji też dają zbiorczy fallback. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-pod-original-application-agreement)
diagnostics.rollout: Pierwotny workload może być blokowany przez brak dostarczonego Secret lub inny błąd startu; sprawdź zdarzenia po synchronizacji źródła, zachowując Deployment. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-pod-secret-blocked-rollout)
diagnostics.probe_0_1: Tożsamość Deployment, selector, jedna replika lub pełna pod specification mogły się zmienić, albo jedyny bieżący należący Pod nie jest Ready z zatwierdzoną skuteczną wartością. Zachowaj image, program, security i odwołanie secret; błędy API, startu i limity dzielą fallback. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-pod-retained-workload-contract)
