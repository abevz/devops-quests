title: Vault bis pod Geheimnis
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Eine Richtlinie verweigerte den geheimen Synchronisierungsauftrag
  und reader blieb blockiert. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich
  auf.


  Eingaben in `~/quest`: `deployment.json`, `platform.env`, `sync-secret.sh`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Ein echter Vault-Lesevorgang liefert route-secret an den laufenden reader.'
stages.0.brief: 'Vault wurde initialisiert und entsiegelt. Sein reader policy zeigt auf den falschen KV-v2-Pfad.
  Reparieren Sie nur rail-reader mit manager token und führen Sie dann bash sync-secret.sh aus. Das Skript
  ist ein On-Demand-Synchronisierer.


  Erfolgskriterium: Ein echter Vault-Lesevorgang liefert route-secret an den laufenden reader.'
stages.0.objectives.0.text: Ein echter Vault-Lesevorgang liefert route-secret an den laufenden reader.
hints.0.text: Überprüfen Sie den Status Vault HTTP, ohne Token zu drucken.
hints.1.text: Für KV-v2-Lesevorgänge ist der Pfad secret/data/dispatch policy erforderlich.
hints.2.text: Reparieren Sie rail-reader über die manager token, führen Sie sync-secret.sh und dann inspect
  die Secret- und pod-Umgebung aus.
debrief: Der KV-v2 ACL zeigte auf den falschen Pfad. Sie haben rail-reader repariert, das explizite Synchronisierungsskript
  ausgeführt und die Umgebungen Vault gelesen, Kubernetes Secret und pod überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 Lesepfad
