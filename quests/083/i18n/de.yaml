title: Vault bis pod Geheimnis
brief: 'Konstruieren Sie die Übertragung der bestehenden Vault-Publikation an den ursprünglichen Kubernetes-Workload
  und die Workstation-Anwendung. Bewahren Sie Deployment-Identität, Selektor, Replikazahl, Pod-Programm, Image,
  Sicherheitseinstellungen und Secret-Referenz. Alle aktiven zugehörigen Pods müssen Ready sein und den freigegebenen
  Wert verwenden. Bewahren Sie Reader-Ablehnungen für andere Daten und Audit gemäß consumer/README.md. Der Synchronisationsentwurf
  enthält keine fertige Übertragung.


  Arbeiten Sie in `~/quest`. Das Verbraucherverzeichnis enthält Konfiguration, PID und Anwendungsprotokoll. `consumer/README.md`
  beschreibt die Schnittstelle; `consumer-contract.json` dokumentiert ursprüngliche Prozesse, freigegebene Quelle,
  Publikationshash und Version. Bewahren Sie Programm, Prozessidentität und Rechte. Jeder Verbraucher muss die freigegebene
  Publikation über seinen vorhandenen HTTP-Endpunkt mit der ursprünglichen Quelle und privaten Reader-Identität
  liefern. Ein manueller Quellenabruf reicht nicht. Zugangsdaten müssen reguläre Dateien des Workstation-Benutzers
  mit Modus `0600` bleiben. Keine Geheimnisse oder Zugangsdaten ausgeben.


  **Anforderungen:**


  - Die ursprüngliche Anwendung übernimmt die freigegebene Publikation mit privater Reader-Identität; Vault-Zugriff,
  Kubernetes-Daten und laufende Verbraucher stimmen ohne zusätzliche Rechte überein.

  - Der ursprüngliche Workload schließt den Rollout mit erhaltenem Programm und Identität ab; alle aktiven zugehörigen
  Pods verwenden die freigegebene Konfiguration.'
stages.0.brief: Konstruieren Sie die Übertragung der bestehenden Vault-Publikation an den ursprünglichen Kubernetes-Workload
  und die Workstation-Anwendung. Bewahren Sie Deployment-Identität, Selektor, Replikazahl, Pod-Programm, Image,
  Sicherheitseinstellungen und Secret-Referenz. Alle aktiven zugehörigen Pods müssen Ready sein und den freigegebenen
  Wert verwenden. Bewahren Sie Reader-Ablehnungen für andere Daten und Audit gemäß consumer/README.md. Der Synchronisationsentwurf
  enthält keine fertige Übertragung.
hints.0.text: Serververfügbarkeit, Berechtigung und übernommene Verbraucherpublikation sind getrennte Beobachtungen.
hints.1.text: |-
  Vergleichen Sie Live-Antwort, Quellenprofile, Anwendungsprotokolle und ursprünglichen Vertrag. Verfolgen Sie zuerst die fehlerhafte Grenze.

  Prüfe das aktive API-Profil und den Nachweis zur Verbraucher-Aktualisierung. Vergleiche den Secret-Verweis des aktuellen Pods mit den Zielmetadaten des Synchronisierers.

  ```bash
  cat consumer/source.json
  cat consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```
hints.2.text: |-
  ```bash
  set -euo pipefail
  cd ~/quest
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json
  python3 -I - <<'VERIFY_PUBLICATION'
  import json
  from pathlib import Path
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  observed=json.loads(Path('observed-publication.json').read_text())
  assert observed['ready'] is True
  assert observed['source']==contract['vault_url']
  assert observed['path']==contract['path']
  assert observed['value_sha256']==contract['value_sha256']
  assert observed['version']==contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```


  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  kubectl rollout status deployment/relay --timeout=30s
  python3 -I - <<'VERIFY_OWNED_PODS'
  import hashlib,json,subprocess
  from pathlib import Path
  def k(*args):
   return subprocess.check_output(['kubectl',*args],timeout=3)
  old=json.loads(Path('/run/dq/facts/0/original-relay.json').read_text())
  current=json.loads(k('get','deployment','relay','-o','json'))
  assert current['metadata']['uid']==old['metadata']['uid']
  assert current['spec']['template']['spec']==old['spec']['template']['spec']
  assert current['spec']['selector']==old['spec']['selector']
  assert current['spec'].get('replicas', 1)==old['spec'].get('replicas', 1)==1
  sets=json.loads(k('get','replicasets','-o','json'))['items']
  owners={x['metadata']['uid'] for x in sets if any(o.get('controller') is True and o['uid']==old['metadata']['uid'] for o in x['metadata'].get('ownerReferences',[]))}
  pods=json.loads(k('get','pods','-o','json'))['items']
  active=[p for p in pods if not p['metadata'].get('deletionTimestamp') and p['status'].get('phase') not in ('Succeeded','Failed') and any(o.get('controller') is True and o['uid'] in owners for o in p['metadata'].get('ownerReferences',[]))]
  assert len(active)==1
  contract=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())
  for p in active:
   assert any(c['type']=='Ready' and c['status']=='True' for c in p['status'].get('conditions',[]))
   assert p['spec']['containers'][0]['image']==old['spec']['template']['spec']['containers'][0]['image']
   value=k('exec',p['metadata']['name'],'-c','worker','--','printenv','ROUTE_SECRET').rstrip(b'\n')
   assert hashlib.sha256(value).hexdigest()==contract['value_sha256']
  print('OK')
  VERIFY_OWNED_PODS
  ```

  Erwartet: abgeschlossener Rollout und OK.


  ```bash
  set -euo pipefail
  source platform.env
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' -X POST --data '{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq -e '."secret/data/dispatch"==["read"] and ."secret/data/other"==["deny"] and ."sys/audit"==["deny"]'
  ```

  Erwartet: true; kein Geheimnis wird ausgegeben.
debrief: Quellen- und Verbraucheridentitäten blieben erhalten; laufende Anwendungen übernahmen die freigegebene
  Publikation.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
