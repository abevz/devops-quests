title: Vault bis pod Geheimnis
brief: 'Arbeite in `~/quest` mit `platform.env`, `reader.hcl`, `sync-secret.sh` und `deployment.json`. Der kurzlebige Spiel-Vault ist bereits initialisiert und entsiegelt. Seine Policy `rail-reader` zeigt auf einen falschen KV-v2-Pfad. Das manager-Token kann diese Policy ändern; das reader-Token muss `secret/data/dispatch` lesen dürfen. Gib niemals Tokens oder Secret-Antworten aus. Die verlinkte Vault-Anleitung erklärt Policy-Pfade und sichere KV-v2-Lesezugriffe.


  Korrigiere `rail-reader`, führe das bereitgestellte bedarfsweise `sync-secret.sh` aus und warte auf den Rollout von `deployment/relay`. Prüfe, dass reader `north-secret` als `.data.data.value` erhält, das Kubernetes-Secret `route-secret` einen Schlüssel `value` hat, der zu `north-secret` dekodiert wird, und der Prozess `relay` `ROUTE_SECRET=north-secret` besitzt. Der Rollout muss erfolgreich sein. Die Prüfung beobachtet diese Ergebnisse, beweist aber nicht, welche Policy-Änderungen oder Synchronisierungsschritte sie erzeugt haben. Arbeite nur in der Offline-Umgebung.'
stages.0.brief: Reader-Wert, Secret-Schlüssel, relay-Umgebung und Rollout stimmen mit der Aufgabe überein.
stages.0.objectives.0.text: Reader-Wert, Secret-Schlüssel, relay-Umgebung und Rollout stimmen mit der Aufgabe überein.
hints.0.text: Prüfe den HTTP-Status von Vault, ohne Tokens auszugeben.
hints.1.text: KV-v2-Lesezugriffe benötigen den Policy-Pfad secret/data/dispatch.
hints.2.text: Korrigiere rail-reader mit dem manager-Token, führe sync-secret.sh aus und prüfe anschließend das Secret und die Pod-Umgebung.
debrief: Reader-Wert, Secret-Schlüssel, relay-Umgebung und Rollout entsprachen den Prüfungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
