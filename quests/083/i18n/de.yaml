guides.reference_1: Relevante Vault-API untersuchen
guides.reference_2: Referenz zur Publikations- und Verbraucherprüfung
diagnostics.reader: Die gelieferte reader Policy verweist zunächst auf den falschen Datenpfad oder der authentifizierte Abruf scheitert; erlauben Sie read am dokumentierten KV-v2-Datenpfad unter Erhalt der other-data- und audit-Verweigerung. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-pod-narrow-source-read)
diagnostics.secret: Die Synchronisierungsdatei enthält keine Implementierung, daher fehlt das Kubernetes Secret möglicherweise oder ist veraltet; erstellen Sie Quellenabruf auf Anforderung und Auslieferung des freigegebenen Werts an den vorhandenen Secret-Verweis. Quellen- oder Kubernetes-Lesefehler ergeben denselben Marker. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-pod-explicit-delivery)
diagnostics.env: Geänderte Secret-Daten aktualisieren die Umgebung eines vorhandenen Prozesses nicht; der benannte Container behält möglicherweise den alten Wert oder startet nicht. Erneuern Sie Pods über den ursprünglichen Controller unter Erhalt des gelieferten Secret-Verweises und Programms. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-pod-effective-secret)
diagnostics.probe_0_0: Die ursprüngliche Anwendung nutzt möglicherweise noch das gelieferte manager Credential oder einen alten Cache, oder Prozessidentität, Quellkonfiguration beziehungsweise enge capabilities wurden verändert. Erhalten Sie die private gelieferte reader Identität, aktualisieren Sie denselben Prozess mit SIGHUP und prüfen Sie freigegebene Metadaten; Start-, Parse- und Beobachtungszeitfehler ergeben ebenfalls diesen Sammelfallback. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-pod-original-application-agreement)
diagnostics.rollout: Der ursprüngliche Workload wird möglicherweise durch ein noch nicht ausgeliefertes Secret oder einen anderen Startfehler blockiert; prüfen Sie Ereignisse nach der Quellensynchronisierung und erhalten Sie das Deployment. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-pod-secret-blocked-rollout)
diagnostics.probe_0_1: Deployment-Identität, Selector, einzelne Replik oder vollständige Pod-Spezifikation wurden möglicherweise verändert, oder der einzige aktuelle zugehörige Pod ist nicht Ready mit dem freigegebenen wirksamen Wert. Erhalten Sie Image, Programm, Sicherheit und Secret-Verweis; API-, Start- und Zeitfehler teilen diesen Fallback. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-pod-retained-workload-contract)
