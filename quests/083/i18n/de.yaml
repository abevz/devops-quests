title: Vault bis pod Geheimnis
brief: 'Konstruieren Sie die Übertragung der bestehenden Vault-Publikation an den ursprünglichen Kubernetes-Workload
  und die Workstation-Anwendung. Bewahren Sie Deployment-Identität, Selektor, Replikazahl, Pod-Programm, Image,
  Sicherheitseinstellungen und Secret-Referenz. Alle aktiven zugehörigen Pods müssen Ready sein und den freigegebenen
  Wert verwenden. Bewahren Sie Reader-Ablehnungen für andere Daten und Audit gemäß consumer/README.md. Der Synchronisationsentwurf
  enthält keine fertige Übertragung.


  Arbeiten Sie in `~/quest`. Das Verbraucherverzeichnis enthält Konfiguration, PID und Anwendungsprotokoll. `consumer/README.md`
  beschreibt die Schnittstelle; `consumer-contract.json` dokumentiert ursprüngliche Prozesse, freigegebene Quelle,
  Publikationshash und Version. Bewahren Sie Programm, Prozessidentität und Rechte. Jeder Verbraucher muss die freigegebene
  Publikation über seinen vorhandenen HTTP-Endpunkt mit der ursprünglichen Quelle und privaten Reader-Identität
  liefern. Ein manueller Quellenabruf reicht nicht. Zugangsdaten müssen reguläre Dateien des Workstation-Benutzers
  mit Modus `0600` bleiben. Keine Geheimnisse oder Zugangsdaten ausgeben.


  **Anforderungen:**


  - Die ursprüngliche Anwendung übernimmt die freigegebene Publikation mit privater Reader-Identität; Vault-Zugriff,
  Kubernetes-Daten und laufende Verbraucher stimmen ohne zusätzliche Rechte überein.

  - Der ursprüngliche Workload schließt den Rollout mit erhaltenem Programm und Identität ab; alle aktiven zugehörigen
  Pods verwenden die freigegebene Konfiguration.'
stages.0.brief: Konstruieren Sie die Übertragung der bestehenden Vault-Publikation an den ursprünglichen Kubernetes-Workload
  und die Workstation-Anwendung. Bewahren Sie Deployment-Identität, Selektor, Replikazahl, Pod-Programm, Image,
  Sicherheitseinstellungen und Secret-Referenz. Alle aktiven zugehörigen Pods müssen Ready sein und den freigegebenen
  Wert verwenden. Bewahren Sie Reader-Ablehnungen für andere Daten und Audit gemäß consumer/README.md. Der Synchronisationsentwurf
  enthält keine fertige Übertragung.
hints.0.text: Serververfügbarkeit, Berechtigung und übernommene Verbraucherpublikation sind getrennte Beobachtungen.
hints.1.text: 'Vergleichen Sie Live-Antwort, Quellenprofile, Anwendungsprotokolle und ursprünglichen Vertrag. Verfolgen
  Sie zuerst die fehlerhafte Grenze.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```'
hints.2.text: "Konstruieren Sie privaten Quellenabruf und Kubernetes-Secret-Übertragung. Deployment und Secret-Referenz\
  \ bewahren, alle Umgebungsverbraucher aktualisieren und Reader-Zugangsdaten im Workstation-Profil übernehmen.\
  \ API-Pfad und Publikation stehen im ursprünglichen Vertrag. Implementieren Sie zuerst den Synchronisationsentwurf.\n\
  \nProfil auf freigegebene API-Quelle und Reader-Zugangsdaten einstellen. Private Datei bewahren und SIGHUP an\
  \ die bestehende PID senden; Manager ist eine andere Identität. HTTP-Publikation prüfen. Erwartet: OK.\n\n```bash\n\
  set -euo pipefail\ncd ~/quest\ncurl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json\npython3\
  \ -I - <<'VERIFY_PUBLICATION'\nimport json\nfrom pathlib import Path\ncontract=json.loads(Path('consumer-contract.json').read_text())\n\
  observed=json.loads(Path('observed-publication.json').read_text())\nassert observed['ready'] is True\nassert observed['source']==contract['vault_url']\n\
  assert observed['path']==contract['path']\nassert observed['value_sha256']==contract['value_sha256']\nassert observed['version']==contract['version']\n\
  print('OK')\nVERIFY_PUBLICATION\n```\n\n\n```bash\nset -euo pipefail\ncd ~/quest\nkubectl rollout status deployment/relay\
  \ --timeout=30s\npython3 -I - <<'VERIFY_OWNED_PODS'\nimport hashlib,json,subprocess\nfrom pathlib import Path\n\
  def k(*args):\n return subprocess.check_output(['kubectl',*args],timeout=3)\nold=json.loads(Path('original-relay.json').read_text())\n\
  current=json.loads(k('get','deployment','relay','-o','json'))\nassert current['metadata']['uid']==old['metadata']['uid']\n\
  assert current['spec']['template']['spec']==old['spec']['template']['spec']\nsets=json.loads(k('get','replicasets','-o','json'))['items']\n\
  owners={x['metadata']['uid'] for x in sets if any(o.get('controller') is True and o['uid']==old['metadata']['uid']\
  \ for o in x['metadata'].get('ownerReferences',[]))}\npods=json.loads(k('get','pods','-o','json'))['items']\n\
  active=[p for p in pods if not p['metadata'].get('deletionTimestamp') and p['status'].get('phase') not in ('Succeeded','Failed')\
  \ and any(o.get('controller') is True and o['uid'] in owners for o in p['metadata'].get('ownerReferences',[]))]\n\
  assert len(active)==1\ncontract=json.loads(Path('consumer-contract.json').read_text())\nfor p in active:\n assert\
  \ any(c['type']=='Ready' and c['status']=='True' for c in p['status'].get('conditions',[]))\n assert p['spec']['containers'][0]['image']==old['spec']['template']['spec']['containers'][0]['image']\n\
  \ value=k('exec',p['metadata']['name'],'-c','worker','--','printenv','ROUTE_SECRET').rstrip(b'\\n')\n assert hashlib.sha256(value).hexdigest()==contract['value_sha256']\n\
  print('OK')\nVERIFY_OWNED_PODS\n```\n\nErwartet: abgeschlossener Rollout und OK.\n\n\n```bash\nset -euo pipefail\n\
  source platform.env\ncurl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") -H 'Content-Type:\
  \ application/json' -X POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/other\",\"sys/audit\"]}'\
  \ \"$VAULT_ADDR/v1/sys/capabilities-self\" | jq -e '.\"secret/data/dispatch\"==[\"read\"] and .\"secret/data/other\"\
  ==[\"deny\"] and .\"sys/audit\"==[\"deny\"]'\n```\n\nErwartet: true; kein Geheimnis wird ausgegeben."
debrief: Quellen- und Verbraucheridentitäten blieben erhalten; laufende Anwendungen übernahmen die freigegebene
  Publikation.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
