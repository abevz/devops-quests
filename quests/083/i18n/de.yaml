stages.0.objectives.0.text: Die ursprüngliche Anwendung übernimmt die freigegebene Publikation mit privater Reader-Identität;
  Vault-Zugriff, Kubernetes-Daten und laufende Verbraucher stimmen ohne zusätzliche Rechte überein.
