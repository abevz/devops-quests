title: Vault to pod secret
brief: 'Work in `~/quest` with `platform.env`, `reader.hcl`, `sync-secret.sh` and `deployment.json`. The disposable game Vault
  is already initialized and unsealed. Its `rail-reader` policy points to the wrong KV-v2 path. The manager token can update
  that policy; the reader token must be allowed to read `secret/data/dispatch`. Never print tokens or secret responses. The
  linked Vault guide explains policy paths and safe KV-v2 reads.


  Repair `rail-reader`, run the supplied on-demand `sync-secret.sh`, and wait for `deployment/relay` to roll out. Verify that
  the reader receives `north-secret` as `.data.data.value`, Kubernetes Secret `route-secret` has a `value` key decoding to
  `north-secret`, and the `relay` process has `ROUTE_SECRET=north-secret`. The rollout must succeed. The check observes these
  results; it does not prove which policy edits or synchronization steps produced them. Work only in the offline bay.'
stages.0.brief: The reader value, Secret key, relay environment and rollout match the brief.
stages.0.objectives.0.text: The reader value, Secret key, relay environment and rollout match the brief.
