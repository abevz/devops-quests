hints.1.text: KV-v2 reads require the secret/data/dispatch policy path.
hints.2.text: Repair rail-reader through the manager token, run sync-secret.sh, then inspect the Secret and pod environment.
debrief: The reader value, Secret key, relay environment and rollout matched the checks.
