title: Vault to pod secret
brief: 'You joined SignalRail operations. A policy denied the secret sync job and the reader stayed blocked.
  Work in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `deployment.json`, `platform.env`, `sync-secret.sh`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: A real Vault read delivers route-secret to the running reader.'
stages.0.brief: 'Vault was initialized and unsealed. Its reader policy points to the wrong KV-v2 path.
  Repair only rail-reader using the manager token, then run bash sync-secret.sh. The script is an on-demand
  synchronizer.


  Success criteria: A real Vault read delivers route-secret to the running reader.'
stages.0.objectives.0.text: A real Vault read delivers route-secret to the running reader.
hints.0.text: Inspect the Vault HTTP status without printing tokens.
hints.1.text: KV-v2 reads require the secret/data/dispatch policy path.
hints.2.text: Repair rail-reader through the manager token, run sync-secret.sh, then inspect the Secret
  and pod environment.
debrief: The KV-v2 ACL pointed to the wrong path. You repaired rail-reader, ran the explicit sync script
  and verified Vault read, Kubernetes Secret and pod environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 read path
