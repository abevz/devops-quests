title: Vault to pod secret
brief: 'Construct delivery from the existing Vault publication to the original Kubernetes workload and the workstation
  application. Preserve the Deployment identity, selector, replica count, pod program, image, security settings
  and secret reference. Every active owned pod must be Ready and use the approved value; preserve the reader’s denial
  on the other-data and audit paths documented in consumer/README.md. The synchronization workspace contains no
  completed delivery implementation.


  Work in `~/quest`. The supplied consumer directory contains its configuration, process receipt and application
  log. `consumer/README.md` describes the application interface; `consumer-contract.json` records the original processes,
  approved source identity, publication digest and version. Preserve the original application programs, process
  identities and privileges. Each consumer must serve the approved publication through its existing HTTP endpoint
  using the original source and private supplied reader identity; a successful manual source request is insufficient.
  Keep credential files regular, owned by the workstation user, with mode `0600`. Do not print credentials or secret
  values.


  **Requirements:**


  - The original application adopts the approved source publication with the private supplied reader identity; Vault
  access, delivered Kubernetes data and running consumers agree without broadening authorization.

  - The original workload completes rollout with its program and identity preserved, and every active owned pod
  serves the approved configuration.'
stages.0.brief: Construct delivery from the existing Vault publication to the original Kubernetes workload and the
  workstation application. Preserve the Deployment identity, selector, replica count, pod program, image, security
