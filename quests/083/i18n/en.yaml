guides.reference_1: Inspect the relevant Vault API
guides.reference_2: Publication and consumer verification reference
diagnostics.reader: The supplied reader policy initially points at the wrong data path, or the authenticated read may fail; allow read on the documented KV-v2 data path while retaining denial on the other-data and audit paths. [Cause and check](guides#guide=vault-recovery&section=vault-pod-narrow-source-read)
diagnostics.secret: The synchronization workspace has no implementation, so the Kubernetes Secret may be absent or stale; construct the explicit source read and apply the approved value to the existing secret reference. Source or Kubernetes read errors can also report this marker. [Cause and check](guides#guide=vault-recovery&section=vault-pod-explicit-delivery)
diagnostics.env: Updating Secret data does not update an existing process environment; the named container may retain the old value or fail to start. Recreate Pods through the original controller while retaining its supplied secret reference and program. [Cause and check](guides#guide=vault-recovery&section=vault-pod-effective-secret)
diagnostics.probe_0_0: The original application may still use the supplied manager credential or an old cache, or its process identity, source configuration or narrow capability boundary may have changed. Keep the private supplied reader identity, refresh the same process with SIGHUP and verify approved metadata; startup, parsing and observation timeouts also reach this aggregate fallback. [Cause and check](guides#guide=vault-recovery&section=vault-pod-original-application-agreement)
diagnostics.rollout: The original workload may be blocked because the referenced Secret has not been delivered, or another startup error prevents rollout; inspect events after synchronizing the source instead of replacing the Deployment. [Cause and check](guides#guide=vault-recovery&section=vault-pod-secret-blocked-rollout)
diagnostics.probe_0_1: The Deployment identity, selector, single replica or full pod specification may have changed, or its one current owned Pod is not Ready with the approved effective value. Retain the supplied image, program, security and secret reference; API, startup and timeout failures share this fallback. [Cause and check](guides#guide=vault-recovery&section=vault-pod-retained-workload-contract)
