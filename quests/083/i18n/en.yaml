title: Vault to pod secret
brief: |-
  The relay cannot consume its Vault-backed value. Restore the expected value along the delivery chain.

  Work on the workstation in `~/quest` with `platform.env`, `reader.hcl`, `sync-secret.sh`, `deployment.yaml`.

  Unless stated otherwise, Kubernetes resources live in the bay namespace (`DQ_NAMESPACE`); `~/quest` paths are on the workstation.

  **Requirements:**

  - The supplied Vault identity, the delivered Kubernetes configuration and the running `relay` process all provide the dispatch value `north-secret`.
  - Deployment `relay` completes its rollout in the bay namespace.

  The check observes these results; it does not prove which policy edits or synchronization steps produced them.
stages.0.brief: All delivery observations must agree on the same value.
hints.0.text: Authorization, delivered configuration and the running process are separate links in a delivery
  chain.
hints.1.text: |-
  Follow the supplied synchronization helper and the workload’s configuration references.

  ```bash
  cat sync-secret.sh
  kubectl describe deployment relay
  ```
hints.2.text: |-
  Repair rail-reader through the manager token, run sync-secret.sh, then inspect the Secret and pod environment. KV-v2 reads require the secret/data/dispatch policy path.

  Verify from `~/quest` on the workstation:

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`

  Exit `0`; no credential or secret value is printed.

  - `kubectl get secret route-secret -o json | jq -e '.data.value | @base64d == "north-secret"' >/dev/null`

  Exit `0`; no credential or secret value is printed.

  - `kubectl exec deployment/relay -- sh -c 'test "$ROUTE_SECRET" = north-secret'`
  - `kubectl rollout status deployment/relay --timeout=3s`

  Exit `0`; no credential or secret value is printed. The rollout completes.
debrief: The reader value, Secret key, relay environment and rollout matched the checks.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
hints.0.label: Vault docs · ACL policies
hints.1.label: Vault docs · KV-v2 read path
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
diagnostics.secret: The decoded route-secret value must equal north-secret.
diagnostics.env: The relay container ROUTE_SECRET must equal north-secret.
diagnostics.rollout: The relay Deployment rollout must complete.
