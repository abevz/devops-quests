title: Helm Freigabediagnose
brief: 'Das installierte Helm-Release liefert nicht die vorgesehene HTTP-Antwort. Stellen Sie das bestehende
  Release und seinen Workload wieder her.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `chart/Chart.yaml`, `chart/templates/deploy.yaml`,
  `chart/values.yaml`.


  **Anforderungen:**

  - Helm-Release `board` hat den Status `deployed`.

  - Die Konfiguration des bestehenden Releases stimmt mit dem erforderlichen HTTP-Endpunkt überein.

  - Deployment `relay` schließt seinen Rollout ab.

  - HTTP von Deployment `relay` an `http://127.0.0.1:8080` liefert `signalrail`.


  Der Helm-Status `deployed` allein belegt nicht, dass der vorgesehene HTTP-Endpunkt funktioniert.

  '
stages.0.brief: Das bestehende Helm-Release muss die geforderte HTTP-Antwort liefern.
stages.0.objectives.0.text: Helm-Release `board` hat den Status `deployed`.
stages.0.objectives.1.text: Die Konfiguration des bestehenden Releases stimmt mit dem erforderlichen HTTP-Endpunkt
  überein.
stages.0.objectives.2.text: Deployment `relay` schließt seinen Rollout ab.
stages.0.objectives.3.text: HTTP von Deployment `relay` an `http://127.0.0.1:8080` liefert `signalrail`.
hints.0.text: Ein installiertes Release und eine gesunde Anwendung sind unterschiedliche Beobachtungen.
hints.1.text: 'Verwenden Sie helm status und prüfen Sie den gerenderten worker-Befehl.


  Der lokale Chart-Wert erzeugte einen ungültigen httpd-Port und wählte den falschen Containerbefehl. Das installierte
  Release verwendet port=bad-port.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  helm status board

  helm get values board --all

  helm get manifest board

  kubectl describe deployment relay

  ```'
hints.2.text: 'Aktualisieren Sie das bestehende Release board mit port=8080 und warten Sie, bis der Rollout
  abgeschlossen ist.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  helm list --filter ''^board$''

  kubectl rollout status deployment/relay --timeout=3s

  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080

  ```


  Erwartet werden deployed, ein abgeschlossener Rollout und die HTTP-Antwort signalrail.'
debrief: Ein chart-Wert hat einen ungültigen HTTP-Befehl generiert. Sie haben den Wert über Helm korrigiert
  und die deployed-Version und den einwandfreien Zustand von workload überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
