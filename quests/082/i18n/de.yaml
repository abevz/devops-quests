title: Helm Freigabediagnose
brief: |
  Das installierte Helm-Release liefert nicht die vorgesehene HTTP-Antwort. Stellen Sie das bestehende Release und seinen Workload wieder her.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.

  **Anforderungen:**
  - Deployment `relay` schließt seinen Rollout ab.
  - Die Korrektur erfolgt über die Werte des Helm-Releases `board`, nicht durch Bearbeiten des Deployments.
  - Im Container `worker` von Deployment `relay` liefert HTTP an `http://127.0.0.1:8080` den Wert `signalrail`.
  - Das Helm-Release `board` hat den Status `deployed`.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Im Anwendungscontainer lautet die HTTP-Antwort `signalrail`.
  - Release `board` ist `deployed`; seine Werte beschreiben den gesunden Workload statt einer unabhängigen Änderung am laufenden Deployment.

    ```sh
    helm list --filter '^board$'
    helm get values board --all
    ```
  - `kubectl rollout status deployment/relay --timeout=3s` — Der Workload-Rollout ist abgeschlossen.

  Der Helm-Status `deployed` allein belegt nicht, dass der vorgesehene HTTP-Endpunkt funktioniert.
stages.0.brief: |
  Das bestehende Helm-Release muss die geforderte HTTP-Antwort liefern.
stages.0.objectives.0.text: Helm-Release `board` hat den Status `deployed`.
stages.0.objectives.1.text: Die Korrektur erfolgt über die Werte des Helm-Releases `board`, nicht durch
  Bearbeiten des Deployments.
stages.0.objectives.2.text: Deployment `relay` schließt seinen Rollout ab.
stages.0.objectives.3.text: HTTP von Deployment `relay` an `http://127.0.0.1:8080` liefert `signalrail`.
hints.0.text: Verwenden Sie helm status und inspect den gerenderten worker-Befehl.
hints.1.text: |
  Der lokale Chart-Wert erzeugte einen ungültigen httpd-Port und wählte den falschen Containerbefehl. Das installierte Release verwendet port=bad-port.
hints.2.text: Aktualisieren Sie die vorhandene Version board mit port=8080 und warten Sie auf die Version
  rollout.
debrief: Ein chart-Wert hat einen ungültigen HTTP-Befehl generiert. Sie haben den Wert über Helm korrigiert
  und die deployed-Version und den einwandfreien Zustand von workload überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
