title: Helm Freigabediagnose
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Ein Diagrammwert hat den falschen Containerbefehl
  ausgewählt. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingänge in `~/quest`: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Helm board ist deployed mit port=8080 und ein bereiter relay antwortet tatsächlich
  signalrail auf HTTP 8080.'
stages.0.brief: 'Die installierte Version verwendet port=bad-port. Helm. Der deployed-Status allein beweist
  nicht, dass der vorgesehene HTTP endpoint funktioniert. Reparieren Sie die vorhandene Version über Helm
  und überprüfen Sie die tatsächliche Reaktion.


  Erfolgskriterien: Helm board ist deployed mit port=8080 und ein bereiter relay antwortet tatsächlich
  signalrail auf HTTP 8080.'
stages.0.objectives.0.text: Helm board ist deployed mit port=8080 und ein bereiter relay antwortet tatsächlich
  signalrail auf HTTP 8080.
hints.0.text: Verwenden Sie helm status und inspect den gerenderten worker-Befehl.
hints.1.text: Der lokale Wert chart hat einen ungültigen httpd-Port generiert.
hints.2.text: Aktualisieren Sie die vorhandene Version board mit port=8080 und warten Sie auf die Version
  rollout.
debrief: Ein chart-Wert hat einen ungültigen HTTP-Befehl generiert. Sie haben den Wert über Helm korrigiert
  und die deployed-Version und den einwandfreien Zustand von workload überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
