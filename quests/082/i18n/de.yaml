title: Helm Freigabediagnose
brief: |-
  Die bestehende Veröffentlichung erreicht ihre Verbraucher nicht korrekt. Stelle die erhaltenen Helm-Releases so wieder her, dass Produzent und beide Verbraucher dieselbe aktuelle Quellveröffentlichung verwenden.

  Arbeite auf der Workstation in `~/quest` mit `release-contract.json` und den Arbeitscharts in `chart/`, `dispatcher/` und `archive/`.

  **Anforderungen:**
  - Alle vorgegebenen Helm-Releases haben den Status `deployed`; ihre ursprünglichen Deployments schließen den Rollout ab.
  - Das Produzenten-Release entspricht der vorgegebenen Veröffentlichungsschnittstelle und der aktuellen Veröffentlichungsidentität. Jedes Verbraucher-Release und seine laufenden Anwendungseingaben entsprechen der aktuellen Service-Schnittstelle des Produzenten und der Veröffentlichungsidentität.
  - Der ursprüngliche Produzent, die Quell-ConfigMap, die Verbraucher-Deployments und öffentlichen Services bleiben mit allen vorgegebenen Quelldaten und unveränderlichen Anwendungsimages erhalten.
  - Die Produzentenanwendung liefert weiterhin `signalrail` unter `http://127.0.0.1:8080`. Über jeden im Vertrag genannten öffentlichen Service liefern Produzent und beide Verbraucher den Metadatensatz der aktuellen Quellveröffentlichung.

  Prüfungen beobachten aktuelle Release-Values, Anwendungseingaben, erhaltene Identitäten und HTTP-Datensätze. Sie beweisen weder Befehlsverlauf noch unterbrechungsfreie Verfügbarkeit oder beliebige zukünftige Chart-Eingaben.
stages.0.brief: Stelle Übereinstimmung zwischen dem erhaltenen Produzenten-Release und beiden Verbraucher-Snapshots
  her.
stages.0.objectives.0.text: Alle vorgegebenen Helm-Releases bleiben deployed.
stages.0.objectives.1.text: Aktuelle Helm-Values und laufende Verbrauchereingaben entsprechen der vorgegebenen Produzentenschnittstelle
  und Veröffentlichung.
stages.0.objectives.2.text: Produzent und beide Verbraucher schließen ihren Rollout ab.
stages.0.objectives.3.text: Quelldaten, Ressourcen und Images bleiben erhalten; tatsächliche HTTP-Datensätze von
  Produzent und Verbrauchern entsprechen der aktuellen Veröffentlichung.
hints.0.text: Ein deployed Release, ein bereiter Prozess und ein aktueller Anwendungssnapshot sind verschiedene
  Beobachtungen. Gespeicherte Eingabeschichten und lokaler Prozesszustand können einen Produzentenwechsel überleben.
hints.1.text: Vergleiche `release-contract.json`, Arbeitschart-Eingaben, `helm get values <release> --all`, `helm
  get manifest <release>` und `helm history <release>`. Untersuche Workload-Eingaben, Pod-Ereignisse und Logs sowie
  Metadaten von Produzent und Verbrauchern.
hints.2.text: Übernimm die beabsichtigten aktuellen Values für die erhaltenen Releases und lasse jeden Verbraucher
  mit aktuellen Quelleingaben starten. Prüfe `helm get values <release> --all`, Rollout und `kubectl exec deployment/relay
  -c worker -- wget -qO- -T 3 http://<service>:8080/release.json` für jeden genannten Service. Erwartet werden ursprüngliche
  Ressourcen und Images, die Produzentenantwort `signalrail` und identische Metadaten entsprechend der aktuellen
  Quell-ConfigMap.
debrief: Ein gesundes Produzenten-Release aktualisierte seine Verbraucher nicht automatisch. Der Vergleich gespeicherter
  Values, wirksamer Anwendungseingaben und echter Snapshots zeigte die Weitergabegrenze; die erhaltenen Releases
  verwenden nun eine aktuelle Veröffentlichung.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.release_status: Ein bestehendes Helm-Release fehlt möglicherweise, hat einen anderen Status als deployed oder der Statusabruf scheitert; prüfen Sie alle drei. deployed allein belegt weder Prozessbereitschaft noch eine aktuelle gecachte Veröffentlichung. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-deployed-status)
diagnostics.release_values: Gespeicherte Values behalten möglicherweise bad-port, Port 9090 oder die vorige Veröffentlichung, während Prozesse nach geänderten Chart-Defaults alte Eingaben nutzen. Verwenden Sie Port 8080 und die gelieferte aktuelle Veröffentlichung; vergleichen Sie wirksames UPSTREAM und EXPECTED_PUBLICATION, auch aus ConfigMap-/Secret-Verweisen. Befehls-/API-Fehler nutzen ebenfalls diesen Marker. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-stored-and-effective-inputs)
diagnostics.release_rollout: Die Quelle startet möglicherweise nicht mit bad-port oder ein gecachter Verbraucher lehnt altes Upstream beziehungsweise expected publication ab; prüfen Sie Rollout und Ereignisse aller drei Deployments nach dem Upgrade der bestehenden Releases. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-process-readiness)
diagnostics.release_identity: Deinstallation, Löschen oder Neuerstellen einer gelieferten Ressource kann ihre UID ändern; erhalten Sie beim Upgrade alle sieben aufgezeichneten Identitäten von Deployment, Service und Quell-ConfigMap. Ein gescheiterter Ressourcenabruf meldet denselben Marker; gewöhnlich ersetzte Pods sind keine eingefrorenen Ressourcenidentitäten. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-original-resource-uids)
diagnostics.release_source: Bei der Reparatur hat die Quell-ConfigMap möglicherweise einen gelieferten aktuellen Eintrag verloren oder verändert; vergleichen Sie jeden eingefrorenen data-Wert Byte für Byte, einschließlich JSON-Strings. Zusätzliche data-Schlüssel sind erlaubt. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-retained-source-data)
diagnostics.release_images: Ein gespeicherter Image-Wert oder das Live-Deployment-Image wurde möglicherweise bei der Values-Reparatur verändert; erhalten Sie das gelieferte Image in allen drei Releases und Workloads. Akzeptiert werden die exakte Referenz oder eine andere mit demselben sha256 Digest. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-immutable-image)
diagnostics.release_publication: Ein gesunder Verbraucher liefert möglicherweise noch seinen Start-Snapshot der vorigen Veröffentlichung oder eine Anfrage scheitert; aktualisieren/starten Sie mit aktuellen Eingaben und vergleichen Sie tatsächliches /release.json von Quelle und beiden Verbrauchern mit dem eingefrorenen aktuellen Datensatz. Die Quellseite muss außerdem signalrail liefern. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-actual-cached-metadata)
diagnostics.probe_0_0: Die Statusbeobachtung endet möglicherweise vor einem benannten Helm-Ergebnis; prüfen Sie Befehl und Clusterzugang. Ein Status ungleich deployed oder gewöhnlicher Statusbefehlsfehler nutzt bereits release_status. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-status-startup)
diagnostics.probe_0_1: Eingefrorene Fakten oder zurückgegebenes JSON sind möglicherweise unlesbar oder helpers laden vor einem Detailmarker nicht; prüfen Sie JSON-Ausgabe und Helper-Verfügbarkeit. Benannte Values-/Image-Fehler behalten eigene Diagnosen. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-values-json-startup)
diagnostics.probe_0_2: Die Rollout-Beobachtung endet möglicherweise vor einem benannten Ergebnis wegen nicht verfügbarer Befehlsvorbereitung; prüfen Sie kubectl und Clusterzugang. Gewöhnlich gescheiterte Rollouts erhalten bereits release_rollout. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-rollout-startup)
diagnostics.probe_0_3: Veröffentlichungsfakten, Ressourcen-JSON oder HTTP-Metadaten lassen sich möglicherweise vor einem Detailmarker nicht dekodieren oder helpers laden nicht; prüfen Sie tatsächliches JSON und Helper-Verfügbarkeit. Benannte Source-, Identity-, Image- und Publication-Fehler behalten eigene Marker. [Ursache und Prüfung](guides#guide=helm-8&section=retained-helm-publication-json-startup)
