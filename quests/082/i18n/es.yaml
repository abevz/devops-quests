title: Diagnóstico de liberación Helm
brief: 'La versión Helm instalada no entrega la respuesta HTTP prevista. Recupera la versión existente y su
  carga.


  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `chart/Chart.yaml`, `chart/templates/deploy.yaml`,
  `chart/values.yaml`.


  **Requisitos:**

  - El release Helm `board` tiene el estado `deployed`.

  - La configuración de la versión existente concuerda con el endpoint HTTP requerido.

  - El Deployment `relay` completa su rollout.

  - HTTP desde Deployment `relay` a `http://127.0.0.1:8080` devuelve `signalrail`.


  El estado Helm `deployed` por sí solo no demuestra que funcione el endpoint HTTP previsto.

  '
stages.0.brief: La versión Helm existente debe proporcionar la respuesta HTTP requerida.
stages.0.objectives.0.text: El release Helm `board` tiene el estado `deployed`.
stages.0.objectives.1.text: La configuración de la versión existente concuerda con el endpoint HTTP requerido.
stages.0.objectives.2.text: El Deployment `relay` completa su rollout.
stages.0.objectives.3.text: HTTP desde Deployment `relay` a `http://127.0.0.1:8080` devuelve `signalrail`.
hints.0.text: Una versión instalada y una aplicación sana son observaciones distintas.
hints.1.text: 'Utilice helm status e inspeccione el comando worker renderizado.


  El valor del chart local generó un puerto httpd inválido y seleccionó el comando de contenedor incorrecto.
  La versión instalada usa port=bad-port.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  helm status board

  helm get values board --all

  helm get manifest board

  kubectl describe deployment relay

  ```'
hints.2.text: 'Actualice la versión board existente con port=8080 y espere su rollout.


  Verifica el resultado observado:


  ```sh

  helm list --filter ''^board$''

  kubectl rollout status deployment/relay --timeout=3s

  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080

  ```


  Se esperan deployed, un rollout completo y la respuesta HTTP signalrail.'
debrief: Un valor chart generó un comando HTTP no válido. Corregió el valor a través de Helm y verificó su
  versión deployed y su workload en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
