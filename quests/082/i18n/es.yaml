title: Diagnóstico de liberación Helm
brief: |-
  La publicación existente no llega correctamente a sus consumidores. Recupera los releases Helm conservados para que el productor y ambos consumidores utilicen la publicación actual de la fuente.

  Trabaja en la estación en `~/quest` con `release-contract.json` y los charts de trabajo en `chart/`, `dispatcher/` y `archive/`.

  **Requisitos:**
  - Todos los releases Helm suministrados tienen estado `deployed`; sus Deployments originales completan el rollout.
  - El release productor coincide con la interfaz suministrada y la identidad de la publicación actual. Cada release consumidor y las entradas de su aplicación activa corresponden a la interfaz actual del Service productor y a la identidad de publicación.
  - Se conservan el productor original, el ConfigMap fuente, los Deployments consumidores y los Services públicos, todos los datos originales y cada imagen de aplicación inmutable suministrada.
  - La aplicación productora sigue devolviendo `signalrail` en `http://127.0.0.1:8080`. Mediante cada Service público declarado, el productor y ambos consumidores devuelven los metadatos de la publicación actual de la fuente.

  Las comprobaciones observan values actuales, entradas de aplicaciones, identidades conservadas y registros HTTP. No demuestran historial de comandos, disponibilidad ininterrumpida ni cualquier futura entrada del chart.
stages.0.brief: Restablece la coherencia entre el release productor conservado y las instantáneas de ambos consumidores.
stages.0.objectives.0.text: Todos los releases Helm suministrados permanecen deployed.
stages.0.objectives.1.text: Los values Helm actuales y las entradas de los consumidores activos coinciden con la
  interfaz y publicación suministradas del productor.
stages.0.objectives.2.text: El productor y ambos consumidores completan el rollout.
stages.0.objectives.3.text: Se conservan los datos, recursos e imágenes; los registros HTTP reales del productor
  y los consumidores corresponden a la publicación actual.
hints.0.text: Un release deployed, un proceso listo y una instantánea actual son observaciones distintas. Las capas
  de entrada guardadas y el estado local del proceso pueden sobrevivir a una transición del productor.
hints.1.text: |-
  Compara `release-contract.json`, las entradas de los charts, `helm get values <release> --all`, `helm get manifest <release>` y `helm history <release>`. Inspecciona entradas de cada workload, eventos y logs de Pod y metadatos del productor y los consumidores.

  Revisa las sobrescrituras guardadas de cada versión y las entradas que usa el consumidor renderizado. Compara las referencias al origen con los metadatos del productor activo.
hints.2.text: |-
  Comprueba los valores efectivos de Helm y el registro servido por cada Service. Confirma que terminan los despliegues de relay, dispatcher y archive.

  ```sh
  for name in relay dispatcher archive; do
    kubectl rollout status "deployment/$name" --timeout=10s
  done
  for name in board dispatcher archive; do
    helm get values "$name" --all
    kubectl exec deployment/relay -c worker -- wget -qO- -T 3 "http://$name:8080/release.json"
    printf '\n'
  done
  ```

  Espera recursos e imágenes originales, respuesta productora `signalrail` y metadatos idénticos a los del ConfigMap fuente actual.
debrief: Un release productor sano no actualizó automáticamente a sus consumidores. Comparar values guardados, entradas
  efectivas e instantáneas reales reveló el límite de propagación; los releases conservados comparten ahora una
  publicación actual.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.release_status: Puede faltar publicación Helm conservada, tener estado distinto de deployed o fallar lectura; inspeccione las tres. deployed por sí solo no prueba disponibilidad del proceso ni publicación actual en caché. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-deployed-status)
diagnostics.release_values: Values guardados pueden conservar bad-port, puerto 9090 o publicación anterior, y procesos entradas antiguas tras cambiar defaults del chart. Use puerto 8080 y publicación actual; compare UPSTREAM y EXPECTED_PUBLICATION efectivos, incluidas referencias ConfigMap/Secret. Errores comandos/API también dan marcador. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-stored-and-effective-inputs)
diagnostics.release_rollout: El productor puede no iniciar con bad-port o consumidor con caché rechazar upstream o expected publication antiguos; inspeccione rollout y eventos de tres Deployment tras actualizar publicaciones conservadas. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-process-readiness)
diagnostics.release_identity: Desinstalar, borrar o recrear recurso puede cambiar UID; conserve siete identidades registradas de Deployment, Service y ConfigMap fuente durante upgrades. Error de lectura también da marcador; Pod reemplazados normalmente no son recursos de identidad congelada. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-original-resource-uids)
diagnostics.release_source: Al reparar publicación, ConfigMap fuente puede perder o cambiar entrada actual; compare cada valor data congelado byte a byte, incluidas cadenas JSON. Se permiten claves data adicionales. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-retained-source-data)
diagnostics.release_images: Image value guardado o image vivo Deployment puede cambiar al reparar values; conserve image suministrado en tres publicaciones y workload. Se acepta referencia exacta u otra con mismo sha256 digest. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-immutable-image)
diagnostics.release_publication: Consumidor saludable puede servir snapshot inicial de publicación anterior o fallar solicitud; actualice/reinicie con entradas actuales y compare /release.json reales del productor y ambos consumidores con registro actual congelado. La página del productor debe devolver signalrail. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-actual-cached-metadata)
diagnostics.probe_0_0: La observación puede detenerse antes del resultado nombrado Helm; compruebe comando y acceso al clúster. Estado distinto de deployed o fallo ordinario status ya usa release_status. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-status-startup)
diagnostics.probe_0_1: Hechos congelados o JSON devuelto pueden ser ilegibles, o helpers fallar antes del marcador; inspeccione JSON y disponibilidad de helpers. Fallos nombrados values/image conservan diagnósticos propios. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-values-json-startup)
diagnostics.probe_0_2: La observación rollout puede detenerse antes de resultado nombrado por preparación de comandos indisponible; compruebe kubectl y clúster. Fallos ordinarios rollout ya reciben release_rollout. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-rollout-startup)
diagnostics.probe_0_3: Hechos de publicación, JSON de recurso o metadata HTTP pueden no decodificarse antes del marcador, o no cargar helpers; inspeccione JSON real y helpers. Fallos nombrados source, identity, image y publication conservan marcadores específicos. [Causa y comprobación](guides#guide=helm-8&section=retained-helm-publication-json-startup)
