title: Diagnóstico de liberación Helm
brief: 'Te uniste a las operaciones de SignalRail. Un valor de gráfico seleccionó el comando de contenedor
  incorrecto. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.'
stages.0.brief: La versión instalada utiliza port=bad-port. Helm El estado de deployed por sí solo no
  prueba que el HTTP endpoint previsto funcione. Repare la versión existente a través de Helm y verifique
  la respuesta real.
stages.0.objectives.0.text: 'Helm release `board`: `info.status` = `deployed`.'
stages.0.objectives.1.text: 'Helm release `board`: `port` = `8080`.'
stages.0.objectives.2.text: El Deployment `relay` completa su rollout.
stages.0.objectives.3.text: HTTP desde Deployment `relay` a `http://127.0.0.1:8080` devuelve `signalrail`.
hints.0.text: Utilice helm status y inspect el comando worker renderizado.
hints.1.text: El valor local chart generó un puerto httpd no válido.
hints.2.text: Actualice la versión board existente con port=8080 y espere su rollout.
debrief: Un valor chart generó un comando HTTP no válido. Corregió el valor a través de Helm y verificó
  su versión deployed y su workload en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
