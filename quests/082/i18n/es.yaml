title: Diagnóstico de liberación Helm
brief: |-
  La publicación existente no llega correctamente a sus consumidores. Recupera los releases Helm conservados para que el productor y ambos consumidores utilicen la publicación actual de la fuente.

  Trabaja en la estación en `~/quest` con `release-contract.json` y los charts de trabajo en `chart/`, `dispatcher/` y `archive/`.

  **Requisitos:**
  - Todos los releases Helm suministrados tienen estado `deployed`; sus Deployments originales completan el rollout.
  - El release productor coincide con la interfaz suministrada y la identidad de la publicación actual. Cada release consumidor y las entradas de su aplicación activa corresponden a la interfaz actual del Service productor y a la identidad de publicación.
  - Se conservan el productor original, el ConfigMap fuente, los Deployments consumidores y los Services públicos, todos los datos originales y cada imagen de aplicación inmutable suministrada.
  - La aplicación productora sigue devolviendo `signalrail` en `http://127.0.0.1:8080`. Mediante cada Service público declarado, el productor y ambos consumidores devuelven los metadatos de la publicación actual de la fuente.

  Las comprobaciones observan values actuales, entradas de aplicaciones, identidades conservadas y registros HTTP. No demuestran historial de comandos, disponibilidad ininterrumpida ni cualquier futura entrada del chart.
stages.0.brief: Restablece la coherencia entre el release productor conservado y las instantáneas de ambos consumidores.
stages.0.objectives.0.text: Todos los releases Helm suministrados permanecen deployed.
stages.0.objectives.1.text: Los values Helm actuales y las entradas de los consumidores activos coinciden con la
  interfaz y publicación suministradas del productor.
stages.0.objectives.2.text: El productor y ambos consumidores completan el rollout.
stages.0.objectives.3.text: Se conservan los datos, recursos e imágenes; los registros HTTP reales del productor
  y los consumidores corresponden a la publicación actual.
hints.0.text: Un release deployed, un proceso listo y una instantánea actual son observaciones distintas. Las capas
  de entrada guardadas y el estado local del proceso pueden sobrevivir a una transición del productor.
hints.1.text: Compara `release-contract.json`, las entradas de los charts, `helm get values <release> --all`, `helm
  get manifest <release>` y `helm history <release>`. Inspecciona entradas de cada workload, eventos y logs de Pod
  y metadatos del productor y los consumidores.
hints.2.text: Adopta los values actuales previstos para los releases conservados y permite que cada consumidor arranque
  con las entradas actuales de la fuente. Verifica `helm get values <release> --all`, rollout y `kubectl exec deployment/relay
  -c worker -- wget -qO- -T 3 http://<service>:8080/release.json` para cada Service declarado. Espera recursos e
  imágenes originales, respuesta productora `signalrail` y metadatos idénticos a los del ConfigMap fuente actual.
debrief: Un release productor sano no actualizó automáticamente a sus consumidores. Comparar values guardados, entradas
  efectivas e instantáneas reales reveló el límite de propagación; los releases conservados comparten ahora una
  publicación actual.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.probe_0_0: Todos los releases Helm suministrados permanecen deployed.
diagnostics.probe_0_1: Los values Helm actuales y las entradas de los consumidores activos coinciden con la interfaz
  y publicación suministradas del productor.
diagnostics.probe_0_2: El productor y ambos consumidores completan el rollout.
diagnostics.probe_0_3: Se conservan los datos, recursos e imágenes; los registros HTTP reales del productor y los
  consumidores corresponden a la publicación actual.
diagnostics.release_status: Cada release Helm suministrado debe permanecer deployed.
diagnostics.release_values: Los values Helm guardados o las entradas de consumidores activos aún apuntan a otra
  interfaz o publicación.
diagnostics.release_rollout: Cada Deployment original de productor y consumidores debe completar el rollout.
diagnostics.release_identity: Conserva los UID originales de los recursos de los releases.
diagnostics.release_source: Conserva cada entrada actual suministrada del ConfigMap fuente.
diagnostics.release_images: Conserva la imagen de aplicación inmutable suministrada en cada release y workload.
diagnostics.release_publication: Los metadatos públicos reales del productor y los consumidores deben coincidir
  con la publicación actual; un proceso listo puede servir una instantánea anterior.
