title: Diagnóstico de liberación Helm
brief: |
  La versión Helm instalada no entrega la respuesta HTTP prevista. Recupera la versión existente y su carga.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.

  **Requisitos:**
  - El Deployment `relay` completa su rollout.
  - La corrección se aplica mediante los valores de la versión Helm `board`, no editando el Deployment.
  - Dentro del contenedor `worker` del Deployment `relay`, HTTP a `http://127.0.0.1:8080` devuelve `signalrail`.
  - La versión Helm `board` tiene estado `deployed`.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Dentro del contenedor de la aplicación, la respuesta HTTP es `signalrail`.
  - La versión `board` está `deployed`; sus valores describen la carga sana en lugar de una edición independiente del Deployment activo.

    ```sh
    helm list --filter '^board$'
    helm get values board --all
    ```
  - `kubectl rollout status deployment/relay --timeout=3s` — El rollout de la carga está completo.

  El estado Helm `deployed` por sí solo no demuestra que funcione el endpoint HTTP previsto.
stages.0.brief: |
  La versión Helm existente debe proporcionar la respuesta HTTP requerida.
stages.0.objectives.0.text: El release Helm `board` tiene el estado `deployed`.
stages.0.objectives.1.text: La corrección se aplica mediante los valores del release Helm `board`, no
  editando el Deployment.
stages.0.objectives.2.text: El Deployment `relay` completa su rollout.
stages.0.objectives.3.text: HTTP desde Deployment `relay` a `http://127.0.0.1:8080` devuelve `signalrail`.
hints.0.text: Utilice helm status y inspect el comando worker renderizado.
hints.1.text: |
  El valor del chart local generó un puerto httpd inválido y seleccionó el comando de contenedor incorrecto. La versión instalada usa port=bad-port.
hints.2.text: Actualice la versión board existente con port=8080 y espere su rollout.
debrief: Un valor chart generó un comando HTTP no válido. Corregió el valor a través de Helm y verificó
  su versión deployed y su workload en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
