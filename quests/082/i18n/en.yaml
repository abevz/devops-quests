title: Helm release diagnosis
brief: 'You joined SignalRail operations. A chart value selected the wrong container command. Work in
  ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Helm board is deployed with port=8080 and a ready relay actually responds
  signalrail on HTTP 8080.'
stages.0.brief: 'The installed release uses port=bad-port. Helm deployed status alone does not prove that
  the intended HTTP endpoint works. Repair the existing release through Helm and verify the real response.


  Success criteria: Helm board is deployed with port=8080 and a ready relay actually responds signalrail
  on HTTP 8080.'
stages.0.objectives.0.text: Helm board is deployed with port=8080 and a ready relay actually responds
  signalrail on HTTP 8080.
hints.0.text: Use helm status and inspect the rendered worker command.
hints.1.text: The local chart value generated an invalid httpd port.
hints.2.text: Upgrade the existing board release with port=8080 and wait for its rollout.
debrief: A chart value generated an invalid HTTP command. You corrected the value through Helm and verified
  its deployed release and healthy workload.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
