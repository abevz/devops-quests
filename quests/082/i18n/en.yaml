title: Helm release diagnosis
brief: |
  The installed Helm release is not delivering the intended HTTP response. Restore the existing release and its workload.

  Work in `~/quest` on the workstation. Supplied inputs: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.

  **Requirements:**
  - Deployment `relay` completes its rollout.
  - The fix is applied through Helm release `board` values, not by editing the Deployment.
  - Inside container `worker` of Deployment `relay`, HTTP to `http://127.0.0.1:8080` returns `signalrail`.
  - Helm release `board` has status `deployed`.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Inside the application container, the HTTP response is `signalrail`.
  - Release `board` is `deployed`; its values describe the healthy workload rather than an unrelated live Deployment edit.

    ```sh
    helm list --filter '^board$'
    helm get values board --all
    ```
  - `kubectl rollout status deployment/relay --timeout=3s` — The workload rollout is complete.

  Helm status `deployed` alone does not prove that the intended HTTP endpoint works.
stages.0.brief: |
  The existing Helm release must provide the required HTTP response.
stages.0.objectives.0.text: Helm release `board` has status `deployed`.
stages.0.objectives.1.text: The fix is applied through Helm release `board` values, not by editing the
  Deployment.
stages.0.objectives.2.text: Deployment `relay` completes its rollout.
stages.0.objectives.3.text: HTTP from Deployment `relay` to `http://127.0.0.1:8080` returns `signalrail`.
hints.0.text: Use helm status and inspect the rendered worker command.
hints.1.text: |
  The local chart value generated an invalid httpd port and selected the wrong container command. The installed release uses port=bad-port.
hints.2.text: Upgrade the existing board release with port=8080 and wait for its rollout.
debrief: A chart value generated an invalid HTTP command. You corrected the value through Helm and verified
  its deployed release and healthy workload.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
