title: Helm release diagnosis
brief: |-
  The existing publication is not reaching its consumers correctly. Recover the retained Helm releases so the producer and both consumers agree on the current source publication.

  Work on the workstation in `~/quest` with `release-contract.json` and the working charts in `chart/`, `dispatcher/` and `archive/`.

  **Requirements:**
  - All supplied Helm releases have status `deployed`; their original Deployments complete rollout.
  - The producer release agrees with the supplied publication interface and current source publication identity. Each consumer release and its running application inputs reference the current producer Service interface and publication identity.
  - The original producer, source ConfigMap, consumer Deployments and public Services are retained, along with every supplied source data entry and each supplied immutable application image.
  - The producer application still returns `signalrail` at `http://127.0.0.1:8080`. Through every declared public Service, the producer and both consumers return the metadata record of the current source publication.

  Checks observe current release values, application inputs, retained identities and HTTP records. They do not prove command history, uninterrupted availability or every possible future chart input.
stages.0.brief: Restore agreement between the retained producer release and both consumer snapshots.
stages.0.objectives.0.text: All supplied Helm releases remain deployed.
stages.0.objectives.1.text: Current Helm values and running consumer inputs match the supplied producer interface
  and publication.
stages.0.objectives.2.text: The producer and both consumers complete rollout.
stages.0.objectives.3.text: Retained source data, resources and images stay intact; actual producer and consumer
  HTTP records match the current publication.
hints.0.text: A deployed release, a ready process and a current application snapshot are different observations.
  Stored input layers and process-local state can outlive a producer transition.
hints.1.text: Compare `release-contract.json`, the working chart inputs, `helm get values <release> --all`, `helm
  get manifest <release>` and `helm history <release>`. Inspect each workload’s inputs, Pod events/logs and the
  producer and consumer metadata records.
hints.2.text: Adopt the intended current values for the retained releases and allow each consumer to start with
  the current source inputs. Verify `helm get values <release> --all`, rollout and `kubectl exec deployment/relay
  -c worker -- wget -qO- -T 3 http://<service>:8080/release.json` for every declared Service. Expect the original
  resources/images, producer response `signalrail` and identical metadata matching the current source ConfigMap.
debrief: A healthy producer release did not automatically refresh its consumers. Comparing stored values, effective
  application inputs and real snapshots exposed the propagation boundary; the retained releases now agree on one
  current publication.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.release_status: A retained Helm release may be missing or have a status other than deployed, or status retrieval may fail; inspect all three releases. A deployed status alone does not prove process readiness or a current cached publication. [Cause and check](guides#guide=helm-8&section=retained-helm-deployed-status)
diagnostics.release_values: Stored values may retain bad-port, port 9090 or the previous publication, and running consumers may still use old inputs after chart defaults change. Use port 8080 and the supplied current publication; compare effective UPSTREAM and EXPECTED_PUBLICATION, including values supplied by ConfigMap or Secret references. Command/API errors can also use this marker. [Cause and check](guides#guide=helm-8&section=retained-helm-stored-and-effective-inputs)
diagnostics.release_rollout: The producer may fail to start with bad-port, or a cached consumer may reject an old upstream or expected publication; inspect all three Deployment rollouts and events after upgrading the retained releases. [Cause and check](guides#guide=helm-8&section=retained-helm-process-readiness)
diagnostics.release_identity: Uninstalling, deleting or recreating a supplied resource may change its UID; retain all seven recorded Deployment, Service and source ConfigMap identities during upgrades. A failed resource read also reports this marker; ordinary replacement Pods do not carry the frozen resource identity. [Cause and check](guides#guide=helm-8&section=retained-helm-original-resource-uids)
diagnostics.release_source: The source ConfigMap may have lost or changed a supplied current entry while repairing the release; compare every frozen data entry byte-for-byte, including JSON strings. Additional data keys are allowed. [Cause and check](guides#guide=helm-8&section=retained-helm-retained-source-data)
diagnostics.release_images: A stored image value or live Deployment image may have changed while repairing values; retain the supplied image in all three releases and workloads. The exact reference or another reference carrying the same sha256 digest is accepted. [Cause and check](guides#guide=helm-8&section=retained-helm-immutable-image)
diagnostics.release_publication: A healthy consumer may still serve its startup snapshot of the previous publication, or a request may fail; upgrade/restart it with current inputs and compare actual /release.json from the producer and both consumers with the frozen current record. The producer page must also return signalrail. [Cause and check](guides#guide=helm-8&section=retained-helm-actual-cached-metadata)
diagnostics.probe_0_0: Status observation may stop before Helm returns a named release result; check command availability and access to the supplied cluster. A non-deployed status or ordinary status-command failure already uses release_status. [Cause and check](guides#guide=helm-8&section=retained-helm-status-startup)
diagnostics.probe_0_1: Frozen facts or returned JSON may be unreadable, or helpers may fail to load before a detailed marker; inspect JSON output and helper availability. Normal named values/image failures keep their own diagnostics. [Cause and check](guides#guide=helm-8&section=retained-helm-values-json-startup)
diagnostics.probe_0_2: Rollout observation may stop before a named workload result because command setup is unavailable; verify kubectl and cluster access. Ordinary failed rollouts already receive release_rollout. [Cause and check](guides#guide=helm-8&section=retained-helm-rollout-startup)
diagnostics.probe_0_3: Publication facts, resource JSON or an HTTP metadata response may fail to decode before a detailed marker, or helpers may fail to load; inspect actual JSON and helper availability. Already named source, identity, image and publication failures retain their specific markers. [Cause and check](guides#guide=helm-8&section=retained-helm-publication-json-startup)
