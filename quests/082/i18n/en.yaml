title: Helm release diagnosis
brief: 'The installed Helm release is not delivering the intended HTTP response. Restore the existing release
  and its workload.


  Work in `~/quest` on the workstation. Supplied inputs: `chart/Chart.yaml`, `chart/templates/deploy.yaml`,
  `chart/values.yaml`.


  **Requirements:**

  - Helm release `board` has status `deployed`.

  - The existing release configuration agrees with the required HTTP serving endpoint.

  - Deployment `relay` completes its rollout.

  - HTTP from Deployment `relay` to `http://127.0.0.1:8080` returns `signalrail`.


  Helm status `deployed` alone does not prove that the intended HTTP endpoint works.

  '
stages.0.brief: The existing Helm release must provide the required HTTP response.
stages.0.objectives.0.text: Helm release `board` has status `deployed`.
stages.0.objectives.1.text: The existing release configuration agrees with the required HTTP serving endpoint.
stages.0.objectives.2.text: Deployment `relay` completes its rollout.
stages.0.objectives.3.text: HTTP from Deployment `relay` to `http://127.0.0.1:8080` returns `signalrail`.
hints.0.text: An installed release and a healthy application are different observations.
hints.1.text: 'Use helm status and inspect the rendered worker command.


  The local chart value generated an invalid httpd port and selected the wrong container command. The installed
  release uses port=bad-port.


  Inspect the supplied definitions, current resources and events.


  ```sh

  helm status board

  helm get values board --all

  helm get manifest board

  kubectl describe deployment relay

  ```'
hints.2.text: 'Upgrade the existing board release with port=8080 and wait for its rollout.


  Verify the observed result:


  ```sh

  helm list --filter ''^board$''

  kubectl rollout status deployment/relay --timeout=3s

  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080

  ```


  Expect deployed, a completed rollout and HTTP response signalrail.'
debrief: A chart value generated an invalid HTTP command. You corrected the value through Helm and verified
  its deployed release and healthy workload.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
