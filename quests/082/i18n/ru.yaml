title: Диагностика Helm-релиза
brief: |
  Установленный релиз Helm не выдаёт требуемый HTTP-ответ. Восстановите существующий релиз и его нагрузку.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.

  **Требования:**
  - Deployment `relay` завершает rollout.
  - Исправление внесено через values релиза Helm `board`, а не редактированием Deployment.
  - Внутри контейнера `worker` Deployment `relay` HTTP-запрос к `http://127.0.0.1:8080` возвращает `signalrail`.
  - Релиз Helm `board` имеет статус `deployed`.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Внутри контейнера приложения HTTP-ответ — `signalrail`.
  - Релиз `board` имеет статус `deployed`; его values описывают здоровую нагрузку, а не отдельную правку живого Deployment.

    ```sh
    helm list --filter '^board$'
    helm get values board --all
    ```
  - `kubectl rollout status deployment/relay --timeout=3s` — Rollout нагрузки завершён.

  Один лишь статус Helm `deployed` не доказывает работоспособность требуемого HTTP-адреса.
stages.0.brief: |
  Существующий релиз Helm должен выдавать требуемый HTTP-ответ.
stages.0.objectives.0.text: Helm release `board` имеет статус `deployed`.
stages.0.objectives.1.text: Исправление применено через значения Helm-релиза `board`, а не путём редактирования
  Deployment.
stages.0.objectives.2.text: Deployment `relay` завершает rollout.
stages.0.objectives.3.text: HTTP-запрос из Deployment `relay` к `http://127.0.0.1:8080` возвращает `signalrail`.
hints.0.text: Используйте helm status и проверьте отрендеренную команду worker.
hints.1.text: |
  Значение локального chart сгенерировало неверный порт httpd и выбрало неверную команду контейнера. Установленный релиз использует port=bad-port.
hints.2.text: Обновите существующий релиз board с port=8080 и дождитесь rollout.
debrief: Значение chart породило неверную HTTP-команду. Вы исправили value через Helm и проверили deployed
  release и исправный workload.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
