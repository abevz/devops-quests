title: Диагностика Helm-релиза
brief: |-
  Существующая публикация некорректно доходит до потребителей. Восстановите сохранённые Helm-релизы так, чтобы производитель и оба потребителя использовали текущую публикацию источника.

  Работайте на рабочей станции в `~/quest` с `release-contract.json` и рабочими chart в `chart/`, `dispatcher/` и `archive/`.

  **Требования:**
  - Все заданные Helm-релизы имеют статус `deployed`; их исходные Deployment завершают rollout.
  - Релиз производителя согласован с заданным интерфейсом публикации и идентификатором текущей публикации источника. Релиз каждого потребителя и входные параметры работающего приложения соответствуют текущему интерфейсу Service производителя и идентификатору публикации.
  - Сохранены исходные производитель, ConfigMap источника, Deployment потребителей и публичные Service, все исходные записи данных и каждый заданный неизменяемый образ приложения.
  - Приложение производителя по-прежнему возвращает `signalrail` по `http://127.0.0.1:8080`. Через каждый публичный Service из контракта производитель и оба потребителя возвращают метаданные текущей публикации источника.

  Проверки наблюдают текущие values релизов, входные параметры приложений, сохранённые идентичности и HTTP-записи. Они не доказывают историю команд, непрерывную доступность или работу любых будущих входных данных chart.
stages.0.brief: Восстановите согласованность сохранённого релиза производителя и снимков обоих потребителей.
stages.0.objectives.0.text: Все заданные Helm-релизы сохраняют статус deployed.
stages.0.objectives.1.text: Текущие Helm values и входные параметры работающих потребителей соответствуют заданному
  интерфейсу производителя и публикации.
stages.0.objectives.2.text: Производитель и оба потребителя завершают rollout.
stages.0.objectives.3.text: Исходные данные, ресурсы и образы сохранены; реальные HTTP-записи производителя и потребителей
  соответствуют текущей публикации.
hints.0.text: Успешный статус релиза, готовность процесса и актуальность снимка приложения — разные наблюдения.
  Сохранённые слои входных параметров и локальное состояние процесса могут пережить переход производителя.
hints.1.text: Сопоставьте `release-contract.json`, входные данные рабочих chart, `helm get values <release> --all`,
  `helm get manifest <release>` и `helm history <release>`. Изучите параметры каждого workload, события и логи Pod,
  метаданные производителя и потребителей.
hints.2.text: Примените требуемые текущие values к сохранённым релизам и дайте каждому потребителю запуститься с
  актуальными входными параметрами источника. Проверьте `helm get values <release> --all`, rollout и `kubectl exec
  deployment/relay -c worker -- wget -qO- -T 3 http://<service>:8080/release.json` для каждого Service из контракта.
  Ожидаются исходные ресурсы и образы, ответ производителя `signalrail` и одинаковые метаданные, соответствующие
  текущему ConfigMap источника.
debrief: Исправный релиз производителя не обновил потребителей автоматически. Сопоставление сохранённых values,
  действующих входных параметров и реальных снимков выявило границу распространения; теперь сохранённые релизы используют
  одну текущую публикацию.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.release_status: Сохранённый Helm-релиз может отсутствовать, иметь статус не deployed либо не читаться; изучите все три релиза. Статус deployed сам по себе не доказывает готовность процесса или актуальность публикации в кэше. [Причина и проверка](guides#guide=helm-8&section=retained-helm-deployed-status)
diagnostics.release_values: Сохранённые values могут содержать bad-port, порт 9090 или прошлую публикацию, а процессы — старые входы после изменения defaults чарта. Нужны порт 8080 и выданная текущая публикация; сравните эффективные UPSTREAM и EXPECTED_PUBLICATION, включая ConfigMap/Secret-ссылки. Ошибки команд/API дают тот же маркер. [Причина и проверка](guides#guide=helm-8&section=retained-helm-stored-and-effective-inputs)
diagnostics.release_rollout: Источник может не запускаться с bad-port, а кэширующий потребитель отвергать старые upstream или expected publication; изучите rollout и события трёх Deployment после обновления сохранённых релизов. [Причина и проверка](guides#guide=helm-8&section=retained-helm-process-readiness)
diagnostics.release_identity: Удаление или пересоздание выданного ресурса может изменить UID; при upgrade сохраните все семь записанных идентичностей Deployment, Service и исходного ConfigMap. Ошибка чтения ресурса даёт тот же маркер; обычные сменившиеся Pod не являются зафиксированными ресурсами. [Причина и проверка](guides#guide=helm-8&section=retained-helm-original-resource-uids)
diagnostics.release_source: При исправлении релиза исходный ConfigMap мог потерять или изменить выданную текущую запись; сравните каждое зафиксированное data-значение побайтно, включая JSON-строки. Дополнительные data-ключи допустимы. [Причина и проверка](guides#guide=helm-8&section=retained-helm-retained-source-data)
diagnostics.release_images: Сохранённый image value либо живой image Deployment могли измениться при исправлении values; сохраните выданный image во всех трёх релизах и workload. Допустимы точная ссылка или другая ссылка с тем же sha256 digest. [Причина и проверка](guides#guide=helm-8&section=retained-helm-immutable-image)
diagnostics.release_publication: Здоровый потребитель может отдавать стартовый снимок прошлой публикации, либо запрос завершается ошибкой; обновите/перезапустите с текущими входами и сравните реальные /release.json источника и обоих потребителей с зафиксированной текущей записью. Страница источника также возвращает signalrail. [Причина и проверка](guides#guide=helm-8&section=retained-helm-actual-cached-metadata)
diagnostics.probe_0_0: Наблюдение статуса может оборваться до именованного результата Helm; проверьте доступность команды и выданного кластера. Не-deployed статус или обычная ошибка status уже дают release_status. [Причина и проверка](guides#guide=helm-8&section=retained-helm-status-startup)
diagnostics.probe_0_1: Зафиксированные факты или полученный JSON могут не читаться, либо helpers не загружаются до подробного маркера; изучите JSON-вывод и доступность helpers. Именованные ошибки values/image сохраняют собственную диагностику. [Причина и проверка](guides#guide=helm-8&section=retained-helm-values-json-startup)
diagnostics.probe_0_2: Наблюдение rollout может оборваться до именованного результата из-за недоступного запуска команд; проверьте kubectl и доступ к кластеру. Обычные сбои rollout уже дают release_rollout. [Причина и проверка](guides#guide=helm-8&section=retained-helm-rollout-startup)
diagnostics.probe_0_3: Факты публикации, JSON ресурса или HTTP metadata могут не разобратьcя до подробного маркера, либо helpers не загрузиться; изучите реальный JSON и helpers. Именованные сбои source, identity, image и publication сохраняют свои маркеры. [Причина и проверка](guides#guide=helm-8&section=retained-helm-publication-json-startup)
