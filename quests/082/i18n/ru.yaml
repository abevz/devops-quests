title: Диагностика Helm-релиза
brief: 'Вы в команде эксплуатации SignalRail. Chart выбрал неправильную команду. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.'
stages.0.brief: У установленного релиза port=bad-port. Сам статус Helm deployed не доказывает работу нужного
  HTTP endpoint. Исправьте существующий релиз через Helm и проверьте реальный ответ.
stages.0.objectives.0.text: Helm release `board` имеет статус `deployed`.
stages.0.objectives.1.text: Исправление применено через значения Helm-релиза `board`, а не путём редактирования
  Deployment.
stages.0.objectives.2.text: Deployment `relay` завершает rollout.
stages.0.objectives.3.text: HTTP-запрос из Deployment `relay` к `http://127.0.0.1:8080` возвращает `signalrail`.
hints.0.text: Используйте helm status и проверьте отрендеренную команду worker.
hints.1.text: Value локального chart создал неверный порт httpd.
hints.2.text: Обновите существующий релиз board с port=8080 и дождитесь rollout.
debrief: Значение chart породило неверную HTTP-команду. Вы исправили value через Helm и проверили deployed
  release и исправный workload.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
