title: Диагностика Helm-релиза
brief: |-
  Существующая публикация некорректно доходит до потребителей. Восстановите сохранённые Helm-релизы так, чтобы производитель и оба потребителя использовали текущую публикацию источника.

  Работайте на рабочей станции в `~/quest` с `release-contract.json` и рабочими chart в `chart/`, `dispatcher/` и `archive/`.

  **Требования:**
  - Все заданные Helm-релизы имеют статус `deployed`; их исходные Deployment завершают rollout.
  - Релиз производителя согласован с заданным интерфейсом публикации и идентификатором текущей публикации источника. Релиз каждого потребителя и входные параметры работающего приложения соответствуют текущему интерфейсу Service производителя и идентификатору публикации.
  - Сохранены исходные производитель, ConfigMap источника, Deployment потребителей и публичные Service, все исходные записи данных и каждый заданный неизменяемый образ приложения.
  - Приложение производителя по-прежнему возвращает `signalrail` по `http://127.0.0.1:8080`. Через каждый публичный Service из контракта производитель и оба потребителя возвращают метаданные текущей публикации источника.

  Проверки наблюдают текущие values релизов, входные параметры приложений, сохранённые идентичности и HTTP-записи. Они не доказывают историю команд, непрерывную доступность или работу любых будущих входных данных chart.
stages.0.brief: Восстановите согласованность сохранённого релиза производителя и снимков обоих потребителей.
stages.0.objectives.0.text: Все заданные Helm-релизы сохраняют статус deployed.
stages.0.objectives.1.text: Текущие Helm values и входные параметры работающих потребителей соответствуют заданному
  интерфейсу производителя и публикации.
stages.0.objectives.2.text: Производитель и оба потребителя завершают rollout.
stages.0.objectives.3.text: Исходные данные, ресурсы и образы сохранены; реальные HTTP-записи производителя и потребителей
  соответствуют текущей публикации.
hints.0.text: Успешный статус релиза, готовность процесса и актуальность снимка приложения — разные наблюдения.
  Сохранённые слои входных параметров и локальное состояние процесса могут пережить переход производителя.
hints.1.text: Сопоставьте `release-contract.json`, входные данные рабочих chart, `helm get values <release> --all`,
  `helm get manifest <release>` и `helm history <release>`. Изучите параметры каждого workload, события и логи Pod,
  метаданные производителя и потребителей.
hints.2.text: Примените требуемые текущие values к сохранённым релизам и дайте каждому потребителю запуститься с
  актуальными входными параметрами источника. Проверьте `helm get values <release> --all`, rollout и `kubectl exec
  deployment/relay -c worker -- wget -qO- -T 3 http://<service>:8080/release.json` для каждого Service из контракта.
  Ожидаются исходные ресурсы и образы, ответ производителя `signalrail` и одинаковые метаданные, соответствующие
  текущему ConfigMap источника.
debrief: Исправный релиз производителя не обновил потребителей автоматически. Сопоставление сохранённых values,
  действующих входных параметров и реальных снимков выявило границу распространения; теперь сохранённые релизы используют
  одну текущую публикацию.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.probe_0_0: Все заданные Helm-релизы сохраняют статус deployed.
diagnostics.probe_0_1: Текущие Helm values и входные параметры работающих потребителей соответствуют заданному интерфейсу
  производителя и публикации.
diagnostics.probe_0_2: Производитель и оба потребителя завершают rollout.
diagnostics.probe_0_3: Исходные данные, ресурсы и образы сохранены; реальные HTTP-записи производителя и потребителей
  соответствуют текущей публикации.
diagnostics.release_status: Все заданные Helm-релизы должны сохранять статус deployed.
diagnostics.release_values: Сохранённые Helm values или входные параметры работающих потребителей всё ещё относятся
  к другому интерфейсу или публикации.
diagnostics.release_rollout: Каждый исходный Deployment производителя и потребителей должен завершить rollout.
diagnostics.release_identity: Сохраните исходные UID ресурсов релизов.
diagnostics.release_source: Сохраните все записи текущих данных исходного ConfigMap.
diagnostics.release_images: Сохраните заданный неизменяемый образ приложения во всех релизах и workload.
diagnostics.release_publication: Реальные публичные метаданные производителя и потребителей должны соответствовать
  текущей публикации источника; готовый процесс может отдавать старый снимок.
