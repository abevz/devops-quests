title: Диагностика Helm-релиза
brief: 'Установленный релиз Helm не выдаёт требуемый HTTP-ответ. Восстановите существующий релиз и его нагрузку.


  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `chart/Chart.yaml`, `chart/templates/deploy.yaml`,
  `chart/values.yaml`.


  **Требования:**

  - Helm release `board` имеет статус `deployed`.

  - Конфигурация существующего релиза соответствует требуемой обслуживающей HTTP-точке.

  - Deployment `relay` завершает rollout.

  - HTTP-запрос из Deployment `relay` к `http://127.0.0.1:8080` возвращает `signalrail`.


  Один лишь статус Helm `deployed` не доказывает работоспособность требуемого HTTP-адреса.

  '
stages.0.brief: Существующий релиз Helm должен выдавать требуемый HTTP-ответ.
stages.0.objectives.0.text: Helm release `board` имеет статус `deployed`.
stages.0.objectives.1.text: Конфигурация существующего релиза соответствует требуемой обслуживающей HTTP-точке.
stages.0.objectives.2.text: Deployment `relay` завершает rollout.
stages.0.objectives.3.text: HTTP-запрос из Deployment `relay` к `http://127.0.0.1:8080` возвращает `signalrail`.
hints.0.text: Установленный релиз и исправное приложение — разные наблюдения.
hints.1.text: 'Используйте helm status и проверьте отрендеренную команду worker.


  Значение локального chart сгенерировало неверный порт httpd и выбрало неверную команду контейнера. Установленный
  релиз использует port=bad-port.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  helm status board

  helm get values board --all

  helm get manifest board

  kubectl describe deployment relay

  ```'
hints.2.text: 'Обновите существующий релиз board с port=8080 и дождитесь rollout.


  Проверьте наблюдаемый результат:


  ```sh

  helm list --filter ''^board$''

  kubectl rollout status deployment/relay --timeout=3s

  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080

  ```


  Ожидаются deployed, завершённый rollout и HTTP-ответ signalrail.'
debrief: Значение chart породило неверную HTTP-команду. Вы исправили value через Helm и проверили deployed
  release и исправный workload.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
