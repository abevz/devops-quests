title: Diagnoza wydania Helm
brief: |-
  Istniejąca publikacja nie dociera poprawnie do odbiorców. Odzyskaj zachowane wydania Helm tak, aby producent i obaj odbiorcy korzystali z aktualnej publikacji źródła.

  Pracuj na stacji w `~/quest` z `release-contract.json` i roboczymi chartami w `chart/`, `dispatcher/` i `archive/`.

  **Wymagania:**
  - Wszystkie dostarczone wydania Helm mają stan `deployed`; ich pierwotne Deploymenty kończą rollout.
  - Wydanie producenta jest zgodne z dostarczonym interfejsem i tożsamością aktualnej publikacji. Wydanie każdego odbiorcy i wejścia działającej aplikacji odpowiadają aktualnemu interfejsowi Service producenta oraz tożsamości publikacji.
  - Zachowano pierwotnego producenta, źródłowy ConfigMap, Deploymenty odbiorców i publiczne Service, wszystkie dostarczone dane i każdy niezmienny obraz aplikacji.
  - Aplikacja producenta nadal zwraca `signalrail` pod `http://127.0.0.1:8080`. Przez każdy zadeklarowany publiczny Service producent i obaj odbiorcy zwracają metadane aktualnej publikacji źródła.

  Testy obserwują bieżące values wydań, wejścia aplikacji, zachowane tożsamości i rekordy HTTP. Nie dowodzą historii poleceń, nieprzerwanej dostępności ani poprawności wszystkich przyszłych wejść chartu.
stages.0.brief: Przywróć zgodność zachowanego wydania producenta i migawek obu odbiorców.
stages.0.objectives.0.text: Wszystkie dostarczone wydania Helm pozostają deployed.
stages.0.objectives.1.text: Bieżące values Helm i wejścia działających odbiorców odpowiadają dostarczonemu interfejsowi
  i publikacji producenta.
stages.0.objectives.2.text: Producent i obaj odbiorcy kończą rollout.
stages.0.objectives.3.text: Dane, zasoby i obrazy pozostają zachowane; rzeczywiste rekordy HTTP producenta i odbiorców
  odpowiadają aktualnej publikacji.
hints.0.text: Wydanie deployed, gotowy proces i aktualna migawka aplikacji to różne obserwacje. Zapisane warstwy
  wejścia i lokalny stan procesu mogą przetrwać zmianę producenta.
hints.1.text: |-
  Porównaj `release-contract.json`, wejścia roboczych chartów, `helm get values <release> --all`, `helm get manifest <release>` i `helm history <release>`. Sprawdź wejścia workloadów, zdarzenia i logi Podów oraz metadane producenta i odbiorców.

  Sprawdź zachowane nadpisania każdego wydania i dane wejściowe renderowanego konsumenta. Porównaj odwołania do źródła z metadanymi działającego producenta.
hints.2.text: |-
  Sprawdź efektywne wartości Helm i zapis wydania udostępniany przez każdy Service. Potwierdź ukończenie rolloutów relay, dispatcher i archive.

  ```sh
  for name in relay dispatcher archive; do
    kubectl rollout status "deployment/$name" --timeout=10s
  done
  for name in board dispatcher archive; do
    helm get values "$name" --all
    kubectl exec deployment/relay -c worker -- wget -qO- -T 3 "http://$name:8080/release.json"
    printf '\n'
  done
  ```

  Oczekuj pierwotnych zasobów i obrazów, odpowiedzi producenta `signalrail` oraz identycznych metadanych zgodnych z aktualnym źródłowym ConfigMap.
debrief: Zdrowe wydanie producenta nie odświeżyło automatycznie odbiorców. Porównanie zapisanych values, rzeczywistych
  wejść i migawek ujawniło granicę propagacji; zachowane wydania korzystają teraz z jednej aktualnej publikacji.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.release_status: Zachowanego wydania Helm może brakować, mieć status inny niż deployed lub odczyt zawodzi; sprawdź trzy wydania. Sam deployed nie dowodzi gotowości procesu ani aktualnej publikacji w cache. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-deployed-status)
diagnostics.release_values: Zapisane values mogą zachować bad-port, port 9090 lub poprzednią publikację, a procesy stare wejścia mimo nowych defaults chartu. Użyj portu 8080 i dostarczonej aktualnej publikacji; porównaj skuteczne UPSTREAM i EXPECTED_PUBLICATION, także z odwołań ConfigMap/Secret. Błędy poleceń/API też dają ten marker. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-stored-and-effective-inputs)
diagnostics.release_rollout: Źródło może nie startować z bad-port, a odbiorca z cache odrzucać stary upstream lub expected publication; sprawdź rollout i zdarzenia trzech Deployment po aktualizacji zachowanych wydań. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-process-readiness)
diagnostics.release_identity: Usunięcie lub odtworzenie zasobu może zmienić UID; podczas upgrade zachowaj siedem zapisanych tożsamości Deployment, Service i źródłowego ConfigMap. Błąd odczytu zasobu też daje marker; zwykłe wymienione Pod nie są zamrożonymi zasobami. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-original-resource-uids)
diagnostics.release_source: Przy naprawie wydania źródłowy ConfigMap mógł utracić lub zmienić aktualny wpis; porównaj każdy zamrożony wpis data bajt po bajcie, także ciągi JSON. Dodatkowe klucze data są dozwolone. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-retained-source-data)
diagnostics.release_images: Zapisany image value lub żywy image Deployment mógł się zmienić podczas naprawy values; zachowaj dostarczony image w trzech wydaniach i workload. Akceptowana jest dokładna referencja lub inna z tym samym sha256 digest. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-immutable-image)
diagnostics.release_publication: Zdrowy odbiorca może nadal serwować startowy snapshot poprzedniej publikacji albo żądanie zawodzi; zaktualizuj/uruchom ponownie z bieżącymi wejściami i porównaj rzeczywiste /release.json źródła i obu odbiorców z zamrożonym aktualnym rekordem. Strona źródła ma też zwracać signalrail. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-actual-cached-metadata)
diagnostics.probe_0_0: Obserwacja statusu może zakończyć się przed nazwanym wynikiem Helm; sprawdź dostępność polecenia i klastra. Status inny niż deployed lub zwykły błąd status daje już release_status. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-status-startup)
diagnostics.probe_0_1: Zamrożone fakty lub zwrócony JSON mogą być nieczytelne albo helpers nie ładują się przed szczegółowym markerem; sprawdź JSON i dostępność helpers. Nazwane błędy values/image zachowują własną diagnostykę. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-values-json-startup)
diagnostics.probe_0_2: Obserwacja rollout może zakończyć się przed nazwanym wynikiem przez niedostępne uruchomienie poleceń; sprawdź kubectl i klaster. Zwykłe błędy rollout mają już release_rollout. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-rollout-startup)
diagnostics.probe_0_3: Fakty publikacji, JSON zasobu lub HTTP metadata mogą nie dekodować się przed szczegółowym markerem albo helpers nie ładują się; sprawdź rzeczywisty JSON i helpers. Nazwane błędy source, identity, image i publication zachowują swoje markery. [Przyczyna i kontrola](guides#guide=helm-8&section=retained-helm-publication-json-startup)
