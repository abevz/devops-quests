title: Diagnoza wydania Helm
brief: |
  Zainstalowane wydanie Helm nie dostarcza oczekiwanej odpowiedzi HTTP. Przywróć istniejące wydanie i jego obciążenie.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.

  **Wymagania:**
  - Deployment `relay` kończy rollout.
  - Poprawka jest wprowadzona przez wartości wydania Helm `board`, a nie przez edycję Deployment.
  - Wewnątrz kontenera `worker` Deployment `relay` żądanie HTTP do `http://127.0.0.1:8080` zwraca `signalrail`.
  - Wydanie Helm `board` ma status `deployed`.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Wewnątrz kontenera aplikacji odpowiedź HTTP to `signalrail`.
  - Wydanie `board` ma status `deployed`; jego wartości opisują zdrowe obciążenie zamiast niezależnej edycji działającego Deployment.

    ```sh
    helm list --filter '^board$'
    helm get values board --all
    ```
  - `kubectl rollout status deployment/relay --timeout=3s` — Rollout obciążenia jest zakończony.

  Sam status Helm `deployed` nie dowodzi działania oczekiwanego punktu HTTP.
stages.0.brief: |
  Istniejące wydanie Helm ma udostępniać wymaganą odpowiedź HTTP.
stages.0.objectives.0.text: Release Helm `board` ma status `deployed`.
stages.0.objectives.1.text: Poprawka jest wprowadzona przez wartości release’u Helm `board`, a nie przez
  edytowanie Deploymentu.
stages.0.objectives.2.text: Deployment `relay` kończy rollout.
stages.0.objectives.3.text: HTTP z Deployment `relay` do `http://127.0.0.1:8080` zwraca `signalrail`.
hints.0.text: Użyj helm status i sprawdź wyrenderowane polecenie worker.
hints.1.text: |
  Wartość lokalnego chart wygenerowała nieprawidłowy port httpd i wybrała nieprawidłowe polecenie kontenera. Zainstalowane wydanie używa port=bad-port.
hints.2.text: Zaktualizuj istniejącą wersję board o port=8080 i poczekaj na jej rollout.
debrief: chart value wygenerowało nieprawidłowe polecenie HTTP. Poprawiłeś value do Helm i zweryfikowałeś
  jego deployed release i zdrowy workload.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
