title: Diagnoza wydania Helm
brief: 'Dołączyłeś do operacji SignalRail. Wartość wykresu wybrała niewłaściwe polecenie kontenera. Pracuj
  w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `chart/Chart.yaml`, `chart/templates/deploy.yaml`, `chart/values.yaml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.'
stages.0.brief: Zainstalowana wersja wykorzystuje port=bad-port. Sam status Helm deployed nie dowodzi,
  że zamierzony HTTP endpoint działa. Napraw istniejącą wersję za pomocą Helm i sprawdź rzeczywistą reakcję.
stages.0.objectives.0.text: Release Helm `board` ma status `deployed`.
stages.0.objectives.1.text: Release Helm `board` używa wartości `8080` dla `port`.
stages.0.objectives.2.text: Deployment `relay` kończy rollout.
stages.0.objectives.3.text: HTTP z Deployment `relay` do `http://127.0.0.1:8080` zwraca `signalrail`.
hints.0.text: Użyj helm status i sprawdź wyrenderowane polecenie worker.
hints.1.text: Lokalna wartość chart wygenerowała nieprawidłowy port httpd.
hints.2.text: Zaktualizuj istniejącą wersję board o port=8080 i poczekaj na jej rollout.
debrief: chart value wygenerowało nieprawidłowe polecenie HTTP. Poprawiłeś value do Helm i zweryfikowałeś
  jego deployed release i zdrowy workload.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
