title: Diagnoza wydania Helm
brief: 'Zainstalowane wydanie Helm nie dostarcza oczekiwanej odpowiedzi HTTP. Przywróć istniejące wydanie i
  jego obciążenie.


  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `chart/Chart.yaml`, `chart/templates/deploy.yaml`,
  `chart/values.yaml`.


  **Wymagania:**

  - Release Helm `board` ma status `deployed`.

  - Konfiguracja istniejącego wydania odpowiada wymaganemu punktowi HTTP.

  - Deployment `relay` kończy rollout.

  - HTTP z Deployment `relay` do `http://127.0.0.1:8080` zwraca `signalrail`.


  Sam status Helm `deployed` nie dowodzi działania oczekiwanego punktu HTTP.

  '
stages.0.brief: Istniejące wydanie Helm ma udostępniać wymaganą odpowiedź HTTP.
stages.0.objectives.0.text: Release Helm `board` ma status `deployed`.
stages.0.objectives.1.text: Konfiguracja istniejącego wydania odpowiada wymaganemu punktowi HTTP.
stages.0.objectives.2.text: Deployment `relay` kończy rollout.
stages.0.objectives.3.text: HTTP z Deployment `relay` do `http://127.0.0.1:8080` zwraca `signalrail`.
hints.0.text: Zainstalowane wydanie i zdrowa aplikacja to różne obserwacje.
hints.1.text: 'Użyj helm status i sprawdź wyrenderowane polecenie worker.


  Wartość lokalnego chart wygenerowała nieprawidłowy port httpd i wybrała nieprawidłowe polecenie kontenera.
  Zainstalowane wydanie używa port=bad-port.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  helm status board

  helm get values board --all

  helm get manifest board

  kubectl describe deployment relay

  ```'
hints.2.text: 'Zaktualizuj istniejącą wersję board o port=8080 i poczekaj na jej rollout.


  Sprawdź obserwowany wynik:


  ```sh

  helm list --filter ''^board$''

  kubectl rollout status deployment/relay --timeout=3s

  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080

  ```


  Oczekuj deployed, ukończonego rolloutu i odpowiedzi HTTP signalrail.'
debrief: chart value wygenerowało nieprawidłowe polecenie HTTP. Poprawiłeś value do Helm i zweryfikowałeś jego
  deployed release i zdrowy workload.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
