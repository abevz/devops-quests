title: Diagnoza wydania Helm
brief: |-
  Istniejąca publikacja nie dociera poprawnie do odbiorców. Odzyskaj zachowane wydania Helm tak, aby producent i obaj odbiorcy korzystali z aktualnej publikacji źródła.

  Pracuj na stacji w `~/quest` z `release-contract.json` i roboczymi chartami w `chart/`, `dispatcher/` i `archive/`.

  **Wymagania:**
  - Wszystkie dostarczone wydania Helm mają stan `deployed`; ich pierwotne Deploymenty kończą rollout.
  - Wydanie producenta jest zgodne z dostarczonym interfejsem i tożsamością aktualnej publikacji. Wydanie każdego odbiorcy i wejścia działającej aplikacji odpowiadają aktualnemu interfejsowi Service producenta oraz tożsamości publikacji.
  - Zachowano pierwotnego producenta, źródłowy ConfigMap, Deploymenty odbiorców i publiczne Service, wszystkie dostarczone dane i każdy niezmienny obraz aplikacji.
  - Aplikacja producenta nadal zwraca `signalrail` pod `http://127.0.0.1:8080`. Przez każdy zadeklarowany publiczny Service producent i obaj odbiorcy zwracają metadane aktualnej publikacji źródła.

  Testy obserwują bieżące values wydań, wejścia aplikacji, zachowane tożsamości i rekordy HTTP. Nie dowodzą historii poleceń, nieprzerwanej dostępności ani poprawności wszystkich przyszłych wejść chartu.
stages.0.brief: Przywróć zgodność zachowanego wydania producenta i migawek obu odbiorców.
stages.0.objectives.0.text: Wszystkie dostarczone wydania Helm pozostają deployed.
stages.0.objectives.1.text: Bieżące values Helm i wejścia działających odbiorców odpowiadają dostarczonemu interfejsowi
  i publikacji producenta.
stages.0.objectives.2.text: Producent i obaj odbiorcy kończą rollout.
stages.0.objectives.3.text: Dane, zasoby i obrazy pozostają zachowane; rzeczywiste rekordy HTTP producenta i odbiorców
  odpowiadają aktualnej publikacji.
hints.0.text: Wydanie deployed, gotowy proces i aktualna migawka aplikacji to różne obserwacje. Zapisane warstwy
  wejścia i lokalny stan procesu mogą przetrwać zmianę producenta.
hints.1.text: Porównaj `release-contract.json`, wejścia roboczych chartów, `helm get values <release> --all`, `helm
  get manifest <release>` i `helm history <release>`. Sprawdź wejścia workloadów, zdarzenia i logi Podów oraz metadane
  producenta i odbiorców.
hints.2.text: Przyjmij zamierzone bieżące values zachowanych wydań i pozwól każdemu odbiorcy wystartować z aktualnymi
  wejściami źródła. Sprawdź `helm get values <release> --all`, rollout i `kubectl exec deployment/relay -c worker
  -- wget -qO- -T 3 http://<service>:8080/release.json` dla każdego zadeklarowanego Service. Oczekuj pierwotnych
  zasobów i obrazów, odpowiedzi producenta `signalrail` oraz identycznych metadanych zgodnych z aktualnym źródłowym
  ConfigMap.
debrief: Zdrowe wydanie producenta nie odświeżyło automatycznie odbiorców. Porównanie zapisanych values, rzeczywistych
  wejść i migawek ujawniło granicę propagacji; zachowane wydania korzystają teraz z jednej aktualnej publikacji.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.probe_0_0: Wszystkie dostarczone wydania Helm pozostają deployed.
diagnostics.probe_0_1: Bieżące values Helm i wejścia działających odbiorców odpowiadają dostarczonemu interfejsowi
  i publikacji producenta.
diagnostics.probe_0_2: Producent i obaj odbiorcy kończą rollout.
diagnostics.probe_0_3: Dane, zasoby i obrazy pozostają zachowane; rzeczywiste rekordy HTTP producenta i odbiorców
  odpowiadają aktualnej publikacji.
diagnostics.release_status: Każde dostarczone wydanie Helm musi pozostać deployed.
diagnostics.release_values: Zapisane values Helm lub wejścia działających odbiorców nadal wskazują inny interfejs
  lub publikację.
diagnostics.release_rollout: Każdy pierwotny Deployment producenta i odbiorców musi zakończyć rollout.
diagnostics.release_identity: Zachowaj pierwotne UID zasobów wydań.
diagnostics.release_source: Zachowaj każdy dostarczony bieżący wpis danych źródłowego ConfigMap.
diagnostics.release_images: Zachowaj dostarczony niezmienny obraz aplikacji we wszystkich wydaniach i workloadach.
diagnostics.release_publication: Rzeczywiste publiczne metadane producenta i odbiorców muszą odpowiadać aktualnej
  publikacji; gotowy proces może nadal udostępniać starszą migawkę.
