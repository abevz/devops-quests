title: Факты хостов
brief: 'Inventory парка выдан, но rollout.yml использует факты управляемых хостов без их сбора. Включите
  сбор фактов и доставьте /srv/site/facts.json на все три цели. Поддерживаемая платформа — Debian/x86_64;
  подтвердите это через setup.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: На каждой цели есть JSON фактов с family Debian, architecture x86_64 и mode 0644.'
debrief: Собранные факты — результат выполнения модуля на удалённом Python. Сбор устранил неопределённые
  значения и сохранил машиночитаемый JSON.
stages.0.brief: 'Факты должны приходить от каждого управляемого хоста, а не из окружения рабочей станции.


  Результат проверки: На каждой цели есть JSON фактов с family Debian, architecture x86_64 и mode 0644.'
stages.0.objectives.0.text: На каждой цели есть JSON фактов с family Debian, architecture x86_64 и mode
  0644.
hints.0.text: Запросите выбранные факты модулем setup у fleet.
hints.1.text: Проверьте gather_facts на уровне play.
hints.2.text: Перед шаблонизацией ansible_facts заполняется отдельно для каждой цели.
phrases.0: Я собрал факты с управляемых узлов.
phrases.1: Я отделил факты рабочей станции от фактов целевых узлов.
phrases.2: Я проверил конфигурацию, сформированную для каждого узла.
