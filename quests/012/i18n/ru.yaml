title: Факты хостов
brief: "Отчёт о платформе управляемых хостов недоступен.\n\nРаботайте на workstation в `~/quest` с файлами\
  \ `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Требования:**\n- JSON-запись на каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/facts.json`.\n  - `family`: `Debian`.\n  - `architecture`:\
  \ `x86_64`.\n- Режим доступа: `0644`.\n\nПроверка подтверждает запись фактов, но не способ сбора значений.\n"
debrief: Собранные факты — результат выполнения модуля на удалённом Python. Сбор устранил неопределённые значения
  и сохранил машиночитаемый JSON.
stages.0.brief: Записи о платформе должны быть доступны на управляемых хостах.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/facts.json`
  указывает семейство `Debian` и архитектуру `x86_64`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/facts.json`
  имеет режим `0644`.
hints.0.text: Отчёт о платформе должен описывать управляемые хосты, а не управляющую рабочую станцию.
hints.1.text: |-
  Найдите `gather_facts` в `rollout.yml` и посмотрите, какие данные возвращают хосты из `fleet`. Включите сбор, чтобы задача копирования могла использовать `ansible_facts` каждого хоста.

  ```sh
  cat rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.setup -a 'filter=ansible_os_family'
  ansible fleet -i inventory.ini -m ansible.builtin.setup -a 'filter=ansible_architecture'
  ```
hints.2.text: |-
  Проверьте значения и права на получившиеся файлы на всех трёх управляемых хостах.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/facts.json'` — показывает family Debian, architecture x86_64 с каждого управляемого хоста.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/facts.json'` — показывает права `-rw-r--r--` у всех трёх удалённых файлов.
phrases.0: Я собрал факты с управляемых узлов.
phrases.1: Я отделил факты рабочей станции от фактов целевых узлов.
phrases.2: Я проверил конфигурацию, сформированную для каждого узла.
diagnostics.facts_1: |-
  Шаблон может не создать запись на app1, если play пропускает сбор фактов и переменные с фактами недоступны. [Гайд](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.facts_2: |-
  Шаблон может не создать запись на app2, если play пропускает сбор фактов и переменные с фактами недоступны. [Гайд](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.facts_3: |-
