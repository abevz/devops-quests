title: Факты хостов
brief: "Отчёт о платформе управляемых хостов недоступен.\n\nРаботайте на workstation в `~/quest` с файлами\
  \ `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Требования:**\n- JSON-запись на каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/facts.json`.\n  - `family`: `Debian`.\n  - `architecture`:\
  \ `x86_64`.\n- Режим доступа: `0644`.\n\nПроверка подтверждает запись фактов, но не способ сбора значений.\n"
debrief: Собранные факты — результат выполнения модуля на удалённом Python. Сбор устранил неопределённые значения
  и сохранил машиночитаемый JSON.
stages.0.brief: Записи о платформе должны быть доступны на управляемых хостах.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/facts.json`
  указывает семейство `Debian` и архитектуру `x86_64`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/facts.json`
  имеет режим `0644`.
hints.0.text: Отчёт о платформе должен описывать управляемые хосты, а не управляющую рабочую станцию.
hints.1.text: 'Проверьте gather_facts на уровне play.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.setup

  ```'
hints.2.text: 'Запросите выбранные факты модулем setup у fleet. Собирайте данные управляемых хостов, а не факты
  workstation.


  Перед шаблонизацией ansible_facts заполняется отдельно для каждой цели.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/facts.json''`
  — показывает family Debian, architecture x86_64 с каждого управляемого хоста.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/facts.json''` — показывает
  права `-rw-r--r--` у всех трёх удалённых файлов.'
phrases.0: Я собрал факты с управляемых узлов.
phrases.1: Я отделил факты рабочей станции от фактов целевых узлов.
phrases.2: Я проверил конфигурацию, сформированную для каждого узла.
