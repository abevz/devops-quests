diagnostics.mode_1: |-
  Файл на app1 может сохранить неверные права, если в задаче копирования задан другой режим или задача на этом хосте не завершилась. [Гайд](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.mode_2: |-
  Файл на app2 может сохранить неверные права, если в задаче копирования задан другой режим или задача на этом хосте не завершилась. [Гайд](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.mode_3: |-
  Файл на app3 может сохранить неверные права, если в задаче копирования задан другой режим или задача на этом хосте не завершилась. [Гайд](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.probe_0_0: |-
  Проверка может не прочитать или не разобрать удалённую запись фактов. Посмотрите результаты play и проверьте, что на каждом хосте читается файл JSON. [Гайд](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.probe_0_1: |-
  Для проверки прав нужно подключиться к каждому хосту и прочитать метаданные скопированного туда файла. [Гайд](guides#guide=ansible-5&section=fleet-fact-records)
