title: Факты хостов
brief: |-
  Отчёт о платформе управляемых хостов недоступен.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Хост `app1`:
    - JSON-запись /srv/site/facts.json на app1 указывает семейство Debian и архитектуру x86_64.
    - На app1 /srv/site/facts.json имеет режим 0644.
  - Хост `app2`:
    - JSON-запись /srv/site/facts.json на app2 указывает семейство Debian и архитектуру x86_64.
    - На app2 /srv/site/facts.json имеет режим 0644.
  - Хост `app3`:
    - JSON-запись /srv/site/facts.json на app3 указывает семейство Debian и архитектуру x86_64.
    - На app3 /srv/site/facts.json имеет режим 0644.
  - JSON:
    - `family`: `Debian`.
    - `architecture`: `x86_64`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/facts.json'` — показывает family Debian, architecture x86_64 с каждого управляемого хоста.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/facts.json'` — показывает права `-rw-r--r--` у всех трёх удалённых файлов.

  Проверка подтверждает запись фактов, но не способ сбора значений.
debrief: Собранные факты — результат выполнения модуля на удалённом Python. Сбор устранил неопределённые значения
  и сохранил машиночитаемый JSON.
