diagnostics.mode_1: |-
  El archivo de app1 puede conservar permisos incorrectos si la tarea de copia fija otro modo o no terminó en ese host. [Guía](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.mode_2: |-
  El archivo de app2 puede conservar permisos incorrectos si la tarea de copia fija otro modo o no terminó en ese host. [Guía](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.mode_3: |-
  El archivo de app3 puede conservar permisos incorrectos si la tarea de copia fija otro modo o no terminó en ese host. [Guía](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.probe_0_0: |-
  La comprobación puede no leer o interpretar un registro remoto. Revisa el resultado del play y confirma que hay un archivo JSON legible en cada host. [Guía](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.probe_0_1: |-
  La comprobación de permisos necesita acceder a cada host e inspeccionar el archivo que dejó el play. [Guía](guides#guide=ansible-5&section=fleet-fact-records)
