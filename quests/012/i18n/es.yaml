title: Hechos
brief: 'El inventario de la flota está presente, pero rollout.yml intenta representar los datos del host
  administrado sin recopilarlos. Habilite la recopilación de datos adecuada y entregue /srv/site/facts.json
  en los tres objetivos. Su plataforma compatible es Debian en x86_64; inspect setup hechos que lo confirman.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Cada objetivo tiene un registro de hechos modo-0644 JSON con family Debian
  y architecture x86_64.'
debrief: Los datos del host recopilados son datos de la ejecución remota de Python/module. Al habilitar
  la recopilación se corrigieron los valores no definidos y al mismo tiempo se retuvo un registro JSON
  legible por máquina.
stages.0.brief: 'Los datos deben provenir de cada host administrado, no del entorno de la estación de
  trabajo.


  Criterios de éxito: Cada objetivo tiene un registro de hechos modo-0644 JSON con family Debian y architecture
  x86_64.'
stages.0.objectives.0.text: Cada objetivo tiene un registro de hechos modo-0644 JSON con family Debian
  y architecture x86_64.
hints.0.text: Ejecute una consulta setup enfocada en fleet.
hints.1.text: Mire la configuración del nivel de juego gather_facts.
hints.2.text: La asignación ansible_facts se completa para cada objetivo antes de crear la plantilla.
phrases.0: Reuní datos de los hosts administrados.
phrases.1: Mantuve los datos de la estación de trabajo separados de los datos de destino.
phrases.2: Verifiqué la configuración específica del host generada.
