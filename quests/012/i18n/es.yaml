title: Hechos
brief: "El informe de plataforma de los hosts administrados no está disponible.\n\nTrabaja en la workstation\
  \ en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n- Registro JSON en\
  \ cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/facts.json`.\n  - `family`: `Debian`.\n\
  \  - `architecture`: `x86_64`.\n- Modo de acceso: `0644`.\n\nLa comprobación verifica el registro de hechos,\
  \ no cómo se recopilaron sus valores.\n"
debrief: Los datos del host recopilados son datos de la ejecución remota de Python/module. Al habilitar la
  recopilación se corrigieron los valores no definidos y al mismo tiempo se retuvo un registro JSON legible
  por máquina.
stages.0.brief: Los registros de plataforma deben estar disponibles en los hosts administrados.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/facts.json` indica
  familia `Debian` y arquitectura `x86_64`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/facts.json` tiene
  el modo `0644`.
hints.0.text: Un informe de plataforma debe describir los hosts gestionados, no la estación de control.
hints.1.text: 'Mire la configuración del nivel de juego gather_facts.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.setup

  ```'
hints.2.text: 'Ejecute una consulta setup enfocada en fleet. Recopila datos de los hosts administrados, no
  hechos de la workstation.


  La asignación ansible_facts se completa para cada objetivo antes de crear la plantilla.


  Verifica el resultado observado:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/facts.json''`
  — muestra family Debian, architecture x86_64 de cada host administrado.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/facts.json''` — muestra
  permisos `-rw-r--r--` en los tres archivos remotos.'
phrases.0: Reuní datos de los hosts administrados.
phrases.1: Mantuve los datos de la estación de trabajo separados de los datos de destino.
phrases.2: Verifiqué la configuración específica del host generada.
diagnostics.facts_1: El registro JSON /srv/site/facts.json en app1 indica familia Debian y arquitectura x86_64.
diagnostics.facts_2: El registro JSON /srv/site/facts.json en app2 indica familia Debian y arquitectura x86_64.
