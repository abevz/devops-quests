hints.0.text: Ejecute una consulta setup enfocada en fleet. Recopila datos de los hosts administrados, no hechos
  de la workstation.
hints.1.text: Mire la configuración del nivel de juego gather_facts.
hints.2.text: La asignación ansible_facts se completa para cada objetivo antes de crear la plantilla.
phrases.0: Reuní datos de los hosts administrados.
phrases.1: Mantuve los datos de la estación de trabajo separados de los datos de destino.
phrases.2: Verifiqué la configuración específica del host generada.
