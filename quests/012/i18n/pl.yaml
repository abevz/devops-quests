title: Fakty
brief: 'Inwentarz floty jest obecny, ale rollout.yml próbuje renderować fakty dotyczące zarządzanych hostów
  bez ich gromadzenia. Włącz odpowiednie gromadzenie faktów i dostarcz /srv/site/facts.json do wszystkich
  trzech celów. Obsługiwana platforma to Debian na x86_64; sprawdź fakty setup, aby to potwierdzić.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: każdy cel ma rekord faktów mode-0644 JSON z family Debian i architecture
  x86_64.'
debrief: Zebrane fakty dotyczące hosta to dane ze zdalnego wykonania Pythona/modułu. Włączenie zbierania
  naprawiło niezdefiniowane wartości, zachowując rekord JSON nadający się do odczytu maszynowego.
stages.0.brief: 'Informacje muszą pochodzić od każdego zarządzanego hosta, a nie od środowiska stacji
  roboczej.


  Kryteria sukcesu: Każdy cel ma rekord faktów mode-0644 JSON z family Debian i architecture x86_64.'
stages.0.objectives.0.text: Każdy cel ma rekord faktów mode-0644 JSON z family Debian i architecture x86_64.
hints.0.text: Uruchom skoncentrowane zapytanie setup względem fleet.
hints.1.text: Spójrz na ustawienie gather_facts na poziomie play.
hints.2.text: Mapowanie ansible_facts jest wypełniane dla każdego celu przed utworzeniem szablonu.
phrases.0: Zebrałem fakty od zarządzanych hostów.
phrases.1: Oddzieliłem fakty dotyczące stacji roboczej od faktów docelowych.
phrases.2: Sprawdziłem wygenerowaną konfigurację specyficzną dla hosta.
