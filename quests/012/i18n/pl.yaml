title: Fakty
brief: "Raport platformy zarządzanych hostów jest niedostępny.\n\nPracuj na workstation w `~/quest` z plikami\
  \ `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n- Rekord JSON na każdym zarządzanym hoście\
  \ (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/facts.json`.\n  - `family`: `Debian`.\n  - `architecture`:\
  \ `x86_64`.\n- Tryb dostępu: `0644`.\n\nKontrola sprawdza rekord faktów, a nie sposób zebrania wartości.\n"
debrief: Zebrane fakty dotyczące hosta to dane ze zdalnego wykonania Pythona/modułu. Włączenie zbierania naprawiło
  niezdefiniowane wartości, zachowując rekord JSON nadający się do odczytu maszynowego.
stages.0.brief: Rekordy platformy muszą być dostępne na zarządzanych hostach.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/facts.json`
  wskazuje rodzinę `Debian` i architekturę `x86_64`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/facts.json`
  ma tryb `0644`.
hints.0.text: Raport platformy musi opisywać zarządzane hosty, a nie stację sterującą.
hints.1.text: 'Spójrz na ustawienie gather_facts na poziomie play.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.setup

  ```'
hints.2.text: 'Uruchom skoncentrowane zapytanie setup względem fleet. Zbieraj dane zarządzanych hostów, a nie
  fakty workstation.


  Mapowanie ansible_facts jest wypełniane dla każdego celu przed utworzeniem szablonu.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/facts.json''`
  — pokazuje family Debian, architecture x86_64 z każdego zarządzanego hosta.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/facts.json''` — pokazuje
  uprawnienia `-rw-r--r--` wszystkich trzech zdalnych plików.'
phrases.0: Zebrałem fakty od zarządzanych hostów.
phrases.1: Oddzieliłem fakty dotyczące stacji roboczej od faktów docelowych.
phrases.2: Sprawdziłem wygenerowaną konfigurację specyficzną dla hosta.
