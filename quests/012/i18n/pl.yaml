title: Fakty
brief: |-
  Raport platformy zarządzanych hostów jest niedostępny.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Host `app1`:
    - Rekord JSON /srv/site/facts.json na app1 wskazuje rodzinę Debian i architekturę x86_64.
    - Na app1 plik /srv/site/facts.json ma tryb 0644.
  - Host `app2`:
    - Rekord JSON /srv/site/facts.json na app2 wskazuje rodzinę Debian i architekturę x86_64.
    - Na app2 plik /srv/site/facts.json ma tryb 0644.
  - Host `app3`:
    - Rekord JSON /srv/site/facts.json na app3 wskazuje rodzinę Debian i architekturę x86_64.
    - Na app3 plik /srv/site/facts.json ma tryb 0644.
  - JSON:
    - `family`: `Debian`.
    - `architecture`: `x86_64`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/facts.json'` — pokazuje family Debian, architecture x86_64 z każdego zarządzanego hosta.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/facts.json'` — pokazuje uprawnienia `-rw-r--r--` wszystkich trzech zdalnych plików.

  Kontrola sprawdza rekord faktów, a nie sposób zebrania wartości.
debrief: Zebrane fakty dotyczące hosta to dane ze zdalnego wykonania Pythona/modułu. Włączenie zbierania naprawiło
  niezdefiniowane wartości, zachowując rekord JSON nadający się do odczytu maszynowego.
