title: Facts
brief: |-
  The managed-host platform report is unavailable.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Host `app1`:
    - The JSON record /srv/site/facts.json on app1 identifies family Debian and architecture x86_64.
    - On app1, /srv/site/facts.json has mode 0644.
  - Host `app2`:
    - The JSON record /srv/site/facts.json on app2 identifies family Debian and architecture x86_64.
    - On app2, /srv/site/facts.json has mode 0644.
  - Host `app3`:
    - The JSON record /srv/site/facts.json on app3 identifies family Debian and architecture x86_64.
    - On app3, /srv/site/facts.json has mode 0644.
  - JSON:
    - `family`: `Debian`.
    - `architecture`: `x86_64`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/facts.json'` — shows family Debian, architecture x86_64 from each managed host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/facts.json'` — shows permissions `-rw-r--r--` on all three remote files.

  The check verifies the fact record, not how its values were collected.
debrief: Gathered host facts are data from remote Python/module execution. Enabling collection fixed the undefined
  values while retaining a machine-readable JSON record.
