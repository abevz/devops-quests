title: Facts
brief: 'The fleet inventory is present, but rollout.yml tries to render managed-host facts without gathering
  them. Enable the appropriate fact gathering and deliver /srv/site/facts.json on all three targets. Their
  supported platform is Debian on x86_64; inspect setup facts to confirm it.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Every target has a mode-0644 JSON fact record with family Debian and architecture
  x86_64.'
debrief: Gathered host facts are data from remote Python/module execution. Enabling collection fixed the
  undefined values while retaining a machine-readable JSON record.
stages.0.brief: 'Facts must come from each managed host, not from the workstation environment.


  Success criteria: Every target has a mode-0644 JSON fact record with family Debian and architecture
  x86_64.'
stages.0.objectives.0.text: Every target has a mode-0644 JSON fact record with family Debian and architecture
  x86_64.
hints.0.text: Run a focused setup query against fleet.
hints.1.text: Look at the play-level gather_facts setting.
hints.2.text: The ansible_facts mapping is populated for each target before templating.
phrases.0: I gathered facts from the managed hosts.
phrases.1: I kept workstation facts separate from target facts.
phrases.2: I verified the generated host-specific configuration.
