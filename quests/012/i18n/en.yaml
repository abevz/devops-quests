title: Facts
brief: "The managed-host platform report is unavailable.\n\nWork on the workstation in `~/quest` with `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Requirements:**\n- JSON record on every managed host (`app1`, `app2`,\
  \ `app3`):\n  - Path: `/srv/site/facts.json`.\n  - `family`: `Debian`.\n  - `architecture`: `x86_64`.\n-\
  \ Access mode: `0644`.\n\nThe check verifies the fact record, not how its values were collected.\n"
debrief: Gathered host facts are data from remote Python/module execution. Enabling collection fixed the undefined
  values while retaining a machine-readable JSON record.
stages.0.brief: The fleet platform records must be available on the managed hosts.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/facts.json` identifies
  family `Debian` and architecture `x86_64`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/facts.json` has mode
  `0644`.
hints.0.text: A platform report must describe the managed hosts rather than the control workstation.
hints.1.text: 'Look at the play-level gather_facts setting.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.setup

  ```'
hints.2.text: 'Run a focused setup query against fleet. Gather the managed hosts'' data rather than workstation
  facts.


  The ansible_facts mapping is populated for each target before templating.


  Verify the observed result:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/facts.json''`
  — shows family Debian, architecture x86_64 from each managed host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/facts.json''` — shows permissions
  `-rw-r--r--` on all three remote files.'
phrases.0: I gathered facts from the managed hosts.
phrases.1: I kept workstation facts separate from target facts.
phrases.2: I verified the generated host-specific configuration.
