title: Fakten
brief: |-
  Der Plattformbericht der verwalteten Hosts ist nicht verfügbar.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Host `app1`:
    - Der JSON-Datensatz /srv/site/facts.json auf app1 nennt Familie Debian und Architektur x86_64.
    - Auf app1 hat /srv/site/facts.json den Modus 0644.
  - Host `app2`:
    - Der JSON-Datensatz /srv/site/facts.json auf app2 nennt Familie Debian und Architektur x86_64.
    - Auf app2 hat /srv/site/facts.json den Modus 0644.
  - Host `app3`:
    - Der JSON-Datensatz /srv/site/facts.json auf app3 nennt Familie Debian und Architektur x86_64.
    - Auf app3 hat /srv/site/facts.json den Modus 0644.
  - JSON:
    - `family`: `Debian`.
    - `architecture`: `x86_64`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/facts.json'` — zeigt family Debian, architecture x86_64 von jedem verwalteten Host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/facts.json'` — zeigt Berechtigungen `-rw-r--r--` für alle drei entfernten Dateien.

  Die Prüfung bestätigt den Faktendatensatz, nicht die Art seiner Erhebung.
debrief: Bei den gesammelten Host-Fakten handelt es sich um Daten aus der Remote-Ausführung von Python/module. Durch
  die Aktivierung der Sammlung wurden die undefinierten Werte behoben, während ein maschinenlesbarer JSON-Datensatz
  erhalten blieb.
