title: Fakten
brief: 'Das Flotteninventar ist vorhanden, aber rollout.yml versucht, Fakten zu verwalteten Hosts darzustellen,
  ohne sie zu sammeln. Aktivieren Sie die entsprechende Faktensammlung und liefern Sie /srv/site/facts.json
  an allen drei Zielen. Ihre unterstützte Plattform ist Debian auf x86_64; inspect setup Fakten, die dies
  bestätigen.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Jedes Ziel hat einen Modus-0644 JSON-Faktendatensatz mit family Debian
  und architecture x86_64.'
debrief: Bei den gesammelten Host-Fakten handelt es sich um Daten aus der Remote-Ausführung von Python/module.
  Durch die Aktivierung der Sammlung wurden die undefinierten Werte behoben, während ein maschinenlesbarer
  JSON-Datensatz erhalten blieb.
stages.0.brief: 'Die Fakten müssen von jedem verwalteten Host stammen, nicht von der Workstation-Umgebung.


  Erfolgskriterien: Jedes Ziel hat einen Modus-0644 JSON-Faktendatensatz mit family Debian und architecture
  x86_64.'
stages.0.objectives.0.text: Jedes Ziel hat einen Modus-0644 JSON-Faktendatensatz mit family Debian und
  architecture x86_64.
hints.0.text: Führen Sie eine fokussierte setup-Abfrage für fleet aus.
hints.1.text: Schauen Sie sich die gather_facts-Einstellung auf Spielebene an.
hints.2.text: Die ansible_facts-Zuordnung wird vor der Vorlagenerstellung für jedes Ziel ausgefüllt.
phrases.0: Ich habe Fakten von den verwalteten Gastgebern gesammelt.
phrases.1: Ich habe die Fakten zur Arbeitsstation von den Fakten zum Ziel getrennt gehalten.
phrases.2: Ich habe die generierte hostspezifische Konfiguration überprüft.
