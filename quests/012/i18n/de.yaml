title: Fakten
brief: "Der Plattformbericht der verwalteten Hosts ist nicht verfügbar.\n\nArbeiten Sie auf der Workstation\
  \ in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n- JSON-Datensatz\
  \ auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/facts.json`.\n  - `family`:\
  \ `Debian`.\n  - `architecture`: `x86_64`.\n- Zugriffsmodus: `0644`.\n\nDie Prüfung bestätigt den Faktendatensatz,\
  \ nicht die Art seiner Erhebung.\n"
debrief: Bei den gesammelten Host-Fakten handelt es sich um Daten aus der Remote-Ausführung von Python/module.
  Durch die Aktivierung der Sammlung wurden die undefinierten Werte behoben, während ein maschinenlesbarer
  JSON-Datensatz erhalten blieb.
stages.0.brief: Die Plattformdatensätze müssen auf den verwalteten Hosts verfügbar sein.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) nennt `/srv/site/facts.json`
  Familie `Debian` und Architektur `x86_64`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/facts.json`
  den Modus `0644`.
hints.0.text: Ein Plattformbericht muss die verwalteten Hosts statt der Steuer-Workstation beschreiben.
hints.1.text: 'Schauen Sie sich die gather_facts-Einstellung auf Spielebene an.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.setup

  ```'
hints.2.text: 'Führen Sie eine fokussierte setup-Abfrage für fleet aus. Erheben Sie Daten der verwalteten Hosts
  statt Workstation-Fakten.


  Die ansible_facts-Zuordnung wird vor der Vorlagenerstellung für jedes Ziel ausgefüllt.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/facts.json''`
  — zeigt family Debian, architecture x86_64 von jedem verwalteten Host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/facts.json''` — zeigt Berechtigungen
  `-rw-r--r--` für alle drei entfernten Dateien.'
phrases.0: Ich habe Fakten von den verwalteten Gastgebern gesammelt.
phrases.1: Ich habe die Fakten zur Arbeitsstation von den Fakten zum Ziel getrennt gehalten.
phrases.2: Ich habe die generierte hostspezifische Konfiguration überprüft.
