diagnostics.mode_1: |-
  Die Datei auf app1 kann falsche Berechtigungen behalten, wenn die Copy-Aufgabe einen anderen Modus setzt oder auf dem Host nicht abgeschlossen wurde. [Leitfaden](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.mode_2: |-
  Die Datei auf app2 kann falsche Berechtigungen behalten, wenn die Copy-Aufgabe einen anderen Modus setzt oder auf dem Host nicht abgeschlossen wurde. [Leitfaden](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.mode_3: |-
  Die Datei auf app3 kann falsche Berechtigungen behalten, wenn die Copy-Aufgabe einen anderen Modus setzt oder auf dem Host nicht abgeschlossen wurde. [Leitfaden](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.probe_0_0: |-
  Die Prüfung kann einen entfernten Faktendatensatz möglicherweise nicht lesen oder verarbeiten. Prüfen Sie die Ergebnisse des Plays und die lesbare JSON-Datei auf jedem Host. [Leitfaden](guides#guide=ansible-5&section=fleet-fact-records)
diagnostics.probe_0_1: |-
  Die Modusprüfung benötigt Zugriff auf jeden verwalteten Host und auf die Metadaten der vom Play kopierten Datei. [Leitfaden](guides#guide=ansible-5&section=fleet-fact-records)
