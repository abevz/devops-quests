title: Docker Container-Lebenszyklus
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Im privaten Daemon fehlte ein route worker. Arbeiten
  Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingänge in `~/quest`: `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Der laufende rail-worker wird im Status verfolgt.'
stages.0.brief: 'Erstellen Sie rail-worker über das mitgelieferte Docker resource.


  Erfolgskriterien: Der laufende rail-worker wird im Status verfolgt.'
stages.0.objectives.0.text: Der laufende rail-worker wird im Status verfolgt.
hints.0.text: Vergleichen Sie den Zustand tofu list mit docker ps -a.
hints.1.text: Die bereitgestellte Konfiguration deklariert docker_container.worker.
hints.2.text: Wenden Sie plan an und überprüfen Sie dann den laufenden rail-worker und seine Statusadresse.
debrief: Der Docker resource wurde deklariert, fehlte jedoch. Sie haben plan angewendet und sowohl den
  laufenden Container als auch seine Statusadresse überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
