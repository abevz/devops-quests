title: Docker Container-Lebenszyklus
brief: |
  SignalRail kann seinen Routenverarbeiter nicht nutzen.

  Arbeiten Sie in `~/quest` mit `main.tf`.

  **Anforderungen:**
  - Der OpenTofu-State enthält die Ressourcenadresse:
    - `docker_container.worker`.
  - Der Container im privaten Docker-Daemon hat:
    - Name: `rail-worker`.
    - Zustand: läuft (`State.Running` ist `true`).

  **Selbstprüfung vor Check & finish:**
  - `docker inspect rail-worker --format '{{.State.Running}}'` — gibt `true` aus: Der Container läuft.
  - `tofu plan -input=false -detailed-exitcode -no-color` — endet mit Code `0`: OpenTofu meldet keine Änderungen zwischen Infrastruktur und Konfiguration.
stages.0.brief: |
  Der Routenverarbeiter muss im privaten Docker-Daemon verfügbar sein.
stages.0.objectives.0.text: Der laufende rail-worker wird im Status verfolgt.
hints.0.text: Vergleichen Sie den Zustand tofu list mit docker ps -a.
hints.1.text: Die bereitgestellte Konfiguration deklariert docker_container.worker.
hints.2.text: |
  Erstellen Sie rail-worker über die bereitgestellte Docker-Ressource. Wenden Sie den Plan an und prüfen Sie den laufenden rail-worker und seine State-Adresse.
debrief: Der Docker resource wurde deklariert, fehlte jedoch. Sie haben plan angewendet und sowohl den
  laufenden Container als auch seine Statusadresse überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
