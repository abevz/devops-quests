title: Docker container lifecycle
brief: 'You joined SignalRail operations. A route worker was missing from the private daemon. Work in
  ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The running rail-worker is tracked in state.'
stages.0.brief: 'Create rail-worker through the supplied Docker resource.


  Success criteria: The running rail-worker is tracked in state.'
stages.0.objectives.0.text: The running rail-worker is tracked in state.
hints.0.text: Compare tofu state list with docker ps -a.
hints.1.text: The supplied configuration declares docker_container.worker.
hints.2.text: Apply the plan, then verify the running rail-worker and its state address.
debrief: The Docker resource was declared but absent. You applied the plan and verified both the running
  container and its state address.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
