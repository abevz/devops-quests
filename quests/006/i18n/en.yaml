title: Docker container lifecycle
brief: |
  SignalRail cannot use its route processing container.

  Work in `~/quest` with `main.tf`.

  **Requirements:**
  - OpenTofu state contains the resource address:
    - `docker_container.worker`.
  - The container in the private Docker daemon has:
    - Name: `rail-worker`.
    - State: running (`State.Running` is `true`).

  **Verify yourself before Check & finish:**
  - `docker inspect rail-worker --format '{{.State.Running}}'` — prints `true`: the container is running.
  - `tofu plan -input=false -detailed-exitcode -no-color` — exits with code `0`: OpenTofu reports no changes between the infrastructure and its configuration.
stages.0.brief: |
  The route processing container must be available in the private Docker daemon.
hints.0.text: Compare tofu state list with docker ps -a.
hints.1.text: The supplied configuration declares docker_container.worker.
hints.2.text: |
  Use the supplied Docker resource to create rail-worker. Apply the plan, then verify the running rail-worker and its state address.
debrief: The Docker resource was declared but absent. You applied the plan and verified both the running container
  and its state address.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
stages.0.objectives.0.text: OpenTofu state includes `docker_container.worker`.
stages.0.objectives.1.text: In the private Docker daemon, `rail-worker` is running.
