title: Ciclo de vida del contenedor Docker
brief: 'SignalRail no puede utilizar su procesador de rutas.


  Trabaja en `~/quest` con `main.tf`.


  **Requisitos:**

  - El estado de OpenTofu incluye `docker_container.worker`.

  - En el daemon privado de Docker, `rail-worker` está en ejecución.

  '
stages.0.brief: El procesador de rutas debe estar disponible en el demonio privado de Docker.
hints.0.text: La configuración, el registro en el state y la disponibilidad real del contenedor son observaciones
  distintas.
hints.1.text: 'Compare el estado tofu list con docker ps -a.


  La configuración suministrada declara docker_container.worker.


  Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf

  tofu state list

  docker ps -a

  ```'
hints.2.text: 'Crea rail-worker mediante el recurso Docker suministrado. Aplica el plan y verifica el rail-worker
  en ejecución y su dirección en el estado.


  Verifica el resultado observado:


  - `docker inspect rail-worker --format ''{{.State.Running}}''` — imprime `true`: el contenedor está en ejecución.


  - `tofu plan -input=false -detailed-exitcode -no-color` — termina con el código `0`: OpenTofu no detecta
  cambios entre la infraestructura y su configuración.'
debrief: El Docker resource fue declarado pero ausente. Aplicó el plan y verificó tanto el contenedor en ejecución
  como su dirección de estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
stages.0.objectives.0.text: El estado de OpenTofu incluye `docker_container.worker`.
stages.0.objectives.1.text: En el daemon privado de Docker, `rail-worker` está en ejecución.
