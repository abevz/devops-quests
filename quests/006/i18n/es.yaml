title: Ciclo de vida del contenedor Docker
brief: |
  SignalRail no puede utilizar su procesador de rutas.

  Trabaja en `~/quest` con `main.tf`.

  **Requisitos:**
  - El estado de OpenTofu contiene la dirección del recurso:
    - `docker_container.worker`.
  - El contenedor en el demonio privado de Docker tiene:
    - Nombre: `rail-worker`.
    - Estado: en ejecución (`State.Running` es `true`).

  **Verifica antes de Check & finish:**
  - `docker inspect rail-worker --format '{{.State.Running}}'` — imprime `true`: el contenedor está en ejecución.
  - `tofu plan -input=false -detailed-exitcode -no-color` — termina con el código `0`: OpenTofu no detecta cambios entre la infraestructura y su configuración.
stages.0.brief: |
  El procesador de rutas debe estar disponible en el demonio privado de Docker.
hints.0.text: Compare el estado tofu list con docker ps -a.
hints.1.text: La configuración suministrada declara docker_container.worker.
hints.2.text: |
  Crea rail-worker mediante el recurso Docker suministrado. Aplica el plan y verifica el rail-worker en ejecución y su dirección en el estado.
debrief: El Docker resource fue declarado pero ausente. Aplicó el plan y verificó tanto el contenedor en ejecución
  como su dirección de estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
stages.0.objectives.0.text: El estado de OpenTofu incluye `docker_container.worker`.
stages.0.objectives.1.text: En el daemon privado de Docker, `rail-worker` está en ejecución.
