title: Ciclo de vida del contenedor Docker
brief: 'Te uniste a las operaciones de SignalRail. Faltaba un route worker en el demonio privado. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Se realiza un seguimiento del estado del rail-worker en ejecución.'
stages.0.brief: 'Cree rail-worker a través del Docker resource suministrado.


  Criterios de éxito: Se realiza un seguimiento del estado del rail-worker en ejecución.'
stages.0.objectives.0.text: Se realiza un seguimiento del estado del rail-worker en ejecución.
hints.0.text: Compare el estado tofu list con docker ps -a.
hints.1.text: La configuración suministrada declara docker_container.worker.
hints.2.text: Aplique el plan, luego verifique el rail-worker en ejecución y su dirección de estado.
debrief: El Docker resource fue declarado pero ausente. Aplicó el plan y verificó tanto el contenedor
  en ejecución como su dirección de estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
