title: Cykl życia kontenera Docker
brief: |
  SignalRail nie może korzystać ze swojego procesora trasy.

  Pracuj w `~/quest` z plikiem `main.tf`.

  **Wymagania:**
  - Stan OpenTofu zawiera adres zasobu:
    - `docker_container.worker`.
  - Kontener w prywatnym demonie Docker ma:
    - Nazwę: `rail-worker`.
    - Stan: uruchomiony (`State.Running` ma wartość `true`).

  **Sprawdź przed Check & finish:**
  - `tofu state list` — zawiera dokładny adres `docker_container.worker`.
  - `docker inspect rail-worker --format '{{.State.Running}}'` — wypisuje `true`.
stages.0.brief: |
  Procesor trasy musi być dostępny w prywatnym demonie Docker.
stages.0.objectives.0.text: Działający rail-worker jest śledzony w state.
hints.0.text: Porównaj tofu state list z docker ps -a.
hints.1.text: Dostarczona konfiguracja deklaruje docker_container.worker.
hints.2.text: |
  Utwórz rail-worker za pomocą dostarczonego zasobu Docker. Zastosuj plan, następnie sprawdź działający rail-worker i jego adres w stanie.
debrief: Docker resource został zadeklarowany, ale nieobecny. Zastosowałeś plan i zweryfikowałeś zarówno
  działający kontener, jak i jego adres state.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
