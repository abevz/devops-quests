title: Cykl życia kontenera Docker
brief: 'SignalRail nie może korzystać ze swojego procesora trasy.


  Pracuj w `~/quest` z plikiem `main.tf`.


  **Wymagania:**

  - Stan OpenTofu zawiera `docker_container.worker`.

  - W prywatnym daemonie Docker kontener `rail-worker` działa.

  '
stages.0.brief: Procesor trasy musi być dostępny w prywatnym demonie Docker.
hints.0.text: Konfiguracja, śledzenie w state i dostępność działającego kontenera to różne obserwacje.
hints.1.text: 'Porównaj tofu state list z docker ps -a.


  Dostarczona konfiguracja deklaruje docker_container.worker.


  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf

  tofu state list

  docker ps -a

  ```'
hints.2.text: 'Utwórz rail-worker za pomocą dostarczonego zasobu Docker. Zastosuj plan, następnie sprawdź działający
  rail-worker i jego adres w stanie.


  Sprawdź obserwowany wynik:


  - `docker inspect rail-worker --format ''{{.State.Running}}''` — wypisuje `true`: kontener jest uruchomiony.


  - `tofu plan -input=false -detailed-exitcode -no-color` — kończy się kodem `0`: OpenTofu nie wykrywa zmian
  między infrastrukturą a jej konfiguracją.'
debrief: Docker resource został zadeklarowany, ale nieobecny. Zastosowałeś plan i zweryfikowałeś zarówno działający
  kontener, jak i jego adres state.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
stages.0.objectives.0.text: Stan OpenTofu zawiera `docker_container.worker`.
stages.0.objectives.1.text: W prywatnym daemonie Docker kontener `rail-worker` działa.
