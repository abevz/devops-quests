title: Cykl życia kontenera Docker
brief: 'Dołączyłeś do operacji SignalRail. W demonie prywatnym brakowało worker trasy. Pracuj w ~/quest.
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: działający rail-worker jest śledzony w state.'
stages.0.brief: 'Utwórz rail-worker za pomocą dostarczonego Docker resource.


  Kryteria sukcesu: Działający rail-worker jest śledzony w state.'
stages.0.objectives.0.text: Działający rail-worker jest śledzony w state.
hints.0.text: Porównaj tofu state list z docker ps -a.
hints.1.text: Dostarczona konfiguracja deklaruje docker_container.worker.
hints.2.text: Zastosuj plan, następnie sprawdź działający rail-worker i jego adres state.
debrief: Docker resource został zadeklarowany, ale nieobecny. Zastosowałeś plan i zweryfikowałeś zarówno
  działający kontener, jak i jego adres state.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
