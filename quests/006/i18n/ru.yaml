title: Жизненный цикл Docker-контейнера
brief: 'Вы в команде эксплуатации SignalRail. В приватном Docker отсутствовал рабочий контейнер. Работайте
  в ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Работающий rail-worker записан в state.'
stages.0.brief: 'Создайте rail-worker через подготовленный Docker resource.


  Результат проверки: Работающий rail-worker записан в state.'
stages.0.objectives.0.text: Работающий rail-worker записан в state.
hints.0.text: Сравните tofu state list и docker ps -a.
hints.1.text: Конфигурация объявляет docker_container.worker.
hints.2.text: Примените plan и проверьте работающий rail-worker и адрес в state.
debrief: Docker resource был объявлен, но отсутствовал. Вы применили plan, проверили работающий контейнер
  и его адрес в state.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
