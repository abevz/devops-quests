title: Жизненный цикл Docker-контейнера
brief: |
  SignalRail не может использовать свой обработчик маршрута.

  Работайте в `~/quest` с файлом `main.tf`.

  **Требования:**
  - State OpenTofu содержит адрес ресурса:
    - `docker_container.worker`.
  - Контейнер в приватном Docker имеет:
    - Имя: `rail-worker`.
    - Состояние: запущен (`State.Running` равно `true`).

  **Самопроверка перед Check & finish:**
  - `docker inspect rail-worker --format '{{.State.Running}}'` — выводит `true`: контейнер запущен.
  - `tofu plan -input=false -detailed-exitcode -no-color` — завершается с кодом `0`: OpenTofu не находит изменений между инфраструктурой и её конфигурацией.
stages.0.brief: |
  Обработчик маршрута должен быть доступен в приватном Docker.
hints.0.text: Сравните tofu state list и docker ps -a.
hints.1.text: Конфигурация объявляет docker_container.worker.
hints.2.text: |
  Используйте подготовленный Docker resource, чтобы создать rail-worker. Примените plan и проверьте работающий rail-worker и адрес в state.
debrief: Docker resource был объявлен, но отсутствовал. Вы применили plan, проверили работающий контейнер и его
  адрес в state.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
stages.0.objectives.0.text: Состояние OpenTofu содержит `docker_container.worker`.
stages.0.objectives.1.text: В приватном Docker daemon контейнер `rail-worker` работает.
