title: Error handling
brief: 'The diagnostic alias offline points to 127.0.0.1:1 and is intentionally unavailable.
  Do not repair it or modify the healthy fleet. Keep its failure visible while continuing
  safe checks for app1–app3. Save stdout to probe.log and write safety-check.txt on
  localhost.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `offline.ini`,
  `ansible.cfg`, `rollout.yml`, `probe.log`, `safety-check.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: probe.log shows UNREACHABLE and all three healthy targets
  finish without failure.'
debrief: The failed connection remained visible while safe diagnostic work continued.
stages.0.brief: 'Success criteria: probe.log shows UNREACHABLE and all three healthy
  targets finish without failure.'
stages.0.objectives.0.text: probe.log shows UNREACHABLE and all three healthy targets
  finish without failure.
hints.0.text: Unreachable is a connection outcome, not a normal module failure.
hints.1.text: Limit ignore_unreachable to this safe diagnostic.
hints.2.text: Check each healthy host in the recap.
phrases.0: I separated unreachable hosts from task failures.
phrases.1: I kept healthy targets progressing after the expected unreachable probe.
phrases.2: I inspected both the unreachable evidence and the healthy-host recap.
