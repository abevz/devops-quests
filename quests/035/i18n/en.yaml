title: Error handling
brief: |-
  A diagnostic must retain a connection failure while healthy hosts complete their checks.

  Work on the workstation in `~/quest` with `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Workstation and execution results:
    - On the workstation, safety-check.txt contains healthy fleet checked.
    - The workstation probe.log includes UNREACHABLE evidence.
    - The app1, app2 and app3 recap entries in probe.log report unreachable=0 and failed=0.

  **Verify yourself before Check & finish:**
  - `cat ~/quest/safety-check.txt` — healthy fleet checked.
  - `cat ~/quest/probe.log` — contains UNREACHABLE and app1/app2/app3 recaps with unreachable=0 and failed=0.
debrief: The failed connection remained visible while safe diagnostic work continued.
stages.0.brief: Connection-failure evidence and successful healthy-host checks must coexist.
stages.0.objectives.0.text: On the workstation, safety-check.txt contains healthy fleet checked.
stages.0.objectives.1.text: The workstation probe.log includes UNREACHABLE evidence.
stages.0.objectives.2.text: The app1, app2 and app3 recap entries in probe.log report unreachable=0 and failed=0.
hints.0.text: Unreachable is a connection outcome, not a normal module failure.
hints.1.text: Limit ignore_unreachable to this safe diagnostic. The offline alias at 127.0.0.1:1 is intentionally
  unavailable; do not repair it or alter the healthy fleet.
hints.2.text: Check each healthy host in the recap.
phrases.0: I separated unreachable hosts from task failures.
phrases.1: I kept healthy targets progressing after the expected unreachable probe.
phrases.2: I inspected both the unreachable evidence and the healthy-host recap.
