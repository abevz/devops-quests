title: Error handling
brief: 'A diagnostic must retain a connection failure while healthy hosts complete their checks.


  Work on the workstation in `~/quest` with `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.


  **Requirements:**

  Evidence on the workstation:


  - `~/quest/safety-check.txt`: `healthy fleet checked`.

  - `~/quest/probe.log` includes `UNREACHABLE`.

  - Healthy-host recaps in that log: `app1`, `app2`, `app3`, each with `unreachable=0`, `failed=0`.

  '
debrief: The failed connection remained visible while safe diagnostic work continued.
stages.0.brief: Connection-failure evidence and successful healthy-host checks must coexist.
stages.0.objectives.0.text: On the workstation, safety-check.txt contains healthy fleet checked.
stages.0.objectives.1.text: The workstation probe.log includes UNREACHABLE evidence.
stages.0.objectives.2.text: The app1, app2 and app3 recap entries in probe.log report unreachable=0 and failed=0.
hints.0.text: Unreachable is a connection outcome, not a normal module failure.
hints.1.text: 'Inspect the supplied inputs and execution scope:


  ```sh

  cat inventory.ini offline.ini rollout.yml

  ```'
hints.2.text: 'Limit ignore_unreachable to this safe diagnostic. The offline alias at 127.0.0.1:1 is intentionally
  unavailable; do not repair it or alter the healthy fleet.


  Check each healthy host in the recap.


  Verify the observed result:


  - `cat ~/quest/safety-check.txt` — healthy fleet checked.


  - `cat ~/quest/probe.log` — contains UNREACHABLE and app1/app2/app3 recaps with unreachable=0 and failed=0.'
phrases.0: I separated unreachable hosts from task failures.
phrases.1: I kept healthy targets progressing after the expected unreachable probe.
phrases.2: I inspected both the unreachable evidence and the healthy-host recap.
diagnostics.safety_record: An aborted play or a missing localhost copy task may leave safety-check.txt absent or stale; an unreadable file also fails. [Cause and check](guides#guide=ansible-9&section=healthy-safety-record)
diagnostics.probe_0_1: The play may have omitted the intentionally offline target or its captured unreachable event; an unreadable log, malformed records or Python startup can also fail. [Cause and check](guides#guide=ansible-9&section=retained-unreachable-evidence)
diagnostics.probe_0_2: Python or the recap helper may fail before host diagnostics, for example while parsing malformed log records. [Cause and check](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_1: The app1 recap may be missing or report failed/unreachable tasks; an unreadable or unrecognized log also prevents finding its row. [Cause and check](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_2: The app2 recap may be missing or report failed/unreachable tasks; an unreadable or unrecognized log also prevents finding its row. [Cause and check](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_3: The app3 recap may be missing or report failed/unreachable tasks; an unreadable or unrecognized log also prevents finding its row. [Cause and check](guides#guide=ansible-9&section=healthy-host-recaps)
