title: Обработка ошибок
brief: |-
  Диагностика должна сохранять свидетельство ошибки соединения, пока исправные хосты завершают проверки.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Результаты на workstation и результаты выполнения:
    - На workstation safety-check.txt содержит healthy fleet checked.
    - Файл probe.log на workstation содержит свидетельство UNREACHABLE.
    - Сводки app1, app2 и app3 в probe.log сообщают unreachable=0 и failed=0.

  **Самопроверка перед Check & finish:**
  - `cat ~/quest/safety-check.txt` — healthy fleet checked.
  - `cat ~/quest/probe.log` — содержит UNREACHABLE и сводки app1/app2/app3 с unreachable=0 и failed=0.
debrief: Сбой связи остался видимым, безопасная диагностика продолжилась.
stages.0.brief: Свидетельство ошибки соединения должно сохраняться вместе с успешными проверками исправных хостов.
stages.0.objectives.0.text: На workstation safety-check.txt содержит healthy fleet checked.
stages.0.objectives.1.text: Файл probe.log на workstation содержит свидетельство UNREACHABLE.
stages.0.objectives.2.text: Сводки app1, app2 и app3 в probe.log сообщают unreachable=0 и failed=0.
hints.0.text: Unreachable — результат соединения, а не обычная ошибка модуля.
hints.1.text: Ограничьте ignore_unreachable этой безопасной диагностикой. Псевдоним offline по адресу 127.0.0.1:1
  намеренно недоступен; не исправляйте его и не меняйте исправные хосты.
hints.2.text: Проверьте recap каждой исправной цели.
phrases.0: Я отделил недоступные узлы от ошибок задач.
phrases.1: Я сохранил выполнение на здоровых узлах после ожидаемой проверки недоступности.
phrases.2: Я проверил свидетельство недоступности и recap здоровых узлов.
