title: Обработка ошибок
brief: 'Диагностика должна сохранять свидетельство ошибки соединения, пока исправные хосты завершают проверки.


  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.


  **Требования:**

  Свидетельства на workstation:


  - `~/quest/safety-check.txt`: `healthy fleet checked`.

  - `~/quest/probe.log` содержит `UNREACHABLE`.

  - Сводки исправных хостов в этом журнале: `app1`, `app2`, `app3`, у каждого `unreachable=0`, `failed=0`.

  '
debrief: Сбой связи остался видимым, безопасная диагностика продолжилась.
stages.0.brief: Свидетельство ошибки соединения должно сохраняться вместе с успешными проверками исправных
  хостов.
stages.0.objectives.0.text: На workstation safety-check.txt содержит healthy fleet checked.
stages.0.objectives.1.text: Файл probe.log на workstation содержит свидетельство UNREACHABLE.
stages.0.objectives.2.text: Сводки app1, app2 и app3 в probe.log сообщают unreachable=0 и failed=0.
hints.0.text: Unreachable — результат попытки соединения, а не обычная ошибка модуля.
hints.1.text: 'Изучите поставленные входные данные и область выполнения:


  ```sh

  cat inventory.ini offline.ini rollout.yml

  ```'
hints.2.text: 'Ограничьте ignore_unreachable этой безопасной диагностикой. Псевдоним offline по адресу 127.0.0.1:1
  намеренно недоступен; не исправляйте его и не меняйте исправные хосты.


  Проверьте recap каждой исправной цели.


  Проверьте наблюдаемый результат:


  - `cat ~/quest/safety-check.txt` — healthy fleet checked.


  - `cat ~/quest/probe.log` — содержит UNREACHABLE и сводки app1/app2/app3 с unreachable=0 и failed=0.'
phrases.0: Я отделил недоступные узлы от ошибок задач.
phrases.1: Я сохранил выполнение на здоровых узлах после ожидаемой проверки недоступности.
phrases.2: Я проверил свидетельство недоступности и recap здоровых узлов.
diagnostics.recap_1: 'Workstation probe.log: app1 должен сообщать unreachable=0 и failed=0.'
diagnostics.recap_2: 'Workstation probe.log: app2 должен сообщать unreachable=0 и failed=0.'
diagnostics.recap_3: 'Workstation probe.log: app3 должен сообщать unreachable=0 и failed=0.'
diagnostics.recap_count: Файл probe.log на workstation должен содержать три требуемые сводки исправных хостов.
