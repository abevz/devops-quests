title: Обработка ошибок
brief: 'Диагностический alias offline намеренно указывает на недоступный 127.0.0.1:1.
  Не исправляйте его и не меняйте исправный парк. Сохраните видимость сбоя и продолжите
  безопасные проверки app1–app3. Сохраните stdout в probe.log, создайте safety-check.txt
  на localhost.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`,
  `offline.ini`, `ansible.cfg`, `rollout.yml`, `probe.log`, `safety-check.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: probe.log показывает UNREACHABLE, три исправные цели завершаются
  без failure.'
debrief: Сбой связи остался видимым, безопасная диагностика продолжилась.
stages.0.brief: 'Результат проверки: probe.log показывает UNREACHABLE, три исправные
  цели завершаются без failure.'
stages.0.objectives.0.text: probe.log показывает UNREACHABLE, три исправные цели завершаются
  без failure.
hints.0.text: Unreachable — результат соединения, а не обычная ошибка модуля.
hints.1.text: Ограничьте ignore_unreachable этой безопасной диагностикой.
hints.2.text: Проверьте recap каждой исправной цели.
phrases.0: Я отделил недоступные узлы от ошибок задач.
phrases.1: Я сохранил выполнение на здоровых узлах после ожидаемой проверки недоступности.
phrases.2: Я проверил свидетельство недоступности и recap здоровых узлов.
