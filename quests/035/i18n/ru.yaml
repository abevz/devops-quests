title: Обработка ошибок
brief: 'Диагностика должна сохранять свидетельство ошибки соединения, пока исправные хосты завершают проверки.


  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.


  **Требования:**

  Свидетельства на workstation:


  - `~/quest/safety-check.txt`: `healthy fleet checked`.

  - `~/quest/probe.log` содержит `UNREACHABLE`.

  - Сводки исправных хостов в этом журнале: `app1`, `app2`, `app3`, у каждого `unreachable=0`, `failed=0`.

  '
debrief: Сбой связи остался видимым, безопасная диагностика продолжилась.
stages.0.brief: Свидетельство ошибки соединения должно сохраняться вместе с успешными проверками исправных
  хостов.
stages.0.objectives.0.text: На workstation safety-check.txt содержит healthy fleet checked.
stages.0.objectives.1.text: Файл probe.log на workstation содержит свидетельство UNREACHABLE.
stages.0.objectives.2.text: Сводки app1, app2 и app3 в probe.log сообщают unreachable=0 и failed=0.
hints.0.text: Unreachable — результат попытки соединения, а не обычная ошибка модуля.
hints.1.text: |-
  Изучите поставленные входные данные и область выполнения:

  Ограничьте ignore_unreachable этой безопасной диагностикой. Псевдоним offline по адресу 127.0.0.1:1 намеренно недоступен; не исправляйте его и не меняйте исправные хосты.

  ```sh
  cat inventory.ini
  cat offline.ini
  cat rollout.yml
  ```
hints.2.text: |-
  Проверьте recap каждой исправной цели.

  Проверьте наблюдаемый результат:

  - `cat ~/quest/safety-check.txt` — healthy fleet checked.

  - `cat ~/quest/probe.log` — содержит UNREACHABLE и сводки app1/app2/app3 с unreachable=0 и failed=0.
phrases.0: Я отделил недоступные узлы от ошибок задач.
phrases.1: Я сохранил выполнение на здоровых узлах после ожидаемой проверки недоступности.
phrases.2: Я проверил свидетельство недоступности и recap здоровых узлов.
diagnostics.safety_record: Прерванный play или отсутствующая задача копирования на localhost могут оставить safety-check.txt отсутствующим или устаревшим; ошибка чтения также даёт отказ. [Причина и проверка](guides#guide=ansible-9&section=healthy-safety-record)
diagnostics.probe_0_1: Play мог пропустить намеренно недоступную цель или её событие unreachable в записи; нечитаемый журнал, неверные записи или запуск Python также могут дать отказ. [Причина и проверка](guides#guide=ansible-9&section=retained-unreachable-evidence)
diagnostics.probe_0_2: Python или модуль recap может завершиться ошибкой до диагностики хостов, например при разборе неверных записей журнала. [Причина и проверка](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_1: Строка recap app1 может отсутствовать или содержать failed/unreachable; нечитаемый или нераспознанный журнал также мешает найти строку. [Причина и проверка](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_2: Строка recap app2 может отсутствовать или содержать failed/unreachable; нечитаемый или нераспознанный журнал также мешает найти строку. [Причина и проверка](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_3: Строка recap app3 может отсутствовать или содержать failed/unreachable; нечитаемый или нераспознанный журнал также мешает найти строку. [Причина и проверка](guides#guide=ansible-9&section=healthy-host-recaps)
