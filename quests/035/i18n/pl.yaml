title: Obsługa błędów
brief: 'Diagnostyka alias offline wskazuje 127.0.0.1:1 i jest celowo niedostępna. Nie naprawiaj go ani
  nie modyfikuj sprawnej floty. Zachowaj widoczność swojego failure, kontynuując bezpieczne kontrole app1–app3.
  Zapisz stdout do probe.log i napisz safety-check.txt na localhost.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `offline.ini`,
  `ansible.cfg`, `rollout.yml`, `probe.log`, `safety-check.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: probe.log pokazuje UNREACHABLE, a wszystkie trzy zdrowe cele kończą się
  bez failure.'
debrief: Nieudane połączenie pozostało widoczne podczas kontynuowania bezpiecznych prac diagnostycznych.
stages.0.brief: 'Kryteria sukcesu: probe.log pokazuje UNREACHABLE, a wszystkie trzy zdrowe cele kończą
  się bez failure.'
stages.0.objectives.0.text: probe.log pokazuje UNREACHABLE i wszystkie trzy zdrowe cele kończą się bez
  failure.
hints.0.text: Unreachable to wynik połączenia, a nie zwykła awaria modułu.
hints.1.text: Ogranicz ignore_unreachable do tej bezpiecznej diagnostyki.
hints.2.text: Sprawdź każdy zdrowy host w recap.
phrases.0: Oddzieliłem nieosiągalne hosty od błędów zadań.
phrases.1: Utrzymywałem postęp zdrowych celów po oczekiwanej nieosiągalnej sondzie.
phrases.2: Sprawdziłem zarówno nieosiągalne dowody, jak i zdrowego hosta recap.
