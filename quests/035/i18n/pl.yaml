title: Obsługa błędów
brief: 'Diagnostyka musi zachować informację o błędzie połączenia, gdy sprawne hosty kończą kontrole.


  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.


  **Wymagania:**

  Dowody na workstation:


  - `~/quest/safety-check.txt`: `healthy fleet checked`.

  - `~/quest/probe.log` zawiera `UNREACHABLE`.

  - Podsumowania sprawnych hostów w tym logu: `app1`, `app2`, `app3`, każdy z `unreachable=0`, `failed=0`.

  '
debrief: Nieudane połączenie pozostało widoczne podczas kontynuowania bezpiecznych prac diagnostycznych.
stages.0.brief: Dowód błędu połączenia musi współistnieć z pomyślnymi kontrolami sprawnych hostów.
stages.0.objectives.0.text: Na workstation safety-check.txt zawiera healthy fleet checked.
stages.0.objectives.1.text: Plik probe.log na workstation zawiera dowód UNREACHABLE.
stages.0.objectives.2.text: Podsumowania app1, app2 i app3 w probe.log zgłaszają unreachable=0 i failed=0.
hints.0.text: Unreachable to wynik połączenia, a nie zwykły błąd modułu.
hints.1.text: |-
  Sprawdź dostarczone dane wejściowe i zakres wykonania:

  Ogranicz ignore_unreachable do tej bezpiecznej diagnostyki. Alias offline pod adresem 127.0.0.1:1 jest celowo niedostępny; nie naprawiaj go ani nie zmieniaj sprawnych hostów.

  ```sh
  cat inventory.ini
  cat offline.ini
  cat rollout.yml
  ```
hints.2.text: |-
  Sprawdź każdy zdrowy host w recap.

  Sprawdź obserwowany wynik:

  - `cat ~/quest/safety-check.txt` — healthy fleet checked.

  - `cat ~/quest/probe.log` — zawiera UNREACHABLE i podsumowania app1/app2/app3 z unreachable=0 i failed=0.
phrases.0: Oddzieliłem nieosiągalne hosty od błędów zadań.
phrases.1: Utrzymywałem postęp zdrowych celów po oczekiwanej nieosiągalnej sondzie.
phrases.2: Sprawdziłem zarówno nieosiągalne dowody, jak i zdrowego hosta recap.
diagnostics.safety_record: Przerwany play lub brak lokalnego zadania copy może pozostawić brakujący lub stary safety-check.txt; błąd odczytu też zawodzi. [Przyczyna i kontrola](guides#guide=ansible-9&section=healthy-safety-record)
diagnostics.probe_0_1: Play mógł pominąć celowo niedostępny host lub jego zapisane zdarzenie unreachable; nieczytelny log, błędne rekordy lub start Pythona też mogą zawieść. [Przyczyna i kontrola](guides#guide=ansible-9&section=retained-unreachable-evidence)
diagnostics.probe_0_2: Python lub moduł recap może zawieść przed diagnostyką hostów, na przykład podczas parsowania błędnych rekordów logu. [Przyczyna i kontrola](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_1: Wiersz recap app1 może nie istnieć lub podawać failed/unreachable; nieczytelny lub nierozpoznany log też uniemożliwia znalezienie wiersza. [Przyczyna i kontrola](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_2: Wiersz recap app2 może nie istnieć lub podawać failed/unreachable; nieczytelny lub nierozpoznany log też uniemożliwia znalezienie wiersza. [Przyczyna i kontrola](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_3: Wiersz recap app3 może nie istnieć lub podawać failed/unreachable; nieczytelny lub nierozpoznany log też uniemożliwia znalezienie wiersza. [Przyczyna i kontrola](guides#guide=ansible-9&section=healthy-host-recaps)
