title: Obsługa błędów
brief: 'Diagnostyka musi zachować informację o błędzie połączenia, gdy sprawne hosty kończą kontrole.


  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.


  **Wymagania:**

  Dowody na workstation:


  - `~/quest/safety-check.txt`: `healthy fleet checked`.

  - `~/quest/probe.log` zawiera `UNREACHABLE`.

  - Podsumowania sprawnych hostów w tym logu: `app1`, `app2`, `app3`, każdy z `unreachable=0`, `failed=0`.

  '
debrief: Nieudane połączenie pozostało widoczne podczas kontynuowania bezpiecznych prac diagnostycznych.
stages.0.brief: Dowód błędu połączenia musi współistnieć z pomyślnymi kontrolami sprawnych hostów.
stages.0.objectives.0.text: Na workstation safety-check.txt zawiera healthy fleet checked.
stages.0.objectives.1.text: Plik probe.log na workstation zawiera dowód UNREACHABLE.
stages.0.objectives.2.text: Podsumowania app1, app2 i app3 w probe.log zgłaszają unreachable=0 i failed=0.
hints.0.text: Unreachable to wynik połączenia, a nie zwykły błąd modułu.
hints.1.text: 'Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat inventory.ini offline.ini rollout.yml

  ```'
hints.2.text: 'Ogranicz ignore_unreachable do tej bezpiecznej diagnostyki. Alias offline pod adresem 127.0.0.1:1
  jest celowo niedostępny; nie naprawiaj go ani nie zmieniaj sprawnych hostów.


  Sprawdź każdy zdrowy host w recap.


  Sprawdź obserwowany wynik:


  - `cat ~/quest/safety-check.txt` — healthy fleet checked.


  - `cat ~/quest/probe.log` — zawiera UNREACHABLE i podsumowania app1/app2/app3 z unreachable=0 i failed=0.'
phrases.0: Oddzieliłem nieosiągalne hosty od błędów zadań.
phrases.1: Utrzymywałem postęp zdrowych celów po oczekiwanej nieosiągalnej sondzie.
phrases.2: Sprawdziłem zarówno nieosiągalne dowody, jak i zdrowego hosta recap.
diagnostics.recap_1: 'Workstation probe.log: app1 musi zgłaszać unreachable=0 i failed=0.'
diagnostics.recap_2: 'Workstation probe.log: app2 musi zgłaszać unreachable=0 i failed=0.'
diagnostics.recap_3: 'Workstation probe.log: app3 musi zgłaszać unreachable=0 i failed=0.'
diagnostics.recap_count: Plik probe.log na workstation musi zawierać trzy wymagane podsumowania sprawnych hostów.
