title: Fehlerbehandlung
brief: 'Eine Diagnose muss einen Verbindungsfehler sichtbar halten, während gesunde Hosts ihre Prüfungen abschließen.


  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.


  **Anforderungen:**

  Nachweise auf der Workstation:


  - `~/quest/safety-check.txt`: `healthy fleet checked`.

  - `~/quest/probe.log` enthält `UNREACHABLE`.

  - Zusammenfassungen gesunder Hosts in diesem Log: `app1`, `app2`, `app3`, jeweils mit `unreachable=0`, `failed=0`.

  '
debrief: Die fehlgeschlagene Verbindung blieb sichtbar, während die sichere Diagnosearbeit fortgesetzt wurde.
stages.0.brief: Verbindungsfehlernachweis und erfolgreiche Prüfungen gesunder Hosts müssen zusammen vorliegen.
stages.0.objectives.0.text: Auf der Workstation enthält safety-check.txt healthy fleet checked.
stages.0.objectives.1.text: Die Workstation-Datei probe.log enthält einen UNREACHABLE-Nachweis.
stages.0.objectives.2.text: Die Zusammenfassungen für app1, app2 und app3 in probe.log melden unreachable=0
  und failed=0.
hints.0.text: Unreachable ist ein Verbindungsergebnis, kein gewöhnlicher Modulfehler.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat inventory.ini offline.ini rollout.yml

  ```'
hints.2.text: 'Beschränken Sie ignore_unreachable auf diese sichere Diagnose. Der Alias offline unter 127.0.0.1:1
  ist absichtlich nicht erreichbar; reparieren Sie ihn nicht und ändern Sie die gesunde Flotte nicht.


  Überprüfen Sie jeden fehlerfreien Host im recap.


  Prüfen Sie das beobachtete Ergebnis:


  - `cat ~/quest/safety-check.txt` — healthy fleet checked.


  - `cat ~/quest/probe.log` — enthält UNREACHABLE und app1/app2/app3-Zusammenfassungen mit unreachable=0 und
  failed=0.'
phrases.0: Ich habe nicht erreichbare Hosts von Aufgabenfehlern getrennt.
phrases.1: Ich habe dafür gesorgt, dass gesunde Ziele nach der erwarteten unerreichbaren Sonde weiter vorankamen.
phrases.2: Ich habe sowohl die unerreichbaren Beweise als auch den gesunden Wirt recap untersucht.
diagnostics.recap_1: 'Workstation probe.log: app1 muss unreachable=0 und failed=0 melden.'
diagnostics.recap_2: 'Workstation probe.log: app2 muss unreachable=0 und failed=0 melden.'
diagnostics.recap_3: 'Workstation probe.log: app3 muss unreachable=0 und failed=0 melden.'
diagnostics.recap_count: Die Workstation-Datei probe.log muss die drei erforderlichen Zusammenfassungen gesunder
  Hosts enthalten.
diagnostics.probe_0_1: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Die Workstation-Datei
  probe.log enthält einen UNREACHABLE-Nachweis.'
diagnostics.probe_0_2: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Die Zusammenfassungen
  für app1, app2 und app3 in probe.log melden unreachable=0 und failed=0.'
