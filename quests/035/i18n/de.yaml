title: Fehlerbehandlung
brief: |-
  Eine Diagnose muss einen Verbindungsfehler sichtbar halten, während gesunde Hosts ihre Prüfungen abschließen.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Workstation- und Ausführungsergebnisse:
    - Auf der Workstation enthält safety-check.txt healthy fleet checked.
    - Die Workstation-Datei probe.log enthält einen UNREACHABLE-Nachweis.
    - Die Zusammenfassungen für app1, app2 und app3 in probe.log melden unreachable=0 und failed=0.

  **Selbstprüfung vor Check & finish:**
  - `cat ~/quest/safety-check.txt` — healthy fleet checked.
  - `cat ~/quest/probe.log` — enthält UNREACHABLE und app1/app2/app3-Zusammenfassungen mit unreachable=0 und failed=0.
debrief: Die fehlgeschlagene Verbindung blieb sichtbar, während die sichere Diagnosearbeit fortgesetzt wurde.
stages.0.brief: Verbindungsfehlernachweis und erfolgreiche Prüfungen gesunder Hosts müssen zusammen vorliegen.
stages.0.objectives.0.text: Auf der Workstation enthält safety-check.txt healthy fleet checked.
stages.0.objectives.1.text: Die Workstation-Datei probe.log enthält einen UNREACHABLE-Nachweis.
stages.0.objectives.2.text: Die Zusammenfassungen für app1, app2 und app3 in probe.log melden unreachable=0 und
  failed=0.
hints.0.text: Unreachable ist ein Verbindungsergebnis, kein normaler Modulfehler.
hints.1.text: Beschränken Sie ignore_unreachable auf diese sichere Diagnose. Der Alias offline unter 127.0.0.1:1
  ist absichtlich nicht erreichbar; reparieren Sie ihn nicht und ändern Sie die gesunde Flotte nicht.
hints.2.text: Überprüfen Sie jeden fehlerfreien Host im recap.
phrases.0: Ich habe nicht erreichbare Hosts von Aufgabenfehlern getrennt.
phrases.1: Ich habe dafür gesorgt, dass gesunde Ziele nach der erwarteten unerreichbaren Sonde weiter vorankamen.
phrases.2: Ich habe sowohl die unerreichbaren Beweise als auch den gesunden Wirt recap untersucht.
