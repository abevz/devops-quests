title: Fehlerbehandlung
brief: 'Die Diagnose alias offline zeigt auf 127.0.0.1:1 und ist absichtlich nicht verfügbar. Reparieren
  Sie es nicht und verändern Sie die gesunde Flotte nicht. Halten Sie das failure sichtbar, während Sie
  die sicheren Prüfungen für app1–app3 fortsetzen. Speichern Sie stdout in probe.log und schreiben Sie
  safety-check.txt auf localhost.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `offline.ini`, `ansible.cfg`,
  `rollout.yml`, `probe.log`, `safety-check.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: probe.log zeigt UNREACHABLE und alle drei gesunden Ziele kommen ohne failure
  ins Ziel.'
debrief: Die fehlgeschlagene Verbindung blieb sichtbar, während die sichere Diagnosearbeit fortgesetzt
  wurde.
stages.0.brief: 'Erfolgskriterien: probe.log zeigt UNREACHABLE und alle drei gesunden Ziele kommen ohne
  failure ins Ziel.'
stages.0.objectives.0.text: probe.log zeigt UNREACHABLE und alle drei gesunden Ziele kommen ohne failure
  ins Ziel.
hints.0.text: Unreachable ist ein Verbindungsergebnis, kein normaler Modulfehler.
hints.1.text: Beschränken Sie ignore_unreachable auf diese sichere Diagnose.
hints.2.text: Überprüfen Sie jeden fehlerfreien Host im recap.
phrases.0: Ich habe nicht erreichbare Hosts von Aufgabenfehlern getrennt.
phrases.1: Ich habe dafür gesorgt, dass gesunde Ziele nach der erwarteten unerreichbaren Sonde weiter
  vorankamen.
phrases.2: Ich habe sowohl die unerreichbaren Beweise als auch den gesunden Wirt recap untersucht.
