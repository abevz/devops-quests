title: Manejo de errores
brief: |-
  Un diagnóstico debe conservar un fallo de conexión mientras los hosts sanos completan sus comprobaciones.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Resultados en la workstation y de ejecución:
    - En la workstation, safety-check.txt contiene healthy fleet checked.
    - El archivo probe.log en la workstation incluye evidencia UNREACHABLE.
    - Los resúmenes de app1, app2 y app3 en probe.log muestran unreachable=0 y failed=0.

  **Verifica antes de Check & finish:**
  - `cat ~/quest/safety-check.txt` — healthy fleet checked.
  - `cat ~/quest/probe.log` — contiene UNREACHABLE y resúmenes app1/app2/app3 con unreachable=0 y failed=0.
debrief: La conexión fallida permaneció visible mientras continuaban los trabajos de diagnóstico seguros.
stages.0.brief: La evidencia del fallo de conexión debe coexistir con controles exitosos de hosts sanos.
stages.0.objectives.0.text: En la workstation, safety-check.txt contiene healthy fleet checked.
stages.0.objectives.1.text: El archivo probe.log en la workstation incluye evidencia UNREACHABLE.
stages.0.objectives.2.text: Los resúmenes de app1, app2 y app3 en probe.log muestran unreachable=0 y failed=0.
hints.0.text: Unreachable es un resultado de la conexión, no una falla normal del módulo.
hints.1.text: Limite ignore_unreachable a este diagnóstico seguro. El alias offline en 127.0.0.1:1 está inaccesible
  intencionadamente; no lo repares ni alteres la flota sana.
hints.2.text: Verifique cada host en buen estado en el recap.
phrases.0: Separé los hosts inalcanzables de los errores en las tareas.
phrases.1: Mantuve objetivos sanos progresando después de la esperada sonda inalcanzable.
phrases.2: Inspeccioné tanto la evidencia inalcanzable como el huésped sano recap.
