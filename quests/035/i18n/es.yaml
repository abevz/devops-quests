title: Manejo de errores
brief: 'Un diagnóstico debe conservar un fallo de conexión mientras los hosts sanos completan sus comprobaciones.


  Trabaja en la workstation en `~/quest` con `inventory.ini`, `offline.ini`, `ansible.cfg`, `rollout.yml`.


  **Requisitos:**

  Evidencia en la workstation:


  - `~/quest/safety-check.txt`: `healthy fleet checked`.

  - `~/quest/probe.log` incluye `UNREACHABLE`.

  - Resúmenes de hosts sanos en ese log: `app1`, `app2`, `app3`, cada uno con `unreachable=0`, `failed=0`.

  '
debrief: La conexión fallida permaneció visible mientras continuaban los trabajos de diagnóstico seguros.
stages.0.brief: La evidencia del fallo de conexión debe coexistir con controles exitosos de hosts sanos.
stages.0.objectives.0.text: En la workstation, safety-check.txt contiene healthy fleet checked.
stages.0.objectives.1.text: El archivo probe.log en la workstation incluye evidencia UNREACHABLE.
stages.0.objectives.2.text: Los resúmenes de app1, app2 y app3 en probe.log muestran unreachable=0 y failed=0.
hints.0.text: Unreachable es un resultado de conexión, no un fallo normal de módulo.
hints.1.text: 'Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat inventory.ini offline.ini rollout.yml

  ```'
hints.2.text: 'Limite ignore_unreachable a este diagnóstico seguro. El alias offline en 127.0.0.1:1 está inaccesible
  intencionadamente; no lo repares ni alteres la flota sana.


  Verifique cada host en buen estado en el recap.


  Verifica el resultado observado:


  - `cat ~/quest/safety-check.txt` — healthy fleet checked.


  - `cat ~/quest/probe.log` — contiene UNREACHABLE y resúmenes app1/app2/app3 con unreachable=0 y failed=0.'
phrases.0: Separé los hosts inalcanzables de los errores en las tareas.
phrases.1: Mantuve objetivos sanos progresando después de la esperada sonda inalcanzable.
phrases.2: Inspeccioné tanto la evidencia inalcanzable como el huésped sano recap.
diagnostics.safety_record: Un play abortado o una tarea copy local ausente puede dejar safety-check.txt ausente o antiguo; un archivo ilegible también falla. [Causa y comprobación](guides#guide=ansible-9&section=healthy-safety-record)
diagnostics.probe_0_1: El play puede omitir el destino offline intencionado o su evento unreachable capturado; un log ilegible, registros inválidos o el arranque de Python también fallan. [Causa y comprobación](guides#guide=ansible-9&section=retained-unreachable-evidence)
diagnostics.probe_0_2: Python o el módulo recap puede fallar antes del diagnóstico de hosts, por ejemplo al analizar registros de log inválidos. [Causa y comprobación](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_1: El recap de app1 puede faltar o indicar tareas failed/unreachable; un log ilegible o no reconocido también impide encontrar la fila. [Causa y comprobación](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_2: El recap de app2 puede faltar o indicar tareas failed/unreachable; un log ilegible o no reconocido también impide encontrar la fila. [Causa y comprobación](guides#guide=ansible-9&section=healthy-host-recaps)
diagnostics.recap_3: El recap de app3 puede faltar o indicar tareas failed/unreachable; un log ilegible o no reconocido también impide encontrar la fila. [Causa y comprobación](guides#guide=ansible-9&section=healthy-host-recaps)
