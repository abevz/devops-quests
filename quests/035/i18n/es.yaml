title: Manejo de errores
brief: 'El diagnóstico alias offline apunta a 127.0.0.1:1 y no está disponible intencionalmente. No repararlo
  ni modificar la flota sana. Mantenga su failure visible mientras continúa con las comprobaciones seguras
  de app1–app3. Guarde stdout en probe.log y escriba safety-check.txt en localhost.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `offline.ini`,
  `ansible.cfg`, `rollout.yml`, `probe.log`, `safety-check.txt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: probe.log muestra UNREACHABLE y los tres objetivos sanos terminan sin
  failure.'
debrief: La conexión fallida permaneció visible mientras continuaban los trabajos de diagnóstico seguros.
stages.0.brief: 'Criterios de éxito: probe.log muestra UNREACHABLE y los tres objetivos sanos terminan
  sin failure.'
stages.0.objectives.0.text: probe.log muestra UNREACHABLE y los tres objetivos sanos terminan sin failure.
hints.0.text: Unreachable es un resultado de la conexión, no una falla normal del módulo.
hints.1.text: Limite ignore_unreachable a este diagnóstico seguro.
hints.2.text: Verifique cada host en buen estado en el recap.
phrases.0: Separé los hosts inalcanzables de los errores en las tareas.
phrases.1: Mantuve objetivos sanos progresando después de la esperada sonda inalcanzable.
phrases.2: Inspeccioné tanto la evidencia inalcanzable como el huésped sano recap.
