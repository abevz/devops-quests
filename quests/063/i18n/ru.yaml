title: Восстановление rescue
brief: "После неудачной доставки флоту нужен проверенный результат восстановления.\n\nРаботайте на workstation в\
  \ `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.\n\n**Требования:**\n\
  - Артефакт восстановления на workstation:\n  - Путь: `~/quest/previous.txt`.\n  - Содержимое соответствует предоставленной\
  \ квитанции восстановления.\n- Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n\
  \  - Содержимое: `stable-63`.\n  - Режим доступа: `0644`.\n- Файл на каждом управляемом хосте (`app1`, `app2`,\
  \ `app3`):\n  - Путь: `/srv/site/recovery-checked`.\n  - Содержимое: `checked`.\n- Живой сервис на каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Ответ: `stable-63`.\n- Постройте программу восстановления\
  \ для интерфейса вызывающей стороны из `~/quest/caller-contract.json` на рабочей станции; `caller-cache.py` моделирует\
  \ обновление потребителя при локальном запуске. Принимайте прошедший проверку кандидат, восстанавливайте отклонённый\
  \ из проверенной резервной копии и обновляйте соответствующий работающий потребитель. После обоих завершённых\
  \ путей записывайте `checked`. Недостоверную резервную копию отклоняйте до изменения рабочих данных или кеша;\
  \ сохраняйте посторонние данные вызывающей стороны и исходные резервную копию и квитанцию на рабочей станции.\n\
  \nПроверка изучает контрольную сумму и текущие результаты; она не доказывает порядок прошлых действий."
debrief: Вы построили восстановление для принятых, отклонённых и недостоверных входов, сохранив целостность резервной
  копии и согласованность потребителя.
stages.0.brief: Восстановление должно оставить проверенный стабильный результат во всём флоте.
stages.0.objectives.0.text: На workstation файл `previous.txt` соответствует предоставленной квитанции восстановления.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `stable-63`. Результат по умолчанию для парка должен сохраняться и при повторном запуске текущей программы с принятым,
  отклонённым кандидатом и недостоверной резервной копией.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/recovery-checked`
  содержит `checked`.
stages.0.objectives.4.text: HTTP на порту `8080` возвращает `stable-63` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: Проверка входов, восстановление и обновление потребителя образуют общую границу транзакции. Резервная
  копия полезна, только если её целостность известна до изменения данных.
hints.1.text: |-
  Сопоставьте `rollout.yml`, `caller-contract.json`, `previous.sha256` и пути входных данных вызывающей стороны. Проследите, какие задачи меняют рабочие данные, где возникает отказ проверки и какое уведомление обновляет восстановленный потребитель.

  В rollout.yml найдите проверку контрольной суммы, первую запись в рабочий файл и секции block, rescue и always. Сверьте их порядок и область действия с путями и ожидаемыми результатами вызова.
hints.2.text: |-
  Проверьте `sha256sum -c previous.sha256`, принятый и отклонённый варианты и несовпадающую квитанцию: последний запуск должен завершиться ошибкой без изменения рабочих данных и кеша. Успешные варианты должны обновлять кеш и оставлять `checked`; входные и посторонние данные сохраняются.

  На каждом хосте основного парка сообщение и HTTP-ответ должны быть `stable-63`, режим файла сообщения — `644`, а маркер восстановления должен содержать `checked`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s\n" "$host"
    ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'stat -c "%a %n" /srv/site/message; cat /srv/site/message /srv/site/recovery-checked'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```
phrases.0: Я проверил artifact отката до его доставки.
phrases.1: Я использовал rescue для восстановления, always — для итогового marker.
phrases.2: Я проверил сервисы после последовательного восстановления.
diagnostics.checksum: 'previous.txt не проходит проверку previous.sha256 либо входные файлы недоступны: изменённый backup, исправленная или некорректная квитанция либо отсутствующий файл мешают доверять источнику восстановления. [Причина и проверка](guides#guide=ansible-9&section=recovery-original-backup-checksum)'
diagnostics.caller_original: 'Рабочие previous.txt или previous.sha256 отличаются от сохранённых байтов setup либо не прочитаны: переписывание квитанции под изменённый backup не сохраняет исходный вход восстановления. [Причина и проверка](guides#guide=ansible-9&section=recovery-protected-backup-inputs)'
diagnostics.recovery_branches: 'Наблюдаемый принятый, отклонённый или недоверенный backup-вариант не выполнил контракт: причиной могут быть проверка после изменения, неверный результат rescue, игнорирование путей или команды обновления и изменение защищаемых файлов вызывающего кода. [Причина и проверка](guides#guide=ansible-9&section=recovery-caller-transaction-outcomes)'
diagnostics.caller_observation: 'Дочерний повторный запуск завершился без распознанного маркера результата: отсутствующие или нечитаемые выходы, некорректный recap Ansible, ошибки локального выполнения или внутренний таймаут Ansible мешают оценке. [Причина и проверка](guides#guide=ansible-9&section=recovery-caller-replay-observation)'
diagnostics.caller_budget: 'Внешний повторный запуск превысил 14 секунд: блокирующие задачи или медленные зависимости мешают завершить наблюдение всех принятых, отклонённых и недоверенных backup-вариантов. [Причина и проверка](guides#guide=ansible-9&section=recovery-outer-replay-deadline)'
diagnostics.probe_0_1: 'Общая проверка содержимого и вызывающего кода остановилась до подробного маркера: прерванная SSH-группа, недоступный внешний Python или исполняемый файл повторного запуска либо рабочие данные мешают наблюдению вариантов. [Причина и проверка](guides#guide=ansible-9&section=recovery-probe-startup)'
diagnostics.content_1: 'app1 не предоставляет stable-63 в /srv/site/message либо SSH завершился ошибкой: выданная прерванная доставка, отсутствующий rescue или запись по другому пути оставляют неверный файл. [Причина и проверка](guides#guide=ansible-9&section=recovery-fleet-restored-content)'
diagnostics.mode_1: 'app1 не сообщает права 644 для /srv/site/message: копирование кандидата или rescue могло задать другие права либо SSH и stat не прочитали режим. [Причина и проверка](guides#guide=ansible-9&section=recovery-fleet-file-permissions)'
diagnostics.marker_1: 'app1 не предоставляет checked в /srv/site/recovery-checked: отсутствующая завершающая задача, другой recovery_marker или прерванный play оставляют запись недоставленной; SSH также может не прочитать её. [Причина и проверка](guides#guide=ansible-9&section=recovery-fleet-completion-record)'
diagnostics.http_1: 'app1 не отдаёт stable-63 по HTTP 8080 либо запрос завершился ошибкой: восстановление файла без обновления потребителя или refresh до завершения rescue оставляют старый кэш. [Причина и проверка](guides#guide=ansible-9&section=recovery-fleet-consumer-refresh)'
