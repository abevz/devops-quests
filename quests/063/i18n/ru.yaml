title: Восстановление rescue
brief: |-
  После неудачной доставки флоту нужен проверенный результат восстановления.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.

  **Требования:**
  - Артефакт восстановления на workstation:
    - Путь: `~/quest/previous.txt`.
    - Содержимое соответствует предоставленной квитанции восстановления.
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/message`.
    - Содержимое: `stable-63`.
    - Режим доступа: `0644`.
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/recovery-checked`.
    - Содержимое: `checked`.
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Ответ: `stable-63`.

  Проверка изучает контрольную сумму и текущие результаты; она не доказывает порядок прошлых действий.
debrief: Проверки подтвердили контрольную сумму, структуру playbook, файлы парка и ответы сервисов.
stages.0.brief: Восстановление должно оставить проверенный стабильный результат во всём флоте.
stages.0.objectives.0.text: На workstation файл `previous.txt` соответствует предоставленной квитанции
  восстановления.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message`
  содержит `stable-63`.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message`
  имеет режим `0644`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/recovery-checked`
  содержит `checked`.
stages.0.objectives.4.text: HTTP на порту `8080` возвращает `stable-63` на каждом управляемом хосте (`app1`,
  `app2`, `app3`).
hints.0.text: Обработанная в rescue ошибка не доказывает восстановление состояния.
hints.1.text: |-
  Восстановите проверенный artifact в rescue и вызовите handler.

  Изучите inventory и предоставленный плейбук на workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  cat previous.sha256
  ```
hints.2.text: |-
  Проверьте результат из `~/quest` на workstation:

  - `sha256sum -c previous.sha256` — Сообщает `previous.txt: OK`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/recovery-checked; ls -l /srv/site/message'` — Каждый хост показывает `stable-63`, `checked` и `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Показывает `stable-63` от `app1`, `app2`, `app3`.
phrases.0: Я проверил artifact отката до его доставки.
phrases.1: Я использовал rescue для восстановления, always — для итогового marker.
phrases.2: Я проверил сервисы после последовательного восстановления.
