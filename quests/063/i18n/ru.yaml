title: Восстановление rescue
brief: 'Работайте в `~/quest` с `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `previous.sha256` и `candidate.txt`.
  В Ansible `block` группирует задачи, `rescue` обрабатывает ошибку, `always` выполняется при любом результате, а `serial:
  1` обрабатывает по одному узлу. Проверьте `previous.txt` командой `sha256sum -c previous.sha256`. Кандидат намеренно неверен.


  В `rollout.yml` первый play должен выбирать `fleet` с числовым `serial: 1`; его первая задача должна содержать непустые
  списки `block`, `rescue` и `always`. Первая задача rescue должна использовать ровно `ansible.builtin.copy` с `src: previous.txt`,
  `dest: /srv/site/message` и `mode: "0644"`, уведомляя `Reload banner`. Готовый обработчик выполняет `dq-service reload`,
  чтобы сервис перечитал файл. Выполните `ansible-playbook rollout.yml`. На app1, app2 и app3 файл `/srv/site/message` должен
  содержать `stable-63` с режимом `0644`, `/srv/site/recovery-checked` — `checked`, а HTTP на порту 8080 должен возвращать
  `stable-63`. Проверки наблюдают контрольную сумму, playbook и текущие результаты, но не доказывают порядок прошлых действий.
  Работайте только в офлайн-песочнице.'
debrief: Проверки подтвердили контрольную сумму, структуру playbook, файлы парка и ответы сервисов.
stages.0.brief: Контрольная сумма, заданная структура playbook, файлы парка и HTTP-ответы соответствуют описанию.
stages.0.objectives.0.text: Контрольная сумма, заданная структура playbook, файлы парка и HTTP-ответы соответствуют описанию.
hints.0.text: Обработанная в rescue ошибка не доказывает восстановление состояния.
hints.1.text: Восстановите проверенный artifact в rescue и вызовите handler.
hints.2.text: Отделите `always` от `rescue`; проверьте файлы и HTTP всех узлов.
phrases.0: Я проверил artifact отката до его доставки.
phrases.1: Я использовал rescue для восстановления, always — для итогового marker.
phrases.2: Я проверил сервисы после последовательного восстановления.
