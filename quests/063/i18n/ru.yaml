title: Восстановление rescue
brief: 'После неудачного candidate нужно вернуть выданный previous.txt на всех трёх целях. Проверьте previous.sha256,
  реализуйте rescue в rollout.yml, сохраните marker в always, используйте serial: 1 и handler перезагрузки
  banner. Candidate намеренно неверен; успех — stable-63 с каждого HTTP endpoint, а не проигнорированная
  ошибка проверки.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `previous.txt`, `previous.sha256`, `candidate.txt`, `verification.log`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Последовательный rescue возвращает проверенный previous artifact, выполняет always
  на каждой цели и отдаёт stable-63 со всех трёх endpoints.'
debrief: Контролируемая ошибка приводит к проверенному откату вместо частично изменённого fleet.
stages.0.brief: 'Последовательный rescue возвращает проверенный previous artifact, выполняет always на
  каждой цели и отдаёт stable-63 со всех трёх endpoints.


  Результат проверки: Последовательный rescue возвращает проверенный previous artifact, выполняет always
  на каждой цели и отдаёт stable-63 со всех трёх endpoints.'
stages.0.objectives.0.text: Последовательный rescue возвращает проверенный previous artifact, выполняет
  always на каждой цели и отдаёт stable-63 со всех трёх endpoints.
hints.0.text: Обработанная в rescue ошибка не доказывает восстановление состояния.
hints.1.text: Восстановите проверенный artifact в rescue и вызовите handler.
hints.2.text: Отделите always от rescue; проверьте файлы и HTTP всех целей.
phrases.0: Я проверил artifact отката до его доставки.
phrases.1: Я использовал rescue для восстановления, always — для итогового marker.
phrases.2: Я проверил сервисы после последовательного восстановления.
