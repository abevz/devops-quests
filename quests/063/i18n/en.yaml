title: Rescue workflow
brief: "The fleet needs a verified recovery outcome after an unsuccessful delivery.\n\nWork on the workstation in\
  \ `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.\n\n**Requirements:**\n\
  - Recovery artifact on the workstation:\n  - Path: `~/quest/previous.txt`.\n  - Matches the supplied recovery\
  \ receipt.\n- File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/message`.\n  - Content:\
  \ `stable-63`.\n  - Access mode: `0644`.\n- File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/recovery-checked`.\n\
  \  - Content: `checked`.\n- Live service on every managed host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n\
  \  - Response: `stable-63`.\n- Build a recovery program for the caller interface in workstation `~/quest/caller-contract.json`;\
  \ `caller-cache.py` models a consumer refresh for local callers. Accept a candidate that passes validation, recover\
  \ a rejected candidate from its verified backup, and refresh the corresponding live consumer. Record `checked`\
  \ after either completed path. Reject an untrusted backup before changing live data or its cache; preserve unrelated\
  \ caller data and the original workstation backup and receipt.\n\nThe check inspects the checksum and current\
  \ results; it does not prove the order of past actions."
debrief: You constructed recovery across accepted, rejected and untrusted inputs, preserving backup integrity and
  synchronizing the consumer.
stages.0.brief: Recovery must leave a verified stable result across the fleet.
stages.0.objectives.0.text: On the workstation, `previous.txt` matches the supplied recovery receipt.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `stable-63`.
  The default fleet result must also hold when the current program is replayed for accepted, rejected and untrusted-backup
  caller inputs.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/recovery-checked` contains
  `checked`.
stages.0.objectives.4.text: HTTP on port `8080` returns `stable-63` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: Input validation, recovery and consumer refresh form one transaction boundary. A fallback is useful
  only when its integrity is known before mutation.
hints.1.text: |-
  Compare `rollout.yml`, `caller-contract.json`, `previous.sha256` and the caller input paths. Follow which tasks can change live data, where validation fails, and which notification can refresh the recovered consumer.

  In rollout.yml, locate the checksum task, the first write to the live destination, and the block, rescue, and always sections. Compare their order and scope with the caller paths and the expected outcomes.
hints.2.text: |-
  Verify `sha256sum -c previous.sha256`, both accepted and rejected caller cases, and a mismatched receipt: that last run must fail without changing live data or its cache. Successful cases must refresh the cache and leave `checked`; keep source inputs and unrelated data unchanged.

  On each primary fleet host, the message and HTTP response must both be `stable-63`, the message mode must be `644`, and the recovery marker must contain `checked`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s\n" "$host"
    ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'stat -c "%a %n" /srv/site/message; cat /srv/site/message /srv/site/recovery-checked'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```
phrases.0: I verified the rollback artifact before distributing it.
phrases.1: I used rescue for recovery and always for the final marker.
phrases.2: I checked live services after serial recovery.
diagnostics.checksum: previous.txt does not validate against previous.sha256 or either input is unavailable; edited backup bytes, a changed/malformed receipt or a missing file can prevent trusting the supplied recovery source. [Cause and check](guides#guide=ansible-9&section=recovery-original-backup-checksum)
diagnostics.caller_original: The working previous.txt or previous.sha256 differs from its frozen setup bytes or could not be read; rewriting the receipt to accept a changed backup does not preserve the original recovery input. [Cause and check](guides#guide=ansible-9&section=recovery-protected-backup-inputs)
diagnostics.recovery_branches: An observed accepted, rejected or untrusted-backup case did not meet its contract; validation after mutation, the wrong rescue result, ignored caller paths/reload command or changed protected caller files can explain it. [Cause and check](guides#guide=ansible-9&section=recovery-caller-transaction-outcomes)
diagnostics.caller_observation: The child caller replay failed without a recognized outcome marker; unreadable/missing caller outputs, malformed Ansible recap, local execution errors or an inner Ansible timeout can prevent evaluating its result. [Cause and check](guides#guide=ansible-9&section=recovery-caller-replay-observation)
diagnostics.caller_budget: The outer caller replay exceeded its 14-second deadline; blocking tasks or slow dependencies can prevent completing all accepted, rejected and untrusted-backup observations. [Cause and check](guides#guide=ansible-9&section=recovery-outer-replay-deadline)
diagnostics.probe_0_1: The combined content/caller probe stopped before a detailed marker; an interrupted bounded SSH group, unavailable outer Python/replay executable or workstation inputs may prevent reaching the observed caller cases. [Cause and check](guides#guide=ansible-9&section=recovery-probe-startup)
diagnostics.content_1: app1 does not provide stable-63 in /srv/site/message or SSH failed; the supplied interrupted delivery, an unimplemented rescue path or publication to the wrong destination can leave the wrong file. [Cause and check](guides#guide=ansible-9&section=recovery-fleet-restored-content)
diagnostics.mode_1: app1 does not report mode 644 on /srv/site/message; a candidate or rescue copy may set different permissions, or SSH/stat could not read the file mode. [Cause and check](guides#guide=ansible-9&section=recovery-fleet-file-permissions)
diagnostics.marker_1: app1 does not provide checked in /srv/site/recovery-checked; a missing completion task, the wrong recovery_marker path or an interrupted play can omit the record, and SSH may also fail to read it. [Cause and check](guides#guide=ansible-9&section=recovery-fleet-completion-record)
diagnostics.http_1: app1 does not serve stable-63 on HTTP 8080 or the request failed; restoring disk bytes without notifying the consumer reload, or refreshing before rescue finishes, can leave a stale cached response. [Cause and check](guides#guide=ansible-9&section=recovery-fleet-consumer-refresh)
