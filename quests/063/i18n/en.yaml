title: Rescue workflow
brief: 'A failed candidate must restore the supplied previous.txt on all three fleet hosts. Verify previous.sha256,
  implement rescue in rollout.yml, retain the always marker, use serial: 1 and reload the live banner
  through its handler. The candidate is deliberately invalid; success means stable-63 from every HTTP
  endpoint, not an ignored validation error.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `previous.txt`, `previous.sha256`, `candidate.txt`, `verification.log`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Serial rescue restores the verified previous artifact, runs always on every
  host and serves stable-63 from all three endpoints.'
debrief: A controlled failure now leads to verified rollback instead of a partially changed fleet.
