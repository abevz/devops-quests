  bytes and correct the program instead.
diagnostics.caller_observation: The current program could not be replayed. Check the caller paths, local execution
  and playbook errors.
diagnostics.caller_budget: The caller replay exceeded its budget. Check for blocking commands or unavailable dependencies.
