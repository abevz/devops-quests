title: Rescue workflow
brief: "The fleet needs a verified recovery outcome after an unsuccessful delivery.\n\nWork on the workstation in\
  \ `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.\n\n**Requirements:**\n\
  - Recovery artifact on the workstation:\n  - Path: `~/quest/previous.txt`.\n  - Matches the supplied recovery\
  \ receipt.\n- File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/message`.\n  - Content:\
  \ `stable-63`.\n  - Access mode: `0644`.\n- File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/recovery-checked`.\n\
  \  - Content: `checked`.\n- Live service on every managed host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n\
  \  - Response: `stable-63`.\n- Build a recovery program for the caller interface in workstation `~/quest/caller-contract.json`;\
  \ `caller-cache.py` models a consumer refresh for local callers. Accept a candidate that passes validation, recover\
  \ a rejected candidate from its verified backup, and refresh the corresponding live consumer. Record `checked`\
  \ after either completed path. Reject an untrusted backup before changing live data or its cache; preserve unrelated\
  \ caller data and the original workstation backup and receipt.\n\nThe check inspects the checksum and current\
  \ results; it does not prove the order of past actions."
debrief: You constructed recovery across accepted, rejected and untrusted inputs, preserving backup integrity and
  synchronizing the consumer.
stages.0.brief: Recovery must leave a verified stable result across the fleet.
stages.0.objectives.0.text: On the workstation, `previous.txt` matches the supplied recovery receipt.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `stable-63`.
  The default fleet result must also hold when the current program is replayed for accepted, rejected and untrusted-backup
  caller inputs.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/recovery-checked` contains
  `checked`.
stages.0.objectives.4.text: HTTP on port `8080` returns `stable-63` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: Input validation, recovery and consumer refresh form one transaction boundary. A fallback is useful
  only when its integrity is known before mutation.
hints.1.text: Compare `rollout.yml`, `caller-contract.json`, `previous.sha256` and the caller input paths. Follow
  which tasks can change live data, where validation fails, and which notification can refresh the recovered consumer.
hints.2.text: 'Use preflight integrity validation before the mutation block, rescue a rejected candidate, and reserve
  always for the completion record. Verify `sha256sum -c previous.sha256`, both accepted and rejected caller cases,
  and a mismatched receipt: that last run must fail without changing live data or its cache. Successful cases must
  refresh the cache and leave `checked`; keep source inputs and unrelated data unchanged.'
phrases.0: I verified the rollback artifact before distributing it.
phrases.1: I used rescue for recovery and always for the final marker.
phrases.2: I checked live services after serial recovery.
