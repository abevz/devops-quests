title: Rescue workflow
brief: |-
  The fleet needs a verified recovery outcome after an unsuccessful delivery.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `previous.sha256`, `candidate.txt`.

  **Requirements:**
  - Recovery artifact on the workstation:
    - Path: `~/quest/previous.txt`.
    - Matching receipt: `~/quest/previous.sha256`.
  - Configured recovery:
    - Scope: `app1`, `app2`, `app3`.
    - One managed host per batch.
    - Recovery is configured to restore the supplied previous message and refresh the service.
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `stable-63`.
    - Access mode: `0644`.
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/recovery-checked`.
    - Content: `checked`.
  - Live service on every managed host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Response: `stable-63`.

  **Verify yourself before Check & finish:**
  - `sha256sum -c previous.sha256` — Reports `previous.txt: OK`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/recovery-checked; ls -l /srv/site/message'` — Every host shows `stable-63`, `checked` and `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Shows `stable-63` from `app1`, `app2`, `app3`.

  The check inspects the checksum, configured recovery and current results; it does not prove the order of past actions.
debrief: The checks verified the checksum, playbook structure, fleet files and live responses.
stages.0.brief: Recovery must leave a verified stable result across the fleet.
stages.0.objectives.0.text: On the workstation, `previous.txt` matches `previous.sha256`.
stages.0.objectives.1.text: Recovery is configured for every managed host, one host per batch, with restoration
  of the previous message and live service refresh.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `stable-63`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.4.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/recovery-checked` contains
  `checked`.
stages.0.objectives.5.text: HTTP on port `8080` returns `stable-63` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: A rescued failure does not prove the previous state was restored.
hints.1.text: Restore the verified artifact in rescue and notify the handler.
hints.2.text: 'Keep `always` separate from `rescue`. Use a nonempty `block` for the delivery, `rescue` for failed
  delivery and `always` for final verification. The retained source form has a first play with `hosts: fleet`, integer
  `serial: 1`, and these three nonempty lists in its first task. Its first rescue action is exactly `ansible.builtin.copy`
  with `src: previous.txt`, `dest: /srv/site/message`, `mode: "0644"`, and `notify: Reload banner`. The supplied
  handler runs `dq-service reload`. After validating the artifact, run `ansible-playbook rollout.yml`.'
phrases.0: I verified the rollback artifact before distributing it.
phrases.1: I used rescue for recovery and always for the final marker.
phrases.2: I checked live services after serial recovery.
diagnostics.hosts: The first play hosts must equal fleet.
diagnostics.serial: The first play serial must be the integer 1.
diagnostics.block: The first task block must be a nonempty list.
diagnostics.rescue: The first task rescue must be a nonempty list.
diagnostics.always: The first task always must be a nonempty list.
diagnostics.copy: The first rescue copy must use previous.txt, /srv/site/message and mode 0644 exactly.
diagnostics.notify: The first rescue notify must equal Reload banner.
diagnostics.checksum: previous.txt must match previous.sha256.
diagnostics.content_1: Host app1 /srv/site/message must equal stable-63.
diagnostics.content_2: Host app2 /srv/site/message must equal stable-63.
diagnostics.content_3: Host app3 /srv/site/message must equal stable-63.
diagnostics.mode_1: Host app1 /srv/site/message mode must be 644.
diagnostics.mode_2: Host app2 /srv/site/message mode must be 644.
diagnostics.mode_3: Host app3 /srv/site/message mode must be 644.
diagnostics.marker_1: Host app1 /srv/site/recovery-checked must equal checked.
diagnostics.marker_2: Host app2 /srv/site/recovery-checked must equal checked.
diagnostics.marker_3: Host app3 /srv/site/recovery-checked must equal checked.
diagnostics.http_1: Host app1 on port 8080 must return stable-63.
diagnostics.http_2: Host app2 on port 8080 must return stable-63.
diagnostics.http_3: Host app3 on port 8080 must return stable-63.
