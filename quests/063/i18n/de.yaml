title: Rettungsworkflow
brief: |-
  Nach einer fehlgeschlagenen Auslieferung benötigt die Flotte ein überprüftes Wiederherstellungsergebnis.

  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.

  **Anforderungen:**
  - Wiederherstellungsartefakt auf der Workstation:
    - Pfad: `~/quest/previous.txt`.
    - Der Inhalt stimmt mit dem bereitgestellten Wiederherstellungsbeleg überein.
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `stable-63`.
    - Zugriffsmodus: `0644`.
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/recovery-checked`.
    - Inhalt: `checked`.
  - Aktiver Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Antwort: `stable-63`.

  Die Prüfung untersucht Prüfsumme und aktuelle Ergebnisse; sie beweist nicht die Reihenfolge vergangener Aktionen.
debrief: Die Prüfungen bestätigten Prüfsumme, Playbook-Struktur, Flottendateien und Antworten der Dienste.
stages.0.brief: Die Wiederherstellung muss in der gesamten Flotte ein überprüftes stabiles Ergebnis hinterlassen.
stages.0.objectives.0.text: Auf der Workstation stimmt `previous.txt` mit dem bereitgestellten Wiederherstellungsbeleg
  überein.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  den Inhalt `stable-63`.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message`
  den Modus `0644`.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/recovery-checked`
  den Inhalt `checked`.
stages.0.objectives.4.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`)
  `stable-63`.
hints.0.text: Ein geretteter Fehler beweist nicht, dass der vorherige Zustand wiederhergestellt wurde.
hints.1.text: |-
  Stellen Sie den verifizierten artifact in rescue wieder her und benachrichtigen Sie den handler.

  Prüfen Sie Inventory und das bereitgestellte Playbook auf der Workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  cat previous.sha256
  ```
hints.2.text: |-
  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `sha256sum -c previous.sha256` — Meldet `previous.txt: OK`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/recovery-checked; ls -l /srv/site/message'` — Jeder Host zeigt `stable-63`, `checked` und `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Zeigt `stable-63` von `app1`, `app2`, `app3`.
phrases.0: Ich habe das Rollback artifact überprüft, bevor ich es verteilt habe.
phrases.1: Ich habe rescue für die Wiederherstellung und immer für das endgültige marker verwendet.
phrases.2: Ich habe die Live-Dienste nach der seriellen Wiederherstellung überprüft.
