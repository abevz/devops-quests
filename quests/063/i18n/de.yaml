title: Rettungsworkflow
brief: 'Ein ausgefallener candidate muss den bereitgestellten previous.txt auf allen drei Flottenhosts
  wiederherstellen. Überprüfen Sie previous.sha256, implementieren Sie rescue in rollout.yml, behalten
  Sie immer marker bei, verwenden Sie serial: 1 und laden Sie das Live-banner über handler neu. Der candidate
  ist absichtlich ungültig; Erfolg bedeutet stable-63 von jedem HTTP endpoint, kein ignorierter Validierungsfehler.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `previous.txt`, `previous.sha256`, `candidate.txt`, `verification.log`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Serial rescue stellt den verifizierten previous artifact wieder her, läuft immer
  auf jedem Host und bedient stable-63 von allen drei endpoints.'
debrief: Ein kontrollierter Fehler führt nun zu einem verifizierten Rollback statt zu einem teilweise
  geänderten fleet.
stages.0.brief: 'Erfolgskriterien: Serial rescue stellt den verifizierten previous artifact wieder her,
  läuft immer auf jedem Host und bedient stable-63 von allen drei endpoints.'
stages.0.objectives.0.text: Serial rescue stellt den verifizierten previous artifact wieder her, läuft
  immer auf jedem Host und bedient stable-63 von allen drei endpoints.
hints.0.text: Ein geretteter Fehler beweist nicht, dass der vorherige Zustand wiederhergestellt wurde.
hints.1.text: Stellen Sie den verifizierten artifact in rescue wieder her und benachrichtigen Sie den
  handler.
hints.2.text: Halten Sie es immer getrennt von rescue; Überprüfen Sie die Dateien und HTTP auf allen Hosts.
phrases.0: Ich habe das Rollback artifact überprüft, bevor ich es verteilt habe.
phrases.1: Ich habe rescue für die Wiederherstellung und immer für das endgültige marker verwendet.
phrases.2: Ich habe die Live-Dienste nach der seriellen Wiederherstellung überprüft.
