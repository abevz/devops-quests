diagnostics.recovery_branches: Das aktuelle Programm erfüllt einen Annahme-, Ablehnungs- oder Sicherungsfehlerfall
  nicht. Prüfe Integrität vor Änderungen, tatsächliche Wiederherstellung und Verbraucheraktualisierung.
diagnostics.caller_original: Ursprüngliche Eingabe oder Beleg wurde geändert oder fehlt. Bewahre die bereitgestellten
  Bytes und korrigiere das Programm.
diagnostics.caller_observation: Das aktuelle Programm konnte nicht erneut ausgeführt werden. Prüfe Aufruferpfade,
  lokale Ausführung und Playbook-Fehler.
diagnostics.caller_budget: Das Zeitbudget des Aufruferlaufs wurde überschritten. Prüfe blockierende Befehle oder
  fehlende Abhängigkeiten.
diagnostics.probe_0_1: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Auf jedem verwalteten
  Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den Inhalt `stable-63`. Das Standardergebnis der Flotte
  gilt auch bei erneuter Ausführung des aktuellen Programms mit angenommenem, abgelehntem und nicht vertrauenswürdigem
  Aufrufereingang.'
