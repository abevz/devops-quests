title: Rettungsworkflow
brief: 'Arbeite in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `previous.sha256` und `candidate.txt`.
  Ansible `block` gruppiert Aufgaben; `rescue` behandelt Fehler, `always` läuft nach jedem Ergebnis und `serial: 1` verarbeitet
  jeweils einen Host. Prüfe `previous.txt` mit `sha256sum -c previous.sha256`. Der Kandidat ist absichtlich ungültig.


  In `rollout.yml` muss der erste Play `fleet` mit numerischem `serial: 1` wählen; seine erste Aufgabe muss nichtleere Listen
  `block`, `rescue` und `always` enthalten. Die erste Rescue-Aufgabe muss genau `ansible.builtin.copy` mit `src: previous.txt`,
  `dest: /srv/site/message` und `mode: "0644"` nutzen und `Reload banner` benachrichtigen. Der bereitgestellte Handler führt
  `dq-service reload` aus, damit der Dienst die Datei neu liest. Führe `ansible-playbook rollout.yml` aus. Auf app1, app2
  und app3 muss `/srv/site/message` `stable-63` mit Modus `0644`, `/srv/site/recovery-checked` den Inhalt `checked` und HTTP
  auf Port 8080 `stable-63` liefern. Die Prüfungen beobachten Prüfsumme, Playbook und aktuelle Ergebnisse; sie beweisen nicht
  die Reihenfolge vergangener Aktionen. Arbeite nur in der Offline-Umgebung.'
debrief: Die Prüfungen bestätigten Prüfsumme, Playbook-Struktur, Flottendateien und Antworten der Dienste.
stages.0.brief: Prüfsumme, angegebene Playbook-Struktur, Flottendateien und HTTP-Antworten entsprechen der Beschreibung.
stages.0.objectives.0.text: Prüfsumme, angegebene Playbook-Struktur, Flottendateien und HTTP-Antworten entsprechen der Beschreibung.
hints.0.text: Ein geretteter Fehler beweist nicht, dass der vorherige Zustand wiederhergestellt wurde.
hints.1.text: Stellen Sie den verifizierten artifact in rescue wieder her und benachrichtigen Sie den handler.
hints.2.text: Halte `always` getrennt von `rescue`; prüfe Dateien und HTTP auf allen Hosts.
phrases.0: Ich habe das Rollback artifact überprüft, bevor ich es verteilt habe.
phrases.1: Ich habe rescue für die Wiederherstellung und immer für das endgültige marker verwendet.
phrases.2: Ich habe die Live-Dienste nach der seriellen Wiederherstellung überprüft.
