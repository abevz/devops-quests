title: Rettungsworkflow
brief: "Nach einer fehlgeschlagenen Auslieferung benötigt die Flotte ein überprüftes Wiederherstellungsergebnis.\n\
  \nArbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`,\
  \ `candidate.txt`.\n\n**Anforderungen:**\n- Wiederherstellungsartefakt auf der Workstation:\n  - Pfad: `~/quest/previous.txt`.\n\
  \  - Der Inhalt stimmt mit dem bereitgestellten Wiederherstellungsbeleg überein.\n- Datei auf jedem verwalteten\
  \ Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `stable-63`.\n  - Zugriffsmodus:\
  \ `0644`.\n- Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/recovery-checked`.\n\
  \  - Inhalt: `checked`.\n- Aktiver Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`,\
  \ `/`.\n  - Antwort: `stable-63`.\n- Erstelle ein Wiederherstellungsprogramm für die Aufruferschnittstelle in\
  \ `~/quest/caller-contract.json` auf der Workstation; `caller-cache.py` modelliert die Aktualisierung eines lokalen\
  \ Verbrauchers. Übernimm einen gültigen Kandidaten, stelle bei Ablehnung die geprüfte Sicherung wieder her und\
  \ aktualisiere den jeweiligen laufenden Verbraucher. Schreibe nach beiden abgeschlossenen Pfaden `checked`. Lehne\
  \ eine nicht vertrauenswürdige Sicherung vor Änderungen an Live-Daten oder Cache ab; bewahre fremde Aufruferdaten\
  \ sowie ursprüngliche Sicherung und Beleg auf der Workstation.\n\nDie Prüfung untersucht Prüfsumme und aktuelle\
  \ Ergebnisse; sie beweist nicht die Reihenfolge vergangener Aktionen."
debrief: Du hast Wiederherstellung für gültige, abgelehnte und nicht vertrauenswürdige Eingaben erstellt und Sicherungsintegrität
  sowie Verbraucherkonsistenz bewahrt.
stages.0.brief: Die Wiederherstellung muss in der gesamten Flotte ein überprüftes stabiles Ergebnis hinterlassen.
stages.0.objectives.0.text: Auf der Workstation stimmt `previous.txt` mit dem bereitgestellten Wiederherstellungsbeleg
  überein.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `stable-63`. Das Standardergebnis der Flotte gilt auch bei erneuter Ausführung des aktuellen Programms
  mit angenommenem, abgelehntem und nicht vertrauenswürdigem Aufrufereingang.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/recovery-checked`
  den Inhalt `checked`.
stages.0.objectives.4.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `stable-63`.
hints.0.text: Eingabeprüfung, Wiederherstellung und Verbraucheraktualisierung bilden eine gemeinsame Transaktionsgrenze.
  Die Integrität einer Sicherung muss vor einer Änderung feststehen.
hints.1.text: Vergleiche `rollout.yml`, `caller-contract.json`, `previous.sha256` und die Eingabepfade des Aufrufers.
  Verfolge Änderungen an Live-Daten, fehlgeschlagene Validierung und die Benachrichtigung zum Aktualisieren des
  wiederhergestellten Verbrauchers.
hints.2.text: 'Prüfe die Integrität vor dem Änderungsblock, behandle abgelehnte Kandidaten in rescue und nutze always
  für den Abschlussbeleg. Prüfe `sha256sum -c previous.sha256`, angenommene und abgelehnte Eingaben sowie einen
  falschen Beleg: Letzterer muss ohne Änderung von Live-Daten oder Cache scheitern. Erfolgreiche Fälle aktualisieren
  den Cache und hinterlassen `checked`; Eingaben und fremde Daten bleiben erhalten.'
phrases.0: Ich habe das Rollback artifact überprüft, bevor ich es verteilt habe.
phrases.1: Ich habe rescue für die Wiederherstellung und immer für das endgültige marker verwendet.
phrases.2: Ich habe die Live-Dienste nach der seriellen Wiederherstellung überprüft.
diagnostics.checksum: previous.txt besteht die Prüfung mit previous.sha256 nicht oder eine Eingabe ist unerreichbar; geänderte Backup-Bytes, ein veränderter/fehlerhafter Prüfsummenbeleg oder eine fehlende Datei verhindert Vertrauen in die Wiederherstellungsquelle. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-original-backup-checksum)
diagnostics.caller_original: Die Arbeitskopie von previous.txt oder previous.sha256 weicht von den geschützten Setup-Bytes ab oder ist nicht lesbar; ein umgeschriebener Beleg für ein geändertes Backup erhält die ursprüngliche Wiederherstellungseingabe nicht. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-protected-backup-inputs)
diagnostics.recovery_branches: Ein beobachteter angenommener, abgelehnter oder nicht vertrauenswürdiger Backup-Fall erfüllte seinen Vertrag nicht; Prüfung nach Änderung, falsches rescue Ergebnis, ignorierte Aufrufpfade/Neuladebefehle oder geänderte geschützte Aufrufdateien können die Ursache sein. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-caller-transaction-outcomes)
diagnostics.caller_observation: Der untergeordnete Aufrufdurchlauf scheiterte ohne erkannten Ergebnismarker; fehlende/unlesbare Ausgaben, fehlerhafter Ansible-recap, lokale Ausführungsfehler oder ein innerer Ansible-Timeout verhindern die Auswertung. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-caller-replay-observation)
diagnostics.caller_budget: Der äußere Aufrufdurchlauf überschritt seine Frist von 14 Sekunden; blockierende Tasks oder langsame Abhängigkeiten verhindern alle Beobachtungen für Annahme, Ablehnung und nicht vertrauenswürdiges Backup. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-outer-replay-deadline)
diagnostics.probe_0_1: Die gemeinsame Inhalts-/Aufrufprüfung endete vor einem Detailmarker; eine unterbrochene SSH-Gruppe, nicht verfügbares äußeres Python/Ausführungsprogramm oder Arbeitsdaten verhindert die Beobachtung der Aufruffälle. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-probe-startup)
diagnostics.content_1: app1 liefert nicht stable-63 in /srv/site/message oder SSH schlug fehl; die gelieferte unterbrochene Bereitstellung, fehlendes rescue oder Ausgabe am falschen Ziel kann die falsche Datei belassen. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-fleet-restored-content)
diagnostics.mode_1: app1 meldet nicht Modus 644 für /srv/site/message; Kandidaten- oder rescue Kopie kann andere Rechte setzen oder SSH/stat konnte den Dateimodus nicht lesen. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-fleet-file-permissions)
diagnostics.marker_1: app1 liefert nicht checked in /srv/site/recovery-checked; fehlende Abschlussaufgabe, falscher recovery_marker Pfad oder abgebrochener Play kann den Beleg auslassen und SSH kann ihn ebenfalls nicht lesen. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-fleet-completion-record)
diagnostics.http_1: app1 liefert nicht stable-63 über HTTP 8080 oder die Anfrage schlug fehl; Wiederherstellung der Datei ohne Neuladen des Verbrauchers oder Aktualisierung vor Abschluss von rescue kann eine alte Cache-Antwort belassen. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-fleet-consumer-refresh)
