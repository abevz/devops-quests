title: Flujo de trabajo de rescate
brief: |-
  La flota necesita un resultado de recuperación verificado tras una entrega fallida.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.

  **Requisitos:**
  - Artefacto de recuperación en la workstation:
    - Ruta: `~/quest/previous.txt`.
    - El contenido coincide con el comprobante de recuperación suministrado.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `stable-63`.
    - Modo de acceso: `0644`.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/recovery-checked`.
    - Contenido: `checked`.
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Respuesta: `stable-63`.

  La comprobación examina la suma y los resultados actuales; no demuestra el orden de acciones pasadas.
debrief: Las comprobaciones verificaron la suma, estructura del playbook, archivos de la flota y respuestas
  de los servicios.
stages.0.brief: La recuperación debe dejar un resultado estable verificado en toda la flota.
stages.0.objectives.0.text: En la workstation, `previous.txt` coincide con el comprobante de recuperación
  suministrado.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  `stable-63`.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene
  el modo `0644`.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/recovery-checked`
  contiene `checked`.
stages.0.objectives.4.text: HTTP en el puerto `8080` devuelve `stable-63` en cada host administrado (`app1`,
  `app2`, `app3`).
hints.0.text: Una falla rescatada no prueba que se haya restaurado el estado anterior.
hints.1.text: |-
  Restaure el artifact verificado en rescue y notifique al handler.

  Inspecciona el inventario y el playbook suministrado en la workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  cat previous.sha256
  ```
hints.2.text: |-
  Verifica el resultado desde `~/quest` en la workstation:

  - `sha256sum -c previous.sha256` — Informa `previous.txt: OK`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/recovery-checked; ls -l /srv/site/message'` — Cada host muestra `stable-63`, `checked` y `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Muestra `stable-63` de `app1`, `app2`, `app3`.
phrases.0: Verifiqué la reversión artifact antes de distribuirlo.
phrases.1: Utilicé rescue para la recuperación y siempre para el marker final.
phrases.2: Revisé los servicios en vivo después de la recuperación en serie.
diagnostics.checksum: previous.txt debe coincidir con previous.sha256.
diagnostics.content_1: En el host app1 /srv/site/message debe ser igual a stable-63.
diagnostics.content_2: En el host app2 /srv/site/message debe ser igual a stable-63.
diagnostics.content_3: En el host app3 /srv/site/message debe ser igual a stable-63.
diagnostics.mode_1: En el host app1 el modo de /srv/site/message debe ser 644.
diagnostics.mode_2: En el host app2 el modo de /srv/site/message debe ser 644.
diagnostics.mode_3: En el host app3 el modo de /srv/site/message debe ser 644.
diagnostics.marker_1: En el host app1 /srv/site/recovery-checked debe ser igual a checked.
diagnostics.marker_2: En el host app2 /srv/site/recovery-checked debe ser igual a checked.
diagnostics.marker_3: En el host app3 /srv/site/recovery-checked debe ser igual a checked.
diagnostics.http_1: El host app1 en el puerto 8080 debe devolver stable-63.
diagnostics.http_2: El host app2 en el puerto 8080 debe devolver stable-63.
diagnostics.http_3: El host app3 en el puerto 8080 debe devolver stable-63.
