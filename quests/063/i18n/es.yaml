title: Flujo de trabajo de rescate
brief: 'Un candidate fallido debe restaurar el previous.txt suministrado en los tres hosts de la flota.
  Verifique previous.sha256, implemente rescue en rollout.yml, conserve el siempre marker, use serial:
  1 y vuelva a cargar el banner en vivo a través de su handler. El candidate no es válido deliberadamente;
  éxito significa stable-63 de cada HTTP endpoint, no un error de validación ignorado.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `previous.txt`, `previous.sha256`, `candidate.txt`, `verification.log`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Serial rescue restaura el previous artifact verificado, se ejecuta siempre
  en cada host y sirve stable-63 desde los tres endpoints.'
debrief: Una falla controlada ahora conduce a una reversión verificada en lugar de un fleet parcialmente
  modificado.
stages.0.brief: 'Criterios de éxito: Serial rescue restaura el previous artifact verificado, se ejecuta
  siempre en cada host y sirve stable-63 desde los tres endpoints.'
stages.0.objectives.0.text: Serial rescue restaura el previous artifact verificado, se ejecuta siempre
  en cada host y sirve stable-63 desde los tres endpoints.
hints.0.text: Una falla rescatada no prueba que se haya restaurado el estado anterior.
hints.1.text: Restaure el artifact verificado en rescue y notifique al handler.
hints.2.text: Mantener siempre separado de rescue; verificar archivos y HTTP en todos los hosts.
phrases.0: Verifiqué la reversión artifact antes de distribuirlo.
phrases.1: Utilicé rescue para la recuperación y siempre para el marker final.
phrases.2: Revisé los servicios en vivo después de la recuperación en serie.
