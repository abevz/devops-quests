title: Flujo de trabajo de rescate
brief: 'Trabaja en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `previous.sha256` y `candidate.txt`.
  En Ansible, `block` agrupa tareas, `rescue` gestiona fallos, `always` se ejecuta tras cualquier resultado y `serial: 1`
  procesa un host cada vez. Verifica `previous.txt` con `sha256sum -c previous.sha256`. El candidato es deliberadamente inválido.


  En `rollout.yml`, el primer play debe seleccionar `fleet` con `serial: 1` numérico; su primera tarea debe contener listas
  `block`, `rescue` y `always` no vacías. La primera tarea de rescue debe usar exactamente `ansible.builtin.copy` con `src:
  previous.txt`, `dest: /srv/site/message` y `mode: "0644"`, y notificar a `Reload banner`. El handler suministrado ejecuta
  `dq-service reload` para que el servicio relea el archivo. Ejecuta `ansible-playbook rollout.yml`. En app1, app2 y app3,
  `/srv/site/message` debe contener `stable-63` con modo `0644`, `/srv/site/recovery-checked` debe contener `checked` y HTTP
  en el puerto 8080 debe devolver `stable-63`. Las comprobaciones observan suma, playbook y resultados actuales; no demuestran
  el orden de acciones anteriores. Trabaja solo en la bahía sin conexión.'
debrief: Las comprobaciones verificaron la suma, estructura del playbook, archivos de la flota y respuestas de los servicios.
stages.0.brief: La suma, estructura indicada del playbook, archivos de la flota y respuestas HTTP coinciden con la descripción.
stages.0.objectives.0.text: La suma, estructura indicada del playbook, archivos de la flota y respuestas HTTP coinciden con
  la descripción.
hints.0.text: Una falla rescatada no prueba que se haya restaurado el estado anterior.
hints.1.text: Restaure el artifact verificado en rescue y notifique al handler.
hints.2.text: Mantén `always` separado de `rescue`; verifica archivos y HTTP en todos los hosts.
phrases.0: Verifiqué la reversión artifact antes de distribuirlo.
phrases.1: Utilicé rescue para la recuperación y siempre para el marker final.
phrases.2: Revisé los servicios en vivo después de la recuperación en serie.
