title: Flujo de trabajo de rescate
brief: "La flota necesita un resultado de recuperación verificado tras una entrega fallida.\n\nTrabaja en la workstation\
  \ en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.\n\n**Requisitos:**\n\
  - Artefacto de recuperación en la workstation:\n  - Ruta: `~/quest/previous.txt`.\n  - El contenido coincide con\
  \ el comprobante de recuperación suministrado.\n- Archivo en cada host administrado (`app1`, `app2`, `app3`):\n\
  \  - Ruta: `/srv/site/message`.\n  - Contenido: `stable-63`.\n  - Modo de acceso: `0644`.\n- Archivo en cada host\
  \ administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/recovery-checked`.\n  - Contenido: `checked`.\n\
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Respuesta:\
  \ `stable-63`.\n- Construye un programa de recuperación para la interfaz del invocador de `~/quest/caller-contract.json`\
  \ en la estación de trabajo; `caller-cache.py` modela la actualización de un consumidor local. Acepta un candidato\
  \ válido, recupera uno rechazado desde su copia verificada y actualiza el consumidor correspondiente. Registra\
  \ `checked` al completar cualquiera de las dos rutas. Rechaza una copia no fiable antes de cambiar datos activos\
  \ o caché; conserva los datos ajenos del invocador y la copia y el recibo originales de la estación de trabajo.\n\
  \nLa comprobación examina la suma y los resultados actuales; no demuestra el orden de acciones pasadas."
debrief: Construiste recuperación para entradas aceptadas, rechazadas y no fiables, preservando la integridad de
  la copia y la coherencia del consumidor.
stages.0.brief: La recuperación debe dejar un resultado estable verificado en toda la flota.
stages.0.objectives.0.text: En la workstation, `previous.txt` coincide con el comprobante de recuperación suministrado.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `stable-63`.
  El resultado predeterminado de la flota también se cumple al ejecutar el programa actual con candidatos aceptados,
  rechazados y copias no fiables del invocador.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/recovery-checked` contiene
  `checked`.
stages.0.objectives.4.text: HTTP en el puerto `8080` devuelve `stable-63` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: La validación, la recuperación y la actualización del consumidor forman un límite de transacción común.
  La integridad de la copia debe conocerse antes de modificar datos.
hints.1.text: Compara `rollout.yml`, `caller-contract.json`, `previous.sha256` y las rutas de entrada del invocador.
  Sigue las tareas que modifican datos activos, el rechazo de validación y la notificación que actualiza el consumidor
  recuperado.
hints.2.text: 'Valida la integridad antes del bloque de cambios, recupera el candidato rechazado en rescue y utiliza
  always para el registro final. Verifica `sha256sum -c previous.sha256`, los casos aceptado y rechazado y un recibo
  incorrecto: este último debe fallar sin cambiar datos activos ni caché. Los casos correctos actualizan la caché
  y dejan `checked`; conserva entradas y datos ajenos.'
phrases.0: Verifiqué la reversión artifact antes de distribuirlo.
phrases.1: Utilicé rescue para la recuperación y siempre para el marker final.
phrases.2: Revisé los servicios en vivo después de la recuperación en serie.
diagnostics.checksum: previous.txt debe coincidir con previous.sha256.
diagnostics.content_1: En el host app1 /srv/site/message debe ser igual a stable-63.
diagnostics.content_2: En el host app2 /srv/site/message debe ser igual a stable-63.
diagnostics.content_3: En el host app3 /srv/site/message debe ser igual a stable-63.
diagnostics.mode_1: En el host app1 el modo de /srv/site/message debe ser 644.
diagnostics.mode_2: En el host app2 el modo de /srv/site/message debe ser 644.
diagnostics.mode_3: En el host app3 el modo de /srv/site/message debe ser 644.
diagnostics.marker_1: En el host app1 /srv/site/recovery-checked debe ser igual a checked.
diagnostics.marker_2: En el host app2 /srv/site/recovery-checked debe ser igual a checked.
diagnostics.marker_3: En el host app3 /srv/site/recovery-checked debe ser igual a checked.
diagnostics.http_1: El host app1 en el puerto 8080 debe devolver stable-63.
diagnostics.http_2: El host app2 en el puerto 8080 debe devolver stable-63.
diagnostics.http_3: El host app3 en el puerto 8080 debe devolver stable-63.
diagnostics.recovery_branches: El programa actual no cumple un caso aceptado, rechazado o de copia no fiable. Revisa
  la integridad previa, la recuperación real y la actualización del consumidor.
diagnostics.caller_original: La entrada o el recibo original cambió o falta. Conserva los bytes proporcionados y
  corrige el programa.
diagnostics.caller_observation: No se pudo ejecutar el programa actual. Revisa rutas del invocador, ejecución local
  y errores del playbook.
diagnostics.caller_budget: Se agotó el tiempo de ejecución del invocador. Comprueba órdenes bloqueantes o dependencias
  no disponibles.
diagnostics.probe_0_1: 'Las entradas actuales no permiten verificar este objetivo: En cada host administrado (`app1`,
  `app2`, `app3`), `/srv/site/message` contiene `stable-63`. El resultado predeterminado de la flota también se
  cumple al ejecutar el programa actual con candidatos aceptados, rechazados y copias no fiables del invocador.'
