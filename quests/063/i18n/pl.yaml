title: Akcja ratunkowa
brief: "Po nieudanym wdrożeniu flota potrzebuje zweryfikowanego wyniku przywracania.\n\nPracuj na workstation w\
  \ `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.\n\n**Wymagania:**\n\
  - Artefakt przywracania na workstation:\n  - Ścieżka: `~/quest/previous.txt`.\n  - Zawartość jest zgodna z dostarczonym\
  \ potwierdzeniem przywracania.\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n\
  \  - Treść: `stable-63`.\n  - Tryb dostępu: `0644`.\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n\
  \  - Ścieżka: `/srv/site/recovery-checked`.\n  - Treść: `checked`.\n- Aktywna usługa na każdym zarządzanym hoście\
  \ (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź: `stable-63`.\n- Zbuduj program odzyskiwania\
  \ dla interfejsu wywołującego z `~/quest/caller-contract.json` na stacji roboczej; `caller-cache.py` modeluje\
  \ odświeżanie lokalnego konsumenta. Przyjmij poprawnego kandydata, po odrzuceniu odtwórz zweryfikowaną kopię i\
  \ odśwież odpowiedniego działającego konsumenta. Po obu zakończonych ścieżkach zapisz `checked`. Odrzuć niezaufaną\
  \ kopię przed zmianą danych roboczych lub pamięci podręcznej; zachowaj pozostałe dane wywołującego oraz oryginalną\
  \ kopię i potwierdzenie na stacji roboczej.\n\nSprawdzenie bada sumę kontrolną i bieżące wyniki; nie dowodzi kolejności\
  \ wcześniejszych działań."
debrief: Zbudowano odzyskiwanie dla przyjętych, odrzuconych i niezaufanych wejść, zachowując integralność kopii
  i spójność konsumenta.
stages.0.brief: Przywracanie musi pozostawić zweryfikowany stabilny wynik w całej flocie.
stages.0.objectives.0.text: Na workstation plik `previous.txt` jest zgodny z dostarczonym potwierdzeniem przywracania.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `stable-63`. Domyślny wynik floty obowiązuje również podczas ponownego uruchomienia bieżącego programu z przyjętym,
  odrzuconym kandydatem i niezaufaną kopią wywołującego.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/recovery-checked`
  zawiera `checked`.
stages.0.objectives.4.text: HTTP na porcie `8080` zwraca `stable-63` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Walidacja wejścia, odzyskiwanie i odświeżanie konsumenta tworzą wspólną granicę transakcji. Integralność
  kopii musi być znana przed zmianami.
hints.1.text: Porównaj `rollout.yml`, `caller-contract.json`, `previous.sha256` i ścieżki wejściowe wywołującego.
  Prześledź zadania zmieniające dane robocze, odrzucenie walidacji i powiadomienie odświeżające odzyskanego konsumenta.
hints.2.text: 'Zweryfikuj integralność przed blokiem zmian, obsłuż odrzuconego kandydata w rescue, a always przeznacz
  na zapis końcowy. Sprawdź `sha256sum -c previous.sha256`, przyjęty i odrzucony przypadek oraz błędne potwierdzenie:
  ostatni ma zakończyć się błędem bez zmiany danych roboczych i pamięci podręcznej. Udane przypadki odświeżają pamięć
  i pozostawiają `checked`; zachowaj wejścia i pozostałe dane.'
phrases.0: Sprawdziłem wycofanie artifact przed jego dystrybucją.
phrases.1: Użyłem rescue do odzyskiwania i always do ostatecznego marker.
phrases.2: Sprawdziłem usługi na żywo po odzyskaniu seryjnym.
