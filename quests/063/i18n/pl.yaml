title: Akcja ratunkowa
brief: 'Nieudany candidate musi przywrócić dostarczony previous.txt na wszystkich trzech hostach floty.
  Zweryfikuj previous.sha256, zaimplementuj rescue w rollout.yml, zachowaj always marker, użyj serial:
  1 i ponownie załaduj aktywny baner poprzez jego handler. candidate jest celowo nieprawidłowy; sukces
  oznacza stable-63 z każdego HTTP endpoint, a nie ignorowany błąd sprawdzania poprawności.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `previous.txt`, `previous.sha256`, `candidate.txt`, `verification.log`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Serial rescue przywraca zweryfikowany previous artifact, uruchamia always
  na każdym hoście i obsługuje stable-63 ze wszystkich trzech endpoints.'
debrief: Kontrolowana awaria prowadzi teraz do zweryfikowanego wycofania zamiast częściowej zmiany fleet.
stages.0.brief: 'Kryteria sukcesu: Serial rescue przywraca zweryfikowany previous artifact, uruchamia
  always na każdym hoście i obsługuje stable-63 ze wszystkich trzech endpoints.'
stages.0.objectives.0.text: Serial rescue przywraca zweryfikowany previous artifact, uruchamia always
  na każdym hoście i obsługuje stable-63 ze wszystkich trzech endpoints.
hints.0.text: Uratowana awaria nie oznacza przywrócenia poprzedniego stanu.
hints.1.text: Przywróć zweryfikowany artifact w rescue i powiadom handler.
hints.2.text: Trzymaj always oddzielnie od rescue; sprawdź pliki i HTTP na wszystkich hostach.
phrases.0: Sprawdziłem wycofanie artifact przed jego dystrybucją.
phrases.1: Użyłem rescue do odzyskiwania i always do ostatecznego marker.
phrases.2: Sprawdziłem usługi na żywo po odzyskaniu seryjnym.
