title: Akcja ratunkowa
brief: 'Pracuj w `~/quest` z `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `previous.sha256` i `candidate.txt`.
  Ansible `block` grupuje zadania; `rescue` obsługuje błąd, `always` działa po każdym wyniku, a `serial: 1` przetwarza po
  jednym hoście. Sprawdź `previous.txt` przez `sha256sum -c previous.sha256`. Kandydat jest celowo niepoprawny.


  W `rollout.yml` pierwszy play musi wskazywać `fleet` i mieć liczbowe `serial: 1`; jego pierwsze zadanie musi zawierać niepuste
  listy `block`, `rescue` i `always`. Pierwsze zadanie rescue musi używać dokładnie `ansible.builtin.copy` z `src: previous.txt`,
  `dest: /srv/site/message` i `mode: "0644"` oraz powiadamiać `Reload banner`. Dostarczony handler uruchamia `dq-service reload`,
  by usługa ponownie odczytała plik. Uruchom `ansible-playbook rollout.yml`. Na app1, app2 i app3 `/srv/site/message` musi
  zawierać `stable-63` z trybem `0644`, `/srv/site/recovery-checked` musi zawierać `checked`, a HTTP na porcie 8080 musi zwracać
  `stable-63`. Kontrole sprawdzają sumę, playbook i bieżące wyniki; nie dowodzą kolejności wcześniejszych działań. Pracuj
  tylko w zatoce offline.'
debrief: Kontrole sprawdziły sumę, strukturę playbooka, pliki floty i odpowiedzi usług.
stages.0.brief: Suma kontrolna, określona struktura playbooka, pliki floty i odpowiedzi HTTP odpowiadają opisowi.
stages.0.objectives.0.text: Suma kontrolna, określona struktura playbooka, pliki floty i odpowiedzi HTTP odpowiadają opisowi.
hints.0.text: Uratowana awaria nie oznacza przywrócenia poprzedniego stanu.
hints.1.text: Przywróć zweryfikowany artifact w rescue i powiadom handler.
hints.2.text: Trzymaj `always` oddzielnie od `rescue`; sprawdź pliki i HTTP na wszystkich hostach.
phrases.0: Sprawdziłem wycofanie artifact przed jego dystrybucją.
phrases.1: Użyłem rescue do odzyskiwania i always do ostatecznego marker.
phrases.2: Sprawdziłem usługi na żywo po odzyskaniu seryjnym.
