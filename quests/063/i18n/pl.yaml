diagnostics.recovery_branches: Bieżący program nie spełnia przypadku przyjęcia, odrzucenia lub niezaufanej kopii.
  Sprawdź integralność przed zmianami, rzeczywiste odzyskiwanie i odświeżanie konsumenta.
diagnostics.caller_original: Oryginalne wejście lub potwierdzenie zmieniono albo go brakuje. Zachowaj dostarczone
  bajty i popraw program.
diagnostics.caller_observation: Nie można ponownie uruchomić bieżącego programu. Sprawdź ścieżki wywołującego, lokalne
  wykonanie i błędy playbooka.
diagnostics.caller_budget: Przekroczono czas uruchomienia wywołującego. Sprawdź blokujące polecenia i niedostępne
  zależności.
