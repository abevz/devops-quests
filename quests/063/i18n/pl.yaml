title: Akcja ratunkowa
brief: |-
  Po nieudanym wdrożeniu flota potrzebuje zweryfikowanego wyniku przywracania.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`, `previous.txt`, `candidate.txt`.

  **Wymagania:**
  - Artefakt przywracania na workstation:
    - Ścieżka: `~/quest/previous.txt`.
    - Zawartość jest zgodna z dostarczonym potwierdzeniem przywracania.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `stable-63`.
    - Tryb dostępu: `0644`.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/recovery-checked`.
    - Treść: `checked`.
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Odpowiedź: `stable-63`.

  Sprawdzenie bada sumę kontrolną i bieżące wyniki; nie dowodzi kolejności wcześniejszych działań.
debrief: Kontrole sprawdziły sumę, strukturę playbooka, pliki floty i odpowiedzi usług.
stages.0.brief: Przywracanie musi pozostawić zweryfikowany stabilny wynik w całej flocie.
stages.0.objectives.0.text: Na workstation plik `previous.txt` jest zgodny z dostarczonym potwierdzeniem
  przywracania.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `stable-63`.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message`
  ma tryb `0644`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/recovery-checked`
  zawiera `checked`.
stages.0.objectives.4.text: HTTP na porcie `8080` zwraca `stable-63` na każdym zarządzanym hoście (`app1`,
  `app2`, `app3`).
hints.0.text: Uratowana awaria nie oznacza przywrócenia poprzedniego stanu.
hints.1.text: |-
  Przywróć zweryfikowany artifact w rescue i powiadom handler.

  Sprawdź inventory i dostarczony playbook na workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  cat previous.sha256
  ```
hints.2.text: |-
  Sprawdź wynik z `~/quest` na workstation:

  - `sha256sum -c previous.sha256` — Zgłasza `previous.txt: OK`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/recovery-checked; ls -l /srv/site/message'` — Każdy host pokazuje `stable-63`, `checked` i `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Pokazuje `stable-63` z `app1`, `app2`, `app3`.
phrases.0: Sprawdziłem wycofanie artifact przed jego dystrybucją.
phrases.1: Użyłem rescue do odzyskiwania i always do ostatecznego marker.
phrases.2: Sprawdziłem usługi na żywo po odzyskaniu seryjnym.
