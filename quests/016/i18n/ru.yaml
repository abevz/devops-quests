title: Выходные значения
brief: 'Файл релиза управляется корректно, но downstream-инструменту нужен структурированный output release.
  В JSON должны быть route=north, числовой revision=16 и targets=[app1, app2, app3]. Исправьте output
  без замены файлового ресурса.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Output release — требуемый типизированный объект, файл сохраняет north-r16, итоговый
  plan пуст.'
debrief: Outputs — интерфейс для следующей автоматизации. Исправленный объект сохраняет типы и не требует
  разбора форматированной строки.
stages.0.brief: 'Используйте object: CLI сериализует типы. Строка, похожая на JSON, не является объектом.


  Результат проверки: Output release — требуемый типизированный объект, файл сохраняет north-r16, итоговый
  plan пуст.'
stages.0.objectives.0.text: Output release — требуемый типизированный объект, файл сохраняет north-r16,
  итоговый plan пуст.
hints.0.text: Прочитайте tofu output -json release и тип JSON.
hints.1.text: Объект HCL сохраняет числовые поля и списки.
hints.2.text: Примените изменение output и проверьте отсутствие изменений ресурсов.
phrases.0: Я выдал структурированные outputs вместо строк, похожих на JSON.
phrases.1: Я сохранил типы outputs для сериализации в CLI.
phrases.2: Я проверил объект output и значения его полей.
