title: Выходные значения
brief: |
  Получателю данных выпуска нужна структура данных вместе с управляемым файлом выпуска. Сохраните существующий файловый ресурс.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`.

  **Требования:**
  - State OpenTofu содержит:
    - `local_file.release`
  - Файлы в `~/quest` на workstation:
    - `release.txt`: `north-r16`
  - Выходное значение `release` — структурированный объект со следующими полями:
    - `route`: `north`
    - `revision`: `16` (число)
    - `targets`: `app1`, `app2`, `app3` (в указанном порядке)
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `tofu state list` — Ожидаются адреса state из требований.
  - Ожидается соответствие файла выпуска и структурированного выходного значения требованиям, включая числовую ревизию и упорядоченный список целей.

    ```sh
    cat release.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Outputs — интерфейс для следующей автоматизации. Исправленный объект сохраняет типы и не требует
  разбора форматированной строки.
stages.0.brief: |
  Выходное значение выпуска должно сохранять типы данных и управляемый файл.
stages.0.objectives.0.text: В state есть `local_file.release`.
stages.0.objectives.1.text: '`release.txt` содержит `north-r16`.'
stages.0.objectives.2.text: 'Output `release` — структурированный объект: `route` содержит `north`, `revision`
  — число `16`, а `targets` перечисляет `app1`, `app2`, `app3` в этом порядке.'
stages.0.objectives.3.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Прочитайте tofu output -json release и тип JSON.
hints.1.text: |
  Строка, похожая на JSON, не является структурированным объектом. Объекты HCL сохраняют числовые поля и списки.
hints.2.text: Примените изменение output и проверьте отсутствие изменений ресурсов.
phrases.0: Я выдал структурированные outputs вместо строк, похожих на JSON.
phrases.1: Я сохранил типы outputs для сериализации в CLI.
phrases.2: Я проверил объект output и значения его полей.
