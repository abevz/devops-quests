title: Выходные значения
brief: "Получателю данных выпуска нужна структура данных вместе с управляемым файлом выпуска. Сохраните существующий\
  \ файловый ресурс.\n\nРаботайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`.\n\n\
  **Требования:**\n- State OpenTofu содержит:\n  - `local_file.release`\n- Файлы в `~/quest` на workstation:\n\
  \  - `release.txt`: `north-r16`\n- Выходное значение `release` — структурированный объект со следующими полями:\n\
  \  - `route`: `north`\n  - `revision`: `16` (число)\n  - `targets`: `app1`, `app2`, `app3` (в указанном порядке)\n\
  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.\n"
debrief: Outputs — интерфейс для следующей автоматизации. Исправленный объект сохраняет типы и не требует разбора
  форматированной строки.
stages.0.brief: Выходное значение выпуска должно сохранять типы данных и управляемый файл.
stages.0.objectives.0.text: В state есть `local_file.release`.
stages.0.objectives.1.text: '`release.txt` содержит `north-r16`.'
stages.0.objectives.2.text: 'Output `release` — структурированный объект: `route` содержит `north`, `revision`
  — число `16`, а `targets` перечисляет `app1`, `app2`, `app3` в этом порядке.'
stages.0.objectives.3.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Структурированные выходы сохраняют типы данных для последующих потребителей.
hints.1.text: 'Прочитайте tofu output -json release и тип JSON.


  Строка, похожая на JSON, не является структурированным объектом. Объекты HCL сохраняют числовые поля и списки.


  Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf

  tofu output -json release

  ```'
hints.2.text: "Примените изменение output и проверьте отсутствие изменений ресурсов.\n\nПроверьте наблюдаемый\
  \ результат:\n\n- `tofu state list` — Ожидаются адреса state из требований.\n\n- Ожидается соответствие файла\
  \ выпуска и структурированного выходного значения требованиям, включая числовую ревизию и упорядоченный список\
  \ целей.\n\n  ```sh\n  cat release.txt\n  tofu output -json\n  ```\n\n- `tofu plan -input=false -detailed-exitcode\
  \ -no-color` — Ожидаются отсутствие изменений и код завершения `0`."
phrases.0: Я выдал структурированные outputs вместо строк, похожих на JSON.
phrases.1: Я сохранил типы outputs для сериализации в CLI.
phrases.2: Я проверил объект output и значения его полей.
