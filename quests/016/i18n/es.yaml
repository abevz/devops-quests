title: Salidas
brief: "El consumidor de la versión necesita datos estructurados junto al archivo gestionado. Conserva el recurso\
  \ de archivo existente.\n\nTrabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`.\n\
  \n**Requisitos:**\n- El estado de OpenTofu contiene:\n  - `local_file.release`\n- Archivos en `~/quest` en\
  \ la workstation:\n  - `release.txt`: `north-r16`\n- La salida `release` es un objeto estructurado con estos\
  \ miembros:\n  - `route`: `north`\n  - `revision`: `16` (número)\n  - `targets`: `app1`, `app2`, `app3` (en\
  \ este orden)\n- Un plan detallado no muestra cambios de infraestructura pendientes y termina con código\
  \ `0`.\n"
debrief: Outputs forma una interfaz para la automatización posterior. El objeto reparado conserva sus tipos
  en lugar de depender de las personas que llaman para analizar una cadena formateada.
stages.0.brief: La salida de la versión debe conservar sus tipos de datos y el archivo gestionado.
stages.0.objectives.0.text: El state contiene `local_file.release`.
stages.0.objectives.1.text: '`release.txt` contiene `north-r16`.'
stages.0.objectives.2.text: 'El output `release` es un objeto estructurado: `route` contiene `north`, `revision`
  es el número `16` y `targets` enumera `app1`, `app2`, `app3` en ese orden.'
stages.0.objectives.3.text: OpenTofu no informa cambios de infraestructura pendientes.
hints.0.text: Las salidas estructuradas conservan los tipos de datos para los consumidores posteriores.
hints.1.text: 'Inspecciona `tofu output -json release` y el tipo JSON de la salida.


  Una cadena que parece JSON no es un objeto estructurado. Los objetos HCL conservan los miembros numéricos
  y las listas.


  Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf

  tofu output -json release

  ```'
hints.2.text: "Aplique el cambio de salida y verifique que los recursos administrados no necesiten cambios.\n\
  \nVerifica el resultado observado:\n\n- `tofu state list` — Se esperan las direcciones de estado indicadas\
  \ en Requisitos.\n\n- Se espera que el archivo de versión y la salida estructurada coincidan con Requisitos,\
  \ incluida la revisión numérica y la lista ordenada de destinos.\n\n  ```sh\n  cat release.txt\n  tofu output\
  \ -json\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios\
  \ y código de salida `0`."
phrases.0: Expuse cadenas estructuradas outputs en lugar de cadenas en forma de JSON.
phrases.1: Conservé los tipos de salida para la serialización CLI.
phrases.2: Verifiqué el objeto de salida y sus valores de campo.
