title: Salidas
brief: 'El archivo de versión se administra correctamente, pero la herramienta posterior necesita una
  salida estructurada denominada versión. Su valor JSON debe contener route=north, numérico revision=16
  y targets=[app1, app2, app3]. Repare la salida sin reemplazar el recurso del archivo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.'
debrief: Outputs forma una interfaz para la automatización posterior. El objeto reparado conserva sus
  tipos en lugar de depender de las personas que llaman para analizar una cadena formateada.
stages.0.brief: Utilice un valor object para que CLI pueda serializar tipos; una cadena con aspecto de
  JSON no es un object.
stages.0.objectives.0.text: El state contiene `local_file.release`.
stages.0.objectives.1.text: '`release.txt` contiene `north-r16`.'
stages.0.objectives.2.text: 'El output `release` es un objeto estructurado: `route` contiene `north`,
  `revision` es el número `16` y `targets` enumera `app1`, `app2`, `app3` en ese orden.'
stages.0.objectives.3.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Inspeccione la versión -json de salida tofu y su tipo JSON.
hints.1.text: Los valores de objeto HCL conservan miembros numéricos y de lista.
hints.2.text: Aplique el cambio de salida y verifique que los recursos administrados no necesiten cambios.
phrases.0: Expuse cadenas estructuradas outputs en lugar de cadenas en forma de JSON.
phrases.1: Conservé los tipos de salida para la serialización CLI.
phrases.2: Verifiqué el objeto de salida y sus valores de campo.
