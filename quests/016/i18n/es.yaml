title: Salidas
brief: |
  El consumidor de la versión necesita datos estructurados junto al archivo gestionado. Conserva el recurso de archivo existente.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`.

  **Requisitos:**
  - El estado de OpenTofu contiene:
    - `local_file.release`
  - Archivos en `~/quest` en la workstation:
    - `release.txt`: `north-r16`
  - La salida `release` es un objeto estructurado con estos miembros:
    - `route`: `north`
    - `revision`: `16` (número)
    - `targets`: `app1`, `app2`, `app3` (en este orden)
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `tofu state list` — Se esperan las direcciones de estado indicadas en Requisitos.
  - Se espera que el archivo de versión y la salida estructurada coincidan con Requisitos, incluida la revisión numérica y la lista ordenada de destinos.

    ```sh
    cat release.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
debrief: Outputs forma una interfaz para la automatización posterior. El objeto reparado conserva sus
  tipos en lugar de depender de las personas que llaman para analizar una cadena formateada.
stages.0.brief: |
  La salida de la versión debe conservar sus tipos de datos y el archivo gestionado.
stages.0.objectives.0.text: El state contiene `local_file.release`.
stages.0.objectives.1.text: '`release.txt` contiene `north-r16`.'
stages.0.objectives.2.text: 'El output `release` es un objeto estructurado: `route` contiene `north`,
  `revision` es el número `16` y `targets` enumera `app1`, `app2`, `app3` en ese orden.'
stages.0.objectives.3.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Inspeccione la versión -json de salida tofu y su tipo JSON.
hints.1.text: |
  Una cadena que parece JSON no es un objeto estructurado. Los objetos HCL conservan los miembros numéricos y las listas.
hints.2.text: Aplique el cambio de salida y verifique que los recursos administrados no necesiten cambios.
phrases.0: Expuse cadenas estructuradas outputs en lugar de cadenas en forma de JSON.
phrases.1: Conservé los tipos de salida para la serialización CLI.
phrases.2: Verifiqué el objeto de salida y sus valores de campo.
