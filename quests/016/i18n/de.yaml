title: Ausgänge
brief: |
  Der nachgelagerte Verbraucher benötigt strukturierte Freigabedaten neben der verwalteten Freigabedatei. Behalten Sie die bestehende Dateiressource bei.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`.

  **Anforderungen:**
  - Der OpenTofu-State enthält:
    - `local_file.release`
  - Dateien in `~/quest` auf der Workstation:
    - `release.txt`: `north-r16`
  - Die Ausgabe `release` ist ein strukturiertes Objekt mit diesen Feldern:
    - `route`: `north`
    - `revision`: `16` (Zahl)
    - `targets`: `app1`, `app2`, `app3` (in dieser Reihenfolge)
  - `tofu plan` endet mit Code `0` und meldet keine Änderungen.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `tofu state list` — Erwartet: die unter Anforderungen genannten State-Adressen.
  - Erwartet: Freigabedatei und strukturierte Ausgabe entsprechen den Anforderungen, einschließlich numerischer Revision und geordneter Zielliste.

    ```sh
    cat release.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Outputs bilden eine Schnittstelle für die nachgelagerte Automatisierung. Das reparierte Objekt
  behält seine Typen bei, anstatt sich darauf zu verlassen, dass Aufrufer eine formatierte Zeichenfolge
  analysieren.
stages.0.brief: |
  Die Freigabeausgabe muss ihre Datentypen und die verwaltete Datei beibehalten.
stages.0.objectives.0.text: Der State enthält `local_file.release`.
stages.0.objectives.1.text: '`release.txt` enthält `north-r16`.'
stages.0.objectives.2.text: 'Output `release` ist ein strukturiertes Objekt: `route` enthält `north`,
  `revision` ist die Zahl `16`, und `targets` enthält `app1`, `app2`, `app3` in dieser Reihenfolge.'
stages.0.objectives.3.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Überprüfen Sie die tofu-Ausgabeversion -json und ihren JSON-Typ.
hints.1.text: |
  Eine Zeichenfolge, die wie JSON aussieht, ist kein strukturiertes Objekt. HCL-Objektwerte bewahren numerische Felder und Listen.
hints.2.text: Wenden Sie die Ausgabeänderung an und stellen Sie sicher, dass für die verwalteten Ressourcen
  keine Änderung erforderlich ist.
phrases.0: Ich habe strukturierte outputs anstelle von JSON-förmigen Zeichenfolgen bereitgestellt.
phrases.1: Ich habe Ausgabetypen für die CLI-Serialisierung beibehalten.
phrases.2: Ich habe das Ausgabeobjekt und seine Feldwerte überprüft.
