title: Ausgänge
brief: "Der nachgelagerte Verbraucher benötigt strukturierte Freigabedaten neben der verwalteten Freigabedatei.\
  \ Behalten Sie die bestehende Dateiressource bei.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte\
  \ Eingabedateien: `main.tf`.\n\n**Anforderungen:**\n- Der OpenTofu-State enthält:\n  - `local_file.release`\n\
  - Dateien in `~/quest` auf der Workstation:\n  - `release.txt`: `north-r16`\n- Die Ausgabe `release` ist\
  \ ein strukturiertes Objekt mit diesen Feldern:\n  - `route`: `north`\n  - `revision`: `16` (Zahl)\n  - `targets`:\
  \ `app1`, `app2`, `app3` (in dieser Reihenfolge)\n- Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen\
  \ und endet mit Code `0`.\n"
debrief: Outputs bilden eine Schnittstelle für die nachgelagerte Automatisierung. Das reparierte Objekt behält
  seine Typen bei, anstatt sich darauf zu verlassen, dass Aufrufer eine formatierte Zeichenfolge analysieren.
stages.0.brief: Die Freigabeausgabe muss ihre Datentypen und die verwaltete Datei beibehalten.
stages.0.objectives.0.text: Der State enthält `local_file.release`.
stages.0.objectives.1.text: '`release.txt` enthält `north-r16`.'
stages.0.objectives.2.text: 'Output `release` ist ein strukturiertes Objekt: `route` enthält `north`, `revision`
  ist die Zahl `16`, und `targets` enthält `app1`, `app2`, `app3` in dieser Reihenfolge.'
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Strukturierte Ausgaben bewahren Datentypen für nachgelagerte Nutzer.
hints.1.text: 'Prüfen Sie tofu output -json release und den JSON-Typ der Ausgabe.


  Eine Zeichenfolge, die wie JSON aussieht, ist kein strukturiertes Objekt. HCL-Objektwerte bewahren numerische
  Felder und Listen.


  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf

  tofu output -json release

  ```'
hints.2.text: "Wenden Sie die Ausgabeänderung an und stellen Sie sicher, dass für die verwalteten Ressourcen\
  \ keine Änderung erforderlich ist.\n\nPrüfen Sie das beobachtete Ergebnis:\n\n- `tofu state list` — Erwartet:\
  \ die unter Anforderungen genannten State-Adressen.\n\n- Erwartet: Freigabedatei und strukturierte Ausgabe\
  \ entsprechen den Anforderungen, einschließlich numerischer Revision und geordneter Zielliste.\n\n  ```sh\n\
  \  cat release.txt\n  tofu output -json\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color`\
  \ — Erwartet: keine Änderungen, Exit-Code `0`."
phrases.0: Ich habe strukturierte outputs anstelle von JSON-förmigen Zeichenfolgen bereitgestellt.
phrases.1: Ich habe Ausgabetypen für die CLI-Serialisierung beibehalten.
phrases.2: Ich habe das Ausgabeobjekt und seine Feldwerte überprüft.
