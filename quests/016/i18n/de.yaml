title: Ausgänge
brief: 'Die Release-Datei wird ordnungsgemäß verwaltet, das Downstream-Tool benötigt jedoch eine strukturierte
  Ausgabe mit dem Namen „Release“. Sein JSON-Wert muss route=north, numerisches revision=16 und targets=[app1,
  app2, app3] enthalten. Reparieren Sie die Ausgabe, ohne die Dateiressource zu ersetzen.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die Release-Ausgabe ist das erforderliche typisierte Objekt, die Datei
  bleibt north-r16 und das endgültige plan ist leer.'
debrief: Outputs bilden eine Schnittstelle für die nachgelagerte Automatisierung. Das reparierte Objekt
  behält seine Typen bei, anstatt sich darauf zu verlassen, dass Aufrufer eine formatierte Zeichenfolge
  analysieren.
stages.0.brief: 'Verwenden Sie einen object-Wert, damit CLI Typen serialisieren kann. Eine JSON-ähnliche
  Zeichenfolge ist kein object.


  Erfolgskriterien: Die Release-Ausgabe ist der erforderliche Typ object, die Datei bleibt north-r16 und
  die endgültige Ausgabe plan ist leer.'
stages.0.objectives.0.text: Die Release-Ausgabe ist das erforderliche typisierte Objekt, die Datei bleibt
  north-r16 und die endgültige plan ist leer.
hints.0.text: Überprüfen Sie die tofu-Ausgabeversion -json und ihren JSON-Typ.
hints.1.text: HCL-Objektwerte behalten numerische und Listenelemente bei.
hints.2.text: Wenden Sie die Ausgabeänderung an und stellen Sie sicher, dass für die verwalteten Ressourcen
  keine Änderung erforderlich ist.
phrases.0: Ich habe strukturierte outputs anstelle von JSON-förmigen Zeichenfolgen bereitgestellt.
phrases.1: Ich habe Ausgabetypen für die CLI-Serialisierung beibehalten.
phrases.2: Ich habe das Ausgabeobjekt und seine Feldwerte überprüft.
