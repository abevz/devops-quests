title: Wyjścia
brief: "Odbiorca danych wydania potrzebuje danych strukturalnych obok zarządzanego pliku wydania. Zachowaj\
  \ istniejący zasób pliku.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`.\n\
  \n**Wymagania:**\n- Stan OpenTofu zawiera:\n  - `local_file.release`\n- Pliki w `~/quest` na workstation:\n\
  \  - `release.txt`: `north-r16`\n- Wynik `release` jest obiektem strukturalnym z następującymi polami:\n\
  \  - `route`: `north`\n  - `revision`: `16` (liczba)\n  - `targets`: `app1`, `app2`, `app3` (w tej kolejności)\n\
  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.\n"
debrief: Outputs tworzy interfejs do dalszej automatyzacji. Naprawiony obiekt zachowuje swoje typy, zamiast
  polegać na obiektach wywołujących w celu przeanalizowania sformatowanego ciągu.
stages.0.brief: Wynik wydania ma zachować typy danych i zarządzany plik.
stages.0.objectives.0.text: State zawiera `local_file.release`.
stages.0.objectives.1.text: '`release.txt` zawiera `north-r16`.'
stages.0.objectives.2.text: 'Output `release` jest obiektem strukturalnym: `route` zawiera `north`, `revision`
  to liczba `16`, a `targets` wymienia `app1`, `app2`, `app3` w tej kolejności.'
stages.0.objectives.3.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Ustrukturyzowane wyniki zachowują typy danych dla dalszych odbiorców.
hints.1.text: 'Sprawdź tofu output -json release i jego typ JSON.


  Tekst przypominający JSON nie jest obiektem strukturalnym. Obiekty HCL zachowują pola liczbowe i listy.


  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf

  tofu output -json release

  ```'
hints.2.text: "Zastosuj zmianę output i sprawdź, czy zarządzane zasoby nie wymagają zmian.\n\nSprawdź obserwowany\
  \ wynik:\n\n- `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.\n\n- Oczekiwane: plik\
  \ wydania i wynik strukturalny odpowiadają wymaganiom, w tym liczbowa rewizja i uporządkowana lista celów.\n\
  \n  ```sh\n  cat release.txt\n  tofu output -json\n  ```\n\n- `tofu plan -input=false -detailed-exitcode\
  \ -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`."
phrases.0: Ujawniłem strukturalne ciągi w kształcie outputs, a nie JSON.
phrases.1: Zachowałem typy wyjściowe dla serializacji CLI.
phrases.2: Sprawdziłem obiekt output i jego wartości w polach.
