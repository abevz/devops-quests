title: Wyjścia
brief: |
  Odbiorca danych wydania potrzebuje danych strukturalnych obok zarządzanego pliku wydania. Zachowaj istniejący zasób pliku.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`.

  **Wymagania:**
  - Stan OpenTofu zawiera:
    - `local_file.release`
  - Pliki w `~/quest` na workstation:
    - `release.txt`: `north-r16`
  - Wynik `release` jest obiektem strukturalnym z następującymi polami:
    - `route`: `north`
    - `revision`: `16` (liczba)
    - `targets`: `app1`, `app2`, `app3` (w tej kolejności)
  - `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.
  - Oczekiwane: plik wydania i wynik strukturalny odpowiadają wymaganiom, w tym liczbowa rewizja i uporządkowana lista celów.

    ```sh
    cat release.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
debrief: Outputs tworzy interfejs do dalszej automatyzacji. Naprawiony obiekt zachowuje swoje typy, zamiast
  polegać na obiektach wywołujących w celu przeanalizowania sformatowanego ciągu.
stages.0.brief: |
  Wynik wydania ma zachować typy danych i zarządzany plik.
stages.0.objectives.0.text: State zawiera `local_file.release`.
stages.0.objectives.1.text: '`release.txt` zawiera `north-r16`.'
stages.0.objectives.2.text: 'Output `release` jest obiektem strukturalnym: `route` zawiera `north`, `revision`
  to liczba `16`, a `targets` wymienia `app1`, `app2`, `app3` w tej kolejności.'
stages.0.objectives.3.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Sprawdź tofu output -json release i jego typ JSON.
hints.1.text: |
  Tekst przypominający JSON nie jest obiektem strukturalnym. Obiekty HCL zachowują pola liczbowe i listy.
hints.2.text: Zastosuj zmianę output i sprawdź, czy zarządzane zasoby nie wymagają zmian.
phrases.0: Ujawniłem strukturalne ciągi w kształcie outputs, a nie JSON.
phrases.1: Zachowałem typy wyjściowe dla serializacji CLI.
phrases.2: Sprawdziłem obiekt output i jego wartości w polach.
