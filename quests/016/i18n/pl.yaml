title: Wyjścia
brief: 'Plik wydania jest zarządzany poprawnie, ale dalsze narzędzie wymaga uporządkowanej wersji o nazwie
  output. Jego wartość JSON musi zawierać route=north, numeryczne revision=16 i targets=[app1, app2, app3].
  Napraw output bez wymiany zasobu plikowego.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.'
debrief: Outputs tworzy interfejs do dalszej automatyzacji. Naprawiony obiekt zachowuje swoje typy, zamiast
  polegać na obiektach wywołujących w celu przeanalizowania sformatowanego ciągu.
stages.0.brief: Użyj wartości obiektu, aby CLI mógł serializować typy; ciąg znaków wyglądający na JSON
  nie jest obiektem.
stages.0.objectives.0.text: State zawiera `local_file.release`.
stages.0.objectives.1.text: '`release.txt` zawiera `north-r16`.'
stages.0.objectives.2.text: 'Output `release` jest obiektem strukturalnym: `route` zawiera `north`, `revision`
  to liczba `16`, a `targets` wymienia `app1`, `app2`, `app3` w tej kolejności.'
stages.0.objectives.3.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Sprawdź tofu output -json release i jego typ JSON.
hints.1.text: Wartości obiektu HCL zachowują elementy liczbowe i listy.
hints.2.text: Zastosuj zmianę output i sprawdź, czy zarządzane zasoby nie wymagają zmian.
phrases.0: Ujawniłem strukturalne ciągi w kształcie outputs, a nie JSON.
phrases.1: Zachowałem typy wyjściowe dla serializacji CLI.
phrases.2: Sprawdziłem obiekt output i jego wartości w polach.
