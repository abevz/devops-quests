title: Outputs
brief: 'The release file is managed correctly, but the downstream tool needs a structured output named
  release. Its JSON value must contain route=north, numeric revision=16 and targets=[app1, app2, app3].
  Repair the output without replacing the file resource.


  Quest files in `~/quest` (some appear in later stages): `main.tf`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The release output is the required typed object, the file remains north-r16
  and the final plan is empty.'
debrief: Outputs form an interface for downstream automation. The repaired object preserves its types
  rather than relying on callers to parse a formatted string.
stages.0.brief: 'Use an object value so the CLI can serialize types; a JSON-looking string is not an object.


  Success criteria: The release output is the required typed object, the file remains north-r16 and the
  final plan is empty.'
stages.0.objectives.0.text: The release output is the required typed object, the file remains north-r16
  and the final plan is empty.
hints.0.text: Inspect tofu output -json release and its JSON type.
hints.1.text: HCL object values preserve numeric and list members.
hints.2.text: Apply the output change and verify that managed resources need no change.
phrases.0: I exposed structured outputs rather than JSON-shaped strings.
phrases.1: I preserved output types for CLI serialization.
phrases.2: I verified the output object and its field values.
