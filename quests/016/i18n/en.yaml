title: Outputs
brief: |
  The downstream release consumer needs structured data alongside the managed release file. Keep the existing file resource.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`.

  **Requirements:**
  - OpenTofu state contains:
    - `local_file.release`
  - Files in `~/quest` on the workstation:
    - `release.txt`: `north-r16`
  - Output `release` is a structured object, with these members:
    - `route`: `north`
    - `revision`: `16` (number)
    - `targets`: `app1`, `app2`, `app3` (in this order)
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `tofu state list` — Expected: the state addresses listed in Requirements.
  - Expected: the release file and structured output match Requirements, including the numeric revision and ordered target list.

    ```sh
    cat release.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
debrief: Outputs form an interface for downstream automation. The repaired object preserves its types
  rather than relying on callers to parse a formatted string.
stages.0.brief: |
  The release output must retain its data types and the managed file.
stages.0.objectives.0.text: The state tracks `local_file.release`.
stages.0.objectives.1.text: '`release.txt` contains `north-r16`.'
stages.0.objectives.2.text: 'Output `release` is a structured object: `route` contains `north`, `revision`
  is the number `16`, and `targets` lists `app1`, `app2`, `app3` in that order.'
stages.0.objectives.3.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: Inspect tofu output -json release and its JSON type.
hints.1.text: |
  A JSON-looking string is not a structured object. HCL object values preserve numeric and list members.
hints.2.text: Apply the output change and verify that managed resources need no change.
phrases.0: I exposed structured outputs rather than JSON-shaped strings.
phrases.1: I preserved output types for CLI serialization.
phrases.2: I verified the output object and its field values.
