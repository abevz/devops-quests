id: 16
title: title
track: OpenTofu
difficulty: basics
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    keep: true
    check: |-
      tofu state list | grep -Fx local_file.release || {
        code=$?
        printf '%s\n' 'OpenTofu tracks local_file.release: ✗ [DQ:condition_0]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.1.text
    keep: true
    check: |-
      test "$(cat release.txt)" = north-r16 || {
        code=$?
        printf '%s\n' 'release.txt contains north-r16: ✗ [DQ:condition_1]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.2.text
    check: |-
      tofu output -json release | jq -e '.route=="north" and .revision==16 and .targets==["app1","app2","app3"]' >/dev/null || {
        code=$?
        printf '%s\n' 'release output is the expected JSON object: ✗ [DQ:condition_2]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.3.text
    keep: true
    check: |-
      tofu plan -input=false -detailed-exitcode -no-color >/dev/null || {
        code=$?
        printf '%s\n' 'OpenTofu detailed plan exits with 0: ✗ [DQ:condition_3]' >&2
        exit "$code"
      }
hints:
- text: hints.0.text
  guide: terraform-3
  section: structured-output-types
- text: hints.1.text
- text: hints.2.text
  guide: terraform-3
  section: release-output-contract
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - main.tf
  services: []
