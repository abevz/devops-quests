title: Importar
brief: |
  El contenedor de procesamiento de rutas no está disponible.

  Trabaja en la workstation en `~/quest` con `main.tf`, `original-id`.

  **Requisitos:**
  - Estado de OpenTofu:
    - Direcciones requeridas: `docker_container.worker`.
  - Contenedor en el daemon privado de Docker:
    - Nombre: `rail-worker`.
    - En ejecución: `true`; pausado: `false`.
  - Identidad del contenedor:
    - Recurso registrado: `docker_container.worker`.
    - Comprobante correspondiente en la workstation: `~/quest/original-id`.
    - El ID del contenedor y el ID del recurso registrado coinciden con ese comprobante.

  **Verifica antes de Check & finish:**
  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — Los ID coinciden; el contenedor informa en ejecución `true` y pausado `false`.
  - `tofu show -no-color` — Muestra `docker_container.worker` con el mismo ID que `original-id` en la workstation.

  La comprobación compara los ID actuales con el comprobante suministrado; no establece la historia del recurso.
stages.0.brief: El contenedor original debe estar disponible con la identidad administrada requerida.
hints.0.text: El contenedor existente tiene una identidad que debe conservarse al adoptarlo.
hints.1.text: Import adopta un recurso; no reanuda automáticamente un proceso en pausa.
hints.2.text: Importa el ID original en docker_container.worker y después reanuda el contenedor.
debrief: El recurso en el estado y el worker en ejecución y sin pausa tienen ahora el ID registrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener docker_container.worker.
diagnostics.condition_1: original-id no debe estar vacío y docker inspect rail-worker ID debe ser igual a su contenido.
diagnostics.condition_2: original-id no debe estar vacío y tofu show -json docker_container.worker ID debe ser igual
  a su contenido.
diagnostics.condition_3: rail-worker State.Running debe ser igual a true.
diagnostics.condition_4: rail-worker State.Paused debe ser igual a false.
stages.0.objectives.0.text: El estado de OpenTofu incluye `docker_container.worker`.
stages.0.objectives.1.text: El contenedor `rail-worker` y su recurso registrado `docker_container.worker` tienen
  el ID guardado en `original-id` en la workstation.
stages.0.objectives.2.text: En el daemon privado de Docker, `rail-worker` está en ejecución y no está pausado.
