title: Importar
brief: 'El contenedor de procesamiento de rutas no está disponible.


  Trabaja en la estación de trabajo en `~/quest` con `main.tf`.


  **Requisitos:**

  - El contenedor existente de procesamiento de rutas está registrado por la configuración suministrada.

  - El contenedor y su recurso registrado conservan la misma identidad original.

  - En el daemon Docker privado, el contenedor existente de procesamiento de rutas está en ejecución y no está
  pausado.


  La comprobación compara los ID actuales con el comprobante suministrado; no establece la historia del recurso.

  '
stages.0.brief: El contenedor original debe estar disponible con la identidad administrada requerida.
hints.0.text: La identidad y la disponibilidad son propiedades distintas de un objeto gestionado.
hints.1.text: |-
  Inspecciona las entradas suministradas y el estado gestionado actual:

  Import adopta un recurso; no reanuda automáticamente un proceso en pausa.

  Importa el ID original en docker_container.worker y después reanuda el contenedor.

  ```sh
  cat main.tf
  tofu state list
  docker ps -a --no-trunc
  ```
hints.2.text: |-
  Verifica el resultado observado:

  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — Los ID coinciden; el contenedor informa en ejecución `true` y pausado `false`.

  - `tofu show -no-color` — Muestra `docker_container.worker` con el mismo ID que `original-id` en la workstation.
debrief: El recurso en el estado y el worker en ejecución y sin pausa tienen ahora el ID registrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: |-
  Un contenedor existente puede faltar en el estado de OpenTofu hasta que se importe a la configuración gestionada. [Guía](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_1: |-
  Un contenedor nuevo puede reutilizar el nombre rail-worker con otro ID. Comprueba el ID activo y que se puedan leer el registro original y la salida del estado. [Guía](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_2: |-
  El ID en el estado puede diferir si se importó otro contenedor. Comprueba el registro y que Docker y OpenTofu devuelvan ambos resultados. [Guía](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_3: |-
  La importación registra el estado sin cambiar el ciclo de vida. Un contenedor detenido o ausente puede fallar la prueba de ejecución. [Guía](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_4: |-
  Un contenedor importado puede seguir pausado porque la importación cambia el vínculo del estado. Comprueba la pausa del contenedor existente en Docker. [Guía](guides#guide=terraform-3&section=original-container-state)
stages.0.objectives.0.text: El contenedor existente de procesamiento de rutas está registrado por la configuración
  suministrada.
stages.0.objectives.1.text: El contenedor y su recurso registrado conservan la misma identidad original.
stages.0.objectives.2.text: En el daemon Docker privado, el contenedor existente de procesamiento de rutas
  está en ejecución y no está pausado.
diagnostics.probe_0_0: |-
  La prueba puede detenerse antes de informar de una identidad o estado si la estación no puede iniciar Python. [Guía](guides#guide=terraform-3&section=original-container-state)
diagnostics.probe_0_1: |-
  La prueba puede detenerse antes de informar de una identidad o estado si la estación no puede iniciar Python. [Guía](guides#guide=terraform-3&section=original-container-state)
