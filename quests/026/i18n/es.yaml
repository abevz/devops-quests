title: Importar
brief: 'El contenedor de procesamiento de rutas no está disponible.


  Trabaja en la estación de trabajo en `~/quest` con `main.tf`.


  **Requisitos:**

  - El contenedor existente de procesamiento de rutas está registrado por la configuración suministrada.

  - El contenedor y su recurso registrado conservan la misma identidad original.

  - En el daemon Docker privado, el contenedor existente de procesamiento de rutas está en ejecución y no está
  pausado.


  La comprobación compara los ID actuales con el comprobante suministrado; no establece la historia del recurso.

  '
stages.0.brief: El contenedor original debe estar disponible con la identidad administrada requerida.
hints.0.text: La identidad y la disponibilidad son propiedades distintas de un objeto gestionado.
hints.1.text: 'Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf

  tofu state list

  docker ps -a --no-trunc

  ```'
hints.2.text: 'Import adopta un recurso; no reanuda automáticamente un proceso en pausa.


  Importa el ID original en docker_container.worker y después reanuda el contenedor.


  Verifica el resultado observado:


  - `docker inspect rail-worker --format ''{{.Id}} {{.State.Running}} {{.State.Paused}}''; cat original-id`
  — Los ID coinciden; el contenedor informa en ejecución `true` y pausado `false`.


  - `tofu show -no-color` — Muestra `docker_container.worker` con el mismo ID que `original-id` en la workstation.'
debrief: El recurso en el estado y el worker en ejecución y sin pausa tienen ahora el ID registrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: |-
  El contenedor de procesamiento de rutas suministrado debe estar registrado como recurso administrado.
diagnostics.condition_1: original-id no debe estar vacío y docker inspect rail-worker ID debe ser igual a su
  contenido.
diagnostics.condition_2: |-
  El ID del contenedor administrado debe coincidir con el registro original suministrado.
diagnostics.condition_3: rail-worker State.Running debe ser igual a true.
diagnostics.condition_4: rail-worker State.Paused debe ser igual a false.
stages.0.objectives.0.text: El contenedor existente de procesamiento de rutas está registrado por la configuración
  suministrada.
stages.0.objectives.1.text: El contenedor y su recurso registrado conservan la misma identidad original.
stages.0.objectives.2.text: En el daemon Docker privado, el contenedor existente de procesamiento de rutas
  está en ejecución y no está pausado.
