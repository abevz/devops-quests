title: Importar
brief: 'En `~/quest`, examina `main.tf` y `original-id`. La bahía contiene un contenedor Docker pausado llamado `rail-worker`;
  su ID está guardado en `original-id`. La guía de estado enlazada explica las direcciones e identidades de recursos. Trabaja
  solo en esta bahía sin conexión.


  Importa con `tofu import docker_container.worker "$(cat original-id)"` y ejecuta `docker unpause rail-worker`. Comprueba
  que `tofu state list` contiene esa dirección, que `docker inspect rail-worker --format ''{{.Id}}''` coincide con el ID de
  `original-id` y que el contenedor está en ejecución y no está pausado. La comprobación compara el ID actual con ese archivo;
  no demuestra la historia del recurso. Examina el ID del recurso en `tofu show -json`: también debe coincidir con `original-id`.'
stages.0.brief: 'La dirección de estado existe; el ID del contenedor en ejecución y sin pausa coincide con `original-id`.
  Examina el ID del recurso en `tofu show -json`: también debe coincidir con `original-id`.'
stages.0.objectives.0.text: 'La dirección de estado existe; el ID del contenedor en ejecución y sin pausa coincide con `original-id`.
  Examina el ID del recurso en `tofu show -json`: también debe coincidir con `original-id`.'
hints.0.text: El contenedor activo ya tiene un ID. Inspeccionarlo antes que cualquier apply.
hints.1.text: Import adopta un recurso; no reanuda automáticamente un proceso en pausa.
hints.2.text: Importe el ID original a docker_container.worker, unpause y verifique que el ID permanezca igual.
debrief: El recurso en el estado y el worker en ejecución y sin pausa tienen ahora el ID registrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener docker_container.worker.
diagnostics.condition_1: original-id no debe estar vacío y docker inspect rail-worker ID debe ser igual a su contenido.
diagnostics.condition_2: original-id no debe estar vacío y tofu show -json docker_container.worker ID debe ser igual a su
  contenido.
diagnostics.condition_3: rail-worker State.Running debe ser igual a true.
diagnostics.condition_4: rail-worker State.Paused debe ser igual a false.
