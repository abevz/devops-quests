title: Importar
brief: 'Te uniste a las operaciones de SignalRail. Adopte un worker vivo sin reemplazarlo. Trabajar en
  ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito inicial: Se gestiona el contenedor original sin reposición.'
stages.0.brief: 'Importe el worker existente. No lo reemplace. Registre su identificación antes de cualquier
  operación.


  Criterios de éxito: Se gestiona el contenedor original sin reposición.'
stages.0.objectives.0.text: El contenedor original se gestiona sin reposición.
hints.0.text: El contenedor activo ya tiene un ID. Inspeccionarlo antes que cualquier apply.
hints.1.text: Import adopta un recurso; no reanuda automáticamente un proceso en pausa.
hints.2.text: Importe el ID original a docker_container.worker, unpause y verifique que el ID permanezca
  igual.
debrief: Existía un contenedor activo fuera del estado. Importó su ID original y demostró que no fue reemplazado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
