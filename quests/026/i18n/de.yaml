title: Import
brief: |
  Der Container zur Routenverarbeitung ist nicht verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `original-id`.

  **Anforderungen:**
  - OpenTofu-State:
    - Erforderliche Adressen: `docker_container.worker`.
  - Container im privaten Docker-Daemon:
    - Name: `rail-worker`.
    - Läuft: `true`; pausiert: `false`.
  - Containeridentität:
    - Verwaltete Ressource: `docker_container.worker`.
    - Passender Beleg auf der Workstation: `~/quest/original-id`.
    - Die ID des Containers und die ID der verwalteten Ressource stimmen mit diesem Beleg überein.

  **Selbstprüfung vor Check & finish:**
  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — Die IDs stimmen überein; der Container meldet läuft `true` und pausiert `false`.
  - `tofu show -no-color` — Zeigt `docker_container.worker` mit derselben ID wie `original-id` auf der Workstation.

  Die Prüfung vergleicht aktuelle IDs mit dem bereitgestellten Beleg; sie belegt keine Ressourcenhistorie.
stages.0.brief: Der ursprüngliche Container muss unter der erforderlichen verwalteten Identität verfügbar sein.
hints.0.text: Der bestehende Container hat eine Identität, die bei der Übernahme erhalten bleiben muss.
hints.1.text: Import übernimmt eine Ressource; Ein angehaltener Prozess wird nicht automatisch fortgesetzt.
hints.2.text: Importiere die ursprüngliche ID in docker_container.worker und hebe dann die Pause des Containers
  auf.
debrief: Die Ressource im Zustand und der laufende, nicht pausierte Worker haben jetzt die gespeicherte ID.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss docker_container.worker enthalten.
diagnostics.condition_1: original-id darf nicht leer sein und docker inspect rail-worker ID muss dem Inhalt entsprechen.
diagnostics.condition_2: original-id darf nicht leer sein und tofu show -json docker_container.worker ID muss dem
  Inhalt entsprechen.
diagnostics.condition_3: rail-worker State.Running muss true entsprechen.
diagnostics.condition_4: rail-worker State.Paused muss false entsprechen.
stages.0.objectives.0.text: Der OpenTofu-State enthält `docker_container.worker`.
stages.0.objectives.1.text: Der Container `rail-worker` und seine verwaltete Ressource `docker_container.worker`
  haben die ID aus `original-id` auf der Workstation.
stages.0.objectives.2.text: Im privaten Docker-Daemon läuft `rail-worker` und ist nicht pausiert.
