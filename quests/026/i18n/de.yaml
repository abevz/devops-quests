title: Import
brief: 'Untersuche in `~/quest` die Dateien `main.tf` und `original-id`. In der Übungsumgebung gibt es einen pausierten Docker-Container namens `rail-worker`; seine ID steht in `original-id`. Die verlinkte Zustandsanleitung erklärt Ressourcenadressen und Identitäten. Arbeite nur in dieser Offline-Umgebung.


  Importiere mit `tofu import docker_container.worker "$(cat original-id)"` und führe `docker unpause rail-worker` aus. Prüfe, dass `tofu state list` diese Adresse enthält, `docker inspect rail-worker --format ''{{.Id}}''` der ID in `original-id` entspricht und der Container läuft und nicht pausiert ist. Die Prüfung vergleicht die aktuelle ID mit der Datei; sie belegt nicht die Vorgeschichte der Ressource. Prüfe die Ressourcen-ID in `tofu show -json`: Auch sie muss `original-id` entsprechen.'
stages.0.brief: 'Die Zustandsadresse ist vorhanden; die ID des laufenden, nicht pausierten Containers entspricht `original-id`. Prüfe die Ressourcen-ID in `tofu show -json`: Auch sie muss `original-id` entsprechen.'
stages.0.objectives.0.text: 'Die Zustandsadresse ist vorhanden; die ID des laufenden, nicht pausierten Containers entspricht `original-id`. Prüfe die Ressourcen-ID in `tofu show -json`: Auch sie muss `original-id` entsprechen.'
hints.0.text: Der Live-Container verfügt bereits über einen ID. Überprüfen Sie es vor jedem apply.
hints.1.text: Import übernimmt eine Ressource; Ein angehaltener Prozess wird nicht automatisch fortgesetzt.
hints.2.text: Importieren Sie das Original ID in docker_container.worker, unpause und überprüfen Sie,
  ob ID gleich geblieben ist.
debrief: Die Ressource im Zustand und der laufende, nicht pausierte Worker haben jetzt die gespeicherte ID.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
