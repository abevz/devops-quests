title: Import
brief: 'Der Container zur Routenverarbeitung ist nicht verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `main.tf`.


  **Anforderungen:**

  - Der bestehende Container zur Routenverarbeitung wird durch die mitgelieferte Konfiguration nachverfolgt.

  - Der Container und seine nachverfolgte Ressource behalten dieselbe ursprüngliche Identität.

  - Im privaten Docker-Daemon läuft der bestehende Container zur Routenverarbeitung und ist nicht pausiert.


  Die Prüfung vergleicht aktuelle IDs mit dem bereitgestellten Beleg; sie belegt keine Ressourcenhistorie.

  '
stages.0.brief: Der ursprüngliche Container muss unter der erforderlichen verwalteten Identität verfügbar sein.
hints.0.text: Identität und Verfügbarkeit sind getrennte Eigenschaften eines verwalteten Objekts.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf

  tofu state list

  docker ps -a --no-trunc

  ```'
hints.2.text: 'Import übernimmt eine Ressource; Ein angehaltener Prozess wird nicht automatisch fortgesetzt.


  Importiere die ursprüngliche ID in docker_container.worker und hebe dann die Pause des Containers auf.


  Prüfen Sie das beobachtete Ergebnis:


  - `docker inspect rail-worker --format ''{{.Id}} {{.State.Running}} {{.State.Paused}}''; cat original-id`
  — Die IDs stimmen überein; der Container meldet läuft `true` und pausiert `false`.


  - `tofu show -no-color` — Zeigt `docker_container.worker` mit derselben ID wie `original-id` auf der Workstation.'
debrief: Die Ressource im Zustand und der laufende, nicht pausierte Worker haben jetzt die gespeicherte ID.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: |-
  Der bereitgestellte Container zur Routenverarbeitung muss als verwaltete Ressource erfasst sein.
diagnostics.condition_1: original-id darf nicht leer sein und docker inspect rail-worker ID muss dem Inhalt
  entsprechen.
diagnostics.condition_2: |-
  Die ID des verwalteten Containers muss mit dem bereitgestellten Originalnachweis übereinstimmen.
diagnostics.condition_3: rail-worker State.Running muss true entsprechen.
diagnostics.condition_4: rail-worker State.Paused muss false entsprechen.
