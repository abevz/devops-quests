title: Import
brief: 'Der Container zur Routenverarbeitung ist nicht verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `main.tf`.


  **Anforderungen:**

  - Der bestehende Container zur Routenverarbeitung wird durch die mitgelieferte Konfiguration nachverfolgt.

  - Der Container und seine nachverfolgte Ressource behalten dieselbe ursprüngliche Identität.

  - Im privaten Docker-Daemon läuft der bestehende Container zur Routenverarbeitung und ist nicht pausiert.


  Die Prüfung vergleicht aktuelle IDs mit dem bereitgestellten Beleg; sie belegt keine Ressourcenhistorie.

  '
stages.0.brief: Der ursprüngliche Container muss unter der erforderlichen verwalteten Identität verfügbar sein.
hints.0.text: Identität und Verfügbarkeit sind getrennte Eigenschaften eines verwalteten Objekts.
hints.1.text: |-
  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:

  Import übernimmt eine Ressource; Ein angehaltener Prozess wird nicht automatisch fortgesetzt.

  Importiere die ursprüngliche ID in docker_container.worker und hebe dann die Pause des Containers auf.

  ```sh
  cat main.tf
  tofu state list
  docker ps -a --no-trunc
  ```
hints.2.text: |-
  Prüfen Sie das beobachtete Ergebnis:

  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — Die IDs stimmen überein; der Container meldet läuft `true` und pausiert `false`.

  - `tofu show -no-color` — Zeigt `docker_container.worker` mit derselben ID wie `original-id` auf der Workstation.
debrief: Die Ressource im Zustand und der laufende, nicht pausierte Worker haben jetzt die gespeicherte ID.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: |-
  Ein vorhandener Container kann im OpenTofu-State fehlen, solange er nicht in die verwaltete Konfiguration importiert wurde. [Leitfaden](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_1: |-
  Ein Ersatzcontainer kann rail-worker heißen und eine andere ID haben. Prüfen Sie die Live-ID und ob der ursprüngliche Beleg und die State-Ausgabe lesbar sind. [Leitfaden](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_2: |-
  Die State-ID kann bei Import des falschen Containers abweichen. Prüfen Sie den gespeicherten Beleg und die Ausgaben von Docker und OpenTofu. [Leitfaden](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_3: |-
  Der Import erfasst den State und lässt den Containerlebenszyklus unverändert. Ein gestoppter oder fehlender Container kann die Running-Prüfung verfehlen. [Leitfaden](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_4: |-
  Ein importierter Container kann pausiert bleiben, weil der Import die State-Bindung ändert. Prüfen Sie den Pausenstatus des vorhandenen Containers in Docker. [Leitfaden](guides#guide=terraform-3&section=original-container-state)
stages.0.objectives.0.text: Der bestehende Container zur Routenverarbeitung wird durch die mitgelieferte Konfiguration
  nachverfolgt.
stages.0.objectives.1.text: Der Container und seine nachverfolgte Ressource behalten dieselbe ursprüngliche
  Identität.
stages.0.objectives.2.text: Im privaten Docker-Daemon läuft der bestehende Container zur Routenverarbeitung
  und ist nicht pausiert.
diagnostics.probe_0_0: |-
  Die Prüfung kann vor einem Identitäts- oder State-Ergebnis abbrechen, wenn Python am Arbeitsplatz nicht startet. [Leitfaden](guides#guide=terraform-3&section=original-container-state)
diagnostics.probe_0_1: |-
  Die Prüfung kann vor einem Identitäts- oder State-Ergebnis abbrechen, wenn Python am Arbeitsplatz nicht startet. [Leitfaden](guides#guide=terraform-3&section=original-container-state)
