title: Import
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Übernehmen Sie ein Live-worker, ohne es zu ersetzen.
  Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingänge in `~/quest`: `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Der Originalbehälter wird ersatzlos verwaltet.'
stages.0.brief: 'Importieren Sie den vorhandenen worker. Ersetzen Sie es nicht. Notieren Sie sich vor
  jeder Operation die ID.


  Erfolgskriterium: Der Originalbehälter wird ersatzlos verwaltet.'
stages.0.objectives.0.text: Der Originalbehälter bleibt ersatzlos erhalten.
hints.0.text: Der Live-Container verfügt bereits über einen ID. Überprüfen Sie es vor jedem apply.
hints.1.text: Import übernimmt eine Ressource; Ein angehaltener Prozess wird nicht automatisch fortgesetzt.
hints.2.text: Importieren Sie das Original ID in docker_container.worker, unpause und überprüfen Sie,
  ob ID gleich geblieben ist.
debrief: Außerhalb des Staates existierte ein Live-Container. Sie haben das ursprüngliche ID importiert
  und nachgewiesen, dass es nicht ersetzt wurde.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
