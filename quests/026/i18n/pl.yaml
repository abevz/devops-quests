title: Import
brief: 'W `~/quest` przeczytaj `main.tf` i `original-id`. W zatoce działa wstrzymany kontener Docker o nazwie `rail-worker`;
  jego ID zapisano w `original-id`. Połączony przewodnik stanu wyjaśnia adresy i tożsamości zasobów. Pracuj tylko w zatoce
  offline.


  Zaimportuj przez `tofu import docker_container.worker "$(cat original-id)"` i uruchom `docker unpause rail-worker`. Sprawdź,
  czy `tofu state list` zawiera ten adres, czy `docker inspect rail-worker --format ''{{.Id}}''` odpowiada ID w `original-id`
  oraz czy kontener działa i nie jest wstrzymany. Sprawdzanie porównuje bieżący ID z plikiem; nie ustala historii zasobu.
  Sprawdź ID zasobu w `tofu show -json`: również musi odpowiadać `original-id`.'
stages.0.brief: 'Adres stanu istnieje; ID działającego, niewstrzymanego kontenera odpowiada `original-id`. Sprawdź ID zasobu
  w `tofu show -json`: również musi odpowiadać `original-id`.'
stages.0.objectives.0.text: 'Adres stanu istnieje; ID działającego, niewstrzymanego kontenera odpowiada `original-id`. Sprawdź
  ID zasobu w `tofu show -json`: również musi odpowiadać `original-id`.'
hints.0.text: Kontener na żywo ma już ID. Sprawdź go przed jakimkolwiek apply.
hints.1.text: Import przyjmuje zasób; nie wznawia automatycznie wstrzymanego procesu.
hints.2.text: Zaimportuj oryginalny ID do docker_container.worker, unpause i sprawdź, czy ID pozostał taki sam.
debrief: Zasób w stanie i działający, niewstrzymany worker mają teraz zapisany ID.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać docker_container.worker.
diagnostics.condition_1: original-id musi być niepuste, a docker inspect rail-worker ID musi mu odpowiadać.
diagnostics.condition_2: original-id musi być niepuste, a tofu show -json docker_container.worker ID musi mu odpowiadać.
diagnostics.condition_3: rail-worker State.Running musi być równe true.
diagnostics.condition_4: rail-worker State.Paused musi być równe false.
