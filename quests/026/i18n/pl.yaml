title: Import
brief: 'Dołączyłeś do operacji SignalRail. Adoptuj żywego worker bez jego zastępowania. Pracuj w ~/quest.
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Oryginalny kontener jest zarządzany bez wymiany.'
stages.0.brief: 'Zaimportuj istniejący worker. Nie wymieniaj go. Zapisz jego ID przed jakąkolwiek operacją.


  Kryteria sukcesu: Oryginalny kontener jest zarządzany bez wymiany.'
stages.0.objectives.0.text: Oryginalny kontener zarządzany jest bez wymiany.
hints.0.text: Kontener na żywo ma już ID. Sprawdź go przed jakimkolwiek apply.
hints.1.text: Import przyjmuje zasób; nie wznawia automatycznie wstrzymanego procesu.
hints.2.text: Zaimportuj oryginalny ID do docker_container.worker, unpause i sprawdź, czy ID pozostał
  taki sam.
debrief: Aktywny kontener istniał poza state. Zaimportowałeś oryginalny ID i udowodniłeś, że nie został
  wymieniony.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
