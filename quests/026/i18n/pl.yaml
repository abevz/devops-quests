title: Import
brief: |
  Kontener przetwarzający trasy jest niedostępny.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `original-id`.

  **Wymagania:**
  - Stan OpenTofu:
    - Wymagane adresy: `docker_container.worker`.
  - Kontener w prywatnym daemonie Docker:
    - Nazwa: `rail-worker`.
    - Działa: `true`; wstrzymany: `false`.
  - Tożsamość kontenera:
    - Śledzony zasób: `docker_container.worker`.
    - Zgodne potwierdzenie na workstation: `~/quest/original-id`.
    - ID kontenera i ID śledzonego zasobu są zgodne z tym potwierdzeniem.

  **Sprawdź przed Check & finish:**
  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — ID są zgodne; kontener podaje działa `true` i wstrzymany `false`.
  - `tofu show -no-color` — Pokazuje `docker_container.worker` z tym samym ID co `original-id` na workstation.

  Sprawdzenie porównuje bieżące ID z dostarczonym potwierdzeniem; nie ustala historii zasobu.
stages.0.brief: Oryginalny kontener musi być dostępny z wymaganą zarządzaną tożsamością.
hints.0.text: Istniejący kontener ma tożsamość, którą należy zachować przy przejmowaniu.
hints.1.text: Import przyjmuje zasób; nie wznawia automatycznie wstrzymanego procesu.
hints.2.text: Zaimportuj oryginalny ID do docker_container.worker, a następnie wznów kontener.
debrief: Zasób w stanie i działający, niewstrzymany worker mają teraz zapisany ID.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać docker_container.worker.
diagnostics.condition_1: original-id musi być niepuste, a docker inspect rail-worker ID musi mu odpowiadać.
diagnostics.condition_2: original-id musi być niepuste, a tofu show -json docker_container.worker ID musi mu odpowiadać.
diagnostics.condition_3: rail-worker State.Running musi być równe true.
diagnostics.condition_4: rail-worker State.Paused musi być równe false.
stages.0.objectives.0.text: Stan OpenTofu zawiera `docker_container.worker`.
stages.0.objectives.1.text: Kontener `rail-worker` i śledzony zasób `docker_container.worker` mają ID zapisany w
  `original-id` na workstation.
stages.0.objectives.2.text: W prywatnym daemonie Docker kontener `rail-worker` działa i nie jest wstrzymany.
