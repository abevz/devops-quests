title: Import
brief: 'Kontener przetwarzający trasy jest niedostępny.


  Pracuj na stacji roboczej w `~/quest` z `main.tf`.


  **Wymagania:**

  - Istniejący kontener przetwarzania tras jest śledzony przez dostarczoną konfigurację.

  - Kontener i jego śledzony zasób zachowują tę samą oryginalną tożsamość.

  - W prywatnym demonie Docker istniejący kontener przetwarzania tras działa i nie jest wstrzymany.


  Sprawdzenie porównuje bieżące ID z dostarczonym potwierdzeniem; nie ustala historii zasobu.

  '
stages.0.brief: Oryginalny kontener musi być dostępny z wymaganą zarządzaną tożsamością.
hints.0.text: Tożsamość i dostępność to odrębne właściwości zarządzanego obiektu.
hints.1.text: |-
  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:

  Import przyjmuje zasób; nie wznawia automatycznie wstrzymanego procesu.

  Zaimportuj oryginalny ID do docker_container.worker, a następnie wznów kontener.

  ```sh
  cat main.tf
  tofu state list
  docker ps -a --no-trunc
  ```
hints.2.text: |-
  Sprawdź obserwowany wynik:

  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — ID są zgodne; kontener podaje działa `true` i wstrzymany `false`.

  - `tofu show -no-color` — Pokazuje `docker_container.worker` z tym samym ID co `original-id` na workstation.
debrief: Zasób w stanie i działający, niewstrzymany worker mają teraz zapisany ID.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: |-
  Istniejącego kontenera może brakować w stanie OpenTofu, dopóki nie zostanie zaimportowany do konfiguracji zarządzanej. [Przewodnik](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_1: |-
  Nowy kontener może przejąć nazwę rail-worker z innym ID. Sprawdź bieżący ID oraz dostępność zapisanego ID i wyniku stanu. [Przewodnik](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_2: |-
  ID w stanie może się różnić po imporcie niewłaściwego kontenera. Sprawdź zapisany ID oraz wyniki Dockera i OpenTofu. [Przewodnik](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_3: |-
  Import zapisuje stan i nie zmienia cyklu życia kontenera. Zatrzymany lub brakujący kontener nie przejdzie kontroli Running. [Przewodnik](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_4: |-
  Import zmienia powiązanie w stanie, więc kontener może pozostać wstrzymany. Sprawdź stan wstrzymania istniejącego kontenera w Dockerze. [Przewodnik](guides#guide=terraform-3&section=original-container-state)
stages.0.objectives.0.text: Istniejący kontener przetwarzania tras jest śledzony przez dostarczoną konfigurację.
stages.0.objectives.1.text: Kontener i jego śledzony zasób zachowują tę samą oryginalną tożsamość.
stages.0.objectives.2.text: W prywatnym demonie Docker istniejący kontener przetwarzania tras działa i nie
  jest wstrzymany.
diagnostics.probe_0_0: |-
  Sonda może przerwać pracę przed wynikiem identyfikatora lub stanu, jeśli stacja nie może uruchomić Pythona. [Przewodnik](guides#guide=terraform-3&section=original-container-state)
diagnostics.probe_0_1: |-
  Sonda może przerwać pracę przed wynikiem identyfikatora lub stanu, jeśli stacja nie może uruchomić Pythona. [Przewodnik](guides#guide=terraform-3&section=original-container-state)
