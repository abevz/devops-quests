title: Import
brief: 'Kontener przetwarzający trasy jest niedostępny.


  Pracuj na stacji roboczej w `~/quest` z `main.tf`.


  **Wymagania:**

  - Istniejący kontener przetwarzania tras jest śledzony przez dostarczoną konfigurację.

  - Kontener i jego śledzony zasób zachowują tę samą oryginalną tożsamość.

  - W prywatnym demonie Docker istniejący kontener przetwarzania tras działa i nie jest wstrzymany.


  Sprawdzenie porównuje bieżące ID z dostarczonym potwierdzeniem; nie ustala historii zasobu.

  '
stages.0.brief: Oryginalny kontener musi być dostępny z wymaganą zarządzaną tożsamością.
hints.0.text: Tożsamość i dostępność to odrębne właściwości zarządzanego obiektu.
hints.1.text: 'Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf

  tofu state list

  docker ps -a --no-trunc

  ```'
hints.2.text: 'Import przyjmuje zasób; nie wznawia automatycznie wstrzymanego procesu.


  Zaimportuj oryginalny ID do docker_container.worker, a następnie wznów kontener.


  Sprawdź obserwowany wynik:


  - `docker inspect rail-worker --format ''{{.Id}} {{.State.Running}} {{.State.Paused}}''; cat original-id`
  — ID są zgodne; kontener podaje działa `true` i wstrzymany `false`.


  - `tofu show -no-color` — Pokazuje `docker_container.worker` z tym samym ID co `original-id` na workstation.'
debrief: Zasób w stanie i działający, niewstrzymany worker mają teraz zapisany ID.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać docker_container.worker.
diagnostics.condition_1: original-id musi być niepuste, a docker inspect rail-worker ID musi mu odpowiadać.
diagnostics.condition_2: original-id musi być niepuste, a tofu show -json docker_container.worker ID musi mu
  odpowiadać.
diagnostics.condition_3: rail-worker State.Running musi być równe true.
diagnostics.condition_4: rail-worker State.Paused musi być równe false.
stages.0.objectives.0.text: Istniejący kontener przetwarzania tras jest śledzony przez dostarczoną konfigurację.
stages.0.objectives.1.text: Kontener i jego śledzony zasób zachowują tę samą oryginalną tożsamość.
stages.0.objectives.2.text: W prywatnym demonie Docker istniejący kontener przetwarzania tras działa i nie
  jest wstrzymany.
