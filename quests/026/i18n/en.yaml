title: Import
brief: 'The route processing container is unavailable.


  Work on the workstation in `~/quest` with `main.tf`.


  **Requirements:**

  - The existing route-processing container is tracked by the supplied configuration.

  - The container and its tracked resource keep the same original identity.

  - In the private Docker daemon, the existing route-processing container is running and unpaused.


  The check compares current IDs with the supplied receipt; it does not establish the resource history.

  '
stages.0.brief: The original container must be available under the required managed identity.
hints.0.text: Identity and availability are separate properties of a managed object.
hints.1.text: |-
  Inspect the supplied inputs and current managed state:

  Import adopts a resource; it does not automatically resume a paused process.

  Import the original ID into docker_container.worker, then unpause the container.

  ```sh
  cat main.tf
  tofu state list
  docker ps -a --no-trunc
  ```
hints.2.text: |-
  Verify the observed result:

  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — The IDs match; the container reports running `true` and paused `false`.

  - `tofu show -no-color` — Shows `docker_container.worker` with the same ID as workstation `original-id`.
debrief: The state resource and the running, unpaused worker now have the recorded ID.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: |-
  An existing container can be absent from OpenTofu state until that container has been imported into the managed configuration. [Guide](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_1: |-
  A replacement container can reuse the name rail-worker and have a different ID. Check the live ID and whether the original receipt and state output are readable. [Guide](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_2: |-
  The tracked ID can differ if the wrong container was imported. Check the saved receipt and whether Docker and OpenTofu return both observations. [Guide](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_3: |-
  Import records state and leaves the container lifecycle alone. A stopped or missing container can still fail the running check. [Guide](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_4: |-
  An imported container can remain paused because import changes the state binding. Inspect the existing container pause status in Docker. [Guide](guides#guide=terraform-3&section=original-container-state)
stages.0.objectives.0.text: The existing route-processing container is tracked by the supplied configuration.
stages.0.objectives.1.text: The container and its tracked resource keep the same original identity.
stages.0.objectives.2.text: In the private Docker daemon, the existing route-processing container is running
  and unpaused.
diagnostics.probe_0_0: |-
  The probe can stop before it reports an identity or state result if the workstation cannot start Python. [Guide](guides#guide=terraform-3&section=original-container-state)
diagnostics.probe_0_1: |-
  The probe can stop before it reports an identity or state result if the workstation cannot start Python. [Guide](guides#guide=terraform-3&section=original-container-state)
