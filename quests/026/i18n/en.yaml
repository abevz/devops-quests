title: Import
brief: 'The route processing container is unavailable.


  Work on the workstation in `~/quest` with `main.tf`.


  **Requirements:**

  - The existing route-processing container is tracked by the supplied configuration.

  - The container and its tracked resource keep the same original identity.

  - In the private Docker daemon, the existing route-processing container is running and unpaused.


  The check compares current IDs with the supplied receipt; it does not establish the resource history.

  '
stages.0.brief: The original container must be available under the required managed identity.
hints.0.text: Identity and availability are separate properties of a managed object.
hints.1.text: 'Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf

  tofu state list

  docker ps -a --no-trunc

  ```'
hints.2.text: 'Import adopts a resource; it does not automatically resume a paused process.


  Import the original ID into docker_container.worker, then unpause the container.


  Verify the observed result:


  - `docker inspect rail-worker --format ''{{.Id}} {{.State.Running}} {{.State.Paused}}''; cat original-id`
  — The IDs match; the container reports running `true` and paused `false`.


  - `tofu show -no-color` — Shows `docker_container.worker` with the same ID as workstation `original-id`.'
debrief: The state resource and the running, unpaused worker now have the recorded ID.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: |-
  The supplied route-processing container must be tracked as a managed resource.
diagnostics.condition_1: original-id must be nonempty, and docker inspect rail-worker ID must equal it.
diagnostics.condition_2: |-
  The managed container ID must match the supplied original receipt.
diagnostics.condition_3: rail-worker State.Running must equal true.
diagnostics.condition_4: rail-worker State.Paused must equal false.
stages.0.objectives.0.text: The existing route-processing container is tracked by the supplied configuration.
stages.0.objectives.1.text: The container and its tracked resource keep the same original identity.
stages.0.objectives.2.text: In the private Docker daemon, the existing route-processing container is running
  and unpaused.
diagnostics.probe_0_0: 'The current inputs could not verify this objective: The existing route-processing container
  is tracked by the supplied configuration.'
diagnostics.probe_0_1: 'The current inputs could not verify this objective: The container and its tracked resource
  keep the same original identity.'
