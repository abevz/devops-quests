title: Import
brief: |
  The route processing container is unavailable.

  Work on the workstation in `~/quest` with `main.tf`, `original-id`.

  **Requirements:**
  - OpenTofu state:
    - Required addresses: `docker_container.worker`.
  - Container in the private Docker daemon:
    - Name: `rail-worker`.
    - Running: `true`; paused: `false`.
  - Container identity:
    - Tracked resource: `docker_container.worker`.
    - Matching receipt on the workstation: `~/quest/original-id`.
    - The container ID and the tracked resource ID match that receipt.

  **Verify yourself before Check & finish:**
  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — The IDs match; the container reports running `true` and paused `false`.
  - `tofu show -no-color` — Shows `docker_container.worker` with the same ID as workstation `original-id`.

  The check compares current IDs with the supplied receipt; it does not establish the resource history.
stages.0.brief: The original container must be available under the required managed identity.
hints.0.text: The existing container has an identity that must survive adoption.
hints.1.text: Import adopts a resource; it does not automatically resume a paused process.
hints.2.text: Import the original ID into docker_container.worker, then unpause the container.
debrief: The state resource and the running, unpaused worker now have the recorded ID.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: tofu state list must contain docker_container.worker.
diagnostics.condition_1: original-id must be nonempty, and docker inspect rail-worker ID must equal it.
diagnostics.condition_2: original-id must be nonempty, and tofu show -json docker_container.worker ID must equal
  it.
diagnostics.condition_3: rail-worker State.Running must equal true.
diagnostics.condition_4: rail-worker State.Paused must equal false.
stages.0.objectives.0.text: OpenTofu state includes `docker_container.worker`.
stages.0.objectives.1.text: The `rail-worker` container and its tracked `docker_container.worker` resource have
  the ID recorded in workstation `original-id`.
stages.0.objectives.2.text: In the private Docker daemon, `rail-worker` is running and unpaused.
