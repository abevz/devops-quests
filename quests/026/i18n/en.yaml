title: Import
brief: 'You joined SignalRail operations. Adopt a live worker without replacing it. Work in ~/quest. Keep
  all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The original container is managed without replacement.'
stages.0.brief: 'Import the existing worker. Do not replace it. Record its ID before any operation.


  Success criteria: The original container is managed without replacement.'
stages.0.objectives.0.text: The original container is managed without replacement.
hints.0.text: The live container already has an ID. Inspect it before any apply.
hints.1.text: Import adopts a resource; it does not automatically resume a paused process.
hints.2.text: Import the original ID into docker_container.worker, unpause it and verify the ID stayed
  the same.
debrief: A live container existed outside state. You imported its original ID and proved it was not replaced.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
