title: Import
brief: 'In `~/quest`, inspect `main.tf` and `original-id`. The bay has a paused Docker container named `rail-worker`; its ID was saved in `original-id`. The linked state guide explains resource addresses and identities. Work only in this offline bay.


  Import with `tofu import docker_container.worker "$(cat original-id)"` and run `docker unpause rail-worker`. Verify that `tofu state list` contains that address, `docker inspect rail-worker --format ''{{.Id}}''` equals the ID in `original-id`, and the container is running and not paused. The check compares the current container ID with that file; it does not establish the resource''s history. Inspect the resource ID in `tofu show -json`: it must also equal `original-id`.'
stages.0.brief: 'The state address exists; the running, unpaused container ID matches `original-id`. Inspect the resource ID in `tofu show -json`: it must also equal `original-id`.'
stages.0.objectives.0.text: 'The state address exists; the running, unpaused container ID matches `original-id`. Inspect the resource ID in `tofu show -json`: it must also equal `original-id`.'
hints.0.text: The live container already has an ID. Inspect it before any apply.
hints.1.text: Import adopts a resource; it does not automatically resume a paused process.
hints.2.text: Import the original ID into docker_container.worker, unpause it and verify the ID stayed
  the same.
debrief: The state resource and the running, unpaused worker now have the recorded ID.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
