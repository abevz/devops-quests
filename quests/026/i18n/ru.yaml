title: Импорт ресурса
brief: 'Контейнер обработки маршрутов недоступен.


  Работайте на рабочей станции в `~/quest` с `main.tf`.


  **Требования:**

  - Существующий контейнер обработки маршрутов отслеживается поставленной конфигурацией.

  - Контейнер и отслеживаемый ресурс сохраняют одну и ту же исходную идентичность.

  - В приватном Docker daemon существующий контейнер обработки маршрутов работает и не приостановлен.


  Проверка сравнивает текущие ID с предоставленной квитанцией; она не устанавливает историю ресурса.

  '
stages.0.brief: Исходный контейнер должен быть доступен с требуемой управляемой идентичностью.
hints.0.text: Идентичность и доступность — разные свойства управляемого объекта.
hints.1.text: |-
  Изучите поставленные входные данные и текущее управляемое состояние:

  Import принимает ресурс в state, но не возобновляет paused-процесс.

  Импортируйте исходный ID в docker_container.worker, затем снимите паузу контейнера.

  ```sh
  cat main.tf
  tofu state list
  docker ps -a --no-trunc
  ```
hints.2.text: |-
  Проверьте наблюдаемый результат:

  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — ID совпадают; контейнер сообщает работает `true` и приостановлен `false`.

  - `tofu show -no-color` — Показывает `docker_container.worker` с тем же ID, что в `original-id` на workstation.
debrief: Ресурс в состоянии и работающий, не приостановленный worker теперь имеют записанный ID.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: |-
  Существующий контейнер может отсутствовать в состоянии OpenTofu, пока его не импортировали в управляемую конфигурацию. [Гайд](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_1: |-
  Новый контейнер может получить имя rail-worker с другим ID. Сверьте фактический ID и проверьте доступность исходной записи и вывода состояния. [Гайд](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_2: |-
  ID в состоянии может отличаться, если импортировали другой контейнер. Проверьте сохранённую запись и убедитесь, что Docker и OpenTofu возвращают результаты. [Гайд](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_3: |-
  Импорт записывает привязку в состояние и не управляет жизненным циклом контейнера. Остановленный или отсутствующий контейнер не пройдёт проверку Running. [Гайд](guides#guide=terraform-3&section=original-container-state)
diagnostics.condition_4: |-
  Импорт меняет привязку в состоянии, и контейнер может остаться на паузе. Посмотрите статус паузы существующего контейнера в Docker. [Гайд](guides#guide=terraform-3&section=original-container-state)
stages.0.objectives.0.text: Существующий контейнер обработки маршрутов отслеживается поставленной конфигурацией.
stages.0.objectives.1.text: Контейнер и отслеживаемый ресурс сохраняют одну и ту же исходную идентичность.
stages.0.objectives.2.text: В приватном Docker daemon существующий контейнер обработки маршрутов работает и
  не приостановлен.
diagnostics.probe_0_0: |-
  Если рабочая станция не запускает Python, проверка может остановиться до вывода идентификатора или состояния. [Гайд](guides#guide=terraform-3&section=original-container-state)
diagnostics.probe_0_1: |-
  Если рабочая станция не запускает Python, проверка может остановиться до вывода идентификатора или состояния. [Гайд](guides#guide=terraform-3&section=original-container-state)
