title: Импорт ресурса
brief: 'В `~/quest` изучите `main.tf` и `original-id`. В песочнице есть приостановленный контейнер Docker `rail-worker`; его ID сохранён в `original-id`. Руководство по состоянию объясняет адреса и идентификаторы ресурсов. Работайте только в офлайн-песочнице.


  Импортируйте через `tofu import docker_container.worker "$(cat original-id)"` и выполните `docker unpause rail-worker`. Проверьте, что `tofu state list` содержит этот адрес, `docker inspect rail-worker --format ''{{.Id}}''` совпадает с ID в `original-id`, а контейнер работает и не приостановлен. Проверка сравнивает текущий ID с файлом и не доказывает историю ресурса. Проверьте ID ресурса в `tofu show -json`: он тоже должен совпадать с `original-id`.'
stages.0.brief: 'Адрес состояния существует; ID работающего и не приостановленного контейнера совпадает с `original-id`. Проверьте ID ресурса в `tofu show -json`: он тоже должен совпадать с `original-id`.'
stages.0.objectives.0.text: 'Адрес состояния существует; ID работающего и не приостановленного контейнера совпадает с `original-id`. Проверьте ID ресурса в `tofu show -json`: он тоже должен совпадать с `original-id`.'
hints.0.text: У контейнера уже есть ID. Проверьте его до apply.
hints.1.text: Import принимает ресурс в state, но не возобновляет paused-процесс.
hints.2.text: Импортируйте исходный ID в docker_container.worker, выполните unpause и подтвердите сохранение
  ID.
debrief: Ресурс в состоянии и работающий, не приостановленный worker теперь имеют записанный ID.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
