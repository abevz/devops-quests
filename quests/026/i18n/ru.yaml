title: Импорт ресурса
brief: 'Вы в команде эксплуатации SignalRail. Примите существующий контейнер под управление. Работайте
  в ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Исходный контейнер принят в state без замены.'
stages.0.brief: 'Импортируйте существующий worker. Не пересоздавайте его.


  Результат проверки: Исходный контейнер принят в state без замены.'
stages.0.objectives.0.text: Исходный контейнер принят в state без замены.
hints.0.text: У контейнера уже есть ID. Проверьте его до apply.
hints.1.text: Import принимает ресурс в state, но не возобновляет paused-процесс.
hints.2.text: Импортируйте исходный ID в docker_container.worker, выполните unpause и подтвердите сохранение
  ID.
debrief: Живой контейнер существовал вне state. Вы импортировали исходный ID и подтвердили отсутствие
  замены.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
