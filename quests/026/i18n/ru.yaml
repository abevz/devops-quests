title: Импорт ресурса
brief: |
  Контейнер обработки маршрутов недоступен.

  Работайте на workstation в `~/quest` с файлами `main.tf`, `original-id`.

  **Требования:**
  - Состояние OpenTofu:
    - Требуемые адреса: `docker_container.worker`.
  - Контейнер в приватном Docker daemon:
    - Имя: `rail-worker`.
    - Работает: `true`; приостановлен: `false`.
  - Идентичность контейнера:
    - Отслеживаемый ресурс: `docker_container.worker`.
    - Соответствующая квитанция на workstation: `~/quest/original-id`.
    - ID контейнера и ID отслеживаемого ресурса совпадают с этой квитанцией.

  **Самопроверка перед Check & finish:**
  - `docker inspect rail-worker --format '{{.Id}} {{.State.Running}} {{.State.Paused}}'; cat original-id` — ID совпадают; контейнер сообщает работает `true` и приостановлен `false`.
  - `tofu show -no-color` — Показывает `docker_container.worker` с тем же ID, что в `original-id` на workstation.

  Проверка сравнивает текущие ID с предоставленной квитанцией; она не устанавливает историю ресурса.
stages.0.brief: Исходный контейнер должен быть доступен с требуемой управляемой идентичностью.
hints.0.text: У существующего контейнера есть идентичность, которую нужно сохранить при принятии под управление.
hints.1.text: Import принимает ресурс в state, но не возобновляет paused-процесс.
hints.2.text: Импортируйте исходный ID в docker_container.worker, затем снимите паузу контейнера.
debrief: Ресурс в состоянии и работающий, не приостановленный worker теперь имеют записанный ID.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать docker_container.worker.
diagnostics.condition_1: original-id должен быть непустым, а docker inspect rail-worker ID должен совпадать с его
  содержимым.
diagnostics.condition_2: original-id должен быть непустым, а tofu show -json docker_container.worker ID должен совпадать
  с его содержимым.
diagnostics.condition_3: rail-worker State.Running должен совпадать с true.
diagnostics.condition_4: rail-worker State.Paused должен совпадать с false.
stages.0.objectives.0.text: Состояние OpenTofu содержит `docker_container.worker`.
stages.0.objectives.1.text: Контейнер `rail-worker` и отслеживаемый ресурс `docker_container.worker` имеют ID из
  файла `original-id` на workstation.
stages.0.objectives.2.text: В приватном Docker daemon контейнер `rail-worker` работает и не приостановлен.
