title: Импорт ресурса
brief: 'Контейнер обработки маршрутов недоступен.


  Работайте на рабочей станции в `~/quest` с `main.tf`.


  **Требования:**

  - Существующий контейнер обработки маршрутов отслеживается поставленной конфигурацией.

  - Контейнер и отслеживаемый ресурс сохраняют одну и ту же исходную идентичность.

  - В приватном Docker daemon существующий контейнер обработки маршрутов работает и не приостановлен.


  Проверка сравнивает текущие ID с предоставленной квитанцией; она не устанавливает историю ресурса.

  '
stages.0.brief: Исходный контейнер должен быть доступен с требуемой управляемой идентичностью.
hints.0.text: Идентичность и доступность — разные свойства управляемого объекта.
hints.1.text: 'Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf

  tofu state list

  docker ps -a --no-trunc

  ```'
hints.2.text: 'Import принимает ресурс в state, но не возобновляет paused-процесс.


  Импортируйте исходный ID в docker_container.worker, затем снимите паузу контейнера.


  Проверьте наблюдаемый результат:


  - `docker inspect rail-worker --format ''{{.Id}} {{.State.Running}} {{.State.Paused}}''; cat original-id`
  — ID совпадают; контейнер сообщает работает `true` и приостановлен `false`.


  - `tofu show -no-color` — Показывает `docker_container.worker` с тем же ID, что в `original-id` на workstation.'
debrief: Ресурс в состоянии и работающий, не приостановленный worker теперь имеют записанный ID.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать docker_container.worker.
diagnostics.condition_1: original-id должен быть непустым, а docker inspect rail-worker ID должен совпадать
  с его содержимым.
diagnostics.condition_2: original-id должен быть непустым, а tofu show -json docker_container.worker ID должен
  совпадать с его содержимым.
diagnostics.condition_3: rail-worker State.Running должен совпадать с true.
diagnostics.condition_4: rail-worker State.Paused должен совпадать с false.
stages.0.objectives.0.text: Существующий контейнер обработки маршрутов отслеживается поставленной конфигурацией.
stages.0.objectives.1.text: Контейнер и отслеживаемый ресурс сохраняют одну и ту же исходную идентичность.
stages.0.objectives.2.text: В приватном Docker daemon существующий контейнер обработки маршрутов работает и
  не приостановлен.
