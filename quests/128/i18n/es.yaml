title: Copia de seguridad y restauración de Application
brief: "El libro necesita un archivo verificable y después una copia restaurada utilizable. Conserve la identidad\
  \ original del claim en ambas etapas.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados:\
  \ `claim.yaml`, `ledger.yaml`, `service.yaml`, `client.yaml`, `original-ledger.sha256`, `original-pvc-uid`.\n\n\
  **Requirements:**\n\n- Etapa 1:\n  - `ledger.tar` en `~/quest` de la estación contiene exactamente `ledger.txt`,\
  \ cuyos bytes extraídos coinciden con `original-ledger.sha256`.\n  - El PVC `ledger` conserva su UID original\
  \ no vacío.\n- Etapa 2:\n  - `ledger.tar` en `~/quest` de la estación contiene exactamente `ledger.txt`, cuyos\
  \ bytes extraídos coinciden con `original-ledger.sha256`.\n  - El PVC `ledger` conserva su UID original no vacío.\n\
  \  - Tanto `/data/ledger.txt` dentro del Deployment `ledger` como los bytes recibidos por el Deployment `client`\
  \ en `http://ledger:8080/ledger.txt` coinciden con `original-ledger.sha256`.\n\n**Verify yourself before Check\
  \ & finish:** Ejecute estos comandos de observación desde `~/quest` en la estación de trabajo.\n\n- El archivo\
  \ enumera solo `ledger.txt`, cuyos bytes tienen la suma original.\n\n  ```sh\n  tar tf ledger.tar\n  tar xOf ledger.tar\
  \ ledger.txt | sha256sum\n  cat original-ledger.sha256\n  ```\n\n- La configuración, identidades y estado cumplen\
  \ los requisitos.\n\n  ```sh\n  kubectl get pvc ledger -o yaml\n  cat original-pvc-uid\n  ```\n\n- En la segunda\
  \ etapa, las sumas del archivo real y de los bytes recibidos coinciden con la original.\n\n  ```sh\n  kubectl\
  \ exec deployment/ledger -- sha256sum /data/ledger.txt\n  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt\
  \ | sha256sum\n  cat original-ledger.sha256\n  ```\n\nSe usa un archivo sintético en reposo, no una copia de base\
  \ de datos activa; las comprobaciones observan bytes e identidad del claim actuales, no el historial de restauración\
  \ ni si la respuesta HTTP vino del PVC."
debrief: Las comprobaciones compararon el archivo, el fichero activo, la respuesta HTTP y la identidad del PVC.
stages.0.brief: Un archivo completo debe coincidir con los bytes originales del libro.
stages.1.brief: El archivo restaurado y los bytes servidos deben coincidir con el libro original.
hints.0.text: Un comando de archivo exitoso no demuestra por sí solo bytes recuperables.
hints.1.text: Verifique la entrada exacta del archivo y el checksum original congelado.
hints.2.text: Transmita el archivo verificado nuevamente al volumen existente y pruebe el contenido servido.
phrases.0: Comparé la suma del archivo.
phrases.1: Comprobé el fichero activo y el UID del PVC.
phrases.2: Comparé la suma de la respuesta HTTP.
questions.0.points.0: Demuestra la integridad de los bytes frente a una referencia, no la recuperación completa
  de la aplicación.
questions.0.points.1: Pruebe también los datos restaurados a través de la aplicación.
questions.0.prompt: ¿Un checksum demuestra que una copia de seguridad puede restaurar el servicio?
questions.1.points.0: Las transacciones, WAL y los archivos relacionados pueden cambiar durante la copia.
questions.1.points.1: Utilice snapshots o backup APIs con reconocimiento de bases de datos.
questions.1.prompt: ¿Por qué la copia de un archivo de base de datos en vivo puede ser inconsistente?
