title: Copia de seguridad y restauración de Application
brief: Trabaja en `~/quest` con los archivos proporcionados `claim.json`, `ledger.json`, `service.json`, `client.json`, `original-ledger.sha256`
  y `original-pvc-uid`. Este ejercicio sin conexión usa un archivo sintético sin escrituras, no una copia de una base activa.
  Crea `ledger.tar` con exactamente `ledger.txt`; el SHA-256 extraído debe coincidir con `original-ledger.sha256` y el UID
  del PVC `ledger` con `original-pvc-uid`. En la segunda etapa restaura el archivo y comprueba que `/data/ledger.txt` en el
  deployment `ledger` y los bytes de `http://ledger:8080/ledger.txt` tengan esa suma. Las comprobaciones observan bytes e
  identidad actuales; no demuestran cómo se restauró el archivo ni que la respuesta proceda del PVC.
debrief: Las comprobaciones compararon el archivo, el fichero activo, la respuesta HTTP y la identidad del PVC.
stages.0.brief: El archivo contiene exactamente `ledger.txt` con la suma original y el UID del PVC no cambia.
stages.0.objectives.0.text: El archivo contiene exactamente `ledger.txt` con la suma original y el UID del PVC no cambia.
stages.1.brief: El archivo, el fichero activo y la respuesta HTTP tienen la suma original y el UID del PVC no cambia.
stages.1.objectives.0.text: El archivo, el fichero activo y la respuesta HTTP tienen la suma original y el UID del PVC no
  cambia.
hints.0.text: Un comando de archivo exitoso no demuestra por sí solo bytes recuperables.
hints.1.text: Verifique la entrada exacta del archivo y el checksum original congelado.
hints.2.text: Transmita el archivo verificado nuevamente al volumen existente y pruebe el contenido servido.
phrases.0: Comparé la suma del archivo.
phrases.1: Comprobé el fichero activo y el UID del PVC.
phrases.2: Comparé la suma de la respuesta HTTP.
questions.0.points.0: Demuestra la integridad de los bytes frente a una referencia, no la recuperación completa de la aplicación.
questions.0.points.1: Pruebe también los datos restaurados a través de la aplicación.
questions.0.prompt: ¿Un checksum demuestra que una copia de seguridad puede restaurar el servicio?
questions.1.points.0: Las transacciones, WAL y los archivos relacionados pueden cambiar durante la copia.
questions.1.points.1: Utilice snapshots o backup APIs con reconocimiento de bases de datos.
questions.1.prompt: ¿Por qué la copia de un archivo de base de datos en vivo puede ser inconsistente?
diagnostics.entries: ledger.tar debe contener exactamente ledger.txt.
diagnostics.archive_hash: ledger.tar ledger.txt SHA-256 debe ser igual a original-ledger.sha256.
diagnostics.pvc_uid: PVC/ledger UID debe ser igual a original-pvc-uid.
diagnostics.file_hash: /data/ledger.txt SHA-256 debe ser igual a original-ledger.sha256.
diagnostics.http_hash: http://ledger:8080/ledger.txt SHA-256 debe ser igual a original-ledger.sha256.
