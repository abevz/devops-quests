title: Copia de seguridad y restauración de Application
brief: |-
  La aplicación necesita un punto de recuperación coherente entre pedidos y resumen, seguido de una recuperación utilizable.

  Trabaja en la estación de trabajo, en `~/quest`, con los archivos suministrados:
  - `checkpoint-contract.json`.

  **Requisitos:**

  - Etapa 1:
    - `ledger.tar` en `~/quest` en la workstation contiene exactamente `ledger.txt` y conserva los bytes originales del ledger. Un segundo archivo, `checkpoint.tar` en `~/quest` de la estación de trabajo, contiene exactamente los archivos regulares `orders.tsv` y `summary.json`: misma generación y marcador, cantidades positivas, todas las rutas declaradas y el total correspondiente de `checkpoint-contract.json`. Conserva los PVC, Deployments e imágenes de worker originales.
    - El PVC `ledger` conserva su UID original no vacío.
  - Etapa 2:
    - `ledger.tar` en `~/quest` en la workstation contiene exactamente `ledger.txt` y conserva los bytes originales del ledger.
    - El PVC `ledger` conserva su UID original no vacío.
    - Tanto `/data/ledger.txt` dentro del Deployment `ledger` como los bytes recibidos por el Deployment `client` en `http://ledger:8080/ledger.txt` coinciden con los bytes originales del ledger. Los dos archivos de datos actuales y ambas respuestas obtenidas por el cliente existente coinciden con `checkpoint.tar`; los lectores actuales listos montan sus PVC originales y la entrada de datos permanece pausada según `checkpoint-contract.json`. Conserva los PVC, Deployments e imágenes de worker originales.

  Es una carga sintética acotada, no una copia de una base de datos activa. Las comprobaciones observan coherencia del archivo y estado actual; no prueban el historial de captura o restauración.
debrief: Las comprobaciones compararon el archivo original, un checkpoint coherente entre almacenes, identidades
  conservadas, montajes actuales, archivos restaurados y ambas vistas HTTP.
stages.0.brief: Obtén un punto de recuperación coherente conservando las identidades originales de almacenamiento
  y cargas.
stages.1.brief: Recupera ambos almacenes y sus vistas actuales de la aplicación desde ese punto.
hints.0.text: Dos copias correctas por separado pueden corresponder a transacciones diferentes. El punto de recuperación
  debe ser coherente entre almacenes y llegar a los consumidores actuales de la aplicación.
hints.1.text: |-
  Compara el protocolo de escritura, ambos almacenes actuales, los montajes de la aplicación y el contrato de resultado. Estas observaciones corresponden al estado existente:

  ```sh
  cat checkpoint-contract.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- cat /data/writer-phase /data/orders.tsv
  kubectl exec deployment/summary -- cat /data/summary.json
  ```
hints.2.text: |-
  Verifica entradas de los archivos y coherencia de la transacción; después compara archivos restaurados, identidades de PVC y ambas respuestas de la aplicación. Durante la recuperación, la entrada de datos queda pausada:

  ```sh
  tar tf ledger.tar
  tar xOf ledger.tar ledger.txt | sha256sum
  cat original-ledger.sha256
  tar tf checkpoint.tar
  tar xOf checkpoint.tar orders.tsv
  tar xOf checkpoint.tar summary.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt /data/orders.tsv
  kubectl exec deployment/summary -- sha256sum /data/summary.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json
  ```
phrases.0: Comparé la suma del archivo.
phrases.1: Comprobé el fichero activo y el UID del PVC.
phrases.2: Comparé la suma de la respuesta HTTP.
questions.0.points.0: Demuestra la integridad de los bytes frente a una referencia, no la recuperación completa
  de la aplicación.
questions.0.points.1: Pruebe también los datos restaurados a través de la aplicación.
questions.0.prompt: ¿Un checksum demuestra que una copia de seguridad puede restaurar el servicio?
questions.1.points.0: Las transacciones, WAL y los archivos relacionados pueden cambiar durante la copia.
questions.1.points.1: Utilice snapshots o backup APIs con reconocimiento de bases de datos.
questions.1.prompt: ¿Por qué la copia de un archivo de base de datos en vivo puede ser inconsistente?
stages.0.objectives.0.text: '`ledger.tar` en `~/quest` en la workstation contiene exactamente `ledger.txt` y conserva
  los bytes originales del ledger. Un segundo archivo, `checkpoint.tar` en `~/quest` de la estación de trabajo,
  contiene exactamente los archivos regulares `orders.tsv` y `summary.json`: misma generación y marcador, cantidades
  positivas, todas las rutas declaradas y el total correspondiente de `checkpoint-contract.json`. Conserva los PVC,
  Deployments e imágenes de worker originales.'
stages.0.objectives.1.text: El PVC `ledger` conserva su UID original no vacío.
stages.1.objectives.0.text: '`ledger.tar` en `~/quest` en la workstation contiene exactamente `ledger.txt` y conserva
  los bytes originales del ledger.'
stages.1.objectives.1.text: El PVC `ledger` conserva su UID original no vacío.
stages.1.objectives.2.text: Tanto `/data/ledger.txt` dentro del Deployment `ledger` como los bytes recibidos por
  el Deployment `client` en `http://ledger:8080/ledger.txt` coinciden con los bytes originales del ledger. Los dos
  archivos de datos actuales y ambas respuestas obtenidas por el cliente existente coinciden con `checkpoint.tar`;
  los lectores actuales listos montan sus PVC originales y la entrada de datos permanece pausada según `checkpoint-contract.json`.
  Conserva los PVC, Deployments e imágenes de worker originales.
diagnostics.entries: El archivo puede ser ilegible o contener entradas incorrectas. Comprueba que ledger.tar contenga una única entrada regular y no dispersa, ledger.txt. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-ledger-single-archive-entry)
diagnostics.archive_hash: Los bytes archivados de ledger.txt pueden diferir de los originales. Calcula el hash del flujo extraído y compáralo con original-ledger.sha256. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-ledger-captured-file-hash)
diagnostics.probe_0_0: La comprobación de la captura puede haberse detenido antes de indicar una condición. Comprueba los datos guardados y la lectura del archivo. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-ledger-capture-observer)
diagnostics.checkpoint_archive: checkpoint.tar puede contener entradas inesperadas u orders.tsv y summary.json de generaciones distintas. Comprueba las entradas regulares, el marcador registrado, la generación, las rutas y la suma de unidades de los pedidos. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-coherent-recovery-point)
diagnostics.checkpoint_identity: Puede faltar un Deployment o PVC conservado, haberse recreado o haber cambiado una imagen de worker. Compara las identidades y las imágenes actuales con el registro del punto de control. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-retained-objects)
diagnostics.pvc_uid: El PVC ledger puede faltar o haberse recreado. Compara el UID del PVC ledger actual con original-pvc-uid. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-ledger-retained-pvc)
diagnostics.probe_1_0: La comprobación del archivo conservado puede haberse detenido antes de indicar una condición. Comprueba que ledger.tar y la suma proporcionada se puedan leer durante la recuperación. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-ledger-retained-archive-observer)
diagnostics.file_hash: El /data/ledger.txt restaurado puede ser ilegible o contener otros bytes. Compara el hash dentro del Pod ledger con original-ledger.sha256. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-ledger-current-file-hash)
diagnostics.http_hash: client puede no leer el archivo por HTTP o recibir otros bytes. Compara el hash de la respuesta de ledger.txt con original-ledger.sha256. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-ledger-served-file-hash)
diagnostics.checkpoint_consumers: Un lector del punto de control o client puede carecer de un único Pod actual y listo con la imagen original. Comprueba la propiedad, la disponibilidad y las réplicas deseadas. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-current-readers)
diagnostics.checkpoint_quiescence: journal-writer puede conservar una réplica deseada o un Pod actual. Comprueba que se mantenga en cero durante la recuperación para evitar que sobrescriba los archivos. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-writer-quiet)
diagnostics.checkpoint_source: Una ruta restaurada puede pertenecer al PVC equivocado o no estar disponible en el Pod actual. Compara el montaje que cubre la ruta en la plantilla y en el Pod con el PVC requerido. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-claim-mounts)
diagnostics.checkpoint_file: Un archivo restaurado puede contener bytes de otro punto de recuperación. Compara los hashes actuales de orders.tsv y summary.json con los de las entradas correspondientes en checkpoint.tar. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-file-bytes)
diagnostics.checkpoint_http: Un lector puede servir bytes distintos de los archivados. Obtén orders.tsv y summary.json desde client y compara el hash de cada respuesta con su entrada en checkpoint.tar. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-served-file-bytes)
diagnostics.probe_1_2: La comprobación de recuperación puede haberse detenido antes de indicar una condición. Comprueba las identidades guardadas, las cargas actuales y la lectura del archivo de recuperación. [Causa y comprobación](guides#guide=storage-lifecycle&section=q128-checkpoint-restore-observer)
