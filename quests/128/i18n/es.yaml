title: Copia de seguridad y restauración de Application
brief: 'El libro mayor es un archivo de texto sintético inactivo en un PVC. Primero cree ledger.tar que
  contenga solo ledger.txt y verifíquelo con la fuente congelada checksum. La siguiente etapa corrompe
  el archivo activo; restaure los bytes originales del archivo verificado en el mismo PVC, luego verifique
  checksum y el HTTP real. No reemplace el claim ni cree un libro mayor vacío. Este dispositivo no tiene
  concurrent writes ni base de datos WAL: una base de datos en vivo necesita su propio método de respaldo
  consistente.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `claim.json`, `ledger.json`,
  `service.json`, `client.json`, `original-ledger.sha256`, `original-pvc-uid`, `ledger.tar`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el archivo contiene exactamente ledger.txt con el checksum original; queda
  el mismo PVC.'
debrief: La restauración se probó con los bytes de la aplicación real y el claim original, no solo con
  la existencia del archivo o Pod readiness.
stages.0.brief: 'Criterios de éxito: el archivo contiene exactamente ledger.txt con el checksum original;
  queda el mismo PVC.'
stages.0.objectives.0.text: El archivo contiene exactamente ledger.txt con el checksum original; queda
  el mismo PVC.
stages.1.brief: 'Criterios de éxito: los mismos PVC y HTTP endpoint contienen los bytes del libro mayor
  originales restaurados del archivo verificado.'
stages.1.objectives.0.text: Los mismos PVC y HTTP endpoint contienen los bytes del libro mayor originales
  restaurados del archivo verificado.
hints.0.text: Un comando de archivo exitoso no demuestra por sí solo bytes recuperables.
hints.1.text: Verifique la entrada exacta del archivo y el checksum original congelado.
hints.2.text: Transmita el archivo verificado nuevamente al volumen existente y pruebe el contenido servido.
phrases.0: Verifiqué el contenido de la copia de seguridad antes de la restauración.
phrases.1: Restauré los datos de la aplicación en el claim original.
phrases.2: Probé los datos a través de la aplicación en vivo endpoint.
questions.0.points.0: Demuestra la integridad de los bytes frente a una referencia, no la recuperación
  completa de la aplicación.
questions.0.points.1: Pruebe también los datos restaurados a través de la aplicación.
questions.0.prompt: ¿Un checksum demuestra que una copia de seguridad puede restaurar el servicio?
questions.1.points.0: Las transacciones, WAL y los archivos relacionados pueden cambiar durante la copia.
questions.1.points.1: Utilice snapshots o backup APIs con reconocimiento de bases de datos.
questions.1.prompt: ¿Por qué la copia de un archivo de base de datos en vivo puede ser inconsistente?
