title: Copia de seguridad y restauración de Application
brief: |-
  El libro necesita un archivo verificable y después una copia restaurada utilizable. Conserve la identidad original del claim en ambas etapas.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `claim.yaml`, `ledger.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etapa 1:
    - `ledger.tar` en `~/quest` en la workstation contiene exactamente `ledger.txt` y conserva los bytes originales del ledger.
    - El PVC `ledger` conserva su UID original no vacío.

  - Etapa 2:
    - `ledger.tar` en `~/quest` en la workstation contiene exactamente `ledger.txt` y conserva los bytes originales del ledger.
    - El PVC `ledger` conserva su UID original no vacío.
    - Tanto `/data/ledger.txt` dentro del Deployment `ledger` como los bytes recibidos por el Deployment `client` en `http://ledger:8080/ledger.txt` coinciden con los bytes originales del ledger.

  Se usa un archivo sintético en reposo, no una copia de base de datos activa; las comprobaciones observan bytes e identidad del claim actuales, no el historial de restauración ni si la respuesta HTTP vino del PVC.
debrief: Las comprobaciones compararon el archivo, el fichero activo, la respuesta HTTP y la identidad
  del PVC.
stages.0.brief: Un archivo completo debe coincidir con los bytes originales del libro.
stages.1.brief: El archivo restaurado y los bytes servidos deben coincidir con el libro original.
hints.0.text: Un comando de archivo exitoso no demuestra por sí solo bytes recuperables.
hints.1.text: |-
  Verifique la entrada exacta del archivo y el checksum original congelado.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl describe pvc
  kubectl describe deployment ledger
  ```
hints.2.text: |-
  Transmita el archivo verificado nuevamente al volumen existente y pruebe el contenido servido.

  Verifica el resultado desde `~/quest` en la workstation:

  - El archivo enumera solo `ledger.txt`, cuyos bytes tienen la suma original.

    ```sh
    tar tf ledger.tar
    tar xOf ledger.tar ledger.txt | sha256sum
    cat original-ledger.sha256
    ```

  - La configuración, identidades y estado cumplen los requisitos.

    ```sh
    kubectl get pvc ledger -o yaml
    cat original-pvc-uid
    ```

  - En la segunda etapa, las sumas del archivo real y de los bytes recibidos coinciden con la original.

    ```sh
    kubectl exec deployment/ledger -- sha256sum /data/ledger.txt
    kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
    cat original-ledger.sha256
    ```
phrases.0: Comparé la suma del archivo.
phrases.1: Comprobé el fichero activo y el UID del PVC.
phrases.2: Comparé la suma de la respuesta HTTP.
questions.0.points.0: Demuestra la integridad de los bytes frente a una referencia, no la recuperación
  completa de la aplicación.
questions.0.points.1: Pruebe también los datos restaurados a través de la aplicación.
questions.0.prompt: ¿Un checksum demuestra que una copia de seguridad puede restaurar el servicio?
questions.1.points.0: Las transacciones, WAL y los archivos relacionados pueden cambiar durante la copia.
questions.1.points.1: Utilice snapshots o backup APIs con reconocimiento de bases de datos.
questions.1.prompt: ¿Por qué la copia de un archivo de base de datos en vivo puede ser inconsistente?
