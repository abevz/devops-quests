diagnostics.probe_0_0: Falta el archivo checkpoint, tiene formato incorrecto o combina generaciones, rutas o totales
  incoherentes.
diagnostics.probe_1_0: 'Los datos actuales no permiten verificar este objetivo: `ledger.tar` en `~/quest` en la
  workstation contiene exactamente `ledger.txt` y conserva los bytes originales del ledger.'
diagnostics.checkpoint_archive: Falta el archivo checkpoint, tiene formato incorrecto o combina generaciones, rutas
  o totales incoherentes.
diagnostics.checkpoint_identity: La identidad de un PVC o Deployment original, o una imagen suministrada de worker,
  difiere del estado inicial.
diagnostics.checkpoint_consumers: Un consumidor requerido no tiene exactamente un Pod actual listo perteneciente
  a su Deployment.
diagnostics.checkpoint_quiescence: El escritor aún solicita réplicas o conserva un Pod actual activo; la recuperación
  debe permanecer pausada.
diagnostics.checkpoint_source: Un lector actual o su plantilla no usa el PVC original para la ruta declarada, o
  no se puede observar el estado.
diagnostics.checkpoint_file: Un archivo de datos montado difiere de la entrada verificada del checkpoint.
diagnostics.checkpoint_http: La respuesta recibida por el cliente existente difiere de la entrada verificada del
  checkpoint.
diagnostics.probe_1_2: Un lector actual o su plantilla no usa el PVC original para la ruta declarada, o no se puede
  observar el estado.
