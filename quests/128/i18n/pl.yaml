title: Tworzenie kopii zapasowych i przywracanie aplikacji
brief: |-
  Aplikacja potrzebuje spójnego punktu odtwarzania zamówień i podsumowania, a następnie działającego odtworzenia obu magazynów.

  Pracuj na stacji roboczej w `~/quest` z dostarczonymi plikami:
  - `checkpoint-contract.json`.

  **Wymagania:**

  - Etap 1:
    - `ledger.tar` w `~/quest` na workstation zawiera dokładnie `ledger.txt` i zachowuje pierwotne bajty ledger. Drugie archiwum `checkpoint.tar` w `~/quest` na stacji roboczej zawiera dokładnie zwykłe pliki `orders.tsv` i `summary.json`: zgodną generację i znacznik, dodatnie ilości, wszystkie zadeklarowane trasy i odpowiadającą sumę według `checkpoint-contract.json`. Zachowaj pierwotne PVC, Deploymenty i dostarczone obrazy kontenerów worker.
    - PVC `ledger` zachowuje pierwotny niepusty UID.
  - Etap 2:
    - `ledger.tar` w `~/quest` na workstation zawiera dokładnie `ledger.txt` i zachowuje pierwotne bajty ledger.
    - PVC `ledger` zachowuje pierwotny niepusty UID.
    - Zarówno `/data/ledger.txt` wewnątrz Deployment `ledger`, jak i bajty odebrane przez Deployment `client` pod `http://ledger:8080/ledger.txt` odpowiadają pierwotnym bajtom ledger. Dwa bieżące pliki danych i obie odpowiedzi pobrane przez istniejącego klienta odpowiadają `checkpoint.tar`; bieżący gotowi czytelnicy montują pierwotne PVC, a przyjmowanie danych pozostaje wstrzymane zgodnie z `checkpoint-contract.json`. Zachowaj pierwotne PVC, Deploymenty i dostarczone obrazy kontenerów worker.

  To ograniczone obciążenie syntetyczne, nie kopia działającej bazy danych. Kontrole obserwują spójność archiwum i bieżący stan; nie dowodzą historii tworzenia kopii ani odtwarzania.
debrief: Kontrole porównały pierwotne archiwum, spójny checkpoint obu magazynów, zachowane tożsamości obiektów,
  bieżące montowania, odtworzone pliki i obie odpowiedzi HTTP.
stages.0.brief: Utwórz spójny punkt odtwarzania, zachowując tożsamość istniejących PVC i obiektów obciążeń.
stages.1.brief: Odtwórz oba magazyny oraz ich bieżące widoki aplikacji z tego punktu.
hints.0.text: Oddzielnie poprawne kopie mogą opisywać różne transakcje. Punkt odtwarzania musi być spójny między
  magazynami, a odtworzenie musi dotrzeć do bieżących odbiorców aplikacji.
hints.1.text: |-
  Porównaj protokół zapisu, oba bieżące magazyny, montowania aplikacji i kontrakt wyniku. Poniższe obserwacje dotyczą istniejącego stanu:

  ```sh
  cat checkpoint-contract.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- cat /data/writer-phase /data/orders.tsv
  kubectl exec deployment/summary -- cat /data/summary.json
  ```
hints.2.text: |-
  Sprawdź skład archiwów i spójność transakcji, a następnie odtworzone pliki, tożsamość PVC i obie odpowiedzi aplikacji. Podczas odtwarzania przyjmowanie danych jest wstrzymane:

  ```sh
  tar tf ledger.tar
  tar xOf ledger.tar ledger.txt | sha256sum
  cat original-ledger.sha256
  tar tf checkpoint.tar
  tar xOf checkpoint.tar orders.tsv
  tar xOf checkpoint.tar summary.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt /data/orders.tsv
  kubectl exec deployment/summary -- sha256sum /data/summary.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json
  ```
phrases.0: Porównałem sumę archiwum.
phrases.1: Sprawdziłem plik i UID PVC.
phrases.2: Porównałem sumę odpowiedzi HTTP.
questions.0.points.0: Dowodzi integralności bajtów w odniesieniu do odniesienia, a nie pełnego odzyskania aplikacji.
questions.0.points.1: Przetestuj także przywrócone dane za pośrednictwem aplikacji.
questions.0.prompt: Czy checksum dowodzi, że kopia zapasowa może przywrócić usługę?
questions.1.points.0: Transakcje, WAL i powiązane pliki mogą ulec zmianie podczas kopiowania.
questions.1.points.1: Użyj snapshots lub backup APIs obsługującego bazę danych.
questions.1.prompt: Dlaczego kopiowanie aktywnego pliku bazy danych może być niespójne?
