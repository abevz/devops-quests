title: Tworzenie kopii zapasowych i przywracanie aplikacji
brief: 'Księga jest nieaktywnym syntetycznym plikiem tekstowym na PVC. Najpierw utwórz ledger.tar zawierający
  tylko ledger.txt i zweryfikuj go w stosunku do zamrożonego źródła checksum. Następny etap powoduje uszkodzenie
  pliku na żywo; przywróć oryginalne bajty ze zweryfikowanego archiwum do tego samego PVC, a następnie
  zweryfikuj checksum i aktualne HTTP. Nie wymieniaj claim ani nie twórz nowej, pustej księgi. To urządzenie
  nie ma concurrent writes ani bazy danych WAL: aktywna baza danych wymaga własnej, spójnej metody tworzenia
  kopii zapasowych.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `claim.json`, `ledger.json`,
  `service.json`, `client.json`, `original-ledger.sha256`, `original-pvc-uid`, `ledger.tar`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: archiwum zawiera dokładnie ledger.txt z oryginalnym checksum; pozostaje
  ten sam PVC.'
debrief: Przywracanie zostało przetestowane na podstawie rzeczywistych bajtów aplikacji i oryginalnego
  claim, a nie tylko istnienia archiwum lub gotowości Pod.
stages.0.brief: 'Kryteria sukcesu: Archiwum zawiera dokładnie ledger.txt z oryginalnym checksum; pozostaje
  ten sam PVC.'
stages.0.objectives.0.text: Archiwum zawiera dokładnie ledger.txt z oryginalnym checksum; pozostaje ten
  sam PVC.
stages.1.brief: 'Kryteria sukcesu: Te same PVC i HTTP endpoint zawierają oryginalne bajty księgi przywrócone
  ze zweryfikowanego archiwum.'
stages.1.objectives.0.text: Te same PVC i HTTP endpoint zawierają oryginalne bajty księgi przywrócone
  ze zweryfikowanego archiwum.
hints.0.text: Pomyślne polecenie archiwizacji samo w sobie nie gwarantuje odzyskania bajtów.
hints.1.text: Sprawdź dokładny wpis w archiwum i zamrożony oryginał checksum.
hints.2.text: Przesyłaj strumieniowo zweryfikowany plik z powrotem do istniejącego wolumenu i przetestuj
  udostępnianą zawartość.
phrases.0: Przed przywróceniem zweryfikowałem zawartość kopii zapasowej.
phrases.1: Przywróciłem dane aplikacji na oryginalnym claim.
phrases.2: Dane przetestowałem poprzez aktywną aplikację endpoint.
questions.0.points.0: Dowodzi integralności bajtów w odniesieniu do odniesienia, a nie pełnego odzyskania
  aplikacji.
questions.0.points.1: Przetestuj także przywrócone dane za pośrednictwem aplikacji.
questions.0.prompt: Czy checksum dowodzi, że kopia zapasowa może przywrócić usługę?
questions.1.points.0: Transakcje, WAL i powiązane pliki mogą ulec zmianie podczas kopiowania.
questions.1.points.1: Użyj snapshots lub backup APIs obsługującego bazę danych.
questions.1.prompt: Dlaczego kopiowanie aktywnego pliku bazy danych może być niespójne?
