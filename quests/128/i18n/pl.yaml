title: Tworzenie kopii zapasowych i przywracanie aplikacji
brief: Pracuj w `~/quest` z dostarczonymi `claim.json`, `ledger.json`, `service.json`, `client.json`, `original-ledger.sha256`
  i `original-pvc-uid`. To ćwiczenie offline używa jednego syntetycznego, niezmienianego pliku, a nie kopii działającej bazy.
  Utwórz `ledger.tar` zawierające dokładnie `ledger.txt`; SHA-256 wypakowanej zawartości musi odpowiadać `original-ledger.sha256`,
  a UID PVC `ledger` musi odpowiadać `original-pvc-uid`. W drugim etapie odtwórz plik i sprawdź, że `/data/ledger.txt` w deployment
  `ledger` oraz bajty z `http://ledger:8080/ledger.txt` mają tę samą sumę. Kontrole obserwują bieżące bajty i tożsamość PVC;
  nie dowodzą sposobu odtworzenia ani pochodzenia odpowiedzi z PVC.
debrief: Kontrole porównały archiwum, plik, odpowiedź HTTP i tożsamość PVC.
stages.0.brief: Archiwum zawiera dokładnie `ledger.txt` z pierwotną sumą, a UID PVC jest niezmieniony.
stages.0.objectives.0.text: Archiwum zawiera dokładnie `ledger.txt` z pierwotną sumą, a UID PVC jest niezmieniony.
stages.1.brief: Archiwum, plik i odpowiedź HTTP mają pierwotną sumę, a UID PVC jest niezmieniony.
stages.1.objectives.0.text: Archiwum, plik i odpowiedź HTTP mają pierwotną sumę, a UID PVC jest niezmieniony.
hints.0.text: Pomyślne polecenie archiwizacji samo w sobie nie gwarantuje odzyskania bajtów.
hints.1.text: Sprawdź dokładny wpis w archiwum i zamrożony oryginał checksum.
hints.2.text: Przesyłaj strumieniowo zweryfikowany plik z powrotem do istniejącego wolumenu i przetestuj udostępnianą zawartość.
phrases.0: Porównałem sumę archiwum.
phrases.1: Sprawdziłem plik i UID PVC.
phrases.2: Porównałem sumę odpowiedzi HTTP.
questions.0.points.0: Dowodzi integralności bajtów w odniesieniu do odniesienia, a nie pełnego odzyskania aplikacji.
questions.0.points.1: Przetestuj także przywrócone dane za pośrednictwem aplikacji.
questions.0.prompt: Czy checksum dowodzi, że kopia zapasowa może przywrócić usługę?
questions.1.points.0: Transakcje, WAL i powiązane pliki mogą ulec zmianie podczas kopiowania.
questions.1.points.1: Użyj snapshots lub backup APIs obsługującego bazę danych.
questions.1.prompt: Dlaczego kopiowanie aktywnego pliku bazy danych może być niespójne?
