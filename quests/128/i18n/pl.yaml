title: Tworzenie kopii zapasowych i przywracanie aplikacji
brief: |-
  Rejestr wymaga sprawdzalnego archiwum, a potem użytecznej przywróconej kopii. Zachowaj oryginalną tożsamość claimu na obu etapach.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `claim.yaml`, `ledger.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etap 1:
    - `ledger.tar` w `~/quest` na workstation zawiera dokładnie `ledger.txt` i zachowuje pierwotne bajty ledger.
    - PVC `ledger` zachowuje pierwotny niepusty UID.

  - Etap 2:
    - `ledger.tar` w `~/quest` na workstation zawiera dokładnie `ledger.txt` i zachowuje pierwotne bajty ledger.
    - PVC `ledger` zachowuje pierwotny niepusty UID.
    - Zarówno `/data/ledger.txt` wewnątrz Deployment `ledger`, jak i bajty odebrane przez Deployment `client` pod `http://ledger:8080/ledger.txt` odpowiadają pierwotnym bajtom ledger.

  Używany jest jeden syntetyczny niezmieniany podczas kopiowania plik, nie kopia działającej bazy; kontrole obserwują bieżące bajty i tożsamość claimu, nie historię odtwarzania ani pochodzenie odpowiedzi HTTP z PVC.
debrief: Kontrole porównały archiwum, plik, odpowiedź HTTP i tożsamość PVC.
stages.0.brief: Kompletne archiwum musi odpowiadać pierwotnym bajtom rejestru.
stages.1.brief: Przywrócony plik i obsługiwane bajty muszą odpowiadać pierwotnemu rejestrowi.
hints.0.text: Pomyślne polecenie archiwizacji samo w sobie nie gwarantuje odzyskania bajtów.
hints.1.text: |-
  Sprawdź dokładny wpis w archiwum i zamrożony oryginał checksum.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl describe pvc
  kubectl describe deployment ledger
  ```
hints.2.text: |-
  Przesyłaj strumieniowo zweryfikowany plik z powrotem do istniejącego wolumenu i przetestuj udostępnianą zawartość.

  Sprawdź wynik z `~/quest` na workstation:

  - Archiwum zawiera tylko `ledger.txt`, którego bajty mają pierwotną sumę kontrolną.

    ```sh
    tar tf ledger.tar
    tar xOf ledger.tar ledger.txt | sha256sum
    cat original-ledger.sha256
    ```

  - Ustawienia, tożsamości i stan odpowiadają wymaganiom.

    ```sh
    kubectl get pvc ledger -o yaml
    cat original-pvc-uid
    ```

  - W drugim etapie sumy bieżącego pliku i otrzymanych bajtów odpowiadają pierwotnej.

    ```sh
    kubectl exec deployment/ledger -- sha256sum /data/ledger.txt
    kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
    cat original-ledger.sha256
    ```
phrases.0: Porównałem sumę archiwum.
phrases.1: Sprawdziłem plik i UID PVC.
phrases.2: Porównałem sumę odpowiedzi HTTP.
questions.0.points.0: Dowodzi integralności bajtów w odniesieniu do odniesienia, a nie pełnego odzyskania
  aplikacji.
questions.0.points.1: Przetestuj także przywrócone dane za pośrednictwem aplikacji.
questions.0.prompt: Czy checksum dowodzi, że kopia zapasowa może przywrócić usługę?
questions.1.points.0: Transakcje, WAL i powiązane pliki mogą ulec zmianie podczas kopiowania.
questions.1.points.1: Użyj snapshots lub backup APIs obsługującego bazę danych.
questions.1.prompt: Dlaczego kopiowanie aktywnego pliku bazy danych może być niespójne?
