diagnostics.entries: Archiwum może być nieczytelne lub zawierać inne wpisy. Sprawdź, czy ledger.tar zawiera dokładnie jeden zwykły, nierozrzedzony wpis ledger.txt. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-ledger-single-archive-entry)
diagnostics.archive_hash: Bajty ledger.txt w archiwum mogą się różnić. Oblicz skrót strumienia z archiwum i porównaj z original-ledger.sha256. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-ledger-captured-file-hash)
diagnostics.probe_0_0: Kontrola zapisu mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź zapisane dane i możliwość odczytu archiwum. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-ledger-capture-observer)
diagnostics.checkpoint_archive: checkpoint.tar może zawierać nieoczekiwane wpisy lub orders.tsv i summary.json z różnych generacji. Sprawdź zwykłe wpisy, zapisany znacznik, generację, trasy i sumę jednostek zamówień. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-coherent-recovery-point)
diagnostics.checkpoint_identity: Zachowany Deployment lub PVC może nie istnieć lub został utworzony ponownie, albo zmienił się obraz worker. Porównaj bieżące tożsamości i obrazy z zapisem punktu kontrolnego. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-retained-objects)
diagnostics.pvc_uid: PVC ledger może nie istnieć lub został utworzony ponownie. Porównaj bieżący UID PVC ledger z original-pvc-uid. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-ledger-retained-pvc)
diagnostics.probe_1_0: Kontrola zachowanego archiwum mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź, czy ledger.tar i dostarczona suma są czytelne w fazie odzyskiwania. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-ledger-retained-archive-observer)
diagnostics.file_hash: Odtworzony /data/ledger.txt może być nieczytelny lub zawierać inne bajty. Porównaj skrót wewnątrz Poda ledger z original-ledger.sha256. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-ledger-current-file-hash)
diagnostics.http_hash: client może nie odczytać pliku przez HTTP lub otrzymać inne bajty. Porównaj skrót odpowiedzi dla ledger.txt z original-ledger.sha256. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-ledger-served-file-hash)
diagnostics.checkpoint_consumers: Czytnik punktu kontrolnego lub client może nie mieć dokładnie jednego bieżącego gotowego Poda z pierwotnym obrazem. Sprawdź właściciela, gotowość i żądaną liczbę replik. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-current-readers)
diagnostics.checkpoint_quiescence: journal-writer może mieć nadal żądaną replikę lub bieżący Pod. Sprawdź, czy podczas odzyskiwania pozostaje przy zerze i nie nadpisuje plików. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-writer-quiet)
diagnostics.checkpoint_source: Odtworzona ścieżka może wskazywać niewłaściwy PVC albo być niedostępna w bieżącym Podzie. Porównaj montowanie obejmujące ścieżkę w szablonie i aktualnym Podzie z wymaganym PVC. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-claim-mounts)
diagnostics.checkpoint_file: Odtworzony plik może zawierać bajty z innego punktu odzyskiwania. Porównaj skróty bieżących orders.tsv i summary.json z odpowiednimi wpisami checkpoint.tar. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-file-bytes)
diagnostics.checkpoint_http: Czytnik może zwracać inne bajty niż archiwum. Pobierz orders.tsv i summary.json z bieżącego client i porównaj skrót każdej odpowiedzi z wpisem w checkpoint.tar. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-served-file-bytes)
diagnostics.probe_1_2: Kontrola odzyskiwania mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź zapisane tożsamości, bieżące obciążenia i dostęp do archiwum odzyskiwania. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q128-checkpoint-restore-observer)
