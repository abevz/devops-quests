title: Tworzenie kopii zapasowych i przywracanie aplikacji
brief: "Rejestr wymaga sprawdzalnego archiwum, a potem użytecznej przywróconej kopii. Zachowaj oryginalną tożsamość\
  \ claimu na obu etapach.\n\nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `claim.json`, `ledger.json`,\
  \ `service.json`, `client.json`, `original-ledger.sha256`, `original-pvc-uid`.\n\n**Requirements:**\n\n- Etap\
  \ 1:\n  - `ledger.tar` w `~/quest` na stacji roboczej zawiera dokładnie `ledger.txt`, którego wyodrębnione bajty\
  \ odpowiadają `original-ledger.sha256`.\n  - PVC `ledger` zachowuje pierwotny niepusty UID.\n- Etap 2:\n  - `ledger.tar`\
  \ w `~/quest` na stacji roboczej zawiera dokładnie `ledger.txt`, którego wyodrębnione bajty odpowiadają `original-ledger.sha256`.\n\
  \  - PVC `ledger` zachowuje pierwotny niepusty UID.\n  - Zarówno `/data/ledger.txt` wewnątrz Deployment `ledger`,\
  \ jak i bajty otrzymane przez Deployment `client` pod `http://ledger:8080/ledger.txt` odpowiadają `original-ledger.sha256`.\n\
  \n**Verify yourself before Check & finish:** Wykonaj te polecenia obserwacji z `~/quest` na stacji roboczej.\n\
  \n- Archiwum zawiera tylko `ledger.txt`, którego bajty mają pierwotną sumę kontrolną.\n\n  ```sh\n  tar tf ledger.tar\n\
  \  tar xOf ledger.tar ledger.txt | sha256sum\n  cat original-ledger.sha256\n  ```\n\n- Ustawienia, tożsamości\
  \ i stan odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get pvc ledger -o yaml\n  cat original-pvc-uid\n  ```\n\
  \n- W drugim etapie sumy bieżącego pliku i otrzymanych bajtów odpowiadają pierwotnej.\n\n  ```sh\n  kubectl exec\
  \ deployment/ledger -- sha256sum /data/ledger.txt\n  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt\
  \ | sha256sum\n  cat original-ledger.sha256\n  ```\n\nUżywany jest jeden syntetyczny niezmieniany podczas kopiowania\
  \ plik, nie kopia działającej bazy; kontrole obserwują bieżące bajty i tożsamość claimu, nie historię odtwarzania\
  \ ani pochodzenie odpowiedzi HTTP z PVC."
debrief: Kontrole porównały archiwum, plik, odpowiedź HTTP i tożsamość PVC.
stages.0.brief: Kompletne archiwum musi odpowiadać pierwotnym bajtom rejestru.
stages.1.brief: Przywrócony plik i obsługiwane bajty muszą odpowiadać pierwotnemu rejestrowi.
hints.0.text: Pomyślne polecenie archiwizacji samo w sobie nie gwarantuje odzyskania bajtów.
hints.1.text: Sprawdź dokładny wpis w archiwum i zamrożony oryginał checksum.
hints.2.text: Przesyłaj strumieniowo zweryfikowany plik z powrotem do istniejącego wolumenu i przetestuj udostępnianą
  zawartość.
phrases.0: Porównałem sumę archiwum.
phrases.1: Sprawdziłem plik i UID PVC.
phrases.2: Porównałem sumę odpowiedzi HTTP.
questions.0.points.0: Dowodzi integralności bajtów w odniesieniu do odniesienia, a nie pełnego odzyskania aplikacji.
questions.0.points.1: Przetestuj także przywrócone dane za pośrednictwem aplikacji.
questions.0.prompt: Czy checksum dowodzi, że kopia zapasowa może przywrócić usługę?
questions.1.points.0: Transakcje, WAL i powiązane pliki mogą ulec zmianie podczas kopiowania.
questions.1.points.1: Użyj snapshots lub backup APIs obsługującego bazę danych.
questions.1.prompt: Dlaczego kopiowanie aktywnego pliku bazy danych może być niespójne?
