title: Application backup and restore
brief: |-
  The ledger needs a verifiable archive and then a usable restored copy. Preserve the original claim identity throughout both stages.

  Work on the workstation in `~/quest` with the supplied files:
  - `claim.yaml`, `ledger.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stage 1:
    - `ledger.tar` in `~/quest` on the workstation contains exactly `ledger.txt`, preserving the original ledger bytes.
    - PVC `ledger` keeps its original nonempty UID.

  - Stage 2:
    - `ledger.tar` in `~/quest` on the workstation contains exactly `ledger.txt`, preserving the original ledger bytes.
    - PVC `ledger` keeps its original nonempty UID.
    - Both `/data/ledger.txt` inside Deployment `ledger` and the bytes received by Deployment `client` at `http://ledger:8080/ledger.txt` match the original ledger bytes.

  This uses one synthetic quiescent file, not a live database backup; checks observe current bytes and claim identity, not restoration history or whether the HTTP response came from the PVC.
debrief: The checks compared the archive, live file, HTTP response and PVC identity.
stages.0.brief: A complete archive must match the original ledger bytes.
stages.1.brief: The restored file and served bytes must match the original ledger.
hints.0.text: A successful archive command does not by itself prove recoverable bytes.
hints.1.text: |-
  Verify the exact archive entry and frozen original checksum.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl describe pvc
  kubectl describe deployment ledger
  ```
hints.2.text: |-
  Stream the verified file back into the existing volume and test the served content.

  Verify the result from `~/quest` on the workstation:

  - The archive lists only `ledger.txt`, whose bytes have the original checksum.

    ```sh
    tar tf ledger.tar
    tar xOf ledger.tar ledger.txt | sha256sum
    cat original-ledger.sha256
    ```

  - Settings, identities and status match Requirements.

    ```sh
    kubectl get pvc ledger -o yaml
    cat original-pvc-uid
    ```

  - In stage two, both live-file and received-byte checksums match the original.

    ```sh
    kubectl exec deployment/ledger -- sha256sum /data/ledger.txt
    kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
    cat original-ledger.sha256
    ```
phrases.0: I compared the archive checksum.
phrases.1: I checked the live file and PVC UID.
phrases.2: I compared the HTTP response checksum.
questions.0.points.0: It proves byte integrity against a reference, not full application recovery.
questions.0.points.1: Test restored data through the application too.
questions.0.prompt: Does a checksum prove a backup can restore the service?
questions.1.points.0: Transactions, WAL and related files may change during copying.
questions.1.points.1: Use database-aware snapshots or backup APIs.
questions.1.prompt: Why can copying a live database file be inconsistent?
