title: Application backup and restore
brief: "The ledger needs a verifiable archive and then a usable restored copy. Preserve the original claim identity\
  \ throughout both stages.\n\nWork in `~/quest` on the workstation. Supplied files: `claim.json`, `ledger.json`,\
  \ `service.json`, `client.json`, `original-ledger.sha256`, `original-pvc-uid`.\n\n**Requirements:**\n\n- Stage\
  \ 1:\n  - `ledger.tar` in `~/quest` on the workstation contains exactly `ledger.txt`, whose extracted bytes match\
  \ `original-ledger.sha256`.\n  - PVC `ledger` keeps its original nonempty UID.\n- Stage 2:\n  - `ledger.tar` in\
  \ `~/quest` on the workstation contains exactly `ledger.txt`, whose extracted bytes match `original-ledger.sha256`.\n\
  \  - PVC `ledger` keeps its original nonempty UID.\n  - Both `/data/ledger.txt` inside Deployment `ledger` and\
  \ the bytes received by Deployment `client` at `http://ledger:8080/ledger.txt` match `original-ledger.sha256`.\n\
  \n**Verify yourself before Check & finish:** Run these observation commands from `~/quest` on the workstation.\n\
  \n- The archive lists only `ledger.txt`, whose bytes have the original checksum.\n\n  ```sh\n  tar tf ledger.tar\n\
  \  tar xOf ledger.tar ledger.txt | sha256sum\n  cat original-ledger.sha256\n  ```\n\n- Settings, identities and\
  \ status match Requirements.\n\n  ```sh\n  kubectl get pvc ledger -o yaml\n  cat original-pvc-uid\n  ```\n\n-\
  \ In stage two, both live-file and received-byte checksums match the original.\n\n  ```sh\n  kubectl exec deployment/ledger\
  \ -- sha256sum /data/ledger.txt\n  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt\
  \ | sha256sum\n  cat original-ledger.sha256\n  ```\n\nThis uses one synthetic quiescent file, not a live database\
  \ backup; checks observe current bytes and claim identity, not restoration history or whether the HTTP response\
  \ came from the PVC."
debrief: The checks compared the archive, live file, HTTP response and PVC identity.
stages.0.brief: A complete archive must match the original ledger bytes.
stages.1.brief: The restored file and served bytes must match the original ledger.
hints.0.text: A successful archive command does not by itself prove recoverable bytes.
hints.1.text: Verify the exact archive entry and frozen original checksum.
hints.2.text: Stream the verified file back into the existing volume and test the served content.
phrases.0: I compared the archive checksum.
phrases.1: I checked the live file and PVC UID.
phrases.2: I compared the HTTP response checksum.
questions.0.points.0: It proves byte integrity against a reference, not full application recovery.
questions.0.points.1: Test restored data through the application too.
questions.0.prompt: Does a checksum prove a backup can restore the service?
questions.1.points.0: Transactions, WAL and related files may change during copying.
questions.1.points.1: Use database-aware snapshots or backup APIs.
questions.1.prompt: Why can copying a live database file be inconsistent?
