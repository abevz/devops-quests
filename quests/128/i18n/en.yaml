title: Application backup and restore
brief: 'The ledger is a quiescent synthetic text file on a PVC. First create ledger.tar containing only
  ledger.txt and verify it against the frozen source checksum. The next stage corrupts the live file;
  restore the original bytes from the verified archive into the same PVC, then verify checksum and actual
  HTTP. Do not replace the claim or create a fresh empty ledger. This fixture has no concurrent writes
  or database WAL: a live database needs its own consistent backup method.


  Quest files in `~/quest` (some appear in later stages): `claim.json`, `ledger.json`, `service.json`,
  `client.json`, `original-ledger.sha256`, `original-pvc-uid`, `ledger.tar`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The archive contains exactly ledger.txt with the original checksum; the same
  PVC remains.'
debrief: The restore was tested against actual application bytes and the original claim, not only archive
  existence or Pod readiness.
stages.0.brief: 'The archive contains exactly ledger.txt with the original checksum; the same PVC remains.


  Success criteria: The archive contains exactly ledger.txt with the original checksum; the same PVC remains.'
stages.0.objectives.0.text: The archive contains exactly ledger.txt with the original checksum; the same
  PVC remains.
stages.1.brief: 'The same PVC and HTTP endpoint contain the original ledger bytes restored from the verified
  archive.


  Success criteria: The same PVC and HTTP endpoint contain the original ledger bytes restored from the
  verified archive.'
stages.1.objectives.0.text: The same PVC and HTTP endpoint contain the original ledger bytes restored
  from the verified archive.
hints.0.text: A successful archive command does not by itself prove recoverable bytes.
hints.1.text: Verify the exact archive entry and frozen original checksum.
hints.2.text: Stream the verified file back into the existing volume and test the served content.
phrases.0: I verified the backup contents before restoration.
phrases.1: I restored application data on the original claim.
phrases.2: I tested the data through the live application endpoint.
questions.0.points.0: It proves byte integrity against a reference, not full application recovery.
questions.0.points.1: Test restored data through the application too.
questions.0.prompt: Does a checksum prove a backup can restore the service?
questions.1.points.0: Transactions, WAL and related files may change during copying.
questions.1.points.1: Use database-aware snapshots or backup APIs.
questions.1.prompt: Why can copying a live database file be inconsistent?
