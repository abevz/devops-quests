diagnostics.entries: The archive may be unreadable or contain the wrong entries. Verify that ledger.tar contains exactly one regular, non-sparse entry, ledger.txt. [Cause and check](guides#guide=storage-lifecycle&section=q128-ledger-single-archive-entry)
diagnostics.archive_hash: The archived ledger.txt bytes may differ from the supplied original hash. Hash the extracted stream and compare it with original-ledger.sha256. [Cause and check](guides#guide=storage-lifecycle&section=q128-ledger-captured-file-hash)
diagnostics.probe_0_0: The capture observer may have stopped before reporting a condition. Check the saved facts and that the archive can be read. [Cause and check](guides#guide=storage-lifecycle&section=q128-ledger-capture-observer)
diagnostics.checkpoint_archive: checkpoint.tar may contain unexpected entries or orders.tsv and summary.json from different generations. Check the regular entries, recorded marker, generation, routes and the sum of order units. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-coherent-recovery-point)
diagnostics.checkpoint_identity: A retained Deployment or PVC may be missing or recreated, or a worker image may have changed. Compare live identities and images with the saved checkpoint record. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-retained-objects)
diagnostics.pvc_uid: The ledger claim may be missing or have been recreated. Compare the live ledger PVC UID with original-pvc-uid. [Cause and check](guides#guide=storage-lifecycle&section=q128-ledger-retained-pvc)
diagnostics.probe_1_0: The retained archive observer may have stopped before reporting a condition. Check that ledger.tar and the supplied checksum are readable during recovery. [Cause and check](guides#guide=storage-lifecycle&section=q128-ledger-retained-archive-observer)
diagnostics.file_hash: The restored /data/ledger.txt may be unreadable or contain different bytes. Compare the hash inside the ledger Pod with original-ledger.sha256. [Cause and check](guides#guide=storage-lifecycle&section=q128-ledger-current-file-hash)
diagnostics.http_hash: The client may be unable to read the HTTP file or may receive different bytes. Compare the response for ledger.txt with original-ledger.sha256. [Cause and check](guides#guide=storage-lifecycle&section=q128-ledger-served-file-hash)
diagnostics.checkpoint_consumers: A checkpoint workload or client may lack exactly one current ready Pod with the original image. Check live ownership, readiness and desired replicas. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-current-readers)
diagnostics.checkpoint_quiescence: journal-writer may still have a desired replica or a current Pod. Verify that it remains at zero during recovery so it cannot overwrite restored files. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-writer-quiet)
diagnostics.checkpoint_source: A restored path may resolve to the wrong claim or be unavailable in the current Pod. Compare the covering mount in the template and live Pod with the claim required for each path. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-claim-mounts)
diagnostics.checkpoint_file: A restored file may contain bytes from a different recovery point. Compare the live hashes of orders.tsv and summary.json with those of the respective checkpoint.tar entries. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-file-bytes)
diagnostics.checkpoint_http: A serving workload may serve different bytes from the archive. Fetch orders.tsv and summary.json from the live client and compare each response hash with its checkpoint.tar entry. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-served-file-bytes)
diagnostics.probe_1_2: The recovery observer may have stopped before reporting a condition. Check the saved identities, current workloads and the readable recovery archive. [Cause and check](guides#guide=storage-lifecycle&section=q128-checkpoint-restore-observer)
