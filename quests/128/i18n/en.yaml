title: Application backup and restore
brief: |-
  The application needs a consistent recovery point across its order and summary stores, followed by a usable recovery.

  Work on the workstation in `~/quest` with the supplied files:
  - `checkpoint-contract.json`.

  **Requirements:**

  - Stage 1:
    - `ledger.tar` in `~/quest` on the workstation contains exactly `ledger.txt`, preserving the original ledger bytes. A second archive, `checkpoint.tar` in `~/quest` on the workstation, contains exactly the regular files `orders.tsv` and `summary.json`: one matching generation and marker, positive units, all declared routes and the matching total specified by `checkpoint-contract.json`. Preserve the original claims, Deployments and provided worker images.
    - PVC `ledger` keeps its original nonempty UID.
  - Stage 2:
    - `ledger.tar` in `~/quest` on the workstation contains exactly `ledger.txt`, preserving the original ledger bytes.
    - PVC `ledger` keeps its original nonempty UID.
    - Both `/data/ledger.txt` inside Deployment `ledger` and the bytes received by Deployment `client` at `http://ledger:8080/ledger.txt` match the original ledger bytes. The two current data files and both responses fetched by the existing requester match `checkpoint.tar`; current ready readers mount their original claims, and ingestion remains paused as specified by `checkpoint-contract.json`. Preserve the original claims, Deployments and provided worker images.

  This is a bounded synthetic workload, not a live database backup. Checks observe archive consistency and current state; they do not prove capture or restoration history.
debrief: The checks compared the original ledger archive, a consistent cross-store checkpoint, retained object identities,
  current mounts, restored files and both HTTP views.
stages.0.brief: Capture a consistent recovery point while retaining existing storage and workload identities.
stages.1.brief: Recover both data stores and their current application views from that recovery point.
hints.0.text: Separate successful copies can describe different transactions. A recovery point must remain consistent
  across the stores, and recovery must reach the current application consumers.
hints.1.text: |-
  Compare the writer protocol, both live stores, application mounts and supplied result contract. These are observations of existing state:

  ```sh
  cat checkpoint-contract.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- cat /data/writer-phase /data/orders.tsv
  kubectl exec deployment/summary -- cat /data/summary.json
  ```
hints.2.text: |-
  Stage 1. Confirm the ledger hash and that the two checkpoint files describe the same transaction. Both files must carry the contract marker and the same positive generation. Check the exact route set and compare the sum of units in orders.tsv with total in summary.json.

  ```sh
  (
  set -euo pipefail
  archive_member() {
    local archive=$1 expected=$2 stored
    stored=$(tar tf "$archive" | awk -v expected="$expected" '
      { name=$0; while (sub(/^\.\//, "", name)) {} if (name==expected) print $0 }')
    test -n "$stored" || return 1
    tar xOf "$archive" -- "$stored"
  }
  jq '{marker, routes}' checkpoint-contract.json
  tar tf ledger.tar
  archive_member ledger.tar ledger.txt | sha256sum
  cat original-ledger.sha256
  tar tf checkpoint.tar
  archive_member checkpoint.tar orders.tsv
  archive_member checkpoint.tar summary.json
  )
  ```

  Stage 2. Confirm the live claim identities, file hashes and HTTP bytes from the restored readers while ingestion is paused. Match each file and HTTP checksum with its corresponding archive member. The writer has zero replicas and no Pods.

  ```sh
  (
  set -euo pipefail
  archive_member() {
    local archive=$1 expected=$2 stored
    stored=$(tar tf "$archive" | awk -v expected="$expected" '
      { name=$0; while (sub(/^\.\//, "", name)) {} if (name==expected) print $0 }')
    test -n "$stored" || return 1
    tar xOf "$archive" -- "$stored"
  }
  jq '.claims' checkpoint-identities.json
  kubectl get deployment journal-writer -o jsonpath='{.spec.replicas}{"\n"}'
  kubectl get pods -l app=journal-writer -o name
  archive_member checkpoint.tar orders.tsv | sha256sum
  archive_member checkpoint.tar summary.json | sha256sum
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt /data/orders.tsv
  kubectl exec deployment/summary -- sha256sum /data/summary.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv | sha256sum
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json | sha256sum
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
  )
  ```
phrases.0: I compared the archive checksum.
phrases.1: I checked the live file and PVC UID.
phrases.2: I compared the HTTP response checksum.
questions.0.points.0: It proves byte integrity against a reference, not full application recovery.
questions.0.points.1: Test restored data through the application too.
questions.0.prompt: Does a checksum prove a backup can restore the service?
questions.1.points.0: Transactions, WAL and related files may change during copying.
questions.1.points.1: Use database-aware snapshots or backup APIs.
questions.1.prompt: Why can copying a live database file be inconsistent?
