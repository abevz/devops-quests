title: Application backup and restore
brief: Work in `~/quest` with supplied `claim.json`, `ledger.json`, `service.json`, `client.json`, `original-ledger.sha256`
  and `original-pvc-uid`. This offline exercise uses one synthetic, quiescent file, not a live database backup. Create `ledger.tar`
  containing exactly `ledger.txt`; its extracted SHA-256 must match `original-ledger.sha256`, and the `ledger` PVC UID must
  match `original-pvc-uid`. In stage two, restore the file and verify that `/data/ledger.txt` in deployment `ledger` and the
  bytes served by `http://ledger:8080/ledger.txt` have that checksum. The checks observe current bytes and PVC identity; they
  do not prove how the file was restored or that the response came from the PVC.
debrief: The checks compared the archive, live file, HTTP response and PVC identity.
stages.0.brief: The archive contains exactly `ledger.txt` with the original checksum, and the PVC UID is unchanged.
stages.0.objectives.0.text: The archive contains exactly `ledger.txt` with the original checksum, and the PVC UID is unchanged.
stages.1.brief: The archive, live file and HTTP response have the original checksum, and the PVC UID is unchanged.
stages.1.objectives.0.text: The archive, live file and HTTP response have the original checksum, and the PVC UID is unchanged.
hints.0.text: A successful archive command does not by itself prove recoverable bytes.
hints.1.text: Verify the exact archive entry and frozen original checksum.
hints.2.text: Stream the verified file back into the existing volume and test the served content.
phrases.0: I compared the archive checksum.
phrases.1: I checked the live file and PVC UID.
phrases.2: I compared the HTTP response checksum.
questions.0.points.0: It proves byte integrity against a reference, not full application recovery.
questions.0.points.1: Test restored data through the application too.
questions.0.prompt: Does a checksum prove a backup can restore the service?
questions.1.points.0: Transactions, WAL and related files may change during copying.
questions.1.points.1: Use database-aware snapshots or backup APIs.
questions.1.prompt: Why can copying a live database file be inconsistent?
diagnostics.entries: ledger.tar must contain exactly ledger.txt.
diagnostics.archive_hash: ledger.tar ledger.txt SHA-256 must equal original-ledger.sha256.
diagnostics.pvc_uid: PVC/ledger UID must equal original-pvc-uid.
diagnostics.file_hash: /data/ledger.txt SHA-256 must equal original-ledger.sha256.
diagnostics.http_hash: http://ledger:8080/ledger.txt SHA-256 must equal original-ledger.sha256.
