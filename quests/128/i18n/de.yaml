title: Application Sicherung und Wiederherstellung
brief: |-
  Die Anwendung benötigt einen konsistenten Wiederherstellungspunkt für Aufträge und Zusammenfassung und anschließend eine nutzbare Wiederherstellung.

  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `checkpoint-contract.json`.

  **Anforderungen:**

  - Stufe 1:
    - `ledger.tar` in `~/quest` auf der Workstation enthält genau `ledger.txt` und bewahrt die ursprünglichen Ledger-Bytes. Ein zweites Archiv `checkpoint.tar` in `~/quest` auf der Workstation enthält genau die regulären Dateien `orders.tsv` und `summary.json`: gleiche Generation und Markierung, positive Mengen, alle vorgegebenen Routen und die passende Summe gemäß `checkpoint-contract.json`. Erhalte die ursprünglichen PVCs, Deployments und bereitgestellten Worker-Images.
    - PVC `ledger` behält seine ursprüngliche nichtleere UID.
  - Stufe 2:
    - `ledger.tar` in `~/quest` auf der Workstation enthält genau `ledger.txt` und bewahrt die ursprünglichen Ledger-Bytes.
    - PVC `ledger` behält seine ursprüngliche nichtleere UID.
    - Sowohl `/data/ledger.txt` in Deployment `ledger` als auch die von Deployment `client` unter `http://ledger:8080/ledger.txt` empfangenen Bytes entsprechen den ursprünglichen Ledger-Bytes. Beide aktuellen Datendateien und beide vom vorhandenen Client abgerufenen Antworten entsprechen `checkpoint.tar`; aktuelle bereite Leser mounten ihre ursprünglichen PVCs, und die Datenaufnahme bleibt gemäß `checkpoint-contract.json` pausiert. Erhalte die ursprünglichen PVCs, Deployments und bereitgestellten Worker-Images.

  Dies ist eine begrenzte synthetische Last, kein Backup einer laufenden Datenbank. Prüfungen beobachten Archivkonsistenz und aktuellen Zustand, beweisen aber keinen Sicherungs- oder Wiederherstellungsverlauf.
debrief: Die Prüfungen verglichen Ledger-Archiv, konsistenten speicherübergreifenden Checkpoint, erhaltene Objektidentitäten,
  aktuelle Mounts, wiederhergestellte Dateien und beide HTTP-Ansichten.
stages.0.brief: Erstelle einen konsistenten Wiederherstellungspunkt unter Erhalt der ursprünglichen Speicher- und
  Workload-Identitäten.
stages.1.brief: Stelle beide Datenspeicher und ihre aktuellen Anwendungsansichten aus diesem Punkt wieder her.
hints.0.text: Einzeln erfolgreiche Kopien können verschiedene Transaktionen beschreiben. Ein Wiederherstellungspunkt
  muss über beide Speicher konsistent sein und die aktuellen Anwendungsverbraucher erreichen.
hints.1.text: |-
  Vergleiche Schreibprotokoll, beide aktuellen Speicher, Anwendungsmounts und Ergebnisvertrag. Die folgenden Beobachtungen betreffen vorhandenen Zustand:

  ```sh
  cat checkpoint-contract.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- cat /data/writer-phase /data/orders.tsv
  kubectl exec deployment/summary -- cat /data/summary.json
  ```
hints.2.text: |-
  Prüfe Archiveinträge und Transaktionskonsistenz, danach wiederhergestellte Dateien, aktuelle PVC-Identitäten und beide Anwendungsantworten. Bei der Wiederherstellung bleibt die Datenaufnahme pausiert:

  ```sh
  tar tf ledger.tar
  tar xOf ledger.tar ledger.txt | sha256sum
  cat original-ledger.sha256
  tar tf checkpoint.tar
  tar xOf checkpoint.tar orders.tsv
  tar xOf checkpoint.tar summary.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt /data/orders.tsv
  kubectl exec deployment/summary -- sha256sum /data/summary.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json
  ```
phrases.0: Ich verglich die Archiv-Prüfsumme.
phrases.1: Ich prüfte die laufende Datei und PVC-UID.
phrases.2: Ich verglich die Prüfsumme der HTTP-Antwort.
questions.0.points.0: Es beweist die Byte-Integrität anhand einer Referenz und nicht die vollständige Wiederherstellung
  der Anwendung.
questions.0.points.1: Testen Sie wiederhergestellte Daten auch über die Anwendung.
questions.0.prompt: Beweist ein checksum, dass ein Backup den Dienst wiederherstellen kann?
questions.1.points.0: Transaktionen, WAL und zugehörige Dateien können sich während des Kopierens ändern.
questions.1.points.1: Verwenden Sie das datenbankfähige snapshots oder backup APIs.
questions.1.prompt: Warum kann das Kopieren einer Live-Datenbankdatei inkonsistent sein?
