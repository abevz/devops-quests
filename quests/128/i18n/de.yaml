diagnostics.entries: Das Archiv ist möglicherweise nicht lesbar oder enthält andere Einträge. Prüfe, ob ledger.tar genau eine gewöhnliche, nicht dünn besetzte Datei ledger.txt enthält. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-ledger-single-archive-entry)
diagnostics.archive_hash: Die archivierten Bytes von ledger.txt weichen möglicherweise ab. Berechne den Hash des extrahierten Datenstroms und vergleiche ihn mit original-ledger.sha256. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-ledger-captured-file-hash)
diagnostics.probe_0_0: Die Prüfung der Sicherung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe die gespeicherten Daten und ob das Archiv lesbar ist. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-ledger-capture-observer)
diagnostics.checkpoint_archive: checkpoint.tar enthält möglicherweise unerwartete Einträge oder orders.tsv und summary.json aus verschiedenen Generationen. Prüfe gewöhnliche Einträge, gespeicherten Marker, Generation, Routen und Summe der Bestelleinheiten. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-coherent-recovery-point)
diagnostics.checkpoint_identity: Ein erhaltenes Deployment oder PVC fehlt möglicherweise, wurde neu erstellt oder ein worker-Image hat sich geändert. Vergleiche aktuelle Identitäten und Images mit den Daten des Checkpoints. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-retained-objects)
diagnostics.pvc_uid: Der ledger-PVC fehlt möglicherweise oder wurde neu erstellt. Vergleiche seine aktuelle UID mit original-pvc-uid. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-ledger-retained-pvc)
diagnostics.probe_1_0: Die Prüfung des erhaltenen Archivs wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe, ob ledger.tar und die bereitgestellte Prüfsumme während der Wiederherstellung lesbar sind. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-ledger-retained-archive-observer)
diagnostics.file_hash: Die wiederhergestellte Datei /data/ledger.txt ist möglicherweise nicht lesbar oder enthält andere Bytes. Vergleiche den Hash im ledger-Pod mit original-ledger.sha256. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-ledger-current-file-hash)
diagnostics.http_hash: Der Client kann die Datei möglicherweise nicht per HTTP lesen oder erhält andere Bytes. Vergleiche den Antwort-Hash für ledger.txt mit original-ledger.sha256. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-ledger-served-file-hash)
diagnostics.checkpoint_consumers: Ein Checkpoint-Leser oder client hat möglicherweise nicht genau einen aktuellen bereiten Pod mit dem ursprünglichen Image. Prüfe Eigentümer, Bereitschaft und Soll-Replikate. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-current-readers)
diagnostics.checkpoint_quiescence: journal-writer hat möglicherweise noch ein Soll-Replikat oder einen aktuellen Pod. Prüfe, ob die Zahl während der Wiederherstellung bei null bleibt, damit keine Dateien überschrieben werden. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-writer-quiet)
diagnostics.checkpoint_source: Ein wiederhergestellter Pfad verweist möglicherweise auf den falschen PVC oder ist im aktuellen Pod nicht verfügbar. Vergleiche den Mount für den Pfad in Vorlage und Pod mit dem geforderten PVC. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-claim-mounts)
diagnostics.checkpoint_file: Eine wiederhergestellte Datei enthält möglicherweise Bytes aus einem anderen Wiederherstellungspunkt. Vergleiche die aktuellen Hashes von orders.tsv und summary.json mit den jeweiligen Einträgen in checkpoint.tar. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-file-bytes)
diagnostics.checkpoint_http: Ein Leser liefert möglicherweise andere Bytes als das Archiv. Rufe orders.tsv und summary.json aus dem aktuellen client ab und vergleiche jeden Antwort-Hash mit dem Eintrag in checkpoint.tar. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-served-file-bytes)
diagnostics.probe_1_2: Die Wiederherstellungsprüfung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe gespeicherte Identitäten, aktuelle Workloads und die Lesbarkeit des Wiederherstellungsarchivs. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q128-checkpoint-restore-observer)
