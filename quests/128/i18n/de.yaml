diagnostics.probe_0_0: Das Checkpoint-Archiv fehlt, ist fehlerhaft oder kombiniert inkonsistente Transaktionsgenerationen,
  Routen oder Summen.
diagnostics.probe_1_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: `ledger.tar` in `~/quest`
  auf der Workstation enthält genau `ledger.txt` und bewahrt die ursprünglichen Ledger-Bytes.'
diagnostics.checkpoint_archive: Das Checkpoint-Archiv fehlt, ist fehlerhaft oder kombiniert inkonsistente Transaktionsgenerationen,
  Routen oder Summen.
diagnostics.checkpoint_identity: Eine ursprüngliche PVC- oder Deployment-Identität oder ein bereitgestelltes Worker-Image
  weicht vom Ausgangszustand ab.
diagnostics.checkpoint_consumers: Ein erforderlicher Verbraucher hat nicht genau einen aktuellen bereiten Pod im
  Besitz seines Deployments.
diagnostics.checkpoint_quiescence: Für den Writer sind noch Replikate gewünscht oder ein aktueller aktiver Pod bleibt;
  die Wiederherstellung muss pausiert bleiben.
diagnostics.checkpoint_source: Ein aktueller Leser oder seine Vorlage nutzt nicht den ursprünglichen PVC für den
  Datenpfad, oder die Beobachtung ist nicht verfügbar.
diagnostics.checkpoint_file: Eine gemountete Datendatei weicht vom geprüften Checkpoint-Eintrag ab.
diagnostics.checkpoint_http: Die beim vorhandenen Client empfangene Antwort weicht vom geprüften Checkpoint-Eintrag
  ab.
