title: Application Sicherung und Wiederherstellung
brief: Arbeite in `~/quest` mit den bereitgestellten Dateien `claim.json`, `ledger.json`, `service.json`, `client.json`, `original-ledger.sha256`
  und `original-pvc-uid`. Diese Offline-Übung verwendet eine einzelne synthetische, ruhende Datei, kein Backup einer laufenden
  Datenbank. Erstelle `ledger.tar` mit genau `ledger.txt`; die SHA-256-Prüfsumme des extrahierten Inhalts muss `original-ledger.sha256`
  entsprechen und die UID des PVC `ledger` muss `original-pvc-uid` entsprechen. Stelle die Datei in Phase zwei wieder her
  und prüfe, dass `/data/ledger.txt` im Deployment `ledger` und die Bytes von `http://ledger:8080/ledger.txt` dieselbe Prüfsumme
  haben. Die Prüfungen beobachten aktuelle Bytes und PVC-Identität; sie beweisen weder den Wiederherstellungsweg noch die
  Herkunft der Antwort aus dem PVC.
debrief: Die Prüfungen verglichen Archiv, laufende Datei, HTTP-Antwort und PVC-Identität.
stages.0.brief: Das Archiv enthält genau `ledger.txt` mit der ursprünglichen Prüfsumme; die PVC-UID ist unverändert.
stages.0.objectives.0.text: Das Archiv enthält genau `ledger.txt` mit der ursprünglichen Prüfsumme; die PVC-UID ist unverändert.
stages.1.brief: Archiv, laufende Datei und HTTP-Antwort haben die ursprüngliche Prüfsumme; die PVC-UID ist unverändert.
stages.1.objectives.0.text: Archiv, laufende Datei und HTTP-Antwort haben die ursprüngliche Prüfsumme; die PVC-UID ist unverändert.
hints.0.text: Ein erfolgreicher Archivierungsbefehl allein beweist nicht, dass wiederherstellbare Bytes vorhanden sind.
hints.1.text: Überprüfen Sie den genauen Archiveintrag und das eingefrorene Original checksum.
hints.2.text: Streamen Sie die verifizierte Datei zurück in das vorhandene Volume und testen Sie den bereitgestellten Inhalt.
phrases.0: Ich verglich die Archiv-Prüfsumme.
phrases.1: Ich prüfte die laufende Datei und PVC-UID.
phrases.2: Ich verglich die Prüfsumme der HTTP-Antwort.
questions.0.points.0: Es beweist die Byte-Integrität anhand einer Referenz und nicht die vollständige Wiederherstellung der
  Anwendung.
questions.0.points.1: Testen Sie wiederhergestellte Daten auch über die Anwendung.
questions.0.prompt: Beweist ein checksum, dass ein Backup den Dienst wiederherstellen kann?
questions.1.points.0: Transaktionen, WAL und zugehörige Dateien können sich während des Kopierens ändern.
questions.1.points.1: Verwenden Sie das datenbankfähige snapshots oder backup APIs.
questions.1.prompt: Warum kann das Kopieren einer Live-Datenbankdatei inkonsistent sein?
diagnostics.entries: ledger.tar muss genau ledger.txt enthalten.
