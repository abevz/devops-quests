title: Application Sicherung und Wiederherstellung
brief: 'Das Hauptbuch ist eine ruhende synthetische Textdatei auf einem PVC. Erstellen Sie zunächst ledger.tar,
  das nur ledger.txt enthält, und überprüfen Sie es anhand der eingefrorenen Quelle checksum. Im nächsten
  Schritt wird die Live-Datei beschädigt. Stellen Sie die ursprünglichen Bytes aus dem verifizierten Archiv
  in demselben PVC wieder her und überprüfen Sie dann checksum und das tatsächliche HTTP. Ersetzen Sie
  das claim nicht und erstellen Sie kein neues leeres Hauptbuch. Dieses Gerät hat kein concurrent writes
  oder keine Datenbank WAL: Eine Live-Datenbank benötigt eine eigene konsistente Sicherungsmethode.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `claim.json`, `ledger.json`, `service.json`,
  `client.json`, `original-ledger.sha256`, `original-pvc-uid`, `ledger.tar`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Das Archiv enthält genau ledger.txt mit dem Original checksum; das gleiche PVC
  bleibt bestehen.'
debrief: Die Wiederherstellung wurde anhand tatsächlicher Anwendungsbytes und des ursprünglichen claim
  getestet, nicht nur anhand der Archivexistenz oder Pod readiness.
stages.0.brief: 'Erfolgskriterium: Das Archiv enthält genau ledger.txt mit dem Original checksum; Es bleibt
  derselbe PVC.'
stages.0.objectives.0.text: Das Archiv enthält genau ledger.txt mit dem Original checksum; Es bleibt das
  gleiche PVC.
stages.1.brief: 'Erfolgskriterien: Dieselben PVC und HTTP endpoint enthalten die ursprünglichen Ledger-Bytes,
  die aus dem überprüften Archiv wiederhergestellt wurden.'
stages.1.objectives.0.text: Dieselben PVC und HTTP endpoint enthalten die ursprünglichen Ledger-Bytes,
  die aus dem überprüften Archiv wiederhergestellt wurden.
hints.0.text: Ein erfolgreicher Archivierungsbefehl allein beweist nicht, dass wiederherstellbare Bytes
  vorhanden sind.
hints.1.text: Überprüfen Sie den genauen Archiveintrag und das eingefrorene Original checksum.
hints.2.text: Streamen Sie die verifizierte Datei zurück in das vorhandene Volume und testen Sie den bereitgestellten
  Inhalt.
phrases.0: Ich habe den Backup-Inhalt vor der Wiederherstellung überprüft.
phrases.1: Ich habe Anwendungsdaten auf dem ursprünglichen claim wiederhergestellt.
phrases.2: Ich habe die Daten über die Live-Anwendung endpoint getestet.
questions.0.points.0: Es beweist die Byte-Integrität anhand einer Referenz und nicht die vollständige
  Wiederherstellung der Anwendung.
questions.0.points.1: Testen Sie wiederhergestellte Daten auch über die Anwendung.
questions.0.prompt: Beweist ein checksum, dass ein Backup den Dienst wiederherstellen kann?
questions.1.points.0: Transaktionen, WAL und zugehörige Dateien können sich während des Kopierens ändern.
questions.1.points.1: Verwenden Sie das datenbankfähige snapshots oder backup APIs.
questions.1.prompt: Warum kann das Kopieren einer Live-Datenbankdatei inkonsistent sein?
