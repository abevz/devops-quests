title: Application Sicherung und Wiederherstellung
brief: |-
  Das Ledger benötigt ein prüfbares Archiv und danach eine nutzbare wiederhergestellte Kopie. Bewahren Sie die ursprüngliche Claim-Identität in beiden Stufen.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `claim.yaml`, `ledger.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stufe 1:
    - `ledger.tar` in `~/quest` auf der Workstation enthält genau `ledger.txt` und bewahrt die ursprünglichen Ledger-Bytes.
    - PVC `ledger` behält seine ursprüngliche nichtleere UID.

  - Stufe 2:
    - `ledger.tar` in `~/quest` auf der Workstation enthält genau `ledger.txt` und bewahrt die ursprünglichen Ledger-Bytes.
    - PVC `ledger` behält seine ursprüngliche nichtleere UID.
    - Sowohl `/data/ledger.txt` in Deployment `ledger` als auch die von Deployment `client` unter `http://ledger:8080/ledger.txt` empfangenen Bytes entsprechen den ursprünglichen Ledger-Bytes.

  Dies nutzt eine synthetische ruhende Datei, kein Live-Datenbankbackup; die Prüfungen beobachten aktuelle Bytes und Claim-Identität, nicht Wiederherstellungsverlauf oder ob die HTTP-Antwort aus dem PVC stammt.
debrief: Die Prüfungen verglichen Archiv, laufende Datei, HTTP-Antwort und PVC-Identität.
stages.0.brief: Ein vollständiges Archiv muss den ursprünglichen Ledger-Bytes entsprechen.
stages.1.brief: Wiederhergestellte Datei und ausgelieferte Bytes müssen dem ursprünglichen Ledger entsprechen.
hints.0.text: Ein erfolgreicher Archivierungsbefehl allein beweist nicht, dass wiederherstellbare Bytes
  vorhanden sind.
hints.1.text: |-
  Überprüfen Sie den genauen Archiveintrag und das eingefrorene Original checksum.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl describe pvc
  kubectl describe deployment ledger
  ```
hints.2.text: |-
  Streamen Sie die verifizierte Datei zurück in das vorhandene Volume und testen Sie den bereitgestellten Inhalt.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - Das Archiv listet nur `ledger.txt`, dessen Bytes die ursprüngliche Prüfsumme haben.

    ```sh
    tar tf ledger.tar
    tar xOf ledger.tar ledger.txt | sha256sum
    cat original-ledger.sha256
    ```

  - Einstellungen, Identitäten und Status entsprechen den Anforderungen.

    ```sh
    kubectl get pvc ledger -o yaml
    cat original-pvc-uid
    ```

  - In Stufe zwei entsprechen die Prüfsummen der aktuellen Datei und empfangenen Bytes dem Original.

    ```sh
    kubectl exec deployment/ledger -- sha256sum /data/ledger.txt
    kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
    cat original-ledger.sha256
    ```
phrases.0: Ich verglich die Archiv-Prüfsumme.
phrases.1: Ich prüfte die laufende Datei und PVC-UID.
phrases.2: Ich verglich die Prüfsumme der HTTP-Antwort.
questions.0.points.0: Es beweist die Byte-Integrität anhand einer Referenz und nicht die vollständige
  Wiederherstellung der Anwendung.
questions.0.points.1: Testen Sie wiederhergestellte Daten auch über die Anwendung.
questions.0.prompt: Beweist ein checksum, dass ein Backup den Dienst wiederherstellen kann?
questions.1.points.0: Transaktionen, WAL und zugehörige Dateien können sich während des Kopierens ändern.
questions.1.points.1: Verwenden Sie das datenbankfähige snapshots oder backup APIs.
questions.1.prompt: Warum kann das Kopieren einer Live-Datenbankdatei inkonsistent sein?
