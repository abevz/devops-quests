title: Application Sicherung und Wiederherstellung
brief: "Das Ledger benötigt ein prüfbares Archiv und danach eine nutzbare wiederhergestellte Kopie. Bewahren Sie\
  \ die ursprüngliche Claim-Identität in beiden Stufen.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte\
  \ Dateien: `claim.json`, `ledger.json`, `service.json`, `client.json`, `original-ledger.sha256`, `original-pvc-uid`.\n\
  \n**Requirements:**\n\n- Stufe 1:\n  - `ledger.tar` in `~/quest` auf der Workstation enthält genau `ledger.txt`,\
  \ dessen extrahierte Bytes `original-ledger.sha256` entsprechen.\n  - PVC `ledger` behält seine ursprüngliche\
  \ nichtleere UID.\n- Stufe 2:\n  - `ledger.tar` in `~/quest` auf der Workstation enthält genau `ledger.txt`, dessen\
  \ extrahierte Bytes `original-ledger.sha256` entsprechen.\n  - PVC `ledger` behält seine ursprüngliche nichtleere\
  \ UID.\n  - Sowohl `/data/ledger.txt` in Deployment `ledger` als auch die von Deployment `client` unter `http://ledger:8080/ledger.txt`\
  \ empfangenen Bytes entsprechen `original-ledger.sha256`.\n\n**Verify yourself before Check & finish:** Führen\
  \ Sie diese Beobachtungsbefehle aus `~/quest` auf der Workstation aus.\n\n- Das Archiv listet nur `ledger.txt`,\
  \ dessen Bytes die ursprüngliche Prüfsumme haben.\n\n  ```sh\n  tar tf ledger.tar\n  tar xOf ledger.tar ledger.txt\
  \ | sha256sum\n  cat original-ledger.sha256\n  ```\n\n- Einstellungen, Identitäten und Status entsprechen den\
  \ Anforderungen.\n\n  ```sh\n  kubectl get pvc ledger -o yaml\n  cat original-pvc-uid\n  ```\n\n- In Stufe zwei\
  \ entsprechen die Prüfsummen der aktuellen Datei und empfangenen Bytes dem Original.\n\n  ```sh\n  kubectl exec\
  \ deployment/ledger -- sha256sum /data/ledger.txt\n  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt\
  \ | sha256sum\n  cat original-ledger.sha256\n  ```\n\nDies nutzt eine synthetische ruhende Datei, kein Live-Datenbankbackup;\
  \ die Prüfungen beobachten aktuelle Bytes und Claim-Identität, nicht Wiederherstellungsverlauf oder ob die HTTP-Antwort\
  \ aus dem PVC stammt."
debrief: Die Prüfungen verglichen Archiv, laufende Datei, HTTP-Antwort und PVC-Identität.
stages.0.brief: Ein vollständiges Archiv muss den ursprünglichen Ledger-Bytes entsprechen.
stages.1.brief: Wiederhergestellte Datei und ausgelieferte Bytes müssen dem ursprünglichen Ledger entsprechen.
hints.0.text: Ein erfolgreicher Archivierungsbefehl allein beweist nicht, dass wiederherstellbare Bytes vorhanden
  sind.
hints.1.text: Überprüfen Sie den genauen Archiveintrag und das eingefrorene Original checksum.
hints.2.text: Streamen Sie die verifizierte Datei zurück in das vorhandene Volume und testen Sie den bereitgestellten
  Inhalt.
phrases.0: Ich verglich die Archiv-Prüfsumme.
phrases.1: Ich prüfte die laufende Datei und PVC-UID.
phrases.2: Ich verglich die Prüfsumme der HTTP-Antwort.
questions.0.points.0: Es beweist die Byte-Integrität anhand einer Referenz und nicht die vollständige Wiederherstellung
  der Anwendung.
questions.0.points.1: Testen Sie wiederhergestellte Daten auch über die Anwendung.
questions.0.prompt: Beweist ein checksum, dass ein Backup den Dienst wiederherstellen kann?
questions.1.points.0: Transaktionen, WAL und zugehörige Dateien können sich während des Kopierens ändern.
questions.1.points.1: Verwenden Sie das datenbankfähige snapshots oder backup APIs.
questions.1.prompt: Warum kann das Kopieren einer Live-Datenbankdatei inkonsistent sein?
