diagnostics.entries: Архив может не читаться или содержать другие записи. Убедитесь, что в ledger.tar ровно один обычный неразреженный файл ledger.txt. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-ledger-single-archive-entry)
diagnostics.archive_hash: Байты ledger.txt в архиве могли измениться. Вычислите хеш потока из архива и сравните с original-ledger.sha256. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-ledger-captured-file-hash)
diagnostics.probe_0_0: Проверка снимка могла остановиться до вывода конкретного условия. Убедитесь, что исходные данные и архив доступны для чтения. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-ledger-capture-observer)
diagnostics.checkpoint_archive: В checkpoint.tar могут быть лишние записи или orders.tsv и summary.json из разных поколений. Проверьте тип файлов, записанный маркер, поколение, маршруты и сумму единиц заказов. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-coherent-recovery-point)
diagnostics.checkpoint_identity: Сохранённые Deployment или PVC могли исчезнуть либо быть пересозданы, а образ worker мог измениться. Сравните текущие UID и образы с исходными данными контрольной точки. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-retained-objects)
diagnostics.pvc_uid: PVC ledger мог исчезнуть или быть пересоздан. Сравните текущий UID PVC ledger с original-pvc-uid. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-ledger-retained-pvc)
diagnostics.probe_1_0: Проверка сохранённого архива могла остановиться до вывода конкретного условия. Убедитесь, что ledger.tar и выданная контрольная сумма читаются на фазе восстановления. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-ledger-retained-archive-observer)
diagnostics.file_hash: Восстановленный /data/ledger.txt может не читаться или содержать другие байты. Сравните хеш внутри Pod ledger с original-ledger.sha256. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-ledger-current-file-hash)
diagnostics.http_hash: Клиент может не получить файл по HTTP или получить другие байты. Сравните хеш ответа для ledger.txt с original-ledger.sha256. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-ledger-served-file-hash)
diagnostics.checkpoint_consumers: У читателя контрольной точки или client может не быть ровно одного текущего готового Pod с исходным образом. Проверьте владельца, готовность и желаемое число реплик. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-current-readers)
diagnostics.checkpoint_quiescence: У journal-writer может оставаться заданная реплика или текущий Pod. Убедитесь, что на фазе восстановления реплик ноль и writer не перезаписывает файлы. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-writer-quiet)
diagnostics.checkpoint_source: Восстановленный путь может относиться к другому PVC или быть недоступным в текущем Pod. Сравните покрывающий путь mount в шаблоне и текущем Pod с требуемым PVC. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-claim-mounts)
diagnostics.checkpoint_file: Восстановленный файл может содержать байты из другой контрольной точки. Сравните хеши текущих orders.tsv и summary.json с хешами соответствующих записей в checkpoint.tar. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-restored-file-bytes)
diagnostics.checkpoint_http: Читатель может отдавать другие байты, чем в архиве. Запросите orders.tsv и summary.json из текущего client и сравните хеш каждого ответа с записью в checkpoint.tar. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-served-file-bytes)
diagnostics.probe_1_2: Проверка восстановления могла остановиться до вывода конкретного условия. Проверьте сохранённые идентификаторы, текущие нагрузки и доступность архива восстановления. [Причина и проверка](guides#guide=storage-lifecycle&section=q128-checkpoint-restore-observer)
