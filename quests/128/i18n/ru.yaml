title: Бэкап и восстановление приложения
brief: "Журналу нужны проверяемый архив и затем работоспособная восстановленная копия. Сохраняйте исходную идентичность\
  \ PVC на обоих этапах.\n\nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы: `claim.json`, `ledger.json`,\
  \ `service.json`, `client.json`, `original-ledger.sha256`, `original-pvc-uid`.\n\n**Requirements:**\n\n- Этап\
  \ 1:\n  - `ledger.tar` в `~/quest` на рабочей станции содержит ровно `ledger.txt`, чьи извлечённые байты соответствуют\
  \ `original-ledger.sha256`.\n  - PVC `ledger` сохраняет исходный непустой UID.\n- Этап 2:\n  - `ledger.tar` в\
  \ `~/quest` на рабочей станции содержит ровно `ledger.txt`, чьи извлечённые байты соответствуют `original-ledger.sha256`.\n\
  \  - PVC `ledger` сохраняет исходный непустой UID.\n  - И `/data/ledger.txt` внутри Deployment `ledger`, и байты,\
  \ полученные Deployment `client` по `http://ledger:8080/ledger.txt`, соответствуют `original-ledger.sha256`.\n\
  \n**Verify yourself before Check & finish:** Выполните эти команды наблюдения из `~/quest` на рабочей станции.\n\
  \n- Архив перечисляет только `ledger.txt`, чьи байты имеют исходную контрольную сумму.\n\n  ```sh\n  tar tf ledger.tar\n\
  \  tar xOf ledger.tar ledger.txt | sha256sum\n  cat original-ledger.sha256\n  ```\n\n- Настройки, идентичности\
  \ и состояние соответствуют требованиям.\n\n  ```sh\n  kubectl get pvc ledger -o yaml\n  cat original-pvc-uid\n\
  \  ```\n\n- На втором этапе контрольные суммы живого файла и полученных байтов соответствуют исходной.\n\n  ```sh\n\
  \  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt\n  kubectl exec deployment/client -- wget -qO-\
  \ -T 3 http://ledger:8080/ledger.txt | sha256sum\n  cat original-ledger.sha256\n  ```\n\nЗдесь используется один\
  \ синтетический неизменяемый во время копирования файл, а не резервная копия живой БД; проверки наблюдают текущие\
  \ байты и идентичность PVC, а не историю восстановления или происхождение HTTP-ответа из PVC."
debrief: Проверки сравнили архив, текущий файл, HTTP-ответ и идентичность PVC.
stages.0.brief: Полный архив должен соответствовать исходным байтам журнала.
stages.1.brief: Восстановленный файл и отдаваемые байты должны соответствовать исходному журналу.
hints.0.text: Успешная команда архивации сама не доказывает восстанавливаемые байты.
hints.1.text: Проверьте точное имя в архиве и исходный сохранённый checksum.
hints.2.text: Верните проверенный файл потоком на существующий том и проверьте отдаваемое содержимое.
phrases.0: Я сравнил сумму архива.
phrases.1: Я проверил текущий файл и UID PVC.
phrases.2: Я сравнил хеш HTTP-ответа.
questions.0.points.0: Он доказывает целостность байтов относительно эталона, а не полное восстановление приложения.
questions.0.points.1: Проверьте восстановленные данные и через приложение.
questions.0.prompt: Доказывает ли checksum возможность восстановить сервис?
questions.1.points.0: Транзакции, WAL и связанные файлы могут меняться при копировании.
questions.1.points.1: Применяйте согласованные с БД snapshots или backup APIs.
questions.1.prompt: Почему копия файла живой БД может быть несогласованной?
