title: Бэкап и восстановление приложения
brief: 'Журнал — учебный текстовый файл без параллельных записей на PVC. Сначала создайте ledger.tar только
  с ledger.txt и проверьте по сохранённому исходному checksum. Следующий этап повредит рабочий файл: восстановите
  исходные байты из проверенного архива на том же PVC, затем проверьте checksum и настоящий HTTP. Не заменяйте
  claim и не создавайте новый пустой журнал. В фикстуре нет concurrent writes и WAL базы: живой БД нужен
  собственный согласованный способ бэкапа.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `claim.json`, `ledger.json`, `service.json`,
  `client.json`, `original-ledger.sha256`, `original-pvc-uid`, `ledger.tar`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Архив содержит только ledger.txt с исходным checksum; PVC прежний.'
debrief: Восстановление проверено по реальным байтам приложения и исходному claim, а не только наличию
  архива или readiness Pod.
