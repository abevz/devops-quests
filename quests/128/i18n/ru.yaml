title: Бэкап и восстановление приложения
brief: |-
  Приложению нужна согласованная точка восстановления данных заказов и итогов, а затем работающее восстановление обоих хранилищ.

  Работайте на рабочей станции в `~/quest` с предоставленными файлами:
  - `checkpoint-contract.json`.

  **Требования:**

  - Этап 1:
    - `ledger.tar` в `~/quest` на workstation содержит только `ledger.txt` и сохраняет исходные байты ledger. Второй архив `checkpoint.tar` в `~/quest` на рабочей станции содержит ровно обычные файлы `orders.tsv` и `summary.json`: одинаковые поколение и маркер, положительные количества, все объявленные маршруты и соответствующий итог по `checkpoint-contract.json`. Сохраните исходные PVC, Deployment и предоставленные образы рабочих контейнеров.
    - PVC `ledger` сохраняет исходный непустой UID.
  - Этап 2:
    - `ledger.tar` в `~/quest` на workstation содержит только `ledger.txt` и сохраняет исходные байты ledger.
    - PVC `ledger` сохраняет исходный непустой UID.
    - И `/data/ledger.txt` внутри Deployment `ledger`, и байты, полученные Deployment `client` по `http://ledger:8080/ledger.txt`, совпадают с исходными байтами ledger. Два текущих файла данных и оба ответа, полученные существующим клиентом, совпадают с `checkpoint.tar`; готовые текущие читатели монтируют исходные PVC, а приём данных остаётся приостановленным согласно `checkpoint-contract.json`. Сохраните исходные PVC, Deployment и предоставленные образы рабочих контейнеров.

  Это ограниченная синтетическая нагрузка, а не резервная копия работающей БД. Проверки наблюдают согласованность архива и текущее состояние, но не доказывают историю создания копии или восстановления.
debrief: Проверки сравнили исходный архив реестра, согласованный checkpoint двух хранилищ, идентичность объектов,
  текущие монтирования, восстановленные файлы и обе HTTP-выдачи.
stages.0.brief: Получите согласованную точку восстановления, сохранив исходные PVC и объекты нагрузок.
stages.1.brief: Восстановите оба хранилища и их текущую выдачу приложением из этой точки.
hints.0.text: Отдельные успешные копии могут относиться к разным транзакциям. Точка восстановления должна быть согласована
  между хранилищами, а восстановленные данные должны дойти до текущих потребителей приложения.
hints.1.text: |-
  Сопоставьте протокол записи, оба текущих хранилища, монтирования приложения и контракт результата. Ниже наблюдения существующего состояния:

  ```sh
  cat checkpoint-contract.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- cat /data/writer-phase /data/orders.tsv
  kubectl exec deployment/summary -- cat /data/summary.json
  ```
hints.2.text: |-
  Этап 1. Подтвердите контрольную сумму ledger и принадлежность двух файлов снимка одной транзакции. В обоих файлах должны совпасть маркер из контракта и один положительный номер поколения. Сверьте набор маршрутов с контрактом и сравните сумму units в orders.tsv с total в summary.json.

  ```sh
  (
  set -euo pipefail
  archive_member() {
    local archive=$1 expected=$2 stored
    stored=$(tar tf "$archive" | awk -v expected="$expected" '
      { name=$0; while (sub(/^\.\//, "", name)) {} if (name==expected) print $0 }')
    test -n "$stored" || return 1
    tar xOf "$archive" -- "$stored"
  }
  jq '{marker, routes}' checkpoint-contract.json
  tar tf ledger.tar
  archive_member ledger.tar ledger.txt | sha256sum
  cat original-ledger.sha256
  tar tf checkpoint.tar
  archive_member checkpoint.tar orders.tsv
  archive_member checkpoint.tar summary.json
  )
  ```

  Этап 2. При остановленном приёме данных проверьте UID claim, контрольные суммы файлов и HTTP-данные восстановленных потребителей. Сверьте контрольные суммы каждого файла и HTTP-ответа с соответствующим элементом архива. У writer ноль реплик и нет Pod.

  ```sh
  (
  set -euo pipefail
  archive_member() {
    local archive=$1 expected=$2 stored
    stored=$(tar tf "$archive" | awk -v expected="$expected" '
      { name=$0; while (sub(/^\.\//, "", name)) {} if (name==expected) print $0 }')
    test -n "$stored" || return 1
    tar xOf "$archive" -- "$stored"
  }
  jq '.claims' checkpoint-identities.json
  kubectl get deployment journal-writer -o jsonpath='{.spec.replicas}{"\n"}'
  kubectl get pods -l app=journal-writer -o name
  archive_member checkpoint.tar orders.tsv | sha256sum
  archive_member checkpoint.tar summary.json | sha256sum
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt /data/orders.tsv
  kubectl exec deployment/summary -- sha256sum /data/summary.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv | sha256sum
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json | sha256sum
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
  )
  ```
phrases.0: Я сравнил сумму архива.
phrases.1: Я проверил текущий файл и UID PVC.
phrases.2: Я сравнил хеш HTTP-ответа.
questions.0.points.0: Он доказывает целостность байтов относительно эталона, а не полное восстановление приложения.
questions.0.points.1: Проверьте восстановленные данные и через приложение.
questions.0.prompt: Доказывает ли checksum возможность восстановить сервис?
questions.1.points.0: Транзакции, WAL и связанные файлы могут меняться при копировании.
questions.1.points.1: Применяйте согласованные с БД snapshots или backup APIs.
questions.1.prompt: Почему копия файла живой БД может быть несогласованной?
