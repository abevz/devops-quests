title: Бэкап и восстановление приложения
brief: Работайте в `~/quest` с предоставленными `claim.json`, `ledger.json`, `service.json`, `client.json`, `original-ledger.sha256`
  и `original-pvc-uid`. В этом офлайн-упражнении используется один синтетический неизменяемый файл, а не копия работающей
  базы. Создайте `ledger.tar`, содержащий только `ledger.txt`; SHA-256 извлечённого содержимого должен совпадать с `original-ledger.sha256`,
  а UID PVC `ledger` — с `original-pvc-uid`. На втором этапе восстановите файл и проверьте, что `/data/ledger.txt` в deployment
  `ledger` и байты ответа `http://ledger:8080/ledger.txt` имеют ту же сумму. Проверки наблюдают текущие байты и идентичность
  PVC; они не доказывают способ восстановления или происхождение ответа из PVC.
debrief: Проверки сравнили архив, текущий файл, HTTP-ответ и идентичность PVC.
stages.0.brief: Архив содержит только `ledger.txt` с исходной суммой, а UID PVC не изменился.
stages.0.objectives.0.text: Архив содержит только `ledger.txt` с исходной суммой, а UID PVC не изменился.
stages.1.brief: Архив, текущий файл и HTTP-ответ имеют исходную сумму, а UID PVC не изменился.
stages.1.objectives.0.text: Архив, текущий файл и HTTP-ответ имеют исходную сумму, а UID PVC не изменился.
hints.0.text: Успешная команда архивации сама не доказывает восстанавливаемые байты.
hints.1.text: Проверьте точное имя в архиве и исходный сохранённый checksum.
hints.2.text: Верните проверенный файл потоком на существующий том и проверьте отдаваемое содержимое.
phrases.0: Я сравнил сумму архива.
phrases.1: Я проверил текущий файл и UID PVC.
phrases.2: Я сравнил хеш HTTP-ответа.
questions.0.points.0: Он доказывает целостность байтов относительно эталона, а не полное восстановление приложения.
questions.0.points.1: Проверьте восстановленные данные и через приложение.
questions.0.prompt: Доказывает ли checksum возможность восстановить сервис?
questions.1.points.0: Транзакции, WAL и связанные файлы могут меняться при копировании.
questions.1.points.1: Применяйте согласованные с БД snapshots или backup APIs.
questions.1.prompt: Почему копия файла живой БД может быть несогласованной?
