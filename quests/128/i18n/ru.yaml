diagnostics.probe_0_0: Архив checkpoint отсутствует, повреждён или объединяет несогласованные поколения транзакции,
  маршруты либо итоги.
diagnostics.probe_1_0: 'Текущие данные не позволили проверить эту цель: `ledger.tar` в `~/quest` на workstation
  содержит только `ledger.txt` и сохраняет исходные байты ledger.'
diagnostics.checkpoint_archive: Архив checkpoint отсутствует, повреждён или объединяет несогласованные поколения
  транзакции, маршруты либо итоги.
diagnostics.checkpoint_identity: Идентичность исходного PVC или Deployment либо предоставленный образ контейнера
  отличается от начального состояния.
diagnostics.checkpoint_consumers: У нужного потребителя нет ровно одного готового текущего Pod, принадлежащего его
  Deployment.
diagnostics.checkpoint_quiescence: Для процесса записи всё ещё запрошены реплики или остался текущий активный Pod;
  восстановление требует приостановленного приёма данных.
diagnostics.checkpoint_source: Текущий читатель или его шаблон не использует исходный PVC для заданного пути данных
  либо наблюдения недоступны.
diagnostics.checkpoint_file: Смонтированный файл данных отличается от проверенной записи checkpoint.
diagnostics.checkpoint_http: Ответ существующему клиенту отличается от проверенной записи checkpoint.
diagnostics.probe_1_2: Текущий читатель или его шаблон не использует исходный PVC для заданного пути данных либо
