hints.0.text: Успешная команда архивации сама не доказывает восстанавливаемые байты.
hints.1.text: Проверьте точное имя в архиве и исходный сохранённый checksum.
hints.2.text: Верните проверенный файл потоком на существующий том и проверьте отдаваемое содержимое.
phrases.0: Я проверил содержимое бэкапа перед восстановлением.
phrases.1: Я восстановил данные приложения на исходном claim.
phrases.2: Я проверил данные через рабочий endpoint приложения.
questions.0.points.0: Он доказывает целостность байтов относительно эталона, а не полное восстановление
  приложения.
questions.0.points.1: Проверьте восстановленные данные и через приложение.
questions.0.prompt: Доказывает ли checksum возможность восстановить сервис?
questions.1.points.0: Транзакции, WAL и связанные файлы могут меняться при копировании.
questions.1.points.1: Применяйте согласованные с БД snapshots или backup APIs.
