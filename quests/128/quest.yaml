      sys.exit(not (entries and matching))
      DQ_ARCHIVE
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_1_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.1.objectives.1.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      uid=$(cat /run/dq/facts/0/original-pvc-uid 2>/dev/null || true)

      live_uid=$(kubectl get pvc ledger -o jsonpath=''{.metadata.uid}'' 2>/dev/null || true)

      if ! test -n "$uid" || ! test "$live_uid" = "$uid"; then printf ''%s\n'' ''ledger PVC UID = original-pvc-uid:
      ✗ [DQ:pvc_uid]''; failed=1; fi

      exit "$failed"

      '
  - text: stages.1.objectives.2.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      checksum=$(cat /run/dq/facts/0/original-ledger.sha256 2>/dev/null || true)

      if ! file_hash=$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/ledger -- sha256sum /data/ledger.txt
      2>/dev/null | awk ''{print $1}''); then file_hash=; fi

      if ! test -n "$checksum" || ! test "$file_hash" = "$checksum"; then printf ''%s\n'' ''live ledger.txt checksum
      = original-ledger.sha256: ✗ [DQ:file_hash]''; failed=1; fi

      if ! http_hash=$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt
      2>/dev/null | sha256sum | awk ''{print $1}''); then http_hash=; fi

      if ! test -n "$checksum" || ! test "$http_hash" = "$checksum"; then printf ''%s\n'' ''ledger HTTP checksum
      = original-ledger.sha256: ✗ [DQ:http_hash]''; failed=1; fi

      exit "$failed"

      '
