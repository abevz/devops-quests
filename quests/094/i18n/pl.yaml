title: Wydajność
brief: |-
  Workload serwera przekracza próg ograniczonego pomiaru CPU, gdy odbiorcy pozostają aktywni. Przywróć wymaganą odpowiedź i aktualną pracę odbiorców w pierwotnym budżecie serwera.

  Pracuj na stacji w `~/quest` z `performance-contract.json`. Wymagany plik pomiarowy stacji to `~/quest/measure.sh`; sprawdź żywe workloady i dostarczoną politykę odpytywania w namespace.

  **Wymagania:**
  - Zachowaj początkową próbkę co najmniej dziesięciu okresów throttlingu, dokładnie jedną gotową replikę Deploymentu `board`, jego CPU request/limit `50m`, memory request `8Mi` i memory limit `32Mi`.
  - Rzeczywisty pomiar kontenera serwera spełnia kontrakt, a HTTP z Deploymentu `board` do `http://board:8080` zwraca `north-94`.
  - Plik pomiarowy stacji raportuje najwyżej `5` nowych okresów throttlingu w świeżej dwusekundowej próbce. Obaj odbiorcy mają po jednej aktualnej gotowej replice, używają bieżących wejść polityki i nadal zwiększają postęp trasy przez własne Service ClusterIP z selektorami.
  - Zachowaj pierwotne tożsamości workloadów, Service i polityki, wszystkie dostarczone dane polityki i niezmienne obrazy aplikacji.

  Testy obserwują bieżący stan, aktywny postęp odbiorców i ograniczone próbki CFS. Samplery i health probes zużywają kwotę; obserwacje nie dowodzą produkcyjnego SLO opóźnienia ani nieprzerwanej dostępności.
debrief: Usunięcie pracy serwera pozostawiło rzeczywisty popyt odbiorców zużywający kwotę. Aktualna polityka dociera
  teraz do obu aktywnych procesów; obsługa i postęp mieszczą się w pierwotnym budżecie.
stages.0.brief: Świeża próbka stacji spełnia próg; obaj pierwotni odbiorcy używają aktualnego rytmu i nadal zwiększają
  postęp trasy.
stages.0.objectives.0.text: Zapisana próbka początkowa zawiera co najmniej dziesięć okresów throttlingu.
stages.0.objectives.1.text: Deployment `board` zachowuje dokładnie jedną replikę.
stages.0.objectives.2.text: Kontener board zachowuje żądanie i limit CPU `50m`, żądanie pamięci `8Mi` i limit pamięci
  `32Mi`.
stages.0.objectives.3.text: Rzeczywisty pomiar i odpowiedź serwera spełniają kontrakt przy zachowaniu pierwotnych
  zasobów, obrazów i bieżących danych polityki.
stages.0.objectives.4.text: Deployment `board` ma jedną gotową replikę.
stages.0.objectives.5.text: Świeża próbka stacji spełnia próg; obaj pierwotni odbiorcy używają aktualnego rytmu
  i nadal zwiększają postęp trasy.
stages.0.objectives.6.text: HTTP z Deployment `board` do `http://board:8080` zwraca `north-94`.
hints.0.text: Kwotę może wyczerpać praca wewnątrz serwera lub rzeczywisty napływ żądań. Cichy serwer po zatrzymaniu
  wymaganego odbiorcy nie dowodzi całego kontraktu obsługi.
hints.1.text: |-
  Porównaj `performance-contract.json`, aktywne polecenia i zasoby, politykę i skuteczne wejścia odbiorców, `/sys/fs/cgroup/cpu.stat` kontenera worker serwera, zdarzenia, logi i rekordy postępu. Oddziel narzut pomiaru, użyteczne żądania i inną pracę.

  Odszukaj wymagany licznik cgroup i interwał w kontrakcie wydajności. Porównaj obsługę żądań przez działający `worker` z odwołaniem do polityki i postępem każdego konsumenta.
hints.2.text: |-
  Sprawdź `bash measure.sh`, niezależny wynik serwera, rollout i każdy interfejs postępu. Oczekuj najwyżej `5` nowych okresów throttlingu, `north-94`, zachowanych tożsamości i budżetu oraz rosnących rekordów przy bieżącym rytmie polityki.

  Uruchom arkusz i niezależnie zmierz tę samą cgroup obsługującą ruch, bez sond postępu podczas dwusekundowego pomiaru. Oczekuj wzrostu od `0` do `5` i odpowiedzi producenta `north-94`. Dla obu konsumentów dopasuj bieżącą politykę i sprawdź, że drugi `sequence` jest większy.

  ```sh
  bash measure.sh
  kubectl exec deployment/board -c worker -- sh -ec '
    read_counter() {
      while read -r key value rest; do
        if test "$key" = nr_throttled; then printf "%s\n" "$value"; return; fi
      done < /sys/fs/cgroup/cpu.stat
      return 1
    }
    before=$(read_counter)
    sleep 2
    after=$(read_counter)
    test "$after" -ge "$before"
    printf "%s\n" "$((after-before))"
  '
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl get configmap poll-policy -o json | jq .data
  for name in scan-a scan-b; do
    kubectl rollout status "deployment/$name" --timeout=10s
    kubectl exec "deployment/$name" -c worker -- printenv POLL_DELAY POLICY_ID
  done
  progress() {
    for name in scan-a scan-b; do
      kubectl exec "deployment/$name" -c worker -- wget -qO- -T 3 "http://$name:8080/progress.json" |
        jq --arg name "$name" '{consumer:$name,sequence,route,delay,policy_id}'
    done
  }
  progress; sleep 2.2; progress
  ```
phrases.0: Zmierzyłem CPU throttling przed zmianą wydajności.
phrases.1: Zamiast skalować objaw, usunąłem niepotrzebną pracę.
phrases.2: Zachowałem zasób limits i zweryfikowałem przydatne zachowanie HTTP.
questions.0.points.0: NIE; kontener CPU limit jest wymuszany niezależnie.
questions.0.points.1: Porównaj zapotrzebowanie na obciążenie, liczniki requests, limits i cgroup.
questions.0.prompt: Czy węzeł zapasowy CPU uniemożliwia kontenerowi throttling?
questions.1.points.0: Skalowanie wadliwej pętli zwielokrotnia straty i może ukryć przyczynę.
questions.1.points.1: Sprawdź przydatną pracę i ograniczony interwał pomiarowy.
questions.1.prompt: Po co diagnozować przed dodaniem replik?
diagnostics.performance_baseline: Warunek czyta zamrożony initial-throttled, nie bieżącą próbkę CPU. Brak, wartość nieliczbowa lub poniżej 10 nie potwierdza pierwotnego objawu; sprawdź dostarczone dane zamiast przepisywać pomiar dla ukrycia throttling. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-frozen-baseline)
diagnostics.performance_replicas: Skalowanie board zmienia dostarczoną pojemność zamiast usuwać zbędną pracę. Zachowaj replicas równe 1, napraw aktywną pętlę i cadence odbiorców. Błąd API lub sprawdzania JSON również powoduje porażkę. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-single-producer)
diagnostics.performance_ready: Zachowany board może nie zakończyć rollout lub nie przechodzić HTTP readiness po zmianie. Sprawdź zdarzenia, logi i rollout istniejącego Pod; status.readyReplicas ma wynosić 1. Brak statusu lub błąd API/JSON również nie przejdzie. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=bounded-demand-ready-producer)
diagnostics.performance_http: "Zatrzymanie obsługi może obniżyć CPU, ale utracić odpowiedź. Z worker board jego Service board nadal ma zwracać north-94; błąd exec, HTTP lub inna treść narusza pierwotne porównanie. Zachowaj użyteczną obsługę HTTP, usuwając tylko zbędną pętlę. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=bounded-demand-actual-serving-response)"
diagnostics.probe_0_2: Zwiększenie limitów board ukrywa problem zamiast zachować budżet. Worker ma utrzymać CPU request i limit równoważne 50m, memory request 8Mi i limit 32Mi; złe lub brakujące quantities i błąd obserwacji też dają fallback. Obsługiwane równoważne zapisy są akceptowane. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-retain-resource-budget)
diagnostics.performance_sample: Natywna próbka worker może wykazać ponad 5 nowych throttled periods w dwie sekundy, brak odpowiedzi lub błąd polecenia. Osobny worksheet może nie istnieć, zawieść lub dać nieliczbowy/zbyt duży wynik. Usuń aktywną pętlę i przekaż dodatni cadence obu działającym odbiorcom; czytaj licznik jednym exec bez narzutu reader w worker 50m. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-fresh-throttling-and-serving)
diagnostics.performance_identity: Usunięcie i odtworzenie workload, Service lub poll-policy zachowa nazwę, ale zmieni UID. Napraw siedem pierwotnych obiektów na miejscu; tożsamości deployment, Service i policy są zamrożone. Błędy odczytu też dają marker, więc sprawdź API przed uznaniem obiektu za zastąpiony. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=bounded-demand-retain-original-object-identities)
diagnostics.performance_image: Zmiana obrazu worker board zastępuje aplikację zamiast naprawiać zapotrzebowanie. Zachowaj zamrożone odwołanie lub akceptowane równoważne po digest, zmieniając zbędną pracę polecenia. Predykat dotyczy board, nie zamraża dodatkowo obrazu każdego odbiorcy. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-retain-producer-image)
diagnostics.performance_policy: Zmiana POLL_DELAY lub POLICY_ID w poll-policy może pozornie uzgodnić odbiorcę z osłabioną polityką. Zachowaj wszystkie pierwotne wpisy data; same dodatkowe wpisy nie są odrzucane. Zamrożone opóźnienie musi być skończoną dodatnią liczbą ASCII decimal, a błąd odczytu ConfigMap też daje marker. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-retain-positive-current-policy)
diagnostics.performance_consumer_scan_a: Odbiorca początkowo działa z POLL_DELAY=0 i generuje nadmierne żądania do zmiany środowiska procesu. Zachowaj scan-a i scan-b z jedną gotową repliką, zakończonym rollout i własnymi wybierającymi ClusterIP Service na TCP 8080. Sprawdź liczbową zgodność efektywnego POLL_DELAY z dodatnią polityką i dokładny POLICY_ID; sama edycja ConfigMap nie odświeża środowiska. Błędy CLI dają ten sam marker odbiorcy. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_consumer_scan_b: Odbiorca początkowo działa z POLL_DELAY=0 i generuje nadmierne żądania do zmiany środowiska procesu. Zachowaj scan-a i scan-b z jedną gotową repliką, zakończonym rollout i własnymi wybierającymi ClusterIP Service na TCP 8080. Sprawdź liczbową zgodność efektywnego POLL_DELAY z dodatnią polityką i dokładny POLICY_ID; sama edycja ConfigMap nie odświeża środowiska. Błędy CLI dają ten sam marker odbiorcy. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_progress_scan_a: 'Zatrzymanie odbiorców lub stary plik progress obniża popyt bez dowodu użytecznej pracy. Każdy odbiorca przez własny Service ma udostępniać rekord: nieujemny całkowity sequence, route north-94, bieżący policy ID i liczbowo równoważne dodatnie opóźnienie. W dwóch obserwacjach oddzielonych 2.2 sekundy sequence musi wzrosnąć. Błędy HTTP/exec też dają marker; żądanie działa w odbiorcy poza mierzonym CPU producenta. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)'
diagnostics.performance_progress_scan_b: 'Zatrzymanie odbiorców lub stary plik progress obniża popyt bez dowodu użytecznej pracy. Każdy odbiorca przez własny Service ma udostępniać rekord: nieujemny całkowity sequence, route north-94, bieżący policy ID i liczbowo równoważne dodatnie opóźnienie. W dwóch obserwacjach oddzielonych 2.2 sekundy sequence musi wzrosnąć. Błędy HTTP/exec też dają marker; żądanie działa w odbiorcy poza mierzonym CPU producenta. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)'
diagnostics.probe_0_3: Natywna próbka i obsługa przeszły, lecz obserwator tożsamości mógł zawieść przez brak danych, zły JSON, strukturę lub start Python/helper przed nazwanym wynikiem. Sprawdź pierwotny kontrakt i API; przechwycone błędy CLI mają identity lub policy, a wcześniejsze markery tłumią fallback. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=bounded-demand-server-observation-fallback)
diagnostics.probe_0_5: Worksheet przeszedł, lecz obserwator odbiorców mógł zawieść przez brak danych, zły JSON, nieoczekiwany workload/Service lub start Python/helper bez markera. Sprawdź rzeczywiste dokumenty i interfejsy progress; zwykłe błędy odbiorców/HTTP mają własne markery, wcześniejsze markery tłumią fallback. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=bounded-demand-consumer-observation-fallback)
