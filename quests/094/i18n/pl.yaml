hints.0.text: CPU limits może ograniczyć wykonalną pracę, nawet jeśli węzeł ma zapasowe CPU.
hints.1.text: 'Oddziel użyteczną pracę związaną z obsługą od przypadkowego procesu w tle.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl exec deployment/board -c worker -- cat /sys/fs/cgroup/cpu.stat

  ```'
hints.2.text: 'Sprawdź polecenie Deployment i /sys/fs/cgroup/cpu.stat wewnątrz kontenera worker Deployment
  board. Usuń tylko przypadkową aktywną pętlę w tle bez zmiany replik ani limitów; porównaj nowy przedział
  cpu.stat. Dostarczony measure.sh odczytuje oba liczniki w jednym exec, aby oddzielne procesy pomiarowe nie
  zużywały dodatkowego limitu między odczytami.


  Sprawdź obserwowany wynik:


  ```sh

  bash measure.sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Oczekuj najwyżej 5 nowych okresów throttlingu, jednej gotowej repliki i odpowiedzi HTTP north-94 bez zwiększania
  dostarczonego budżetu zasobów.


  Dostarczone ograniczenia i szczegóły: Polecenie kontenera board nadal serwuje `north-94`, bez pętli busy
  loop działającej w tle. Dwusekundowa próbka `bash measure.sh` pokazuje najwyżej 5 nowych okresów throttlingu.'
phrases.0: Zmierzyłem CPU throttling przed zmianą wydajności.
phrases.1: Zamiast skalować objaw, usunąłem niepotrzebną pracę.
phrases.2: Zachowałem zasób limits i zweryfikowałem przydatne zachowanie HTTP.
questions.0.points.0: NIE; kontener CPU limit jest wymuszany niezależnie.
questions.0.points.1: Porównaj zapotrzebowanie na obciążenie, liczniki requests, limits i cgroup.
questions.0.prompt: Czy węzeł zapasowy CPU uniemożliwia kontenerowi throttling?
questions.1.points.0: Skalowanie wadliwej pętli zwielokrotnia straty i może ukryć przyczynę.
questions.1.points.1: Sprawdź przydatną pracę i ograniczony interwał pomiarowy.
questions.1.prompt: Po co diagnozować przed dodaniem replik?
