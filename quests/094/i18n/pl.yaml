title: Wydajność
brief: 'Obciążenie HTTP wykazuje dławienie CPU nawet w spokojnym przedziale. Przywróć wymagane działanie usługi
  w istniejącym budżecie zasobów.


  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `board.yaml`, `service.yaml`, `measure.sh`.


  **Wymagania:**

  - Zapisana próbka początkowa zawiera co najmniej dziesięć okresów throttlingu.

  - Deployment `board` zachowuje dokładnie jedną replikę.

  - Kontener board zachowuje żądanie i limit CPU `50m`, żądanie pamięci `8Mi` i limit pamięci `32Mi`.

  - Obciążenie obsługujące żądania zwraca `north-94` bez niepowiązanej pracy CPU.

  - Deployment `board` ma jedną gotową replikę.

  - Świeży dwusekundowy pomiar na stacji roboczej rejestruje najwyżej `5` nowych okresów throttlingu.

  - HTTP z Deployment `board` do `http://board:8080` zwraca `north-94`.


  To mierzy dławienie CPU, a nie ogólne opóźnienia; skrypt pomiarowy i sondy stanu mogą nadal zużywać limit
  CPU.

  '
debrief: Usunięcie zmarnowanej pracy zmniejszyło throttling w ramach pierwotnego budżetu zasobów. Próbnik i
  health checks zużywają również quota; ten ograniczony pomiar uczenia nie jest opóźnieniem produkcyjnym SLO.
stages.0.brief: Zachowaj jedną gotową replikę i oryginalny budżet zasobów, ograniczając zmierzone dławienie.
