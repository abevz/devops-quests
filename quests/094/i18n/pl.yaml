title: Wydajność
brief: 'Jedna replika board obsługuje HTTP, ale marnuje swój budżet CPU 50m na przypadkowej pętli aktywnego
  oczekiwania działającej w tle. Sprawdź /sys/fs/cgroup/cpu.stat do measure.sh i polecenie Deployment.
  Usuń tylko busy loop, zachowując jedną replikę, zawartość HTTP oraz dokładne żądania i limity CPU/pamięci.
  Zamrożona próbka początkowa rejestruje co najmniej dziesięć faktycznie throttled periods. Próbnik odczytuje
  oba liczniki w ramach jednego exec; własną pracę, a health probes może nadal wydać trochę CPU quota.
  Ostatnia dwusekundowa próbka musi zawierać maksymalnie pięć nowych throttled periods. To jest diagnostyka
  CPU-throttling, a nie ogólny test porównawczy opóźnień; dodanie replik lub podniesienie limitów ukrywa
  przyczynę.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`,
  `measure.sh`, `initial-throttled`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: niekontrolowana pętla została usunięta, jedna replika utrzymuje swój budżet
  zasobów, rzeczywiste throttling spada, a HTTP nadal zwraca north-94.'
debrief: Usunięcie zmarnowanej pracy zmniejszyło throttling w ramach pierwotnego budżetu zasobów. Próbnik
  i health checks zużywają również quota; ten ograniczony pomiar uczenia nie jest opóźnieniem produkcyjnym
  SLO.
stages.0.brief: 'Kryteria sukcesu: Niekontrolowana pętla została usunięta, jedna replika utrzymuje swój
  budżet zasobów, rzeczywiste throttling spada, a HTTP nadal zwraca north-94.'
stages.0.objectives.0.text: Niekontrolowana pętla zostaje usunięta, jedna replika utrzymuje swój budżet
  zasobów, rzeczywiste throttling spada, a HTTP nadal zwraca north-94.
hints.0.text: CPU limits może ograniczyć wykonalną pracę, nawet jeśli węzeł ma zapasowe CPU.
hints.1.text: Oddziel użyteczną pracę związaną z obsługą od przypadkowego procesu w tle.
hints.2.text: Usuń pętlę i porównaj nowy interwał cpu.stat bez zmiany replik i limitów.
phrases.0: Zmierzyłem CPU throttling przed zmianą wydajności.
phrases.1: Zamiast skalować objaw, usunąłem niepotrzebną pracę.
phrases.2: Zachowałem zasób limits i zweryfikowałem przydatne zachowanie HTTP.
questions.0.points.0: NIE; kontener CPU limit jest wymuszany niezależnie.
questions.0.points.1: Porównaj zapotrzebowanie na obciążenie, liczniki requests, limits i cgroup.
questions.0.prompt: Czy węzeł zapasowy CPU uniemożliwia kontenerowi throttling?
questions.1.points.0: Skalowanie wadliwej pętli zwielokrotnia straty i może ukryć przyczynę.
questions.1.points.1: Sprawdź przydatną pracę i ograniczony interwał pomiarowy.
questions.1.prompt: Po co diagnozować przed dodaniem replik?
