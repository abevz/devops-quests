title: Производительность
brief: 'HTTP-нагрузка испытывает CPU throttling даже в спокойном интервале. Восстановите требуемое обслуживание
  в рамках существующего бюджета ресурсов.


  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `board.yaml`, `service.yaml`, `measure.sh`.


  **Требования:**

  - Исходный образец содержит не менее десяти периодов троттлинга.

  - Deployment `board` сохраняет ровно одну реплику.

  - Контейнер board сохраняет запрос и лимит CPU `50m`, запрос памяти `8Mi` и лимит памяти `32Mi`.

  - Обслуживающая нагрузка возвращает `north-94` без посторонней работы CPU.

  - Deployment `board` имеет одну готовую реплику.

  - Свежий двухсекундный замер на рабочей станции фиксирует не более `5` новых периодов throttling.

  - HTTP-запрос из Deployment `board` к `http://board:8080` возвращает `north-94`.


  Этот замер оценивает CPU throttling, а не общую задержку; скрипт замера и проверки здоровья всё ещё могут
  расходовать квоту CPU.

  '
debrief: Устранение лишней работы снизило throttling в исходном бюджете ресурсов. Sampler и health checks тоже
  расходуют quota; ограниченный учебный замер не является production SLO задержки.
