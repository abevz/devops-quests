title: Производительность
brief: |-
  Обслуживающий workload превышает целевой порог ограниченного измерения CPU при работающих потребителях. Восстановите требуемый ответ и актуальную работу потребителей в исходном бюджете сервера.

  Работайте на рабочей станции в `~/quest` с `performance-contract.json`. Требуемый файл измерения на станции — `~/quest/measure.sh`; изучите живые workload и заданную политику опроса в пространстве имён.

  **Требования:**
  - Сохраните исходное измерение не менее десяти throttled periods, ровно одну готовую реплику Deployment `board`, его CPU request/limit `50m`, memory request `8Mi` и memory limit `32Mi`.
  - Реальное измерение обслуживающего контейнера соответствует контракту, а HTTP из Deployment `board` к `http://board:8080` возвращает `north-94`.
  - Файл измерения на станции сообщает не более `5` новых throttled periods за свежий двухсекундный интервал. Оба потребителя имеют по одной обновлённой готовой реплике, используют текущие параметры политики и продолжают увеличивать прогресс нужного маршрута через собственные ClusterIP Service с селекторами.
  - Сохраните исходные UID workload, Service и политики, все заданные данные политики и неизменяемые образы приложений.

  Проверки наблюдают текущее состояние, живой прогресс потребителей и ограниченные выборки CFS. Самплеры и health probes расходуют квоту; эти наблюдения не доказывают production latency SLO или непрерывную доступность.
debrief: Удаление работы сервера оставило реальный спрос потребителей, расходующий квоту. Текущая политика теперь
  доходит до обоих активных процессов; обслуживание и прогресс сохраняются в исходном бюджете.
stages.0.brief: Свежее измерение на станции укладывается в порог; оба исходных потребителя используют текущий интервал
  и продолжают увеличивать прогресс маршрута.
stages.0.objectives.0.text: Исходный образец содержит не менее десяти периодов троттлинга.
stages.0.objectives.1.text: Deployment `board` сохраняет ровно одну реплику.
stages.0.objectives.2.text: Контейнер board сохраняет запрос и лимит CPU `50m`, запрос памяти `8Mi` и лимит памяти
  `32Mi`.
stages.0.objectives.3.text: Реальные измерение и ответ сервера соответствуют контракту при сохранении исходных ресурсов,
  образов и текущих данных политики.
stages.0.objectives.4.text: Deployment `board` имеет одну готовую реплику.
stages.0.objectives.5.text: Свежее измерение на станции укладывается в порог; оба исходных потребителя используют
  текущий интервал и продолжают увеличивать прогресс маршрута.
stages.0.objectives.6.text: HTTP-запрос из Deployment `board` к `http://board:8080` возвращает `north-94`.
hints.0.text: Квоту может исчерпать работа внутри сервера или реальный входящий спрос. Тихий сервер после остановки
  обязательного потребителя не доказывает весь контракт обслуживания.
hints.1.text: Сопоставьте `performance-contract.json`, живые команды и ресурсы, политику и действующие параметры
  потребителей, `/sys/fs/cgroup/cpu.stat` обслуживающего worker, события, логи и записи прогресса. Отделите издержки
  измерения, полезные запросы и другую работу.
hints.2.text: Постройте файл измерения по заданному счётчику cgroup и интервалу, восстановите полезное обслуживание
  и передайте текущие параметры обоим активным потребителям. Проверьте `bash measure.sh`, независимый результат
  сервера, rollout и все заданные интерфейсы прогресса. Ожидаются не более `5` новых throttled periods, `north-94`,
  исходные UID и бюджет и растущие записи потребителей с текущим интервалом политики.
phrases.0: Я измерил CPU throttling до изменения мощности.
phrases.1: Я убрал лишнюю работу вместо масштабирования симптома.
phrases.2: Я сохранил limits и проверил полезное поведение HTTP.
questions.0.points.0: 'Нет: CPU limit контейнера действует отдельно.'
questions.0.points.1: Сопоставляйте нагрузку, requests, limits и счётчики cgroup.
questions.0.prompt: Исключает ли свободный CPU узла throttling контейнера?
questions.1.points.0: Масштабирование ошибочного цикла умножает потери и скрывает причину.
questions.1.points.1: Проверяйте полезную работу и ограниченный интервал измерения.
questions.1.prompt: Зачем проводить диагностику до добавления реплик?
diagnostics.performance_baseline: Условие читает зафиксированный initial-throttled, а не текущую метрику CPU. Отсутствующая или нечисловая запись либо значение ниже 10 не подтверждают исходный симптом; изучите выданные факты, не переписывая измерение для сокрытия текущего throttling. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-frozen-baseline)
diagnostics.performance_replicas: Масштабирование board меняет выданную ёмкость вместо удаления лишней работы. Сохраните replicas равным 1 и исправьте активный цикл и cadence потребителей. Ошибка API или JSON-проверки тоже нарушает условие. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-single-producer)
diagnostics.performance_ready: Сохранённый board мог не завершить rollout или не проходить HTTP readiness после правки. Изучите события, логи и rollout существующего Pod; status.readyReplicas должен равняться 1. Отсутствие статуса или ошибка API/JSON тоже не проходят. [Причина и проверка](guides#guide=kubernetes-20&section=bounded-demand-ready-producer)
diagnostics.performance_http: Остановка полезной работы снижает CPU, но теряет нужный ответ. Из worker board его Service должен возвращать north-94; ошибка exec, HTTP или другое тело нарушают исходное сравнение значения. Сохраните полезный HTTP, удалив только ненужный цикл. [Причина и проверка](guides#guide=kubernetes-10&section=bounded-demand-actual-serving-response)
diagnostics.probe_0_2: Увеличение лимитов board скрывает проблему вместо сохранения бюджета. Worker должен сохранять CPU request и limit, эквивалентные 50m, memory request 8Mi и limit 32Mi; неверные или отсутствующие quantities и ошибка чтения workload тоже дают fallback. Поддерживаемые эквивалентные записи quantities принимаются. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-retain-resource-budget)
diagnostics.performance_sample: Нативная метрика worker может показывать более 5 новых throttled periods за две секунды, не получить полезный ответ либо упасть при наблюдении. Отдельный worksheet может отсутствовать, упасть или вывести нечисловую либо завышенную метрику. Удалите выданный активный цикл и передайте положительный cadence обоим работающим потребителям; читайте счётчик одним exec, не добавляя накладные расходы reader в worker с 50m. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-fresh-throttling-and-serving)
diagnostics.performance_identity: 'Удаление и создание workload, Service или poll-policy сохраняет имена, но меняет UID. Исправляйте семь исходных объектов на месте: идентичности Deployment, Service и policy зафиксированы. Ошибка чтения тоже даёт этот маркер, поэтому сначала проверьте API, не считая объект заменённым только по сбою чтения. [Причина и проверка](guides#guide=kubernetes-20&section=bounded-demand-retain-original-object-identities)'
diagnostics.performance_image: Замена образа worker board меняет приложение вместо исправления нагрузки. Сохраните зафиксированную ссылку или допустимую ссылку с тем же digest, изменяя ненужную работу команды. Проверка образа относится к board и не добавляет запрет изменения образа каждого потребителя. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-retain-producer-image)
diagnostics.performance_policy: Изменение POLL_DELAY или POLICY_ID в poll-policy может сделать потребителя согласованным с ослабленной политикой. Сохраните все исходные записи data; дополнительные записи сами по себе не запрещены. Зафиксированная задержка также должна быть конечным положительным ASCII decimal; ошибка чтения ConfigMap даёт тот же маркер. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-retain-positive-current-policy)
diagnostics.performance_consumer_scan_a: Потребитель изначально работает с POLL_DELAY=0 и создаёт лишнюю нагрузку до изменения окружения работающего процесса. Сохраните scan-a и scan-b по одной готовой реплике с завершённым rollout и собственными выбирающими ClusterIP Service на TCP 8080. Проверьте числовое равенство эффективного POLL_DELAY выданной положительной политике и точный POLICY_ID; правка ConfigMap сама не обновляет окружение. Ошибки CLI дают тот же маркер потребителя. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_consumer_scan_b: Потребитель изначально работает с POLL_DELAY=0 и создаёт лишнюю нагрузку до изменения окружения работающего процесса. Сохраните scan-a и scan-b по одной готовой реплике с завершённым rollout и собственными выбирающими ClusterIP Service на TCP 8080. Проверьте числовое равенство эффективного POLL_DELAY выданной положительной политике и точный POLICY_ID; правка ConfigMap сама не обновляет окружение. Ошибки CLI дают тот же маркер потребителя. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_progress_scan_a: 'Остановка потребителей или старый progress-файл снижает нагрузку, но не доказывает полезную работу. Каждый потребитель через свой Service должен отдавать корректную запись: неотрицательный целый sequence, route north-94, текущий policy ID и численно равную положительную задержку. За две проверки с интервалом 2.2 секунды sequence должен вырасти. Ошибки HTTP/exec дают этот маркер; запрос выполняется внутри потребителя вне измеряемого CPU производителя. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)'
diagnostics.performance_progress_scan_b: 'Остановка потребителей или старый progress-файл снижает нагрузку, но не доказывает полезную работу. Каждый потребитель через свой Service должен отдавать корректную запись: неотрицательный целый sequence, route north-94, текущий policy ID и численно равную положительную задержку. За две проверки с интервалом 2.2 секунды sequence должен вырасти. Ошибки HTTP/exec дают этот маркер; запрос выполняется внутри потребителя вне измеряемого CPU производителя. [Причина и проверка](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)'
diagnostics.probe_0_3: Нативная метрика и ответ прошли, но observer идентичностей мог упасть на отсутствующих фактах, неверном JSON, неожиданной форме объекта или запуске Python/helper до именованного результата. Проверьте исходный контракт и API-документы; пойманные CLI-ошибки уже дают identity или policy, а предыдущие маркеры подавляют fallback. [Причина и проверка](guides#guide=kubernetes-20&section=bounded-demand-server-observation-fallback)
diagnostics.probe_0_5: Worksheet прошёл, но observer потребителей мог упасть на отсутствующих фактах, неверном JSON, неожиданной структуре workload/Service или запуске Python/helper без маркера. Проверьте реальные документы и progress-интерфейсы; обычные сбои потребителей/HTTP уже имеют свои маркеры, а предыдущие маркеры подавляют fallback. [Причина и проверка](guides#guide=kubernetes-20&section=bounded-demand-consumer-observation-fallback)
