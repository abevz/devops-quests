title: Производительность
brief: 'Одна реплика табло отвечает по HTTP, но тратит лимит CPU 50m на случайный
  фоновый busy loop. Изучите /sys/fs/cgroup/cpu.stat через measure.sh и command Deployment.
  Уберите только busy loop, сохранив одну реплику, HTTP-содержимое и точные requests/limits
  CPU и памяти. Исходный сохранённый замер отражает не менее десяти реальных throttled
  periods. Sampler читает оба счётчика в одном exec; его работа и health probes всё
  равно расходуют часть CPU quota. За итоговые две секунды допускается не более пяти
  новых throttled periods. Это диагностика CPU throttling, а не общий тест задержки;
  увеличение числа реплик или лимита скроет причину.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`,
  `measure.sh`, `initial-throttled`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Busy loop убран, одна реплика сохранила бюджет, реальное throttling
  снизилось, HTTP по-прежнему отдаёт north-94.'
debrief: Устранение лишней работы снизило throttling в исходном бюджете ресурсов.
  Sampler и health checks тоже расходуют quota; ограниченный учебный замер не является
  production SLO задержки.
stages.0.brief: 'Результат проверки: Busy loop убран, одна реплика сохранила бюджет,
  реальное throttling снизилось, HTTP по-прежнему отдаёт north-94.'
stages.0.objectives.0.text: Busy loop убран, одна реплика сохранила бюджет, реальное
  throttling снизилось, HTTP по-прежнему отдаёт north-94.
hints.0.text: CPU limits могут ограничивать готовую работу даже при свободном CPU
  узла.
hints.1.text: Отделите полезную работу сервиса от случайного фонового процесса.
hints.2.text: Уберите цикл и сравните новый интервал cpu.stat без изменения реплик
  или лимитов.
phrases.0: Я измерил CPU throttling до изменения мощности.
phrases.1: Я убрал лишнюю работу вместо масштабирования симптома.
phrases.2: Я сохранил limits и проверил полезное поведение HTTP.
questions.0.points.0: 'Нет: CPU limit контейнера действует отдельно.'
questions.0.points.1: Сопоставляйте нагрузку, requests, limits и счётчики cgroup.
questions.0.prompt: Исключает ли свободный CPU узла throttling контейнера?
questions.1.points.0: Масштабирование ошибочного цикла умножает потери и скрывает
  причину.
questions.1.points.1: Проверяйте полезную работу и ограниченный интервал измерения.
questions.1.prompt: Зачем проводить диагностику до добавления реплик?
