hints.0.text: CPU limits могут ограничивать готовую работу даже при свободном CPU узла.
hints.1.text: 'Отделите полезную работу сервиса от случайного фонового процесса.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl exec deployment/board -c worker -- cat /sys/fs/cgroup/cpu.stat

  ```'
hints.2.text: 'Проверьте команду Deployment и /sys/fs/cgroup/cpu.stat внутри контейнера worker Deployment board.
  Удалите только случайный фоновый busy loop без изменения реплик или лимитов; сравните новый интервал cpu.stat.
  Предоставленный measure.sh читает оба счётчика за один exec, чтобы отдельные процессы замера не расходовали
  дополнительную квоту между чтениями.


  Проверьте наблюдаемый результат:


  ```sh

  bash measure.sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Ожидаются не более 5 новых периодов throttling, одна готовая реплика и HTTP-ответ north-94 без повышения
  поставленного бюджета ресурсов.


  Поставленные ограничения и подробности: Команда контейнера board по-прежнему обслуживает `north-94`, без
  фонового busy loop. Двухсекундный образец `bash measure.sh` содержит не более 5 новых периодов троттлинга.'
phrases.0: Я измерил CPU throttling до изменения мощности.
phrases.1: Я убрал лишнюю работу вместо масштабирования симптома.
phrases.2: Я сохранил limits и проверил полезное поведение HTTP.
questions.0.points.0: 'Нет: CPU limit контейнера действует отдельно.'
