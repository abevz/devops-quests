title: Производительность
brief: |-
  Обслуживающий workload превышает целевой порог ограниченного измерения CPU при работающих потребителях. Восстановите требуемый ответ и актуальную работу потребителей в исходном бюджете сервера.

  Работайте на рабочей станции в `~/quest` с `performance-contract.json`. Требуемый файл измерения на станции — `~/quest/measure.sh`; изучите живые workload и заданную политику опроса в пространстве имён.

  **Требования:**
  - Сохраните исходное измерение не менее десяти throttled periods, ровно одну готовую реплику Deployment `board`, его CPU request/limit `50m`, memory request `8Mi` и memory limit `32Mi`.
  - Реальное измерение обслуживающего контейнера соответствует контракту, а HTTP из Deployment `board` к `http://board:8080` возвращает `north-94`.
  - Файл измерения на станции сообщает не более `5` новых throttled periods за свежий двухсекундный интервал. Оба потребителя имеют по одной обновлённой готовой реплике, используют текущие параметры политики и продолжают увеличивать прогресс нужного маршрута через собственные ClusterIP Service с селекторами.
  - Сохраните исходные UID workload, Service и политики, все заданные данные политики и неизменяемые образы приложений.

  Проверки наблюдают текущее состояние, живой прогресс потребителей и ограниченные выборки CFS. Самплеры и health probes расходуют квоту; эти наблюдения не доказывают production latency SLO или непрерывную доступность.
debrief: Удаление работы сервера оставило реальный спрос потребителей, расходующий квоту. Текущая политика теперь
  доходит до обоих активных процессов; обслуживание и прогресс сохраняются в исходном бюджете.
stages.0.brief: Свежее измерение на станции укладывается в порог; оба исходных потребителя используют текущий интервал
  и продолжают увеличивать прогресс маршрута.
stages.0.objectives.0.text: Исходный образец содержит не менее десяти периодов троттлинга.
stages.0.objectives.1.text: Deployment `board` сохраняет ровно одну реплику.
stages.0.objectives.2.text: Контейнер board сохраняет запрос и лимит CPU `50m`, запрос памяти `8Mi` и лимит памяти
  `32Mi`.
stages.0.objectives.3.text: Реальные измерение и ответ сервера соответствуют контракту при сохранении исходных ресурсов,
  образов и текущих данных политики.
stages.0.objectives.4.text: Deployment `board` имеет одну готовую реплику.
stages.0.objectives.5.text: Свежее измерение на станции укладывается в порог; оба исходных потребителя используют
  текущий интервал и продолжают увеличивать прогресс маршрута.
stages.0.objectives.6.text: HTTP-запрос из Deployment `board` к `http://board:8080` возвращает `north-94`.
hints.0.text: Квоту может исчерпать работа внутри сервера или реальный входящий спрос. Тихий сервер после остановки
  обязательного потребителя не доказывает весь контракт обслуживания.
hints.1.text: Сопоставьте `performance-contract.json`, живые команды и ресурсы, политику и действующие параметры
  потребителей, `/sys/fs/cgroup/cpu.stat` обслуживающего worker, события, логи и записи прогресса. Отделите издержки
  измерения, полезные запросы и другую работу.
hints.2.text: Постройте файл измерения по заданному счётчику cgroup и интервалу, восстановите полезное обслуживание
  и передайте текущие параметры обоим активным потребителям. Проверьте `bash measure.sh`, независимый результат
  сервера, rollout и все заданные интерфейсы прогресса. Ожидаются не более `5` новых throttled periods, `north-94`,
  исходные UID и бюджет и растущие записи потребителей с текущим интервалом политики.
phrases.0: Я измерил CPU throttling до изменения мощности.
phrases.1: Я убрал лишнюю работу вместо масштабирования симптома.
phrases.2: Я сохранил limits и проверил полезное поведение HTTP.
questions.0.points.0: 'Нет: CPU limit контейнера действует отдельно.'
questions.0.points.1: Сопоставляйте нагрузку, requests, limits и счётчики cgroup.
questions.0.prompt: Исключает ли свободный CPU узла throttling контейнера?
questions.1.points.0: Масштабирование ошибочного цикла умножает потери и скрывает причину.
questions.1.points.1: Проверяйте полезную работу и ограниченный интервал измерения.
questions.1.prompt: Зачем проводить диагностику до добавления реплик?
