title: Производительность
brief: |
  HTTP-нагрузка испытывает CPU throttling даже в спокойном интервале. Восстановите требуемое обслуживание в рамках существующего бюджета ресурсов.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `board.yaml`, `service.yaml`, `measure.sh`.

  **Требования:**
  - Внутри контейнера `worker` Deployment `board` HTTP-запрос к `http://board:8080` возвращает `north-94`.
  - Зафиксированный исходный замер на workstation содержит минимум десять периодов throttling:
    - `/run/dq/facts/0/initial-throttled`
  - Deployment `board` сохраняет ровно одну реплику, и она готова.
  - В Deployment `board` контейнер `worker` сохраняет следующие настройки ресурсов:
    - Запрос CPU: `50m`
    - Лимит CPU: `50m`
    - Запрос памяти: `8Mi`
    - Лимит памяти: `32Mi`
  - Его команда продолжает выдавать `north-94` без фонового busy loop.
  - Из `~/quest` на workstation двухсекундный замер `bash measure.sh` показывает не более пяти новых периодов throttling.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — Потребитель сервиса получает `north-94`.
  - `kubectl get deployment board -o yaml` — Готова ровно одна реплика; настройки ресурсов соответствуют требованиям, а команда обслуживания не содержит фонового busy loop.
  - Зафиксированное исходное число — минимум `10`; новое число за две секунды — максимум `5`.

    ```sh
    cat /run/dq/facts/0/initial-throttled
    bash measure.sh
    ```

  Этот замер оценивает CPU throttling, а не общую задержку; скрипт замера и проверки здоровья всё ещё могут расходовать квоту CPU.
debrief: Устранение лишней работы снизило throttling в исходном бюджете ресурсов.
  Sampler и health checks тоже расходуют quota; ограниченный учебный замер не является
  production SLO задержки.
stages.0.brief: |
  Сохраните одну готовую реплику и исходный бюджет ресурсов, снизив измеряемый throttling.
stages.0.objectives.0.text: Исходный образец содержит не менее десяти периодов троттлинга.
stages.0.objectives.1.text: Deployment `board` сохраняет ровно одну реплику.
stages.0.objectives.2.text: Контейнер board сохраняет запрос и лимит CPU `50m`, запрос памяти `8Mi` и
  лимит памяти `32Mi`.
stages.0.objectives.3.text: Команда контейнера board по-прежнему обслуживает `north-94`, без фонового
  busy loop.
stages.0.objectives.4.text: Deployment `board` имеет одну готовую реплику.
stages.0.objectives.5.text: Двухсекундный образец `bash measure.sh` содержит не более 5 новых периодов
  троттлинга.
stages.0.objectives.6.text: HTTP-запрос из Deployment `board` к `http://board:8080` возвращает `north-94`.
hints.0.text: CPU limits могут ограничивать готовую работу даже при свободном CPU
  узла.
hints.1.text: Отделите полезную работу сервиса от случайного фонового процесса.
hints.2.text: |
  Проверьте команду Deployment и /sys/fs/cgroup/cpu.stat внутри контейнера worker Deployment board. Удалите только случайный фоновый busy loop без изменения реплик или лимитов; сравните новый интервал cpu.stat. Предоставленный measure.sh читает оба счётчика за один exec, чтобы отдельные процессы замера не расходовали дополнительную квоту между чтениями.
phrases.0: Я измерил CPU throttling до изменения мощности.
phrases.1: Я убрал лишнюю работу вместо масштабирования симптома.
phrases.2: Я сохранил limits и проверил полезное поведение HTTP.
questions.0.points.0: 'Нет: CPU limit контейнера действует отдельно.'
questions.0.points.1: Сопоставляйте нагрузку, requests, limits и счётчики cgroup.
questions.0.prompt: Исключает ли свободный CPU узла throttling контейнера?
questions.1.points.0: Масштабирование ошибочного цикла умножает потери и скрывает
  причину.
questions.1.points.1: Проверяйте полезную работу и ограниченный интервал измерения.
questions.1.prompt: Зачем проводить диагностику до добавления реплик?
