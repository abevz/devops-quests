title: Leistung
brief: |
  Der HTTP-Workload zeigt selbst in einem ruhigen Intervall CPU-Drosselung. Stellen Sie das geforderte Antwortverhalten innerhalb des bestehenden Ressourcenbudgets her.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `board.yaml`, `service.yaml`, `measure.sh`.

  **Anforderungen:**
  - Im Container `worker` von Deployment `board` liefert HTTP an `http://board:8080` den Wert `north-94`.
  - Die eingefrorene Ausgangsmessung auf der Workstation erfasst mindestens zehn gedrosselte Perioden:
    - `/run/dq/facts/0/initial-throttled`
  - Deployment `board` behält genau ein Replikat bei, das bereit ist.
  - In Deployment `board` behält Container `worker` diese Ressourceneinstellungen bei:
    - CPU-Anforderung: `50m`
    - CPU-Limit: `50m`
    - Speicheranforderung: `8Mi`
    - Speicherlimit: `32Mi`
  - Sein Befehl liefert weiterhin `north-94` ohne die Hintergrund-Endlosschleife.
  - In `~/quest` auf der Workstation meldet die zweisekündige Messung mit `bash measure.sh` höchstens fünf neu gedrosselte Perioden.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — Der Dienstverbraucher erhält `north-94`.
  - `kubectl get deployment board -o yaml` — Genau ein Replikat ist bereit; die Ressourceneinstellungen entsprechen den Anforderungen und der Serverbefehl enthält keine Hintergrund-Endlosschleife.
  - Der eingefrorene Ausgangswert beträgt mindestens `10`; der neue Zweisekundenwert beträgt höchstens `5`.

    ```sh
    cat /run/dq/facts/0/initial-throttled
    bash measure.sh
    ```

  Dies misst CPU-Drosselung, keine allgemeine Latenz; Messung und Gesundheitsprüfungen können weiterhin CPU-Quote verbrauchen.
debrief: Durch das Entfernen verschwendeter Arbeit wurde throttling innerhalb des ursprünglichen Ressourcenbudgets
  reduziert. Ein Sampler und health checks verbrauchen auch quota; Bei dieser begrenzten Lehrmessung handelt
  es sich nicht um eine production-Latenz SLO.
stages.0.brief: |
  Behalten Sie ein bereites Replikat und das ursprüngliche Ressourcenbudget bei und reduzieren Sie die gemessene Drosselung.
stages.0.objectives.0.text: Die aufgezeichnete Ausgangsprobe enthält mindestens zehn gedrosselte Perioden.
stages.0.objectives.1.text: Deployment `board` behält genau eine Replik.
stages.0.objectives.2.text: Der board-Container behält CPU-Anforderung und CPU-Limit von `50m`, Speicheranforderung
  von `8Mi` und Speicherlimit von `32Mi`.
stages.0.objectives.3.text: Der Befehl des board-Containers liefert weiterhin `north-94`, ohne die Hintergrund-Busy-Loop.
stages.0.objectives.4.text: Deployment `board` hat eine bereite Replik.
stages.0.objectives.5.text: Die Zwei-Sekunden-Probe `bash measure.sh` zeigt höchstens 5 neu gedrosselte
  Perioden.
stages.0.objectives.6.text: HTTP von Deployment `board` an `http://board:8080` liefert `north-94`.
hints.0.text: CPU limits kann ausführbare Arbeit drosseln, selbst wenn der Knoten über Ersatz-CPU verfügt.
hints.1.text: Trennen Sie nützliche Servierarbeit vom zufälligen Hintergrundprozess.
hints.2.text: |
  Prüfen Sie den Deployment-Befehl und /sys/fs/cgroup/cpu.stat im Container worker von Deployment board. Entfernen Sie nur die versehentliche Hintergrund-Endlosschleife, ohne Replikate oder Limits zu ändern; vergleichen Sie ein neues Intervall von cpu.stat. Das bereitgestellte measure.sh liest beide Zähler in einem exec, damit separate Messprozesse zwischen den Ablesungen keine zusätzliche Quote verbrauchen.
phrases.0: Ich habe CPU throttling gemessen, bevor ich die Kapazität geändert habe.
phrases.1: Ich habe unnötige Arbeit entfernt, anstatt das Symptom zu vergrößern.
phrases.2: Ich habe die Ressource limits beibehalten und ein nützliches Verhalten von HTTP überprüft.
questions.0.points.0: NEIN; Der Container CPU limit wird unabhängig durchgesetzt.
questions.0.points.1: Vergleichen Sie die Workload-Anforderungen requests, limits und cgroup counters.
questions.0.prompt: Verhindert der Ersatzknoten CPU den Container throttling?
questions.1.points.0: Die Skalierung einer fehlerhaften Schleife vervielfacht die Verschwendung und kann
  die Ursache verschleiern.
questions.1.points.1: Überprüfen Sie die Nutzarbeit und ein begrenztes Messintervall.
questions.1.prompt: Warum eine Diagnose durchführen, bevor Replikate hinzugefügt werden?
