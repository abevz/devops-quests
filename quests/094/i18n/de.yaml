title: Leistung
brief: 'Der HTTP-Workload zeigt selbst in einem ruhigen Intervall CPU-Drosselung. Stellen Sie das geforderte
  Antwortverhalten innerhalb des bestehenden Ressourcenbudgets her.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `board.yaml`, `service.yaml`,
  `measure.sh`.


  **Anforderungen:**

  - Die aufgezeichnete Ausgangsprobe enthält mindestens zehn gedrosselte Perioden.

  - Deployment `board` behält genau eine Replik.

  - Der board-Container behält CPU-Anforderung und CPU-Limit von `50m`, Speicheranforderung von `8Mi` und Speicherlimit
  von `32Mi`.

  - Die ausliefernde Workload liefert `north-94` ohne sachfremde CPU-Arbeit.

  - Deployment `board` hat eine bereite Replik.

  - Eine neue zweisekündige Messung auf der Workstation erfasst höchstens `5` neu gedrosselte Perioden.

  - HTTP von Deployment `board` an `http://board:8080` liefert `north-94`.


  Dies misst CPU-Drosselung, keine allgemeine Latenz; Messung und Gesundheitsprüfungen können weiterhin CPU-Quote
  verbrauchen.

  '
debrief: Durch das Entfernen verschwendeter Arbeit wurde throttling innerhalb des ursprünglichen Ressourcenbudgets
  reduziert. Ein Sampler und health checks verbrauchen auch quota; Bei dieser begrenzten Lehrmessung handelt
  es sich nicht um eine production-Latenz SLO.
stages.0.brief: Behalten Sie ein bereites Replikat und das ursprüngliche Ressourcenbudget bei und reduzieren
  Sie die gemessene Drosselung.
