hints.0.text: CPU limits kann ausführbare Arbeit drosseln, selbst wenn der Knoten über Ersatz-CPU verfügt.
hints.1.text: 'Trennen Sie nützliche Servierarbeit vom zufälligen Hintergrundprozess.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl exec deployment/board -c worker -- cat /sys/fs/cgroup/cpu.stat

  ```'
hints.2.text: 'Prüfen Sie den Deployment-Befehl und /sys/fs/cgroup/cpu.stat im Container worker von Deployment
  board. Entfernen Sie nur die versehentliche Hintergrund-Endlosschleife, ohne Replikate oder Limits zu ändern;
  vergleichen Sie ein neues Intervall von cpu.stat. Das bereitgestellte measure.sh liest beide Zähler in einem
  exec, damit separate Messprozesse zwischen den Ablesungen keine zusätzliche Quote verbrauchen.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  bash measure.sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Erwartet werden höchstens 5 neu gedrosselte Perioden, ein bereites Replikat und die HTTP-Antwort north-94
  ohne Erhöhung des mitgelieferten Ressourcenbudgets.


  Mitgelieferte Einschränkungen und Details: Der Befehl des board-Containers liefert weiterhin `north-94`,
  ohne die Hintergrund-Busy-Loop. Die Zwei-Sekunden-Probe `bash measure.sh` zeigt höchstens 5 neu gedrosselte
  Perioden.'
phrases.0: Ich habe CPU throttling gemessen, bevor ich die Kapazität geändert habe.
phrases.1: Ich habe unnötige Arbeit entfernt, anstatt das Symptom zu vergrößern.
phrases.2: Ich habe die Ressource limits beibehalten und ein nützliches Verhalten von HTTP überprüft.
questions.0.points.0: NEIN; Der Container CPU limit wird unabhängig durchgesetzt.
questions.0.points.1: Vergleichen Sie die Workload-Anforderungen requests, limits und cgroup counters.
questions.0.prompt: Verhindert der Ersatzknoten CPU den Container throttling?
questions.1.points.0: Die Skalierung einer fehlerhaften Schleife vervielfacht die Verschwendung und kann die
  Ursache verschleiern.
questions.1.points.1: Überprüfen Sie die Nutzarbeit und ein begrenztes Messintervall.
questions.1.prompt: Warum eine Diagnose durchführen, bevor Replikate hinzugefügt werden?
diagnostics.probe_0_2: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Der board-Container
  behält CPU-Anforderung und CPU-Limit von `50m`, Speicheranforderung von `8Mi` und Speicherlimit von `32Mi`.'
