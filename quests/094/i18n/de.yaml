title: Leistung
brief: |-
  Der bedienende Workload überschreitet seinen begrenzten CPU-Messwert bei weiterhin aktiven Verbrauchern. Stelle das geforderte Antwortverhalten und aktuelle Verbraucheroperationen im ursprünglichen Serverbudget her.

  Arbeite auf der Workstation in `~/quest` mit `performance-contract.json`. Die zu erstellende Workstation-Messdatei ist `~/quest/measure.sh`; untersuche laufende Workloads und die vorgegebene Abfragerichtlinie im Namespace.

  **Anforderungen:**
  - Erhalte die Anfangsmessung mit mindestens zehn gedrosselten Perioden, genau eine bereite Replik von Deployment `board`, dessen CPU-Request/Limit `50m`, Speicher-Request `8Mi` und Speicherlimit `32Mi`.
  - Die tatsächliche Messung des bedienenden Containers erfüllt den Vertrag; HTTP von Deployment `board` an `http://board:8080` liefert `north-94`.
  - Die Workstation-Messdatei meldet höchstens `5` neue gedrosselte Perioden in einer frischen Zweissekundenmessung. Beide Verbraucher haben je eine aktualisierte bereite Replik, verwenden aktuelle Richtlinieneingaben und liefern weiter wachsenden Routenfortschritt über ihre eigenen selektorbasierten ClusterIP-Services.
  - Erhalte ursprüngliche Workload-, Service- und Richtlinienidentitäten, alle vorgegebenen Richtliniendaten und unveränderlichen Anwendungsimages.

  Prüfungen beobachten aktuellen Zustand, laufenden Verbraucherfortschritt und begrenzte CFS-Messungen. Sampler und Health-Probes verbrauchen Quota; dies belegt weder ein Produktions-Latenz-SLO noch unterbrechungsfreie Verfügbarkeit.
debrief: Das Entfernen von Serverarbeit ließ echte Verbrauchernachfrage bestehen, die Quota verbrauchte. Die aktuelle
  Richtlinie erreicht nun beide aktiven Prozesse; Bedienung und Fortschritt bleiben im ursprünglichen Budget erhalten.
stages.0.brief: Die frische Workstation-Messung hält den Grenzwert ein; beide ursprünglichen Verbraucher nutzen
  die aktuelle Taktung und liefern weiter wachsenden Routenfortschritt.
stages.0.objectives.0.text: Die aufgezeichnete Ausgangsprobe enthält mindestens zehn gedrosselte Perioden.
stages.0.objectives.1.text: Deployment `board` behält genau eine Replik.
stages.0.objectives.2.text: Der board-Container behält CPU-Anforderung und CPU-Limit von `50m`, Speicheranforderung
  von `8Mi` und Speicherlimit von `32Mi`.
stages.0.objectives.3.text: Tatsächliche Servermessung und Antwort erfüllen den Vertrag bei erhaltenen ursprünglichen
  Ressourcen, Images und aktuellen Richtliniendaten.
stages.0.objectives.4.text: Deployment `board` hat eine bereite Replik.
stages.0.objectives.5.text: Die frische Workstation-Messung hält den Grenzwert ein; beide ursprünglichen Verbraucher
  nutzen die aktuelle Taktung und liefern weiter wachsenden Routenfortschritt.
stages.0.objectives.6.text: HTTP von Deployment `board` an `http://board:8080` liefert `north-94`.
hints.0.text: Eine Quota kann durch Arbeit im Server oder durch echte eingehende Nachfrage erschöpft werden. Ein
  ruhiger Server nach dem Stoppen eines erforderlichen Verbrauchers belegt nicht den vollständigen Bedienungsvertrag.
hints.1.text: |-
  Vergleiche `performance-contract.json`, laufende Befehle und Ressourcen, Richtlinie und wirksame Verbrauchereingaben, `/sys/fs/cgroup/cpu.stat` des bedienenden Containers worker, Ereignisse, Logs und Fortschrittsdatensätze. Trenne Messaufwand, nützliche Anfragen und andere Arbeit.

  Suche den vorgeschriebenen cgroup-Zähler und das Intervall im Leistungsvertrag. Vergleiche die Anfragenbearbeitung des laufenden Containers `worker` mit der Policy-Referenz und dem Fortschritt jedes Verbrauchers.
hints.2.text: |-
  Prüfe `bash measure.sh`, das unabhängige Serverergebnis, Rollout und jede Fortschrittsschnittstelle. Erwartet werden höchstens `5` neue gedrosselte Perioden, `north-94`, erhaltene Identitäten und Budget sowie wachsende Datensätze bei aktueller Richtlinientaktung.

  Führe das Messskript aus und erfasse dieselbe bedienende cgroup unabhängig. Die zweisekündige Messung läuft ohne Fortschrittsabfragen. Erwarte ein Delta von `0` bis `5` und `north-94` vom Produzenten. Vergleiche bei beiden Verbrauchern die aktive Policy und prüfe, ob der zweite Wert `sequence` größer ist.

  ```sh
  bash measure.sh
  kubectl exec deployment/board -c worker -- sh -ec '
    read_counter() {
      while read -r key value rest; do
        if test "$key" = nr_throttled; then printf "%s\n" "$value"; return; fi
      done < /sys/fs/cgroup/cpu.stat
      return 1
    }
    before=$(read_counter)
    sleep 2
    after=$(read_counter)
    test "$after" -ge "$before"
    printf "%s\n" "$((after-before))"
  '
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl get configmap poll-policy -o json | jq .data
  for name in scan-a scan-b; do
    kubectl rollout status "deployment/$name" --timeout=10s
    kubectl exec "deployment/$name" -c worker -- printenv POLL_DELAY POLICY_ID
  done
  progress() {
    for name in scan-a scan-b; do
      kubectl exec "deployment/$name" -c worker -- wget -qO- -T 3 "http://$name:8080/progress.json" |
        jq --arg name "$name" '{consumer:$name,sequence,route,delay,policy_id}'
    done
  }
  progress; sleep 2.2; progress
  ```
phrases.0: Ich habe CPU throttling gemessen, bevor ich die Kapazität geändert habe.
phrases.1: Ich habe unnötige Arbeit entfernt, anstatt das Symptom zu vergrößern.
phrases.2: Ich habe die Ressource limits beibehalten und ein nützliches Verhalten von HTTP überprüft.
questions.0.points.0: NEIN; Der Container CPU limit wird unabhängig durchgesetzt.
questions.0.points.1: Vergleichen Sie die Workload-Anforderungen requests, limits und cgroup counters.
questions.0.prompt: Verhindert der Ersatzknoten CPU den Container throttling?
questions.1.points.0: Die Skalierung einer fehlerhaften Schleife vervielfacht die Verschwendung und kann die Ursache
  verschleiern.
questions.1.points.1: Überprüfen Sie die Nutzarbeit und ein begrenztes Messintervall.
questions.1.prompt: Warum eine Diagnose durchführen, bevor Replikate hinzugefügt werden?
diagnostics.performance_baseline: Diese Bedingung liest initial-throttled als eingefrorenen Ausgangswert, keine aktuelle CPU-Probe. Fehlende, nicht numerische oder unter 10 liegende Werte belegen das Anfangssymptom nicht; prüfen Sie die gelieferten Fakten statt die Messung zum Verbergen aktueller Drosselung umzuschreiben. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-frozen-baseline)
diagnostics.performance_replicas: Skalieren von board verändert die vorgegebene Kapazität statt unnötige Arbeit zu entfernen. Erhalten Sie replicas gleich 1 und reparieren Sie Leerlaufschleife und Verbraucher-cadence. Auch API- oder JSON-Prüffehler lassen die Bedingung scheitern. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-single-producer)
diagnostics.performance_ready: Der erhaltene board hat den Rollout möglicherweise nicht abgeschlossen oder scheitert nach Änderungen an HTTP readiness. Prüfen Sie Ereignisse, Logs und Rollout des vorhandenen Pods; status.readyReplicas muss 1 sein. Fehlender Status oder API-/JSON-Fehler scheitern ebenfalls. [Ursache und Prüfung](guides#guide=kubernetes-20&section=bounded-demand-ready-producer)
diagnostics.performance_http: Gestoppte Bedienung senkt möglicherweise CPU-Verbrauch, verliert aber die benötigte Antwort. Vom board-worker muss der board-Service north-94 liefern; exec-, HTTP-Fehler oder ein anderer Inhalt scheitern am ursprünglichen Wertvergleich. Erhalten Sie HTTP-Arbeit und entfernen Sie nur die unnötige Schleife. [Ursache und Prüfung](guides#guide=kubernetes-10&section=bounded-demand-actual-serving-response)
diagnostics.probe_0_2: Höhere board-Limits verbergen die Diagnose statt das Budget zu erhalten. Der worker muss CPU request und limit entsprechend 50m, memory request 8Mi und limit 32Mi behalten; ungültige oder fehlende Mengen und Beobachtungsfehler erzeugen denselben Fallback. Unterstützte äquivalente Mengenschreibweisen sind zulässig. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-retain-resource-budget)
diagnostics.performance_sample: Die native worker-Probe kann in zwei Sekunden mehr als 5 neue Drosselungsperioden, eine fehlende Dienstantwort oder einen Befehlsfehler zeigen. Das separate worksheet kann fehlen, fehlschlagen oder einen nicht numerischen beziehungsweise zu hohen Wert liefern. Entfernen Sie die Schleife und übertragen Sie positive cadence an beide aktiven Verbraucher; lesen Sie den Zähler in einem exec ohne zusätzlichen Reader-Aufwand im 50m-worker. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-fresh-throttling-and-serving)
diagnostics.performance_identity: Löschen und Neuerstellen von Workload, Service oder poll-policy erhält Namen, ändert aber UIDs. Reparieren Sie die sieben Originalobjekte vor Ort; Deployment-, Service- und Policy-Identitäten sind eingefroren. Auch Lesefehler melden diesen Marker; prüfen Sie API-Zugriff vor der Annahme eines Ersatzobjekts. [Ursache und Prüfung](guides#guide=kubernetes-20&section=bounded-demand-retain-original-object-identities)
diagnostics.performance_image: Ein anderes board-worker-Image ersetzt die Anwendung statt ihren Bedarf zu reparieren. Erhalten Sie die eingefrorene Referenz oder eine akzeptierte digestgleiche Referenz und ändern Sie stattdessen unnötige Befehlsarbeit. Diese Imageprüfung gilt für board und friert nicht zusätzlich jedes Verbraucherimage ein. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-retain-producer-image)
diagnostics.performance_policy: Geänderte POLL_DELAY oder POLICY_ID in poll-policy können Übereinstimmung mit einer abgeschwächten Policy vortäuschen. Erhalten Sie alle ursprünglich gelieferten data-Einträge; zusätzliche Einträge allein werden nicht abgewiesen. Die eingefrorene Verzögerung muss zudem eine endliche positive ASCII-Dezimalzahl sein; fehlgeschlagene ConfigMap-Abfragen nutzen denselben Marker. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-retain-positive-current-policy)
diagnostics.performance_consumer_scan_a: Ein Verbraucher startet mit POLL_DELAY=0 und erzeugt übermäßigen Bedarf bis zur Änderung seiner Prozessumgebung. Erhalten Sie scan-a und scan-b mit je einer bereiten Replik, abgeschlossenem Rollout und eigenen passenden ClusterIP-Services auf TCP 8080. Effektive POLL_DELAY muss numerisch der positiven Policy entsprechen und POLICY_ID exakt stimmen; ein ConfigMap-Edit aktualisiert keine Prozessumgebung. CLI-Fehler verwenden denselben Verbrauchermarker. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_consumer_scan_b: Ein Verbraucher startet mit POLL_DELAY=0 und erzeugt übermäßigen Bedarf bis zur Änderung seiner Prozessumgebung. Erhalten Sie scan-a und scan-b mit je einer bereiten Replik, abgeschlossenem Rollout und eigenen passenden ClusterIP-Services auf TCP 8080. Effektive POLL_DELAY muss numerisch der positiven Policy entsprechen und POLICY_ID exakt stimmen; ein ConfigMap-Edit aktualisiert keine Prozessumgebung. CLI-Fehler verwenden denselben Verbrauchermarker. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_progress_scan_a: Gestoppte Verbraucher oder eine veraltete Fortschrittsdatei senken Bedarf ohne nützliche Arbeit zu belegen. Jeder Verbraucher muss über seinen Service einen Datensatz mit nicht negativer ganzzahliger sequence, route north-94, aktueller Policy-ID und numerisch gleicher positiver Verzögerung liefern. Bei zwei Beobachtungen im Abstand von 2.2 Sekunden muss sequence steigen. HTTP-/exec-Fehler nutzen diesen Marker; die Abfrage läuft im Verbraucher außerhalb des gemessenen Produzentenbudgets. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)
diagnostics.performance_progress_scan_b: Gestoppte Verbraucher oder eine veraltete Fortschrittsdatei senken Bedarf ohne nützliche Arbeit zu belegen. Jeder Verbraucher muss über seinen Service einen Datensatz mit nicht negativer ganzzahliger sequence, route north-94, aktueller Policy-ID und numerisch gleicher positiver Verzögerung liefern. Bei zwei Beobachtungen im Abstand von 2.2 Sekunden muss sequence steigen. HTTP-/exec-Fehler nutzen diesen Marker; die Abfrage läuft im Verbraucher außerhalb des gemessenen Produzentenbudgets. [Ursache und Prüfung](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)
diagnostics.probe_0_3: Native Probe und Dienstantwort bestanden, doch fehlende Fakten, ungültiges JSON, unerwartete Objektformen oder Python-/Helper-Start können den Identitätsobserver vor einem benannten Ergebnis beenden. Prüfen Sie Originalvertrag und API-Dokumente; abgefangene CLI-Fehler nutzen identity oder policy, frühere Marker unterdrücken den Fallback. [Ursache und Prüfung](guides#guide=kubernetes-20&section=bounded-demand-server-observation-fallback)
diagnostics.probe_0_5: Das worksheet bestand, doch fehlende Fakten, ungültiges JSON, unerwartete Workload-/Service-Strukturen oder Python-/Helper-Start können den Verbraucherobserver ohne Marker beenden. Prüfen Sie tatsächliche Dokumente und Fortschrittsinterfaces; gewöhnliche Verbraucher-/HTTP-Fehler haben eigene Marker, frühere Marker unterdrücken den Fallback. [Ursache und Prüfung](guides#guide=kubernetes-20&section=bounded-demand-consumer-observation-fallback)
