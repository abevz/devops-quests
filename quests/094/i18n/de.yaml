title: Leistung
brief: 'Eine einzelne board-Replik bedient HTTP, verschwendet jedoch ihr 50m CPU-Budget auf einem zufälligen
  Hintergrund busy loop. Überprüfen Sie /sys/fs/cgroup/cpu.stat mithilfe von measure.sh und des Deployment-Befehls.
  Entfernen Sie nur busy loop und behalten Sie ein Replikat, den HTTP-Inhalt und die genauen CPU/memory-Anforderungen
  und -Grenzwerte bei. Die eingefrorene Erstprobe erfasst tatsächlich mindestens zehn throttled periods.
  Der Sampler liest beide counters innerhalb eines exec; seine eigene Arbeit und health probes kann noch
  einige CPU quota ausgeben. Das letzte Zwei-Sekunden-Sample darf höchstens fünf neue throttled periods
  anzeigen. Hierbei handelt es sich um eine CPU-Drosselungsdiagnose, nicht um einen generischen Latenz-Benchmark.
  Das Hinzufügen von Replikaten oder das Erhöhen von Grenzwerten verbirgt die Ursache.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `board.json`, `service.json`, `measure.sh`,
  `initial-throttled`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.'
debrief: Durch das Entfernen verschwendeter Arbeit wurde throttling innerhalb des ursprünglichen Ressourcenbudgets
  reduziert. Ein Sampler und health checks verbrauchen auch quota; Bei dieser begrenzten Lehrmessung handelt
  es sich nicht um eine production-Latenz SLO.
stages.0.brief: Ändern Sie nur diese Bucht.
stages.0.objectives.0.text: Die eingefrorene Probe `/run/dq/facts/0/initial-throttled` enthält mindestens
  10 gedrosselte Perioden.
stages.0.objectives.1.text: 'Deployment `board`: `spec.replicas=1`.'
stages.0.objectives.2.text: 'Deployment `board`: `containers[0]` — `resources={requests:{cpu:"50m",memory:"8Mi"},limits:{cpu:"50m",memory:"32Mi"}}`.'
stages.0.objectives.3.text: 'Deployment `board`: `containers[0]` — `command=["sh","-c","mkdir -p /tmp/site;
  printf \"%s\\n\" \"north-94\" > /tmp/site/index.html; exec httpd -f -p 8080 -h /tmp/site"]`.'
stages.0.objectives.4.text: 'Deployment `board`: `status.readyReplicas` = `1`.'
stages.0.objectives.5.text: Die Zwei-Sekunden-Probe `bash measure.sh` zeigt höchstens 5 neu gedrosselte
  Perioden.
stages.0.objectives.6.text: HTTP von Deployment `board` an `http://board:8080` liefert `north-94`.
hints.0.text: CPU limits kann ausführbare Arbeit drosseln, selbst wenn der Knoten über Ersatz-CPU verfügt.
hints.1.text: Trennen Sie nützliche Servierarbeit vom zufälligen Hintergrundprozess.
hints.2.text: Entfernen Sie die Schleife und vergleichen Sie ein neues "cpu.stat"-Intervall, ohne Replikate
  oder Grenzwerte zu ändern.
phrases.0: Ich habe CPU throttling gemessen, bevor ich die Kapazität geändert habe.
phrases.1: Ich habe unnötige Arbeit entfernt, anstatt das Symptom zu vergrößern.
phrases.2: Ich habe die Ressource limits beibehalten und ein nützliches Verhalten von HTTP überprüft.
questions.0.points.0: NEIN; Der Container CPU limit wird unabhängig durchgesetzt.
questions.0.points.1: Vergleichen Sie die Workload-Anforderungen requests, limits und cgroup counters.
questions.0.prompt: Verhindert der Ersatzknoten CPU den Container throttling?
questions.1.points.0: Die Skalierung einer fehlerhaften Schleife vervielfacht die Verschwendung und kann
  die Ursache verschleiern.
questions.1.points.1: Überprüfen Sie die Nutzarbeit und ein begrenztes Messintervall.
questions.1.prompt: Warum eine Diagnose durchführen, bevor Replikate hinzugefügt werden?
