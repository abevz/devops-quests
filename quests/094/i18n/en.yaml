title: Performance
brief: |
  The HTTP workload shows CPU throttling even during a quiet interval. Restore the required serving behavior within the existing resource budget.

  Work in `~/quest` on the workstation. Supplied inputs: `board.json`, `service.json`, `measure.sh`.

  **Requirements:**
  - Inside container `worker` of Deployment `board`, HTTP to `http://board:8080` returns `north-94`.
  - The frozen initial sample on the workstation records at least ten throttled periods:
    - `/run/dq/facts/0/initial-throttled`
  - Deployment `board` keeps exactly one replica, and that replica is ready.
  - Inside Deployment `board`, container `worker` retains these resource settings:
    - CPU request: `50m`
    - CPU limit: `50m`
    - Memory request: `8Mi`
    - Memory limit: `32Mi`
  - Its command still serves `north-94` without the background busy loop.
  - From `~/quest` on the workstation, the two-second `bash measure.sh` sample reports at most five newly throttled periods.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — The service consumer receives `north-94`.
  - `kubectl get deployment board -o yaml` — Exactly one replica is ready; resource settings match Requirements and the serving command has no background busy loop.
  - The frozen initial count is at least `10`; the fresh two-second count is at most `5`.

    ```sh
    cat /run/dq/facts/0/initial-throttled
    bash measure.sh
    ```

  This measures CPU throttling, not generic latency; the sampler and health probes can still consume CPU quota.
debrief: Removing wasted work reduced throttling within the original resource budget.
  A sampler and health checks also consume quota; this bounded teaching measurement
  is not a production latency SLO.
stages.0.brief: |
  Keep one ready replica and the original resource budget while reducing measured throttling.
stages.0.objectives.0.text: The recorded initial sample contains at least ten throttled periods.
stages.0.objectives.1.text: Deployment `board` keeps exactly one replica.
stages.0.objectives.2.text: The board container keeps CPU request and limit at `50m`, memory request at
  `8Mi`, and memory limit at `32Mi`.
stages.0.objectives.3.text: The board container command still serves `north-94` without the background
  busy loop.
stages.0.objectives.4.text: Deployment `board` has one ready replica.
stages.0.objectives.5.text: The two-second `bash measure.sh` sample is at most 5 newly throttled periods.
stages.0.objectives.6.text: HTTP from Deployment `board` to `http://board:8080` returns `north-94`.
hints.0.text: CPU limits can throttle runnable work even when the node has spare CPU.
hints.1.text: Separate useful serving work from the accidental background process.
hints.2.text: |
  Inspect the Deployment command and /sys/fs/cgroup/cpu.stat inside container worker of Deployment board. Remove only the accidental background busy loop without changing replicas or limits; compare a fresh cpu.stat interval. The supplied measure.sh reads both counters within one exec so separate sampler processes do not spend extra quota between readings.
phrases.0: I measured CPU throttling before changing capacity.
phrases.1: I removed unnecessary work instead of scaling the symptom.
phrases.2: I retained resource limits and verified useful HTTP behavior.
questions.0.points.0: No; the container CPU limit is enforced independently.
questions.0.points.1: Compare workload demand, requests, limits and cgroup counters.
questions.0.prompt: Does spare node CPU prevent container throttling?
questions.1.points.0: Scaling a faulty loop multiplies waste and can hide the cause.
questions.1.points.1: Verify useful work and a bounded measurement interval.
questions.1.prompt: Why diagnose before adding replicas?
