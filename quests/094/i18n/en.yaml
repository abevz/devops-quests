title: Performance
brief: 'A single board replica serves HTTP but wastes its 50m CPU budget on an accidental background busy
  loop. Inspect /sys/fs/cgroup/cpu.stat through measure.sh and the Deployment command. Remove only the
  busy loop, keeping one replica, the HTTP content and the exact CPU/memory requests and limits. The frozen
  initial sample records at least ten actually throttled periods. The sampler reads both counters within
  one exec; its own work and health probes can still spend some CPU quota. The final two-second sample
  must show at most five newly throttled periods. This is a CPU-throttling diagnosis, not a generic latency
  benchmark; adding replicas or raising limits hides the cause.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`, `measure.sh`,
  `initial-throttled`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The runaway loop is removed, one replica keeps its resource budget, actual
  throttling falls and HTTP still returns north-94.'
debrief: Removing wasted work reduced throttling within the original resource budget. A sampler and health
  checks also consume quota; this bounded teaching measurement is not a production latency SLO.
