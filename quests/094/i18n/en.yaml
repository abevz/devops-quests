hints.0.text: CPU limits can throttle runnable work even when the node has spare CPU.
hints.1.text: 'Separate useful serving work from the accidental background process.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl exec deployment/board -c worker -- cat /sys/fs/cgroup/cpu.stat

  ```'
hints.2.text: 'Inspect the Deployment command and /sys/fs/cgroup/cpu.stat inside container worker of Deployment
  board. Remove only the accidental background busy loop without changing replicas or limits; compare a fresh
  cpu.stat interval. The supplied measure.sh reads both counters within one exec so separate sampler processes
  do not spend extra quota between readings.


  Verify the observed result:


  ```sh

  bash measure.sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Expect at most 5 newly throttled periods, one ready replica and HTTP response north-94, without raising the
  supplied resource budget.


  Supplied constraints and details: The board container command still serves `north-94` without the background
  busy loop. The two-second `bash measure.sh` sample is at most 5 newly throttled periods.'
phrases.0: I measured CPU throttling before changing capacity.
phrases.1: I removed unnecessary work instead of scaling the symptom.
phrases.2: I retained resource limits and verified useful HTTP behavior.
questions.0.points.0: No; the container CPU limit is enforced independently.
questions.0.points.1: Compare workload demand, requests, limits and cgroup counters.
questions.0.prompt: Does spare node CPU prevent container throttling?
questions.1.points.0: Scaling a faulty loop multiplies waste and can hide the cause.
questions.1.points.1: Verify useful work and a bounded measurement interval.
questions.1.prompt: Why diagnose before adding replicas?
diagnostics.probe_0_2: 'The current inputs could not verify this objective: The board container keeps CPU request
  and limit at `50m`, memory request at `8Mi`, and memory limit at `32Mi`.'
