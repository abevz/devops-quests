title: Performance
brief: |-
  The serving workload exceeds its bounded CPU sampling target while its consumers remain active. Restore the required serving behavior and current consumer operation within the original server budget.

  Work on the workstation in `~/quest` with `performance-contract.json`. The workstation worksheet to produce is `~/quest/measure.sh`; inspect live workloads and the supplied polling policy in the namespace.

  **Requirements:**
  - Keep the recorded initial sample with at least ten throttled periods, Deployment `board` with exactly one ready replica, and its CPU request/limit `50m`, memory request `8Mi` and memory limit `32Mi`.
  - The actual serving-container sample meets the contract, and HTTP from Deployment `board` to `http://board:8080` returns `north-94`.
  - The workstation worksheet reports at most `5` newly throttled periods in a fresh two-second sample. Both supplied consumers have one updated ready replica, use the current policy inputs, and continue advancing progress for the required route through their own selector-based ClusterIP Services.
  - Retain original workload, Service and policy identities, every supplied policy data entry and the supplied immutable application images.

  Checks observe current state, live consumer progress and bounded CFS samples. Samplers and health probes consume quota; these observations do not establish a production latency SLO or uninterrupted availability.
debrief: Removing server work alone left real consumer demand consuming the quota. The current consumer policy now
  reaches both active processes; serving and progress remain correct inside the original budget.
stages.0.brief: The fresh workstation sample meets the threshold; both original consumers use the current cadence
  and continue advancing route progress.
stages.0.objectives.0.text: The recorded initial sample contains at least ten throttled periods.
stages.0.objectives.1.text: Deployment `board` keeps exactly one replica.
stages.0.objectives.2.text: The board container keeps CPU request and limit at `50m`, memory request at `8Mi`, and
  memory limit at `32Mi`.
stages.0.objectives.3.text: The actual server sample and response meet the contract while original resources, images
  and current policy data are retained.
stages.0.objectives.4.text: Deployment `board` has one ready replica.
stages.0.objectives.5.text: The fresh workstation sample meets the threshold; both original consumers use the current
  cadence and continue advancing route progress.
stages.0.objectives.6.text: HTTP from Deployment `board` to `http://board:8080` returns `north-94`.
hints.0.text: A quota can be exhausted by work inside a server or by real incoming demand. A quiet server obtained
  by stopping a required consumer does not demonstrate the complete serving contract.
hints.1.text: |-
  Compare `performance-contract.json`, live commands/resources, policy and effective consumer inputs, `/sys/fs/cgroup/cpu.stat` in the serving worker, events/logs and consumer progress records. Separate sampling overhead, useful requests and other work.

  Locate the required cgroup counter and interval in the performance contract. Compare the live `worker`’s request handling with the policy reference and progress reported by each consumer.
hints.2.text: |-
  Verify `bash measure.sh`, the independent server result, rollout and each declared progress interface. Expect at most `5` newly throttled periods, `north-94`, retained identities/budget and advancing consumer records at the current policy cadence.

  Run the worksheet and sample the same serving cgroup independently, with no progress probes during the two-second sample. Expect a delta from `0` to `5` and `north-94` from the producer. For both consumers, match the live policy references and verify that the second progress `sequence` is larger.

  ```sh
  bash measure.sh
  kubectl exec deployment/board -c worker -- sh -ec '
    read_counter() {
      while read -r key value rest; do
        if test "$key" = nr_throttled; then printf "%s\n" "$value"; return; fi
      done < /sys/fs/cgroup/cpu.stat
      return 1
    }
    before=$(read_counter)
    sleep 2
    after=$(read_counter)
    test "$after" -ge "$before"
    printf "%s\n" "$((after-before))"
  '
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl get configmap poll-policy -o json | jq .data
  for name in scan-a scan-b; do
    kubectl rollout status "deployment/$name" --timeout=10s
    kubectl exec "deployment/$name" -c worker -- printenv POLL_DELAY POLICY_ID
  done
  progress() {
    for name in scan-a scan-b; do
      kubectl exec "deployment/$name" -c worker -- wget -qO- -T 3 "http://$name:8080/progress.json" |
        jq --arg name "$name" '{consumer:$name,sequence,route,delay,policy_id}'
    done
  }
  progress; sleep 2.2; progress
  ```
phrases.0: I measured CPU throttling before changing capacity.
phrases.1: I removed unnecessary work instead of scaling the symptom.
phrases.2: I retained resource limits and verified useful HTTP behavior.
questions.0.points.0: No; the container CPU limit is enforced independently.
questions.0.points.1: Compare workload demand, requests, limits and cgroup counters.
questions.0.prompt: Does spare node CPU prevent container throttling?
questions.1.points.0: Scaling a faulty loop multiplies waste and can hide the cause.
questions.1.points.1: Verify useful work and a bounded measurement interval.
questions.1.prompt: Why diagnose before adding replicas?
diagnostics.performance_baseline: This condition reads the frozen initial-throttled receipt, not the current CPU sample. A missing or nonnumeric receipt, or a value below 10, cannot establish the supplied initial symptom; inspect the provided facts rather than rewriting the measurement to hide current throttling. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-frozen-baseline)
diagnostics.performance_replicas: Scaling board changes the supplied capacity instead of removing waste. Keep its desired replicas equal to 1 and repair the busy loop and consumer cadence. An API read or JSON predicate failure also makes this condition fail. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-single-producer)
diagnostics.performance_ready: The retained board may not have finished rollout or may fail its HTTP readiness probe after an edit. Inspect the existing Pod events, logs and rollout; status.readyReplicas must equal 1. Missing status or failed API/JSON observation also fails this condition. [Cause and check](guides#guide=kubernetes-20&section=bounded-demand-ready-producer)
diagnostics.performance_http: Stopping serving work can reduce CPU use while losing the required response. From the board worker, the board Service must still return north-94; a failed exec, HTTP request or different body fails the original value comparison. Restore useful HTTP work while removing only the unnecessary loop. [Cause and check](guides#guide=kubernetes-10&section=bounded-demand-actual-serving-response)
diagnostics.probe_0_2: Increasing the board limits hides the diagnosis rather than preserving the supplied budget. Its worker must retain CPU request and limit equivalent to 50m, memory request 8Mi and memory limit 32Mi; malformed or missing quantities and failed workload observation also produce this fallback. Equivalent supported quantity spellings are accepted. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-retain-resource-budget)
diagnostics.performance_sample: The native worker sample may still see over 5 newly throttled periods in two seconds, a failed serving response, or a failed observation command. The separate worksheet may be absent, fail or print a nonnumeric/excessive sample. Remove the supplied busy loop and propagate the positive policy cadence to both active consumers; measure the counter within one exec to avoid adding reader overhead to the 50m worker. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-fresh-throttling-and-serving)
diagnostics.performance_identity: Deleting and recreating a workload, Service or poll-policy can preserve names but change its UID. Repair the seven original objects in place; the deployment, Service and policy identities are frozen. Failed object reads also use this marker, so inspect API access before concluding that an object was replaced. [Cause and check](guides#guide=kubernetes-20&section=bounded-demand-retain-original-object-identities)
diagnostics.performance_image: Replacing the board worker image changes the supplied application rather than repairing its demand. Retain its frozen image reference or an accepted digest-equivalent reference and edit the unnecessary command work instead. This image predicate applies to board; it does not add an image freeze for every consumer. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-retain-producer-image)
diagnostics.performance_policy: Changing POLL_DELAY or POLICY_ID in poll-policy can make a consumer appear consistent with a weakened policy. Retain every original supplied data entry; extra entries alone are not rejected. The frozen delay must also decode as a finite positive ASCII decimal, and a failed ConfigMap observation uses this marker. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-retain-positive-current-policy)
diagnostics.performance_consumer_scan_a: A consumer initially runs with POLL_DELAY=0 and keeps generating excess demand until its running environment changes. Keep scan-a and scan-b at one ready replica with completed rollout and their own selecting ClusterIP Services on TCP 8080. Verify effective POLL_DELAY is numerically equal to the positive supplied policy and POLICY_ID matches exactly; a ConfigMap edit alone does not refresh process environment. CLI observation failures use the same consumer marker. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_consumer_scan_b: A consumer initially runs with POLL_DELAY=0 and keeps generating excess demand until its running environment changes. Keep scan-a and scan-b at one ready replica with completed rollout and their own selecting ClusterIP Services on TCP 8080. Verify effective POLL_DELAY is numerically equal to the positive supplied policy and POLICY_ID matches exactly; a ConfigMap edit alone does not refresh process environment. CLI observation failures use the same consumer marker. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_progress_scan_a: 'Stopping consumers or leaving a stale cached progress file can lower demand without proving useful work. Each consumer must serve a valid progress record through its own Service: nonnegative integer sequence, north-94 route, current policy ID and numerically equivalent positive delay. Two observations 2.2 seconds apart must advance sequence. HTTP/exec failures use this marker; each request runs inside that consumer, outside the measured producer CPU budget. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)'
diagnostics.performance_progress_scan_b: 'Stopping consumers or leaving a stale cached progress file can lower demand without proving useful work. Each consumer must serve a valid progress record through its own Service: nonnegative integer sequence, north-94 route, current policy ID and numerically equivalent positive delay. Two observations 2.2 seconds apart must advance sequence. HTTP/exec failures use this marker; each request runs inside that consumer, outside the measured producer CPU budget. [Cause and check](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)'
diagnostics.probe_0_3: The native sample and serving gate passed, but the identity observer may fail on missing frozen inputs, invalid JSON, an unexpected object shape or Python/helper startup before a named result. Inspect the original contract and current API documents; caught CLI errors already use identity or policy markers, and earlier named failures suppress this fallback. [Cause and check](guides#guide=kubernetes-20&section=bounded-demand-server-observation-fallback)
diagnostics.probe_0_5: The worksheet gate passed, but the consumer observer may fail on missing frozen inputs, invalid JSON, unexpected workload/Service structures or Python/helper startup without emitting a marker. Inspect the actual documents and current progress interfaces; ordinary consumer/HTTP failures already have their host-specific markers, and prior markers suppress this fallback. [Cause and check](guides#guide=kubernetes-20&section=bounded-demand-consumer-observation-fallback)
