title: Performance
brief: 'The HTTP workload shows CPU throttling even during a quiet interval. Restore the required serving behavior
  within the existing resource budget.


  Work in `~/quest` on the workstation. Supplied inputs: `board.yaml`, `service.yaml`, `measure.sh`.


  **Requirements:**

  - The recorded initial sample contains at least ten throttled periods.

  - Deployment `board` keeps exactly one replica.

  - The board container keeps CPU request and limit at `50m`, memory request at `8Mi`, and memory limit at
  `32Mi`.

  - The serving workload delivers `north-94` without unrelated CPU work.

  - Deployment `board` has one ready replica.

  - A fresh two-second sample on the workstation records at most `5` newly throttled periods.

  - HTTP from Deployment `board` to `http://board:8080` returns `north-94`.


  This measures CPU throttling, not generic latency; the sampler and health probes can still consume CPU quota.

  '
debrief: Removing wasted work reduced throttling within the original resource budget. A sampler and health
  checks also consume quota; this bounded teaching measurement is not a production latency SLO.
stages.0.brief: Keep one ready replica and the original resource budget while reducing measured throttling.
