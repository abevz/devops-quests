title: Actuación
brief: |-
  El workload servidor supera el objetivo de muestreo CPU acotado mientras sus consumidores siguen activos. Restablece la respuesta requerida y el funcionamiento actual de consumidores dentro del presupuesto original.

  Trabaja en la estación en `~/quest` con `performance-contract.json`. El archivo de medición a producir es `~/quest/measure.sh`; inspecciona workloads activos y la política de sondeo suministrada en el namespace.

  **Requisitos:**
  - Conserva la muestra inicial de al menos diez períodos throttled, exactamente una réplica lista del Deployment `board`, su CPU request/limit `50m`, memory request `8Mi` y memory limit `32Mi`.
  - La medición real del contenedor servidor cumple el contrato, y HTTP desde Deployment `board` a `http://board:8080` devuelve `north-94`.
  - El archivo de medición de la estación informa como máximo `5` nuevos períodos throttled en una muestra reciente de dos segundos. Ambos consumidores tienen una réplica actualizada lista, usan las entradas actuales de la política y continúan avanzando el progreso de la ruta mediante sus propios Services ClusterIP con selector.
  - Conserva identidades originales de workloads, Services y política, cada dato suministrado y las imágenes inmutables.

  Las comprobaciones observan estado actual, progreso activo y muestras CFS acotadas. Los muestreadores y health probes consumen cuota; estas observaciones no establecen un SLO de latencia de producción ni disponibilidad ininterrumpida.
debrief: Eliminar trabajo del servidor dejó demanda real de consumidores consumiendo cuota. La política actual llega
  ahora a ambos procesos activos; el servicio y el progreso se mantienen dentro del presupuesto original.
stages.0.brief: La muestra reciente de la estación cumple el umbral; ambos consumidores originales usan la cadencia
  actual y continúan avanzando el progreso de ruta.
stages.0.objectives.0.text: La muestra inicial registrada contiene al menos diez periodos de throttling.
stages.0.objectives.1.text: El Deployment `board` mantiene exactamente una réplica.
stages.0.objectives.2.text: El contenedor board conserva la solicitud y el límite de CPU en `50m`, la solicitud
  de memoria en `8Mi` y el límite de memoria en `32Mi`.
stages.0.objectives.3.text: La medición y respuesta reales del servidor cumplen el contrato conservando recursos,
  imágenes y datos actuales de política.
stages.0.objectives.4.text: El Deployment `board` tiene una réplica lista.
stages.0.objectives.5.text: La muestra reciente de la estación cumple el umbral; ambos consumidores originales usan
  la cadencia actual y continúan avanzando el progreso de ruta.
stages.0.objectives.6.text: HTTP desde Deployment `board` a `http://board:8080` devuelve `north-94`.
hints.0.text: La cuota puede agotarse por trabajo dentro del servidor o por demanda entrante real. Un servidor tranquilo
  obtenido deteniendo un consumidor requerido no demuestra el contrato completo.
hints.1.text: |-
  Compara `performance-contract.json`, comandos y recursos activos, política y entradas efectivas, `/sys/fs/cgroup/cpu.stat` del worker servidor, eventos, logs y registros de progreso. Separa el coste de medir, las peticiones útiles y otro trabajo.

  Localiza el contador cgroup requerido y el intervalo en el contrato de rendimiento. Contrasta la gestión de solicitudes del `worker` con la referencia de política y el progreso de cada consumidor.
hints.2.text: |-
  Verifica `bash measure.sh`, el resultado independiente del servidor, rollout y cada interfaz de progreso. Espera como máximo `5` nuevos períodos throttled, `north-94`, identidades y presupuesto conservados y registros crecientes con la cadencia actual.

  Ejecuta la hoja y mide de forma independiente la misma cgroup de servicio, sin consultar progreso durante los dos segundos del muestreo. Espera un incremento de `0` a `5` y `north-94` del productor. En ambos consumidores, contrasta la política activa y verifica que el segundo `sequence` sea mayor.

  ```sh
  bash measure.sh
  kubectl exec deployment/board -c worker -- sh -ec '
    read_counter() {
      while read -r key value rest; do
        if test "$key" = nr_throttled; then printf "%s\n" "$value"; return; fi
      done < /sys/fs/cgroup/cpu.stat
      return 1
    }
    before=$(read_counter)
    sleep 2
    after=$(read_counter)
    test "$after" -ge "$before"
    printf "%s\n" "$((after-before))"
  '
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl get configmap poll-policy -o json | jq .data
  for name in scan-a scan-b; do
    kubectl rollout status "deployment/$name" --timeout=10s
    kubectl exec "deployment/$name" -c worker -- printenv POLL_DELAY POLICY_ID
  done
  progress() {
    for name in scan-a scan-b; do
      kubectl exec "deployment/$name" -c worker -- wget -qO- -T 3 "http://$name:8080/progress.json" |
        jq --arg name "$name" '{consumer:$name,sequence,route,delay,policy_id}'
    done
  }
  progress; sleep 2.2; progress
  ```
phrases.0: Medí CPU throttling antes de cambiar la capacidad.
phrases.1: Eliminé el trabajo innecesario en lugar de escalar el síntoma.
phrases.2: Conservé el recurso limits y verifiqué el comportamiento útil de HTTP.
questions.0.points.0: No; el contenedor CPU limit se aplica de forma independiente.
questions.0.points.1: Compare la demanda de carga de trabajo, requests, limits y cgroup counters.
questions.0.prompt: ¿El nodo de repuesto CPU impide el contenedor throttling?
questions.1.points.0: Escalar un bucle defectuoso multiplica el desperdicio y puede ocultar la causa.
questions.1.points.1: Verificar trabajo útil y un intervalo de medición acotado.
questions.1.prompt: ¿Por qué diagnosticar antes de agregar réplicas?
diagnostics.performance_baseline: Esta condición lee initial-throttled congelado, no la muestra CPU actual. Ausencia, valor no numérico o inferior a 10 no acredita el síntoma inicial; inspeccione datos suministrados sin reescribir medición para ocultar throttling actual. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-frozen-baseline)
diagnostics.performance_replicas: Escalar board cambia capacidad suministrada en vez de eliminar trabajo inútil. Mantenga replicas igual a 1 y repare bucle activo y cadence de consumidores. Errores API o de predicado JSON también fallan. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-single-producer)
diagnostics.performance_ready: board conservado puede no terminar rollout o fallar HTTP readiness tras cambios. Inspeccione eventos, registros y rollout del Pod existente; status.readyReplicas debe ser 1. Estado ausente o error API/JSON también falla. [Causa y comprobación](guides#guide=kubernetes-20&section=bounded-demand-ready-producer)
diagnostics.performance_http: "Detener servicio reduce CPU pero pierde la respuesta necesaria. Desde worker de board, su Service board debe devolver north-94; error exec, HTTP o cuerpo distinto falla la comparación original. Conserve HTTP útil eliminando solo bucle innecesario. [Causa y comprobación](guides#guide=kubernetes-10&section=bounded-demand-actual-serving-response)"
diagnostics.probe_0_2: Aumentar límites de board oculta el diagnóstico sin conservar presupuesto. Worker debe retener CPU request y limit equivalentes a 50m, memory request 8Mi y limit 32Mi; cantidades inválidas/ausentes o fallo de observación también dan fallback. Se aceptan notaciones equivalentes admitidas. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-retain-resource-budget)
diagnostics.performance_sample: "La muestra nativa del worker puede superar 5 períodos nuevos de throttling en dos segundos, perder respuesta o fallar al observar. Worksheet separado puede faltar, fallar o producir valor no numérico/excesivo. Quite bucle activo y propague cadence positivo a ambos consumidores activos; mida contador dentro de un exec sin añadir coste reader al worker 50m. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-fresh-throttling-and-serving)"
diagnostics.performance_identity: Eliminar y recrear workload, Service o poll-policy conserva nombres pero cambia UID. Repare los siete objetos originales en sitio; identidades deployment, Service y policy están congeladas. Fallos de lectura también dan este marcador; compruebe API antes de concluir sustitución. [Causa y comprobación](guides#guide=kubernetes-20&section=bounded-demand-retain-original-object-identities)
diagnostics.performance_image: Cambiar imagen worker de board sustituye aplicación en vez de reparar demanda. Conserve referencia congelada o equivalente admitida por digest y cambie trabajo inútil del comando. Este predicado afecta board y no congela adicionalmente cada imagen consumidora. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-retain-producer-image)
diagnostics.performance_policy: Cambiar POLL_DELAY o POLICY_ID en poll-policy puede aparentar coherencia con política debilitada. Conserve cada entrada original data; entradas extra por sí solas no se rechazan. El retardo congelado debe ser decimal ASCII finito positivo; un fallo al leer ConfigMap usa este marcador. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-retain-positive-current-policy)
diagnostics.performance_consumer_scan_a: El consumidor inicia con POLL_DELAY=0 y genera demanda excesiva hasta cambiar entorno del proceso. Mantenga scan-a y scan-b con una réplica lista, rollout completo y sus ClusterIP Service selectivos en TCP 8080. Verifique POLL_DELAY efectivo numéricamente igual a política positiva y POLICY_ID exacto; editar ConfigMap no actualiza entorno. Fallos CLI usan el mismo marcador consumidor. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_consumer_scan_b: El consumidor inicia con POLL_DELAY=0 y genera demanda excesiva hasta cambiar entorno del proceso. Mantenga scan-a y scan-b con una réplica lista, rollout completo y sus ClusterIP Service selectivos en TCP 8080. Verifique POLL_DELAY efectivo numéricamente igual a política positiva y POLICY_ID exacto; editar ConfigMap no actualiza entorno. Fallos CLI usan el mismo marcador consumidor. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-active-consumer-policy-adoption)
diagnostics.performance_progress_scan_a: Parar consumidores o conservar progreso obsoleto reduce demanda sin probar trabajo útil. Cada consumidor debe servir por su Service un registro con sequence entero no negativo, route north-94, policy ID actual y retardo positivo numéricamente equivalente. Dos observaciones separadas 2.2 segundos deben aumentar sequence. Fallos HTTP/exec usan este marcador; la petición corre dentro del consumidor fuera del CPU medido del productor. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)
diagnostics.performance_progress_scan_b: Parar consumidores o conservar progreso obsoleto reduce demanda sin probar trabajo útil. Cada consumidor debe servir por su Service un registro con sequence entero no negativo, route north-94, policy ID actual y retardo positivo numéricamente equivalente. Dos observaciones separadas 2.2 segundos deben aumentar sequence. Fallos HTTP/exec usan este marcador; la petición corre dentro del consumidor fuera del CPU medido del productor. [Causa y comprobación](guides#guide=kubernetes-9&section=bounded-demand-advancing-consumer-progress)
diagnostics.probe_0_3: La muestra nativa y respuesta pasaron, pero el observador puede fallar por hechos ausentes, JSON inválido, estructura inesperada o arranque Python/helper antes de nombrar resultado. Inspeccione contrato original y API; errores CLI capturados usan identity o policy y marcadores previos suprimen fallback. [Causa y comprobación](guides#guide=kubernetes-20&section=bounded-demand-server-observation-fallback)
diagnostics.probe_0_5: Worksheet pasó, pero el observador puede fallar por hechos ausentes, JSON inválido, estructuras workload/Service inesperadas o arranque Python/helper sin marcador. Inspeccione documentos reales e interfaces progress; fallos ordinarios consumidor/HTTP ya tienen marcadores propios y los previos suprimen fallback. [Causa y comprobación](guides#guide=kubernetes-20&section=bounded-demand-consumer-observation-fallback)
