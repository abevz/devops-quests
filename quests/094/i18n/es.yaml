  solicitud y el límite de CPU en `50m`, la solicitud de memoria en `8Mi` y el límite de memoria en `32Mi`.'
diagnostics.probe_0_3: La medición y respuesta reales del servidor cumplen el contrato conservando recursos, imágenes
  y datos actuales de política.
diagnostics.probe_0_5: La muestra reciente de la estación cumple el umbral; ambos consumidores originales usan la
  cadencia actual y continúan avanzando el progreso de ruta.
diagnostics.performance_sample: La muestra original o el resultado real de servicio incumple el contrato acotado.
diagnostics.performance_identity: Conserva los UID originales de workloads, Services y política.
