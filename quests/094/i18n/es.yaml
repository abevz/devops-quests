title: Actuación
brief: |-
  El workload servidor supera el objetivo de muestreo CPU acotado mientras sus consumidores siguen activos. Restablece la respuesta requerida y el funcionamiento actual de consumidores dentro del presupuesto original.

  Trabaja en la estación en `~/quest` con `performance-contract.json`. El archivo de medición a producir es `~/quest/measure.sh`; inspecciona workloads activos y la política de sondeo suministrada en el namespace.

  **Requisitos:**
  - Conserva la muestra inicial de al menos diez períodos throttled, exactamente una réplica lista del Deployment `board`, su CPU request/limit `50m`, memory request `8Mi` y memory limit `32Mi`.
  - La medición real del contenedor servidor cumple el contrato, y HTTP desde Deployment `board` a `http://board:8080` devuelve `north-94`.
  - El archivo de medición de la estación informa como máximo `5` nuevos períodos throttled en una muestra reciente de dos segundos. Ambos consumidores tienen una réplica actualizada lista, usan las entradas actuales de la política y continúan avanzando el progreso de la ruta mediante sus propios Services ClusterIP con selector.
  - Conserva identidades originales de workloads, Services y política, cada dato suministrado y las imágenes inmutables.

  Las comprobaciones observan estado actual, progreso activo y muestras CFS acotadas. Los muestreadores y health probes consumen cuota; estas observaciones no establecen un SLO de latencia de producción ni disponibilidad ininterrumpida.
debrief: Eliminar trabajo del servidor dejó demanda real de consumidores consumiendo cuota. La política actual llega
  ahora a ambos procesos activos; el servicio y el progreso se mantienen dentro del presupuesto original.
stages.0.brief: La muestra reciente de la estación cumple el umbral; ambos consumidores originales usan la cadencia
  actual y continúan avanzando el progreso de ruta.
stages.0.objectives.0.text: La muestra inicial registrada contiene al menos diez periodos de throttling.
stages.0.objectives.1.text: El Deployment `board` mantiene exactamente una réplica.
stages.0.objectives.2.text: El contenedor board conserva la solicitud y el límite de CPU en `50m`, la solicitud
  de memoria en `8Mi` y el límite de memoria en `32Mi`.
stages.0.objectives.3.text: La medición y respuesta reales del servidor cumplen el contrato conservando recursos,
  imágenes y datos actuales de política.
stages.0.objectives.4.text: El Deployment `board` tiene una réplica lista.
stages.0.objectives.5.text: La muestra reciente de la estación cumple el umbral; ambos consumidores originales usan
  la cadencia actual y continúan avanzando el progreso de ruta.
stages.0.objectives.6.text: HTTP desde Deployment `board` a `http://board:8080` devuelve `north-94`.
hints.0.text: La cuota puede agotarse por trabajo dentro del servidor o por demanda entrante real. Un servidor tranquilo
  obtenido deteniendo un consumidor requerido no demuestra el contrato completo.
hints.1.text: Compara `performance-contract.json`, comandos y recursos activos, política y entradas efectivas, `/sys/fs/cgroup/cpu.stat`
  del worker servidor, eventos, logs y registros de progreso. Separa el coste de medir, las peticiones útiles y
  otro trabajo.
hints.2.text: Construye el archivo de medición desde el contador cgroup e intervalo declarados, recupera el servicio
  útil y propaga las entradas actuales a ambos consumidores activos. Verifica `bash measure.sh`, el resultado independiente
  del servidor, rollout y cada interfaz de progreso. Espera como máximo `5` nuevos períodos throttled, `north-94`,
  identidades y presupuesto conservados y registros crecientes con la cadencia actual.
phrases.0: Medí CPU throttling antes de cambiar la capacidad.
phrases.1: Eliminé el trabajo innecesario en lugar de escalar el síntoma.
phrases.2: Conservé el recurso limits y verifiqué el comportamiento útil de HTTP.
questions.0.points.0: No; el contenedor CPU limit se aplica de forma independiente.
questions.0.points.1: Compare la demanda de carga de trabajo, requests, limits y cgroup counters.
questions.0.prompt: ¿El nodo de repuesto CPU impide el contenedor throttling?
questions.1.points.0: Escalar un bucle defectuoso multiplica el desperdicio y puede ocultar la causa.
questions.1.points.1: Verificar trabajo útil y un intervalo de medición acotado.
questions.1.prompt: ¿Por qué diagnosticar antes de agregar réplicas?
