title: Actuación
brief: 'Una única réplica de board sirve a HTTP pero desperdicia su presupuesto de 50m CPU en un fondo
  accidental busy loop. Inspeccione desde /sys/fs/cgroup/cpu.stat hasta measure.sh y Deployment command.
  Elimine solo el busy loop, manteniendo una réplica, el contenido de HTTP y las solicitudes y límites
  exactos de CPU/memory. La muestra inicial congelada registra al menos diez en realidad throttled periods.
  El muestreador lee ambos counters dentro de un exec; su propio trabajo y health probes todavía puede
  gastar algo de CPU quota. La muestra final de dos segundos debe mostrar como máximo cinco throttled
  periods nuevos. Este es un diagnóstico de limitación de CPU (throttling), no un punto de referencia
  de latencia genérico; agregar réplicas o aumentar los límites oculta la causa.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`,
  `measure.sh`, `initial-throttled`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: se elimina el loop fuera de control, una réplica mantiene su presupuesto
  de recursos, el throttling real cae y el HTTP aún devuelve north-94.'
debrief: La eliminación del trabajo desperdiciado redujo throttling dentro del presupuesto de recursos
  original. Un muestreador y health checks también consumen quota; esta medida de enseñanza acotada no
  es una latencia production SLO.
stages.0.brief: 'Criterios de éxito: se elimina el loop fuera de control, una réplica mantiene su presupuesto
  de recursos, el throttling real cae y el HTTP aún devuelve north-94.'
stages.0.objectives.0.text: Se elimina el loop fuera de control, una réplica mantiene su presupuesto de
  recursos, el throttling real cae y el HTTP aún devuelve north-94.
hints.0.text: Los límites de CPU pueden restringir la ejecución del trabajo listo para ejecutarse (throttling),
  incluso cuando el nodo tiene CPU disponible.
hints.1.text: Separe el trabajo de publicación útil del proceso accidental en segundo plano.
hints.2.text: Elimine el bucle y compare un intervalo cpu.stat nuevo sin cambiar réplicas ni límites.
phrases.0: Medí CPU throttling antes de cambiar la capacidad.
phrases.1: Eliminé el trabajo innecesario en lugar de escalar el síntoma.
phrases.2: Conservé el recurso limits y verifiqué el comportamiento útil de HTTP.
questions.0.points.0: No; el contenedor CPU limit se aplica de forma independiente.
questions.0.points.1: Compare la demanda de carga de trabajo, requests, limits y cgroup counters.
questions.0.prompt: ¿El nodo de repuesto CPU impide el contenedor throttling?
questions.1.points.0: Escalar un bucle defectuoso multiplica el desperdicio y puede ocultar la causa.
questions.1.points.1: Verificar trabajo útil y un intervalo de medición acotado.
questions.1.prompt: ¿Por qué diagnosticar antes de agregar réplicas?
