title: Typy i ekspozycja Service
brief: 'Trzy ścieżki dostępu nie udostępniają uzgodnionej trasy. Przywróć Service, zachowując ich zapisane
  kontrakty.


  Pracuj w `~/quest` na workstation. Dostarczone pliki: `board.yaml`, `client.yaml`, `internal.yaml`, `headless.yaml`,
  `nodeport.yaml`.


  **Wymagania:**

  - Trzy istniejące Service zachowują tożsamości, adresy i porty, w tym oryginalny dostęp wewnętrzny, headless
  i przez węzeł; port węzła pozostaje nie mniejszy niż `30000`.

  - Wszystkie trzy istniejące Service prowadzą wyłącznie do właściwych Podów aplikacji.

  - Z Deployment `client` HTTP przez `board-internal:8080`, `board-headless:8080`, `board-node:8080` i prywatny
  NodePort węzła zwraca `north-106`.

  - Z Deployment `client` odpowiedź A dla `board-headless` zawiera pełny IP Poda.


  Sprawdzane są bieżące wartości, nie historia edycji; nie uczestniczy port VM ani zewnętrzny load balancer.

  '
debrief: Do tej samej aplikacji dotarto przez trzy rzeczywiste mechanizmy Service bez zewnętrznej infrastruktury.
stages.0.brief: Wszystkie trzy prywatne ścieżki dostępu do Service mają zwracać wymaganą trasę.
hints.0.text: Typ Service zmienia ekspozycję, a nie to, które kapsuły pasują do selektora.
hints.1.text: 'Headless DNS zwraca adresy punktów końcowych zamiast wirtualnego Service IP.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat internal.yaml headless.yaml nodeport.yaml

  kubectl get service board-internal board-headless board-node -o yaml

  kubectl get pods -l app=board -o wide

  ```'
hints.2.text: 'Popraw wszystkie selectors, a następnie przetestuj ścieżki nazwy usługi i adresu węzła.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl exec deployment/client -- sh -c ''for name in board-internal board-headless board-node; do wget -qO-
  -T 3 "http://$name:8080"; done''

  node=$(kubectl config view --minify -o json | jq -r ''.clusters[0].cluster.server | sub("^https://";"") |
  split(":")[0]'')

  port=$(kubectl get service board-node -o jsonpath=''{.spec.ports[0].nodePort}'')

  kubectl exec deployment/client -- wget -qO- -T 3 "http://$node:$port"

  kubectl exec deployment/client -- nslookup -type=A "board-headless.$DQ_NAMESPACE.svc.cluster.local."

  ```


  Oczekuj north-106 przez wszystkie trzy nazwy Service i prywatny NodePort; DNS headless zawiera pełny adres
  IP Poda aplikacji.


  Dostarczone ograniczenia i szczegóły: Service `board-internal`, `board-headless` i `board-node` zachowują
  oryginalne tożsamości, adresy i kontrakty portów, z dostępem odpowiednio ClusterIP, headless i NodePort;
  NodePort wynosi co najmniej `30000`. Wszystkie trzy wymagane Service wybierają wyłącznie Pody z etykietą
  `app=board`.'
phrases.0: Oddzieliłem wybór punktu końcowego od ekspozycji usługi.
phrases.1: Porównałem zachowanie wirtualnego IP i headless DNS.
phrases.2: Zweryfikowałem NodePort na prywatnym węźle bez publikowania portu hosta.
questions.0.points.0: Zwykle NodePort zachowuje również ścieżkę ClusterIP Service.
questions.0.points.1: Sprawdź obie ścieżki i ten sam wybrany endpoints.
questions.0.prompt: Czy NodePort zastępuje ścieżkę ClusterIP?
questions.1.points.0: NIE; provider lub sterownik musi to implementować.
questions.1.points.1: W prywatnym laboratorium bez takiego zewnętrznego przydziału adresów pozostaje pending.
questions.1.prompt: Czy sam type LoadBalancer tworzy wszędzie moduł równoważenia obciążenia w chmurze?
