title: Typy i ekspozycja Service
brief: 'Trzy istniejące usługi przedstawiają tę samą board w różny sposób: ClusterIP, headless i NodePort.
  Wszyscy trzej wybierają przestarzały model app label. Napraw tylko ich selectors do app: board, zachowując
  ich typy, porty i przydzielone adresy. Sprawdź DNS i HTTP poprzez każdą nazwę; dotrzeć również do NodePort
  na prywatnym adresie węzła, uzyskanym z dostarczonego kubeconfig server. Na stacji roboczej lub w VM
  nie opublikowano żadnego portu. Usługa LoadBalancer bez implementacji modułu równoważenia obciążenia
  pozostałaby w toku; nie jest używana chmura provider.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `client.json`,
  `internal.json`, `headless.json`, `nodeport.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: ClusterIP i headless DNS docierają do board, NodePort działa na węźle prywatnym,
  a każdy Service zachowuje zamierzony typ ekspozycji.'
debrief: To samo zastosowanie osiągnięto poprzez trzy rzeczywiste mechanizmy Service bez zewnętrznej infrastruktury.
stages.0.brief: 'Kryteria sukcesu: ClusterIP i headless DNS docierają do board, NodePort działa na węźle
  prywatnym, a każdy Service zachowuje zamierzony typ ekspozycji.'
stages.0.objectives.0.text: ClusterIP i headless DNS docierają do board, NodePort działa na węźle prywatnym,
  a każdy Service zachowuje zamierzony typ ekspozycji.
hints.0.text: Typ Service zmienia ekspozycję, a nie to, które kapsuły pasują do selektora.
hints.1.text: Headless DNS zwraca adresy punktów końcowych zamiast wirtualnego Service IP.
hints.2.text: Popraw wszystkie selectors, a następnie przetestuj ścieżki nazwy usługi i adresu węzła.
phrases.0: Oddzieliłem wybór punktu końcowego od ekspozycji usługi.
phrases.1: Porównałem zachowanie wirtualnego IP i headless DNS.
phrases.2: Zweryfikowałem NodePort na prywatnym węźle bez publikowania portu hosta.
questions.0.points.0: Zwykle NodePort zachowuje również ścieżkę ClusterIP Service.
questions.0.points.1: Sprawdź obie ścieżki i ten sam wybrany endpoints.
questions.0.prompt: Czy NodePort zastępuje ścieżkę ClusterIP?
questions.1.points.0: NIE; provider lub sterownik musi to implementować.
questions.1.points.1: W prywatnym laboratorium bez takiego zewnętrznego przydziału adresów pozostaje pending.
questions.1.prompt: Czy sam type LoadBalancer tworzy wszędzie moduł równoważenia obciążenia w chmurze?
