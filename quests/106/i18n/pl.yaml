title: Typy i ekspozycja Service
brief: 'Pracuj w `~/quest`; sprawdź `board.json`, `client.json`, `internal.json`, `headless.json`, `nodeport.json` i `service-contracts.json`.
  Trzy Service udostępniają ten sam board przez ClusterIP, headless DNS i NodePort. Napraw każdy selektor dokładnie na `app:
  board`; zachowaj UID, typ, IP klastra i uporządkowane porty każdego Service zgodne z `service-contracts.json`. Wewnętrzny
  Service to nie-headless ClusterIP, headless ma `clusterIP: None`, a NodePort wynosi co najmniej 30000.


  Z Deploymentu client każda nazwa Service na porcie 8080 oraz prywatny adres węzła kind z NodePort muszą zwracać `north-106`;
  adres węzła pobierz z dostarczonego kubeconfig. Odpowiedź A dla headless musi zawierać pełne IP Poda board. Uzgadnianie
  DNS i endpointów może potrwać, więc poczekaj i spróbuj ponownie. Kontrole obserwują bieżące wartości, nie historię zmian
  pól. Nie używa się portu VM ani zewnętrznego load balancera.'
debrief: Do tej samej aplikacji dotarto przez trzy rzeczywiste mechanizmy Service bez zewnętrznej infrastruktury.
stages.0.brief: Kontrakty trzech Service, selektory, odpowiedzi nazw i prywatnego węzła oraz odpowiedź headless DNS odpowiadają
  opisowi.
stages.0.objectives.0.text: Kontrakty trzech Service, selektory, odpowiedzi nazw i prywatnego węzła oraz odpowiedź headless
  DNS odpowiadają opisowi.
hints.0.text: Typ Service zmienia ekspozycję, a nie to, które kapsuły pasują do selektora.
hints.1.text: Headless DNS zwraca adresy punktów końcowych zamiast wirtualnego Service IP.
hints.2.text: Popraw wszystkie selectors, a następnie przetestuj ścieżki nazwy usługi i adresu węzła.
phrases.0: Oddzieliłem wybór punktu końcowego od ekspozycji usługi.
phrases.1: Porównałem zachowanie wirtualnego IP i headless DNS.
phrases.2: Zweryfikowałem NodePort na prywatnym węźle bez publikowania portu hosta.
questions.0.points.0: Zwykle NodePort zachowuje również ścieżkę ClusterIP Service.
questions.0.points.1: Sprawdź obie ścieżki i ten sam wybrany endpoints.
questions.0.prompt: Czy NodePort zastępuje ścieżkę ClusterIP?
questions.1.points.0: NIE; provider lub sterownik musi to implementować.
questions.1.points.1: W prywatnym laboratorium bez takiego zewnętrznego przydziału adresów pozostaje pending.
questions.1.prompt: Czy sam type LoadBalancer tworzy wszędzie moduł równoważenia obciążenia w chmurze?
