title: Typy i ekspozycja Service
brief: "Trzy ścieżki dostępu nie udostępniają uzgodnionej trasy. Przywróć Service, zachowując ich zapisane kontrakty.\n\
  \nPracuj w `~/quest` na workstation. Dostarczone pliki: `board.json`, `client.json`, `internal.json`, `headless.json`,\
  \ `nodeport.json`, `service-contracts.json`.\n\n**Wymagania:**\n- Kontrakty dostępu Service:\n  - Service `board-internal`,\
  \ `board-headless` i `board-node` zachowują oryginalne tożsamości, adresy i kontrakty portów, z dostępem odpowiednio\
  \ ClusterIP, headless i NodePort.\n  - NodePort wynosi co najmniej `30000`.\n  - Wiążący kontrakt Service to `/run/dq/facts/0/service-contracts.json`\
  \ na workstation: zachowaj każdy UID, IP klastra i kolejność portów; `board-internal` to zwykły `ClusterIP`, `board-headless`\
  \ ma IP klastra `None`, a `board-node` to `NodePort`.\n- Wszystkie trzy wymagane Service wybierają wyłącznie Pody\
  \ z etykietą `app=board`.\n- Z Deployment `client` HTTP przez `board-internal:8080`, `board-headless:8080`, `board-node:8080`\
  \ i prywatny NodePort węzła zwraca `north-106`.\n- Z Deployment `client` odpowiedź A dla `board-headless` zawiera\
  \ pełny IP Poda.\n\n**Sprawdź samodzielnie przed Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest`\
  \ na workstation; `kubectl exec` obserwuje kontener wskazanego obciążenia.\n- `kubectl exec deployment/client\
  \ -- sh -c 'for name in board-internal board-headless board-node; do wget -qO- -T 3 \"http://$name:8080\"; done'`\
  \ — Każde żądanie po nazwie Service zwraca `north-106`.\n- Prywatny NodePort zwraca `north-106`; odpowiedź DNS\
  \ headless zawiera pełny IP Poda.\n\n  ```sh\n  node=$(kubectl config view --minify -o json | jq -r '.clusters[0].cluster.server\
  \ | sub(\"^https://\";\"\") | split(\":\")[0]')\n  port=$(kubectl get service board-node -o jsonpath='{.spec.ports[0].nodePort}')\n\
  \  kubectl exec deployment/client -- wget -qO- -T 3 \"http://$node:$port\"\n  kubectl exec deployment/client --\
  \ nslookup -type=A \"board-headless.$DQ_NAMESPACE.svc.cluster.local.\"\n  kubectl get pods -l app=board -o wide\n\
  \  ```\n- Ustawienia, tożsamość i status odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get service board-internal\
  \ board-headless board-node -o yaml\n  cat /run/dq/facts/0/service-contracts.json\n  ```\n\nSprawdzane są bieżące\
  \ wartości, nie historia edycji; nie uczestniczy port VM ani zewnętrzny load balancer.\n"
debrief: Do tej samej aplikacji dotarto przez trzy rzeczywiste mechanizmy Service bez zewnętrznej infrastruktury.
stages.0.brief: 'Wszystkie trzy prywatne ścieżki dostępu do Service mają zwracać wymaganą trasę.

  '
hints.0.text: Typ Service zmienia ekspozycję, a nie to, które kapsuły pasują do selektora.
hints.1.text: Headless DNS zwraca adresy punktów końcowych zamiast wirtualnego Service IP.
hints.2.text: Popraw wszystkie selectors, a następnie przetestuj ścieżki nazwy usługi i adresu węzła.
phrases.0: Oddzieliłem wybór punktu końcowego od ekspozycji usługi.
phrases.1: Porównałem zachowanie wirtualnego IP i headless DNS.
phrases.2: Zweryfikowałem NodePort na prywatnym węźle bez publikowania portu hosta.
questions.0.points.0: Zwykle NodePort zachowuje również ścieżkę ClusterIP Service.
questions.0.points.1: Sprawdź obie ścieżki i ten sam wybrany endpoints.
questions.0.prompt: Czy NodePort zastępuje ścieżkę ClusterIP?
questions.1.points.0: NIE; provider lub sterownik musi to implementować.
questions.1.points.1: W prywatnym laboratorium bez takiego zewnętrznego przydziału adresów pozostaje pending.
questions.1.prompt: Czy sam type LoadBalancer tworzy wszędzie moduł równoważenia obciążenia w chmurze?
