diagnostics.contract_board_internal_uid: Ponowne utworzenie Service pod tą samą nazwą trwale zmienia UID. Porównaj bieżący obiekt z zamrożonym kontraktem przed zmianą selektora. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_headless_uid: Ponowne utworzenie Service pod tą samą nazwą trwale zmienia UID. Porównaj bieżący obiekt z zamrożonym kontraktem przed zmianą selektora. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_node_uid: Ponowne utworzenie Service pod tą samą nazwą trwale zmienia UID. Porównaj bieżący obiekt z zamrożonym kontraktem przed zmianą selektora. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_internal_type: Zmiana typu Service może zmienić dostęp klientów. Porównaj typ wskazanego obiektu z kontraktem i popraw selektor bez zmiany typu. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_headless_type: Zmiana typu Service może zmienić dostęp klientów. Porównaj typ wskazanego obiektu z kontraktem i popraw selektor bez zmiany typu. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_node_type: Zmiana typu Service może zmienić dostęp klientów. Porównaj typ wskazanego obiektu z kontraktem i popraw selektor bez zmiany typu. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_internal_clusterip: Odtworzenie lub zmiana typu mogły zmienić główny clusterIP. Porównaj wskazaną wartość z kontraktem, w tym None dla Service headless. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_headless_clusterip: Odtworzenie lub zmiana typu mogły zmienić główny clusterIP. Porównaj wskazaną wartość z kontraktem, w tym None dla Service headless. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_node_clusterip: Odtworzenie lub zmiana typu mogły zmienić główny clusterIP. Porównaj wskazaną wartość z kontraktem, w tym None dla Service headless. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_internal_clusterips: Odtworzenie lub zmiana rodziny adresów mogły zmienić listę. Porównaj całe clusterIPs z pierwotną listą w tej samej kolejności. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_headless_clusterips: Odtworzenie lub zmiana rodziny adresów mogły zmienić listę. Porównaj całe clusterIPs z pierwotną listą w tej samej kolejności. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_node_clusterips: Odtworzenie lub zmiana rodziny adresów mogły zmienić listę. Porównaj całe clusterIPs z pierwotną listą w tej samej kolejności. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_internal_ports: Zmiana portu, protokołu, celu lub NodePort może naruszyć kontrakt. Porównaj ustawienia każdego portu i sprawdź spójne rozwiązanie nazwanych celów w bieżących podach board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_headless_ports: Zmiana portu, protokołu, celu lub NodePort może naruszyć kontrakt. Porównaj ustawienia każdego portu i sprawdź spójne rozwiązanie nazwanych celów w bieżących podach board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_node_ports: Zmiana portu, protokołu, celu lub NodePort może naruszyć kontrakt. Porównaj ustawienia każdego portu i sprawdź spójne rozwiązanie nazwanych celów w bieżących podach board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.counts: Może brakować jednego z trzech wskazanych Service albo zapisany wykaz może być niepełny lub niedostępny. Sprawdź board-internal, board-headless, board-node i liczbę wpisów w service-contracts.json. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-contract-count)
diagnostics.internal_type: Wewnętrzny Service mógł zmienić typ. Sprawdź board-internal i zachowaj ClusterIP do dostępu w klastrze. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-internal-service-type)
diagnostics.internal_ip: Wewnętrzny Service może nie mieć adresu wirtualnego. Sprawdź, czy clusterIP board-internal jest niepusty i różni się od None. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-internal-virtual-address)
diagnostics.headless_ip: Service headless mógł otrzymać wirtualny ClusterIP. Zachowaj clusterIP równy None, aby DNS mógł zwracać adresy endpointów. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-headless-service-address)
diagnostics.node_type: Service dostępny przez węzeł mógł stracić typ NodePort. Sprawdź board-node przed diagnozowaniem żądania przez węzeł. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-nodeport-service-type)
diagnostics.node_port: Nazwany port http może nie istnieć, występować wielokrotnie albo nie mieć nodePort. Sprawdź jeden wpis http w board-node z całkowitym nodePort co najmniej 30000. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-allocated-http-nodeport)
diagnostics.internal_selector: Stary lub zbyt szeroki selektor może pomijać bieżące pody board albo obejmować obcy pod. Porównaj selektor z etykietami i zachowaj app=board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.headless_selector: Stary lub zbyt szeroki selektor może pomijać bieżące pody board albo obejmować obcy pod. Porównaj selektor z etykietami i zachowaj app=board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.node_selector: Stary lub zbyt szeroki selektor może pomijać bieżące pody board albo obejmować obcy pod. Porównaj selektor z etykietami i zachowaj app=board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.http_board_internal: Nazwa Service może się rozwiązywać bez dostępnego endpointu board albo trafiać do poda z inną odpowiedzią. Odpytaj wskazaną nazwę z client na 8080 i porównaj z north-106. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_headless: Nazwa Service może się rozwiązywać bez dostępnego endpointu board albo trafiać do poda z inną odpowiedzią. Odpytaj wskazaną nazwę z client na 8080 i porównaj z north-106. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_node: Nazwa Service może się rozwiązywać bez dostępnego endpointu board albo trafiać do poda z inną odpowiedzią. Odpytaj wskazaną nazwę z client na 8080 i porównaj z north-106. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.node_http: Ścieżka wewnątrz klastra może działać, choć adres węzła lub HTTP NodePort nie działa. Sprawdź przydzielony NodePort i odpytaj go z client przez podany adres węzła. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-private-nodeport-http)
diagnostics.headless_dns: Service headless może nie wybierać gotowego endpointu board lub DNS może zwracać inny adres. Porównaj odpowiedź A z oczekiwanym IP poda board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-headless-pod-dns)
diagnostics.probe_0_0: Kontrola kontraktu może przerwać działanie przed porównaniem pól przez błąd procesu lub wejścia. Sprawdź narzędzia i dostęp do Service oraz pierwotnego zapisu. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-contract-observer-input)
diagnostics.probe_0_1: Kontrola selektorów może zatrzymać się przed wskazaniem Service. Sprawdź narzędzia Python i dostęp do bieżących podów oraz Service. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q106-service-selector-observer-input)
