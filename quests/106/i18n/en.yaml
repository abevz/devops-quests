title: Service types and exposure
brief: 'Three access paths are not providing the agreed route. Restore the Services while preserving their
  recorded contracts.


  Work in `~/quest` on the workstation. Supplied files: `board.yaml`, `client.yaml`, `internal.yaml`, `headless.yaml`,
  `nodeport.yaml`.


  **Requirements:**

  - The three existing Services keep their identities, addresses and port contracts, including their original
  internal, headless and node-level exposure; the node-level port remains at least `30000`.

  - All three existing Services reach only the intended application Pods.

  - From Deployment `client`, HTTP through `board-internal:8080`, `board-headless:8080`, `board-node:8080`
  and the private node NodePort returns `north-106`.

  - From Deployment `client`, the `board-headless` A answer includes the complete Pod IP.


  Checks observe current values rather than edit history; no VM port or external load balancer is involved.

  '
debrief: The same application was reached through three real Service mechanisms without external infrastructure.
stages.0.brief: All three private Service access paths must return the required route.
hints.0.text: A Service type changes exposure, not which Pods match a selector.
hints.1.text: 'Headless DNS returns endpoint addresses instead of a virtual Service IP.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat internal.yaml headless.yaml nodeport.yaml

  kubectl get service board-internal board-headless board-node -o yaml

  kubectl get pods -l app=board -o wide

  ```'
hints.2.text: 'Correct all selectors, then test both service-name and node-address paths.


  Verify the observed result:


  ```sh

  kubectl exec deployment/client -- sh -c ''for name in board-internal board-headless board-node; do wget -qO-
  -T 3 "http://$name:8080"; done''

  node=$(kubectl config view --minify -o json | jq -r ''.clusters[0].cluster.server | sub("^https://";"") |
  split(":")[0]'')

  port=$(kubectl get service board-node -o jsonpath=''{.spec.ports[0].nodePort}'')

  kubectl exec deployment/client -- wget -qO- -T 3 "http://$node:$port"

  kubectl exec deployment/client -- nslookup -type=A "board-headless.$DQ_NAMESPACE.svc.cluster.local."

  ```


  Expect north-106 through all three Service names and the private NodePort; headless DNS includes the complete
  application Pod IP.


  Supplied constraints and details: Services `board-internal`, `board-headless` and `board-node` preserve their
  original identities, addresses and port contracts, with ClusterIP, headless and NodePort exposure respectively;
  the NodePort is at least `30000`. All three required Services select only Pods labelled `app=board`.'
phrases.0: I separated endpoint selection from service exposure.
phrases.1: I compared virtual-IP and headless DNS behavior.
phrases.2: I verified NodePort on a private node without publishing a host port.
questions.0.points.0: Normally NodePort also retains a ClusterIP Service path.
questions.0.points.1: Verify both paths and the same selected endpoints.
questions.0.prompt: Does NodePort replace the ClusterIP path?
questions.1.points.0: No; a provider or controller must implement it.
questions.1.points.1: In a private lab without one, external address allocation stays pending.
questions.1.prompt: Does type LoadBalancer itself create a cloud load balancer everywhere?
