title: Service types and exposure
brief: 'Three existing Services expose the same board differently: ClusterIP, headless
  and NodePort. All three select an obsolete app label. Repair only their selectors
  to app: board, retaining their types, ports and allocated addresses. Verify DNS
  and HTTP through each name; also reach the NodePort on the private kind node address,
  obtained from the supplied kubeconfig server. No port is published on the workstation
  or VM. A LoadBalancer service without a load-balancer implementation would remain
  pending; no cloud provider is used.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `client.json`,
  `internal.json`, `headless.json`, `nodeport.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: ClusterIP and headless DNS reach the board, NodePort works
  on the private node, and each Service retains its intended exposure type.'
debrief: The same application was reached through three real Service mechanisms without
  external infrastructure.
stages.0.brief: 'Success criteria: ClusterIP and headless DNS reach the board, NodePort
  works on the private node, and each Service retains its intended exposure type.'
stages.0.objectives.0.text: ClusterIP and headless DNS reach the board, NodePort works
  on the private node, and each Service retains its intended exposure type.
hints.0.text: A Service type changes exposure, not which Pods match a selector.
hints.1.text: Headless DNS returns endpoint addresses instead of a virtual Service
  IP.
hints.2.text: Correct all selectors, then test both service-name and node-address
  paths.
phrases.0: I separated endpoint selection from service exposure.
phrases.1: I compared virtual-IP and headless DNS behavior.
phrases.2: I verified NodePort on a private node without publishing a host port.
questions.0.points.0: Normally NodePort also retains a ClusterIP Service path.
questions.0.points.1: Verify both paths and the same selected endpoints.
questions.0.prompt: Does NodePort replace the ClusterIP path?
questions.1.points.0: No; a provider or controller must implement it.
questions.1.points.1: In a private lab without one, external address allocation stays
  pending.
questions.1.prompt: Does type LoadBalancer itself create a cloud load balancer everywhere?
