stages.0.objectives.1.text: All three existing Services reach only the intended application Pods.
stages.0.objectives.2.text: From Deployment `client`, HTTP through `board-internal:8080`, `board-headless:8080`,
  `board-node:8080` and the private node NodePort returns `north-106`.
stages.0.objectives.3.text: From Deployment `client`, the `board-headless` A answer includes the complete Pod
  IP.
diagnostics.contract_board_internal_uid: Recreating a Service under the same name permanently changes its UID. Compare the live object with the frozen contract before changing its selector. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_headless_uid: Recreating a Service under the same name permanently changes its UID. Compare the live object with the frozen contract before changing its selector. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_node_uid: Recreating a Service under the same name permanently changes its UID. Compare the live object with the frozen contract before changing its selector. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_internal_type: Changing a Service type can change how clients reach it. Compare the affected type with its original contract and adjust selectors without changing type. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_headless_type: Changing a Service type can change how clients reach it. Compare the affected type with its original contract and adjust selectors without changing type. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_node_type: Changing a Service type can change how clients reach it. Compare the affected type with its original contract and adjust selectors without changing type. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_internal_clusterip: A replacement or type change may have altered the Service’s primary clusterIP. Compare the affected value with the frozen contract, including the literal None for the headless Service. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_headless_clusterip: A replacement or type change may have altered the Service’s primary clusterIP. Compare the affected value with the frozen contract, including the literal None for the headless Service. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_node_clusterip: A replacement or type change may have altered the Service’s primary clusterIP. Compare the affected value with the frozen contract, including the literal None for the headless Service. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_internal_clusterips: A replacement or address-family change may have altered the Service address list. Compare the entire clusterIPs list with the frozen list in original order. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_headless_clusterips: A replacement or address-family change may have altered the Service address list. Compare the entire clusterIPs list with the frozen list in original order. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_node_clusterips: A replacement or address-family change may have altered the Service address list. Compare the entire clusterIPs list with the frozen list in original order. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_internal_ports: A changed service port, protocol, target or NodePort can break the original port contract. Compare each tuple and verify that any named target resolves consistently on the current board Pods. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_headless_ports: A changed service port, protocol, target or NodePort can break the original port contract. Compare each tuple and verify that any named target resolves consistently on the current board Pods. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_node_ports: A changed service port, protocol, target or NodePort can break the original port contract. Compare each tuple and verify that any named target resolves consistently on the current board Pods. [Cause and check](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.counts: One of the three named Services may be missing, or the saved inventory may be incomplete or unreadable. Check board-internal, board-headless, board-node and the count in service-contracts.json. [Cause and check](guides#guide=kubernetes-10&section=q106-service-contract-count)
diagnostics.internal_type: The internal Service may have changed type. Inspect board-internal and preserve ClusterIP for in-cluster access. [Cause and check](guides#guide=kubernetes-10&section=q106-internal-service-type)
diagnostics.internal_ip: The internal Service may lack a usable virtual address. Check that board-internal has a nonempty clusterIP other than the headless sentinel None. [Cause and check](guides#guide=kubernetes-10&section=q106-internal-virtual-address)
diagnostics.headless_ip: The headless Service may have acquired a virtual ClusterIP. Keep clusterIP at the literal None so its DNS can return endpoint addresses. [Cause and check](guides#guide=kubernetes-10&section=q106-headless-service-address)
diagnostics.node_type: The node-facing Service may have lost its NodePort type. Inspect board-node before debugging the request through the node. [Cause and check](guides#guide=kubernetes-10&section=q106-nodeport-service-type)
diagnostics.node_port: The named http port may be missing, duplicated or lack an allocated nodePort. Inspect board-node for one http entry with an integer nodePort of at least 30000. [Cause and check](guides#guide=kubernetes-10&section=q106-allocated-http-nodeport)
diagnostics.internal_selector: A stale or overly broad Service selector may miss current board Pods or include an unrelated Pod. Compare the affected selector with real Pod labels and keep app=board. [Cause and check](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.headless_selector: A stale or overly broad Service selector may miss current board Pods or include an unrelated Pod. Compare the affected selector with real Pod labels and keep app=board. [Cause and check](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.node_selector: A stale or overly broad Service selector may miss current board Pods or include an unrelated Pod. Compare the affected selector with real Pod labels and keep app=board. [Cause and check](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.http_board_internal: The Service name may resolve without an available board endpoint or may reach a Pod serving another response. From client, query the affected name on port 8080 and compare with north-106. [Cause and check](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_headless: The Service name may resolve without an available board endpoint or may reach a Pod serving another response. From client, query the affected name on port 8080 and compare with north-106. [Cause and check](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_node: The Service name may resolve without an available board endpoint or may reach a Pod serving another response. From client, query the affected name on port 8080 and compare with north-106. [Cause and check](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.node_http: The internal Service path may work while the private node address or its HTTP NodePort fails. Check the allocated NodePort and request it via the supplied node address from client. [Cause and check](guides#guide=kubernetes-10&section=q106-private-nodeport-http)
diagnostics.headless_dns: The headless Service may select no ready board endpoint or DNS may return a different address. Compare the live A answer with the expected board Pod IP. [Cause and check](guides#guide=kubernetes-10&section=q106-headless-pod-dns)
diagnostics.probe_0_0: The contract observer can stop before comparing fields if its process or inputs fail. Check the local tools and access to the Services and frozen records. [Cause and check](guides#guide=kubernetes-10&section=q106-service-contract-observer-input)
diagnostics.probe_0_1: The selector observer can stop before assigning the failure to a Service. Check local Python tooling and access to live Pods and Services. [Cause and check](guides#guide=kubernetes-10&section=q106-service-selector-observer-input)
