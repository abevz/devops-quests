title: Service types and exposure
brief: "Three access paths are not providing the agreed route. Restore the Services while preserving their recorded\
  \ contracts.\n\nWork in `~/quest` on the workstation. Supplied files: `board.json`, `client.json`, `internal.json`,\
  \ `headless.json`, `nodeport.json`, `service-contracts.json`.\n\n**Requirements:**\n- Service `board-internal`\
  \ keeps its `ClusterIP` exposure, original UID, IPs and ordered ports recorded in `/run/dq/facts/0/service-contracts.json`\
  \ on the workstation.\n- Service `board-internal`:\n  - only Pod selector `app=board`.\n- From `deployment/client`,\
  \ HTTP `http://board-internal:8080` returns `north-106`.\n- Service `board-headless` keeps its `headless` exposure,\
  \ original UID, IPs and ordered ports recorded in `/run/dq/facts/0/service-contracts.json` on the workstation.\n\
  - Service `board-headless`:\n  - only Pod selector `app=board`.\n- From `deployment/client`, HTTP `http://board-headless:8080`\
  \ returns `north-106`.\n- Service `board-node` keeps its `NodePort` exposure, original UID, IPs and ordered ports\
  \ recorded in `/run/dq/facts/0/service-contracts.json` on the workstation.\n- Service `board-node`:\n  - only\
  \ Pod selector `app=board`.\n- From `deployment/client`, HTTP `http://board-node:8080` returns `north-106`.\n\
  - The queried trio of required Services and its recorded contract each contain `3` entries.\n- Service `board-node`\
  \ has a NodePort of at least `30000`.\n- From Deployment `client`, the private node address and NodePort return\
  \ `north-106` over HTTP.\n- From Deployment `client`, the `board-headless` A answer includes the complete Pod\
  \ IP.\n\n**Verify yourself before Check & finish:**\nRun these observation commands from `~/quest` on the workstation;\
  \ `kubectl exec` observes the named workload container.\n- `kubectl exec deployment/client -- sh -c 'for name\
  \ in board-internal board-headless board-node; do wget -qO- -T 3 \"http://$name:8080\"; done'` — Each Service-name\
  \ request returns `north-106`.\n- The private NodePort returns `north-106`; the headless DNS answer contains the\
  \ complete Pod IP.\n\n  ```sh\n  node=$(kubectl config view --minify -o json | jq -r '.clusters[0].cluster.server\
  \ | sub(\"^https://\";\"\") | split(\":\")[0]')\n  port=$(kubectl get service board-node -o jsonpath='{.spec.ports[0].nodePort}')\n\
  \  kubectl exec deployment/client -- wget -qO- -T 3 \"http://$node:$port\"\n  kubectl exec deployment/client --\
  \ nslookup -type=A \"board-headless.$DQ_NAMESPACE.svc.cluster.local.\"\n  kubectl get pods -l app=board -o wide\n\
  \  ```\n- Settings, identity and status match Requirements.\n\n  ```sh\n  kubectl get service board-internal board-headless\
  \ board-node -o yaml\n  cat /run/dq/facts/0/service-contracts.json\n  ```\n\nChecks observe current values rather\
  \ than edit history; no VM port or external load balancer is involved.\n"
debrief: The same application was reached through three real Service mechanisms without external infrastructure.
stages.0.brief: 'All three private Service access paths must return the required route.

  '
hints.0.text: A Service type changes exposure, not which Pods match a selector.
hints.1.text: Headless DNS returns endpoint addresses instead of a virtual Service IP.
hints.2.text: Correct all selectors, then test both service-name and node-address paths.
phrases.0: I separated endpoint selection from service exposure.
phrases.1: I compared virtual-IP and headless DNS behavior.
phrases.2: I verified NodePort on a private node without publishing a host port.
questions.0.points.0: Normally NodePort also retains a ClusterIP Service path.
questions.0.points.1: Verify both paths and the same selected endpoints.
questions.0.prompt: Does NodePort replace the ClusterIP path?
questions.1.points.0: No; a provider or controller must implement it.
questions.1.points.1: In a private lab without one, external address allocation stays pending.
questions.1.prompt: Does type LoadBalancer itself create a cloud load balancer everywhere?
