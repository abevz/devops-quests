title: Service types and exposure
brief: 'Work in `~/quest`; inspect `board.json`, `client.json`, `internal.json`, `headless.json`, `nodeport.json` and `service-contracts.json`.
  Three Services expose the same board through ClusterIP, headless DNS and NodePort. Repair each selector to exactly `app:
  board`; keep each Service UID, type, cluster IPs and ordered ports equal to the recorded `service-contracts.json`. The internal
  Service is a non-headless ClusterIP, the headless Service has `clusterIP: None`, and the NodePort is at least 30000.


  From the client, each Service name on port 8080 and the private kind node address plus NodePort must return `north-106`;
  derive the private node address from the supplied kubeconfig. A headless A answer must contain the complete board Pod IP.
  DNS and endpoint reconciliation can take time, so wait and retry. The checks observe current values, not a history of which
  fields changed. No VM port or external load balancer is involved.'
debrief: The same application was reached through three real Service mechanisms without external infrastructure.
stages.0.brief: The three Service contracts, selectors, name and private-node responses, and headless DNS answer match the
  brief.
stages.0.objectives.0.text: The three Service contracts, selectors, name and private-node responses, and headless DNS answer
  match the brief.
hints.0.text: A Service type changes exposure, not which Pods match a selector.
hints.1.text: Headless DNS returns endpoint addresses instead of a virtual Service IP.
hints.2.text: Correct all selectors, then test both service-name and node-address paths.
phrases.0: I separated endpoint selection from service exposure.
phrases.1: I compared virtual-IP and headless DNS behavior.
phrases.2: I verified NodePort on a private node without publishing a host port.
questions.0.points.0: Normally NodePort also retains a ClusterIP Service path.
questions.0.points.1: Verify both paths and the same selected endpoints.
questions.0.prompt: Does NodePort replace the ClusterIP path?
questions.1.points.0: No; a provider or controller must implement it.
questions.1.points.1: In a private lab without one, external address allocation stays pending.
questions.1.prompt: Does type LoadBalancer itself create a cloud load balancer everywhere?
