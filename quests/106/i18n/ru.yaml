title: Типы Service и доступ
brief: 'Работайте в `~/quest`; изучите `board.json`, `client.json`, `internal.json`, `headless.json`, `nodeport.json` и `service-contracts.json`.
  Три Service открывают один board через ClusterIP, headless DNS и NodePort. Исправьте каждый селектор ровно на `app: board`;
  сохраните UID, тип, IP кластера и порядок портов каждого Service согласно `service-contracts.json`. Внутренний Service —
  не headless ClusterIP, у headless задано `clusterIP: None`, а NodePort не меньше 30000.


  Из клиента каждое имя Service на порту 8080 и приватный адрес узла kind с NodePort должны возвращать `north-106`; получите
  адрес узла из выданного kubeconfig. Ответ headless A должен содержать полный IP Pod board. Согласование DNS и endpoint может
  занять время, поэтому подождите и повторите. Проверки наблюдают текущие значения, но не историю изменений полей. Порт VM
  и внешний балансировщик не используются.'
debrief: Одно приложение доступно через три реальных механизма Service без внешней инфраструктуры.
stages.0.brief: Контракты трёх Service, селекторы, ответы имён и приватного узла, а также ответ headless DNS соответствуют
  описанию.
stages.0.objectives.0.text: Контракты трёх Service, селекторы, ответы имён и приватного узла, а также ответ headless DNS соответствуют
  описанию.
hints.0.text: Тип Service меняет способ доступа, а не правило выбора Pod.
hints.1.text: Headless DNS возвращает адреса endpoints вместо виртуального IP Service.
hints.2.text: Исправьте все selectors, затем проверьте путь по имени Service и адресу узла.
phrases.0: Я отделил выбор endpoints от способа доступа к Service.
phrases.1: Я сравнил DNS для virtual IP и headless.
phrases.2: Я проверил NodePort на приватном узле без публикации порта хоста.
questions.0.points.0: Обычно NodePort сохраняет и путь через ClusterIP Service.
questions.0.points.1: Проверяйте оба пути и одни выбранные endpoints.
questions.0.prompt: Заменяет ли NodePort путь через ClusterIP?
questions.1.points.0: 'Нет: нужна реализация provider или контроллера.'
questions.1.points.1: В приватной лаборатории без неё выделение внешнего адреса остаётся pending.
questions.1.prompt: Создаёт ли type LoadBalancer облачный балансировщик в любом кластере?
