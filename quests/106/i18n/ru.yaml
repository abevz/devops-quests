title: Типы Service и доступ
brief: 'Три пути доступа не предоставляют согласованный маршрут. Восстановите Service с сохранением записанных
  контрактов.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `board.yaml`, `client.yaml`, `internal.yaml`,
  `headless.yaml`, `nodeport.yaml`.


  **Требования:**

  - Три существующих Service сохраняют идентичность, адреса и порты, включая исходный внутренний доступ, headless-доступ
  и доступ через узел; порт на узле остаётся не ниже `30000`.

  - Все три существующих Service ведут только к требуемым Pod приложения.

  - Из Deployment `client` HTTP через `board-internal:8080`, `board-headless:8080`, `board-node:8080` и NodePort
  частного узла возвращает `north-106`.

  - Из Deployment `client` A-ответ `board-headless` содержит полный IP Pod.


  Проверка наблюдает текущие значения, а не историю изменений; порт VM или внешний балансировщик не используются.

  '
debrief: Одно приложение доступно через три реальных механизма Service без внешней инфраструктуры.
stages.0.brief: Все три частных пути доступа Service должны возвращать требуемый маршрут.
hints.0.text: Тип Service меняет способ доступа, а не правило выбора Pod.
hints.1.text: 'Headless DNS возвращает адреса endpoints вместо виртуального IP Service.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat internal.yaml headless.yaml nodeport.yaml

  kubectl get service board-internal board-headless board-node -o yaml

  kubectl get pods -l app=board -o wide

  ```'
hints.2.text: 'Исправьте все selectors, затем проверьте путь по имени Service и адресу узла.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl exec deployment/client -- sh -c ''for name in board-internal board-headless board-node; do wget -qO-
  -T 3 "http://$name:8080"; done''

  node=$(kubectl config view --minify -o json | jq -r ''.clusters[0].cluster.server | sub("^https://";"") |
  split(":")[0]'')

  port=$(kubectl get service board-node -o jsonpath=''{.spec.ports[0].nodePort}'')

  kubectl exec deployment/client -- wget -qO- -T 3 "http://$node:$port"

  kubectl exec deployment/client -- nslookup -type=A "board-headless.$DQ_NAMESPACE.svc.cluster.local."

  ```


  Ожидается north-106 через все три имени Service и приватный NodePort; headless DNS включает полный IP Pod
  приложения.


  Поставленные ограничения и подробности: Service `board-internal`, `board-headless` и `board-node` сохраняют
  исходные идентичности, адреса и контракты портов, с доступом ClusterIP, headless и NodePort соответственно;
  NodePort не ниже `30000`. Все три требуемых Service выбирают только Pod с меткой `app=board`.'
phrases.0: Я отделил выбор endpoints от способа доступа к Service.
phrases.1: Я сравнил DNS для virtual IP и headless.
phrases.2: Я проверил NodePort на приватном узле без публикации порта хоста.
questions.0.points.0: Обычно NodePort сохраняет и путь через ClusterIP Service.
questions.0.points.1: Проверяйте оба пути и одни выбранные endpoints.
questions.0.prompt: Заменяет ли NodePort путь через ClusterIP?
questions.1.points.0: 'Нет: нужна реализация provider или контроллера.'
questions.1.points.1: В приватной лаборатории без неё выделение внешнего адреса остаётся pending.
questions.1.prompt: Создаёт ли type LoadBalancer облачный балансировщик в любом кластере?
