title: Типы Service и доступ
brief: 'Три существующих Service предоставляют одно табло разными способами: ClusterIP,
  headless и NodePort. Все выбирают устаревший app label. Исправьте только selectors
  на app: board, сохранив типы, порты и выделенные адреса. Проверьте DNS и HTTP через
  каждое имя; дополнительно вызовите NodePort по приватному адресу kind-узла из server
  выданного kubeconfig. Порт не публикуется на рабочей машине или VM. Без реализации
  балансировщика Service LoadBalancer ожидал бы внешний адрес; облачный provider не
  используется.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `client.json`,
  `internal.json`, `headless.json`, `nodeport.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: DNS ClusterIP и headless ведут к табло, NodePort работает на
  приватном узле, каждый Service сохранил требуемый тип доступа.'
debrief: Одно приложение доступно через три реальных механизма Service без внешней
  инфраструктуры.
stages.0.brief: 'Результат проверки: DNS ClusterIP и headless ведут к табло, NodePort
  работает на приватном узле, каждый Service сохранил требуемый тип доступа.'
stages.0.objectives.0.text: DNS ClusterIP и headless ведут к табло, NodePort работает
  на приватном узле, каждый Service сохранил требуемый тип доступа.
hints.0.text: Тип Service меняет способ доступа, а не правило выбора Pod.
hints.1.text: Headless DNS возвращает адреса endpoints вместо виртуального IP Service.
hints.2.text: Исправьте все selectors, затем проверьте путь по имени Service и адресу
  узла.
phrases.0: Я отделил выбор endpoints от способа доступа к Service.
phrases.1: Я сравнил DNS для virtual IP и headless.
phrases.2: Я проверил NodePort на приватном узле без публикации порта хоста.
questions.0.points.0: Обычно NodePort сохраняет и путь через ClusterIP Service.
questions.0.points.1: Проверяйте оба пути и одни выбранные endpoints.
questions.0.prompt: Заменяет ли NodePort путь через ClusterIP?
questions.1.points.0: 'Нет: нужна реализация provider или контроллера.'
questions.1.points.1: В приватной лаборатории без неё выделение внешнего адреса остаётся
  pending.
questions.1.prompt: Создаёт ли type LoadBalancer облачный балансировщик в любом кластере?
