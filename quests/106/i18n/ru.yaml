title: Типы Service и доступ
brief: "Три пути доступа не предоставляют согласованный маршрут. Восстановите Service с сохранением записанных контрактов.\n\
  \nРаботайте в `~/quest` на workstation. Предоставленные файлы: `board.yaml`, `client.yaml`, `internal.yaml`, `headless.yaml`,\
  \ `nodeport.yaml`, `service-contracts.json`.\n\n**Требования:**\n- Контракты доступа Service:\n  - Service `board-internal`,\
  \ `board-headless` и `board-node` сохраняют исходные идентичности, адреса и контракты портов, с доступом ClusterIP,\
  \ headless и NodePort соответственно.\n  - NodePort не ниже `30000`.\n  - Авторитетный контракт Service — `/run/dq/facts/0/service-contracts.json`\
  \ на workstation: сохраните каждый UID, cluster IP и порядок портов; `board-internal` — обычный `ClusterIP`, `board-headless`\
  \ имеет cluster IP `None`, а `board-node` — `NodePort`.\n- Все три требуемых Service выбирают только Pod с меткой\
  \ `app=board`.\n- Из Deployment `client` HTTP через `board-internal:8080`, `board-headless:8080`, `board-node:8080`\
  \ и NodePort частного узла возвращает `north-106`.\n- Из Deployment `client` A-ответ `board-headless` содержит\
  \ полный IP Pod.\n\n**Проверьте самостоятельно перед Check & finish:**\nВыполняйте эти команды наблюдения из `~/quest`\
  \ на workstation; `kubectl exec` наблюдает контейнер указанной нагрузки.\n- `kubectl exec deployment/client --\
  \ sh -c 'for name in board-internal board-headless board-node; do wget -qO- -T 3 \"http://$name:8080\"; done'`\
  \ — Каждый запрос по имени Service возвращает `north-106`.\n- Частный NodePort возвращает `north-106`; DNS-ответ\
  \ headless содержит полный IP Pod.\n\n  ```sh\n  node=$(kubectl config view --minify -o json | jq -r '.clusters[0].cluster.server\
  \ | sub(\"^https://\";\"\") | split(\":\")[0]')\n  port=$(kubectl get service board-node -o jsonpath='{.spec.ports[0].nodePort}')\n\
  \  kubectl exec deployment/client -- wget -qO- -T 3 \"http://$node:$port\"\n  kubectl exec deployment/client --\
  \ nslookup -type=A \"board-headless.$DQ_NAMESPACE.svc.cluster.local.\"\n  kubectl get pods -l app=board -o wide\n\
  \  ```\n- Настройки, идентичность и статус соответствуют требованиям.\n\n  ```sh\n  kubectl get service board-internal\
  \ board-headless board-node -o yaml\n  cat /run/dq/facts/0/service-contracts.json\n  ```\n\nПроверка наблюдает\
  \ текущие значения, а не историю изменений; порт VM или внешний балансировщик не используются.\n"
debrief: Одно приложение доступно через три реальных механизма Service без внешней инфраструктуры.
stages.0.brief: 'Все три частных пути доступа Service должны возвращать требуемый маршрут.

  '
hints.0.text: Тип Service меняет способ доступа, а не правило выбора Pod.
hints.1.text: Headless DNS возвращает адреса endpoints вместо виртуального IP Service.
hints.2.text: Исправьте все selectors, затем проверьте путь по имени Service и адресу узла.
phrases.0: Я отделил выбор endpoints от способа доступа к Service.
phrases.1: Я сравнил DNS для virtual IP и headless.
phrases.2: Я проверил NodePort на приватном узле без публикации порта хоста.
questions.0.points.0: Обычно NodePort сохраняет и путь через ClusterIP Service.
questions.0.points.1: Проверяйте оба пути и одни выбранные endpoints.
questions.0.prompt: Заменяет ли NodePort путь через ClusterIP?
questions.1.points.0: 'Нет: нужна реализация provider или контроллера.'
questions.1.points.1: В приватной лаборатории без неё выделение внешнего адреса остаётся pending.
questions.1.prompt: Создаёт ли type LoadBalancer облачный балансировщик в любом кластере?
