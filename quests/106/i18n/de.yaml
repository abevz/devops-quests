diagnostics.contract_board_internal_uid: Das Neuerstellen eines Services unter gleichem Namen ändert seine UID dauerhaft. Vergleichen Sie das aktive Objekt vor einer Selektoränderung mit dem festgehaltenen Vertrag. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_headless_uid: Das Neuerstellen eines Services unter gleichem Namen ändert seine UID dauerhaft. Vergleichen Sie das aktive Objekt vor einer Selektoränderung mit dem festgehaltenen Vertrag. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_node_uid: Das Neuerstellen eines Services unter gleichem Namen ändert seine UID dauerhaft. Vergleichen Sie das aktive Objekt vor einer Selektoränderung mit dem festgehaltenen Vertrag. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_internal_type: Ein anderer Service-Typ kann den Zugriff ändern. Vergleichen Sie den gemeldeten Typ mit dem Vertrag und korrigieren Sie den Selektor bei unverändertem Typ. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_headless_type: Ein anderer Service-Typ kann den Zugriff ändern. Vergleichen Sie den gemeldeten Typ mit dem Vertrag und korrigieren Sie den Selektor bei unverändertem Typ. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_node_type: Ein anderer Service-Typ kann den Zugriff ändern. Vergleichen Sie den gemeldeten Typ mit dem Vertrag und korrigieren Sie den Selektor bei unverändertem Typ. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_internal_clusterip: Ersatz oder Typwechsel können die primäre clusterIP geändert haben. Vergleichen Sie den gemeldeten Wert mit dem Vertrag, einschließlich None beim Headless-Service. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_headless_clusterip: Ersatz oder Typwechsel können die primäre clusterIP geändert haben. Vergleichen Sie den gemeldeten Wert mit dem Vertrag, einschließlich None beim Headless-Service. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_node_clusterip: Ersatz oder Typwechsel können die primäre clusterIP geändert haben. Vergleichen Sie den gemeldeten Wert mit dem Vertrag, einschließlich None beim Headless-Service. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_internal_clusterips: Ersatz oder Wechsel der Adressfamilie können die Adressliste geändert haben. Vergleichen Sie alle clusterIPs in der ursprünglichen Reihenfolge mit dem Vertrag. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_headless_clusterips: Ersatz oder Wechsel der Adressfamilie können die Adressliste geändert haben. Vergleichen Sie alle clusterIPs in der ursprünglichen Reihenfolge mit dem Vertrag. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_node_clusterips: Ersatz oder Wechsel der Adressfamilie können die Adressliste geändert haben. Vergleichen Sie alle clusterIPs in der ursprünglichen Reihenfolge mit dem Vertrag. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_internal_ports: Ein anderer Port, ein Protokollwechsel, ein anderes Ziel oder NodePort kann den Vertrag verletzen. Vergleichen Sie jeden Eintrag und prüfen Sie die einheitliche Auflösung benannter Ziele in aktuellen board-Pods. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_headless_ports: Ein anderer Port, ein Protokollwechsel, ein anderes Ziel oder NodePort kann den Vertrag verletzen. Vergleichen Sie jeden Eintrag und prüfen Sie die einheitliche Auflösung benannter Ziele in aktuellen board-Pods. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_node_ports: Ein anderer Port, ein Protokollwechsel, ein anderes Ziel oder NodePort kann den Vertrag verletzen. Vergleichen Sie jeden Eintrag und prüfen Sie die einheitliche Auflösung benannter Ziele in aktuellen board-Pods. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.counts: Einer der drei genannten Services fehlt möglicherweise, oder die gespeicherte Liste ist unvollständig oder nicht lesbar. Prüfe board-internal, board-headless, board-node und die Anzahl der Einträge in service-contracts.json. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-contract-count)
diagnostics.internal_type: Der interne Service hat möglicherweise einen anderen Typ. Prüfen Sie board-internal und behalten Sie ClusterIP für den Zugriff im Cluster. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-internal-service-type)
diagnostics.internal_ip: Dem internen Service fehlt möglicherweise eine virtuelle Adresse. Prüfen Sie, ob clusterIP von board-internal gesetzt ist und von None abweicht. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-internal-virtual-address)
diagnostics.headless_ip: Der Headless-Service hat möglicherweise eine virtuelle ClusterIP erhalten. Belassen Sie clusterIP auf dem Literal None, damit DNS Endpoint-Adressen liefern kann. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-headless-service-address)
diagnostics.node_type: Der über den Knoten erreichbare Service hat möglicherweise den Typ NodePort verloren. Prüfen Sie board-node vor der Diagnose des Knotenzugriffs. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-nodeport-service-type)
diagnostics.node_port: Der benannte http-Port fehlt möglicherweise, ist doppelt oder besitzt keinen zugewiesenen nodePort. Prüfen Sie den einzigen http-Eintrag von board-node mit einem ganzzahligen nodePort ab 30000. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-allocated-http-nodeport)
diagnostics.internal_selector: Ein veralteter oder zu breiter Selektor kann aktuelle board-Pods übersehen oder einen fremden Pod einschließen. Vergleichen Sie den Selektor mit den Pod-Labels und behalten Sie app=board. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.headless_selector: Ein veralteter oder zu breiter Selektor kann aktuelle board-Pods übersehen oder einen fremden Pod einschließen. Vergleichen Sie den Selektor mit den Pod-Labels und behalten Sie app=board. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.node_selector: Ein veralteter oder zu breiter Selektor kann aktuelle board-Pods übersehen oder einen fremden Pod einschließen. Vergleichen Sie den Selektor mit den Pod-Labels und behalten Sie app=board. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.http_board_internal: Der Service-Name wird möglicherweise ohne erreichbaren board-Endpoint aufgelöst oder erreicht einen Pod mit anderer Antwort. Fragen Sie den Namen aus client auf Port 8080 ab und vergleichen Sie mit north-106. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_headless: Der Service-Name wird möglicherweise ohne erreichbaren board-Endpoint aufgelöst oder erreicht einen Pod mit anderer Antwort. Fragen Sie den Namen aus client auf Port 8080 ab und vergleichen Sie mit north-106. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_node: Der Service-Name wird möglicherweise ohne erreichbaren board-Endpoint aufgelöst oder erreicht einen Pod mit anderer Antwort. Fragen Sie den Namen aus client auf Port 8080 ab und vergleichen Sie mit north-106. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.node_http: Der interne Pfad kann funktionieren, während Knotenadresse oder HTTP-NodePort ausfallen. Prüfen Sie den zugewiesenen NodePort und rufen Sie ihn aus client über die bereitgestellte Knotenadresse auf. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-private-nodeport-http)
diagnostics.headless_dns: Der Headless-Service hat möglicherweise keinen bereiten board-Endpoint oder DNS liefert eine andere Adresse. Vergleichen Sie die A-Antwort mit der erwarteten IP des board-Pods. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-headless-pod-dns)
diagnostics.probe_0_0: Die Vertragsprüfung kann vor dem Feldvergleich abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Werkzeuge sowie Zugriff auf Services und festgehaltene Belege. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-contract-observer-input)
diagnostics.probe_0_1: Die Selektorprüfung kann vor der Meldung eines Services abbrechen. Prüfen Sie Python und den Zugriff auf aktuelle Pods und Services. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q106-service-selector-observer-input)
