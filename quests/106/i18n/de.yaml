title: Service-Typen und Zugriff
brief: 'Arbeite in `~/quest`; lies `board.json`, `client.json`, `internal.json`, `headless.json`, `nodeport.json` und `service-contracts.json`.
  Drei Services stellen dasselbe Board über ClusterIP, headless DNS und NodePort bereit. Korrigiere jeden Selektor genau auf
  `app: board`; bewahre UID, Typ, Cluster-IPs und geordnete Ports jedes Service gemäß `service-contracts.json`. Der interne
  Service ist ein nicht-headless ClusterIP, der headless Service hat `clusterIP: None`, und NodePort ist mindestens 30000.


  Vom Client müssen jeder Service-Name auf Port 8080 und die private kind-Knotenadresse mit NodePort `north-106` liefern;
  entnimm die Knotenadresse dem bereitgestellten kubeconfig. Die headless A-Antwort muss die vollständige IP des Board-Pods
  enthalten. DNS- und Endpoint-Abgleich können dauern; warte und prüfe erneut. Die Prüfungen beobachten aktuelle Werte, nicht
  die Änderungshistorie. Ein VM-Port oder externer Load-Balancer wird nicht verwendet.'
debrief: Die gleiche Anwendung wurde über drei echte Service-Mechanismen ohne externe Infrastruktur erreicht.
stages.0.brief: Die drei Service-Verträge, Selektoren, Antworten über Namen und privaten Knoten sowie die headless DNS-Antwort
  entsprechen der Beschreibung.
stages.0.objectives.0.text: Die drei Service-Verträge, Selektoren, Antworten über Namen und privaten Knoten sowie die headless
  DNS-Antwort entsprechen der Beschreibung.
hints.0.text: Ein Service-Typ ändert die Belichtung, nicht aber, welche Pods einem Selektor entsprechen.
hints.1.text: Headless DNS gibt Endpunktadressen anstelle einer virtuellen Service IP zurück.
hints.2.text: Korrigieren Sie alle selectors und testen Sie dann sowohl die Dienstnamen- als auch die Knotenadresspfade.
phrases.0: Ich habe die Endpunktauswahl von der Service-Offenlegung getrennt.
phrases.1: Ich habe das Verhalten von Virtual-IP und headless DNS verglichen.
phrases.2: Ich habe NodePort auf einem privaten Knoten überprüft, ohne einen Host-Port zu veröffentlichen.
questions.0.points.0: Normalerweise behält NodePort auch einen ClusterIP Service-Pfad bei.
questions.0.points.1: Überprüfen Sie beide Pfade und denselben ausgewählten endpoints.
questions.0.prompt: Ersetzt NodePort den ClusterIP-Pfad?
questions.1.points.0: NEIN; ein provider oder Controller muss es implementieren.
questions.1.points.1: In einem privaten Labor ohne solches bleibt die externe Adresszuweisung pending.
questions.1.prompt: Erstellt der Typ LoadBalancer selbst überall einen Cloud Load Balancer?
