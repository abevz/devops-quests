title: Service-Typen und Zugriff
brief: "Drei Zugriffswege liefern die vereinbarte Route nicht. Stellen Sie die Services unter Wahrung ihrer aufgezeichneten\
  \ Verträge her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `board.yaml`, `client.yaml`,\
  \ `internal.yaml`, `headless.yaml`, `nodeport.yaml`, `service-contracts.json`.\n\n**Anforderungen:**\n- Service-Zugriffsverträge:\n\
  \  - Services `board-internal`, `board-headless` und `board-node` bewahren ursprüngliche Identitäten, Adressen\
  \ und Portverträge mit ClusterIP-, Headless- bzw. NodePort-Zugriff.\n  - Der NodePort beträgt mindestens `30000`.\n\
  \  - Der maßgebliche Service-Vertrag liegt in `/run/dq/facts/0/service-contracts.json` auf der Workstation: UID,\
  \ Cluster-IPs und Portreihenfolge bleiben erhalten; `board-internal` ist normales `ClusterIP`, `board-headless`\
  \ hat Cluster-IP `None` und `board-node` ist `NodePort`.\n- Alle drei erforderlichen Services wählen nur Pods\
  \ mit Label `app=board`.\n- Von Deployment `client` liefert HTTP über `board-internal:8080`, `board-headless:8080`,\
  \ `board-node:8080` und den privaten Knoten-NodePort jeweils `north-106`.\n- Von Deployment `client` enthält die\
  \ A-Antwort für `board-headless` die vollständige Pod-IP.\n\n**Vor Check & finish selbst prüfen:**\nFühren Sie\
  \ diese Beobachtungsbefehle in `~/quest` auf der Workstation aus; `kubectl exec` beobachtet den Container des\
  \ genannten Workloads.\n- `kubectl exec deployment/client -- sh -c 'for name in board-internal board-headless\
  \ board-node; do wget -qO- -T 3 \"http://$name:8080\"; done'` — Jede Anfrage über einen Service-Namen liefert\
  \ `north-106`.\n- Der private NodePort liefert `north-106`; die Headless-DNS-Antwort enthält die vollständige\
  \ Pod-IP.\n\n  ```sh\n  node=$(kubectl config view --minify -o json | jq -r '.clusters[0].cluster.server | sub(\"\
  ^https://\";\"\") | split(\":\")[0]')\n  port=$(kubectl get service board-node -o jsonpath='{.spec.ports[0].nodePort}')\n\
  \  kubectl exec deployment/client -- wget -qO- -T 3 \"http://$node:$port\"\n  kubectl exec deployment/client --\
  \ nslookup -type=A \"board-headless.$DQ_NAMESPACE.svc.cluster.local.\"\n  kubectl get pods -l app=board -o wide\n\
  \  ```\n- Einstellungen, Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get service\
  \ board-internal board-headless board-node -o yaml\n  cat /run/dq/facts/0/service-contracts.json\n  ```\n\nGeprüft\
  \ werden aktuelle Werte statt Änderungshistorie; weder VM-Port noch externer Load Balancer sind beteiligt.\n"
debrief: Die gleiche Anwendung wurde über drei echte Service-Mechanismen ohne externe Infrastruktur erreicht.
stages.0.brief: 'Alle drei privaten Service-Zugriffswege müssen die geforderte Route liefern.

  '
hints.0.text: Ein Service-Typ ändert die Belichtung, nicht aber, welche Pods einem Selektor entsprechen.
hints.1.text: Headless DNS gibt Endpunktadressen anstelle einer virtuellen Service IP zurück.
hints.2.text: Korrigieren Sie alle selectors und testen Sie dann sowohl die Dienstnamen- als auch die Knotenadresspfade.
phrases.0: Ich habe die Endpunktauswahl von der Service-Offenlegung getrennt.
phrases.1: Ich habe das Verhalten von Virtual-IP und headless DNS verglichen.
phrases.2: Ich habe NodePort auf einem privaten Knoten überprüft, ohne einen Host-Port zu veröffentlichen.
questions.0.points.0: Normalerweise behält NodePort auch einen ClusterIP Service-Pfad bei.
questions.0.points.1: Überprüfen Sie beide Pfade und denselben ausgewählten endpoints.
questions.0.prompt: Ersetzt NodePort den ClusterIP-Pfad?
questions.1.points.0: NEIN; ein provider oder Controller muss es implementieren.
questions.1.points.1: In einem privaten Labor ohne solches bleibt die externe Adresszuweisung pending.
questions.1.prompt: Erstellt der Typ LoadBalancer selbst überall einen Cloud Load Balancer?
