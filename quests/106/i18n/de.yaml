title: Service Typen und Belichtung
brief: 'Drei bestehende Dienste stellen denselben board unterschiedlich zur Verfügung: ClusterIP, headless
  und NodePort. Alle drei wählen einen veralteten app label. Reparieren Sie nur deren selectors bis app:
  board und behalten Sie deren Typen, Ports und zugewiesene Adressen bei. Überprüfen Sie DNS und HTTP
  anhand jedes Namens. Erreichen Sie auch den NodePort auf der privaten Knotenadresse kind, die vom bereitgestellten
  kubeconfig server erhalten wird. Auf der Workstation oder VM ist kein Port veröffentlicht. Ein LoadBalancer-Dienst
  ohne Load-Balancer-Implementierung würde weiterhin ausstehen; Es wird keine Cloud provider verwendet.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `board.json`, `client.json`, `internal.json`,
  `headless.json`, `nodeport.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: ClusterIP und headless DNS erreichen den board, NodePort arbeitet auf dem privaten
  Knoten und jeder Service behält seinen vorgesehenen Expositionstyp.'
debrief: Die gleiche Anwendung wurde über drei echte Service-Mechanismen ohne externe Infrastruktur erreicht.
stages.0.brief: 'Erfolgskriterien: ClusterIP und headless DNS erreichen den board, NodePort arbeitet auf
  dem privaten Knoten und jeder Service behält seinen vorgesehenen Expositionstyp.'
stages.0.objectives.0.text: ClusterIP und headless DNS erreichen den board, NodePort arbeitet auf dem
  privaten Knoten und jeder Service behält seinen vorgesehenen Expositionstyp.
hints.0.text: Ein Service-Typ ändert die Belichtung, nicht aber, welche Pods einem Selektor entsprechen.
hints.1.text: Headless DNS gibt Endpunktadressen anstelle einer virtuellen Service IP zurück.
hints.2.text: Korrigieren Sie alle selectors und testen Sie dann sowohl die Dienstnamen- als auch die
  Knotenadresspfade.
phrases.0: Ich habe die Endpunktauswahl von der Service-Offenlegung getrennt.
phrases.1: Ich habe das Verhalten von Virtual-IP und headless DNS verglichen.
phrases.2: Ich habe NodePort auf einem privaten Knoten überprüft, ohne einen Host-Port zu veröffentlichen.
questions.0.points.0: Normalerweise behält NodePort auch einen ClusterIP Service-Pfad bei.
questions.0.points.1: Überprüfen Sie beide Pfade und denselben ausgewählten endpoints.
questions.0.prompt: Ersetzt NodePort den ClusterIP-Pfad?
questions.1.points.0: NEIN; ein provider oder Controller muss es implementieren.
questions.1.points.1: In einem privaten Labor ohne solches bleibt die externe Adresszuweisung pending.
questions.1.prompt: Erstellt der Typ LoadBalancer selbst überall einen Cloud Load Balancer?
