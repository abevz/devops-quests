title: Service-Typen und Zugriff
brief: 'Drei Zugriffswege liefern die vereinbarte Route nicht. Stellen Sie die Services unter Wahrung ihrer
  aufgezeichneten Verträge her.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `board.yaml`, `client.yaml`, `internal.yaml`,
  `headless.yaml`, `nodeport.yaml`.


  **Anforderungen:**

  - Die drei bestehenden Services behalten Identitäten, Adressen und Portverträge einschließlich der ursprünglichen
  internen, Headless- und Knoten-Erreichbarkeit; der Knoten-Port bleibt mindestens `30000`.

  - Alle drei bestehenden Services erreichen nur die vorgesehenen Anwendungs-Pods.

  - Von Deployment `client` liefert HTTP über `board-internal:8080`, `board-headless:8080`, `board-node:8080`
  und den privaten Knoten-NodePort jeweils `north-106`.

  - Von Deployment `client` enthält die A-Antwort für `board-headless` die vollständige Pod-IP.


  Geprüft werden aktuelle Werte statt Änderungshistorie; weder VM-Port noch externer Load Balancer sind beteiligt.

  '
debrief: Die gleiche Anwendung wurde über drei echte Service-Mechanismen ohne externe Infrastruktur erreicht.
stages.0.brief: Alle drei privaten Service-Zugriffswege müssen die geforderte Route liefern.
hints.0.text: Ein Service-Typ ändert die Belichtung, nicht aber, welche Pods einem Selektor entsprechen.
hints.1.text: 'Headless DNS gibt Endpunktadressen anstelle einer virtuellen Service IP zurück.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat internal.yaml headless.yaml nodeport.yaml

  kubectl get service board-internal board-headless board-node -o yaml

  kubectl get pods -l app=board -o wide

  ```'
hints.2.text: 'Korrigieren Sie alle selectors und testen Sie dann sowohl die Dienstnamen- als auch die Knotenadresspfade.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl exec deployment/client -- sh -c ''for name in board-internal board-headless board-node; do wget -qO-
  -T 3 "http://$name:8080"; done''

  node=$(kubectl config view --minify -o json | jq -r ''.clusters[0].cluster.server | sub("^https://";"") |
  split(":")[0]'')

  port=$(kubectl get service board-node -o jsonpath=''{.spec.ports[0].nodePort}'')

  kubectl exec deployment/client -- wget -qO- -T 3 "http://$node:$port"

  kubectl exec deployment/client -- nslookup -type=A "board-headless.$DQ_NAMESPACE.svc.cluster.local."

  ```


  Erwartet wird north-106 über alle drei Service-Namen und den privaten NodePort; Headless-DNS enthält die
  vollständige Anwendungs-Pod-IP.


  Mitgelieferte Einschränkungen und Details: Services `board-internal`, `board-headless` und `board-node` bewahren
  ursprüngliche Identitäten, Adressen und Portverträge mit ClusterIP-, Headless- bzw. NodePort-Zugriff; der
  NodePort beträgt mindestens `30000`. Alle drei erforderlichen Services wählen nur Pods mit Label `app=board`.'
phrases.0: Ich habe die Endpunktauswahl von der Service-Offenlegung getrennt.
phrases.1: Ich habe das Verhalten von Virtual-IP und headless DNS verglichen.
phrases.2: Ich habe NodePort auf einem privaten Knoten überprüft, ohne einen Host-Port zu veröffentlichen.
questions.0.points.0: Normalerweise behält NodePort auch einen ClusterIP Service-Pfad bei.
questions.0.points.1: Überprüfen Sie beide Pfade und denselben ausgewählten endpoints.
questions.0.prompt: Ersetzt NodePort den ClusterIP-Pfad?
questions.1.points.0: NEIN; ein provider oder Controller muss es implementieren.
questions.1.points.1: In einem privaten Labor ohne solches bleibt die externe Adresszuweisung pending.
questions.1.prompt: Erstellt der Typ LoadBalancer selbst überall einen Cloud Load Balancer?
