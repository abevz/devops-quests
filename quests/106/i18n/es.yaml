title: Tipos y exposición de Service
brief: "Tres vías de acceso no proporcionan la ruta acordada. Recupera los Services conservando sus contratos registrados.\n\
  \nTrabaja en `~/quest` en la workstation. Archivos suministrados: `board.yaml`, `client.yaml`, `internal.yaml`,\
  \ `headless.yaml`, `nodeport.yaml`, `service-contracts.json`.\n\n**Requisitos:**\n- Contratos de acceso de Services:\n\
  \  - Los Services `board-internal`, `board-headless` y `board-node` conservan identidades, direcciones y contratos\
  \ de puertos originales, con acceso ClusterIP, headless y NodePort respectivamente.\n  - El NodePort es al menos\
  \ `30000`.\n  - El contrato autoritativo de Services está en `/run/dq/facts/0/service-contracts.json` en la workstation:\
  \ conserva cada UID, IPs de clúster y puertos ordenados; `board-internal` es `ClusterIP` normal, `board-headless`\
  \ tiene IP `None` y `board-node` es `NodePort`.\n- Los tres Services requeridos seleccionan solo Pods con etiqueta\
  \ `app=board`.\n- Desde el Deployment `client`, HTTP por `board-internal:8080`, `board-headless:8080`, `board-node:8080`\
  \ y el NodePort privado devuelve `north-106`.\n- Desde el Deployment `client`, la respuesta A de `board-headless`\
  \ incluye la IP completa del Pod.\n\n**Verifica antes de Check & finish:**\nEjecuta estos comandos de observación\
  \ desde `~/quest` en la workstation; `kubectl exec` observa el contenedor de la carga indicada.\n- `kubectl exec\
  \ deployment/client -- sh -c 'for name in board-internal board-headless board-node; do wget -qO- -T 3 \"http://$name:8080\"\
  ; done'` — Cada solicitud por nombre de Service devuelve `north-106`.\n- El NodePort privado devuelve `north-106`;\
  \ la respuesta DNS headless contiene la IP completa del Pod.\n\n  ```sh\n  node=$(kubectl config view --minify\
  \ -o json | jq -r '.clusters[0].cluster.server | sub(\"^https://\";\"\") | split(\":\")[0]')\n  port=$(kubectl\
  \ get service board-node -o jsonpath='{.spec.ports[0].nodePort}')\n  kubectl exec deployment/client -- wget -qO-\
  \ -T 3 \"http://$node:$port\"\n  kubectl exec deployment/client -- nslookup -type=A \"board-headless.$DQ_NAMESPACE.svc.cluster.local.\"\
  \n  kubectl get pods -l app=board -o wide\n  ```\n- Los ajustes, la identidad y el estado coinciden con Requisitos.\n\
  \n  ```sh\n  kubectl get service board-internal board-headless board-node -o yaml\n  cat /run/dq/facts/0/service-contracts.json\n\
  \  ```\n\nSe observan valores actuales, no el historial de edición; no intervienen puertos de VM ni balanceadores\
  \ externos.\n"
debrief: Se accedió a la misma aplicación mediante tres mecanismos Service reales sin infraestructura externa.
stages.0.brief: 'Las tres vías privadas de acceso a Services deben devolver la ruta requerida.

  '
hints.0.text: Un tipo Service cambia la exposición, no qué Pods coinciden con un selector.
hints.1.text: Headless DNS devuelve direcciones de punto final en lugar de un Service IP virtual.
hints.2.text: Corrija todos los selectors, luego pruebe las rutas de nombre de servicio y dirección de nodo.
phrases.0: Separé la selección de terminales de la exposición al servicio.
phrases.1: Comparé el comportamiento de IP virtual y headless DNS.
phrases.2: Verifiqué NodePort en un nodo privado sin publicar un puerto de host.
questions.0.points.0: Normalmente, NodePort también conserva una ruta ClusterIP Service.
questions.0.points.1: Verifique ambas rutas y el mismo endpoints seleccionado.
questions.0.prompt: ¿NodePort reemplaza la ruta ClusterIP?
questions.1.points.0: No; un provider o un controlador deben implementarlo.
questions.1.points.1: En un laboratorio privado sin uno, la asignación de direcciones externas sigue siendo pending.
questions.1.prompt: ¿El tipo LoadBalancer crea un equilibrador de carga en la nube en todas partes?
