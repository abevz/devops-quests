stages.0.objectives.2.text: Desde el Deployment `client`, HTTP por `board-internal:8080`, `board-headless:8080`,
  `board-node:8080` y el NodePort privado devuelve `north-106`.
stages.0.objectives.3.text: Desde el Deployment `client`, la respuesta A de `board-headless` incluye la IP
  completa del Pod.
diagnostics.contract_board_internal_uid: Volver a crear un Service con el mismo nombre cambia su UID de forma irreversible. Compare el objeto activo con el contrato fijado antes de cambiar el selector. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_headless_uid: Volver a crear un Service con el mismo nombre cambia su UID de forma irreversible. Compare el objeto activo con el contrato fijado antes de cambiar el selector. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_node_uid: Volver a crear un Service con el mismo nombre cambia su UID de forma irreversible. Compare el objeto activo con el contrato fijado antes de cambiar el selector. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-uid)
diagnostics.contract_board_internal_type: Cambiar el tipo de Service puede alterar el acceso. Compare el tipo afectado con su contrato y ajuste el selector conservando el tipo. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_headless_type: Cambiar el tipo de Service puede alterar el acceso. Compare el tipo afectado con su contrato y ajuste el selector conservando el tipo. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_node_type: Cambiar el tipo de Service puede alterar el acceso. Compare el tipo afectado con su contrato y ajuste el selector conservando el tipo. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-type)
diagnostics.contract_board_internal_clusterip: El reemplazo o cambio de tipo puede haber alterado clusterIP. Compare el valor indicado con el contrato, incluido None en el Service headless. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_headless_clusterip: El reemplazo o cambio de tipo puede haber alterado clusterIP. Compare el valor indicado con el contrato, incluido None en el Service headless. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_node_clusterip: El reemplazo o cambio de tipo puede haber alterado clusterIP. Compare el valor indicado con el contrato, incluido None en el Service headless. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-cluster-ip)
diagnostics.contract_board_internal_clusterips: El reemplazo o un cambio de familia puede haber alterado la lista. Compare todo clusterIPs con la lista original y su orden. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_headless_clusterips: El reemplazo o un cambio de familia puede haber alterado la lista. Compare todo clusterIPs con la lista original y su orden. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_node_clusterips: El reemplazo o un cambio de familia puede haber alterado la lista. Compare todo clusterIPs con la lista original y su orden. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-address-list)
diagnostics.contract_board_internal_ports: Un cambio de puerto, protocolo, destino o NodePort puede romper el contrato. Compare cada entrada y compruebe que los destinos nombrados se resuelvan igual en los Pods board actuales. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_headless_ports: Un cambio de puerto, protocolo, destino o NodePort puede romper el contrato. Compare cada entrada y compruebe que los destinos nombrados se resuelvan igual en los Pods board actuales. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.contract_board_node_ports: Un cambio de puerto, protocolo, destino o NodePort puede romper el contrato. Compare cada entrada y compruebe que los destinos nombrados se resuelvan igual en los Pods board actuales. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-original-port-tuple)
diagnostics.counts: Puede faltar uno de los tres Service indicados o el inventario guardado puede estar incompleto o no poder leerse. Comprueba board-internal, board-headless, board-node y la cantidad de entradas en service-contracts.json. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-contract-count)
diagnostics.internal_type: El Service interno puede haber cambiado de tipo. Revise board-internal y conserve ClusterIP para el acceso dentro del clúster. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-internal-service-type)
diagnostics.internal_ip: El Service interno puede carecer de dirección virtual. Compruebe que clusterIP de board-internal esté definido y difiera de None. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-internal-virtual-address)
diagnostics.headless_ip: El Service headless puede haber recibido un ClusterIP virtual. Mantenga clusterIP en el literal None para que DNS pueda devolver direcciones de endpoints. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-headless-service-address)
diagnostics.node_type: El Service accesible desde el nodo puede haber perdido el tipo NodePort. Revise board-node antes de diagnosticar la petición al nodo. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-nodeport-service-type)
diagnostics.node_port: El puerto http puede faltar, estar duplicado o carecer de nodePort. Revise la única entrada http de board-node con un nodePort entero de al menos 30000. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-allocated-http-nodeport)
diagnostics.internal_selector: Un selector antiguo o demasiado amplio puede omitir Pods board actuales o incluir un Pod ajeno. Compare el selector con las etiquetas reales y conserve app=board. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.headless_selector: Un selector antiguo o demasiado amplio puede omitir Pods board actuales o incluir un Pod ajeno. Compare el selector con las etiquetas reales y conserve app=board. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.node_selector: Un selector antiguo o demasiado amplio puede omitir Pods board actuales o incluir un Pod ajeno. Compare el selector con las etiquetas reales y conserve app=board. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-board-selectors)
diagnostics.http_board_internal: El nombre Service puede resolverse sin endpoint board disponible o llegar a un Pod con otro contenido. Consulte el nombre desde client en 8080 y compare con north-106. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_headless: El nombre Service puede resolverse sin endpoint board disponible o llegar a un Pod con otro contenido. Consulte el nombre desde client en 8080 y compare con north-106. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.http_board_node: El nombre Service puede resolverse sin endpoint board disponible o llegar a un Pod con otro contenido. Consulte el nombre desde client en 8080 y compare con north-106. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-name-http)
diagnostics.node_http: La ruta interna puede funcionar aunque falle la dirección del nodo o su NodePort HTTP. Revise el NodePort asignado y consúltelo desde client por la dirección del nodo suministrada. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-private-nodeport-http)
diagnostics.headless_dns: El Service headless puede carecer de endpoint board listo o DNS devolver otra dirección. Compare la respuesta A con la IP esperada del Pod board. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-headless-pod-dns)
diagnostics.probe_0_0: El observador puede detenerse antes de comparar campos si falla el proceso o la entrada. Revise las herramientas y el acceso a los Service y registros fijados. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-contract-observer-input)
diagnostics.probe_0_1: El observador de selectores puede detenerse antes de señalar un Service. Revise Python y el acceso a Pods y Service activos. [Causa y comprobación](guides#guide=kubernetes-10&section=q106-service-selector-observer-input)
