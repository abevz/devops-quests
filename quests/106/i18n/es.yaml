title: Tipos y exposición de Service
brief: 'Trabaja en `~/quest`; inspecciona `board.json`, `client.json`, `internal.json`, `headless.json`, `nodeport.json` y
  `service-contracts.json`. Tres Services exponen el mismo board mediante ClusterIP, DNS headless y NodePort. Corrige cada
  selector exactamente a `app: board`; conserva UID, tipo, IPs de clúster y puertos ordenados de cada Service según `service-contracts.json`.
  El Service interno es ClusterIP no headless, el headless tiene `clusterIP: None` y el NodePort es al menos 30000.


  Desde el Deployment client, cada nombre de Service en el puerto 8080 y la dirección privada del nodo kind con NodePort deben
  devolver `north-106`; obtén la dirección del nodo del kubeconfig suministrado. La respuesta A headless debe contener la
  IP completa del Pod board. La reconciliación de DNS y endpoints puede tardar, así que espera y vuelve a probar. Las comprobaciones
  observan valores actuales, no el historial de cambios. No se usa ningún puerto de VM ni balanceador externo.'
debrief: Se accedió a la misma aplicación mediante tres mecanismos Service reales sin infraestructura externa.
stages.0.brief: Los contratos de los tres Services, selectores, respuestas de nombres y nodo privado y respuesta DNS headless
  coinciden con la descripción.
stages.0.objectives.0.text: Los contratos de los tres Services, selectores, respuestas de nombres y nodo privado y respuesta
  DNS headless coinciden con la descripción.
hints.0.text: Un tipo Service cambia la exposición, no qué Pods coinciden con un selector.
hints.1.text: Headless DNS devuelve direcciones de punto final en lugar de un Service IP virtual.
hints.2.text: Corrija todos los selectors, luego pruebe las rutas de nombre de servicio y dirección de nodo.
phrases.0: Separé la selección de terminales de la exposición al servicio.
phrases.1: Comparé el comportamiento de IP virtual y headless DNS.
phrases.2: Verifiqué NodePort en un nodo privado sin publicar un puerto de host.
questions.0.points.0: Normalmente, NodePort también conserva una ruta ClusterIP Service.
questions.0.points.1: Verifique ambas rutas y el mismo endpoints seleccionado.
questions.0.prompt: ¿NodePort reemplaza la ruta ClusterIP?
questions.1.points.0: No; un provider o un controlador deben implementarlo.
questions.1.points.1: En un laboratorio privado sin uno, la asignación de direcciones externas sigue siendo pending.
questions.1.prompt: ¿El tipo LoadBalancer crea un equilibrador de carga en la nube en todas partes?
