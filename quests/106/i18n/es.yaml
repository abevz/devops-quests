title: Tipos y exposición de Service
brief: 'Tres vías de acceso no proporcionan la ruta acordada. Recupera los Services conservando sus contratos
  registrados.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `board.yaml`, `client.yaml`, `internal.yaml`,
  `headless.yaml`, `nodeport.yaml`.


  **Requisitos:**

  - Los tres Services existentes conservan identidades, direcciones y contratos de puertos, incluida su exposición
  original interna, headless y por nodo; el puerto del nodo sigue siendo al menos `30000`.

  - Los tres Services existentes llegan solo a los Pods de aplicación previstos.

  - Desde el Deployment `client`, HTTP por `board-internal:8080`, `board-headless:8080`, `board-node:8080`
  y el NodePort privado devuelve `north-106`.

  - Desde el Deployment `client`, la respuesta A de `board-headless` incluye la IP completa del Pod.


  Se observan valores actuales, no el historial de edición; no intervienen puertos de VM ni balanceadores externos.

  '
debrief: Se accedió a la misma aplicación mediante tres mecanismos Service reales sin infraestructura externa.
stages.0.brief: Las tres vías privadas de acceso a Services deben devolver la ruta requerida.
hints.0.text: Un tipo Service cambia la exposición, no qué Pods coinciden con un selector.
hints.1.text: 'Headless DNS devuelve direcciones de punto final en lugar de un Service IP virtual.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat internal.yaml headless.yaml nodeport.yaml

  kubectl get service board-internal board-headless board-node -o yaml

  kubectl get pods -l app=board -o wide

  ```'
hints.2.text: 'Corrija todos los selectors, luego pruebe las rutas de nombre de servicio y dirección de nodo.


  Verifica el resultado observado:


  ```sh

  kubectl exec deployment/client -- sh -c ''for name in board-internal board-headless board-node; do wget -qO-
  -T 3 "http://$name:8080"; done''

  node=$(kubectl config view --minify -o json | jq -r ''.clusters[0].cluster.server | sub("^https://";"") |
  split(":")[0]'')

  port=$(kubectl get service board-node -o jsonpath=''{.spec.ports[0].nodePort}'')

  kubectl exec deployment/client -- wget -qO- -T 3 "http://$node:$port"

  kubectl exec deployment/client -- nslookup -type=A "board-headless.$DQ_NAMESPACE.svc.cluster.local."

  ```


  Se espera north-106 a través de los tres nombres Service y del NodePort privado; el DNS headless incluye
  la IP completa del Pod de aplicación.


  Restricciones y detalles suministrados: Los Services `board-internal`, `board-headless` y `board-node` conservan
  identidades, direcciones y contratos de puertos originales, con acceso ClusterIP, headless y NodePort respectivamente;
  el NodePort es al menos `30000`. Los tres Services requeridos seleccionan solo Pods con etiqueta `app=board`.'
phrases.0: Separé la selección de terminales de la exposición al servicio.
phrases.1: Comparé el comportamiento de IP virtual y headless DNS.
phrases.2: Verifiqué NodePort en un nodo privado sin publicar un puerto de host.
questions.0.points.0: Normalmente, NodePort también conserva una ruta ClusterIP Service.
questions.0.points.1: Verifique ambas rutas y el mismo endpoints seleccionado.
questions.0.prompt: ¿NodePort reemplaza la ruta ClusterIP?
questions.1.points.0: No; un provider o un controlador deben implementarlo.
questions.1.points.1: En un laboratorio privado sin uno, la asignación de direcciones externas sigue siendo
  pending.
questions.1.prompt: ¿El tipo LoadBalancer crea un equilibrador de carga en la nube en todas partes?
