title: Tipos y exposición de Service
brief: 'Tres servicios existentes exponen el mismo board de manera diferente: ClusterIP, headless y NodePort.
  Los tres seleccionan un app label obsoleto. Repare únicamente sus selectors a app: board, conservando
  sus tipos, puertos y direcciones asignadas. Verifique DNS y HTTP a través de cada nombre; también acceda
  a NodePort en la dirección de nodo privado kind, obtenida del kubeconfig server suministrado. No se
  publica ningún puerto en la estación de trabajo ni en VM. Quedaría pendiente un servicio LoadBalancer
  sin una implementación de balanceador de carga; no se utiliza ninguna nube provider.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `client.json`,
  `internal.json`, `headless.json`, `nodeport.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: ClusterIP y headless DNS alcanzan el board, NodePort funciona en el nodo
  privado y cada Service conserva su tipo de exposición previsto.'
debrief: La misma aplicación se logró a través de tres mecanismos Service reales sin infraestructura externa.
stages.0.brief: 'Criterios de éxito: ClusterIP y headless DNS alcanzan el board, NodePort funciona en
  el nodo privado y cada Service conserva su tipo de exposición previsto.'
stages.0.objectives.0.text: ClusterIP y headless DNS llegan al board, NodePort funciona en el nodo privado
  y cada Service conserva su tipo de exposición previsto.
hints.0.text: Un tipo Service cambia la exposición, no qué Pods coinciden con un selector.
hints.1.text: Headless DNS devuelve direcciones de punto final en lugar de un Service IP virtual.
hints.2.text: Corrija todos los selectors, luego pruebe las rutas de nombre de servicio y dirección de
  nodo.
phrases.0: Separé la selección de terminales de la exposición al servicio.
phrases.1: Comparé el comportamiento de IP virtual y headless DNS.
phrases.2: Verifiqué NodePort en un nodo privado sin publicar un puerto de host.
questions.0.points.0: Normalmente, NodePort también conserva una ruta ClusterIP Service.
questions.0.points.1: Verifique ambas rutas y el mismo endpoints seleccionado.
questions.0.prompt: ¿NodePort reemplaza la ruta ClusterIP?
questions.1.points.0: No; un provider o un controlador deben implementarlo.
questions.1.points.1: En un laboratorio privado sin uno, la asignación de direcciones externas sigue siendo
  pending.
questions.1.prompt: ¿El tipo LoadBalancer crea un equilibrador de carga en la nube en todas partes?
