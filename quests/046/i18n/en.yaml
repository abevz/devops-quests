hints.0.text: A tag selects tasks, not a promise that they are read-only. The supplied copy task carries inspect,
  so selecting it can overwrite the healthy banner.
hints.1.text: Use --list-tasks --tags inspect to inspect the selected scope.
hints.2.text: Keep delivery and inspection tags separate; verify changed=0 and the actual banner. Save the requested
  run with ansible-playbook --tags inspect rollout.yml > inspection.log.
phrases.0: I inspected which tasks the requested Ansible tag would select.
phrases.1: I separated inspection and deployment tags before running the diagnostic.
phrases.2: I checked both changed=0 and the actual unchanged files on every target.
