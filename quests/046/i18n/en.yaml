title: Tags
brief: |-
  The requested inspection must leave healthy banners intact.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Host `app1`:
    - On app1, /srv/site/banner.txt contains north-46.
  - Host `app2`:
    - On app2, /srv/site/banner.txt contains north-46.
  - Host `app3`:
    - On app3, /srv/site/banner.txt contains north-46.
  - Workstation and execution results:
    - The workstation inspection.log is nonempty.
    - The playbook separates deploy delivery from inspect-only inspection of /srv/site/banner.txt on fleet.
    - The inspection run reports changed=0, unreachable=0 and failed=0 for all three hosts.

  **Verify yourself before Check & finish:**
  - `cat ~/quest/inspection.log` — shows a nonempty inspection record, with changed=0, unreachable=0 and failed=0 for app1, app2 and app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/banner.txt'` — prints north-46 from all three managed hosts.
  - `cat ~/quest/rollout.yml` — shows separate deploy delivery and inspect-only inspection of the remote banner.
debrief: Tag selection was verified against both task scope and real unchanged target files.
stages.0.brief: Inspection must preserve every healthy banner.
