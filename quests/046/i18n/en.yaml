title: Tags
brief: |-
  The requested inspection must leave healthy banners intact.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/banner.txt`.
    - Content: `north-46`.
  - Inspection result:
    - The inspect selection only reads: running it leaves every banner as it was.
    - Nonempty evidence on the workstation: `~/quest/inspection.log`.
    - Recap for `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  The check observes banners and recap counters during a real inspection run.
debrief: Tag selection was verified against both task scope and real unchanged target files.
stages.0.brief: Inspection must preserve every healthy banner.
stages.0.objectives.0.text: The workstation inspection.log is nonempty.
stages.0.objectives.1.text: |-
  The inspect selection only reads: running it leaves every banner as it was.
stages.0.objectives.2.text: The inspection run reports changed=0, unreachable=0 and failed=0 for all three
  hosts.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/banner.txt` contains
  `north-46`.
hints.0.text: Tags select an execution scope; safe inspection must be designed rather than assumed.
hints.1.text: 'A tag selects tasks, not a promise that they are read-only. The supplied copy task carries inspect,
  so selecting it can overwrite the healthy banner.


  Use --list-tasks --tags inspect to inspect the selected scope.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: |-
  From `~/quest`, record a real inspection with `ansible-playbook --tags inspect rollout.yml > inspection.log`. Compare each banner’s contents and `stat` output before and after the run; both stay unchanged. `cat inspection.log` must show changed=0, unreachable=0 and failed=0 for app1, app2 and app3.
phrases.0: I inspected which tasks the requested Ansible tag would select.
phrases.1: I separated inspection and deployment tags before running the diagnostic.
phrases.2: I checked both changed=0 and the actual unchanged files on every target.
diagnostics.inspection_log: inspection.log is missing or empty; the inspection may not have been recorded from ~/quest, or failed before producing output. [Cause and check](guides#guide=ansible-12&section=inspection-evidence)
diagnostics.inspection_scope: Inspection changed a banner or could not verify and restore its snapshot; inspect may still select copy, or SSH, playbook execution, time budget or cleanup may have failed. [Cause and check](guides#guide=ansible-12&section=inspection-unchanged)
diagnostics.inspection_run: The live inspection failed or its recap could not be verified; playbook errors, SSH failures, timeouts, restoration errors or ambiguous recap fields may prevent a complete result. [Cause and check](guides#guide=ansible-12&section=inspection-recap)
diagnostics.probe_0_1: The unchanged-banner probe stopped before its Python diagnostics; ~/quest, Python startup or required probe inputs may be unavailable. [Cause and check](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_2: The recap probe stopped before its Python diagnostics; ~/quest, Python or the dq_check recap helper may be unavailable before inspection runs. [Cause and check](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_3: The shell group failed without a per-host diagnostic; observation may have been interrupted before the host results were reported. [Cause and check](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.banner_1: app1 did not return north-46 from its banner or SSH failed; a selected deploy task may have overwritten the retained file, or host access is unavailable. A missing or incorrect DQ_NAMESPACE can also prevent the per-host SSH observation. [Cause and check](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_1: app1 lacks an unambiguous recap with changed=0, unreachable=0 and failed=0; mutating selected tasks, SSH failures or missing/malformed counters may explain it. [Cause and check](guides#guide=ansible-12&section=inspection-recap)
diagnostics.banner_2: app2 did not return north-46 from its banner or SSH failed; a selected deploy task may have overwritten the retained file, or host access is unavailable. A missing or incorrect DQ_NAMESPACE can also prevent the per-host SSH observation. [Cause and check](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_2: app2 lacks an unambiguous recap with changed=0, unreachable=0 and failed=0; mutating selected tasks, SSH failures or missing/malformed counters may explain it. [Cause and check](guides#guide=ansible-12&section=inspection-recap)
diagnostics.banner_3: app3 did not return north-46 from its banner or SSH failed; a selected deploy task may have overwritten the retained file, or host access is unavailable. A missing or incorrect DQ_NAMESPACE can also prevent the per-host SSH observation. [Cause and check](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_3: app3 lacks an unambiguous recap with changed=0, unreachable=0 and failed=0; mutating selected tasks, SSH failures or missing/malformed counters may explain it. [Cause and check](guides#guide=ansible-12&section=inspection-recap)
