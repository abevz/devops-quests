title: Tags
brief: |-
  The requested inspection must leave healthy banners intact.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/banner.txt`.
    - Content: `north-46`.
  - Inspection result:
    - The inspection selection leaves all managed hosts unchanged.
    - Nonempty evidence on the workstation: `~/quest/inspection.log`.
    - Recap for `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  **Verify yourself before Check & finish:**
  - `cat ~/quest/inspection.log` — shows a nonempty inspection record, with changed=0, unreachable=0 and failed=0 for app1, app2 and app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/banner.txt'` — prints north-46 from all three managed hosts.
debrief: Tag selection was verified against both task scope and real unchanged target files.
stages.0.brief: Inspection must preserve every healthy banner.
stages.0.objectives.0.text: The workstation inspection.log is nonempty.
stages.0.objectives.1.text: Running the inspection selection changes nothing on any managed host.
stages.0.objectives.2.text: The inspection run reports changed=0, unreachable=0 and failed=0 for all three hosts.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/banner.txt` contains `north-46`.
hints.0.text: A tag selects tasks, not a promise that they are read-only. The supplied copy task carries inspect,
  so selecting it can overwrite the healthy banner.
hints.1.text: Use --list-tasks --tags inspect to inspect the selected scope.
hints.2.text: Keep delivery and inspection tags separate; verify changed=0 and the actual banner. Save the requested
  run with ansible-playbook --tags inspect rollout.yml > inspection.log.
phrases.0: I inspected which tasks the requested Ansible tag would select.
phrases.1: I separated inspection and deployment tags before running the diagnostic.
phrases.2: I checked both changed=0 and the actual unchanged files on every target.
diagnostics.inspection_scope: Workstation rollout.yml must satisfy the retained safe-inspection scope check.
