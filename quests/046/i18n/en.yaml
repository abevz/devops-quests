title: Tags
brief: 'Only an inspection run was requested. rollout.yml incorrectly gives the deployment copy task the
  inspect tag, so the requested command would overwrite a healthy banner. Give that task only deploy,
  keep the stat task tagged inspect, and run ansible-playbook --tags inspect rollout.yml > inspection.log.
  The healthy north-46 banner on all three targets must survive. The checker repeats the inspection after
  verifying the two-task scope.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `inspection.log`, `verification.log`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The copy task has only deploy, stat has inspect, and the inspection changes
  none of the three north-46 banners.'
debrief: Tag selection was verified against both task scope and real unchanged target files.
