title: Schlagworte
brief: "Die angeforderte Inspektion muss die intakten Banner erhalten.\n\nArbeiten Sie auf der Workstation\
  \ in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n- Datei auf jedem\
  \ verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/banner.txt`.\n  - Inhalt: `north-46`.\n\
  - Inspektionsergebnis:\n  - Die Inspektionsauswahl lässt alle verwalteten Hosts unverändert.\n  - Nicht leerer\
  \ Nachweis auf der Workstation: `~/quest/inspection.log`.\n  - Zusammenfassung für `app1`, `app2`, `app3`:\
  \ `changed=0`, `unreachable=0`, `failed=0`.\n"
debrief: Die Tag-Auswahl wurde sowohl anhand des Aufgabenumfangs als auch anhand der tatsächlich unveränderten
  Zieldateien überprüft.
stages.0.brief: Die Inspektion muss jedes intakte Banner erhalten.
stages.0.objectives.0.text: Die Workstation-Datei inspection.log ist nicht leer.
stages.0.objectives.1.text: Die Ausführung der Inspektionsauswahl ändert auf keinem verwalteten Host etwas.
stages.0.objectives.2.text: Der Inspektionslauf meldet changed=0, unreachable=0 und failed=0 für alle drei
  Hosts.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/banner.txt`
  den Inhalt `north-46`.
hints.0.text: Tags wählen einen Ausführungsumfang; sichere Inspektion muss vorgesehen werden und darf nicht
  nur angenommen werden.
hints.1.text: 'Ein Tag wählt Aufgaben aus, nicht das Versprechen, dass sie schreibgeschützt sind. Die bereitgestellte
  copy-Aufgabe trägt inspect und kann dadurch das intakte Banner überschreiben.


  Prüfe mit --list-tasks --tags inspect die ausgewählten Aufgaben.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: 'Liefer- und Prüfetiketten getrennt aufbewahren; Überprüfen Sie changed=0 und den tatsächlichen
  banner. Speichern Sie den angeforderten Lauf mit ansible-playbook --tags inspect rollout.yml > inspection.log.


  Prüfen Sie das beobachtete Ergebnis:


  - `cat ~/quest/inspection.log` — zeigt einen nicht leeren Inspektionsnachweis mit changed=0, unreachable=0
  und failed=0 für app1, app2 und app3.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/banner.txt''` — gibt north-46
  von allen drei verwalteten Hosts aus.'
phrases.0: Ich habe untersucht, welche Aufgaben das angeforderte Ansible-Tag auswählen würde.
phrases.1: Ich habe Inspektions- und Bereitstellungs-Tags getrennt, bevor ich die Diagnose ausgeführt habe.
phrases.2: Ich habe sowohl changed=0 als auch die tatsächlich unveränderten Dateien auf jedem Ziel überprüft.
diagnostics.inspection_scope: Die Workstation-Datei rollout.yml muss die beibehaltene Bereichsprüfung für sichere
  Inspektion bestehen.
diagnostics.inspection_run: Die Workstation-Datei verification.log muss changed=0, unreachable=0 und failed=0
  für app1, app2 und app3 melden.
diagnostics.banner_1: Auf app1 enthält /srv/site/banner.txt den Inhalt north-46.
diagnostics.banner_2: Auf app2 enthält /srv/site/banner.txt den Inhalt north-46.
diagnostics.banner_3: Auf app3 enthält /srv/site/banner.txt den Inhalt north-46.
diagnostics.inspection_recap_1: 'Workstation verification.log: app1 muss changed=0, unreachable=0 und failed=0
  melden.'
diagnostics.inspection_recap_2: 'Workstation verification.log: app2 muss changed=0, unreachable=0 und failed=0
  melden.'
