title: Schlagworte
brief: |-
  Die angeforderte Inspektion muss die intakten Banner erhalten.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/banner.txt`.
    - Inhalt: `north-46`.
  - Inspektionsergebnis:
    - Die Auswahl inspect liest nur: Nach ihrer Ausführung bleibt jedes Banner unverändert.
    - Nicht leerer Nachweis auf der Workstation: `~/quest/inspection.log`.
    - Zusammenfassung für `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  Die Prüfung beobachtet Banner und Zusammenfassungszähler während eines echten Inspektionslaufs.
debrief: Die Tag-Auswahl wurde sowohl anhand des Aufgabenumfangs als auch anhand der tatsächlich unveränderten
  Zieldateien überprüft.
stages.0.brief: Die Inspektion muss jedes intakte Banner erhalten.
stages.0.objectives.0.text: Die Workstation-Datei inspection.log ist nicht leer.
stages.0.objectives.1.text: |-
  Die Auswahl inspect liest nur: Nach ihrer Ausführung bleibt jedes Banner unverändert.
stages.0.objectives.2.text: Der Inspektionslauf meldet changed=0, unreachable=0 und failed=0 für alle drei
  Hosts.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/banner.txt`
  den Inhalt `north-46`.
hints.0.text: Tags wählen einen Ausführungsumfang; sichere Inspektion muss vorgesehen werden und darf nicht
  nur angenommen werden.
hints.1.text: |-
  Ein Tag wählt Aufgaben aus, nicht das Versprechen, dass sie schreibgeschützt sind. Die bereitgestellte copy-Aufgabe trägt inspect und kann dadurch das intakte Banner überschreiben.

  Prüfe mit --list-tasks --tags inspect die ausgewählten Aufgaben.

  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:

  ```sh
  cat inventory.ini
  cat rollout.yml
  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml
  ```
hints.2.text: |-
  Sobald das Tag inspect nur lesende Aufgaben auswählt, erfasse vor und nach der tatsächlichen Inspektion Prüfsumme und Metadaten des Banners auf jedem Host.

  ```sh
  cd ~/quest
  snapshot_banners() {
    for number in 1 2 3; do
      host="app${number}-${DQ_NAMESPACE#dq-}"
      printf 'app%s\n' "$number"
      ssh -n -o BatchMode=yes -p 2222 "root@$host" \
        'sha256sum /srv/site/banner.txt &&
         stat -c "%f %u %g %y %z %N" /srv/site/banner.txt &&
         stat -L -c "%f %u %g %y %z" /srv/site/banner.txt' || return
    done
  }
  before=$(snapshot_banners) &&
    ansible-playbook --tags inspect rollout.yml > inspection.log &&
    after=$(snapshot_banners) &&
    diff -u <(printf '%s\n' "$before") <(printf '%s\n' "$after") &&
    cat inspection.log
  ```

  Der Befehl diff soll keine Unterschiede ausgeben. In inspection.log müssen für app1, app2 und app3 jeweils changed=0, unreachable=0 und failed=0 stehen.
phrases.0: Ich habe untersucht, welche Aufgaben das angeforderte Ansible-Tag auswählen würde.
phrases.1: Ich habe Inspektions- und Bereitstellungs-Tags getrennt, bevor ich die Diagnose ausgeführt habe.
phrases.2: Ich habe sowohl changed=0 als auch die tatsächlich unveränderten Dateien auf jedem Ziel überprüft.
diagnostics.inspection_log: inspection.log fehlt oder ist leer; die Inspektion wurde möglicherweise nicht aus ~/quest aufgezeichnet oder endete vor einer Ausgabe. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-evidence)
diagnostics.inspection_scope: Die Inspektion änderte ein Banner oder konnte den Zustand nicht prüfen und wiederherstellen; inspect wählt möglicherweise noch copy oder SSH, Playbook, Zeitbudget beziehungsweise Bereinigung schlugen fehl. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-unchanged)
diagnostics.inspection_run: Die laufende Inspektion schlug fehl oder ihr Recap war nicht prüfbar; Playbook-, SSH-, Zeitlimit- oder Wiederherstellungsfehler sowie mehrdeutige Recap-Felder können das Ergebnis verhindern. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-recap)
diagnostics.probe_0_1: Die Bannerprüfung endete vor der Python-Diagnose; ~/quest, der Python-Start oder Prüfeingaben sind möglicherweise nicht verfügbar. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_2: Die Recap-Prüfung endete vor der Python-Diagnose; ~/quest, Python oder der dq_check-Helfer sind möglicherweise vor der Inspektion nicht verfügbar. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_3: Die Shell-Gruppe schlug ohne Hostdiagnose fehl; die Beobachtung wurde möglicherweise vor der Ergebnisausgabe unterbrochen. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.banner_1: app1 lieferte aus dem Banner nicht north-46 oder SSH schlug fehl; eine ausgewählte Deploy-Aufgabe hat möglicherweise die Datei überschrieben oder der Host ist nicht erreichbar. Ein fehlender oder falscher DQ_NAMESPACE kann auch die SSH-Beobachtung des Hosts verhindern. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_1: Für app1 fehlt ein eindeutiges Recap mit changed=0, unreachable=0 und failed=0; ausgewählte schreibende Aufgaben, SSH-Fehler oder fehlende beziehungsweise fehlerhafte Zähler können die Ursache sein. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-recap)
diagnostics.banner_2: app2 lieferte aus dem Banner nicht north-46 oder SSH schlug fehl; eine ausgewählte Deploy-Aufgabe hat möglicherweise die Datei überschrieben oder der Host ist nicht erreichbar. Ein fehlender oder falscher DQ_NAMESPACE kann auch die SSH-Beobachtung des Hosts verhindern. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_2: Für app2 fehlt ein eindeutiges Recap mit changed=0, unreachable=0 und failed=0; ausgewählte schreibende Aufgaben, SSH-Fehler oder fehlende beziehungsweise fehlerhafte Zähler können die Ursache sein. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-recap)
diagnostics.banner_3: app3 lieferte aus dem Banner nicht north-46 oder SSH schlug fehl; eine ausgewählte Deploy-Aufgabe hat möglicherweise die Datei überschrieben oder der Host ist nicht erreichbar. Ein fehlender oder falscher DQ_NAMESPACE kann auch die SSH-Beobachtung des Hosts verhindern. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_3: Für app3 fehlt ein eindeutiges Recap mit changed=0, unreachable=0 und failed=0; ausgewählte schreibende Aufgaben, SSH-Fehler oder fehlende beziehungsweise fehlerhafte Zähler können die Ursache sein. [Ursache und Prüfung](guides#guide=ansible-12&section=inspection-recap)
