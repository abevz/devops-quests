title: Schlagworte
brief: 'Es wurde lediglich ein Inspektionslauf angefordert. rollout.yml weist der Bereitstellungsaufgabe
  copy fälschlicherweise das Tag inspect zu, sodass der angeforderte Befehl ein fehlerfreies banner überschreiben
  würde. Geben Sie dieser Aufgabe nur deploy, behalten Sie die Aufgabe stat mit dem Tag inspect bei und
  führen Sie ansible-playbook --tags inspect rollout.yml > inspection.log aus. Der gesunde north-46 banner
  auf allen drei Zielen muss überleben. Der Prüfer wiederholt die Inspektion, nachdem er den Zwei-Aufgaben-Umfang
  überprüft hat.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `inspection.log`, `verification.log`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die copy-Aufgabe hat nur deploy, stat hat inspect und die Inspektion ändert
  keines der drei "north-46"-Banner.'
debrief: Die Tag-Auswahl wurde sowohl anhand des Aufgabenumfangs als auch anhand der tatsächlich unveränderten
  Zieldateien überprüft.
stages.0.brief: 'Erfolgskriterien: Die Kopieraufgabe hat nur deploy, stat hat inspect und die Inspektion
  ändert keines der drei "north-46"-Banner.'
stages.0.objectives.0.text: Die Kopieraufgabe hat nur deploy, stat hat inspect und die Inspektion ändert
  keines der drei "north-46"-Banner.
hints.0.text: Ein Tag wählt Aufgaben aus, nicht das Versprechen, dass sie schreibgeschützt sind.
hints.1.text: Prüfe mit --list-tasks --tags inspect die ausgewählten Aufgaben.
hints.2.text: Liefer- und Prüfetiketten getrennt aufbewahren; Überprüfen Sie changed=0 und den tatsächlichen
  banner.
phrases.0: Ich habe untersucht, welche Aufgaben das angeforderte Ansible-Tag auswählen würde.
phrases.1: Ich habe Inspektions- und Bereitstellungs-Tags getrennt, bevor ich die Diagnose ausgeführt
  habe.
phrases.2: Ich habe sowohl changed=0 als auch die tatsächlich unveränderten Dateien auf jedem Ziel überprüft.
