title: Schlagworte
brief: |-
  Die angeforderte Inspektion muss die intakten Banner erhalten.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/banner.txt`.
    - Inhalt: `north-46`.
  - Inspektionsergebnis:
    - Die Auswahl inspect liest nur: Nach ihrer Ausführung bleibt jedes Banner unverändert.
    - Nicht leerer Nachweis auf der Workstation: `~/quest/inspection.log`.
    - Zusammenfassung für `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  Die Prüfung beobachtet Banner und Zusammenfassungszähler während eines echten Inspektionslaufs.
debrief: Die Tag-Auswahl wurde sowohl anhand des Aufgabenumfangs als auch anhand der tatsächlich unveränderten
  Zieldateien überprüft.
stages.0.brief: Die Inspektion muss jedes intakte Banner erhalten.
stages.0.objectives.0.text: Die Workstation-Datei inspection.log ist nicht leer.
stages.0.objectives.1.text: |-
  Die Auswahl inspect liest nur: Nach ihrer Ausführung bleibt jedes Banner unverändert.
stages.0.objectives.2.text: Der Inspektionslauf meldet changed=0, unreachable=0 und failed=0 für alle drei
  Hosts.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/banner.txt`
  den Inhalt `north-46`.
hints.0.text: Tags wählen einen Ausführungsumfang; sichere Inspektion muss vorgesehen werden und darf nicht
  nur angenommen werden.
hints.1.text: 'Ein Tag wählt Aufgaben aus, nicht das Versprechen, dass sie schreibgeschützt sind. Die bereitgestellte
  copy-Aufgabe trägt inspect und kann dadurch das intakte Banner überschreiben.


  Prüfe mit --list-tasks --tags inspect die ausgewählten Aufgaben.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: |-
  Zeichne in `~/quest` eine echte Inspektion mit `ansible-playbook --tags inspect rollout.yml > inspection.log` auf. Vergleiche den Inhalt jedes Banners und die Ausgabe von `stat` vor und nach dem Lauf; beide bleiben unverändert. `cat inspection.log` muss changed=0, unreachable=0 und failed=0 für app1, app2 und app3 zeigen.
phrases.0: Ich habe untersucht, welche Aufgaben das angeforderte Ansible-Tag auswählen würde.
phrases.1: Ich habe Inspektions- und Bereitstellungs-Tags getrennt, bevor ich die Diagnose ausgeführt habe.
phrases.2: Ich habe sowohl changed=0 als auch die tatsächlich unveränderten Dateien auf jedem Ziel überprüft.
diagnostics.inspection_scope: |-
  Die Inspektion muss Inhalt und Dateimetadaten jedes Banners unverändert lassen.
diagnostics.inspection_run: |-
  Die Inspektion muss erfolgreich enden und für jeden verwalteten Host die Zähler changed, unreachable und failed mit null melden.
