title: Etiquetas
brief: "La inspección solicitada debe conservar los banners sanos.\n\nTrabaja en la workstation en `~/quest`\
  \ con `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n- Archivo en cada host administrado\
  \ (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/banner.txt`.\n  - Contenido: `north-46`.\n- Resultado de\
  \ inspección:\n  - La selección de inspección deja sin cambios todos los hosts administrados.\n  - Evidencia\
  \ no vacía en la workstation: `~/quest/inspection.log`.\n  - Resumen de `app1`, `app2`, `app3`: `changed=0`,\
  \ `unreachable=0`, `failed=0`.\n"
debrief: La selección de etiquetas se verificó tanto en el ámbito de la tarea como en los archivos de destino
  reales sin cambios.
stages.0.brief: La inspección debe conservar cada banner sano.
stages.0.objectives.0.text: El archivo inspection.log en la workstation no está vacío.
stages.0.objectives.1.text: Ejecutar la selección de inspección no cambia nada en ningún host administrado.
stages.0.objectives.2.text: La ejecución de inspección informa changed=0, unreachable=0 y failed=0 en los tres
  hosts.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/banner.txt` contiene
  `north-46`.
hints.0.text: Las etiquetas seleccionan un ámbito de ejecución; la inspección segura debe diseñarse, no darse
  por supuesta.
hints.1.text: 'Una etiqueta selecciona tareas, no una promesa de que sean de solo lectura. La tarea copy suministrada
  lleva inspect y seleccionarla puede sobrescribir el banner sano.


  Utilice --list-tasks --tags inspect para inspeccionar el alcance seleccionado.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: 'Mantenga separadas las etiquetas de entrega y de inspección; verifique changed=0 y el banner
  real. Guarda la ejecución solicitada con ansible-playbook --tags inspect rollout.yml > inspection.log.


  Verifica el resultado observado:


  - `cat ~/quest/inspection.log` — muestra un registro de inspección no vacío con changed=0, unreachable=0
  y failed=0 para app1, app2 y app3.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/banner.txt''` — imprime north-46
  de los tres hosts administrados.'
phrases.0: Inspeccioné qué tareas seleccionaría la etiqueta Ansible solicitada.
phrases.1: Separé las etiquetas de inspección y de implementación antes de ejecutar el diagnóstico.
phrases.2: Revisé tanto changed=0 como los archivos reales sin cambios en cada objetivo.
diagnostics.inspection_scope: El archivo rollout.yml en la workstation debe superar la comprobación conservada
  del alcance seguro de inspección.
diagnostics.inspection_run: El archivo verification.log en la workstation debe mostrar changed=0, unreachable=0
  y failed=0 para app1, app2 y app3.
diagnostics.banner_1: En app1, /srv/site/banner.txt contiene north-46.
diagnostics.banner_2: En app2, /srv/site/banner.txt contiene north-46.
diagnostics.banner_3: En app3, /srv/site/banner.txt contiene north-46.
diagnostics.inspection_recap_1: 'Workstation verification.log: app1 debe informar changed=0, unreachable=0
  y failed=0.'
diagnostics.inspection_recap_2: 'Workstation verification.log: app2 debe informar changed=0, unreachable=0
  y failed=0.'
diagnostics.inspection_recap_3: 'Workstation verification.log: app3 debe informar changed=0, unreachable=0
  y failed=0.'
