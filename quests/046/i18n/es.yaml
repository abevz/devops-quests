title: Etiquetas
brief: |-
  La inspección solicitada debe conservar los banners sanos.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Host `app1`:
    - En app1, /srv/site/banner.txt contiene north-46.
  - Host `app2`:
    - En app2, /srv/site/banner.txt contiene north-46.
  - Host `app3`:
    - En app3, /srv/site/banner.txt contiene north-46.
  - Resultados en la workstation y de ejecución:
    - El archivo inspection.log en la workstation no está vacío.
    - El playbook separa la entrega deploy de la inspección inspect de /srv/site/banner.txt en fleet.
    - La ejecución de inspección informa changed=0, unreachable=0 y failed=0 en los tres hosts.

  **Verifica antes de Check & finish:**
  - `cat ~/quest/inspection.log` — muestra un registro de inspección no vacío con changed=0, unreachable=0 y failed=0 para app1, app2 y app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/banner.txt'` — imprime north-46 de los tres hosts administrados.
  - `cat ~/quest/rollout.yml` — muestra la separación entre entrega deploy e inspección inspect del banner remoto.
debrief: La selección de etiquetas se verificó tanto en el ámbito de la tarea como en los archivos de destino reales
  sin cambios.
