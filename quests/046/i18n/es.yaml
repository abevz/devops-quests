hints.0.text: Una etiqueta selecciona tareas, no una promesa de que sean de solo lectura. La tarea copy suministrada
  lleva inspect y seleccionarla puede sobrescribir el banner sano.
hints.1.text: Utilice --list-tasks --tags inspect hasta inspect el alcance seleccionado.
hints.2.text: Mantenga separadas las etiquetas de entrega y de inspección; verifique changed=0 y el banner real.
  Guarda la ejecución solicitada con ansible-playbook --tags inspect rollout.yml > inspection.log.
phrases.0: Inspeccioné qué tareas seleccionaría la etiqueta Ansible solicitada.
phrases.1: Separé las etiquetas de inspección y de implementación antes de ejecutar el diagnóstico.
phrases.2: Revisé tanto changed=0 como los archivos reales sin cambios en cada objetivo.
