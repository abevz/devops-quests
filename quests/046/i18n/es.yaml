title: Etiquetas
brief: |-
  La inspección solicitada debe conservar los banners sanos.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/banner.txt`.
    - Contenido: `north-46`.
  - Resultado de inspección:
    - La selección inspect solo lee: al ejecutarla, cada banner queda tal como estaba.
    - Evidencia no vacía en la workstation: `~/quest/inspection.log`.
    - Resumen de `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  La comprobación observa los banners y los contadores del resumen durante una inspección real.
debrief: La selección de etiquetas se verificó tanto en el ámbito de la tarea como en los archivos de destino
  reales sin cambios.
stages.0.brief: La inspección debe conservar cada banner sano.
stages.0.objectives.0.text: El archivo inspection.log en la workstation no está vacío.
stages.0.objectives.1.text: |-
  La selección inspect solo lee: al ejecutarla, cada banner queda tal como estaba.
stages.0.objectives.2.text: La ejecución de inspección informa changed=0, unreachable=0 y failed=0 en los tres
  hosts.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/banner.txt` contiene
  `north-46`.
hints.0.text: Las etiquetas seleccionan un ámbito de ejecución; la inspección segura debe diseñarse, no darse
  por supuesta.
hints.1.text: 'Una etiqueta selecciona tareas, no una promesa de que sean de solo lectura. La tarea copy suministrada
  lleva inspect y seleccionarla puede sobrescribir el banner sano.


  Utilice --list-tasks --tags inspect para inspeccionar el alcance seleccionado.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: |-
  Desde `~/quest`, registra una inspección real con `ansible-playbook --tags inspect rollout.yml > inspection.log`. Compara el contenido de cada banner y la salida de `stat` antes y después; ambos permanecen iguales. `cat inspection.log` debe mostrar changed=0, unreachable=0 y failed=0 para app1, app2 y app3.
phrases.0: Inspeccioné qué tareas seleccionaría la etiqueta Ansible solicitada.
phrases.1: Separé las etiquetas de inspección y de implementación antes de ejecutar el diagnóstico.
phrases.2: Revisé tanto changed=0 como los archivos reales sin cambios en cada objetivo.
