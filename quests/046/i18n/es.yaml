title: Etiquetas
brief: |-
  La inspección solicitada debe conservar los banners sanos.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/banner.txt`.
    - Contenido: `north-46`.
  - Resultado de inspección:
    - La selección inspect solo lee: al ejecutarla, cada banner queda tal como estaba.
    - Evidencia no vacía en la workstation: `~/quest/inspection.log`.
    - Resumen de `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  La comprobación observa los banners y los contadores del resumen durante una inspección real.
debrief: La selección de etiquetas se verificó tanto en el ámbito de la tarea como en los archivos de destino
  reales sin cambios.
stages.0.brief: La inspección debe conservar cada banner sano.
stages.0.objectives.0.text: El archivo inspection.log en la workstation no está vacío.
stages.0.objectives.1.text: |-
  La selección inspect solo lee: al ejecutarla, cada banner queda tal como estaba.
stages.0.objectives.2.text: La ejecución de inspección informa changed=0, unreachable=0 y failed=0 en los tres
  hosts.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/banner.txt` contiene
  `north-46`.
hints.0.text: Las etiquetas seleccionan un ámbito de ejecución; la inspección segura debe diseñarse, no darse
  por supuesta.
hints.1.text: |-
  Una etiqueta selecciona tareas, no una promesa de que sean de solo lectura. La tarea copy suministrada lleva inspect y seleccionarla puede sobrescribir el banner sano.

  Utilice --list-tasks --tags inspect para inspeccionar el alcance seleccionado.

  Inspecciona las entradas suministradas y el ámbito de ejecución:

  ```sh
  cat inventory.ini
  cat rollout.yml
  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml
  ```
hints.2.text: |-
  Cuando la etiqueta inspect seleccione únicamente tareas de lectura, registra la suma de comprobación y los metadatos del banner de cada host antes y después de la inspección real.

  ```sh
  cd ~/quest
  snapshot_banners() {
    for number in 1 2 3; do
      host="app${number}-${DQ_NAMESPACE#dq-}"
      printf 'app%s\n' "$number"
      ssh -n -o BatchMode=yes -p 2222 "root@$host" \
        'sha256sum /srv/site/banner.txt &&
         stat -c "%f %u %g %y %z %N" /srv/site/banner.txt &&
         stat -L -c "%f %u %g %y %z" /srv/site/banner.txt' || return
    done
  }
  before=$(snapshot_banners) &&
    ansible-playbook --tags inspect rollout.yml > inspection.log &&
    after=$(snapshot_banners) &&
    diff -u <(printf '%s\n' "$before") <(printf '%s\n' "$after") &&
    cat inspection.log
  ```

  El comando diff debe terminar sin mostrar diferencias. En inspection.log, app1, app2 y app3 deben indicar changed=0, unreachable=0 y failed=0.
phrases.0: Inspeccioné qué tareas seleccionaría la etiqueta Ansible solicitada.
phrases.1: Separé las etiquetas de inspección y de implementación antes de ejecutar el diagnóstico.
phrases.2: Revisé tanto changed=0 como los archivos reales sin cambios en cada objetivo.
diagnostics.inspection_log: inspection.log falta o está vacío; puede no haberse registrado la inspección desde ~/quest o falló antes de generar salida. [Causa y comprobación](guides#guide=ansible-12&section=inspection-evidence)
diagnostics.inspection_scope: La inspección cambió un banner o no pudo verificar y restaurar su estado; inspect puede seguir seleccionando copy o falló SSH, el playbook, el plazo o la limpieza. [Causa y comprobación](guides#guide=ansible-12&section=inspection-unchanged)
diagnostics.inspection_run: La inspección en vivo falló o no se verificó su recap; errores del playbook, SSH, plazos, restauración o campos recap ambiguos pueden impedir un resultado completo. [Causa y comprobación](guides#guide=ansible-12&section=inspection-recap)
diagnostics.probe_0_1: La prueba de banners sin cambios se detuvo antes del diagnóstico Python; ~/quest, el inicio de Python o las entradas pueden no estar disponibles. [Causa y comprobación](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_2: La prueba recap se detuvo antes del diagnóstico Python; ~/quest, Python o el helper dq_check pueden no estar disponibles antes de la inspección. [Causa y comprobación](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_3: El grupo de shell falló sin diagnóstico por host; la observación puede haberse interrumpido antes de informar resultados. [Causa y comprobación](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.banner_1: app1 no devolvió north-46 desde su banner o falló SSH; una tarea deploy seleccionada puede haber sobrescrito el archivo o el host no está disponible. DQ_NAMESPACE ausente o incorrecto también puede impedir la observación SSH del host. [Causa y comprobación](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_1: app1 no tiene un recap inequívoco con changed=0, unreachable=0 y failed=0; tareas que modifican estado, fallos SSH o contadores ausentes o inválidos pueden explicarlo. [Causa y comprobación](guides#guide=ansible-12&section=inspection-recap)
diagnostics.banner_2: app2 no devolvió north-46 desde su banner o falló SSH; una tarea deploy seleccionada puede haber sobrescrito el archivo o el host no está disponible. DQ_NAMESPACE ausente o incorrecto también puede impedir la observación SSH del host. [Causa y comprobación](guides#guide=ansible-12&section=inspection-banner-content)
