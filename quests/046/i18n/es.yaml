title: Etiquetas
brief: 'Sólo se solicitó una inspección. rollout.yml asigna incorrectamente a la tarea de implementación
  copy la etiqueta inspect, por lo que el comando solicitado sobrescribiría un banner en buen estado.
  Asigne a esa tarea solo deploy, mantenga la tarea stat etiquetada como inspect y ejecute ansible-playbook
  --tags inspect rollout.yml > inspection.log. El north-46 banner sano en los tres objetivos debe sobrevivir.
  El verificador repite la inspección después de verificar el alcance de las dos tareas.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `inspection.log`, `verification.log`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: la tarea copy solo tiene deploy, stat tiene inspect y la inspección no
  cambia ninguno de los tres carteles north-46.'
debrief: La selección de etiquetas se verificó tanto en el ámbito de la tarea como en los archivos de
  destino reales sin cambios.
stages.0.brief: 'Criterios de éxito: la tarea de copia solo tiene deploy, stat tiene inspect y la inspección
  no cambia ninguno de los tres carteles north-46.'
stages.0.objectives.0.text: La tarea de copia solo tiene deploy, stat tiene inspect y la inspección no
  cambia ninguno de los tres carteles north-46.
hints.0.text: Una etiqueta selecciona tareas, no una promesa de que sean de solo lectura.
hints.1.text: Utilice --list-tasks --tags inspect hasta inspect el alcance seleccionado.
hints.2.text: Mantenga separadas las etiquetas de entrega y de inspección; verifique changed=0 y el banner
  real.
phrases.0: Inspeccioné qué tareas seleccionaría la etiqueta Ansible solicitada.
phrases.1: Separé las etiquetas de inspección y de implementación antes de ejecutar el diagnóstico.
phrases.2: Revisé tanto changed=0 como los archivos reales sin cambios en cada objetivo.
