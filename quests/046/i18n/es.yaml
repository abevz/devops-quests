diagnostics.banner_3: app3 no devolvió north-46 desde su banner o falló SSH; una tarea deploy seleccionada puede haber sobrescrito el archivo o el host no está disponible. DQ_NAMESPACE ausente o incorrecto también puede impedir la observación SSH del host. [Causa y comprobación](guides#guide=ansible-12&section=inspection-banner-content)
