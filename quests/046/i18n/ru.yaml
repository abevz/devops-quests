title: Теги
brief: |-
  Запрошенная проверка должна сохранить исправные баннеры.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/banner.txt`.
    - Содержимое: `north-46`.
  - Результат инспекции:
    - Выбранная инспекция не меняет ни один управляемый хост.
    - Непустое свидетельство на workstation: `~/quest/inspection.log`.
    - Сводка для `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  **Самопроверка перед Check & finish:**
  - `cat ~/quest/inspection.log` — показывает непустую запись проверки с changed=0, unreachable=0 и failed=0 для app1, app2 и app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/banner.txt'` — выводит north-46 со всех трёх управляемых хостов.
debrief: Выбор тегов проверен по границам задач и фактически неизменным файлам целей.
stages.0.brief: Проверка должна сохранять каждый исправный баннер.
stages.0.objectives.0.text: Файл inspection.log на workstation не пуст.
stages.0.objectives.1.text: Запуск выбранной проверки ничего не меняет ни на одном управляемом хосте.
stages.0.objectives.2.text: Проверочный запуск сообщает changed=0, unreachable=0 и failed=0 для всех трёх хостов.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/banner.txt` содержит
  `north-46`.
hints.0.text: Тег выбирает задачи, но не обещает отсутствие изменений. Выданная задача copy помечена inspect, поэтому
  её выбор может перезаписать исправный баннер.
hints.1.text: Посмотрите выбранные задачи через --list-tasks --tags inspect.
hints.2.text: 'Разделите теги доставки и инспекции; проверьте changed=0 и фактический banner. Сохраните запрошенный
  запуск: ansible-playbook --tags inspect rollout.yml > inspection.log.'
phrases.0: Я изучил задачи, выбираемые запрошенным тегом Ansible.
phrases.1: Я разделил теги инспекции и доставки до запуска диагностики.
phrases.2: Я проверил changed=0 и фактически неизменные файлы каждой цели.
