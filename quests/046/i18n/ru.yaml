title: Теги
brief: |-
  Запрошенная проверка должна сохранить исправные баннеры.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Хост `app1`:
    - На app1 файл /srv/site/banner.txt содержит north-46.
  - Хост `app2`:
    - На app2 файл /srv/site/banner.txt содержит north-46.
  - Хост `app3`:
    - На app3 файл /srv/site/banner.txt содержит north-46.
  - Результаты на workstation и результаты выполнения:
    - Файл inspection.log на workstation не пуст.
    - Playbook отделяет доставку deploy от проверки inspect файла /srv/site/banner.txt на fleet.
    - Проверочный запуск сообщает changed=0, unreachable=0 и failed=0 для всех трёх хостов.

  **Самопроверка перед Check & finish:**
  - `cat ~/quest/inspection.log` — показывает непустую запись проверки с changed=0, unreachable=0 и failed=0 для app1, app2 и app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/banner.txt'` — выводит north-46 со всех трёх управляемых хостов.
  - `cat ~/quest/rollout.yml` — показывает разделение доставки deploy и проверки inspect удалённого баннера.
debrief: Выбор тегов проверен по границам задач и фактически неизменным файлам целей.
stages.0.brief: Проверка должна сохранять каждый исправный баннер.
