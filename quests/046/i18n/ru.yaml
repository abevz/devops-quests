title: Теги
brief: "Запрошенная проверка должна сохранить исправные баннеры.\n\nРаботайте на workstation в `~/quest` с\
  \ файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Требования:**\n- Файл на каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/banner.txt`.\n  - Содержимое: `north-46`.\n- Результат\
  \ инспекции:\n  - Выбранная инспекция не меняет ни один управляемый хост.\n  - Непустое свидетельство на\
  \ workstation: `~/quest/inspection.log`.\n  - Сводка для `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`,\
  \ `failed=0`.\n"
debrief: Выбор тегов проверен по границам задач и фактически неизменным файлам целей.
stages.0.brief: Проверка должна сохранять каждый исправный баннер.
stages.0.objectives.0.text: Файл inspection.log на workstation не пуст.
stages.0.objectives.1.text: Запуск выбранной проверки ничего не меняет ни на одном управляемом хосте.
stages.0.objectives.2.text: Проверочный запуск сообщает changed=0, unreachable=0 и failed=0 для всех трёх хостов.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/banner.txt`
  содержит `north-46`.
hints.0.text: Теги выбирают область выполнения; безопасность инспекции нужно обеспечить, а не предполагать.
hints.1.text: 'Тег выбирает задачи, но не обещает отсутствие изменений. Выданная задача copy помечена inspect,
  поэтому её выбор может перезаписать исправный баннер.


  Посмотрите выбранные задачи через --list-tasks --tags inspect.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: 'Разделите теги доставки и инспекции; проверьте changed=0 и фактический banner. Сохраните запрошенный
  запуск: ansible-playbook --tags inspect rollout.yml > inspection.log.


  Проверьте наблюдаемый результат:


  - `cat ~/quest/inspection.log` — показывает непустую запись проверки с changed=0, unreachable=0 и failed=0
  для app1, app2 и app3.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/banner.txt''` — выводит north-46
  со всех трёх управляемых хостов.'
phrases.0: Я изучил задачи, выбираемые запрошенным тегом Ansible.
phrases.1: Я разделил теги инспекции и доставки до запуска диагностики.
phrases.2: Я проверил changed=0 и фактически неизменные файлы каждой цели.
diagnostics.inspection_scope: Файл rollout.yml на workstation должен проходить сохранённую проверку безопасной
  области инспекции.
diagnostics.inspection_run: Файл verification.log на workstation должен сообщать changed=0, unreachable=0 и
  failed=0 для app1, app2 и app3.
diagnostics.banner_1: На app1 файл /srv/site/banner.txt содержит north-46.
diagnostics.banner_2: На app2 файл /srv/site/banner.txt содержит north-46.
diagnostics.banner_3: На app3 файл /srv/site/banner.txt содержит north-46.
diagnostics.inspection_recap_1: 'Workstation verification.log: app1 должен сообщать changed=0, unreachable=0
  и failed=0.'
diagnostics.inspection_recap_2: 'Workstation verification.log: app2 должен сообщать changed=0, unreachable=0
  и failed=0.'
diagnostics.inspection_recap_3: 'Workstation verification.log: app3 должен сообщать changed=0, unreachable=0
  и failed=0.'
