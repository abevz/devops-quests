title: Теги
brief: |-
  Запрошенная проверка должна сохранить исправные баннеры.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/banner.txt`.
    - Содержимое: `north-46`.
  - Результат инспекции:
    - Выборка inspect только читает: после её запуска каждый баннер остаётся таким, каким был.
    - Непустое свидетельство на workstation: `~/quest/inspection.log`.
    - Сводка для `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  Проверка наблюдает баннеры и счётчики итогового отчёта во время реального запуска инспекции.
debrief: Выбор тегов проверен по границам задач и фактически неизменным файлам целей.
stages.0.brief: Проверка должна сохранять каждый исправный баннер.
stages.0.objectives.0.text: Файл inspection.log на workstation не пуст.
stages.0.objectives.1.text: |-
  Выборка inspect только читает: после её запуска каждый баннер остаётся таким, каким был.
stages.0.objectives.2.text: Проверочный запуск сообщает changed=0, unreachable=0 и failed=0 для всех трёх хостов.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/banner.txt`
  содержит `north-46`.
hints.0.text: Теги выбирают область выполнения; безопасность инспекции нужно обеспечить, а не предполагать.
hints.1.text: 'Тег выбирает задачи, но не обещает отсутствие изменений. Выданная задача copy помечена inspect,
  поэтому её выбор может перезаписать исправный баннер.


  Посмотрите выбранные задачи через --list-tasks --tags inspect.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: |-
  В `~/quest` запишите реальную инспекцию командой `ansible-playbook --tags inspect rollout.yml > inspection.log`. Сравните содержимое каждого баннера и вывод `stat` до и после запуска: они не меняются. `cat inspection.log` должен показать changed=0, unreachable=0 и failed=0 для app1, app2 и app3.
phrases.0: Я изучил задачи, выбираемые запрошенным тегом Ansible.
phrases.1: Я разделил теги инспекции и доставки до запуска диагностики.
phrases.2: Я проверил changed=0 и фактически неизменные файлы каждой цели.
