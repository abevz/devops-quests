title: Теги
brief: |-
  Запрошенная проверка должна сохранить исправные баннеры.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/banner.txt`.
    - Содержимое: `north-46`.
  - Результат инспекции:
    - Выборка inspect только читает: после её запуска каждый баннер остаётся таким, каким был.
    - Непустое свидетельство на workstation: `~/quest/inspection.log`.
    - Сводка для `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  Проверка наблюдает баннеры и счётчики итогового отчёта во время реального запуска инспекции.
debrief: Выбор тегов проверен по границам задач и фактически неизменным файлам целей.
stages.0.brief: Проверка должна сохранять каждый исправный баннер.
stages.0.objectives.0.text: Файл inspection.log на workstation не пуст.
stages.0.objectives.1.text: |-
  Выборка inspect только читает: после её запуска каждый баннер остаётся таким, каким был.
stages.0.objectives.2.text: Проверочный запуск сообщает changed=0, unreachable=0 и failed=0 для всех трёх хостов.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/banner.txt`
  содержит `north-46`.
hints.0.text: Теги выбирают область выполнения; безопасность инспекции нужно обеспечить, а не предполагать.
hints.1.text: |-
  Тег выбирает задачи, но не обещает отсутствие изменений. Выданная задача copy помечена inspect, поэтому её выбор может перезаписать исправный баннер.

  Посмотрите выбранные задачи через --list-tasks --tags inspect.

  Изучите поставленные входные данные и область выполнения:

  ```sh
  cat inventory.ini
  cat rollout.yml
  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml
  ```
hints.2.text: |-
  Когда тег inspect выбирает только задачи чтения, снимите контрольную сумму и метаданные файла на каждом хосте до и после реальной проверки.

  ```sh
  cd ~/quest
  snapshot_banners() {
    for number in 1 2 3; do
      host="app${number}-${DQ_NAMESPACE#dq-}"
      printf 'app%s\n' "$number"
      ssh -n -o BatchMode=yes -p 2222 "root@$host" \
        'sha256sum /srv/site/banner.txt &&
         stat -c "%f %u %g %y %z %N" /srv/site/banner.txt &&
         stat -L -c "%f %u %g %y %z" /srv/site/banner.txt' || return
    done
  }
  before=$(snapshot_banners) &&
    ansible-playbook --tags inspect rollout.yml > inspection.log &&
    after=$(snapshot_banners) &&
    diff -u <(printf '%s\n' "$before") <(printf '%s\n' "$after") &&
    cat inspection.log
  ```

  Команда diff должна завершиться без вывода. В inspection.log у каждого из app1, app2 и app3 должны быть changed=0, unreachable=0 и failed=0.
phrases.0: Я изучил задачи, выбираемые запрошенным тегом Ansible.
phrases.1: Я разделил теги инспекции и доставки до запуска диагностики.
phrases.2: Я проверил changed=0 и фактически неизменные файлы каждой цели.
diagnostics.inspection_log: 'inspection.log отсутствует или пуст: запуск мог не быть записан из ~/quest либо завершился до появления вывода. [Причина и проверка](guides#guide=ansible-12&section=inspection-evidence)'
diagnostics.inspection_scope: 'Inspection изменил banner либо не смог проверить и восстановить снимок: inspect мог выбрать copy либо произошёл сбой SSH, playbook, лимита времени или очистки. [Причина и проверка](guides#guide=ansible-12&section=inspection-unchanged)'
diagnostics.inspection_run: 'Живая проверка завершилась ошибкой либо recap не подтверждён: ошибки playbook, SSH, таймауты, ошибки восстановления или неоднозначные поля recap могут мешать полному результату. [Причина и проверка](guides#guide=ansible-12&section=inspection-recap)'
diagnostics.probe_0_1: 'Проверка неизменности banner остановилась до диагностики Python: ~/quest, запуск Python или входные данные могут быть недоступны. [Причина и проверка](guides#guide=ansible-12&section=inspection-inputs)'
diagnostics.probe_0_2: 'Проверка recap остановилась до диагностики Python: ~/quest, Python или helper dq_check могут быть недоступны до запуска inspection. [Причина и проверка](guides#guide=ansible-12&section=inspection-inputs)'
diagnostics.probe_0_3: 'Группа команд завершилась без диагностики по хостам: наблюдение могло прерваться до сообщения результатов. [Причина и проверка](guides#guide=ansible-12&section=inspection-inputs)'
diagnostics.banner_1: 'app1 не вернул north-46 из banner либо SSH завершился ошибкой: выбранная задача deploy могла перезаписать файл либо хост недоступен. Отсутствующий или неверный DQ_NAMESPACE также может помешать наблюдению по SSH для хоста. [Причина и проверка](guides#guide=ansible-12&section=inspection-banner-content)'
diagnostics.inspection_recap_1: 'У app1 нет однозначного recap с changed=0, unreachable=0 и failed=0: причиной могут быть изменяющие задачи, сбои SSH либо отсутствующие или некорректные счётчики. [Причина и проверка](guides#guide=ansible-12&section=inspection-recap)'
diagnostics.banner_2: 'app2 не вернул north-46 из banner либо SSH завершился ошибкой: выбранная задача deploy могла перезаписать файл либо хост недоступен. Отсутствующий или неверный DQ_NAMESPACE также может помешать наблюдению по SSH для хоста. [Причина и проверка](guides#guide=ansible-12&section=inspection-banner-content)'
