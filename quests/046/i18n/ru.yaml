title: Теги
brief: 'Запрошена только инспекция. В rollout.yml задача доставки copy ошибочно помечена
  inspect, поэтому команда перезаписала бы исправный banner. Дайте этой задаче только
  deploy, сохраните inspect у stat и выполните ansible-playbook --tags inspect rollout.yml
  > inspection.log. Исправный banner north-46 на трёх целях должен сохраниться. Проверка
  повторит инспекцию после проверки границ двух задач.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`,
  `ansible.cfg`, `rollout.yml`, `inspection.log`, `verification.log`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Copy помечен только deploy, stat — inspect; инспекция не меняет
  ни один из трёх banner north-46.'
debrief: Выбор тегов проверен по границам задач и фактически неизменным файлам целей.
stages.0.brief: 'Результат проверки: Copy помечен только deploy, stat — inspect; инспекция
  не меняет ни один из трёх banner north-46.'
stages.0.objectives.0.text: Copy помечен только deploy, stat — inspect; инспекция
  не меняет ни один из трёх banner north-46.
hints.0.text: Тег выбирает задачи, но не обещает отсутствие изменений.
hints.1.text: Посмотрите выбранные задачи через --list-tasks --tags inspect.
hints.2.text: Разделите теги доставки и инспекции; проверьте changed=0 и фактический
  banner.
phrases.0: Я изучил задачи, выбираемые запрошенным тегом Ansible.
phrases.1: Я разделил теги инспекции и доставки до запуска диагностики.
phrases.2: Я проверил changed=0 и фактически неизменные файлы каждой цели.
