title: Tagi
brief: |-
  Żądana inspekcja musi zachować poprawne banery.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/banner.txt`.
    - Treść: `north-46`.
  - Wynik inspekcji:
    - Wybór inspect tylko odczytuje: jego uruchomienie pozostawia każdy baner bez zmian.
    - Niepusty dowód na workstation: `~/quest/inspection.log`.
    - Podsumowanie dla `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  Kontrola obserwuje banery i liczniki podsumowania podczas rzeczywistego uruchomienia inspekcji.
debrief: Wybór tagu został zweryfikowany zarówno pod kątem zakresu zadania, jak i rzeczywistych, niezmienionych
  plików docelowych.
stages.0.brief: Inspekcja musi zachować każdy poprawny baner.
stages.0.objectives.0.text: Plik inspection.log na workstation nie jest pusty.
stages.0.objectives.1.text: |-
  Wybór inspect tylko odczytuje: jego uruchomienie pozostawia każdy baner bez zmian.
stages.0.objectives.2.text: Wykonanie inspekcji zgłasza changed=0, unreachable=0 i failed=0 dla wszystkich
  trzech hostów.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/banner.txt`
  zawiera `north-46`.
hints.0.text: Tagi wybierają zakres wykonania; bezpieczną inspekcję trzeba zaprojektować, a nie zakładać.
hints.1.text: 'Znacznik wybiera zadania, a nie obietnicę, że są one tylko do odczytu. Dostarczone zadanie copy
  ma inspect, więc jego wybór może nadpisać poprawny baner.


  Użyj --list-tasks --tags inspect, aby sprawdzić wybrany zakres.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: |-
  W `~/quest` zapisz rzeczywistą inspekcję poleceniem `ansible-playbook --tags inspect rollout.yml > inspection.log`. Porównaj treść każdego banera i wynik `stat` przed uruchomieniem i po nim; oba pozostają bez zmian. `cat inspection.log` musi pokazać changed=0, unreachable=0 i failed=0 dla app1, app2 i app3.
phrases.0: Sprawdziłem, jakie zadania wybierze żądany tag Ansible.
phrases.1: Przed uruchomieniem diagnostyki oddzieliłem tagi inspekcji i wdrożenia.
phrases.2: Sprawdziłem zarówno changed=0, jak i faktycznie niezmienione pliki na każdym celu.
diagnostics.inspection_scope: |-
  Inspekcja musi pozostawić treść i metadane pliku każdego banera bez zmian.
diagnostics.inspection_run: |-
  Inspekcja musi zakończyć się pomyślnie i zgłosić zerowe liczniki changed, unreachable i failed dla każdego zarządzanego hosta.
