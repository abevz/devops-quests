title: Tagi
brief: |-
  Żądana inspekcja musi zachować poprawne banery.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/banner.txt`.
    - Treść: `north-46`.
  - Wynik inspekcji:
    - Wybór inspect tylko odczytuje: jego uruchomienie pozostawia każdy baner bez zmian.
    - Niepusty dowód na workstation: `~/quest/inspection.log`.
    - Podsumowanie dla `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.

  Kontrola obserwuje banery i liczniki podsumowania podczas rzeczywistego uruchomienia inspekcji.
debrief: Wybór tagu został zweryfikowany zarówno pod kątem zakresu zadania, jak i rzeczywistych, niezmienionych
  plików docelowych.
stages.0.brief: Inspekcja musi zachować każdy poprawny baner.
stages.0.objectives.0.text: Plik inspection.log na workstation nie jest pusty.
stages.0.objectives.1.text: |-
  Wybór inspect tylko odczytuje: jego uruchomienie pozostawia każdy baner bez zmian.
stages.0.objectives.2.text: Wykonanie inspekcji zgłasza changed=0, unreachable=0 i failed=0 dla wszystkich
  trzech hostów.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/banner.txt`
  zawiera `north-46`.
hints.0.text: Tagi wybierają zakres wykonania; bezpieczną inspekcję trzeba zaprojektować, a nie zakładać.
hints.1.text: |-
  Znacznik wybiera zadania, a nie obietnicę, że są one tylko do odczytu. Dostarczone zadanie copy ma inspect, więc jego wybór może nadpisać poprawny baner.

  Użyj --list-tasks --tags inspect, aby sprawdzić wybrany zakres.

  Sprawdź dostarczone dane wejściowe i zakres wykonania:

  ```sh
  cat inventory.ini
  cat rollout.yml
  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml
  ```
hints.2.text: |-
  Gdy tag inspect wybiera wyłącznie zadania odczytu, zapisz sumę kontrolną i metadane banera na każdym hoście przed rzeczywistą inspekcją i po niej.

  ```sh
  cd ~/quest
  snapshot_banners() {
    for number in 1 2 3; do
      host="app${number}-${DQ_NAMESPACE#dq-}"
      printf 'app%s\n' "$number"
      ssh -n -o BatchMode=yes -p 2222 "root@$host" \
        'sha256sum /srv/site/banner.txt &&
         stat -c "%f %u %g %y %z %N" /srv/site/banner.txt &&
         stat -L -c "%f %u %g %y %z" /srv/site/banner.txt' || return
    done
  }
  before=$(snapshot_banners) &&
    ansible-playbook --tags inspect rollout.yml > inspection.log &&
    after=$(snapshot_banners) &&
    diff -u <(printf '%s\n' "$before") <(printf '%s\n' "$after") &&
    cat inspection.log
  ```

  Polecenie diff powinno zakończyć się bez wyniku. W inspection.log każdy z hostów app1, app2 i app3 musi mieć changed=0, unreachable=0 i failed=0.
phrases.0: Sprawdziłem, jakie zadania wybierze żądany tag Ansible.
phrases.1: Przed uruchomieniem diagnostyki oddzieliłem tagi inspekcji i wdrożenia.
phrases.2: Sprawdziłem zarówno changed=0, jak i faktycznie niezmienione pliki na każdym celu.
diagnostics.inspection_log: inspection.log nie istnieje lub jest pusty; kontrola mogła nie zostać zapisana z ~/quest albo zakończyła się przed wygenerowaniem wyjścia. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-evidence)
diagnostics.inspection_scope: Kontrola zmieniła banner lub nie zweryfikowała i nie odtworzyła migawki; inspect może nadal wybierać copy albo zawiódł SSH, playbook, limit czasu lub sprzątanie. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-unchanged)
diagnostics.inspection_run: Bieżąca kontrola zawiodła lub nie dało się sprawdzić recap; błędy playbooka, SSH, limit czasu, odtwarzanie lub niejednoznaczne pola recap mogą blokować pełny wynik. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-recap)
diagnostics.probe_0_1: Kontrola niezmienionych bannerów zatrzymała się przed diagnostyką Python; ~/quest, start Pythona lub dane wejściowe mogą być niedostępne. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_2: Kontrola recap zatrzymała się przed diagnostyką Python; ~/quest, Python lub helper dq_check może być niedostępny przed uruchomieniem kontroli. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.probe_0_3: Grupa poleceń zawiodła bez diagnostyki hostów; obserwacja mogła zostać przerwana przed zgłoszeniem wyników. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-inputs)
diagnostics.banner_1: app1 nie zwrócił north-46 z bannera lub SSH zawiódł; wybrane zadanie deploy mogło nadpisać plik albo host jest niedostępny. Brak lub błędna wartość DQ_NAMESPACE może też uniemożliwić obserwację hosta przez SSH. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_1: app1 nie ma jednoznacznego recap z changed=0, unreachable=0 i failed=0; przyczyną mogą być wybrane zadania zmieniające stan, błędy SSH lub brakujące albo błędne liczniki. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-recap)
diagnostics.banner_2: app2 nie zwrócił north-46 z bannera lub SSH zawiódł; wybrane zadanie deploy mogło nadpisać plik albo host jest niedostępny. Brak lub błędna wartość DQ_NAMESPACE może też uniemożliwić obserwację hosta przez SSH. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-banner-content)
diagnostics.inspection_recap_2: app2 nie ma jednoznacznego recap z changed=0, unreachable=0 i failed=0; przyczyną mogą być wybrane zadania zmieniające stan, błędy SSH lub brakujące albo błędne liczniki. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-recap)
diagnostics.banner_3: app3 nie zwrócił north-46 z bannera lub SSH zawiódł; wybrane zadanie deploy mogło nadpisać plik albo host jest niedostępny. Brak lub błędna wartość DQ_NAMESPACE może też uniemożliwić obserwację hosta przez SSH. [Przyczyna i kontrola](guides#guide=ansible-12&section=inspection-banner-content)
