title: Tagi
brief: "Żądana inspekcja musi zachować poprawne banery.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n\
  \  - Ścieżka: `/srv/site/banner.txt`.\n  - Treść: `north-46`.\n- Wynik inspekcji:\n  - Wybrana inspekcja\
  \ pozostawia wszystkie zarządzane hosty bez zmian.\n  - Niepusty dowód na workstation: `~/quest/inspection.log`.\n\
  \  - Podsumowanie dla `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.\n"
debrief: Wybór tagu został zweryfikowany zarówno pod kątem zakresu zadania, jak i rzeczywistych, niezmienionych
  plików docelowych.
stages.0.brief: Inspekcja musi zachować każdy poprawny baner.
stages.0.objectives.0.text: Plik inspection.log na workstation nie jest pusty.
stages.0.objectives.1.text: Uruchomienie wybranej inspekcji niczego nie zmienia na żadnym zarządzanym hoście.
stages.0.objectives.2.text: Wykonanie inspekcji zgłasza changed=0, unreachable=0 i failed=0 dla wszystkich
  trzech hostów.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/banner.txt`
  zawiera `north-46`.
hints.0.text: Tagi wybierają zakres wykonania; bezpieczną inspekcję trzeba zaprojektować, a nie zakładać.
hints.1.text: 'Znacznik wybiera zadania, a nie obietnicę, że są one tylko do odczytu. Dostarczone zadanie copy
  ma inspect, więc jego wybór może nadpisać poprawny baner.


  Użyj --list-tasks --tags inspect, aby sprawdzić wybrany zakres.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat rollout.yml

  ansible-playbook -i inventory.ini --list-tasks --tags inspect rollout.yml

  ```'
hints.2.text: 'Trzymaj oddzielnie znaczniki dostawy i kontroli; sprawdź changed=0 i rzeczywisty banner. Zapisz
  żądane wykonanie przez ansible-playbook --tags inspect rollout.yml > inspection.log.


  Sprawdź obserwowany wynik:


  - `cat ~/quest/inspection.log` — pokazuje niepusty zapis inspekcji z changed=0, unreachable=0 i failed=0
  dla app1, app2 i app3.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/banner.txt''` — wypisuje
  north-46 ze wszystkich trzech zarządzanych hostów.'
phrases.0: Sprawdziłem, jakie zadania wybierze żądany tag Ansible.
phrases.1: Przed uruchomieniem diagnostyki oddzieliłem tagi inspekcji i wdrożenia.
phrases.2: Sprawdziłem zarówno changed=0, jak i faktycznie niezmienione pliki na każdym celu.
diagnostics.inspection_scope: Plik rollout.yml na workstation musi przechodzić zachowaną kontrolę bezpiecznego
  zakresu inspekcji.
diagnostics.inspection_run: Plik verification.log na workstation musi zgłaszać changed=0, unreachable=0 i failed=0
  dla app1, app2 i app3.
diagnostics.banner_1: Na app1 plik /srv/site/banner.txt zawiera north-46.
diagnostics.banner_2: Na app2 plik /srv/site/banner.txt zawiera north-46.
diagnostics.banner_3: Na app3 plik /srv/site/banner.txt zawiera north-46.
diagnostics.inspection_recap_1: 'Workstation verification.log: app1 musi zgłaszać changed=0, unreachable=0
  i failed=0.'
diagnostics.inspection_recap_2: 'Workstation verification.log: app2 musi zgłaszać changed=0, unreachable=0
  i failed=0.'
