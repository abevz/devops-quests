title: Tagi
brief: 'Zażądano jedynie przejazdu kontrolnego. rollout.yml błędnie nadaje zadaniu wdrażania copy znacznik
  inspect, więc żądane polecenie zastąpiłoby zdrowe banner. Nadaj temu zadaniu tylko deploy, zachowaj
  oznaczenie zadania stat jako inspect i uruchom ansible-playbook --tags inspect rollout.yml > inspection.log.
  Zdrowy north-46 banner na wszystkich trzech celach musi przetrwać. Kontroler powtarza kontrolę po sprawdzeniu
  zakresu dwuzadaniowego.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `inspection.log`, `verification.log`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zadanie copy ma tylko deploy, stat ma inspect, a inspekcja nie zmienia
  żadnego z trzech banerów north-46.'
debrief: Wybór tagu został zweryfikowany zarówno pod kątem zakresu zadania, jak i rzeczywistych, niezmienionych
  plików docelowych.
stages.0.brief: 'Kryteria sukcesu: zadanie kopiowania zawiera tylko deploy, stat ma inspect, a inspekcja
  nie zmienia żadnego z trzech banerów north-46.'
stages.0.objectives.0.text: Zadanie kopiowania ma tylko deploy, stat ma inspect, a inspekcja nie zmienia
  żadnego z trzech banerów north-46.
hints.0.text: Znacznik wybiera zadania, a nie obietnicę, że są one tylko do odczytu.
hints.1.text: Użyj --list-tasks --tags inspect, aby sprawdzić wybrany zakres.
hints.2.text: Trzymaj oddzielnie znaczniki dostawy i kontroli; sprawdź changed=0 i rzeczywisty banner.
phrases.0: Sprawdziłem, jakie zadania wybierze żądany tag Ansible.
phrases.1: Przed uruchomieniem diagnostyki oddzieliłem tagi inspekcji i wdrożenia.
phrases.2: Sprawdziłem zarówno changed=0, jak i faktycznie niezmienione pliki na każdym celu.
