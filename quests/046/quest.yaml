id: 46
title: title
track: Ansible
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      if ! test -s inspection.log; then
        printf '%s\n' 'The workstation inspection.log must be nonempty: ✗ [DQ:inspection_log]'
        exit 1
      fi
  - text: stages.0.objectives.1.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      set -euo pipefail
      cd ~/quest
      python3 -I - <<'DQ_INSPECTION'
      import base64
      from concurrent.futures import ThreadPoolExecutor
      import json
      import os
      import re
      import shlex
      import signal
      import subprocess
      import tempfile
      import time

      started = time.monotonic()
      deadline = started + 15
      cleanup_deadline = started + 23
      def budget(limit=5):
          remaining = deadline - time.monotonic()
          if remaining <= 0: raise TimeoutError()
          return min(limit, remaining)

      REMOTE_READ = "import base64,json,os; from pathlib import Path; p=Path('/srv/site/banner.txt'); s=p.stat(); print(json.dumps({'data':base64.b64encode(p.read_bytes()).decode(),'mode':s.st_mode,'uid':s.st_uid,'gid':s.st_gid,'mtime':s.st_mtime_ns,'ctime':s.st_ctime_ns,'link':os.readlink(p) if p.is_symlink() else None}))"
      REMOTE_RESTORE = "import base64,json,os,sys; from pathlib import Path; p=Path('/srv/site/banner.txt'); old=json.loads(base64.b64decode(sys.argv[1])); link=old['link']; different=(p.is_symlink() and (link is None or os.readlink(p)!=link)) or (link is not None and not p.is_symlink()); different and p.unlink(missing_ok=True); link is not None and not p.is_symlink() and p.symlink_to(link); p.write_bytes(base64.b64decode(old['data'])); os.chown(p,old['uid'],old['gid']); os.chmod(p,old['mode'] & 0o7777); os.utime(p,ns=(old['mtime'],old['mtime']))"
      def remote(host, code, argument=None):
          suffix = os.environ['DQ_NAMESPACE'].removeprefix('dq-')
          command = 'python3 -c '+shlex.quote(code)
          if argument is not None: command += ' '+shlex.quote(argument)
          result = subprocess.run(['ssh','-n','-o','BatchMode=yes','-p','2222','root@'+host+'-'+suffix,command],capture_output=True,text=True,timeout=budget(2))
          if result.returncode: raise RuntimeError('Unable to observe or restore banner')
          return result.stdout

      def banners():
          with ThreadPoolExecutor(max_workers=3) as pool:
              return dict(pool.map(lambda host:(host,json.loads(remote(host,REMOTE_READ))),('app1','app2','app3')))

      def inspected():
          global deadline
          before = banners()
          changed = []
          try:
              with tempfile.TemporaryFile(mode='w+') as output:
                  run = subprocess.Popen(['ansible-playbook','--tags','inspect','rollout.yml'],stdout=output,stderr=subprocess.STDOUT,start_new_session=True)
                  try:
                      run.wait(timeout=budget(8))
                  except BaseException:
                      # Cancel this probe's local workers before restoring banners.
                      try:
                          os.killpg(run.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      run.wait(timeout=budget(2))
                      raise
                  output.seek(0)
                  text = output.read()
              after = banners()
              changed = [host for host in before if before[host] != after[host]]
              return run.returncode, text, changed
          finally:
              deadline = cleanup_deadline
              # A failed inspection must not leave the learner's banners damaged by the probe.
              # Successful read-only runs require no restoration and do not touch file metadata.
              def restore(item):
                  host, original = item
                  try:
                      current = json.loads(remote(host,REMOTE_READ))
                  except Exception:
                      current = None
                  if current != original:
                      encoded = base64.b64encode(json.dumps(original).encode()).decode()
                      remote(host,REMOTE_RESTORE,encoded)
              with ThreadPoolExecutor(max_workers=3) as pool:
                  list(pool.map(restore,before.items()))

      try:
          status, text, changed = inspected()
          for host in changed:
              print(host+' banner changed during inspection: ✗ [DQ:inspection_scope]')
          if status: print('Inspection selection did not complete: ✗ [DQ:inspection_run]')
          raise SystemExit(int(bool(status or changed)))
      except Exception:
          print('Inspection could not verify unchanged banners: ✗ [DQ:inspection_scope]')
          raise SystemExit(1)
      DQ_INSPECTION
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.2.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      set -euo pipefail
      cd ~/quest
      python3 -I - <<'DQ_INSPECTION_RECAP'
      import base64
      from concurrent.futures import ThreadPoolExecutor
      import json
      import os
      import re
      import shlex
      import signal
      import subprocess
      import tempfile
      import time

      started = time.monotonic()
      deadline = started + 15
      cleanup_deadline = started + 23
      def budget(limit=5):
          remaining = deadline - time.monotonic()
          if remaining <= 0: raise TimeoutError()
          return min(limit, remaining)

      REMOTE_READ = "import base64,json,os; from pathlib import Path; p=Path('/srv/site/banner.txt'); s=p.stat(); print(json.dumps({'data':base64.b64encode(p.read_bytes()).decode(),'mode':s.st_mode,'uid':s.st_uid,'gid':s.st_gid,'mtime':s.st_mtime_ns,'ctime':s.st_ctime_ns,'link':os.readlink(p) if p.is_symlink() else None}))"
      REMOTE_RESTORE = "import base64,json,os,sys; from pathlib import Path; p=Path('/srv/site/banner.txt'); old=json.loads(base64.b64decode(sys.argv[1])); link=old['link']; different=(p.is_symlink() and (link is None or os.readlink(p)!=link)) or (link is not None and not p.is_symlink()); different and p.unlink(missing_ok=True); link is not None and not p.is_symlink() and p.symlink_to(link); p.write_bytes(base64.b64decode(old['data'])); os.chown(p,old['uid'],old['gid']); os.chmod(p,old['mode'] & 0o7777); os.utime(p,ns=(old['mtime'],old['mtime']))"
      def remote(host, code, argument=None):
          suffix = os.environ['DQ_NAMESPACE'].removeprefix('dq-')
          command = 'python3 -c '+shlex.quote(code)
          if argument is not None: command += ' '+shlex.quote(argument)
          result = subprocess.run(['ssh','-n','-o','BatchMode=yes','-p','2222','root@'+host+'-'+suffix,command],capture_output=True,text=True,timeout=budget(2))
          if result.returncode: raise RuntimeError('Unable to observe or restore banner')
          return result.stdout

      def banners():
          with ThreadPoolExecutor(max_workers=3) as pool:
              return dict(pool.map(lambda host:(host,json.loads(remote(host,REMOTE_READ))),('app1','app2','app3')))

      def inspected():
          global deadline
          before = banners()
          changed = []
          try:
              with tempfile.TemporaryFile(mode='w+') as output:
                  run = subprocess.Popen(['ansible-playbook','--tags','inspect','rollout.yml'],stdout=output,stderr=subprocess.STDOUT,start_new_session=True)
                  try:
                      run.wait(timeout=budget(8))
                  except BaseException:
                      # Cancel this probe's local workers before restoring banners.
                      try:
                          os.killpg(run.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      run.wait(timeout=budget(2))
                      raise
                  output.seek(0)
                  text = output.read()
              after = banners()
              changed = [host for host in before if before[host] != after[host]]
              return run.returncode, text, changed
          finally:
              deadline = cleanup_deadline
              # A failed inspection must not leave the learner's banners damaged by the probe.
              # Successful read-only runs require no restoration and do not touch file metadata.
              def restore(item):
                  host, original = item
                  try:
                      current = json.loads(remote(host,REMOTE_READ))
                  except Exception:
                      current = None
                  if current != original:
                      encoded = base64.b64encode(json.dumps(original).encode()).decode()
                      remote(host,REMOTE_RESTORE,encoded)
              with ThreadPoolExecutor(max_workers=3) as pool:
                  list(pool.map(restore,before.items()))







      from dq_check import ansible_recap as recap



      try:
          status, text, changed = inspected()
          rows = recap(text)
          failed = status != 0
          if failed: print('Inspection selection did not complete: ✗ [DQ:inspection_run]')
          for number in (1,2,3):
              row = rows.get('app'+str(number), {})
              if any(row.get(key) != 0 for key in ('changed','unreachable','failed')):
                  print('app'+str(number)+' inspection must report zero changed/unreachable/failed: ✗ [DQ:inspection_recap_'+str(number)+']')
                  failed = True
          raise SystemExit(int(failed))
      except Exception:
          print('Inspection recap could not be verified: ✗ [DQ:inspection_run]')
          raise SystemExit(1)
      DQ_INSPECTION_RECAP
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_2]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.3.text
    keep: true
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      dq_group_failed=0
      set +e
      (
      set -e
      ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" 'test "$(cat /srv/site/banner.txt)" = north-46'
      )
      dq_condition_rc=$?
      if [ "$dq_condition_rc" -ne 0 ]; then
      printf '%s\n' 'On app1, /srv/site/banner.txt contains north-46 : ✗ [DQ:banner_1]'
      dq_group_failed=1
      fi
      (
      set -e
      ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" 'test "$(cat /srv/site/banner.txt)" = north-46'
      )
      dq_condition_rc=$?
      if [ "$dq_condition_rc" -ne 0 ]; then
      printf '%s\n' 'On app2, /srv/site/banner.txt contains north-46 : ✗ [DQ:banner_2]'
      dq_group_failed=1
      fi
      (
      set -e
      ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" 'test "$(cat /srv/site/banner.txt)" = north-46'
      )
      dq_condition_rc=$?
      if [ "$dq_condition_rc" -ne 0 ]; then
      printf '%s\n' 'On app3, /srv/site/banner.txt contains north-46 : ✗ [DQ:banner_3]'
      dq_group_failed=1
      fi
      set -e
      test "$dq_group_failed" -eq 0
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_3]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
