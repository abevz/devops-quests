title: Repeated module calls
brief: |
  The requested notice set is incomplete.

  Work on the workstation in `~/quest` with `main.tf`, `modules/notice/main.tf`.

  **Requirements:**
  - OpenTofu state:
    - Required addresses: `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
  - Files on the workstation:
    - `~/quest/north.txt`: `north-ready`.
    - `~/quest/south.txt`: `south-ready`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  **Verify yourself before Check & finish:**
  - `tofu show -no-color` — Includes `module.stations["north"].local_file.notice` and `module.stations["south"].local_file.notice`.
  - `cat north.txt south.txt` — Shows `north-ready` and `south-ready` respectively.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure changes.
stages.0.brief: Both requested notices must be available.
hints.0.text: Stable instance keys identify distinct module instances.
hints.1.text: Both north and south need their own for_each key and station input.
hints.2.text: Use both keys, pass each.key to station, then initialize and apply.
debrief: The two module state addresses, notice files and no-change plan now match the checks.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: tofu state list must contain module.stations["south"].local_file.notice.
diagnostics.condition_1: tofu state list must contain module.stations["north"].local_file.notice.
diagnostics.condition_2: south.txt must equal south-ready.
diagnostics.condition_3: north.txt must equal north-ready.
diagnostics.condition_4: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: OpenTofu state includes `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
stages.0.objectives.1.text: On the workstation, `north.txt` contains `north-ready`; `south.txt` contains `south-ready`.
stages.0.objectives.2.text: OpenTofu reports no pending infrastructure changes.
