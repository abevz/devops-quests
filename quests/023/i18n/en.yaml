title: Repeated module calls
brief: 'You joined SignalRail operations. Create two independent notice modules with distinct outputs.
  Work in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `modules/notice/main.tf`, `main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Both module instances own their correct live files.'
stages.0.brief: 'Call the same module for north and south. Preserve distinct resource addresses.


  Success criteria: Both module instances own their correct live files.'
stages.0.objectives.0.text: Both module instances own their correct live files.
hints.0.text: Inspect module keys in tofu state list.
hints.1.text: Both north and south need their own for_each key and station input.
hints.2.text: Use both keys, pass each.key to station and verify distinct files and outputs.
debrief: Only one station module existed. You added the second for_each key and checked independent addresses,
  files and outputs.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
