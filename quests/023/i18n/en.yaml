title: Repeated module calls
brief: 'In `~/quest`, inspect `main.tf` and `modules/notice/main.tf`. The supplied child module already declares its offline provider. The root currently calls it for one key with an incorrect input. Use the local module guide linked in the hints to understand module calls and `for_each` keys.


  Call `./modules/notice` as `module.stations` for the keys `north` and `south`, passing each key as `station`. Initialize and apply. Verify that `tofu state list` contains both `module.stations["north"].local_file.notice` and `module.stations["south"].local_file.notice`; `north.txt` must contain `north-ready` and `south.txt` must contain `south-ready`. Finally `tofu plan -input=false -detailed-exitcode -no-color` must exit 0, meaning no changes. Work only inside this offline bay.'
stages.0.brief: Create both keyed module instances and verify their state addresses, file contents and a no-change plan as described in the brief.
stages.0.objectives.0.text: Both required state addresses and files match, and the plan exits 0.
hints.0.text: Inspect module keys in tofu state list.
hints.1.text: Both north and south need their own for_each key and station input.
hints.2.text: Use both keys, pass each.key to station and verify distinct files and outputs.
debrief: The two module state addresses, notice files and no-change plan now match the checks.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
