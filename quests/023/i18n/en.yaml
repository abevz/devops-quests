title: Repeated module calls
brief: 'The requested notice set is incomplete.


  Work on the workstation in `~/quest` with `main.tf`, `modules/notice/main.tf`.


  **Requirements:**

  - Both requested notices are tracked as managed module instances.

  - On the workstation, `~/quest/north.txt` contains `north-ready`; `~/quest/south.txt` contains `south-ready`.

  - A detailed plan reports no pending infrastructure changes and exits with code `0`.

  '
stages.0.brief: Both requested notices must be available.
hints.0.text: Each requested notice needs its own managed identity.
hints.1.text: 'Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf modules/notice/main.tf

  tofu show -no-color

  ```'
hints.2.text: |-
  Both north and south need their own for_each key and station input.

  Use both keys, pass each.key to station, then initialize and apply.

  Verify the observed result:

  - `tofu show -no-color` — Includes `north.txt` and `south.txt`.

  - `cat north.txt south.txt` — Shows `north-ready` and `south-ready` respectively.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure changes.

  Both requested files are tracked in distinct managed module instances.
debrief: The two module state addresses, notice files and no-change plan now match the checks.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
