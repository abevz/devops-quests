title: Llamadas repetidas al módulo
brief: 'Te uniste a las operaciones de SignalRail. Cree dos módulos de avisos independientes con resultados
  distintos. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `modules/notice/main.tf`, `main.tf`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: ambas instancias del módulo poseen sus archivos activos correctos.'
stages.0.brief: 'Llame al mismo módulo para north y south. Preservar direcciones de recursos distintas.


  Criterios de éxito: ambas instancias del módulo poseen sus archivos activos correctos.'
stages.0.objectives.0.text: Ambas instancias de módulo poseen sus archivos en vivo correctos.
hints.0.text: Inspeccione las claves del módulo en el estado tofu list.
hints.1.text: Tanto north como south necesitan su propia clave for_each y entrada station.
hints.2.text: Utilice ambas claves, pase each.key a station y verifique archivos distintos y outputs.
debrief: Sólo existía un módulo station. Agregó la segunda clave for_each y verificó direcciones independientes,
  archivos y outputs.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
