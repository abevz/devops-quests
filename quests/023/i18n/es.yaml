title: Llamadas repetidas al módulo
brief: 'El conjunto de avisos solicitado está incompleto.


  Trabaja en la workstation en `~/quest` con `main.tf`, `modules/notice/main.tf`.


  **Requisitos:**

  - Ambos avisos solicitados están registrados como instancias de módulo gestionadas.

  - En la workstation, `~/quest/north.txt` contiene `north-ready`; `~/quest/south.txt` contiene `south-ready`.

  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.

  '
stages.0.brief: Ambos avisos solicitados deben estar disponibles.
hints.0.text: Cada aviso solicitado necesita su propia identidad gestionada.
hints.1.text: 'Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf modules/notice/main.tf

  tofu show -no-color

  ```'
hints.2.text: |-
  Tanto north como south necesitan su propia clave for_each y entrada station.

  Usa ambas claves, pasa each.key a station, inicializa y aplica.

  Verifica el resultado observado:

  - `tofu show -no-color` — Incluye `north.txt` y `south.txt`.

  - `cat north.txt south.txt` — Muestra `north-ready` y `south-ready`, respectivamente.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura pendientes.

  Ambos archivos solicitados se registran en instancias de módulo gestionadas distintas.
debrief: Las dos direcciones de estado de módulo, los archivos de aviso y el plan sin cambios coinciden ahora
  con las comprobaciones.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: |-
  south.txt debe registrarse en su propia instancia de módulo gestionada.

diagnostics.condition_1: |-
  north.txt debe registrarse en su propia instancia de módulo gestionada.

diagnostics.condition_2: south.txt debe ser igual a south-ready.
diagnostics.condition_3: north.txt debe ser igual a north-ready.
diagnostics.condition_4: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: Ambos avisos solicitados están registrados como instancias de módulo gestionadas.
stages.0.objectives.1.text: En la workstation, `~/quest/north.txt` contiene `north-ready`; `~/quest/south.txt`
  contiene `south-ready`.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
