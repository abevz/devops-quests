title: Llamadas repetidas al módulo
brief: |
  El conjunto de avisos solicitado está incompleto.

  Trabaja en la workstation en `~/quest` con `main.tf`, `modules/notice/main.tf`.

  **Requisitos:**
  - Estado de OpenTofu:
    - Direcciones requeridas: `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
  - Archivos en la workstation:
    - `~/quest/north.txt`: `north-ready`.
    - `~/quest/south.txt`: `south-ready`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  **Verifica antes de Check & finish:**
  - `tofu show -no-color` — Incluye `module.stations["north"].local_file.notice` y `module.stations["south"].local_file.notice`.
  - `cat north.txt south.txt` — Muestra `north-ready` y `south-ready`, respectivamente.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura pendientes.
stages.0.brief: Ambos avisos solicitados deben estar disponibles.
hints.0.text: Las claves estables distinguen las instancias del módulo.
hints.1.text: Tanto north como south necesitan su propia clave for_each y entrada station.
hints.2.text: Usa ambas claves, pasa each.key a station, inicializa y aplica.
debrief: Las dos direcciones de estado de módulo, los archivos de aviso y el plan sin cambios coinciden ahora con
  las comprobaciones.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener module.stations["south"].local_file.notice.
diagnostics.condition_1: tofu state list debe contener module.stations["north"].local_file.notice.
diagnostics.condition_2: south.txt debe ser igual a south-ready.
diagnostics.condition_3: north.txt debe ser igual a north-ready.
diagnostics.condition_4: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: El estado de OpenTofu incluye `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
stages.0.objectives.1.text: En la workstation, `north.txt` contiene `north-ready`; `south.txt` contiene `south-ready`.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
