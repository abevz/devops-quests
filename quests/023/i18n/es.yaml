title: Llamadas repetidas al módulo
brief: 'En `~/quest`, examina `main.tf` y `modules/notice/main.tf`. El módulo hijo suministrado ya declara su proveedor sin conexión. La raíz lo llama actualmente para una clave con una entrada incorrecta. La guía de módulos locales enlazada en las pistas explica las llamadas y las claves `for_each`.


  Llama a `./modules/notice` como `module.stations` para las claves `north` y `south`, pasando cada clave como `station`. Inicializa y aplica. Comprueba que `tofu state list` contiene tanto `module.stations["north"].local_file.notice` como `module.stations["south"].local_file.notice`; `north.txt` debe contener `north-ready` y `south.txt` debe contener `south-ready`. Por último, `tofu plan -input=false -detailed-exitcode -no-color` debe terminar con código 0, es decir, sin cambios. Trabaja solo en esta bahía sin conexión.'
stages.0.brief: Crea ambas instancias con claves y verifica sus direcciones de estado, contenidos y un plan sin cambios como indica el enunciado.
stages.0.objectives.0.text: Coinciden ambas direcciones de estado y archivos requeridos, y el plan termina con código 0.
hints.0.text: Inspeccione las claves del módulo en el estado tofu list.
hints.1.text: Tanto north como south necesitan su propia clave for_each y entrada station.
hints.2.text: Utilice ambas claves, pase each.key a station y verifique archivos distintos y outputs.
debrief: Las dos direcciones de estado de módulo, los archivos de aviso y el plan sin cambios coinciden ahora con las comprobaciones.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
