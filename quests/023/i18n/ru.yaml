title: Повторные вызовы модуля
brief: |
  Набор требуемых уведомлений неполон.

  Работайте на workstation в `~/quest` с файлами `main.tf`, `modules/notice/main.tf`.

  **Требования:**
  - Состояние OpenTofu:
    - Требуемые адреса: `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
  - Файлы на workstation:
    - `~/quest/north.txt`: `north-ready`.
    - `~/quest/south.txt`: `south-ready`.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.

  **Самопроверка перед Check & finish:**
  - `tofu show -no-color` — Содержит `module.stations["north"].local_file.notice` и `module.stations["south"].local_file.notice`.
  - `cat north.txt south.txt` — Показывает соответственно `north-ready` и `south-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.
stages.0.brief: Оба требуемых уведомления должны быть доступны.
hints.0.text: Стабильные ключи экземпляров различают экземпляры модулей.
hints.1.text: Для north и south нужны отдельные ключи for_each и вход station.
hints.2.text: Используйте оба ключа, передайте each.key в station, затем выполните инициализацию и apply.
debrief: Два адреса состояния модулей, файлы объявлений и план без изменений теперь соответствуют проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать module.stations["south"].local_file.notice.
diagnostics.condition_1: tofu state list должен содержать module.stations["north"].local_file.notice.
diagnostics.condition_2: south.txt должен совпадать с south-ready.
diagnostics.condition_3: north.txt должен совпадать с north-ready.
diagnostics.condition_4: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
stages.0.objectives.0.text: Состояние OpenTofu содержит `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
stages.0.objectives.1.text: На workstation `north.txt` содержит `north-ready`; `south.txt` содержит `south-ready`.
stages.0.objectives.2.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
