title: Повторные вызовы модуля
brief: 'Набор требуемых уведомлений неполон.


  Работайте на workstation в `~/quest` с файлами `main.tf`, `modules/notice/main.tf`.


  **Требования:**

  - Оба требуемых уведомления отслеживаются как управляемые экземпляры модуля.

  - На workstation `~/quest/north.txt` содержит `north-ready`; `~/quest/south.txt` содержит `south-ready`.

  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.

  '
stages.0.brief: Оба требуемых уведомления должны быть доступны.
hints.0.text: Каждому требуемому уведомлению нужна собственная управляемая идентичность.
hints.1.text: |-
  Изучите поставленные входные данные и текущее управляемое состояние:

  Для north и south нужны отдельные ключи for_each и вход station.

  Используйте оба ключа, передайте each.key в station, затем выполните инициализацию и apply.

  ```sh
  cat main.tf
  cat modules/notice/main.tf
  tofu show -no-color
  ```
hints.2.text: |-
  Проверьте наблюдаемый результат:

  - `tofu show -no-color` — Содержит `north.txt` и `south.txt`.

  - `cat north.txt south.txt` — Показывает соответственно `north-ready` и `south-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.

  Оба требуемых файла учитываются в разных управляемых экземплярах модулей.
debrief: Два адреса состояния модулей, файлы объявлений и план без изменений теперь соответствуют проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: |-
  Проверка south.txt может завершиться ошибкой, если отсутствует один из экземпляров, оба файла принадлежат одному экземпляру или экземпляр управляет другим путём. [Гайд](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_1: |-
  Проверка north.txt может завершиться ошибкой, если отсутствует один из экземпляров, оба файла принадлежат одному экземпляру или экземпляр управляет другим путём. [Гайд](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_2: |-
  В south.txt может остаться неверный текст, если экземпляру south передали другой ключ station или правку ещё не применили. [Гайд](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_3: |-
  В north.txt может остаться неверный текст, если экземпляру north передали другой ключ station или правку ещё не применили. [Гайд](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_4: |-
  Подробный план может показать изменения, если вызовы модуля для двух ключей ещё не применили или один из файлов изменили вручную. [Гайд](guides#guide=terraform-7.3&section=per-station-module-instances)
stages.0.objectives.0.text: Оба требуемых уведомления отслеживаются как управляемые экземпляры модуля.
stages.0.objectives.1.text: На workstation `~/quest/north.txt` содержит `north-ready`; `~/quest/south.txt`
  содержит `south-ready`.
stages.0.objectives.2.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
diagnostics.probe_0_0: |-
  Без Python или модуля проверки она может остановиться до вывода результата по отдельному условию. [Гайд](guides#guide=terraform-7.3&section=per-station-module-instances)
