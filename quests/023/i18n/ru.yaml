title: Повторные вызовы модуля
brief: 'В `~/quest` изучите `main.tf` и `modules/notice/main.tf`. В выданном дочернем модуле офлайн-провайдер уже объявлен.
  Сейчас корень вызывает модуль для одного ключа с неверным входом. Руководство по локальным модулям в подсказках объясняет
  вызовы и ключи `for_each`.


  Вызовите `./modules/notice` как `module.stations` для ключей `north` и `south`, передавая каждый ключ в `station`. Инициализируйте
  и примените конфигурацию. Проверьте, что `tofu state list` содержит оба адреса: `module.stations["north"].local_file.notice`
  и `module.stations["south"].local_file.notice`; `north.txt` должен содержать `north-ready`, а `south.txt` — `south-ready`.
  Затем `tofu plan -input=false -detailed-exitcode -no-color` должен завершиться с кодом 0, то есть без изменений. Работайте
  только в этой офлайн-песочнице.'
stages.0.brief: Создайте оба экземпляра модуля с ключами и проверьте их адреса состояния, содержимое файлов и план без изменений
  согласно заданию.
stages.0.objectives.0.text: Оба требуемых адреса состояния и файла совпадают, а план завершается с кодом 0.
hints.0.text: Проверьте ключи модулей в tofu state list.
hints.1.text: Для north и south нужны отдельные ключи for_each и вход station.
hints.2.text: Добавьте оба ключа, передайте each.key в station и проверьте отдельные файлы и outputs.
debrief: Два адреса состояния модулей, файлы объявлений и план без изменений теперь соответствуют проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать module.stations["south"].local_file.notice.
diagnostics.condition_1: tofu state list должен содержать module.stations["north"].local_file.notice.
diagnostics.condition_2: south.txt должен совпадать с south-ready.
diagnostics.condition_3: north.txt должен совпадать с north-ready.
diagnostics.condition_4: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
