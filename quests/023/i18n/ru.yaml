title: Повторные вызовы модуля
brief: 'Набор требуемых уведомлений неполон.


  Работайте на workstation в `~/quest` с файлами `main.tf`, `modules/notice/main.tf`.


  **Требования:**

  - Оба требуемых уведомления отслеживаются как управляемые экземпляры модуля.

  - На workstation `~/quest/north.txt` содержит `north-ready`; `~/quest/south.txt` содержит `south-ready`.

  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.

  '
stages.0.brief: Оба требуемых уведомления должны быть доступны.
hints.0.text: Каждому требуемому уведомлению нужна собственная управляемая идентичность.
hints.1.text: 'Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf modules/notice/main.tf

  tofu show -no-color

  ```'
hints.2.text: |-
  Для north и south нужны отдельные ключи for_each и вход station.

  Используйте оба ключа, передайте each.key в station, затем выполните инициализацию и apply.

  Проверьте наблюдаемый результат:

  - `tofu show -no-color` — Содержит `north.txt` и `south.txt`.

  - `cat north.txt south.txt` — Показывает соответственно `north-ready` и `south-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.

  Оба требуемых файла учитываются в разных управляемых экземплярах модулей.
debrief: Два адреса состояния модулей, файлы объявлений и план без изменений теперь соответствуют проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: |-
  south.txt должен учитываться в отдельном управляемом экземпляре модуля.

diagnostics.condition_1: |-
  north.txt должен учитываться в отдельном управляемом экземпляре модуля.

diagnostics.condition_2: south.txt должен совпадать с south-ready.
diagnostics.condition_3: north.txt должен совпадать с north-ready.
diagnostics.condition_4: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
stages.0.objectives.0.text: Оба требуемых уведомления отслеживаются как управляемые экземпляры модуля.
stages.0.objectives.1.text: На workstation `~/quest/north.txt` содержит `north-ready`; `~/quest/south.txt`
  содержит `south-ready`.
stages.0.objectives.2.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
