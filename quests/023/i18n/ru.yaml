title: Повторные вызовы модуля
brief: 'Вы в команде эксплуатации SignalRail. Создайте два независимых экземпляра модуля. Работайте в
  ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `modules/notice/main.tf`, `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Два экземпляра модуля владеют правильными файлами.'
stages.0.brief: 'Вызовите один модуль для north и south. Адреса ресурсов должны различаться.


  Результат проверки: Два экземпляра модуля владеют правильными файлами.'
stages.0.objectives.0.text: Два экземпляра модуля владеют правильными файлами.
hints.0.text: Проверьте ключи модулей в tofu state list.
hints.1.text: Для north и south нужны отдельные ключи for_each и вход station.
hints.2.text: Добавьте оба ключа, передайте each.key в station и проверьте отдельные файлы и outputs.
debrief: Существовал один экземпляр модуля. Вы добавили второй ключ for_each и проверили отдельные адреса,
  файлы и outputs.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
