title: Wiederholte Modulaufrufe
brief: 'Der angeforderte Nachrichtensatz ist unvollständig.


  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/notice/main.tf`.


  **Anforderungen:**

  - Beide angeforderten Meldungen werden als verwaltete Modulinstanzen nachverfolgt.

  - Auf der Workstation: `~/quest/north.txt` enthält `north-ready`; `~/quest/south.txt` enthält `south-ready`.

  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.

  '
stages.0.brief: Beide angeforderten Nachrichten müssen verfügbar sein.
hints.0.text: Jede angeforderte Meldung benötigt eine eigene verwaltete Identität.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf modules/notice/main.tf

  tofu show -no-color

  ```'
hints.2.text: |-
  Sowohl north als auch south benötigen einen eigenen for_each-Schlüssel und einen eigenen station-Eingang.

  Verwende beide Schlüssel, übergib each.key an station, initialisiere und wende an.

  Prüfen Sie das beobachtete Ergebnis:

  - `tofu show -no-color` — Enthält `north.txt` und `south.txt`.

  - `cat north.txt south.txt` — Zeigt jeweils `north-ready` und `south-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.

  Beide geforderten Dateien sind in verschiedenen verwalteten Modulinstanzen erfasst.
debrief: Die beiden Modul-Zustandsadressen, Hinweisdateien und der Plan ohne Änderungen entsprechen nun den
  Prüfungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: |-
  south.txt muss in einer eigenen verwalteten Modulinstanz erfasst sein.

diagnostics.condition_1: |-
  north.txt muss in einer eigenen verwalteten Modulinstanz erfasst sein.

diagnostics.condition_2: south.txt muss south-ready entsprechen.
diagnostics.condition_3: north.txt muss north-ready entsprechen.
diagnostics.condition_4: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
stages.0.objectives.0.text: Beide angeforderten Meldungen werden als verwaltete Modulinstanzen nachverfolgt.
stages.0.objectives.1.text: 'Auf der Workstation: `~/quest/north.txt` enthält `north-ready`; `~/quest/south.txt`
  enthält `south-ready`.'
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
