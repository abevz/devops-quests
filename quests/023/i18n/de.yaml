title: Wiederholte Modulaufrufe
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Erstellen Sie zwei unabhängige Benachrichtigungsmodule
  mit unterschiedlichen Ausgaben. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich
  auf.


  Eingaben in `~/quest`: `modules/notice/main.tf`, `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Beide Modulinstanzen besitzen ihre korrekten Live-Dateien.'
stages.0.brief: 'Rufen Sie dasselbe Modul für north und south auf. Behalten Sie unterschiedliche Ressourcenadressen
  bei.


  Erfolgskriterium: Beide Modulinstanzen besitzen ihre korrekten Live-Dateien.'
stages.0.objectives.0.text: Beide Modulinstanzen besitzen ihre korrekten Live-Dateien.
hints.0.text: Überprüfen Sie die Modulschlüssel im tofu-Status list.
hints.1.text: Sowohl north als auch south benötigen einen eigenen for_each-Schlüssel und einen eigenen
  station-Eingang.
hints.2.text: Verwenden Sie beide Schlüssel, übergeben Sie each.key an station und überprüfen Sie die
  einzelnen Dateien und outputs.
debrief: Es existierte nur ein station-Modul. Sie haben den zweiten Schlüssel for_each hinzugefügt und
  unabhängige Adressen, Dateien und outputs überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
