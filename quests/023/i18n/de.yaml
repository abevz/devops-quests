title: Wiederholte Modulaufrufe
brief: |
  Der angeforderte Nachrichtensatz ist unvollständig.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/notice/main.tf`.

  **Anforderungen:**
  - OpenTofu-State:
    - Erforderliche Adressen: `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
  - Dateien auf der Workstation:
    - `~/quest/north.txt`: `north-ready`.
    - `~/quest/south.txt`: `south-ready`.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  **Selbstprüfung vor Check & finish:**
  - `tofu show -no-color` — Enthält `module.stations["north"].local_file.notice` und `module.stations["south"].local_file.notice`.
  - `cat north.txt south.txt` — Zeigt jeweils `north-ready` und `south-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.
stages.0.brief: Beide angeforderten Nachrichten müssen verfügbar sein.
hints.0.text: Stabile Instanzschlüssel unterscheiden Modulinstanzen.
hints.1.text: Sowohl north als auch south benötigen einen eigenen for_each-Schlüssel und einen eigenen station-Eingang.
hints.2.text: Verwende beide Schlüssel, übergib each.key an station, initialisiere und wende an.
debrief: Die beiden Modul-Zustandsadressen, Hinweisdateien und der Plan ohne Änderungen entsprechen nun den Prüfungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss module.stations["south"].local_file.notice enthalten.
diagnostics.condition_1: tofu state list muss module.stations["north"].local_file.notice enthalten.
diagnostics.condition_2: south.txt muss south-ready entsprechen.
diagnostics.condition_3: north.txt muss north-ready entsprechen.
diagnostics.condition_4: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
stages.0.objectives.0.text: Der OpenTofu-State enthält `module.stations["north"].local_file.notice`, `module.stations["south"].local_file.notice`.
stages.0.objectives.1.text: 'Auf der Workstation: `north.txt` enthält `north-ready`; `south.txt` enthält `south-ready`.'
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
