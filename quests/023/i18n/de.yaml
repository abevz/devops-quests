title: Wiederholte Modulaufrufe
brief: 'Untersuche in `~/quest` die Dateien `main.tf` und `modules/notice/main.tf`. Das bereitgestellte Kindmodul deklariert
  seinen Offline-Provider bereits. Der Root ruft es derzeit für einen Schlüssel mit falscher Eingabe auf. Die in den Hinweisen
  verlinkte Anleitung zu lokalen Modulen erklärt Modulaufrufe und `for_each`-Schlüssel.


  Rufe `./modules/notice` als `module.stations` für die Schlüssel `north` und `south` auf und übergib jeden Schlüssel als
  `station`. Initialisiere und wende an. Prüfe, dass `tofu state list` sowohl `module.stations["north"].local_file.notice`
  als auch `module.stations["south"].local_file.notice` enthält; `north.txt` muss `north-ready` und `south.txt` muss `south-ready`
  enthalten. Schließlich muss `tofu plan -input=false -detailed-exitcode -no-color` mit Code 0 enden, also ohne Änderungen.
  Arbeite nur in dieser Offline-Umgebung.'
stages.0.brief: Erstelle beide Modulinstanzen mit Schlüsseln und prüfe ihre Zustandsadressen, Dateiinhalte und einen Plan
  ohne Änderungen wie beschrieben.
stages.0.objectives.0.text: Beide geforderten Zustandsadressen und Dateien stimmen, und der Plan endet mit Code 0.
hints.0.text: Überprüfen Sie die Modulschlüssel im tofu-Status list.
hints.1.text: Sowohl north als auch south benötigen einen eigenen for_each-Schlüssel und einen eigenen station-Eingang.
hints.2.text: Verwenden Sie beide Schlüssel, übergeben Sie each.key an station und überprüfen Sie die einzelnen Dateien und
  outputs.
debrief: Die beiden Modul-Zustandsadressen, Hinweisdateien und der Plan ohne Änderungen entsprechen nun den Prüfungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss module.stations["south"].local_file.notice enthalten.
diagnostics.condition_1: tofu state list muss module.stations["north"].local_file.notice enthalten.
diagnostics.condition_2: south.txt muss south-ready entsprechen.
diagnostics.condition_3: north.txt muss north-ready entsprechen.
diagnostics.condition_4: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
