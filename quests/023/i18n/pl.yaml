title: Powtarzające się wywołania modułów
brief: 'W `~/quest` przeczytaj `main.tf` i `modules/notice/main.tf`. Dostarczony moduł podrzędny już deklaruje dostawcę offline. Konfiguracja główna wywołuje go obecnie dla jednego klucza z błędnym wejściem. Przewodnik po modułach lokalnych w podpowiedziach wyjaśnia wywołania modułów i klucze `for_each`.


  Wywołaj `./modules/notice` jako `module.stations` dla kluczy `north` i `south`, przekazując każdy klucz jako `station`. Zainicjuj i zastosuj konfigurację. Sprawdź, czy `tofu state list` zawiera zarówno `module.stations["north"].local_file.notice`, jak i `module.stations["south"].local_file.notice`; `north.txt` ma zawierać `north-ready`, a `south.txt` — `south-ready`. Na koniec `tofu plan -input=false -detailed-exitcode -no-color` musi zwrócić kod 0, czyli brak zmian. Pracuj tylko w tej zatoce offline.'
stages.0.brief: Utwórz obie instancje modułu z kluczami i sprawdź ich adresy stanu, zawartość plików oraz plan bez zmian zgodnie z opisem.
stages.0.objectives.0.text: Oba wymagane adresy stanu i pliki są poprawne, a plan kończy się kodem 0.
hints.0.text: Sprawdź klucze modułu w tofu state list.
hints.1.text: Zarówno north, jak i south wymagają własnego klucza for_each i wejścia station.
hints.2.text: Użyj obu kluczy, przekaż each.key do station i sprawdź różne pliki i outputs.
debrief: Dwa adresy stanu modułów, pliki powiadomień i plan bez zmian odpowiadają teraz kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
