title: Powtarzające się wywołania modułów
brief: 'Zestaw wymaganych powiadomień jest niekompletny.


  Pracuj na workstation w `~/quest` z plikami `main.tf`, `modules/notice/main.tf`.


  **Wymagania:**

  - Oba wymagane komunikaty są śledzone jako zarządzane instancje modułu.

  - Na workstation `~/quest/north.txt` zawiera `north-ready`; `~/quest/south.txt` zawiera `south-ready`.

  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.

  '
stages.0.brief: Oba wymagane powiadomienia muszą być dostępne.
hints.0.text: Każdy wymagany komunikat potrzebuje własnej zarządzanej tożsamości.
hints.1.text: 'Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf modules/notice/main.tf

  tofu show -no-color

  ```'
hints.2.text: 'Zarówno north, jak i south wymagają własnego klucza for_each i wejścia station.


  Użyj obu kluczy, przekaż each.key do station, a następnie zainicjalizuj i zastosuj.


  Sprawdź obserwowany wynik:


  - `tofu show -no-color` — Zawiera `module.stations["north"].local_file.notice` i `module.stations["south"].local_file.notice`.


  - `cat north.txt south.txt` — Pokazuje odpowiednio `north-ready` i `south-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących
  zmian infrastruktury.'
debrief: Dwa adresy stanu modułów, pliki powiadomień i plan bez zmian odpowiadają teraz kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać module.stations["south"].local_file.notice.
diagnostics.condition_1: tofu state list musi zawierać module.stations["north"].local_file.notice.
diagnostics.condition_2: south.txt musi być równe south-ready.
diagnostics.condition_3: north.txt musi być równe north-ready.
diagnostics.condition_4: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
stages.0.objectives.0.text: Oba wymagane komunikaty są śledzone jako zarządzane instancje modułu.
stages.0.objectives.1.text: Na workstation `~/quest/north.txt` zawiera `north-ready`; `~/quest/south.txt` zawiera
  `south-ready`.
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
