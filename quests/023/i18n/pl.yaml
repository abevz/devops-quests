title: Powtarzające się wywołania modułów
brief: 'Dołączyłeś do operacji SignalRail. Utwórz dwa niezależne moduły powiadomień z odrębnymi wynikami.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `modules/notice/main.tf`, `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: obie instancje modułów posiadają swoje prawidłowe pliki aktywne.'
stages.0.brief: 'Wywołaj ten sam moduł dla north i south. Zachowaj odrębne adresy zasobów.


  Kryteria sukcesu: Obie instancje modułów posiadają swoje prawidłowe pliki aktywne.'
stages.0.objectives.0.text: Obie instancje modułów posiadają swoje prawidłowe pliki aktywne.
hints.0.text: Sprawdź klucze modułu w tofu state list.
hints.1.text: Zarówno north, jak i south wymagają własnego klucza for_each i wejścia station.
hints.2.text: Użyj obu kluczy, przekaż each.key do station i sprawdź różne pliki i outputs.
debrief: Istniał tylko jeden moduł station. Dodałeś drugi klucz for_each i sprawdziłeś niezależne adresy,
  pliki i outputs.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
