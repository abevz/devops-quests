title: Powtarzające się wywołania modułów
brief: 'Zestaw wymaganych powiadomień jest niekompletny.


  Pracuj na workstation w `~/quest` z plikami `main.tf`, `modules/notice/main.tf`.


  **Wymagania:**

  - Oba wymagane komunikaty są śledzone jako zarządzane instancje modułu.

  - Na workstation `~/quest/north.txt` zawiera `north-ready`; `~/quest/south.txt` zawiera `south-ready`.

  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.

  '
stages.0.brief: Oba wymagane powiadomienia muszą być dostępne.
hints.0.text: Każdy wymagany komunikat potrzebuje własnej zarządzanej tożsamości.
hints.1.text: |-
  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:

  Zarówno north, jak i south wymagają własnego klucza for_each i wejścia station.

  Użyj obu kluczy, przekaż each.key do station, a następnie zainicjalizuj i zastosuj.

  ```sh
  cat main.tf
  cat modules/notice/main.tf
  tofu show -no-color
  ```
hints.2.text: |-
  Sprawdź obserwowany wynik:

  - `tofu show -no-color` — Zawiera `north.txt` i `south.txt`.

  - `cat north.txt south.txt` — Pokazuje odpowiednio `north-ready` i `south-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących zmian infrastruktury.

  Oba wymagane pliki są śledzone w odrębnych zarządzanych instancjach modułów.
debrief: Dwa adresy stanu modułów, pliki powiadomień i plan bez zmian odpowiadają teraz kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: |-
  Sprawdzenie south.txt może zawieść, jeśli brakuje jednej z instancji, oba pliki pochodzą z tej samej instancji lub instancja zarządza inną ścieżką. [Przewodnik](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_1: |-
  Sprawdzenie north.txt może zawieść, jeśli brakuje jednej z instancji, oba pliki pochodzą z tej samej instancji lub instancja zarządza inną ścieżką. [Przewodnik](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_2: |-
  south.txt może mieć złą treść, jeśli instancja south otrzymała inny klucz station albo nie zastosowano zmiany. [Przewodnik](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_3: |-
  north.txt może mieć złą treść, jeśli instancja north otrzymała inny klucz station albo nie zastosowano zmiany. [Przewodnik](guides#guide=terraform-7.3&section=per-station-module-instances)
diagnostics.condition_4: |-
  Plan może wykazać zmiany, jeśli nie zastosowano wywołań modułu dla obu kluczy lub jeden plik odbiega od deklaracji. [Przewodnik](guides#guide=terraform-7.3&section=per-station-module-instances)
stages.0.objectives.0.text: Oba wymagane komunikaty są śledzone jako zarządzane instancje modułu.
stages.0.objectives.1.text: Na workstation `~/quest/north.txt` zawiera `north-ready`; `~/quest/south.txt` zawiera
  `south-ready`.
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
diagnostics.probe_0_0: |-
  Brak Pythona lub modułu sondy może przerwać sprawdzenie przed wynikiem warunku. [Przewodnik](guides#guide=terraform-7.3&section=per-station-module-instances)
