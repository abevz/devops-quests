diagnostics.clusterip: service/shelf clusterIP debe ser igual a None.
diagnostics.selector: 'service/shelf selector debe ser igual a app: shelf.'
diagnostics.http: shelf-0.shelf:8080 debe ser igual a ledger-111.
diagnostics.dns: nslookup shelf-0.shelf debe tener éxito.
