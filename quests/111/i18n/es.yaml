title: Identidad StatefulSet y headless DNS
brief: |-
  El endpoint shelf no está disponible. Restaure el servicio conservando la identidad del almacenamiento existente.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `shelf.yaml`, `service.yaml`.

  **Requirements:**

  - El StatefulSet y el claim de datos existentes conservan su identidad; el Pod de reemplazo usa el Service original y solo el volumen de datos existente en `/data` de su contenedor de aplicación.
  - El StatefulSet `shelf` tiene una réplica lista.
  - El Service permite descubrimiento ordinal estable solo para la carga shelf suministrada, sin IP virtual.
  - Dentro del Pod `shelf-0`, el DNS ordinal `shelf-0.shelf` se resuelve y `http://shelf-0.shelf:8080` devuelve `ledger-111`.

  Las comprobaciones cubren identidad, montaje y respuesta, no todo el contenido del libro ni el historial; el volumen local de práctica no es una copia externa.
debrief: Las comprobaciones observaron los UID originales de StatefulSet y PVC, el Pod de reemplazo, la
  consulta ordinal y la respuesta.
stages.0.brief: Conserva las identidades originales de almacenamiento y controlador al reemplazar el Pod.
hints.0.text: Pod identity y claim identity tienen vidas útiles diferentes.
hints.1.text: |-
  El Service sin cabeza proporciona un ordinal DNS estable.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get statefulset shelf -o yaml
    kubectl get pvc ledger-shelf-0 -o yaml
    kubectl get pod shelf-0 -o yaml
    cat original-statefulset-uid original-pvc-uid original-pod-uid
    kubectl get service shelf -o yaml
  ```
hints.2.text: 'Repare el oyente de plantilla y espere la implementación de StatefulSet. Corrija el listener al puerto `8080` y espere el reemplazo; StatefulSet y claim conservan sus identidades mientras cambia el Pod.


  Verifica el resultado desde `~/quest` en la workstation:


  - `kubectl exec shelf-0 -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."` — El nombre DNS ordinal se resuelve dentro de `shelf-0`.


  - `kubectl exec shelf-0 -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080` — El consumidor shelf recibe `ledger-111`.'
phrases.0: Conservé el ordinal claim durante el reemplazo.
phrases.1: Comprobé el DNS ordinal y la respuesta HTTP.
phrases.2: Separé la persistencia de la copia de seguridad.
questions.0.points.0: Su claim ordinal y asociado puede permanecer estable.
questions.0.points.1: El Pod UID cambia; no lo confunda con los datos identity.
questions.0.prompt: ¿Qué sobrevive al reemplazo de un StatefulSet Pod?
questions.1.points.0: Sólo si el almacenamiento backend proporciona la durabilidad requerida.
questions.1.points.1: Un volumen local por sí solo no es una copia de seguridad fuera del host.
questions.1.prompt: ¿Un PVC protege contra la pérdida del disco del nodo?
