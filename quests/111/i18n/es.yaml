title: Identidad StatefulSet y headless DNS
brief: "El endpoint shelf no está disponible. Restaure el servicio conservando la identidad del almacenamiento existente.\n\
  \nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `shelf.json`, `service.json`, `original-statefulset-uid`,\
  \ `original-pvc-uid`, `original-pod-uid`.\n\n**Requirements:**\n\n- Se conservan el StatefulSet `shelf` y el PVC\
  \ `ledger-shelf-0` originales; `shelf-0` es un Pod de reemplazo con Service rector `shelf` y solo el volumen `ledger`\
  \ montado en `/data` del contenedor de aplicación.\n- El StatefulSet `shelf` tiene una réplica lista.\n- El Service\
  \ `shelf` es headless (`None`) y selecciona solo Pods con etiqueta `app=shelf`.\n- Dentro del Pod `shelf-0`, el\
  \ DNS ordinal `shelf-0.shelf` se resuelve y `http://shelf-0.shelf:8080` devuelve `ledger-111`.\n\n**Verify yourself\
  \ before Check & finish:** Ejecute estos comandos de observación desde `~/quest` en la estación de trabajo.\n\n\
  - La configuración, identidad y estado cumplen los requisitos.\n\n  ```sh\n  kubectl get statefulset shelf -o\
  \ yaml\n  kubectl get pvc ledger-shelf-0 -o yaml\n  kubectl get pod shelf-0 -o yaml\n  cat original-statefulset-uid\
  \ original-pvc-uid original-pod-uid\n  kubectl get service shelf -o yaml\n  ```\n\n- `kubectl exec shelf-0 --\
  \ nslookup -type=A \"shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.\"` — El nombre DNS ordinal se resuelve dentro\
  \ de `shelf-0`.\n\n- `kubectl exec shelf-0 -- wget -qO- -T 3 http://shelf-0.shelf:8080` — El consumidor shelf\
  \ recibe `ledger-111`.\n\nLas comprobaciones cubren identidad, montaje y respuesta, no todo el contenido del libro\
  \ ni el historial; el volumen local de práctica no es una copia externa."
debrief: Las comprobaciones observaron los UID originales de StatefulSet y PVC, el Pod de reemplazo, la consulta
  ordinal y la respuesta.
stages.0.brief: El Pod shelf de reemplazo debe servir el claim conservado.
hints.0.text: Pod identity y claim identity tienen vidas útiles diferentes.
hints.1.text: El Service sin cabeza proporciona un ordinal DNS estable.
hints.2.text: Repare el oyente de plantilla y espere la implementación de StatefulSet. Corrija el listener al puerto
  `8080` y espere el reemplazo; StatefulSet y claim conservan sus identidades mientras cambia el Pod.
phrases.0: Conservé el ordinal claim durante el reemplazo.
phrases.1: Comprobé el DNS ordinal y la respuesta HTTP.
phrases.2: Separé la persistencia de la copia de seguridad.
questions.0.points.0: Su claim ordinal y asociado puede permanecer estable.
questions.0.points.1: El Pod UID cambia; no lo confunda con los datos identity.
questions.0.prompt: ¿Qué sobrevive al reemplazo de un StatefulSet Pod?
questions.1.points.0: Sólo si el almacenamiento backend proporciona la durabilidad requerida.
questions.1.points.1: Un volumen local por sí solo no es una copia de seguridad fuera del host.
questions.1.prompt: ¿Un PVC protege contra la pérdida del disco del nodo?
diagnostics.uid_statefulset: statefulset/shelf UID debe ser igual a original-statefulset-uid.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID debe ser igual a original-pvc-uid.
diagnostics.uid_pod: pod/shelf-0 UID debe ser diferente de original-pod-uid.
diagnostics.service_name: statefulset/shelf serviceName debe ser igual a shelf.
diagnostics.ready: statefulset/shelf readyReplicas debe ser igual a 1.
diagnostics.mount: 'statefulset/shelf volumeMounts debe ser igual a [{name: ledger, mountPath: /data}].'
diagnostics.clusterip: service/shelf clusterIP debe ser igual a None.
diagnostics.selector: 'service/shelf selector debe ser igual a app: shelf.'
diagnostics.http: shelf-0.shelf:8080 debe ser igual a ledger-111.
diagnostics.dns: nslookup shelf-0.shelf debe tener éxito.
