diagnostics.service_name: statefulset/shelf serviceName debe ser igual a shelf.
diagnostics.ready: statefulset/shelf readyReplicas debe ser igual a 1.
diagnostics.mount: El worker de shelf debe montar ledger en /data con el acceso de escritura suministrado.
diagnostics.clusterip: service/shelf clusterIP debe ser igual a None.
diagnostics.selector: El Service shelf debe seleccionar toda la carga suministrada shelf y ninguna otra.
diagnostics.http: shelf-0.shelf:8080 debe ser igual a ledger-111.
diagnostics.dns: nslookup shelf-0.shelf debe tener éxito.
