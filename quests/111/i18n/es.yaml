title: Identidad StatefulSet y headless DNS
brief: 'Un shelf almacena el libro mayor sintético en su ordinal PVC. Un cambio de plantilla movió su
  escucha HTTP de 8080 a 8099. Restaure el puerto 8080 sin reemplazar StatefulSet, claim o el libro mayor.
  El controlador reemplazará al Pod; sus ordinal DNS y PVC deben permanecer utilizables. El volumen local
  kind es un dispositivo de práctica, no una copia de seguridad fuera del host.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `shelf.json`, `service.json`,
  `original-pvc-uid`, `original-pod-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El reemplazo shelf-0 sirve para ledger-111 en ordinal DNS utilizando el
  PVC original.'
debrief: El Pod cambió mientras que su ordinal y el volumen real del libro mayor sobrevivieron. La durabilidad
  ante la pérdida del host aún necesita copias de seguridad independientes.
stages.0.brief: 'Criterios de éxito: El reemplazo shelf-0 sirve para ledger-111 en ordinal DNS usando
  el PVC original.'
stages.0.objectives.0.text: El reemplazo shelf-0 sirve para ledger-111 en ordinal DNS usando el PVC original.
hints.0.text: Pod identity y claim identity tienen vidas útiles diferentes.
hints.1.text: El Service sin cabeza proporciona un ordinal DNS estable.
hints.2.text: Repare el oyente de plantilla y espere la implementación de StatefulSet.
phrases.0: Conservé el ordinal claim durante el reemplazo.
phrases.1: Probé el nombre estable DNS y el libro mayor almacenado.
phrases.2: Separé la persistencia de la copia de seguridad.
questions.0.points.0: Su claim ordinal y asociado puede permanecer estable.
questions.0.points.1: El Pod UID cambia; no lo confunda con los datos identity.
questions.0.prompt: ¿Qué sobrevive al reemplazo de un StatefulSet Pod?
questions.1.points.0: Sólo si el almacenamiento backend proporciona la durabilidad requerida.
questions.1.points.1: Un volumen local por sí solo no es una copia de seguridad fuera del host.
questions.1.prompt: ¿Un PVC protege contra la pérdida del disco del nodo?
