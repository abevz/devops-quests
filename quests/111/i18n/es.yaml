diagnostics.probe_0_2: 'Los datos actuales no permiten verificar este objetivo: El Service permite descubrimiento
  ordinal estable solo para la carga shelf suministrada, sin IP virtual.'
diagnostics.discovery_consumer: El consumidor independiente necesita un Pod actual propio y listo con la imagen
  suministrada.
diagnostics.discovery_network: El consumidor de red no debe montar el claim original, ni mediante inicializador
  u otro contenedor.
diagnostics.discovery_dns: La resolución A ordinal debe funcionar desde el consumidor en el namespace actual; revisa
  governing Service y sufijo resolver.
diagnostics.discovery_source: La fuente ordinal conservada debe devolver la respuesta declarada al consumidor.
diagnostics.discovery_publication: La publicación HTTP local del consumidor debe coincidir con la fuente; estar
  listo no basta.
diagnostics.probe_0_3: Las entradas actuales no verifican esta condición; inspecciona estado de objetos y contrato.
