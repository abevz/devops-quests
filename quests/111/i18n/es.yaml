title: Identidad StatefulSet y headless DNS
brief: 'Trabaja en `~/quest` con `shelf.json`, `service.json`, `original-statefulset-uid`, `original-pvc-uid` y `original-pod-uid`.
  Un StatefulSet da identidad ordinal a un Pod y puede reemplazarlo mientras permanece el PVC. Repara el listener shelf al
  puerto 8080 y espera el reemplazo. Los UID del StatefulSet y PVC `ledger-shelf-0` deben coincidir con sus archivos originales;
  `shelf-0` debe tener un UID de Pod diferente y no vacío. Conserva `serviceName: shelf`, una réplica lista y exactamente
  el montaje del primer contenedor `[{name: ledger, mountPath: /data}]`. El Service debe tener `clusterIP: None` y selector
  exactamente `app: shelf`. Verifica que la consulta DNS ordinal tenga éxito y que `shelf-0.shelf:8080` devuelva `ledger-111`.
  Las comprobaciones observan identidad, configuración del montaje y respuesta, no todo el ledger ni el historial de cambios.
  El volumen local de práctica no es una copia fuera del host. Trabaja solo en la bahía sin conexión.'
debrief: Las comprobaciones observaron los UID originales de StatefulSet y PVC, el Pod de reemplazo, la consulta ordinal y
  la respuesta.
stages.0.brief: Las identidades originales de StatefulSet y PVC, Pod de reemplazo, montaje, Service, DNS ordinal y respuesta
  HTTP coinciden con la descripción.
stages.0.objectives.0.text: Las identidades originales de StatefulSet y PVC, Pod de reemplazo, montaje, Service, DNS ordinal
  y respuesta HTTP coinciden con la descripción.
hints.0.text: Pod identity y claim identity tienen vidas útiles diferentes.
hints.1.text: El Service sin cabeza proporciona un ordinal DNS estable.
hints.2.text: Repare el oyente de plantilla y espere la implementación de StatefulSet.
phrases.0: Conservé el ordinal claim durante el reemplazo.
phrases.1: Comprobé el DNS ordinal y la respuesta HTTP.
phrases.2: Separé la persistencia de la copia de seguridad.
questions.0.points.0: Su claim ordinal y asociado puede permanecer estable.
questions.0.points.1: El Pod UID cambia; no lo confunda con los datos identity.
questions.0.prompt: ¿Qué sobrevive al reemplazo de un StatefulSet Pod?
questions.1.points.0: Sólo si el almacenamiento backend proporciona la durabilidad requerida.
questions.1.points.1: Un volumen local por sí solo no es una copia de seguridad fuera del host.
questions.1.prompt: ¿Un PVC protege contra la pérdida del disco del nodo?
