title: Identidad StatefulSet y headless DNS
brief: |-
  El endpoint no está disponible y un consumidor independiente necesita los datos persistentes conservados.

  Trabaja en la workstation en `~/quest` con las entradas de conexión/resultado: `discovery-contract.json`. Las definiciones de cargas están en los objetos actuales del clúster.

  **Requisitos:**

  - El StatefulSet y el claim de datos existentes conservan su identidad; el Pod de reemplazo usa el Service original y solo el volumen de datos existente en `/data` de su contenedor de aplicación.
  - El StatefulSet `shelf` tiene una réplica lista.
  - El Service permite descubrimiento ordinal estable solo para la carga shelf suministrada, sin IP virtual.
  - Dentro del Pod `shelf-0`, el DNS ordinal `shelf-0.shelf` se resuelve y `http://shelf-0.shelf:8080` devuelve `ledger-111`. Construye el Deployment consumidor descrito en el contrato, con un Pod listo y la imagen suministrada. Desde su contenedor de aplicación funcionan DNS ordinal y la interfaz original de la fuente; su HTTP local devuelve la respuesta declarada. El consumidor no monta el claim de datos original.

  Las comprobaciones observan identidad, montajes, DNS y respuestas actuales, no el historial de peticiones ni durabilidad externa.
debrief: Un ordinal estable conecta descubrimiento e identidad persistente. Reparar el listener no construye un
  consumidor independiente; sustituir un proceso no recrea los datos conservados.
stages.0.brief: Conserva las identidades originales de almacenamiento y controlador al reemplazar el Pod.
hints.0.text: Identidad del almacenamiento, proceso listo y listener funcional son observaciones distintas. El descubrimiento
  ordinal también debe funcionar desde un consumidor independiente.
hints.1.text: |-
  Inspecciona la carga stateful existente, su governing Service, claim y resolver. El contrato describe el consumidor a construir; inicialmente no existe.

  ```sh
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl describe pod shelf-0
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```
hints.2.text: |-
  Compara los UID con los registros originales suministrados. `shelf` y `ledger-shelf-0` conservan sus UID, mientras que `shelf-0` tiene uno nuevo. El Service no tiene IP virtual y selecciona el workload shelf. El origen y el inspector tienen una réplica lista cada uno. En el Deployment y los Pods del inspector, comprueba la imagen suministrada y que no montan la PVC de origen. El DNS debe resolver el nombre desde el inspector y todas las respuestas HTTP, desde shelf y las interfaces remota y local, deben ser `ledger-111`.

  ```sh
  for binding in statefulset/shelf:original-statefulset-uid pvc/ledger-shelf-0:original-pvc-uid pod/shelf-0:original-pod-uid; do
    object=${binding%%:*}; original=${binding#*:}
    printf "%s original=%s current=%s\n" "$object" "$(cat "$original")" "$(kubectl get "$object" -o jsonpath='{.metadata.uid}')"
  done
  kubectl get statefulset shelf
  kubectl get service shelf -o yaml
  kubectl rollout status deployment/inspector --timeout=10s
  kubectl get deployments,pods,replicasets -o yaml
  fqdn="shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  kubectl exec shelf-0 -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  kubectl exec deployment/inspector -c worker -- nslookup -type=A "$fqdn"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 "http://$fqdn:8080"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
phrases.0: Conservé el ordinal claim durante el reemplazo.
phrases.1: Comprobé el DNS ordinal y la respuesta HTTP.
phrases.2: Separé la persistencia de la copia de seguridad.
questions.0.points.0: Su claim ordinal y asociado puede permanecer estable.
questions.0.points.1: El Pod UID cambia; no lo confunda con los datos identity.
questions.0.prompt: ¿Qué sobrevive al reemplazo de un StatefulSet Pod?
questions.1.points.0: Sólo si el almacenamiento backend proporciona la durabilidad requerida.
questions.1.points.1: Un volumen local por sí solo no es una copia de seguridad fuera del host.
questions.1.prompt: ¿Un PVC protege contra la pérdida del disco del nodo?
stages.0.objectives.0.text: El StatefulSet y el claim de datos existentes conservan su identidad; el Pod de reemplazo
  usa el Service original y solo el volumen de datos existente en `/data` de su contenedor de aplicación.
stages.0.objectives.1.text: El StatefulSet `shelf` tiene una réplica lista.
stages.0.objectives.2.text: El Service permite descubrimiento ordinal estable solo para la carga shelf suministrada,
  sin IP virtual.
stages.0.objectives.3.text: Dentro del Pod `shelf-0`, el DNS ordinal `shelf-0.shelf` se resuelve y `http://shelf-0.shelf:8080`
  devuelve `ledger-111`. Construye el Deployment consumidor descrito en el contrato, con un Pod listo y la imagen
  suministrada. Desde su contenedor de aplicación funcionan DNS ordinal y la interfaz original de la fuente; su
  HTTP local devuelve la respuesta declarada. El consumidor no monta el claim de datos original.
diagnostics.uid_statefulset: El StatefulSet puede haberse recreado con el mismo nombre, lo que cambia su UID de forma irreversible. Compárelo con el original fijado antes de editar la plantilla. [Causa y comprobación](guides#guide=storage-lifecycle&section=q111-shelf-retained-controller)
diagnostics.uid_pvc: El PVC del registro puede haberse recreado o no ser legible. Compare el UID de ledger-shelf-0 con el registro original y conserve el PVC existente. [Causa y comprobación](guides#guide=storage-lifecycle&section=q111-shelf-retained-ledger-claim)
diagnostics.uid_pod: El Pod ordinal puede conservar su UID original pese al cambio de plantilla. Espere el reemplazo de shelf-0 con el mismo nombre ordinal y PVC persistente. [Causa y comprobación](guides#guide=storage-lifecycle&section=q111-shelf-ordinal-replacement)
diagnostics.service_name: El StatefulSet puede referenciar otro Service rector. Compruebe que serviceName siga siendo shelf para que se resuelva el nombre DNS ordinal esperado. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-shelf-governing-service)
diagnostics.mount: El worker puede usar otro montaje, una subruta o solo lectura. Revise el único montaje completo escribible de ledger en /data del contenedor worker. [Causa y comprobación](guides#guide=storage-lifecycle&section=q111-shelf-ledger-mount)
diagnostics.ready: El reemplazo puede estar pendiente, no montar el PVC o fallar disponibilidad. Revise shelf-0 y espere una réplica lista del StatefulSet. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-shelf-ready-replica)
diagnostics.clusterip: El Service puede haber recibido un clusterIP virtual. Conserve None en shelf para que DNS headless pueda responder con direcciones de Pods. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-shelf-headless-service)
diagnostics.selector: El selector puede excluir un Pod shelf actual o incluir Pods ajenos. Compruebe app=shelf y las etiquetas adicionales frente a los Pods reales de shelf. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-shelf-endpoint-selector)
diagnostics.http: El nombre ordinal puede llevar a un servidor aún en 8099 o con otro directorio. Consulte el puerto 8080 y compare el cuerpo del registro con ledger-111. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-shelf-ordinal-ledger-response)
diagnostics.dns: La consulta DNS ordinal puede fallar si el Service headless no publica el endpoint del Pod. Compruebe el nombre completo desde shelf-0. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-shelf-ordinal-dns-from-source)
diagnostics.probe_0_2: El observador del selector puede detenerse antes de clasificar un campo si falla el proceso o las entradas. Revise Python y el acceso al Service y a los Pods. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-shelf-selector-observer-input)
diagnostics.discovery_consumer: El Deployment inspector puede faltar, usar otra imagen o no tener exactamente un Pod actual con worker listo y en ejecución. Revise el Deployment, su Pod y la identidad de imagen suministrada. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-inspector-current-workload)
diagnostics.discovery_network: Inspector puede montar el PVC fuente en vez de consumir la respuesta por red. Revise los montajes normales e init y elimine el uso del PVC fuente. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-inspector-without-ledger-mount)
diagnostics.discovery_dns: El nombre ordinal puede resolverse desde el Pod fuente y fallar en inspector. Ejecute la consulta A desde el consumidor y compruebe que termine con éxito. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-inspector-ordinal-dns)
diagnostics.discovery_source: DNS puede funcionar aunque inspector no obtenga ledger-111 del origen HTTP ordinal. Haga la petición desde inspector y compare el cuerpo recibido. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-inspector-source-http)
diagnostics.discovery_publication: El consumidor puede alcanzar al productor sin publicar la respuesta local o conservando contenido viejo. Consulte loopback en inspector y compruebe ledger-111. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-inspector-local-publication)
diagnostics.probe_0_3: El observador ordinal puede detenerse antes de indicar una condición si falla el proceso, contrato o límite de tiempo. Revise herramientas y entradas y repita las observaciones por separado. [Causa y comprobación](guides#guide=kubernetes-20&section=q111-ordinal-observer-input)
