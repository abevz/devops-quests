title: StatefulSet identity and headless DNS
brief: 'A shelf stores the synthetic ledger on its ordinal PVC. A template change moved its HTTP listener
  from 8080 to 8099. Restore port 8080 without replacing the StatefulSet, claim or ledger. The controller
  will replace the Pod; its ordinal DNS and PVC must remain usable. The local kind volume is a practice
  fixture, not an off-host backup.


  Quest files in `~/quest` (some appear in later stages): `shelf.json`, `service.json`, `original-pvc-uid`,
  `original-pod-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The replacement shelf-0 serves ledger-111 on ordinal DNS using the original
  PVC.'
debrief: The Pod changed while its ordinal and real ledger volume survived. Host-loss durability still
  needs independent backups.
stages.0.brief: 'The replacement shelf-0 serves ledger-111 on ordinal DNS using the original PVC.


  Success criteria: The replacement shelf-0 serves ledger-111 on ordinal DNS using the original PVC.'
stages.0.objectives.0.text: The replacement shelf-0 serves ledger-111 on ordinal DNS using the original
  PVC.
hints.0.text: Pod identity and claim identity have different lifetimes.
hints.1.text: The headless Service provides stable ordinal DNS.
hints.2.text: Repair the template listener and wait for the StatefulSet rollout.
phrases.0: I preserved the ordinal claim during replacement.
phrases.1: I tested the stable DNS name and stored ledger.
phrases.2: I separated persistence from backup.
questions.0.points.0: Its ordinal and associated claim can remain stable.
questions.0.points.1: The Pod UID changes; do not confuse it with data identity.
questions.0.prompt: What survives replacement of a StatefulSet Pod?
questions.1.points.0: Only if the storage backend supplies the required durability.
questions.1.points.1: A local volume alone is not an off-host backup.
questions.1.prompt: Does a PVC protect against losing the node disk?
