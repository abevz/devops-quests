title: StatefulSet identity and headless DNS
brief: "The shelf endpoint is unavailable. Restore service while retaining the existing storage identity.\n\nWork\
  \ in `~/quest` on the workstation. Supplied files: `shelf.yaml`, `service.yaml`, `original-statefulset-uid`, `original-pvc-uid`,\
  \ `original-pod-uid`.\n\n**Requirements:**\n\n- The original StatefulSet `shelf` and PVC `ledger-shelf-0` are\
  \ kept; `shelf-0` is a replacement Pod, using governing Service `shelf` and only volume `ledger` mounted at `/data`\
  \ in its application container.\n- StatefulSet `shelf` has one ready replica.\n- Service `shelf` is headless (`None`)\
  \ and selects only Pods labelled `app=shelf`.\n- Inside Pod `shelf-0`, ordinal DNS `shelf-0.shelf` resolves and\
  \ `http://shelf-0.shelf:8080` returns `ledger-111`.\n\n**Verify yourself before Check & finish:** Run these observation\
  \ commands from `~/quest` on the workstation.\n\n- Settings, identity and status match Requirements.\n\n  ```sh\n\
  \  kubectl get statefulset shelf -o yaml\n  kubectl get pvc ledger-shelf-0 -o yaml\n  kubectl get pod shelf-0\
  \ -o yaml\n  cat original-statefulset-uid original-pvc-uid original-pod-uid\n  kubectl get service shelf -o yaml\n\
  \  ```\n\n- `kubectl exec shelf-0 -- nslookup -type=A \"shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.\"` — The\
  \ ordinal DNS name resolves inside `shelf-0`.\n\n- `kubectl exec shelf-0 -- wget -qO- -T 3 http://shelf-0.shelf:8080`\
  \ — The shelf consumer receives `ledger-111`.\n\nChecks cover identity, mount configuration and response, not\
  \ all ledger contents or edit history; the local practice volume is not an off-host backup."
debrief: The checks observed the original StatefulSet and PVC UIDs, replacement Pod, ordinal lookup and response.
stages.0.brief: The replacement shelf Pod must serve the retained claim.
hints.0.text: Pod identity and claim identity have different lifetimes.
hints.1.text: The headless Service provides stable ordinal DNS.
hints.2.text: Repair the template listener and wait for the StatefulSet rollout. Repair the listener to port `8080`
  and wait for replacement; the StatefulSet and claim keep their identities while the Pod changes.
phrases.0: I preserved the ordinal claim during replacement.
phrases.1: I checked ordinal DNS and the HTTP response.
phrases.2: I separated persistence from backup.
questions.0.points.0: Its ordinal and associated claim can remain stable.
questions.0.points.1: The Pod UID changes; do not confuse it with data identity.
questions.0.prompt: What survives replacement of a StatefulSet Pod?
questions.1.points.0: Only if the storage backend supplies the required durability.
questions.1.points.1: A local volume alone is not an off-host backup.
questions.1.prompt: Does a PVC protect against losing the node disk?
diagnostics.uid_statefulset: statefulset/shelf UID must equal original-statefulset-uid.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID must equal original-pvc-uid.
diagnostics.uid_pod: pod/shelf-0 UID must differ from original-pod-uid.
diagnostics.service_name: statefulset/shelf serviceName must equal shelf.
diagnostics.ready: statefulset/shelf readyReplicas must equal 1.
diagnostics.mount: 'statefulset/shelf volumeMounts must equal [{name: ledger, mountPath: /data}].'
diagnostics.clusterip: service/shelf clusterIP must equal None.
diagnostics.selector: 'service/shelf selector must equal app: shelf.'
diagnostics.http: shelf-0.shelf:8080 must equal ledger-111.
diagnostics.dns: nslookup shelf-0.shelf must succeed.
stages.0.objectives.0.text: The original StatefulSet `shelf` and PVC `ledger-shelf-0` are kept; `shelf-0` is a replacement
  Pod, using governing Service `shelf` and only volume `ledger` mounted at `/data` in its application container.
stages.0.objectives.1.text: StatefulSet `shelf` has one ready replica.
stages.0.objectives.2.text: Service `shelf` is headless (`None`) and selects only Pods labelled `app=shelf`.
stages.0.objectives.3.text: Inside Pod `shelf-0`, ordinal DNS `shelf-0.shelf` resolves and `http://shelf-0.shelf:8080`
  returns `ledger-111`.
