title: StatefulSet identity and headless DNS
brief: |-
  The endpoint is unavailable, and an independent consumer needs the preserved stateful data.

  Work on the workstation in `~/quest` with the supplied connection/result inputs: `discovery-contract.json`. Existing cluster objects provide the workload definitions.

  **Requirements:**

  - The existing StatefulSet and data claim keep their identities; its replacement Pod uses the original governing Service and only the existing data volume at `/data` in its application container.
  - StatefulSet `shelf` has one ready replica.
  - The governing Service provides stable ordinal discovery for only the supplied shelf workload, without a virtual IP.
  - Inside Pod `shelf-0`, ordinal DNS `shelf-0.shelf` resolves and `http://shelf-0.shelf:8080` returns `ledger-111`. Construct the independent consumer Deployment described in the contract, with one ready Pod and the supplied image. From its application container, ordinal DNS and the original source interface work, and its local HTTP interface returns the declared source response. The consumer does not mount the original data claim.

  Checks observe current identity, mounts, DNS and responses, not request history or off-host durability.
debrief: A stable ordinal connects discovery to a stateful identity. Repairing a source listener does not construct
  an independent consumer; recreating a process does not recreate its retained data.
stages.0.brief: Keep the original storage and controller identities while the Pod is replaced.
hints.0.text: Stable storage identity, a ready process and a working listener are different observations. Ordinal
  discovery also has to work from an independent consumer.
hints.1.text: |-
  Inspect the existing stateful workload, its governing Service, data claim and resolver configuration. The contract describes the consumer to construct; it is not present initially.

  ```sh
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl describe pod shelf-0
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```
hints.2.text: |-
  Verify the preserved source identities and readiness, then ordinal A resolution, remote response and local publication from the consumer.

  ```sh
  fqdn="shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  kubectl exec deployment/inspector -c worker -- nslookup -type=A "$fqdn"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 "http://$fqdn:8080"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
phrases.0: I preserved the ordinal claim during replacement.
phrases.1: I checked ordinal DNS and the HTTP response.
phrases.2: I separated persistence from backup.
questions.0.points.0: Its ordinal and associated claim can remain stable.
questions.0.points.1: The Pod UID changes; do not confuse it with data identity.
questions.0.prompt: What survives replacement of a StatefulSet Pod?
questions.1.points.0: Only if the storage backend supplies the required durability.
questions.1.points.1: A local volume alone is not an off-host backup.
questions.1.prompt: Does a PVC protect against losing the node disk?
