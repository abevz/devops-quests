title: StatefulSet identity and headless DNS
brief: |-
  The endpoint is unavailable, and an independent consumer needs the preserved stateful data.

  Work on the workstation in `~/quest` with the supplied connection/result inputs: `discovery-contract.json`. Existing cluster objects provide the workload definitions.

  **Requirements:**

  - The existing StatefulSet and data claim keep their identities; its replacement Pod uses the original governing Service and only the existing data volume at `/data` in its application container.
  - StatefulSet `shelf` has one ready replica.
  - The governing Service provides stable ordinal discovery for only the supplied shelf workload, without a virtual IP.
  - Inside Pod `shelf-0`, ordinal DNS `shelf-0.shelf` resolves and `http://shelf-0.shelf:8080` returns `ledger-111`. Construct the independent consumer Deployment described in the contract, with one ready Pod and the supplied image. From its application container, ordinal DNS and the original source interface work, and its local HTTP interface returns the declared source response. The consumer does not mount the original data claim.

  Checks observe current identity, mounts, DNS and responses, not request history or off-host durability.
debrief: A stable ordinal connects discovery to a stateful identity. Repairing a source listener does not construct
  an independent consumer; recreating a process does not recreate its retained data.
stages.0.brief: Keep the original storage and controller identities while the Pod is replaced.
hints.0.text: Stable storage identity, a ready process and a working listener are different observations. Ordinal
  discovery also has to work from an independent consumer.
hints.1.text: |-
  Inspect the existing stateful workload, its governing Service, data claim and resolver configuration. The contract describes the consumer to construct; it is not present initially.

  ```sh
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl describe pod shelf-0
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```
hints.2.text: |-
  Verify the preserved source identities and readiness, then ordinal A resolution, remote response and local publication from the consumer.

  ```sh
  fqdn="shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  kubectl exec deployment/inspector -c worker -- nslookup -type=A "$fqdn"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 "http://$fqdn:8080"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
phrases.0: I preserved the ordinal claim during replacement.
phrases.1: I checked ordinal DNS and the HTTP response.
phrases.2: I separated persistence from backup.
questions.0.points.0: Its ordinal and associated claim can remain stable.
questions.0.points.1: The Pod UID changes; do not confuse it with data identity.
questions.0.prompt: What survives replacement of a StatefulSet Pod?
questions.1.points.0: Only if the storage backend supplies the required durability.
questions.1.points.1: A local volume alone is not an off-host backup.
questions.1.prompt: Does a PVC protect against losing the node disk?
stages.0.objectives.0.text: The existing StatefulSet and data claim keep their identities; its replacement Pod uses
  the original governing Service and only the existing data volume at `/data` in its application container.
stages.0.objectives.1.text: StatefulSet `shelf` has one ready replica.
stages.0.objectives.2.text: The governing Service provides stable ordinal discovery for only the supplied shelf
  workload, without a virtual IP.
stages.0.objectives.3.text: Inside Pod `shelf-0`, ordinal DNS `shelf-0.shelf` resolves and `http://shelf-0.shelf:8080`
  returns `ledger-111`. Construct the independent consumer Deployment described in the contract, with one ready
  Pod and the supplied image. From its application container, ordinal DNS and the original source interface work,
  and its local HTTP interface returns the declared source response. The consumer does not mount the original data
  claim.
diagnostics.uid_statefulset: The StatefulSet may have been recreated under the original name, which permanently changes its UID. Compare the live UID with the frozen original before editing the controller template. [Cause and check](guides#guide=storage-lifecycle&section=q111-shelf-retained-controller)
diagnostics.uid_pvc: The ledger claim may have been recreated or become unreadable. Compare the current ledger-shelf-0 UID with its original receipt and retain the existing claim during recovery. [Cause and check](guides#guide=storage-lifecycle&section=q111-shelf-retained-ledger-claim)
diagnostics.uid_pod: The ordinal Pod may still have its original UID despite a template edit. Wait for the controller to replace shelf-0 while keeping the same ordinal name and persistent claim. [Cause and check](guides#guide=storage-lifecycle&section=q111-shelf-ordinal-replacement)
diagnostics.service_name: The StatefulSet may refer to a different governing Service. Check that serviceName remains shelf so the intended ordinal DNS name can resolve. [Cause and check](guides#guide=kubernetes-20&section=q111-shelf-governing-service)
diagnostics.mount: The worker may use the wrong mount or a subpath, or mount the ledger read-only. Inspect the single full writable ledger mount at /data on the named worker. [Cause and check](guides#guide=storage-lifecycle&section=q111-shelf-ledger-mount)
diagnostics.ready: A replacement may be pending, unable to mount the claim, or failing readiness. Inspect shelf-0 and wait for one ready StatefulSet replica. [Cause and check](guides#guide=kubernetes-20&section=q111-shelf-ready-replica)
diagnostics.clusterip: The Service may have acquired a virtual clusterIP. Preserve the literal None on shelf, which allows backing Pod addresses to appear in headless DNS. [Cause and check](guides#guide=kubernetes-20&section=q111-shelf-headless-service)
diagnostics.selector: The selector may exclude a current shelf Pod or include unrelated Pods. Check app=shelf and any extra selector labels against the actual Pod set. [Cause and check](guides#guide=kubernetes-20&section=q111-shelf-endpoint-selector)
diagnostics.http: The ordinal name may reach a server still listening on port 8099 or serving from the wrong directory. Request port 8080 and compare the actual ledger body with ledger-111. [Cause and check](guides#guide=kubernetes-20&section=q111-shelf-ordinal-ledger-response)
diagnostics.dns: The ordinal DNS lookup may fail if the headless Service does not publish the Pod endpoint. Check the lookup from shelf-0 using the fully qualified name. [Cause and check](guides#guide=kubernetes-20&section=q111-shelf-ordinal-dns-from-source)
diagnostics.probe_0_2: The selector observer can fail before classifying a field if its process or inputs cannot start. Check Python and access to the Service and Pods. [Cause and check](guides#guide=kubernetes-20&section=q111-shelf-selector-observer-input)
diagnostics.discovery_consumer: The inspector Deployment may be missing, have the wrong image or lack exactly one current owned Pod with a ready running worker. Check the live Deployment and its current Pod, including the supplied image identity. [Cause and check](guides#guide=kubernetes-20&section=q111-inspector-current-workload)
diagnostics.discovery_network: The inspector may mount the source claim instead of consuming the response over the network. Inspect regular and init container mounts and remove uses of the source claim. [Cause and check](guides#guide=kubernetes-20&section=q111-inspector-without-ledger-mount)
diagnostics.discovery_dns: The ordinal name may resolve for the source Pod but fail inside inspector. Run the A lookup from the consumer and check that it completes successfully. [Cause and check](guides#guide=kubernetes-20&section=q111-inspector-ordinal-dns)
diagnostics.discovery_source: DNS may work while inspector still cannot fetch ledger-111 from the ordinal HTTP source. Make the request from inspector and compare the received body. [Cause and check](guides#guide=kubernetes-20&section=q111-inspector-source-http)
diagnostics.discovery_publication: The consumer may reach the producer but fail to publish its response locally or keep stale content. Query loopback inside inspector for ledger-111. [Cause and check](guides#guide=kubernetes-20&section=q111-inspector-local-publication)
diagnostics.probe_0_3: The ordinal observer may stop before a condition is named if the workstation process, captured contract or time budget is unavailable. Check the tool and resource inputs and retry the individual observations. [Cause and check](guides#guide=kubernetes-20&section=q111-ordinal-observer-input)
