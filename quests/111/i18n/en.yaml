title: StatefulSet identity and headless DNS
brief: |-
  The shelf endpoint is unavailable. Restore service while retaining the existing storage identity.

  Work on the workstation in `~/quest` with the supplied files:
  - `shelf.yaml`, `service.yaml`.

  **Requirements:**

  - The existing StatefulSet and data claim keep their identities; its replacement Pod uses the original governing Service and only the existing data volume at `/data` in its application container.
  - StatefulSet `shelf` has one ready replica.
  - The governing Service provides stable ordinal discovery for only the supplied shelf workload, without a virtual IP.
  - Inside Pod `shelf-0`, ordinal DNS `shelf-0.shelf` resolves and `http://shelf-0.shelf:8080` returns `ledger-111`.

  Checks cover identity, mount configuration and response, not all ledger contents or edit history; the local practice volume is not an off-host backup.
debrief: The checks observed the original StatefulSet and PVC UIDs, replacement Pod, ordinal lookup and
  response.
stages.0.brief: Keep the original storage and controller identities while the Pod is replaced.
hints.0.text: Pod identity and claim identity have different lifetimes.
hints.1.text: |-
  The headless Service provides stable ordinal DNS.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get statefulset shelf -o yaml
    kubectl get pvc ledger-shelf-0 -o yaml
    kubectl get pod shelf-0 -o yaml
    cat original-statefulset-uid original-pvc-uid original-pod-uid
    kubectl get service shelf -o yaml
  ```
hints.2.text: 'Repair the template listener and wait for the StatefulSet rollout. Repair the listener to port `8080` and wait for replacement; the StatefulSet and claim keep their identities while the Pod changes.


  Verify the result from `~/quest` on the workstation:


  - `kubectl exec shelf-0 -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."` — The ordinal DNS name resolves inside `shelf-0`.


  - `kubectl exec shelf-0 -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080` — The shelf consumer receives `ledger-111`.'
phrases.0: I preserved the ordinal claim during replacement.
phrases.1: I checked ordinal DNS and the HTTP response.
phrases.2: I separated persistence from backup.
questions.0.points.0: Its ordinal and associated claim can remain stable.
questions.0.points.1: The Pod UID changes; do not confuse it with data identity.
questions.0.prompt: What survives replacement of a StatefulSet Pod?
questions.1.points.0: Only if the storage backend supplies the required durability.
questions.1.points.1: A local volume alone is not an off-host backup.
questions.1.prompt: Does a PVC protect against losing the node disk?
diagnostics.uid_statefulset: statefulset/shelf UID must equal original-statefulset-uid.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID must equal original-pvc-uid.
diagnostics.uid_pod: pod/shelf-0 UID must differ from original-pod-uid.
diagnostics.service_name: statefulset/shelf serviceName must equal shelf.
diagnostics.ready: statefulset/shelf readyReplicas must equal 1.
diagnostics.mount: The shelf worker must mount ledger at /data with the supplied writable access.
diagnostics.clusterip: service/shelf clusterIP must equal None.
diagnostics.selector: Service shelf must select the whole supplied shelf workload and no other workload.
diagnostics.http: shelf-0.shelf:8080 must equal ledger-111.
diagnostics.dns: nslookup shelf-0.shelf must succeed.
