diagnostics.discovery_consumer: Niezależny odbiorca potrzebuje jednego bieżącego własnego gotowego Poda z podanym
  obrazem.
diagnostics.discovery_network: Odbiorca sieciowy nie może montować pierwotnego claim danych, także przez init lub
  inny kontener.
diagnostics.discovery_dns: Odkrywanie A ordinal musi działać z odbiorcy w bieżącym namespace; sprawdź governing
  Service i sufiks resolvera.
diagnostics.discovery_source: Zachowane źródło ordinal musi zwracać odbiorcy zadeklarowaną odpowiedź.
diagnostics.discovery_publication: Lokalna publikacja HTTP odbiorcy musi odpowiadać źródłu; sama gotowość nie wystarcza.
