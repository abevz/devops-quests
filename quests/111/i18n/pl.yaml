title: Tożsamość StatefulSet i headless DNS
brief: "Endpoint shelf jest niedostępny. Przywróć usługę, zachowując tożsamość istniejącego magazynu.\n\nPracuj\
  \ w `~/quest` na stacji roboczej. Dostarczone pliki: `shelf.yaml`, `service.yaml`, `original-statefulset-uid`,\
  \ `original-pvc-uid`, `original-pod-uid`.\n\n**Requirements:**\n\n- Oryginalny StatefulSet `shelf` i PVC `ledger-shelf-0`\
  \ pozostają; `shelf-0` jest zastępczym Podem z usługą zarządzającą `shelf` i tylko wolumenem `ledger` zamontowanym\
  \ w `/data` kontenera aplikacji.\n- StatefulSet `shelf` ma jedną gotową replikę.\n- Service `shelf` jest headless\
  \ (`None`) i wybiera tylko Pody z etykietą `app=shelf`.\n- W Podzie `shelf-0` nazwa DNS `shelf-0.shelf` jest rozwiązywana,\
  \ a `http://shelf-0.shelf:8080` zwraca `ledger-111`.\n\n**Verify yourself before Check & finish:** Wykonaj te\
  \ polecenia obserwacji z `~/quest` na stacji roboczej.\n\n- Ustawienia, tożsamość i stan odpowiadają wymaganiom.\n\
  \n  ```sh\n  kubectl get statefulset shelf -o yaml\n  kubectl get pvc ledger-shelf-0 -o yaml\n  kubectl get pod\
  \ shelf-0 -o yaml\n  cat original-statefulset-uid original-pvc-uid original-pod-uid\n  kubectl get service shelf\
  \ -o yaml\n  ```\n\n- `kubectl exec shelf-0 -- nslookup -type=A \"shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.\"\
  ` — Nazwa DNS jest rozwiązywana wewnątrz `shelf-0`.\n\n- `kubectl exec shelf-0 -- wget -qO- -T 3 http://shelf-0.shelf:8080`\
  \ — Odbiorca shelf otrzymuje `ledger-111`.\n\nKontrole obejmują tożsamość, montowanie i odpowiedź, nie całą zawartość\
  \ rejestru ani historię; lokalny wolumen ćwiczeniowy nie jest kopią poza hostem."
debrief: Kontrole sprawdziły pierwotne UID StatefulSet i PVC, nowy Pod, zapytanie porządkowe i odpowiedź.
stages.0.brief: Zastępczy Pod shelf musi obsługiwać zachowany claim.
hints.0.text: Tożsamość Pod i tożsamość claim mają różne okresy istnienia.
hints.1.text: Bezgłowy Service zapewnia stabilną liczbę porządkową DNS.
hints.2.text: Napraw odbiornik szablonów i poczekaj na wdrożenie StatefulSet. Popraw port nasłuchu na `8080` i poczekaj
  na zastąpienie; StatefulSet i claim zachowują tożsamość, Pod się zmienia.
phrases.0: Podczas wymiany zachowałem roszczenie porządkowe.
phrases.1: Sprawdziłem DNS porządkowy i odpowiedź HTTP.
phrases.2: Oddzieliłem trwałość od kopii zapasowej.
questions.0.points.0: Jego numer porządkowy i powiązany claim mogą pozostać stabilne.
questions.0.points.1: Zmiany w Pod UID; nie mylić z danymi identity.
questions.0.prompt: Co przetrwa wymianę StatefulSet Pod?
questions.1.points.0: Tylko jeśli magazyn backend zapewnia wymaganą trwałość.
questions.1.points.1: Sam wolumin lokalny nie jest kopią zapasową poza hostem.
questions.1.prompt: Czy PVC chroni przed utratą dysku węzła?
diagnostics.uid_statefulset: statefulset/shelf UID musi być równe original-statefulset-uid.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID musi być równe original-pvc-uid.
diagnostics.uid_pod: pod/shelf-0 UID musi różnić się od original-pod-uid.
diagnostics.service_name: statefulset/shelf serviceName musi być równe shelf.
diagnostics.ready: statefulset/shelf readyReplicas musi być równe 1.
diagnostics.mount: 'statefulset/shelf volumeMounts musi być równe [{name: ledger, mountPath: /data}].'
diagnostics.clusterip: service/shelf clusterIP musi być równe None.
diagnostics.selector: 'service/shelf selector musi być równe app: shelf.'
diagnostics.http: shelf-0.shelf:8080 musi być równe ledger-111.
diagnostics.dns: nslookup shelf-0.shelf musi się powieść.
