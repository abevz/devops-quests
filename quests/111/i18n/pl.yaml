title: Tożsamość StatefulSet i headless DNS
brief: 'shelf przechowuje księgę syntetyczną na jej porządkowym PVC. Zmiana szablonu przeniosła słuchacza
  HTTP z 8080 na 8099. Przywróć port 8080 bez wymiany StatefulSet, claim lub księgi głównej. Kontroler
  zastąpi Pod; jego porządkowe DNS i PVC muszą pozostać użyteczne. Lokalny wolumin kind to urządzenie
  do ćwiczeń, a nie kopia zapasowa poza hostem.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `shelf.json`, `service.json`,
  `original-pvc-uid`, `original-pod-uid`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Zamiennik shelf-0 obsługuje ledger-111 na numerze porządkowym DNS przy
  użyciu oryginalnego PVC.'
debrief: Pod uległ zmianie, podczas gdy jego ordinal i rzeczywisty wolumen księgi przetrwały. Odporność
  na utratę hosta nadal wymaga niezależnych kopii zapasowych.
stages.0.brief: 'Kryteria sukcesu: Zamiennik shelf-0 obsługuje ledger-111 na numerze porządkowym DNS przy
  użyciu oryginalnego PVC.'
stages.0.objectives.0.text: Zamiennik shelf-0 obsługuje ledger-111 na porządkowym DNS przy użyciu oryginalnego
  PVC.
hints.0.text: Tożsamość Pod i tożsamość claim mają różne okresy istnienia.
hints.1.text: Bezgłowy Service zapewnia stabilną liczbę porządkową DNS.
hints.2.text: Napraw odbiornik szablonów i poczekaj na wdrożenie StatefulSet.
phrases.0: Podczas wymiany zachowałem roszczenie porządkowe.
phrases.1: Przetestowałem stabilną nazwę DNS i zapisaną księgę.
phrases.2: Oddzieliłem trwałość od kopii zapasowej.
questions.0.points.0: Jego numer porządkowy i powiązany claim mogą pozostać stabilne.
questions.0.points.1: Zmiany w Pod UID; nie mylić z danymi identity.
questions.0.prompt: Co przetrwa wymianę StatefulSet Pod?
questions.1.points.0: Tylko jeśli magazyn backend zapewnia wymaganą trwałość.
questions.1.points.1: Sam wolumin lokalny nie jest kopią zapasową poza hostem.
questions.1.prompt: Czy PVC chroni przed utratą dysku węzła?
