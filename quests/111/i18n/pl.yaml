title: Tożsamość StatefulSet i headless DNS
brief: |-
  Endpoint jest niedostępny, a niezależny odbiorca potrzebuje zachowanych danych obciążenia stanowego.

  Pracuj na workstation w `~/quest` z podanymi danymi połączenia/wyniku: `discovery-contract.json`. Definicje obciążeń są dostępne w bieżących obiektach klastra.

  **Wymagania:**

  - Istniejący StatefulSet i claim danych zachowują tożsamość; zastępczy Pod używa pierwotnego Service i tylko istniejącego wolumenu danych w `/data` kontenera aplikacji.
  - StatefulSet `shelf` ma jedną gotową replikę.
  - Service zapewnia stabilne wykrywanie według numeru porządkowego tylko dla dostarczonego obciążenia shelf, bez wirtualnego IP.
  - W Podzie `shelf-0` nazwa DNS `shelf-0.shelf` jest rozwiązywana, a `http://shelf-0.shelf:8080` zwraca `ledger-111`. Zbuduj Deployment odbiorcy opisany w kontrakcie, z jednym gotowym Podem i podanym obrazem. Z jego kontenera aplikacji działają ordinal DNS i pierwotny interfejs źródła; lokalny HTTP zwraca zadeklarowaną odpowiedź źródła. Odbiorca nie montuje pierwotnego claim danych.

  Testy obserwują bieżącą tożsamość, montowania, DNS i odpowiedzi, nie historię żądań ani trwałość poza hostem.
debrief: Stabilny ordinal łączy discovery z tożsamością stanową. Naprawa listenera nie buduje niezależnego odbiorcy;
  zastąpienie procesu nie odtwarza zachowanych danych.
stages.0.brief: Zachowaj pierwotne tożsamości pamięci i kontrolera podczas wymiany Poda.
hints.0.text: Tożsamość pamięci, gotowy proces i działający listener to różne obserwacje. Odkrywanie ordinal musi
  działać także z niezależnego odbiorcy.
hints.1.text: |-
  Sprawdź istniejące obciążenie stanowe, jego governing Service, claim i resolver. Kontrakt opisuje odbiorcę do zbudowania; początkowo go nie ma.

  ```sh
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl describe pod shelf-0
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```
hints.2.text: |-
  Sprawdź zachowane tożsamości i gotowość źródła, następnie rozwiązywanie A ordinal, odpowiedź zdalną i publikację lokalną z odbiorcy.

  ```sh
  fqdn="shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  kubectl exec deployment/inspector -c worker -- nslookup -type=A "$fqdn"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 "http://$fqdn:8080"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
phrases.0: Podczas wymiany zachowałem roszczenie porządkowe.
phrases.1: Sprawdziłem DNS porządkowy i odpowiedź HTTP.
phrases.2: Oddzieliłem trwałość od kopii zapasowej.
questions.0.points.0: Jego numer porządkowy i powiązany claim mogą pozostać stabilne.
questions.0.points.1: Zmiany w Pod UID; nie mylić z danymi identity.
questions.0.prompt: Co przetrwa wymianę StatefulSet Pod?
questions.1.points.0: Tylko jeśli magazyn backend zapewnia wymaganą trwałość.
questions.1.points.1: Sam wolumin lokalny nie jest kopią zapasową poza hostem.
questions.1.prompt: Czy PVC chroni przed utratą dysku węzła?
