title: Tożsamość StatefulSet i headless DNS
brief: 'Pracuj w `~/quest` z `shelf.json`, `service.json`, `original-statefulset-uid`, `original-pvc-uid` i `original-pod-uid`.
  StatefulSet nadaje Podowi tożsamość porządkową i może go wymienić, zachowując PVC. Napraw nasłuch shelf na port 8080 i poczekaj
  na wymianę. UID StatefulSet i PVC `ledger-shelf-0` muszą odpowiadać oryginalnym plikom; `shelf-0` musi mieć inny, niepusty
  UID Poda. Zachowaj `serviceName: shelf`, jedną gotową replikę i dokładnie montowanie pierwszego kontenera `[{name: ledger,
  mountPath: /data}]`. Service musi mieć `clusterIP: None` i dokładnie selektor `app: shelf`. Sprawdź udane zapytanie DNS
  porządkowego oraz odpowiedź `ledger-111` z `shelf-0.shelf:8080`. Kontrole obserwują tożsamości, konfigurację montowania
  i odpowiedź, nie całą zawartość ledgera ani historię zmian. Lokalny wolumen ćwiczeniowy nie jest kopią poza hostem. Pracuj
  tylko w zatoce offline.'
debrief: Kontrole sprawdziły pierwotne UID StatefulSet i PVC, nowy Pod, zapytanie porządkowe i odpowiedź.
stages.0.brief: Pierwotne tożsamości StatefulSet i PVC, nowy Pod, montowanie, Service, DNS porządkowy i odpowiedź HTTP odpowiadają
  opisowi.
stages.0.objectives.0.text: Pierwotne tożsamości StatefulSet i PVC, nowy Pod, montowanie, Service, DNS porządkowy i odpowiedź
  HTTP odpowiadają opisowi.
hints.0.text: Tożsamość Pod i tożsamość claim mają różne okresy istnienia.
hints.1.text: Bezgłowy Service zapewnia stabilną liczbę porządkową DNS.
hints.2.text: Napraw odbiornik szablonów i poczekaj na wdrożenie StatefulSet.
phrases.0: Podczas wymiany zachowałem roszczenie porządkowe.
phrases.1: Sprawdziłem DNS porządkowy i odpowiedź HTTP.
phrases.2: Oddzieliłem trwałość od kopii zapasowej.
questions.0.points.0: Jego numer porządkowy i powiązany claim mogą pozostać stabilne.
questions.0.points.1: Zmiany w Pod UID; nie mylić z danymi identity.
questions.0.prompt: Co przetrwa wymianę StatefulSet Pod?
questions.1.points.0: Tylko jeśli magazyn backend zapewnia wymaganą trwałość.
questions.1.points.1: Sam wolumin lokalny nie jest kopią zapasową poza hostem.
questions.1.prompt: Czy PVC chroni przed utratą dysku węzła?
diagnostics.uid_statefulset: statefulset/shelf UID musi być równe original-statefulset-uid.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID musi być równe original-pvc-uid.
diagnostics.uid_pod: pod/shelf-0 UID musi różnić się od original-pod-uid.
diagnostics.service_name: statefulset/shelf serviceName musi być równe shelf.
diagnostics.ready: statefulset/shelf readyReplicas musi być równe 1.
diagnostics.mount: 'statefulset/shelf volumeMounts musi być równe [{name: ledger, mountPath: /data}].'
diagnostics.clusterip: service/shelf clusterIP musi być równe None.
diagnostics.selector: 'service/shelf selector musi być równe app: shelf.'
diagnostics.http: shelf-0.shelf:8080 musi być równe ledger-111.
diagnostics.dns: nslookup shelf-0.shelf musi się powieść.
