title: Tożsamość StatefulSet i headless DNS
brief: |-
  Endpoint jest niedostępny, a niezależny odbiorca potrzebuje zachowanych danych obciążenia stanowego.

  Pracuj na workstation w `~/quest` z podanymi danymi połączenia/wyniku: `discovery-contract.json`. Definicje obciążeń są dostępne w bieżących obiektach klastra.

  **Wymagania:**

  - Istniejący StatefulSet i claim danych zachowują tożsamość; zastępczy Pod używa pierwotnego Service i tylko istniejącego wolumenu danych w `/data` kontenera aplikacji.
  - StatefulSet `shelf` ma jedną gotową replikę.
  - Service zapewnia stabilne wykrywanie według numeru porządkowego tylko dla dostarczonego obciążenia shelf, bez wirtualnego IP.
  - W Podzie `shelf-0` nazwa DNS `shelf-0.shelf` jest rozwiązywana, a `http://shelf-0.shelf:8080` zwraca `ledger-111`. Zbuduj Deployment odbiorcy opisany w kontrakcie, z jednym gotowym Podem i podanym obrazem. Z jego kontenera aplikacji działają ordinal DNS i pierwotny interfejs źródła; lokalny HTTP zwraca zadeklarowaną odpowiedź źródła. Odbiorca nie montuje pierwotnego claim danych.

  Testy obserwują bieżącą tożsamość, montowania, DNS i odpowiedzi, nie historię żądań ani trwałość poza hostem.
debrief: Stabilny ordinal łączy discovery z tożsamością stanową. Naprawa listenera nie buduje niezależnego odbiorcy;
  zastąpienie procesu nie odtwarza zachowanych danych.
stages.0.brief: Zachowaj pierwotne tożsamości pamięci i kontrolera podczas wymiany Poda.
hints.0.text: Tożsamość pamięci, gotowy proces i działający listener to różne obserwacje. Odkrywanie ordinal musi
  działać także z niezależnego odbiorcy.
hints.1.text: |-
  Sprawdź istniejące obciążenie stanowe, jego governing Service, claim i resolver. Kontrakt opisuje odbiorcę do zbudowania; początkowo go nie ma.

  ```sh
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl describe pod shelf-0
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```
hints.2.text: |-
  Sprawdź zachowane tożsamości i gotowość źródła, następnie rozwiązywanie A ordinal, odpowiedź zdalną i publikację lokalną z odbiorcy.

  ```sh
  fqdn="shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  kubectl exec deployment/inspector -c worker -- nslookup -type=A "$fqdn"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 "http://$fqdn:8080"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
phrases.0: Podczas wymiany zachowałem roszczenie porządkowe.
phrases.1: Sprawdziłem DNS porządkowy i odpowiedź HTTP.
phrases.2: Oddzieliłem trwałość od kopii zapasowej.
questions.0.points.0: Jego numer porządkowy i powiązany claim mogą pozostać stabilne.
questions.0.points.1: Zmiany w Pod UID; nie mylić z danymi identity.
questions.0.prompt: Co przetrwa wymianę StatefulSet Pod?
questions.1.points.0: Tylko jeśli magazyn backend zapewnia wymaganą trwałość.
questions.1.points.1: Sam wolumin lokalny nie jest kopią zapasową poza hostem.
questions.1.prompt: Czy PVC chroni przed utratą dysku węzła?
stages.0.objectives.0.text: Istniejący StatefulSet i claim danych zachowują tożsamość; zastępczy Pod używa pierwotnego
  Service i tylko istniejącego wolumenu danych w `/data` kontenera aplikacji.
stages.0.objectives.1.text: StatefulSet `shelf` ma jedną gotową replikę.
stages.0.objectives.2.text: Service zapewnia stabilne wykrywanie według numeru porządkowego tylko dla dostarczonego
  obciążenia shelf, bez wirtualnego IP.
stages.0.objectives.3.text: W Podzie `shelf-0` nazwa DNS `shelf-0.shelf` jest rozwiązywana, a `http://shelf-0.shelf:8080`
  zwraca `ledger-111`. Zbuduj Deployment odbiorcy opisany w kontrakcie, z jednym gotowym Podem i podanym obrazem.
  Z jego kontenera aplikacji działają ordinal DNS i pierwotny interfejs źródła; lokalny HTTP zwraca zadeklarowaną
  odpowiedź źródła. Odbiorca nie montuje pierwotnego claim danych.
diagnostics.uid_statefulset: StatefulSet mógł zostać odtworzony pod pierwotną nazwą, co trwale zmienia UID. Porównaj bieżący UID z zamrożonym przed zmianą szablonu kontrolera. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q111-shelf-retained-controller)
diagnostics.uid_pvc: PVC dziennika mógł zostać odtworzony lub być nieczytelny. Porównaj UID ledger-shelf-0 z pierwotnym zapisem i zachowaj PVC podczas naprawy. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q111-shelf-retained-ledger-claim)
diagnostics.uid_pod: Pod porządkowy może nadal mieć pierwotny UID mimo zmiany szablonu. Poczekaj na zastąpienie shelf-0 przy zachowaniu jego nazwy i stałego PVC. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q111-shelf-ordinal-replacement)
diagnostics.service_name: StatefulSet może wskazywać inny Service zarządzający. Sprawdź, czy serviceName to shelf, aby właściwa nazwa porządkowa DNS mogła się rozwiązać. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-shelf-governing-service)
diagnostics.mount: Kontener worker może używać innego montowania, podścieżki lub trybu tylko do odczytu. Sprawdź jedyne pełne zapisywalne montowanie ledger w /data w kontenerze worker. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q111-shelf-ledger-mount)
diagnostics.ready: Nowy pod może czekać, nie zamontować PVC lub nie przechodzić gotowości. Sprawdź shelf-0 i poczekaj na jedną gotową replikę StatefulSetu. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-shelf-ready-replica)
diagnostics.clusterip: Service mógł otrzymać wirtualny clusterIP. Zachowaj None w shelf, aby DNS headless mógł zwracać adresy podów. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-shelf-headless-service)
diagnostics.selector: Selektor może pomijać aktualny pod shelf lub obejmować inne pody. Sprawdź app=shelf i dodatkowe etykiety względem rzeczywistych podów shelf. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-shelf-endpoint-selector)
diagnostics.http: Nazwa porządkowa może prowadzić do serwera na porcie 8099 lub z innym katalogiem. Odpytaj port 8080 i porównaj treść dziennika z ledger-111. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-shelf-ordinal-ledger-response)
diagnostics.dns: Zapytanie DNS dla nazwy porządkowej może zawieść, gdy Service headless nie publikuje endpointu poda. Sprawdź pełną nazwę z shelf-0. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-shelf-ordinal-dns-from-source)
diagnostics.probe_0_2: Kontrola selektora może przerwać działanie przed rozpoznaniem pola, gdy proces lub wejścia zawodzą. Sprawdź Python i dostęp do Service oraz podów. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-shelf-selector-observer-input)
diagnostics.discovery_consumer: Deployment inspector może nie istnieć, mieć inny obraz lub nie mieć dokładnie jednego aktualnego poda z gotowym działającym kontenerem worker. Sprawdź wdrożenie, pod i dostarczoną tożsamość obrazu. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-inspector-current-workload)
diagnostics.discovery_network: Inspector może montować źródłowe PVC zamiast pobierać odpowiedź przez sieć. Sprawdź montowania zwykłych i init-kontenerów i usuń użycie źródłowego PVC. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-inspector-without-ledger-mount)
diagnostics.discovery_dns: Nazwa porządkowa może działać w podzie źródłowym, ale zawodzić w inspector. Uruchom zapytanie A z konsumenta i sprawdź, czy działa. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-inspector-ordinal-dns)
diagnostics.discovery_source: DNS może działać, choć inspector nie pobiera ledger-111 ze źródła HTTP o nazwie porządkowej. Wykonaj żądanie z inspector i porównaj treść. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-inspector-source-http)
diagnostics.discovery_publication: Konsument może docierać do producenta, ale nie publikować odpowiedzi lokalnie albo zachowywać starą treść. Odpytaj loopback w inspector pod kątem ledger-111. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-inspector-local-publication)
diagnostics.probe_0_3: Kontrola nazwy porządkowej może przerwać działanie bez wskazania warunku, gdy proces, zapis kontraktu lub limit czasu zawodzi. Sprawdź narzędzia i dane, potem powtórz obserwacje osobno. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=q111-ordinal-observer-input)
