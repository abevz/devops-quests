title: StatefulSet Identität und headless DNS
brief: "Der Shelf-Endpunkt ist nicht verfügbar. Stellen Sie den Dienst unter Beibehaltung der Speicheridentität\
  \ wieder her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `shelf.json`, `service.json`,\
  \ `original-statefulset-uid`, `original-pvc-uid`, `original-pod-uid`.\n\n**Requirements:**\n\n- Das ursprüngliche\
  \ StatefulSet `shelf` und PVC `ledger-shelf-0` bleiben erhalten; `shelf-0` ist ein Ersatz-Pod mit zugehörigem\
  \ Service `shelf` und nur Volume `ledger` unter `/data` im Anwendungscontainer.\n- StatefulSet `shelf` hat ein\
  \ bereites Replikat.\n- Service `shelf` ist headless (`None`) und wählt nur Pods mit Label `app=shelf`.\n- Im\
  \ Pod `shelf-0` wird der ordinale DNS-Name `shelf-0.shelf` aufgelöst und `http://shelf-0.shelf:8080` liefert `ledger-111`.\n\
  \n**Verify yourself before Check & finish:** Führen Sie diese Beobachtungsbefehle aus `~/quest` auf der Workstation\
  \ aus.\n\n- Einstellungen, Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get statefulset\
  \ shelf -o yaml\n  kubectl get pvc ledger-shelf-0 -o yaml\n  kubectl get pod shelf-0 -o yaml\n  cat original-statefulset-uid\
  \ original-pvc-uid original-pod-uid\n  kubectl get service shelf -o yaml\n  ```\n\n- `kubectl exec shelf-0 --\
  \ nslookup -type=A \"shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.\"` — Der ordinale DNS-Name wird in `shelf-0`\
  \ aufgelöst.\n\n- `kubectl exec shelf-0 -- wget -qO- -T 3 http://shelf-0.shelf:8080` — Der Shelf-Verbraucher erhält\
  \ `ledger-111`.\n\nDie Prüfungen betreffen Identität, Mount-Konfiguration und Antwort, nicht alle Ledger-Inhalte\
  \ oder den Änderungsverlauf; das lokale Übungsvolume ist kein externes Backup."
debrief: Die Prüfungen beobachteten ursprüngliche StatefulSet- und PVC-UIDs, Ersatz-Pod, ordinale Abfrage und Antwort.
stages.0.brief: Der Ersatz-Pod shelf muss den erhaltenen Claim bedienen.
hints.0.text: Pod identity und claim identity haben unterschiedliche Lebensdauern.
hints.1.text: Der kopflose Service sorgt für einen stabilen ordinal DNS.
hints.2.text: Reparieren Sie den Vorlagen-Listener und warten Sie auf den Rollout von StatefulSet. Korrigieren Sie
  den Listener auf Port `8080` und warten Sie auf den Ersatz; StatefulSet und Claim behalten ihre Identität, der
  Pod wechselt.
phrases.0: Ich habe den ordinal claim beim Austausch erhalten.
phrases.1: Ich prüfte ordinales DNS und die HTTP-Antwort.
phrases.2: Ich habe die Persistenz vom Backup getrennt.
questions.0.points.0: Seine Ordnungszahl und das zugehörige claim können stabil bleiben.
questions.0.points.1: Der Pod UID ändert sich; Verwechseln Sie es nicht mit den Daten identity.
questions.0.prompt: Was überlebt den Austausch eines StatefulSet Pod?
questions.1.points.0: Nur wenn der Speicher backend die erforderliche Haltbarkeit bietet.
questions.1.points.1: Ein lokales Volume allein ist kein Off-Host-Backup.
questions.1.prompt: Schützt ein PVC vor dem Verlust der Knotenplatte?
diagnostics.uid_statefulset: statefulset/shelf UID muss original-statefulset-uid entsprechen.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID muss original-pvc-uid entsprechen.
diagnostics.uid_pod: pod/shelf-0 UID muss sich von original-pod-uid unterscheiden.
diagnostics.service_name: statefulset/shelf serviceName muss shelf entsprechen.
diagnostics.ready: statefulset/shelf readyReplicas muss 1 entsprechen.
diagnostics.mount: 'statefulset/shelf volumeMounts muss [{name: ledger, mountPath: /data}] entsprechen.'
diagnostics.clusterip: service/shelf clusterIP muss None entsprechen.
diagnostics.selector: 'service/shelf selector muss app: shelf entsprechen.'
diagnostics.http: shelf-0.shelf:8080 muss ledger-111 entsprechen.
diagnostics.dns: nslookup shelf-0.shelf muss erfolgreich sein.
stages.0.objectives.0.text: Das ursprüngliche StatefulSet `shelf` und PVC `ledger-shelf-0` bleiben erhalten; `shelf-0`
  ist ein Ersatz-Pod mit zugehörigem Service `shelf` und nur Volume `ledger` unter `/data` im Anwendungscontainer.
stages.0.objectives.1.text: StatefulSet `shelf` hat ein bereites Replikat.
stages.0.objectives.2.text: Service `shelf` ist headless (`None`) und wählt nur Pods mit Label `app=shelf`.
stages.0.objectives.3.text: Im Pod `shelf-0` wird der ordinale DNS-Name `shelf-0.shelf` aufgelöst und `http://shelf-0.shelf:8080`
  liefert `ledger-111`.
