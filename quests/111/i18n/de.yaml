title: StatefulSet Identität und headless DNS
brief: |-
  Der Shelf-Endpunkt ist nicht verfügbar. Stellen Sie den Dienst unter Beibehaltung der Speicheridentität wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `shelf.yaml`, `service.yaml`.

  **Requirements:**

  - Das vorhandene StatefulSet und der Daten-Claim behalten ihre Identität; der Ersatz-Pod nutzt den ursprünglichen steuernden Service und nur das vorhandene Daten-Volume unter `/data` im Anwendungscontainer.
  - StatefulSet `shelf` hat ein bereites Replikat.
  - Der steuernde Service ermöglicht stabile ordinale Erkennung nur für den bereitgestellten shelf-Workload, ohne virtuelle IP.
  - Im Pod `shelf-0` wird der ordinale DNS-Name `shelf-0.shelf` aufgelöst und `http://shelf-0.shelf:8080` liefert `ledger-111`.

  Die Prüfungen betreffen Identität, Mount-Konfiguration und Antwort, nicht alle Ledger-Inhalte oder den Änderungsverlauf; das lokale Übungsvolume ist kein externes Backup.
debrief: Die Prüfungen beobachteten ursprüngliche StatefulSet- und PVC-UIDs, Ersatz-Pod, ordinale Abfrage
  und Antwort.
stages.0.brief: Bewahren Sie die ursprünglichen Speicher- und Controller-Identitäten beim Ersetzen des
  Pods.
hints.0.text: Pod identity und claim identity haben unterschiedliche Lebensdauern.
hints.1.text: |-
  Der kopflose Service sorgt für einen stabilen ordinal DNS.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get statefulset shelf -o yaml
    kubectl get pvc ledger-shelf-0 -o yaml
    kubectl get pod shelf-0 -o yaml
    cat original-statefulset-uid original-pvc-uid original-pod-uid
    kubectl get service shelf -o yaml
  ```
hints.2.text: 'Reparieren Sie den Vorlagen-Listener und warten Sie auf den Rollout von StatefulSet. Korrigieren Sie den Listener auf Port `8080` und warten Sie auf den Ersatz; StatefulSet und Claim behalten ihre Identität, der Pod wechselt.


  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:


  - `kubectl exec shelf-0 -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."` — Der ordinale DNS-Name wird in `shelf-0` aufgelöst.


  - `kubectl exec shelf-0 -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080` — Der Shelf-Verbraucher erhält `ledger-111`.'
phrases.0: Ich habe den ordinal claim beim Austausch erhalten.
phrases.1: Ich prüfte ordinales DNS und die HTTP-Antwort.
phrases.2: Ich habe die Persistenz vom Backup getrennt.
questions.0.points.0: Seine Ordnungszahl und das zugehörige claim können stabil bleiben.
questions.0.points.1: Der Pod UID ändert sich; Verwechseln Sie es nicht mit den Daten identity.
questions.0.prompt: Was überlebt den Austausch eines StatefulSet Pod?
questions.1.points.0: Nur wenn der Speicher backend die erforderliche Haltbarkeit bietet.
questions.1.points.1: Ein lokales Volume allein ist kein Off-Host-Backup.
questions.1.prompt: Schützt ein PVC vor dem Verlust der Knotenplatte?
diagnostics.uid_statefulset: statefulset/shelf UID muss original-statefulset-uid entsprechen.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID muss original-pvc-uid entsprechen.
diagnostics.uid_pod: pod/shelf-0 UID muss sich von original-pod-uid unterscheiden.
diagnostics.service_name: statefulset/shelf serviceName muss shelf entsprechen.
diagnostics.ready: statefulset/shelf readyReplicas muss 1 entsprechen.
diagnostics.mount: Der worker von shelf muss ledger unter /data mit dem vorgegebenen Schreibzugriff einbinden.
diagnostics.clusterip: service/shelf clusterIP muss None entsprechen.
diagnostics.selector: Service shelf muss die gesamte bereitgestellte Workload shelf und keine andere auswählen.
diagnostics.http: shelf-0.shelf:8080 muss ledger-111 entsprechen.
diagnostics.dns: nslookup shelf-0.shelf muss erfolgreich sein.
