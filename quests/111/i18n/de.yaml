diagnostics.probe_0_2: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Der steuernde Service
  ermöglicht stabile ordinale Erkennung nur für den bereitgestellten shelf-Workload, ohne virtuelle IP.'
diagnostics.discovery_consumer: Der unabhängige Verbraucher braucht einen aktuellen eigenen bereiten Pod mit dem
  vorgegebenen Image.
diagnostics.discovery_network: Der Netzwerkverbraucher darf den ursprünglichen Daten-Claim auch über Initialisierer
  oder andere Container nicht mounten.
diagnostics.discovery_dns: Ordinale A-Auflösung muss aus dem Verbraucher im aktuellen Namespace funktionieren; prüfe
  governing Service und Resolver-Suffix.
diagnostics.discovery_source: Die erhaltene ordinale Quelle muss dem Verbraucher die deklarierte Antwort liefern.
diagnostics.discovery_publication: Die lokale HTTP-Veröffentlichung des Verbrauchers muss der Quellantwort entsprechen;
  Bereitschaft allein reicht nicht.
diagnostics.probe_0_3: Aktuelle Eingaben konnten diese Bedingung nicht bestätigen; prüfe Objektstatus und Vertrag.
