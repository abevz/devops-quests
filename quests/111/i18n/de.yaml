title: StatefulSet Identität und headless DNS
brief: 'Ein shelf speichert das synthetische Ledger auf seinem ordinal PVC. Durch eine Vorlagenänderung
  wurde der Listener HTTP von 8080 auf 8099 verschoben. Stellen Sie Port 8080 wieder her, ohne StatefulSet,
  claim oder Ledger zu ersetzen. Der Controller ersetzt den Pod; dessen ordinal DNS und PVC müssen nutzbar
  bleiben. Das lokale kind-Volume ist ein Übungsgerät und kein Off-Host-Backup.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `shelf.json`, `service.json`, `original-pvc-uid`,
  `original-pod-uid`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der Ersatz shelf-0 bedient ledger-111 auf ordinal DNS unter Verwendung des ursprünglichen
  PVC.'
debrief: Der Pod änderte sich, während sein ordinal und das reale Hauptbuchvolumen überlebten. Für die
  Host-Ausfallbeständigkeit sind weiterhin unabhängige Backups erforderlich.
stages.0.brief: 'Erfolgskriterium: Der Ersatz shelf-0 bedient ledger-111 auf ordinal DNS unter Verwendung
  des ursprünglichen PVC.'
stages.0.objectives.0.text: Der Ersatz shelf-0 bedient ledger-111 auf ordinal DNS unter Verwendung des
  ursprünglichen PVC.
hints.0.text: Pod identity und claim identity haben unterschiedliche Lebensdauern.
hints.1.text: Der kopflose Service sorgt für einen stabilen ordinal DNS.
hints.2.text: Reparieren Sie den Vorlagen-Listener und warten Sie auf den Rollout von StatefulSet.
phrases.0: Ich habe den ordinal claim beim Austausch erhalten.
phrases.1: Ich habe den stabilen Namen DNS und das gespeicherte Ledger getestet.
phrases.2: Ich habe die Persistenz vom Backup getrennt.
questions.0.points.0: Seine Ordnungszahl und das zugehörige claim können stabil bleiben.
questions.0.points.1: Der Pod UID ändert sich; Verwechseln Sie es nicht mit den Daten identity.
questions.0.prompt: Was überlebt den Austausch eines StatefulSet Pod?
questions.1.points.0: Nur wenn der Speicher backend die erforderliche Haltbarkeit bietet.
questions.1.points.1: Ein lokales Volume allein ist kein Off-Host-Backup.
questions.1.prompt: Schützt ein PVC vor dem Verlust der Knotenplatte?
