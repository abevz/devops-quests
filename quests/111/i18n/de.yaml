title: StatefulSet Identität und headless DNS
brief: |-
  Der Endpunkt ist nicht verfügbar; ein unabhängiger Verbraucher benötigt die erhaltenen zustandsbehafteten Daten.

  Arbeite auf der Workstation in `~/quest` mit den vorgegebenen Verbindungs-/Ergebniseingaben: `discovery-contract.json`. Die Workload-Definitionen stehen in aktuellen Clusterobjekten.

  **Anforderungen:**

  - Das vorhandene StatefulSet und der Daten-Claim behalten ihre Identität; der Ersatz-Pod nutzt den ursprünglichen steuernden Service und nur das vorhandene Daten-Volume unter `/data` im Anwendungscontainer.
  - StatefulSet `shelf` hat ein bereites Replikat.
  - Der steuernde Service ermöglicht stabile ordinale Erkennung nur für den bereitgestellten shelf-Workload, ohne virtuelle IP.
  - Im Pod `shelf-0` wird der ordinale DNS-Name `shelf-0.shelf` aufgelöst und `http://shelf-0.shelf:8080` liefert `ledger-111`. Konstruiere das im Vertrag beschriebene Verbraucher-Deployment mit einem bereiten Pod und dem vorgegebenen Image. Aus seinem Anwendungscontainer funktionieren ordinales DNS und die ursprüngliche Quellschnittstelle; seine lokale HTTP-Schnittstelle liefert die deklarierte Quellantwort. Der Verbraucher mountet den ursprünglichen Daten-Claim nicht.

  Prüfungen beobachten aktuelle Identität, Mounts, DNS und Antworten, keinen Anfragenverlauf oder externe Datensicherung.
debrief: Ein stabiles Ordinal verbindet Discovery mit zustandsbehafteter Identität. Listener-Reparatur konstruiert
  keinen unabhängigen Verbraucher; Prozessersatz erzeugt erhaltene Daten nicht neu.
stages.0.brief: Bewahren Sie die ursprünglichen Speicher- und Controller-Identitäten beim Ersetzen des Pods.
hints.0.text: Speicheridentität, ein bereiter Prozess und ein funktionierender Listener sind verschiedene Beobachtungen.
  Ordinale Auflösung muss auch aus einem unabhängigen Verbraucher funktionieren.
hints.1.text: |-
  Prüfe den vorhandenen Stateful-Workload, seinen governing Service, Daten-Claim und Resolver. Der Vertrag beschreibt den zu konstruierenden Verbraucher; anfangs existiert er nicht.

  ```sh
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl describe pod shelf-0
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```
hints.2.text: |-
  Prüfe erhaltene Quellidentitäten und Bereitschaft, danach ordinale A-Auflösung, entfernte Antwort und lokale Veröffentlichung aus dem Verbraucher.

  ```sh
  fqdn="shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  kubectl exec deployment/inspector -c worker -- nslookup -type=A "$fqdn"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 "http://$fqdn:8080"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
phrases.0: Ich habe den ordinal claim beim Austausch erhalten.
phrases.1: Ich prüfte ordinales DNS und die HTTP-Antwort.
phrases.2: Ich habe die Persistenz vom Backup getrennt.
questions.0.points.0: Seine Ordnungszahl und das zugehörige claim können stabil bleiben.
questions.0.points.1: Der Pod UID ändert sich; Verwechseln Sie es nicht mit den Daten identity.
questions.0.prompt: Was überlebt den Austausch eines StatefulSet Pod?
questions.1.points.0: Nur wenn der Speicher backend die erforderliche Haltbarkeit bietet.
questions.1.points.1: Ein lokales Volume allein ist kein Off-Host-Backup.
questions.1.prompt: Schützt ein PVC vor dem Verlust der Knotenplatte?
stages.0.objectives.0.text: Das vorhandene StatefulSet und der Daten-Claim behalten ihre Identität; der Ersatz-Pod
  nutzt den ursprünglichen steuernden Service und nur das vorhandene Daten-Volume unter `/data` im Anwendungscontainer.
stages.0.objectives.1.text: StatefulSet `shelf` hat ein bereites Replikat.
stages.0.objectives.2.text: Der steuernde Service ermöglicht stabile ordinale Erkennung nur für den bereitgestellten
  shelf-Workload, ohne virtuelle IP.
stages.0.objectives.3.text: Im Pod `shelf-0` wird der ordinale DNS-Name `shelf-0.shelf` aufgelöst und `http://shelf-0.shelf:8080`
  liefert `ledger-111`. Konstruiere das im Vertrag beschriebene Verbraucher-Deployment mit einem bereiten Pod und
  dem vorgegebenen Image. Aus seinem Anwendungscontainer funktionieren ordinales DNS und die ursprüngliche Quellschnittstelle;
  seine lokale HTTP-Schnittstelle liefert die deklarierte Quellantwort. Der Verbraucher mountet den ursprünglichen
  Daten-Claim nicht.
diagnostics.uid_statefulset: Das StatefulSet wurde möglicherweise unter gleichem Namen neu erstellt und hat dadurch dauerhaft eine andere UID. Vergleichen Sie sie vor der Vorlagenänderung mit dem festgehaltenen Original. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q111-shelf-retained-controller)
diagnostics.uid_pvc: Der Ledger-PVC wurde möglicherweise neu erstellt oder ist nicht lesbar. Vergleichen Sie die UID von ledger-shelf-0 mit dem ursprünglichen Beleg und behalten Sie den vorhandenen PVC bei. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q111-shelf-retained-ledger-claim)
diagnostics.uid_pod: Der ordinale Pod hat trotz Vorlagenänderung möglicherweise noch seine ursprüngliche UID. Warten Sie auf den Ersatz von shelf-0 bei gleichem ordinalen Namen und persistentem PVC. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q111-shelf-ordinal-replacement)
diagnostics.service_name: Das StatefulSet verweist möglicherweise auf einen anderen zuständigen Service. Prüfen Sie, ob serviceName weiterhin shelf lautet, damit der ordinale DNS-Name auflösbar ist. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-shelf-governing-service)
diagnostics.mount: Der Worker verwendet möglicherweise einen anderen Mount, Unterpfad oder Schreibschutz. Prüfen Sie den einzigen vollständigen beschreibbaren Ledger-Mount auf /data im Worker. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q111-shelf-ledger-mount)
diagnostics.ready: Der Ersatz wartet möglicherweise, kann den PVC nicht einbinden oder scheitert bei der Bereitschaft. Prüfen Sie shelf-0 und warten Sie auf eine bereite StatefulSet-Replik. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-shelf-ready-replica)
diagnostics.clusterip: Der Service hat möglicherweise eine virtuelle clusterIP erhalten. Behalten Sie None bei shelf bei, damit Headless-DNS Pod-Adressen liefern kann. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-shelf-headless-service)
diagnostics.selector: Der Selektor schließt möglicherweise einen aktuellen shelf-Pod aus oder fremde Pods ein. Prüfen Sie app=shelf und Zusatzlabels anhand der tatsächlichen shelf-Pods. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-shelf-endpoint-selector)
diagnostics.http: Der ordinale Name führt möglicherweise zu einem Server auf 8099 oder mit einem anderen Verzeichnis. Rufen Sie Port 8080 auf und vergleichen Sie die Ledger-Antwort mit ledger-111. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-shelf-ordinal-ledger-response)
diagnostics.dns: Die ordinale DNS-Anfrage kann scheitern, wenn der Headless-Service den Pod-Endpoint nicht veröffentlicht. Prüfen Sie den vollqualifizierten Namen aus shelf-0. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-shelf-ordinal-dns-from-source)
diagnostics.probe_0_2: Die Selektorprüfung kann vor der Feldmeldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Python und Zugriff auf Service und Pods. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-shelf-selector-observer-input)
diagnostics.discovery_consumer: Das Deployment inspector fehlt möglicherweise, nutzt ein anderes Image oder hat nicht genau einen aktuellen zugehörigen Pod mit laufendem bereitem Worker. Prüfen Sie Deployment, Pod und bereitgestellte Image-Identität. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-inspector-current-workload)
diagnostics.discovery_network: Inspector bindet möglicherweise den Quell-PVC ein statt der Antwort über das Netzwerk. Prüfen Sie reguläre und Init-Container-Mounts und entfernen Sie die Nutzung des Quell-PVC. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-inspector-without-ledger-mount)
diagnostics.discovery_dns: Der ordinale Name kann im Quell-Pod auflösbar sein, aber in inspector scheitern. Stellen Sie die A-Anfrage vom Verbraucher und prüfen Sie ihren Erfolg. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-inspector-ordinal-dns)
diagnostics.discovery_source: DNS kann funktionieren, obwohl inspector ledger-111 nicht von der ordinalen HTTP-Quelle erhält. Rufen Sie sie aus inspector auf und vergleichen Sie die Antwort. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-inspector-source-http)
diagnostics.discovery_publication: Der Verbraucher kann den Produzenten erreichen, ohne die Antwort lokal zu veröffentlichen, oder alte Inhalte behalten. Rufen Sie Loopback in inspector auf und prüfen Sie ledger-111. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-inspector-local-publication)
diagnostics.probe_0_3: Die ordinale Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Prozess, Vertragsbeleg oder Zeitbudget fehlen. Prüfen Sie Werkzeuge und Eingaben und wiederholen Sie einzelne Beobachtungen. [Ursache und Prüfung](guides#guide=kubernetes-20&section=q111-ordinal-observer-input)
