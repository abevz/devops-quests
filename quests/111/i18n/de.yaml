title: StatefulSet Identität und headless DNS
brief: 'Arbeite in `~/quest` mit `shelf.json`, `service.json`, `original-statefulset-uid`, `original-pvc-uid` und `original-pod-uid`.
  Ein StatefulSet gibt einem Pod eine ordinale Identität und kann ihn ersetzen, während ein PVC bleibt. Repariere den Shelf-Listener
  auf Port 8080 und warte auf den Ersatz. Die UIDs von StatefulSet und PVC `ledger-shelf-0` müssen ihren Originaldateien entsprechen;
  `shelf-0` muss eine andere, nichtleere Pod-UID haben. Behalte `serviceName: shelf`, ein bereites Replikat und genau das
  erste Container-Volume-Mount `[{name: ledger, mountPath: /data}]`. Der Service muss `clusterIP: None` und genau Selektor
  `app: shelf` haben. Prüfe eine erfolgreiche ordinale DNS-Abfrage und `ledger-111` von `shelf-0.shelf:8080`. Die Prüfungen
  beobachten Identität, Mount-Konfiguration und Antwort, nicht den gesamten Ledger-Inhalt oder die Änderungshistorie. Das
  lokale Übungs-Volume ist kein Backup außerhalb des Hosts. Arbeite nur in der Offline-Umgebung.'
debrief: Die Prüfungen beobachteten ursprüngliche StatefulSet- und PVC-UIDs, Ersatz-Pod, ordinale Abfrage und Antwort.
stages.0.brief: Ursprüngliche StatefulSet- und PVC-Identität, Ersatz-Pod, Mount, Service, ordinales DNS und HTTP-Antwort entsprechen
  der Beschreibung.
stages.0.objectives.0.text: Ursprüngliche StatefulSet- und PVC-Identität, Ersatz-Pod, Mount, Service, ordinales DNS und HTTP-Antwort
  entsprechen der Beschreibung.
hints.0.text: Pod identity und claim identity haben unterschiedliche Lebensdauern.
hints.1.text: Der kopflose Service sorgt für einen stabilen ordinal DNS.
hints.2.text: Reparieren Sie den Vorlagen-Listener und warten Sie auf den Rollout von StatefulSet.
phrases.0: Ich habe den ordinal claim beim Austausch erhalten.
phrases.1: Ich prüfte ordinales DNS und die HTTP-Antwort.
phrases.2: Ich habe die Persistenz vom Backup getrennt.
questions.0.points.0: Seine Ordnungszahl und das zugehörige claim können stabil bleiben.
questions.0.points.1: Der Pod UID ändert sich; Verwechseln Sie es nicht mit den Daten identity.
questions.0.prompt: Was überlebt den Austausch eines StatefulSet Pod?
questions.1.points.0: Nur wenn der Speicher backend die erforderliche Haltbarkeit bietet.
questions.1.points.1: Ein lokales Volume allein ist kein Off-Host-Backup.
questions.1.prompt: Schützt ein PVC vor dem Verlust der Knotenplatte?
