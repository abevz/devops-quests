diagnostics.probe_0_2: 'Текущие данные не позволили проверить эту цель: Управляющий Service обеспечивает стабильное
  обнаружение по ordinal только для предоставленной нагрузки shelf, без виртуального IP.'
diagnostics.discovery_consumer: Независимому потребителю нужен один текущий готовый Pod с правильным владельцем
  и заданным образом.
diagnostics.discovery_network: Сетевой потребитель не должен монтировать исходный data claim, в том числе через
  init или другой контейнер.
diagnostics.discovery_dns: Ordinal A discovery должен работать из потребителя в текущем namespace; изучите governing
  Service и суффикс resolver.
diagnostics.discovery_source: Сохранённый ordinal-источник должен возвращать объявленный ответ при запросе из потребителя.
diagnostics.discovery_publication: Локальная HTTP-публикация потребителя должна совпадать с ответом источника; одной
  готовности недостаточно.
diagnostics.probe_0_3: Текущие входы не подтверждают это условие; изучите состояние живых объектов и заданный контракт.
