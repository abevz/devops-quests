title: Идентичность StatefulSet и headless DNS
brief: |-
  Конечная точка shelf недоступна. Восстановите обслуживание с сохранением идентичности существующего хранилища.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `shelf.yaml`, `service.yaml`.

  **Requirements:**

  - Существующие StatefulSet и claim данных сохраняют идентичность; новый Pod использует исходный управляющий Service и только существующий том данных в `/data` своего контейнера приложения.
  - StatefulSet `shelf` имеет одну готовую реплику.
  - Управляющий Service обеспечивает стабильное обнаружение по ordinal только для предоставленной нагрузки shelf, без виртуального IP.
  - В Pod `shelf-0` порядковое DNS-имя `shelf-0.shelf` разрешается, а `http://shelf-0.shelf:8080` возвращает `ledger-111`.

  Проверки охватывают идентичность, монтирование и ответ, а не всё содержимое журнала или историю правок; локальный учебный том не является внешней резервной копией.
debrief: Проверки наблюдали исходные UID StatefulSet и PVC, новый Pod, порядковый запрос и ответ.
stages.0.brief: Сохраните исходные идентичности хранилища и контроллера при замене Pod.
hints.0.text: У identity Pod и claim разные сроки жизни.
hints.1.text: |-
  Headless Service обеспечивает стабильный DNS ordinal.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get statefulset shelf -o yaml
    kubectl get pvc ledger-shelf-0 -o yaml
    kubectl get pod shelf-0 -o yaml
    cat original-statefulset-uid original-pvc-uid original-pod-uid
    kubectl get service shelf -o yaml
  ```
hints.2.text: 'Исправьте порт в шаблоне и дождитесь выкатки StatefulSet. Исправьте порт слушателя на `8080` и дождитесь замены; StatefulSet и PVC сохраняют идентичность, а Pod меняется.


  Проверьте результат из `~/quest` на workstation:


  - `kubectl exec shelf-0 -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."` — Порядковое DNS-имя разрешается внутри `shelf-0`.


  - `kubectl exec shelf-0 -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080` — Потребитель shelf получает `ledger-111`.'
phrases.0: Я сохранил claim ordinal при замене.
phrases.1: Я проверил порядковый DNS и HTTP-ответ.
phrases.2: Я разделил хранение и резервное копирование.
