title: Идентичность StatefulSet и headless DNS
brief: 'Стеллаж хранит учебный журнал на PVC своей реплики. После изменения шаблона
  HTTP слушает 8099 вместо 8080. Верните 8080, не заменяя StatefulSet, claim и журнал.
  Контроллер заменит Pod; DNS ordinal и PVC должны остаться рабочими. Локальный том
  kind — учебная фикстура, а не резервная копия вне хоста.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `shelf.json`, `service.json`,
  `original-pvc-uid`, `original-pod-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Новый shelf-0 отдаёт ledger-111 через DNS ordinal с исходным
  PVC.'
debrief: Pod сменился, а ordinal и реальный том журнала сохранились. От потери хоста
  защищают отдельные резервные копии.
stages.0.brief: 'Результат проверки: Новый shelf-0 отдаёт ledger-111 через DNS ordinal
  с исходным PVC.'
stages.0.objectives.0.text: Новый shelf-0 отдаёт ledger-111 через DNS ordinal с исходным
  PVC.
hints.0.text: У identity Pod и claim разные сроки жизни.
hints.1.text: Headless Service обеспечивает стабильный DNS ordinal.
hints.2.text: Исправьте порт в шаблоне и дождитесь выкатки StatefulSet.
phrases.0: Я сохранил claim ordinal при замене.
phrases.1: Я проверил стабильный DNS и сохранённый журнал.
phrases.2: Я разделил хранение и резервное копирование.
questions.0.points.0: Ordinal и связанный claim могут сохраняться.
questions.0.points.1: UID Pod меняется; это не identity данных.
questions.0.prompt: Что сохраняется при замене Pod StatefulSet?
questions.1.points.0: Только если backend хранения обеспечивает нужную надёжность.
questions.1.points.1: Локальный том сам по себе не является копией вне хоста.
questions.1.prompt: Защищает ли PVC от потери диска узла?
