title: Идентичность StatefulSet и headless DNS
brief: |-
  Endpoint недоступен, а независимому потребителю нужны сохранённые данные stateful-нагрузки.

  Работайте на workstation в `~/quest` с заданными входами подключения/результата: `discovery-contract.json`. Определения нагрузок доступны в текущих объектах кластера.

  **Требования:**

  - Существующие StatefulSet и claim данных сохраняют идентичность; новый Pod использует исходный управляющий Service и только существующий том данных в `/data` своего контейнера приложения.
  - StatefulSet `shelf` имеет одну готовую реплику.
  - Управляющий Service обеспечивает стабильное обнаружение по ordinal только для предоставленной нагрузки shelf, без виртуального IP.
  - В Pod `shelf-0` порядковое DNS-имя `shelf-0.shelf` разрешается, а `http://shelf-0.shelf:8080` возвращает `ledger-111`. Создайте описанный в контракте Deployment потребителя с одним готовым Pod и заданным образом. Из контейнера приложения работают ordinal DNS и интерфейс исходного источника; локальный HTTP-интерфейс возвращает объявленный ответ источника. Потребитель не монтирует исходный data claim.

  Проверки наблюдают текущие идентичность, монтирования, DNS и ответы, а не историю запросов или off-host durability.
debrief: Стабильный ordinal связывает discovery с stateful-идентичностью. Исправление listener не создаёт независимого
  потребителя; замена процесса не пересоздаёт сохранённые данные.
stages.0.brief: Сохраните исходные идентичности хранилища и контроллера при замене Pod.
hints.0.text: Идентичность хранилища, готовый процесс и работающий listener — разные наблюдения. Ordinal discovery
  должен работать и из независимого потребителя.
hints.1.text: |-
  Изучите существующую stateful-нагрузку, её governing Service, data claim и конфигурацию resolver. Контракт описывает потребителя, которого нужно создать; изначально его нет.

  ```sh
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl describe pod shelf-0
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```
hints.2.text: |-
  Проверьте сохранённые идентичности и готовность источника, затем A-resolution ordinal-имени, удалённый ответ и локальную публикацию из потребителя.

  ```sh
  fqdn="shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  kubectl exec deployment/inspector -c worker -- nslookup -type=A "$fqdn"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 "http://$fqdn:8080"
  kubectl exec deployment/inspector -c worker -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
phrases.0: Я сохранил claim ordinal при замене.
phrases.1: Я проверил порядковый DNS и HTTP-ответ.
phrases.2: Я разделил хранение и резервное копирование.
questions.0.points.0: Ordinal и связанный claim могут сохраняться.
questions.0.points.1: UID Pod меняется; это не identity данных.
questions.0.prompt: Что сохраняется при замене Pod StatefulSet?
questions.1.points.0: Только если backend хранения обеспечивает нужную надёжность.
questions.1.points.1: Локальный том сам по себе не является копией вне хоста.
questions.1.prompt: Защищает ли PVC от потери диска узла?
stages.0.objectives.0.text: Существующие StatefulSet и claim данных сохраняют идентичность; новый Pod использует
  исходный управляющий Service и только существующий том данных в `/data` своего контейнера приложения.
stages.0.objectives.1.text: StatefulSet `shelf` имеет одну готовую реплику.
stages.0.objectives.2.text: Управляющий Service обеспечивает стабильное обнаружение по ordinal только для предоставленной
  нагрузки shelf, без виртуального IP.
stages.0.objectives.3.text: В Pod `shelf-0` порядковое DNS-имя `shelf-0.shelf` разрешается, а `http://shelf-0.shelf:8080`
  возвращает `ledger-111`. Создайте описанный в контракте Deployment потребителя с одним готовым Pod и заданным
  образом. Из контейнера приложения работают ordinal DNS и интерфейс исходного источника; локальный HTTP-интерфейс
  возвращает объявленный ответ источника. Потребитель не монтирует исходный data claim.
diagnostics.uid_statefulset: StatefulSet могли пересоздать под исходным именем, навсегда изменив UID. Сравните его с зафиксированным исходным UID перед правкой шаблона контроллера. [Причина и проверка](guides#guide=storage-lifecycle&section=q111-shelf-retained-controller)
diagnostics.uid_pvc: Клейм журнала могли пересоздать, либо он недоступен для чтения. Сравните UID ledger-shelf-0 с исходной записью и сохраните существующий клейм при восстановлении. [Причина и проверка](guides#guide=storage-lifecycle&section=q111-shelf-retained-ledger-claim)
diagnostics.uid_pod: У Pod с ordinal мог остаться исходный UID даже после правки шаблона. Дождитесь замены shelf-0 контроллером с сохранением имени и постоянного клейма. [Причина и проверка](guides#guide=storage-lifecycle&section=q111-shelf-ordinal-replacement)
diagnostics.service_name: StatefulSet мог ссылаться на другой управляющий Service. Проверьте, что serviceName остаётся shelf, чтобы разрешалось ожидаемое DNS-имя ordinal. [Причина и проверка](guides#guide=kubernetes-20&section=q111-shelf-governing-service)
diagnostics.mount: У worker могло измениться монтирование, появиться subPath либо режим только для чтения. Проверьте у worker единственное полное монтирование ledger на /data с записью. [Причина и проверка](guides#guide=storage-lifecycle&section=q111-shelf-ledger-mount)
diagnostics.ready: Новый Pod мог ожидать размещения, не смонтировать клейм или не пройти readiness. Проверьте shelf-0 и дождитесь одной готовой реплики StatefulSet. [Причина и проверка](guides#guide=kubernetes-20&section=q111-shelf-ready-replica)
diagnostics.clusterip: Service мог получить виртуальный clusterIP. Сохраните None в shelf, чтобы headless DNS мог возвращать адреса Pod. [Причина и проверка](guides#guide=kubernetes-20&section=q111-shelf-headless-service)
diagnostics.selector: Селектор мог исключить текущий Pod shelf или захватить посторонние Pod. Сравните app=shelf и дополнительные метки селектора с фактическими Pod shelf. [Причина и проверка](guides#guide=kubernetes-20&section=q111-shelf-endpoint-selector)
diagnostics.http: По ordinal-имени мог отвечать сервер на порту 8099 или с другим каталогом. Запросите порт 8080 и сравните фактический ответ журнала с ledger-111. [Причина и проверка](guides#guide=kubernetes-20&section=q111-shelf-ordinal-ledger-response)
diagnostics.dns: DNS-запрос ordinal может не пройти, если headless Service не публикует endpoint Pod. Проверьте полное имя из shelf-0. [Причина и проверка](guides#guide=kubernetes-20&section=q111-shelf-ordinal-dns-from-source)
diagnostics.probe_0_2: Проверка селектора может прерваться до определения поля при ошибке процесса или входов. Проверьте Python и доступ к Service и Pod. [Причина и проверка](guides#guide=kubernetes-20&section=q111-shelf-selector-observer-input)
diagnostics.discovery_consumer: Deployment inspector мог отсутствовать, использовать другой образ или не иметь ровно одного текущего Pod с готовым работающим worker. Проверьте действующий Deployment, его Pod и выданный идентификатор образа. [Причина и проверка](guides#guide=kubernetes-20&section=q111-inspector-current-workload)
diagnostics.discovery_network: Inspector мог смонтировать исходный клейм вместо чтения по сети. Проверьте монтирования обычных и init-контейнеров и уберите использование исходного клейма. [Причина и проверка](guides#guide=kubernetes-20&section=q111-inspector-without-ledger-mount)
diagnostics.discovery_dns: Ordinal-имя может разрешаться в исходном Pod, но не в inspector. Выполните A-запрос из потребителя и проверьте успешное завершение. [Причина и проверка](guides#guide=kubernetes-20&section=q111-inspector-ordinal-dns)
diagnostics.discovery_source: DNS может работать, пока inspector не получает ledger-111 от ordinal HTTP-источника. Выполните запрос из inspector и сравните полученный ответ. [Причина и проверка](guides#guide=kubernetes-20&section=q111-inspector-source-http)
diagnostics.discovery_publication: Потребитель мог получать ответ источника, но не публиковать его локально или отдавать старое содержимое. Запросите loopback внутри inspector и проверьте ledger-111. [Причина и проверка](guides#guide=kubernetes-20&section=q111-inspector-local-publication)
diagnostics.probe_0_3: Проверка ordinal может остановиться без конкретного условия при ошибке процесса, недоступном контракте или исчерпании бюджета. Проверьте инструменты и входы и повторите отдельные наблюдения. [Причина и проверка](guides#guide=kubernetes-20&section=q111-ordinal-observer-input)
