title: Идентичность StatefulSet и headless DNS
brief: "Конечная точка shelf недоступна. Восстановите обслуживание с сохранением идентичности существующего хранилища.\n\
  \nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы: `shelf.json`, `service.json`, `original-statefulset-uid`,\
  \ `original-pvc-uid`, `original-pod-uid`.\n\n**Requirements:**\n\n- Исходные StatefulSet `shelf` и PVC `ledger-shelf-0`\
  \ сохранены; `shelf-0` — заменяющий Pod с управляющим Service `shelf` и только томом `ledger`, смонтированным\
  \ в `/data` контейнера приложения.\n- StatefulSet `shelf` имеет одну готовую реплику.\n- Service `shelf` является\
  \ headless (`None`) и выбирает только Pod с меткой `app=shelf`.\n- В Pod `shelf-0` порядковое DNS-имя `shelf-0.shelf`\
  \ разрешается, а `http://shelf-0.shelf:8080` возвращает `ledger-111`.\n\n**Verify yourself before Check & finish:**\
  \ Выполните эти команды наблюдения из `~/quest` на рабочей станции.\n\n- Настройки, идентичность и состояние соответствуют\
  \ требованиям.\n\n  ```sh\n  kubectl get statefulset shelf -o yaml\n  kubectl get pvc ledger-shelf-0 -o yaml\n\
  \  kubectl get pod shelf-0 -o yaml\n  cat original-statefulset-uid original-pvc-uid original-pod-uid\n  kubectl\
  \ get service shelf -o yaml\n  ```\n\n- `kubectl exec shelf-0 -- nslookup -type=A \"shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.\"\
  ` — Порядковое DNS-имя разрешается внутри `shelf-0`.\n\n- `kubectl exec shelf-0 -- wget -qO- -T 3 http://shelf-0.shelf:8080`\
  \ — Потребитель shelf получает `ledger-111`.\n\nПроверки охватывают идентичность, монтирование и ответ, а не всё\
  \ содержимое журнала или историю правок; локальный учебный том не является внешней резервной копией."
debrief: Проверки наблюдали исходные UID StatefulSet и PVC, новый Pod, порядковый запрос и ответ.
stages.0.brief: Заменяющий Pod shelf должен обслуживать сохранённый PVC.
hints.0.text: У identity Pod и claim разные сроки жизни.
hints.1.text: Headless Service обеспечивает стабильный DNS ordinal.
hints.2.text: Исправьте порт в шаблоне и дождитесь выкатки StatefulSet. Исправьте порт слушателя на `8080` и дождитесь
  замены; StatefulSet и PVC сохраняют идентичность, а Pod меняется.
phrases.0: Я сохранил claim ordinal при замене.
phrases.1: Я проверил порядковый DNS и HTTP-ответ.
phrases.2: Я разделил хранение и резервное копирование.
questions.0.points.0: Ordinal и связанный claim могут сохраняться.
questions.0.points.1: UID Pod меняется; это не identity данных.
questions.0.prompt: Что сохраняется при замене Pod StatefulSet?
questions.1.points.0: Только если backend хранения обеспечивает нужную надёжность.
questions.1.points.1: Локальный том сам по себе не является копией вне хоста.
questions.1.prompt: Защищает ли PVC от потери диска узла?
diagnostics.uid_statefulset: statefulset/shelf UID должен совпадать с original-statefulset-uid.
diagnostics.uid_pvc: pvc/ledger-shelf-0 UID должен совпадать с original-pvc-uid.
diagnostics.uid_pod: pod/shelf-0 UID должен отличаться от original-pod-uid.
diagnostics.service_name: statefulset/shelf serviceName должен совпадать с shelf.
diagnostics.ready: statefulset/shelf readyReplicas должен совпадать с 1.
diagnostics.mount: 'statefulset/shelf volumeMounts должен совпадать с [{name: ledger, mountPath: /data}].'
diagnostics.clusterip: service/shelf clusterIP должен совпадать с None.
diagnostics.selector: 'service/shelf selector должен совпадать с app: shelf.'
diagnostics.http: shelf-0.shelf:8080 должен совпадать с ledger-111.
diagnostics.dns: nslookup shelf-0.shelf должен выполняться успешно.
stages.0.objectives.0.text: Исходные StatefulSet `shelf` и PVC `ledger-shelf-0` сохранены; `shelf-0` — заменяющий
  Pod с управляющим Service `shelf` и только томом `ledger`, смонтированным в `/data` контейнера приложения.
stages.0.objectives.1.text: StatefulSet `shelf` имеет одну готовую реплику.
stages.0.objectives.2.text: Service `shelf` является headless (`None`) и выбирает только Pod с меткой `app=shelf`.
stages.0.objectives.3.text: В Pod `shelf-0` порядковое DNS-имя `shelf-0.shelf` разрешается, а `http://shelf-0.shelf:8080`
  возвращает `ledger-111`.
