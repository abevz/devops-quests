title: Entradas y salidas del módulo local
brief: 'Trabaja en `~/quest` con los archivos suministrados `main.tf` y `modules/notice/README.md`. La configuración raíz
  ya tiene un recurso de aviso; esta bahía funciona sin internet. La guía de módulos locales enlazada en las pistas explica
  entradas, salidas y direcciones de estado.


  Crea `modules/notice` con una entrada `station`, una salida `message` y un recurso `local_file` llamado `notice`. Debe escribir
  `<station>.txt` con el contenido `<station>-ready`. En el módulo hijo declara la misma fuente de proveedor que en la raíz:
  `registry.terraform.io/hashicorp/local`; el espejo local no ofrece la dirección predeterminada del registro OpenTofu. Invócalo
  desde la raíz como `module.notice` con `station = "north"` y expón su mensaje como salida raíz `message`. El antiguo archivo
  raíz `notice.txt` puede eliminarse; es una sustitución, no un movimiento de estado.


  Inicializa y aplica. Comprueba que `tofu state list` contiene `module.notice.local_file.notice`, que `north.txt` y `tofu
  output -raw message` contienen `north-ready`, y que `tofu plan -input=false -detailed-exitcode -no-color` termina con código
  0 (sin cambios). Mantén todo el trabajo dentro de la bahía.'
stages.0.brief: Crea el módulo local y su llamada desde la raíz; después verifica la dirección de estado, el archivo, la salida
  raíz y un plan sin cambios según el enunciado.
stages.0.objectives.0.text: La dirección de estado, el archivo y la salida raíz requeridos coinciden, y el plan termina con
  código 0.
hints.0.text: Un módulo secundario necesita inputs y outputs explícitos.
hints.1.text: Coloque el recurso de aviso en modules/notice; pase station desde la raíz.
hints.2.text: Llámelo module.notice, exporte message en ambos límites y verifique el estado más un plan vacío.
debrief: La dirección de estado del módulo, el archivo de aviso, la salida raíz y el plan sin cambios coinciden ahora con
  las comprobaciones.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener module.notice.local_file.notice.
diagnostics.condition_1: north.txt debe ser igual a north-ready.
diagnostics.condition_2: tofu output -raw message debe ser igual a north-ready.
diagnostics.condition_3: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
