title: Entradas y salidas del módulo local
brief: "Los consumidores no pueden obtener el aviso solicitado.\n\nTrabaja en la workstation en `~/quest` con\
  \ `main.tf`, `modules/notice/README.md`.\n\n**Requisitos:**\n- Estado de OpenTofu:\n  - Direcciones requeridas:\
  \ `module.notice.local_file.notice`.\n- Archivos en la workstation:\n  - `~/quest/north.txt`: `north-ready`.\n\
  - Salidas raíz:\n  - `message`: `north-ready`.\n- Convergencia de infraestructura:\n  - Sin cambios de infraestructura\
  \ pendientes; código de salida del plan detallado `0`.\n"
stages.0.brief: Cumple el contrato de resultado del aviso en la workstation.
hints.0.text: Un módulo secundario necesita inputs y outputs explícitos.
hints.1.text: |-
  Empieza por `main.tf` y `modules/notice/README.md`. En el módulo raíz, apunta la llamada a `./modules/notice` y pasa `station`.

  ```sh
  cat main.tf modules/notice/README.md
  tofu providers
  ```

  ```hcl
  module "notice" {
    source = "./modules/notice"
    station = "north"
  }
  ```

  Define el recurso del aviso en el módulo hijo y expón `message` en ambos niveles. En el hijo, declara `registry.terraform.io/hashicorp/local`, igual que en el módulo raíz, para usar el mirror local. Inicializa y aplica la configuración. Al reemplazar el recurso puede eliminarse el antiguo archivo `notice.txt` del directorio raíz.
hints.2.text: |-
  Después de aplicar, comprueba la dirección del estado, el archivo, la salida raíz y el plan.

  - `tofu show -no-color` — Incluye el recurso registrado `module.notice.local_file.notice`.

  - `cat north.txt; tofu output -raw message` — Ambos consumidores muestran `north-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura pendientes.
debrief: La dirección de estado del módulo, el archivo de aviso, la salida raíz y el plan sin cambios coinciden
  ahora con las comprobaciones.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
stages.0.objectives.0.text: El estado de OpenTofu incluye `module.notice.local_file.notice`.
stages.0.objectives.1.text: En la workstation, `north.txt` contiene `north-ready`.
stages.0.objectives.2.text: La salida raíz `message` tiene el valor `north-ready`.
stages.0.objectives.3.text: El estado de OpenTofu incluye `module.notice.local_file.notice` y no hay cambios de infraestructura
  pendientes.
diagnostics.condition_0: |-
  La dirección puede faltar si aún no se ha aplicado la llamada del módulo raíz o si el recurso hijo tiene otro nombre. [Guía](guides#guide=terraform-7.1&section=notice-module)
diagnostics.condition_1: |-
  La entrada `station` determina el nombre y el contenido del archivo. Otro valor o una edición manual pueden cambiar el resultado. [Guía](guides#guide=terraform-7.1&section=station-notice)
diagnostics.condition_2: |-
  La salida raíz puede faltar o estar obsoleta si el módulo raíz no exporta la salida hija o si aún no se ha aplicado el cambio. [Guía](guides#guide=terraform-7.1&section=notice-output)
diagnostics.condition_3: |-
  El plan puede proponer cambios si falta la dirección del módulo en el estado o si el archivo gestionado difiere de la configuración. [Guía](guides#guide=terraform-7.1&section=notice-module-plan)
