title: Entradas y salidas del módulo local
brief: 'Te uniste a las operaciones de SignalRail. Mueva el station notice a un módulo local. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`, `modules/notice/README.md`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: El módulo notice gestiona north.txt y exporta su message.'
stages.0.brief: 'Cree modules/notice con entrada station y salida message. Llámelo module.notice para
  north.


  Criterios de éxito: El módulo notice gestiona north.txt y exporta su message.'
stages.0.objectives.0.text: El módulo notice gestiona north.txt y exporta su message.
hints.0.text: Un módulo secundario necesita inputs y outputs explícitos.
hints.1.text: Coloque el recurso de aviso en modules/notice; pase station desde la raíz.
hints.2.text: Llámelo module.notice, exporte message en ambos límites y verifique el estado más un plan
  vacío.
debrief: El aviso comenzó como un recurso raíz. Movió su definición a un módulo local, pasó station, exportó
  message y verificó el estado y un plan vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
