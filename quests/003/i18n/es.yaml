title: Entradas y salidas del módulo local
brief: "Los consumidores no pueden obtener el aviso solicitado.\n\nTrabaja en la workstation en `~/quest` con\
  \ `main.tf`, `modules/notice/README.md`.\n\n**Requisitos:**\n- Estado de OpenTofu:\n  - Direcciones requeridas:\
  \ `module.notice.local_file.notice`.\n- Archivos en la workstation:\n  - `~/quest/north.txt`: `north-ready`.\n\
  - Salidas raíz:\n  - `message`: `north-ready`.\n- Convergencia de infraestructura:\n  - Sin cambios de infraestructura\
  \ pendientes; código de salida del plan detallado `0`.\n"
stages.0.brief: Cumple el contrato de resultado del aviso en la workstation.
hints.0.text: Un módulo secundario necesita inputs y outputs explícitos.
hints.1.text: 'Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf modules/notice/README.md

  tofu providers

  ```'
hints.2.text: 'Coloca el recurso de aviso en modules/notice y pasa station desde la raíz. La fuente del proveedor
  hijo debe coincidir con la raíz: registry.terraform.io/hashicorp/local; el espejo sin conexión carece de
  la dirección predeterminada del registro OpenTofu.


  Invoca module.notice con station igual a north y exporta message en ambos límites. Inicializa y aplica; es
  un reemplazo, no un traslado del estado, y se puede eliminar el antiguo notice.txt raíz.


  Verifica el resultado observado:


  - `tofu show -no-color` — Incluye el recurso registrado `module.notice.local_file.notice`.


  - `cat north.txt; tofu output -raw message` — Ambos consumidores muestran `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura
  pendientes.'
debrief: La dirección de estado del módulo, el archivo de aviso, la salida raíz y el plan sin cambios coinciden
  ahora con las comprobaciones.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener module.notice.local_file.notice.
diagnostics.condition_1: north.txt debe ser igual a north-ready.
diagnostics.condition_2: tofu output -raw message debe ser igual a north-ready.
diagnostics.condition_3: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: El estado de OpenTofu incluye `module.notice.local_file.notice`.
stages.0.objectives.1.text: En la workstation, `north.txt` contiene `north-ready`.
stages.0.objectives.2.text: La salida raíz `message` tiene el valor `north-ready`.
stages.0.objectives.3.text: OpenTofu no informa cambios de infraestructura pendientes.
