title: Local module inputs and outputs
brief: 'Work in `~/quest`, using the supplied `main.tf` and `modules/notice/README.md`. The root already has a notice resource;
  this bay is offline. Read the local module guide linked in the hints for inputs, outputs and state addresses.


  Create `modules/notice` with an input `station`, an output `message`, and a `local_file` resource named `notice`. It should
  write `<station>.txt` containing `<station>-ready`. In the child module declare the same provider source as the root: `registry.terraform.io/hashicorp/local`;
  the offline mirror does not provide the default OpenTofu registry address. Call it from the root as `module.notice` with
  `station = "north"` and export its message as the root output `message`. The old root `notice.txt` may be removed; this
  is a replacement, not a state move.


  Initialize and apply. Verify that `tofu state list` contains `module.notice.local_file.notice`, `north.txt` and `tofu output
  -raw message` both contain `north-ready`, and `tofu plan -input=false -detailed-exitcode -no-color` exits 0 (no changes).
  Keep all work inside the bay.'
stages.0.brief: Create the local module and root call, then verify the state address, file, root output and a no-change plan
  as described in the brief.
stages.0.objectives.0.text: The required state address, file and root output match, and the plan exits 0.
hints.0.text: A child module needs explicit inputs and outputs.
hints.1.text: Put the notice resource in modules/notice; pass station from the root.
hints.2.text: Call it as module.notice, export message at both boundaries and check state plus an empty plan.
debrief: The module state address, notice file, root output and no-change plan now match the checks.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: tofu state list must contain module.notice.local_file.notice.
diagnostics.condition_1: north.txt must equal north-ready.
diagnostics.condition_2: tofu output -raw message must equal north-ready.
diagnostics.condition_3: The OpenTofu detailed plan must exit with code 0.
