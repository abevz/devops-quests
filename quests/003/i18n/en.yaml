title: Local module inputs and outputs
brief: "Consumers cannot obtain the requested notice.\n\nWork on the workstation in `~/quest` with `main.tf`,\
  \ `modules/notice/README.md`.\n\n**Requirements:**\n- OpenTofu state:\n  - Required addresses: `module.notice.local_file.notice`.\n\
  - Files on the workstation:\n  - `~/quest/north.txt`: `north-ready`.\n- Root outputs:\n  - `message`: `north-ready`.\n\
  - Infrastructure convergence:\n  - No pending infrastructure changes; detailed-plan exit code `0`.\n"
stages.0.brief: Meet the notice result contract on the workstation.
hints.0.text: A child module needs explicit inputs and outputs.
hints.1.text: 'Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf modules/notice/README.md

  tofu providers

  ```'
hints.2.text: 'Put the notice resource in modules/notice and pass station from the root. The child provider
  source must match the root: registry.terraform.io/hashicorp/local; the offline mirror lacks the default OpenTofu
  registry address.


  Call module.notice with station set to north and export message at both boundaries. Initialize and apply;
  this is a replacement, not a state move, and the old root notice.txt may be removed.


  Verify the observed result:


  - `tofu show -no-color` — Includes tracked resource `module.notice.local_file.notice`.


  - `cat north.txt; tofu output -raw message` — Both consumers show `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure
  changes.'
debrief: The module state address, notice file, root output and no-change plan now match the checks.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
stages.0.objectives.0.text: OpenTofu state includes `module.notice.local_file.notice`.
stages.0.objectives.1.text: On the workstation, `north.txt` contains `north-ready`.
stages.0.objectives.2.text: Root output `message` has value `north-ready`.
stages.0.objectives.3.text: OpenTofu state includes `module.notice.local_file.notice` and there are no pending infrastructure
  changes.
diagnostics.condition_0: |-
  The address can be missing if the root module call has not been applied or the child resource has a different name. [Guide](guides#guide=terraform-7.1&section=notice-module)
diagnostics.condition_1: |-
  The `station` input controls the filename and notice. A different input or a change to the file can leave the wrong content. [Guide](guides#guide=terraform-7.1&section=station-notice)
diagnostics.condition_2: |-
  The root output can be missing or stale if the child output is not exported from the root or the change has not been applied. [Guide](guides#guide=terraform-7.1&section=notice-output)
diagnostics.condition_3: |-
  The plan can propose changes when the module address is absent or the managed file differs from the configuration. [Guide](guides#guide=terraform-7.1&section=notice-module-plan)
