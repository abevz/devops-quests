title: Local module inputs and outputs
brief: 'You joined SignalRail operations. Move the station notice into a local module. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`, `modules/notice/README.md`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Module notice manages north.txt and exports its message.'
stages.0.brief: 'Create modules/notice with station input and message output. Call it as module.notice
  for north.


  Success criteria: Module notice manages north.txt and exports its message.'
stages.0.objectives.0.text: Module notice manages north.txt and exports its message.
hints.0.text: A child module needs explicit inputs and outputs.
hints.1.text: Put the notice resource in modules/notice; pass station from the root.
hints.2.text: Call it as module.notice, export message at both boundaries and check state plus an empty
  plan.
debrief: The notice started as a root resource. You moved its definition into a local module, passed station,
  exported message, and checked state and an empty plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
