title: Local module inputs and outputs
brief: |
  Consumers cannot obtain the requested notice.

  Work on the workstation in `~/quest` with `main.tf`, `modules/notice/README.md`.

  **Requirements:**
  - OpenTofu state:
    - Required addresses: `module.notice.local_file.notice`.
  - Files on the workstation:
    - `~/quest/north.txt`: `north-ready`.
  - Root outputs:
    - `message`: `north-ready`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  **Verify yourself before Check & finish:**
  - `tofu show -no-color` — Includes tracked resource `module.notice.local_file.notice`.
  - `cat north.txt; tofu output -raw message` — Both consumers show `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure changes.
stages.0.brief: Meet the notice result contract on the workstation.
hints.0.text: A child module needs explicit inputs and outputs.
hints.1.text: 'Put the notice resource in modules/notice and pass station from the root. The child provider source
  must match the root: registry.terraform.io/hashicorp/local; the offline mirror lacks the default OpenTofu registry
  address.'
hints.2.text: Call module.notice with station set to north and export message at both boundaries. Initialize and
  apply; this is a replacement, not a state move, and the old root notice.txt may be removed.
debrief: The module state address, notice file, root output and no-change plan now match the checks.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: tofu state list must contain module.notice.local_file.notice.
diagnostics.condition_1: north.txt must equal north-ready.
diagnostics.condition_2: tofu output -raw message must equal north-ready.
diagnostics.condition_3: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: OpenTofu state includes `module.notice.local_file.notice`.
stages.0.objectives.1.text: On the workstation, `north.txt` contains `north-ready`.
stages.0.objectives.2.text: Root output `message` has value `north-ready`.
stages.0.objectives.3.text: OpenTofu reports no pending infrastructure changes.
