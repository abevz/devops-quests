title: Входы и выходы локального модуля
brief: "Потребители не могут получить требуемое уведомление.\n\nРаботайте на workstation в `~/quest` с файлами\
  \ `main.tf`, `modules/notice/README.md`.\n\n**Требования:**\n- Состояние OpenTofu:\n  - Требуемые адреса:\
  \ `module.notice.local_file.notice`.\n- Файлы на workstation:\n  - `~/quest/north.txt`: `north-ready`.\n\
  - Корневые выводы:\n  - `message`: `north-ready`.\n- Согласованность инфраструктуры:\n  - Нет ожидающих изменений\
  \ инфраструктуры; код завершения подробного плана `0`.\n"
stages.0.brief: Обеспечьте требуемый результат уведомления на workstation.
hints.0.text: Дочернему модулю нужны явные inputs и outputs.
hints.1.text: 'Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf modules/notice/README.md

  tofu providers

  ```'
hints.2.text: 'Поместите ресурс уведомления в modules/notice и передайте station из корня. Источник провайдера
  в дочернем модуле должен совпадать с корнем: registry.terraform.io/hashicorp/local; в офлайн-зеркале нет
  адреса реестра OpenTofu по умолчанию.


  Вызовите module.notice со station равным north и экспортируйте message на обеих границах. Выполните инициализацию
  и apply; это замена, а не перенос состояния, старый корневой notice.txt можно удалить.


  Проверьте наблюдаемый результат:


  - `tofu show -no-color` — Содержит отслеживаемый ресурс `module.notice.local_file.notice`.


  - `cat north.txt; tofu output -raw message` — Оба потребителя показывают `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих
  изменениях инфраструктуры.'
debrief: Адрес состояния модуля, файл объявления, корневой выход и план без изменений теперь соответствуют
  проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать module.notice.local_file.notice.
diagnostics.condition_1: north.txt должен совпадать с north-ready.
diagnostics.condition_2: tofu output -raw message должен совпадать с north-ready.
diagnostics.condition_3: Требуемый адрес модуля module.notice.local_file.notice должен присутствовать в состоянии, а подробный
  план OpenTofu — завершаться с кодом 0.
stages.0.objectives.0.text: Состояние OpenTofu содержит `module.notice.local_file.notice`.
stages.0.objectives.1.text: На workstation `north.txt` содержит `north-ready`.
stages.0.objectives.2.text: Корневой вывод `message` имеет значение `north-ready`.
stages.0.objectives.3.text: Состояние OpenTofu содержит `module.notice.local_file.notice`, и ожидающих изменений инфраструктуры
  нет.
