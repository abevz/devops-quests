title: Входы и выходы локального модуля
brief: 'Работайте в `~/quest` с выданными файлами `main.tf` и `modules/notice/README.md`. В корневой конфигурации уже есть ресурс объявления; песочница работает без интернета. Руководство по локальным модулям в подсказках объясняет входы, выходы и адреса состояния.


  Создайте `modules/notice` со входом `station`, выходом `message` и ресурсом `local_file` с именем `notice`. Он должен записывать `<station>.txt` с содержимым `<station>-ready`. В дочернем модуле укажите тот же источник провайдера, что и в корне: `registry.terraform.io/hashicorp/local`; в локальном зеркале нет стандартного адреса реестра OpenTofu. Вызовите модуль из корня как `module.notice` с `station = "north"` и экспортируйте его сообщение в корневой выход `message`. Старый корневой файл `notice.txt` можно удалить; это замена, а не перенос состояния.


  Инициализируйте и примените конфигурацию. Проверьте, что `tofu state list` содержит `module.notice.local_file.notice`, файл `north.txt` и `tofu output -raw message` содержат `north-ready`, а `tofu plan -input=false -detailed-exitcode -no-color` завершается с кодом 0 (изменений нет). Все действия выполняйте только в песочнице.'
stages.0.brief: Создайте локальный модуль и его вызов из корня, затем проверьте адрес состояния, файл, корневой выход и план без изменений, как описано в задании.
stages.0.objectives.0.text: Требуемые адрес состояния, файл и корневой выход совпадают, а план завершается с кодом 0.
hints.0.text: Дочернему модулю нужны явные inputs и outputs.
hints.1.text: Поместите ресурс в modules/notice и передайте station из корня.
hints.2.text: Вызовите module.notice, объявите message на обеих границах и проверьте state и пустой plan.
debrief: Адрес состояния модуля, файл объявления, корневой выход и план без изменений теперь соответствуют проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
