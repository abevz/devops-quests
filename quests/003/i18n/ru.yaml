title: Входы и выходы локального модуля
brief: "Потребители не могут получить требуемое уведомление.\n\nРаботайте на workstation в `~/quest` с файлами\
  \ `main.tf`, `modules/notice/README.md`.\n\n**Требования:**\n- Состояние OpenTofu:\n  - Требуемые адреса:\
  \ `module.notice.local_file.notice`.\n- Файлы на workstation:\n  - `~/quest/north.txt`: `north-ready`.\n\
  - Корневые выводы:\n  - `message`: `north-ready`.\n- Согласованность инфраструктуры:\n  - Нет ожидающих изменений\
  \ инфраструктуры; код завершения подробного плана `0`.\n"
stages.0.brief: Обеспечьте требуемый результат уведомления на workstation.
hints.0.text: Дочернему модулю нужны явные inputs и outputs.
hints.1.text: |-
  Начните с `main.tf` и `modules/notice/README.md`. В корневом модуле укажите путь `./modules/notice` и передайте `station`.

  ```sh
  cat main.tf modules/notice/README.md
  tofu providers
  ```

  ```hcl
  module "notice" {
    source = "./modules/notice"
    station = "north"
  }
  ```

  Объявите ресурс уведомления в дочернем модуле и выведите `message` на обоих уровнях. В дочернем модуле укажите `registry.terraform.io/hashicorp/local`, как в корневом, чтобы сработало локальное зеркало. Инициализируйте и примените конфигурацию. При замене ресурса прежний корневой файл `notice.txt` может быть удалён.
hints.2.text: |-
  После применения проверьте адрес в состоянии, содержимое файла, корневой выход и план.

  - `tofu show -no-color` — Содержит отслеживаемый ресурс `module.notice.local_file.notice`.

  - `cat north.txt; tofu output -raw message` — Оба потребителя показывают `north-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.
debrief: Адрес состояния модуля, файл объявления, корневой выход и план без изменений теперь соответствуют
  проверкам.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
stages.0.objectives.0.text: Состояние OpenTofu содержит `module.notice.local_file.notice`.
stages.0.objectives.1.text: На workstation `north.txt` содержит `north-ready`.
stages.0.objectives.2.text: Корневой вывод `message` имеет значение `north-ready`.
stages.0.objectives.3.text: Состояние OpenTofu содержит `module.notice.local_file.notice`, и ожидающих изменений инфраструктуры
  нет.
diagnostics.condition_0: |-
  Адрес может отсутствовать, если вызов модуля ещё не применили или ресурс в дочернем модуле назван иначе. [Гайд](guides#guide=terraform-7.1&section=notice-module)
diagnostics.condition_1: |-
  Входное значение `station` задаёт имя и содержимое файла. Другое значение или ручная правка файла могут изменить результат. [Гайд](guides#guide=terraform-7.1&section=station-notice)
diagnostics.condition_2: |-
  Вывод может отсутствовать или содержать старое значение, если корень не экспортирует вывод дочернего модуля или изменение ещё не применили. [Гайд](guides#guide=terraform-7.1&section=notice-output)
diagnostics.condition_3: |-
  План может предлагать изменения, когда адрес модуля отсутствует в состоянии или файл расходится с конфигурацией. [Гайд](guides#guide=terraform-7.1&section=notice-module-plan)
