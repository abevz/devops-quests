title: Входы и выходы локального модуля
brief: 'Вы в команде эксплуатации SignalRail. Вынесите объявление станции в локальный модуль. Работайте
  в ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`, `modules/notice/README.md`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Модуль notice управляет north.txt и возвращает message.'
stages.0.brief: 'Создайте modules/notice: вход station, выход message. Вызовите module.notice для north.


  Результат проверки: Модуль notice управляет north.txt и возвращает message.'
stages.0.objectives.0.text: Модуль notice управляет north.txt и возвращает message.
hints.0.text: Дочернему модулю нужны явные inputs и outputs.
hints.1.text: Поместите ресурс в modules/notice и передайте station из корня.
hints.2.text: Вызовите module.notice, объявите message на обеих границах и проверьте state и пустой plan.
debrief: Объявление было корневым ресурсом. Вы вынесли его в локальный модуль, передали station, вернули
  message и проверили state и пустой plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
