title: Wejścia i wyjścia modułu lokalnego
brief: 'Pracuj w `~/quest`, korzystając z plików `main.tf` i `modules/notice/README.md`. Konfiguracja główna zawiera już zasób
  powiadomienia; ta zatoka działa bez internetu. Przewodnik po modułach lokalnych połączony z podpowiedziami wyjaśnia wejścia,
  wyjścia i adresy stanu.


  Utwórz `modules/notice` z wejściem `station`, wyjściem `message` i zasobem `local_file` o nazwie `notice`. Ma on zapisywać
  `<station>.txt` o treści `<station>-ready`. W module podrzędnym zadeklaruj to samo źródło dostawcy co w konfiguracji głównej:
  `registry.terraform.io/hashicorp/local`; lokalne repozytorium nie zawiera domyślnego adresu rejestru OpenTofu. Wywołaj moduł
  w konfiguracji głównej jako `module.notice` z `station = "north"` i udostępnij jego wiadomość jako główne wyjście `message`.
  Stary główny plik `notice.txt` można usunąć; to zastąpienie, a nie przeniesienie stanu.


  Zainicjuj i zastosuj konfigurację. Sprawdź, czy `tofu state list` zawiera `module.notice.local_file.notice`, czy `north.txt`
  i `tofu output -raw message` zawierają `north-ready` oraz czy `tofu plan -input=false -detailed-exitcode -no-color` kończy
  się kodem 0 (brak zmian). Pracuj tylko w tej zatoce.'
stages.0.brief: Utwórz moduł lokalny i jego wywołanie w konfiguracji głównej, a następnie sprawdź adres stanu, plik, główne
  wyjście i plan bez zmian zgodnie z opisem.
stages.0.objectives.0.text: Wymagany adres stanu, plik i główne wyjście są poprawne, a plan kończy się kodem 0.
hints.0.text: Moduł podrzędny wymaga jawnych inputs i outputs.
hints.1.text: Umieść zasób powiadomienia w modules/notice; przekaż station z katalogu głównego.
hints.2.text: Nazwij to jako module.notice, wyeksportuj message na obu granicach i sprawdź state plus pusty plan.
debrief: Adres stanu modułu, plik powiadomienia, główne wyjście i plan bez zmian odpowiadają teraz kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać module.notice.local_file.notice.
diagnostics.condition_1: north.txt musi być równe north-ready.
diagnostics.condition_2: tofu output -raw message musi być równe north-ready.
diagnostics.condition_3: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
