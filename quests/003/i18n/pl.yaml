title: Wejścia i wyjścia modułu lokalnego
brief: 'Dołączyłeś do operacji SignalRail. Przenieś station notice do modułu lokalnego. Pracuj w ~/quest..
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`, `modules/notice/README.md`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Moduł notice zarządza north.txt i eksportuje swój message.'
stages.0.brief: 'Utwórz moduły/powiadomienia z wejściem station i wyjściem message. Nazwij to module.notice
  dla north.


  Kryteria sukcesu: Moduł notice zarządza north.txt i eksportuje swój message.'
stages.0.objectives.0.text: Moduł notice zarządza north.txt i eksportuje message.
hints.0.text: Moduł podrzędny wymaga jawnych inputs i outputs.
hints.1.text: Umieść zasób powiadomienia w modules/notice; przekaż station z katalogu głównego.
hints.2.text: Nazwij to jako module.notice, wyeksportuj message na obu granicach i sprawdź state plus
  pusty plan.
debrief: Powiadomienie zostało uruchomione jako zasób główny. Przeniosłeś jego definicję do modułu lokalnego,
  przekazałeś station, wyeksportowałeś message i sprawdziłeś state i puste plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
