title: Wejścia i wyjścia modułu lokalnego
brief: "Odbiorcy nie mogą uzyskać wymaganego powiadomienia.\n\nPracuj na workstation w `~/quest` z plikami\
  \ `main.tf`, `modules/notice/README.md`.\n\n**Wymagania:**\n- Stan OpenTofu:\n  - Wymagane adresy: `module.notice.local_file.notice`.\n\
  - Pliki na workstation:\n  - `~/quest/north.txt`: `north-ready`.\n- Wyjścia główne:\n  - `message`: `north-ready`.\n\
  - Zbieżność infrastruktury:\n  - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu\
  \ `0`.\n"
stages.0.brief: Spełnij kontrakt wyniku powiadomienia na workstation.
hints.0.text: Moduł podrzędny wymaga jawnych inputs i outputs.
hints.1.text: 'Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf modules/notice/README.md

  tofu providers

  ```'
hints.2.text: 'Umieść zasób powiadomienia w modules/notice i przekaż station z poziomu głównego. Źródło dostawcy
  modułu potomnego musi odpowiadać głównemu: registry.terraform.io/hashicorp/local; lustro offline nie ma domyślnego
  adresu rejestru OpenTofu.


  Wywołaj module.notice ze station równym north i eksportuj message na obu granicach. Zainicjalizuj i zastosuj;
  to zastąpienie, a nie przeniesienie stanu, a stary główny notice.txt można usunąć.


  Sprawdź obserwowany wynik:


  - `tofu show -no-color` — Zawiera śledzony zasób `module.notice.local_file.notice`.


  - `cat north.txt; tofu output -raw message` — Obaj odbiorcy pokazują `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących
  zmian infrastruktury.'
debrief: Adres stanu modułu, plik powiadomienia, główne wyjście i plan bez zmian odpowiadają teraz kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać module.notice.local_file.notice.
diagnostics.condition_1: north.txt musi być równe north-ready.
diagnostics.condition_2: tofu output -raw message musi być równe north-ready.
diagnostics.condition_3: Wymagany adres modułu module.notice.local_file.notice musi być zapisany w stanie, a szczegółowy plan
  OpenTofu musi zakończyć się kodem 0.
stages.0.objectives.0.text: Stan OpenTofu zawiera `module.notice.local_file.notice`.
stages.0.objectives.1.text: Na workstation `north.txt` zawiera `north-ready`.
stages.0.objectives.2.text: Wyjście główne `message` ma wartość `north-ready`.
stages.0.objectives.3.text: Stan OpenTofu zawiera `module.notice.local_file.notice` i nie ma oczekujących zmian infrastruktury.
