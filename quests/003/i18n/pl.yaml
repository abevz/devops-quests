title: Wejścia i wyjścia modułu lokalnego
brief: "Odbiorcy nie mogą uzyskać wymaganego powiadomienia.\n\nPracuj na workstation w `~/quest` z plikami\
  \ `main.tf`, `modules/notice/README.md`.\n\n**Wymagania:**\n- Stan OpenTofu:\n  - Wymagane adresy: `module.notice.local_file.notice`.\n\
  - Pliki na workstation:\n  - `~/quest/north.txt`: `north-ready`.\n- Wyjścia główne:\n  - `message`: `north-ready`.\n\
  - Zbieżność infrastruktury:\n  - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu\
  \ `0`.\n"
stages.0.brief: Spełnij kontrakt wyniku powiadomienia na workstation.
hints.0.text: Moduł podrzędny wymaga jawnych inputs i outputs.
hints.1.text: |-
  Zacznij od `main.tf` i `modules/notice/README.md`. W module głównym wskaż `./modules/notice` i przekaż `station`.

  ```sh
  cat main.tf modules/notice/README.md
  tofu providers
  ```

  ```hcl
  module "notice" {
    source = "./modules/notice"
    station = "north"
  }
  ```

  Zdefiniuj zasób powiadomienia w module podrzędnym i udostępnij `message` na obu poziomach. W module podrzędnym zadeklaruj `registry.terraform.io/hashicorp/local`, tak jak w głównym, aby użyć lokalnego mirrora. Zainicjuj i zastosuj konfigurację. Podczas zastępowania zasobu stary plik `notice.txt` w katalogu głównym może zostać usunięty.
hints.2.text: |-
  Po zastosowaniu konfiguracji sprawdź adres w stanie, plik, wyjście modułu głównego i plan.

  - `tofu show -no-color` — Zawiera śledzony zasób `module.notice.local_file.notice`.

  - `cat north.txt; tofu output -raw message` — Obaj odbiorcy pokazują `north-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących zmian infrastruktury.
debrief: Adres stanu modułu, plik powiadomienia, główne wyjście i plan bez zmian odpowiadają teraz kontrolom.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
stages.0.objectives.0.text: Stan OpenTofu zawiera `module.notice.local_file.notice`.
stages.0.objectives.1.text: Na workstation `north.txt` zawiera `north-ready`.
stages.0.objectives.2.text: Wyjście główne `message` ma wartość `north-ready`.
stages.0.objectives.3.text: Stan OpenTofu zawiera `module.notice.local_file.notice` i nie ma oczekujących zmian infrastruktury.
diagnostics.condition_0: |-
  Adres może być nieobecny, gdy wywołanie modułu głównego nie zostało zastosowane lub zasób potomny ma inną nazwę. [Przewodnik](guides#guide=terraform-7.1&section=notice-module)
diagnostics.condition_1: |-
  Wartość wejściowa `station` określa nazwę i treść pliku. Inna wartość lub ręczna edycja mogą zmienić wynik. [Przewodnik](guides#guide=terraform-7.1&section=station-notice)
diagnostics.condition_2: |-
  Wynik może być nieobecny lub nieaktualny, gdy moduł główny nie eksportuje wyniku modułu potomnego lub zmiana nie została zastosowana. [Przewodnik](guides#guide=terraform-7.1&section=notice-output)
diagnostics.condition_3: |-
  Plan może proponować zmiany, gdy w stanie brakuje adresu modułu albo zarządzany plik różni się od konfiguracji. [Przewodnik](guides#guide=terraform-7.1&section=notice-module-plan)
