title: Ein- und Ausgänge des lokalen Moduls
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Verschieben Sie den station notice in ein lokales
  Modul. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingaben in `~/quest`: `main.tf`, `modules/notice/README.md`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Modul notice verwaltet north.txt und exportiert dessen message.'
stages.0.brief: 'Erstellen Sie modules/notice mit der Eingabe station und der Ausgabe message. Nennen
  Sie es module.notice für north.


  Erfolgskriterium: Das Modul notice verwaltet north.txt und exportiert sein message.'
stages.0.objectives.0.text: Das Modul notice verwaltet north.txt und exportiert sein message.
hints.0.text: Ein untergeordnetes Modul benötigt explizite inputs und outputs.
hints.1.text: Platzieren Sie die Hinweisressource in modules/notice; Übergeben Sie station von der Wurzel.
hints.2.text: Nennen Sie es module.notice, exportieren Sie message an beiden Grenzen und überprüfen Sie
  den Status sowie ein leeres plan.
debrief: Der Hinweis wurde als Root-Ressource gestartet. Sie haben seine Definition in ein lokales Modul
  verschoben, station übergeben, message exportiert und den Status sowie einen leeren plan überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
