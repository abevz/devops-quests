title: Ein- und Ausgänge des lokalen Moduls
brief: "Verbraucher können die angeforderte Nachricht nicht abrufen.\n\nArbeite auf der Workstation in `~/quest`\
  \ mit `main.tf`, `modules/notice/README.md`.\n\n**Anforderungen:**\n- OpenTofu-State:\n  - Erforderliche\
  \ Adressen: `module.notice.local_file.notice`.\n- Dateien auf der Workstation:\n  - `~/quest/north.txt`:\
  \ `north-ready`.\n- Root-Ausgaben:\n  - `message`: `north-ready`.\n- Infrastrukturkonvergenz:\n  - Keine\
  \ ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.\n"
stages.0.brief: Erfülle den Ergebnisvertrag der Nachricht auf der Workstation.
hints.0.text: Ein untergeordnetes Modul benötigt explizite inputs und outputs.
hints.1.text: |-
  Beginne mit `main.tf` und `modules/notice/README.md`. Verweise im Root-Modul auf `./modules/notice` und übergib `station`.

  ```sh
  cat main.tf modules/notice/README.md
  tofu providers
  ```

  ```hcl
  module "notice" {
    source = "./modules/notice"
    station = "north"
  }
  ```

  Definiere die Ressource für die Meldung im Kindmodul und gib `message` auf beiden Ebenen aus. Verwende dort wie im Root-Modul `registry.terraform.io/hashicorp/local`, damit der lokale Mirror greift. Initialisiere und wende die Konfiguration an. Beim Ersetzen der Ressource kann die alte Datei `notice.txt` im Wurzelverzeichnis entfernt werden.
hints.2.text: |-
  Prüfe nach der Anwendung die Adresse im State, die Datei, die Ausgabe des Root-Moduls und den Plan.

  - `tofu show -no-color` — Enthält die verwaltete Ressource `module.notice.local_file.notice`.

  - `cat north.txt; tofu output -raw message` — Beide Verbraucher zeigen `north-ready`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.
debrief: Modul-Zustandsadresse, Hinweisdatei, Root-Ausgabe und Plan ohne Änderungen entsprechen nun den Prüfungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
stages.0.objectives.0.text: Der OpenTofu-State enthält `module.notice.local_file.notice`.
stages.0.objectives.1.text: 'Auf der Workstation: `north.txt` enthält `north-ready`.'
stages.0.objectives.2.text: Die Root-Ausgabe `message` hat den Wert `north-ready`.
stages.0.objectives.3.text: Der OpenTofu-State enthält `module.notice.local_file.notice`, und es gibt keine ausstehenden Infrastrukturänderungen.
diagnostics.condition_0: |-
  Die Adresse kann fehlen, wenn der Aufruf im Root-Modul noch nicht angewendet wurde oder die Ressource im Kindmodul anders heißt. [Leitfaden](guides#guide=terraform-7.1&section=notice-module)
diagnostics.condition_1: |-
  Die Eingabe `station` bestimmt Dateiname und Inhalt. Ein anderer Wert oder eine manuelle Bearbeitung können das Ergebnis ändern. [Leitfaden](guides#guide=terraform-7.1&section=station-notice)
diagnostics.condition_2: |-
  Die Root-Ausgabe kann fehlen oder veraltet sein, wenn die Ausgabe des Kindmoduls nicht exportiert oder die Änderung noch nicht angewendet wurde. [Leitfaden](guides#guide=terraform-7.1&section=notice-output)
diagnostics.condition_3: |-
  Der Plan kann Änderungen vorschlagen, wenn die Moduladresse im State fehlt oder die verwaltete Datei von der Konfiguration abweicht. [Leitfaden](guides#guide=terraform-7.1&section=notice-module-plan)
