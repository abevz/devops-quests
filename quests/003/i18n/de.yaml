title: Ein- und Ausgänge des lokalen Moduls
brief: 'Arbeite in `~/quest` mit den bereitgestellten Dateien `main.tf` und `modules/notice/README.md`. Die Root-Konfiguration
  enthält bereits eine Hinweisressource; diese Übungsumgebung ist offline. Die in den Hinweisen verlinkte Anleitung zu lokalen
  Modulen erklärt Eingaben, Ausgaben und Zustandsadressen.


  Erstelle `modules/notice` mit der Eingabe `station`, der Ausgabe `message` und einer `local_file`-Ressource namens `notice`.
  Sie soll `<station>.txt` mit dem Inhalt `<station>-ready` schreiben. Deklariere im Kindmodul dieselbe Providerquelle wie
  im Root: `registry.terraform.io/hashicorp/local`; der Offline-Spiegel enthält die standardmäßige OpenTofu-Registry-Adresse
  nicht. Rufe es im Root als `module.notice` mit `station = "north"` auf und exportiere seine Nachricht als Root-Ausgabe `message`.
  Die alte Root-Datei `notice.txt` darf entfernt werden; dies ist ein Ersatz und keine Zustandsverschiebung.


  Initialisiere und wende die Konfiguration an. Prüfe, dass `tofu state list` `module.notice.local_file.notice` enthält, `north.txt`
  und `tofu output -raw message` jeweils `north-ready` enthalten und `tofu plan -input=false -detailed-exitcode -no-color`
  mit Code 0 endet (keine Änderungen). Bleibe mit allen Arbeiten in der Übungsumgebung.'
stages.0.brief: Erstelle das lokale Modul und seinen Root-Aufruf. Prüfe dann Zustandsadresse, Datei, Root-Ausgabe und einen
  Plan ohne Änderungen wie beschrieben.
stages.0.objectives.0.text: Die geforderte Zustandsadresse, Datei und Root-Ausgabe stimmen, und der Plan endet mit Code 0.
hints.0.text: Ein untergeordnetes Modul benötigt explizite inputs und outputs.
hints.1.text: Platzieren Sie die Hinweisressource in modules/notice; Übergeben Sie station von der Wurzel.
hints.2.text: Nennen Sie es module.notice, exportieren Sie message an beiden Grenzen und überprüfen Sie den Status sowie ein
  leeres plan.
debrief: Modul-Zustandsadresse, Hinweisdatei, Root-Ausgabe und Plan ohne Änderungen entsprechen nun den Prüfungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss module.notice.local_file.notice enthalten.
diagnostics.condition_1: north.txt muss north-ready entsprechen.
diagnostics.condition_2: tofu output -raw message muss north-ready entsprechen.
diagnostics.condition_3: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
