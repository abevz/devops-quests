title: Ein- und Ausgänge des lokalen Moduls
brief: |
  Verbraucher können die angeforderte Nachricht nicht abrufen.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/notice/README.md`.

  **Anforderungen:**
  - OpenTofu-State:
    - Erforderliche Adressen: `module.notice.local_file.notice`.
  - Dateien auf der Workstation:
    - `~/quest/north.txt`: `north-ready`.
  - Root-Ausgaben:
    - `message`: `north-ready`.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  **Selbstprüfung vor Check & finish:**
  - `tofu show -no-color` — Enthält die verwaltete Ressource `module.notice.local_file.notice`.
  - `cat north.txt; tofu output -raw message` — Beide Verbraucher zeigen `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.
stages.0.brief: Erfülle den Ergebnisvertrag der Nachricht auf der Workstation.
hints.0.text: Ein untergeordnetes Modul benötigt explizite inputs und outputs.
hints.1.text: 'Lege die Nachrichtenressource in modules/notice ab und übergib station vom Root. Die Providerquelle
  des Kindmoduls muss dem Root entsprechen: registry.terraform.io/hashicorp/local; der Standard-OpenTofu-Registry-Eintrag
  fehlt im Offline-Mirror.'
hints.2.text: Rufe module.notice mit station gleich north auf und exportiere message an beiden Grenzen. Initialisiere
  und wende an; dies ist ein Ersatz, keine State-Verschiebung, und die alte Root-Datei notice.txt darf entfernt
  werden.
debrief: Modul-Zustandsadresse, Hinweisdatei, Root-Ausgabe und Plan ohne Änderungen entsprechen nun den Prüfungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss module.notice.local_file.notice enthalten.
diagnostics.condition_1: north.txt muss north-ready entsprechen.
diagnostics.condition_2: tofu output -raw message muss north-ready entsprechen.
diagnostics.condition_3: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
stages.0.objectives.0.text: Der OpenTofu-State enthält `module.notice.local_file.notice`.
stages.0.objectives.1.text: 'Auf der Workstation: `north.txt` enthält `north-ready`.'
stages.0.objectives.2.text: Die Root-Ausgabe `message` hat den Wert `north-ready`.
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
