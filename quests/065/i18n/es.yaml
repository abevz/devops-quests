title: Vault estado sellado
brief: 'Trabaja en `~/quest` con `platform.env`, `unseal-shares.json`, `initial-seal-status.json` y `reader.hcl`. Este Vault
  desechable del juego está inicializado pero sellado y el secreto dispatch ya existe. Se proporcionan dos fragmentos distintos
  del juego. Nunca imprimas fragmentos ni tokens, reinicialices el almacenamiento ni crees un secreto de reemplazo. La guía
  enlazada de recuperación de Vault explica la API unseal y la lectura KV-v2.


  Mantén `unseal-shares.json` como un array JSON de exactamente dos cadenas con modo `0600`. Envía los dos fragmentos distintos
  a `/v1/sys/unseal`. Comprueba que `/v1/sys/seal-status` informa `initialized=true`, `sealed=false`, umbral `t=2` y cantidad
  de fragmentos `n=3`. Con el token reader suministrado, lee KV-v2 `secret/data/dispatch`: `.data.data.value` debe ser `north-secret`.
  La comprobación observa el estado actual, las propiedades del archivo y el acceso; no demuestra la historia del almacenamiento.
  Usa solo la bahía del juego sin conexión.'
debrief: El estado del Vault del juego, el archivo de fragmentos y el acceso reader coincidieron con las comprobaciones de
  recuperación.
stages.0.brief: El estado del sello, el archivo de fragmentos y el acceso reader coinciden con el enunciado.
stages.0.objectives.0.text: El estado del sello, el archivo de fragmentos y el acceso reader coinciden con el enunciado.
hints.0.text: Sellado y no inicializado son estados diferentes.
hints.1.text: El endpoint seal-status informa del umbral y del progreso sin requerir permisos de root.
hints.2.text: Envía dos fragmentos distintos suministrados y lee el valor KV existente con el token reader original.
phrases.0: Distinguí el almacenamiento sellado de un servidor no inicializado.
phrases.1: Utilicé el número requerido de fragmentos destinados exclusivamente al juego.
phrases.2: Verifiqué los datos existentes en lugar de crear un reemplazo.
diagnostics.initialized: Vault sys/seal-status initialized debe ser true.
diagnostics.sealed: Vault sys/seal-status sealed debe ser false.
diagnostics.threshold: Vault sys/seal-status t debe ser 2.
diagnostics.shares: Vault sys/seal-status n debe ser 3.
diagnostics.mode: El modo de unseal-shares.json debe ser 0600.
diagnostics.array: unseal-shares.json debe ser un array.
diagnostics.length: unseal-shares.json debe ser un array de longitud 2.
diagnostics.types: Cada elemento del array unseal-shares.json debe ser una cadena.
diagnostics.distinct: unseal-shares.json debe ser un array de dos elementos distintos.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
