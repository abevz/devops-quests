title: Vault estado sellado
brief: 'Recupera el Vault inicializado existente y su aplicación conservando almacenamiento, cuórum, identidad de
  clúster registrada y participaciones privadas distintas.


  Trabaja en `~/quest`. El directorio del consumidor contiene configuración, PID y registro. `consumer/README.md`
  describe la interfaz; `consumer-contract.json` registra los procesos originales, la fuente aprobada, el resumen
  de publicación y la versión. Conserva programas, identidades y privilegios originales. Cada consumidor debe servir
  la publicación aprobada desde la fuente original con la identidad privada reader suministrada. Una consulta manual
  a la fuente no basta. Las credenciales deben ser archivos regulares del usuario workstation con modo `0600`. No
  imprimas secretos ni credenciales.


  **Requisitos:**


  - El Vault existente e inicializado está desellado y conserva su cuórum de recuperación original. Conserva la
  identidad original registrada del clúster.

  - `~/quest/unseal-shares.json` en la estación de trabajo es un array con la cantidad suministrada de participaciones
  distintas de tipo cadena; solo su propietario puede leerlo y escribirlo, y no es ejecutable.

  - La aplicación original adopta y sirve la publicación aprobada con la identidad privada reader suministrada.'
debrief: Se conservaron las identidades de fuente y consumidores; las aplicaciones adoptaron la publicación aprobada.
stages.0.brief: Recupera el Vault inicializado existente y su aplicación conservando almacenamiento, cuórum, identidad
  de clúster registrada y participaciones privadas distintas.
hints.0.text: Disponibilidad del servidor, autorización y publicación adoptada por el consumidor son observaciones
  distintas.
hints.1.text: 'Compara respuesta real, perfiles de fuente, registros y contrato original. Sigue primero el límite
  que falla.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```'
hints.2.text: 'El progreso de unseal requiere partes suministradas distintas; enviar dos veces la misma parte no
  añade progreso.


  Envía dos partes suministradas distintas a /v1/sys/unseal y lee el valor KV existente con el token de acceso original.
  Nunca muestres partes o tokens, reinicialices el almacenamiento ni crees un secreto de reemplazo.


  Verifica el resultado observado:


  - `ls -l unseal-shares.json; jq -e ''type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]''
  unseal-shares.json` — Modo `-rw-------` y `true`, sin mostrar las partes.

  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n}''` — Informa
  initialized `true`, sealed `false`, `t=2`, `n=3`.

  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Imprime `true`, sin mostrar la respuesta secreta.


  Ajusta el perfil a la fuente API aprobada y credenciales reader. Conserva el archivo privado y envía SIGHUP a
  la PID existente; manager es otra identidad. Verifica la publicación HTTP. Esperado: OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```'
phrases.0: Distinguí el almacenamiento sellado de un servidor no inicializado.
phrases.1: Utilicé el número requerido de fragmentos destinados exclusivamente al juego.
phrases.2: Verifiqué los datos existentes en lugar de crear un reemplazo.
diagnostics.initialized: Vault sys/seal-status initialized debe ser true.
diagnostics.sealed: Vault sys/seal-status sealed debe ser false.
diagnostics.threshold: Vault sys/seal-status t debe ser 2.
diagnostics.shares: Vault sys/seal-status n debe ser 3.
diagnostics.mode: El modo de unseal-shares.json debe ser 0600.
diagnostics.array: unseal-shares.json debe ser un array.
diagnostics.length: unseal-shares.json debe ser un array de longitud 2.
diagnostics.types: Cada elemento del array unseal-shares.json debe ser una cadena.
diagnostics.distinct: unseal-shares.json debe ser un array de dos elementos distintos.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
stages.0.objectives.0.text: El Vault existente e inicializado está desellado y conserva su cuórum de recuperación
  original. Conserva la identidad original registrada del clúster.
stages.0.objectives.1.text: '`~/quest/unseal-shares.json` en la estación de trabajo es un array con la cantidad
  suministrada de participaciones distintas de tipo cadena; solo su propietario puede leerlo y escribirlo, y no
  es ejecutable.'
stages.0.objectives.2.text: La aplicación original adopta y sirve la publicación aprobada con la identidad privada
  reader suministrada.
diagnostics.probe_0_0: La identidad del clúster Vault debe coincidir con el registro original; compara el estado
  seal y original-cluster-id.
diagnostics.probe_0_2: La aplicación original debe adoptar la fuente API aprobada con identidad privada reader.
  Compara perfil, registro de proceso y publicación HTTP.
