title: Vault estado sellado
brief: 'La instancia de Vault del ejercicio está inicializada pero sellada; el valor dispatch almacenado
  ya existe. Se proporcionan dos de sus tres fragmentos de clave de desbloqueo de un solo uso en unseal-shares.json
  (umbral de dos). Envía ambos fragmentos distintos a /v1/sys/unseal sin reinicializar el almacenamiento
  ni crear un secreto nuevo. Nunca muestres ni imprimas los fragmentos de clave. Este entorno no depende
  de un Vault de producción ni de un clúster externo. Confirma que el token reader original sigue recuperando
  el valor dispatch existente.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `unseal-shares.json`,
  `initial-seal-status.json`, `unseal-status.json`, `reader.hcl`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el juego inicializado original Vault es unsealed con threshold dos; el
  reader existente y el valor almacenado aún funcionan.'
debrief: Desbloquear el acceso recuperado a storage cifrado existente sin restablecer identity o datos.
