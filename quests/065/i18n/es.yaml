hints.0.text: Sealed y uninitialized son estados diferentes.
hints.1.text: El endpoint seal-status informa del umbral y del progreso sin requerir permisos de root.
hints.2.text: Envía dos fragmentos de clave distintos de los suministrados y lee el valor KV existente
  con el token reader original.
phrases.0: Distinguí sealed storage de un servidor no inicializado.
phrases.1: Utilicé el umbral requerido de fragmentos de clave destinados exclusivamente al ejercicio.
phrases.2: Verifiqué los datos existentes en lugar de crear un reemplazo.
