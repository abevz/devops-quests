title: Vault estado sellado
brief: 'La identidad Vault suministrada no puede leer la configuración requerida.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `unseal-shares.json`, `reader.hcl`.


  **Requisitos:**

  - El Vault existente e inicializado está desellado y conserva su cuórum de recuperación original.

  - `~/quest/unseal-shares.json` en la estación de trabajo es un array con la cantidad suministrada de participaciones
  distintas de tipo cadena; solo su propietario puede leerlo y escribirlo, y no es ejecutable.

  - La identidad de lectura suministrada puede leer la configuración de despacho existente del almacenamiento
  original de Vault.


  La comprobación observa el estado seal actual, propiedades del archivo y acceso; no demuestra el historial
  de almacenamiento.

  '
debrief: El estado del Vault del juego, el archivo de fragmentos y el acceso reader coincidieron con las comprobaciones
  de recuperación.
stages.0.brief: La configuración Vault existente debe poder leerse con evidencia de recuperación privada.
hints.0.text: Sellado y no inicializado son estados diferentes.
hints.1.text: 'Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat initial-seal-status.json reader.hcl

  source platform.env

  curl -fsS "$VAULT_ADDR/v1/sys/seal-status"

  ```'
hints.2.text: 'El progreso de unseal requiere partes suministradas distintas; enviar dos veces la misma parte
  no añade progreso.


  Envía dos partes suministradas distintas a /v1/sys/unseal y lee el valor KV existente con el token de acceso
  original. Nunca muestres partes o tokens, reinicialices el almacenamiento ni crees un secreto de reemplazo.


  Verifica el resultado observado:


  - `ls -l unseal-shares.json; jq -e ''type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]''
  unseal-shares.json` — Modo `-rw-------` y `true`, sin mostrar las partes.

  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n}''` — Informa
  initialized `true`, sealed `false`, `t=2`, `n=3`.

  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Imprime `true`, sin mostrar la respuesta secreta.'
phrases.0: Distinguí el almacenamiento sellado de un servidor no inicializado.
phrases.1: Utilicé el número requerido de fragmentos destinados exclusivamente al juego.
phrases.2: Verifiqué los datos existentes en lugar de crear un reemplazo.
diagnostics.initialized: Vault sys/seal-status initialized debe ser true.
diagnostics.sealed: Vault sys/seal-status sealed debe ser false.
diagnostics.threshold: Vault sys/seal-status t debe ser 2.
diagnostics.shares: Vault sys/seal-status n debe ser 3.
diagnostics.mode: El modo de unseal-shares.json debe ser 0600.
diagnostics.array: unseal-shares.json debe ser un array.
diagnostics.length: unseal-shares.json debe ser un array de longitud 2.
diagnostics.types: Cada elemento del array unseal-shares.json debe ser una cadena.
diagnostics.distinct: unseal-shares.json debe ser un array de dos elementos distintos.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
stages.0.objectives.0.text: El Vault existente e inicializado está desellado y conserva su cuórum de recuperación
  original.
stages.0.objectives.1.text: '`~/quest/unseal-shares.json` en la estación de trabajo es un array con la cantidad
  suministrada de participaciones distintas de tipo cadena; solo su propietario puede leerlo y escribirlo,
  y no es ejecutable.'
stages.0.objectives.2.text: La identidad de lectura suministrada puede leer la configuración de despacho existente
  del almacenamiento original de Vault.
