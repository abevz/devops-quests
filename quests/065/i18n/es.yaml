title: Vault estado sellado
brief: |
  La identidad Vault suministrada no puede leer la configuración requerida.

  Trabaja en la workstation en `~/quest` con `platform.env`, `unseal-shares.json`, `initial-seal-status.json`.

  **Requisitos:**
  - Vault de práctica en `VAULT_ADDR` de `platform.env` en la workstation:
    - `initialized`: `true`; `sealed`: `false`.
    - Umbral: `2`.
    - Partes totales: `3`.
  - Archivo en la workstation:
    - Ruta: `~/quest/unseal-shares.json`.
    - Un array JSON de exactamente dos cadenas distintas.
    - Modo de acceso: `0600`.
  - Vault de práctica en `VAULT_ADDR` de `platform.env` en la workstation:
    - La identidad del `VAULT_READER_TOKEN` suministrado lee `north-secret` en KV-v2 `secret/data/dispatch`.

  **Verifica antes de Check & finish:**
  - `ls -l unseal-shares.json; jq -e 'type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]' unseal-shares.json` — Modo `-rw-------` y `true`, sin mostrar las partes.
  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n}'` — Informa initialized `true`, sealed `false`, `t=2`, `n=3`.
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Imprime `true`, sin mostrar la respuesta secreta.

  La comprobación observa el estado seal actual, propiedades del archivo y acceso; no demuestra el historial de almacenamiento.
debrief: El estado del Vault del juego, el archivo de fragmentos y el acceso reader coincidieron con las comprobaciones
  de recuperación.
stages.0.brief: La configuración Vault existente debe poder leerse con evidencia de recuperación privada.
hints.0.text: Sellado y no inicializado son estados diferentes.
hints.1.text: El progreso de unseal requiere partes suministradas distintas; enviar dos veces la misma parte no
  añade progreso.
hints.2.text: Envía dos partes suministradas distintas a /v1/sys/unseal y lee el valor KV existente con el token
  de acceso original. Nunca muestres partes o tokens, reinicialices el almacenamiento ni crees un secreto de reemplazo.
phrases.0: Distinguí el almacenamiento sellado de un servidor no inicializado.
phrases.1: Utilicé el número requerido de fragmentos destinados exclusivamente al juego.
phrases.2: Verifiqué los datos existentes en lugar de crear un reemplazo.
diagnostics.initialized: Vault sys/seal-status initialized debe ser true.
diagnostics.sealed: Vault sys/seal-status sealed debe ser false.
diagnostics.threshold: Vault sys/seal-status t debe ser 2.
diagnostics.shares: Vault sys/seal-status n debe ser 3.
diagnostics.mode: El modo de unseal-shares.json debe ser 0600.
diagnostics.array: unseal-shares.json debe ser un array.
diagnostics.length: unseal-shares.json debe ser un array de longitud 2.
diagnostics.types: Cada elemento del array unseal-shares.json debe ser una cadena.
diagnostics.distinct: unseal-shares.json debe ser un array de dos elementos distintos.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
stages.0.objectives.0.text: Vault informa initialized `true`, sealed `false`, umbral `2` y número total de partes
  `3`.
stages.0.objectives.1.text: El archivo `~/quest/unseal-shares.json` en la workstation contiene exactamente dos partes
  distintas de tipo cadena y tiene modo `0600`.
stages.0.objectives.2.text: La identidad del `VAULT_READER_TOKEN` suministrado lee el valor `north-secret` de Vault
  `secret/data/dispatch`.
