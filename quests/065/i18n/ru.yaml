title: Запечатанный Vault
brief: |
  Предоставленная идентичность Vault не может прочитать требуемую конфигурацию.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `unseal-shares.json`, `initial-seal-status.json`.

  **Требования:**
  - Учебный Vault по адресу `VAULT_ADDR` из `platform.env` на workstation:
    - `initialized`: `true`; `sealed`: `false`.
    - Порог: `2`.
    - Общее число долей: `3`.
  - Файл на workstation:
    - Путь: `~/quest/unseal-shares.json`.
    - JSON-массив ровно из двух разных строк.
    - Режим доступа: `0600`.
  - Учебный Vault по адресу `VAULT_ADDR` из `platform.env` на workstation:
    - Идентичность предоставленного `VAULT_READER_TOKEN` читает `north-secret` по KV-v2 пути `secret/data/dispatch`.

  **Самопроверка перед Check & finish:**
  - `ls -l unseal-shares.json; jq -e 'type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]' unseal-shares.json` — Режим `-rw-------` и `true`, без вывода долей.
  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n}'` — Сообщает initialized `true`, sealed `false`, `t=2`, `n=3`.
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Печатает `true`, не выводя ответ с секретом.

  Проверка наблюдает текущий статус seal, свойства файла и доступ; она не доказывает историю хранилища.
debrief: Состояние игрового Vault, файл долей и доступ reader соответствовали проверкам восстановления.
stages.0.brief: Существующая конфигурация Vault должна читаться при приватных данных восстановления.
hints.0.text: Запечатанное и неинициализированное состояния различаются.
hints.1.text: Для прогресса unseal нужны разные предоставленные доли; повторная отправка той же доли не добавляет
  прогресса.
hints.2.text: Отправьте две разные предоставленные доли в /v1/sys/unseal и прочитайте существующее KV-значение с
  исходным токеном доступа. Не выводите доли или токены, не инициализируйте хранилище заново и не создавайте секрет-замену.
phrases.0: Я отличил запечатанное хранилище от неинициализированного сервера.
phrases.1: Я использовал требуемое количество игровых долей.
phrases.2: Я проверил существующие данные вместо создания замены.
diagnostics.initialized: Vault sys/seal-status initialized должен быть true.
diagnostics.sealed: Vault sys/seal-status sealed должен быть false.
diagnostics.threshold: Vault sys/seal-status t должен быть 2.
diagnostics.shares: Vault sys/seal-status n должен быть 3.
diagnostics.mode: Права unseal-shares.json должны быть 0600.
diagnostics.array: unseal-shares.json должен быть массивом.
diagnostics.length: unseal-shares.json должен быть массивом длины 2.
diagnostics.types: Каждый элемент массива unseal-shares.json должен быть строкой.
diagnostics.distinct: unseal-shares.json должен быть массивом из двух разных элементов.
diagnostics.reader: Токен читателя должен прочитать north-secret из secret/data/dispatch.
stages.0.objectives.0.text: Vault сообщает initialized `true`, sealed `false`, порог `2` и общее число долей `3`.
stages.0.objectives.1.text: Файл `~/quest/unseal-shares.json` на workstation содержит ровно две разные строковые
  доли и имеет режим `0600`.
stages.0.objectives.2.text: Идентичность предоставленного `VAULT_READER_TOKEN` читает значение `north-secret` из
  Vault `secret/data/dispatch`.
