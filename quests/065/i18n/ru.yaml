title: Запечатанный Vault
brief: 'Восстановите существующий инициализированный Vault и его приложение, сохранив хранилище и кворум распечатывания.
  Сохраните записанную идентичность кластера и выданные приватные, различающиеся доли ключа.


  Работайте в `~/quest`. В каталоге потребителя находятся конфигурация, запись PID и журнал приложения. Интерфейс
  описан в `consumer/README.md`; `consumer-contract.json` содержит исходные процессы, утверждённый источник, хеш
  публикации и версию. Сохраните программы, идентичность и привилегии исходных процессов. Каждый потребитель должен
  отдавать утверждённую публикацию через свой HTTP-интерфейс, используя исходный источник и выданную приватную reader-идентичность.
  Успешного ручного запроса к источнику недостаточно. Файлы учётных данных должны быть обычными, принадлежать пользователю
  workstation и иметь режим `0600`. Не выводите секреты и учётные данные.


  **Требования:**


  - Существующий инициализированный Vault распечатан и сохраняет исходный кворум восстановления. Сохраните записанную
  исходную идентичность кластера.

  - Файл `~/quest/unseal-shares.json` на рабочей станции — массив с поставленным числом различных строковых долей;
  только владелец может читать и изменять файл, выполнение запрещено.

  - Исходное приложение принимает и отдаёт утверждённую публикацию источника с выданной приватной reader-идентичностью.'
debrief: Идентичность источника и потребителей сохранена; работающие приложения приняли утверждённую публикацию.
stages.0.brief: Восстановите существующий инициализированный Vault и его приложение, сохранив хранилище и кворум
  распечатывания. Сохраните записанную идентичность кластера и выданные приватные, различающиеся доли ключа.
hints.0.text: Доступность сервера, авторизация и принятая потребителем публикация — разные наблюдения.
hints.1.text: 'Сопоставьте живой ответ сервиса, профили источников, журналы приложений и исходный контракт. Проследите
  первую неисправную границу, прежде чем менять следующий компонент.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```'
hints.2.text: 'Для прогресса unseal нужны разные предоставленные доли; повторная отправка той же доли не добавляет
  прогресса.


  Отправьте две разные предоставленные доли в /v1/sys/unseal и прочитайте существующее KV-значение с исходным токеном
  доступа. Не выводите доли или токены, не инициализируйте хранилище заново и не создавайте секрет-замену.


  Проверьте наблюдаемый результат:


  - `ls -l unseal-shares.json; jq -e ''type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]''
  unseal-shares.json` — Режим `-rw-------` и `true`, без вывода долей.

  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n}''` — Сообщает
  initialized `true`, sealed `false`, `t=2`, `n=3`.

  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Печатает `true`, не выводя ответ с секретом.


  Приведите профиль к утверждённому API-источнику и выданным учётным данным reader. Сохраните приватность файла
  и отправьте SIGHUP существующему PID; manager — другая идентичность. Проверьте HTTP-публикацию, а не только источник.
  Ожидается OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```'
phrases.0: Я отличил запечатанное хранилище от неинициализированного сервера.
phrases.1: Я использовал требуемое количество игровых долей.
phrases.2: Я проверил существующие данные вместо создания замены.
stages.0.objectives.0.text: Существующий инициализированный Vault распечатан и сохраняет исходный кворум восстановления.
  Сохраните записанную исходную идентичность кластера.
stages.0.objectives.1.text: Файл `~/quest/unseal-shares.json` на рабочей станции — массив с поставленным числом
  различных строковых долей; только владелец может читать и изменять файл, выполнение запрещено.
stages.0.objectives.2.text: Исходное приложение принимает и отдаёт утверждённую публикацию источника с выданной
  приватной reader-идентичностью.
guides.reference_1: Справочник наблюдаемого API Vault
guides.reference_2: Справочник проверки публикации и потребителей
diagnostics.initialized: 'Статус не подтвердил initialized=true: адрес может вести в пустое или заменённое хранилище либо ответ недоступен и некорректен. Выданный Vault уже был инициализирован. [Причина и проверка](guides#guide=vault-recovery&section=sealed-existing-initialized-store)'
diagnostics.sealed: 'Статус не подтвердил sealed=false: могли быть отправлены менее двух разных выданных долей, одна доля повторена либо запрос статуса завершился ошибкой. [Причина и проверка](guides#guide=vault-recovery&section=sealed-distinct-unseal-progress)'
diagnostics.threshold: 'Статус не подтвердил t=2: изменённые параметры инициализации или rekey, другой endpoint либо нечитаемый ответ мешают подтвердить исходный порог восстановления. [Причина и проверка](guides#guide=vault-recovery&section=sealed-original-recovery-threshold)'
diagnostics.shares: 'Статус не подтвердил n=3: другая конфигурация инициализации или rekey, неверный endpoint либо ошибка наблюдения могут отличаться от исходного общего числа долей. [Причина и проверка](guides#guide=vault-recovery&section=sealed-original-share-count)'
diagnostics.probe_0_0: 'Исходная идентичность кластера Vault не подтверждена: повторная инициализация или замена хранилища меняет cluster ID; отсутствующие защищённые данные, недоступный исходный endpoint или сбой запуска также мешают сравнению. [Причина и проверка](guides#guide=vault-recovery&section=sealed-original-cluster-identity)'
diagnostics.mode: 'unseal-shares.json не сообщил режим 600 либо недоступен для наблюдения: копирование или пересоздание файла с более широкими либо исполняемыми правами раскрывает выданные доли. [Причина и проверка](guides#guide=vault-recovery&section=sealed-private-share-permissions)'
diagnostics.array: 'unseal-shares.json не является читаемым JSON-массивом: полный ответ инициализации, одиночная доля без массива или некорректный JSON меняют выданную форму. [Причина и проверка](guides#guide=vault-recovery&section=sealed-share-array-shape)'
diagnostics.length: 'Массив восстановления не содержит ровно две записи либо не разбирается: копирование всех трёх долей инициализации, потеря одной или другая структура нарушают контракт выданного файла. [Причина и проверка](guides#guide=vault-recovery&section=sealed-two-retained-shares)'
diagnostics.types: 'Записи восстановления не все являются JSON-строками либо массив не читается: числа, объекты или неверно обёрнутый результат инициализации не сохраняют строковое представление долей. [Причина и проверка](guides#guide=vault-recovery&section=sealed-string-share-entries)'
diagnostics.distinct: 'Две записи восстановления не различаются либо массив некорректен: дублирование одной выданной доли не даёт двух разных вкладов для unseal. [Причина и проверка](guides#guide=vault-recovery&section=sealed-distinct-share-file)'
diagnostics.reader: 'Выданный reader не прочитал north-secret из secret/data/dispatch: Vault ещё sealed, окружение, токен или путь отличаются от выданного источника либо наблюдение API и JSON не удалось. [Причина и проверка](guides#guide=vault-recovery&section=sealed-approved-reader-api)'
diagnostics.probe_0_2: 'Исходный потребитель не подтвердил одобренную публикацию Vault с приватной идентичностью reader: файл ещё содержит выданный manager или кэш ошибки не обновлён; изменённые процесс, программа, конфигурация, хранение токена или недоступные наблюдения также могут быть причиной. [Причина и проверка](guides#guide=vault-recovery&section=sealed-original-consumer-adoption)'
