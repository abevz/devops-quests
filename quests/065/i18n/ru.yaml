title: Запечатанный Vault
brief: 'Игровой Vault инициализирован, но sealed; значение dispatch уже записано. В unseal-shares.json
  выданы две из трёх одноразовых игровых долей ключа, threshold — две. Передайте обе разные доли в /v1/sys/unseal
  без повторной инициализации storage и записи нового секрета. Не печатайте доли. Production Vault и Kubernetes
  здесь отсутствуют. Подтвердите, что исходный reader token читает существующий dispatch.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `unseal-shares.json`,
  `initial-seal-status.json`, `unseal-status.json`, `reader.hcl`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Исходный инициализированный игровой Vault unsealed при threshold две; прежний reader
  и записанное значение работают.'
debrief: Unseal восстановил доступ к существующему зашифрованному storage без сброса identity и данных.
stages.0.brief: 'Исходный инициализированный игровой Vault unsealed при threshold две; прежний reader
  и записанное значение работают.


  Результат проверки: Исходный инициализированный игровой Vault unsealed при threshold две; прежний reader
