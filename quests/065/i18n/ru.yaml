title: Запечатанный Vault
brief: 'Работайте в `~/quest` с `platform.env`, `unseal-shares.json`, `initial-seal-status.json` и `reader.hcl`. Одноразовый игровой Vault инициализирован, но запечатан; секрет dispatch уже существует. Выданы две разные игровые доли. Не выводите доли или токены, не инициализируйте хранилище повторно и не создавайте замену секрета. Руководство по восстановлению Vault объясняет API unseal и чтение KV-v2.


  Сохраните `unseal-shares.json` как JSON-массив ровно из двух строк с режимом `0600`. Передайте две разные доли в `/v1/sys/unseal`. Проверьте, что `/v1/sys/seal-status` сообщает `initialized=true`, `sealed=false`, порог `t=2` и число долей `n=3`. Выданным токеном reader прочитайте KV-v2 `secret/data/dispatch`: `.data.data.value` должно равняться `north-secret`. Проверка наблюдает текущее состояние, свойства файла и доступ, но не доказывает историю хранилища. Используйте только игровую офлайн-песочницу.'
debrief: Состояние игрового Vault, файл долей и доступ reader соответствовали проверкам восстановления.
stages.0.brief: Состояние печати, файл долей и доступ reader соответствуют заданию.
stages.0.objectives.0.text: Состояние печати, файл долей и доступ reader соответствуют заданию.
hints.0.text: Запечатанное и неинициализированное состояния различаются.
hints.1.text: Точка seal-status сообщает порог и прогресс без прав root.
hints.2.text: Передайте две разные выданные доли и прочитайте существующее KV-значение исходным токеном reader.
phrases.0: Я отличил запечатанное хранилище от неинициализированного сервера.
phrases.1: Я использовал требуемое количество игровых долей.
phrases.2: Я проверил существующие данные вместо создания замены.
