stages.0.objectives.0.text: Исходный инициализированный игровой Vault unsealed при threshold две; прежний
  reader и записанное значение работают.
hints.0.text: Sealed и uninitialized — разные состояния.
hints.1.text: Seal-status показывает threshold и progress без root-полномочий.
hints.2.text: Передайте две разные выданные доли и прочитайте прежнее KV-значение исходным reader token.
phrases.0: Я отличил sealed storage от неинициализированного сервера.
phrases.1: Я использовал нужный threshold только игровых долей.
phrases.2: Я проверил существующие данные вместо создания замены.
