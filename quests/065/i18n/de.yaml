title: Vault versiegelter Zustand
brief: 'Die bereitgestellte Vault-Identität kann die erforderliche Konfiguration nicht lesen.


  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `unseal-shares.json`, `reader.hcl`.


  **Anforderungen:**

  - Der vorhandene initialisierte Vault ist entsiegelt und behält sein ursprüngliches Wiederherstellungsquorum.

  - `~/quest/unseal-shares.json` auf der Workstation ist ein Array mit der mitgelieferten Anzahl unterschiedlicher
  String-Anteile; nur der Eigentümer darf die Datei lesen und schreiben, sie ist nicht ausführbar.

  - Die mitgelieferte Leseridentität kann die vorhandene Dispatch-Konfiguration aus dem ursprünglichen Vault-Speicher
  lesen.


  Die Prüfung beobachtet aktuellen Seal-Status, Dateieigenschaften und Zugriff; sie beweist nicht die Speicherhistorie.

  '
debrief: Spiel-Vault-Status, Anteildatei und reader-Zugriff entsprachen den Wiederherstellungsprüfungen.
stages.0.brief: Die bestehende Vault-Konfiguration muss mit privaten Wiederherstellungsdaten lesbar sein.
hints.0.text: Versiegelt und nicht initialisiert sind unterschiedliche Zustände.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den beobachteten Zustand:


  ```sh

  cat initial-seal-status.json reader.hcl

  source platform.env

  curl -fsS "$VAULT_ADDR/v1/sys/seal-status"

  ```'
hints.2.text: 'Unseal-Fortschritt erfordert unterschiedliche bereitgestellte Anteile; derselbe Anteil zweimal
  bringt keinen Fortschritt.


  Sende zwei unterschiedliche bereitgestellte Anteile an /v1/sys/unseal und lies den bestehenden KV-Wert mit
  dem ursprünglichen Zugriffstoken. Gib Anteile oder Token nie aus, initialisiere den Speicher nicht neu und
  erstelle kein Ersatzgeheimnis.


  Prüfen Sie das beobachtete Ergebnis:


  - `ls -l unseal-shares.json; jq -e ''type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]''
  unseal-shares.json` — Modus `-rw-------` und `true`, ohne Anteile anzuzeigen.

  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n}''` — Meldet
  initialized `true`, sealed `false`, `t=2`, `n=3`.

  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Gibt `true` aus, ohne die geheime Antwort anzuzeigen.'
phrases.0: Ich habe versiegelten Speicher von einem nicht initialisierten Server unterschieden.
phrases.1: Ich habe die erforderliche Anzahl von Spielanteilen verwendet.
phrases.2: Ich habe vorhandene Daten geprüft, statt einen Ersatz zu erstellen.
diagnostics.initialized: Vault sys/seal-status initialized muss true sein.
diagnostics.sealed: Vault sys/seal-status sealed muss false sein.
diagnostics.threshold: Vault sys/seal-status t muss 2 sein.
diagnostics.shares: Vault sys/seal-status n muss 3 sein.
diagnostics.mode: Der Modus von unseal-shares.json muss 0600 sein.
diagnostics.array: unseal-shares.json muss ein Array sein.
diagnostics.length: unseal-shares.json muss ein Array mit Länge 2 sein.
diagnostics.types: Jeder Eintrag des Arrays unseal-shares.json muss eine Zeichenkette sein.
diagnostics.distinct: unseal-shares.json muss ein Array aus zwei verschiedenen Einträgen sein.
diagnostics.reader: Das Reader-Token muss north-secret aus secret/data/dispatch lesen.
