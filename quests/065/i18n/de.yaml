title: Vault versiegelter Zustand
brief: 'Der Vault der Übung ist initialisiert, aber versiegelt; der gespeicherte dispatch-Wert ist bereits
  vorhanden. Zwei seiner drei einmaligen Übungs-Schlüsselanteile stehen in unseal-shares.json bereit (Schwellenwert
  zwei). Übermittle beide unterschiedlichen Anteile an /v1/sys/unseal, ohne den Speicher neu zu initialisieren
  oder ein neues Secret anzulegen. Gib die Schlüsselanteile niemals aus. Dieser Übungsbereich hängt weder
  von einem produktiven Vault noch von einem externen Cluster ab. Prüfe, dass das ursprüngliche reader-Token
  weiterhin den vorhandenen dispatch-Wert abruft.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `unseal-shares.json`,
  `initial-seal-status.json`, `unseal-status.json`, `reader.hcl`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Das ursprünglich initialisierte Spiel Vault ist unsealed mit threshold
  zwei; Der vorhandene reader und der gespeicherte Wert funktionieren weiterhin.'
debrief: Entsperren des wiederhergestellten Zugriffs auf vorhandene verschlüsselte storage, ohne identity
  oder Daten zurückzusetzen.
stages.0.brief: 'Erfolgskriterien: Das ursprünglich initialisierte Spiel Vault ist unsealed mit threshold
  zwei; Der vorhandene reader und der gespeicherte Wert funktionieren weiterhin.'
stages.0.objectives.0.text: Das ursprünglich initialisierte Spiel Vault ist unsealed mit threshold zwei;
  Der vorhandene reader und der gespeicherte Wert funktionieren weiterhin.
hints.0.text: Sealed und uninitialized sind unterschiedliche Zustände.
hints.1.text: Der Endpoint seal-status meldet Schwellenwert und Fortschritt ohne Root-Berechtigung.
hints.2.text: Übermittle zwei verschiedene bereitgestellte Unseal-Schlüsselanteile und lies den vorhandenen
  KV-Wert mit dem ursprünglichen reader-Token.
phrases.0: Ich habe sealed storage von einem nicht initialisierten Server unterschieden.
phrases.1: Ich habe den erforderlichen Schwellenwert der nur für die Übung bestimmten Schlüsselanteile
  verwendet.
phrases.2: Ich habe vorhandene Daten überprüft, anstatt einen Ersatz zu erstellen.
