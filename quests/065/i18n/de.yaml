guides.reference_1: Relevante Vault-API untersuchen
guides.reference_2: Referenz zur Publikations- und Verbraucherprüfung
diagnostics.initialized: Der Status bestätigte initialized=true nicht; die Adresse kann auf leeren/ersetzten Speicher zeigen oder die Statusantwort ist unerreichbar beziehungsweise ungültig. Der gelieferte Vault war bereits initialisiert. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-existing-initialized-store)
diagnostics.sealed: Der Status bestätigte sealed=false nicht; möglicherweise wurden weniger als zwei verschiedene gelieferte Anteile eingereicht, derselbe Anteil wiederholt oder die Statusabfrage schlug fehl. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-distinct-unseal-progress)
diagnostics.threshold: Der Status bestätigte t=2 nicht; geänderte Initialisierung/rekey, ein anderer Endpoint oder eine unlesbare Antwort können die ursprüngliche Wiederherstellungsschwelle verdecken. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-original-recovery-threshold)
diagnostics.shares: Der Status bestätigte n=3 nicht; eine andere Initialisierung/rekey, falscher Endpoint oder fehlgeschlagene Beobachtung kann von der ursprünglichen Gesamtzahl der Anteile abweichen. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-original-share-count)
diagnostics.probe_0_0: Die ursprüngliche Vault-Clusteridentität wurde nicht bestätigt; Neuinitialisierung/Speicheraustausch ändert die cluster ID, während fehlende geschützte Belege, ein unerreichbarer ursprünglicher Endpoint oder Prüfstartfehler den Vergleich verhindern. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-original-cluster-identity)
diagnostics.mode: unseal-shares.json meldete nicht Modus 600 oder konnte nicht geprüft werden; Kopieren/Neuerstellen mit weitergehenden oder Ausführungsrechten kann die gelieferten Anteile offenlegen. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-private-share-permissions)
diagnostics.array: unseal-shares.json ist kein lesbares JSON-Array; eine vollständige Initialisierungsantwort, ein einzelner roher Anteil oder fehlerhaftes JSON kann die gelieferte Array-Struktur ersetzen. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-share-array-shape)
diagnostics.length: Das Wiederherstellungsarray enthält nicht genau zwei Einträge oder ist nicht lesbar; alle drei initialisierten Anteile zu kopieren, einen zu verlieren oder die Dateistruktur zu ändern kann den Dateivertrag verletzen. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-two-retained-shares)
diagnostics.types: Die Wiederherstellungseinträge sind nicht sämtlich JSON-Strings oder das Array ist unlesbar; Zahlen, Objekte oder falsch verpackte Initialisierungsergebnisse erhalten die gelieferte String-Darstellung nicht. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-string-share-entries)
diagnostics.distinct: Die zwei Wiederherstellungseinträge sind nicht verschieden oder das Array ist ungültig; das Duplizieren eines gelieferten Anteils liefert keine zwei unterschiedlichen Beiträge zum unseal. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-distinct-share-file)
diagnostics.reader: Der gelieferte reader las north-secret nicht unter secret/data/dispatch; Vault kann noch sealed sein, Umgebung/Token/Pfad von der gelieferten Quelle abweichen oder die API-/JSON-Beobachtung fehlschlagen. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-approved-reader-api)
diagnostics.probe_0_2: Der ursprüngliche Verbraucher bestätigte die Vault-Publikation nicht mit der privaten reader Identität; seine Datei kann noch die gelieferten manager Zugangsdaten oder sein Cache einen alten Fehler enthalten, während geänderter Prozess/Programm/Konfiguration, Token-Aufbewahrung oder fehlende Beobachtung dies ebenfalls erklären. [Ursache und Prüfung](guides#guide=vault-recovery&section=sealed-original-consumer-adoption)
