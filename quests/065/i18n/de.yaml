title: Vault versiegelter Zustand
brief: 'Arbeite in `~/quest` mit `platform.env`, `unseal-shares.json`, `initial-seal-status.json` und `reader.hcl`. Dieser
  kurzlebige Spiel-Vault ist initialisiert, aber versiegelt; das dispatch-Secret existiert bereits. Zwei verschiedene Spielanteile
  werden bereitgestellt. Gib niemals Anteile oder Tokens aus, initialisiere den Speicher nicht erneut und erstelle kein Ersatz-Secret.
  Die verlinkte Vault-Wiederherstellungsanleitung erklärt die Unseal-API und das Lesen von KV-v2.


  Bewahre `unseal-shares.json` als JSON-Array aus genau zwei Zeichenfolgen mit Modus `0600` auf. Sende die zwei verschiedenen
  Anteile an `/v1/sys/unseal`. Prüfe, dass `/v1/sys/seal-status` `initialized=true`, `sealed=false`, Schwellenwert `t=2` und
  Anteilzahl `n=3` meldet. Lies mit dem bereitgestellten reader-Token KV-v2 `secret/data/dispatch`: `.data.data.value` muss
  `north-secret` sein. Die Prüfung beobachtet aktuellen Status, Dateieigenschaften und Zugriff; sie beweist nicht die Speichergeschichte.
  Nutze nur die Offline-Spielumgebung.'
debrief: Spiel-Vault-Status, Anteildatei und reader-Zugriff entsprachen den Wiederherstellungsprüfungen.
stages.0.brief: Siegelstatus, Anteildatei und reader-Zugriff stimmen mit der Aufgabe überein.
stages.0.objectives.0.text: Siegelstatus, Anteildatei und reader-Zugriff stimmen mit der Aufgabe überein.
hints.0.text: Versiegelt und nicht initialisiert sind unterschiedliche Zustände.
hints.1.text: Der Endpunkt seal-status meldet Schwellenwert und Fortschritt ohne Root-Berechtigung.
hints.2.text: Übermittle zwei verschiedene bereitgestellte Anteile und lies den vorhandenen KV-Wert mit dem ursprünglichen
  reader-Token.
phrases.0: Ich habe versiegelten Speicher von einem nicht initialisierten Server unterschieden.
phrases.1: Ich habe die erforderliche Anzahl von Spielanteilen verwendet.
phrases.2: Ich habe vorhandene Daten geprüft, statt einen Ersatz zu erstellen.
diagnostics.initialized: Vault sys/seal-status initialized muss true sein.
diagnostics.sealed: Vault sys/seal-status sealed muss false sein.
diagnostics.threshold: Vault sys/seal-status t muss 2 sein.
diagnostics.shares: Vault sys/seal-status n muss 3 sein.
diagnostics.mode: Der Modus von unseal-shares.json muss 0600 sein.
diagnostics.array: unseal-shares.json muss ein Array sein.
diagnostics.length: unseal-shares.json muss ein Array mit Länge 2 sein.
diagnostics.types: Jeder Eintrag des Arrays unseal-shares.json muss eine Zeichenkette sein.
diagnostics.distinct: unseal-shares.json muss ein Array aus zwei verschiedenen Einträgen sein.
diagnostics.reader: Das Reader-Token muss north-secret aus secret/data/dispatch lesen.
