title: Vault versiegelter Zustand
brief: |
  Die bereitgestellte Vault-Identität kann die erforderliche Konfiguration nicht lesen.

  Arbeite auf der Workstation in `~/quest` mit `platform.env`, `unseal-shares.json`, `initial-seal-status.json`.

  **Anforderungen:**
  - Trainings-Vault unter `VAULT_ADDR` aus der Workstation-Datei `platform.env`:
    - `initialized`: `true`; `sealed`: `false`.
    - Schwellenwert: `2`.
    - Gesamtzahl der Anteile: `3`.
  - Datei auf der Workstation:
    - Pfad: `~/quest/unseal-shares.json`.
    - Ein JSON-Array aus genau zwei unterschiedlichen Zeichenfolgen.
    - Zugriffsmodus: `0600`.
  - Trainings-Vault unter `VAULT_ADDR` aus der Workstation-Datei `platform.env`:
    - Die Identität des bereitgestellten `VAULT_READER_TOKEN` liest `north-secret` unter KV-v2 `secret/data/dispatch`.

  **Selbstprüfung vor Check & finish:**
  - `ls -l unseal-shares.json; jq -e 'type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]' unseal-shares.json` — Modus `-rw-------` und `true`, ohne Anteile anzuzeigen.
  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n}'` — Meldet initialized `true`, sealed `false`, `t=2`, `n=3`.
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Gibt `true` aus, ohne die geheime Antwort anzuzeigen.

  Die Prüfung beobachtet aktuellen Seal-Status, Dateieigenschaften und Zugriff; sie beweist nicht die Speicherhistorie.
debrief: Spiel-Vault-Status, Anteildatei und reader-Zugriff entsprachen den Wiederherstellungsprüfungen.
stages.0.brief: Die bestehende Vault-Konfiguration muss mit privaten Wiederherstellungsdaten lesbar sein.
hints.0.text: Versiegelt und nicht initialisiert sind unterschiedliche Zustände.
hints.1.text: Unseal-Fortschritt erfordert unterschiedliche bereitgestellte Anteile; derselbe Anteil zweimal bringt
  keinen Fortschritt.
hints.2.text: Sende zwei unterschiedliche bereitgestellte Anteile an /v1/sys/unseal und lies den bestehenden KV-Wert
  mit dem ursprünglichen Zugriffstoken. Gib Anteile oder Token nie aus, initialisiere den Speicher nicht neu und
  erstelle kein Ersatzgeheimnis.
phrases.0: Ich habe versiegelten Speicher von einem nicht initialisierten Server unterschieden.
phrases.1: Ich habe die erforderliche Anzahl von Spielanteilen verwendet.
phrases.2: Ich habe vorhandene Daten geprüft, statt einen Ersatz zu erstellen.
diagnostics.initialized: Vault sys/seal-status initialized muss true sein.
diagnostics.sealed: Vault sys/seal-status sealed muss false sein.
diagnostics.threshold: Vault sys/seal-status t muss 2 sein.
diagnostics.shares: Vault sys/seal-status n muss 3 sein.
diagnostics.mode: Der Modus von unseal-shares.json muss 0600 sein.
diagnostics.array: unseal-shares.json muss ein Array sein.
diagnostics.length: unseal-shares.json muss ein Array mit Länge 2 sein.
diagnostics.types: Jeder Eintrag des Arrays unseal-shares.json muss eine Zeichenkette sein.
diagnostics.distinct: unseal-shares.json muss ein Array aus zwei verschiedenen Einträgen sein.
diagnostics.reader: Das Reader-Token muss north-secret aus secret/data/dispatch lesen.
stages.0.objectives.0.text: Vault meldet initialized `true`, sealed `false`, Schwellenwert `2` und Gesamtzahl der
  Anteile `3`.
stages.0.objectives.1.text: Die Workstation-Datei `~/quest/unseal-shares.json` enthält genau zwei unterschiedliche
  Zeichenfolgen als Anteile und hat Modus `0600`.
stages.0.objectives.2.text: Die Identität des bereitgestellten `VAULT_READER_TOKEN` liest den Wert `north-secret`
  aus Vault `secret/data/dispatch`.
