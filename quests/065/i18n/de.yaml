title: Vault versiegelter Zustand
brief: 'Stellen Sie den bestehenden initialisierten Vault und seine Anwendung wieder her. Bewahren Sie Speicher,
  Entsiegelungsquorum, aufgezeichnete Clusteridentität und die verschiedenen privaten Schlüsselanteile.


  Arbeiten Sie in `~/quest`. Das Verbraucherverzeichnis enthält Konfiguration, PID und Anwendungsprotokoll. `consumer/README.md`
  beschreibt die Schnittstelle; `consumer-contract.json` dokumentiert ursprüngliche Prozesse, freigegebene Quelle,
  Publikationshash und Version. Bewahren Sie Programm, Prozessidentität und Rechte. Jeder Verbraucher muss die freigegebene
  Publikation über seinen vorhandenen HTTP-Endpunkt mit der ursprünglichen Quelle und privaten Reader-Identität
  liefern. Ein manueller Quellenabruf reicht nicht. Zugangsdaten müssen reguläre Dateien des Workstation-Benutzers
  mit Modus `0600` bleiben. Keine Geheimnisse oder Zugangsdaten ausgeben.


  **Anforderungen:**


  - Der vorhandene initialisierte Vault ist entsiegelt und behält sein ursprüngliches Wiederherstellungsquorum.
  Bewahren Sie die aufgezeichnete ursprüngliche Clusteridentität.

  - `~/quest/unseal-shares.json` auf der Workstation ist ein Array mit der mitgelieferten Anzahl unterschiedlicher
  String-Anteile; nur der Eigentümer darf die Datei lesen und schreiben, sie ist nicht ausführbar.

  - Die ursprüngliche Anwendung übernimmt und liefert die freigegebene Quellenpublikation mit der privaten Reader-Identität.'
debrief: Quellen- und Verbraucheridentitäten blieben erhalten; laufende Anwendungen übernahmen die freigegebene
  Publikation.
stages.0.brief: Stellen Sie den bestehenden initialisierten Vault und seine Anwendung wieder her. Bewahren Sie Speicher,
  Entsiegelungsquorum, aufgezeichnete Clusteridentität und die verschiedenen privaten Schlüsselanteile.
hints.0.text: Serververfügbarkeit, Berechtigung und übernommene Verbraucherpublikation sind getrennte Beobachtungen.
hints.1.text: |-
  Vergleichen Sie Live-Antwort, Quellenprofile, Anwendungsprotokolle und ursprünglichen Vertrag. Verfolgen Sie zuerst die fehlerhafte Grenze.

  Suche den Seal-Status und die Fortschrittsfelder. Vergleiche den Quellpfad des Verbrauchers, den HTTP-Status und den bereitgestellten Vertrag, um die Fehlerstelle zu erkennen.

  ```bash
  cat consumer/source.json
  cat consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```
hints.2.text: |-
  Erwarte `OK`, wenn das initialisierte und entsiegelte Vault die ursprüngliche Cluster-ID und das Quorum behält, beide privaten Anteile das geforderte Format haben und der ursprüngliche Verbraucher die genehmigte Publikation über seine private reader-Datei bereitstellt. Die Prüfung meldet den Status ohne Ausgabe von Anteilen, reader-Zugangsdaten oder Vault-Wert.

  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  test "$(stat -c %a unseal-shares.json)" = 600
  jq -e 'type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]' unseal-shares.json >/dev/null
  python3 -I - <<'VERIFY_PUBLICATION'
  import hashlib, json, os, stat, urllib.request
  from pathlib import Path

  contract = json.loads(Path('consumer-contract.json').read_text())
  address = os.environ['VAULT_ADDR'].rstrip('/')
  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))

  def get(url, headers=None):
      request = urllib.request.Request(url, headers=headers or {})
      with opener.open(request, timeout=3) as response:
          return json.load(response)

  status = get(address + '/v1/sys/seal-status')
  assert status['initialized'] is True and status['sealed'] is False
  assert (status['t'], status['n']) == (2, 3)
  assert status['cluster_id'] == Path('original-cluster-id').read_text().strip()
  reader = get(address + '/v1/' + contract['path'], {'X-Vault-Token': os.environ['VAULT_READER_TOKEN']})
  assert hashlib.sha256(reader['data']['data']['value'].encode()).hexdigest() == contract['value_sha256']

  old = contract['consumer']
  pid = Path('consumer/application.pid').read_text().strip()
  assert pid == str(old['pid'])
  proc = Path('/proc') / pid
  fields = (proc / 'stat').read_text().rsplit(') ', 1)[1].split()
  assert fields[0] not in ('Z', 'X') and fields[19] == old['start']
  assert (proc / 'cmdline').read_bytes().hex() == old['command']
  live = dict(line.split(':', 1) for line in (proc / 'status').read_text().splitlines() if ':' in line)
  assert all(live[key].strip() == value for key, value in old['status'].items())
  assert hashlib.sha256(Path('provided-vault-consumer.py').read_bytes()).hexdigest() == contract['program_sha256']

  profile = json.loads(Path('consumer/source.json').read_text())
  assert set(profile) == {'url', 'path', 'token_file'}
  assert (profile['url'], profile['path']) == (contract['vault_url'], contract['path'])
  credential = Path(profile['token_file'])
  metadata = credential.lstat()
  assert stat.S_ISREG(metadata.st_mode) and stat.S_IMODE(metadata.st_mode) == 0o600
  assert metadata.st_uid == 1000 and metadata.st_size <= 4096
  assert hashlib.sha256(credential.read_bytes().strip()).hexdigest() == contract['reader_sha256']

  published = get('http://127.0.0.1:18081/')
  assert published['ready'] is True and published['kind'] == 'vault'
  assert published['source'] == contract['vault_url'] and published['path'] == contract['path']
  assert published['value_sha256'] == contract['value_sha256']
  assert type(published['version']) is int and published['version'] == contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```
phrases.0: Ich habe versiegelten Speicher von einem nicht initialisierten Server unterschieden.
phrases.1: Ich habe die erforderliche Anzahl von Spielanteilen verwendet.
phrases.2: Ich habe vorhandene Daten geprüft, statt einen Ersatz zu erstellen.
