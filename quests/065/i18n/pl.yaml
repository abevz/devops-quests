  liczbą różnych udziałów tekstowych; tylko właściciel może go czytać i zapisywać, a plik nie jest wykonywalny.
stages.0.objectives.2.text: Dostarczona tożsamość czytelnika może odczytać istniejącą konfigurację dyspozytorską
  z pierwotnego magazynu Vault.
