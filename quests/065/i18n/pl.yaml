title: Vault w stanie zamkniętym
brief: 'Odzyskaj istniejący zainicjalizowany Vault i jego aplikację, zachowując magazyn, kworum, zapisaną tożsamość
  klastra i różne prywatne udziały klucza.


  Pracuj w `~/quest`. Katalog konsumenta zawiera konfigurację, PID i dziennik aplikacji. `consumer/README.md` opisuje
  interfejs; `consumer-contract.json` zapisuje pierwotne procesy, zatwierdzone źródło, skrót publikacji i wersję.
  Zachowaj programy, tożsamości i uprawnienia procesów. Każdy konsument ma udostępniać zatwierdzoną publikację przez
  istniejący HTTP, z pierwotnego źródła i dostarczoną prywatną tożsamością reader. Ręczny odczyt źródła nie wystarcza.
  Dane uwierzytelniające muszą być zwykłymi plikami użytkownika workstation z trybem `0600`. Nie wypisuj sekretów
  ani danych uwierzytelniających.


  **Wymagania:**


  - Istniejący zainicjalizowany Vault jest odpieczętowany i zachowuje pierwotne kworum odzyskiwania. Zachowaj zapisaną
  pierwotną tożsamość klastra.

  - Plik `~/quest/unseal-shares.json` na stacji roboczej jest tablicą z dostarczoną liczbą różnych udziałów tekstowych;
  tylko właściciel może go czytać i zapisywać, a plik nie jest wykonywalny.

  - Pierwotna aplikacja przyjmuje i udostępnia zatwierdzoną publikację z dostarczoną prywatną tożsamością reader.'
debrief: Zachowano tożsamości źródła i konsumentów; aplikacje przyjęły zatwierdzoną publikację.
stages.0.brief: Odzyskaj istniejący zainicjalizowany Vault i jego aplikację, zachowując magazyn, kworum, zapisaną
  tożsamość klastra i różne prywatne udziały klucza.
hints.0.text: Dostępność serwera, autoryzacja i publikacja przyjęta przez konsumenta są odrębnymi obserwacjami.
hints.1.text: 'Porównaj odpowiedź usługi, profile źródeł, dzienniki aplikacji i pierwotny kontrakt. Najpierw prześledź
  pierwszą uszkodzoną granicę.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```'
hints.2.text: 'Postęp unseal wymaga różnych dostarczonych udziałów; ponowne wysłanie tego samego udziału nie dodaje
  postępu.


  Wyślij dwa różne dostarczone udziały do /v1/sys/unseal i odczytaj istniejącą wartość KV pierwotnym tokenem dostępu.
  Nigdy nie wyświetlaj udziałów ani tokenów, nie inicjalizuj ponownie magazynu i nie twórz zastępczego sekretu.


  Sprawdź obserwowany wynik:


  - `ls -l unseal-shares.json; jq -e ''type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]''
  unseal-shares.json` — Tryb `-rw-------` i `true`, bez wyświetlania udziałów.

  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n}''` — Zgłasza
  initialized `true`, sealed `false`, `t=2`, `n=3`.

  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Wypisuje `true`, bez wyświetlania odpowiedzi z sekretem.


  Dopasuj profil do zatwierdzonego API i danych reader. Zachowaj prywatność pliku i wyślij SIGHUP do istniejącego
  PID; manager to inna tożsamość. Sprawdź publikację HTTP. Oczekiwane: OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```'
phrases.0: Odróżniłem zapieczętowany magazyn od niezainicjowanego serwera.
phrases.1: Użyłem wymaganej liczby udziałów przeznaczonych wyłącznie do gry.
phrases.2: Sprawdziłem istniejące dane zamiast tworzyć zamiennik.
diagnostics.initialized: Vault sys/seal-status initialized musi wynosić true.
diagnostics.sealed: Vault sys/seal-status sealed musi wynosić false.
diagnostics.threshold: Vault sys/seal-status t musi wynosić 2.
diagnostics.shares: Vault sys/seal-status n musi wynosić 3.
diagnostics.mode: Uprawnienia unseal-shares.json muszą wynosić 0600.
diagnostics.array: unseal-shares.json musi być tablicą.
diagnostics.length: unseal-shares.json musi być tablicą o długości 2.
diagnostics.types: Każdy element tablicy unseal-shares.json musi być ciągiem znaków.
diagnostics.distinct: unseal-shares.json musi być tablicą dwóch różnych elementów.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
stages.0.objectives.0.text: Istniejący zainicjalizowany Vault jest odpieczętowany i zachowuje pierwotne kworum odzyskiwania.
  Zachowaj zapisaną pierwotną tożsamość klastra.
stages.0.objectives.1.text: Plik `~/quest/unseal-shares.json` na stacji roboczej jest tablicą z dostarczoną liczbą
  różnych udziałów tekstowych; tylko właściciel może go czytać i zapisywać, a plik nie jest wykonywalny.
stages.0.objectives.2.text: Pierwotna aplikacja przyjmuje i udostępnia zatwierdzoną publikację z dostarczoną prywatną
  tożsamością reader.
diagnostics.probe_0_0: Tożsamość klastra Vault musi odpowiadać pierwotnemu zapisowi; porównaj status seal i original-cluster-id.
diagnostics.probe_0_2: Pierwotna aplikacja musi przyjąć zatwierdzone API z prywatną tożsamością reader. Porównaj
  profil, zapis procesu i publikację HTTP.
guides.reference_1: Sprawdź odpowiednie API Vault
