title: Vault w stanie zamkniętym
brief: |
  Dostarczona tożsamość Vault nie może odczytać wymaganej konfiguracji.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `unseal-shares.json`, `initial-seal-status.json`.

  **Wymagania:**
  - Ćwiczebny Vault pod `VAULT_ADDR` z `platform.env` na workstation:
    - `initialized`: `true`; `sealed`: `false`.
    - Próg: `2`.
    - Łączna liczba udziałów: `3`.
  - Plik na workstation:
    - Ścieżka: `~/quest/unseal-shares.json`.
    - Tablica JSON z dokładnie dwoma różnymi ciągami znaków.
    - Tryb dostępu: `0600`.
  - Ćwiczebny Vault pod `VAULT_ADDR` z `platform.env` na workstation:
    - Tożsamość dostarczonego `VAULT_READER_TOKEN` odczytuje `north-secret` pod KV-v2 `secret/data/dispatch`.

  **Sprawdź przed Check & finish:**
  - `ls -l unseal-shares.json; jq -e 'type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]' unseal-shares.json` — Tryb `-rw-------` i `true`, bez wyświetlania udziałów.
  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n}'` — Zgłasza initialized `true`, sealed `false`, `t=2`, `n=3`.
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Wypisuje `true`, bez wyświetlania odpowiedzi z sekretem.

  Sprawdzenie obserwuje bieżący stan seal, właściwości pliku i dostęp; nie dowodzi historii magazynu.
debrief: Stan Vault gry, plik udziałów i dostęp reader odpowiadały kontrolom odzyskiwania.
stages.0.brief: Istniejąca konfiguracja Vault musi być czytelna przy prywatnych danych odzyskiwania.
hints.0.text: Zapieczętowany i niezainicjowany to różne stany.
hints.1.text: Postęp unseal wymaga różnych dostarczonych udziałów; ponowne wysłanie tego samego udziału nie dodaje
  postępu.
hints.2.text: Wyślij dwa różne dostarczone udziały do /v1/sys/unseal i odczytaj istniejącą wartość KV pierwotnym
  tokenem dostępu. Nigdy nie wyświetlaj udziałów ani tokenów, nie inicjalizuj ponownie magazynu i nie twórz zastępczego
  sekretu.
phrases.0: Odróżniłem zapieczętowany magazyn od niezainicjowanego serwera.
phrases.1: Użyłem wymaganej liczby udziałów przeznaczonych wyłącznie do gry.
phrases.2: Sprawdziłem istniejące dane zamiast tworzyć zamiennik.
diagnostics.initialized: Vault sys/seal-status initialized musi wynosić true.
diagnostics.sealed: Vault sys/seal-status sealed musi wynosić false.
diagnostics.threshold: Vault sys/seal-status t musi wynosić 2.
diagnostics.shares: Vault sys/seal-status n musi wynosić 3.
diagnostics.mode: Uprawnienia unseal-shares.json muszą wynosić 0600.
diagnostics.array: unseal-shares.json musi być tablicą.
diagnostics.length: unseal-shares.json musi być tablicą o długości 2.
diagnostics.types: Każdy element tablicy unseal-shares.json musi być ciągiem znaków.
diagnostics.distinct: unseal-shares.json musi być tablicą dwóch różnych elementów.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
stages.0.objectives.0.text: Vault zgłasza initialized `true`, sealed `false`, próg `2` i łączną liczbę udziałów
  `3`.
stages.0.objectives.1.text: Plik `~/quest/unseal-shares.json` na workstation zawiera dokładnie dwa różne udziały
  tekstowe i ma tryb `0600`.
stages.0.objectives.2.text: Tożsamość dostarczonego `VAULT_READER_TOKEN` odczytuje wartość `north-secret` z Vault
  `secret/data/dispatch`.
