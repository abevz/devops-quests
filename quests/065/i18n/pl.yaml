title: Vault w stanie zamkniętym
brief: 'Pracuj w `~/quest` z `platform.env`, `unseal-shares.json`, `initial-seal-status.json` i `reader.hcl`. Jednorazowy
  Vault gry jest zainicjowany, ale zapieczętowany; sekret dispatch już istnieje. Dostarczono dwa różne udziały gry. Nigdy
  nie wypisuj udziałów ani tokenów, nie inicjuj ponownie magazynu i nie twórz zastępczego sekretu. Połączony przewodnik odzyskiwania
  Vault wyjaśnia API unseal i odczyt KV-v2.


  Zachowaj `unseal-shares.json` jako tablicę JSON dokładnie dwóch ciągów z trybem `0600`. Prześlij dwa różne udziały do `/v1/sys/unseal`.
  Sprawdź, czy `/v1/sys/seal-status` podaje `initialized=true`, `sealed=false`, próg `t=2` i liczbę udziałów `n=3`. Dostarczonym
  tokenem reader odczytaj KV-v2 `secret/data/dispatch`: `.data.data.value` musi wynosić `north-secret`. Kontrola obserwuje
  bieżący stan, właściwości pliku i dostęp; nie dowodzi historii magazynu. Korzystaj tylko z zatoki gry offline.'
debrief: Stan Vault gry, plik udziałów i dostęp reader odpowiadały kontrolom odzyskiwania.
stages.0.brief: Stan pieczęci, plik udziałów i dostęp reader odpowiadają opisowi.
stages.0.objectives.0.text: Stan pieczęci, plik udziałów i dostęp reader odpowiadają opisowi.
hints.0.text: Zapieczętowany i niezainicjowany to różne stany.
hints.1.text: Punkt seal-status podaje próg i postęp bez uprawnień root.
hints.2.text: Prześlij dwa różne dostarczone udziały i odczytaj istniejącą wartość KV oryginalnym tokenem reader.
phrases.0: Odróżniłem zapieczętowany magazyn od niezainicjowanego serwera.
phrases.1: Użyłem wymaganej liczby udziałów przeznaczonych wyłącznie do gry.
phrases.2: Sprawdziłem istniejące dane zamiast tworzyć zamiennik.
diagnostics.initialized: Vault sys/seal-status initialized musi wynosić true.
diagnostics.sealed: Vault sys/seal-status sealed musi wynosić false.
diagnostics.threshold: Vault sys/seal-status t musi wynosić 2.
diagnostics.shares: Vault sys/seal-status n musi wynosić 3.
diagnostics.mode: Uprawnienia unseal-shares.json muszą wynosić 0600.
diagnostics.array: unseal-shares.json musi być tablicą.
diagnostics.length: unseal-shares.json musi być tablicą o długości 2.
diagnostics.types: Każdy element tablicy unseal-shares.json musi być ciągiem znaków.
diagnostics.distinct: unseal-shares.json musi być tablicą dwóch różnych elementów.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
