title: Vault w stanie zamkniętym
brief: 'Gra Vault została zainicjowana, ale sealed; zapisana wartość dispatch już istnieje. Dwa z trzech
  jednorazowych kluczy do gier są dostarczane w unseal-shares.json (threshold dwa). Prześlij oba odrębne
  udziały do ​​/v1/sys/unseal bez ponownego inicjowania storage lub tworzenia nowego sekretu. Nigdy nie
  wypisuj udziałów klucza unseal. W tej wnęce nie ma zależności produkcyjnej Vault ani klastra. Potwierdź,
  że oryginalny reader token nadal pobiera istniejącą wartość dispatch.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `unseal-shares.json`,
  `initial-seal-status.json`, `unseal-status.json`, `reader.hcl`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Oryginalna, zainicjalizowana gra Vault zostaje rozpieczętowana za pomocą
  threshold dwa; istniejący reader i zapisana wartość nadal działają.'
debrief: Odblokowanie odzyskanego dostępu do istniejącego zaszyfrowanego storage bez resetowania identity
  lub danych.
stages.0.brief: 'Kryteria sukcesu: Oryginalna, zainicjalizowana gra Vault zostaje rozpieczętowana za pomocą
  threshold dwa; istniejący reader i zapisana wartość nadal działają.'
stages.0.objectives.0.text: Oryginalna, zainicjowana gra Vault została rozpieczętowana za pomocą threshold
  dwa; istniejący reader i zapisana wartość nadal działają.
hints.0.text: Sealed i uninitialized to różne stany.
hints.1.text: Endpoint seal-status zwraca threshold i progress bez uprawnień root.
hints.2.text: Prześlij dwa różne dostarczone udziały i odczytaj istniejącą wartość KV z oryginalnym reader
  token.
phrases.0: Odróżniłem sealed storage od niezainicjowanego serwera.
phrases.1: Użyłem wymaganych udziałów threshold przeznaczonych tylko do gier.
phrases.2: Zamiast tworzyć zamiennik, zweryfikowałem istniejące dane.
