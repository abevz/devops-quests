title: Vault sealed state
brief: 'Recover the existing initialized Vault and its application without replacing storage or changing the recovery
  quorum. Preserve its recorded cluster identity and supplied private, distinct recovery shares.


  Work in `~/quest`. The supplied consumer directory contains its configuration, process receipt and application
  log. `consumer/README.md` describes the application interface; `consumer-contract.json` records the original processes,
  approved source identity, publication digest and version. Preserve the original application programs, process
  identities and privileges. Each consumer must serve the approved publication through its existing HTTP endpoint
  using the original source and private supplied reader identity; a successful manual source request is insufficient.
  Keep credential files regular, owned by the workstation user, with mode `0600`. Do not print credentials or secret
  values.


  **Requirements:**


  - The existing initialized Vault is unsealed and retains its original recovery quorum. Preserve the recorded original
  cluster identity.

  - Workstation `~/quest/unseal-shares.json` is an array with the supplied number of distinct string shares, readable
  and writable only by its owner and not executable.

  - The original application adopts and serves the approved source publication with the private supplied reader
  identity.'
debrief: The original source and consumer identities were preserved, and the running applications adopted the approved
  publication.
stages.0.brief: Recover the existing initialized Vault and its application without replacing storage or changing
  the recovery quorum. Preserve its recorded cluster identity and supplied private, distinct recovery shares.
hints.0.text: Server availability, authorization and a consumer’s adopted publication are different observations.
hints.1.text: |-
  Compare the live service response, source profiles, application logs and original contract. Trace the first failing boundary before changing another component.

  Locate the seal status and its progress fields. Compare the consumer’s source path, the response status and the supplied contract to see which boundary is failing.

  ```bash
  cat consumer/source.json
  cat consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```
hints.2.text: |-
  Expect `OK` when the initialized, unsealed Vault has the original cluster ID and quorum, both private shares have the required shape, and the original consumer serves the approved publication through its private reader file. The test reports status without displaying the shares, reader credential or returned Vault value.

  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  test "$(stat -c %a unseal-shares.json)" = 600
  jq -e 'type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]' unseal-shares.json >/dev/null
  python3 -I - <<'VERIFY_PUBLICATION'
  import hashlib, json, os, stat, urllib.request
  from pathlib import Path

  contract = json.loads(Path('consumer-contract.json').read_text())
  address = os.environ['VAULT_ADDR'].rstrip('/')
  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))

  def get(url, headers=None):
      request = urllib.request.Request(url, headers=headers or {})
      with opener.open(request, timeout=3) as response:
          return json.load(response)

  status = get(address + '/v1/sys/seal-status')
  assert status['initialized'] is True and status['sealed'] is False
  assert (status['t'], status['n']) == (2, 3)
  assert status['cluster_id'] == Path('original-cluster-id').read_text().strip()
  reader = get(address + '/v1/' + contract['path'], {'X-Vault-Token': os.environ['VAULT_READER_TOKEN']})
  assert hashlib.sha256(reader['data']['data']['value'].encode()).hexdigest() == contract['value_sha256']

  old = contract['consumer']
  pid = Path('consumer/application.pid').read_text().strip()
  assert pid == str(old['pid'])
  proc = Path('/proc') / pid
  fields = (proc / 'stat').read_text().rsplit(') ', 1)[1].split()
  assert fields[0] not in ('Z', 'X') and fields[19] == old['start']
  assert (proc / 'cmdline').read_bytes().hex() == old['command']
  live = dict(line.split(':', 1) for line in (proc / 'status').read_text().splitlines() if ':' in line)
  assert all(live[key].strip() == value for key, value in old['status'].items())
  assert hashlib.sha256(Path('provided-vault-consumer.py').read_bytes()).hexdigest() == contract['program_sha256']

  profile = json.loads(Path('consumer/source.json').read_text())
  assert set(profile) == {'url', 'path', 'token_file'}
  assert (profile['url'], profile['path']) == (contract['vault_url'], contract['path'])
  credential = Path(profile['token_file'])
  metadata = credential.lstat()
  assert stat.S_ISREG(metadata.st_mode) and stat.S_IMODE(metadata.st_mode) == 0o600
  assert metadata.st_uid == 1000 and metadata.st_size <= 4096
  assert hashlib.sha256(credential.read_bytes().strip()).hexdigest() == contract['reader_sha256']

  published = get('http://127.0.0.1:18081/')
  assert published['ready'] is True and published['kind'] == 'vault'
  assert published['source'] == contract['vault_url'] and published['path'] == contract['path']
  assert published['value_sha256'] == contract['value_sha256']
  assert type(published['version']) is int and published['version'] == contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```
phrases.0: I distinguished sealed storage from an uninitialized server.
phrases.1: I used the required threshold of game-only shares.
phrases.2: I verified existing data rather than creating a replacement.
stages.0.objectives.0.text: The existing initialized Vault is unsealed and retains its original recovery quorum.
  Preserve the recorded original cluster identity.
stages.0.objectives.1.text: Workstation `~/quest/unseal-shares.json` is an array with the supplied number of distinct
  string shares, readable and writable only by its owner and not executable.
stages.0.objectives.2.text: The original application adopts and serves the approved source publication with the
  private supplied reader identity.
guides.reference_1: Inspect the relevant Vault API
guides.reference_2: Publication and consumer verification reference
diagnostics.initialized: The status did not confirm initialized=true; the selected address may reach an empty/replacement store, or the status response may be unavailable or invalid. The supplied Vault was already initialized. [Cause and check](guides#guide=vault-recovery&section=sealed-existing-initialized-store)
diagnostics.sealed: The status did not confirm sealed=false; fewer than two distinct supplied shares may have been submitted, the same share may have been repeated, or the status request failed. [Cause and check](guides#guide=vault-recovery&section=sealed-distinct-unseal-progress)
diagnostics.threshold: The status did not confirm t=2; changed initialization/rekey settings, another endpoint or an unreadable response can hide the original recovery threshold. [Cause and check](guides#guide=vault-recovery&section=sealed-original-recovery-threshold)
diagnostics.shares: The status did not confirm n=3; a different initialization/rekey configuration, wrong endpoint or failed status observation can differ from the original total share count. [Cause and check](guides#guide=vault-recovery&section=sealed-original-share-count)
diagnostics.probe_0_0: The original Vault cluster identity was not verified; reinitializing/replacing storage changes the cluster ID, while missing protected evidence, an unavailable original endpoint or probe startup can also prevent comparison. [Cause and check](guides#guide=vault-recovery&section=sealed-original-cluster-identity)
diagnostics.mode: unseal-shares.json did not report mode 600 or could not be inspected; copying or recreating the recovery file with broader or executable permissions can expose the supplied shares. [Cause and check](guides#guide=vault-recovery&section=sealed-private-share-permissions)
diagnostics.array: unseal-shares.json is not a readable JSON array; a whole initialization response, a single raw share or malformed JSON can replace the supplied array shape. [Cause and check](guides#guide=vault-recovery&section=sealed-share-array-shape)
diagnostics.length: The recovery array does not contain exactly two entries or cannot be parsed; copying all three initialized shares, dropping one or changing the file structure can violate the supplied recovery-file contract. [Cause and check](guides#guide=vault-recovery&section=sealed-two-retained-shares)
diagnostics.types: The recovery entries are not all JSON strings or the array cannot be read; numbers, objects or an incorrectly wrapped initialization result do not preserve the supplied string-share representation. [Cause and check](guides#guide=vault-recovery&section=sealed-string-share-entries)
diagnostics.distinct: The two recovery entries are not distinct or their array is invalid; duplicating one supplied share cannot provide two different contributions to unsealing. [Cause and check](guides#guide=vault-recovery&section=sealed-distinct-share-file)
diagnostics.reader: The supplied reader did not read north-secret from secret/data/dispatch; Vault may remain sealed, the environment/token/path may differ from the supplied source, or the API/JSON observation may have failed. [Cause and check](guides#guide=vault-recovery&section=sealed-approved-reader-api)
diagnostics.probe_0_2: The original consumer did not verify the approved Vault publication under the private reader identity; its file may still hold the supplied manager credential or its failure cache may be stale, while changed process/program/configuration, token custody or unavailable observations can also explain it. [Cause and check](guides#guide=vault-recovery&section=sealed-original-consumer-adoption)
