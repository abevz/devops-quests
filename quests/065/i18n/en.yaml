title: Vault sealed state
brief: |
  The supplied Vault identity cannot read the required configuration.

  Work on the workstation in `~/quest` with `platform.env`, `unseal-shares.json`, `initial-seal-status.json`.

  **Requirements:**
  - Game Vault at `VAULT_ADDR` from workstation `platform.env`:
    - `initialized`: `true`; `sealed`: `false`.
    - Threshold: `2`.
    - Total shares: `3`.
  - File on the workstation:
    - Path: `~/quest/unseal-shares.json`.
    - A JSON array of exactly two distinct strings.
    - Access mode: `0600`.
  - Game Vault at `VAULT_ADDR` from workstation `platform.env`:
    - The supplied `VAULT_READER_TOKEN` identity reads `north-secret` at KV-v2 `secret/data/dispatch`.

  **Verify yourself before Check & finish:**
  - `ls -l unseal-shares.json; jq -e 'type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]' unseal-shares.json` — Mode `-rw-------` and `true`, without displaying shares.
  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n}'` — Reports initialized `true`, sealed `false`, `t=2`, `n=3`.
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Prints `true`, without displaying the secret response.

  The check observes current seal status, file properties and access; it does not prove storage history.
debrief: The game Vault status, share file and reader access matched the recovery checks.
stages.0.brief: The existing Vault configuration must be readable with private recovery evidence.
hints.0.text: Sealed and uninitialized are different states.
hints.1.text: Unseal progress needs distinct supplied shares; submitting the same share twice adds no progress.
hints.2.text: Submit two distinct supplied shares to /v1/sys/unseal and read the existing KV value with the original
  access token. Never print shares or tokens, reinitialize storage, or create a replacement secret.
phrases.0: I distinguished sealed storage from an uninitialized server.
phrases.1: I used the required threshold of game-only shares.
phrases.2: I verified existing data rather than creating a replacement.
diagnostics.initialized: Vault sys/seal-status initialized must be true.
diagnostics.sealed: Vault sys/seal-status sealed must be false.
diagnostics.threshold: Vault sys/seal-status t must be 2.
diagnostics.shares: Vault sys/seal-status n must be 3.
diagnostics.mode: unseal-shares.json mode must be 0600.
diagnostics.array: unseal-shares.json must be an array.
diagnostics.length: unseal-shares.json must be an array of length 2.
diagnostics.types: Every unseal-shares.json array entry must be a string.
diagnostics.distinct: unseal-shares.json must be an array of two distinct entries.
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
stages.0.objectives.0.text: Vault reports initialized `true`, sealed `false`, threshold `2` and total share count
  `3`.
stages.0.objectives.1.text: Workstation `~/quest/unseal-shares.json` contains exactly two distinct string shares
  and has mode `0600`.
stages.0.objectives.2.text: The supplied `VAULT_READER_TOKEN` identity reads value `north-secret` from Vault `secret/data/dispatch`.
