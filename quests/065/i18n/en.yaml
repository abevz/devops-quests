title: Vault sealed state
brief: 'The supplied Vault identity cannot read the required configuration.


  Work on the workstation in `~/quest` with `platform.env`, `unseal-shares.json`, `reader.hcl`.


  **Requirements:**

  - The existing initialized Vault is unsealed and retains its original recovery quorum.

  - Workstation `~/quest/unseal-shares.json` is an array with the supplied number of distinct string shares,
  readable and writable only by its owner and not executable.

  - The supplied access identity can read the existing dispatch configuration from the original Vault storage.


  The check observes current seal status, file properties and access; it does not prove storage history.

  '
debrief: The game Vault status, share file and reader access matched the recovery checks.
stages.0.brief: The existing Vault configuration must be readable with private recovery evidence.
hints.0.text: Sealed and uninitialized are different states.
hints.1.text: 'Inspect the supplied inputs and observed state:


  ```sh

  cat initial-seal-status.json reader.hcl

  source platform.env

  curl -fsS "$VAULT_ADDR/v1/sys/seal-status"

  ```'
hints.2.text: 'Unseal progress needs distinct supplied shares; submitting the same share twice adds no progress.


  Submit two distinct supplied shares to /v1/sys/unseal and read the existing KV value with the original access
  token. Never print shares or tokens, reinitialize storage, or create a replacement secret.


  Verify the observed result:


  - `ls -l unseal-shares.json; jq -e ''type=="array" and length==2 and all(.[];type=="string") and .[0]!=.[1]''
  unseal-shares.json` — Mode `-rw-------` and `true`, without displaying shares.

  - `source platform.env; curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n}''` — Reports
  initialized `true`, sealed `false`, `t=2`, `n=3`.

  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Prints `true`, without displaying the secret response.'
phrases.0: I distinguished sealed storage from an uninitialized server.
phrases.1: I used the required threshold of game-only shares.
phrases.2: I verified existing data rather than creating a replacement.
diagnostics.initialized: Vault sys/seal-status initialized must be true.
diagnostics.sealed: Vault sys/seal-status sealed must be false.
diagnostics.threshold: Vault sys/seal-status t must be 2.
diagnostics.shares: Vault sys/seal-status n must be 3.
diagnostics.mode: unseal-shares.json mode must be 0600.
diagnostics.array: unseal-shares.json must be an array.
diagnostics.length: unseal-shares.json must be an array of length 2.
diagnostics.types: Every unseal-shares.json array entry must be a string.
diagnostics.distinct: unseal-shares.json must be an array of two distinct entries.
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
stages.0.objectives.0.text: The existing initialized Vault is unsealed and retains its original recovery quorum.
stages.0.objectives.1.text: Workstation `~/quest/unseal-shares.json` is an array with the supplied number of
  distinct string shares, readable and writable only by its owner and not executable.
stages.0.objectives.2.text: The supplied access identity can read the existing dispatch configuration from
  the original Vault storage.
