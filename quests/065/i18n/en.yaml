title: Vault sealed state
brief: 'Work in `~/quest` with `platform.env`, `unseal-shares.json`, `initial-seal-status.json` and `reader.hcl`. This disposable game Vault is initialized but sealed, and its dispatch secret already exists. Two distinct game shares are supplied. Never print shares or tokens, reinitialize storage, or create a replacement secret. The linked Vault recovery guide explains the unseal API and KV-v2 read.


  Keep `unseal-shares.json` as a JSON array of exactly two strings with mode `0600`. Submit the two distinct shares to `/v1/sys/unseal`. Verify `/v1/sys/seal-status` reports `initialized=true`, `sealed=false`, threshold `t=2` and share count `n=3`. With the supplied reader token, read KV-v2 `secret/data/dispatch`: `.data.data.value` must equal `north-secret`. The check observes current status, file properties and access; it does not prove the storage history. Use only the offline game bay.'
debrief: The game Vault status, share file and reader access matched the recovery checks.
stages.0.brief: The seal status, share file and reader access match the brief.
stages.0.objectives.0.text: The seal status, share file and reader access match the brief.
hints.0.text: Sealed and uninitialized are different states.
hints.1.text: The seal-status endpoint reports threshold and progress without root
  authority.
hints.2.text: Submit two different supplied shares and read the existing KV value
  with the original reader token.
phrases.0: I distinguished sealed storage from an uninitialized server.
phrases.1: I used the required threshold of game-only shares.
phrases.2: I verified existing data rather than creating a replacement.
