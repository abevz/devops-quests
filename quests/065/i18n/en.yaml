title: Vault sealed state
brief: 'The game Vault is initialized but sealed; the stored dispatch value already
  exists. Two of its three disposable game key shares are supplied in unseal-shares.json
  (threshold two). Submit both distinct shares to /v1/sys/unseal without reinitializing
  storage or creating a new secret. Never print the shares. There is no production
  Vault or cluster dependency in this bay. Confirm that the original reader token
  still retrieves the existing dispatch value.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `unseal-shares.json`,
  `initial-seal-status.json`, `unseal-status.json`, `reader.hcl`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The original initialized game Vault is unsealed with threshold
  two; the existing reader and stored value still work.'
debrief: Unsealing recovered access to existing encrypted storage without resetting
  identity or data.
stages.0.brief: 'Success criteria: The original initialized game Vault is unsealed
  with threshold two; the existing reader and stored value still work.'
stages.0.objectives.0.text: The original initialized game Vault is unsealed with threshold
  two; the existing reader and stored value still work.
hints.0.text: Sealed and uninitialized are different states.
hints.1.text: The seal-status endpoint reports threshold and progress without root
  authority.
hints.2.text: Submit two different supplied shares and read the existing KV value
  with the original reader token.
phrases.0: I distinguished sealed storage from an uninitialized server.
phrases.1: I used the required threshold of game-only shares.
phrases.2: I verified existing data rather than creating a replacement.
