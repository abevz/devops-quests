title: Recuperación con estado de route
brief: "Los datos de shelf deben seguir disponibles para su cliente bajo una política de red acotada. El descubrimiento\
  \ y la conectividad aún están incompletos.\n\nTrabaja en `~/quest` en la estación de trabajo. Entradas por etapa:\n\
  - Etapa 1: `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - El\
  \ claim de datos existente conserva su identidad y no se recrea.\n  - El servicio de datos existente permite el\
  \ descubrimiento estable de Pods.\n  - El acceso saliente de la carga solicitante se limita a DNS y al servicio\
  \ de datos existente por TCP `8080`; ninguna otra política lo amplía.\n  - Desde el Deployment `client`, se resuelve\
  \ el nombre DNS estable del Pod de almacenamiento existente.\n  - Desde el Deployment `client`, el Pod de almacenamiento\
  \ existente sirve `ledger-120` en el puerto `8080`.\n\nLa comprobación observa identidad del claim, configuración\
  \ de políticas y conectividad actual, no todo el historial del almacenamiento."
debrief: La persistencia, discovery y el acceso a la red se verificaron de forma independiente antes de pasar la
  ruta completa.
stages.0.brief: Conserva el claim de datos original al recuperar el acceso acotado del cliente.
hints.0.text: Verifique el almacenamiento estable por separado de discovery y egress.
hints.1.text: 'Headless DNS depende del endpoints listo para combinar.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Etapa 1: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: |-
  Repare el selector, luego permita el DNS y solo el puerto shelf Pod.

  Verifica la etapa reparada y compara el resultado observado.

  Etapa 1: El UID actual del claim coincide con el UID original registrado.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Etapa 1: El cliente resuelve el nombre DNS completo del Pod shelf.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Etapa 1: El cliente recibe `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Observaciones esperadas para la etapa completa:
  - Etapa 1: El UID del claim no cambia, el Service `shelf` es headless y las políticas permiten solo el egress requerido.

phrases.0: Conservé el stateful claim durante la recuperación de la red.
phrases.1: Verifiqué ordinal DNS del client aislado.
phrases.2: Restauré solo los flujos de dependencia requeridos.
questions.0.points.0: Sí; discovery, endpoints y network policy son capas independientes.
questions.0.points.1: Pruebe cada límite antes de reemplazar datos.
questions.0.prompt: ¿Puede coexistir un almacenamiento saludable con un acceso interrumpido a las aplicaciones?
questions.1.points.0: Reemplazar el almacenamiento no repara un selector ni una regla de salida.
questions.1.points.1: El reemplazo innecesario puede destruir los datos recuperables.
questions.1.prompt: ¿Por qué preservar PVC identity durante un incidente de red?
stages.0.objectives.0.text: El claim de datos existente conserva su identidad y no se recrea.
stages.0.objectives.1.text: El servicio de datos existente permite el descubrimiento estable de Pods.
stages.0.objectives.2.text: El acceso saliente de la carga solicitante se limita a DNS y al servicio de datos existente
  por TCP `8080`; ninguna otra política lo amplía.
stages.0.objectives.3.text: Desde el Deployment `client`, se resuelve el nombre DNS estable del Pod de almacenamiento
  existente.
stages.0.objectives.4.text: Desde el Deployment `client`, el Pod de almacenamiento existente sirve `ledger-120`
  en el puerto `8080`.
diagnostics.policies: La comprobación no pudo listar las NetworkPolicy. Revise el acceso al namespace y al API antes de interpretar las políticas. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-egress-policy-list)
diagnostics.pods: El inventario de Pods client puede faltar o estar vacío. Compruebe la presencia de Pods app=client antes de evaluar el selector. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-egress-client-label-input)
diagnostics.named: La política client-egress puede faltar o no ser legible. Revise la NetworkPolicy por nombre en el namespace de client. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-client-egress-policy-object)
diagnostics.egress: Una regla egress puede omitir destino o puerto, usar un par ajeno o no resolver un puerto nombrado de shelf. Revise los pares DNS y los puertos individuales permitidos para shelf-0. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-bounded-egress-peer-and-port)
diagnostics.unexpected: Una regla válida en apariencia puede permitir un protocolo o puerto adicional. Compare cada tupla de destino, protocolo y puerto con los flujos requeridos de DNS y shelf. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-egress-unexpected-flow)
diagnostics.other_egress: Otra política egress que seleccione un Pod client puede agregar un flujo prohibido porque los permisos se acumulan. Revise la política indicada y compare sus flujos con el conjunto exigido. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-additive-egress-policy)
diagnostics.other_invalid: No se pudo interpretar de forma segura el selector o egress de otra política. Revise el objeto indicado en busca de selectores incompatibles o destinos amplios antes de evaluar el acceso. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-unreadable-additive-policy)
diagnostics.missing_dns_udp_53: La política puede omitir UDP 53 hacia los Pods DNS del clúster. Revise el par con kube-system y kube-dns y el puerto UDP correspondiente. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: DNS por UDP puede estar permitido mientras falta TCP 53. Compruebe el permiso TCP 53 para el mismo par DNS. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-client-egress-dns-tcp)
diagnostics.missing_shelf_tcp_8080: Los permisos DNS no habilitan el acceso a la carga. La política puede carecer de TCP 8080 hacia Pods shelf locales. Revise el par app=shelf y su puerto. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-client-egress-shelf-http)
diagnostics.probe_0_2: El observador puede detenerse antes de señalar una condición si falla el proceso o la entrada. Revise Python y las observaciones actuales de la política y los Pods. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-egress-policy-observer-input)
diagnostics.pvc: El PVC del registro puede faltar o tener otro UID tras ser recreado. Compare el UID activo de ledger-shelf-0 con el registro fijado antes de corregir Service y política. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-shelf-retained-ledger-pvc)
diagnostics.shelf_service: El Service shelf puede tener una dirección virtual o seleccionar otro Pod. Mantenga clusterIP en None y compare app=shelf y sus etiquetas adicionales con las etiquetas reales de shelf-0. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-shelf-headless-ordinal-source)
diagnostics.selector: La política puede seleccionar Pods ajenos u omitir algunos Pods client actuales. Compruebe que el selector exija app=client y coincida con todos los Pods client observados. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-client-policy-selector-coverage)
diagnostics.types: La política puede declarar solo entrada u omitir el tipo Egress. Compruebe que los tipos de client-egress incluyan Egress. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-client-policy-egress-type)
diagnostics.dns: El Service headless puede no publicar shelf-0, o el client activo puede carecer de salida DNS. Compruebe la consulta A por el nombre ordinal completo desde client. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-live-shelf-ordinal-dns)
diagnostics.http: El DNS ordinal puede funcionar aunque TCP 8080 siga bloqueado o el endpoint shelf sirva otro contenido. Consulte shelf-0.shelf:8080 desde client y compare con ledger-120. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-live-client-ledger-response)
diagnostics.probe_0_1: La comprobación del Service headless puede terminar antes de señalar una condición si no inicia el proceso. Revise las herramientas y el acceso a objetos shelf. [Causa y comprobación](guides#guide=kubernetes-10&section=q120-shelf-service-observer-input)
