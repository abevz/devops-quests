title: Recuperación con estado de route
brief: "Los datos de shelf deben seguir disponibles para su cliente bajo una política de red acotada. El descubrimiento\
  \ y la conectividad aún están incompletos.\n\nTrabaja en `~/quest` en la estación de trabajo. Entradas por etapa:\n\
  - Etapa 1: `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - El\
  \ claim de datos existente conserva su identidad y no se recrea.\n  - El servicio de datos existente permite el\
  \ descubrimiento estable de Pods.\n  - El acceso saliente de la carga solicitante se limita a DNS y al servicio\
  \ de datos existente por TCP `8080`; ninguna otra política lo amplía.\n  - Desde el Deployment `client`, se resuelve\
  \ el nombre DNS estable del Pod de almacenamiento existente.\n  - Desde el Deployment `client`, el Pod de almacenamiento\
  \ existente sirve `ledger-120` en el puerto `8080`.\n\nLa comprobación observa identidad del claim, configuración\
  \ de políticas y conectividad actual, no todo el historial del almacenamiento."
debrief: La persistencia, discovery y el acceso a la red se verificaron de forma independiente antes de pasar la
  ruta completa.
stages.0.brief: Conserva el claim de datos original al recuperar el acceso acotado del cliente.
hints.0.text: Verifique el almacenamiento estable por separado de discovery y egress.
hints.1.text: 'Headless DNS depende del endpoints listo para combinar.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Etapa 1: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: |-
  Repare el selector, luego permita el DNS y solo el puerto shelf Pod.

  Verifica la etapa reparada y compara el resultado observado.

  Etapa 1: El UID actual del claim coincide con el UID original registrado.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Etapa 1: El cliente resuelve el nombre DNS completo del Pod shelf.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Etapa 1: El cliente recibe `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Observaciones esperadas para la etapa completa:
  - Etapa 1: El UID del claim no cambia, el Service `shelf` es headless y las políticas permiten solo el egress requerido.

phrases.0: Conservé el stateful claim durante la recuperación de la red.
phrases.1: Verifiqué ordinal DNS del client aislado.
phrases.2: Restauré solo los flujos de dependencia requeridos.
questions.0.points.0: Sí; discovery, endpoints y network policy son capas independientes.
questions.0.points.1: Pruebe cada límite antes de reemplazar datos.
questions.0.prompt: ¿Puede coexistir un almacenamiento saludable con un acceso interrumpido a las aplicaciones?
questions.1.points.0: Reemplazar el almacenamiento no repara un selector ni una regla de salida.
questions.1.points.1: El reemplazo innecesario puede destruir los datos recuperables.
questions.1.prompt: ¿Por qué preservar PVC identity durante un incidente de red?
diagnostics.pvc: original-pvc-uid no debe estar vacío y debe coincidir con el UID de ledger-shelf-0.
diagnostics.shelf_service: |-
  El Service headless shelf debe seleccionar el Pod de almacenamiento suministrado.

diagnostics.policies: La consulta de NetworkPolicies debe tener éxito.
diagnostics.pods: La consulta de Pods client debe tener éxito y devolver al menos un Pod.
diagnostics.dns: La consulta DNS de shelf-0.shelf desde client debe tener éxito.
diagnostics.http: La petición desde client a shelf-0.shelf:8080 debe devolver ledger-120.
diagnostics.named: Debe haber exactamente una NetworkPolicy llamada client-egress.
diagnostics.selector: |-
  La política egress debe cubrir cada Pod solicitante actual.

diagnostics.types: |-
  Egress permite solo DNS y el puerto de datos del shelf existente; otras políticas coincidentes no deben ampliar el acceso.

diagnostics.egress: |-
  Egress permite solo DNS y el puerto de datos del shelf existente; otras políticas coincidentes no deben ampliar el acceso.

diagnostics.unexpected: client-egress no debe tener tráfico inesperado; el diagnóstico original indica destino,
  protocolo y puerto.
diagnostics.other_egress: Otra NetworkPolicy que seleccione un cliente (client) no debe permitir salida adicional;
  su nombre aparece en el diagnóstico original.
diagnostics.other_invalid: Otra NetworkPolicy tiene selector o egress no válido; su nombre aparece en el diagnóstico
  original.
diagnostics.invalid_input: Las NetworkPolicies y las etiquetas de los Pods client deben poder leerse en el formato
  esperado.
diagnostics.missing_dns_udp_53: client-egress debe permitir dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress debe permitir dns TCP 53.
diagnostics.missing_shelf_tcp_8080: client-egress debe permitir shelf TCP 8080.
stages.0.objectives.0.text: El claim de datos existente conserva su identidad y no se recrea.
stages.0.objectives.1.text: El servicio de datos existente permite el descubrimiento estable de Pods.
stages.0.objectives.2.text: El acceso saliente de la carga solicitante se limita a DNS y al servicio de datos existente
  por TCP `8080`; ninguna otra política lo amplía.
stages.0.objectives.3.text: Desde el Deployment `client`, se resuelve el nombre DNS estable del Pod de almacenamiento
  existente.
stages.0.objectives.4.text: Desde el Deployment `client`, el Pod de almacenamiento existente sirve `ledger-120`
  en el puerto `8080`.
