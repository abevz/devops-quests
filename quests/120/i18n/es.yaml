title: Recuperación con estado de route
brief: 'El persistent shelf está en buen estado, pero el headless Service selecciona una etiqueta retired
  y el client no tiene excepciones de salida. Recupere ordinal DNS y el libro mayor HTTP reparando el
  headless selector y agregando solo el DNS y el shelf:8080. fluye. Conserve los PVC y ledger-120 existentes.
  Mantenga aislado el client; reemplazar la póliza con allow-all no cumple con el contrato.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `shelf.json`, `service.json`,
  `client.json`, `egress.json`, `original-pvc-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el client aislado resuelve shelf-0 y lee el libro mayor persistent original
  a través del headless Service.'
debrief: La persistencia, discovery y el acceso a la red se verificaron de forma independiente antes de
  pasar la ruta completa.
stages.0.brief: 'Criterios de éxito: el client aislado resuelve shelf-0 y lee el libro mayor persistent
  original a través del headless Service.'
stages.0.objectives.0.text: El client aislado resuelve shelf-0 y lee el libro mayor persistent original
  a través del headless Service.
hints.0.text: Verifique el almacenamiento estable por separado de discovery y egress.
hints.1.text: Headless DNS depende del endpoints listo para combinar.
hints.2.text: Repare el selector, luego permita el DNS y solo el puerto shelf Pod.
phrases.0: Conservé el stateful claim durante la recuperación de la red.
phrases.1: Verifiqué ordinal DNS del client aislado.
phrases.2: Restauré solo los flujos de dependencia requeridos.
questions.0.points.0: Sí; discovery, endpoints y network policy son capas independientes.
questions.0.points.1: Pruebe cada límite antes de reemplazar datos.
questions.0.prompt: ¿Puede coexistir un almacenamiento saludable con un acceso interrumpido a las aplicaciones?
questions.1.points.0: Reemplazar el almacenamiento no repara un selector ni una regla de salida.
questions.1.points.1: El reemplazo innecesario puede destruir los datos recuperables.
questions.1.prompt: ¿Por qué preservar PVC identity durante un incidente de red?
