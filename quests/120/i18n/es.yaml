title: Recuperación con estado de route
brief: 'Trabaja en `~/quest`; lee `shelf.json`, `service.json`, `client.json`, `egress.json` y `original-pvc-uid`. El almacenamiento
  de shelf existe, pero el selector del Service headless y la salida del cliente están dañados. Conserva el PVC original.
  La guía enlazada introduce el diagnóstico de red de Kubernetes.


  Haz que el Service `shelf` sea headless (`clusterIP: None`) con selector `app: shelf`. Configura `client-egress` con un
  `podSelector` que seleccione exactamente `app: client` y solo `Egress`; usa `matchLabels` o una expresión equivalente `In`
  de un valor: permite UDP y TCP 53 a un único destino que combine la etiqueta de namespace `kubernetes.io/metadata.name:
  kube-system` y la etiqueta de Pod `k8s-app: kube-dns`, y TCP 8080 a la etiqueta de Pod `app: shelf` en el mismo namespace.
  Estos selectores exactos identifican los destinos suministrados; puedes reordenar o dividir reglas y puertos. Otras políticas
  que seleccionen al cliente no deben ampliar la salida.


  Comprueba que el UID del PVC `ledger-shelf-0` coincide con `/run/dq/facts/0/original-pvc-uid`, que el DNS del cliente resuelve
  `shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.` y que HTTP del cliente a `shelf-0.shelf:8080` devuelve `ledger-120`. Las
  comprobaciones observan la identidad, la configuración de políticas y la conectividad actual, no toda la historia del almacenamiento.
  Trabaja solo en la bahía sin conexión.'
debrief: La persistencia, discovery y el acceso a la red se verificaron de forma independiente antes de pasar la ruta completa.
stages.0.brief: El UID original del PVC, el Service headless, la política de salida limitada, el DNS ordinal y la respuesta
  del ledger coinciden con el enunciado.
stages.0.objectives.0.text: El UID original del PVC, el Service headless, la política de salida limitada, el DNS ordinal y
  la respuesta del ledger coinciden con el enunciado.
hints.0.text: Verifique el almacenamiento estable por separado de discovery y egress.
hints.1.text: Headless DNS depende del endpoints listo para combinar.
hints.2.text: Repare el selector, luego permita el DNS y solo el puerto shelf Pod.
phrases.0: Conservé el stateful claim durante la recuperación de la red.
phrases.1: Verifiqué ordinal DNS del client aislado.
phrases.2: Restauré solo los flujos de dependencia requeridos.
questions.0.points.0: Sí; discovery, endpoints y network policy son capas independientes.
questions.0.points.1: Pruebe cada límite antes de reemplazar datos.
questions.0.prompt: ¿Puede coexistir un almacenamiento saludable con un acceso interrumpido a las aplicaciones?
questions.1.points.0: Reemplazar el almacenamiento no repara un selector ni una regla de salida.
questions.1.points.1: El reemplazo innecesario puede destruir los datos recuperables.
questions.1.prompt: ¿Por qué preservar PVC identity durante un incidente de red?
diagnostics.pvc: original-pvc-uid no debe estar vacío y debe coincidir con el UID de ledger-shelf-0.
diagnostics.shelf_service: El Service shelf debe tener clusterIP None y selector app:shelf.
diagnostics.policies: La consulta de NetworkPolicies debe tener éxito.
diagnostics.pods: La consulta de Pods client debe tener éxito y devolver al menos un Pod.
diagnostics.dns: La consulta DNS de shelf-0.shelf desde client debe tener éxito.
diagnostics.http: La petición desde client a shelf-0.shelf:8080 debe devolver ledger-120.
diagnostics.named: Debe haber exactamente una NetworkPolicy llamada client-egress.
diagnostics.selector: El podSelector de client-egress debe coincidir exactamente con app:client.
diagnostics.types: policyTypes de client-egress debe contener solo Egress.
diagnostics.egress: Los peers y puertos de client-egress deben usar la forma acotada descrita en el enunciado.
diagnostics.unexpected: client-egress no debe tener tráfico inesperado; el diagnóstico original indica destino, protocolo
  y puerto.
diagnostics.other_egress: Otra NetworkPolicy que seleccione un cliente (client) no debe permitir salida adicional; su nombre
  aparece en el diagnóstico original.
diagnostics.other_invalid: Otra NetworkPolicy tiene selector o egress no válido; su nombre aparece en el diagnóstico original.
diagnostics.invalid_input: Las NetworkPolicies y las etiquetas de los Pods client deben poder leerse en el formato esperado.
diagnostics.missing_dns_udp_53: client-egress debe permitir dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress debe permitir dns TCP 53.
diagnostics.missing_shelf_tcp_8080: client-egress debe permitir shelf TCP 8080.
