title: Recuperación con estado de route
brief: 'Trabaja en `~/quest`; lee `shelf.json`, `service.json`, `client.json`, `egress.json` y `original-pvc-uid`. El almacenamiento de shelf existe, pero el selector del Service headless y la salida del cliente están dañados. Conserva el PVC original. La guía enlazada introduce el diagnóstico de red de Kubernetes.


  Haz que el Service `shelf` sea headless (`clusterIP: None`) con selector `app: shelf`. Configura `client-egress` con un `podSelector` que seleccione exactamente `app: client` y solo `Egress`; usa `matchLabels` o una expresión equivalente `In` de un valor: permite UDP y TCP 53 a un único destino que combine la etiqueta de namespace `kubernetes.io/metadata.name: kube-system` y la etiqueta de Pod `k8s-app: kube-dns`, y TCP 8080 a la etiqueta de Pod `app: shelf` en el mismo namespace. Estos selectores exactos identifican los destinos suministrados; puedes reordenar o dividir reglas y puertos. Otras políticas que seleccionen al cliente no deben ampliar la salida.


  Comprueba que el UID del PVC `ledger-shelf-0` coincide con `/run/dq/facts/0/original-pvc-uid`, que el DNS del cliente resuelve `shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.` y que HTTP del cliente a `shelf-0.shelf:8080` devuelve `ledger-120`. Las comprobaciones observan la identidad, la configuración de políticas y la conectividad actual, no toda la historia del almacenamiento. Trabaja solo en la bahía sin conexión.'
debrief: La persistencia, discovery y el acceso a la red se verificaron de forma independiente antes de
  pasar la ruta completa.
stages.0.brief: El UID original del PVC, el Service headless, la política de salida limitada, el DNS ordinal y la respuesta del ledger coinciden con el enunciado.
stages.0.objectives.0.text: El UID original del PVC, el Service headless, la política de salida limitada, el DNS ordinal y la respuesta del ledger coinciden con el enunciado.
hints.0.text: Verifique el almacenamiento estable por separado de discovery y egress.
hints.1.text: Headless DNS depende del endpoints listo para combinar.
hints.2.text: Repare el selector, luego permita el DNS y solo el puerto shelf Pod.
phrases.0: Conservé el stateful claim durante la recuperación de la red.
phrases.1: Verifiqué ordinal DNS del client aislado.
phrases.2: Restauré solo los flujos de dependencia requeridos.
questions.0.points.0: Sí; discovery, endpoints y network policy son capas independientes.
questions.0.points.1: Pruebe cada límite antes de reemplazar datos.
questions.0.prompt: ¿Puede coexistir un almacenamiento saludable con un acceso interrumpido a las aplicaciones?
questions.1.points.0: Reemplazar el almacenamiento no repara un selector ni una regla de salida.
questions.1.points.1: El reemplazo innecesario puede destruir los datos recuperables.
questions.1.prompt: ¿Por qué preservar PVC identity durante un incidente de red?
