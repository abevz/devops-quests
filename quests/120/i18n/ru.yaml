title: Восстановление stateful-маршрута
brief: 'Работайте в `~/quest`; изучите `shelf.json`, `service.json`, `client.json`, `egress.json` и `original-pvc-uid`. Хранилище shelf существует, но селектор headless Service и egress клиента неисправны. Сохраните исходный PVC. Руководство знакомит с диагностикой сети Kubernetes.


  Сделайте Service `shelf` headless (`clusterIP: None`) с селектором `app: shelf`. Настройте `client-egress` с `podSelector`, выбирающим ровно `app: client`, и только `Egress`; используйте `matchLabels` или равнозначное выражение `In` с одним значением: разрешите UDP и TCP 53 одному получателю, объединяющему метку пространства имён `kubernetes.io/metadata.name: kube-system` и метку Pod `k8s-app: kube-dns`, а также TCP 8080 к Pod с меткой `app: shelf` в том же пространстве имён. Эти точные селекторы меток обозначают выданные цели; правила и порты можно переставлять или разделять. Другие политики, выбирающие клиента, не должны расширять egress.


  Проверьте, что UID PVC `ledger-shelf-0` совпадает с `/run/dq/facts/0/original-pvc-uid`, DNS клиента разрешает `shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.`, а HTTP клиента к `shelf-0.shelf:8080` возвращает `ledger-120`. Проверки наблюдают идентичность, конфигурацию политик и текущее соединение, но не всю историю хранилища. Работайте только в офлайн-песочнице.'
debrief: Хранение, discovery и сетевой доступ проверены по отдельности до проверки
  полной цепочки.
stages.0.brief: Исходный UID PVC, headless Service, ограниченная политика egress, DNS экземпляра и ответ ledger соответствуют заданию.
stages.0.objectives.0.text: Исходный UID PVC, headless Service, ограниченная политика egress, DNS экземпляра и ответ ledger соответствуют заданию.
hints.0.text: Проверяйте постоянное хранение отдельно от discovery и egress.
hints.1.text: Headless DNS зависит от подходящих готовых endpoints.
hints.2.text: Исправьте selector, затем разрешите DNS и только порт Pod стеллажа.
phrases.0: Я сохранил stateful claim при восстановлении сети.
phrases.1: Я проверил DNS ordinal из изолированного клиента.
phrases.2: Я восстановил только необходимые потоки зависимостей.
questions.0.points.0: 'Да: discovery, endpoints и network policy — отдельные уровни.'
questions.0.points.1: Проверьте каждую границу до замены данных.
