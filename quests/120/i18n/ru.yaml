title: Восстановление stateful-маршрута
brief: 'Работайте в `~/quest`; изучите `shelf.json`, `service.json`, `client.json`, `egress.json` и `original-pvc-uid`. Хранилище
  shelf существует, но селектор headless Service и egress клиента неисправны. Сохраните исходный PVC. Руководство знакомит
  с диагностикой сети Kubernetes.


  Сделайте Service `shelf` headless (`clusterIP: None`) с селектором `app: shelf`. Настройте `client-egress` с `podSelector`,
  выбирающим ровно `app: client`, и только `Egress`; используйте `matchLabels` или равнозначное выражение `In` с одним значением:
  разрешите UDP и TCP 53 одному получателю, объединяющему метку пространства имён `kubernetes.io/metadata.name: kube-system`
  и метку Pod `k8s-app: kube-dns`, а также TCP 8080 к Pod с меткой `app: shelf` в том же пространстве имён. Эти точные селекторы
  меток обозначают выданные цели; правила и порты можно переставлять или разделять. Другие политики, выбирающие клиента, не
  должны расширять egress.


  Проверьте, что UID PVC `ledger-shelf-0` совпадает с `/run/dq/facts/0/original-pvc-uid`, DNS клиента разрешает `shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.`,
  а HTTP клиента к `shelf-0.shelf:8080` возвращает `ledger-120`. Проверки наблюдают идентичность, конфигурацию политик и текущее
  соединение, но не всю историю хранилища. Работайте только в офлайн-песочнице.'
debrief: Хранение, discovery и сетевой доступ проверены по отдельности до проверки полной цепочки.
stages.0.brief: Исходный UID PVC, headless Service, ограниченная политика egress, DNS экземпляра и ответ ledger соответствуют
  заданию.
stages.0.objectives.0.text: Исходный UID PVC, headless Service, ограниченная политика egress, DNS экземпляра и ответ ledger
  соответствуют заданию.
hints.0.text: Проверяйте постоянное хранение отдельно от discovery и egress.
hints.1.text: Headless DNS зависит от подходящих готовых endpoints.
hints.2.text: Исправьте selector, затем разрешите DNS и только порт Pod стеллажа.
phrases.0: Я сохранил stateful claim при восстановлении сети.
phrases.1: Я проверил DNS ordinal из изолированного клиента.
phrases.2: Я восстановил только необходимые потоки зависимостей.
questions.0.points.0: 'Да: discovery, endpoints и network policy — отдельные уровни.'
questions.0.points.1: Проверьте каждую границу до замены данных.
questions.0.prompt: Может ли исправное хранилище сочетаться с недоступным приложением?
questions.1.points.0: Замена хранилища не исправляет selector или egress-правило.
questions.1.points.1: Ненужная замена может уничтожить восстанавливаемые данные.
questions.1.prompt: Зачем сохранять identity PVC при сетевом инциденте?
diagnostics.pvc: original-pvc-uid должен быть непустым и совпадать с UID ledger-shelf-0.
diagnostics.shelf_service: У Service shelf должны быть clusterIP None и selector app:shelf.
diagnostics.policies: Получение NetworkPolicy должно завершиться успешно.
diagnostics.pods: Получение Pod client должно завершиться успешно и вернуть хотя бы один Pod.
diagnostics.dns: DNS-запрос shelf-0.shelf из client должен завершиться успешно.
diagnostics.http: Запрос от client к shelf-0.shelf:8080 должен вернуть ledger-120.
diagnostics.named: Должна существовать ровно одна NetworkPolicy с именем client-egress.
diagnostics.selector: PodSelector client-egress должен точно совпадать с app:client.
diagnostics.types: policyTypes client-egress должен содержать только Egress.
diagnostics.egress: Peers и порты client-egress должны использовать ограниченную форму из описания задания.
diagnostics.unexpected: У client-egress не должно быть лишнего потока; исходная диагностика указывает назначение, протокол
  и порт.
diagnostics.other_egress: Другая NetworkPolicy, выбирающая client, не должна разрешать лишний исходящий трафик; её имя указано
  в исходной диагностике.
diagnostics.other_invalid: У другой NetworkPolicy неверный selector или egress; её имя указано в исходной диагностике.
diagnostics.invalid_input: NetworkPolicy и метки Pod client должны читаться в ожидаемом формате.
diagnostics.missing_dns_udp_53: client-egress должен разрешать dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress должен разрешать dns TCP 53.
diagnostics.missing_shelf_tcp_8080: client-egress должен разрешать shelf TCP 8080.
