title: Восстановление stateful-маршрута
brief: "Данные shelf должны оставаться доступны клиенту при ограниченной сетевой политике. Обнаружение и связность\
  \ ещё не работают полностью.\n\nРаботайте в `~/quest` на рабочей станции. Входные файлы по этапам:\n- Этап 1:\
  \ `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Требования:**\n\n- Этап 1:\n  - Существующий\
  \ data claim сохраняет идентичность и не создаётся заново.\n  - Существующий сервис данных поддерживает стабильное\
  \ обнаружение Pod.\n  - Исходящий доступ запрашивающей нагрузки ограничен DNS и существующим сервисом данных по\
  \ TCP `8080`; другие политики не расширяют его.\n  - Из Deployment `client` разрешается стабильное DNS-имя существующего\
  \ Pod хранения.\n  - Из Deployment `client` существующий Pod хранения возвращает `ledger-120` на порту `8080`.\n\
  \nПроверка наблюдает идентичность claim, конфигурацию политик и текущую связность, а не всю историю хранения."
debrief: Хранение, discovery и сетевой доступ проверены по отдельности до проверки полной цепочки.
stages.0.brief: Сохраните исходный data claim при восстановлении ограниченного доступа клиента.
hints.0.text: Проверяйте постоянное хранение отдельно от discovery и egress.
hints.1.text: 'Headless DNS зависит от подходящих готовых endpoints.


  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Этап 1: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: |-
  Исправьте selector, затем разрешите DNS и только порт Pod стеллажа.

  Проверьте исправленный этап и сравните наблюдаемый результат.

  Этап 1: Текущий UID claim равен исходному записанному UID.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Этап 1: Клиент разрешает полное DNS-имя Pod shelf.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Этап 1: Клиент получает `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Ожидаемые наблюдения для этапа целиком:
  - Этап 1: UID claim не изменён, Service `shelf` является headless, политики предоставляют только требуемый egress.

phrases.0: Я сохранил stateful claim при восстановлении сети.
phrases.1: Я проверил DNS ordinal из изолированного клиента.
phrases.2: Я восстановил только необходимые потоки зависимостей.
questions.0.points.0: 'Да: discovery, endpoints и network policy — отдельные уровни.'
questions.0.points.1: Проверьте каждую границу до замены данных.
questions.0.prompt: Может ли исправное хранилище сочетаться с недоступным приложением?
questions.1.points.0: Замена хранилища не исправляет selector или egress-правило.
questions.1.points.1: Ненужная замена может уничтожить восстанавливаемые данные.
questions.1.prompt: Зачем сохранять identity PVC при сетевом инциденте?
diagnostics.pvc: original-pvc-uid должен быть непустым и совпадать с UID ledger-shelf-0.
diagnostics.shelf_service: |-
  Headless Service shelf должен выбирать поставленный Pod хранилища.

diagnostics.policies: Получение NetworkPolicy должно завершиться успешно.
diagnostics.pods: Получение Pod client должно завершиться успешно и вернуть хотя бы один Pod.
diagnostics.dns: DNS-запрос shelf-0.shelf из client должен завершиться успешно.
diagnostics.http: Запрос от client к shelf-0.shelf:8080 должен вернуть ledger-120.
diagnostics.named: Должна существовать ровно одна NetworkPolicy с именем client-egress.
diagnostics.selector: |-
  Egress-политика должна применяться к каждому текущему Pod потребителя.

diagnostics.types: |-
  Egress разрешает только DNS и порт данных существующего shelf; другие выбирающие политики не должны расширять доступ.

diagnostics.egress: |-
  Egress разрешает только DNS и порт данных существующего shelf; другие выбирающие политики не должны расширять доступ.

diagnostics.unexpected: У client-egress не должно быть лишнего потока; исходная диагностика указывает назначение,
  протокол и порт.
diagnostics.other_egress: Другая NetworkPolicy, выбирающая client, не должна разрешать лишний исходящий трафик;
  её имя указано в исходной диагностике.
diagnostics.other_invalid: У другой NetworkPolicy неверный selector или egress; её имя указано в исходной диагностике.
diagnostics.invalid_input: NetworkPolicy и метки Pod client должны читаться в ожидаемом формате.
diagnostics.missing_dns_udp_53: client-egress должен разрешать dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress должен разрешать dns TCP 53.
diagnostics.missing_shelf_tcp_8080: client-egress должен разрешать shelf TCP 8080.
stages.0.objectives.0.text: Существующий data claim сохраняет идентичность и не создаётся заново.
stages.0.objectives.1.text: Существующий сервис данных поддерживает стабильное обнаружение Pod.
stages.0.objectives.2.text: Исходящий доступ запрашивающей нагрузки ограничен DNS и существующим сервисом данных
  по TCP `8080`; другие политики не расширяют его.
stages.0.objectives.3.text: Из Deployment `client` разрешается стабильное DNS-имя существующего Pod хранения.
stages.0.objectives.4.text: Из Deployment `client` существующий Pod хранения возвращает `ledger-120` на порту `8080`.
diagnostics.probe_0_1: 'Текущие данные не позволили проверить эту цель: Существующий сервис данных поддерживает
  стабильное обнаружение Pod.'
diagnostics.probe_0_2: 'Текущие данные не позволили проверить эту цель: Исходящий доступ запрашивающей нагрузки
  ограничен DNS и существующим сервисом данных по TCP `8080`; другие политики не расширяют его.'
