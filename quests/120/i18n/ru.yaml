title: Восстановление stateful-маршрута
brief: 'Стеллаж с persistent storage исправен, но headless Service выбирает старую метку, а у клиента
  нет egress-исключений. Восстановите DNS ordinal и HTTP журнала: исправьте headless selector и добавьте
  только DNS и shelf:8080. Сохраните PVC и ledger-120. Клиент должен остаться изолированным; allow-all
  не соответствует контракту.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `shelf.json`, `service.json`, `client.json`,
  `egress.json`, `original-pvc-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Изолированный клиент разрешает shelf-0 и читает исходный persistent журнал через
  headless Service.'
debrief: Хранение, discovery и сетевой доступ проверены по отдельности до проверки полной цепочки.
stages.0.brief: 'Изолированный клиент разрешает shelf-0 и читает исходный persistent журнал через headless
  Service.


  Результат проверки: Изолированный клиент разрешает shelf-0 и читает исходный persistent журнал через
