title: Восстановление stateful-маршрута
brief: "Данные shelf должны оставаться доступны клиенту при ограниченной сетевой политике. Обнаружение и связность\
  \ ещё не работают полностью.\n\nРаботайте в `~/quest` на рабочей станции. Входные файлы по этапам:\n- Этап 1:\
  \ `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Требования:**\n\n- Этап 1:\n  - Существующий\
  \ data claim сохраняет идентичность и не создаётся заново.\n  - Существующий сервис данных поддерживает стабильное\
  \ обнаружение Pod.\n  - Исходящий доступ запрашивающей нагрузки ограничен DNS и существующим сервисом данных по\
  \ TCP `8080`; другие политики не расширяют его.\n  - Из Deployment `client` разрешается стабильное DNS-имя существующего\
  \ Pod хранения.\n  - Из Deployment `client` существующий Pod хранения возвращает `ledger-120` на порту `8080`.\n\
  \nПроверка наблюдает идентичность claim, конфигурацию политик и текущую связность, а не всю историю хранения."
debrief: Хранение, discovery и сетевой доступ проверены по отдельности до проверки полной цепочки.
stages.0.brief: Сохраните исходный data claim при восстановлении ограниченного доступа клиента.
hints.0.text: Проверяйте постоянное хранение отдельно от discovery и egress.
hints.1.text: |-
  Headless DNS зависит от подходящих готовых endpoints.

  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.

  Сопоставьте селектор headless Service с метками Pod shelf и EndpointSlice. В политике egress проверьте получателей DNS наряду с целевым получателем shelf и его портом.

  ```sh
  kubectl get pvc
  kubectl describe deployment client
  kubectl describe service shelf
  kubectl get networkpolicies -o yaml
  ```

  Этап 1: Изучите определения этих ресурсов для данного этапа.

  ```sh
  kubectl get pvc ledger-shelf-0 -o yaml
  kubectl get service shelf -o yaml
  kubectl get networkpolicies -o yaml
  ```
hints.2.text: |-
  Проверьте исправленный этап и сравните наблюдаемый результат.

  Этап 1: Текущий UID claim равен исходному записанному UID.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Этап 1: Клиент разрешает полное DNS-имя Pod shelf.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Этап 1: Клиент получает `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Ожидаемые наблюдения для этапа целиком:
  - Этап 1: UID claim не изменён, Service `shelf` является headless, политики предоставляют только требуемый egress.
phrases.0: Я сохранил stateful claim при восстановлении сети.
phrases.1: Я проверил DNS ordinal из изолированного клиента.
phrases.2: Я восстановил только необходимые потоки зависимостей.
questions.0.points.0: 'Да: discovery, endpoints и network policy — отдельные уровни.'
questions.0.points.1: Проверьте каждую границу до замены данных.
questions.0.prompt: Может ли исправное хранилище сочетаться с недоступным приложением?
questions.1.points.0: Замена хранилища не исправляет selector или egress-правило.
questions.1.points.1: Ненужная замена может уничтожить восстанавливаемые данные.
questions.1.prompt: Зачем сохранять identity PVC при сетевом инциденте?
stages.0.objectives.0.text: Существующий data claim сохраняет идентичность и не создаётся заново.
stages.0.objectives.1.text: Существующий сервис данных поддерживает стабильное обнаружение Pod.
stages.0.objectives.2.text: Исходящий доступ запрашивающей нагрузки ограничен DNS и существующим сервисом данных
  по TCP `8080`; другие политики не расширяют его.
stages.0.objectives.3.text: Из Deployment `client` разрешается стабильное DNS-имя существующего Pod хранения.
stages.0.objectives.4.text: Из Deployment `client` существующий Pod хранения возвращает `ledger-120` на порту `8080`.
diagnostics.policies: Проверка не смогла получить список NetworkPolicy. Проверьте доступ к текущему namespace и доступность API перед разбором правил. [Причина и проверка](guides#guide=kubernetes-10&section=q120-egress-policy-list)
diagnostics.pods: Список Pod client мог быть недоступен или пуст. Проверьте наличие Pod с app=client перед проверкой селектора политики. [Причина и проверка](guides#guide=kubernetes-10&section=q120-egress-client-label-input)
diagnostics.named: Политика client-egress могла отсутствовать или не читаться. Проверьте именованную NetworkPolicy в namespace client. [Причина и проверка](guides#guide=kubernetes-10&section=q120-client-egress-policy-object)
diagnostics.egress: У правила egress мог отсутствовать адресат или порт, быть чужая цель либо не разрешаться именованный порт shelf. Проверьте DNS-цели и отдельные разрешённые порты для shelf-0. [Причина и проверка](guides#guide=kubernetes-10&section=q120-bounded-egress-peer-and-port)
diagnostics.unexpected: Внешне корректное правило могло разрешить лишний протокол или порт. Сравните каждую тройку цели, протокола и порта с нужными потоками DNS и shelf. [Причина и проверка](guides#guide=kubernetes-10&section=q120-egress-unexpected-flow)
diagnostics.other_egress: Другая egress-политика для Pod client могла добавить запрещённый поток, поскольку разрешения объединяются. Проверьте указанную политику и сравните её потоки с допустимыми. [Причина и проверка](guides#guide=kubernetes-10&section=q120-additive-egress-policy)
diagnostics.other_invalid: Селектор или egress другой политики не удалось надёжно разобрать. Проверьте указанный объект на неподдерживаемые селекторы или слишком широкие цели перед оценкой доступа. [Причина и проверка](guides#guide=kubernetes-10&section=q120-unreadable-additive-policy)
diagnostics.missing_dns_udp_53: Политика могла не разрешить UDP 53 к выданным Pod кластерного DNS. Проверьте общую цель kube-system и kube-dns с нужным портом UDP. [Причина и проверка](guides#guide=kubernetes-10&section=q120-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP для DNS мог быть разрешён, пока TCP 53 отсутствует. Проверьте разрешение TCP 53 для той же DNS-цели. [Причина и проверка](guides#guide=kubernetes-10&section=q120-client-egress-dns-tcp)
diagnostics.missing_shelf_tcp_8080: Разрешения DNS не открывают путь к приложению. В политике может отсутствовать TCP 8080 к локальным Pod shelf. Проверьте цель app=shelf и её порт. [Причина и проверка](guides#guide=kubernetes-10&section=q120-client-egress-shelf-http)
diagnostics.probe_0_2: Проверка политики может остановиться до определения условия, если не запускается процесс или недоступны входы. Проверьте Python и текущие наблюдения политики и Pod. [Причина и проверка](guides#guide=kubernetes-10&section=q120-egress-policy-observer-input)
diagnostics.pvc: Клейм журнала мог отсутствовать или получить другой UID после пересоздания. Сравните текущий UID ledger-shelf-0 с исходной записью до правки Service и политики. [Причина и проверка](guides#guide=kubernetes-10&section=q120-shelf-retained-ledger-pvc)
diagnostics.shelf_service: Service shelf мог получить виртуальный адрес или выбирать другой Pod. Сохраните clusterIP равным None и сравните app=shelf и дополнительные метки селектора с фактическими метками shelf-0. [Причина и проверка](guides#guide=kubernetes-10&section=q120-shelf-headless-ordinal-source)
diagnostics.selector: Политика могла выбирать посторонние Pod или пропускать часть текущих Pod client. Проверьте, что селектор требует app=client и подходит всем наблюдаемым Pod client. [Причина и проверка](guides#guide=kubernetes-10&section=q120-client-policy-selector-coverage)
diagnostics.types: Политика могла описывать только входящие правила или пропустить тип Egress. Проверьте, что список типов client-egress содержит Egress. [Причина и проверка](guides#guide=kubernetes-10&section=q120-client-policy-egress-type)
diagnostics.dns: Headless Service мог не публиковать shelf-0, либо у работающего client недоступен исходящий DNS. Проверьте A-запрос полного имени ordinal из client. [Причина и проверка](guides#guide=kubernetes-10&section=q120-live-shelf-ordinal-dns)
diagnostics.http: Ordinal DNS может работать, пока TCP 8080 ограничен либо endpoint shelf отдаёт другой ответ. Запросите shelf-0.shelf:8080 из client и сравните с ledger-120. [Причина и проверка](guides#guide=kubernetes-10&section=q120-live-client-ledger-response)
diagnostics.probe_0_1: Проверка headless Service может завершиться до указания условия, если не запускается процесс. Проверьте инструменты станции и доступ к объектам shelf. [Причина и проверка](guides#guide=kubernetes-10&section=q120-shelf-service-observer-input)
