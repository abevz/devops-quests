title: Zustandsbehaftete route-Wiederherstellung
brief: 'Der persistent shelf ist fehlerfrei, aber der headless Service wählt ein retired-Label aus und
  der client hat keine Ausgangsausnahmen. Stellen Sie ordinal DNS und Ledger HTTP wieder her, indem Sie
  die headless selector reparieren und nur die Flüsse DNS und shelf:8080 hinzufügen. Behalten Sie die
  vorhandenen PVC und ledger-120 bei. Halten Sie den client isoliert; Das Ersetzen der Richtlinie durch
  allow-all entspricht nicht dem Vertrag.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `shelf.json`, `service.json`, `client.json`,
  `egress.json`, `original-pvc-uid`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Das isolierte client löst shelf-0 auf und liest das ursprüngliche persistent-Ledger
  über das headless Service.'
debrief: Persistenz, discovery und Netzwerkzugriff wurden unabhängig voneinander überprüft, bevor der
  vollständige Pfad durchlaufen wurde.
stages.0.brief: 'Erfolgskriterien: Das isolierte client löst shelf-0 auf und liest das ursprüngliche persistent-Ledger
  über das headless Service.'
stages.0.objectives.0.text: Der isolierte client löst shelf-0 auf und liest das ursprüngliche persistent-Ledger
  über den headless Service.
hints.0.text: Überprüfen Sie die stabile Lagerung getrennt von discovery und egress.
hints.1.text: Headless DNS hängt vom passenden bereiten endpoints ab.
hints.2.text: Reparieren Sie den selector, lassen Sie dann DNS und nur den shelf Pod-Port zu.
phrases.0: Ich habe den stateful claim während der Netzwerkwiederherstellung beibehalten.
phrases.1: Ich habe ordinal DNS anhand des isolierten client verifiziert.
phrases.2: Ich habe nur die erforderlichen Abhängigkeitsflüsse wiederhergestellt.
questions.0.points.0: Ja; discovery, endpoints und network policy sind unabhängige Schichten.
questions.0.points.1: Testen Sie jede Grenze, bevor Sie Daten ersetzen.
questions.0.prompt: Kann fehlerfreier Speicher mit unterbrochenem Anwendungszugriff koexistieren?
questions.1.points.0: Durch das Ersetzen des Speichers wird eine selector- oder Ausgangsregel nicht repariert.
questions.1.points.1: Unnötiger Austausch kann wiederherstellbare Daten zerstören.
questions.1.prompt: Warum sollte PVC identity während eines Netzwerkvorfalls aufbewahrt werden?
