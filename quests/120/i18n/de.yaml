title: Zustandsbehaftete route-Wiederherstellung
brief: "Die Shelf-Daten müssen dem Client unter einer begrenzten Netzwerkrichtlinie verfügbar bleiben. Namensauflösung\
  \ und Verbindung sind noch unvollständig.\n\nArbeiten Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n\
  - Phase 1: `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n \
  \ - Der bestehende Data Claim behält seine Identität und wird nicht neu erstellt.\n  - Der bestehende Datendienst\
  \ unterstützt stabile Pod-Erkennung.\n  - Ausgehender Zugriff des anfragenden Workloads ist auf DNS und den bestehenden\
  \ Datendienst über TCP `8080` begrenzt; keine andere Richtlinie erweitert ihn.\n  - Von Deployment `client` wird\
  \ der stabile DNS-Name des bestehenden Speicher-Pods aufgelöst.\n  - Von Deployment `client` liefert der bestehende\
  \ Speicher-Pod `ledger-120` auf Port `8080`.\n\nDie Prüfung beobachtet Claim-Identität, Richtlinienkonfiguration\
  \ und aktuelle Verbindung, nicht die gesamte Speicherhistorie."
debrief: Persistenz, discovery und Netzwerkzugriff wurden unabhängig voneinander überprüft, bevor der vollständige
  Pfad durchlaufen wurde.
stages.0.brief: Bewahren Sie den ursprünglichen Data Claim beim Wiederherstellen des begrenzten Client-Zugriffs.
hints.0.text: Überprüfen Sie die stabile Lagerung getrennt von discovery und egress.
hints.1.text: |-
  Headless DNS hängt vom passenden bereiten endpoints ab.

  Prüfen Sie mitgelieferte Definitionen, Ressourcenbeschreibungen und Ereignisse der jeweiligen Phase.

  Vergleiche den Selektor des Headless Service mit den Pod-Labels von shelf und den EndpointSlices. Prüfe in der Egress-Policy die DNS-Peers sowie den vorgesehenen shelf-Peer und dessen Port.

  ```sh
  kubectl get pvc
  kubectl describe deployment client
  kubectl describe service shelf
  kubectl get networkpolicies -o yaml
  ```

  Phase 1: Prüfen Sie diese Ressourcendefinitionen für diese Phase.

  ```sh
  kubectl get pvc ledger-shelf-0 -o yaml
  kubectl get service shelf -o yaml
  kubectl get networkpolicies -o yaml
  ```
hints.2.text: |-
  Prüfen Sie die reparierte Phase und vergleichen Sie das beobachtete Ergebnis.

  Phase 1: Die aktuelle Claim-UID entspricht der ursprünglich aufgezeichneten UID.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Phase 1: Der Client löst den vollständigen DNS-Namen des Shelf-Pods auf.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Phase 1: Der Client erhält `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Erwartete Beobachtungen für die gesamte Phase:
  - Phase 1: Die Claim-UID ist unverändert, Service `shelf` ist headless und die Richtlinien erlauben nur den erforderlichen Egress.
phrases.0: Ich habe den stateful claim während der Netzwerkwiederherstellung beibehalten.
phrases.1: Ich habe ordinal DNS anhand des isolierten client verifiziert.
phrases.2: Ich habe nur die erforderlichen Abhängigkeitsflüsse wiederhergestellt.
questions.0.points.0: Ja; discovery, endpoints und network policy sind unabhängige Schichten.
questions.0.points.1: Testen Sie jede Grenze, bevor Sie Daten ersetzen.
questions.0.prompt: Kann fehlerfreier Speicher mit unterbrochenem Anwendungszugriff koexistieren?
questions.1.points.0: Durch das Ersetzen des Speichers wird eine selector- oder Ausgangsregel nicht repariert.
questions.1.points.1: Unnötiger Austausch kann wiederherstellbare Daten zerstören.
questions.1.prompt: Warum sollte PVC identity während eines Netzwerkvorfalls aufbewahrt werden?
stages.0.objectives.0.text: Der bestehende Data Claim behält seine Identität und wird nicht neu erstellt.
stages.0.objectives.1.text: Der bestehende Datendienst unterstützt stabile Pod-Erkennung.
stages.0.objectives.2.text: Ausgehender Zugriff des anfragenden Workloads ist auf DNS und den bestehenden Datendienst
  über TCP `8080` begrenzt; keine andere Richtlinie erweitert ihn.
stages.0.objectives.3.text: Von Deployment `client` wird der stabile DNS-Name des bestehenden Speicher-Pods aufgelöst.
stages.0.objectives.4.text: Von Deployment `client` liefert der bestehende Speicher-Pod `ledger-120` auf Port `8080`.
diagnostics.policies: Die Prüfung konnte NetworkPolicies nicht auflisten. Prüfen Sie Namespace-Zugriff und API-Verfügbarkeit vor der Auswertung der Richtlinien. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-egress-policy-list)
diagnostics.pods: Das Inventar der client-Pods fehlt möglicherweise oder ist leer. Prüfen Sie Pods mit app=client vor der Auswertung des Selektors. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-egress-client-label-input)
diagnostics.named: Die Richtlinie client-egress fehlt möglicherweise oder ist nicht lesbar. Prüfen Sie die benannte NetworkPolicy im Namespace von client. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-client-egress-policy-object)
diagnostics.egress: Einer Egress-Regel fehlt möglicherweise Ziel oder Port, sie nutzt einen fremden Peer oder löst einen benannten shelf-Port nicht auf. Prüfen Sie DNS-Peers und einzelne erlaubte Ports für shelf-0. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-bounded-egress-peer-and-port)
diagnostics.unexpected: Eine scheinbar gültige Regel erlaubt möglicherweise ein zusätzliches Protokoll oder einen Port. Vergleichen Sie jedes Ziel-/Protokoll-/Port-Tupel mit den geforderten DNS- und shelf-Flüssen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-egress-unexpected-flow)
diagnostics.other_egress: Eine weitere Egress-Richtlinie für einen client-Pod erlaubt möglicherweise einen unerwünschten Fluss, weil Freigaben additiv sind. Vergleichen Sie die gemeldete Richtlinie mit den vorgesehenen Flüssen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-additive-egress-policy)
diagnostics.other_invalid: Selektor oder Egress-Regeln einer anderen Richtlinie ließen sich nicht sicher auswerten. Prüfen Sie das gemeldete Objekt auf nicht unterstützte Selektoren oder zu breite Ziele. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-unreadable-additive-policy)
diagnostics.missing_dns_udp_53: Die Richtlinie lässt möglicherweise UDP 53 zu den DNS-Pods des Clusters aus. Prüfen Sie den Peer aus kube-system und kube-dns mit passendem UDP-Port. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP für DNS ist möglicherweise erlaubt, während TCP 53 fehlt. Prüfen Sie TCP 53 zum selben bereitgestellten DNS-Peer. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-client-egress-dns-tcp)
diagnostics.missing_shelf_tcp_8080: DNS-Freigaben öffnen den Anwendungspfad nicht. Möglicherweise fehlt TCP 8080 zu den lokalen shelf-Pods. Prüfen Sie den Peer app=shelf und seinen Port. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-client-egress-shelf-http)
diagnostics.probe_0_2: Die Richtlinienprüfung kann vor der Meldung einer Bedingung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Python und aktuelle Richtlinien- und Pod-Beobachtungen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-egress-policy-observer-input)
diagnostics.pvc: Der Ledger-PVC fehlt möglicherweise oder hat nach Neuerstellung eine andere UID. Vergleichen Sie die UID von ledger-shelf-0 vor der Korrektur von Service und Richtlinie mit dem Beleg. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-shelf-retained-ledger-pvc)
diagnostics.shelf_service: Der Service shelf hat möglicherweise eine virtuelle Adresse oder wählt einen anderen Pod. Belassen Sie clusterIP bei None und vergleichen Sie app=shelf und Zusatzlabels mit den tatsächlichen Labels von shelf-0. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-shelf-headless-ordinal-source)
diagnostics.selector: Die Richtlinie wählt möglicherweise fremde Pods aus oder übersieht aktuelle client-Pods. Prüfen Sie, ob der Selektor app=client verlangt und alle beobachteten client-Pods erfasst. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-client-policy-selector-coverage)
diagnostics.types: Die Richtlinie deklariert möglicherweise nur eingehende Regeln oder lässt Egress aus. Prüfen Sie, ob die Typenliste von client-egress Egress enthält. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-client-policy-egress-type)
diagnostics.dns: Der Headless-Service veröffentlicht möglicherweise shelf-0 nicht, oder client hat keinen funktionierenden DNS-Egress. Prüfen Sie die A-Anfrage für den vollqualifizierten ordinalen Namen aus client. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-live-shelf-ordinal-dns)
diagnostics.http: Ordinaler DNS kann funktionieren, obwohl TCP 8080 blockiert bleibt oder der shelf-Endpoint anders antwortet. Rufen Sie shelf-0.shelf:8080 aus client auf und vergleichen Sie mit ledger-120. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-live-client-ledger-response)
diagnostics.probe_0_1: Die Headless-Service-Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn der Prozess nicht startet. Prüfen Sie Tools und Zugriff auf die shelf-Objekte. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q120-shelf-service-observer-input)
