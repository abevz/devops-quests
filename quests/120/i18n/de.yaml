title: Zustandsbehaftete route-Wiederherstellung
brief: "Die Shelf-Daten müssen dem Client unter einer begrenzten Netzwerkrichtlinie verfügbar bleiben. Namensauflösung\
  \ und Verbindung sind noch unvollständig.\n\nArbeiten Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n\
  - Phase 1: `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n \
  \ - Der bestehende Data Claim behält seine Identität und wird nicht neu erstellt.\n  - Der bestehende Datendienst\
  \ unterstützt stabile Pod-Erkennung.\n  - Ausgehender Zugriff des anfragenden Workloads ist auf DNS und den bestehenden\
  \ Datendienst über TCP `8080` begrenzt; keine andere Richtlinie erweitert ihn.\n  - Von Deployment `client` wird\
  \ der stabile DNS-Name des bestehenden Speicher-Pods aufgelöst.\n  - Von Deployment `client` liefert der bestehende\
  \ Speicher-Pod `ledger-120` auf Port `8080`.\n\nDie Prüfung beobachtet Claim-Identität, Richtlinienkonfiguration\
  \ und aktuelle Verbindung, nicht die gesamte Speicherhistorie."
debrief: Persistenz, discovery und Netzwerkzugriff wurden unabhängig voneinander überprüft, bevor der vollständige
  Pfad durchlaufen wurde.
stages.0.brief: Bewahren Sie den ursprünglichen Data Claim beim Wiederherstellen des begrenzten Client-Zugriffs.
hints.0.text: Überprüfen Sie die stabile Lagerung getrennt von discovery und egress.
hints.1.text: 'Headless DNS hängt vom passenden bereiten endpoints ab.


  Prüfen Sie mitgelieferte Definitionen, Ressourcenbeschreibungen und Ereignisse der jeweiligen Phase.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Phase 1: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: 'Reparieren Sie den selector, lassen Sie dann DNS und nur den shelf Pod-Port zu.


  Prüfen Sie die reparierte Phase und vergleichen Sie das beobachtete Ergebnis.


  Phase 1: Die aktuelle Claim-UID entspricht der ursprünglich aufgezeichneten UID.


  ```sh

  cat original-pvc-uid

  kubectl get pvc ledger-shelf-0 -o jsonpath=''{.metadata.uid}''; printf ''\n''

  ```


  Phase 1: Der Client löst den vollständigen DNS-Namen des Shelf-Pods auf.


  ```sh

  kubectl exec deployment/client -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."

  ```


  Phase 1: Der Client erhält `ledger-120`.


  ```sh

  kubectl exec deployment/client -- wget -qO- -T 3 http://shelf-0.shelf:8080

  ```


  Erwartete Beobachtungen für die gesamte Phase:

  - Phase 1: Die Claim-UID ist unverändert, Service `shelf` ist headless und die Richtlinien erlauben nur den erforderlichen
  Egress.'
phrases.0: Ich habe den stateful claim während der Netzwerkwiederherstellung beibehalten.
phrases.1: Ich habe ordinal DNS anhand des isolierten client verifiziert.
phrases.2: Ich habe nur die erforderlichen Abhängigkeitsflüsse wiederhergestellt.
questions.0.points.0: Ja; discovery, endpoints und network policy sind unabhängige Schichten.
questions.0.points.1: Testen Sie jede Grenze, bevor Sie Daten ersetzen.
questions.0.prompt: Kann fehlerfreier Speicher mit unterbrochenem Anwendungszugriff koexistieren?
questions.1.points.0: Durch das Ersetzen des Speichers wird eine selector- oder Ausgangsregel nicht repariert.
questions.1.points.1: Unnötiger Austausch kann wiederherstellbare Daten zerstören.
questions.1.prompt: Warum sollte PVC identity während eines Netzwerkvorfalls aufbewahrt werden?
diagnostics.pvc: Die original-pvc-uid darf nicht leer sein und muss der UID von ledger-shelf-0 entsprechen.
diagnostics.shelf_service: Service shelf muss clusterIP None und selector app:shelf haben.
diagnostics.policies: Das Auflisten der NetworkPolicies muss erfolgreich sein.
diagnostics.pods: Das Auflisten der Client-Pods muss erfolgreich sein und mindestens einen Pod liefern.
diagnostics.dns: Die DNS-Abfrage von shelf-0.shelf aus client muss erfolgreich sein.
diagnostics.http: Die Anfrage von client an shelf-0.shelf:8080 muss ledger-120 liefern.
diagnostics.named: Es muss genau eine NetworkPolicy namens client-egress geben.
diagnostics.selector: Der podSelector von client-egress muss genau app:client entsprechen.
diagnostics.types: policyTypes von client-egress darf nur Egress enthalten.
diagnostics.egress: Peers und Ports von client-egress müssen die in der Aufgabenbeschreibung beschränkte Form verwenden.
diagnostics.unexpected: client-egress darf keinen unerwarteten Datenfluss enthalten; das Original nennt Ziel, Protokoll
  und Port.
diagnostics.other_egress: Eine andere NetworkPolicy, die einen Client auswählt, darf keinen zusätzlichen ausgehenden
  Verkehr erlauben; ihr Name steht im Original.
diagnostics.other_invalid: Eine andere NetworkPolicy hat einen ungültigen Selector oder Egress; ihr Name steht im
  Original.
diagnostics.invalid_input: NetworkPolicies und Client-Pod-Labels müssen im erwarteten Format lesbar sein.
diagnostics.missing_dns_udp_53: client-egress muss dns UDP 53 erlauben.
diagnostics.missing_dns_tcp_53: client-egress muss dns TCP 53 erlauben.
diagnostics.missing_shelf_tcp_8080: client-egress muss shelf TCP 8080 erlauben.
