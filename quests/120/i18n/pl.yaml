title: Stanowe odzyskiwanie trasy
brief: 'shelf persistent jest w dobrym stanie, ale headless Service wybiera wycofaną etykietę, a client
  nie ma wyjątków wyjściowych. Odzyskaj liczbę porządkową DNS i księgę HTTP, naprawiając headless selector
  i dodając tylko przepływy DNS i shelf:8080. Zachowaj istniejące modele PVC i ledger-120. Trzymaj client
  w izolacji; zastąpienie polisy allow-all nie spełnia warunków umowy.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `shelf.json`, `service.json`,
  `client.json`, `egress.json`, `original-pvc-uid`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: izolowany client rozwiązuje shelf-0 i czyta oryginalną księgę persistent
  poprzez headless Service.'
debrief: Trwałość, discovery i dostęp do sieci zostały zweryfikowane niezależnie przed przejściem pełnej
  ścieżki.
stages.0.brief: 'Kryteria sukcesu: Izolowany client rozwiązuje shelf-0 i czyta oryginalną księgę persistent
  poprzez headless Service.'
stages.0.objectives.0.text: Izolowany client rozwiązuje shelf-0 i odczytuje oryginalną księgę persistent
  poprzez headless Service.
hints.0.text: Sprawdź stabilną pamięć masową oddzielnie od discovery i egress.
hints.1.text: Headless DNS zależy od dopasowania gotowego endpoints.
hints.2.text: Napraw selector, następnie zezwól na DNS i tylko port shelf Pod.
phrases.0: Zachowałem stateful claim podczas odzyskiwania sieci.
phrases.1: Sprawdziłem liczbę porządkową DNS od izolowanego client.
phrases.2: Przywróciłem tylko wymagane przepływy zależności.
questions.0.points.0: Tak; discovery, endpoints i network policy to niezależne warstwy.
questions.0.points.1: Przed wymianą danych przetestuj każdą granicę.
questions.0.prompt: Czy sprawna pamięć masowa może współistnieć z uszkodzonym dostępem do aplikacji?
questions.1.points.0: Zastąpienie pamięci nie naprawia reguły selector ani wyjścia.
questions.1.points.1: Niepotrzebna wymiana może zniszczyć możliwe do odzyskania dane.
questions.1.prompt: Po co chronić tożsamość PVC podczas incydentu sieciowego?
