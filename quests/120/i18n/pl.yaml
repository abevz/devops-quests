title: Stanowe odzyskiwanie trasy
brief: "Dane shelf muszą pozostać dostępne dla klienta przy ograniczonej polityce sieciowej. Wykrywanie i łączność\
  \ nie działają jeszcze w pełni.\n\nPracuj w `~/quest` na stacji roboczej. Dane wejściowe według etapu:\n- Etap\
  \ 1: `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Istniejący\
  \ data claim zachowuje tożsamość i nie jest tworzony ponownie.\n  - Istniejąca usługa danych zapewnia stabilne\
  \ wykrywanie Podów.\n  - Ruch wychodzący obciążenia wysyłającego żądania ogranicza się do DNS i istniejącej usługi\
  \ danych przez TCP `8080`; żadna inna polityka go nie rozszerza.\n  - Z Deployment `client` rozwiązuje się stabilna\
  \ nazwa DNS istniejącego Poda przechowującego dane.\n  - Z Deployment `client` istniejący Pod przechowujący dane\
  \ udostępnia `ledger-120` na porcie `8080`.\n\nSprawdzenie obserwuje tożsamość claim, konfigurację polityk i bieżącą\
  \ łączność, a nie całą historię przechowywania."
debrief: Trwałość, discovery i dostęp do sieci zostały zweryfikowane niezależnie przed przejściem pełnej ścieżki.
stages.0.brief: Zachowaj pierwotny data claim podczas przywracania ograniczonego dostępu klienta.
hints.0.text: Sprawdź stabilną pamięć masową oddzielnie od discovery i egress.
hints.1.text: 'Headless DNS zależy od dopasowania gotowego endpoints.


  Sprawdź dostarczone definicje, opisy zasobów i zdarzenia odpowiedniego etapu.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Etap 1: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: 'Napraw selector, następnie zezwól na DNS i tylko port shelf Pod.


  Sprawdź naprawiony etap i porównaj obserwowany wynik.


  Etap 1: Bieżący UID claim odpowiada pierwotnie zapisanemu UID.


  ```sh

  cat original-pvc-uid

  kubectl get pvc ledger-shelf-0 -o jsonpath=''{.metadata.uid}''; printf ''\n''

  ```


  Etap 1: Klient rozwiązuje pełną nazwę DNS Poda shelf.


  ```sh

  kubectl exec deployment/client -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."

  ```


  Etap 1: Klient otrzymuje `ledger-120`.


  ```sh

  kubectl exec deployment/client -- wget -qO- -T 3 http://shelf-0.shelf:8080

  ```


  Oczekiwane obserwacje dla całego etapu:

  - Etap 1: UID claim jest niezmieniony, Service `shelf` jest headless, a polityki zapewniają tylko wymagany egress.'
phrases.0: Zachowałem stateful claim podczas odzyskiwania sieci.
phrases.1: Sprawdziłem liczbę porządkową DNS od izolowanego client.
phrases.2: Przywróciłem tylko wymagane przepływy zależności.
questions.0.points.0: Tak; discovery, endpoints i network policy to niezależne warstwy.
questions.0.points.1: Przed wymianą danych przetestuj każdą granicę.
questions.0.prompt: Czy sprawna pamięć masowa może współistnieć z uszkodzonym dostępem do aplikacji?
questions.1.points.0: Zastąpienie pamięci nie naprawia reguły selector ani wyjścia.
questions.1.points.1: Niepotrzebna wymiana może zniszczyć możliwe do odzyskania dane.
questions.1.prompt: Po co chronić tożsamość PVC podczas incydentu sieciowego?
diagnostics.pvc: original-pvc-uid musi być niepusty i odpowiadać UID ledger-shelf-0.
diagnostics.shelf_service: Service shelf musi mieć clusterIP None i selector app:shelf.
diagnostics.policies: Pobranie NetworkPolicy musi się powieść.
diagnostics.pods: Pobranie Podów client musi się powieść i zwrócić co najmniej jeden Pod.
diagnostics.dns: Wyszukiwanie DNS shelf-0.shelf z client musi się powieść.
diagnostics.http: Żądanie z client do shelf-0.shelf:8080 musi zwrócić ledger-120.
diagnostics.named: Musi istnieć dokładnie jedna NetworkPolicy o nazwie client-egress.
diagnostics.selector: PodSelector client-egress musi odpowiadać dokładnie app:client.
diagnostics.types: policyTypes client-egress musi zawierać tylko Egress.
diagnostics.egress: Peers i porty client-egress muszą używać ograniczonej formy opisanej w treści.
diagnostics.unexpected: client-egress nie może mieć nieoczekiwanego ruchu; oryginalny komunikat podaje cel, protokół
  i port.
diagnostics.other_egress: Inna NetworkPolicy wybierająca klienta (client) nie może zezwalać na dodatkowy ruch wychodzący;
  jej nazwę podaje oryginalny komunikat.
diagnostics.other_invalid: Inna NetworkPolicy ma niepoprawny selector lub egress; jej nazwę podaje oryginalny komunikat.
diagnostics.invalid_input: NetworkPolicy i etykiety Podów client muszą być czytelne w oczekiwanym formacie.
diagnostics.missing_dns_udp_53: client-egress musi zezwalać na dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress musi zezwalać na dns TCP 53.
diagnostics.missing_shelf_tcp_8080: client-egress musi zezwalać na shelf TCP 8080.
stages.0.objectives.0.text: Istniejący data claim zachowuje tożsamość i nie jest tworzony ponownie.
stages.0.objectives.1.text: Istniejąca usługa danych zapewnia stabilne wykrywanie Podów.
stages.0.objectives.2.text: Ruch wychodzący obciążenia wysyłającego żądania ogranicza się do DNS i istniejącej usługi
  danych przez TCP `8080`; żadna inna polityka go nie rozszerza.
stages.0.objectives.3.text: Z Deployment `client` rozwiązuje się stabilna nazwa DNS istniejącego Poda przechowującego
  dane.
stages.0.objectives.4.text: Z Deployment `client` istniejący Pod przechowujący dane udostępnia `ledger-120` na porcie
  `8080`.
