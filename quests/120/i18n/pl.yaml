title: Stanowe odzyskiwanie trasy
brief: "Dane shelf muszą pozostać dostępne dla klienta przy ograniczonej polityce sieciowej. Wykrywanie i łączność\
  \ nie działają jeszcze w pełni.\n\nPracuj w `~/quest` na stacji roboczej. Dane wejściowe według etapu:\n- Etap\
  \ 1: `shelf.yaml`, `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Istniejący\
  \ data claim zachowuje tożsamość i nie jest tworzony ponownie.\n  - Istniejąca usługa danych zapewnia stabilne\
  \ wykrywanie Podów.\n  - Ruch wychodzący obciążenia wysyłającego żądania ogranicza się do DNS i istniejącej usługi\
  \ danych przez TCP `8080`; żadna inna polityka go nie rozszerza.\n  - Z Deployment `client` rozwiązuje się stabilna\
  \ nazwa DNS istniejącego Poda przechowującego dane.\n  - Z Deployment `client` istniejący Pod przechowujący dane\
  \ udostępnia `ledger-120` na porcie `8080`.\n\nSprawdzenie obserwuje tożsamość claim, konfigurację polityk i bieżącą\
  \ łączność, a nie całą historię przechowywania."
debrief: Trwałość, discovery i dostęp do sieci zostały zweryfikowane niezależnie przed przejściem pełnej ścieżki.
stages.0.brief: Zachowaj pierwotny data claim podczas przywracania ograniczonego dostępu klienta.
hints.0.text: Sprawdź stabilną pamięć masową oddzielnie od discovery i egress.
hints.1.text: 'Headless DNS zależy od dopasowania gotowego endpoints.


  Sprawdź dostarczone definicje, opisy zasobów i zdarzenia odpowiedniego etapu.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Etap 1: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: |-
  Napraw selector, następnie zezwól na DNS i tylko port shelf Pod.

  Sprawdź naprawiony etap i porównaj obserwowany wynik.

  Etap 1: Bieżący UID claim odpowiada pierwotnie zapisanemu UID.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Etap 1: Klient rozwiązuje pełną nazwę DNS Poda shelf.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Etap 1: Klient otrzymuje `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Oczekiwane obserwacje dla całego etapu:
  - Etap 1: UID claim jest niezmieniony, Service `shelf` jest headless, a polityki zapewniają tylko wymagany egress.

phrases.0: Zachowałem stateful claim podczas odzyskiwania sieci.
phrases.1: Sprawdziłem liczbę porządkową DNS od izolowanego client.
phrases.2: Przywróciłem tylko wymagane przepływy zależności.
questions.0.points.0: Tak; discovery, endpoints i network policy to niezależne warstwy.
questions.0.points.1: Przed wymianą danych przetestuj każdą granicę.
questions.0.prompt: Czy sprawna pamięć masowa może współistnieć z uszkodzonym dostępem do aplikacji?
questions.1.points.0: Zastąpienie pamięci nie naprawia reguły selector ani wyjścia.
questions.1.points.1: Niepotrzebna wymiana może zniszczyć możliwe do odzyskania dane.
questions.1.prompt: Po co chronić tożsamość PVC podczas incydentu sieciowego?
stages.0.objectives.0.text: Istniejący data claim zachowuje tożsamość i nie jest tworzony ponownie.
stages.0.objectives.1.text: Istniejąca usługa danych zapewnia stabilne wykrywanie Podów.
stages.0.objectives.2.text: Ruch wychodzący obciążenia wysyłającego żądania ogranicza się do DNS i istniejącej usługi
  danych przez TCP `8080`; żadna inna polityka go nie rozszerza.
stages.0.objectives.3.text: Z Deployment `client` rozwiązuje się stabilna nazwa DNS istniejącego Poda przechowującego
  dane.
stages.0.objectives.4.text: Z Deployment `client` istniejący Pod przechowujący dane udostępnia `ledger-120` na porcie
  `8080`.
diagnostics.policies: Kontrola nie mogła pobrać listy NetworkPolicy. Sprawdź dostęp do bieżącej przestrzeni nazw i API przed oceną reguł. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-egress-policy-list)
diagnostics.pods: Lista podów client może być niedostępna lub pusta. Potwierdź obecność podów app=client przed oceną selektora. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-egress-client-label-input)
diagnostics.named: Polityka client-egress może nie istnieć lub być nieczytelna. Sprawdź nazwaną NetworkPolicy w przestrzeni client. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-client-egress-policy-object)
diagnostics.egress: Reguła egress może nie mieć celu lub portu, wskazywać obcy cel albo nie rozwiązywać portu nazwanego shelf. Sprawdź cele DNS i pojedyncze dozwolone porty dla shelf-0. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-bounded-egress-peer-and-port)
diagnostics.unexpected: Pozornie poprawna reguła może pozwalać na dodatkowy protokół lub port. Porównaj każdą trójkę cel/protokół/port z wymaganym DNS i shelf. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-egress-unexpected-flow)
diagnostics.other_egress: Inna polityka egress wybierająca pod client może dodawać zakazany przepływ, bo zezwolenia się sumują. Sprawdź wskazaną politykę i jej przepływy względem dozwolonych. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-additive-egress-policy)
diagnostics.other_invalid: Nie udało się bezpiecznie zinterpretować selektora lub egress innej polityki. Sprawdź wskazany obiekt pod kątem nieobsługiwanych selektorów lub szerokich celów. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-unreadable-additive-policy)
diagnostics.missing_dns_udp_53: Polityka może pomijać UDP 53 do podów DNS klastra. Sprawdź połączenie kube-system i kube-dns z właściwym portem UDP. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP dla DNS może być dozwolone mimo braku TCP 53. Sprawdź zezwolenie TCP 53 dla tego samego celu DNS. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-client-egress-dns-tcp)
diagnostics.missing_shelf_tcp_8080: Zezwolenia DNS nie tworzą dostępu do aplikacji. Polityka może nie mieć TCP 8080 do lokalnych podów shelf. Sprawdź cel app=shelf i jego port. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-client-egress-shelf-http)
diagnostics.probe_0_2: Kontrola polityki może przerwać działanie przed wskazaniem warunku, gdy proces lub wejścia zawodzą. Sprawdź Pythona i bieżące dane polityki i podów. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-egress-policy-observer-input)
diagnostics.pvc: PVC dziennika może nie istnieć lub mieć inny UID po odtworzeniu. Porównaj aktualny UID ledger-shelf-0 z zamrożonym zapisem przed naprawą Service i polityki. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-shelf-retained-ledger-pvc)
diagnostics.shelf_service: Service shelf może mieć adres wirtualny lub wybierać zły pod. Zachowaj clusterIP równe None i porównaj app=shelf i dodatkowe etykiety z rzeczywistymi etykietami shelf-0. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-shelf-headless-ordinal-source)
diagnostics.selector: Polityka może wybierać obce pody lub pomijać część bieżących podów client. Sprawdź, czy selektor wymaga app=client i pasuje do wszystkich obserwowanych podów client. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-client-policy-selector-coverage)
diagnostics.types: Polityka może deklarować tylko ruch przychodzący lub pomijać Egress. Sprawdź, czy typy client-egress obejmują Egress. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-client-policy-egress-type)
diagnostics.dns: Service headless może nie publikować shelf-0 lub działający client może nie mieć dostępu do DNS. Sprawdź zapytanie A o pełną nazwę porządkową z client. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-live-shelf-ordinal-dns)
diagnostics.http: DNS porządkowy może działać mimo zablokowanego TCP 8080 lub innej treści z endpointu shelf. Odpytaj shelf-0.shelf:8080 z client i porównaj z ledger-120. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-live-client-ledger-response)
diagnostics.probe_0_1: Kontrola Service headless może zakończyć się przed wskazaniem warunku, gdy proces nie startuje. Sprawdź narzędzia i dostęp do obiektów shelf. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q120-shelf-service-observer-input)
