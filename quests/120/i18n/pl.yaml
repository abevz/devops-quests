title: Stanowe odzyskiwanie trasy
brief: 'Pracuj w `~/quest`; przeczytaj `shelf.json`, `service.json`, `client.json`, `egress.json` i `original-pvc-uid`. Magazyn shelf istnieje, ale selektor usługi headless i egress klienta są błędne. Zachowaj pierwotny PVC. Połączony przewodnik przedstawia diagnostykę sieci Kubernetes.


  Ustaw usługę `shelf` jako headless (`clusterIP: None`) z selektorem `app: shelf`. Skonfiguruj `client-egress` z `podSelector` wybierającym dokładnie `app: client` i tylko `Egress`; użyj `matchLabels` albo równoważnego wyrażenia `In` z jedną wartością: dopuść UDP i TCP 53 do jednego odbiorcy łączącego etykietę przestrzeni nazw `kubernetes.io/metadata.name: kube-system` i etykietę poda `k8s-app: kube-dns` oraz TCP 8080 do poda z etykietą `app: shelf` w tej samej przestrzeni nazw. Te dokładne selektory wskazują dostarczone cele; reguły i porty można przestawiać lub dzielić. Inne polityki wybierające klienta nie mogą rozszerzać egress.


  Sprawdź, czy UID PVC `ledger-shelf-0` odpowiada `/run/dq/facts/0/original-pvc-uid`, DNS klienta rozwiązuje `shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.`, a HTTP klienta do `shelf-0.shelf:8080` zwraca `ledger-120`. Kontrole obserwują tożsamość, konfigurację polityk i bieżącą łączność, nie całą historię magazynu. Pracuj tylko w zatoce offline.'
debrief: Trwałość, discovery i dostęp do sieci zostały zweryfikowane niezależnie przed przejściem pełnej
  ścieżki.
stages.0.brief: Pierwotny UID PVC, usługa headless, ograniczona polityka egress, DNS instancji i odpowiedź ledger odpowiadają opisowi.
stages.0.objectives.0.text: Pierwotny UID PVC, usługa headless, ograniczona polityka egress, DNS instancji i odpowiedź ledger odpowiadają opisowi.
hints.0.text: Sprawdź stabilną pamięć masową oddzielnie od discovery i egress.
hints.1.text: Headless DNS zależy od dopasowania gotowego endpoints.
hints.2.text: Napraw selector, następnie zezwól na DNS i tylko port shelf Pod.
phrases.0: Zachowałem stateful claim podczas odzyskiwania sieci.
phrases.1: Sprawdziłem liczbę porządkową DNS od izolowanego client.
phrases.2: Przywróciłem tylko wymagane przepływy zależności.
questions.0.points.0: Tak; discovery, endpoints i network policy to niezależne warstwy.
questions.0.points.1: Przed wymianą danych przetestuj każdą granicę.
questions.0.prompt: Czy sprawna pamięć masowa może współistnieć z uszkodzonym dostępem do aplikacji?
questions.1.points.0: Zastąpienie pamięci nie naprawia reguły selector ani wyjścia.
questions.1.points.1: Niepotrzebna wymiana może zniszczyć możliwe do odzyskania dane.
questions.1.prompt: Po co chronić tożsamość PVC podczas incydentu sieciowego?
