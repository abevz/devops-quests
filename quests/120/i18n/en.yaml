title: Stateful route recovery
brief: 'Work in `~/quest`; read `shelf.json`, `service.json`, `client.json`, `egress.json` and `original-pvc-uid`. The shelf
  storage exists, but the headless Service selector and requesting Pod egress are broken. Keep the original PVC. The linked
  guide introduces Kubernetes network diagnosis.


  Make Service `shelf` headless (`clusterIP: None`) with selector `app: shelf`. Configure `client-egress` with a `podSelector`
  selecting exactly `app: client` and only `Egress`; use `matchLabels` or an equivalent single-value `In` expression: allow
  UDP and TCP 53 to one peer combining namespace label `kubernetes.io/metadata.name: kube-system` and Pod label `k8s-app:
  kube-dns`, and TCP 8080 to the same-namespace Pod label `app: shelf`. These exact label selectors identify the supplied
  targets; rules and ports may be reordered or split. Other policies selecting that Pod must not add broader egress.


  Verify the `ledger-shelf-0` PVC UID matches `/run/dq/facts/0/original-pvc-uid`, DNS from that Pod resolves `shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local.`,
  and HTTP from that Pod to `shelf-0.shelf:8080` returns `ledger-120`. These checks observe identity, policy configuration
  and current connectivity, not the entire storage history. Work only in the offline bay.'
debrief: Persistence, discovery and network access were verified independently before the complete path passed.
stages.0.brief: The original PVC UID, headless Service, bounded egress policy, ordinal DNS and ledger response match the brief.
stages.0.objectives.0.text: The original PVC UID, headless Service, bounded egress policy, ordinal DNS and ledger response
  match the brief.
hints.0.text: Check stable storage separately from discovery and egress.
hints.1.text: Headless DNS depends on matching ready endpoints.
hints.2.text: Repair the selector, then allow DNS and only the shelf Pod port.
phrases.0: I preserved the stateful claim during network recovery.
phrases.1: I verified ordinal DNS from the isolated client.
phrases.2: I restored only the required dependency flows.
questions.0.points.0: Yes; discovery, endpoints and network policy are independent layers.
questions.0.points.1: Test each boundary before replacing data.
questions.0.prompt: Can healthy storage coexist with broken application access?
questions.1.points.0: Replacing storage does not repair a selector or egress rule.
questions.1.points.1: Unnecessary replacement can destroy recoverable data.
questions.1.prompt: Why preserve PVC identity during a network incident?
diagnostics.pvc: The original-pvc-uid must be nonempty and match ledger-shelf-0 UID.
diagnostics.shelf_service: Service shelf must have clusterIP None and selector app:shelf.
diagnostics.policies: Listing NetworkPolicies must succeed.
diagnostics.pods: Listing client Pods must succeed and return at least one Pod.
diagnostics.dns: DNS lookup of shelf-0.shelf from client must succeed.
diagnostics.http: The request from client to shelf-0.shelf:8080 must return ledger-120.
diagnostics.named: There must be exactly one NetworkPolicy named client-egress.
diagnostics.selector: The client-egress podSelector must match exactly app:client.
diagnostics.types: The client-egress policyTypes must contain only Egress.
diagnostics.egress: client-egress peers and ports must use the bounded form described in the brief.
diagnostics.unexpected: client-egress must have no unexpected flow; the original diagnostic identifies its destination, protocol
  and port.
diagnostics.other_egress: Another NetworkPolicy selecting a client must not permit extra egress; its name is in the original
  diagnostic.
diagnostics.other_invalid: Another NetworkPolicy has an invalid selector or egress; its name is in the original diagnostic.
diagnostics.invalid_input: NetworkPolicies and client Pod labels must be readable in the expected format.
diagnostics.missing_dns_udp_53: client-egress must allow dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress must allow dns TCP 53.
diagnostics.missing_shelf_tcp_8080: client-egress must allow shelf TCP 8080.
