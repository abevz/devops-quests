title: Stateful route recovery
brief: 'The persistent shelf is healthy, but the headless Service selects a retired
  label and the client has no egress exceptions. Recover ordinal DNS and ledger HTTP
  by fixing the headless selector and adding only the DNS and shelf:8080 flows. Retain
  the existing PVC and ledger-120. Keep the client isolated; replacing the policy
  with allow-all does not meet the contract.


  Quest files in `~/quest` (some appear in later stages): `shelf.json`, `service.json`,
  `client.json`, `egress.json`, `original-pvc-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The isolated client resolves shelf-0 and reads the original
  persistent ledger through the headless Service.'
debrief: Persistence, discovery and network access were verified independently before
  the complete path passed.
stages.0.brief: 'Success criteria: The isolated client resolves shelf-0 and reads
  the original persistent ledger through the headless Service.'
stages.0.objectives.0.text: The isolated client resolves shelf-0 and reads the original
  persistent ledger through the headless Service.
hints.0.text: Check stable storage separately from discovery and egress.
hints.1.text: Headless DNS depends on matching ready endpoints.
hints.2.text: Repair the selector, then allow DNS and only the shelf Pod port.
phrases.0: I preserved the stateful claim during network recovery.
phrases.1: I verified ordinal DNS from the isolated client.
phrases.2: I restored only the required dependency flows.
questions.0.points.0: Yes; discovery, endpoints and network policy are independent
  layers.
questions.0.points.1: Test each boundary before replacing data.
questions.0.prompt: Can healthy storage coexist with broken application access?
questions.1.points.0: Replacing storage does not repair a selector or egress rule.
questions.1.points.1: Unnecessary replacement can destroy recoverable data.
questions.1.prompt: Why preserve PVC identity during a network incident?
