title: Stateful route recovery
brief: "The shelf data must remain available to its consumer under a bounded network policy. Current discovery and\
  \ connectivity are incomplete.\n\nWork in `~/quest` on the workstation. Inputs by stage:\n- Stage 1: `shelf.yaml`,\
  \ `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Requirements:**\n\n- Stage 1:\n  - The existing data claim\
  \ keeps its identity and is not recreated.\n  - The existing data service supports stable Pod discovery.\n  -\
  \ Outbound access from the requesting workload is limited to DNS and the existing data service on TCP `8080`;\
  \ no other policy broadens it.\n  - From Deployment `client`, the existing storage Pod’s stable DNS name resolves.\n\
  \  - From Deployment `client`, the existing storage Pod serves `ledger-120` on port `8080`.\n\nThe check observes\
  \ claim identity, policy configuration and current connectivity, not the entire storage history."
debrief: Persistence, discovery and network access were verified independently before the complete path passed.
stages.0.brief: Keep the original data claim while restoring bounded consumer access.
hints.0.text: Check stable storage separately from discovery and egress.
hints.1.text: 'Headless DNS depends on matching ready endpoints.


  Inspect the supplied definitions, resource descriptions and events for the relevant stage.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Stage 1: Inspect these resource definitions for this stage.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: |-
  Repair the selector, then allow DNS and only the shelf Pod port.

  Verify the repaired stage and compare the observed result.

  Stage 1: The current claim UID equals the original recorded UID.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Stage 1: The requester resolves the full shelf Pod DNS name.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Stage 1: The requester receives `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Expected observations for the complete stage:
  - Stage 1: The claim UID is unchanged, Service `shelf` is headless, and the policies provide only the required egress.

phrases.0: I preserved the stateful claim during network recovery.
phrases.1: I verified ordinal DNS from the isolated client.
phrases.2: I restored only the required dependency flows.
questions.0.points.0: Yes; discovery, endpoints and network policy are independent layers.
questions.0.points.1: Test each boundary before replacing data.
questions.0.prompt: Can healthy storage coexist with broken application access?
questions.1.points.0: Replacing storage does not repair a selector or egress rule.
questions.1.points.1: Unnecessary replacement can destroy recoverable data.
questions.1.prompt: Why preserve PVC identity during a network incident?
stages.0.objectives.0.text: The existing data claim keeps its identity and is not recreated.
stages.0.objectives.1.text: The existing data service supports stable Pod discovery.
stages.0.objectives.2.text: Outbound access from the requesting workload is limited to DNS and the existing data
  service on TCP `8080`; no other policy broadens it.
stages.0.objectives.3.text: From Deployment `client`, the existing storage Pod’s stable DNS name resolves.
stages.0.objectives.4.text: From Deployment `client`, the existing storage Pod serves `ledger-120` on port `8080`.
diagnostics.policies: The observer could not list NetworkPolicies. Check current namespace access and API availability before interpreting any policy results. [Cause and check](guides#guide=kubernetes-10&section=q120-egress-policy-list)
diagnostics.pods: The client Pod inventory may be unavailable or empty. Verify there are Pods with app=client before checking whether the policy selects them. [Cause and check](guides#guide=kubernetes-10&section=q120-egress-client-label-input)
diagnostics.named: The intended client-egress rule may be missing or unreadable. Inspect the named NetworkPolicy in the client namespace. [Cause and check](guides#guide=kubernetes-10&section=q120-client-egress-policy-object)
diagnostics.egress: An egress rule may omit a destination or port, use an unrelated peer or fail to resolve a named shelf port. Check the DNS peers and individual allowed ports for shelf-0. [Cause and check](guides#guide=kubernetes-10&section=q120-bounded-egress-peer-and-port)
diagnostics.unexpected: A valid-looking rule may allow an additional protocol or port. Compare each destination/protocol/port tuple with the required DNS and shelf flows. [Cause and check](guides#guide=kubernetes-10&section=q120-egress-unexpected-flow)
diagnostics.other_egress: Another egress policy selecting a client Pod may add a forbidden flow because allowances are additive. Inspect the named policy and compare its allowed flows with the required set. [Cause and check](guides#guide=kubernetes-10&section=q120-additive-egress-policy)
diagnostics.other_invalid: The selector or egress rules of another policy could not be safely interpreted. Inspect the indicated object for unsupported selectors or broad destinations before judging effective access. [Cause and check](guides#guide=kubernetes-10&section=q120-unreadable-additive-policy)
diagnostics.missing_dns_udp_53: The policy may omit UDP 53 to the supplied cluster DNS Pods. Check the peer combining kube-system and kube-dns with a matching UDP port. [Cause and check](guides#guide=kubernetes-10&section=q120-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP DNS may be allowed while TCP 53 is missing. Check that the same supplied DNS peer also has a TCP 53 allowance. [Cause and check](guides#guide=kubernetes-10&section=q120-client-egress-dns-tcp)
diagnostics.missing_shelf_tcp_8080: DNS allowances do not provide the workload path. The policy may still lack TCP 8080 to the local shelf Pods. Inspect the app=shelf peer and its target port. [Cause and check](guides#guide=kubernetes-10&section=q120-client-egress-shelf-http)
diagnostics.probe_0_2: The policy observer can stop before assigning a condition if its local process or inputs fail. Check Python and the current policy and Pod observations. [Cause and check](guides#guide=kubernetes-10&section=q120-egress-policy-observer-input)
diagnostics.pvc: The ledger claim may be missing or have a different UID after recreation. Compare the live ledger-shelf-0 UID to the frozen receipt before repairing Service and policy settings. [Cause and check](guides#guide=kubernetes-10&section=q120-shelf-retained-ledger-pvc)
diagnostics.shelf_service: The shelf Service may have a virtual address or select the wrong Pod. Keep clusterIP at the literal None and compare app=shelf and any extra selector labels with the actual shelf-0 labels. [Cause and check](guides#guide=kubernetes-10&section=q120-shelf-headless-ordinal-source)
diagnostics.selector: The policy may match unrelated Pods or miss some current client Pods. Check that its selector requires app=client and matches all observed client labels. [Cause and check](guides#guide=kubernetes-10&section=q120-client-policy-selector-coverage)
diagnostics.types: The policy may declare only inbound rules or omit the Egress policy type. Check that the client-egress type list includes Egress. [Cause and check](guides#guide=kubernetes-10&section=q120-client-policy-egress-type)
diagnostics.dns: The headless Service may not publish shelf-0, or the running client may lack working DNS egress. Check the fully qualified ordinal A lookup from the client. [Cause and check](guides#guide=kubernetes-10&section=q120-live-shelf-ordinal-dns)
diagnostics.http: Ordinal DNS may work while TCP 8080 remains blocked or the shelf endpoint serves an unexpected body. Request shelf-0.shelf:8080 from client and compare the response with ledger-120. [Cause and check](guides#guide=kubernetes-10&section=q120-live-client-ledger-response)
diagnostics.probe_0_1: The headless Service observer may exit before naming a condition if its process cannot start. Check the workstation tools and access to the shelf objects. [Cause and check](guides#guide=kubernetes-10&section=q120-shelf-service-observer-input)
