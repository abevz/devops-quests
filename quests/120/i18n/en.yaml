title: Stateful route recovery
brief: "The shelf data must remain available to its consumer under a bounded network policy. Current discovery and\
  \ connectivity are incomplete.\n\nWork in `~/quest` on the workstation. Inputs by stage:\n- Stage 1: `shelf.yaml`,\
  \ `service.yaml`, `client.yaml`, `egress.yaml`.\n\n**Requirements:**\n\n- Stage 1:\n  - The existing data claim\
  \ keeps its identity and is not recreated.\n  - The existing data service supports stable Pod discovery.\n  -\
  \ Outbound access from the requesting workload is limited to DNS and the existing data service on TCP `8080`;\
  \ no other policy broadens it.\n  - From Deployment `client`, the existing storage Pod’s stable DNS name resolves.\n\
  \  - From Deployment `client`, the existing storage Pod serves `ledger-120` on port `8080`.\n\nThe check observes\
  \ claim identity, policy configuration and current connectivity, not the entire storage history."
debrief: Persistence, discovery and network access were verified independently before the complete path passed.
stages.0.brief: Keep the original data claim while restoring bounded consumer access.
hints.0.text: Check stable storage separately from discovery and egress.
hints.1.text: 'Headless DNS depends on matching ready endpoints.


  Inspect the supplied definitions, resource descriptions and events for the relevant stage.


  ```sh

  kubectl get pvc

  kubectl describe deployment client

  kubectl describe service shelf

  kubectl get networkpolicies -o yaml

  ```


  Stage 1: Inspect these resource definitions for this stage.


  ```sh

  kubectl get pvc ledger-shelf-0 -o yaml

  kubectl get service shelf -o yaml

  kubectl get networkpolicies -o yaml

  ```'
hints.2.text: |-
  Repair the selector, then allow DNS and only the shelf Pod port.

  Verify the repaired stage and compare the observed result.

  Stage 1: The current claim UID equals the original recorded UID.

  ```sh
  cat original-pvc-uid
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'; printf '\n'
  ```

  Stage 1: The requester resolves the full shelf Pod DNS name.

  ```sh
  kubectl exec deployment/client -c worker -- nslookup -type=A "shelf-0.shelf.$DQ_NAMESPACE.svc.cluster.local."
  ```

  Stage 1: The requester receives `ledger-120`.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://shelf-0.shelf:8080
  ```

  Expected observations for the complete stage:
  - Stage 1: The claim UID is unchanged, Service `shelf` is headless, and the policies provide only the required egress.

phrases.0: I preserved the stateful claim during network recovery.
phrases.1: I verified ordinal DNS from the isolated client.
phrases.2: I restored only the required dependency flows.
questions.0.points.0: Yes; discovery, endpoints and network policy are independent layers.
questions.0.points.1: Test each boundary before replacing data.
questions.0.prompt: Can healthy storage coexist with broken application access?
questions.1.points.0: Replacing storage does not repair a selector or egress rule.
questions.1.points.1: Unnecessary replacement can destroy recoverable data.
questions.1.prompt: Why preserve PVC identity during a network incident?
diagnostics.pvc: The original-pvc-uid must be nonempty and match ledger-shelf-0 UID.
diagnostics.shelf_service: |-
  The headless shelf Service must select the supplied storage Pod.

diagnostics.policies: Listing NetworkPolicies must succeed.
diagnostics.pods: Listing client Pods must succeed and return at least one Pod.
diagnostics.dns: DNS lookup of shelf-0.shelf from client must succeed.
diagnostics.http: The request from client to shelf-0.shelf:8080 must return ledger-120.
diagnostics.named: There must be exactly one NetworkPolicy named client-egress.
diagnostics.selector: |-
  The egress policy must apply to every current requesting Pod.

diagnostics.types: |-
  Egress must allow only DNS and the existing shelf data port; other selecting policies cannot broaden it.

diagnostics.egress: |-
  Egress must allow only DNS and the existing shelf data port; other selecting policies cannot broaden it.

diagnostics.unexpected: client-egress must have no unexpected flow; the original diagnostic identifies its destination,
  protocol and port.
diagnostics.other_egress: Another NetworkPolicy selecting a client must not permit extra egress; its name is in
  the original diagnostic.
diagnostics.other_invalid: Another NetworkPolicy has an invalid selector or egress; its name is in the original
  diagnostic.
diagnostics.invalid_input: NetworkPolicies and client Pod labels must be readable in the expected format.
diagnostics.missing_dns_udp_53: client-egress must allow dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress must allow dns TCP 53.
diagnostics.missing_shelf_tcp_8080: client-egress must allow shelf TCP 8080.
stages.0.objectives.0.text: The existing data claim keeps its identity and is not recreated.
stages.0.objectives.1.text: The existing data service supports stable Pod discovery.
stages.0.objectives.2.text: Outbound access from the requesting workload is limited to DNS and the existing data
  service on TCP `8080`; no other policy broadens it.
stages.0.objectives.3.text: From Deployment `client`, the existing storage Pod’s stable DNS name resolves.
stages.0.objectives.4.text: From Deployment `client`, the existing storage Pod serves `ledger-120` on port `8080`.
