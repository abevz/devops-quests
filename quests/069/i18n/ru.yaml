title: Права на секрет
brief: "Флоту нужна конфиденциальная доставка предоставленных синтетических учётных данных.\n\nРаботайте на workstation\
  \ в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\n**Требования:**\n\
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/station-token`.\n  - Содержимое:\
  \ предоставленные синтетические учётные данные.\n  - Режим доступа: `0600`.\n- Журнал развёртывания:\n  - На workstation\
  \ файл `~/quest/deployment.log` не должен содержать предоставленные синтетические учётные данные.\n  - Файл непуст.\n\
  - Оба предоставленных приложения должны принимать исходный синтетический секрет на каждом управляемом узле. Пути\
  \ входов и HTTP-интерфейсы перечислены в `~/quest/consumer-contract.json` на рабочей станции; программа — `provided-consumer.py`.\
  \ Сохраните исходные процессы, учётные записи, привилегии, командные строки и байты установленной программы из\
  \ `consumer-identities.json`. Каждый потребитель не должен читать или записывать вход другого; предоставленный\
  \ посторонний пользователь не должен читать или записывать ни один вход. Для второго входа допустима приватная\
  \ группа. Сохраните исходный `credentials.yml`.\n\nОтсутствие учётных данных в выводе задачи не шифрует `credentials.yml`."
debrief: Вы доставили приватные входы настоящим потребителям с учётом полномочий смены владельца, сохранив идентичности
  и изоляцию учётных записей.
stages.0.brief: Доставка учётных данных должна сохранять конфиденциальность файлов на хостах и записанного вывода.
stages.0.objectives.0.text: Файл `deployment.log` на workstation непуст и не раскрывает предоставленные игровые
  учётные данные.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/station-token`
  содержит предоставленные синтетические учётные данные. Исходный секрет доступен обоим исходным приложениям на
  всех узлах; чтение и запись со стороны другого потребителя и постороннего пользователя запрещены.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/station-token`
  имеет режим `0600`.
hints.0.text: Приватная доставка должна обеспечивать реальный доступ получателя и изоляцию от других учётных записей.
  Изменение метаданных ограничено фактическими полномочиями оператора.
hints.1.text: Сопоставьте `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` и `provided-consumer.py`.
  Изучите владельцев и права входов на управляемых узлах, список полномочий оператора и статус HTTP-аутентификации.
  Не выводите секреты в диагностику.
hints.2.text: 'Скрывайте вывод чувствительного копирования через `no_log`. При этих полномочиях подготовьте содержимое
  и ограниченные права до передачи владельца; отдельная смена владельца не запрашивает недоступное изменение прав
  после передачи. Проверьте каждое приложение исходным секретом без его вывода: ожидаются HTTP 200 и `credential-ready`.
  Подтвердите, что другой потребитель и посторонний пользователь не могут открыть чужие входы на чтение и запись;
  сохраните прежний режим `0600` и непустой приватный `deployment.log`.'
phrases.0: Я защитил права файла цели и вывод задачи.
phrases.1: Я проверил секрет без его печати.
phrases.2: Я не считал no_log шифрованием данных на диске.
diagnostics.deployment_log: Play мог не запускаться с сохранением вывода либо deployment.log пуст; сохраните непустой журнал выполнения. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-nonempty-log)
diagnostics.redaction: Отсутствующий/пустой журнал также нарушает redaction; иначе точный выданный токен мог попасть в diff/вывод из задачи без no_log. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-exact-token-in-log)
diagnostics.credential_original: Редактирование или переформатирование credentials.yml меняет зафиксированные байты; исправляйте доставку, сохраняя выданный источник. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-original-input-bytes)
diagnostics.consumer_identity: Перезапуск процесса, смена UID/групп/capabilities, команды или установленной программы меняют идентичность; доставляйте файлы исходным потребителям. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-original-process-and-privileges)
diagnostics.credential_access: Неверный владелец, группы или широкие права позволяют другому потребителю либо outsider открыть credential для чтения или append; проверяйте реальные UID, а не доступ root. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-cross-consumer-denial)
diagnostics.credential_auth: Endpoint вернул наблюдаемый, но неожиданный успешный ответ/body; сравните с credential-ready при исходном токене. Ошибки HTTP 401/503 относятся к диагностике наблюдения. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-observed-auth-response)
diagnostics.consumer_budget: SSH либо удалённый observer может превысить оставшийся таймаут subprocess; проверьте связность хоста и команду наблюдения. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-bounded-ssh-observer)
diagnostics.consumer_observation: Файл mode-600 с владельцем root может быть недоступен своему потребителю; HTTP 401/503, socket-ошибки, отсутствующий процесс/файл или ошибки SSH/receipt также мешают наблюдению. Проверьте владельца без перезапуска. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-own-file-access-and-observation)
diagnostics.probe_0_1: Запуск helper либо прерванная старая обёртка могут завершиться до конкретного маркера; обычные ошибки SSH-проверки содержимого дают content_1/2/3. Проверьте импорты и доступность хостов. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-legacy-and-startup-fallback)
diagnostics.content_1: app1 может хранить старый credential либо SSH/чтение файла не прошли; доставьте неизменённое значение credentials.yml в /srv/site/station-token. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-host-1-content)
diagnostics.mode_1: app1 может сохранять mode 644 из выданной copy-задачи либо stat/SSH не прошли; задайте 600 для /srv/site/station-token, сохраняя доступ своему потребителю. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-host-1-mode)
diagnostics.content_2: app2 может хранить старый credential либо SSH/чтение файла не прошли; доставьте неизменённое значение credentials.yml в /srv/site/station-token. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-host-2-content)
diagnostics.mode_2: app2 может сохранять mode 644 из выданной copy-задачи либо stat/SSH не прошли; задайте 600 для /srv/site/station-token, сохраняя доступ своему потребителю. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-host-2-mode)
diagnostics.content_3: app3 может хранить старый credential либо SSH/чтение файла не прошли; доставьте неизменённое значение credentials.yml в /srv/site/station-token. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-host-3-content)
diagnostics.mode_3: app3 может сохранять mode 644 из выданной copy-задачи либо stat/SSH не прошли; задайте 600 для /srv/site/station-token, сохраняя доступ своему потребителю. [Причина и проверка](guides#guide=ansible-13&section=private-delivery-host-3-mode)
