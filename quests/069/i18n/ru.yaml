title: Права на секрет
brief: 'Credential станции копируется с общедоступными правами и включённым логированием. Исправьте sensitive
  copy в rollout.yml на mode 0600 и no_log: true, затем выполните ansible-playbook --diff rollout.yml
  > deployment.log. Credential синтетический, только для этого fleet. Проверьте значение и права на трёх
  целях без печати и попадания в лог запуска. no_log ограничивает вывод задачи, но не шифрует credentials.yml.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `credentials.yml`, `deployment.log`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Три файла содержат игровой credential при mode 0600, copy использует no_log, значение
  отсутствует в логе запуска.'
debrief: Синтетический credential закрыт на диске и отсутствует в diff задачи.
stages.0.brief: 'Три файла содержат игровой credential при mode 0600, copy использует no_log, значение
  отсутствует в логе запуска.


  Результат проверки: Три файла содержат игровой credential при mode 0600, copy использует no_log, значение
  отсутствует в логе запуска.'
stages.0.objectives.0.text: Три файла содержат игровой credential при mode 0600, copy использует no_log,
  значение отсутствует в логе запуска.
hints.0.text: Права файла и скрытие вывода закрывают разные пути утечки.
hints.1.text: Diff раскрывает содержимое copy, если sensitive task не скрывает вывод.
hints.2.text: Используйте mode 0600 и no_log; проверяйте права целей без печати значения.
phrases.0: Я защитил права файла цели и вывод задачи.
phrases.1: Я проверил секрет без его печати.
phrases.2: Я не считал no_log шифрованием данных на диске.
