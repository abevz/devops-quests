title: Secret-Berechtigungen
brief: 'Ein station credential wird mit öffentlichen Dateiberechtigungen und aktivierter Protokollierung
  kopiert. Korrigieren Sie rollout.yml in den Modus 0600 und no_log: true für die Task sensitive copy
  und führen Sie dann ansible-playbook --diff rollout.yml > aus deployment.log. Der credential ist synthetisch
  und gehört nur zu diesem fleet. Überprüfen Sie den tatsächlichen Wert und die Berechtigungen auf allen
  drei Hosts, ohne sie auszudrucken oder in das Bereitstellungsprotokoll zu verlieren. no_log begrenzt
  die Aufgabenausgabe; Es handelt sich nicht um eine Verschlüsselung von credentials.yml.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `credentials.yml`, `deployment.log`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Alle drei Tokendateien enthalten das Spiel credential im Modus 0600, das
  copy hat no_log und das Bereitstellungsprotokoll legt seinen Wert nicht offen.'
debrief: Der synthetische credential ist privat auf der Festplatte und fehlt in der Task-Ausgabe diff.
stages.0.brief: 'Erfolgskriterien: Alle drei Tokendateien enthalten das Spiel credential im Modus 0600,
  copy hat no_log und das Bereitstellungsprotokoll legt seinen Wert nicht offen.'
stages.0.objectives.0.text: Alle drei Tokendateien enthalten das Spiel credential im Modus 0600, copy
  hat no_log und das Bereitstellungsprotokoll legt seinen Wert nicht offen.
hints.0.text: Dateiberechtigungen und Ausgabeunterdrückung lösen unterschiedliche Belichtungspfade.
hints.1.text: Ein Diff kann kopierte Inhalte offenbaren, es sei denn, sensitive task unterdrückt die Protokollierung.
hints.2.text: Verwenden Sie den Modus 0600 sowie die tatsächlichen Zielmodi no_log und inspect, ohne den
  Wert zu drucken.
phrases.0: Ich habe sowohl die Zieldateiberechtigungen als auch die Aufgabenausgabe geschützt.
phrases.1: Ich habe das Geheimnis überprüft, ohne es auszudrucken.
phrases.2: Ich habe no_log nicht als Verschlüsselung im Ruhezustand behandelt.
