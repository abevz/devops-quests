title: Secret-Berechtigungen
brief: "Die Flotte benötigt eine vertrauliche Auslieferung der bereitgestellten synthetischen Zugangsdaten.\n\n\
  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\
  \n**Anforderungen:**\n- Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/station-token`.\n\
  \  - Inhalt: die bereitgestellten synthetischen Zugangsdaten.\n  - Zugriffsmodus: `0600`.\n- Bereitstellungsprotokoll:\n\
  \  - Auf der Workstation darf `~/quest/deployment.log` nicht die bereitgestellten synthetischen Zugangsdaten enthalten.\n\
  \  - Die Datei ist nicht leer.\n- Beide bereitgestellten Anwendungen müssen auf jedem verwalteten Host den ursprünglichen\
  \ synthetischen Zugangswert authentifizieren. Eingabepfade und HTTP-Schnittstellen stehen in `~/quest/consumer-contract.json`\
  \ auf der Workstation; das Programm ist `provided-consumer.py`. Bewahre ursprüngliche Prozesse, Benutzer, Rechte,\
  \ Befehlszeilen und installierte Programmbytes aus `consumer-identities.json`. Kein Verbraucher darf die Eingabe\
  \ des anderen lesen oder schreiben; der bereitgestellte Außenstehende darf keine der Eingaben lesen oder schreiben.\
  \ Privater Gruppenzugriff ist für die zweite Eingabe zulässig. Bewahre die ursprüngliche `credentials.yml`.\n\n\
  Das Auslassen der Zugangsdaten aus der Aufgabenausgabe verschlüsselt `credentials.yml` nicht."
debrief: Du hast private Eingaben an tatsächliche Verbraucher ausgeliefert, Eigentumsbefugnisse berücksichtigt und
  Identitäten sowie Zugriffstrennung bewahrt.
stages.0.brief: Die Zugangsdaten müssen sowohl in Zieldateien als auch in aufgezeichneter Ausgabe vertraulich bleiben.
stages.0.objectives.0.text: Die Workstation-Datei `deployment.log` ist nicht leer und legt die bereitgestellten
  Spiel-Zugangsdaten nicht offen.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/station-token`
  die bereitgestellten synthetischen Zugangsdaten. Der ursprüngliche Zugangswert erreicht beide ursprünglichen Verbraucher
  auf allen Hosts; Lesen und Schreiben durch andere Verbraucher oder Außenstehende bleiben verboten.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/station-token` den
  Modus `0600`.
hints.0.text: Private Auslieferung muss tatsächlichen Empfängerzugriff und Isolation gewährleisten. Metadatenänderungen
  unterliegen den tatsächlichen Befugnissen des Operators.
hints.1.text: |-
  Vergleiche `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` und `provided-consumer.py`. Prüfe Eigentümer und Eingaberechte auf den verwalteten Hosts, die Befugnisse des Operators und HTTP-Authentifizierung. Gib keine Zugangswerte in Diagnosen aus.

  Prüfe no_log bei Aufgaben mit Zugangsdaten. Vergleiche die Fähigkeiten des Operators mit dem aktuellen Eigentümer und Modus jedes Ziels. Verwende bei Zugangsdaten Metadaten zur Prüfung.
hints.2.text: |-
  Prüfe jede Anwendung mit dem ursprünglichen Wert ohne dessen Ausgabe: erwartet werden HTTP 200 und `credential-ready`. Andere Verbraucher und der Außenstehende dürfen fremde Eingaben weder zum Lesen noch Schreiben öffnen; bewahre den bisherigen Modus `0600` und ein nicht leeres privates `deployment.log`.

  `log_ok: True` bedeutet, dass das Protokoll Inhalt hat und den exakten Zugangswert nicht enthält. Erwarte für jeden Host und jeden Verbraucher `response_ok: True`.

  ```sh
  python3 - <<'PY'
  import json, os, urllib.request
  from pathlib import Path
  import yaml
  contract = json.loads(Path('consumer-contract.json').read_text())
  token = yaml.safe_load(Path('credentials.yml').read_text())['station_token']
  log = Path('deployment.log').read_bytes()
  print('log_ok:', bool(log) and token.encode() not in log)
  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
  for station in ('app1', 'app2', 'app3'):
      host = station + '-' + os.environ['DQ_NAMESPACE'].removeprefix('dq-')
      for item in contract['consumers']:
          url = 'http://' + host + ':' + str(item['port']) + '/'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
          with opener.open(request, timeout=3) as response:
              ok = response.status == 200 and response.read(65536).decode().strip() == contract['response']
              print(station, item['name'], 'response_ok:', ok)
  PY
  ```
phrases.0: Ich habe sowohl die Zieldateiberechtigungen als auch die Aufgabenausgabe geschützt.
phrases.1: Ich habe das Geheimnis überprüft, ohne es auszudrucken.
phrases.2: Ich habe no_log nicht als Verschlüsselung im Ruhezustand behandelt.
diagnostics.deployment_log: Das Play wurde möglicherweise ohne Ausgabeaufzeichnung ausgeführt oder deployment.log ist leer; bewahren Sie ein nichtleeres Ausführungsprotokoll auf. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-nonempty-log)
diagnostics.redaction: Auch ein fehlendes/leeres Protokoll verletzt redaction; sonst kann das exakt gelieferte Token wegen fehlendem no_log in diff/Ausgabe stehen. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-exact-token-in-log)
diagnostics.credential_original: Ändern oder Neuformatieren von credentials.yml verändert eingefrorene Bytes; korrigieren Sie die Zustellung und erhalten Sie die gelieferte Eingabe. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-original-input-bytes)
diagnostics.consumer_identity: Neustart eines Prozesses oder Änderung von UID/Gruppen/capabilities, Befehl oder Programm verändert seine eingefrorene Identität; beliefern Sie die ursprünglichen Verbraucher. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-original-process-and-privileges)
diagnostics.credential_access: Falscher Eigentümer, Gruppen oder breite Rechte erlauben einem anderen Verbraucher oder outsider das Öffnen von credential zum Lesen oder append; prüfen Sie tatsächliche Identitäten statt nur root. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-cross-consumer-denial)
diagnostics.credential_auth: Der Endpoint lieferte eine beobachtete, aber unerwartete Erfolgsantwort/body; vergleichen Sie mit credential-ready beim ursprünglichen Token. HTTP 401/503 verwenden die Beobachtungsdiagnose. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-observed-auth-response)
diagnostics.consumer_budget: SSH oder der entfernte Observer kann das verbleibende subprocess Zeitlimit überschreiten; prüfen Sie Hostverbindung und Beobachtungsbefehl. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-bounded-ssh-observer)
diagnostics.consumer_observation: Eine root gehörende mode-600 Datei kann den eigenen Verbraucher aussperren; HTTP 401/503, Socketfehler, fehlende Prozesse/Eingaben oder SSH-/Receiptfehler verhindern ebenfalls die Beobachtung. Prüfen Sie den Eigentümer ohne Neustart. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-own-file-access-and-observation)
diagnostics.probe_0_1: Helper-Start oder eine unterbrochene ältere Hülle kann vor einem spezifischen Marker stoppen; normale SSH-Inhaltsfehler ergeben content_1/2/3. Prüfen Sie Imports und Host-Erreichbarkeit. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-legacy-and-startup-fallback)
diagnostics.content_1: app1 enthält möglicherweise noch das alte credential oder SSH/Dateizugriff scheitert; liefern Sie den unveränderten Wert aus credentials.yml nach /srv/site/station-token. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-host-1-content)
diagnostics.mode_1: app1 behält möglicherweise mode 644 aus der gelieferten copy Aufgabe oder stat/SSH scheitert; setzen Sie 600 für /srv/site/station-token unter Erhalt des Zugriffs des eigenen Verbrauchers. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-host-1-mode)
diagnostics.content_2: app2 enthält möglicherweise noch das alte credential oder SSH/Dateizugriff scheitert; liefern Sie den unveränderten Wert aus credentials.yml nach /srv/site/station-token. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-host-2-content)
diagnostics.mode_2: app2 behält möglicherweise mode 644 aus der gelieferten copy Aufgabe oder stat/SSH scheitert; setzen Sie 600 für /srv/site/station-token unter Erhalt des Zugriffs des eigenen Verbrauchers. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-host-2-mode)
diagnostics.content_3: app3 enthält möglicherweise noch das alte credential oder SSH/Dateizugriff scheitert; liefern Sie den unveränderten Wert aus credentials.yml nach /srv/site/station-token. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-host-3-content)
diagnostics.mode_3: app3 behält möglicherweise mode 644 aus der gelieferten copy Aufgabe oder stat/SSH scheitert; setzen Sie 600 für /srv/site/station-token unter Erhalt des Zugriffs des eigenen Verbrauchers. [Ursache und Prüfung](guides#guide=ansible-13&section=private-delivery-host-3-mode)
