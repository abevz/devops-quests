title: Secret-Berechtigungen
brief: |-
  Die Flotte benötigt eine vertrauliche Auslieferung der bereitgestellten synthetischen Zugangsdaten.

  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/station-token`.
    - Inhalt: die bereitgestellten synthetischen Zugangsdaten.
    - Zugriffsmodus: `0600`.
  - Bereitstellungsprotokoll:
    - Auf der Workstation darf `~/quest/deployment.log` nicht die bereitgestellten synthetischen Zugangsdaten enthalten.
    - Die Datei ist nicht leer.

  Das Auslassen der Zugangsdaten aus der Aufgabenausgabe verschlüsselt `credentials.yml` nicht.
debrief: Der synthetische credential ist privat auf der Festplatte und fehlt in der Task-Ausgabe diff.
stages.0.brief: Die Zugangsdaten müssen sowohl in Zieldateien als auch in aufgezeichneter Ausgabe vertraulich
  bleiben.
stages.0.objectives.0.text: Die Workstation-Datei `deployment.log` ist nicht leer und legt die bereitgestellten
  Spiel-Zugangsdaten nicht offen.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/station-token`
  die bereitgestellten synthetischen Zugangsdaten.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/station-token`
  den Modus `0600`.
hints.0.text: Dateiberechtigungen und Ausgabeunterdrückung lösen unterschiedliche Belichtungspfade.
hints.1.text: |-
  Ein Diff kann kopierte Inhalte offenbaren, es sei denn, sensitive task unterdrückt die Protokollierung. `no_log` begrenzt die Aufgabenausgabe; es verschlüsselt `credentials.yml` nicht.

  Prüfen Sie Inventory und das bereitgestellte Playbook auf der Workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ls -l credentials.yml
  ```
hints.2.text: |-
  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/station-token)" = game-station-secret-69 && printf "credential matches\n"'` — Jeder Host bestätigt `credential matches`, ohne die Zugangsdaten auszugeben.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/station-token; if runuser -u nobody -- cat /srv/site/station-token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Jeder Host zeigt `-rw-------` und bestätigt `unprivileged read denied` für Benutzer `nobody`.
  - `python3 -c 'from pathlib import Path; import yaml; s=yaml.safe_load(Path("credentials.yml").read_text())["station_token"]; log=Path("deployment.log").read_text(); assert log and s not in log; print("nonempty private deployment record")'` — Bestätigt `nonempty private deployment record`, ohne Zugangsdaten oder Loginhalt anzuzeigen.
phrases.0: Ich habe sowohl die Zieldateiberechtigungen als auch die Aufgabenausgabe geschützt.
phrases.1: Ich habe das Geheimnis überprüft, ohne es auszudrucken.
phrases.2: Ich habe no_log nicht als Verschlüsselung im Ruhezustand behandelt.
diagnostics.deployment_log: Die Workstation-Datei `~/quest/deployment.log` muss nicht leer sein.
diagnostics.redaction: Die Workstation-Datei `deployment.log` legt die bereitgestellten Spiel-Zugangsdaten
  nicht offen.
