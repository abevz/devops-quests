title: Secret permissions
brief: "The fleet needs private delivery of a supplied synthetic credential.\n\nWork on the workstation in `~/quest`\
  \ with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\n**Requirements:**\n- File on every\
  \ managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/station-token`.\n  - Content: the supplied synthetic\
  \ credential.\n  - Access mode: `0600`.\n- Deployment record:\n  - On the workstation, `~/quest/deployment.log`\
  \ must not contain the supplied synthetic credential.\n  - The file is nonempty.\n- Both supplied applications\
  \ must authenticate the original synthetic credential on every managed host. Their input paths and HTTP interfaces\
  \ are listed in workstation `~/quest/consumer-contract.json`; the supplied program is `provided-consumer.py`.\
  \ Preserve their original process identities, principals, privileges, command lines and installed program bytes\
  \ from `consumer-identities.json`. Each consumer must be unable to read or write the other consumer’s input; the\
  \ supplied outsider must be unable to read or write either input. Private group access is acceptable for the secondary\
  \ input. Preserve the original `credentials.yml`.\n\nKeeping the credential out of task output does not encrypt\
  \ `credentials.yml`."
debrief: You delivered private inputs to real consumers while respecting ownership authority, preserving identities
  and denying cross-principal access.
stages.0.brief: Credential delivery must keep both target files and recorded output private.
stages.0.objectives.0.text: The workstation `deployment.log` is nonempty and does not expose the supplied game credential.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/station-token` contains the
  supplied synthetic credential. The supplied credential reaches both original application consumers on every host
  while cross-consumer and outsider reads and writes remain denied.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/station-token` has mode `0600`.
hints.0.text: Private delivery must satisfy both the recipient’s real access and isolation from other principals.
  File metadata changes are limited by the operator’s actual authority.
hints.1.text: |-
  Compare `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` and `provided-consumer.py`. Inspect input ownership and modes on the managed hosts, the operator capability list and the HTTP authentication status. Do not print credential values into diagnostic output.

  Inspect no_log on tasks that handle credentials, and compare the operator's capabilities with the current owner and mode of each destination. Use metadata observations for credentials.
hints.2.text: |-
  Verify each application with the original credential without printing it: expect HTTP 200 and `credential-ready`. Confirm other consumers and the outsider cannot open either foreign input for reading or writing; retain legacy mode `0600` and the nonempty private `deployment.log`.

  Expect `log_ok: True` for a nonempty log with the exact credential absent. Expect `response_ok: True` for every host and consumer.

  ```sh
  python3 - <<'PY'
  import json, os, urllib.request
  from pathlib import Path
  import yaml
  contract = json.loads(Path('consumer-contract.json').read_text())
  token = yaml.safe_load(Path('credentials.yml').read_text())['station_token']
  log = Path('deployment.log').read_bytes()
  print('log_ok:', bool(log) and token.encode() not in log)
  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
  for station in ('app1', 'app2', 'app3'):
      host = station + '-' + os.environ['DQ_NAMESPACE'].removeprefix('dq-')
      for item in contract['consumers']:
          url = 'http://' + host + ':' + str(item['port']) + '/'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
          with opener.open(request, timeout=3) as response:
              ok = response.status == 200 and response.read(65536).decode().strip() == contract['response']
              print(station, item['name'], 'response_ok:', ok)
  PY
  ```
phrases.0: I protected both target-file permissions and task output.
phrases.1: I verified the secret without printing it.
phrases.2: I did not treat no_log as encryption at rest.
diagnostics.deployment_log: The play may not have run with output captured, or deployment.log is empty; retain a nonempty execution log. [Cause and check](guides#guide=ansible-13&section=private-delivery-nonempty-log)
diagnostics.redaction: A missing/empty log also fails redaction; otherwise the exact supplied token may appear in diff/output because the sensitive task lacks no_log. [Cause and check](guides#guide=ansible-13&section=private-delivery-exact-token-in-log)
diagnostics.credential_original: Editing or reformatting credentials.yml changes the frozen source bytes; repair delivery while retaining the supplied input unchanged. [Cause and check](guides#guide=ansible-13&section=private-delivery-original-input-bytes)
diagnostics.consumer_identity: Restarting a supplied process, changing its UID/groups/capabilities, command or installed program changes its frozen identity; deliver files to the original consumers. [Cause and check](guides#guide=ansible-13&section=private-delivery-original-process-and-privileges)
diagnostics.credential_access: Wrong ownership, groups or broad permissions may let another consumer or outsider open a credential for reading or appending; test the actual principals, not just root access. [Cause and check](guides#guide=ansible-13&section=private-delivery-cross-consumer-denial)
diagnostics.credential_auth: The endpoint returned an observed but unexpected success response/body; compare it with credential-ready using the original token. HTTP 401/503 errors use the observation diagnostic. [Cause and check](guides#guide=ansible-13&section=private-delivery-observed-auth-response)
diagnostics.consumer_budget: SSH or its remote observer may exceed the remaining subprocess timeout; check host connectivity and the remote observation command. [Cause and check](guides#guide=ansible-13&section=private-delivery-bounded-ssh-observer)
diagnostics.consumer_observation: A root-owned mode-600 file can deny its own consumer; HTTP 401/503, socket errors, missing process/input or SSH/receipt errors also stop observation. Check recipient ownership without restarting consumers. [Cause and check](guides#guide=ansible-13&section=private-delivery-own-file-access-and-observation)
diagnostics.probe_0_1: Helper startup or an interrupted legacy wrapper may stop before any specific marker; ordinary SSH content failures use content_1/2/3. Inspect imports and host reachability. [Cause and check](guides#guide=ansible-13&section=private-delivery-legacy-and-startup-fallback)
diagnostics.content_1: app1 may still hold the retired credential, or SSH/file access failed; deliver the unchanged credentials.yml value to /srv/site/station-token. [Cause and check](guides#guide=ansible-13&section=private-delivery-host-1-content)
diagnostics.mode_1: app1 may retain mode 644 from the supplied copy task, or stat/SSH failed; require 600 on /srv/site/station-token while preserving access for its own consumer. [Cause and check](guides#guide=ansible-13&section=private-delivery-host-1-mode)
diagnostics.content_2: app2 may still hold the retired credential, or SSH/file access failed; deliver the unchanged credentials.yml value to /srv/site/station-token. [Cause and check](guides#guide=ansible-13&section=private-delivery-host-2-content)
diagnostics.mode_2: app2 may retain mode 644 from the supplied copy task, or stat/SSH failed; require 600 on /srv/site/station-token while preserving access for its own consumer. [Cause and check](guides#guide=ansible-13&section=private-delivery-host-2-mode)
diagnostics.content_3: app3 may still hold the retired credential, or SSH/file access failed; deliver the unchanged credentials.yml value to /srv/site/station-token. [Cause and check](guides#guide=ansible-13&section=private-delivery-host-3-content)
diagnostics.mode_3: app3 may retain mode 644 from the supplied copy task, or stat/SSH failed; require 600 on /srv/site/station-token while preserving access for its own consumer. [Cause and check](guides#guide=ansible-13&section=private-delivery-host-3-mode)
