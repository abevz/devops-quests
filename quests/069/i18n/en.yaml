hints.0.text: File permissions and output suppression solve different exposure paths.
hints.1.text: A diff can reveal copied content unless the sensitive task suppresses logging.
hints.2.text: Use mode 0600 plus no_log and inspect actual target modes without printing the value.
phrases.0: I protected both target-file permissions and task output.
phrases.1: I verified the secret without printing it.
phrases.2: I did not treat no_log as encryption at rest.
