title: Secret permissions
brief: 'A station credential is copied with public file permissions and logging enabled. Correct rollout.yml
  to mode 0600 and no_log: true for the sensitive copy task, then run ansible-playbook --diff rollout.yml
  > deployment.log. The credential is synthetic and belongs only to this fleet. Verify its actual value
  and permissions on all three hosts without printing it or leaking it into the deployment log. no_log
  limits task output; it is not encryption of credentials.yml.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `credentials.yml`, `deployment.log`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: All three token files contain the game credential at mode 0600, the copy has
  no_log and the deployment log does not expose its value.'
debrief: The synthetic credential is private on disk and absent from task diff output.
