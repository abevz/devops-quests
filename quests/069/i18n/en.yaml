title: Secret permissions
brief: "The fleet needs private delivery of a supplied synthetic credential.\n\nWork on the workstation in `~/quest`\
  \ with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\n**Requirements:**\n- File on every\
  \ managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/station-token`.\n  - Content: the supplied synthetic\
  \ credential.\n  - Access mode: `0600`.\n- Deployment record:\n  - On the workstation, `~/quest/deployment.log`\
  \ must not contain the supplied synthetic credential.\n  - The file is nonempty.\n- Both supplied applications\
  \ must authenticate the original synthetic credential on every managed host. Their input paths and HTTP interfaces\
  \ are listed in workstation `~/quest/consumer-contract.json`; the supplied program is `provided-consumer.py`.\
  \ Preserve their original process identities, principals, privileges, command lines and installed program bytes\
  \ from `consumer-identities.json`. Each consumer must be unable to read or write the other consumer’s input; the\
  \ supplied outsider must be unable to read or write either input. Private group access is acceptable for the secondary\
  \ input. Preserve the original `credentials.yml`.\n\nKeeping the credential out of task output does not encrypt\
  \ `credentials.yml`."
debrief: You delivered private inputs to real consumers while respecting ownership authority, preserving identities
  and denying cross-principal access.
stages.0.brief: Credential delivery must keep both target files and recorded output private.
stages.0.objectives.0.text: The workstation `deployment.log` is nonempty and does not expose the supplied game credential.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/station-token` contains the
  supplied synthetic credential. The supplied credential reaches both original application consumers on every host
  while cross-consumer and outsider reads and writes remain denied.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/station-token` has mode `0600`.
hints.0.text: Private delivery must satisfy both the recipient’s real access and isolation from other principals.
  File metadata changes are limited by the operator’s actual authority.
hints.1.text: Compare `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` and `provided-consumer.py`.
  Inspect input ownership and modes on the managed hosts, the operator capability list and the HTTP authentication
  status. Do not print credential values into diagnostic output.
hints.2.text: 'Protect sensitive copy output with `no_log`. Under these capabilities, prepare content and restrictive
  permissions before transferring ownership; metadata-only ownership updates avoid requesting an unavailable permission
  change after transfer. Verify each application with the original credential without printing it: expect HTTP 200
  and `credential-ready`. Confirm other consumers and the outsider cannot open either foreign input for reading
  or writing; retain legacy mode `0600` and the nonempty private `deployment.log`.'
phrases.0: I protected both target-file permissions and task output.
phrases.1: I verified the secret without printing it.
phrases.2: I did not treat no_log as encryption at rest.
diagnostics.deployment_log: Workstation `~/quest/deployment.log` must be nonempty.
diagnostics.redaction: The workstation `deployment.log` does not expose the supplied game credential.
diagnostics.content_1: 'app1, `/srv/site/station-token`: content `game-station-secret-69`.'
diagnostics.content_2: 'app2, `/srv/site/station-token`: content `game-station-secret-69`.'
diagnostics.content_3: 'app3, `/srv/site/station-token`: content `game-station-secret-69`.'
diagnostics.mode_1: 'app1, `/srv/site/station-token`: access mode `600`.'
diagnostics.mode_2: 'app2, `/srv/site/station-token`: access mode `600`.'
diagnostics.mode_3: 'app3, `/srv/site/station-token`: access mode `600`.'
diagnostics.credential_access: Credential access is too broad. Another consumer or the outsider can open a protected
  input for reading or writing.
diagnostics.credential_auth: An application did not authenticate the original credential. Check its input, private
  access and HTTP response.
diagnostics.consumer_identity: The supplied application identity changed. Compare its process, principal, privileges,
  command line and installed program with the original receipt.
diagnostics.consumer_budget: The application observation exceeded its budget. Check SSH availability and HTTP responsiveness
  on the managed hosts.
diagnostics.consumer_observation: The supplied application could not be observed. Check its process, identity receipt,
  SSH connection and HTTP endpoint.
diagnostics.credential_original: The original workstation credentials.yml changed. Preserve the supplied input bytes;
  correct delivery without rewriting its source.
diagnostics.probe_0_1: 'The current inputs could not verify this objective: On every managed host (`app1`, `app2`,
  `app3`), `/srv/site/station-token` contains the supplied synthetic credential. The supplied credential reaches
  both original application consumers on every host while cross-consumer and outsider reads and writes remain denied.'
