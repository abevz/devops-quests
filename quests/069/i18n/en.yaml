title: Secret permissions
brief: |-
  The fleet needs private delivery of a supplied synthetic credential.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/station-token`.
    - Content: the supplied synthetic credential.
    - Access mode: `0600`.
  - Deployment record:
    - On the workstation, `~/quest/deployment.log` must not contain the supplied synthetic credential.
    - The file is nonempty.

  Keeping the credential out of task output does not encrypt `credentials.yml`.
debrief: The synthetic credential is private on disk and absent from task diff output.
stages.0.brief: Credential delivery must keep both target files and recorded output private.
stages.0.objectives.0.text: The workstation `deployment.log` is nonempty and does not expose the supplied
  game credential.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/station-token`
  contains the supplied synthetic credential.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/station-token`
  has mode `0600`.
hints.0.text: File permissions and output suppression solve different exposure paths.
hints.1.text: |-
  A diff can reveal copied content unless the sensitive task suppresses logging. `no_log` limits task output; it does not encrypt `credentials.yml`.

  Inspect the inventory and the supplied playbook on the workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ls -l credentials.yml
  ```
hints.2.text: |-
  Verify the result from `~/quest` on the workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/station-token)" = game-station-secret-69 && printf "credential matches\n"'` — Every host confirms `credential matches` without printing the credential.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/station-token; if runuser -u nobody -- cat /srv/site/station-token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Every host shows `-rw-------` and confirms `unprivileged read denied` for user `nobody`.
  - `python3 -c 'from pathlib import Path; import yaml; s=yaml.safe_load(Path("credentials.yml").read_text())["station_token"]; log=Path("deployment.log").read_text(); assert log and s not in log; print("nonempty private deployment record")'` — Confirms `nonempty private deployment record` without displaying the credential or log contents.
phrases.0: I protected both target-file permissions and task output.
phrases.1: I verified the secret without printing it.
phrases.2: I did not treat no_log as encryption at rest.
