title: Permisos Secret
brief: "La flota necesita una entrega privada de la credencial sintética suministrada.\n\nTrabaja en la workstation\
  \ en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\n**Requisitos:**\n- Archivo\
  \ en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/station-token`.\n  - Contenido: la\
  \ credencial sintética suministrada.\n  - Modo de acceso: `0600`.\n- Registro de despliegue:\n  - En la workstation,\
  \ `~/quest/deployment.log` no debe contener la credencial sintética suministrada.\n  - El archivo no está vacío.\n\
  - Ambas aplicaciones proporcionadas deben autenticar la credencial sintética original en cada host administrado.\
  \ Las rutas e interfaces HTTP figuran en `~/quest/consumer-contract.json` de la estación de trabajo; el programa\
  \ es `provided-consumer.py`. Conserva procesos, usuarios, privilegios, líneas de órdenes y bytes instalados originales\
  \ de `consumer-identities.json`. Cada consumidor debe tener denegadas lectura y escritura de la entrada ajena;\
  \ el usuario externo proporcionado no puede leer ni escribir ninguna entrada. Se admite un grupo privado para\
  \ la segunda entrada. Conserva el `credentials.yml` original.\n\nMantener la credencial fuera de la salida de\
  \ tarea no cifra `credentials.yml`."
debrief: Entregaste entradas privadas a consumidores reales respetando la autoridad de propiedad, conservando identidades
  y denegando accesos entre usuarios.
stages.0.brief: La entrega de credenciales debe mantener privados los archivos de destino y la salida registrada.
stages.0.objectives.0.text: El archivo `deployment.log` de la workstation no está vacío y no expone la credencial
  de juego suministrada.
stages.0.objectives.1.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/station-token` contiene
  la credencial sintética suministrada. La credencial original llega a ambos consumidores originales en todos los
  hosts, con lectura y escritura denegadas para otros consumidores y el usuario externo.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/station-token` tiene
  el modo `0600`.
hints.0.text: La entrega privada debe permitir el acceso real del destinatario y aislar otros usuarios. Los cambios
  de metadatos dependen de la autoridad real del operador.
hints.1.text: Compara `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` y `provided-consumer.py`.
  Inspecciona propietarios y permisos en los hosts administrados, las capacidades del operador y el estado de autenticación
  HTTP. No imprimas credenciales en los diagnósticos.
hints.2.text: 'Oculta la salida de copias sensibles con `no_log`. Con estas capacidades, prepara contenido y permisos
  restrictivos antes de transferir la propiedad; separar el cambio de propietario evita solicitar después un cambio
  de permisos no autorizado. Verifica cada aplicación con la credencial original sin imprimirla: espera HTTP 200
  y `credential-ready`. Confirma que otros consumidores y el usuario externo no puedan abrir entradas ajenas para
  leer o escribir; conserva el modo anterior `0600` y el `deployment.log` privado no vacío.'
phrases.0: Protegí tanto los permisos del archivo de destino como la salida de la tarea.
phrases.1: Verifiqué el secreto sin imprimirlo.
phrases.2: No traté a no_log como cifrado en reposo.
diagnostics.deployment_log: El play puede no haberse ejecutado con captura de salida o deployment.log estar vacío; conserve un registro no vacío. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-nonempty-log)
diagnostics.redaction: Un log ausente/vacío también falla redaction; si existe, el token suministrado exacto puede aparecer en diff/salida por faltar no_log. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-exact-token-in-log)
diagnostics.credential_original: Editar o reformatear credentials.yml cambia los bytes fijados; corrija entrega conservando la entrada suministrada intacta. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-original-input-bytes)
diagnostics.consumer_identity: Reiniciar un proceso o cambiar UID/grupos/capabilities, comando o programa altera su identidad fijada; entregue archivos a consumidores originales. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-original-process-and-privileges)
diagnostics.credential_access: Propietario/grupos incorrectos o permisos amplios permiten a otro consumidor o outsider abrir credential para leer o append; pruebe identidades reales, no solo root. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-cross-consumer-denial)
diagnostics.credential_auth: El endpoint devolvió respuesta exitosa/body observado pero inesperado; compare con credential-ready usando token original. Errores HTTP 401/503 usan diagnóstico de observación. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-observed-auth-response)
diagnostics.consumer_budget: SSH o su observer remoto puede exceder el tiempo restante de subprocess; revise conexión del host y comando de observación. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-bounded-ssh-observer)
diagnostics.consumer_observation: Un archivo mode-600 de root puede impedir lectura al propio consumidor; HTTP 401/503, errores socket, proceso/entrada ausentes o fallos SSH/receipt también bloquean observación. Revise propietario sin reiniciar. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-own-file-access-and-observation)
diagnostics.probe_0_1: El inicio del helper o interrupción de la envoltura anterior puede detenerse sin marcador específico; fallos ordinarios de contenido SSH usan content_1/2/3. Revise imports y hosts. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-legacy-and-startup-fallback)
diagnostics.content_1: app1 puede conservar credential antiguo o fallar SSH/lectura; entregue valor intacto de credentials.yml a /srv/site/station-token. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-host-1-content)
diagnostics.mode_1: app1 puede conservar mode 644 de copy suministrado o fallar stat/SSH; use 600 en /srv/site/station-token conservando acceso al propio consumidor. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-host-1-mode)
diagnostics.content_2: app2 puede conservar credential antiguo o fallar SSH/lectura; entregue valor intacto de credentials.yml a /srv/site/station-token. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-host-2-content)
diagnostics.mode_2: app2 puede conservar mode 644 de copy suministrado o fallar stat/SSH; use 600 en /srv/site/station-token conservando acceso al propio consumidor. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-host-2-mode)
diagnostics.content_3: app3 puede conservar credential antiguo o fallar SSH/lectura; entregue valor intacto de credentials.yml a /srv/site/station-token. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-host-3-content)
diagnostics.mode_3: app3 puede conservar mode 644 de copy suministrado o fallar stat/SSH; use 600 en /srv/site/station-token conservando acceso al propio consumidor. [Causa y comprobación](guides#guide=ansible-13&section=private-delivery-host-3-mode)
