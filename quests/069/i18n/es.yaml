title: Permisos Secret
brief: |-
  La flota necesita una entrega privada de la credencial sintética suministrada.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.

  **Requisitos:**
  - Entrega privada:
    - Alcance: `app1`, `app2`, `app3`.
    - La salida de tarea mantiene privada la credencial; solo el propietario accede al archivo entregado.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/station-token`.
    - Contenido: `game-station-secret-69`.
    - Modo de acceso: `0600`.
  - Evidencia en la workstation:
    - Archivo no vacío: `~/quest/deployment.log`.
  - Registro de despliegue:
    - En la workstation, `~/quest/deployment.log` no debe contener `game-station-secret-69`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/station-token)" = game-station-secret-69 && printf "credential matches\n"'` — Cada host confirma `credential matches` sin imprimir la credencial.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/station-token; if runuser -u nobody -- cat /srv/site/station-token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Cada host muestra `-rw-------` y confirma `unprivileged read denied` para el usuario `nobody`.
  - `python3 -c 'from pathlib import Path; import yaml; s=yaml.safe_load(Path("credentials.yml").read_text())["station_token"]; log=Path("deployment.log").read_text(); assert log and s not in log; print("nonempty private deployment record")'` — Confirma `nonempty private deployment record` sin mostrar la credencial ni el contenido del registro.

  `no_log` limita la salida de tarea; no cifra `credentials.yml`.
debrief: El credential sintético es privado en el disco y no aparece en la salida de la tarea diff.
stages.0.brief: La entrega de credenciales debe mantener privados los archivos de destino y la salida registrada.
stages.0.objectives.0.text: La entrega de credenciales está configurada para cada host administrado con salida de
  tarea privada y acceso al archivo solo para su propietario.
stages.0.objectives.1.text: 'Evidencia no vacía en la workstation: `deployment.log`.'
stages.0.objectives.2.text: El archivo `deployment.log` de la workstation no expone la credencial de juego suministrada.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/station-token` contiene
  `game-station-secret-69`.
stages.0.objectives.4.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/station-token` tiene
  el modo `0600`.
hints.0.text: Los permisos de archivos y la supresión de salida resuelven diferentes rutas de exposición.
hints.1.text: Una diferencia puede revelar contenido copiado a menos que sensitive task suprima el registro.
hints.2.text: Usa el modo `0600` junto con `no_log`. Guarda la salida del despliegue con `ansible-playbook --diff
  rollout.yml > deployment.log`.
phrases.0: Protegí tanto los permisos del archivo de destino como la salida de la tarea.
phrases.1: Verifiqué el secreto sin imprimirlo.
phrases.2: No traté a no_log como cifrado en reposo.
diagnostics.deployment_log: El archivo `~/quest/deployment.log` de la workstation no debe estar vacío.
diagnostics.redaction: El archivo `deployment.log` de la workstation no expone la credencial de juego suministrada.
