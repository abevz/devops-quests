title: Permisos Secret
brief: "La flota necesita una entrega privada de la credencial sintética suministrada.\n\nTrabaja en la workstation\
  \ en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\n**Requisitos:**\n- Archivo\
  \ en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/station-token`.\n  - Contenido: la\
  \ credencial sintética suministrada.\n  - Modo de acceso: `0600`.\n- Registro de despliegue:\n  - En la workstation,\
  \ `~/quest/deployment.log` no debe contener la credencial sintética suministrada.\n  - El archivo no está vacío.\n\
  - Ambas aplicaciones proporcionadas deben autenticar la credencial sintética original en cada host administrado.\
  \ Las rutas e interfaces HTTP figuran en `~/quest/consumer-contract.json` de la estación de trabajo; el programa\
  \ es `provided-consumer.py`. Conserva procesos, usuarios, privilegios, líneas de órdenes y bytes instalados originales\
  \ de `consumer-identities.json`. Cada consumidor debe tener denegadas lectura y escritura de la entrada ajena;\
  \ el usuario externo proporcionado no puede leer ni escribir ninguna entrada. Se admite un grupo privado para\
  \ la segunda entrada. Conserva el `credentials.yml` original.\n\nMantener la credencial fuera de la salida de\
  \ tarea no cifra `credentials.yml`."
debrief: Entregaste entradas privadas a consumidores reales respetando la autoridad de propiedad, conservando identidades
  y denegando accesos entre usuarios.
stages.0.brief: La entrega de credenciales debe mantener privados los archivos de destino y la salida registrada.
stages.0.objectives.0.text: El archivo `deployment.log` de la workstation no está vacío y no expone la credencial
  de juego suministrada.
stages.0.objectives.1.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/station-token` contiene
  la credencial sintética suministrada. La credencial original llega a ambos consumidores originales en todos los
  hosts, con lectura y escritura denegadas para otros consumidores y el usuario externo.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/station-token` tiene
  el modo `0600`.
hints.0.text: La entrega privada debe permitir el acceso real del destinatario y aislar otros usuarios. Los cambios
  de metadatos dependen de la autoridad real del operador.
hints.1.text: Compara `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` y `provided-consumer.py`.
  Inspecciona propietarios y permisos en los hosts administrados, las capacidades del operador y el estado de autenticación
  HTTP. No imprimas credenciales en los diagnósticos.
hints.2.text: 'Oculta la salida de copias sensibles con `no_log`. Con estas capacidades, prepara contenido y permisos
  restrictivos antes de transferir la propiedad; separar el cambio de propietario evita solicitar después un cambio
  de permisos no autorizado. Verifica cada aplicación con la credencial original sin imprimirla: espera HTTP 200
  y `credential-ready`. Confirma que otros consumidores y el usuario externo no puedan abrir entradas ajenas para
  leer o escribir; conserva el modo anterior `0600` y el `deployment.log` privado no vacío.'
phrases.0: Protegí tanto los permisos del archivo de destino como la salida de la tarea.
phrases.1: Verifiqué el secreto sin imprimirlo.
phrases.2: No traté a no_log como cifrado en reposo.
diagnostics.deployment_log: El archivo `~/quest/deployment.log` de la workstation no debe estar vacío.
diagnostics.redaction: El archivo `deployment.log` de la workstation no expone la credencial de juego suministrada.
diagnostics.content_1: 'app1, `/srv/site/station-token`: contenido `game-station-secret-69`.'
diagnostics.content_2: 'app2, `/srv/site/station-token`: contenido `game-station-secret-69`.'
diagnostics.content_3: 'app3, `/srv/site/station-token`: contenido `game-station-secret-69`.'
diagnostics.mode_1: 'app1, `/srv/site/station-token`: modo de acceso `600`.'
diagnostics.mode_2: 'app2, `/srv/site/station-token`: modo de acceso `600`.'
diagnostics.mode_3: 'app3, `/srv/site/station-token`: modo de acceso `600`.'
diagnostics.credential_access: El acceso a credenciales es demasiado amplio. Otro consumidor o el usuario externo
  puede abrir una entrada protegida para leer o escribir.
diagnostics.credential_auth: Una aplicación no autentica la credencial original. Revisa su entrada, acceso privado
  y respuesta HTTP.
diagnostics.consumer_identity: Cambió la identidad de la aplicación proporcionada. Compara proceso, usuario, privilegios,
  línea de órdenes y programa instalado con el registro original.
diagnostics.consumer_budget: Se agotó el tiempo de observación de la aplicación. Comprueba la disponibilidad de
  SSH y las respuestas HTTP de los hosts administrados.
diagnostics.consumer_observation: No se pudo observar la aplicación proporcionada. Comprueba su proceso, el registro
  de identidad, SSH y el punto de acceso HTTP.
diagnostics.credential_original: Cambió el credentials.yml original de la estación de trabajo. Conserva los bytes
  proporcionados y corrige la entrega sin reescribir el origen.
diagnostics.probe_0_1: 'Las entradas actuales no permiten verificar este objetivo: En cada host gestionado (`app1`,
  `app2`, `app3`), `/srv/site/station-token` contiene la credencial sintética suministrada. La credencial original
  llega a ambos consumidores originales en todos los hosts, con lectura y escritura denegadas para otros consumidores
  y el usuario externo.'
