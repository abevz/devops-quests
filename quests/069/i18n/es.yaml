title: Permisos Secret
brief: 'Se copia un station credential con permisos de archivos públicos y registro habilitado. Corrija
  rollout.yml al modo 0600 y no_log: verdadero para la tarea sensitive copy, luego ejecute ansible-playbook
  --diff rollout.yml > deployment.log. El credential es sintético y pertenece únicamente a este fleet.
  Verifique su valor y permisos reales en los tres hosts sin imprimirlos ni filtrarlos en el registro
  de implementación. no_log limita la producción de tareas; no es cifrado de credentials.yml.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `credentials.yml`, `deployment.log`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: los tres archivos de token contienen el juego credential en el modo 0600,
  el copy tiene no_log y el registro de implementación no expone su valor.'
debrief: El credential sintético es privado en el disco y no aparece en la salida de la tarea diff.
stages.0.brief: 'Criterios de éxito: los tres archivos de token contienen el juego credential en el modo
  0600, el copy tiene no_log y el registro de implementación no expone su valor.'
stages.0.objectives.0.text: Los tres archivos de token contienen el juego credential en modo 0600, el
  copy tiene no_log y el registro de implementación no expone su valor.
hints.0.text: Los permisos de archivos y la supresión de salida resuelven diferentes rutas de exposición.
hints.1.text: Una diferencia puede revelar contenido copiado a menos que sensitive task suprima el registro.
hints.2.text: Utilice el modo 0600 más los modos objetivo reales no_log y inspect sin imprimir el valor.
phrases.0: Protegí tanto los permisos del archivo de destino como la salida de la tarea.
phrases.1: Verifiqué el secreto sin imprimirlo.
phrases.2: No traté a no_log como cifrado en reposo.
