title: Uprawnienia Secret
brief: 'station credential jest kopiowana z uprawnieniami do plików publicznych i włączonym rejestrowaniem.
  Popraw rollout.yml na mode 0600 i no_log: true dla zadania sensitive copy, a następnie uruchom ansible-playbook
  --diff rollout.yml > deployment.log. credential jest materiałem syntetycznym i należy wyłącznie do tego
  fleet. Sprawdź jego rzeczywistą wartość i uprawnienia na wszystkich trzech hostach, nie drukując ich
  ani nie wyciekając do dziennika wdrażania. no_log ogranicza wydajność zadań; to nie jest szyfrowanie
  credentials.yml.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `credentials.yml`, `deployment.log`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: wszystkie trzy pliki tokenów zawierają grę credential pod adresem mode
  0600, copy ma no_log, a dziennik wdrażania nie ujawnia jej wartości.'
debrief: Syntetyczny credential jest prywatny na dysku i nie ma danych wyjściowych zadania diff.
stages.0.brief: 'Kryteria sukcesu: wszystkie trzy pliki tokenów zawierają grę credential pod adresem mode
  0600, copy zawiera grę no_log, a dziennik wdrażania nie ujawnia jej wartości.'
stages.0.objectives.0.text: Wszystkie trzy pliki tokenów zawierają grę credential pod adresem mode 0600,
  copy ma no_log, a dziennik wdrażania nie ujawnia jej wartości.
hints.0.text: Uprawnienia do plików i tłumienie wyników rozwiązują różne ścieżki ekspozycji.
hints.1.text: Różnica może ujawnić skopiowaną zawartość, chyba że sensitive task blokuje rejestrowanie.
hints.2.text: Użyj mode 0600 plus no_log i sprawdź rzeczywiste tryby docelowe bez drukowania wartości.
phrases.0: Chroniłem zarówno uprawnienia do plików docelowych, jak i dane wyjściowe zadań.
phrases.1: Zweryfikowałem sekret bez drukowania go.
phrases.2: Nie traktowałem no_log jako szyfrowania w stanie spoczynku.
