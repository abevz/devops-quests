title: Uprawnienia Secret
brief: "Flota potrzebuje poufnego dostarczenia przekazanego syntetycznego poświadczenia.\n\nPracuj na workstation\
  \ w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\n**Wymagania:**\n\
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/station-token`.\n  - Treść:\
  \ dostarczone syntetyczne poświadczenie.\n  - Tryb dostępu: `0600`.\n- Rejestr wdrożenia:\n  - Na workstation\
  \ plik `~/quest/deployment.log` nie może zawierać dostarczonego syntetycznego poświadczenia.\n  - Plik jest niepusty.\n\
  - Obie dostarczone aplikacje mają uwierzytelniać oryginalne syntetyczne dane dostępu na każdym zarządzanym hoście.\
  \ Ścieżki wejść i interfejsy HTTP są w `~/quest/consumer-contract.json` na stacji roboczej; program to `provided-consumer.py`.\
  \ Zachowaj oryginalne procesy, konta, przywileje, wiersze poleceń i bajty zainstalowanego programu z `consumer-identities.json`.\
  \ Każdy konsument ma mieć zabroniony odczyt i zapis wejścia drugiego; dostarczony użytkownik zewnętrzny nie może\
  \ czytać ani zapisywać żadnego wejścia. Dla drugiego wejścia dopuszczalna jest prywatna grupa. Zachowaj oryginalny\
  \ `credentials.yml`.\n\nBrak poświadczenia w wyjściu zadania nie szyfruje `credentials.yml`."
debrief: Dostarczono prywatne wejścia rzeczywistym konsumentom z uwzględnieniem uprawnień własności, zachowując
  tożsamości i izolację kont.
stages.0.brief: Dostarczenie poświadczenia musi zachować poufność plików docelowych i zapisanego wyjścia.
stages.0.objectives.0.text: Plik `deployment.log` na workstation jest niepusty i nie ujawnia dostarczonego poświadczenia
  gry.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/station-token`
  zawiera dostarczone syntetyczne poświadczenie. Oryginalne dane dostępu docierają do obu oryginalnych konsumentów
  na wszystkich hostach; odczyt i zapis przez innych konsumentów i użytkownika zewnętrznego są zabronione.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/station-token`
  ma tryb `0600`.
hints.0.text: Prywatne dostarczanie musi zapewniać rzeczywisty dostęp odbiorcy i izolację od innych kont. Zmiany
  metadanych ograniczają faktyczne uprawnienia operatora.
hints.1.text: Porównaj `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` i `provided-consumer.py`.
  Sprawdź właścicieli i uprawnienia wejść na zarządzanych hostach, listę uprawnień operatora oraz status uwierzytelnienia
  HTTP. Nie wypisuj danych dostępu w diagnostyce.
hints.2.text: 'Ukryj wrażliwe wyniki kopiowania przez `no_log`. Przy tych uprawnieniach przygotuj treść i ograniczone
  prawa przed przekazaniem własności; osobna zmiana właściciela unika żądania niedostępnej później zmiany praw.
  Zweryfikuj każdą aplikację oryginalnymi danymi bez ich wypisywania: oczekuj HTTP 200 i `credential-ready`. Potwierdź,
  że inni konsumenci i użytkownik zewnętrzny nie mogą otwierać cudzych wejść do odczytu ani zapisu; zachowaj dotychczasowy
  tryb `0600` i niepusty prywatny `deployment.log`.'
phrases.0: Chroniłem zarówno uprawnienia do plików docelowych, jak i dane wyjściowe zadań.
phrases.1: Zweryfikowałem sekret bez drukowania go.
phrases.2: Nie traktowałem no_log jako szyfrowania w stanie spoczynku.
diagnostics.deployment_log: Play mógł nie zostać uruchomiony z zapisem wyjścia albo deployment.log jest pusty; zachowaj niepusty log wykonania. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-nonempty-log)
diagnostics.redaction: Brakujący/pusty log też narusza redaction; w pozostałym przypadku dokładny dostarczony token mógł trafić do diff/wyjścia zadania bez no_log. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-exact-token-in-log)
diagnostics.credential_original: Edycja lub przeformatowanie credentials.yml zmienia zamrożone bajty; popraw dostarczanie, zachowując źródło bez zmian. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-original-input-bytes)
diagnostics.consumer_identity: Restart procesu, zmiana UID/grup/capabilities, polecenia lub programu zmienia zamrożoną tożsamość; dostarczaj pliki pierwotnym odbiorcom. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-original-process-and-privileges)
diagnostics.credential_access: Błędny właściciel, grupy lub szerokie prawa pozwalają innemu odbiorcy albo outsider otworzyć credential do odczytu lub append; sprawdź rzeczywiste UID, nie tylko root. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-cross-consumer-denial)
diagnostics.credential_auth: Endpoint zwrócił odczytaną, lecz nieoczekiwaną odpowiedź sukcesu/body; porównaj z credential-ready dla pierwotnego tokenu. Błędy HTTP 401/503 trafiają do diagnostyki obserwacji. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-observed-auth-response)
diagnostics.consumer_budget: SSH lub zdalny observer może przekroczyć pozostały limit subprocess; sprawdź łączność hosta i polecenie obserwacji. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-bounded-ssh-observer)
diagnostics.consumer_observation: Plik mode-600 należący do root może blokować własnego odbiorcę; HTTP 401/503, błędy socket, brak procesu/pliku lub błędy SSH/receipt też przerywają obserwację. Sprawdź właściciela bez restartu. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-own-file-access-and-observation)
diagnostics.probe_0_1: Start helper lub przerwana starsza otoczka może zawieść przed konkretnym markerem; zwykłe błędy kontroli treści SSH dają content_1/2/3. Sprawdź importy i dostępność hostów. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-legacy-and-startup-fallback)
diagnostics.content_1: app1 może nadal mieć stary credential albo SSH/odczyt pliku zawiódł; dostarcz niezmienioną wartość credentials.yml do /srv/site/station-token. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-host-1-content)
diagnostics.mode_1: app1 może zachowywać mode 644 z zadania copy albo stat/SSH zawiódł; ustaw 600 na /srv/site/station-token, zachowując dostęp własnego odbiorcy. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-host-1-mode)
diagnostics.content_2: app2 może nadal mieć stary credential albo SSH/odczyt pliku zawiódł; dostarcz niezmienioną wartość credentials.yml do /srv/site/station-token. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-host-2-content)
diagnostics.mode_2: app2 może zachowywać mode 644 z zadania copy albo stat/SSH zawiódł; ustaw 600 na /srv/site/station-token, zachowując dostęp własnego odbiorcy. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-host-2-mode)
diagnostics.content_3: app3 może nadal mieć stary credential albo SSH/odczyt pliku zawiódł; dostarcz niezmienioną wartość credentials.yml do /srv/site/station-token. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-host-3-content)
diagnostics.mode_3: app3 może zachowywać mode 644 z zadania copy albo stat/SSH zawiódł; ustaw 600 na /srv/site/station-token, zachowując dostęp własnego odbiorcy. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-delivery-host-3-mode)
