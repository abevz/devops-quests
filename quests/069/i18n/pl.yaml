title: Uprawnienia Secret
brief: |-
  Flota potrzebuje poufnego dostarczenia przekazanego syntetycznego poświadczenia.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/station-token`.
    - Treść: dostarczone syntetyczne poświadczenie.
    - Tryb dostępu: `0600`.
  - Rejestr wdrożenia:
    - Na workstation plik `~/quest/deployment.log` nie może zawierać dostarczonego syntetycznego poświadczenia.
    - Plik jest niepusty.

  Brak poświadczenia w wyjściu zadania nie szyfruje `credentials.yml`.
debrief: Syntetyczny credential jest prywatny na dysku i nie ma danych wyjściowych zadania diff.
stages.0.brief: Dostarczenie poświadczenia musi zachować poufność plików docelowych i zapisanego wyjścia.
stages.0.objectives.0.text: Plik `deployment.log` na workstation jest niepusty i nie ujawnia dostarczonego
  poświadczenia gry.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/station-token`
  zawiera dostarczone syntetyczne poświadczenie.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/station-token`
  ma tryb `0600`.
hints.0.text: Uprawnienia do plików i tłumienie wyników rozwiązują różne ścieżki ekspozycji.
hints.1.text: |-
  Różnica może ujawnić skopiowaną zawartość, chyba że sensitive task blokuje rejestrowanie. `no_log` ogranicza wyjście zadania; nie szyfruje `credentials.yml`.

  Sprawdź inventory i dostarczony playbook na workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ls -l credentials.yml
  ```
hints.2.text: |-
  Użyj trybu `0600` oraz `no_log`. Zapisz wyjście wdrożenia przez `ansible-playbook --diff rollout.yml > deployment.log`.

  Sprawdź wynik z `~/quest` na workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/station-token)" = game-station-secret-69 && printf "credential matches\n"'` — Każdy host potwierdza `credential matches` bez wypisywania poświadczenia.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/station-token; if runuser -u nobody -- cat /srv/site/station-token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Każdy host pokazuje `-rw-------` i potwierdza `unprivileged read denied` dla użytkownika `nobody`.
  - `python3 -c 'from pathlib import Path; import yaml; s=yaml.safe_load(Path("credentials.yml").read_text())["station_token"]; log=Path("deployment.log").read_text(); assert log and s not in log; print("nonempty private deployment record")'` — Potwierdza `nonempty private deployment record` bez wyświetlania poświadczenia ani treści rejestru.
phrases.0: Chroniłem zarówno uprawnienia do plików docelowych, jak i dane wyjściowe zadań.
phrases.1: Zweryfikowałem sekret bez drukowania go.
phrases.2: Nie traktowałem no_log jako szyfrowania w stanie spoczynku.
diagnostics.deployment_log: Plik `~/quest/deployment.log` na workstation musi być niepusty.
diagnostics.redaction: Plik `deployment.log` na workstation nie ujawnia dostarczonego poświadczenia gry.
