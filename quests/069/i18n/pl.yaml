  `app2`, `app3`) plik `/srv/site/station-token` zawiera dostarczone syntetyczne poświadczenie. Oryginalne dane
  dostępu docierają do obu oryginalnych konsumentów na wszystkich hostach; odczyt i zapis przez innych konsumentów
  i użytkownika zewnętrznego są zabronione.'
