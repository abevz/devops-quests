title: Uprawnienia Secret
brief: "Flota potrzebuje poufnego dostarczenia przekazanego syntetycznego poświadczenia.\n\nPracuj na workstation\
  \ w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`, `credentials.yml`.\n\n**Wymagania:**\n\
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/station-token`.\n  - Treść:\
  \ dostarczone syntetyczne poświadczenie.\n  - Tryb dostępu: `0600`.\n- Rejestr wdrożenia:\n  - Na workstation\
  \ plik `~/quest/deployment.log` nie może zawierać dostarczonego syntetycznego poświadczenia.\n  - Plik jest niepusty.\n\
  - Obie dostarczone aplikacje mają uwierzytelniać oryginalne syntetyczne dane dostępu na każdym zarządzanym hoście.\
  \ Ścieżki wejść i interfejsy HTTP są w `~/quest/consumer-contract.json` na stacji roboczej; program to `provided-consumer.py`.\
  \ Zachowaj oryginalne procesy, konta, przywileje, wiersze poleceń i bajty zainstalowanego programu z `consumer-identities.json`.\
  \ Każdy konsument ma mieć zabroniony odczyt i zapis wejścia drugiego; dostarczony użytkownik zewnętrzny nie może\
  \ czytać ani zapisywać żadnego wejścia. Dla drugiego wejścia dopuszczalna jest prywatna grupa. Zachowaj oryginalny\
  \ `credentials.yml`.\n\nBrak poświadczenia w wyjściu zadania nie szyfruje `credentials.yml`."
debrief: Dostarczono prywatne wejścia rzeczywistym konsumentom z uwzględnieniem uprawnień własności, zachowując
  tożsamości i izolację kont.
stages.0.brief: Dostarczenie poświadczenia musi zachować poufność plików docelowych i zapisanego wyjścia.
stages.0.objectives.0.text: Plik `deployment.log` na workstation jest niepusty i nie ujawnia dostarczonego poświadczenia
  gry.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/station-token`
  zawiera dostarczone syntetyczne poświadczenie. Oryginalne dane dostępu docierają do obu oryginalnych konsumentów
  na wszystkich hostach; odczyt i zapis przez innych konsumentów i użytkownika zewnętrznego są zabronione.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/station-token`
  ma tryb `0600`.
hints.0.text: Prywatne dostarczanie musi zapewniać rzeczywisty dostęp odbiorcy i izolację od innych kont. Zmiany
  metadanych ograniczają faktyczne uprawnienia operatora.
hints.1.text: Porównaj `rollout.yml`, `consumer-contract.json`, `consumer-identities.json` i `provided-consumer.py`.
  Sprawdź właścicieli i uprawnienia wejść na zarządzanych hostach, listę uprawnień operatora oraz status uwierzytelnienia
  HTTP. Nie wypisuj danych dostępu w diagnostyce.
hints.2.text: 'Ukryj wrażliwe wyniki kopiowania przez `no_log`. Przy tych uprawnieniach przygotuj treść i ograniczone
  prawa przed przekazaniem własności; osobna zmiana właściciela unika żądania niedostępnej później zmiany praw.
  Zweryfikuj każdą aplikację oryginalnymi danymi bez ich wypisywania: oczekuj HTTP 200 i `credential-ready`. Potwierdź,
  że inni konsumenci i użytkownik zewnętrzny nie mogą otwierać cudzych wejść do odczytu ani zapisu; zachowaj dotychczasowy
  tryb `0600` i niepusty prywatny `deployment.log`.'
phrases.0: Chroniłem zarówno uprawnienia do plików docelowych, jak i dane wyjściowe zadań.
phrases.1: Zweryfikowałem sekret bez drukowania go.
phrases.2: Nie traktowałem no_log jako szyfrowania w stanie spoczynku.
diagnostics.deployment_log: Plik `~/quest/deployment.log` na workstation musi być niepusty.
diagnostics.redaction: Plik `deployment.log` na workstation nie ujawnia dostarczonego poświadczenia gry.
