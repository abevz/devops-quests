diagnostics.credential_access: Dostęp do danych uwierzytelniających jest zbyt szeroki. Inny konsument lub użytkownik
  zewnętrzny może otworzyć chronione wejście do odczytu lub zapisu.
diagnostics.credential_auth: Aplikacja nie uwierzytelnia oryginalnych danych dostępu. Sprawdź wejście, prywatny
  dostęp i odpowiedź HTTP.
diagnostics.consumer_identity: Zmieniono tożsamość dostarczonej aplikacji. Porównaj proces, konto, przywileje, wiersz
  poleceń i zainstalowany program z oryginalnym zapisem.
diagnostics.consumer_budget: Upłynął czas obserwacji aplikacji. Sprawdź dostępność SSH i odpowiedzi HTTP zarządzanych
  hostów.
diagnostics.consumer_observation: Nie można zaobserwować dostarczonej aplikacji. Sprawdź proces, zapis tożsamości,
  SSH i punkt końcowy HTTP.
diagnostics.credential_original: Zmieniono oryginalny credentials.yml na stacji roboczej. Zachowaj dostarczone bajty
  wejściowe i popraw dostarczanie bez przepisywania źródła.
