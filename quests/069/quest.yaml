id: 69
title: title
track: Ansible
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'dq_result_failed=0

      set +e

      (

      set -e

      dq_group_failed=0

      set +e

      (

      set -e

      test -s deployment.log

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Workstation ~/quest/deployment.log is nonempty : ✗ [DQ:deployment_log]''

      dq_group_failed=1

      fi

      set -e

      test "$dq_group_failed" -eq 0

      )

      [ $? -eq 0 ] || dq_result_failed=1

      (

      set -e

      dq_group_failed=0

      set +e

      (

      set -e

      test -s deployment.log

      if grep -Fq ''game-station-secret-69'' deployment.log; then exit 1; fi

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Workstation ~/quest/deployment.log does not contain the credential : ✗ [DQ:redaction]''

      dq_group_failed=1

      fi

      set -e

      test "$dq_group_failed" -eq 0

      )

      [ $? -eq 0 ] || dq_result_failed=1

      set -e

      test "$dq_result_failed" -eq 0'
  - text: stages.0.objectives.1.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ncd\
      \ ~/quest\ntimeout --kill-after=1s 8s bash -euo pipefail <<'DQ_LEGACY_069'\ndq_group_failed=0\nset +e\n(\n\
      set -e\nssh -n -o BatchMode=yes -p 2222 root@app1-\"${DQ_NAMESPACE#dq-}\" 'test \"$(cat /srv/site/station-token)\"\
      \ = game-station-secret-69'\n)\ndq_condition_rc=$?\nif [ \"$dq_condition_rc\" -ne 0 ]; then\nprintf '%s\\\
      n' 'Host app1 /srv/site/station-token: content = game-station-secret-69 : ✗ [DQ:content_1]'\ndq_group_failed=1\n\
      fi\n(\nset -e\nssh -n -o BatchMode=yes -p 2222 root@app2-\"${DQ_NAMESPACE#dq-}\" 'test \"$(cat /srv/site/station-token)\"\
      \ = game-station-secret-69'\n)\ndq_condition_rc=$?\nif [ \"$dq_condition_rc\" -ne 0 ]; then\nprintf '%s\\\
      n' 'Host app2 /srv/site/station-token: content = game-station-secret-69 : ✗ [DQ:content_2]'\ndq_group_failed=1\n\
      fi\n(\nset -e\nssh -n -o BatchMode=yes -p 2222 root@app3-\"${DQ_NAMESPACE#dq-}\" 'test \"$(cat /srv/site/station-token)\"\
      \ = game-station-secret-69'\n)\ndq_condition_rc=$?\nif [ \"$dq_condition_rc\" -ne 0 ]; then\nprintf '%s\\\
      n' 'Host app3 /srv/site/station-token: content = game-station-secret-69 : ✗ [DQ:content_3]'\ndq_group_failed=1\n\
      fi\nset -e\ntest \"$dq_group_failed\" -eq 0\nDQ_LEGACY_069\npython3 -I - <<'DQ_CREDENTIAL_CONSUMERS'\nimport\
      \ json, os, shlex, subprocess, sys, time, urllib.request\nfrom pathlib import Path\nimport yaml\nobserver\
      \ = \"import hashlib\\nimport json\\nimport sys\\nfrom pathlib import Path\\n\\nresult = {}\\nfor item in\
      \ json.loads(sys.argv[1]):\\n    pid = Path(item['pidFile']).read_text().strip()\\n    proc = Path('/proc')\
      \ / pid\\n    status = dict(line.split(':', 1) for line in (proc / 'status').read_text().splitlines() if ':'\
      \ in line)\\n    result[item['name']] = {\\n        'pid': pid,\\n        'starttime': (proc / 'stat').read_text().rsplit(')\
      \ ', 1)[1].split()[19],\\n        'uid': status['Uid'].split(),\\n        'gid': status['Gid'].split(),\\\
      n        'groups': status['Groups'].split(),\\n        'caps': {key: status[key].strip() for key in ('CapInh',\
      \ 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb')},\\n        'command': (proc / 'cmdline').read_bytes().decode().split(chr(0)),\\\
      n        'code': hashlib.sha256(Path(item['programPath']).read_bytes()).hexdigest(),\\n    }\\nprint(json.dumps(result))\\\
      n\"\naccess = 'import json, os, pwd, subprocess, sys\\nitems=json.loads(sys.argv[1]);result=[]\\nfor actor\
      \ in (\\'credential-a\\',\\'credential-b\\',\\'credential-outsider\\'):\\n    principal=pwd.getpwuid({\"credential-a\"\
      :1001,\"credential-b\":1002,\"credential-outsider\":1003}[actor])\\n    groups=os.getgrouplist(principal.pw_name,principal.pw_gid)\\\
      n    for item in items:\\n        if item[\\'name\\']==actor:continue\\n        probe=\"\"\"import json,os,sys\\\
      nresult=[]\\nfor flags in (os.O_RDONLY|os.O_NONBLOCK,os.O_WRONLY|os.O_APPEND|os.O_NONBLOCK):\\n    try:\\\
      n        fd=os.open(sys.argv[1],flags);os.close(fd);result.append(True)\\n    except PermissionError:result.append(False)\\\
      nprint(json.dumps(result))\\n\"\"\"\\n        out=subprocess.run([\\'/usr/bin/python3\\',\\'-I\\',\\'-c\\\
      ',probe,item[\\'inputPath\\']],user=principal.pw_uid,group=principal.pw_gid,extra_groups=groups,capture_output=True,text=True,timeout=1,check=True)\\\
      n        result.append([actor,item[\\'name\\'],json.loads(out.stdout)])\\nprint(json.dumps(result))\\n'\n\
      deadline=time.monotonic()+10\nfacts=Path('/run/dq/facts/0')\ntry:\n    contract=json.loads((facts/'consumer-contract.json').read_text())\n\
      \    expected=json.loads((facts/'consumer-identities.json').read_text())\n    if Path('credentials.yml').read_bytes()\
      \ != (facts/'credentials.yml').read_bytes():\n        print('Original credential input changed: ✗ [DQ:credential_original]');sys.exit(1)\n\
      \    token=yaml.safe_load((facts/'credentials.yml').read_text())['station_token']\n    opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))\n\
      \    for host in ('app1','app2','app3'):\n        address=host+'-'+os.environ['DQ_NAMESPACE'][3:]\n      \
      \  def remote(program):\n            command='/usr/bin/python3 -I -c '+shlex.quote(program)+' '+shlex.quote(json.dumps(contract['consumers']))\n\
      \            result=subprocess.run(['ssh','-n','-o','BatchMode=yes','-p','2222','root@'+address,command],check=True,capture_output=True,text=True,timeout=max(.01,deadline-time.monotonic()))\n\
      \            return json.loads(result.stdout)\n        if remote(observer)!=expected[host]:\n            print('Provided\
      \ application identity changed: ✗ [DQ:consumer_identity]');sys.exit(1)\n        observed=remote(access)\n\
      \        pairs={(actor,item['name']) for actor in ('credential-a','credential-b','credential-outsider') for\
      \ item in contract['consumers'] if actor!=item['name']}\n        if len(observed)!=len(pairs) or {(row[0],row[1])\
      \ for row in observed}!=pairs or any(row[2]!=[False,False] for row in observed):\n            print('Credential\
      \ access is not private: ✗ [DQ:credential_access]');sys.exit(1)\n        for item in contract['consumers']:\n\
      \            request=urllib.request.Request('http://'+address+':'+str(item['port'])+'/',headers={'Authorization':'Bearer\
      \ '+token})\n            with opener.open(request,timeout=max(.01,deadline-time.monotonic())) as response:\n\
      \                if response.status!=200 or response.read(65536).decode().strip()!=contract['response']:\n\
      \                    print('Credential consumer is not ready: ✗ [DQ:credential_auth]');sys.exit(1)\nexcept\
      \ subprocess.TimeoutExpired:\n    print('Credential observation timed out: ✗ [DQ:consumer_budget]');sys.exit(1)\n\
      except (OSError,ValueError,KeyError,subprocess.CalledProcessError):\n    print('Credential consumer could\
      \ not be observed: ✗ [DQ:consumer_observation]');sys.exit(1)\nDQ_CREDENTIAL_CONSUMERS\n) >\"$dq_probe_output\"\
      \ 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\nif [ \"$dq_probe_status\" -ne 0 ] &&\
      \ ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\n printf '%s\\n' 'Current inputs could not verify\
      \ this objective: ✗ [DQ:probe_0_1]'\nfi\nrm -f \"$dq_probe_output\"\ntrap - EXIT\ntest \"$dq_probe_status\"\
      \ -eq 0"
  - text: stages.0.objectives.2.text
    check: 'dq_group_failed=0

      set +e

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''test "$(stat -c %a /srv/site/station-token)"
      = 600''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app1 /srv/site/station-token: mode = 600 : ✗ [DQ:mode_1]''

      dq_group_failed=1

      fi

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" ''test "$(stat -c %a /srv/site/station-token)"
      = 600''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app2 /srv/site/station-token: mode = 600 : ✗ [DQ:mode_2]''

      dq_group_failed=1

      fi

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" ''test "$(stat -c %a /srv/site/station-token)"
      = 600''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app3 /srv/site/station-token: mode = 600 : ✗ [DQ:mode_3]''

      dq_group_failed=1

      fi

      set -e

      test "$dq_group_failed" -eq 0'
