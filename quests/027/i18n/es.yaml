title: Extracción de registro privado
brief: 'Una versión privada no está disponible para su consumidor de Kubernetes.


  Trabaja en la estación de trabajo en `~/quest` con `deployment.yaml`, `platform.env`.


  **Requisitos:**

  - Los Pods del Deployment `relay` pueden descargar la versión privada suministrada, conservan la política
  `Always` y completan el despliegue.

  - Las credenciales existentes del registro están disponibles para la carga.

  '
stages.0.brief: El consumidor de Kubernetes debe cumplir el contrato de descarga de imagen y disponibilidad.
hints.0.text: Una carga y la estación de trabajo pueden autenticarse de forma independiente en un registro
  privado.
hints.1.text: |-
  Leer los eventos de extracción de imágenes; distinguir la autorización de una imagen faltante.

  Inspecciona las entradas suministradas y el estado observado:

  Las credenciales exclusivas del juego están en platform.env; Kubernetes necesita un docker-registry Secret.

  Vincula el Secret mediante imagePullSecrets. Conserva el digest de la imagen privada y la política de descarga Always.

  ```sh
  cat deployment.yaml
  kubectl get pods -l app=relay
  kubectl describe pod -l app=relay
  ```
hints.2.text: |-
  Verifica el resultado observado:

  - `kubectl get deployment relay -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'` — Muestra `relay` con su referencia de imagen privada y política de descarga `Always`.
  - `kubectl rollout status deployment/relay --timeout=10s` — El rollout se completa.

  Inspecciona los Pods actuales de relay. El imageID del worker listo debe contener el digest esperado. Los Pods activos deben conservar Always y una referencia al Secret de descarga.

  ```sh
  kubectl get pods -l app=relay -o json |
    jq '.items[] | select(.metadata.deletionTimestamp == null and (.status.phase != "Failed" and .status.phase != "Succeeded"))
    | {pod: .metadata.name, pullSecrets: [.spec.imagePullSecrets[]?.name],
       worker: [.spec.containers[] | select(.name == "worker") | {image, imagePullPolicy}],
       running: [.status.containerStatuses[]? | select(.name == "worker") | {imageID, ready}]}'
  ```
debrief: El registro requería credenciales. Creó un namespace pull secret, lo adjuntó a la plantilla pod y
  verificó una imagen autenticada real pull.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
stages.0.objectives.0.text: Los Pods del Deployment `relay` pueden descargar la versión privada suministrada,
  conservan la política `Always` y completan el despliegue.
diagnostics.probe_0_0: |-
  La comprobación de descarga puede fallar si los Pods actuales de relay carecen de las credenciales aprobadas o usan otra imagen o política de descarga. Revisa sus eventos y referencias. [Guía](guides#guide=gitops-delivery&section=private-image-consumers)
