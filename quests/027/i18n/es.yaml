title: Extracción de registro privado
brief: |
  Una versión privada no está disponible para su consumidor de Kubernetes.

  Trabaja en la workstation en `~/quest` con `deployment.yaml`, `platform.env`.

  **Requisitos:**
  - Deployment en el namespace de la bahía:
    - Nombre: `relay`.
    - Política de descarga: `Always`.
    - Al menos un Secret de descarga de imagen nombrado.
    - Rollout completo.

  **Verifica antes de Check & finish:**
  - `kubectl get deployment relay -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name` — Muestra `relay`, política de descarga `Always` y al menos un nombre de Secret.
  - `kubectl rollout status deployment/relay --timeout=10s` — El rollout se completa.
stages.0.brief: El consumidor de Kubernetes debe cumplir el contrato de descarga de imagen y disponibilidad.
hints.0.text: Leer los eventos de extracción de imágenes; distinguir la autorización de una imagen faltante.
hints.1.text: Las credenciales exclusivas del juego están en platform.env; Kubernetes necesita un docker-registry
  Secret.
hints.2.text: Adjunte ese Secret a través de imagePullSecrets mientras mantiene el digest privado y el Always policy.
debrief: El registro requería credenciales. Creó un namespace pull secret, lo adjuntó a la plantilla pod y verificó
  una imagen autenticada real pull.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
stages.0.objectives.0.text: El Deployment `relay` completa su rollout en el namespace de la bahía.
stages.0.objectives.1.text: El Deployment `relay` usa la política de descarga `Always` y nombra al menos un Secret
  para descargar imágenes.
