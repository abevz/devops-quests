title: Extracción de registro privado
brief: 'Te uniste a las operaciones de SignalRail. Un pod no puede realizar una versión privada. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `deployment.json`, `platform.env`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el grupo sacó su imagen privada y quedó listo.'
stages.0.brief: 'La imagen existe en un juego privado registry. Las credenciales están en platform.env.
  Reparación imagePullSecrets; mantenga la imagen privada y la política de extracción Always.


  Criterios de éxito: el grupo sacó su imagen privada y quedó listo.'
stages.0.objectives.0.text: La cápsula sacó su imagen privada y quedó lista.
hints.0.text: Leer los eventos de extracción de imágenes; distinguir la autorización de una imagen faltante.
hints.1.text: Las credenciales exclusivas del juego están en platform.env; Kubernetes necesita un docker-registry
  Secret.
hints.2.text: Adjunte ese Secret a través de imagePullSecrets mientras mantiene el digest privado y el
  Always policy.
debrief: El registro requería credenciales. Creó un namespace pull secret, lo adjuntó a la plantilla pod
  y verificó una imagen autenticada real pull.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
