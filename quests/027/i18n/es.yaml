title: Extracción de registro privado
brief: 'Una versión privada no está disponible para su consumidor de Kubernetes.


  Trabaja en la estación de trabajo en `~/quest` con `deployment.yaml`, `platform.env`.


  **Requisitos:**

  - Los Pods del Deployment `relay` pueden descargar la versión privada suministrada, conservan la política
  `Always` y completan el despliegue.

  - Las credenciales existentes del registro están disponibles para la carga.

  '
stages.0.brief: El consumidor de Kubernetes debe cumplir el contrato de descarga de imagen y disponibilidad.
hints.0.text: Una carga y la estación de trabajo pueden autenticarse de forma independiente en un registro
  privado.
hints.1.text: 'Leer los eventos de extracción de imágenes; distinguir la autorización de una imagen faltante.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat deployment.yaml

  kubectl describe pod -l app=relay

  ```'
hints.2.text: 'Las credenciales exclusivas del juego están en platform.env; Kubernetes necesita un docker-registry
  Secret.


  Adjunte ese Secret a través de imagePullSecrets mientras mantiene el digest privado y el Always policy.


  Verifica el resultado observado:


  - `kubectl get deployment relay -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy`
  — Muestra `relay` con su referencia de imagen privada y política de descarga `Always`.

  - `kubectl rollout status deployment/relay --timeout=10s` — El rollout se completa.'
debrief: El registro requería credenciales. Creó un namespace pull secret, lo adjuntó a la plantilla pod y
  verificó una imagen autenticada real pull.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
stages.0.objectives.0.text: Los Pods del Deployment `relay` pueden descargar la versión privada suministrada,
  conservan la política `Always` y completan el despliegue.
