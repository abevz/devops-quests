title: Приватный реестр образов
brief: 'Вы в команде эксплуатации SignalRail. Pod не смог загрузить приватный образ. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `deployment.json`, `platform.env`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Pod загрузил приватный образ и стал готов.'
stages.0.brief: 'Образ есть в приватном игровом registry. Credential в platform.env. Исправьте imagePullSecrets,
  сохранив приватный образ и Always.


  Результат проверки: Pod загрузил приватный образ и стал готов.'
stages.0.objectives.0.text: Pod загрузил приватный образ и стал готов.
hints.0.text: 'Прочитайте события pull: отличите отказ авторизации от отсутствия образа.'
hints.1.text: Учебные credential находятся в platform.env; Kubernetes нужен docker-registry Secret.
hints.2.text: Подключите Secret через imagePullSecrets, сохранив приватный digest и policy Always.
debrief: Registry требовал credential. Вы создали pull secret в namespace, подключили его к шаблону pod
  и проверили реальное получение образа.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
