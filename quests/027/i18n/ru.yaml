title: Приватный реестр образов
brief: |
  Приватный выпуск недоступен потребителю Kubernetes.

  Работайте на workstation в `~/quest` с файлами `deployment.yaml`, `platform.env`.

  **Требования:**
  - Deployment в namespace песочницы:
    - Имя: `relay`.
    - Политика загрузки: `Always`.
    - Указан хотя бы один Secret загрузки образа.
    - Rollout завершён.

  **Самопроверка перед Check & finish:**
  - `kubectl get deployment relay -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name` — Показывает `relay`, политику загрузки `Always` и хотя бы одно имя Secret.
  - `kubectl rollout status deployment/relay --timeout=10s` — Rollout завершается.
stages.0.brief: Потребитель Kubernetes должен соответствовать контракту загрузки образа и готовности.
hints.0.text: 'Прочитайте события pull: отличите отказ авторизации от отсутствия образа.'
hints.1.text: Учебные credential находятся в platform.env; Kubernetes нужен docker-registry Secret.
hints.2.text: Подключите Secret через imagePullSecrets, сохранив приватный digest и policy Always.
debrief: Registry требовал credential. Вы создали pull secret в namespace, подключили его к шаблону pod и проверили
  реальное получение образа.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
stages.0.objectives.0.text: Deployment `relay` завершает rollout в namespace песочницы.
stages.0.objectives.1.text: Deployment `relay` использует политику загрузки `Always` и указывает хотя бы один Secret
  для загрузки образа.
