title: Приватный реестр образов
brief: 'Приватный выпуск недоступен потребителю Kubernetes.


  Работайте на рабочей станции в `~/quest` с `deployment.yaml`, `platform.env`.


  **Требования:**

  - Pod Deployment `relay` могут загрузить поставленный приватный релиз, сохраняют политику загрузки `Always`
  и завершают rollout.

  - Существующие учётные данные реестра доступны workload.

  '
stages.0.brief: Потребитель Kubernetes должен соответствовать контракту загрузки образа и готовности.
hints.0.text: Workload и рабочая станция могут независимо аутентифицироваться в приватном реестре.
hints.1.text: 'Прочитайте события pull: отличите отказ авторизации от отсутствия образа.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat deployment.yaml

  kubectl describe pod -l app=relay

  ```'
hints.2.text: 'Учебные credential находятся в platform.env; Kubernetes нужен docker-registry Secret.


  Подключите Secret через imagePullSecrets, сохранив приватный digest и policy Always.


  Проверьте наблюдаемый результат:


  - `kubectl get deployment relay -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy`
  — Показывает `relay` со ссылкой на приватный образ и политикой загрузки `Always`.

  - `kubectl rollout status deployment/relay --timeout=10s` — Rollout завершается.'
debrief: Registry требовал credential. Вы создали pull secret в namespace, подключили его к шаблону pod и проверили
  реальное получение образа.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
stages.0.objectives.0.text: Pod Deployment `relay` могут загрузить поставленный приватный релиз, сохраняют
  политику загрузки `Always` и завершают rollout.
