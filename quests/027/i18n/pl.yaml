title: Wyciągnięcie rejestru prywatnego
brief: 'Prywatne wydanie jest niedostępne dla odbiorcy Kubernetes.


  Pracuj na stacji roboczej w `~/quest` z `deployment.yaml`, `platform.env`.


  **Wymagania:**

  - Pody Deployment `relay` mogą pobrać dostarczone prywatne wydanie, zachowują politykę pobierania `Always`
  i kończą rollout.

  - Istniejące dane logowania do rejestru są dostępne dla workload.

  '
stages.0.brief: Odbiorca Kubernetes musi spełniać kontrakt pobierania obrazu i gotowości.
hints.0.text: Workload i stacja robocza mogą niezależnie uwierzytelniać się w prywatnym rejestrze.
hints.1.text: 'Przeczytaj zdarzenia przyciągające obraz; odróżnij autoryzację od brakującego obrazu.


  Sprawdź dostarczone dane wejściowe i obserwowany stan:


  ```sh

  cat deployment.yaml

  kubectl describe pod -l app=relay

  ```'
hints.2.text: |-
  Dane uwierzytelniające tylko do gry znajdują się w platform.env; Kubernetes potrzebuje docker-registry Secret.

  Dołącz te Secret do imagePullSecrets, zachowując prywatną politykę digest i Always.

  Sprawdź obserwowany wynik:

  - `kubectl get deployment relay -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'` — Pokazuje `relay` z referencją prywatnego obrazu i polityką pobierania `Always`.
  - `kubectl rollout status deployment/relay --timeout=10s` — Rollout się kończy.

debrief: Rejestr wymagał poświadczeń. Utworzyłeś namespace pull secret, dołączyłeś go do szablonu pod i zweryfikowałeś
  pobieranie prawdziwego uwierzytelnionego obrazu.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
stages.0.objectives.0.text: Pody Deployment `relay` mogą pobrać dostarczone prywatne wydanie, zachowują politykę
  pobierania `Always` i kończą rollout.
diagnostics.probe_0_0: 'Bieżące dane nie pozwalają potwierdzić tego celu: Pody Deployment `relay` mogą pobrać dostarczone
  prywatne wydanie, zachowują politykę pobierania `Always` i kończą rollout.'
