title: Wyciągnięcie rejestru prywatnego
brief: 'Dołączyłeś do operacji SignalRail. Prywatna wersja nie mogła zostać pobrana przez kapsułę. Pracuj
  w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `deployment.json`, `platform.env`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: kapsuła pobrała swój prywatny obraz i stała się gotowa.'
stages.0.brief: 'Obraz istnieje w prywatnym rejestrze gier. Poświadczenia znajdują się w platform.env.
  Napraw imagePullSecrets; zachowaj prywatny obraz i politykę ściągania Always.


  Kryteria sukcesu: kapsuła pobrała swój prywatny obraz i stała się gotowa.'
stages.0.objectives.0.text: Kapsuła wyciągnęła swój prywatny obraz i była gotowa.
hints.0.text: Przeczytaj zdarzenia przyciągające obraz; odróżnij autoryzację od brakującego obrazu.
hints.1.text: Dane uwierzytelniające tylko do gry znajdują się w platform.env; Kubernetes potrzebuje docker-registry
  Secret.
hints.2.text: Dołącz te Secret do imagePullSecrets, zachowując prywatną politykę digest i Always.
debrief: Rejestr wymagał poświadczeń. Utworzyłeś namespace pull secret, dołączyłeś go do szablonu pod
  i zweryfikowałeś pobieranie prawdziwego uwierzytelnionego obrazu.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
