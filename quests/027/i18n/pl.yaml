title: Wyciągnięcie rejestru prywatnego
brief: |
  Prywatne wydanie jest niedostępne dla odbiorcy Kubernetes.

  Pracuj na workstation w `~/quest` z plikami `deployment.yaml`, `platform.env`.

  **Wymagania:**
  - Deployment w przestrzeni nazw zatoki:
    - Nazwa: `relay`.
    - Polityka pobierania: `Always`.
    - Pody pobierają prywatny obraz.
    - Rollout zakończony.

  **Sprawdź przed Check & finish:**
  - `kubectl get deployment relay -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy` — Pokazuje `relay` z referencją prywatnego obrazu i polityką pobierania `Always`.
  - `kubectl rollout status deployment/relay --timeout=10s` — Rollout się kończy.
stages.0.brief: Odbiorca Kubernetes musi spełniać kontrakt pobierania obrazu i gotowości.
hints.0.text: Przeczytaj zdarzenia przyciągające obraz; odróżnij autoryzację od brakującego obrazu.
hints.1.text: Dane uwierzytelniające tylko do gry znajdują się w platform.env; Kubernetes potrzebuje docker-registry
  Secret.
hints.2.text: Dołącz te Secret do imagePullSecrets, zachowując prywatną politykę digest i Always.
debrief: Rejestr wymagał poświadczeń. Utworzyłeś namespace pull secret, dołączyłeś go do szablonu pod i zweryfikowałeś
  pobieranie prawdziwego uwierzytelnionego obrazu.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
stages.0.objectives.0.text: Pody `relay` pobierają prywatny obraz z polityką pobierania `Always`, a rollout się
  kończy.
