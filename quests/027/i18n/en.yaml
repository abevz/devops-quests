title: Private registry pull
brief: 'A private release is unavailable to its Kubernetes consumer.


  Work on the workstation in `~/quest` with `deployment.yaml`, `platform.env`.


  **Requirements:**

  - Pods of Deployment `relay` can pull the supplied private release, retain pull policy `Always`, and complete
  the rollout.

  - The existing registry credentials are available to the workload.

  '
stages.0.brief: The Kubernetes consumer must meet the image-pull and readiness contract.
hints.0.text: A workload and the workstation may authenticate to a private registry independently.
hints.1.text: 'Read the image-pull events; distinguish authorization from a missing image.


  Inspect the supplied inputs and observed state:


  ```sh

  cat deployment.yaml

  kubectl describe pod -l app=relay

  ```'
hints.2.text: 'The game-only credentials are in platform.env; Kubernetes needs a docker-registry Secret.


  Attach that Secret through imagePullSecrets while keeping the private digest and Always policy.


  Verify the observed result:


  - `kubectl get deployment relay -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy`
  — Shows `relay` with its private image reference and pull policy `Always`.

  - `kubectl rollout status deployment/relay --timeout=10s` — The rollout completes.'
debrief: The registry required credentials. You created a namespace pull secret, attached it to the pod template
  and verified a real authenticated image pull.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
stages.0.objectives.0.text: Pods of Deployment `relay` can pull the supplied private release, retain pull policy
  `Always`, and complete the rollout.
