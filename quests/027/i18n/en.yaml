title: Private registry pull
brief: 'You joined SignalRail operations. A private release could not be pulled by a pod. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `deployment.json`, `platform.env`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The pod pulled its private image and became ready.'
stages.0.brief: 'The image exists in a private game registry. Credentials are in platform.env. Repair
  imagePullSecrets; keep the private image and Always pull policy.


  Success criteria: The pod pulled its private image and became ready.'
stages.0.objectives.0.text: The pod pulled its private image and became ready.
hints.0.text: Read the image-pull events; distinguish authorization from a missing image.
hints.1.text: The game-only credentials are in platform.env; Kubernetes needs a docker-registry Secret.
hints.2.text: Attach that Secret through imagePullSecrets while keeping the private digest and Always
  policy.
debrief: The registry required credentials. You created a namespace pull secret, attached it to the pod
  template and verified a real authenticated image pull.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
