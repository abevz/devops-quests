title: Privater Registry-Pull
brief: |
  Eine private Version ist für ihren Kubernetes-Verbraucher nicht verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `deployment.yaml`, `platform.env`.

  **Anforderungen:**
  - Deployment im Bay-Namespace:
    - Name: `relay`.
    - Pull-Policy: `Always`.
    - Pods laden das private Image.
    - Rollout abgeschlossen.

  **Selbstprüfung vor Check & finish:**
  - `kubectl get deployment relay -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy` — Zeigt `relay` mit seiner privaten Image-Referenz und Pull-Policy `Always`.
  - `kubectl rollout status deployment/relay --timeout=10s` — Der Rollout wird abgeschlossen.
stages.0.brief: Der Kubernetes-Verbraucher muss den Vertrag für Image-Pull und Bereitschaft erfüllen.
hints.0.text: Lesen Sie die Image-Pull-Ereignisse. Unterscheidung der Autorisierung von einem fehlenden Bild.
hints.1.text: Die Nur-Spiel-Zugangsdaten finden Sie in platform.env; Kubernetes benötigt einen docker-registry Secret.
hints.2.text: Schließen Sie Secret bis imagePullSecrets an und behalten Sie dabei die privaten Elemente digest und
  Always policy bei.
debrief: Für die Registrierung waren Anmeldeinformationen erforderlich. Sie haben ein namespace pull secret erstellt,
  es an die Vorlage pod angehängt und ein echtes authentifiziertes Bild pull verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
stages.0.objectives.0.text: Pods von `relay` laden das private Image mit Pull-Policy `Always` und der Rollout wird
  abgeschlossen.
