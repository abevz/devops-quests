title: Privater Registry-Pull
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Eine private Veröffentlichung konnte nicht von einem
  Pod durchgeführt werden. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich
  auf.


  Eingänge in `~/quest`: `deployment.json`, `platform.env`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Der Pod zog sein persönliches Image und wurde fertig.'
stages.0.brief: 'Das Bild existiert in einem privaten Spiel registry. Die Anmeldeinformationen finden
  Sie in platform.env. Reparatur imagePullSecrets; Behalten Sie das private Image und die Pull-Richtlinie
  Always bei.


  Erfolgskriterium: Der Pod hat sein privates Image abgerufen und ist bereit.'
stages.0.objectives.0.text: Der Pod zog sein privates Image und machte sich bereit.
hints.0.text: Lesen Sie die Image-Pull-Ereignisse. Unterscheidung der Autorisierung von einem fehlenden
  Bild.
hints.1.text: Die Nur-Spiel-Zugangsdaten finden Sie in platform.env; Kubernetes benötigt einen docker-registry
  Secret.
hints.2.text: Schließen Sie Secret bis imagePullSecrets an und behalten Sie dabei die privaten Elemente
  digest und Always policy bei.
debrief: Für die Registrierung waren Anmeldeinformationen erforderlich. Sie haben ein namespace pull secret
  erstellt, es an die Vorlage pod angehängt und ein echtes authentifiziertes Bild pull verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
