title: Privater Registry-Pull
brief: 'Eine private Version ist für ihren Kubernetes-Verbraucher nicht verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `deployment.yaml`, `platform.env`.


  **Anforderungen:**

  - Die Pods von Deployment `relay` können die mitgelieferte private Version laden, behalten die Pull-Policy
  `Always` bei und schließen den Rollout ab.

  - Die vorhandenen Registry-Zugangsdaten stehen dem Workload zur Verfügung.

  '
stages.0.brief: Der Kubernetes-Verbraucher muss den Vertrag für Image-Pull und Bereitschaft erfüllen.
hints.0.text: Ein Workload und die Workstation können sich unabhängig bei einer privaten Registry anmelden.
hints.1.text: 'Lesen Sie die Image-Pull-Ereignisse. Unterscheidung der Autorisierung von einem fehlenden Bild.


  Prüfen Sie die mitgelieferten Eingaben und den beobachteten Zustand:


  ```sh

  cat deployment.yaml

  kubectl describe pod -l app=relay

  ```'
hints.2.text: |-
  Die Nur-Spiel-Zugangsdaten finden Sie in platform.env; Kubernetes benötigt einen docker-registry Secret.

  Schließen Sie Secret bis imagePullSecrets an und behalten Sie dabei die privaten Elemente digest und Always policy bei.

  Prüfen Sie das beobachtete Ergebnis:

  - `kubectl get deployment relay -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'` — Zeigt `relay` mit seiner privaten Image-Referenz und Pull-Policy `Always`.
  - `kubectl rollout status deployment/relay --timeout=10s` — Der Rollout wird abgeschlossen.

debrief: Für die Registrierung waren Anmeldeinformationen erforderlich. Sie haben ein namespace pull secret
  erstellt, es an die Vorlage pod angehängt und ein echtes authentifiziertes Bild pull verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
stages.0.objectives.0.text: Die Pods von Deployment `relay` können die mitgelieferte private Version laden,
  behalten die Pull-Policy `Always` bei und schließen den Rollout ab.
diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Die Pods von Deployment
  `relay` können die mitgelieferte private Version laden, behalten die Pull-Policy `Always` bei und schließen den
  Rollout ab.'
