title: Idempotence
brief: |-
  A repeated health operation keeps reporting changes.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `north-ready`.
    - Access mode: `0644`.
  - Repeated real execution:
    - Targets: `app1`, `app2`, `app3`.
    - `changed=0`, `failed=0`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — shows north-ready from each managed host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — shows permissions `-rw-r--r--` on all three remote files.
  - `ansible-playbook --check rollout.yml` — previews changed=0 and failed=0 on all three hosts.

  The read-only preview does not establish real-run idempotence; Check repeats the real playbook.
stages.0.brief: Repeated delivery must leave the desired fleet state unchanged.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.2.text: A repeated real playbook run reports changed=0 and failed=0 for all three hosts.
hints.0.text: Run the playbook twice and compare the recap.
hints.1.text: A read-only command should not report changed; also check the delivered file mode.
hints.2.text: 'Use changed_when: false for the probe and 0644 for copy; the second real run must be unchanged.'
debrief: A read-only command always reported a change. You corrected changed_when and verified changed=0 on a second
  real playbook run.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
