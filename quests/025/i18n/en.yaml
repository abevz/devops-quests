title: Idempotence
brief: |-
  A repeated health operation keeps reporting changes.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Host `app1`:
    - On app1, /srv/site/message contains north-ready.
    - On app1, /srv/site/message has mode 0644.
  - Host `app2`:
    - On app2, /srv/site/message contains north-ready.
    - On app2, /srv/site/message has mode 0644.
  - Host `app3`:
    - On app3, /srv/site/message contains north-ready.
    - On app3, /srv/site/message has mode 0644.
  - Workstation and execution results:
    - A repeated real playbook run reports changed=0 and failed=0 for all three hosts.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — shows north-ready from each managed host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — shows permissions `-rw-r--r--` on all three remote files.
  - `ansible-playbook --check rollout.yml` — previews changed=0 and failed=0 on all three hosts.

  The read-only preview does not establish real-run idempotence; Check repeats the real playbook.
stages.0.brief: Repeated delivery must leave the desired fleet state unchanged.
