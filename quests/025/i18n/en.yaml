title: Idempotence
brief: "A repeated health operation keeps reporting changes.\n\nWork on the workstation in `~/quest` with `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Requirements:**\n- File on every managed host (`app1`, `app2`, `app3`):\n\
  \  - Path: `/srv/site/message`.\n  - Content: `north-ready`.\n  - Access: every user can read the file, only\
  \ its owner can write it, and it is not executable.\n- Repeated real execution:\n  - Targets: `app1`, `app2`,\
  \ `app3`.\n  - `changed=0`, `failed=0`.\n\nThe read-only preview does not establish real-run idempotence;\
  \ Check repeats the real playbook.\n"
stages.0.brief: Repeated delivery must leave the desired fleet state unchanged.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), the permissions on `/srv/site/message`
  allow reading by every user, writing only by its owner, and no execution.
stages.0.objectives.2.text: A repeated real playbook run reports changed=0 and failed=0 for all three hosts.
hints.0.text: Idempotence means a repeated desired-state execution settles without further changes.
hints.1.text: 'A read-only command should not report changed; also check the delivered file mode.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat rollout.yml

  ```'
hints.2.text: 'Run the playbook twice and compare the recap.


  Use changed_when: false for the probe and 0644 for copy; the second real run must be unchanged.


  Verify the observed result:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — shows north-ready from each managed host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — shows permissions
  `-rw-r--r--` on all three remote files.


  - `ansible-playbook --check rollout.yml` — previews changed=0 and failed=0 on all three hosts.


  The --check result is only a preview. For real-run idempotence, after Check has reached the second real execution,
  read its current captured recap on the workstation with `cat /tmp/idempotence-second.log`. Each of app1,
  app2 and app3 must report changed=0 and failed=0.'
debrief: A read-only command always reported a change. You corrected changed_when and verified changed=0 on
  a second real playbook run.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
