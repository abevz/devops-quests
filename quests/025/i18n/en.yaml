title: Idempotence
brief: 'You joined SignalRail operations. A health check changed the fleet on every run. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three message files contain north-ready, mode 0644; a second playbook
  run reports changed=0 and failed=0 on every host.'
stages.0.brief: 'A read-only probe reports changed every time. The second real run must show changed=0
  and failed=0 on all three hosts.


  Success criteria: All three message files contain north-ready, mode 0644; a second playbook run reports
  changed=0 and failed=0 on every host.'
stages.0.objectives.0.text: All three message files contain north-ready, mode 0644; a second playbook
  run reports changed=0 and failed=0 on every host.
hints.0.text: Run the playbook twice and compare the recap.
hints.1.text: A read-only command should not report changed; also check the delivered file mode.
hints.2.text: 'Use changed_when: false for the probe and 0644 for copy; the second real run must be unchanged.'
debrief: A read-only command always reported a change. You corrected changed_when and verified changed=0
  on a second real playbook run.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
