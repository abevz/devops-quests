title: Идемпотентность
brief: |-
  Повторная проверка состояния постоянно сообщает об изменениях.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Хост `app1`:
    - На app1 файл /srv/site/message содержит north-ready.
    - На app1 файл /srv/site/message имеет режим 0644.
  - Хост `app2`:
    - На app2 файл /srv/site/message содержит north-ready.
    - На app2 файл /srv/site/message имеет режим 0644.
  - Хост `app3`:
    - На app3 файл /srv/site/message содержит north-ready.
    - На app3 файл /srv/site/message имеет режим 0644.
  - Результаты на workstation и результаты выполнения:
    - Повторный реальный запуск playbook сообщает changed=0 и failed=0 на всех трёх хостах.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — показывает north-ready с каждого управляемого хоста.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — показывает права `-rw-r--r--` у всех трёх удалённых файлов.
  - `ansible-playbook --check rollout.yml` — предварительно показывает changed=0 и failed=0 на всех трёх хостах.

  Предварительная проверка не доказывает идемпотентность реального выполнения; Check повторяет реальный playbook.
stages.0.brief: Повторная доставка должна сохранять желаемое состояние хостов.
stages.0.objectives.0.text: На app1 файл /srv/site/message содержит north-ready.
stages.0.objectives.1.text: На app1 файл /srv/site/message имеет режим 0644.
stages.0.objectives.2.text: На app2 файл /srv/site/message содержит north-ready.
stages.0.objectives.3.text: На app2 файл /srv/site/message имеет режим 0644.
stages.0.objectives.4.text: На app3 файл /srv/site/message содержит north-ready.
stages.0.objectives.5.text: На app3 файл /srv/site/message имеет режим 0644.
stages.0.objectives.6.text: Повторный реальный запуск playbook сообщает changed=0 и failed=0 на всех трёх хостах.
hints.0.text: Запустите playbook дважды и сравните recap.
hints.1.text: Читающая команда не должна сообщать changed; проверьте также mode файла.
hints.2.text: 'Задайте changed_when: false для probe и 0644 для copy; второй запуск не должен менять состояние.'
debrief: Читающая команда всегда сообщала об изменении. Вы исправили changed_when и проверили changed=0 во втором
  реальном запуске.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
