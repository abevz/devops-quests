title: Идемпотентность
brief: 'Вы в команде эксплуатации SignalRail. Проверка меняла хост при каждом запуске. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах message содержит north-ready, режим 0644; второй запуск playbook
  показывает changed=0 и failed=0 на каждом узле.'
stages.0.brief: 'Read-only probe всегда сообщает changed. Второй запуск должен дать changed=0, failed=0
  на трёх хостах.


  Результат проверки: На всех трёх узлах message содержит north-ready, режим 0644; второй запуск playbook
  показывает changed=0 и failed=0 на каждом узле.'
stages.0.objectives.0.text: На всех трёх узлах message содержит north-ready, режим 0644; второй запуск
  playbook показывает changed=0 и failed=0 на каждом узле.
hints.0.text: Запустите playbook дважды и сравните recap.
hints.1.text: Читающая команда не должна сообщать changed; проверьте также mode файла.
hints.2.text: 'Задайте changed_when: false для probe и 0644 для copy; второй запуск не должен менять состояние.'
debrief: Читающая команда всегда сообщала об изменении. Вы исправили changed_when и проверили changed=0
  во втором реальном запуске.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
