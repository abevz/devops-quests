title: Идемпотентность
brief: "Повторная проверка состояния постоянно сообщает об изменениях.\n\nРаботайте на workstation в `~/quest`\
  \ с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Требования:**\n- Файл на каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n  - Содержимое: `north-ready`.\n  - Доступ:\
  \ все пользователи могут читать файл, только владелец может писать в него; файл не исполняемый.\n- Повторное\
  \ реальное выполнение:\n  - Хосты: `app1`, `app2`, `app3`.\n  - `changed=0`, `failed=0`.\n\nПредварительная\
  \ проверка не доказывает идемпотентность реального выполнения; Check повторяет реальный playbook.\n"
stages.0.brief: Повторная доставка должна сохранять желаемое состояние хостов.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) права на `/srv/site/message`
  разрешают чтение всем пользователям, запись только владельцу и запрещают исполнение.
stages.0.objectives.2.text: Повторный реальный запуск playbook сообщает changed=0 и failed=0 на всех трёх хостах.
hints.0.text: Идемпотентность означает, что повторное выполнение для желаемого состояния обходится без новых
  изменений.
hints.1.text: 'Читающая команда не должна сообщать changed; проверьте также mode файла.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat rollout.yml

  ```'
hints.2.text: 'Запустите playbook дважды и сравните recap.


  Задайте changed_when: false для probe и 0644 для copy; второй запуск не должен менять состояние.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — показывает north-ready с каждого управляемого хоста.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — показывает
  права `-rw-r--r--` у всех трёх удалённых файлов.


  - `ansible-playbook --check rollout.yml` — предварительно показывает changed=0 и failed=0 на всех трёх хостах.


  Результат --check — только предварительный просмотр. Для проверки идемпотентности реального выполнения, когда
  Check дошёл до второго реального запуска, прочитайте его текущий сохранённый recap на рабочей станции командой
  `cat /tmp/idempotence-second.log`. Каждый из app1, app2 и app3 должен сообщать changed=0 и failed=0.'
debrief: Читающая команда всегда сообщала об изменении. Вы исправили changed_when и проверили changed=0 во
  втором реальном запуске.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.content_1: |-
  На app1 может остаться старое сообщение, если play не дошёл до хоста или задача скопировала другое содержимое. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.content_2: |-
  На app2 может остаться старое сообщение, если play не дошёл до хоста или задача скопировала другое содержимое. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.content_3: |-
  На app3 может остаться старое сообщение, если play не дошёл до хоста или задача скопировала другое содержимое. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_1: |-
  Файл на app1 мог сохранить прежние права, если задача копирования пропустила хост или задала другой режим. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_2: |-
  Файл на app2 мог сохранить прежние права, если задача копирования пропустила хост или задала другой режим. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_3: |-
  Файл на app3 мог сохранить прежние права, если задача копирования пропустила хост или задала другой режим. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.recap_1: |-
  Сводка app1 может показывать изменение, если команда чтения всё ещё отмечается как изменившая состояние. Проверьте также ошибки задач и наличие строки хоста в логе повторного запуска. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.recap_2: |-
  Сводка app2 может показывать изменение, если команда чтения всё ещё отмечается как изменившая состояние. Проверьте также ошибки задач и наличие строки хоста в логе повторного запуска. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.recap_3: |-
  Сводка app3 может показывать изменение, если команда чтения всё ещё отмечается как изменившая состояние. Проверьте также ошибки задач и наличие строки хоста в логе повторного запуска. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.repeat_run: |-
  Повторная проверка может завершиться ошибкой, если упал playbook, в сводке нет строки хоста либо есть изменения или ошибки, или не запускается разбор сводки в Python. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.probe_0_2: |-
  Прерывание оболочки или сбой захвата вывода может остановить проверку до результатов playbook или отдельных хостов. [Гайд](guides#guide=ansible-4&section=repeat-copy-idempotence)
