diagnostics.recap_1: |-
  Die Zusammenfassung für app1 kann eine Änderung melden, wenn ein lesender Befehl Änderungen meldet. Prüfen Sie auch Aufgabenfehler und die Hostzeile im Protokoll. [Leitfaden](guides#guide=ansible-4&section=repeat-copy-idempotence)
