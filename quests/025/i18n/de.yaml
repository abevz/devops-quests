  Die Zusammenfassung für app2 kann eine Änderung melden, wenn ein lesender Befehl Änderungen meldet. Prüfen Sie auch Aufgabenfehler und die Hostzeile im Protokoll. [Leitfaden](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.recap_3: |-
  Die Zusammenfassung für app3 kann eine Änderung melden, wenn ein lesender Befehl Änderungen meldet. Prüfen Sie auch Aufgabenfehler und die Hostzeile im Protokoll. [Leitfaden](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.repeat_run: |-
  Die Wiederholungsprüfung kann fehlschlagen, wenn das Playbook scheitert, eine Host-Zusammenfassung fehlt oder Änderungen oder Fehler meldet oder die Python-Auswertung nicht startet. [Leitfaden](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.probe_0_2: |-
  Eine unterbrochene Shell oder ein Fehler beim Erfassen der Ausgabe kann die Prüfung vor dem Ergebnis des Playbooks oder Hosts stoppen. [Leitfaden](guides#guide=ansible-4&section=repeat-copy-idempotence)
