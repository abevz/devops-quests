hints.0.text: Führen Sie playbook zweimal aus und vergleichen Sie recap.
hints.1.text: Ein schreibgeschützter Befehl sollte keine Änderungen melden; Überprüfen Sie auch den Modus der gelieferten
  Datei.
hints.2.text: 'Verwenden Sie changed_when: false für probe und 0644 für copy. der zweite reale Lauf muss unverändert
  sein.'
debrief: Ein schreibgeschützter Befehl hat immer eine Änderung gemeldet. Sie haben changed_when korrigiert und changed=0
  in einem zweiten echten Playbook-Lauf verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
