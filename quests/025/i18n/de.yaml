title: Idempotenz
brief: "Eine wiederholte Zustandsprüfung meldet weiterhin Änderungen.\n\nArbeiten Sie auf der Workstation in\
  \ `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n- Datei auf jedem verwalteten\
  \ Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `north-ready`.\n  - Zugriff:\
  \ Jeder Benutzer kann die Datei lesen, nur ihr Eigentümer kann sie schreiben, und sie ist nicht ausführbar.\n\
  - Wiederholte echte Ausführung:\n  - Ziele: `app1`, `app2`, `app3`.\n  - `changed=0`, `failed=0`.\n\nDie\
  \ schreibgeschützte Vorschau belegt keine Idempotenz echter Läufe; Check wiederholt das echte Playbook.\n"
stages.0.brief: Wiederholte Auslieferung muss den gewünschten Flottenzustand unverändert lassen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  den Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) erlauben die Rechte von `/srv/site/message`
  allen Benutzern das Lesen, nur dem Eigentümer das Schreiben und keine Ausführung.
stages.0.objectives.2.text: Ein wiederholter echter Playbook-Lauf meldet changed=0 und failed=0 für alle drei
  Hosts.
hints.0.text: Idempotenz bedeutet, dass eine wiederholte Ausführung für den Sollzustand ohne weitere Änderungen
  auskommt.
hints.1.text: 'Ein schreibgeschützter Befehl sollte keine Änderungen melden; Überprüfen Sie auch den Modus
  der gelieferten Datei.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat rollout.yml

  ```'
hints.2.text: 'Führen Sie playbook zweimal aus und vergleichen Sie recap.


  Verwenden Sie changed_when: false für probe und 0644 für copy. der zweite reale Lauf muss unverändert sein.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — zeigt north-ready von jedem verwalteten Host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — zeigt Berechtigungen
  `-rw-r--r--` für alle drei entfernten Dateien.


  - `ansible-playbook --check rollout.yml` — zeigt in der Vorschau changed=0 und failed=0 auf allen drei Hosts.


  Das --check-Ergebnis ist nur eine Vorschau. Wenn Check den zweiten tatsächlichen Lauf erreicht hat, lesen
  Sie zur Prüfung der Idempotenz dessen aktuelle aufgezeichnete Zusammenfassung auf der Workstation mit `cat
  /tmp/idempotence-second.log`. Für app1, app2 und app3 müssen jeweils changed=0 und failed=0 gemeldet werden.'
debrief: Ein schreibgeschützter Befehl hat immer eine Änderung gemeldet. Sie haben changed_when korrigiert
  und changed=0 in einem zweiten echten Playbook-Lauf verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.content_1: Auf app1 enthält /srv/site/message den Inhalt north-ready.
diagnostics.content_2: Auf app2 enthält /srv/site/message den Inhalt north-ready.
diagnostics.content_3: Auf app3 enthält /srv/site/message den Inhalt north-ready.
diagnostics.mode_1: Auf app1 hat /srv/site/message den Modus 0644.
diagnostics.mode_2: Auf app2 hat /srv/site/message den Modus 0644.
diagnostics.mode_3: Auf app3 hat /srv/site/message den Modus 0644.
diagnostics.recap_1: 'Workstation /tmp/idempotence-second.log: app1 muss changed=0 und failed=0 melden.'
diagnostics.recap_2: 'Workstation /tmp/idempotence-second.log: app2 muss changed=0 und failed=0 melden.'
diagnostics.recap_3: 'Workstation /tmp/idempotence-second.log: app3 muss changed=0 und failed=0 melden.'
diagnostics.repeat_run: Die Workstation-Prüfung des Wiederholungslaufs von rollout.yml oder /tmp/idempotence-second.log
  ist fehlgeschlagen.
