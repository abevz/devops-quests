diagnostics.mode_1: |-
  Die Datei auf app1 kann ihren alten Modus behalten, wenn die Copy-Aufgabe den Host übersprungen oder einen anderen Modus gesetzt hat. [Leitfaden](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_2: |-
  Die Datei auf app2 kann ihren alten Modus behalten, wenn die Copy-Aufgabe den Host übersprungen oder einen anderen Modus gesetzt hat. [Leitfaden](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_3: |-
