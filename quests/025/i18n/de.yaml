title: Idempotenz
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Ein Gesundheitscheck veränderte die Flotte bei jedem
  Lauf. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingaben in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Alle drei message-Dateien enthalten north-ready, Modus 0644; Ein zweiter playbook-Lauf
  meldet changed=0 und failed=0 auf jedem Host.'
stages.0.brief: 'Ein read-only probe meldet jedes Mal Änderungen. Der zweite echte Lauf muss auf allen
  drei Hosts changed=0 und failed=0 anzeigen.


  Erfolgskriterien: Alle drei message-Dateien enthalten north-ready, Modus 0644; Ein zweiter playbook-Lauf
  meldet changed=0 und failed=0 auf jedem Host.'
stages.0.objectives.0.text: Alle drei message-Dateien enthalten north-ready, Modus 0644; Ein zweiter playbook-Lauf
  meldet changed=0 und failed=0 auf jedem Host.
hints.0.text: Führen Sie playbook zweimal aus und vergleichen Sie recap.
hints.1.text: Ein schreibgeschützter Befehl sollte keine Änderungen melden; Überprüfen Sie auch den Modus
  der gelieferten Datei.
hints.2.text: 'Verwenden Sie changed_when: false für probe und 0644 für copy. der zweite reale Lauf muss
  unverändert sein.'
debrief: Ein schreibgeschützter Befehl hat immer eine Änderung gemeldet. Sie haben changed_when korrigiert
  und changed=0 in einem zweiten echten Playbook-Lauf verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
