title: Idempotenz
brief: |-
  Eine wiederholte Zustandsprüfung meldet weiterhin Änderungen.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-ready`.
    - Zugriffsmodus: `0644`.
  - Wiederholte echte Ausführung:
    - Ziele: `app1`, `app2`, `app3`.
    - `changed=0`, `failed=0`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — zeigt north-ready von jedem verwalteten Host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — zeigt Berechtigungen `-rw-r--r--` für alle drei entfernten Dateien.
  - `ansible-playbook --check rollout.yml` — zeigt in der Vorschau changed=0 und failed=0 auf allen drei Hosts.

  Die schreibgeschützte Vorschau belegt keine Idempotenz echter Läufe; Check wiederholt das echte Playbook.
stages.0.brief: Wiederholte Auslieferung muss den gewünschten Flottenzustand unverändert lassen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
stages.0.objectives.2.text: Ein wiederholter echter Playbook-Lauf meldet changed=0 und failed=0 für alle drei Hosts.
hints.0.text: Führen Sie playbook zweimal aus und vergleichen Sie recap.
hints.1.text: Ein schreibgeschützter Befehl sollte keine Änderungen melden; Überprüfen Sie auch den Modus der gelieferten
  Datei.
hints.2.text: 'Verwenden Sie changed_when: false für probe und 0644 für copy. der zweite reale Lauf muss unverändert
  sein.'
debrief: Ein schreibgeschützter Befehl hat immer eine Änderung gemeldet. Sie haben changed_when korrigiert und changed=0
  in einem zweiten echten Playbook-Lauf verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
