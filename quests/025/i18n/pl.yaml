diagnostics.mode_3: Na app3 plik /srv/site/message ma tryb 0644.
diagnostics.recap_1: 'Workstation /tmp/idempotence-second.log: app1 musi zgłaszać changed=0 i failed=0.'
diagnostics.recap_2: 'Workstation /tmp/idempotence-second.log: app2 musi zgłaszać changed=0 i failed=0.'
diagnostics.recap_3: 'Workstation /tmp/idempotence-second.log: app3 musi zgłaszać changed=0 i failed=0.'
diagnostics.repeat_run: Nie powiodła się kontrola ponownego wykonania rollout.yml lub /tmp/idempotence-second.log
  na workstation.
diagnostics.probe_0_2: 'Bieżące dane nie pozwalają potwierdzić tego celu: Powtórne rzeczywiste wykonanie playbooka
  zgłasza changed=0 i failed=0 na wszystkich trzech hostach.'
