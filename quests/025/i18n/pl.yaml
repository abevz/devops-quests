title: Idempotencja
brief: 'Dołączyłeś do operacji SignalRail. Kontrola stanu zmieniała flotę przy każdym uruchomieniu. Pracuj
  w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Wszystkie trzy pliki message zawierają north-ready, tryb 0644; drugie uruchomienie
  playbook raportuje changed=0 i failed=0 na każdym hoście.'
stages.0.brief: 'Sonda tylko do odczytu za każdym razem zgłasza changed. Drugi prawdziwy przebieg musi
  pokazywać changed=0 i failed=0 na wszystkich trzech hostach.


  Kryteria sukcesu: Wszystkie trzy pliki message zawierają north-ready, tryb 0644; drugie uruchomienie
  playbook raportuje changed=0 i failed=0 na każdym hoście.'
stages.0.objectives.0.text: Wszystkie trzy pliki message zawierają north-ready, tryb 0644; drugie uruchomienie
  playbook raportuje changed=0 i failed=0 na każdym hoście.
hints.0.text: Uruchom playbook dwa razy i porównaj recap.
hints.1.text: Polecenie tylko do odczytu nie powinno zgłaszać changed; sprawdź także dostarczony plik
  mode.
hints.2.text: 'Użyj changed_when: false dla probe i 0644 dla copy; drugi bieg rzeczywisty musi pozostać
  niezmieniony.'
debrief: Polecenie tylko do odczytu zawsze zgłaszało zmianę. Poprawiłeś changed_when i zweryfikowałeś
  changed=0 w drugim prawdziwym uruchomieniu podręcznika.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
