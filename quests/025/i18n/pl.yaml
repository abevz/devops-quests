title: Idempotencja
brief: |-
  Powtarzana kontrola stanu nadal zgłasza zmiany.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Host `app1`:
    - Na app1 plik /srv/site/message zawiera north-ready.
    - Na app1 plik /srv/site/message ma tryb 0644.
  - Host `app2`:
    - Na app2 plik /srv/site/message zawiera north-ready.
    - Na app2 plik /srv/site/message ma tryb 0644.
  - Host `app3`:
    - Na app3 plik /srv/site/message zawiera north-ready.
    - Na app3 plik /srv/site/message ma tryb 0644.
  - Wyniki na workstation i wyniki wykonania:
    - Powtórne rzeczywiste wykonanie playbooka zgłasza changed=0 i failed=0 na wszystkich trzech hostach.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — pokazuje north-ready z każdego zarządzanego hosta.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — pokazuje uprawnienia `-rw-r--r--` wszystkich trzech zdalnych plików.
  - `ansible-playbook --check rollout.yml` — pokazuje w podglądzie changed=0 i failed=0 na wszystkich trzech hostach.

  Podgląd bez zapisu nie dowodzi idempotencji rzeczywistego wykonania; Check powtarza rzeczywisty playbook.
stages.0.brief: Powtórne dostarczenie musi zachować żądany stan hostów.
stages.0.objectives.0.text: Na app1 plik /srv/site/message zawiera north-ready.
stages.0.objectives.1.text: Na app1 plik /srv/site/message ma tryb 0644.
stages.0.objectives.2.text: Na app2 plik /srv/site/message zawiera north-ready.
stages.0.objectives.3.text: Na app2 plik /srv/site/message ma tryb 0644.
stages.0.objectives.4.text: Na app3 plik /srv/site/message zawiera north-ready.
stages.0.objectives.5.text: Na app3 plik /srv/site/message ma tryb 0644.
stages.0.objectives.6.text: Powtórne rzeczywiste wykonanie playbooka zgłasza changed=0 i failed=0 na wszystkich
  trzech hostach.
hints.0.text: Uruchom playbook dwa razy i porównaj recap.
hints.1.text: Polecenie tylko do odczytu nie powinno zgłaszać changed; sprawdź także dostarczony plik mode.
hints.2.text: 'Użyj changed_when: false dla probe i 0644 dla copy; drugi bieg rzeczywisty musi pozostać niezmieniony.'
debrief: Polecenie tylko do odczytu zawsze zgłaszało zmianę. Poprawiłeś changed_when i zweryfikowałeś changed=0
  w drugim prawdziwym uruchomieniu podręcznika.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
