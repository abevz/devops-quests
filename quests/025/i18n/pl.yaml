title: Idempotencja
brief: "Powtarzana kontrola stanu nadal zgłasza zmiany.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n\
  \  - Ścieżka: `/srv/site/message`.\n  - Treść: `north-ready`.\n  - Dostęp: każdy użytkownik może odczytać\
  \ plik, tylko właściciel może go zapisać i plik nie jest wykonywalny.\n- Powtórne rzeczywiste wykonanie:\n\
  \  - Hosty: `app1`, `app2`, `app3`.\n  - `changed=0`, `failed=0`.\n\nPodgląd bez zapisu nie dowodzi idempotencji\
  \ rzeczywistego wykonania; Check powtarza rzeczywisty playbook.\n"
stages.0.brief: Powtórne dostarczenie musi zachować żądany stan hostów.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `north-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) uprawnienia do `/srv/site/message`
  pozwalają wszystkim użytkownikom na odczyt, tylko właścicielowi na zapis i nie pozwalają na wykonanie.
stages.0.objectives.2.text: Powtórne rzeczywiste wykonanie playbooka zgłasza changed=0 i failed=0 na wszystkich
  trzech hostach.
hints.0.text: Idempotencja oznacza, że ponowne wykonanie dla stanu pożądanego kończy się bez dalszych zmian.
hints.1.text: 'Polecenie tylko do odczytu nie powinno zgłaszać changed; sprawdź także dostarczony plik mode.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat rollout.yml

  ```'
hints.2.text: 'Uruchom playbook dwa razy i porównaj recap.


  Użyj changed_when: false dla probe i 0644 dla copy; drugi bieg rzeczywisty musi pozostać niezmieniony.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — pokazuje north-ready z każdego zarządzanego hosta.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — pokazuje uprawnienia
  `-rw-r--r--` wszystkich trzech zdalnych plików.


  - `ansible-playbook --check rollout.yml` — pokazuje w podglądzie changed=0 i failed=0 na wszystkich trzech
  hostach.


  Wynik --check to tylko podgląd. Aby sprawdzić idempotencję rzeczywistego wykonania, gdy Check dotrze do drugiego
  rzeczywistego uruchomienia, odczytaj jego bieżące zapisane podsumowanie na stacji roboczej poleceniem `cat
  /tmp/idempotence-second.log`. Każdy z hostów app1, app2 i app3 musi zgłaszać changed=0 oraz failed=0.'
debrief: Polecenie tylko do odczytu zawsze zgłaszało zmianę. Poprawiłeś changed_when i zweryfikowałeś changed=0
  w drugim prawdziwym uruchomieniu podręcznika.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.content_1: Na app1 plik /srv/site/message zawiera north-ready.
