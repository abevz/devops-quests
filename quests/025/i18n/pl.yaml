diagnostics.recap_1: |-
  Podsumowanie app1 może pokazać zmianę, jeśli polecenie odczytu zgłasza zmiany. Sprawdź także błędy zadań i obecność wiersza hosta w logu drugiego przebiegu. [Przewodnik](guides#guide=ansible-4&section=repeat-copy-idempotence)
