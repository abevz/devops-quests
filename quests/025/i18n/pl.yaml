diagnostics.repeat_run: |-
  Powtórzenie może się nie udać, jeśli playbook zawiedzie, brakuje podsumowania hosta lub zgłasza ono zmiany albo błędy, bądź parser Pythona nie startuje. [Przewodnik](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.probe_0_2: |-
  Przerwanie powłoki lub błąd przechwytywania wyjścia może zatrzymać sondę przed wynikiem playbooka lub hosta. [Przewodnik](guides#guide=ansible-4&section=repeat-copy-idempotence)
