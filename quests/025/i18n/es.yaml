title: Idempotencia
brief: |-
  Una operación de salud repetida sigue informando cambios.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Host `app1`:
    - En app1, /srv/site/message contiene north-ready.
    - En app1, /srv/site/message tiene el modo 0644.
  - Host `app2`:
    - En app2, /srv/site/message contiene north-ready.
    - En app2, /srv/site/message tiene el modo 0644.
  - Host `app3`:
    - En app3, /srv/site/message contiene north-ready.
    - En app3, /srv/site/message tiene el modo 0644.
  - Resultados en la workstation y de ejecución:
    - Una ejecución real repetida del playbook informa changed=0 y failed=0 en los tres hosts.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — muestra north-ready de cada host administrado.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.
  - `ansible-playbook --check rollout.yml` — muestra en la vista previa changed=0 y failed=0 en los tres hosts.

  La vista previa de solo lectura no demuestra idempotencia real; Check repite el playbook real.
stages.0.brief: La entrega repetida debe conservar el estado deseado de la flota.
