title: Idempotencia
brief: 'Te uniste a las operaciones de SignalRail. Un control de estado cambiaba la flota en cada viaje.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres archivos message contienen north-ready, modo 0644; una segunda
  ejecución de playbook informa changed=0 y failed=0 en cada host.'
stages.0.brief: 'Un read-only probe informa changed cada vez. La segunda ejecución real debe mostrar changed=0
  y failed=0 en los tres hosts.


  Criterios de éxito: los tres archivos message contienen north-ready, modo 0644; una segunda ejecución
  de playbook informa changed=0 y failed=0 en cada host.'
stages.0.objectives.0.text: Los tres archivos message contienen north-ready, modo 0644; una segunda ejecución
  de playbook informa changed=0 y failed=0 en cada host.
hints.0.text: Ejecute playbook dos veces y compare recap.
hints.1.text: Un comando de sólo lectura no debería informar changed; También verifique el modo del archivo
  entregado.
hints.2.text: 'Utilice changed_when: false para probe y 0644 para copy; la segunda ejecución real no debe
  modificarse.'
debrief: Un comando de sólo lectura siempre informaba de un cambio. Corregió changed_when y verificó changed=0
  en una segunda ejecución del libro de jugadas real.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
