title: Idempotencia
brief: "Una operación de salud repetida sigue informando cambios.\n\nTrabaja en la workstation en `~/quest`\
  \ con `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n- Archivo en cada host administrado\
  \ (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n  - Contenido: `north-ready`.\n  - Acceso: todos\
  \ los usuarios pueden leer el archivo, solo su propietario puede escribirlo y no es ejecutable.\n- Ejecución\
  \ real repetida:\n  - Destinos: `app1`, `app2`, `app3`.\n  - `changed=0`, `failed=0`.\n\nLa vista previa\
  \ de solo lectura no demuestra idempotencia real; Check repite el playbook real.\n"
stages.0.brief: La entrega repetida debe conservar el estado deseado de la flota.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  `north-ready`.
stages.0.objectives.1.text: En cada host gestionado (`app1`, `app2`, `app3`), los permisos de `/srv/site/message`
  permiten leer a todos los usuarios, escribir solo a su propietario y no permiten la ejecución.
stages.0.objectives.2.text: Una ejecución real repetida del playbook informa changed=0 y failed=0 en los tres
  hosts.
hints.0.text: La idempotencia significa que una ejecución repetida para el estado deseado termina sin cambios
  adicionales.
hints.1.text: 'Un comando de sólo lectura no debería informar changed; También verifique el modo del archivo
  entregado.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat rollout.yml

  ```'
hints.2.text: 'Ejecute playbook dos veces y compare recap.


  Utilice changed_when: false para probe y 0644 para copy; la segunda ejecución real no debe modificarse.


  Verifica el resultado observado:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — muestra north-ready de cada host administrado.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — muestra permisos
  `-rw-r--r--` en los tres archivos remotos.


  - `ansible-playbook --check rollout.yml` — muestra en la vista previa changed=0 y failed=0 en los tres hosts.


  El resultado de --check es solo una vista previa. Para verificar la idempotencia real, cuando Check haya
  llegado a la segunda ejecución real, lee su resumen actual registrado en la estación de trabajo con `cat
  /tmp/idempotence-second.log`. Cada uno de app1, app2 y app3 debe informar changed=0 y failed=0.'
debrief: Un comando de sólo lectura siempre informaba de un cambio. Corregió changed_when y verificó changed=0
  en una segunda ejecución del libro de jugadas real.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: En app1, /srv/site/message contiene north-ready.
diagnostics.content_2: En app2, /srv/site/message contiene north-ready.
diagnostics.content_3: En app3, /srv/site/message contiene north-ready.
diagnostics.mode_1: En app1, /srv/site/message tiene el modo 0644.
diagnostics.mode_2: En app2, /srv/site/message tiene el modo 0644.
diagnostics.mode_3: En app3, /srv/site/message tiene el modo 0644.
diagnostics.recap_1: 'Workstation /tmp/idempotence-second.log: app1 debe informar changed=0 y failed=0.'
diagnostics.recap_2: 'Workstation /tmp/idempotence-second.log: app2 debe informar changed=0 y failed=0.'
diagnostics.recap_3: 'Workstation /tmp/idempotence-second.log: app3 debe informar changed=0 y failed=0.'
diagnostics.repeat_run: Falló la comprobación de repetición de rollout.yml o /tmp/idempotence-second.log en
  la workstation.
