title: Idempotencia
brief: "Una operación de salud repetida sigue informando cambios.\n\nTrabaja en la workstation en `~/quest`\
  \ con `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n- Archivo en cada host administrado\
  \ (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n  - Contenido: `north-ready`.\n  - Acceso: todos\
  \ los usuarios pueden leer el archivo, solo su propietario puede escribirlo y no es ejecutable.\n- Ejecución\
  \ real repetida:\n  - Destinos: `app1`, `app2`, `app3`.\n  - `changed=0`, `failed=0`.\n\nLa vista previa\
  \ de solo lectura no demuestra idempotencia real; Check repite el playbook real.\n"
stages.0.brief: La entrega repetida debe conservar el estado deseado de la flota.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  `north-ready`.
stages.0.objectives.1.text: En cada host gestionado (`app1`, `app2`, `app3`), los permisos de `/srv/site/message`
  permiten leer a todos los usuarios, escribir solo a su propietario y no permiten la ejecución.
stages.0.objectives.2.text: Una ejecución real repetida del playbook informa changed=0 y failed=0 en los tres
  hosts.
hints.0.text: La idempotencia significa que una ejecución repetida para el estado deseado termina sin cambios
  adicionales.
hints.1.text: |-
  Un comando de sólo lectura no debería informar changed; También verifique el modo del archivo entregado.

  Inspecciona las entradas suministradas y el ámbito de ejecución:

  Configura changed_when: false en la tarea de diagnóstico y 0644 en la tarea de copia. La segunda ejecución real debe terminar sin cambios.

  ```sh
  cat inventory.ini
  cat rollout.yml
  ansible fleet -i inventory.ini --list-hosts
  ```
hints.2.text: |-
  Ejecute playbook dos veces y compare recap.

  Verifica el resultado observado:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — muestra north-ready de cada host administrado.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.

  - `ansible-playbook --check rollout.yml` — muestra en la vista previa changed=0 y failed=0 en los tres hosts.

  El resultado de --check es solo una vista previa. Para verificar la idempotencia real, cuando Check haya llegado a la segunda ejecución real, lee su resumen actual registrado en la estación de trabajo con `cat /tmp/idempotence-second.log`. Cada uno de app1, app2 y app3 debe informar changed=0 y failed=0.
debrief: Un comando de sólo lectura siempre informaba de un cambio. Corregió changed_when y verificó changed=0
  en una segunda ejecución del libro de jugadas real.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: |-
  El mensaje de app1 puede quedar obsoleto si el play no llegó a ese host o la copia usó otro contenido. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.content_2: |-
  El mensaje de app2 puede quedar obsoleto si el play no llegó a ese host o la copia usó otro contenido. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.content_3: |-
  El mensaje de app3 puede quedar obsoleto si el play no llegó a ese host o la copia usó otro contenido. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_1: |-
  El archivo en app1 pudo conservar su modo anterior si la tarea de copia omitió ese host o usó otro modo. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_2: |-
  El archivo en app2 pudo conservar su modo anterior si la tarea de copia omitió ese host o usó otro modo. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.mode_3: |-
  El archivo en app3 pudo conservar su modo anterior si la tarea de copia omitió ese host o usó otro modo. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.recap_1: |-
  El resumen de app1 puede indicar un cambio si un comando de lectura aún declara cambios. Revisa también los fallos de tareas y la fila del host en el registro. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.recap_2: |-
  El resumen de app2 puede indicar un cambio si un comando de lectura aún declara cambios. Revisa también los fallos de tareas y la fila del host en el registro. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.recap_3: |-
  El resumen de app3 puede indicar un cambio si un comando de lectura aún declara cambios. Revisa también los fallos de tareas y la fila del host en el registro. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.repeat_run: |-
  La repetición puede fallar si el playbook falla, si falta el resumen de un host o indica cambios o errores, o si el analizador de Python no arranca. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
diagnostics.probe_0_2: |-
  Una interrupción del shell o un error al capturar la salida puede detener la prueba antes del resultado del playbook o de un host. [Guía](guides#guide=ansible-4&section=repeat-copy-idempotence)
