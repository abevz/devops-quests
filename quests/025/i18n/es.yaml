title: Idempotencia
brief: |-
  Una operación de salud repetida sigue informando cambios.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-ready`.
    - Modo de acceso: `0644`.
  - Ejecución real repetida:
    - Destinos: `app1`, `app2`, `app3`.
    - `changed=0`, `failed=0`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — muestra north-ready de cada host administrado.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.
  - `ansible-playbook --check rollout.yml` — muestra en la vista previa changed=0 y failed=0 en los tres hosts.

  La vista previa de solo lectura no demuestra idempotencia real; Check repite el playbook real.
stages.0.brief: La entrega repetida debe conservar el estado deseado de la flota.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.2.text: Una ejecución real repetida del playbook informa changed=0 y failed=0 en los tres hosts.
hints.0.text: Ejecute playbook dos veces y compare recap.
hints.1.text: Un comando de sólo lectura no debería informar changed; También verifique el modo del archivo entregado.
hints.2.text: 'Utilice changed_when: false para probe y 0644 para copy; la segunda ejecución real no debe modificarse.'
debrief: Un comando de sólo lectura siempre informaba de un cambio. Corregió changed_when y verificó changed=0 en
  una segunda ejecución del libro de jugadas real.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
