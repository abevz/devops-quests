title: Refactor into module with moved blocks
brief: 'You joined SignalRail operations. Move a live worker into a module with an empty final plan. Work
  in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The module owns the original worker; final plan is empty.'
stages.0.brief: 'Refactor the live Docker worker into module.station using moved. Keep the exact container
  ID and leave an empty plan.


  Success criteria: The module owns the original worker; final plan is empty.'
stages.0.objectives.0.text: The module owns the original worker; final plan is empty.
hints.0.text: Record the live container ID before moving addresses.
hints.1.text: The destination is module.station.docker_container.worker.
hints.2.text: Use a root moved block, initialize the local module, apply the move and prove the final
  plan is empty with the same ID.
debrief: The live worker moved into a child module. You used a moved block, preserved the exact Docker
  container ID, and proved the final plan was empty.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
