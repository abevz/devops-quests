title: Refactor into module with moved blocks
brief: |-
  A consumer needs the existing container through the requested module interface.

  Work on the workstation in `~/quest` with `main.tf`.

  **Requirements:**
  - OpenTofu state:
    - Required addresses: `module.station.docker_container.worker`.
  - Container in the private Docker daemon:
    - Name: `rail-worker`.
  - Container identity:
    - Tracked resource: `module.station.docker_container.worker`.
    - The existing `rail-worker` container, its tracked resource and root output `worker_id` keep the original container ID.
    - The container ID and the tracked resource ID match that receipt.
    - Matching root output: `worker_id`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  The check observes current results; it does not prove which refactoring method was used.
stages.0.brief: Expose the recorded container identity through the required module interface.
hints.0.text: A refactor should preserve the existing container identity.
hints.1.text: |-
  The destination is module.station.docker_container.worker.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf
  tofu state list
  docker inspect rail-worker
  ```
hints.2.text: |-
  Use a root moved block, initialize the local module and apply the move. The child provider must use registry.terraform.io/kreuzwerker/docker version 3.6.2 to match the offline mirror.

  Verify the result from `~/quest` on the workstation:

  - `docker inspect rail-worker --format '{{.Id}}'; cat original-id` — The current container ID matches the supplied receipt.
  - `tofu show -no-color; tofu output -raw worker_id` — Shows `module.station.docker_container.worker`; its ID and `worker_id` match `original-id`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure changes.
debrief: The module state resource, root output and live worker now match the recorded ID, and the final
  plan has no changes.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: tofu state list must contain module.station.docker_container.worker.
diagnostics.condition_1: original-id must be nonempty, and tofu output -raw worker_id must equal it.
diagnostics.condition_2: original-id must be nonempty, and tofu show -json module.station.docker_container.worker
  ID must equal it.
diagnostics.condition_3: original-id must be nonempty, and docker inspect rail-worker ID must equal it.
diagnostics.condition_4: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: OpenTofu state includes `module.station.docker_container.worker`.
stages.0.objectives.1.text: The existing `rail-worker` container, its tracked resource and root output
  `worker_id` keep the original container ID.
stages.0.objectives.2.text: OpenTofu reports no pending infrastructure changes.
