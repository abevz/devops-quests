title: Refactor into module with moved blocks
brief: 'Work in `~/quest`. Read `main.tf` and `original-id`: a running `rail-worker` container is recorded as a root resource. Refactor it into `modules/station`, with the child declaring the root''s offline Docker provider source `registry.terraform.io/kreuzwerker/docker` and version `3.6.2`. The linked guide explains `moved` blocks; they are one way to change an address without replacing the resource.


  Verify that `tofu state list` contains `module.station.docker_container.worker`, the root output `worker_id` equals `original-id`, and the live ID from `docker inspect rail-worker --format ''{{.Id}}''` equals `original-id`. `tofu plan -input=false -detailed-exitcode -no-color` must exit 0 (no changes). The check observes these results; it does not prove which refactoring method you used. Work only inside the offline bay. Inspect the resource ID in `tofu show -json`: it must also equal `original-id`.'
stages.0.brief: 'The module state address and both worker IDs match the brief, and the plan exits 0. Inspect the resource ID in `tofu show -json`: it must also equal `original-id`.'
stages.0.objectives.0.text: 'The module state address and both worker IDs match the brief, and the plan exits 0. Inspect the resource ID in `tofu show -json`: it must also equal `original-id`.'
hints.0.text: Record the live container ID before moving addresses.
hints.1.text: The destination is module.station.docker_container.worker.
hints.2.text: Use a root moved block, initialize the local module, apply the move and prove the final
  plan is empty with the same ID.
debrief: The module state resource, root output and live worker now match the recorded ID, and the final plan has no changes.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
