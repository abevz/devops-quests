title: Рефакторинг в модуль без замены
brief: 'Вы в команде эксплуатации SignalRail. Вынесите рабочий контейнер в модуль с moved. Работайте в
  ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Модуль владеет исходным worker; итоговый plan пуст.'
stages.0.brief: 'Вынесите рабочий Docker worker в module.station через moved. Сохраните точный ID и получите
  пустой plan.


  Результат проверки: Модуль владеет исходным worker; итоговый plan пуст.'
stages.0.objectives.0.text: Модуль владеет исходным worker; итоговый plan пуст.
hints.0.text: Зафиксируйте ID живого контейнера до переноса адресов.
hints.1.text: Целевой адрес — module.station.docker_container.worker.
hints.2.text: Используйте moved в корне, инициализируйте модуль, примените перенос и подтвердите пустой
  plan с тем же ID.
debrief: Рабочий worker перенесён в дочерний модуль. Вы использовали moved, сохранили точный ID Docker-контейнера
  и подтвердили пустой plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
