title: Рефакторинг в модуль без замены
brief: |-
  Потребителю нужен существующий контейнер через требуемый интерфейс модуля.

  Работайте на workstation в `~/quest` с файлами `main.tf`.

  **Требования:**
  - Состояние OpenTofu:
    - Требуемые адреса: `module.station.docker_container.worker`.
  - Контейнер в приватном Docker daemon:
    - Имя: `rail-worker`.
  - Идентичность контейнера:
    - Отслеживаемый ресурс: `module.station.docker_container.worker`.
    - Существующий контейнер `rail-worker`, его учтённый ресурс и корневое выходное значение `worker_id` сохраняют исходный ID контейнера.
    - ID контейнера и ID отслеживаемого ресурса совпадают с этой квитанцией.
    - Совпадающий корневой вывод: `worker_id`.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.

  Проверка наблюдает текущие результаты; она не доказывает, какой метод рефакторинга использовался.
stages.0.brief: Предоставьте записанную идентичность контейнера через требуемый интерфейс модуля.
hints.0.text: Рефакторинг должен сохранить существующую идентичность контейнера.
hints.1.text: |-
  Целевой адрес — module.station.docker_container.worker.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf
  tofu state list
  docker inspect rail-worker
  ```
hints.2.text: |-
  Используйте корневой блок moved, инициализируйте локальный модуль и примените перенос. Дочерний провайдер должен использовать registry.terraform.io/kreuzwerker/docker версии 3.6.2 для соответствия офлайн-зеркалу.

  Проверьте результат из `~/quest` на workstation:

  - `docker inspect rail-worker --format '{{.Id}}'; cat original-id` — Текущий ID контейнера совпадает с предоставленной квитанцией.
  - `tofu show -no-color; tofu output -raw worker_id` — Показывает `module.station.docker_container.worker`; его ID и `worker_id` совпадают с `original-id`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.
debrief: Ресурс состояния модуля, корневой выход и работающий worker теперь совпадают с записанным ID,
  а итоговый план не содержит изменений.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать module.station.docker_container.worker.
diagnostics.condition_1: original-id должен быть непустым, а tofu output -raw worker_id должен совпадать
  с его содержимым.
diagnostics.condition_2: original-id должен быть непустым, а tofu show -json module.station.docker_container.worker
  ID должен совпадать с его содержимым.
diagnostics.condition_3: original-id должен быть непустым, а docker inspect rail-worker ID должен совпадать
  с его содержимым.
diagnostics.condition_4: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
stages.0.objectives.0.text: Состояние OpenTofu содержит `module.station.docker_container.worker`.
stages.0.objectives.1.text: Существующий контейнер `rail-worker`, его учтённый ресурс и корневое выходное
  значение `worker_id` сохраняют исходный ID контейнера.
stages.0.objectives.2.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
