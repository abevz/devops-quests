title: Рефакторинг в модуль без замены
brief: 'Работайте в `~/quest`. Изучите `main.tf` и `original-id`: работающий контейнер `rail-worker` записан как корневой
  ресурс. Перенесите конфигурацию в `modules/station`; дочерний модуль должен объявить источник офлайн-провайдера Docker из
  корня `registry.terraform.io/kreuzwerker/docker` и версию `3.6.2`. Руководство объясняет блоки `moved` — один из способов
  сменить адрес без замены ресурса.


  Проверьте, что `tofu state list` содержит `module.station.docker_container.worker`, корневой выход `worker_id` равен `original-id`,
  а ID работающего контейнера из `docker inspect rail-worker --format ''{{.Id}}''` равен `original-id`. `tofu plan -input=false
  -detailed-exitcode -no-color` должен завершиться с кодом 0 (изменений нет). Проверка наблюдает результаты, но не доказывает
  использованный способ. Работайте только в офлайн-песочнице. Проверьте ID ресурса в `tofu show -json`: он тоже должен совпадать
  с `original-id`.'
stages.0.brief: 'Адрес состояния модуля и оба ID worker соответствуют заданию, план завершается с кодом 0. Проверьте ID ресурса
  в `tofu show -json`: он тоже должен совпадать с `original-id`.'
stages.0.objectives.0.text: 'Адрес состояния модуля и оба ID worker соответствуют заданию, план завершается с кодом 0. Проверьте
  ID ресурса в `tofu show -json`: он тоже должен совпадать с `original-id`.'
hints.0.text: Зафиксируйте ID живого контейнера до переноса адресов.
hints.1.text: Целевой адрес — module.station.docker_container.worker.
hints.2.text: Используйте moved в корне, инициализируйте модуль, примените перенос и подтвердите пустой plan с тем же ID.
debrief: Ресурс состояния модуля, корневой выход и работающий worker теперь совпадают с записанным ID, а итоговый план не
  содержит изменений.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать module.station.docker_container.worker.
diagnostics.condition_1: original-id должен быть непустым, а tofu output -raw worker_id должен совпадать с его содержимым.
diagnostics.condition_2: original-id должен быть непустым, а tofu show -json module.station.docker_container.worker ID должен
  совпадать с его содержимым.
diagnostics.condition_3: original-id должен быть непустым, а docker inspect rail-worker ID должен совпадать с его содержимым.
diagnostics.condition_4: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
