title: Refactorizar en módulo con bloques movidos
brief: |-
  Un consumidor necesita el contenedor existente mediante la interfaz de módulo solicitada.

  Trabaja en la workstation en `~/quest` con `main.tf`.

  **Requisitos:**
  - Estado de OpenTofu:
    - Direcciones requeridas: `module.station.docker_container.worker`.
  - Contenedor en el daemon privado de Docker:
    - Nombre: `rail-worker`.
  - Identidad del contenedor:
    - Recurso registrado: `module.station.docker_container.worker`.
    - El contenedor `rail-worker` existente, su recurso registrado y la salida raíz `worker_id` conservan el ID original del contenedor.
    - El ID del contenedor y el ID del recurso registrado coinciden con ese comprobante.
    - Salida raíz coincidente: `worker_id`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  La comprobación observa los resultados actuales; no demuestra qué método de refactorización se usó.
stages.0.brief: Expón la identidad de contenedor registrada mediante la interfaz de módulo requerida.
hints.0.text: Una refactorización debe conservar la identidad del contenedor existente.
hints.1.text: |-
  El destino es module.station.docker_container.worker.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf
  tofu state list
  docker inspect rail-worker
  ```
hints.2.text: |-
  Usa un bloque moved raíz, inicializa el módulo local y aplica el traslado. El proveedor hijo debe usar registry.terraform.io/kreuzwerker/docker versión 3.6.2 para coincidir con el espejo sin conexión.

  Verifica el resultado desde `~/quest` en la workstation:

  - `docker inspect rail-worker --format '{{.Id}}'; cat original-id` — El ID actual del contenedor coincide con el comprobante suministrado.
  - `tofu show -no-color; tofu output -raw worker_id` — Muestra `module.station.docker_container.worker`; su ID y `worker_id` coinciden con `original-id`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura pendientes.
debrief: El recurso de estado del módulo, la salida raíz y el worker activo coinciden ahora con el ID
  registrado, y el plan final no tiene cambios.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener module.station.docker_container.worker.
diagnostics.condition_1: original-id no debe estar vacío y tofu output -raw worker_id debe ser igual a
  su contenido.
diagnostics.condition_2: original-id no debe estar vacío y tofu show -json module.station.docker_container.worker
  ID debe ser igual a su contenido.
diagnostics.condition_3: original-id no debe estar vacío y docker inspect rail-worker ID debe ser igual
  a su contenido.
diagnostics.condition_4: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: El estado de OpenTofu incluye `module.station.docker_container.worker`.
stages.0.objectives.1.text: El contenedor `rail-worker` existente, su recurso registrado y la salida raíz
  `worker_id` conservan el ID original del contenedor.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
