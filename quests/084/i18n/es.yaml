title: Refactorización de módulos conservando identidades
brief: |-
  La topología del servicio funciona, pero aún no está disponible mediante los límites de módulos y las claves estables de ruta solicitados.

  Trabaja en la workstation en `~/quest` con `main.tf` y `module-contract.json`; construye allí los módulos locales necesarios.

  **Requisitos:**
  - El estado de OpenTofu contiene exactamente los seis objetos gestionados en las direcciones del contrato suministrado, incluida `module.station.docker_container.worker`. No quedan entradas gestionadas ajenas; se permiten consultas de datos de solo lectura.
  - En el daemon Docker privado del entorno, el contenedor original `rail-worker`, su recurso de estado y la salida raíz `worker_id` conservan el ID original del contenedor. Los demás contenedores originales y la red compartida conservan sus identidades; los volúmenes existentes conservan su identidad de creación.
  - Cada contenedor de ruta en ejecución conserva su propio volumen de datos, la red compartida y los bytes originales de su registro. La salida raíz `routes` asigna a cada clave el ID original de su contenedor según el contrato.
  - En la workstation, `~/quest/migration-plan.json` contiene exactamente esas seis entradas gestionadas con acción `no-op` e IDs originales antes y después. No se permiten entradas gestionadas ajenas; se permiten consultas de datos de solo lectura.
  - El plan detallado final de infraestructura termina con código `0` sin cambios pendientes.

  Las comprobaciones observan estado actual, IDs reales, metadatos de creación, datos y planes guardados/nuevos; no prueban el historial de comandos, el método de refactorización ni la disponibilidad continua.
stages.0.brief: Expón la topología existente mediante los módulos solicitados conservando cada objeto y sus datos.
hints.0.text: Una dirección es una asociación de gestión; una clave estable representa el papel de un objeto. Reasignar
  posiciones no debe intercambiar identidades ni perder datos conservados.
hints.1.text: |-
  Compara los papeles solicitados con el estado actual y los objetos reales antes de elegir una transición. Un nombre de recurso o un plan vacío no demuestran por sí solos que se conservaron el objeto correcto y sus datos.

  ```sh
  cat main.tf module-contract.json
  tofu state list
  tofu show -no-color
  docker ps --no-trunc
  docker volume inspect rail-north-data rail-south-data
  ```
hints.2.text: |-
  Inspecciona juntos el plan guardado, las direcciones del estado y los objetos reales. Cada entrada gestionada debe permanecer sin cambios, los IDs publicados deben corresponder a sus papeles originales y los contenedores de ruta deben seguir sirviendo sus registros conservados.

  ```sh
  tofu show -json migration.plan > migration-plan.json
  jq -r '.resource_changes[] | select(.mode=="managed") | [.address, (.change.actions | join(","))] | @tsv' migration-plan.json
  tofu state list
  tofu output -raw worker_id
  tofu output -json routes
  docker inspect rail-worker --format '{{.Id}}'
  for route in north south; do docker exec "rail-$route" wget -qO- http://127.0.0.1:8080/ledger; done
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Las asociaciones de módulos con claves estables, el plan guardado, las identidades reales y los registros
  originales coinciden; el plan nuevo no tiene cambios pendientes.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener module.station.docker_container.worker.
diagnostics.condition_1: original-id no debe estar vacío y tofu output -raw worker_id debe ser igual a su contenido.
diagnostics.condition_2: original-id no debe estar vacío y tofu show -json module.station.docker_container.worker
  ID debe ser igual a su contenido.
diagnostics.condition_3: original-id no debe estar vacío y docker inspect rail-worker ID debe ser igual a su contenido.
diagnostics.condition_4: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: OpenTofu registra todos los objetos originales en las direcciones de módulos solicitadas;
  el plan guardado no cambia los objetos gestionados.
stages.0.objectives.1.text: El `rail-worker` original, su recurso de estado y la salida `worker_id` conservan su
  ID; los contenedores de ruta, la red, los volúmenes, los registros y la salida `routes` conservan su correspondencia
  original.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
diagnostics.migration_bindings: Las asociaciones de módulos y el plan guardado deben conservar los seis objetos
  gestionados originales sin reemplazarlos.
diagnostics.migration_identity: La topología real, los volúmenes originales, los bytes de los registros y los IDs
  publicados deben conservar su correspondencia original.
diagnostics.probe_0_0: Los datos actuales no permitieron verificar las asociaciones de módulos y el plan guardado.
diagnostics.probe_0_1: Los datos actuales no permitieron verificar las identidades reales conservadas, los datos
  y las salidas.
