title: Refactorizar en módulo con bloques movidos
brief: 'Trabaja en `~/quest`. Lee `main.tf` y `original-id`: un contenedor `rail-worker` en ejecución figura como recurso
  raíz. Refactoriza su configuración a `modules/station`, declarando en el módulo hijo la fuente de proveedor Docker sin conexión
  de la raíz `registry.terraform.io/kreuzwerker/docker` y la versión `3.6.2`. La guía enlazada explica los bloques `moved`,
  una forma de cambiar la dirección sin reemplazar el recurso.


  Comprueba que `tofu state list` contiene `module.station.docker_container.worker`, que la salida raíz `worker_id` coincide
  con `original-id` y que el ID activo de `docker inspect rail-worker --format ''{{.Id}}''` coincide con `original-id`. `tofu
  plan -input=false -detailed-exitcode -no-color` debe terminar con código 0 (sin cambios). La comprobación observa esos resultados;
  no demuestra el método utilizado. Trabaja solo en la bahía sin conexión. Examina el ID del recurso en `tofu show -json`:
  también debe coincidir con `original-id`.'
stages.0.brief: 'La dirección de estado del módulo y ambos ID del worker coinciden con el enunciado, y el plan termina con
  código 0. Examina el ID del recurso en `tofu show -json`: también debe coincidir con `original-id`.'
stages.0.objectives.0.text: 'La dirección de estado del módulo y ambos ID del worker coinciden con el enunciado, y el plan
  termina con código 0. Examina el ID del recurso en `tofu show -json`: también debe coincidir con `original-id`.'
hints.0.text: Registre el contenedor activo ID antes de mover direcciones.
hints.1.text: El destino es module.station.docker_container.worker.
hints.2.text: Utilice un bloque raíz moved, inicialice el módulo local, aplique el movimiento y demuestre que el plan final
  está vacío con el mismo ID.
debrief: El recurso de estado del módulo, la salida raíz y el worker activo coinciden ahora con el ID registrado, y el plan
  final no tiene cambios.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener module.station.docker_container.worker.
diagnostics.condition_1: original-id no debe estar vacío y tofu output -raw worker_id debe ser igual a su contenido.
diagnostics.condition_2: original-id no debe estar vacío y tofu show -json module.station.docker_container.worker ID debe
  ser igual a su contenido.
diagnostics.condition_3: original-id no debe estar vacío y docker inspect rail-worker ID debe ser igual a su contenido.
diagnostics.condition_4: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
