title: Refactorizar en módulo con bloques movidos
brief: 'Te uniste a las operaciones de SignalRail. Mueva un worker activo a un módulo con un plan final
  vacío. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el módulo posee el worker original; El plan final está vacío.'
stages.0.brief: 'Refactorice el Docker worker en vivo en module.station usando moved. Conserva el contenedor
  exacto ID y deja un plan vacío.


  Criterios de éxito: el módulo posee el worker original; final plan está vacío.'
stages.0.objectives.0.text: El módulo posee el worker original; final plan está vacío.
hints.0.text: Registre el contenedor activo ID antes de mover direcciones.
hints.1.text: El destino es module.station.docker_container.worker.
hints.2.text: Utilice un bloque raíz moved, inicialice el módulo local, aplique el movimiento y demuestre
  que el plan final está vacío con el mismo ID.
debrief: El worker moved en vivo en un módulo secundario. Utilizó un bloque moved, conservó el contenedor
  Docker exacto ID y demostró que el plan final estaba vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
