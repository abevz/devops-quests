title: Refactoring in Modul mit verschobenen Blöcken
brief: 'Arbeite in `~/quest`. Lies `main.tf` und `original-id`: Ein laufender Container `rail-worker` ist als Root-Ressource
  im Zustand. Strukturiere seine Konfiguration nach `modules/station` um; das Kindmodul deklariert die Offline-Docker-Providerquelle
  des Roots `registry.terraform.io/kreuzwerker/docker` und Version `3.6.2`. Die verlinkte Anleitung erklärt `moved`-Blöcke
  als eine Möglichkeit, die Adresse ohne Ersatz der Ressource zu ändern.


  Prüfe, dass `tofu state list` `module.station.docker_container.worker` enthält, die Root-Ausgabe `worker_id` mit `original-id`
  übereinstimmt und die laufende ID aus `docker inspect rail-worker --format ''{{.Id}}''` `original-id` entspricht. `tofu
  plan -input=false -detailed-exitcode -no-color` muss mit Code 0 enden (keine Änderungen). Die Prüfung beobachtet diese Ergebnisse,
  beweist aber nicht die verwendete Methode. Arbeite nur in der Offline-Umgebung. Prüfe die Ressourcen-ID in `tofu show -json`:
  Auch sie muss `original-id` entsprechen.'
stages.0.brief: 'Die Modul-Zustandsadresse und beide Worker-IDs stimmen mit der Aufgabe überein, und der Plan endet mit Code
  0. Prüfe die Ressourcen-ID in `tofu show -json`: Auch sie muss `original-id` entsprechen.'
stages.0.objectives.0.text: 'Die Modul-Zustandsadresse und beide Worker-IDs stimmen mit der Aufgabe überein, und der Plan
  endet mit Code 0. Prüfe die Ressourcen-ID in `tofu show -json`: Auch sie muss `original-id` entsprechen.'
hints.0.text: Zeichnen Sie den Live-Container ID auf, bevor Sie Adressen verschieben.
hints.1.text: Das Ziel ist module.station.docker_container.worker.
hints.2.text: Verwenden Sie einen Root-Block moved, initialisieren Sie das lokale Modul, wenden Sie die Verschiebung an und
  beweisen Sie, dass der endgültige plan mit demselben ID leer ist.
debrief: Die Zustandsressource des Moduls, die Root-Ausgabe und der laufende Worker entsprechen nun der gespeicherten ID;
  der abschließende Plan enthält keine Änderungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss module.station.docker_container.worker enthalten.
diagnostics.condition_1: original-id darf nicht leer sein und tofu output -raw worker_id muss dem Inhalt entsprechen.
diagnostics.condition_2: original-id darf nicht leer sein und tofu show -json module.station.docker_container.worker ID muss
  dem Inhalt entsprechen.
diagnostics.condition_3: original-id darf nicht leer sein und docker inspect rail-worker ID muss dem Inhalt entsprechen.
diagnostics.condition_4: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
