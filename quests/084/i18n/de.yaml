title: Refactoring in Modul mit verschobenen Blöcken
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Verschieben Sie einen aktiven worker in ein Modul
  mit einem leeren letzten plan. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich
  auf.


  Eingaben in `~/quest`: `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Das Modul besitzt das Original worker; final plan ist leer.'
stages.0.brief: 'Refaktorieren Sie die Live-Datei Docker worker mithilfe von moved in module.station.
  Behalten Sie den genauen Behälter ID und lassen Sie einen leeren plan.


  Erfolgskriterium: Das Modul besitzt das Original worker; final plan ist leer.'
stages.0.objectives.0.text: Das Modul besitzt das Original worker; final plan ist leer.
hints.0.text: Zeichnen Sie den Live-Container ID auf, bevor Sie Adressen verschieben.
hints.1.text: Das Ziel ist module.station.docker_container.worker.
hints.2.text: Verwenden Sie einen Root-Block moved, initialisieren Sie das lokale Modul, wenden Sie die
  Verschiebung an und beweisen Sie, dass der endgültige plan mit demselben ID leer ist.
debrief: Der Live-worker moved in ein untergeordnetes Modul. Sie haben einen moved-Block verwendet, den
  genauen Docker-Container ID beibehalten und bewiesen, dass der endgültige plan leer war.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
