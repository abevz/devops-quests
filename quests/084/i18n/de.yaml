title: Modulrefaktorierung mit erhaltenen Identitäten
brief: |-
  Die laufende Diensttopologie funktioniert, ist aber noch nicht über die geforderten Modulgrenzen und stabilen Routenschlüssel verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `main.tf` und `module-contract.json`; erstelle dort die benötigten lokalen Module.

  **Anforderungen:**
  - Der OpenTofu-State enthält genau die sechs verwalteten Objekte an den Adressen des gelieferten Vertrags, einschließlich `module.station.docker_container.worker`. Keine fremden verwalteten Einträge bleiben; lesende Datenquellen sind erlaubt.
  - Im privaten Docker-Daemon der Bay behalten der ursprüngliche Container `rail-worker`, seine State-Ressource und die Root-Ausgabe `worker_id` die ursprüngliche Container-ID. Alle anderen ursprünglichen Container und das gemeinsame Netzwerk behalten ihre Identitäten; bestehende Datenvolumes behalten ihre Erstellungsidentität.
  - Jeder laufende Routencontainer behält sein eigenes Datenvolume, gemeinsames Netzwerk und ursprüngliche Ledger-Bytes. Die Root-Ausgabe `routes` ordnet jedem Routenschlüssel seine ursprüngliche Container-ID gemäß Vertrag zu.
  - Auf der Workstation enthält `~/quest/migration-plan.json` genau diese sechs verwalteten Einträge mit Aktion `no-op` und ursprünglichen IDs davor und danach. Fremde verwaltete Einträge sind unzulässig; lesende Datenquellen sind erlaubt.
  - Der abschließende detaillierte Infrastrukturplan endet mit Code `0` ohne ausstehende Änderungen.

  Die Prüfungen beobachten aktuellen State, Live-IDs, Erstellungsmetadaten, Daten und gespeicherte/neue Pläne; sie beweisen weder Befehlsverlauf, verwendete Refaktorierungsmethode noch durchgehende Verfügbarkeit.
stages.0.brief: Stelle die bestehende Topologie über die geforderten Module bereit und erhalte jedes Objekt samt
  Daten.
hints.0.text: Eine Adresse ist eine Verwaltungsbindung, ein stabiler Schlüssel bezeichnet eine Objektrolle. Das
  Neuzuordnen von Positionen darf Identitäten nicht vertauschen oder erhaltene Daten verlieren.
hints.1.text: |-
  Vergleiche geforderte Rollen mit aktuellem State und Live-Objekten, bevor du einen Übergang wählst. Ein Ressourcenname oder leerer Plan allein belegt nicht den Erhalt des richtigen Objekts und seiner Daten.

  ```sh
  cat main.tf module-contract.json
  tofu state list
  tofu show -no-color
  docker ps --no-trunc
  docker volume inspect rail-north-data rail-south-data
  ```
hints.2.text: |-
  Prüfe gespeicherten Plan, State-Adressen und tatsächliche Objekte gemeinsam. Jeder verwaltete Planeintrag muss unverändert sein, veröffentlichte IDs müssen den ursprünglichen Rollen entsprechen und laufende Routencontainer weiterhin ihre erhaltenen Ledger ausliefern.

  ```sh
  tofu show -json migration.plan > migration-plan.json
  jq -r '.resource_changes[] | select(.mode=="managed") | [.address, (.change.actions | join(","))] | @tsv' migration-plan.json
  tofu state list
  tofu output -raw worker_id
  tofu output -json routes
  docker inspect rail-worker --format '{{.Id}}'
  for route in north south; do docker exec "rail-$route" wget -qO- http://127.0.0.1:8080/ledger; done
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Die Modulbindungen mit stabilen Schlüsseln, der gespeicherte Plan, Live-Identitäten und ursprüngliche Ledger-Daten
  stimmen überein; der neue Plan enthält keine ausstehenden Änderungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
stages.0.objectives.0.text: OpenTofu erfasst alle ursprünglichen Objekte an den geforderten Moduladressen; der gespeicherte
  Plan ändert keine verwalteten Objekte.
stages.0.objectives.1.text: Der ursprüngliche `rail-worker`, seine State-Ressource und die Ausgabe `worker_id` behalten
  ihre ID; Routencontainer, Netzwerk, Volumes, Ledger-Daten und Ausgabe `routes` behalten ihre ursprüngliche Zuordnung.
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
diagnostics.condition_0: Der Container wird möglicherweise weiterhin an seiner Root-Adresse geführt, weil Modulkonfiguration allein den Zustand nicht migriert, oder die Zustandsliste scheitert; erhalten Sie seine Identität an der geforderten station Moduladresse. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-station-address)
diagnostics.migration_bindings: Der Zustand enthält möglicherweise alte oder zusätzliche Managed-Adressen, oder migration-plan.json zeigt Ersatz, falsche ursprüngliche IDs oder fehlende Objekte. Erforderlich sind genau sechs Adressen/Typen und sechs no-op-Änderungen mit ursprünglichen IDs davor und danach; lesende Data-Einträge sind erlaubt. Eingabe-, Parse- und Befehlsfehler ergeben denselben Marker. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-six-bindings-and-saved-plan)
diagnostics.probe_0_0: Die Bindungsbeobachtung endet möglicherweise beim Laden von helpers vor einem benannten Ergebnis; prüfen Sie dq_check. Fehlender station Zustand ergibt bereits condition_0, gewöhnliche Plan- oder Bindungsfehler migration_bindings. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-bindings-startup)
diagnostics.condition_1: Der Root-Output fehlt möglicherweise, ist veraltet oder nach dem Refactoring vom Modul getrennt, oder original-id ist unlesbar; verbinden Sie worker_id mit der erhaltenen Container-ID des Moduls. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-root-output)
diagnostics.condition_2: Die station Zustandsbindung fehlt möglicherweise oder verweist nach Anwendung der neuen Konfiguration auf einen Ersatzcontainer; migrieren Sie die ursprüngliche Bindung ohne ID-Ersatz und erhalten Sie original-id lesbar. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-state-container-id)
diagnostics.condition_3: Der ursprüngliche Container wurde möglicherweise trotz korrekt wirkendem Zustand gelöscht oder neu erstellt, oder Docker inspect scheitert; seine tatsächliche ID im privaten Daemon muss weiterhin original-id entsprechen. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-live-container-id)
diagnostics.migration_identity: Count-Indizes wurden möglicherweise falschen Routenschlüsseln zugeordnet oder Netzwerk, Container, Volume beziehungsweise Ledger ersetzt. Erhalten Sie alle sechs Zustands-IDs, ursprüngliche Live-IDs, Volume-Erstellungszeiten, eigenen Daten-Mount/Netzwerk jeder Route, Ledger-Bytes und die exakte routes Output-Zuordnung; API-, Parse- und Befehlsfehler teilen diesen Marker. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-route-correspondence)
diagnostics.probe_0_1: Die Identitätsbeobachtung endet möglicherweise beim Laden von Python helpers vor einem benannten Ergebnis; prüfen Sie dq_check. Frühe Output-/Zustands-/Live-Vergleiche behalten condition_1, condition_2 oder condition_3, gewöhnliche Topologie-/Ledger-Fehler migration_identity. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-identity-startup)
diagnostics.condition_4: Der gespeicherte Migrationsplan kann korrekt sein, während die aktuelle Konfiguration noch Änderungen vorschlägt oder die Planung scheitert; ein frischer detailed-exitcode Plan muss 0 liefern, 2 bedeutet Änderungen, 1 Fehler. [Ursache und Prüfung](guides#guide=terraform-7.4&section=module-migration-fresh-plan)
