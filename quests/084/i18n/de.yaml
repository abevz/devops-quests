title: Refactoring in Modul mit verschobenen Blöcken
brief: |-
  Ein Verbraucher benötigt den bestehenden Container über die angeforderte Modulschnittstelle.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`.

  **Anforderungen:**
  - OpenTofu-State:
    - Erforderliche Adressen: `module.station.docker_container.worker`.
  - Container im privaten Docker-Daemon:
    - Name: `rail-worker`.
  - Containeridentität:
    - Verwaltete Ressource: `module.station.docker_container.worker`.
    - Der vorhandene Container `rail-worker`, seine verwaltete Ressource und die Root-Ausgabe `worker_id` behalten die ursprüngliche Container-ID bei.
    - Die ID des Containers und die ID der verwalteten Ressource stimmen mit diesem Beleg überein.
    - Übereinstimmende Root-Ausgabe: `worker_id`.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie beweist nicht die verwendete Refactoring-Methode.
stages.0.brief: Stelle die aufgezeichnete Containeridentität über die erforderliche Modulschnittstelle
  bereit.
hints.0.text: Ein Refactoring soll die bestehende Containeridentität erhalten.
hints.1.text: |-
  Das Ziel ist module.station.docker_container.worker.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf
  tofu state list
  docker inspect rail-worker
  ```
hints.2.text: |-
  Verwende einen moved-Block im Root, initialisiere das lokale Modul und wende die Verschiebung an. Der Provider des Kindmoduls muss registry.terraform.io/kreuzwerker/docker Version 3.6.2 passend zum Offline-Mirror verwenden.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `docker inspect rail-worker --format '{{.Id}}'; cat original-id` — Die aktuelle Container-ID stimmt mit dem bereitgestellten Beleg überein.
  - `tofu show -no-color; tofu output -raw worker_id` — Zeigt `module.station.docker_container.worker`; seine ID und `worker_id` stimmen mit `original-id` überein.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.
debrief: Die Zustandsressource des Moduls, die Root-Ausgabe und der laufende Worker entsprechen nun der
  gespeicherten ID; der abschließende Plan enthält keine Änderungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss module.station.docker_container.worker enthalten.
diagnostics.condition_1: original-id darf nicht leer sein und tofu output -raw worker_id muss dem Inhalt
  entsprechen.
diagnostics.condition_2: original-id darf nicht leer sein und tofu show -json module.station.docker_container.worker
  ID muss dem Inhalt entsprechen.
diagnostics.condition_3: original-id darf nicht leer sein und docker inspect rail-worker ID muss dem Inhalt
  entsprechen.
diagnostics.condition_4: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
stages.0.objectives.0.text: Der OpenTofu-State enthält `module.station.docker_container.worker`.
stages.0.objectives.1.text: Der vorhandene Container `rail-worker`, seine verwaltete Ressource und die
  Root-Ausgabe `worker_id` behalten die ursprüngliche Container-ID bei.
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
