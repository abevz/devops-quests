title: Refaktoryzuj do modułu z przeniesionymi blokami
brief: 'Pracuj w `~/quest`. Przeczytaj `main.tf` i `original-id`: działający kontener `rail-worker` jest zapisany jako zasób główny. Przenieś konfigurację do `modules/station`; moduł podrzędny ma deklarować źródło dostawcy Docker offline z konfiguracji głównej `registry.terraform.io/kreuzwerker/docker` i wersję `3.6.2`. Połączony przewodnik wyjaśnia bloki `moved`, jeden ze sposobów zmiany adresu bez zastąpienia zasobu.


  Sprawdź, czy `tofu state list` zawiera `module.station.docker_container.worker`, główne wyjście `worker_id` jest równe `original-id`, a aktywny ID z `docker inspect rail-worker --format ''{{.Id}}''` jest równy `original-id`. `tofu plan -input=false -detailed-exitcode -no-color` musi zwrócić kod 0 (brak zmian). Kontrola obserwuje wyniki, ale nie dowodzi użytej metody. Pracuj tylko w zatoce offline. Sprawdź ID zasobu w `tofu show -json`: również musi odpowiadać `original-id`.'
stages.0.brief: 'Adres stanu modułu i oba ID worker odpowiadają opisowi, a plan zwraca kod 0. Sprawdź ID zasobu w `tofu show -json`: również musi odpowiadać `original-id`.'
stages.0.objectives.0.text: 'Adres stanu modułu i oba ID worker odpowiadają opisowi, a plan zwraca kod 0. Sprawdź ID zasobu w `tofu show -json`: również musi odpowiadać `original-id`.'
hints.0.text: Nagraj aktywny kontener ID przed przeniesieniem adresów.
hints.1.text: Miejscem docelowym jest module.station.docker_container.worker.
hints.2.text: Użyj głównego bloku moved, zainicjuj moduł lokalny, zastosuj ruch i udowodnij, że końcowy
  plan jest pusty z tym samym ID.
debrief: Zasób stanu modułu, główne wyjście i aktywny worker odpowiadają teraz zapisanemu ID, a końcowy plan nie zawiera zmian.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
