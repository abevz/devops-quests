title: Refaktoryzuj do modułu z przeniesionymi blokami
brief: |-
  Odbiorca potrzebuje istniejącego kontenera przez wymagany interfejs modułu.

  Pracuj na workstation w `~/quest` z plikami `main.tf`.

  **Wymagania:**
  - Stan OpenTofu:
    - Wymagane adresy: `module.station.docker_container.worker`.
  - Kontener w prywatnym daemonie Docker:
    - Nazwa: `rail-worker`.
  - Tożsamość kontenera:
    - Śledzony zasób: `module.station.docker_container.worker`.
    - Istniejący kontener `rail-worker`, jego zarządzany zasób i wyjście główne `worker_id` zachowują pierwotny ID kontenera.
    - ID kontenera i ID śledzonego zasobu są zgodne z tym potwierdzeniem.
    - Zgodne wyjście główne: `worker_id`.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.

  Sprawdzenie obserwuje bieżące wyniki; nie dowodzi użytej metody refaktoryzacji.
stages.0.brief: Udostępnij zapisaną tożsamość kontenera przez wymagany interfejs modułu.
hints.0.text: Refaktoryzacja powinna zachować istniejącą tożsamość kontenera.
hints.1.text: |-
  Miejscem docelowym jest module.station.docker_container.worker.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  cat main.tf
  tofu state list
  docker inspect rail-worker
  ```
hints.2.text: |-
  Użyj głównego bloku moved, zainicjalizuj moduł lokalny i zastosuj przeniesienie. Dostawca potomny musi używać registry.terraform.io/kreuzwerker/docker w wersji 3.6.2 zgodnej z lustrem offline.

  Sprawdź wynik z `~/quest` na workstation:

  - `docker inspect rail-worker --format '{{.Id}}'; cat original-id` — Bieżący ID kontenera jest zgodny z dostarczonym potwierdzeniem.
  - `tofu show -no-color; tofu output -raw worker_id` — Pokazuje `module.station.docker_container.worker`; jego ID i `worker_id` są zgodne z `original-id`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących zmian infrastruktury.
debrief: Zasób stanu modułu, główne wyjście i aktywny worker odpowiadają teraz zapisanemu ID, a końcowy
  plan nie zawiera zmian.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać module.station.docker_container.worker.
diagnostics.condition_1: original-id musi być niepuste, a tofu output -raw worker_id musi mu odpowiadać.
diagnostics.condition_2: original-id musi być niepuste, a tofu show -json module.station.docker_container.worker
  ID musi mu odpowiadać.
diagnostics.condition_3: original-id musi być niepuste, a docker inspect rail-worker ID musi mu odpowiadać.
diagnostics.condition_4: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
stages.0.objectives.0.text: Stan OpenTofu zawiera `module.station.docker_container.worker`.
stages.0.objectives.1.text: Istniejący kontener `rail-worker`, jego zarządzany zasób i wyjście główne
  `worker_id` zachowują pierwotny ID kontenera.
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
