title: Refaktoryzuj do modułu z przeniesionymi blokami
brief: 'Dołączyłeś do operacji SignalRail. Przenieś aktywny worker do modułu z pustym końcowym plan. Pracuj
  w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: moduł posiada oryginalny worker; końcowy plan jest pusty.'
stages.0.brief: 'Zrefaktoryzuj aktywne Docker worker do module.station, używając moved. Zachowaj dokładnie
  pojemnik ID i zostaw pusty plan.


  Kryteria sukcesu: moduł posiada oryginalny worker; końcowy plan jest pusty.'
stages.0.objectives.0.text: Moduł posiada oryginalny worker; końcowy plan jest pusty.
hints.0.text: Nagraj aktywny kontener ID przed przeniesieniem adresów.
hints.1.text: Miejscem docelowym jest module.station.docker_container.worker.
hints.2.text: Użyj głównego bloku moved, zainicjuj moduł lokalny, zastosuj ruch i udowodnij, że końcowy
  plan jest pusty z tym samym ID.
debrief: Aktywny worker moved w moduł potomny. Użyłeś bloku moved, zachowałeś dokładny kontener Docker
  ID i udowodniłeś, że ostateczny plan był pusty.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
