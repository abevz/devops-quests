title: Blue-green und Replikat canary
brief: |-
  Der Board-Endpunkt benötigt zwei aufeinanderfolgende Release-Zustände. Bedienen Sie zuerst nur green und danach einen bereiten Blue/Green-Pool im Verhältnis drei zu eins.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stufe 1:
    - In Stufe 1 bedient Service `board` nur das grüne Release und liefert `green-115` an Deployment `client` unter `http://board:8080`.

  - Stufe 2:
    - Deployments `blue` und `green` haben genau `3` beziehungsweise `1` Replikate, alle bereit.
    - In Stufe 2 bedient Service `board` nur den bereitgestellten blue/green-Release-Pool und hat `4` verschiedene bereite EndpointSlice-Ziele.
    - Von Deployment `client` antwortet jede blaue und grüne Pod-IP auf Port `8080` mit dem zugehörigen `blue-115` oder `green-115`, und Service `board:8080` liefert einen dieser Werte.

  Ein Replikatverhältnis `3:1` garantiert keine `25%` bei kleinen Stichproben oder sitzungsgebundenem Traffic; die Prüfungen ordnen Endpunktnamen nicht diesen Pods zu, messen keine Verteilung und beweisen keinen Änderungsverlauf.
debrief: Die Standardversionen Services und Deployments bieten eine einfache Release-Aufteilung ohne gewichtetes
  Routing auf Mesh-Ebene oder eine Null-Ausfallzeit-Garantie.
stages.0.brief: Nur das grüne Release darf board bedienen.
stages.1.brief: Beide Releases müssen im Drei-zu-eins-Pool verfügbar bleiben.
hints.0.text: Das Release muss vorbereitet werden, bevor es den Endpunkt bedienen kann. Untersuche jedes
  Release einzeln, bevor du die gemeinsame Route änderst.
hints.1.text: |-
  Vergleiche die Befehle und Antworten der laufenden Pods mit dem Service-Port. Vergleiche für den gemeinsamen Pool Deployment-Metadatenlabels, Pod-Vorlagenlabels, Service-Selector und EndpointSlices.

  Vergleiche in Phase 2 die Replikazahl jedes Deployments mit den bereiten Zielen des gemeinsamen Service. Prüfe, zu welchem Release jeder Pod hinter dem Service gehört.

  ```sh
  kubectl get deployment blue green --show-labels
  kubectl get deployment blue green -o yaml
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Stufe eins liefert `green-115`; Stufe zwei liefert `blue-115` oder `green-115`.

  - Jeder blaue Pod liefert `blue-115`, jeder grüne Pod `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```

  In Phase 2 müssen zudem drei `blue`-Repliken und eine `green`-Replik bereit sein. Prüfe in den EndpointSlices des Service vier verschiedene bereite Pod-Ziele, die diesen beiden Deployments gehören.

  ```sh
  kubectl get deployments blue green
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get pods,replicasets -o yaml
  ```
phrases.0: Ich habe den blue-green Service selector gewechselt.
phrases.1: Ich habe stable und candidate endpoints überprüft.
phrases.2: Ich habe aus einer kleinen Stichprobe keine genauen Traffic-Gewichte abgeleitet.
questions.0.points.0: Blue-green wechselt zwischen Komplettversionen.
questions.0.points.1: canary macht beide Versionen gleichzeitig verfügbar.
questions.0.prompt: Wie unterscheidet sich blue-green von einem Replika-Verhältnis canary?
questions.1.points.0: NEIN; Verbindung reuse, affinity und Probenahme beeinflussen Beobachtungen.
questions.1.points.1: Präzise Gewichte erfordern einen entsprechenden Verkehrsleiter.
questions.1.prompt: Belegt eine von vier Nachbildungen genau ein Viertel der Anfragen?
stages.0.objectives.0.text: In Stufe 1 bedient Service `board` nur das grüne Release und liefert `green-115`
  an Deployment `client` unter `http://board:8080`.
stages.1.objectives.0.text: Deployments `blue` und `green` haben genau `3` beziehungsweise `1` Replikate,
  alle bereit.
stages.1.objectives.1.text: In Stufe 2 bedient Service `board` nur den bereitgestellten blue/green-Release-Pool
  und hat `4` verschiedene bereite EndpointSlice-Ziele.
stages.1.objectives.2.text: Von Deployment `client` antwortet jede blaue und grüne Pod-IP auf Port `8080`
  mit dem zugehörigen `blue-115` oder `green-115`, und Service `board:8080` liefert einen dieser Werte.
diagnostics.selector: Der Service wählt möglicherweise noch blue oder übersieht einen aktuellen green-Pod. Prüfen Sie app=green, die Abdeckung der vorgesehenen Pods und den Ausschluss anderer Arbeitslasten. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-green-release-selector)
diagnostics.http: Ein korrekter Selektor kann ohne bereiten green-Endpoint bleiben oder den alten Release liefern. Fragen Sie board aus client ab und vergleichen Sie mit green-115. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-green-release-service-http)
diagnostics.blue_replicas: Blue hat möglicherweise noch die alte gewünschte Anzahl oder fehlt. Prüfen Sie, ob das Deployment blue drei Repliken im gemeinsamen Pool anfordert. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-canary-blue-desired-count)
diagnostics.blue_ready: Blue fordert möglicherweise drei Repliken an, während einige Pods nicht bereit sind. Prüfen Sie die aktuellen blue-Pods und warten Sie auf drei bereite Repliken. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-canary-blue-ready-count)
diagnostics.green_replicas: Green wurde möglicherweise auf die falsche Größe für den gemeinsamen Pool skaliert. Prüfen Sie die gewünschte Anzahl und belassen Sie eine Replik. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-canary-green-desired-count)
diagnostics.green_ready: Die green-Replik wartet möglicherweise oder verfehlt nach dem Übergang die Bereitschaftsprüfung. Prüfen Sie den green-Pod und warten Sie auf eine bereite Replik. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-canary-green-ready-count)
diagnostics.selector_canary: Der Service wählt möglicherweise noch eine Farbe oder fremde Arbeitslasten aus. Prüfen Sie release=board und Zusatzselektoren anhand der blue- und green-Pods des gemeinsamen Releases. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-shared-release-selector)
diagnostics.endpoints: Während des Rollouts können Endpoint-Ziele fehlen, veraltet oder nicht bereit sein. Prüfen Sie EndpointSlices und zählen Sie nach der Konvergenz vier unterschiedliche bereite Zielnamen. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-shared-ready-endpoint-names)
diagnostics.ips_blue: Die Abfrage der blue-Pods liefert möglicherweise keine Adresse, solange Planung oder Netzwerk noch nicht fertig sind. Prüfen Sie zugewiesene IPs für app=blue. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-blue-pod-addresses)
diagnostics.ips_green: Die Abfrage der green-Pods liefert möglicherweise keine Adresse, solange Planung oder Netzwerk noch nicht fertig sind. Prüfen Sie zugewiesene IPs für app=green. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-green-pod-addresses)
diagnostics.pod_blue: Ein einzelner blue-Pod liefert möglicherweise anderen Inhalt oder antwortet direkt nicht. Fragen Sie die betroffene IP aus client ab und vergleichen Sie mit blue-115. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-blue-direct-response)
diagnostics.pod_green: Ein einzelner green-Pod liefert möglicherweise anderen Inhalt oder antwortet direkt nicht. Fragen Sie die betroffene IP aus client ab und vergleichen Sie mit green-115. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-green-direct-response)
diagnostics.canary_http: Der gemeinsame Service hat möglicherweise keinen erreichbaren Endpoint oder liefert Daten einer anderen Arbeitslast. Eine Anfrage aus client soll blue-115 oder green-115 ergeben. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-shared-canary-service-response)
diagnostics.probe_budget: Langsame Kubernetes-Abfragen, Timeouts oder weitere Pod-Adressen können Adressen im vorgesehenen Prüffenster offen lassen. Prüfen Sie die gemeldeten Adressen einzeln und warten Sie auf die Konvergenz. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-bounded-pod-probes)
diagnostics.probe_0_0: Die green-Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Werkzeuge sowie Zugriff auf Service und green-Pods. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-green-selector-observer-input)
diagnostics.probe_1_1: Die gemeinsame Selektor- und Endpoint-Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Werkzeuge oder Daten fehlen. Prüfen Sie den Zugriff auf Service board und EndpointSlices. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-shared-selector-observer-input)
diagnostics.probe_1_2: Die direkte und gemeinsame Service-Prüfung kann vor der Adressmeldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Python und die aktuellen Arbeitslasten blue, green und client. [Ursache und Prüfung](guides#guide=release-overlays&section=q115-shared-http-observer-input)
