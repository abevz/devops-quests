title: Blue-green und Replikat canary
brief: 'Schalten Sie den board Service von der fehlerfreien blue-Version auf die fehlerfreie green-Version
  durch seinen selector um. Die zweite Stufe erweitert den selector für einen canary: Führen Sie drei
  blue/stable-Replikate und ein green/candidate aus, wobei beide Release-Inhalte erhalten bleiben. Validieren
  Sie die Live-Bereitschaft endpoints und jede Version. Ein Replikatverhältnis von 3:1 deutet auf einen
  Traffic-Anteil hin; es garantiert nicht genau 25 % für eine kleine Stichprobe oder sitzungsaffinen Datenverkehr.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `blue.json`, `green.json`, `service.json`,
  `client.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der board Service wählt green aus und bedient green-115.'
debrief: Die Standardversionen Services und Deployments bieten eine einfache Release-Aufteilung ohne gewichtetes
  Routing auf Mesh-Ebene oder eine Null-Ausfallzeit-Garantie.
stages.0.brief: 'Erfolgskriterien: Der board Service wählt green aus und bedient green-115.'
stages.0.objectives.0.text: Der board Service wählt green aus und bedient green-115.
stages.1.brief: 'Erfolgskriterien: Vier fertige Endpunkte enthalten drei stable und einen candidate, die
  jeweils den beabsichtigten Inhalt bereitstellen.'
stages.1.objectives.0.text: Vier fertige Endpunkte enthalten drei stable und einen candidate, die jeweils
  den beabsichtigten Inhalt bereitstellen.
hints.0.text: Blue-green ändert die vollständige Version, die der Service auswählt.
hints.1.text: Ein erweiterter selector benötigt eine gemeinsame Bezeichnung auf beiden Pod-Vorlagen.
hints.2.text: Skalieren Sie stable Deployment auf drei und candidate auf eins, dann ist inspect bereit
  für endpoints.
phrases.0: Ich habe den blue-green Service selector gewechselt.
phrases.1: Ich habe stable und candidate endpoints überprüft.
phrases.2: Ich habe aus einer kleinen Stichprobe keine genauen Traffic-Gewichte abgeleitet.
questions.0.points.0: Blue-green wechselt zwischen Komplettversionen.
questions.0.points.1: canary macht beide Versionen gleichzeitig verfügbar.
questions.0.prompt: Wie unterscheidet sich blue-green von einem Replika-Verhältnis canary?
questions.1.points.0: NEIN; Verbindung reuse, affinity und Probenahme beeinflussen Beobachtungen.
questions.1.points.1: Präzise Gewichte erfordern einen entsprechenden Verkehrsleiter.
