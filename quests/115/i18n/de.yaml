title: Blue-green und Replikat canary
brief: 'Schalten Sie den board Service von der fehlerfreien blue-Version auf die fehlerfreie green-Version durch seinen selector
  um. Die zweite Stufe erweitert den selector für einen canary: Führen Sie drei blue/stable-Replikate und ein green/candidate
  aus, wobei beide Release-Inhalte erhalten bleiben. Validieren Sie die Live-Bereitschaft endpoints und jede Version. Ein
  Replikatverhältnis von 3:1 deutet auf einen Traffic-Anteil hin; es garantiert nicht genau 25 % für eine kleine Stichprobe
  oder sitzungsaffinen Datenverkehr.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `blue.json`, `green.json`, `service.json`, `client.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  In Phase eins muss der Selektor des Service `board` genau `app: green` und seine Antwort `green-115` sein. In Phase zwei
  ergänzt die Umgebung ein gemeinsames Label und einen Selektor; behalte genau Selektor `release: board`, betreibe drei blaue
  und ein grünes Replikat, alle vier bereit, und prüfe vier eindeutige bereite EndpointSlice-Zielnamen. Jede zurückgegebene
  IP eines blauen oder grünen Pods muss jeweils `blue-115` oder `green-115` liefern, und jede Version muss mindestens eine
  IP haben. Eine Service-Anfrage muss einen der Werte liefern. Die Prüfung ordnet die Endpoint-Namen nicht diesen Pods zu
  und misst keine Verkehrsverteilung; sie beweist keine Änderungshistorie.'
debrief: Die Standardversionen Services und Deployments bieten eine einfache Release-Aufteilung ohne gewichtetes Routing auf
  Mesh-Ebene oder eine Null-Ausfallzeit-Garantie.
