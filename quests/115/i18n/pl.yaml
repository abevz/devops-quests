title: Blue-green i replika canary
brief: 'Zmień board Service ze sprawnej wersji blue na zdrową green za pomocą selector. Drugi etap poszerza selector o canary:,
  uruchamiając trzy repliki blue/stable i jedną green/candidate, zachowując zawartość obu wersji. Sprawdź, czy endpoints i
  każda wersja są gotowe do działania. Współczynnik replikacji 3:1 sugeruje udział w ruchu; nie gwarantuje dokładnie 25% dla
  małej próbki lub ruchu powiązanego z sesją.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `blue.json`, `green.json`, `service.json`, `client.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  W pierwszym etapie selektor Service `board` musi być dokładnie `app: green`, a odpowiedź `green-115`. W drugim etapie zatoka
  dodaje wspólną etykietę i selektor; zachowaj dokładnie selektor `release: board`, uruchom trzy repliki blue i jedną green,
  wszystkie cztery gotowe, oraz sprawdź cztery unikalne nazwy gotowych celów EndpointSlice. Każdy zwrócony IP Poda blue lub
  green musi odpowiedzieć odpowiednio `blue-115` lub `green-115`, a każda wersja musi mieć co najmniej jeden IP. Jedno żądanie
  Service musi zwrócić jedną z tych wartości. Kontrola nie porównuje nazw endpointów z tymi Podami ani nie mierzy rozkładu
  ruchu; nie dowodzi historii zmian.'
debrief: Standardowe Services i Deployments zapewniają prosty podział wersji, bez routingu ważonego na poziomie siatki lub
  gwarancji zerowych przestojów.
stages.0.brief: Service board wybiera dokładnie green i zwraca green-115.
stages.0.objectives.0.text: Service board wybiera dokładnie green i zwraca green-115.
stages.1.brief: Liczby replik, selektor, cztery nazwy gotowych endpointów, odpowiedzi Podów i jedna odpowiedź Service odpowiadają
  opisowi.
stages.1.objectives.0.text: Liczby replik, selektor, cztery nazwy gotowych endpointów, odpowiedzi Podów i jedna odpowiedź
  Service odpowiadają opisowi.
hints.0.text: Zmiany Blue-green, które kończą wydanie wybrane przez Service.
hints.1.text: Rozszerzony selector wymaga wspólnej etykiety na obu szablonach Pod.
hints.2.text: Skaluj stable Deployment do trzech i candidate do jednego, a następnie sprawdź gotowy endpoints.
phrases.0: Przełączyłem selektor blue-green Service.
phrases.1: Zweryfikowałem punkty końcowe stabilne i candidate.
phrases.2: Nie wywnioskowałem dokładnych wag ruchu na podstawie małej próbki.
questions.0.points.0: Blue-green przełącza pomiędzy kompletnymi wersjami.
questions.0.points.1: Kanarek eksponuje obie wersje jednocześnie.
questions.0.prompt: Czym blue-green różni się od wdrożenia canary dzielącego ruch według proporcji liczby replik?
questions.1.points.0: NIE; połączenie reuse, affinity i próbkowanie wpływają na obserwacje.
questions.1.points.1: Precyzyjne wagi wymagają odpowiedniego kontrolera ruchu.
questions.1.prompt: Czy jedna z czterech replik potwierdza dokładnie jedną czwartą żądań?
