title: Blue-green i replika canary
brief: 'Zmień board Service ze sprawnej wersji blue na zdrową green za pomocą selector. Drugi etap poszerza
  selector o canary:, uruchamiając trzy repliki blue/stable i jedną green/candidate, zachowując zawartość
  obu wersji. Sprawdź, czy endpoints i każda wersja są gotowe do działania. Współczynnik replikacji 3:1
  sugeruje udział w ruchu; nie gwarantuje dokładnie 25% dla małej próbki lub ruchu powiązanego z sesją.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `blue.json`, `green.json`,
  `service.json`, `client.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: board Service wybiera green i obsługuje green-115.'
debrief: Standardowe Services i Deployments zapewniają prosty podział wersji, bez routingu ważonego na
  poziomie siatki lub gwarancji zerowych przestojów.
stages.0.brief: 'Kryteria sukcesu: board Service wybiera green i obsługuje green-115.'
