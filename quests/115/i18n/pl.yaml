title: Blue-green i replika canary
brief: |-
  Endpoint board wymaga dwóch kolejnych stanów wydania. Najpierw obsługuj tylko green, potem gotową pulę blue/green w stosunku trzy do jednego.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etap 1:
    - W etapie 1 Service `board` obsługuje tylko wydanie green i zwraca `green-115` do Deployment `client` pod `http://board:8080`.

  - Etap 2:
    - Deploymenty `blue` i `green` mają odpowiednio dokładnie `3` i `1` replikę, wszystkie gotowe.
    - W etapie 2 Service `board` obsługuje tylko dostarczoną pulę wydań blue i green oraz ma `4` różne gotowe cele EndpointSlice.
    - Z Deployment `client` każdy IP niebieskiego i zielonego Poda odpowiada na porcie `8080` odpowiednim `blue-115` lub `green-115`, a Service `board:8080` zwraca jedną z tych wartości.

  Stosunek replik `3:1` nie gwarantuje `25%` ruchu w małej próbie lub z przywiązaniem sesji; kontrole nie wiążą nazw endpointów z tymi Podami, nie mierzą rozkładu ani nie dowodzą historii zmian.
debrief: Standardowe Services i Deployments zapewniają prosty podział wersji, bez routingu ważonego na
  poziomie siatki lub gwarancji zerowych przestojów.
stages.0.brief: Tylko wydanie green ma obsługiwać board.
stages.1.brief: Oba wydania muszą pozostać dostępne w puli trzy do jednego.
hints.0.text: Zmiany Blue-green, które kończą wydanie wybrane przez Service.
hints.1.text: |-
  Rozszerzony selector wymaga wspólnej etykiety na obu szablonach Pod.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get deployment blue green -o yaml
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Skaluj stable Deployment do trzech i candidate do jednego, a następnie sprawdź gotowy endpoints.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Pierwszy etap zwraca `green-115`; drugi zwraca `blue-115` lub `green-115`.

  - Każdy niebieski Pod zwraca `blue-115`, a każdy zielony `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```
phrases.0: Przełączyłem selektor blue-green Service.
phrases.1: Zweryfikowałem punkty końcowe stabilne i candidate.
phrases.2: Nie wywnioskowałem dokładnych wag ruchu na podstawie małej próbki.
questions.0.points.0: Blue-green przełącza pomiędzy kompletnymi wersjami.
questions.0.points.1: Kanarek eksponuje obie wersje jednocześnie.
questions.0.prompt: Czym blue-green różni się od wdrożenia canary dzielącego ruch według proporcji liczby
  replik?
questions.1.points.0: NIE; połączenie reuse, affinity i próbkowanie wpływają na obserwacje.
questions.1.points.1: Precyzyjne wagi wymagają odpowiedniego kontrolera ruchu.
questions.1.prompt: Czy jedna z czterech replik potwierdza dokładnie jedną czwartą żądań?
