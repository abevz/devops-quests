title: Blue-green i replika canary
brief: |-
  Endpoint board wymaga dwóch kolejnych stanów wydania. Najpierw obsługuj tylko green, potem gotową pulę blue/green w stosunku trzy do jednego.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etap 1:
    - W etapie 1 Service `board` obsługuje tylko wydanie green i zwraca `green-115` do Deployment `client` pod `http://board:8080`.

  - Etap 2:
    - Deploymenty `blue` i `green` mają odpowiednio dokładnie `3` i `1` replikę, wszystkie gotowe.
    - W etapie 2 Service `board` obsługuje tylko dostarczoną pulę wydań blue i green oraz ma `4` różne gotowe cele EndpointSlice.
    - Z Deployment `client` każdy IP niebieskiego i zielonego Poda odpowiada na porcie `8080` odpowiednim `blue-115` lub `green-115`, a Service `board:8080` zwraca jedną z tych wartości.

  Stosunek replik `3:1` nie gwarantuje `25%` ruchu w małej próbie lub z przywiązaniem sesji; kontrole nie wiążą nazw endpointów z tymi Podami, nie mierzą rozkładu ani nie dowodzą historii zmian.
debrief: Standardowe Services i Deployments zapewniają prosty podział wersji, bez routingu ważonego na
  poziomie siatki lub gwarancji zerowych przestojów.
stages.0.brief: Tylko wydanie green ma obsługiwać board.
stages.1.brief: Oba wydania muszą pozostać dostępne w puli trzy do jednego.
hints.0.text: Wydanie wymaga przygotowania, zanim obsłuży endpoint. Zbadaj każde wydanie osobno przed
  zmianą wspólnej trasy.
hints.1.text: |-
  Porównaj polecenia i odpowiedzi działających Podów z portem Service. Dla wspólnej puli porównaj etykiety metadata Deployment, etykiety szablonów Podów, selektor Service i EndpointSlices.

  ```sh
  kubectl get deployment blue green --show-labels
  kubectl get deployment blue green -o yaml
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Przeskaluj stabilny Deployment do trzech replik, a kandydujący do jednej, a następnie sprawdź gotowe endpointy.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Pierwszy etap zwraca `green-115`; drugi zwraca `blue-115` lub `green-115`.

  - Każdy niebieski Pod zwraca `blue-115`, a każdy zielony `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```
phrases.0: Przełączyłem selektor blue-green Service.
phrases.1: Zweryfikowałem punkty końcowe stabilne i candidate.
phrases.2: Nie wywnioskowałem dokładnych wag ruchu na podstawie małej próbki.
questions.0.points.0: Blue-green przełącza pomiędzy kompletnymi wersjami.
questions.0.points.1: Kanarek eksponuje obie wersje jednocześnie.
questions.0.prompt: Czym blue-green różni się od wdrożenia canary dzielącego ruch według proporcji liczby
  replik?
questions.1.points.0: NIE; połączenie reuse, affinity i próbkowanie wpływają na obserwacje.
questions.1.points.1: Precyzyjne wagi wymagają odpowiedniego kontrolera ruchu.
questions.1.prompt: Czy jedna z czterech replik potwierdza dokładnie jedną czwartą żądań?
stages.0.objectives.0.text: W etapie 1 Service `board` obsługuje tylko wydanie green i zwraca `green-115`
  do Deployment `client` pod `http://board:8080`.
stages.1.objectives.0.text: Deploymenty `blue` i `green` mają odpowiednio dokładnie `3` i `1` replikę,
  wszystkie gotowe.
stages.1.objectives.1.text: W etapie 2 Service `board` obsługuje tylko dostarczoną pulę wydań blue i green
  oraz ma `4` różne gotowe cele EndpointSlice.
stages.1.objectives.2.text: Z Deployment `client` każdy IP niebieskiego i zielonego Poda odpowiada na
  porcie `8080` odpowiednim `blue-115` lub `green-115`, a Service `board:8080` zwraca jedną z tych wartości.
diagnostics.selector: Service może nadal wybierać blue albo pomijać aktualny pod green. Sprawdź app=green, objęcie właściwych podów i wykluczenie innych obciążeń. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-green-release-selector)
diagnostics.http: Poprawny selektor może nie mieć gotowego endpointu green lub zwracać starsze wydanie. Odpytaj board z client i porównaj z green-115. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-green-release-service-http)
diagnostics.blue_replicas: Blue może mieć starą żądaną liczbę lub nie istnieć. Sprawdź, czy Deployment blue żąda trzech replik we wspólnej puli. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-canary-blue-desired-count)
diagnostics.blue_ready: Blue może żądać trzech replik, choć część podów nie jest gotowa. Sprawdź aktualne pody blue i poczekaj na trzy gotowe repliki. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-canary-blue-ready-count)
diagnostics.green_replicas: Green mógł mieć niewłaściwy rozmiar we wspólnej puli. Sprawdź liczbę żądaną i zachowaj jedną replikę. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-canary-green-desired-count)
diagnostics.green_ready: Replika green może czekać lub nie przechodzić gotowości po przejściu. Sprawdź pod green i poczekaj na jedną gotową replikę. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-canary-green-ready-count)
diagnostics.selector_canary: Service może nadal wybierać jeden kolor lub obce obciążenie. Sprawdź release=board i dodatkowe selektory względem podów blue i green we wspólnym wydaniu. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-shared-release-selector)
diagnostics.endpoints: Podczas wdrożenia może brakować celów endpointów albo mogą być stare lub niegotowe. Sprawdź EndpointSlice i po zbieżności policz cztery różne nazwy gotowych celów. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-shared-ready-endpoint-names)
diagnostics.ips_blue: Odczyt podów blue może nie zwrócić adresu, gdy rozmieszczenie lub sieć nie są gotowe. Sprawdź przydzielone IP podów app=blue. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-blue-pod-addresses)
diagnostics.ips_green: Odczyt podów green może nie zwrócić adresu, gdy rozmieszczenie lub sieć nie są gotowe. Sprawdź przydzielone IP podów app=green. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-green-pod-addresses)
diagnostics.pod_blue: Pojedynczy pod blue może zwracać złą treść lub nie odpowiadać bezpośrednio. Odpytaj wskazane IP z client i porównaj z blue-115. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-blue-direct-response)
diagnostics.pod_green: Pojedynczy pod green może zwracać złą treść lub nie odpowiadać bezpośrednio. Odpytaj wskazane IP z client i porównaj z green-115. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-green-direct-response)
diagnostics.canary_http: Wspólny Service może nie mieć osiągalnego endpointu lub zwracać obcą treść. Żądanie z client powinno dać blue-115 lub green-115. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-shared-canary-service-response)
diagnostics.probe_budget: Powolne odczyty Kubernetes, timeouty lub dodatkowe IP podów mogą zostawić część adresów poza oknem kontroli. Sprawdź wyświetlone adresy osobno i poczekaj na zbieżność wdrożenia. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-bounded-pod-probes)
diagnostics.probe_0_0: Kontrola green może zatrzymać się przed wskazaniem warunku przez błąd procesu lub wejść. Sprawdź narzędzia i dostęp do Service oraz podów green. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-green-selector-observer-input)
diagnostics.probe_1_1: Kontrola wspólnego selektora i endpointów może zatrzymać się przed wskazaniem warunku przy braku narzędzi lub danych. Sprawdź dostęp do Service board i EndpointSlice. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-shared-selector-observer-input)
diagnostics.probe_1_2: Kontrola bezpośrednia i wspólnego Service może zatrzymać się przed wskazaniem adresu przez błąd procesu lub danych. Sprawdź Python i aktualne obciążenia blue, green oraz client. [Przyczyna i kontrola](guides#guide=release-overlays&section=q115-shared-http-observer-input)
