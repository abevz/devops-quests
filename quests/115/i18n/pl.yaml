hints.0.text: Zmiany Blue-green, które kończą wydanie wybrane przez Service.
hints.1.text: Rozszerzony selector wymaga wspólnej etykiety na obu szablonach Pod.
hints.2.text: Skaluj stable Deployment do trzech i candidate do jednego, a następnie sprawdź gotowy endpoints.
phrases.0: Przełączyłem selektor blue-green Service.
phrases.1: Zweryfikowałem punkty końcowe stabilne i candidate.
phrases.2: Nie wywnioskowałem dokładnych wag ruchu na podstawie małej próbki.
questions.0.points.0: Blue-green przełącza pomiędzy kompletnymi wersjami.
questions.0.points.1: Kanarek eksponuje obie wersje jednocześnie.
questions.0.prompt: Czym blue-green różni się od wdrożenia canary dzielącego ruch według proporcji liczby
  replik?
questions.1.points.0: NIE; połączenie reuse, affinity i próbkowanie wpływają na obserwacje.
questions.1.points.1: Precyzyjne wagi wymagają odpowiedniego kontrolera ruchu.
questions.1.prompt: Czy jedna z czterech replik potwierdza dokładnie jedną czwartą żądań?
