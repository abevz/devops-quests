title: Blue-green and replica canary
brief: 'Switch the board Service from the healthy blue release to healthy green by its selector. The second
  stage widens the selector for a canary: run three blue/stable replicas and one green/candidate, preserving
  both release contents. Validate live ready endpoints and each version. A 3:1 replica ratio suggests
  a traffic share; it does not guarantee exactly 25% for a small sample or session-affine traffic.


  Quest files in `~/quest` (some appear in later stages): `blue.json`, `green.json`, `service.json`, `client.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The board Service selects green and serves green-115.'
debrief: Standard Services and Deployments provide a simple release split, without mesh-level weighted
  routing or a zero-downtime guarantee.
