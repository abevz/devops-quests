title: Blue-green and replica canary
brief: 'Switch the board Service from the healthy blue release to healthy green by its selector. The second stage widens the
  selector for a canary: run three blue/stable replicas and one green/candidate, preserving both release contents. Validate
  live ready endpoints and each version. A 3:1 replica ratio suggests a traffic share; it does not guarantee exactly 25% for
  a small sample or session-affine traffic.


  Quest files in `~/quest` (some appear in later stages): `blue.json`, `green.json`, `service.json`, `client.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  In stage one the `board` Service selector must be exactly `app: green`, and its response `green-115`. In stage two the bay
  adds a shared label and selector; retain exactly selector `release: board`, run three blue and one green replicas with all
  four ready, and check four unique ready EndpointSlice target names. Each returned blue or green Pod IP must respond with
  its corresponding `blue-115` or `green-115`, and each version must have at least one IP. One Service request must return
  either value. The check does not match the endpoint names to those Pods or measure traffic distribution; it cannot prove
  the edit history.'
debrief: Standard Services and Deployments provide a simple release split, without mesh-level weighted routing or a zero-downtime
  guarantee.
stages.0.brief: The board Service selects green exactly and returns green-115.
stages.0.objectives.0.text: The board Service selects green exactly and returns green-115.
stages.1.brief: The replica counts, selector, four ready endpoint names, per-Pod responses and one Service response match
  the brief.
stages.1.objectives.0.text: The replica counts, selector, four ready endpoint names, per-Pod responses and one Service response
  match the brief.
hints.0.text: Blue-green changes which complete release the Service selects.
hints.1.text: A widened selector needs a common label on both Pod templates.
hints.2.text: Scale the stable Deployment to three and candidate to one, then inspect ready endpoints.
phrases.0: I switched the blue-green Service selector.
phrases.1: I verified stable and candidate endpoints.
phrases.2: I did not infer exact traffic weights from a small sample.
questions.0.points.0: Blue-green switches between complete releases.
questions.0.points.1: The canary exposes both versions concurrently.
questions.0.prompt: How is blue-green different from a replica-ratio canary?
questions.1.points.0: No; connection reuse, affinity and sampling affect observations.
questions.1.points.1: Precise weights require an appropriate traffic controller.
questions.1.prompt: Does one of four replicas prove exactly one quarter of requests?
