diagnostics.http: board:8080 must equal green-115.
diagnostics.blue_replicas: deployment/blue replicas must equal 3.
diagnostics.blue_ready: deployment/blue readyReplicas must equal 3.
diagnostics.green_replicas: deployment/green replicas must equal 1.
diagnostics.green_ready: deployment/green readyReplicas must equal 1.
diagnostics.selector_canary: 'service/board selector must equal {release: board}.'
diagnostics.endpoints: There must be four unique ready EndpointSlice target names.
diagnostics.ips_blue: blue Pod IP must be present.
diagnostics.ips_green: green Pod IP must be present.
diagnostics.pod_blue: Every returned blue Pod IP must return blue-115.
diagnostics.pod_green: Every returned green Pod IP must return green-115.
diagnostics.canary_http: board:8080 must return blue-115 or green-115.
