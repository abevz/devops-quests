title: Blue-green and replica canary
brief: |-
  The board endpoint needs two successive release states. First serve green only, then provide a ready three-to-one blue/green pool.

  Work on the workstation in `~/quest` with the supplied files:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stage 1:
    - In stage 1, Service `board` serves only the green release and returns `green-115` to Deployment `client` at `http://board:8080`.

  - Stage 2:
    - Deployments `blue` and `green` have exactly `3` and `1` replicas respectively, all ready.
    - In stage 2, Service `board` serves only the supplied blue and green release pool and has `4` distinct ready EndpointSlice targets.
    - From Deployment `client`, every blue and green Pod IP responds on port `8080` with its corresponding `blue-115` or `green-115`, and Service `board:8080` returns either value.

  A `3:1` replica ratio does not guarantee `25%` of small-sample or session-affine traffic; checks neither match endpoint names to those Pods nor measure distribution or prove edit history.
debrief: Standard Services and Deployments provide a simple release split, without mesh-level weighted
  routing or a zero-downtime guarantee.
stages.0.brief: Only the green release must serve board.
stages.1.brief: Both releases must remain available in the three-to-one pool.
hints.0.text: The release needs preparation before it can serve the endpoint. Inspect each release independently
  before changing the shared route.
hints.1.text: |-
  Compare the live Pod commands and responses with the Service port. For the shared pool, compare Deployment metadata labels, Pod template labels, the Service selector and EndpointSlices.

  In stage 2, compare the Deployment replica counts with the ready targets of the shared Service. Check which release owns each Pod behind the Service.

  ```sh
  kubectl get deployment blue green --show-labels
  kubectl get deployment blue green -o yaml
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Verify the result from `~/quest` on the workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Stage one returns `green-115`; stage two returns `blue-115` or `green-115`.

  - Each blue Pod returns `blue-115` and each green Pod returns `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```

  Stage 2 also requires three ready `blue` replicas and one ready `green` replica. In the Service’s EndpointSlices, verify four distinct ready Pod targets belonging to those two Deployments.

  ```sh
  kubectl get deployments blue green
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get pods,replicasets -o yaml
  ```
phrases.0: I switched the blue-green Service selector.
phrases.1: I verified stable and candidate endpoints.
phrases.2: I did not infer exact traffic weights from a small sample.
questions.0.points.0: Blue-green switches between complete releases.
questions.0.points.1: The canary exposes both versions concurrently.
questions.0.prompt: How is blue-green different from a replica-ratio canary?
questions.1.points.0: No; connection reuse, affinity and sampling affect observations.
questions.1.points.1: Precise weights require an appropriate traffic controller.
questions.1.prompt: Does one of four replicas prove exactly one quarter of requests?
stages.0.objectives.0.text: In stage 1, Service `board` serves only the green release and returns `green-115`
  to Deployment `client` at `http://board:8080`.
stages.1.objectives.0.text: Deployments `blue` and `green` have exactly `3` and `1` replicas respectively,
  all ready.
stages.1.objectives.1.text: In stage 2, Service `board` serves only the supplied blue and green release
  pool and has `4` distinct ready EndpointSlice targets.
stages.1.objectives.2.text: From Deployment `client`, every blue and green Pod IP responds on port `8080`
  with its corresponding `blue-115` or `green-115`, and Service `board:8080` returns either value.
diagnostics.selector: The Service may still select blue or miss a current green Pod. Check that the selector includes app=green, covers the intended current Pods and excludes other workloads. [Cause and check](guides#guide=release-overlays&section=q115-green-release-selector)
diagnostics.http: A correct selector may still have no ready green endpoint or serve the old release. Query board from client and compare with green-115. [Cause and check](guides#guide=release-overlays&section=q115-green-release-service-http)
diagnostics.blue_replicas: Blue may still have its previous desired count or be missing. Check that the live blue Deployment requests three replicas in the shared pool. [Cause and check](guides#guide=release-overlays&section=q115-canary-blue-desired-count)
diagnostics.blue_ready: Blue may request three replicas while one or more Pods are still unready. Inspect the current blue Pods and wait for three ready replicas. [Cause and check](guides#guide=release-overlays&section=q115-canary-blue-ready-count)
diagnostics.green_replicas: Green may have scaled to the wrong size for the shared pool. Inspect its desired count and keep it at one replica. [Cause and check](guides#guide=release-overlays&section=q115-canary-green-desired-count)
diagnostics.green_ready: The green replica may be pending or fail readiness after the transition. Inspect the green Pod and wait for one ready replica. [Cause and check](guides#guide=release-overlays&section=q115-canary-green-ready-count)
diagnostics.selector_canary: The Service may still select one color or may include an unrelated workload. Check release=board and any extra selectors against both blue and green Pods in the shared release. [Cause and check](guides#guide=release-overlays&section=q115-shared-release-selector)
diagnostics.endpoints: The Service may expose missing, stale or unready endpoint targets during rollout. Inspect EndpointSlices and count four distinct ready target names after convergence. [Cause and check](guides#guide=release-overlays&section=q115-shared-ready-endpoint-names)
diagnostics.ips_blue: The blue Pod lookup may return no usable address while scheduling or networking is incomplete. Check that the app=blue Pods have assigned IPs. [Cause and check](guides#guide=release-overlays&section=q115-blue-pod-addresses)
diagnostics.ips_green: The green Pod lookup may return no usable address while scheduling or networking is incomplete. Check that the app=green Pods have assigned IPs. [Cause and check](guides#guide=release-overlays&section=q115-green-pod-addresses)
diagnostics.pod_blue: An individual blue Pod may serve the wrong content or fail a direct request. Query the affected Pod IP from client and compare with blue-115. [Cause and check](guides#guide=release-overlays&section=q115-blue-direct-response)
diagnostics.pod_green: An individual green Pod may serve the wrong content or fail a direct request. Query the affected Pod IP from client and compare with green-115. [Cause and check](guides#guide=release-overlays&section=q115-green-direct-response)
diagnostics.canary_http: The shared Service may have no reachable endpoint or return a body from another workload. A live request from client should return blue-115 or green-115. [Cause and check](guides#guide=release-overlays&section=q115-shared-canary-service-response)
diagnostics.probe_budget: Slow Kubernetes lookups, request timeouts or extra Pod addresses may leave some addresses untested in the reserved probe window. Inspect the listed pending addresses individually and let the rollout converge. [Cause and check](guides#guide=release-overlays&section=q115-bounded-pod-probes)
diagnostics.probe_0_0: The green-only observer may fail before detecting a condition when its local process or inputs cannot start. Check the tools and access to the Service and green Pods. [Cause and check](guides#guide=release-overlays&section=q115-green-selector-observer-input)
diagnostics.probe_1_1: The shared selector and endpoint observer may fail before naming a condition if tooling or live inputs are unavailable. Check access to the board Service and EndpointSlices. [Cause and check](guides#guide=release-overlays&section=q115-shared-selector-observer-input)
diagnostics.probe_1_2: The direct Pod and shared Service observer may stop before naming a failed address when the workstation process or input fails. Verify Python and the current blue, green and client workloads. [Cause and check](guides#guide=release-overlays&section=q115-shared-http-observer-input)
