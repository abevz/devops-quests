title: Blue-green and replica canary
brief: |-
  The board endpoint needs two successive release states. First serve green only, then provide a ready three-to-one blue/green pool.

  Work on the workstation in `~/quest` with the supplied files:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stage 1:
    - In stage 1, Service `board` serves only the green release and returns `green-115` to Deployment `client` at `http://board:8080`.

  - Stage 2:
    - Deployments `blue` and `green` have exactly `3` and `1` replicas respectively, all ready.
    - In stage 2, Service `board` serves only the supplied blue and green release pool and has `4` distinct ready EndpointSlice targets.
    - From Deployment `client`, every blue and green Pod IP responds on port `8080` with its corresponding `blue-115` or `green-115`, and Service `board:8080` returns either value.

  A `3:1` replica ratio does not guarantee `25%` of small-sample or session-affine traffic; checks neither match endpoint names to those Pods nor measure distribution or prove edit history.
debrief: Standard Services and Deployments provide a simple release split, without mesh-level weighted
  routing or a zero-downtime guarantee.
stages.0.brief: Only the green release must serve board.
stages.1.brief: Both releases must remain available in the three-to-one pool.
hints.0.text: Blue-green changes which complete release the Service selects.
hints.1.text: |-
  A widened selector needs a common label on both Pod templates.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get deployment blue green -o yaml
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Scale the stable Deployment to three and candidate to one, then inspect ready endpoints.

  Verify the result from `~/quest` on the workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Stage one returns `green-115`; stage two returns `blue-115` or `green-115`.

  - Each blue Pod returns `blue-115` and each green Pod returns `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```
phrases.0: I switched the blue-green Service selector.
phrases.1: I verified stable and candidate endpoints.
phrases.2: I did not infer exact traffic weights from a small sample.
questions.0.points.0: Blue-green switches between complete releases.
questions.0.points.1: The canary exposes both versions concurrently.
questions.0.prompt: How is blue-green different from a replica-ratio canary?
questions.1.points.0: No; connection reuse, affinity and sampling affect observations.
questions.1.points.1: Precise weights require an appropriate traffic controller.
questions.1.prompt: Does one of four replicas prove exactly one quarter of requests?
