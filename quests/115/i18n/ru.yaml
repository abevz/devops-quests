title: Blue-green и canary по репликам
brief: |-
  Конечная точка board должна пройти два последовательных состояния релиза. Сначала обслуживайте только green, затем обеспечьте готовый пул blue/green в отношении три к одному.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Этап 1:
    - На этапе 1 Service `board` обслуживает только релиз green и возвращает `green-115` в Deployment `client` по `http://board:8080`.

  - Этап 2:
    - Deployment `blue` и `green` имеют соответственно ровно `3` и `1` реплики, все готовы.
    - На этапе 2 Service `board` обслуживает только предоставленный пул релизов blue и green и имеет `4` различных готовых цели EndpointSlice.
    - Из Deployment `client` IP каждого синего и зелёного Pod отвечает на порту `8080` соответствующим `blue-115` или `green-115`, а Service `board:8080` возвращает одно из этих значений.

  Отношение реплик `3:1` не гарантирует `25%` трафика в малой выборке или с привязкой сессий; проверки не сопоставляют имена конечных точек с этими Pod, не измеряют распределение и не доказывают историю правок.
debrief: Обычные Services и Deployments дают простое разделение версий, без весов маршрутизации service
  mesh и гарантии нулевого простоя.
stages.0.brief: Только релиз green должен обслуживать board.
stages.1.brief: Оба релиза должны оставаться доступными в пуле три к одному.
hints.0.text: Прежде чем релиз сможет обслуживать endpoint, его нужно подготовить. Изучите каждый релиз
  отдельно до изменения общего маршрута.
hints.1.text: |-
  Сравните команды и ответы работающих Pod с портом Service. Для общего пула сравните метки metadata Deployment, метки шаблонов Pod, selector Service и EndpointSlices.

  На втором этапе сравните число реплик каждого Deployment с готовыми целями общего Service. Проверьте, к какому релизу относится каждый Pod за Service.

  ```sh
  kubectl get deployment blue green --show-labels
  kubectl get deployment blue green -o yaml
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Проверьте результат из `~/quest` на workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — На первом этапе возвращается `green-115`; на втором — `blue-115` или `green-115`.

  - Каждый синий Pod возвращает `blue-115`, каждый зелёный — `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```

  На втором этапе также нужны три готовые реплики `blue` и одна готовая реплика `green`. В EndpointSlice этого Service проверьте четыре разные готовые цели Pod, принадлежащие этим двум Deployment.

  ```sh
  kubectl get deployments blue green
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get pods,replicasets -o yaml
  ```
phrases.0: Я переключил selector Service для blue-green.
phrases.1: Я проверил endpoints stable и candidate.
phrases.2: Я не выводил точные веса трафика из малой выборки.
questions.0.points.0: Blue-green переключает полные версии.
questions.0.points.1: Canary одновременно открывает обе версии.
questions.0.prompt: Чем blue-green отличается от canary по доле реплик?
questions.1.points.0: 'Нет: влияют reuse соединений, affinity и размер выборки.'
questions.1.points.1: Точным весам нужен подходящий контроллер трафика.
questions.1.prompt: Доказывает ли одна из четырёх реплик ровно четверть запросов?
stages.0.objectives.0.text: На этапе 1 Service `board` обслуживает только релиз green и возвращает `green-115`
  в Deployment `client` по `http://board:8080`.
stages.1.objectives.0.text: Deployment `blue` и `green` имеют соответственно ровно `3` и `1` реплики,
  все готовы.
stages.1.objectives.1.text: На этапе 2 Service `board` обслуживает только предоставленный пул релизов
  blue и green и имеет `4` различных готовых цели EndpointSlice.
stages.1.objectives.2.text: Из Deployment `client` IP каждого синего и зелёного Pod отвечает на порту
  `8080` соответствующим `blue-115` или `green-115`, а Service `board:8080` возвращает одно из этих значений.
diagnostics.selector: Service мог всё ещё выбирать blue или пропускать текущий Pod green. Проверьте app=green, покрытие нужных Pod и исключение других нагрузок. [Причина и проверка](guides#guide=release-overlays&section=q115-green-release-selector)
diagnostics.http: При правильном селекторе может не быть готового endpoint green или всё ещё отдаётся старая версия. Запросите board из client и сравните с green-115. [Причина и проверка](guides#guide=release-overlays&section=q115-green-release-service-http)
diagnostics.blue_replicas: У blue могло остаться прежнее число реплик, либо Deployment отсутствует. Проверьте, что blue запрашивает три реплики для общего пула. [Причина и проверка](guides#guide=release-overlays&section=q115-canary-blue-desired-count)
diagnostics.blue_ready: Blue мог запросить три реплики, пока часть Pod не готова. Проверьте текущие Pod blue и дождитесь трёх готовых реплик. [Причина и проверка](guides#guide=release-overlays&section=q115-canary-blue-ready-count)
diagnostics.green_replicas: Green мог масштабироваться до неверного размера для общего пула. Проверьте желаемое число и сохраните одну реплику. [Причина и проверка](guides#guide=release-overlays&section=q115-canary-green-desired-count)
diagnostics.green_ready: Реплика green могла ожидать размещения или не пройти readiness после перехода. Проверьте Pod green и дождитесь одной готовой реплики. [Причина и проверка](guides#guide=release-overlays&section=q115-canary-green-ready-count)
diagnostics.selector_canary: Service мог всё ещё выбирать один цвет или захватывать постороннюю нагрузку. Сверьте release=board и дополнительные селекторы с Pod blue и green общего релиза. [Причина и проверка](guides#guide=release-overlays&section=q115-shared-release-selector)
diagnostics.endpoints: Во время rollout у Service могут отсутствовать цели endpoints либо остаться старые или неготовые. Проверьте EndpointSlice и после стабилизации найдите четыре разных имени готовых целей. [Причина и проверка](guides#guide=release-overlays&section=q115-shared-ready-endpoint-names)
diagnostics.ips_blue: Запрос Pod blue может не вернуть адрес, пока не завершилось размещение или настройка сети. Проверьте назначенные IP у Pod app=blue. [Причина и проверка](guides#guide=release-overlays&section=q115-blue-pod-addresses)
diagnostics.ips_green: Запрос Pod green может не вернуть адрес, пока не завершилось размещение или настройка сети. Проверьте назначенные IP у Pod app=green. [Причина и проверка](guides#guide=release-overlays&section=q115-green-pod-addresses)
diagnostics.pod_blue: Отдельный Pod blue мог отдавать другое содержимое или не отвечать напрямую. Запросите его IP из client и сравните с blue-115. [Причина и проверка](guides#guide=release-overlays&section=q115-blue-direct-response)
diagnostics.pod_green: Отдельный Pod green мог отдавать другое содержимое или не отвечать напрямую. Запросите его IP из client и сравните с green-115. [Причина и проверка](guides#guide=release-overlays&section=q115-green-direct-response)
diagnostics.canary_http: У общего Service может не быть доступного endpoint или он ведёт к другой нагрузке. Запрос из client должен возвращать blue-115 или green-115. [Причина и проверка](guides#guide=release-overlays&section=q115-shared-canary-service-response)
diagnostics.probe_budget: Медленные запросы Kubernetes, тайм-ауты или лишние адреса Pod могли оставить часть IP вне отведённого времени. Проверьте перечисленные адреса отдельно и дождитесь стабилизации rollout. [Причина и проверка](guides#guide=release-overlays&section=q115-bounded-pod-probes)
diagnostics.probe_0_0: Проверка green может остановиться до указания условия при ошибке локального процесса или входов. Проверьте инструменты и доступ к Service и Pod green. [Причина и проверка](guides#guide=release-overlays&section=q115-green-selector-observer-input)
diagnostics.probe_1_1: Проверка общего селектора и endpoints может завершиться без конкретного условия, если недоступны инструменты или данные. Проверьте доступ к Service board и EndpointSlice. [Причина и проверка](guides#guide=release-overlays&section=q115-shared-selector-observer-input)
diagnostics.probe_1_2: Проверка прямых запросов и общего Service может завершиться до указания адреса при ошибке процесса или входов. Проверьте Python и текущие нагрузки blue, green и client. [Причина и проверка](guides#guide=release-overlays&section=q115-shared-http-observer-input)
