title: Blue-green и canary по репликам
brief: 'Переключите Service табло с исправного blue на исправный green через selector. Второй этап расширит selector для canary:
  запустите три blue/stable и одну green/candidate, сохраняя содержимое обеих версий. Проверьте готовые endpoints и каждую
  версию. Отношение реплик 3:1 задаёт предпосылку доли трафика, но не гарантирует ровно 25% на малой выборке или при привязке
  сессий.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `blue.json`, `green.json`, `service.json`, `client.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  На первом этапе селектор Service `board` должен быть ровно `app: green`, а ответ — `green-115`. На втором этапе песочница
  добавляет общую метку и селектор; сохраните ровно селектор `release: board`, запустите три реплики blue и одну green, все
  четыре готовы, и проверьте четыре уникальных имени готовых целей EndpointSlice. Каждый полученный IP Pod blue или green
  должен отвечать соответственно `blue-115` или `green-115`, и у каждой версии должен быть хотя бы один IP. Один запрос к
  Service должен вернуть одно из значений. Проверка не сопоставляет имена endpoint с этими Pod и не измеряет распределение
  трафика; она не доказывает историю изменений.'
debrief: Обычные Services и Deployments дают простое разделение версий, без весов маршрутизации service mesh и гарантии нулевого
  простоя.
