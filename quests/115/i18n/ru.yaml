diagnostics.http: board:8080 должен совпадать с green-115.
diagnostics.blue_replicas: deployment/blue replicas должен совпадать с 3.
diagnostics.blue_ready: deployment/blue readyReplicas должен совпадать с 3.
diagnostics.green_replicas: deployment/green replicas должен совпадать с 1.
diagnostics.green_ready: deployment/green readyReplicas должен совпадать с 1.
