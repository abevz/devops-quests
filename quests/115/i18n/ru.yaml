title: Blue-green и canary по репликам
brief: 'Переключите Service табло с исправного blue на исправный green через selector.
  Второй этап расширит selector для canary: запустите три blue/stable и одну green/candidate,
  сохраняя содержимое обеих версий. Проверьте готовые endpoints и каждую версию. Отношение
  реплик 3:1 задаёт предпосылку доли трафика, но не гарантирует ровно 25% на малой
  выборке или при привязке сессий.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `blue.json`, `green.json`,
  `service.json`, `client.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Service board выбирает green и отдаёт green-115.'
debrief: Обычные Services и Deployments дают простое разделение версий, без весов
  маршрутизации service mesh и гарантии нулевого простоя.
