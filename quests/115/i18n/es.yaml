title: Blue-green y réplica canary
brief: "El endpoint board necesita dos estados sucesivos de release. Primero sirva solo green y luego un conjunto\
  \ blue/green listo de tres a uno.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `blue.yaml`,\
  \ `green.yaml`, `service.yaml`, `client.yaml`.\n\n**Requirements:**\n\n- Etapa 1:\n  - El Service `board` selecciona\
  \ solo Pods con etiqueta `app=green` y devuelve `green-115` al Deployment `client` en `http://board:8080`.\n-\
  \ Etapa 2:\n  - Los Deployments `blue` y `green` tienen exactamente `3` y `1` réplicas respectivamente, todas\
  \ listas.\n  - El Service `board` selecciona solo Pods con etiqueta `release=board` y tiene `4` destinos EndpointSlice\
  \ distintos y listos.\n  - Desde el Deployment `client`, cada IP de Pod azul y verde responde en el puerto `8080`\
  \ con su `blue-115` o `green-115`, y el Service `board:8080` devuelve cualquiera de ellos.\n\n**Verify yourself\
  \ before Check & finish:** Ejecute estos comandos de observación desde `~/quest` en la estación de trabajo.\n\n\
  - La configuración, identidad y estado cumplen los requisitos.\n\n  ```sh\n  kubectl get deployment blue green\
  \ -o yaml\n  kubectl get service board -o yaml\n  kubectl get endpointslices -l kubernetes.io/service-name=board\
  \ -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — La primera etapa\
  \ devuelve `green-115`; la segunda devuelve `blue-115` o `green-115`.\n\n- Cada Pod azul devuelve `blue-115` y\
  \ cada Pod verde devuelve `green-115`.\n\n  ```sh\n  for version in blue green; do\n    for ip in $(kubectl get\
  \ pods -l \"app=$version\" -o jsonpath='{.items[*].status.podIP}'); do\n      kubectl exec deployment/client --\
  \ wget -qO- -T 3 \"http://$ip:8080\"\n    done\n  done\n  ```\n\nUna proporción `3:1` de réplicas no garantiza\
  \ `25%` del tráfico en muestras pequeñas o sesiones afines; las comprobaciones no vinculan nombres de endpoints\
  \ a esos Pods, no miden distribución ni prueban el historial."
debrief: Los estándares Services y Deployments proporcionan una división de liberación simple, sin enrutamiento
  ponderado a nivel de malla ni garantía de tiempo de inactividad cero.
stages.0.brief: Solo el release green debe servir board.
stages.1.brief: Ambos releases deben permanecer disponibles en el conjunto de tres a uno.
hints.0.text: Cambios Blue-green que completan la versión que selecciona el Service.
hints.1.text: Un selector ampliado necesita una etiqueta común en ambas plantillas Pod.
hints.2.text: Escale el stable Deployment a tres y el candidate a uno, luego inspect listo para endpoints.
phrases.0: Cambié el blue-green Service selector.
phrases.1: Verifiqué stable y candidate endpoints.
phrases.2: No deduje pesos de tráfico exactos a partir de una muestra pequeña.
questions.0.points.0: Blue-green cambia entre versiones completas.
questions.0.points.1: El canary expone ambas versiones simultáneamente.
questions.0.prompt: ¿En qué se diferencia blue-green de un canary con relación de réplica?
questions.1.points.0: No; La conexión reuse, affinity y el muestreo afectan las observaciones.
questions.1.points.1: Los pesos precisos requieren un controlador de tráfico adecuado.
questions.1.prompt: ¿Una de las cuatro réplicas prueba exactamente una cuarta parte de las solicitudes?
