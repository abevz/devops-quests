title: Blue-green y réplica canary
brief: |-
  El endpoint board necesita dos estados sucesivos de release. Primero sirva solo green y luego un conjunto blue/green listo de tres a uno.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etapa 1:
    - En la etapa 1, el Service `board` sirve solo la versión green y devuelve `green-115` al Deployment `client` en `http://board:8080`.

  - Etapa 2:
    - Los Deployments `blue` y `green` tienen exactamente `3` y `1` réplicas respectivamente, todas listas.
    - En la etapa 2, el Service `board` sirve solo el conjunto blue y green suministrado y tiene `4` destinos EndpointSlice listos distintos.
    - Desde el Deployment `client`, cada IP de Pod azul y verde responde en el puerto `8080` con su `blue-115` o `green-115`, y el Service `board:8080` devuelve cualquiera de ellos.

  Una proporción `3:1` de réplicas no garantiza `25%` del tráfico en muestras pequeñas o sesiones afines; las comprobaciones no vinculan nombres de endpoints a esos Pods, no miden distribución ni prueban el historial.
debrief: Los estándares Services y Deployments proporcionan una división de liberación simple, sin enrutamiento
  ponderado a nivel de malla ni garantía de tiempo de inactividad cero.
stages.0.brief: Solo el release green debe servir board.
stages.1.brief: Ambos releases deben permanecer disponibles en el conjunto de tres a uno.
hints.0.text: La versión necesita preparación antes de servir el endpoint. Inspecciona cada versión por
  separado antes de cambiar la ruta compartida.
hints.1.text: |-
  Compara los comandos y respuestas de los Pods activos con el puerto del Service. Para el grupo común, compara las etiquetas metadata del Deployment, las de la plantilla de Pod, el selector del Service y EndpointSlices.

  En la segunda etapa, compara las réplicas de cada Deployment con los destinos listos del Service compartido. Comprueba a qué versión pertenece cada Pod detrás del Service.

  ```sh
  kubectl get deployment blue green --show-labels
  kubectl get deployment blue green -o yaml
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — La primera etapa devuelve `green-115`; la segunda devuelve `blue-115` o `green-115`.

  - Cada Pod azul devuelve `blue-115` y cada Pod verde devuelve `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```

  La segunda etapa también requiere tres réplicas listas de `blue` y una de `green`. En los EndpointSlice del Service, comprueba cuatro Pods de destino distintos y listos que pertenezcan a esos dos Deployment.

  ```sh
  kubectl get deployments blue green
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get pods,replicasets -o yaml
  ```
phrases.0: Cambié el blue-green Service selector.
phrases.1: Verifiqué stable y candidate endpoints.
phrases.2: No deduje pesos de tráfico exactos a partir de una muestra pequeña.
questions.0.points.0: Blue-green cambia entre versiones completas.
questions.0.points.1: El canary expone ambas versiones simultáneamente.
questions.0.prompt: ¿En qué se diferencia blue-green de un canary con relación de réplica?
questions.1.points.0: No; La conexión reuse, affinity y el muestreo afectan las observaciones.
questions.1.points.1: Los pesos precisos requieren un controlador de tráfico adecuado.
questions.1.prompt: ¿Una de las cuatro réplicas prueba exactamente una cuarta parte de las solicitudes?
stages.0.objectives.0.text: En la etapa 1, el Service `board` sirve solo la versión green y devuelve `green-115`
  al Deployment `client` en `http://board:8080`.
stages.1.objectives.0.text: Los Deployments `blue` y `green` tienen exactamente `3` y `1` réplicas respectivamente,
  todas listas.
stages.1.objectives.1.text: En la etapa 2, el Service `board` sirve solo el conjunto blue y green suministrado
  y tiene `4` destinos EndpointSlice listos distintos.
stages.1.objectives.2.text: Desde el Deployment `client`, cada IP de Pod azul y verde responde en el puerto
  `8080` con su `blue-115` o `green-115`, y el Service `board:8080` devuelve cualquiera de ellos.
diagnostics.selector: El Service puede seguir seleccionando blue u omitir un Pod green actual. Revise app=green, la cobertura de los Pods previstos y la exclusión de otras cargas. [Causa y comprobación](guides#guide=release-overlays&section=q115-green-release-selector)
diagnostics.http: Un selector correcto puede carecer de endpoint green listo o servir la versión anterior. Consulte board desde client y compare con green-115. [Causa y comprobación](guides#guide=release-overlays&section=q115-green-release-service-http)
diagnostics.blue_replicas: Blue puede conservar la cantidad deseada anterior o faltar. Compruebe que el Deployment blue solicite tres réplicas en el grupo compartido. [Causa y comprobación](guides#guide=release-overlays&section=q115-canary-blue-desired-count)
diagnostics.blue_ready: Blue puede solicitar tres réplicas mientras hay Pods pendientes. Revise los Pods blue actuales y espere tres réplicas listas. [Causa y comprobación](guides#guide=release-overlays&section=q115-canary-blue-ready-count)
diagnostics.green_replicas: Green puede haberse escalado a un tamaño incorrecto para el grupo compartido. Revise la cantidad deseada y mantenga una réplica. [Causa y comprobación](guides#guide=release-overlays&section=q115-canary-green-desired-count)
diagnostics.green_ready: La réplica green puede estar pendiente o fallar disponibilidad tras el cambio. Revise el Pod green y espere una réplica lista. [Causa y comprobación](guides#guide=release-overlays&section=q115-canary-green-ready-count)
diagnostics.selector_canary: El Service puede seguir seleccionando un color o incluir una carga ajena. Compare release=board y los selectores extras con Pods blue y green del lanzamiento compartido. [Causa y comprobación](guides#guide=release-overlays&section=q115-shared-release-selector)
diagnostics.endpoints: Durante el despliegue pueden faltar destinos o quedar obsoletos o sin preparar. Revise EndpointSlice y cuente cuatro nombres distintos de destinos listos tras la convergencia. [Causa y comprobación](guides#guide=release-overlays&section=q115-shared-ready-endpoint-names)
diagnostics.ips_blue: La consulta de Pods blue puede no devolver dirección mientras ubicación o red no estén listas. Revise las IP asignadas a Pods app=blue. [Causa y comprobación](guides#guide=release-overlays&section=q115-blue-pod-addresses)
diagnostics.ips_green: La consulta de Pods green puede no devolver dirección mientras ubicación o red no estén listas. Revise las IP asignadas a Pods app=green. [Causa y comprobación](guides#guide=release-overlays&section=q115-green-pod-addresses)
diagnostics.pod_blue: Un Pod blue individual puede servir otro contenido o fallar en acceso directo. Consulte la IP afectada desde client y compare con blue-115. [Causa y comprobación](guides#guide=release-overlays&section=q115-blue-direct-response)
diagnostics.pod_green: Un Pod green individual puede servir otro contenido o fallar en acceso directo. Consulte la IP afectada desde client y compare con green-115. [Causa y comprobación](guides#guide=release-overlays&section=q115-green-direct-response)
diagnostics.canary_http: El Service compartido puede carecer de endpoint alcanzable o devolver el cuerpo de otra carga. Una petición desde client debe devolver blue-115 o green-115. [Causa y comprobación](guides#guide=release-overlays&section=q115-shared-canary-service-response)
diagnostics.probe_budget: Consultas lentas de Kubernetes, timeouts o IP de más pueden dejar direcciones sin probar en la ventana reservada. Revise las IP listadas por separado y espere la convergencia. [Causa y comprobación](guides#guide=release-overlays&section=q115-bounded-pod-probes)
diagnostics.probe_0_0: El observador de green puede detenerse antes de detectar una condición si falla el proceso o sus entradas. Revise herramientas y acceso al Service y Pods green. [Causa y comprobación](guides#guide=release-overlays&section=q115-green-selector-observer-input)
diagnostics.probe_1_1: El observador compartido puede detenerse antes de señalar una condición si no dispone de herramientas o datos. Revise el acceso al Service board y sus EndpointSlices. [Causa y comprobación](guides#guide=release-overlays&section=q115-shared-selector-observer-input)
diagnostics.probe_1_2: El observador directo y del Service puede detenerse antes de señalar una dirección si falla el proceso o su entrada. Revise Python y las cargas blue, green y client actuales. [Causa y comprobación](guides#guide=release-overlays&section=q115-shared-http-observer-input)
