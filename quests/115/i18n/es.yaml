title: Blue-green y réplica canary
brief: 'Cambie el board Service de la versión saludable blue a la versión saludable green por su selector.
  La segunda etapa amplía el selector para un canary: ejecute tres réplicas blue/stable y una green/candidate,
  conservando el contenido de ambas versiones. Valide el endpoints listo en vivo y cada versión. Una proporción
  de réplicas de 3:1 sugiere una participación en el tráfico; no garantiza exactamente el 25% para una
  muestra pequeña o tráfico afín a la sesión.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `blue.json`, `green.json`,
  `service.json`, `client.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El board Service selecciona green y sirve para green-115.'
debrief: Los estándares Services y Deployments proporcionan una división de liberación simple, sin enrutamiento
  ponderado a nivel de malla ni garantía de tiempo de inactividad cero.
stages.0.brief: 'Criterios de éxito: El board Service selecciona green y sirve green-115.'
stages.0.objectives.0.text: El board Service selecciona green y sirve a green-115.
stages.1.brief: 'Criterios de éxito: cuatro puntos finales listos contienen tres stable y un candidate,
  cada uno de los cuales ofrece su contenido previsto.'
stages.1.objectives.0.text: Cuatro puntos finales listos contienen tres stable y un candidate, cada uno
  de los cuales ofrece su contenido previsto.
hints.0.text: Cambios Blue-green que completan la versión que selecciona el Service.
hints.1.text: Un selector ampliado necesita una etiqueta común en ambas plantillas Pod.
hints.2.text: Escale el stable Deployment a tres y el candidate a uno, luego inspect listo para endpoints.
phrases.0: Cambié el blue-green Service selector.
phrases.1: Verifiqué stable y candidate endpoints.
phrases.2: No deduje pesos de tráfico exactos a partir de una muestra pequeña.
questions.0.points.0: Blue-green cambia entre versiones completas.
questions.0.points.1: El canary expone ambas versiones simultáneamente.
questions.0.prompt: ¿En qué se diferencia blue-green de un canary con relación de réplica?
questions.1.points.0: No; La conexión reuse, affinity y el muestreo afectan las observaciones.
questions.1.points.1: Los pesos precisos requieren un controlador de tráfico adecuado.
questions.1.prompt: ¿Una de las cuatro réplicas prueba exactamente una cuarta parte de las solicitudes?
