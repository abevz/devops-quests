title: Blue-green y réplica canary
brief: |-
  El endpoint board necesita dos estados sucesivos de release. Primero sirva solo green y luego un conjunto blue/green listo de tres a uno.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `blue.yaml`, `green.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etapa 1:
    - En la etapa 1, el Service `board` sirve solo la versión green y devuelve `green-115` al Deployment `client` en `http://board:8080`.

  - Etapa 2:
    - Los Deployments `blue` y `green` tienen exactamente `3` y `1` réplicas respectivamente, todas listas.
    - En la etapa 2, el Service `board` sirve solo el conjunto blue y green suministrado y tiene `4` destinos EndpointSlice listos distintos.
    - Desde el Deployment `client`, cada IP de Pod azul y verde responde en el puerto `8080` con su `blue-115` o `green-115`, y el Service `board:8080` devuelve cualquiera de ellos.

  Una proporción `3:1` de réplicas no garantiza `25%` del tráfico en muestras pequeñas o sesiones afines; las comprobaciones no vinculan nombres de endpoints a esos Pods, no miden distribución ni prueban el historial.
debrief: Los estándares Services y Deployments proporcionan una división de liberación simple, sin enrutamiento
  ponderado a nivel de malla ni garantía de tiempo de inactividad cero.
stages.0.brief: Solo el release green debe servir board.
stages.1.brief: Ambos releases deben permanecer disponibles en el conjunto de tres a uno.
hints.0.text: Cambios Blue-green que completan la versión que selecciona el Service.
hints.1.text: |-
  Un selector ampliado necesita una etiqueta común en ambas plantillas Pod.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get deployment blue green -o yaml
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Escale el stable Deployment a tres y el candidate a uno, luego inspect listo para endpoints.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — La primera etapa devuelve `green-115`; la segunda devuelve `blue-115` o `green-115`.

  - Cada Pod azul devuelve `blue-115` y cada Pod verde devuelve `green-115`.

    ```sh
    for version in blue green; do
      for ip in $(kubectl get pods -l "app=$version" -o jsonpath='{.items[*].status.podIP}'); do
        kubectl exec deployment/client -- wget -qO- -T 3 "http://$ip:8080"
      done
    done
    ```
phrases.0: Cambié el blue-green Service selector.
phrases.1: Verifiqué stable y candidate endpoints.
phrases.2: No deduje pesos de tráfico exactos a partir de una muestra pequeña.
questions.0.points.0: Blue-green cambia entre versiones completas.
questions.0.points.1: El canary expone ambas versiones simultáneamente.
questions.0.prompt: ¿En qué se diferencia blue-green de un canary con relación de réplica?
questions.1.points.0: No; La conexión reuse, affinity y el muestreo afectan las observaciones.
questions.1.points.1: Los pesos precisos requieren un controlador de tráfico adecuado.
questions.1.prompt: ¿Una de las cuatro réplicas prueba exactamente una cuarta parte de las solicitudes?
diagnostics.selector: El Service board debe seleccionar toda la carga suministrada green y ninguna otra.
diagnostics.http: board:8080 debe ser igual a green-115.
diagnostics.blue_replicas: deployment/blue replicas debe ser igual a 3.
diagnostics.blue_ready: deployment/blue readyReplicas debe ser igual a 3.
diagnostics.green_replicas: deployment/green replicas debe ser igual a 1.
diagnostics.green_ready: deployment/green readyReplicas debe ser igual a 1.
diagnostics.selector_canary: El Service board debe seleccionar toda la carga suministrada blue/green y ninguna otra.
diagnostics.endpoints: Debe haber cuatro nombres únicos de destinos listos en EndpointSlice.
diagnostics.ips_blue: blue Pod IP debe estar presente.
diagnostics.ips_green: green Pod IP debe estar presente.
diagnostics.pod_blue: Cada IP devuelta de Pod blue debe devolver blue-115.
diagnostics.pod_green: Cada IP devuelta de Pod green debe devolver green-115.
diagnostics.canary_http: board:8080 debe devolver blue-115 o green-115.
