id: 115
title: title
track: Kubernetes
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'kubectl get service board -o json | jq -e ''.spec.selector=={app:"green"}'' >/dev/null

      test "$(kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080)" = green-115'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: "kubectl get deployment blue green -o json | jq -e 'all(.items[]; (.metadata.name==\"blue\"\
      \ and .spec.replicas==3 and .status.readyReplicas==3) or (.metadata.name==\"green\" and .spec.replicas==1\
      \ and .status.readyReplicas==1))' >/dev/null\nkubectl get service board -o json | jq -e '.spec.selector=={release:\"\
      board\"}' >/dev/null\nkubectl get endpointslices -l kubernetes.io/service-name=board -o json | jq\
      \ -e '[.items[].endpoints[] | select(.conditions.ready==true) | .targetRef.name] | unique | length==4'\
      \ >/dev/null\nfor version in blue green; do\n for ip in $(kubectl get pods -l \"app=$version\" -o\
      \ jsonpath='{.items[*].status.podIP}'); do\n  test \"$(kubectl exec deployment/client -- wget -qO-\
      \ -T 3 \"http://$ip:8080\")\" = \"$version-115\"\n done\ndone\ncase \"$(kubectl exec deployment/client\
      \ -- wget -qO- -T 3 http://board:8080)\" in blue-115|green-115) ;; *) exit 1;; esac"
