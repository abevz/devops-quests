id: 115
title: title
track: Kubernetes
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local id=$1 label=$2 expression=$3 document=$4; if ! jq -e "$expression" <<<"$document" >/dev/null
      2>&1; then printf ''%s\n'' "$label: ✗ [DQ:$id]"; failed=1; fi; }

      service=$(timeout 2s kubectl get service board -o json 2>/dev/null || true)

      check selector ''service/board selector = app green'' ''.spec.selector=={app:"green"}'' "$service"

      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- wget -qO- -T 3 http://board:8080
      2>/dev/null)" = green-115; then printf ''%s\n'' ''board:8080 = green-115: ✗ [DQ:http]''; failed=1; fi

      exit "$failed"

      '
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local id=$1 label=$2 expression=$3 document=$4; if ! jq -e "$expression" <<<"$document" >/dev/null
      2>&1; then printf ''%s\n'' "$label: ✗ [DQ:$id]"; failed=1; fi; }

      deployments=$(timeout 2s kubectl get deployment blue green -o json 2>/dev/null || true)

      check blue_replicas ''blue replicas = 3'' ''any(.items[]?;.metadata.name=="blue" and .spec.replicas==3)''
      "$deployments"

      check blue_ready ''blue readyReplicas = 3'' ''any(.items[]?;.metadata.name=="blue" and .status.readyReplicas==3)''
      "$deployments"

      check green_replicas ''green replicas = 1'' ''any(.items[]?;.metadata.name=="green" and .spec.replicas==1)''
      "$deployments"

      check green_ready ''green readyReplicas = 1'' ''any(.items[]?;.metadata.name=="green" and .status.readyReplicas==1)''
      "$deployments"

      exit "$failed"

      '
  - text: stages.1.objectives.1.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local id=$1 label=$2 expression=$3 document=$4; if ! jq -e "$expression" <<<"$document" >/dev/null
      2>&1; then printf ''%s\n'' "$label: ✗ [DQ:$id]"; failed=1; fi; }

      deployments=$(timeout 2s kubectl get deployment blue green -o json 2>/dev/null || true)

      service=$(timeout 2s kubectl get service board -o json 2>/dev/null || true)

      endpoints=$(timeout 2s kubectl get endpointslices -l kubernetes.io/service-name=board -o json 2>/dev/null
      || true)

      check selector_canary ''service/board selector = release board'' ''.spec.selector=={release:"board"}'' "$service"

      check endpoints ''four unique ready EndpointSlice target names'' ''[.items[].endpoints[] | select(.conditions.ready==true
      and (.targetRef.name | type=="string" and length>0)) | .targetRef.name] | unique | length==4'' "$endpoints"

      exit "$failed"

      '
  - text: stages.1.objectives.2.text
    check: "set -euo pipefail\ncd ~/quest\npython3 - <<'DQ_PROBES'\nimport concurrent.futures\nimport subprocess\n\
      import sys\nimport time\n\n# Includes both Kubernetes lookups. Reserve 3s for the Service and 0.5s for diagnostics.\n\
      deadline = time.monotonic() + 22\npod_deadline = deadline - 3.5\nfailed = False\npod_markers = {\"blue\":\
      \ \"[DQ:pod_blue]\", \"green\": \"[DQ:pod_green]\"}\nip_markers = {\"blue\": \"[DQ:ips_blue]\", \"green\"\
      : \"[DQ:ips_green]\"}\n\ndef output(arguments):\n    return subprocess.run(arguments, stdout=subprocess.PIPE,\
      \ stderr=subprocess.DEVNULL,\n                          check=False).stdout.replace(b\"\\x00\", b\"\").rstrip(b\"\
      \\n\")\n\ndef probe(target):\n    version, ip = target\n    actual = output([\"timeout\", \"3s\", \"kubectl\"\
      , \"exec\", \"--pod-running-timeout=2s\",\n                     \"deployment/client\", \"--\", \"wget\", \"\
      -qO-\", \"-T\", \"2\", f\"http://{ip}:8080\"])\n    return actual == f\"{version}-115\".encode()\n\ntargets\
      \ = []\nfor version in (\"blue\", \"green\"):\n    ips = output([\"timeout\", \"2s\", \"kubectl\", \"get\"\
      , \"pods\", \"-l\", f\"app={version}\",\n                  \"-o\", \"jsonpath={.items[*].status.podIP}\"]).decode().split()\n\
      \    if not ips:\n        print(f\"{version} Pod IPs present: ✗ {ip_markers[version]}\", flush=True)\n   \
      \     failed = True\n    targets.extend((version, ip) for ip in ips)\n\nnext_target = 0\nwith concurrent.futures.ThreadPoolExecutor(max_workers=2)\
      \ as pool:\n    active = {}\n    while next_target < len(targets) or active:\n        while len(active) <\
      \ 2 and next_target < len(targets) and time.monotonic() + 3 <= pod_deadline:\n            target = targets[next_target]\n\
      \            active[pool.submit(probe, target)] = target\n            next_target += 1\n        if not active:\n\
      \            break\n        completed, _ = concurrent.futures.wait(active, return_when=concurrent.futures.FIRST_COMPLETED)\n\
      \        for future in completed:\n            version, ip = active.pop(future)\n            if not future.result():\n\
      \                print(f\"{version} Pod {ip}:8080 = {version}-115: ✗ {pod_markers[version]}\", flush=True)\n\
      \                failed = True\n\nif next_target < len(targets):\n    pending = \", \".join(ip for _, ip in\
      \ targets[next_target:])\n    print(f\"Probe time budget exhausted; unchecked Pod IPs: {pending}: ✗ [DQ:probe_budget]\"\
      , flush=True)\n    failed = True\n\nactual = output([\"timeout\", \"3s\", \"kubectl\", \"exec\", \"--pod-running-timeout=2s\"\
      ,\n                 \"deployment/client\", \"--\", \"wget\", \"-qO-\", \"-T\", \"2\", \"http://board:8080\"\
      ])\nif actual not in (b\"blue-115\", b\"green-115\"):\n    print(\"board:8080 = blue-115 or green-115: ✗ [DQ:canary_http]\"\
      , flush=True)\n    failed = True\nsys.exit(int(failed))\nDQ_PROBES\n"
