title: Gateway API route attachment
brief: |-
  The private gateway is not serving the required application route. Restore accepted attachment, resolved references and the required responses.

  Work on the workstation in `~/quest` with the supplied files:
  - `gateway-target.json`.
  - `attachment-contract.json`.

  **Requirements:**

  - Gateway `station` uses the supplied private GatewayClass and is accepted for its current generation.
  - The supplied HTTPRoute serves only `north.station.internal` through the existing Gateway and board backend, with one parent both accepting the route and resolving its references. Retain the original Gateway, HTTPRoute, backend Service and Deployment identities and provided images; keep the Gateway listener definitions unchanged. The intended controller must report both conditions for a requested parent compatible with the retained listener and the current route generation, as specified by `attachment-contract.json`.
  - From Deployment `client`, the supplied private gateway URL with Host `north.station.internal` returns `north-113`.
  - The same private gateway request with Host `closed.station.internal` fails.

  Checks establish current attachment, references and traffic; they do not prove edit history. Use only the supplied private gateway endpoint.
debrief: The checks compared retained routing identities and listeners, current controller/parent/generation context
  and actual matching and closed Host responses.
stages.0.brief: Use only the supplied private gateway endpoint.
hints.0.text: Listener attachment and backend reference resolution answer different questions. A condition can belong
  to another parent or an older generation; establish its context before treating it as current route health.
hints.1.text: |-
  Compare the existing Gateway listeners, requested parents, Service interface and the controller’s current conditions:

  ```sh
  cat gateway-target.json
  cat attachment-contract.json
  kubectl get gateway,httproute,service,pods -o yaml
  ```
hints.2.text: |-
  Verify the retained listener and identities, both current-generation parent conditions and real matching and closed Host traffic:

  ```sh
  kubectl get gateway station -o yaml
  kubectl get httproute board -o json | jq '{generation:.metadata.generation,parents:.status.parents}'
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  if kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"; then
   printf '%s\n' 'unexpected closed Host response'
  else
   printf '%s\n' 'closed Host denied'
  fi
  ```
phrases.0: I traced the route to the actual Service port.
phrases.1: I inspected acceptance and reference conditions.
phrases.2: I tested matching and nonmatching hosts.
questions.0.points.0: Gateway defines listeners and route attachment policy.
questions.0.points.1: HTTPRoute describes application matches and backends.
questions.0.prompt: How do Gateway and HTTPRoute divide responsibility?
questions.1.points.0: Check ResolvedRefs separately from Accepted.
questions.1.points.1: Also prove real traffic; status is not a response body.
questions.1.prompt: Can an Accepted route still have an invalid backend?
stages.0.objectives.0.text: Gateway `station` uses the supplied private GatewayClass and is accepted for its current
  generation.
stages.0.objectives.1.text: The supplied HTTPRoute serves only `north.station.internal` through the existing Gateway
  and board backend, with one parent both accepting the route and resolving its references. Retain the original
  Gateway, HTTPRoute, backend Service and Deployment identities and provided images; keep the Gateway listener definitions
  unchanged. The intended controller must report both conditions for a requested parent compatible with the retained
  listener and the current route generation, as specified by `attachment-contract.json`.
stages.0.objectives.2.text: From Deployment `client`, the supplied private gateway URL with Host `north.station.internal`
  returns `north-113`.
stages.0.objectives.3.text: The same private gateway request with Host `closed.station.internal` fails.
diagnostics.class: The Gateway may reference another controller class or the frozen target may be unreadable. Compare gatewayClassName on station with the supplied private class. [Cause and check](guides#guide=autoscaling-gateway&section=q113-gateway-private-class)
diagnostics.accepted: The Gateway may be rejected or report acceptance for an earlier generation. Inspect Accepted and observedGeneration on the current Gateway. [Cause and check](guides#guide=autoscaling-gateway&section=q113-gateway-current-accepted)
diagnostics.parent: The route may reference the wrong parent or a parent in another namespace. Inspect parentRefs for the station Gateway in the route’s own namespace. [Cause and check](guides#guide=autoscaling-gateway&section=q113-route-same-namespace-parent)
diagnostics.hostnames: The route may omit north.station.internal or expose an additional hostname. Compare the distinct hostname set with the single supplied host. [Cause and check](guides#guide=autoscaling-gateway&section=q113-route-only-allowed-host)
diagnostics.backend_name: An active backend may point at a different Service or another namespace, or a rule may lack a positive-weight reference. Check each rule’s active references for the local board Service. [Cause and check](guides#guide=autoscaling-gateway&section=q113-route-active-backend-service)
diagnostics.backend_port: The route can name the right Service while active references still use port 8099. Inspect every positive-weight backend and use Service port 8080. [Cause and check](guides#guide=autoscaling-gateway&section=q113-route-active-backend-port)
diagnostics.parent_accepted: The requested listener may not exist or may reject the route. Inspect the parent entries for a reported Accepted=True and read the condition reason. [Cause and check](guides#guide=autoscaling-gateway&section=q113-route-parent-acceptance)
diagnostics.parent_resolved: A parent may accept the route without resolving its backend Service or port. Inspect ResolvedRefs and correct the unresolved reference. [Cause and check](guides#guide=autoscaling-gateway&section=q113-route-parent-resolved-backends)
diagnostics.parent_both: Accepted and ResolvedRefs may be true on different parent entries. Check that both are true together on one parent before treating the reported attachment as complete. [Cause and check](guides#guide=autoscaling-gateway&section=q113-route-same-parent-conditions)
diagnostics.attachment_identity: A replacement may change the Gateway, route, Service or Deployment identity, and a live worker may diverge from its supplied image. Compare current UIDs and images with the frozen attachment records. [Cause and check](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-delivery-objects)
diagnostics.attachment_listener: Editing the Gateway to make a stale route attach can change the supplied listener list. Compare the whole live list with the captured original and restore the route’s reference to a compatible listener. [Cause and check](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-listeners)
diagnostics.attachment_parent: A parent status may come from another controller or reference an incompatible listener. Compare the requested and observed parent keys, section and port against the station HTTP listener and its supplied controller. [Cause and check](guides#guide=autoscaling-gateway&section=q113-matching-controller-listener)
diagnostics.attachment_generation: The compatible parent may still report stale Accepted or ResolvedRefs conditions. Wait for both to be True on the matching controller entry at the current HTTPRoute generation. [Cause and check](guides#guide=autoscaling-gateway&section=q113-current-route-generation)
diagnostics.http: A reported attachment may still send no response or use the wrong backend. Query the supplied Gateway URL with Host north.station.internal from client and compare with north-113. [Cause and check](guides#guide=autoscaling-gateway&section=q113-gateway-allowed-host-http)
diagnostics.wrong: An overly broad host rule may still serve closed.station.internal. Send the different Host header through the same Gateway and confirm that the request fails. [Cause and check](guides#guide=autoscaling-gateway&section=q113-gateway-unmatched-host-http)
diagnostics.probe_0_1: An observer can stop before identifying an attachment condition when the workspace, frozen facts or local tools cannot be read. Verify the tools and access to the relevant Gateway and route. [Cause and check](guides#guide=autoscaling-gateway&section=q113-gateway-attachment-observer-input)
