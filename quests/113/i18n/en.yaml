title: Gateway API route attachment
brief: |-
  The private gateway is not serving the required application route. Restore accepted attachment, resolved references and the required responses.

  Work on the workstation in `~/quest` with the supplied files:
  - `gateway-target.json`.
  - `attachment-contract.json`.

  **Requirements:**

  - Gateway `station` uses the supplied private GatewayClass and is accepted for its current generation.
  - The supplied HTTPRoute serves only `north.station.internal` through the existing Gateway and board backend, with one parent both accepting the route and resolving its references. Retain the original Gateway, HTTPRoute, backend Service and Deployment identities and provided images; keep the Gateway listener definitions unchanged. The intended controller must report both conditions for a requested parent compatible with the retained listener and the current route generation, as specified by `attachment-contract.json`.
  - From Deployment `client`, the supplied private gateway URL with Host `north.station.internal` returns `north-113`.
  - The same private gateway request with Host `closed.station.internal` fails.

  Checks establish current attachment, references and traffic; they do not prove edit history. Use only the supplied private gateway endpoint.
debrief: The checks compared retained routing identities and listeners, current controller/parent/generation context
  and actual matching and closed Host responses.
stages.0.brief: Use only the supplied private gateway endpoint.
hints.0.text: Listener attachment and backend reference resolution answer different questions. A condition can belong
  to another parent or an older generation; establish its context before treating it as current route health.
hints.1.text: |-
  Compare the existing Gateway listeners, requested parents, Service interface and the controller’s current conditions:

  ```sh
  cat gateway-target.json attachment-contract.json
  kubectl get gateway,httproute,service,pods -o yaml
  ```
hints.2.text: |-
  Verify the retained listener and identities, both current-generation parent conditions and real matching and closed Host traffic:

  ```sh
  kubectl get gateway station -o yaml
  kubectl get httproute board -o json | jq '{generation:.metadata.generation,parents:.status.parents}'
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  if kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"; then
   printf '%s\n' 'unexpected closed Host response'
  else
   printf '%s\n' 'closed Host denied'
  fi
  ```
phrases.0: I traced the route to the actual Service port.
phrases.1: I inspected acceptance and reference conditions.
phrases.2: I tested matching and nonmatching hosts.
questions.0.points.0: Gateway defines listeners and route attachment policy.
questions.0.points.1: HTTPRoute describes application matches and backends.
questions.0.prompt: How do Gateway and HTTPRoute divide responsibility?
questions.1.points.0: Check ResolvedRefs separately from Accepted.
questions.1.points.1: Also prove real traffic; status is not a response body.
questions.1.prompt: Can an Accepted route still have an invalid backend?
diagnostics.class: Gateway station must use the supplied private class.
diagnostics.accepted: Gateway station Accepted must be True at the current generation.
diagnostics.parent: httproute/board must attach to Gateway station in this namespace.
diagnostics.hostnames: httproute/board must serve only north.station.internal.
diagnostics.backend_name: Active httproute/board backends must use the board Service in this namespace.
diagnostics.backend_port: Active httproute/board backend references must use port 8080.
diagnostics.parent_accepted: An HTTPRoute parent must have Accepted=True.
diagnostics.parent_resolved: An HTTPRoute parent must have ResolvedRefs=True.
diagnostics.parent_both: One HTTPRoute parent must have both Accepted=True and ResolvedRefs=True.
diagnostics.http: The request with Host north.station.internal must return north-113.
diagnostics.wrong: The request with Host closed.station.internal must fail.
