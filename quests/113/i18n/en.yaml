title: Gateway API route attachment
brief: 'A private Traefik controller accepts this bay''s GatewayClass and HTTP listener
  on port 8000. The HTTPRoute names a nonexistent backend Service port 8099. Repair
  it to the real board port 8080. Keep the supplied GatewayClass, same-namespace route
  binding and north.station.internal host. Inspect Accepted and ResolvedRefs, then
  prove real matching-host routing and a rejected other host. No host ports, public
  DNS or external load balancer are needed.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`,
  `client.json`, `gateway.json`, `route.json`, `gateway-target.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The supplied Gateway accepts the route, references resolve
  and only the intended host returns north-113.'
debrief: GatewayClass, Gateway and HTTPRoute split controller selection, listener
  ownership and application routing.
stages.0.brief: 'Success criteria: The supplied Gateway accepts the route, references
