title: Gateway API route attachment
brief: |-
  The private gateway is not serving the required route. Restore accepted routing and the correct consumer responses.

  Work on the workstation in `~/quest` with the supplied files:
  - `board.yaml`, `service.yaml`, `client.yaml`, `gateway.yaml`, `route.yaml`, `gateway-target.json`.

  **Requirements:**

  - Gateway `station` uses the supplied private GatewayClass and is accepted for its current generation.
  - The supplied HTTPRoute serves only `north.station.internal` through the existing Gateway and board backend, with one parent both accepting the route and resolving its references.
  - From Deployment `client`, the supplied private gateway URL with Host `north.station.internal` returns `north-113`.
  - The same private gateway request with Host `closed.station.internal` fails.

  A failed request alone does not establish its cause; checks do not establish which parent or generation supplied route status.
debrief: GatewayClass, Gateway and HTTPRoute split controller selection, listener ownership and application
  routing.
stages.0.brief: Use only the supplied private gateway endpoint.
hints.0.text: An HTTPRoute backend port refers to the Service port. GatewayClass selects a controller,
  Gateway owns a listener, and HTTPRoute attaches routing rules.
hints.1.text: |-
  Accepted and ResolvedRefs answer different questions.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get gateway station -o yaml
    kubectl get httproute board -o yaml
    cat gateway-target.json
  ```
hints.2.text: |-
  Repair the backend port and test the frozen private endpoint with explicit Host.

  Verify the result from `~/quest` on the workstation:

  - The gateway consumer receives `north-113`.

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
    ```

  - The other Host request fails (nonzero exit).

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"
    ```
phrases.0: I traced the route to the actual Service port.
phrases.1: I inspected acceptance and reference conditions.
phrases.2: I tested matching and nonmatching hosts.
questions.0.points.0: Gateway defines listeners and route attachment policy.
questions.0.points.1: HTTPRoute describes application matches and backends.
questions.0.prompt: How do Gateway and HTTPRoute divide responsibility?
questions.1.points.0: Check ResolvedRefs separately from Accepted.
questions.1.points.1: Also prove real traffic; status is not a response body.
questions.1.prompt: Can an Accepted route still have an invalid backend?
diagnostics.class: Gateway station must use the supplied private class.
diagnostics.accepted: Gateway station Accepted must be True at the current generation.
diagnostics.parent: httproute/board parentRefs[0].name must equal station.
diagnostics.hostnames: httproute/board hostnames must equal [north.station.internal].
diagnostics.backend_name: httproute/board backendRefs[0].name must equal board.
diagnostics.backend_port: httproute/board backendRefs[0].port must equal 8080.
diagnostics.parent_accepted: An HTTPRoute parent must have Accepted=True.
diagnostics.parent_resolved: An HTTPRoute parent must have ResolvedRefs=True.
diagnostics.parent_both: One HTTPRoute parent must have both Accepted=True and ResolvedRefs=True.
diagnostics.http: The request with Host north.station.internal must return north-113.
diagnostics.wrong: The request with Host closed.station.internal must fail.
