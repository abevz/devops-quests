phrases.1: I inspected acceptance and reference conditions.
phrases.2: I tested matching and nonmatching hosts.
questions.0.points.0: Gateway defines listeners and route attachment policy.
questions.0.points.1: HTTPRoute describes application matches and backends.
questions.0.prompt: How do Gateway and HTTPRoute divide responsibility?
questions.1.points.0: Check ResolvedRefs separately from Accepted.
questions.1.points.1: Also prove real traffic; status is not a response body.
questions.1.prompt: Can an Accepted route still have an invalid backend?
