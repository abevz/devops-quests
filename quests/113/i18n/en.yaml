title: Gateway API route attachment
brief: Work in `~/quest` with `board.json`, `service.json`, `client.json`, `gateway.json`, `route.json` and `gateway-target.json`.
  GatewayClass selects a controller, Gateway owns a listener and HTTPRoute attaches routing rules. Repair HTTPRoute `board`
  so its first parent is `station`, its hostnames are exactly `[north.station.internal]`, and its first backend is Service
  `board` port 8080. Gateway `station` must use the supplied class and have `Accepted=True` for its current generation. One
  route parent must have both `Accepted=True` and `ResolvedRefs=True`. Wait for reconciliation. From client, send Host `north.station.internal`
  to the private URL in `gateway-target.json` and expect `north-113`; Host `closed.station.internal` must fail. Failure alone
  does not establish its cause, and the check does not establish which parent or generation supplied the route status. Use
  only the offline bay.
debrief: GatewayClass, Gateway and HTTPRoute split controller selection, listener ownership and application routing.
stages.0.brief: The Gateway and HTTPRoute settings and statuses, matching response, and failed other-host request match the
  brief.
stages.0.objectives.0.text: The Gateway and HTTPRoute settings and statuses, matching response, and failed other-host request
  match the brief.
hints.0.text: An HTTPRoute backend port refers to the Service port.
hints.1.text: Accepted and ResolvedRefs answer different questions.
hints.2.text: Repair the backend port and test the frozen private endpoint with explicit Host.
phrases.0: I traced the route to the actual Service port.
phrases.1: I inspected acceptance and reference conditions.
phrases.2: I tested matching and nonmatching hosts.
questions.0.points.0: Gateway defines listeners and route attachment policy.
questions.0.points.1: HTTPRoute describes application matches and backends.
questions.0.prompt: How do Gateway and HTTPRoute divide responsibility?
questions.1.points.0: Check ResolvedRefs separately from Accepted.
questions.1.points.1: Also prove real traffic; status is not a response body.
questions.1.prompt: Can an Accepted route still have an invalid backend?
diagnostics.class: Gateway station must use the supplied private class.
diagnostics.accepted: Gateway station Accepted must be True at the current generation.
diagnostics.parent: httproute/board parentRefs[0].name must equal station.
diagnostics.hostnames: httproute/board hostnames must equal [north.station.internal].
diagnostics.backend_name: httproute/board backendRefs[0].name must equal board.
diagnostics.backend_port: httproute/board backendRefs[0].port must equal 8080.
diagnostics.parent_accepted: An HTTPRoute parent must have Accepted=True.
diagnostics.parent_resolved: An HTTPRoute parent must have ResolvedRefs=True.
diagnostics.parent_both: One HTTPRoute parent must have both Accepted=True and ResolvedRefs=True.
diagnostics.http: The request with Host north.station.internal must return north-113.
diagnostics.wrong: The request with Host closed.station.internal must fail.
