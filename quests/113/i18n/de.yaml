diagnostics.class: Das Gateway verweist möglicherweise auf eine andere Klasse oder der Beleg ist nicht lesbar. Vergleichen Sie gatewayClassName von station mit der gelieferten privaten Klasse. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-gateway-private-class)
diagnostics.accepted: Das Gateway wurde möglicherweise abgelehnt oder meldet Akzeptanz für eine frühere Generation. Prüfen Sie Accepted und observedGeneration am aktiven Gateway. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-gateway-current-accepted)
diagnostics.parent: Die Route verweist möglicherweise auf einen anderen Parent oder Namespace. Prüfen Sie parentRefs auf Gateway station im Namespace der Route. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-route-same-namespace-parent)
diagnostics.hostnames: Die Route lässt north.station.internal möglicherweise aus oder stellt einen Zusatzhost bereit. Vergleichen Sie die Menge eindeutiger Hostnamen mit dem einzigen gelieferten Host. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-route-only-allowed-host)
diagnostics.backend_name: Ein aktives Backend verweist möglicherweise auf einen anderen Service oder Namespace, oder eine Regel hat keinen Verweis mit positivem Gewicht. Prüfen Sie aktive Verweise jeder Regel auf den lokalen Service board. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-route-active-backend-service)
diagnostics.backend_port: Die Route kann den richtigen Service nennen, während aktive Verweise noch 8099 nutzen. Prüfen Sie jedes Backend mit positivem Gewicht und verwenden Sie Service-Port 8080. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-route-active-backend-port)
diagnostics.parent_accepted: Der angeforderte Listener fehlt möglicherweise oder lehnt die Route ab. Suchen Sie Accepted=True in den Parent-Einträgen und lesen Sie den Grund. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-route-parent-acceptance)
diagnostics.parent_resolved: Ein Parent kann die Route akzeptieren, ohne Backend-Service oder Port aufzulösen. Prüfen Sie ResolvedRefs und korrigieren Sie den offenen Verweis. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-route-parent-resolved-backends)
diagnostics.parent_both: Accepted und ResolvedRefs können in verschiedenen Parent-Einträgen wahr sein. Prüfen Sie beide gemeinsam in einem Eintrag, bevor Sie den Anschluss als vollständig behandeln. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-route-same-parent-conditions)
diagnostics.attachment_identity: Eine Ersetzung kann Gateway, Route, Service oder Deployment ändern, und ein aktiver Worker kann ein anderes Image verwenden. Vergleichen Sie UIDs und Images mit den festgehaltenen Belegen. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-delivery-objects)
diagnostics.attachment_listener: Eine Gateway-Änderung für eine alte Route kann die gelieferte Listener-Liste verändern. Vergleichen Sie die vollständige aktive Liste mit dem Original und korrigieren Sie den Routenverweis auf einen kompatiblen Listener. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-listeners)
diagnostics.attachment_parent: Der Parent-Status stammt möglicherweise von einem anderen Controller oder verweist auf einen inkompatiblen Listener. Vergleichen Sie angeforderten und beobachteten Parent, Abschnitt und Port mit HTTP-Listener und Controller von station. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-matching-controller-listener)
diagnostics.attachment_generation: Der kompatible Parent meldet möglicherweise noch alte Accepted- oder ResolvedRefs-Bedingungen. Warten Sie auf beide True im passenden Controller-Eintrag für die aktuelle Generation der HTTPRoute. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-current-route-generation)
diagnostics.http: Der gemeldete Anschluss liefert möglicherweise keine Antwort oder nutzt ein anderes Backend. Fragen Sie die Gateway-URL aus client mit Host north.station.internal ab und vergleichen Sie mit north-113. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-gateway-allowed-host-http)
diagnostics.wrong: Eine zu breite Regel bedient möglicherweise noch closed.station.internal. Senden Sie den anderen Host über dasselbe Gateway und prüfen Sie, dass die Anfrage scheitert. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-gateway-unmatched-host-http)
diagnostics.probe_0_1: Die Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Verzeichnis, Belege oder Werkzeuge fehlen. Prüfen Sie Werkzeuge und Zugriff auf Gateway und Route. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q113-gateway-attachment-observer-input)
