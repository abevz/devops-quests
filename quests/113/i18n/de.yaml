title: Gateway-API-Routenanbindung
brief: |-
  Das private Gateway bedient die erforderliche Route nicht. Stellen Sie akzeptiertes Routing und korrekte Antworten wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `board.yaml`, `service.yaml`, `client.yaml`, `gateway.yaml`, `route.yaml`, `gateway-target.json`.

  **Requirements:**

  - Gateway `station` nutzt die bereitgestellte private GatewayClass und ist für seine aktuelle Generation akzeptiert.
  - Die bereitgestellte HTTPRoute bedient nur `north.station.internal` über das vorhandene Gateway und board-Backend; ein Parent akzeptiert die Route und löst ihre Referenzen auf.
  - Von Deployment `client` liefert die bereitgestellte private Gateway-URL mit Host `north.station.internal` den Wert `north-113`.
  - Dieselbe private Gateway-Anfrage mit Host `closed.station.internal` schlägt fehl.

  Eine fehlgeschlagene Anfrage allein belegt nicht ihre Ursache; die Prüfungen belegen nicht, welcher Parent oder welche Generation den Routenstatus lieferte.
debrief: GatewayClass, Gateway und HTTPRoute teilen Controller-Auswahl, listener-Besitz und Anwendungsrouting
  auf.
stages.0.brief: Verwenden Sie nur den bereitgestellten privaten Gateway-Endpunkt.
hints.0.text: Ein HTTPRoute-Backend-Port bezieht sich auf den Service-Port. GatewayClass wählt einen Controller,
  Gateway besitzt einen Listener und HTTPRoute bindet Routing-Regeln an.
hints.1.text: |-
  Accepted und ResolvedRefs beantworten unterschiedliche Fragen.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get gateway station -o yaml
    kubectl get httproute board -o yaml
    cat gateway-target.json
  ```
hints.2.text: |-
  Reparieren Sie den backend-Port und testen Sie den eingefrorenen privaten endpoint mit explizitem Host.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - Der Gateway-Verbraucher erhält `north-113`.

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
    ```

  - Die Anfrage mit dem anderen Host schlägt fehl (Exit ungleich null).

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"
    ```
phrases.0: Ich habe den route auf den tatsächlichen Service-Port zurückgeführt.
phrases.1: Ich habe die Annahme- und Referenzbedingungen eingesehen.
phrases.2: Ich habe passende und nicht passende Hosts getestet.
questions.0.points.0: Gateway definiert Listener und die Richtlinie zur Routenanbindung.
questions.0.points.1: HTTPRoute beschreibt Anwendungsübereinstimmungen und backends.
questions.0.prompt: Wie teilen Gateway und HTTPRoute die Verantwortung auf?
questions.1.points.0: Überprüfen Sie ResolvedRefs getrennt von Accepted.
questions.1.points.1: Beweisen Sie auch echten Verkehr; status ist kein Antworttext.
questions.1.prompt: Kann ein Accepted route noch einen ungültigen backend haben?
