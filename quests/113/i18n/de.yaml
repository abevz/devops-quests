title: Gateway-API-Routenanbindung
brief: |-
  Das private Gateway bedient die erforderliche Anwendungsroute nicht. Stelle akzeptierte Anbindung, aufgelöste Referenzen und die geforderten Antworten wieder her.

  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `gateway-target.json`.
  - `attachment-contract.json`.

  **Anforderungen:**

  - Gateway `station` nutzt die bereitgestellte private GatewayClass und ist für seine aktuelle Generation akzeptiert.
  - Die bereitgestellte HTTPRoute bedient nur `north.station.internal` über das vorhandene Gateway und board-Backend; ein Parent akzeptiert die Route und löst ihre Referenzen auf. Erhalte ursprüngliche Identitäten von Gateway, HTTPRoute, Backend-Service und Deployments sowie bereitgestellte Images; ändere die Gateway-Listenerdefinitionen nicht. Der zuständige Controller muss beide Bedingungen für einen angefragten, zum erhaltenen Listener passenden Parent und die aktuelle Routengeneration gemäß `attachment-contract.json` melden.
  - Von Deployment `client` liefert die bereitgestellte private Gateway-URL mit Host `north.station.internal` den Wert `north-113`.
  - Dieselbe private Gateway-Anfrage mit Host `closed.station.internal` schlägt fehl.

  Prüfungen belegen aktuelle Anbindung, Referenzen und Verkehr, nicht den Änderungsverlauf. Nutze nur den bereitgestellten privaten Gateway-Endpunkt.
debrief: Die Prüfungen verglichen erhaltene Routing-Identitäten und Listener, aktuellen Controller-/Parent-/Generationskontext
  sowie reale Antworten für passenden und geschlossenen Host.
stages.0.brief: Verwenden Sie nur den bereitgestellten privaten Gateway-Endpunkt.
hints.0.text: Listener-Anbindung und Backend-Referenzauflösung beantworten verschiedene Fragen. Eine Bedingung kann
  zu einem anderen Parent oder einer älteren Generation gehören; kläre den Kontext vor der Bewertung aktueller Routengesundheit.
hints.1.text: |-
  Vergleiche bestehende Gateway-Listener, angefragte Parents, Service-Schnittstelle und aktuelle Controller-Bedingungen:

  ```sh
  cat gateway-target.json attachment-contract.json
  kubectl get gateway,httproute,service,pods -o yaml
  ```
hints.2.text: |-
  Prüfe erhaltene Listener und Identitäten, beide Parent-Bedingungen der aktuellen Generation und realen Verkehr mit passendem sowie geschlossenem Host:

  ```sh
  kubectl get gateway station -o yaml
  kubectl get httproute board -o json | jq '{generation:.metadata.generation,parents:.status.parents}'
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  if kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"; then
   printf '%s\n' 'unexpected closed Host response'
  else
   printf '%s\n' 'closed Host denied'
  fi
  ```
phrases.0: Ich habe den route auf den tatsächlichen Service-Port zurückgeführt.
phrases.1: Ich habe die Annahme- und Referenzbedingungen eingesehen.
phrases.2: Ich habe passende und nicht passende Hosts getestet.
questions.0.points.0: Gateway definiert Listener und die Richtlinie zur Routenanbindung.
questions.0.points.1: HTTPRoute beschreibt Anwendungsübereinstimmungen und backends.
questions.0.prompt: Wie teilen Gateway und HTTPRoute die Verantwortung auf?
questions.1.points.0: Überprüfen Sie ResolvedRefs getrennt von Accepted.
questions.1.points.1: Beweisen Sie auch echten Verkehr; status ist kein Antworttext.
questions.1.prompt: Kann ein Accepted route noch einen ungültigen backend haben?
diagnostics.class: Gateway station muss die bereitgestellte private Klasse verwenden.
diagnostics.accepted: Gateway station Accepted muss für die aktuelle Generation True sein.
diagnostics.parent: httproute/board muss an Gateway station in diesem Namespace gebunden sein.
diagnostics.hostnames: httproute/board darf nur north.station.internal bedienen.
diagnostics.backend_name: Aktive Backends von httproute/board müssen den Service board in diesem Namespace nutzen.
diagnostics.backend_port: Aktive Backendreferenzen von httproute/board müssen Port 8080 verwenden.
diagnostics.parent_accepted: Ein HTTPRoute-Parent muss Accepted=True haben.
diagnostics.parent_resolved: Ein HTTPRoute-Parent muss ResolvedRefs=True haben.
diagnostics.parent_both: Ein HTTPRoute-Parent muss sowohl Accepted=True als auch ResolvedRefs=True haben.
diagnostics.http: Die Anfrage mit Host north.station.internal muss north-113 liefern.
diagnostics.wrong: Die Anfrage mit Host closed.station.internal muss fehlschlagen.
