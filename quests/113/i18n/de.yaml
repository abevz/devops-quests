title: Gateway-API-Routenanbindung
brief: "Das private Gateway bedient die erforderliche Route nicht. Stellen Sie akzeptiertes Routing und korrekte\
  \ Antworten wieder her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `board.json`,\
  \ `service.json`, `client.json`, `gateway.json`, `route.json`, `gateway-target.json`.\n\n**Requirements:**\n\n\
  - Gateway `station` nutzt die bereitgestellte private GatewayClass und ist für seine aktuelle Generation akzeptiert.\n\
  - HTTPRoute `board` ist für ausschließlich `north.station.internal` an Gateway `station` gebunden, leitet an Service\
  \ `board` Port `8080` weiter und hat einen Parent mit `Accepted=True` und `ResolvedRefs=True`.\n- Von Deployment\
  \ `client` liefert die bereitgestellte private Gateway-URL mit Host `north.station.internal` den Wert `north-113`.\n\
  - Dieselbe private Gateway-Anfrage mit Host `closed.station.internal` schlägt fehl.\n\n**Verify yourself before\
  \ Check & finish:** Führen Sie diese Beobachtungsbefehle aus `~/quest` auf der Workstation aus.\n\n- Einstellungen,\
  \ Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get gateway station -o yaml\n  kubectl\
  \ get httproute board -o yaml\n  cat gateway-target.json\n  ```\n\n- Der Gateway-Verbraucher erhält `north-113`.\n\
  \n  ```sh\n  url=$(jq -r .url gateway-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ north.station.internal' \"$url\"\n  ```\n\n- Die Anfrage mit dem anderen Host schlägt fehl (Exit ungleich null).\n\
  \n  ```sh\n  url=$(jq -r .url gateway-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ closed.station.internal' \"$url\"\n  ```\n\nEine fehlgeschlagene Anfrage allein belegt nicht ihre Ursache; die\
  \ Prüfungen belegen nicht, welcher Parent oder welche Generation den Routenstatus lieferte."
debrief: GatewayClass, Gateway und HTTPRoute teilen Controller-Auswahl, listener-Besitz und Anwendungsrouting auf.
stages.0.brief: Das private Gateway muss den geforderten Host bedienen und den anderen Host ablehnen.
hints.0.text: Ein HTTPRoute-Backend-Port bezieht sich auf den Service-Port. GatewayClass wählt einen Controller,
  Gateway besitzt einen Listener und HTTPRoute bindet Routing-Regeln an.
hints.1.text: Accepted und ResolvedRefs beantworten unterschiedliche Fragen.
hints.2.text: Reparieren Sie den backend-Port und testen Sie den eingefrorenen privaten endpoint mit explizitem
  Host.
phrases.0: Ich habe den route auf den tatsächlichen Service-Port zurückgeführt.
phrases.1: Ich habe die Annahme- und Referenzbedingungen eingesehen.
phrases.2: Ich habe passende und nicht passende Hosts getestet.
questions.0.points.0: Gateway definiert Listener und die Richtlinie zur Routenanbindung.
questions.0.points.1: HTTPRoute beschreibt Anwendungsübereinstimmungen und backends.
questions.0.prompt: Wie teilen Gateway und HTTPRoute die Verantwortung auf?
questions.1.points.0: Überprüfen Sie ResolvedRefs getrennt von Accepted.
questions.1.points.1: Beweisen Sie auch echten Verkehr; status ist kein Antworttext.
questions.1.prompt: Kann ein Accepted route noch einen ungültigen backend haben?
