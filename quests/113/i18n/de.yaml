diagnostics.attachment_identity: Eine ursprüngliche Routing- oder Workload-Identität oder ein bereitgestelltes Anwendungsimage
  wurde geändert.
diagnostics.attachment_listener: Die erhaltenen Gateway-Listenerdefinitionen wurden geändert.
diagnostics.attachment_parent: Kein gemeldeter angefragter Parent passt zum zuständigen Controller und erhaltenen
  Gateway-Listener.
diagnostics.attachment_generation: Ein geeigneter Parent meldet nicht gleichzeitig Accepted und ResolvedRefs für
  die aktuelle Routengeneration.
diagnostics.probe_0_1: Aktuelle Beobachtungen zu Routenanbindung und Referenzen fehlen oder sind inkonsistent.
