  Gateway und board-Backend; ein Parent akzeptiert die Route und löst ihre Referenzen auf. Erhalte ursprüngliche
  Identitäten von Gateway, HTTPRoute, Backend-Service und Deployments sowie bereitgestellte Images; ändere die Gateway-Listenerdefinitionen
  nicht. Der zuständige Controller muss beide Bedingungen für einen angefragten, zum erhaltenen Listener passenden
  Parent und die aktuelle Routengeneration gemäß `attachment-contract.json` melden.
