title: Gateway API route Aufsatz
brief: 'Ein privater Traefik-Controller akzeptiert die GatewayClass und HTTP listener dieses Schachts
  auf Port 8000. Der HTTPRoute benennt einen nicht vorhandenen Backend-Port 8099 Service. Reparieren Verknüpfen
  Sie es mit dem echten board-Port 8080. Behalten Sie den bereitgestellten GatewayClass, die route-Bindung
  mit demselben Namespace und den Host north.station.internal bei. Überprüfen Sie Accepted und ResolvedRefs
  und beweisen Sie dann, dass es sich um ein echtes Matching-Host-Routing und einen abgelehnten anderen
  Host handelt. Es sind keine Host-Ports, öffentliche DNS oder externer Load Balancer erforderlich.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `board.json`, `service.json`, `client.json`,
  `gateway.json`, `route.json`, `gateway-target.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der bereitgestellte Gateway akzeptiert den route, Referenzen werden aufgelöst
  und nur der vorgesehene Host gibt north-113 zurück.'
debrief: GatewayClass, Gateway und HTTPRoute teilen Controller-Auswahl, listener-Besitz und Anwendungsrouting
  auf.
