title: Gateway-API-Routenanbindung
brief: 'Arbeite in `~/quest` mit `board.json`, `service.json`, `client.json`, `gateway.json`, `route.json` und `gateway-target.json`.
  GatewayClass wählt einen Controller, Gateway besitzt einen Listener und HTTPRoute hängt Routing-Regeln an. Repariere HTTPRoute
  `board`: Der erste Parent ist `station`, hostnames sind genau `[north.station.internal]`, das erste Backend ist Service
  `board` Port 8080. Gateway `station` muss die bereitgestellte Klasse und `Accepted=True` für seine aktuelle Generation haben.
  Ein Route-Parent muss sowohl `Accepted=True` als auch `ResolvedRefs=True` haben. Warte auf den Abgleich. Sende vom Client
  Host `north.station.internal` an die private URL aus `gateway-target.json` und erwarte `north-113`; Host `closed.station.internal`
  muss fehlschlagen. Der Fehlschlag beweist seine Ursache nicht; die Prüfung stellt nicht fest, welcher Parent oder welche
  Generation den Route-Status lieferte. Nutze nur die Offline-Umgebung.'
debrief: GatewayClass, Gateway und HTTPRoute teilen Controller-Auswahl, listener-Besitz und Anwendungsrouting auf.
stages.0.brief: Gateway- und HTTPRoute-Einstellungen und Status, passende Antwort und fehlgeschlagene andere Host-Anfrage
  entsprechen der Beschreibung.
stages.0.objectives.0.text: Gateway- und HTTPRoute-Einstellungen und Status, passende Antwort und fehlgeschlagene andere Host-Anfrage
  entsprechen der Beschreibung.
hints.0.text: Ein HTTPRoute-Backend-Port bezieht sich auf den Service-Port.
hints.1.text: Accepted und ResolvedRefs beantworten unterschiedliche Fragen.
hints.2.text: Reparieren Sie den backend-Port und testen Sie den eingefrorenen privaten endpoint mit explizitem Host.
phrases.0: Ich habe den route auf den tatsächlichen Service-Port zurückgeführt.
phrases.1: Ich habe die Annahme- und Referenzbedingungen eingesehen.
phrases.2: Ich habe passende und nicht passende Hosts getestet.
questions.0.points.0: Gateway definiert Listener und die Richtlinie zur Routenanbindung.
questions.0.points.1: HTTPRoute beschreibt Anwendungsübereinstimmungen und backends.
questions.0.prompt: Wie teilen Gateway und HTTPRoute die Verantwortung auf?
questions.1.points.0: Überprüfen Sie ResolvedRefs getrennt von Accepted.
questions.1.points.1: Beweisen Sie auch echten Verkehr; status ist kein Antworttext.
questions.1.prompt: Kann ein Accepted route noch einen ungültigen backend haben?
