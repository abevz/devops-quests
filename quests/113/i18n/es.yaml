title: Vinculación de rutas de Gateway API
brief: |-
  El gateway privado no sirve la ruta requerida de la aplicación. Recupera la vinculación aceptada, referencias resueltas y respuestas necesarias.

  Trabaja en la estación de trabajo, en `~/quest`, con los archivos suministrados:
  - `gateway-target.json`.
  - `attachment-contract.json`.

  **Requisitos:**

  - El Gateway `station` usa el GatewayClass privado suministrado y está aceptado para su generación actual.
  - El HTTPRoute suministrado sirve solo `north.station.internal` mediante el Gateway y backend board existentes; un mismo parent acepta la ruta y resuelve sus referencias. Conserva las identidades originales de Gateway, HTTPRoute, Service backend y Deployments y las imágenes suministradas; mantén las definiciones de listener del Gateway. El controlador previsto debe informar ambas condiciones para un parent solicitado compatible con el listener conservado y la generación actual de la ruta según `attachment-contract.json`.
  - Desde el Deployment `client`, la URL privada suministrada del gateway con Host `north.station.internal` devuelve `north-113`.
  - La misma solicitud al gateway privado con Host `closed.station.internal` falla.

  Las comprobaciones establecen vinculación, referencias y tráfico actuales, no el historial de cambios. Usa solo el endpoint privado de gateway suministrado.
debrief: Las comprobaciones compararon identidades y listeners conservados, contexto actual de controlador/parent/generación
  y respuestas reales con Host coincidente y cerrado.
stages.0.brief: Usa solo el endpoint privado del gateway suministrado.
hints.0.text: La vinculación con el listener y la resolución del backend responden a preguntas distintas. Una condición
  puede corresponder a otro parent o a una generación anterior; identifica su contexto antes de considerarla salud
  actual.
hints.1.text: |-
  Compara listeners existentes, parents solicitados, interfaz del Service y condiciones actuales del controlador:

  ```sh
  cat gateway-target.json
  cat attachment-contract.json
  kubectl get gateway,httproute,service,pods -o yaml
  ```
hints.2.text: |-
  Verifica listener e identidades conservados, ambas condiciones del parent para la generación actual y tráfico real con Host coincidente y cerrado:

  ```sh
  kubectl get gateway station -o yaml
  kubectl get httproute board -o json | jq '{generation:.metadata.generation,parents:.status.parents}'
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  if kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"; then
   printf '%s\n' 'unexpected closed Host response'
  else
   printf '%s\n' 'closed Host denied'
  fi
  ```
phrases.0: Rastreé el route hasta el puerto Service real.
phrases.1: Inspeccioné las condiciones de aceptación y referencia.
phrases.2: Probé hosts coincidentes y no coincidentes.
questions.0.points.0: Gateway define listeners y la política de vinculación de rutas.
questions.0.points.1: HTTPRoute describe coincidencias de aplicaciones y backends.
questions.0.prompt: ¿Cómo dividen la responsabilidad Gateway y HTTPRoute?
questions.1.points.0: Verifique ResolvedRefs por separado de Accepted.
questions.1.points.1: Pruebe también el tráfico real; status no es un cuerpo de respuesta.
questions.1.prompt: ¿Puede un Accepted route tener todavía un backend no válido?
stages.0.objectives.0.text: El Gateway `station` usa el GatewayClass privado suministrado y está aceptado para su
  generación actual.
stages.0.objectives.1.text: El HTTPRoute suministrado sirve solo `north.station.internal` mediante el Gateway y
  backend board existentes; un mismo parent acepta la ruta y resuelve sus referencias. Conserva las identidades
  originales de Gateway, HTTPRoute, Service backend y Deployments y las imágenes suministradas; mantén las definiciones
  de listener del Gateway. El controlador previsto debe informar ambas condiciones para un parent solicitado compatible
  con el listener conservado y la generación actual de la ruta según `attachment-contract.json`.
stages.0.objectives.2.text: Desde el Deployment `client`, la URL privada suministrada del gateway con Host `north.station.internal`
  devuelve `north-113`.
stages.0.objectives.3.text: La misma solicitud al gateway privado con Host `closed.station.internal` falla.
diagnostics.class: Gateway puede referenciar otra clase o no poder leer el registro fijado. Compare gatewayClassName de station con la clase privada suministrada. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-gateway-private-class)
diagnostics.accepted: Gateway puede estar rechazado o mostrar aceptación de una generación anterior. Revise Accepted y observedGeneration en el Gateway activo. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-gateway-current-accepted)
diagnostics.parent: La ruta puede apuntar a otro padre o namespace. Revise parentRefs para el Gateway station en el mismo namespace de la ruta. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-route-same-namespace-parent)
diagnostics.hostnames: La ruta puede omitir north.station.internal o exponer otro nombre. Compare el conjunto de nombres distintos con el único host suministrado. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-route-only-allowed-host)
diagnostics.backend_name: Un backend activo puede apuntar a otro Service o namespace, o una regla carecer de referencia de peso positivo. Revise las referencias activas de cada regla al Service board local. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-route-active-backend-service)
diagnostics.backend_port: La ruta puede nombrar el Service correcto mientras sus referencias activas siguen en 8099. Revise cada backend de peso positivo y use el puerto 8080 del Service. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-route-active-backend-port)
diagnostics.parent_accepted: El listener solicitado puede faltar o rechazar la ruta. Busque Accepted=True en las entradas padre y lea el motivo. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-route-parent-acceptance)
diagnostics.parent_resolved: Un padre puede aceptar la ruta sin resolver el Service o puerto backend. Revise ResolvedRefs y corrija la referencia pendiente. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-route-parent-resolved-backends)
diagnostics.parent_both: Accepted y ResolvedRefs pueden ser verdaderos en entradas diferentes. Compruebe ambos a la vez en una sola entrada antes de dar por completo el enlace. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-route-same-parent-conditions)
diagnostics.attachment_identity: Un reemplazo puede alterar el Gateway, la ruta, el Service o el Deployment, o un worker activo usar otra imagen. Compare los UID e imágenes con los registros fijados. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-delivery-objects)
diagnostics.attachment_listener: Editar Gateway para una ruta antigua puede cambiar la lista de listeners. Compare la lista activa completa con la original y restaure la referencia de la ruta a un listener compatible. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-listeners)
diagnostics.attachment_parent: El estado padre puede venir de otro controlador o señalar un listener incompatible. Compare padre solicitado y observado, sección y puerto con el listener HTTP de station y el controlador suministrado. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-matching-controller-listener)
diagnostics.attachment_generation: El padre compatible puede seguir mostrando Accepted o ResolvedRefs obsoletos. Espere ambos True en la entrada del controlador correspondiente a la generación actual de HTTPRoute. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-current-route-generation)
diagnostics.http: El enlace puede figurar activo sin responder o con otro backend. Consulte desde client la URL del Gateway con Host north.station.internal y compare con north-113. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-gateway-allowed-host-http)
diagnostics.wrong: Una regla demasiado amplia puede servir closed.station.internal. Envíe el otro Host por el mismo Gateway y confirme que la petición falle. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-gateway-unmatched-host-http)
diagnostics.probe_0_1: El observador puede detenerse antes de señalar la condición si no lee el directorio, los datos fijados o las herramientas. Revise herramientas y acceso a Gateway y ruta. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q113-gateway-attachment-observer-input)
