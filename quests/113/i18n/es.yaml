title: Vinculación de rutas de Gateway API
brief: "El gateway privado no sirve la ruta requerida. Restaure el enrutamiento aceptado y las respuestas correctas\
  \ al consumidor.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `board.json`, `service.json`,\
  \ `client.json`, `gateway.json`, `route.json`, `gateway-target.json`.\n\n**Requirements:**\n\n- El Gateway `station`\
  \ usa el GatewayClass privado suministrado y está aceptado para su generación actual.\n- HTTPRoute `board` se\
  \ conecta al Gateway `station` solo para `north.station.internal`, reenvía al Service `board` puerto `8080` y\
  \ tiene un padre con `Accepted=True` y `ResolvedRefs=True`.\n- Desde el Deployment `client`, la URL privada suministrada\
  \ del gateway con Host `north.station.internal` devuelve `north-113`.\n- La misma solicitud al gateway privado\
  \ con Host `closed.station.internal` falla.\n\n**Verify yourself before Check & finish:** Ejecute estos comandos\
  \ de observación desde `~/quest` en la estación de trabajo.\n\n- La configuración, identidad y estado cumplen\
  \ los requisitos.\n\n  ```sh\n  kubectl get gateway station -o yaml\n  kubectl get httproute board -o yaml\n \
  \ cat gateway-target.json\n  ```\n\n- El consumidor del gateway recibe `north-113`.\n\n  ```sh\n  url=$(jq -r\
  \ .url gateway-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal'\
  \ \"$url\"\n  ```\n\n- La solicitud con el otro Host falla (salida distinta de cero).\n\n  ```sh\n  url=$(jq -r\
  \ .url gateway-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal'\
  \ \"$url\"\n  ```\n\nUna solicitud fallida por sí sola no demuestra su causa; las comprobaciones no establecen\
  \ qué padre o generación aportó el estado de ruta."
debrief: Selección de controlador dividido GatewayClass, Gateway y HTTPRoute, propiedad de listener y enrutamiento
  de aplicaciones.
stages.0.brief: El gateway privado debe servir el Host requerido y rechazar el otro Host.
hints.0.text: Un puerto backend HTTPRoute se refiere al puerto Service. GatewayClass selecciona un controlador,
  Gateway posee un listener y HTTPRoute adjunta reglas de enrutamiento.
hints.1.text: Accepted y ResolvedRefs responden preguntas diferentes.
hints.2.text: Repare el puerto backend y pruebe el endpoint privado congelado con un Host explícito.
phrases.0: Rastreé el route hasta el puerto Service real.
phrases.1: Inspeccioné las condiciones de aceptación y referencia.
phrases.2: Probé hosts coincidentes y no coincidentes.
questions.0.points.0: Gateway define listeners y la política de vinculación de rutas.
questions.0.points.1: HTTPRoute describe coincidencias de aplicaciones y backends.
questions.0.prompt: ¿Cómo dividen la responsabilidad Gateway y HTTPRoute?
questions.1.points.0: Verifique ResolvedRefs por separado de Accepted.
questions.1.points.1: Pruebe también el tráfico real; status no es un cuerpo de respuesta.
questions.1.prompt: ¿Puede un Accepted route tener todavía un backend no válido?
diagnostics.class: Gateway station debe usar la clase privada proporcionada.
diagnostics.accepted: Gateway station Accepted debe ser True para la generación actual.
diagnostics.parent: httproute/board parentRefs[0].name debe ser igual a station.
diagnostics.hostnames: httproute/board hostnames debe ser igual a [north.station.internal].
diagnostics.backend_name: httproute/board backendRefs[0].name debe ser igual a board.
diagnostics.backend_port: httproute/board backendRefs[0].port debe ser igual a 8080.
diagnostics.parent_accepted: Algún parent de HTTPRoute debe tener Accepted=True.
diagnostics.parent_resolved: Algún parent de HTTPRoute debe tener ResolvedRefs=True.
diagnostics.parent_both: Un mismo parent de HTTPRoute debe tener Accepted=True y ResolvedRefs=True.
diagnostics.http: La petición con Host north.station.internal debe devolver north-113.
diagnostics.wrong: La petición con Host closed.station.internal debe fallar.
