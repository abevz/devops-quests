title: Vinculación de rutas de Gateway API
brief: 'Trabaja en `~/quest` con `board.json`, `service.json`, `client.json`, `gateway.json`, `route.json` y `gateway-target.json`.
  GatewayClass selecciona un controlador, Gateway posee un listener y HTTPRoute adjunta reglas de ruta. Repara HTTPRoute `board`:
  su primer parent debe ser `station`, sus hostnames exactamente `[north.station.internal]` y su primer backend Service `board`
  puerto 8080. Gateway `station` debe usar la clase suministrada y tener `Accepted=True` para su generación actual. Un parent
  de la ruta debe tener tanto `Accepted=True` como `ResolvedRefs=True`. Espera la reconciliación. Desde client, envía Host
  `north.station.internal` a la URL privada de `gateway-target.json` y espera `north-113`; Host `closed.station.internal`
  debe fallar. El fallo no demuestra su causa, y la comprobación no establece qué parent o generación produjo el estado de
  ruta. Usa solo la bahía sin conexión.'
debrief: Selección de controlador dividido GatewayClass, Gateway y HTTPRoute, propiedad de listener y enrutamiento de aplicaciones.
stages.0.brief: La configuración y estados de Gateway y HTTPRoute, la respuesta correcta y el fallo del otro host coinciden
  con la descripción.
stages.0.objectives.0.text: La configuración y estados de Gateway y HTTPRoute, la respuesta correcta y el fallo del otro host
  coinciden con la descripción.
hints.0.text: Un puerto backend HTTPRoute se refiere al puerto Service.
hints.1.text: Accepted y ResolvedRefs responden preguntas diferentes.
hints.2.text: Repare el puerto backend y pruebe el endpoint privado congelado con un Host explícito.
phrases.0: Rastreé el route hasta el puerto Service real.
phrases.1: Inspeccioné las condiciones de aceptación y referencia.
phrases.2: Probé hosts coincidentes y no coincidentes.
questions.0.points.0: Gateway define listeners y la política de vinculación de rutas.
questions.0.points.1: HTTPRoute describe coincidencias de aplicaciones y backends.
questions.0.prompt: ¿Cómo dividen la responsabilidad Gateway y HTTPRoute?
questions.1.points.0: Verifique ResolvedRefs por separado de Accepted.
questions.1.points.1: Pruebe también el tráfico real; status no es un cuerpo de respuesta.
questions.1.prompt: ¿Puede un Accepted route tener todavía un backend no válido?
