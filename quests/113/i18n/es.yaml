  Gateway y backend board existentes; un mismo parent acepta la ruta y resuelve sus referencias.
stages.0.objectives.2.text: Desde el Deployment `client`, la URL privada suministrada del gateway con
  Host `north.station.internal` devuelve `north-113`.
stages.0.objectives.3.text: La misma solicitud al gateway privado con Host `closed.station.internal` falla.
