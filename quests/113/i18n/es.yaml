title: Accesorio Gateway API route
brief: 'Un controlador Traefik privado acepta GatewayClass y HTTP listener de esta bahía en el puerto
  8000. El HTTPRoute nombra un puerto backend Service inexistente como 8099. Repárelo. al puerto 8080
  real board. Mantenga el enlace GatewayClass, el enlace route del mismo espacio de nombres y el host
  north.station.internal suministrados. Inspeccione Accepted y ResolvedRefs, luego pruebe el enrutamiento
  de host coincidente real y otro host rechazado. No se necesitan puertos de host, DNS públicos ni un
  equilibrador de carga externo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`,
  `client.json`, `gateway.json`, `route.json`, `gateway-target.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el Gateway suministrado acepta el route, las referencias se resuelven
  y solo el host previsto devuelve north-113.'
debrief: Selección de controlador dividido GatewayClass, Gateway y HTTPRoute, propiedad de listener y
  enrutamiento de aplicaciones.
stages.0.brief: 'Criterios de éxito: el Gateway suministrado acepta el route, las referencias se resuelven
  y solo el host deseado devuelve north-113.'
stages.0.objectives.0.text: El Gateway suministrado acepta el route, las referencias se resuelven y solo
  el host previsto devuelve north-113.
hints.0.text: Un puerto backend HTTPRoute se refiere al puerto Service.
hints.1.text: Accepted y ResolvedRefs responden preguntas diferentes.
hints.2.text: Repare el puerto backend y pruebe el endpoint privado congelado con un Host explícito.
phrases.0: Rastreé el route hasta el puerto Service real.
phrases.1: Inspeccioné las condiciones de aceptación y referencia.
phrases.2: Probé hosts coincidentes y no coincidentes.
questions.0.points.0: Gateway define la política de archivos adjuntos listeners y route.
questions.0.points.1: HTTPRoute describe coincidencias de aplicaciones y backends.
questions.0.prompt: ¿Cómo dividen la responsabilidad Gateway y HTTPRoute?
questions.1.points.0: Verifique ResolvedRefs por separado de Accepted.
questions.1.points.1: Pruebe también el tráfico real; status no es un cuerpo de respuesta.
questions.1.prompt: ¿Puede un Accepted route tener todavía un backend no válido?
