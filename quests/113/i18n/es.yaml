title: Vinculación de rutas de Gateway API
brief: |-
  El gateway privado no sirve la ruta requerida. Restaure el enrutamiento aceptado y las respuestas correctas al consumidor.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `board.yaml`, `service.yaml`, `client.yaml`, `gateway.yaml`, `route.yaml`, `gateway-target.json`.

  **Requirements:**

  - El Gateway `station` usa el GatewayClass privado suministrado y está aceptado para su generación actual.
  - El HTTPRoute suministrado sirve solo `north.station.internal` mediante el Gateway y backend board existentes; un mismo parent acepta la ruta y resuelve sus referencias.
  - Desde el Deployment `client`, la URL privada suministrada del gateway con Host `north.station.internal` devuelve `north-113`.
  - La misma solicitud al gateway privado con Host `closed.station.internal` falla.

  Una solicitud fallida por sí sola no demuestra su causa; las comprobaciones no establecen qué padre o generación aportó el estado de ruta.
debrief: Selección de controlador dividido GatewayClass, Gateway y HTTPRoute, propiedad de listener y
  enrutamiento de aplicaciones.
stages.0.brief: Usa solo el endpoint privado del gateway suministrado.
hints.0.text: Un puerto backend HTTPRoute se refiere al puerto Service. GatewayClass selecciona un controlador,
  Gateway posee un listener y HTTPRoute adjunta reglas de enrutamiento.
hints.1.text: |-
  Accepted y ResolvedRefs responden preguntas diferentes.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get gateway station -o yaml
    kubectl get httproute board -o yaml
    cat gateway-target.json
  ```
hints.2.text: |-
  Repare el puerto backend y pruebe el endpoint privado congelado con un Host explícito.

  Verifica el resultado desde `~/quest` en la workstation:

  - El consumidor del gateway recibe `north-113`.

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
    ```

  - La solicitud con el otro Host falla (salida distinta de cero).

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"
    ```
phrases.0: Rastreé el route hasta el puerto Service real.
phrases.1: Inspeccioné las condiciones de aceptación y referencia.
phrases.2: Probé hosts coincidentes y no coincidentes.
questions.0.points.0: Gateway define listeners y la política de vinculación de rutas.
questions.0.points.1: HTTPRoute describe coincidencias de aplicaciones y backends.
questions.0.prompt: ¿Cómo dividen la responsabilidad Gateway y HTTPRoute?
questions.1.points.0: Verifique ResolvedRefs por separado de Accepted.
questions.1.points.1: Pruebe también el tráfico real; status no es un cuerpo de respuesta.
questions.1.prompt: ¿Puede un Accepted route tener todavía un backend no válido?
diagnostics.class: Gateway station debe usar la clase privada proporcionada.
diagnostics.accepted: Gateway station Accepted debe ser True para la generación actual.
diagnostics.parent: httproute/board debe vincularse al Gateway station de este namespace.
diagnostics.hostnames: httproute/board debe servir solo north.station.internal.
diagnostics.backend_name: Los backends activos de httproute/board deben usar el Service board de este namespace.
diagnostics.backend_port: Las referencias activas de backend de httproute/board deben usar el puerto 8080.
diagnostics.parent_accepted: Algún parent de HTTPRoute debe tener Accepted=True.
diagnostics.parent_resolved: Algún parent de HTTPRoute debe tener ResolvedRefs=True.
diagnostics.parent_both: Un mismo parent de HTTPRoute debe tener Accepted=True y ResolvedRefs=True.
diagnostics.http: La petición con Host north.station.internal debe devolver north-113.
diagnostics.wrong: La petición con Host closed.station.internal debe fallar.
stages.0.objectives.0.text: El Gateway `station` usa el GatewayClass privado suministrado y está aceptado
  para su generación actual.
