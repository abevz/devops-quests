title: Dołączanie tras Gateway API
brief: "Prywatna brama nie obsługuje wymaganej trasy. Przywróć zaakceptowany routing i prawidłowe odpowiedzi dla\
  \ odbiorcy.\n\nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `board.json`, `service.json`, `client.json`,\
  \ `gateway.json`, `route.json`, `gateway-target.json`.\n\n**Requirements:**\n\n- Gateway `station` używa dostarczonej\
  \ prywatnej GatewayClass i jest zaakceptowany dla bieżącej generacji.\n- HTTPRoute `board` jest podłączony do\
  \ Gateway `station` tylko dla `north.station.internal`, kieruje do Service `board` na port `8080` i ma rodzica\
  \ z `Accepted=True` i `ResolvedRefs=True`.\n- Z Deployment `client` dostarczony prywatny URL bramy z Host `north.station.internal`\
  \ zwraca `north-113`.\n- To samo żądanie do prywatnej bramy z Host `closed.station.internal` kończy się niepowodzeniem.\n\
  \n**Verify yourself before Check & finish:** Wykonaj te polecenia obserwacji z `~/quest` na stacji roboczej.\n\
  \n- Ustawienia, tożsamość i stan odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get gateway station -o yaml\n \
  \ kubectl get httproute board -o yaml\n  cat gateway-target.json\n  ```\n\n- Odbiorca bramy otrzymuje `north-113`.\n\
  \n  ```sh\n  url=$(jq -r .url gateway-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ north.station.internal' \"$url\"\n  ```\n\n- Żądanie z drugim Host kończy się niepowodzeniem (kod różny od zera).\n\
  \n  ```sh\n  url=$(jq -r .url gateway-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ closed.station.internal' \"$url\"\n  ```\n\nSamo nieudane żądanie nie ustala przyczyny; kontrole nie ustalają,\
  \ który rodzic lub generacja dostarczyły stan trasy."
debrief: Wybór rozdzielonego kontrolera GatewayClass, Gateway i HTTPRoute, własność listener i routing aplikacji.
stages.0.brief: Prywatna brama musi obsługiwać wymagany Host i odrzucać drugi Host.
hints.0.text: Port zaplecza HTTPRoute odnosi się do portu Service. GatewayClass wybiera kontroler, Gateway posiada
  nasłuch, a HTTPRoute dołącza reguły routingu.
hints.1.text: Accepted i ResolvedRefs odpowiadają na różne pytania.
hints.2.text: Napraw backend port i przetestuj zamrożony prywatny endpoint z jawnym Host.
phrases.0: Prześledziłem trasę do rzeczywistego portu Service.
phrases.1: Sprawdziłem warunki akceptacji i odniesienia.
phrases.2: Przetestowałem pasujące i niepasujące hosty.
questions.0.points.0: Gateway definiuje listeners i politykę załączników tras.
questions.0.points.1: HTTPRoute opisuje dopasowania aplikacji i backends.
questions.0.prompt: Jak Gateway i HTTPRoute dzielą odpowiedzialność?
questions.1.points.0: Sprawdź ResolvedRefs oddzielnie od Accepted.
questions.1.points.1: Udowodnij także prawdziwy ruch; status nie jest treścią odpowiedzi.
questions.1.prompt: Czy trasa ze stanem Accepted nadal może mieć nieprawidłowy backend?
