title: Dołączanie tras Gateway API
brief: |-
  Prywatny gateway nie obsługuje wymaganej trasy aplikacji. Przywróć zaakceptowane powiązanie, rozwiązane referencje i wymagane odpowiedzi.

  Pracuj na stacji roboczej w `~/quest` z dostarczonymi plikami:
  - `gateway-target.json`.
  - `attachment-contract.json`.

  **Wymagania:**

  - Gateway `station` używa dostarczonej prywatnej GatewayClass i jest zaakceptowany dla bieżącej generacji.
  - Dostarczony HTTPRoute obsługuje tylko `north.station.internal` przez istniejący Gateway i backend board; ten sam parent akceptuje trasę i rozwiązuje jej odwołania. Zachowaj pierwotne tożsamości Gateway, HTTPRoute, Service backend i Deploymentów oraz dostarczone obrazy; nie zmieniaj definicji listenerów Gateway. Właściwy kontroler ma zgłaszać oba warunki dla żądanego parent zgodnego z zachowanym listenerem i bieżącej generacji trasy według `attachment-contract.json`.
  - Z Deployment `client` dostarczony prywatny URL bramy z Host `north.station.internal` zwraca `north-113`.
  - To samo żądanie do prywatnej bramy z Host `closed.station.internal` kończy się niepowodzeniem.

  Kontrole potwierdzają bieżące powiązanie, referencje i ruch, nie historię zmian. Używaj tylko dostarczonego prywatnego endpointu gateway.
debrief: Kontrole porównały zachowane tożsamości routingu i listenery, bieżący kontekst kontrolera/parent/generacji
  oraz rzeczywiste odpowiedzi dla pasującego i zamkniętego Host.
stages.0.brief: Używaj tylko dostarczonego prywatnego endpointu gateway.
hints.0.text: Powiązanie z listenerem i rozwiązanie referencji backend odpowiadają na różne pytania. Warunek może
  dotyczyć innego parent albo starszej generacji; ustal kontekst przed uznaniem go za bieżący stan trasy.
hints.1.text: |-
  Porównaj istniejące listenery Gateway, żądane parent, interfejs Service i bieżące warunki kontrolera:

  ```sh
  cat gateway-target.json
  cat attachment-contract.json
  kubectl get gateway,httproute,service,pods -o yaml
  ```
hints.2.text: |-
  Sprawdź zachowany listener i tożsamości, oba warunki parent dla bieżącej generacji oraz rzeczywisty ruch z pasującym i zamkniętym Host:

  ```sh
  kubectl get gateway station -o yaml
  kubectl get httproute board -o json | jq '{generation:.metadata.generation,parents:.status.parents}'
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  if kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"; then
   printf '%s\n' 'unexpected closed Host response'
  else
   printf '%s\n' 'closed Host denied'
  fi
  ```
phrases.0: Prześledziłem trasę do rzeczywistego portu Service.
phrases.1: Sprawdziłem warunki akceptacji i odniesienia.
phrases.2: Przetestowałem pasujące i niepasujące hosty.
questions.0.points.0: Gateway definiuje listeners i politykę załączników tras.
questions.0.points.1: HTTPRoute opisuje dopasowania aplikacji i backends.
questions.0.prompt: Jak Gateway i HTTPRoute dzielą odpowiedzialność?
questions.1.points.0: Sprawdź ResolvedRefs oddzielnie od Accepted.
questions.1.points.1: Udowodnij także prawdziwy ruch; status nie jest treścią odpowiedzi.
questions.1.prompt: Czy trasa ze stanem Accepted nadal może mieć nieprawidłowy backend?
stages.0.objectives.0.text: Gateway `station` używa dostarczonej prywatnej GatewayClass i jest zaakceptowany dla
  bieżącej generacji.
stages.0.objectives.1.text: Dostarczony HTTPRoute obsługuje tylko `north.station.internal` przez istniejący Gateway
  i backend board; ten sam parent akceptuje trasę i rozwiązuje jej odwołania. Zachowaj pierwotne tożsamości Gateway,
  HTTPRoute, Service backend i Deploymentów oraz dostarczone obrazy; nie zmieniaj definicji listenerów Gateway.
  Właściwy kontroler ma zgłaszać oba warunki dla żądanego parent zgodnego z zachowanym listenerem i bieżącej generacji
  trasy według `attachment-contract.json`.
stages.0.objectives.2.text: Z Deployment `client` dostarczony prywatny URL bramy z Host `north.station.internal`
  zwraca `north-113`.
stages.0.objectives.3.text: To samo żądanie do prywatnej bramy z Host `closed.station.internal` kończy się niepowodzeniem.
diagnostics.class: Gateway może wskazywać klasę innego kontrolera albo zapis jest nieczytelny. Porównaj gatewayClassName w station z podaną prywatną klasą. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-gateway-private-class)
diagnostics.accepted: Gateway mógł zostać odrzucony lub wskazywać akceptację wcześniejszej generacji. Sprawdź Accepted i observedGeneration bieżącego Gateway. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-gateway-current-accepted)
diagnostics.parent: Trasa może wskazywać innego rodzica lub przestrzeń nazw. Sprawdź parentRefs dla Gateway station w tej samej przestrzeni. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-route-same-namespace-parent)
diagnostics.hostnames: Trasa może pomijać north.station.internal lub udostępniać dodatkową nazwę. Porównaj zbiór różnych nazw z jedynym podanym hostem. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-route-only-allowed-host)
diagnostics.backend_name: Aktywny backend może wskazywać inny Service lub przestrzeń, a reguła może nie mieć referencji z dodatnią wagą. Sprawdź aktywne referencje każdej reguły do lokalnego Service board. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-route-active-backend-service)
diagnostics.backend_port: Trasa może wskazywać właściwy Service, ale aktywne referencje nadal używać 8099. Sprawdź każdy backend z dodatnią wagą i użyj portu Service 8080. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-route-active-backend-port)
diagnostics.parent_accepted: Żądany listener może nie istnieć lub odrzucać trasę. Poszukaj Accepted=True we wpisach rodziców i sprawdź przyczynę. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-route-parent-acceptance)
diagnostics.parent_resolved: Rodzic może zaakceptować trasę bez rozwiązania backendu lub portu. Sprawdź ResolvedRefs i popraw nierozwiązaną referencję. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-route-parent-resolved-backends)
diagnostics.parent_both: Accepted i ResolvedRefs mogą być prawdziwe w różnych wpisach. Sprawdź oba jednocześnie w jednym wpisie rodzica. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-route-same-parent-conditions)
diagnostics.attachment_identity: Zastąpienie mogło zmienić Gateway, trasę, Service lub Deployment, a aktualny kontener worker mógł dostać inny obraz. Porównaj UID i obrazy z zamrożonym zapisem. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-delivery-objects)
diagnostics.attachment_listener: Edycja Gateway dla starej trasy mogła zmienić listę listenerów. Porównaj całą bieżącą listę z pierwotną i przywróć referencję trasy do zgodnego listenera. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-listeners)
diagnostics.attachment_parent: Stan rodzica może pochodzić od innego kontrolera albo wskazywać niezgodny listener. Porównaj żądany i obserwowany parentRef, sekcję oraz port z listenerem HTTP station i podanym kontrolerem. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-matching-controller-listener)
diagnostics.attachment_generation: Zgodny rodzic może wskazywać stare Accepted lub ResolvedRefs. Poczekaj na oba True w odpowiednim wpisie kontrolera dla bieżącej generacji HTTPRoute. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-current-route-generation)
diagnostics.http: Zgłoszone podłączenie może nie dawać odpowiedzi lub używać innego backendu. Odpytaj podany URL Gateway z client z Host north.station.internal i porównaj z north-113. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-gateway-allowed-host-http)
diagnostics.wrong: Zbyt szeroka reguła może nadal obsługiwać closed.station.internal. Wyślij inny Host przez ten sam Gateway i potwierdź niepowodzenie żądania. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-gateway-unmatched-host-http)
diagnostics.probe_0_1: Kontrola może zatrzymać się przed wskazaniem warunku, gdy katalog, fakty lub narzędzia są niedostępne. Sprawdź narzędzia i dostęp do Gateway oraz trasy. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q113-gateway-attachment-observer-input)
