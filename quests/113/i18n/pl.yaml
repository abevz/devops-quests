diagnostics.backend_name: httproute/board backendRefs[0].name musi być równe board.
diagnostics.backend_port: httproute/board backendRefs[0].port musi być równe 8080.
diagnostics.parent_accepted: Jakiś parent HTTPRoute musi mieć Accepted=True.
diagnostics.parent_resolved: Jakiś parent HTTPRoute musi mieć ResolvedRefs=True.
diagnostics.parent_both: Jeden parent HTTPRoute musi mieć zarówno Accepted=True, jak i ResolvedRefs=True.
diagnostics.http: Żądanie z Host north.station.internal musi zwrócić north-113.
diagnostics.wrong: Żądanie z Host closed.station.internal musi się nie powieść.
