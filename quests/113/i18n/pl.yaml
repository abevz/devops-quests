title: Dołączanie tras Gateway API
brief: |-
  Prywatna brama nie obsługuje wymaganej trasy. Przywróć zaakceptowany routing i prawidłowe odpowiedzi dla odbiorcy.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `board.yaml`, `service.yaml`, `client.yaml`, `gateway.yaml`, `route.yaml`, `gateway-target.json`.

  **Requirements:**

  - Gateway `station` używa dostarczonej prywatnej GatewayClass i jest zaakceptowany dla bieżącej generacji.
  - Dostarczony HTTPRoute obsługuje tylko `north.station.internal` przez istniejący Gateway i backend board; ten sam parent akceptuje trasę i rozwiązuje jej odwołania.
  - Z Deployment `client` dostarczony prywatny URL bramy z Host `north.station.internal` zwraca `north-113`.
  - To samo żądanie do prywatnej bramy z Host `closed.station.internal` kończy się niepowodzeniem.

  Samo nieudane żądanie nie ustala przyczyny; kontrole nie ustalają, który rodzic lub generacja dostarczyły stan trasy.
debrief: Wybór rozdzielonego kontrolera GatewayClass, Gateway i HTTPRoute, własność listener i routing
  aplikacji.
stages.0.brief: Używaj tylko dostarczonego prywatnego endpointu gateway.
hints.0.text: Port zaplecza HTTPRoute odnosi się do portu Service. GatewayClass wybiera kontroler, Gateway
  posiada nasłuch, a HTTPRoute dołącza reguły routingu.
hints.1.text: |-
  Accepted i ResolvedRefs odpowiadają na różne pytania.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get gateway station -o yaml
    kubectl get httproute board -o yaml
    cat gateway-target.json
  ```
hints.2.text: |-
  Napraw backend port i przetestuj zamrożony prywatny endpoint z jawnym Host.

  Sprawdź wynik z `~/quest` na workstation:

  - Odbiorca bramy otrzymuje `north-113`.

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
    ```

  - Żądanie z drugim Host kończy się niepowodzeniem (kod różny od zera).

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"
    ```
phrases.0: Prześledziłem trasę do rzeczywistego portu Service.
phrases.1: Sprawdziłem warunki akceptacji i odniesienia.
phrases.2: Przetestowałem pasujące i niepasujące hosty.
questions.0.points.0: Gateway definiuje listeners i politykę załączników tras.
questions.0.points.1: HTTPRoute opisuje dopasowania aplikacji i backends.
questions.0.prompt: Jak Gateway i HTTPRoute dzielą odpowiedzialność?
questions.1.points.0: Sprawdź ResolvedRefs oddzielnie od Accepted.
questions.1.points.1: Udowodnij także prawdziwy ruch; status nie jest treścią odpowiedzi.
questions.1.prompt: Czy trasa ze stanem Accepted nadal może mieć nieprawidłowy backend?
