title: Dołączanie tras Gateway API
brief: |-
  Prywatny gateway nie obsługuje wymaganej trasy aplikacji. Przywróć zaakceptowane powiązanie, rozwiązane referencje i wymagane odpowiedzi.

  Pracuj na stacji roboczej w `~/quest` z dostarczonymi plikami:
  - `gateway-target.json`.
  - `attachment-contract.json`.

  **Wymagania:**

  - Gateway `station` używa dostarczonej prywatnej GatewayClass i jest zaakceptowany dla bieżącej generacji.
  - Dostarczony HTTPRoute obsługuje tylko `north.station.internal` przez istniejący Gateway i backend board; ten sam parent akceptuje trasę i rozwiązuje jej odwołania. Zachowaj pierwotne tożsamości Gateway, HTTPRoute, Service backend i Deploymentów oraz dostarczone obrazy; nie zmieniaj definicji listenerów Gateway. Właściwy kontroler ma zgłaszać oba warunki dla żądanego parent zgodnego z zachowanym listenerem i bieżącej generacji trasy według `attachment-contract.json`.
  - Z Deployment `client` dostarczony prywatny URL bramy z Host `north.station.internal` zwraca `north-113`.
  - To samo żądanie do prywatnej bramy z Host `closed.station.internal` kończy się niepowodzeniem.

  Kontrole potwierdzają bieżące powiązanie, referencje i ruch, nie historię zmian. Używaj tylko dostarczonego prywatnego endpointu gateway.
debrief: Kontrole porównały zachowane tożsamości routingu i listenery, bieżący kontekst kontrolera/parent/generacji
  oraz rzeczywiste odpowiedzi dla pasującego i zamkniętego Host.
stages.0.brief: Używaj tylko dostarczonego prywatnego endpointu gateway.
hints.0.text: Powiązanie z listenerem i rozwiązanie referencji backend odpowiadają na różne pytania. Warunek może
  dotyczyć innego parent albo starszej generacji; ustal kontekst przed uznaniem go za bieżący stan trasy.
hints.1.text: |-
  Porównaj istniejące listenery Gateway, żądane parent, interfejs Service i bieżące warunki kontrolera:

  ```sh
  cat gateway-target.json attachment-contract.json
  kubectl get gateway,httproute,service,pods -o yaml
  ```
hints.2.text: |-
  Sprawdź zachowany listener i tożsamości, oba warunki parent dla bieżącej generacji oraz rzeczywisty ruch z pasującym i zamkniętym Host:

  ```sh
  kubectl get gateway station -o yaml
  kubectl get httproute board -o json | jq '{generation:.metadata.generation,parents:.status.parents}'
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  if kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"; then
   printf '%s\n' 'unexpected closed Host response'
  else
   printf '%s\n' 'closed Host denied'
  fi
  ```
phrases.0: Prześledziłem trasę do rzeczywistego portu Service.
phrases.1: Sprawdziłem warunki akceptacji i odniesienia.
phrases.2: Przetestowałem pasujące i niepasujące hosty.
questions.0.points.0: Gateway definiuje listeners i politykę załączników tras.
questions.0.points.1: HTTPRoute opisuje dopasowania aplikacji i backends.
questions.0.prompt: Jak Gateway i HTTPRoute dzielą odpowiedzialność?
questions.1.points.0: Sprawdź ResolvedRefs oddzielnie od Accepted.
questions.1.points.1: Udowodnij także prawdziwy ruch; status nie jest treścią odpowiedzi.
questions.1.prompt: Czy trasa ze stanem Accepted nadal może mieć nieprawidłowy backend?
diagnostics.class: Gateway station musi używać dostarczonej prywatnej klasy.
diagnostics.accepted: Gateway station Accepted musi mieć wartość True dla bieżącej generacji.
diagnostics.parent: httproute/board musi być dołączony do Gateway station w tej przestrzeni nazw.
diagnostics.hostnames: httproute/board musi obsługiwać tylko north.station.internal.
diagnostics.backend_name: Aktywne backendy httproute/board muszą używać Service board w tej przestrzeni nazw.
diagnostics.backend_port: Aktywne odwołania do backendu w httproute/board muszą używać portu 8080.
diagnostics.parent_accepted: Jakiś parent HTTPRoute musi mieć Accepted=True.
diagnostics.parent_resolved: Jakiś parent HTTPRoute musi mieć ResolvedRefs=True.
diagnostics.parent_both: Jeden parent HTTPRoute musi mieć zarówno Accepted=True, jak i ResolvedRefs=True.
diagnostics.http: Żądanie z Host north.station.internal musi zwrócić north-113.
diagnostics.wrong: Żądanie z Host closed.station.internal musi się nie powieść.
