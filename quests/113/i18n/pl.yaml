title: Załącznik trasy Gateway API
brief: 'Prywatny kontroler Traefik akceptuje GatewayClass tej strefy i listener HTTP na porcie 8000. HTTPRoute
  wskazuje nieistniejący port zaplecza Service 8099. Zmień go na rzeczywisty port board 8080. Zachowaj
  dostarczony GatewayClass, powiązanie trasy w tej samej przestrzeni nazw i host north.station.internal.
  Sprawdź Accepted i ResolvedRefs, a następnie potwierdź rzeczywisty routing dla właściwego hosta oraz
  odrzucenie innego hosta. Nie są potrzebne porty hosta, publiczny DNS ani zewnętrzny load balancer.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`,
  `client.json`, `gateway.json`, `route.json`, `gateway-target.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: dostarczony Gateway akceptuje trasę, odniesienia są rozwiązywane i tylko
  zamierzony host zwraca north-113.'
debrief: Wybór rozdzielonego kontrolera GatewayClass, Gateway i HTTPRoute, własność listener i routing
  aplikacji.
