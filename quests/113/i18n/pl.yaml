title: Dołączanie tras Gateway API
brief: 'Pracuj w `~/quest` z `board.json`, `service.json`, `client.json`, `gateway.json`, `route.json` i `gateway-target.json`.
  GatewayClass wybiera kontroler, Gateway udostępnia listener, a HTTPRoute dołącza reguły routingu. Napraw HTTPRoute `board`:
  pierwszy parent to `station`, hostnames to dokładnie `[north.station.internal]`, a pierwszy backend to Service `board` port
  8080. Gateway `station` musi używać dostarczonej klasy i mieć `Accepted=True` dla bieżącej generacji. Jeden parent trasy
  musi mieć jednocześnie `Accepted=True` i `ResolvedRefs=True`. Poczekaj na uzgodnienie. Z Deploymentu client wyślij Host
  `north.station.internal` na prywatny URL z `gateway-target.json` i oczekuj `north-113`; Host `closed.station.internal` musi
  się nie udać. Błąd sam nie dowodzi przyczyny, a kontrola nie ustala, którego parenta lub generacji dotyczy status trasy.
  Używaj tylko zatoki offline.'
debrief: Wybór rozdzielonego kontrolera GatewayClass, Gateway i HTTPRoute, własność listener i routing aplikacji.
stages.0.brief: Ustawienia i stany Gateway i HTTPRoute, właściwa odpowiedź oraz nieudane żądanie innego hosta odpowiadają
  opisowi.
stages.0.objectives.0.text: Ustawienia i stany Gateway i HTTPRoute, właściwa odpowiedź oraz nieudane żądanie innego hosta
  odpowiadają opisowi.
hints.0.text: Port zaplecza HTTPRoute odnosi się do portu Service.
hints.1.text: Accepted i ResolvedRefs odpowiadają na różne pytania.
hints.2.text: Napraw backend port i przetestuj zamrożony prywatny endpoint z jawnym Host.
phrases.0: Prześledziłem trasę do rzeczywistego portu Service.
phrases.1: Sprawdziłem warunki akceptacji i odniesienia.
phrases.2: Przetestowałem pasujące i niepasujące hosty.
questions.0.points.0: Gateway definiuje listeners i politykę załączników tras.
questions.0.points.1: HTTPRoute opisuje dopasowania aplikacji i backends.
questions.0.prompt: Jak Gateway i HTTPRoute dzielą odpowiedzialność?
questions.1.points.0: Sprawdź ResolvedRefs oddzielnie od Accepted.
questions.1.points.1: Udowodnij także prawdziwy ruch; status nie jest treścią odpowiedzi.
questions.1.prompt: Czy trasa ze stanem Accepted nadal może mieć nieprawidłowy backend?
