title: Присоединение маршрута Gateway API
brief: 'Приватный Traefik принимает GatewayClass песочницы и HTTP listener на 8000. HTTPRoute указывает
  несуществующий порт Service 8099. Исправьте его на реальный порт board 8080. Сохраните выданный GatewayClass,
  привязку маршрута в текущем namespace и host north.station.internal. Проверьте Accepted и ResolvedRefs,
  настоящий запрос с нужным Host и отказ для другого. Порты хоста, публичный DNS и внешний балансировщик
  не нужны.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`, `client.json`,
  `gateway.json`, `route.json`, `gateway-target.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Выданный Gateway принимает маршрут, ссылки разрешены, только нужный host возвращает
  north-113.'
debrief: GatewayClass, Gateway и HTTPRoute разделяют выбор контроллера, владение listener и маршрутизацию
  приложения.
stages.0.brief: 'Выданный Gateway принимает маршрут, ссылки разрешены, только нужный host возвращает north-113.


