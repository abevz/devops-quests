  поколения.
stages.0.objectives.1.text: HTTPRoute `board` подключён к Gateway `station` только для `north.station.internal`,
  направляет трафик в Service `board` на порт `8080` и имеет родителя с `Accepted=True` и `ResolvedRefs=True`.
stages.0.objectives.2.text: Из Deployment `client` предоставленный частный URL шлюза с Host `north.station.internal`
  возвращает `north-113`.
stages.0.objectives.3.text: Тот же запрос к частному шлюзу с Host `closed.station.internal` завершается неудачей.
