title: Присоединение маршрута Gateway API
brief: 'Работайте в `~/quest` с `board.json`, `service.json`, `client.json`, `gateway.json`, `route.json` и `gateway-target.json`.
  GatewayClass выбирает контроллер, Gateway владеет listener, а HTTPRoute присоединяет правила маршрутизации. Исправьте HTTPRoute
  `board`: первый parent — `station`, hostnames ровно `[north.station.internal]`, первый backend — Service `board` порт 8080.
  Gateway `station` должен использовать выданный класс и иметь `Accepted=True` для текущего поколения. Один parent маршрута
  должен иметь и `Accepted=True`, и `ResolvedRefs=True`. Дождитесь согласования. Из client отправьте Host `north.station.internal`
  на приватный URL из `gateway-target.json` и ожидайте `north-113`; Host `closed.station.internal` должен завершиться ошибкой.
  Ошибка не доказывает причину, а проверка не устанавливает, какой parent или поколение дали статус маршрута. Используйте
  только офлайн-песочницу.'
debrief: GatewayClass, Gateway и HTTPRoute разделяют выбор контроллера, владение listener и маршрутизацию приложения.
stages.0.brief: Настройки и статусы Gateway и HTTPRoute, правильный ответ и ошибка запроса другого хоста соответствуют описанию.
stages.0.objectives.0.text: Настройки и статусы Gateway и HTTPRoute, правильный ответ и ошибка запроса другого хоста соответствуют
  описанию.
hints.0.text: Backend port HTTPRoute относится к порту Service.
hints.1.text: Accepted и ResolvedRefs отвечают на разные вопросы.
hints.2.text: Исправьте backend port и проверьте сохранённый приватный endpoint с явным Host.
phrases.0: Я проследил маршрут до реального порта Service.
phrases.1: Я проверил условия принятия и разрешения ссылок.
phrases.2: Я проверил подходящий и неподходящий Host.
questions.0.points.0: Gateway задаёт listeners и правила привязки маршрутов.
questions.0.points.1: HTTPRoute описывает условия и backends приложения.
questions.0.prompt: Как Gateway и HTTPRoute разделяют ответственность?
questions.1.points.0: Проверяйте ResolvedRefs отдельно от Accepted.
questions.1.points.1: 'Проверьте настоящий трафик: status не является телом ответа.'
questions.1.prompt: Может ли принятый маршрут иметь неверный backend?
