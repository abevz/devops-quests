title: Присоединение маршрута Gateway API
brief: |-
  Приватный gateway не обслуживает требуемый маршрут приложения. Восстановите принятое подключение, разрешённые ссылки и нужные ответы.

  Работайте на рабочей станции в `~/quest` с предоставленными файлами:
  - `gateway-target.json`.
  - `attachment-contract.json`.

  **Требования:**

  - Gateway `station` использует предоставленный частный GatewayClass и принят для текущего поколения.
  - Предоставленный HTTPRoute обслуживает только `north.station.internal` через существующий Gateway и backend board; один parent принимает маршрут и разрешает его ссылки. Сохраните идентичность исходных Gateway, HTTPRoute, Service backend и Deployment и предоставленные образы; не меняйте определения listener Gateway. Нужный контроллер должен сообщать оба условия для запрошенного родителя, совместимого с сохранённым listener, и текущего поколения маршрута по `attachment-contract.json`.
  - Из Deployment `client` предоставленный частный URL шлюза с Host `north.station.internal` возвращает `north-113`.
  - Тот же запрос к частному шлюзу с Host `closed.station.internal` завершается неудачей.

  Проверки подтверждают текущее подключение, ссылки и трафик, но не историю исправлений. Используйте только предоставленный приватный endpoint gateway.
debrief: Проверки сравнили идентичность маршрутизации и listener, текущий контекст контроллера, родителя и поколения,
  а также реальные ответы для подходящего и закрытого Host.
stages.0.brief: Используйте только предоставленный частный endpoint gateway.
hints.0.text: Подключение к listener и разрешение ссылок backend отвечают на разные вопросы. Условие может относиться
  к другому родителю или старому поколению; установите контекст, прежде чем считать его признаком текущего здоровья
  маршрута.
hints.1.text: |-
  Сопоставьте существующие listener Gateway, запрошенных родителей, интерфейс Service и текущие условия контроллера:

  ```sh
  cat gateway-target.json attachment-contract.json
  kubectl get gateway,httproute,service,pods -o yaml
  ```
hints.2.text: |-
  Проверьте сохранённые listener и идентичность, оба условия родителя для текущего поколения и реальный трафик с подходящим и закрытым Host:

  ```sh
  kubectl get gateway station -o yaml
  kubectl get httproute board -o json | jq '{generation:.metadata.generation,parents:.status.parents}'
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  if kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"; then
   printf '%s\n' 'unexpected closed Host response'
  else
   printf '%s\n' 'closed Host denied'
  fi
  ```
phrases.0: Я проследил маршрут до реального порта Service.
phrases.1: Я проверил условия принятия и разрешения ссылок.
phrases.2: Я проверил подходящий и неподходящий Host.
questions.0.points.0: Gateway задаёт listeners и правила привязки маршрутов.
questions.0.points.1: HTTPRoute описывает условия и backends приложения.
questions.0.prompt: Как Gateway и HTTPRoute разделяют ответственность?
questions.1.points.0: Проверяйте ResolvedRefs отдельно от Accepted.
questions.1.points.1: 'Проверьте настоящий трафик: status не является телом ответа.'
questions.1.prompt: Может ли принятый маршрут иметь неверный backend?
stages.0.objectives.0.text: Gateway `station` использует предоставленный частный GatewayClass и принят для текущего
  поколения.
stages.0.objectives.1.text: Предоставленный HTTPRoute обслуживает только `north.station.internal` через существующий
  Gateway и backend board; один parent принимает маршрут и разрешает его ссылки. Сохраните идентичность исходных
  Gateway, HTTPRoute, Service backend и Deployment и предоставленные образы; не меняйте определения listener Gateway.
  Нужный контроллер должен сообщать оба условия для запрошенного родителя, совместимого с сохранённым listener,
  и текущего поколения маршрута по `attachment-contract.json`.
stages.0.objectives.2.text: Из Deployment `client` предоставленный частный URL шлюза с Host `north.station.internal`
  возвращает `north-113`.
stages.0.objectives.3.text: Тот же запрос к частному шлюзу с Host `closed.station.internal` завершается неудачей.
diagnostics.class: Gateway мог ссылаться на класс другого контроллера либо не читается исходная запись. Сравните gatewayClassName у station с выданным приватным классом. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-gateway-private-class)
diagnostics.accepted: Gateway мог быть отклонён или показывать принятие прежнего поколения. Проверьте Accepted и observedGeneration у действующего Gateway. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-gateway-current-accepted)
diagnostics.parent: Route мог ссылаться на другого родителя или namespace. Проверьте parentRefs на Gateway station в том же namespace, что и route. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-route-same-namespace-parent)
diagnostics.hostnames: Route мог пропустить north.station.internal или добавить другое имя. Сравните набор уникальных имён с единственным выданным хостом. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-route-only-allowed-host)
diagnostics.backend_name: Активный backend мог ссылаться на другой Service или namespace, либо в правиле нет ссылки с положительным весом. Проверьте активные ссылки каждого правила на местный Service board. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-route-active-backend-service)
diagnostics.backend_port: Route может указывать верный Service, пока активные ссылки используют 8099. Проверьте все backend с положительным весом и укажите порт Service 8080. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-route-active-backend-port)
diagnostics.parent_accepted: Запрошенный listener мог отсутствовать или не принимать route. Найдите Accepted=True в записях родителей и прочитайте reason. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-route-parent-acceptance)
diagnostics.parent_resolved: Родитель мог принять route, не разрешив backend Service или порт. Проверьте ResolvedRefs и исправьте ссылку, которую контроллер не нашёл. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-route-parent-resolved-backends)
diagnostics.parent_both: Accepted и ResolvedRefs могут быть истинны в разных записях родителей. Проверьте оба значения на одной записи, прежде чем считать подключение завершённым. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-route-same-parent-conditions)
diagnostics.attachment_identity: Замена могла изменить идентификатор Gateway, route, Service или Deployment, а текущий worker мог получить другой образ. Сверьте UID и образы с зафиксированными записями. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-delivery-objects)
diagnostics.attachment_listener: Правка Gateway для устаревшего route могла изменить выданный список listeners. Сравните весь текущий список с исходным и восстановите ссылку route на совместимый listener. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-preserved-gateway-listeners)
diagnostics.attachment_parent: Статус родителя мог относиться к другому контроллеру или несовместимому listener. Сравните запрошенный и наблюдаемый parentRef, section и port с HTTP-listener station и выданным контроллером. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-matching-controller-listener)
diagnostics.attachment_generation: Совместимый родитель мог сохранить старые Accepted или ResolvedRefs. Дождитесь обоих True в записи нужного контроллера для текущего поколения HTTPRoute. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-current-route-generation)
diagnostics.http: Даже при статусе подключения может отсутствовать ответ либо работать другой backend. Запросите выданный URL Gateway из client с Host north.station.internal и сравните с north-113. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-gateway-allowed-host-http)
diagnostics.wrong: Слишком широкое правило могло обслуживать closed.station.internal. Отправьте другой Host через тот же Gateway и проверьте отказ запроса. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-gateway-unmatched-host-http)
diagnostics.probe_0_1: Проверка может остановиться до определения условия, если недоступны рабочий каталог, зафиксированные факты или инструменты. Проверьте инструменты и доступ к Gateway и route. [Причина и проверка](guides#guide=autoscaling-gateway&section=q113-gateway-attachment-observer-input)
