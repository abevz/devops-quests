title: Присоединение маршрута Gateway API
brief: |-
  Частный шлюз не обслуживает требуемый маршрут. Восстановите принятую маршрутизацию и правильные ответы потребителю.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `board.yaml`, `service.yaml`, `client.yaml`, `gateway.yaml`, `route.yaml`, `gateway-target.json`.

  **Requirements:**

  - Gateway `station` использует предоставленный частный GatewayClass и принят для текущего поколения.
  - Предоставленный HTTPRoute обслуживает только `north.station.internal` через существующий Gateway и backend board; один parent принимает маршрут и разрешает его ссылки.
  - Из Deployment `client` предоставленный частный URL шлюза с Host `north.station.internal` возвращает `north-113`.
  - Тот же запрос к частному шлюзу с Host `closed.station.internal` завершается неудачей.

  Один неудачный запрос не устанавливает причину; проверки не устанавливают, какой родитель или поколение дали состояние маршрута.
debrief: GatewayClass, Gateway и HTTPRoute разделяют выбор контроллера, владение listener и маршрутизацию
  приложения.
stages.0.brief: Используйте только предоставленный частный endpoint gateway.
hints.0.text: Backend port HTTPRoute относится к порту Service. GatewayClass выбирает контроллер, Gateway
  владеет слушателем, HTTPRoute подключает правила маршрутизации.
hints.1.text: |-
  Accepted и ResolvedRefs отвечают на разные вопросы.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get gateway station -o yaml
    kubectl get httproute board -o yaml
    cat gateway-target.json
  ```
hints.2.text: |-
  Исправьте backend port и проверьте сохранённый приватный endpoint с явным Host.

  Проверьте результат из `~/quest` на workstation:

  - Потребитель шлюза получает `north-113`.

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
    ```

  - Запрос с другим Host завершается неудачей (ненулевой код).

    ```sh
    url=$(jq -r .url gateway-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: closed.station.internal' "$url"
    ```
phrases.0: Я проследил маршрут до реального порта Service.
phrases.1: Я проверил условия принятия и разрешения ссылок.
phrases.2: Я проверил подходящий и неподходящий Host.
questions.0.points.0: Gateway задаёт listeners и правила привязки маршрутов.
questions.0.points.1: HTTPRoute описывает условия и backends приложения.
questions.0.prompt: Как Gateway и HTTPRoute разделяют ответственность?
questions.1.points.0: Проверяйте ResolvedRefs отдельно от Accepted.
questions.1.points.1: 'Проверьте настоящий трафик: status не является телом ответа.'
questions.1.prompt: Может ли принятый маршрут иметь неверный backend?
diagnostics.class: Gateway station должен использовать выданный приватный класс.
diagnostics.accepted: Gateway station Accepted должен быть True для текущего поколения.
diagnostics.parent: httproute/board parentRefs[0].name должен совпадать с station.
diagnostics.hostnames: httproute/board hostnames должен совпадать с [north.station.internal].
diagnostics.backend_name: httproute/board backendRefs[0].name должен совпадать с board.
diagnostics.backend_port: httproute/board backendRefs[0].port должен совпадать с 8080.
diagnostics.parent_accepted: У некоторого parent HTTPRoute должно быть Accepted=True.
diagnostics.parent_resolved: У некоторого parent HTTPRoute должно быть ResolvedRefs=True.
diagnostics.parent_both: У одного parent HTTPRoute должны быть одновременно Accepted=True и ResolvedRefs=True.
diagnostics.http: Запрос с Host north.station.internal должен вернуть north-113.
diagnostics.wrong: Запрос с Host closed.station.internal должен завершиться ошибкой.
