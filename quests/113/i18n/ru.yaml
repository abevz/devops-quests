title: Присоединение маршрута Gateway API
brief: "Частный шлюз не обслуживает требуемый маршрут. Восстановите принятую маршрутизацию и правильные ответы потребителю.\n\
  \nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы: `board.yaml`, `service.yaml`, `client.yaml`,\
  \ `gateway.yaml`, `route.yaml`, `gateway-target.json`.\n\n**Requirements:**\n\n- Gateway `station` использует\
  \ предоставленный частный GatewayClass и принят для текущего поколения.\n- HTTPRoute `board` подключён к Gateway\
  \ `station` только для `north.station.internal`, направляет трафик в Service `board` на порт `8080` и имеет родителя\
  \ с `Accepted=True` и `ResolvedRefs=True`.\n- Из Deployment `client` предоставленный частный URL шлюза с Host\
  \ `north.station.internal` возвращает `north-113`.\n- Тот же запрос к частному шлюзу с Host `closed.station.internal`\
  \ завершается неудачей.\n\n**Verify yourself before Check & finish:** Выполните эти команды наблюдения из `~/quest`\
  \ на рабочей станции.\n\n- Настройки, идентичность и состояние соответствуют требованиям.\n\n  ```sh\n  kubectl\
  \ get gateway station -o yaml\n  kubectl get httproute board -o yaml\n  cat gateway-target.json\n  ```\n\n- Потребитель\
  \ шлюза получает `north-113`.\n\n  ```sh\n  url=$(jq -r .url gateway-target.json)\n  kubectl exec deployment/client\
  \ -- wget -qO- -T 3 --header='Host: north.station.internal' \"$url\"\n  ```\n\n- Запрос с другим Host завершается\
  \ неудачей (ненулевой код).\n\n  ```sh\n  url=$(jq -r .url gateway-target.json)\n  kubectl exec deployment/client\
  \ -- wget -qO- -T 3 --header='Host: closed.station.internal' \"$url\"\n  ```\n\nОдин неудачный запрос не устанавливает\
  \ причину; проверки не устанавливают, какой родитель или поколение дали состояние маршрута."
debrief: GatewayClass, Gateway и HTTPRoute разделяют выбор контроллера, владение listener и маршрутизацию приложения.
stages.0.brief: Частный шлюз должен обслуживать требуемый Host и отклонять другой Host.
hints.0.text: Backend port HTTPRoute относится к порту Service. GatewayClass выбирает контроллер, Gateway владеет
  слушателем, HTTPRoute подключает правила маршрутизации.
hints.1.text: Accepted и ResolvedRefs отвечают на разные вопросы.
hints.2.text: Исправьте backend port и проверьте сохранённый приватный endpoint с явным Host.
phrases.0: Я проследил маршрут до реального порта Service.
phrases.1: Я проверил условия принятия и разрешения ссылок.
phrases.2: Я проверил подходящий и неподходящий Host.
questions.0.points.0: Gateway задаёт listeners и правила привязки маршрутов.
questions.0.points.1: HTTPRoute описывает условия и backends приложения.
questions.0.prompt: Как Gateway и HTTPRoute разделяют ответственность?
questions.1.points.0: Проверяйте ResolvedRefs отдельно от Accepted.
questions.1.points.1: 'Проверьте настоящий трафик: status не является телом ответа.'
questions.1.prompt: Может ли принятый маршрут иметь неверный backend?
diagnostics.class: Gateway station должен использовать выданный приватный класс.
diagnostics.accepted: Gateway station Accepted должен быть True для текущего поколения.
diagnostics.parent: httproute/board parentRefs[0].name должен совпадать с station.
diagnostics.hostnames: httproute/board hostnames должен совпадать с [north.station.internal].
diagnostics.backend_name: httproute/board backendRefs[0].name должен совпадать с board.
diagnostics.backend_port: httproute/board backendRefs[0].port должен совпадать с 8080.
diagnostics.parent_accepted: У некоторого parent HTTPRoute должно быть Accepted=True.
diagnostics.parent_resolved: У некоторого parent HTTPRoute должно быть ResolvedRefs=True.
diagnostics.parent_both: У одного parent HTTPRoute должны быть одновременно Accepted=True и ResolvedRefs=True.
diagnostics.http: Запрос с Host north.station.internal должен вернуть north-113.
diagnostics.wrong: Запрос с Host closed.station.internal должен завершиться ошибкой.
