title: Validation and typed input
brief: 'You joined SignalRail operations. Reject an unsafe replica count and apply a safe one. Work in
  ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`, `terraform.tfvars`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Count 2 is live; 0, 4 and 1.5 fail validation.'
stages.0.brief: 'Accept exactly integer counts 1..3. Apply replicas=2. A fractional count must be rejected
  too.


  Success criteria: Count 2 is live; 0, 4 and 1.5 fail validation.'
stages.0.objectives.0.text: Count 2 is live; 0, 4 and 1.5 fail validation.
hints.0.text: Inspect the variable type and validation separately.
hints.1.text: A number type also admits fractions; test 0, 4 and 1.5.
hints.2.text: Require bounds 1..3 and floor(value)==value, apply 2 and verify invalid plans fail.
debrief: The validation admitted unsafe replica counts. You required an integer from 1 to 3, applied 2,
  and proved 0, 4 and 1.5 were rejected.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
