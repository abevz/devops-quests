title: Validation and typed input
brief: |
  Replica requests must stay within the safe operating range. The managed result must retain the supplied safe count.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`.

  **Requirements:**
  - Plans reject these `replicas` values:
    - `0`, `4`, `1.5`
  - Files in `~/quest` on the workstation:
    - `replicas.txt`: `2`
  - For `replicas=2`, `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - All three plans must reject the requested count.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Expected: the managed replica count is `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Expected: no changes, exit code `0`.
stages.0.brief: |
  Keep the safe replica count and reject out-of-range or fractional requests.
stages.0.objectives.0.text: Plans reject `replicas` values `0`, `4` and `1.5`.
stages.0.objectives.1.text: '`replicas.txt` contains `2`.'
stages.0.objectives.2.text: '`tofu plan` for `replicas=2` exits 0 with no changes.'
hints.0.text: Inspect the variable type and validation separately.
hints.1.text: A number type also admits fractions; test 0, 4 and 1.5.
hints.2.text: Require bounds 1..3 and floor(value)==value, apply 2 and verify invalid plans fail.
debrief: The validation admitted unsafe replica counts. You required an integer from 1 to 3, applied 2,
  and proved 0, 4 and 1.5 were rejected.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
