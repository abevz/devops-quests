title: Validation and typed input
brief: |-
  Unsafe replica requests are being accepted. The managed result must use the agreed safe count.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`, `capacity-contract.json`.

  **Requirements:**
  - Plans reject these `replicas` values:
    - `0`, `4`, `1.5`
  - Files in `~/quest` on the workstation:
    - `replicas.txt`: `2`
  - With replica count `2`, OpenTofu reports no pending infrastructure changes.

  - The supplied `capacity-contract.json` defines valid request shapes and capacity limits. Accept valid cases as well as rejecting invalid ones; replica demand cannot exceed the available pool capacity.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: Keep the safe replica count and reject out-of-range or fractional requests.
stages.0.objectives.0.text: Valid replica and pool requests must plan, and unsafe requests must be rejected
  according to `capacity-contract.json`, including replica values `0`, `4` and `1.5`.
stages.0.objectives.1.text: '`replicas.txt` contains `2`.'
stages.0.objectives.2.text: With replica count `2`, OpenTofu reports no pending infrastructure changes.
hints.0.text: Types describe shape; validation also relates numeric limits to the capacity actually requested.
hints.1.text: |-
  Compare both input declarations and the supplied contract. Observe plans for valid and invalid request shapes before changing the validators.

  ```sh
  cat main.tf terraform.tfvars capacity-contract.json
  tofu validate
  ```
hints.2.text: |-
  Construct the typed pool contract and integer/count/capacity validation, apply the supplied safe request, then verify all accepted and rejected cases and an empty final plan.

  - `cat replicas.txt`
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2`

  ```sh
  tofu plan -input=false -no-color -var=replicas=0
  tofu plan -input=false -no-color -var=replicas=4
  tofu plan -input=false -no-color -var=replicas=1.5
  cat capacity-contract.json
  cat replicas.txt
  tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2
  ```
debrief: Valid replica and pool requests must plan, and unsafe requests must be rejected according to
  `capacity-contract.json`, including replica values `0`, `4` and `1.5`.
