title: Validation and typed input
brief: |-
  Unsafe replica requests are being accepted. The managed result must use the agreed safe count.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`.

  **Requirements:**
  - Plans reject these `replicas` values:
    - `0`, `4`, `1.5`
  - Files in `~/quest` on the workstation:
    - `replicas.txt`: `2`
  - With replica count `2`, OpenTofu reports no pending infrastructure changes.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: Keep the safe replica count and reject out-of-range or fractional requests.
stages.0.objectives.0.text: Plans reject `replicas` values `0`, `4` and `1.5`.
stages.0.objectives.1.text: '`replicas.txt` contains `2`.'
stages.0.objectives.2.text: With replica count `2`, OpenTofu reports no pending infrastructure changes.
hints.0.text: Numeric types admit fractions; validation determines which requests are acceptable.
hints.1.text: |-
  Inspect the variable type and its `validation` block separately. The `number` type also admits fractional values; test `0`, `4` and `1.5`.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf terraform.tfvars
  ```
hints.2.text: |-
  Require the bounds 1..3 and `floor(var.replicas) == var.replicas`, apply the configuration with count 2, and verify that invalid plans fail.

  Verify the result from `~/quest` on the workstation:

  Run these observation commands from `~/quest` on the workstation.
  - All three plans must reject the requested count.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Expected: the managed replica count is `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Expected: no changes, exit code `0`.
debrief: The validation admitted unsafe replica counts. You required an integer from 1 to 3, applied 2,
  and proved 0, 4 and 1.5 were rejected.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
