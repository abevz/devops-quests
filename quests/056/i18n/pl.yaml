title: Validation i wpisane dane wejściowe
brief: |
  Żądania liczby replik mają mieścić się w bezpiecznym zakresie. Zarządzany wynik ma zachować dostarczoną bezpieczną liczbę.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `terraform.tfvars`.

  **Wymagania:**
  - Plany odrzucają następujące wartości `replicas`:
    - `0`, `4`, `1.5`
  - Pliki w `~/quest` na workstation:
    - `replicas.txt`: `2`
  - Dla `replicas=2` polecenie `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - Wszystkie trzy plany mają odrzucić żądaną liczbę.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Oczekiwane: zarządzana liczba replik wynosi `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Oczekiwane: brak zmian i kod zakończenia `0`.
stages.0.brief: |
  Zachowaj bezpieczną liczbę replik i odrzucaj ułamki oraz żądania poza zakresem.
stages.0.objectives.0.text: Plany odrzucają wartości `replicas` `0`, `4` i `1.5`.
stages.0.objectives.1.text: '`replicas.txt` zawiera `2`.'
stages.0.objectives.2.text: '`tofu plan` dla `replicas=2` kończy się kodem 0 bez zmian.'
hints.0.text: Sprawdź oddzielnie typ zmiennej i validation.
hints.1.text: Typ number dopuszcza również ułamki; test 0, 4 i 1,5.
hints.2.text: Wymagaj granic 1..3 i floor(value)==value, zastosuj 2 i sprawdź, czy nieprawidłowe plany
  zawiodły.
debrief: Weryfikacja potwierdziła liczbę niebezpiecznych replik. Wymagałeś liczby całkowitej od 1 do 3,
  zastosowałeś 2 i udowodniłeś, że 0, 4 i 1,5 zostały odrzucone.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
