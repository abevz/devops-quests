title: Validation i wpisane dane wejściowe
brief: |-
  Przyjmowane są niebezpieczne żądania liczby replik. Zarządzany wynik musi używać uzgodnionej bezpiecznej liczby.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `terraform.tfvars`, `capacity-contract.json`.

  **Wymagania:**
  - Plany odrzucają następujące wartości `replicas`:
    - `0`, `4`, `1.5`
  - Pliki w `~/quest` na workstation:
    - `replicas.txt`: `2`
  - Przy liczbie replik `2` OpenTofu nie zgłasza oczekujących zmian infrastruktury.

  - Dostarczony `capacity-contract.json` określa poprawne kształty żądań i limity pojemności. Poprawne przypadki muszą być przyjmowane, a błędne odrzucane; liczba replik nie może przekraczać dostępnej pojemności pool.

  Sprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania.
stages.0.brief: Zachowaj bezpieczną liczbę replik i odrzucaj ułamki oraz żądania poza zakresem.
stages.0.objectives.0.text: Poprawne żądania replicas i pool muszą dawać plan, a niebezpieczne być odrzucane
  zgodnie z `capacity-contract.json`, w tym replicas `0`, `4` i `1.5`.
stages.0.objectives.1.text: '`replicas.txt` zawiera `2`.'
stages.0.objectives.2.text: Przy liczbie replik `2` OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Typy opisują strukturę; walidacja wiąże też limity liczbowe z rzeczywiście żądaną pojemnością.
hints.1.text: |-
  Porównaj obie deklaracje wejścia i dostarczony kontrakt. Obserwuj plany poprawnych i błędnych kształtów żądań przed zmianą walidatorów.

  ```sh
  cat main.tf terraform.tfvars capacity-contract.json
  tofu validate
  ```
hints.2.text: |-
  Zbuduj typowany kontrakt pool oraz walidację liczb całkowitych, zakresu i pojemności, zastosuj dostarczone bezpieczne żądanie, a następnie sprawdź wszystkie poprawne i błędne przypadki oraz końcowy pusty plan.

  - `cat replicas.txt`
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2`

  ```sh
  tofu plan -input=false -no-color -var=replicas=0
  tofu plan -input=false -no-color -var=replicas=4
  tofu plan -input=false -no-color -var=replicas=1.5
  cat capacity-contract.json
  cat replicas.txt
  tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2
  ```
debrief: Poprawne żądania replicas i pool muszą dawać plan, a niebezpieczne być odrzucane zgodnie z `capacity-contract.json`,
  w tym replicas `0`, `4` i `1.5`.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.capacity_contract: Poprawne żądania muszą dawać plan, a niebezpieczne muszą być odrzucane
  przez kontrakt pojemności.
