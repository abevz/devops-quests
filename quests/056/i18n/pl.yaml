title: Validation i wpisane dane wejściowe
brief: 'Dołączyłeś do operacji SignalRail. Odrzuć niebezpieczną liczbę replik i zastosuj bezpieczną. Pracuj
  w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`, `terraform.tfvars`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Liczba 2 jest aktywna; 0, 4 i 1.5 nie sprawdzają poprawności.'
stages.0.brief: 'Zaakceptuj dokładnie liczby całkowite 1..3. Zastosuj replicas=2. Liczenie ułamkowe również
  należy odrzucić.


  Kryteria sukcesu: Liczba 2 jest aktywna; 0, 4 i 1.5 nie sprawdzają poprawności.'
stages.0.objectives.0.text: Liczba 2 jest na żywo; 0, 4 i 1.5 nie sprawdzają poprawności.
hints.0.text: Sprawdź oddzielnie typ zmiennej i validation.
hints.1.text: Typ number dopuszcza również ułamki; test 0, 4 i 1,5.
hints.2.text: Wymagaj granic 1..3 i floor(value)==value, zastosuj 2 i sprawdź, czy nieprawidłowe plany
  zawiodły.
debrief: Weryfikacja potwierdziła liczbę niebezpiecznych replik. Wymagałeś liczby całkowitej od 1 do 3,
  zastosowałeś 2 i udowodniłeś, że 0, 4 i 1,5 zostały odrzucone.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
