title: Validation и типы
brief: |-
  Небезопасные запросы числа реплик принимаются. Управляемый результат должен использовать согласованное безопасное число.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `terraform.tfvars`.

  **Требования:**
  - Планы отклоняют следующие значения `replicas`:
    - `0`, `4`, `1.5`
  - Файлы в `~/quest` на workstation:
    - `replicas.txt`: `2`
  - При числе реплик `2` OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Сохраните безопасное число реплик и отклоняйте дробные запросы и значения вне диапазона.
stages.0.objectives.0.text: Планы отклоняют значения `replicas` `0`, `4` и `1.5`.
stages.0.objectives.1.text: '`replicas.txt` содержит `2`.'
stages.0.objectives.2.text: При числе реплик `2` OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.
hints.0.text: Числовые типы допускают дроби; валидация определяет допустимые запросы.
hints.1.text: |-
  Изучите тип переменной и её блок `validation` по отдельности. Тип `number` допускает дробные значения; проверьте `0`, `4` и `1.5`.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf terraform.tfvars
  ```
hints.2.text: |-
  Ограничьте значение диапазоном 1..3 и условием `floor(var.replicas) == var.replicas`, примените конфигурацию с числом реплик 2 и проверьте, что планы с недопустимыми значениями отклоняются.

  Проверьте результат из `~/quest` на workstation:

  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - Все три плана должны отклонить запрошенное число.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Ожидается управляемое число реплик `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Validation пропускала опасные значения. Вы разрешили целые 1–3, применили 2 и подтвердили отказ
  для 0, 4 и 1.5.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
