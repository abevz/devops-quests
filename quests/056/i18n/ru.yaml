title: Validation и типы
brief: |
  Запросы числа реплик должны оставаться в безопасных пределах. Управляемый результат должен сохранять исходное безопасное число.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `terraform.tfvars`.

  **Требования:**
  - Планы отклоняют следующие значения `replicas`:
    - `0`, `4`, `1.5`
  - Файлы в `~/quest` на workstation:
    - `replicas.txt`: `2`
  - При `replicas=2` команда `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - Все три плана должны отклонить запрошенное число.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Ожидается управляемое число реплик `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Ожидаются отсутствие изменений и код завершения `0`.
stages.0.brief: |
  Сохраните безопасное число реплик и отклоняйте дробные запросы и значения вне диапазона.
stages.0.objectives.0.text: Plan отклоняет значения `replicas` `0`, `4` и `1.5`.
stages.0.objectives.1.text: '`replicas.txt` содержит `2`.'
stages.0.objectives.2.text: '`tofu plan` для `replicas=2` завершается с кодом 0 без изменений.'
hints.0.text: Проверьте тип переменной отдельно от validation.
hints.1.text: Тип number допускает дроби; проверьте 0, 4 и 1.5.
hints.2.text: Проверьте границы 1..3 и floor(value)==value, примените 2 и убедитесь, что неверные plan
  отклоняются.
debrief: Validation пропускала опасные значения. Вы разрешили целые 1–3, применили 2 и подтвердили отказ
  для 0, 4 и 1.5.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
