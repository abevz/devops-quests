title: Validation и типы
brief: 'Вы в команде эксплуатации SignalRail. Отклоните опасное число реплик. Работайте в ~/quest. Все
  изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`, `terraform.tfvars`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Применено 2; значения 0, 4 и 1.5 отклоняются.'
stages.0.brief: 'Разрешите только целые 1..3. Примените replicas=2; дроби отклоняйте.


  Результат проверки: Применено 2; значения 0, 4 и 1.5 отклоняются.'
stages.0.objectives.0.text: Применено 2; значения 0, 4 и 1.5 отклоняются.
hints.0.text: Проверьте тип переменной отдельно от validation.
hints.1.text: Тип number допускает дроби; проверьте 0, 4 и 1.5.
hints.2.text: Проверьте границы 1..3 и floor(value)==value, примените 2 и убедитесь, что неверные plan
  отклоняются.
debrief: Validation пропускала опасные значения. Вы разрешили целые 1–3, применили 2 и подтвердили отказ
  для 0, 4 и 1.5.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
