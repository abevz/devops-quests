title: Validation и типы
brief: |-
  Небезопасные запросы числа реплик принимаются. Управляемый результат должен использовать согласованное безопасное число.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `terraform.tfvars`, `capacity-contract.json`.

  **Требования:**
  - Планы отклоняют следующие значения `replicas`:
    - `0`, `4`, `1.5`
  - Файлы в `~/quest` на workstation:
    - `replicas.txt`: `2`
  - При числе реплик `2` OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.

  - Выданный `capacity-contract.json` определяет допустимую структуру запросов и ограничения ёмкости. Корректные варианты должны приниматься, а некорректные — отклоняться; число реплик не может превышать доступную ёмкость pool.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Сохраните безопасное число реплик и отклоняйте дробные запросы и значения вне диапазона.
stages.0.objectives.0.text: Допустимые запросы replicas и pool должны давать план, а небезопасные — отклоняться
  по `capacity-contract.json`, включая значения replicas `0`, `4` и `1.5`.
stages.0.objectives.1.text: '`replicas.txt` содержит `2`.'
stages.0.objectives.2.text: При числе реплик `2` OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.
hints.0.text: Типы описывают структуру; validation также связывает числовые ограничения с реально запрошенной
  ёмкостью.
hints.1.text: |-
  Сравните объявления обоих входов и выданный контракт. Изучите планы допустимых и ошибочных запросов до изменения validators.

  ```sh
  cat main.tf terraform.tfvars capacity-contract.json
  tofu validate
  ```
hints.2.text: |-
  Постройте типизированный контракт pool и проверки целого числа, диапазона и ёмкости, примените выданный безопасный запрос, затем проверьте все допустимые и недопустимые варианты и пустой итоговый план.

  - `cat replicas.txt`
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2`

  ```sh
  tofu plan -input=false -no-color -var=replicas=0
  tofu plan -input=false -no-color -var=replicas=4
  tofu plan -input=false -no-color -var=replicas=1.5
  cat capacity-contract.json
  cat replicas.txt
  tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2
  ```
debrief: Допустимые запросы replicas и pool должны давать план, а небезопасные — отклоняться по `capacity-contract.json`,
  включая значения replicas `0`, `4` и `1.5`.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
