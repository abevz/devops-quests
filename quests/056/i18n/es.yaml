title: Validation y entrada escrita
brief: |
  Las solicitudes de réplicas deben mantenerse dentro del rango seguro. El resultado gestionado debe conservar la cantidad segura suministrada.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `terraform.tfvars`.

  **Requisitos:**
  - Los planes rechazan estos valores de `replicas`:
    - `0`, `4`, `1.5`
  - Archivos en `~/quest` en la workstation:
    - `replicas.txt`: `2`
  - Con `replicas=2`, `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - Los tres planes deben rechazar la cantidad solicitada.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Se espera que la cantidad gestionada de réplicas sea `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Se esperan ausencia de cambios y código de salida `0`.
stages.0.brief: |
  Conserva la cantidad segura de réplicas y rechaza fracciones y solicitudes fuera del rango.
stages.0.objectives.0.text: Los planes rechazan los valores `0`, `4` y `1.5` para `replicas`.
stages.0.objectives.1.text: '`replicas.txt` contiene `2`.'
stages.0.objectives.2.text: '`tofu plan` para `replicas=2` termina con código 0 sin cambios.'
hints.0.text: Inspeccione el tipo de variable y validation por separado.
hints.1.text: Un tipo de número también admite fracciones; prueba 0, 4 y 1.5.
hints.2.text: Requiere límites 1..3 y floor(valor)==valor, aplica 2 y verifica que los planes no válidos
  fallen.
debrief: La validación admitió recuentos de réplicas no seguras. Necesitaba un número entero del 1 al
  3, aplicó 2 y demostró que 0, 4 y 1.5 fueron rechazados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
