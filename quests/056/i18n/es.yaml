title: Validation y entrada escrita
brief: |-
  Se están aceptando solicitudes inseguras de réplicas. El resultado gestionado debe usar el número seguro acordado.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `terraform.tfvars`, `capacity-contract.json`.

  **Requisitos:**
  - Los planes rechazan estos valores de `replicas`:
    - `0`, `4`, `1.5`
  - Archivos en `~/quest` en la workstation:
    - `replicas.txt`: `2`
  - Con un número de réplicas de `2`, OpenTofu informa de que no hay cambios de infraestructura pendientes.

  - `capacity-contract.json` define las formas válidas y los límites de capacidad. Deben aceptarse los casos válidos y rechazarse los inválidos; la demanda de réplicas no puede superar la capacidad pool disponible.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: Conserva la cantidad segura de réplicas y rechaza fracciones y solicitudes fuera del rango.
stages.0.objectives.0.text: Las solicitudes replicas y pool válidas deben producir un plan y las inseguras
  deben rechazarse según `capacity-contract.json`, incluidos replicas `0`, `4` y `1.5`.
stages.0.objectives.1.text: '`replicas.txt` contiene `2`.'
stages.0.objectives.2.text: Con un número de réplicas de `2`, OpenTofu informa de que no hay cambios de
  infraestructura pendientes.
hints.0.text: Los tipos describen la forma; la validación relaciona también los límites numéricos con
  la capacidad solicitada.
hints.1.text: |-
  Compara ambas declaraciones de entrada y el contrato suministrado. Observa planes para formas válidas e inválidas antes de cambiar los validadores.

  ```sh
  cat main.tf terraform.tfvars capacity-contract.json
  tofu validate
  ```
hints.2.text: |-
  Construye el contrato pool tipado y la validación de enteros, rango y capacidad, aplica la solicitud segura suministrada y verifica después todos los casos válidos e inválidos y un plan final vacío.

  - `cat replicas.txt`
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2`

  ```sh
  tofu plan -input=false -no-color -var=replicas=0
  tofu plan -input=false -no-color -var=replicas=4
  tofu plan -input=false -no-color -var=replicas=1.5
  cat capacity-contract.json
  cat replicas.txt
  tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2
  ```
debrief: Las solicitudes replicas y pool válidas deben producir un plan y las inseguras deben rechazarse
  según `capacity-contract.json`, incluidos replicas `0`, `4` y `1.5`.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.capacity_contract: Las solicitudes válidas deben producir un plan y el contrato de capacidad
  debe rechazar las inseguras.
diagnostics.probe_0_0: Las solicitudes replicas y pool válidas deben producir un plan y las inseguras
