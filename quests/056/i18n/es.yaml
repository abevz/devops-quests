title: Validation y entrada escrita
brief: |-
  Se están aceptando solicitudes inseguras de réplicas. El resultado gestionado debe usar el número seguro acordado.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `terraform.tfvars`.

  **Requisitos:**
  - Los planes rechazan estos valores de `replicas`:
    - `0`, `4`, `1.5`
  - Archivos en `~/quest` en la workstation:
    - `replicas.txt`: `2`
  - Con un número de réplicas de `2`, OpenTofu informa de que no hay cambios de infraestructura pendientes.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: Conserva la cantidad segura de réplicas y rechaza fracciones y solicitudes fuera del rango.
stages.0.objectives.0.text: Los planes rechazan los valores `0`, `4` y `1.5` para `replicas`.
stages.0.objectives.1.text: '`replicas.txt` contiene `2`.'
stages.0.objectives.2.text: Con un número de réplicas de `2`, OpenTofu informa de que no hay cambios de
  infraestructura pendientes.
hints.0.text: Los tipos numéricos admiten fracciones; la validación determina qué solicitudes son aceptables.
hints.1.text: |-
  Inspecciona por separado el tipo de la variable y su bloque `validation`. El tipo `number` también admite valores fraccionarios; prueba `0`, `4` y `1.5`.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf terraform.tfvars
  ```
hints.2.text: |-
  Exige los límites 1..3 y `floor(var.replicas) == var.replicas`, aplica la configuración con 2 réplicas y comprueba que fallen los planes con valores no válidos.

  Verifica el resultado desde `~/quest` en la workstation:

  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - Los tres planes deben rechazar la cantidad solicitada.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Se espera que la cantidad gestionada de réplicas sea `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Se esperan ausencia de cambios y código de salida `0`.
debrief: La validación admitió recuentos de réplicas no seguras. Necesitaba un número entero del 1 al
  3, aplicó 2 y demostró que 0, 4 y 1.5 fueron rechazados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
