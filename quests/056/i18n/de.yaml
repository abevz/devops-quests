title: Validation und typisierte Eingabe
brief: |
  Replikaanfragen müssen im sicheren Betriebsbereich bleiben. Das verwaltete Ergebnis muss die vorgegebene sichere Anzahl beibehalten.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `terraform.tfvars`.

  **Anforderungen:**
  - Pläne weisen diese `replicas`-Werte zurück:
    - `0`, `4`, `1.5`
  - Dateien in `~/quest` auf der Workstation:
    - `replicas.txt`: `2`
  - Für `replicas=2` endet `tofu plan` mit Code `0` und meldet keine Änderungen.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - Alle drei Pläne müssen die angefragte Anzahl ablehnen.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Erwartet: Die verwaltete Replikaanzahl ist `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Erwartet: keine Änderungen, Exit-Code `0`.
stages.0.brief: |
  Behalten Sie die sichere Replikaanzahl bei und lehnen Sie Bruchteile sowie Anfragen außerhalb des Bereichs ab.
stages.0.objectives.0.text: Plans lehnen die Werte `0`, `4` und `1.5` für `replicas` ab.
stages.0.objectives.1.text: '`replicas.txt` enthält `2`.'
stages.0.objectives.2.text: '`tofu plan` für `replicas=2` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Überprüfen Sie den Variablentyp und validation separat.
hints.1.text: Ein Zahlentyp lässt auch Brüche zu; Test 0, 4 und 1.5.
hints.2.text: Erfordern Sie die Grenzen 1..3 und floor(value)==value, wenden Sie 2 an und überprüfen Sie,
  ob ungültige Pläne fehlschlagen.
debrief: Die Validierung ließ unsichere Replikatzahlen zu. Sie haben eine Ganzzahl von 1 bis 3 benötigt,
  2 angewendet und bewiesen, dass 0, 4 und 1.5 abgelehnt wurden.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
