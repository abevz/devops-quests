title: Validation und typisierte Eingabe
brief: |-
  Unsichere Replikaanfragen werden akzeptiert. Das verwaltete Ergebnis muss die vereinbarte sichere Anzahl verwenden.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `terraform.tfvars`.

  **Anforderungen:**
  - Pläne weisen diese `replicas`-Werte zurück:
    - `0`, `4`, `1.5`
  - Dateien in `~/quest` auf der Workstation:
    - `replicas.txt`: `2`
  - Mit Replikazahl `2` meldet OpenTofu keine ausstehenden Infrastrukturänderungen.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Behalten Sie die sichere Replikaanzahl bei und lehnen Sie Bruchteile sowie Anfragen außerhalb
  des Bereichs ab.
stages.0.objectives.0.text: Pläne lehnen die Werte `0`, `4` und `1.5` für `replicas` ab.
stages.0.objectives.1.text: '`replicas.txt` enthält `2`.'
stages.0.objectives.2.text: Mit Replikazahl `2` meldet OpenTofu keine ausstehenden Infrastrukturänderungen.
hints.0.text: Numerische Typen erlauben Brüche; die Validierung bestimmt zulässige Anfragen.
hints.1.text: |-
  Prüfen Sie den Variablentyp und seinen Block `validation` getrennt. Der Typ `number` lässt auch Bruchzahlen zu; testen Sie `0`, `4` und `1.5`.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf terraform.tfvars
  ```
hints.2.text: |-
  Fordern Sie die Grenzen 1..3 und `floor(var.replicas) == var.replicas`, wenden Sie die Konfiguration mit Replikazahl 2 an und prüfen Sie, dass Pläne mit ungültigen Werten scheitern.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - Alle drei Pläne müssen die angefragte Anzahl ablehnen.

    ```sh
    tofu plan -input=false -no-color -var=replicas=0
    tofu plan -input=false -no-color -var=replicas=4
    tofu plan -input=false -no-color -var=replicas=1.5
    ```
  - `cat replicas.txt` — Erwartet: Die verwaltete Replikaanzahl ist `2`.
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Die Validierung ließ unsichere Replikatzahlen zu. Sie haben eine Ganzzahl von 1 bis 3 benötigt,
  2 angewendet und bewiesen, dass 0, 4 und 1.5 abgelehnt wurden.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
