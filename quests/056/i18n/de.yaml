title: Validation und typisierte Eingabe
brief: |-
  Unsichere Replikaanfragen werden akzeptiert. Das verwaltete Ergebnis muss die vereinbarte sichere Anzahl verwenden.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `terraform.tfvars`, `capacity-contract.json`.

  **Anforderungen:**
  - Pläne weisen diese `replicas`-Werte zurück:
    - `0`, `4`, `1.5`
  - Dateien in `~/quest` auf der Workstation:
    - `replicas.txt`: `2`
  - Mit Replikazahl `2` meldet OpenTofu keine ausstehenden Infrastrukturänderungen.

  - Die vorgegebene `capacity-contract.json` definiert gültige Anfrageformen und Kapazitätsgrenzen. Gültige Fälle müssen akzeptiert und ungültige abgelehnt werden; die Replikaanforderung darf die verfügbare pool-Kapazität nicht überschreiten.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Behalten Sie die sichere Replikaanzahl bei und lehnen Sie Bruchteile sowie Anfragen außerhalb
  des Bereichs ab.
stages.0.objectives.0.text: Gültige replicas- und pool-Anfragen müssen einen Plan ergeben; unsichere Anfragen
  werden gemäß `capacity-contract.json` abgelehnt, einschließlich replicas `0`, `4` und `1.5`.
stages.0.objectives.1.text: '`replicas.txt` enthält `2`.'
stages.0.objectives.2.text: Mit Replikazahl `2` meldet OpenTofu keine ausstehenden Infrastrukturänderungen.
hints.0.text: Typen beschreiben die Form; Validierung verknüpft numerische Grenzen mit der tatsächlich
  angeforderten Kapazität.
hints.1.text: |-
  Vergleiche beide Eingabedeklarationen und den vorgegebenen Vertrag. Beobachte Pläne für gültige und ungültige Anfrageformen, bevor du die Validatoren änderst.

  ```sh
  cat main.tf terraform.tfvars capacity-contract.json
  tofu validate
  ```
hints.2.text: |-
  Erstelle den typisierten pool-Vertrag und die Ganzzahl-, Bereichs- und Kapazitätsvalidierung, wende die vorgegebene sichere Anfrage an und prüfe anschließend alle gültigen/ungültigen Fälle sowie einen leeren Abschlussplan.

  - `cat replicas.txt`
  - `tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2`

  ```sh
  tofu plan -input=false -no-color -var=replicas=0
  tofu plan -input=false -no-color -var=replicas=4
  tofu plan -input=false -no-color -var=replicas=1.5
  cat capacity-contract.json
  cat replicas.txt
  tofu plan -input=false -detailed-exitcode -no-color -var=replicas=2
  ```
debrief: Gültige replicas- und pool-Anfragen müssen einen Plan ergeben; unsichere Anfragen werden gemäß
  `capacity-contract.json` abgelehnt, einschließlich replicas `0`, `4` und `1.5`.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
