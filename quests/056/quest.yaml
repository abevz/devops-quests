id: 56
title: title
track: OpenTofu
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      for bad in 0 4 1.5; do if tofu plan -input=false -var="replicas=$bad" >/dev/null 2>&1; then exit 1; fi; done
      python3 -I - <<'DQ_CAPACITY'
      import json,subprocess,sys
      from pathlib import Path
      contract=json.loads(Path('/run/dq/facts/0/capacity-contract.json').read_text())
      for category in ('accept','reject'):
          for case in contract[category]:
              result=subprocess.run(['tofu','plan','-input=false','-refresh=false','-no-color','-var=replicas='+str(case['replicas']),'-var=pool='+json.dumps(case['pool'])],capture_output=True,text=True)
              accepted=result.returncode==0
              if accepted != (category=='accept'):
                  print('Valid requests must plan and unsafe requests must be rejected: ✗ [DQ:capacity_contract]')
                  sys.exit(1)
      DQ_CAPACITY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.1.text
    check: test "$(cat replicas.txt)" = 2
  - text: stages.0.objectives.2.text
    check: tofu plan -input=false -var=replicas=2 -detailed-exitcode >/dev/null
hints:
- text: hints.0.text
  guide: terraform-2
- text: hints.1.text
  guide: terraform-2
- text: hints.2.text
  guide: terraform-2
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - main.tf
  - terraform.tfvars
  - capacity-contract.json
  services: []
immutable:
  0:
  - capacity-contract.json
