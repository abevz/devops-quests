title: Readiness
brief: 'Service departures leitet derzeit sowohl an stable als auch an quarantine. Halten Sie den Prozess
  retired quarantine mit ROUTE=retired am Laufen, verhindern Sie jedoch, dass er Service-Datenverkehr
  empfängt, indem Sie seinen readiness probe korrigieren. Die Instanz stable north muss bereit bleiben.
  Löschen Sie weder Deployment noch entfernen Sie die Auswahlbeschriftungen Service.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `stable.json`, `quarantine.json`,
  `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Quarantine bleibt Running, aber nicht Ready, und departures hat nur das fertige
  stable endpoint.'
debrief: Readiness steuert die Berechtigung für Service-Verkehr. Ein Prozess kann für die Diagnose Running
  bleiben, während sein Endpunkt ausgeschlossen ist; Dies unterscheidet sich vom Neustartverhalten von
  liveness.
stages.0.brief: 'Ein readiness-Fehler sollte sich auf das Routing auswirken und nicht den Prozess abbrechen.
  Der vorgesehene route für die Bereitstellung des Datenverkehrs ist north.


  Erfolgskriterien: Quarantine bleibt Running, aber nicht Ready, und departures hat nur das fertige stable
  endpoint.'
stages.0.objectives.0.text: Quarantine bleibt Running, aber nicht Ready, und departures hat nur das fertige
  stable endpoint.
hints.0.text: Vergleichen Sie die Ready-Bedingung mit der Running-Phase.
hints.1.text: Der Service verwendet fertige EndpointSlice-Einträge und nicht alle laufenden Prozesse.
hints.2.text: Lassen Sie den Befehl readiness den Prozess route testen und dabei die Quarantäneidentität
  beibehalten.
phrases.0: Ich habe Bereitschaft von Prozesslebendigkeit getrennt.
phrases.1: Ich habe den readiness probe repariert, ohne den Anwendungsfehler zu verbergen.
phrases.2: Ich habe sowohl den fertigen endpoints als auch den bereitgestellten route überprüft.
questions.0.points.0: Readiness und Prozesslebensdauer beantworten unterschiedliche Fragen.
questions.0.points.1: Lesen Sie die conditions-, probe-Ausgabe und die EndpointSlice-Bereitschaft zusammen.
questions.0.points.2: Eine absichtliche Quarantäne kann sicherer sein, als Datenverkehr an einen laufenden,
  aber ungeeigneten Prozess zu leiten.
questions.0.prompt: Der Prozess wird ausgeführt, aber sein endpoint fehlt. Warum reichen diese Beweise
  nicht aus, um es neu zu starten?
questions.1.points.0: Wiederholte liveness-Fehler können den Container neu starten.
questions.1.points.1: Ein anhaltender Konfigurationsfehler kann daher zu einer Neustartschleife führen.
questions.1.points.2: Wählen Sie Sonden entsprechend der tatsächlich gewünschten Fehler- und Wiederherstellungsaktion
  aus.
questions.1.prompt: Was ändert sich, wenn dieselbe route-Prüfung fälschlicherweise als liveness konfiguriert
  wird?
