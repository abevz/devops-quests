title: Readiness
brief: |
  Der Abfahrtsverkehr erreicht eine ungeeignete Instanz.

  Arbeiten Sie auf der Workstation in `~/quest` mit `stable.json`, `quarantine.json`, `service.json`.

  **Anforderungen:**
  - Verfügbarkeit des Workloads:
    - Deployment: `stable`.
    - Status: Rollout abgeschlossen.
  - Aktueller Quarantäne-Pod:
    - Pod-Label: `app=quarantine`.
    - Genau ein nicht zur Löschung vorgesehener Pod ist in Phase `Running`.
    - Bedingung: `Ready=False`.
    - Umgebungsvariable: `ROUTE=retired`.
  - Bereite Endpunkte von Service `departures`:
    - Der einzige Ziel-Pod ist der aktuelle Pod `app=stable`.

  **Selbstprüfung vor Check & finish:**
  - `kubectl rollout status deployment/stable --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.
  - `kubectl get pods -l app=quarantine -o json` und `kubectl exec deployment/quarantine -- printenv ROUTE` — zeigen genau einen nicht zur Löschung vorgesehenen Pod in Phase `Running` mit `Ready=False` und geben `retired` aus.
  - `kubectl get pods -l app=stable -o name` und `kubectl get endpointslices -l kubernetes.io/service-name=departures -o json` — zeigen, dass das einzige Ziel bereiter Endpunkte der aktuelle Pod `app=stable` ist.
debrief: Readiness steuert die Berechtigung für Service-Verkehr. Ein Prozess kann für die Diagnose Running
  bleiben, während sein Endpunkt ausgeschlossen ist; Dies unterscheidet sich vom Neustartverhalten von
  liveness.
stages.0.brief: |
  Die Quarantäneinstanz muss beobachtbar bleiben, ohne Verkehr über bereite Service-Endpunkte zu erhalten.
stages.0.objectives.0.text: Deployment `stable` schließt seinen Rollout ab.
stages.0.objectives.1.text: Genau ein aktueller `quarantine`-Pod ist Running.
stages.0.objectives.2.text: Der aktuelle Running-Pod `quarantine` hat `Ready=False`.
stages.0.objectives.3.text: Der aktuelle Running-Pod `quarantine` stellt `ROUTE=retired` bereit.
stages.0.objectives.4.text: Die bereiten Endpoints des Service `departures` enthalten nur den `stable`-Pod.
hints.0.text: |
  Vergleichen Sie die Ready-Bedingung mit der Running-Phase. Ein Readiness-Fehler ändert die Verkehrszulassung, ohne den Prozess zu beenden.
hints.1.text: Der Service verwendet fertige EndpointSlice-Einträge und nicht alle laufenden Prozesse.
hints.2.text: |
  Lassen Sie den Befehl readiness den Prozess route testen und dabei die Quarantäneidentität beibehalten. Die vorgesehene Route von stable ist north. Behalten Sie beide Deployments und ihre Service-Selektorlabels bei, während Sie die Readiness-Probe von quarantine anpassen.
phrases.0: Ich habe Bereitschaft von Prozesslebendigkeit getrennt.
phrases.1: Ich habe den readiness probe repariert, ohne den Anwendungsfehler zu verbergen.
phrases.2: Ich habe sowohl den fertigen endpoints als auch den bereitgestellten route überprüft.
questions.0.points.0: Readiness und Prozesslebensdauer beantworten unterschiedliche Fragen.
questions.0.points.1: Lesen Sie die conditions-, probe-Ausgabe und die EndpointSlice-Bereitschaft zusammen.
questions.0.points.2: Eine absichtliche Quarantäne kann sicherer sein, als Datenverkehr an einen laufenden,
  aber ungeeigneten Prozess zu leiten.
questions.0.prompt: Der Prozess wird ausgeführt, aber sein endpoint fehlt. Warum reichen diese Beweise
  nicht aus, um es neu zu starten?
questions.1.points.0: Wiederholte liveness-Fehler können den Container neu starten.
questions.1.points.1: Ein anhaltender Konfigurationsfehler kann daher zu einer Neustartschleife führen.
questions.1.points.2: Wählen Sie Sonden entsprechend der tatsächlich gewünschten Fehler- und Wiederherstellungsaktion
  aus.
questions.1.prompt: Was ändert sich, wenn dieselbe route-Prüfung fälschlicherweise als liveness konfiguriert
  wird?
