title: Readiness
brief: 'Service departures выбирает stable и quarantine. Сохраните работающий карантинный процесс с ROUTE=retired,
  но исключите его из трафика Service правильной readiness probe. Стабильный экземпляр north должен оставаться
  Ready. Не удаляйте Deployment и метки селектора Service.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `stable.json`, `quarantine.json`, `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Quarantine остаётся Running, но не Ready; у departures остаётся только готовый endpoint
  stable.'
debrief: 'Readiness управляет допуском в трафик Service. Процесс может оставаться Running для диагностики,
  но не получать трафик: это отличается от перезапуска по liveness.'
stages.0.brief: 'Неуспешная readiness должна менять маршрутизацию, а не убивать процесс. Обслуживать трафик
  может маршрут north.


  Результат проверки: Quarantine остаётся Running, но не Ready; у departures остаётся только готовый endpoint
  stable.'
stages.0.objectives.0.text: Quarantine остаётся Running, но не Ready; у departures остаётся только готовый
  endpoint stable.
hints.0.text: Сравните условие Ready с фазой Running.
hints.1.text: Service использует готовые записи EndpointSlice, а не все работающие процессы.
hints.2.text: Пусть readiness проверяет маршрут процесса без изменения карантинной идентичности.
phrases.0: Я разделил готовность к трафику и жизнеспособность процесса.
phrases.1: Я исправил readiness probe, не скрывая ошибку приложения.
phrases.2: Я проверил готовые endpoints и выдаваемый маршрут.
questions.0.points.0: Readiness и время жизни процесса отвечают на разные вопросы.
questions.0.points.1: Сопоставьте conditions, результат probe и готовность EndpointSlice.
questions.0.points.2: Намеренный карантин может быть безопаснее трафика на работающий, но неподходящий
  процесс.
questions.0.prompt: Процесс работает, но endpoint отсутствует. Почему этого недостаточно для решения о
  перезапуске?
questions.1.points.0: Повторные отказы liveness могут перезапускать контейнер.
questions.1.points.1: Постоянная ошибка конфигурации может превратиться в цикл рестартов.
questions.1.points.2: Выбирайте probe по требуемому действию при отказе и способу восстановления.
questions.1.prompt: Что изменится, если ту же проверку маршрута ошибочно назначить liveness?
