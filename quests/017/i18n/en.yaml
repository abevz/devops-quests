title: Readiness
brief: 'Service departures currently routes to both stable and quarantine. Keep the retired quarantine
  process running with ROUTE=retired, but stop it receiving Service traffic by correcting its readiness
  probe. The stable north instance must remain ready. Do not delete either Deployment or remove the Service
  selector labels.


  Quest files in `~/quest` (some appear in later stages): `stable.json`, `quarantine.json`, `service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Quarantine stays Running but not Ready, and departures has only the ready
  stable endpoint.'
debrief: Readiness controls eligibility for Service traffic. A process can stay Running for diagnosis
  while its endpoint is excluded; that is different from liveness restart behavior.
stages.0.brief: 'A readiness failure should affect routing, not kill the process. The intended route for
  serving traffic is north.


  Success criteria: Quarantine stays Running but not Ready, and departures has only the ready stable endpoint.'
stages.0.objectives.0.text: Quarantine stays Running but not Ready, and departures has only the ready
  stable endpoint.
hints.0.text: Compare the Ready condition with the Running phase.
hints.1.text: The Service uses ready EndpointSlice entries rather than all running processes.
hints.2.text: Make the readiness command test the process route while retaining the quarantine identity.
phrases.0: I separated readiness from process liveness.
phrases.1: I repaired the readiness probe without hiding the application error.
phrases.2: I verified both ready endpoints and the served route.
questions.0.points.0: Readiness and process lifetime answer different questions.
questions.0.points.1: Read conditions, probe output and EndpointSlice readiness together.
questions.0.points.2: An intentional quarantine may be safer than sending traffic to a running but unsuitable
  process.
questions.0.prompt: The process is running but its endpoint is absent. Why is this not enough evidence
  to restart it?
questions.1.points.0: Repeated liveness failures can restart the container.
questions.1.points.1: A persistent configuration fault may therefore create a restart loop.
questions.1.points.2: Choose probes according to the failure and recovery action you actually want.
questions.1.prompt: What changes if the same route check is incorrectly configured as liveness?
