title: Readiness
brief: |
  Departures traffic reaches an unsuitable instance.

  Work on the workstation in `~/quest` with `stable.yaml`, `quarantine.yaml`, `service.yaml`.

  **Requirements:**
  - Workload availability:
    - Deployment: `stable`.
    - Status: Rollout completes.
  - Current quarantine Pod:
    - Pod label: `app=quarantine`.
    - Exactly one non-terminating Pod is in phase `Running`.
    - Condition: `Ready=False`.
    - Environment variable: `ROUTE=retired`.
  - Ready endpoints of Service `departures`:
    - The only target Pod is the current `app=stable` Pod.

  **Verify yourself before Check & finish:**
  - `kubectl rollout status deployment/stable --timeout=3s` — exits `0` and reports a completed rollout.
  - `kubectl get pods -l app=quarantine -o json` and `kubectl exec deployment/quarantine -- printenv ROUTE` — show exactly one non-terminating `Running` Pod with `Ready=False`, and print `retired`.
  - `kubectl get pods -l app=stable -o name` and `kubectl get endpointslices -l kubernetes.io/service-name=departures -o json` — show that the only ready endpoint target is the current `app=stable` Pod.
debrief: Readiness controls eligibility for Service traffic. A process can stay Running for diagnosis
  while its endpoint is excluded; that is different from liveness restart behavior.
stages.0.brief: |
  Quarantine must remain observable without receiving ready Service traffic.
stages.0.objectives.0.text: Deployment `stable` completes its rollout.
stages.0.objectives.1.text: Exactly one current `quarantine` Pod is Running.
stages.0.objectives.2.text: The current Running `quarantine` Pod has `Ready=False`.
stages.0.objectives.3.text: The current Running `quarantine` Pod exposes `ROUTE=retired`.
stages.0.objectives.4.text: The ready endpoints of Service `departures` contain only the `stable` Pod.
hints.0.text: |
  Compare the Ready condition with the Running phase. A readiness failure changes traffic eligibility without killing the process.
hints.1.text: The Service uses ready EndpointSlice entries rather than all running processes.
hints.2.text: |
  Make the readiness command test the process route while retaining the quarantine identity. The intended stable route is north. Keep both Deployments and their Service selector labels while adjusting the quarantine readiness probe.
phrases.0: I separated readiness from process liveness.
phrases.1: I repaired the readiness probe without hiding the application error.
phrases.2: I verified both ready endpoints and the served route.
questions.0.points.0: Readiness and process lifetime answer different questions.
questions.0.points.1: Read conditions, probe output and EndpointSlice readiness together.
questions.0.points.2: An intentional quarantine may be safer than sending traffic to a running but unsuitable
  process.
questions.0.prompt: The process is running but its endpoint is absent. Why is this not enough evidence
  to restart it?
questions.1.points.0: Repeated liveness failures can restart the container.
questions.1.points.1: A persistent configuration fault may therefore create a restart loop.
questions.1.points.2: Choose probes according to the failure and recovery action you actually want.
questions.1.prompt: What changes if the same route check is incorrectly configured as liveness?
