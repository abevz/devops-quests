title: Readiness
brief: 'Service departures actualmente enruta tanto a stable como a quarantine. Mantenga el proceso retired
  quarantine ejecutándose con ROUTE=retired, pero deje de recibir tráfico Service corrigiendo su readiness
  probe. La instancia stable north debe permanecer lista. No elimine Deployment ni elimine las etiquetas
  del selector Service.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `stable.json`, `quarantine.json`,
  `service.json`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes
  precargadas y servicios privados. Cambie sólo esta bahía.'
debrief: Readiness controla la elegibilidad para el tráfico Service. Un proceso puede permanecer Running
  para diagnóstico mientras se excluye su punto final; eso es diferente del comportamiento de reinicio
  de liveness.
stages.0.brief: Una falla de readiness debería afectar el enrutamiento, no interrumpir el proceso. El
  route previsto para atender el tráfico es north.
stages.0.objectives.0.text: El Deployment `stable` completa su rollout.
stages.0.objectives.1.text: Exactamente un Pod actual de `quarantine` está Running.
stages.0.objectives.2.text: El Pod actual Running de `quarantine` tiene `Ready=False`.
stages.0.objectives.3.text: El Pod actual Running de `quarantine` expone `ROUTE=retired`.
stages.0.objectives.4.text: Los endpoints listos del Service `departures` contienen solo el Pod `stable`.
hints.0.text: Compare la condición Ready con la fase Running.
hints.1.text: El Service utiliza entradas EndpointSlice listas en lugar de todos los procesos en ejecución.
hints.2.text: Haga que el comando readiness pruebe el proceso route conservando la identidad de cuarentena.
phrases.0: Separé la preparación de la vivacidad del proceso.
phrases.1: Reparé el readiness probe sin ocultar el error de la aplicación.
phrases.2: Verifiqué tanto el endpoints listo como el route servido.
questions.0.points.0: Readiness y la vida útil del proceso responden a diferentes preguntas.
questions.0.points.1: Lea la salida conditions, probe y la preparación de EndpointSlice juntas.
questions.0.points.2: Una cuarentena intencional puede ser más segura que enviar tráfico a un proceso
  en ejecución pero inadecuado.
questions.0.prompt: El proceso se está ejecutando pero su endpoint está ausente. ¿Por qué esto no es suficiente
  evidencia para reiniciarlo?
questions.1.points.0: Las fallas repetidas de liveness pueden reiniciar el contenedor.
questions.1.points.1: Por lo tanto, un error de configuración persistente puede crear un bucle de reinicio.
questions.1.points.2: Elija sondas según la acción de falla y recuperación que realmente desee.
questions.1.prompt: ¿Qué cambia si el mismo cheque route está configurado incorrectamente como liveness?
