title: Readiness
brief: |-
  El tráfico de salidas llega a una instancia inadecuada.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `stable.yaml`, `quarantine.yaml`, `service.yaml`.

  **Requisitos:**

  - Disponibilidad de la carga:
    - Deployment: `stable`.
    - Estado: Rollout completado.
  - Pod actual en cuarentena:
    - Etiqueta del Pod: `app=quarantine`.
    - Exactamente un Pod que no está en proceso de eliminación está en fase `Running`.
    - Condición: `Ready=False`.
    - Variable de entorno: `ROUTE=retired`.
  - Endpoints listos del Service `departures`:
    - El único Pod de destino es el Pod actual `app=stable`.

  La elegibilidad como endpoint del Service no garantiza aislamiento de red.
debrief: Readiness controla la elegibilidad para el tráfico Service. Un proceso puede permanecer Running
  para diagnóstico mientras se excluye su punto final; eso es diferente del comportamiento de reinicio
  de liveness.
stages.0.brief: Mantén el proceso quarantine activo mientras sigue excluido del tráfico del Service.
stages.0.objectives.0.text: El Deployment `stable` completa su rollout.
stages.0.objectives.1.text: Exactamente un Pod actual de `quarantine` está Running.
stages.0.objectives.2.text: El Pod actual Running de `quarantine` tiene `Ready=False`.
stages.0.objectives.3.text: El Pod actual Running de `quarantine` expone `ROUTE=retired`.
stages.0.objectives.4.text: Los endpoints listos del Service `departures` contienen solo el Pod `stable`.
hints.0.text: |
  Compare la condición Ready con la fase Running. Un fallo de readiness cambia la elegibilidad para recibir tráfico sin finalizar el proceso.
hints.1.text: |-
  El Service utiliza entradas EndpointSlice listas en lugar de todos los procesos en ejecución.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl describe deployment quarantine
  kubectl get endpointslices -l kubernetes.io/service-name=departures -o yaml
  ```
hints.2.text: 'Haga que el comando readiness pruebe el proceso route conservando la identidad de cuarentena. La ruta prevista de stable es north. Conserva ambos Deployments y sus etiquetas del selector de Service al ajustar la readiness probe de quarantine.


  Verifica el resultado desde `~/quest` en la workstation:


  - `kubectl rollout status deployment/stable --timeout=3s` — termina con código `0` e informa de un rollout completado.

  - `kubectl get pods -l app=quarantine -o json` y `kubectl exec deployment/quarantine -c worker -- printenv ROUTE` — muestran exactamente un Pod que no está en proceso de eliminación en fase `Running` con `Ready=False` e imprimen `retired`.

  - `kubectl get pods -l app=stable -o name` y `kubectl get endpointslices -l kubernetes.io/service-name=departures -o json` — muestran que el único destino de los endpoints listos es el Pod actual `app=stable`.'
phrases.0: Separé la preparación de la vivacidad del proceso.
phrases.1: Reparé el readiness probe sin ocultar el error de la aplicación.
phrases.2: Verifiqué tanto el endpoints listo como el route servido.
questions.0.points.0: Readiness y la vida útil del proceso responden a diferentes preguntas.
questions.0.points.1: Lea la salida conditions, probe y la preparación de EndpointSlice juntas.
questions.0.points.2: Una cuarentena intencional puede ser más segura que enviar tráfico a un proceso
  en ejecución pero inadecuado.
questions.0.prompt: El proceso se está ejecutando pero su endpoint está ausente. ¿Por qué esto no es suficiente
  evidencia para reiniciarlo?
questions.1.points.0: Las fallas repetidas de liveness pueden reiniciar el contenedor.
questions.1.points.1: Por lo tanto, un error de configuración persistente puede crear un bucle de reinicio.
questions.1.points.2: Elija sondas según la acción de falla y recuperación que realmente desee.
questions.1.prompt: ¿Qué cambia si el mismo cheque route está configurado incorrectamente como liveness?
