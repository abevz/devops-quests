title: Readiness
brief: 'Service departures obecnie kieruje zarówno do stable, jak i quarantine. Zachowaj działanie wycofanego
  procesu quarantine z ROUTE=retired, ale zablokuj otrzymywanie ruchu Service, poprawiając jego readiness
  probe. Instancja stable north musi pozostać gotowa. Nie usuwaj Deployment ani etykiet selektora Service.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `stable.json`, `quarantine.json`,
  `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Quarantine pozostaje Running, ale nie Ready, a departures ma tylko gotowy
  punkt końcowy stable.'
debrief: Readiness kontroluje uprawnienia do ruchu Service. Proces może pozostać Running do diagnozy,
  gdy jego punkt końcowy jest wykluczony; różni się to od zachowania ponownego uruchamiania liveness.
stages.0.brief: 'Awaria readiness powinna wpłynąć na routing, a nie zakończyć proces. Przewidywana trasa
  do obsługi ruchu to north.


  Kryteria sukcesu: Quarantine pozostaje Running, ale nie Ready, a departures ma tylko gotowy stabilny
  punkt końcowy.'
stages.0.objectives.0.text: Quarantine pozostaje Running, ale nie Ready, a departures ma tylko gotowy
  stabilny punkt końcowy.
hints.0.text: Porównaj stan Ready z fazą Running.
hints.1.text: Service wykorzystuje gotowe wpisy EndpointSlice zamiast wszystkich uruchomionych procesów.
hints.2.text: Wykonaj polecenie readiness, aby przetestować trasę procesu, zachowując tożsamość kwarantanny.
phrases.0: Oddzieliłem gotowość od żywotności procesu.
phrases.1: Naprawiłem readiness probe nie ukrywając błędu aplikacji.
phrases.2: Zweryfikowałem zarówno gotowy endpoints jak i obsłużoną trasę.
questions.0.points.0: Readiness i czas życia procesu odpowiadają na różne pytania.
questions.0.points.1: Przeczytaj razem wyjście conditions, probe i gotowość EndpointSlice.
questions.0.points.2: Celowa kwarantanna może być bezpieczniejsza niż wysyłanie ruchu do działającego,
  ale nieodpowiedniego procesu.
questions.0.prompt: Proces jest uruchomiony, ale nie ma jego endpoint. Dlaczego to nie jest wystarczający
  dowód, aby go ponownie uruchomić?
questions.1.points.0: Powtarzające się awarie liveness mogą spowodować ponowne uruchomienie kontenera.
questions.1.points.1: Dlatego utrzymujący się błąd konfiguracji może spowodować pętlę restartu.
questions.1.points.2: Wybierz sondy zgodnie z żądaną awarią i akcją odzyskiwania.
questions.1.prompt: Co się zmieni, jeśli ta sama kontrola trasy zostanie nieprawidłowo skonfigurowana
  jako liveness?
