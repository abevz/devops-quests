title: Readiness
brief: |-
  Ruch odjazdów trafia do nieodpowiedniej instancji.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `stable.yaml`, `quarantine.yaml`, `service.yaml`.

  **Wymagania:**

  - Dostępność obciążenia:
    - Deployment: `stable`.
    - Stan: Rollout zakończony.
  - Bieżący Pod kwarantanny:
    - Etykieta Poda: `app=quarantine`.
    - Dokładnie jeden Pod bez rozpoczętego usuwania jest w fazie `Running`.
    - Warunek: `Ready=False`.
    - Zmienna środowiskowa: `ROUTE=retired`.
  - Gotowe endpointy Service `departures`:
    - Jedynym docelowym Podem jest bieżący Pod `app=stable`.

  Kwalifikacja endpointu Service nie gwarantuje izolacji sieciowej.
debrief: Readiness kontroluje uprawnienia do ruchu Service. Proces może pozostać Running do diagnozy,
  gdy jego punkt końcowy jest wykluczony; różni się to od zachowania ponownego uruchamiania liveness.
stages.0.brief: Utrzymaj proces quarantine w działaniu, pozostawiając go poza ruchem Service.
stages.0.objectives.0.text: Deployment `stable` kończy rollout.
stages.0.objectives.1.text: Dokładnie jeden bieżący Pod `quarantine` jest Running.
stages.0.objectives.2.text: Bieżący Pod Running `quarantine` ma `Ready=False`.
stages.0.objectives.3.text: Bieżący Pod Running `quarantine` udostępnia `ROUTE=retired`.
stages.0.objectives.4.text: Gotowe endpoints Service `departures` zawierają tylko Pod `stable`.
hints.0.text: |
  Porównaj stan Ready z fazą Running. Błąd readiness zmienia dopuszczenie do ruchu bez zabijania procesu.
hints.1.text: |-
  Service wykorzystuje gotowe wpisy EndpointSlice zamiast wszystkich uruchomionych procesów.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl describe deployment quarantine
  kubectl get endpointslices -l kubernetes.io/service-name=departures -o yaml
  ```
hints.2.text: |-
  Wykonaj polecenie readiness, aby przetestować trasę procesu, zachowując tożsamość kwarantanny. Docelową trasą stable jest north. Przy dostosowywaniu readiness probe quarantine zachowaj oba Deploymenty i ich etykiety selektora Service.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl rollout status deployment/stable --timeout=3s` — kończy się kodem `0` i zgłasza zakończony rollout.
  - `kubectl get pods -l app=quarantine -o json` i `kubectl exec deployment/quarantine -- printenv ROUTE` — pokazują dokładnie jeden Pod bez rozpoczętego usuwania w fazie `Running` z `Ready=False` i wypisują `retired`.
  - `kubectl get pods -l app=stable -o name` i `kubectl get endpointslices -l kubernetes.io/service-name=departures -o json` — pokazują, że jedynym celem gotowych endpointów jest bieżący Pod `app=stable`.
phrases.0: Oddzieliłem gotowość od żywotności procesu.
phrases.1: Naprawiłem readiness probe nie ukrywając błędu aplikacji.
phrases.2: Zweryfikowałem zarówno gotowy endpoints jak i obsłużoną trasę.
questions.0.points.0: Readiness i czas życia procesu odpowiadają na różne pytania.
questions.0.points.1: Przeczytaj razem wyjście conditions, probe i gotowość EndpointSlice.
questions.0.points.2: Celowa kwarantanna może być bezpieczniejsza niż wysyłanie ruchu do działającego,
  ale nieodpowiedniego procesu.
questions.0.prompt: Proces jest uruchomiony, ale nie ma jego endpoint. Dlaczego to nie jest wystarczający
  dowód, aby go ponownie uruchomić?
questions.1.points.0: Powtarzające się awarie liveness mogą spowodować ponowne uruchomienie kontenera.
questions.1.points.1: Dlatego utrzymujący się błąd konfiguracji może spowodować pętlę restartu.
questions.1.points.2: Wybierz sondy zgodnie z żądaną awarią i akcją odzyskiwania.
questions.1.prompt: Co się zmieni, jeśli ta sama kontrola trasy zostanie nieprawidłowo skonfigurowana
  jako liveness?
