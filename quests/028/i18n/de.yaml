hints.0.text: Überprüfen Sie rollout.yml und den tatsächlichen batch trace.
hints.1.text: Überprüfen Sie sowohl die Zielnachricht als auch die Anzahl der Hosts in einem batch.
hints.2.text: 'Liefern Sie north-ready mit serial: 1; Der checker führt den play erneut aus und zeichnet die tatsächlichen
  Chargen auf.'
debrief: Für einen fleet-Rollout waren Ein-Host-Batches erforderlich. Sie haben serial:1 verwendet und die tatsächliche
  callback batch-Sequenz überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
