title: Serien-Rollout
brief: |-
  Die Routenauslieferung benötigt eine kontrollierte Flottenreihenfolge.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-ready`.
    - Zugriffsmodus: `0644`.
  - Auslieferungsfolge:
    - Host-Reihenfolge: `app1`, `app2`, `app3`.
    - Jeder Stapel enthält einen verwalteten Host.
    - Nachweis auf der Workstation: `~/quest/rollout-events.jsonl`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — zeigt north-ready von jedem verwalteten Host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — zeigt Berechtigungen `-rw-r--r--` für alle drei entfernten Dateien.
  - `cat ~/quest/rollout-events.jsonl` — zeigt die Auslieferung in Reihenfolge app1, app2, app3 und einen eigenen Stapelbeginn pro Host.
stages.0.brief: Die Auslieferung muss jeweils einen verwalteten Host weitergehen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
stages.0.objectives.2.text: Die Auslieferung erfolgt in der Reihenfolge app1, app2, app3 mit einem Host pro Stapel.
hints.0.text: Überprüfen Sie rollout.yml und den tatsächlichen batch trace.
hints.1.text: Überprüfen Sie sowohl die Zielnachricht als auch die Anzahl der Hosts in einem batch.
hints.2.text: 'Liefern Sie north-ready mit serial: 1; Der checker führt den play erneut aus und zeichnet die tatsächlichen
  Chargen auf.'
debrief: Für einen fleet-Rollout waren Ein-Host-Batches erforderlich. Sie haben serial:1 verwendet und die tatsächliche
  callback batch-Sequenz überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
