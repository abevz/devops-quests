title: Serien-Rollout
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Rollen Sie das route-Banner Host für Host aus. Arbeiten
  Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Beginnen Sie mit rollout.yml.


  Eingänge in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Alle drei message-Dateien enthalten north-ready, Modus 0644; Die Lieferung erfolgt
  in der Reihenfolge app1, app2, app3 mit einem Host pro Charge.'
stages.0.brief: 'Rollout in Lagerreihenfolge mit serial: 1. Der Rückruf erfasst tatsächliche Chargen.


  Erfolgskriterien: Alle drei message-Dateien enthalten north-ready, Modus 0644; Die Lieferung erfolgt
  in der Reihenfolge app1, app2, app3 mit einem Host pro batch.'
stages.0.objectives.0.text: Alle drei message-Dateien enthalten north-ready, Modus 0644; Die Lieferung
  erfolgt in der Reihenfolge app1, app2, app3 mit einem Host pro Charge.
hints.0.text: Überprüfen Sie rollout.yml und den tatsächlichen batch trace.
hints.1.text: Überprüfen Sie sowohl die Zielnachricht als auch die Anzahl der Hosts in einem batch.
hints.2.text: 'Liefern Sie north-ready mit serial: 1; Der checker führt den play erneut aus und zeichnet
  die tatsächlichen Chargen auf.'
debrief: Für einen fleet-Rollout waren Ein-Host-Batches erforderlich. Sie haben serial:1 verwendet und
  die tatsächliche callback batch-Sequenz überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
