title: Serien-Rollout
brief: "Die Routenauslieferung benötigt eine kontrollierte Flottenreihenfolge.\n\nArbeiten Sie auf der Workstation\
  \ in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n- Datei auf jedem\
  \ verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `north-ready`.\n\
  \  - Zugriffsmodus: `0644`.\n- Auslieferungsfolge:\n  - Host-Reihenfolge: `app1`, `app2`, `app3`.\n  - Jeder\
  \ Stapel enthält einen verwalteten Host.\n"
stages.0.brief: Die Auslieferung muss jeweils einen verwalteten Host weitergehen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  den Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den
  Modus `0644`.
stages.0.objectives.2.text: Die Auslieferung erfolgt in der Reihenfolge app1, app2, app3 mit einem Host pro
  Stapel.
hints.0.text: Ein kontrollierter Rollout begrenzt, wie viele verwaltete Hosts sich gleichzeitig ändern.
hints.1.text: 'Überprüfen Sie rollout.yml und den tatsächlichen batch trace.


  Überprüfen Sie sowohl die Zielnachricht als auch die Anzahl der Hosts in einem batch.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini --list-hosts

  ```'
hints.2.text: |-
  Prüfen Sie das beobachtete Ergebnis:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — zeigt north-ready von jedem verwalteten Host.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — zeigt Berechtigungen `-rw-r--r--` für alle drei entfernten Dateien.

  - `cat ~/quest/rollout-events.jsonl` — zeigt die Auslieferung in Reihenfolge app1, app2, app3 und einen eigenen Stapelbeginn pro Host.
debrief: Für einen fleet-Rollout waren Ein-Host-Batches erforderlich. Sie haben serial:1 verwendet und die
  tatsächliche callback batch-Sequenz überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.content_1: |-
  Auf app1 kann die alte Nachricht bleiben, wenn rollout.yml den Host überspringt oder die Aufgabe anderen Inhalt kopiert. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.content_2: |-
  Auf app2 kann die alte Nachricht bleiben, wenn rollout.yml den Host überspringt oder die Aufgabe anderen Inhalt kopiert. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.content_3: |-
  Auf app3 kann die alte Nachricht bleiben, wenn rollout.yml den Host überspringt oder die Aufgabe anderen Inhalt kopiert. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_1: |-
  Die Datei auf app1 kann ihren alten Modus behalten, wenn die Copy-Aufgabe den Host übersprungen oder einen anderen Modus gesetzt hat. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_2: |-
  Die Datei auf app2 kann ihren alten Modus behalten, wenn die Copy-Aufgabe den Host übersprungen oder einen anderen Modus gesetzt hat. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_3: |-
  Die Datei auf app3 kann ihren alten Modus behalten, wenn die Copy-Aufgabe den Host übersprungen oder einen anderen Modus gesetzt hat. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.delivery_trace: |-
  Die Ablaufprüfung kann scheitern, wenn ein Batch mehrere Hosts ändert, die Reihenfolge falsch ist oder die Datei auf einem Host nicht per SSH gelesen werden kann. Prüfen Sie vor dem Vergleich, ob Beobachtungen vorliegen. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.probe_0_2: |-
  Die Prüfung kann vor einem Batch-Ergebnis abbrechen, wenn Python nicht startet oder der gespeicherte Hostzustand nach der Beobachtung nicht wiederhergestellt werden kann. [Leitfaden](guides#guide=ansible-11&section=one-host-at-a-time)
