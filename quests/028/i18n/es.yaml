title: Lanzamiento en serie
brief: 'Te uniste a las operaciones de SignalRail. Implemente el banner route un host a la vez. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Comience con rollout.yml.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres archivos message contienen north-ready, modo 0644; la entrega
  se realiza en pedidos app1, app2, app3 con un host por lote.'
stages.0.brief: 'Implementar en orden de inventario con serial: 1. La devolución de llamada registra lotes
  reales.


  Criterios de éxito: los tres archivos message contienen north-ready, modo 0644; la entrega se realiza
  en pedidos app1, app2, app3 con un host por batch.'
stages.0.objectives.0.text: Los tres archivos message contienen north-ready, modo 0644; la entrega se
  realiza en pedidos app1, app2, app3 con un host por lote.
hints.0.text: Inspeccione rollout.yml y el batch trace real.
hints.1.text: Verifique tanto el mensaje de destino como la cantidad de hosts en un batch.
hints.2.text: 'Entregar north-ready con serial: 1; el checker vuelve a ejecutar el play y registra lotes
  reales.'
debrief: 'Una implementación de fleet necesitaba lotes de un solo host. Utilizó serial: 1 y verificó la
  secuencia callback batch real.'
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
