title: Lanzamiento en serie
brief: "La entrega de rutas necesita una secuencia controlada de la flota.\n\nTrabaja en la workstation en\
  \ `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n- Archivo en cada host\
  \ administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n  - Contenido: `north-ready`.\n\
  \  - Modo de acceso: `0644`.\n- Progresión de entrega:\n  - Orden de hosts: `app1`, `app2`, `app3`.\n  -\
  \ Cada lote contiene un host administrado.\n"
stages.0.brief: La entrega debe avanzar un host administrado a la vez.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el
  modo `0644`.
stages.0.objectives.2.text: La entrega sigue el orden app1, app2, app3, con un host por lote.
hints.0.text: Un rollout controlado limita cuántos hosts gestionados cambian a la vez.
hints.1.text: 'Inspeccione rollout.yml y el batch trace real.


  Verifique tanto el mensaje de destino como la cantidad de hosts en un batch.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini --list-hosts

  ```'
hints.2.text: |-
  Verifica el resultado observado:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — muestra north-ready de cada host administrado.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.

  - `cat ~/quest/rollout-events.jsonl` — muestra la entrega en orden app1, app2, app3 y un inicio de lote separado por host.
debrief: 'Una implementación de fleet necesitaba lotes de un solo host. Utilizó serial: 1 y verificó la secuencia
  callback batch real.'
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
