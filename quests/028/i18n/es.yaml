title: Lanzamiento en serie
brief: |-
  La entrega de rutas necesita una secuencia controlada de la flota.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-ready`.
    - Modo de acceso: `0644`.
  - Progresión de entrega:
    - Orden de hosts: `app1`, `app2`, `app3`.
    - Cada lote contiene un host administrado.
    - Evidencia en la workstation: `~/quest/rollout-events.jsonl`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — muestra north-ready de cada host administrado.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.
  - `cat ~/quest/rollout-events.jsonl` — muestra la entrega en orden app1, app2, app3 y un inicio de lote separado por host.
stages.0.brief: La entrega debe avanzar un host administrado a la vez.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.2.text: La entrega sigue el orden app1, app2, app3, con un host por lote.
hints.0.text: Inspeccione rollout.yml y el batch trace real.
hints.1.text: Verifique tanto el mensaje de destino como la cantidad de hosts en un batch.
hints.2.text: 'Entregar north-ready con serial: 1; el checker vuelve a ejecutar el play y registra lotes reales.'
debrief: 'Una implementación de fleet necesitaba lotes de un solo host. Utilizó serial: 1 y verificó la secuencia
  callback batch real.'
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
