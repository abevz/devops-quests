hints.0.text: Проверьте rollout.yml и trace реальных batch.
hints.1.text: Проверьте нужное сообщение и число хостов в batch.
hints.2.text: 'Доставьте north-ready с serial: 1; checker повторяет play и записывает реальные batch.'
debrief: 'Для fleet нужны batch по одному хосту. Вы использовали serial: 1 и проверили последовательность реальных
  batch через callback.'
