diagnostics.mode_1: На app1 файл /srv/site/message имеет режим 0644.
diagnostics.mode_2: На app2 файл /srv/site/message имеет режим 0644.
diagnostics.mode_3: На app3 файл /srv/site/message имеет режим 0644.
