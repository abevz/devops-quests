title: Последовательное обновление
brief: "Доставке маршрута нужна управляемая последовательность хостов.\n\nРаботайте на workstation в `~/quest`\
  \ с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Требования:**\n- Файл на каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n  - Содержимое: `north-ready`.\n  - Режим\
  \ доступа: `0644`.\n- Последовательность доставки:\n  - Порядок хостов: `app1`, `app2`, `app3`.\n  - В каждой\
  \ партии один управляемый хост.\n"
stages.0.brief: Доставка должна продвигаться по одному управляемому хосту.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.2.text: Доставка идёт в порядке app1, app2, app3, по одному хосту в партии.
hints.0.text: Контролируемый rollout ограничивает число управляемых хостов, изменяемых одновременно.
hints.1.text: 'Проверьте rollout.yml и trace реальных batch.


  Проверьте нужное сообщение и число хостов в batch.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini --list-hosts

  ```'
hints.2.text: |-
  Проверьте наблюдаемый результат:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — показывает north-ready с каждого управляемого хоста.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — показывает права `-rw-r--r--` у всех трёх удалённых файлов.

  - `cat ~/quest/rollout-events.jsonl` — показывает доставку в порядке app1, app2, app3 и отдельное начало партии для каждого хоста.
debrief: 'Для fleet нужны batch по одному хосту. Вы использовали serial: 1 и проверили последовательность реальных
  batch через callback.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
