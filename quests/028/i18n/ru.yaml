title: Последовательное обновление
brief: 'Вы в команде эксплуатации SignalRail. Обновите баннер по одному хосту. Работайте в ~/quest. Все
  изменения — только в этой песочнице.


  Начните с rollout.yml.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах message содержит north-ready, режим 0644; доставка идёт в порядке
  app1, app2, app3, по одному узлу в партии.'
stages.0.brief: 'Обновляйте в порядке инвентаря, serial: 1. Callback записывает реальные batch.


  Результат проверки: На всех трёх узлах message содержит north-ready, режим 0644; доставка идёт в порядке
  app1, app2, app3, по одному узлу в партии.'
stages.0.objectives.0.text: На всех трёх узлах message содержит north-ready, режим 0644; доставка идёт
  в порядке app1, app2, app3, по одному узлу в партии.
hints.0.text: Проверьте rollout.yml и trace реальных batch.
hints.1.text: Проверьте нужное сообщение и число хостов в batch.
hints.2.text: 'Доставьте north-ready с serial: 1; checker повторяет play и записывает реальные batch.'
debrief: 'Для fleet нужны batch по одному хосту. Вы использовали serial: 1 и проверили последовательность
  реальных batch через callback.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
