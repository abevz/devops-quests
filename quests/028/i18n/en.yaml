title: Serial rollout
brief: 'You joined SignalRail operations. Roll out the route banner one host at a time. Work in ~/quest.
  Keep all changes inside this training bay.


  Start with rollout.yml.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three message files contain north-ready, mode 0644; the delivery runs
  in app1, app2, app3 order with one host per batch.'
stages.0.brief: 'Roll out in inventory order with serial: 1. The callback records actual batches.


  Success criteria: All three message files contain north-ready, mode 0644; the delivery runs in app1,
  app2, app3 order with one host per batch.'
stages.0.objectives.0.text: All three message files contain north-ready, mode 0644; the delivery runs
  in app1, app2, app3 order with one host per batch.
hints.0.text: Inspect rollout.yml and the actual batch trace.
hints.1.text: Check both the target message and the number of hosts in a batch.
hints.2.text: 'Deliver north-ready with serial: 1; the checker reruns the play and records actual batches.'
debrief: 'A fleet rollout needed one-host batches. You used serial: 1 and verified the actual callback
  batch sequence.'
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
