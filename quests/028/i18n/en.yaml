title: Serial rollout
brief: "Route delivery needs a controlled fleet sequence.\n\nWork on the workstation in `~/quest` with `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Requirements:**\n- File on every managed host (`app1`, `app2`, `app3`):\n\
  \  - Path: `/srv/site/message`.\n  - Content: `north-ready`.\n  - Access mode: `0644`.\n- Delivery progression:\n\
  \  - Host order: `app1`, `app2`, `app3`.\n  - Each batch contains one managed host.\n"
stages.0.brief: Delivery must advance one managed host at a time.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.2.text: Delivery proceeds in app1, app2, app3 order, with one host per batch.
hints.0.text: A controlled rollout limits how many managed hosts change at the same time.
hints.1.text: 'Inspect rollout.yml and the actual batch trace.


  Check both the target message and the number of hosts in a batch.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini --list-hosts

  ```'
hints.2.text: |-
  Verify the observed result:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — shows north-ready from each managed host.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — shows permissions `-rw-r--r--` on all three remote files.

  - `cat ~/quest/rollout-events.jsonl` — shows delivery in app1, app2, app3 order and a separate batch start for each host.
debrief: 'A fleet rollout needed one-host batches. You used serial: 1 and verified the actual callback batch
  sequence.'
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.content_1: |-
  The message on app1 can remain stale if rollout.yml skips that host or the copy task uses different content. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.content_2: |-
  The message on app2 can remain stale if rollout.yml skips that host or the copy task uses different content. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.content_3: |-
  The message on app3 can remain stale if rollout.yml skips that host or the copy task uses different content. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_1: |-
  The file on app1 may retain its old mode if the copy task skipped that host or used a different mode. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_2: |-
  The file on app2 may retain its old mode if the copy task skipped that host or used a different mode. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_3: |-
  The file on app3 may retain its old mode if the copy task skipped that host or used a different mode. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.delivery_trace: |-
  The trace can fail if a batch changes multiple hosts, the hosts change out of order, or the observer cannot read a host over SSH. Check whether observations exist before comparing the order. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.probe_0_2: |-
  The check can stop before reporting a batch when Python cannot start or the saved host state cannot be restored after observation. [Guide](guides#guide=ansible-11&section=one-host-at-a-time)
