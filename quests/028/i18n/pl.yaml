title: Wdrożenie seryjne
brief: "Dostarczenie trasy wymaga kontrolowanej kolejności hostów.\n\nPracuj na workstation w `~/quest` z plikami\
  \ `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n- Plik na każdym zarządzanym hoście (`app1`,\
  \ `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n  - Treść: `north-ready`.\n  - Tryb dostępu: `0644`.\n\
  - Kolejność dostarczania:\n  - Kolejność hostów: `app1`, `app2`, `app3`.\n  - Każda partia obejmuje jednego\
  \ zarządzanego hosta.\n"
stages.0.brief: Dostarczenie musi obejmować po jednym zarządzanym hoście.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `north-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  ma tryb `0644`.
stages.0.objectives.2.text: Dostarczenie odbywa się w kolejności app1, app2, app3, po jednym hoście w partii.
hints.0.text: Kontrolowany rollout ogranicza liczbę zarządzanych hostów zmienianych jednocześnie.
hints.1.text: |-
  Porównaj wiadomość skonfigurowaną w rollout.yml z wymaganiami zadania. Sprawdź rozmiar partii w playbooku i wyświetl hosty wybrane z inwentarza.

  ```sh
  cat inventory.ini
  cat rollout.yml
  ansible fleet -i inventory.ini --list-hosts
  ```
hints.2.text: |-
  Sprawdź obserwowany wynik:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — pokazuje north-ready z każdego zarządzanego hosta.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — pokazuje uprawnienia `-rw-r--r--` wszystkich trzech zdalnych plików.

  - `cat ~/quest/rollout-events.jsonl` — pokazuje dostarczenie w kolejności app1, app2, app3 i osobny początek partii dla każdego hosta.
debrief: 'Wdrożenie fleet wymagało wsadów z jednym hostem. Użyłeś serial: 1 i zweryfikowałeś rzeczywistą sekwencję
  callback batch.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.content_1: |-
  Na app1 może pozostać stara wiadomość, jeśli rollout.yml pomija host lub zadanie kopiuje inną treść. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.content_2: |-
  Na app2 może pozostać stara wiadomość, jeśli rollout.yml pomija host lub zadanie kopiuje inną treść. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.content_3: |-
  Na app3 może pozostać stara wiadomość, jeśli rollout.yml pomija host lub zadanie kopiuje inną treść. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_1: |-
  Plik na app1 mógł zachować stare uprawnienia, jeśli zadanie kopiowania pominęło host lub użyło innego trybu. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_2: |-
  Plik na app2 mógł zachować stare uprawnienia, jeśli zadanie kopiowania pominęło host lub użyło innego trybu. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.mode_3: |-
  Plik na app3 mógł zachować stare uprawnienia, jeśli zadanie kopiowania pominęło host lub użyło innego trybu. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.delivery_trace: |-
  Ślad może nie przejść sprawdzenia, jeśli partia zmienia kilka hostów, kolejność jest błędna lub obserwator nie odczyta pliku przez SSH. Sprawdź, czy są obserwacje, przed porównaniem kolejności. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
diagnostics.probe_0_2: |-
  Sonda może zakończyć się bez wyniku partii, jeśli Python nie startuje lub nie można odtworzyć zapisanego stanu hostów po obserwacji. [Przewodnik](guides#guide=ansible-11&section=one-host-at-a-time)
