title: Wdrożenie seryjne
brief: "Dostarczenie trasy wymaga kontrolowanej kolejności hostów.\n\nPracuj na workstation w `~/quest` z plikami\
  \ `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n- Plik na każdym zarządzanym hoście (`app1`,\
  \ `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n  - Treść: `north-ready`.\n  - Tryb dostępu: `0644`.\n\
  - Kolejność dostarczania:\n  - Kolejność hostów: `app1`, `app2`, `app3`.\n  - Każda partia obejmuje jednego\
  \ zarządzanego hosta.\n"
stages.0.brief: Dostarczenie musi obejmować po jednym zarządzanym hoście.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `north-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  ma tryb `0644`.
stages.0.objectives.2.text: Dostarczenie odbywa się w kolejności app1, app2, app3, po jednym hoście w partii.
hints.0.text: Kontrolowany rollout ogranicza liczbę zarządzanych hostów zmienianych jednocześnie.
hints.1.text: 'Sprawdź rollout.yml i rzeczywisty batch trace.


  Sprawdź zarówno wiadomość docelową, jak i liczbę hostów w batch.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini --list-hosts

  ```'
hints.2.text: 'Dostarcz north-ready z serial: 1; checker ponownie uruchamia play i rejestruje rzeczywiste partie.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — pokazuje north-ready z każdego zarządzanego hosta.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — pokazuje uprawnienia
  `-rw-r--r--` wszystkich trzech zdalnych plików.


  - `cat ~/quest/rollout-events.jsonl` — pokazuje dostarczenie w kolejności app1, app2, app3 i osobny początek
  partii dla każdego hosta.


  Ślad partii jest dostępny po zarejestrowanym wykonaniu playbooka (Check również je rejestruje).'
debrief: 'Wdrożenie fleet wymagało wsadów z jednym hostem. Użyłeś serial: 1 i zweryfikowałeś rzeczywistą sekwencję
  callback batch.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.content_1: Na app1 plik /srv/site/message zawiera north-ready.
diagnostics.content_2: Na app2 plik /srv/site/message zawiera north-ready.
diagnostics.content_3: Na app3 plik /srv/site/message zawiera north-ready.
