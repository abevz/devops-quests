title: Wdrożenie seryjne
brief: 'Dołączyłeś do operacji SignalRail. Rozwiń baner trasy po jednym hoście na raz. Pracuj w ~/quest.
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Zacznij od rollout.yml.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy pliki message zawierają north-ready, tryb 0644; dostawa
  odbywa się w kolejności app1, app2, app3 z jednym hostem na partię.'
stages.0.brief: 'Wdrażaj w kolejności zapasów za pomocą serial: 1. Wywołanie zwrotne rejestruje rzeczywiste
  partie.


  Kryteria sukcesu: Wszystkie trzy pliki message zawierają north-ready, tryb 0644; dostawa odbywa się
  w kolejności app1, app2, app3 z jednym hostem na batch.'
stages.0.objectives.0.text: Wszystkie trzy pliki message zawierają north-ready, tryb 0644; dostawa odbywa
  się w kolejności app1, app2, app3 z jednym hostem na partię.
hints.0.text: Sprawdź rollout.yml i rzeczywisty batch trace.
hints.1.text: Sprawdź zarówno wiadomość docelową, jak i liczbę hostów w batch.
hints.2.text: 'Dostarcz north-ready z serial: 1; checker ponownie uruchamia play i rejestruje rzeczywiste
  partie.'
debrief: 'Wdrożenie fleet wymagało wsadów z jednym hostem. Użyłeś serial: 1 i zweryfikowałeś rzeczywistą
  sekwencję callback batch.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
