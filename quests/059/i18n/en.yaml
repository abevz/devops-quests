title: Resource address moves
brief: 'You joined SignalRail operations. Rename a managed ledger without replacing it. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The ledger address changed without recreation.'
stages.0.brief: 'Rename the resource address to local_file.ledger with a moved block. Keep its ID.


  Success criteria: The ledger address changed without recreation.'
stages.0.objectives.0.text: The ledger address changed without recreation.
hints.0.text: Compare the old state address with the new resource name.
hints.1.text: A rename without moved looks like delete and create.
hints.2.text: Move local_file.notice to local_file.ledger and verify the original ID and empty plan.
debrief: The resource address needed a rename. You documented it with moved and verified the original
  ID and an empty final plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
