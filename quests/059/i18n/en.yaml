title: Resource address moves
brief: |-
  The managed ledger needs a new state address without losing its existing identity. Keep the original provider ID.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`.

  **Requirements:**
  - The resource tracked as `local_file.ledger` keeps its original provider ID.
  - OpenTofu reports no pending infrastructure changes.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: The ledger must retain its identity at the required state address, with no pending changes.
stages.0.objectives.0.text: The resource tracked as `local_file.ledger` keeps its original provider ID.
stages.0.objectives.1.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: A resource address and a provider identity describe different things.
hints.1.text: |-
  Compare the old state address with the new resource name. A rename without moved looks like delete and create. A moved block can retain the existing identity at the new resource address.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf
  tofu state list
  cat original-id
  ```
hints.2.text: |-
  Move local_file.notice to local_file.ledger and verify the original ID and empty plan.

  Verify the result from `~/quest` on the workstation:

  Run these observation commands from `~/quest` on the workstation.
  - Expected: `local_file.ledger` is tracked with the same provider ID as `original-id`.

    ```sh
    cat original-id
    tofu state show local_file.ledger
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
debrief: The resource address needed a rename. You documented it with moved and verified the original
  ID and an empty final plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
