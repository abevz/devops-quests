title: Resource address moves
brief: |-
  The planned address refactor would replace linked ledger objects. Complete it while preserving their original provider identities and content.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`.

  **Requirements:**
  - The resource tracked as `local_file.ledger` keeps its original provider ID.
  - OpenTofu reports no pending infrastructure changes.

  - Both `local_file.ledger` and `terraform_data.ledger` retain their original provider IDs and the ledger content.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: The ledger must retain its identity at the required state address, with no pending changes.
stages.0.objectives.0.text: Both `local_file.ledger` and `terraform_data.ledger` retain their original
  provider IDs and the ledger content.
stages.0.objectives.1.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: Configuration addresses and persistent provider identities are separate; inspect the entire
  linked refactor before accepting replacements.
hints.1.text: |-
  Compare desired addresses, existing state and plan actions for both linked resources. A matching file checksum alone does not identify the persistent companion.

  ```sh
  cat main.tf
  tofu state list
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Preserve both original identities through the address migration. Verify each state object and the original receipts, then require an empty final plan.

  - `tofu state show local_file.ledger`
  - `tofu state show terraform_data.ledger`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat original-id original-identity
  tofu state show local_file.ledger
  tofu state show terraform_data.ledger
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Both `local_file.ledger` and `terraform_data.ledger` retain their original provider IDs and the
  ledger content.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.move_identity: Both linked ledger identities and the original content must be preserved.
