title: Ressourcenadressen werden verschoben
brief: |-
  Die geplante Adressumstellung würde verknüpfte Ledger-Objekte ersetzen. Führe sie unter Erhalt ihrer ursprünglichen Provider-Identitäten und Inhalte durch.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`.

  **Anforderungen:**
  - Die unter `local_file.ledger` erfasste Ressource behält ihre ursprüngliche Provider-ID.
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.

  - `local_file.ledger` und `terraform_data.ledger` behalten ihre ursprünglichen Provider-IDs und den Ledger-Inhalt.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Das Ledger muss seine Identität an der geforderten State-Adresse behalten, ohne ausstehende
  Änderungen.
stages.0.objectives.0.text: '`local_file.ledger` und `terraform_data.ledger` behalten ihre ursprünglichen
  Provider-IDs und den Ledger-Inhalt.'
stages.0.objectives.1.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Konfigurationsadressen und dauerhafte Provider-Identitäten sind verschieden; untersuche
  die gesamte verknüpfte Umstellung, bevor du Ersetzungen akzeptierst.
hints.1.text: |-
  Vergleiche gewünschte Adressen, bestehenden State und Planaktionen beider verknüpfter Ressourcen. Eine übereinstimmende Dateiprüfsumme identifiziert den dauerhaften Begleiter nicht.

  ```sh
  cat main.tf
  tofu state list
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Erhalte beide ursprünglichen Identitäten bei der Adressmigration. Prüfe jedes State-Objekt und die ursprünglichen Aufzeichnungen; verlange danach einen leeren Abschlussplan.

  - `tofu state show local_file.ledger`
  - `tofu state show terraform_data.ledger`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat original-id original-identity
  tofu state show local_file.ledger
  tofu state show terraform_data.ledger
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: '`local_file.ledger` und `terraform_data.ledger` behalten ihre ursprünglichen Provider-IDs und
  den Ledger-Inhalt.'
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.move_identity: Beide verknüpften Ledger-Identitäten und der ursprüngliche Inhalt müssen erhalten
  bleiben.
