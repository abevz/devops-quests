title: Ressourcenadressen werden verschoben
brief: |-
  Das verwaltete Ledger benötigt eine neue State-Adresse, ohne seine bestehende Identität zu verlieren. Behalten Sie die ursprüngliche Provider-ID bei.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`.

  **Anforderungen:**
  - Die unter `local_file.ledger` erfasste Ressource behält ihre ursprüngliche Provider-ID.
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Das Ledger muss seine Identität an der geforderten State-Adresse behalten, ohne ausstehende
  Änderungen.
stages.0.objectives.0.text: Die im State als `local_file.ledger` erfasste Ressource behält ihre ursprüngliche
  Provider-ID.
stages.0.objectives.1.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Eine Ressourcenadresse und eine Provider-Identität beschreiben verschiedene Dinge.
hints.1.text: |-
  Vergleichen Sie die alte Statusadresse mit dem neuen Ressourcennamen. Eine Umbenennung ohne moved wirkt wie Löschen und Erstellen. Ein moved-Block kann die bestehende Identität an der neuen Ressourcenadresse erhalten.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf
  tofu state list
  cat original-id
  ```
hints.2.text: |-
  Verschieben Sie local_file.notice nach local_file.ledger und prüfen Sie, dass die ursprüngliche Ressourcen-ID erhalten bleibt und der Plan keine Änderungen enthält.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - Erwartet: `local_file.ledger` wird mit derselben Provider-ID wie in `original-id` erfasst.

    ```sh
    cat original-id
    tofu state show local_file.ledger
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Die Ressourcenadresse musste umbenannt werden. Sie haben es mit moved dokumentiert und das ursprüngliche
  ID und ein leeres endgültiges plan verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
