title: Ressourcenadressen werden verschoben
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Benennen Sie ein verwaltetes ledger um, ohne es zu
  ersetzen. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingaben in `~/quest`: `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Die ledger-Adresse wurde ohne Wiederherstellung geändert.'
stages.0.brief: 'Benennen Sie die Ressourcenadresse mit einem moved-Block in local_file.ledger um. Behalte
  seinen ID.


  Erfolgskriterium: Die ledger-Adresse wurde ohne Neuerstellung geändert.'
stages.0.objectives.0.text: Die ledger-Adresse wurde ohne Wiederherstellung geändert.
hints.0.text: Vergleichen Sie die alte Statusadresse mit dem neuen Ressourcennamen.
hints.1.text: Eine Umbenennung ohne moved sieht aus wie Löschen und Erstellen.
hints.2.text: Verschieben Sie local_file.notice zu local_file.ledger und überprüfen Sie das ursprüngliche
  ID und leeren Sie plan.
debrief: Die Ressourcenadresse musste umbenannt werden. Sie haben es mit moved dokumentiert und das ursprüngliche
  ID und ein leeres endgültiges plan verifiziert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
