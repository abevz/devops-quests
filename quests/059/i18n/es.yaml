title: Movimientos de direcciones de recursos
brief: 'Te uniste a las operaciones de SignalRail. Cambie el nombre de un ledger administrado sin reemplazarlo.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: la dirección ledger cambió sin recreación.'
stages.0.brief: 'Cambie el nombre de la dirección del recurso a local_file.ledger con un bloque moved.
  Conserve su ID.


  Criterios de éxito: la dirección ledger cambió sin recreación.'
stages.0.objectives.0.text: La dirección ledger cambió sin recreación.
hints.0.text: Compare la dirección del estado anterior con el nuevo nombre del recurso.
hints.1.text: Un cambio de nombre sin moved parece eliminar y crear.
hints.2.text: Mueva local_file.notice a local_file.ledger y verifique el ID original y el plan vacío.
debrief: La dirección del recurso necesitaba un cambio de nombre. Lo documentó con moved y verificó el
  ID original y un plan final vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
