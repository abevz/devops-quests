title: Movimientos de direcciones de recursos
brief: |-
  El registro gestionado necesita una nueva dirección en el estado sin perder su identidad. Conserva el ID original del proveedor.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`.

  **Requisitos:**
  - El recurso registrado como `local_file.ledger` conserva su ID original del proveedor.
  - OpenTofu informa de que no hay cambios de infraestructura pendientes.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: El registro debe conservar su identidad en la dirección de estado requerida, sin cambios
  pendientes.
stages.0.objectives.0.text: El recurso registrado en el state como `local_file.ledger` conserva su ID
  original del proveedor.
stages.0.objectives.1.text: OpenTofu informa de que no hay cambios de infraestructura pendientes.
hints.0.text: Una dirección de recurso y una identidad del proveedor describen cosas distintas.
hints.1.text: |-
  Compare la dirección del estado anterior con el nuevo nombre del recurso. Un cambio de nombre sin moved parece una eliminación y creación. Un bloque moved puede conservar la identidad existente en la nueva dirección del recurso.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf
  tofu state list
  cat original-id
  ```
hints.2.text: |-
  Mueva local_file.notice a local_file.ledger y verifique el ID original y el plan vacío.

  Verifica el resultado desde `~/quest` en la workstation:

  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - Se espera `local_file.ledger` registrado con el mismo ID del proveedor que en `original-id`.

    ```sh
    cat original-id
    tofu state show local_file.ledger
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
debrief: La dirección del recurso necesitaba un cambio de nombre. Lo documentó con moved y verificó el
  ID original y un plan final vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
