title: Movimientos de direcciones de recursos
brief: |-
  La refactorización prevista de direcciones reemplazaría objetos ledger vinculados. Complétala conservando sus identidades originales de proveedor y su contenido.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`.

  **Requisitos:**
  - El recurso registrado como `local_file.ledger` conserva su ID original del proveedor.
  - OpenTofu informa de que no hay cambios de infraestructura pendientes.

  - `local_file.ledger` y `terraform_data.ledger` conservan sus ID originales de proveedor y el contenido ledger.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: El registro debe conservar su identidad en la dirección de estado requerida, sin cambios
  pendientes.
stages.0.objectives.0.text: '`local_file.ledger` y `terraform_data.ledger` conservan sus ID originales
  de proveedor y el contenido ledger.'
stages.0.objectives.1.text: OpenTofu informa de que no hay cambios de infraestructura pendientes.
hints.0.text: Las direcciones de configuración y las identidades persistentes son distintas; inspecciona
  toda la refactorización vinculada antes de aceptar reemplazos.
hints.1.text: |-
  Compara las direcciones deseadas, el state existente y las acciones del plan de ambos recursos vinculados. Una suma de archivo coincidente no identifica al acompañante persistente.

  ```sh
  cat main.tf
  tofu state list
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Conserva ambas identidades originales durante la migración de direcciones. Verifica cada objeto state y los registros originales; después exige un plan final vacío.

  - `tofu state show local_file.ledger`
  - `tofu state show terraform_data.ledger`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat original-id original-identity
  tofu state show local_file.ledger
  tofu state show terraform_data.ledger
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: '`local_file.ledger` y `terraform_data.ledger` conservan sus ID originales de proveedor y el
  contenido ledger.'
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.move_identity: Deben conservarse ambas identidades ledger vinculadas y el contenido original.
