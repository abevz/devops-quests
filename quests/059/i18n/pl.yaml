title: Adres zasobu zostaje przeniesiony
brief: |-
  Zarządzany rejestr potrzebuje nowego adresu w stanie bez utraty swojej tożsamości. Zachowaj oryginalny ID dostawcy.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`.

  **Wymagania:**
  - Zasób zapisany jako `local_file.ledger` zachowuje oryginalny ID dostawcy.
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.

  Sprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania.
stages.0.brief: Rejestr ma zachować tożsamość pod wymaganym adresem w stanie, bez oczekujących zmian.
stages.0.objectives.0.text: Zasób zapisany w state jako `local_file.ledger` zachowuje swój oryginalny
  ID providera.
stages.0.objectives.1.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Adres zasobu i tożsamość dostawcy opisują różne rzeczy.
hints.1.text: |-
  Porównaj stary adres state z nową nazwą zasobu. Zmiana nazwy bez moved wygląda jak usunięcie i utworzenie. Blok moved może zachować istniejącą tożsamość pod nowym adresem zasobu.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  cat main.tf
  tofu state list
  cat original-id
  ```
hints.2.text: |-
  Przenieś local_file.notice do local_file.ledger i zweryfikuj oryginalne ID i puste plan.

  Sprawdź wynik z `~/quest` na workstation:

  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - Oczekiwane: `local_file.ledger` jest zapisany z tym samym ID dostawcy co w `original-id`.

    ```sh
    cat original-id
    tofu state show local_file.ledger
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
debrief: Adres zasobu wymagał zmiany nazwy. Udokumentowałeś to za pomocą moved i zweryfikowałeś oryginał
  ID i pusty końcowy plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
