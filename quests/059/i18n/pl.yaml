title: Adres zasobu zostaje przeniesiony
brief: 'Dołączyłeś do operacji SignalRail. Zmień nazwę zarządzanego ledger bez jego zastępowania. Pracuj
  w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.'
stages.0.brief: Zmień nazwę adresu zasobu na local_file.ledger za pomocą bloku moved. Zachowaj ID.
stages.0.objectives.0.text: Zasób zapisany w state jako `local_file.ledger` zachowuje swój oryginalny
  ID providera.
stages.0.objectives.1.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Porównaj stary adres state z nową nazwą zasobu.
hints.1.text: Zmiana nazwy bez moved wygląda jak usuwanie i tworzenie.
hints.2.text: Przenieś local_file.notice do local_file.ledger i zweryfikuj oryginalne ID i puste plan.
debrief: Adres zasobu wymagał zmiany nazwy. Udokumentowałeś to za pomocą moved i zweryfikowałeś oryginał
  ID i pusty końcowy plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
