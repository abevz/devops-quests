title: Adres zasobu zostaje przeniesiony
brief: |-
  Planowana zmiana adresów zastąpiłaby powiązane obiekty ledger. Wykonaj ją, zachowując pierwotne tożsamości dostawcy i zawartość.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`.

  **Wymagania:**
  - Zasób zapisany jako `local_file.ledger` zachowuje oryginalny ID dostawcy.
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.

  - `local_file.ledger` i `terraform_data.ledger` zachowują pierwotne ID dostawcy i zawartość ledger.

  Sprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania.
stages.0.brief: Rejestr ma zachować tożsamość pod wymaganym adresem w stanie, bez oczekujących zmian.
stages.0.objectives.0.text: '`local_file.ledger` i `terraform_data.ledger` zachowują pierwotne ID dostawcy
  i zawartość ledger.'
stages.0.objectives.1.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Adresy konfiguracji i trwałe tożsamości dostawcy to różne rzeczy; zbadaj całą powiązaną
  zmianę przed zaakceptowaniem zastąpień.
hints.1.text: |-
  Porównaj żądane adresy, istniejący state i działania planu dla obu powiązanych zasobów. Zgodna suma kontrolna pliku nie identyfikuje trwałego obiektu towarzyszącego.

  ```sh
  cat main.tf
  tofu state list
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Zachowaj obie pierwotne tożsamości podczas migracji adresów. Sprawdź każdy obiekt state i pierwotne zapisy, a następnie wymagaj końcowego pustego planu.

  - `tofu state show local_file.ledger`
  - `tofu state show terraform_data.ledger`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat original-id original-identity
  tofu state show local_file.ledger
  tofu state show terraform_data.ledger
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: '`local_file.ledger` i `terraform_data.ledger` zachowują pierwotne ID dostawcy i zawartość ledger.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.move_identity: Obie powiązane tożsamości ledger i pierwotna zawartość muszą zostać zachowane.
