title: Перенос адреса ресурса
brief: |-
  Запланированный рефакторинг адресов заменил бы связанные объекты ledger. Выполните его, сохранив исходные provider ID и содержимое.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`.

  **Требования:**
  - Ресурс по адресу `local_file.ledger` в state сохраняет исходный ID провайдера.
  - OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.

  - Ресурсы `local_file.ledger` и `terraform_data.ledger` сохраняют исходные provider ID и содержимое ledger.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Реестр должен сохранить идентичность по требуемому адресу в state без ожидающих изменений.
stages.0.objectives.0.text: Ресурсы `local_file.ledger` и `terraform_data.ledger` сохраняют исходные provider
  ID и содержимое ledger.
stages.0.objectives.1.text: OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.
hints.0.text: Адреса конфигурации и постоянные provider ID различаются; изучите весь связанный рефакторинг
  до принятия замен.
hints.1.text: |-
  Сравните требуемые адреса, существующий state и действия плана для обоих связанных ресурсов. Совпадение контрольной суммы файла не определяет постоянную идентичность второго объекта.

  ```sh
  cat main.tf
  tofu state list
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Сохраните обе исходные идентичности при переносе адресов. Проверьте каждый объект state и исходные записи, затем добейтесь пустого итогового плана.

  - `tofu state show local_file.ledger`
  - `tofu state show terraform_data.ledger`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat original-id original-identity
  tofu state show local_file.ledger
  tofu state show terraform_data.ledger
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Ресурсы `local_file.ledger` и `terraform_data.ledger` сохраняют исходные provider ID и содержимое
  ledger.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.move_identity: Обе связанные идентичности ledger и исходное содержимое должны сохраняться.
