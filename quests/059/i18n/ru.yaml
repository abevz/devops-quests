title: Перенос адреса ресурса
brief: 'Вы в команде эксплуатации SignalRail. Измените адрес ресурса без пересоздания. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Адрес ledger изменился без пересоздания.'
stages.0.brief: 'Измените адрес на local_file.ledger через moved, сохранив ID.


  Результат проверки: Адрес ledger изменился без пересоздания.'
stages.0.objectives.0.text: Адрес ledger изменился без пересоздания.
hints.0.text: Сравните старый адрес в state с новым именем ресурса.
hints.1.text: Переименование без moved выглядит как удаление и создание.
hints.2.text: Перенесите local_file.notice в local_file.ledger и проверьте исходный ID и пустой plan.
debrief: Адрес ресурса требовал переименования. Вы описали moved и проверили исходный ID и пустой итоговый
  plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
