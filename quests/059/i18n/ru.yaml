title: Перенос адреса ресурса
brief: |-
  Управляемому реестру нужен новый адрес в state без потери существующей идентичности. Сохраните исходный ID провайдера.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`.

  **Требования:**
  - Ресурс по адресу `local_file.ledger` в state сохраняет исходный ID провайдера.
  - OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Реестр должен сохранить идентичность по требуемому адресу в state без ожидающих изменений.
stages.0.objectives.0.text: Ресурс с адресом `local_file.ledger` в state сохраняет исходный ID провайдера.
stages.0.objectives.1.text: OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.
hints.0.text: Адрес ресурса и идентичность провайдера описывают разные сущности.
hints.1.text: |-
  Сравните старый адрес в state с новым именем ресурса. Переименование без moved выглядит как удаление и создание. Блок moved позволяет сохранить существующую идентичность по новому адресу ресурса.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf
  tofu state list
  cat original-id
  ```
hints.2.text: |-
  Перенесите local_file.notice в local_file.ledger и проверьте исходный ID и пустой plan.

  Проверьте результат из `~/quest` на workstation:

  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - Ожидается ресурс `local_file.ledger` в state с тем же ID провайдера, что и в `original-id`.

    ```sh
    cat original-id
    tofu state show local_file.ledger
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Адрес ресурса требовал переименования. Вы описали moved и проверили исходный ID и пустой итоговый
  plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
