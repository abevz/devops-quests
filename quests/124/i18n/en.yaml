title: Volume reclaim and recovery
brief: 'Work in `~/quest` with `volume-contract.json`, `claim.json`, `board.json`, `service.json`, `client.json` and `original-claim-uid`.
  A PersistentVolume (PV) is the backing resource; a PVC is a claim on it. The contract supplies the original PV name and
  UID. Set its reclaim policy to `Retain`; its `storageClassName` must equal its volume name and its phase must be `Bound`.
  The PV claimRef UID must equal the current `ledger` PVC UID. The StorageClass default does not retroactively change an existing
  PV.


  In stage one, keep the original claim UID. In stage two, the bay removes that claim and introduces a replacement: verify
  the old claim is gone, use UID preconditions before clearing the old claimRef, and wait for the new claim to bind. Its UID
  must differ from `original-claim-uid`. Both stages require `board:8080` to return `north-124`. The check observes current
  PV, claim and response, not the history of how they were rebound or the response source. This local practice volume is not
  on the VM or NAS. Work only in the offline bay.'
debrief: The checks observed the retained PV, claim identities and board responses.
stages.0.brief: The original retained PV is bound to the original claim and board returns `north-124`.
stages.0.objectives.0.text: The original retained PV is bound to the original claim and board returns `north-124`.
stages.1.brief: The original retained PV is bound to a different claim UID and board returns `north-124`.
stages.1.objectives.0.text: The original retained PV is bound to a different claim UID and board returns `north-124`.
hints.0.text: Inspect the existing PV policy rather than assuming StorageClass defaults apply retroactively.
hints.1.text: A released retained PV can still name the deleted claim UID.
hints.2.text: Check identities, remove only the stale claimRef and let the pending replacement bind.
phrases.0: I changed the policy on the existing PV.
phrases.1: I compared the original and replacement claim identities.
phrases.2: I checked the board response and retained PV.
questions.0.points.0: No; the old claim reference can keep it Released.
questions.0.points.1: Rebind deliberately after checking ownership and data.
questions.0.prompt: Does Retain automatically attach the volume to a new claim?
questions.1.points.0: Existing PVs keep their own reclaim policy.
questions.1.points.1: Inspect and protect the actual volume before claim deletion.
questions.1.prompt: Does a StorageClass default change existing PV policy?
diagnostics.volume: volume-contract.json volume must be present.
diagnostics.pv_uid_fact: volume-contract.json pv_uid must be present.
diagnostics.pv_uid: PV UID must equal volume-contract.json pv_uid.
diagnostics.class: PV storageClassName must equal volume-contract.json volume.
diagnostics.reclaim: PV reclaimPolicy must equal Retain.
diagnostics.phase: PV phase must equal Bound.
diagnostics.claimref: PV claimRef UID must equal PVC/ledger UID.
diagnostics.http: board:8080 must equal north-124.
diagnostics.original: PVC/ledger UID must equal original-claim-uid.
diagnostics.replacement: PVC/ledger UID must differ from original-claim-uid.
