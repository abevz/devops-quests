title: Volume reclaim and recovery
brief: 'The bay has one synthetic local PV and a read-only board showing north-124.
  Protect this existing volume by changing its reclaim policy from Delete to Retain,
  preserving the PV and claim identities. The StorageClass remains read-only: its
  default policy does not retroactively protect existing PVs. In stage two the old
  claim is deliberately removed and a replacement waits for this retained PV. After
  checking that the old claim is gone, clear only the old claimRef with UID preconditions
  so the new claim can bind the same data. The path exists only inside the owned kind
  node, not on the VM or NAS.


  Quest files in `~/quest` (some appear in later stages): `volume-contract.json`,
  `claim.json`, `board.json`, `service.json`, `client.json`, `original-claim-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The original bound PV uses Retain, the original claim
  remains and the board serves north-124.'
debrief: Retain prevented automatic reclamation; explicit identity checks and rebind
  recovered the same record.
stages.0.brief: 'Success criteria: The original bound PV uses Retain, the original
  claim remains and the board serves north-124.'
stages.0.objectives.0.text: The original bound PV uses Retain, the original claim
  remains and the board serves north-124.
stages.1.brief: 'Success criteria: A new claim binds the original retained PV and
  reads the original north-124 record.'
stages.1.objectives.0.text: A new claim binds the original retained PV and reads the
  original north-124 record.
hints.0.text: Inspect the existing PV policy rather than assuming StorageClass defaults
  apply retroactively.
hints.1.text: A released retained PV can still name the deleted claim UID.
hints.2.text: Check identities, remove only the stale claimRef and let the pending
  replacement bind.
phrases.0: I changed the policy on the existing PV.
phrases.1: I checked the deleted claim identity before rebinding.
phrases.2: I recovered the original bytes without replacing storage.
questions.0.points.0: No; the old claim reference can keep it Released.
questions.0.points.1: Rebind deliberately after checking ownership and data.
questions.0.prompt: Does Retain automatically attach the volume to a new claim?
questions.1.points.0: Existing PVs keep their own reclaim policy.
questions.1.points.1: Inspect and protect the actual volume before claim deletion.
questions.1.prompt: Does a StorageClass default change existing PV policy?
