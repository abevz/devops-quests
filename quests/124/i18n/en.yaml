diagnostics.volume: Verify that the supplied contract records the volume name. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-contract-volume)
diagnostics.pv_uid_fact: Verify that the supplied contract records the original PV UID. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-contract-uid)
diagnostics.pv_uid: The recorded PV may be missing or have a different UID. Compare the live UID with pv_uid in volume-contract.json. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-live-identity)
diagnostics.class: The PV may have a different storageClassName. Compare it with volume in volume-contract.json. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-storage-class)
diagnostics.reclaim: The PV may lack the Retain reclaim policy. Check the live policy before changing the claim. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-retain-policy)
diagnostics.phase: The PV may still be waiting for a matching claim. Check that its current phase is Bound. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-bound-phase)
diagnostics.claimref: The PV may still reference an earlier ledger claim. Compare claimRef.uid with the UID of the current ledger PVC. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-current-claimref)
diagnostics.original: The ledger PVC may be missing or may already have been replaced. At this stage its UID must equal original-claim-uid. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-original-claim)
diagnostics.replacement: The replacement ledger PVC may be missing, or the original claim may still be present. At this stage compare its UID with original-claim-uid and confirm they differ. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-replacement-claim)
diagnostics.http: The client may fail to reach board:8080 or receive different data. Check the live response for north-124. [Cause and check](guides#guide=storage-lifecycle&section=q124-pv-board-content)
