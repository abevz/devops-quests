title: Volume reclaim and recovery
brief: |-
  The volume must remain usable across two claim states. Preserve its identity and retention contract while restoring the board response.

  Work on the workstation in `~/quest` with the supplied files:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stage 1:
    - The original volume identified by `volume-contract.json` keeps its identity and storage class and retains its data after claim deletion.
    - The PV is `Bound` to the current `ledger` PVC UID, and that claim keeps its original nonempty UID.
    - From Deployment `client`, `http://board:8080` returns `north-124`.

  - Stage 2:
    - The original volume identified by `volume-contract.json` keeps its identity and storage class and retains its data after claim deletion.
    - The same PV is `Bound` to the current `ledger` PVC UID, which is nonempty and differs from the original claim UID.
    - From Deployment `client`, `http://board:8080` returns `north-124`.

  Checks observe current PV, claim and response, not rebinding history or response origin; the local practice volume is not on the VM or NAS.
debrief: The checks observed the retained PV, claim identities and board responses.
stages.0.brief: The original volume and claim must remain bound and usable.
stages.1.brief: The retained volume must be bound to the replacement claim and remain usable.
hints.0.text: Inspect the existing PV policy rather than assuming StorageClass defaults apply retroactively.
hints.1.text: |-
  A released retained PV can still name the deleted claim UID.

  Inspect the supplied inputs and live observations:

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Check identities, remove only the stale claimRef and let the pending replacement bind. Verify the old claim is gone and use UID preconditions before clearing its stale claimRef. StorageClass defaults do not retroactively change an existing PV.

  Verify the result from `~/quest` on the workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — The consumer receives `north-124` in both stages.
phrases.0: I changed the policy on the existing PV.
phrases.1: I compared the original and replacement claim identities.
phrases.2: I checked the board response and retained PV.
questions.0.points.0: No; the old claim reference can keep it Released.
questions.0.points.1: Rebind deliberately after checking ownership and data.
questions.0.prompt: Does Retain automatically attach the volume to a new claim?
questions.1.points.0: Existing PVs keep their own reclaim policy.
questions.1.points.1: Inspect and protect the actual volume before claim deletion.
questions.1.prompt: Does a StorageClass default change existing PV policy?
diagnostics.volume: volume-contract.json volume must be present.
diagnostics.pv_uid_fact: volume-contract.json pv_uid must be present.
diagnostics.pv_uid: PV UID must equal volume-contract.json pv_uid.
diagnostics.class: PV storageClassName must equal volume-contract.json volume.
diagnostics.reclaim: PV reclaimPolicy must equal Retain.
diagnostics.phase: PV phase must equal Bound.
diagnostics.claimref: PV claimRef UID must equal PVC/ledger UID.
diagnostics.http: board:8080 must equal north-124.
diagnostics.original: PVC/ledger UID must equal original-claim-uid.
diagnostics.replacement: PVC/ledger UID must differ from original-claim-uid.
