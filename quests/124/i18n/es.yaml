title: Recuperación y recuperación de volumen.
brief: |-
  El volumen debe seguir utilizable en dos estados del claim. Conserve su identidad y contrato de retención mientras restaura la respuesta board.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etapa 1:
    - El volumen original identificado por `volume-contract.json` conserva su identidad y clase de almacenamiento y retiene sus datos tras borrar el claim.
    - El PV está `Bound` al UID actual del PVC `ledger`, y el claim conserva su UID original no vacío.
    - Desde el Deployment `client`, `http://board:8080` devuelve `north-124`.

  - Etapa 2:
    - El volumen original identificado por `volume-contract.json` conserva su identidad y clase de almacenamiento y retiene sus datos tras borrar el claim.
    - El mismo PV está `Bound` al UID actual del PVC `ledger`, que no está vacío y difiere del UID original.
    - Desde el Deployment `client`, `http://board:8080` devuelve `north-124`.

  Las comprobaciones observan el PV, claim y respuesta actuales, no el historial de revinculación ni el origen de la respuesta; el volumen local de práctica no está en la VM o NAS.
debrief: Las comprobaciones observaron el PV con Retain, identidades de claims y respuestas de board.
stages.0.brief: El volumen y claim originales deben seguir vinculados y utilizables.
stages.1.brief: El volumen conservado debe estar vinculado al claim de reemplazo y seguir utilizable.
hints.0.text: Inspeccione la política PV existente en lugar de asumir que StorageClass defaults se aplica
  retroactivamente.
hints.1.text: |-
  Un PV retenido y liberado aún puede nombrar el claim UID eliminado.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Verifique identities, elimine solo el claimRef obsoleto y deje que se vincule el reemplazo pendiente. Compruebe que el claim anterior ya no existe y use precondiciones UID antes de limpiar su claimRef obsoleto. Los valores StorageClass no cambian un PV existente retroactivamente.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-124` en ambas etapas.
phrases.0: Cambié la política en el PV existente.
phrases.1: Comparé las identidades del claim original y el nuevo.
phrases.2: Comprobé la respuesta de board y el PV conservado.
questions.0.points.0: No; la antigua referencia claim puede conservarla Released.
questions.0.points.1: Vuelva a vincular deliberadamente después de verificar la propiedad y los datos.
questions.0.prompt: ¿Retain conecta automáticamente el volumen a un nuevo claim?
questions.1.points.0: Los fotovoltaicos existentes mantienen su propio reclaim policy.
questions.1.points.1: Inspeccione y proteja el volumen real antes de eliminar claim.
questions.1.prompt: ¿Un valor predeterminado de StorageClass cambia la política PV existente?
diagnostics.volume: volume-contract.json volume debe estar presente.
diagnostics.pv_uid_fact: volume-contract.json pv_uid debe estar presente.
diagnostics.pv_uid: PV UID debe ser igual a volume-contract.json pv_uid.
diagnostics.class: PV storageClassName debe ser igual a volume-contract.json volume.
diagnostics.reclaim: PV reclaimPolicy debe ser igual a Retain.
diagnostics.phase: PV phase debe ser igual a Bound.
diagnostics.claimref: PV claimRef UID debe ser igual a PVC/ledger UID.
diagnostics.http: board:8080 debe ser igual a north-124.
diagnostics.original: PVC/ledger UID debe ser igual a original-claim-uid.
diagnostics.replacement: PVC/ledger UID debe ser diferente de original-claim-uid.
