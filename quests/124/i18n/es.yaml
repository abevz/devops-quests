title: Recuperación y recuperación de volumen.
brief: 'Trabaja en `~/quest` con `volume-contract.json`, `claim.json`, `board.json`, `service.json`, `client.json` y `original-claim-uid`.
  Un PersistentVolume (PV) es el recurso de almacenamiento; un PVC lo reclama. El contrato proporciona el nombre y UID del
  PV original. Establece su política de recuperación en `Retain`; su `storageClassName` debe ser igual al nombre del volumen
  y su fase debe ser `Bound`. El UID de claimRef del PV debe coincidir con el UID actual del PVC `ledger`. El valor predeterminado
  de StorageClass no modifica retroactivamente un PV existente.


  En la primera etapa conserva el UID original del claim. En la segunda, la bahía elimina ese claim y presenta uno nuevo:
  verifica que el anterior desapareció, usa precondiciones UID antes de quitar el claimRef antiguo y espera a que se vincule
  el nuevo claim. Su UID debe diferir de `original-claim-uid`. En ambas etapas `board:8080` debe devolver `north-124`. La
  comprobación observa PV, claim y respuesta actuales, no la historia del vínculo ni el origen de la respuesta. Este volumen
  local de práctica no está en la VM ni en un NAS. Trabaja solo en la bahía sin conexión.'
debrief: Las comprobaciones observaron el PV con Retain, identidades de claims y respuestas de board.
stages.0.brief: El PV original con Retain está vinculado al claim original y board devuelve `north-124`.
stages.0.objectives.0.text: El PV original con Retain está vinculado al claim original y board devuelve `north-124`.
stages.1.brief: El PV original con Retain está vinculado a un claim con otro UID y board devuelve `north-124`.
stages.1.objectives.0.text: El PV original con Retain está vinculado a un claim con otro UID y board devuelve `north-124`.
hints.0.text: Inspeccione la política PV existente en lugar de asumir que StorageClass defaults se aplica retroactivamente.
hints.1.text: Un PV retenido y liberado aún puede nombrar el claim UID eliminado.
hints.2.text: Verifique identities, elimine solo el claimRef obsoleto y deje que se vincule el reemplazo pendiente.
phrases.0: Cambié la política en el PV existente.
phrases.1: Comparé las identidades del claim original y el nuevo.
phrases.2: Comprobé la respuesta de board y el PV conservado.
questions.0.points.0: No; la antigua referencia claim puede conservarla Released.
questions.0.points.1: Vuelva a vincular deliberadamente después de verificar la propiedad y los datos.
questions.0.prompt: ¿Retain conecta automáticamente el volumen a un nuevo claim?
questions.1.points.0: Los fotovoltaicos existentes mantienen su propio reclaim policy.
questions.1.points.1: Inspeccione y proteja el volumen real antes de eliminar claim.
questions.1.prompt: ¿Un valor predeterminado de StorageClass cambia la política PV existente?
diagnostics.volume: volume-contract.json volume debe estar presente.
diagnostics.pv_uid_fact: volume-contract.json pv_uid debe estar presente.
diagnostics.pv_uid: PV UID debe ser igual a volume-contract.json pv_uid.
diagnostics.class: PV storageClassName debe ser igual a volume-contract.json volume.
diagnostics.reclaim: PV reclaimPolicy debe ser igual a Retain.
diagnostics.phase: PV phase debe ser igual a Bound.
diagnostics.claimref: PV claimRef UID debe ser igual a PVC/ledger UID.
diagnostics.http: board:8080 debe ser igual a north-124.
diagnostics.original: PVC/ledger UID debe ser igual a original-claim-uid.
diagnostics.replacement: PVC/ledger UID debe ser diferente de original-claim-uid.
