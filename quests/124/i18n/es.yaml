title: Recuperación y recuperación de volumen.
brief: 'La bahía tiene un local PV sintético y un board de solo lectura que muestra north-124. Proteja
  este volumen existente cambiando su reclaim policy de Delete a Retain, preservando el PV y claim. identities.
  El StorageClass sigue siendo de solo lectura: su policy predeterminado no protege retroactivamente los
  PV existentes. En la etapa dos, el antiguo claim se elimina deliberadamente y se espera un reemplazo
  para este PV conservado. Después de comprobar que el antiguo claim ya no está, borre solo el antiguo
  claimRef con UID preconditions para que el nuevo claim pueda vincular los mismos datos. La ruta existe
  solo dentro del nodo kind de propiedad, no en VM o NAS.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `volume-contract.json`,
  `claim.json`, `board.json`, `service.json`, `client.json`, `original-claim-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El PV encuadernado original usa Retain, el claim original permanece y
  el board sirve para north-124.'
debrief: Retain impidió la recuperación automática; verificaciones de identidad explícitas y rebind recuperaron
  el mismo registro.
