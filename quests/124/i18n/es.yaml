title: Recuperación y recuperación de volumen.
brief: |-
  El volumen debe seguir utilizable en dos estados del claim. Conserve su identidad y contrato de retención mientras restaura la respuesta board.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etapa 1:
    - El volumen original identificado por `volume-contract.json` conserva su identidad y clase de almacenamiento y retiene sus datos tras borrar el claim.
    - El PV está `Bound` al UID actual del PVC `ledger`, y el claim conserva su UID original no vacío.
    - Desde el Deployment `client`, `http://board:8080` devuelve `north-124`.

  - Etapa 2:
    - El volumen original identificado por `volume-contract.json` conserva su identidad y clase de almacenamiento y retiene sus datos tras borrar el claim.
    - El mismo PV está `Bound` al UID actual del PVC `ledger`, que no está vacío y difiere del UID original.
    - Desde el Deployment `client`, `http://board:8080` devuelve `north-124`.

  Las comprobaciones observan el PV, claim y respuesta actuales, no el historial de revinculación ni el origen de la respuesta; el volumen local de práctica no está en la VM o NAS.
debrief: Las comprobaciones observaron el PV con Retain, identidades de claims y respuestas de board.
stages.0.brief: El volumen y claim originales deben seguir vinculados y utilizables.
stages.1.brief: El volumen conservado debe estar vinculado al claim de reemplazo y seguir utilizable.
hints.0.text: Inspeccione la política PV existente en lugar de asumir que StorageClass defaults se aplica
  retroactivamente.
hints.1.text: |-
  Un PV retenido y liberado aún puede nombrar el claim UID eliminado.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Verifique identities, elimine solo el claimRef obsoleto y deje que se vincule el reemplazo pendiente. Compruebe que el claim anterior ya no existe y use precondiciones UID antes de limpiar su claimRef obsoleto. Los valores StorageClass no cambian un PV existente retroactivamente.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-124` en ambas etapas.
phrases.0: Cambié la política en el PV existente.
phrases.1: Comparé las identidades del claim original y el nuevo.
phrases.2: Comprobé la respuesta de board y el PV conservado.
questions.0.points.0: No; la antigua referencia claim puede conservarla Released.
questions.0.points.1: Vuelva a vincular deliberadamente después de verificar la propiedad y los datos.
questions.0.prompt: ¿Retain conecta automáticamente el volumen a un nuevo claim?
questions.1.points.0: Los fotovoltaicos existentes mantienen su propio reclaim policy.
questions.1.points.1: Inspeccione y proteja el volumen real antes de eliminar claim.
questions.1.prompt: ¿Un valor predeterminado de StorageClass cambia la política PV existente?
stages.0.objectives.0.text: El volumen original identificado por `volume-contract.json` conserva su identidad
  y clase de almacenamiento y retiene sus datos tras borrar el claim.
stages.0.objectives.1.text: El PV está `Bound` al UID actual del PVC `ledger`, y el claim conserva su
  UID original no vacío.
stages.0.objectives.2.text: Desde el Deployment `client`, `http://board:8080` devuelve `north-124`.
stages.1.objectives.0.text: El volumen original identificado por `volume-contract.json` conserva su identidad
  y clase de almacenamiento y retiene sus datos tras borrar el claim.
stages.1.objectives.1.text: El mismo PV está `Bound` al UID actual del PVC `ledger`, que no está vacío
  y difiere del UID original.
stages.1.objectives.2.text: Desde el Deployment `client`, `http://board:8080` devuelve `north-124`.
diagnostics.volume: Comprueba si el contrato proporcionado contiene el nombre del volumen. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-contract-volume)
diagnostics.pv_uid_fact: Comprueba si el contrato proporcionado contiene el UID del PV original. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-contract-uid)
diagnostics.pv_uid: Es posible que falte el PV registrado o que tenga otro UID. Compara el UID actual con pv_uid en volume-contract.json. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-live-identity)
diagnostics.class: Es posible que el PV tenga otro valor en storageClassName. Compáralo con volume en volume-contract.json. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-storage-class)
diagnostics.reclaim: Es posible que el PV carezca de la política de recuperación Retain. Comprueba la política actual antes de cambiar el PVC. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-retain-policy)
diagnostics.phase: Es posible que el PV aún espere un PVC compatible. Comprueba que su fase actual sea Bound. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-bound-phase)
diagnostics.claimref: Es posible que el PV aún haga referencia a un PVC ledger anterior. Compara claimRef.uid con el UID del PVC ledger actual. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-current-claimref)
diagnostics.original: Es posible que falte el PVC ledger o que ya se haya sustituido. En esta fase, su UID debe coincidir con original-claim-uid. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-original-claim)
diagnostics.replacement: Es posible que falte el nuevo PVC ledger o que aún permanezca el original. En esta fase, compara su UID con original-claim-uid y comprueba que sean distintos. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-replacement-claim)
diagnostics.http: Es posible que client no llegue a board:8080 o reciba datos distintos. Comprueba si la respuesta real es north-124. [Causa y comprobación](guides#guide=storage-lifecycle&section=q124-pv-board-content)
