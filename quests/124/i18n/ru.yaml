title: Reclaim томов и восстановление
brief: "Том должен оставаться пригодным к использованию при двух состояниях PVC. Сохраните его идентичность и контракт\
  \ удержания, восстановив ответ board.\n\nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы: `volume-contract.json`,\
  \ `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`, `original-claim-uid`.\n\n**Requirements:**\n\n- Этап\
  \ 1:\n  - Исходный PV из `volume-contract.json` сохранён, использует политику возврата `Retain` и имя класса хранения,\
  \ совпадающее с именем тома.\n  - PV имеет состояние `Bound` и связан с текущим UID PVC `ledger`, а этот PVC сохраняет\
  \ исходный непустой UID.\n  - Из Deployment `client` адрес `http://board:8080` возвращает `north-124`.\n- Этап\
  \ 2:\n  - Исходный PV из `volume-contract.json` сохранён, использует политику возврата `Retain` и имя класса хранения,\
  \ совпадающее с именем тома.\n  - Тот же PV имеет состояние `Bound` и связан с текущим UID PVC `ledger`, который\
  \ непуст и отличается от исходного UID PVC.\n  - Из Deployment `client` адрес `http://board:8080` возвращает `north-124`.\n\
  \n**Verify yourself before Check & finish:** Выполните эти команды наблюдения из `~/quest` на рабочей станции.\n\
  \n- Настройки, идентичности и состояние соответствуют требованиям.\n\n  ```sh\n  cat volume-contract.json original-claim-uid\n\
  \  volume=$(jq -r .volume volume-contract.json)\n  kubectl get pv \"$volume\" -o yaml\n  kubectl get pvc ledger\
  \ -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Потребитель получает\
  \ `north-124` на обоих этапах.\n\nПроверки наблюдают текущие PV, PVC и ответ, а не историю повторной привязки\
  \ или источник ответа; локальный учебный том не находится на VM или NAS."
debrief: Проверки наблюдали PV с Retain, идентичности claim и ответы board.
stages.0.brief: Исходные том и PVC должны оставаться связанными и работоспособными.
stages.1.brief: Сохранённый том должен быть связан с заменяющим PVC и оставаться работоспособным.
hints.0.text: Изучите политику существующего PV, не переносите на него defaults StorageClass задним числом.
hints.1.text: Released PV с Retain может ещё ссылаться на UID удалённого claim.
hints.2.text: Проверьте identities, уберите только устаревший claimRef и дождитесь связывания замены. Убедитесь,
  что старый PVC удалён, и используйте предусловия UID перед очисткой его устаревшего claimRef. Значения StorageClass
  по умолчанию не меняют существующий PV задним числом.
phrases.0: Я изменил политику существующего PV.
phrases.1: Я сравнил идентичности исходного и нового claim.
phrases.2: Я проверил ответ board и сохранённый PV.
questions.0.points.0: 'Нет: старая ссылка claim может удерживать Released.'
questions.0.points.1: Выполняйте rebind осознанно после проверки владения и данных.
questions.0.prompt: Подключает ли Retain том к новому claim автоматически?
questions.1.points.0: Существующие PV сохраняют собственную reclaim policy.
questions.1.points.1: Изучите и защитите реальный том до удаления claim.
questions.1.prompt: Меняет ли default StorageClass политику существующего PV?
diagnostics.volume: volume-contract.json volume должен присутствовать.
diagnostics.pv_uid_fact: volume-contract.json pv_uid должен присутствовать.
diagnostics.pv_uid: PV UID должен совпадать с volume-contract.json pv_uid.
diagnostics.class: PV storageClassName должен совпадать с volume-contract.json volume.
diagnostics.reclaim: PV reclaimPolicy должен совпадать с Retain.
diagnostics.phase: PV phase должен совпадать с Bound.
diagnostics.claimref: PV claimRef UID должен совпадать с PVC/ledger UID.
diagnostics.http: board:8080 должен совпадать с north-124.
diagnostics.original: PVC/ledger UID должен совпадать с original-claim-uid.
diagnostics.replacement: PVC/ledger UID должен отличаться от original-claim-uid.
