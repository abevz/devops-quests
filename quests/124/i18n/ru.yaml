title: Reclaim томов и восстановление
brief: 'Работайте в `~/quest` с `volume-contract.json`, `claim.json`, `board.json`, `service.json`, `client.json` и `original-claim-uid`.
  PersistentVolume (PV) — ресурс хранения, а PVC — запрос на него. Контракт содержит исходное имя и UID PV. Установите политику
  возврата в `Retain`; `storageClassName` должен совпадать с именем тома, а фаза — быть `Bound`. UID claimRef PV должен совпадать
  с текущим UID PVC `ledger`. Значение StorageClass по умолчанию не меняет существующий PV задним числом.


  На первом этапе сохраните исходный UID claim. На втором песочница удаляет его и создаёт новый: убедитесь, что старый claim
  исчез, используйте UID-предусловия перед удалением старого claimRef и дождитесь привязки нового claim. Его UID должен отличаться
  от `original-claim-uid`. На обоих этапах `board:8080` должен возвращать `north-124`. Проверка наблюдает текущие PV, claim
  и ответ, но не историю привязки или источник ответа. Этот локальный учебный том не находится на VM или NAS. Работайте только
  в офлайн-песочнице.'
debrief: Проверки наблюдали PV с Retain, идентичности claim и ответы board.
stages.0.brief: Исходный PV с Retain привязан к исходному claim, а board возвращает `north-124`.
stages.0.objectives.0.text: Исходный PV с Retain привязан к исходному claim, а board возвращает `north-124`.
stages.1.brief: Исходный PV с Retain привязан к claim с другим UID, а board возвращает `north-124`.
stages.1.objectives.0.text: Исходный PV с Retain привязан к claim с другим UID, а board возвращает `north-124`.
hints.0.text: Изучите политику существующего PV, не переносите на него defaults StorageClass задним числом.
hints.1.text: Released PV с Retain может ещё ссылаться на UID удалённого claim.
hints.2.text: Проверьте identities, уберите только устаревший claimRef и дождитесь связывания замены.
phrases.0: Я изменил политику существующего PV.
phrases.1: Я сравнил идентичности исходного и нового claim.
phrases.2: Я проверил ответ board и сохранённый PV.
questions.0.points.0: 'Нет: старая ссылка claim может удерживать Released.'
questions.0.points.1: Выполняйте rebind осознанно после проверки владения и данных.
questions.0.prompt: Подключает ли Retain том к новому claim автоматически?
questions.1.points.0: Существующие PV сохраняют собственную reclaim policy.
questions.1.points.1: Изучите и защитите реальный том до удаления claim.
questions.1.prompt: Меняет ли default StorageClass политику существующего PV?
