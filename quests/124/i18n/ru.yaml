title: Reclaim томов и восстановление
brief: 'У песочницы один учебный local PV и табло только для чтения с north-124. Защитите
  существующий том, изменив reclaim policy Delete на Retain, сохраняя identities PV
  и claim. StorageClass доступен только для чтения: его политика по умолчанию не защищает
  существующие PV задним числом. На втором этапе старый claim намеренно удалён, а
  новый ждёт этот сохранённый PV. Проверив отсутствие старого claim, уберите только
  прежний claimRef с UID preconditions, чтобы новый claim подключил те же данные.
  Путь существует только внутри принадлежащего игре узла kind, не на VM или NAS.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `volume-contract.json`,
  `claim.json`, `board.json`, `service.json`, `client.json`, `original-claim-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Исходный связанный PV использует Retain, claim прежний, табло
  отдаёт north-124.'
debrief: Retain предотвратил автоматическое освобождение; явные проверки identities
  и rebind вернули ту же запись.
