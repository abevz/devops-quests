diagnostics.volume: Проверьте, записано ли имя тома в выданном контракте. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-contract-volume)
diagnostics.pv_uid_fact: Проверьте, записан ли UID исходного PV в выданном контракте. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-contract-uid)
diagnostics.pv_uid: PV из контракта может отсутствовать или иметь другой UID. Сравните текущий UID с pv_uid из volume-contract.json. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-live-identity)
diagnostics.class: У PV может быть другое значение storageClassName. Сравните его с volume в volume-contract.json. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-storage-class)
diagnostics.reclaim: У PV может отсутствовать политика Retain. Проверьте действующую политику перед изменением PVC. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-retain-policy)
diagnostics.phase: PV может всё ещё ожидать подходящий PVC. Убедитесь, что текущая фаза тома — Bound. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-bound-phase)
diagnostics.claimref: PV может по-прежнему ссылаться на прежний PVC ledger. Сравните claimRef.uid с UID текущего PVC ledger. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-current-claimref)
diagnostics.original: PVC ledger мог исчезнуть или уже быть заменён. На этой фазе его UID должен совпадать с original-claim-uid. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-original-claim)
diagnostics.replacement: Новый PVC ledger может отсутствовать, а прежний PVC всё ещё существовать. На этой фазе сравните его UID с original-claim-uid и убедитесь, что они различаются. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-replacement-claim)
diagnostics.http: Клиент может не достучаться до board:8080 или получить другие данные. Проверьте, что в фактическом ответе приходит north-124. [Причина и проверка](guides#guide=storage-lifecycle&section=q124-pv-board-content)
