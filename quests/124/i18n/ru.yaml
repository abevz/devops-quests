title: Reclaim томов и восстановление
brief: |-
  Том должен оставаться пригодным к использованию при двух состояниях PVC. Сохраните его идентичность и контракт удержания, восстановив ответ board.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Этап 1:
    - Исходный том из `volume-contract.json` сохраняет идентичность и класс хранения и удерживает данные после удаления claim.
    - PV имеет состояние `Bound` и связан с текущим UID PVC `ledger`, а этот PVC сохраняет исходный непустой UID.
    - Из Deployment `client` адрес `http://board:8080` возвращает `north-124`.

  - Этап 2:
    - Исходный том из `volume-contract.json` сохраняет идентичность и класс хранения и удерживает данные после удаления claim.
    - Тот же PV имеет состояние `Bound` и связан с текущим UID PVC `ledger`, который непуст и отличается от исходного UID PVC.
    - Из Deployment `client` адрес `http://board:8080` возвращает `north-124`.

  Проверки наблюдают текущие PV, PVC и ответ, а не историю повторной привязки или источник ответа; локальный учебный том не находится на VM или NAS.
debrief: Проверки наблюдали PV с Retain, идентичности claim и ответы board.
stages.0.brief: Исходные том и PVC должны оставаться связанными и работоспособными.
stages.1.brief: Сохранённый том должен быть связан с заменяющим PVC и оставаться работоспособным.
hints.0.text: Изучите политику существующего PV, не переносите на него defaults StorageClass задним числом.
hints.1.text: |-
  Released PV с Retain может ещё ссылаться на UID удалённого claim.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Проверьте identities, уберите только устаревший claimRef и дождитесь связывания замены. Убедитесь, что старый PVC удалён, и используйте предусловия UID перед очисткой его устаревшего claimRef. Значения StorageClass по умолчанию не меняют существующий PV задним числом.

  Проверьте результат из `~/quest` на workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Потребитель получает `north-124` на обоих этапах.
phrases.0: Я изменил политику существующего PV.
phrases.1: Я сравнил идентичности исходного и нового claim.
phrases.2: Я проверил ответ board и сохранённый PV.
questions.0.points.0: 'Нет: старая ссылка claim может удерживать Released.'
questions.0.points.1: Выполняйте rebind осознанно после проверки владения и данных.
questions.0.prompt: Подключает ли Retain том к новому claim автоматически?
questions.1.points.0: Существующие PV сохраняют собственную reclaim policy.
questions.1.points.1: Изучите и защитите реальный том до удаления claim.
questions.1.prompt: Меняет ли default StorageClass политику существующего PV?
