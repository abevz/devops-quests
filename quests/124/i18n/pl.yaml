title: Odzyskiwanie i odzyskiwanie woluminów
brief: |-
  Wolumen musi pozostać użyteczny w dwóch stanach claimu. Zachowaj jego tożsamość i kontrakt retencji, przywracając odpowiedź board.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etap 1:
    - Pierwotny wolumen wskazany przez `volume-contract.json` zachowuje tożsamość i klasę pamięci oraz dane po usunięciu claimu.
    - PV jest `Bound` z bieżącym UID PVC `ledger`, a ten claim zachowuje pierwotny niepusty UID.
    - Z Deployment `client` adres `http://board:8080` zwraca `north-124`.

  - Etap 2:
    - Pierwotny wolumen wskazany przez `volume-contract.json` zachowuje tożsamość i klasę pamięci oraz dane po usunięciu claimu.
    - Ten sam PV jest `Bound` z bieżącym UID PVC `ledger`, który jest niepusty i różni się od pierwotnego UID claimu.
    - Z Deployment `client` adres `http://board:8080` zwraca `north-124`.

  Kontrole obserwują bieżący PV, claim i odpowiedź, nie historię ponownego wiązania ani źródło odpowiedzi; lokalny wolumen ćwiczeniowy nie znajduje się na VM ani NAS.
debrief: Kontrole sprawdziły PV z Retain, tożsamości claimów i odpowiedzi board.
stages.0.brief: Oryginalny wolumen i claim muszą pozostać związane i użyteczne.
stages.1.brief: Zachowany wolumen musi być związany z zastępczym claimem i pozostać użyteczny.
hints.0.text: Zamiast zakładać, że wartości domyślne StorageClass obowiązują z mocą wsteczną, sprawdź
  istniejącą politykę PV.
hints.1.text: |-
  Zwolniony zachowany PV może nadal nazywać usunięty claim UID.

  Sprawdź dostarczone dane i bieżące obserwacje:

  Etap 1. Sprawdź reclaim policy i UID istniejącego PV oraz UID bieżącego claimu ledger. Etap 2. Porównaj UID claimRef zachowanego PV z original-claim-uid i UID bieżącego nowego PVC. Sprawdź, czy nowe PVC ma stan Pending.

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-124` na obu etapach.

  ```sh
  volume=$(jq -r .volume volume-contract.json)
  jq '{volume,pv_uid}' volume-contract.json
  cat original-claim-uid; printf "\n"
  kubectl get pv "$volume" -o json | jq '{uid:.metadata.uid, class:.spec.storageClassName, reclaim:.spec.persistentVolumeReclaimPolicy, phase:.status.phase, claim_uid:.spec.claimRef.uid}'
  kubectl get pvc ledger -o jsonpath='{.metadata.uid} {.status.phase} {.spec.volumeName}{"\n"}'
  ```

  PV zachowuje UID i jest w stanie Bound z ledger. Na etapie 1 UID bieżącego claimu jest pierwotny. Na etapie 2 potwierdź inny UID. Porównaj UID i klasę pamięci PV z pv_uid i volume, sprawdź Retain i porównaj claim_uid z UID bieżącego PVC.
phrases.0: Zmieniłem politykę dotyczącą istniejącego PV.
phrases.1: Porównałem tożsamości pierwotnego i nowego claim.
phrases.2: Sprawdziłem odpowiedź board i zachowany PV.
questions.0.points.0: NIE; stare odniesienie claim może zachować Released.
questions.0.points.1: Połącz ponownie celowo po sprawdzeniu własności i danych.
questions.0.prompt: Czy Retain automatycznie podłącza wolumen do nowego claim?
questions.1.points.0: Istniejące PVs zachowują własne reclaim policy.
questions.1.points.1: Sprawdź i chroń rzeczywisty wolumin przed usunięciem claim.
questions.1.prompt: Czy wartość domyślna StorageClass zmienia istniejącą politykę PV?
stages.0.objectives.0.text: Pierwotny wolumen wskazany przez `volume-contract.json` zachowuje tożsamość
  i klasę pamięci oraz dane po usunięciu claimu.
stages.0.objectives.1.text: PV jest `Bound` z bieżącym UID PVC `ledger`, a ten claim zachowuje pierwotny
  niepusty UID.
stages.0.objectives.2.text: Z Deployment `client` adres `http://board:8080` zwraca `north-124`.
stages.1.objectives.0.text: Pierwotny wolumen wskazany przez `volume-contract.json` zachowuje tożsamość
  i klasę pamięci oraz dane po usunięciu claimu.
stages.1.objectives.1.text: Ten sam PV jest `Bound` z bieżącym UID PVC `ledger`, który jest niepusty i
  różni się od pierwotnego UID claimu.
stages.1.objectives.2.text: Z Deployment `client` adres `http://board:8080` zwraca `north-124`.
diagnostics.volume: Sprawdź, czy dostarczony kontrakt zawiera nazwę wolumenu. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-contract-volume)
diagnostics.pv_uid_fact: Sprawdź, czy dostarczony kontrakt zawiera UID pierwotnego PV. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-contract-uid)
diagnostics.pv_uid: PV zapisany w kontrakcie może nie istnieć lub mieć inny UID. Porównaj bieżący UID z pv_uid w volume-contract.json. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-live-identity)
diagnostics.class: PV może mieć inną wartość storageClassName. Porównaj ją z volume w volume-contract.json. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-storage-class)
diagnostics.reclaim: W PV może brakować polityki odzyskiwania Retain. Sprawdź bieżącą politykę przed zmianą PVC. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-retain-policy)
diagnostics.phase: PV może nadal czekać na pasujący PVC. Sprawdź, czy jego bieżąca faza to Bound. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-bound-phase)
diagnostics.claimref: PV może nadal odwoływać się do wcześniejszego PVC ledger. Porównaj claimRef.uid z UID bieżącego PVC ledger. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-current-claimref)
diagnostics.original: PVC ledger może nie istnieć lub mógł już zostać zastąpiony. Na tym etapie jego UID musi być zgodny z original-claim-uid. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-original-claim)
diagnostics.replacement: Nowy PVC ledger może nie istnieć lub nadal może istnieć pierwotny PVC. Na tym etapie porównaj jego UID z original-claim-uid i potwierdź, że się różnią. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-replacement-claim)
diagnostics.http: client może nie mieć dostępu do board:8080 lub może otrzymać inne dane. Sprawdź, czy rzeczywista odpowiedź to north-124. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q124-pv-board-content)
