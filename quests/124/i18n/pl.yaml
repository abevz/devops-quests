diagnostics.class: PV storageClassName musi być równe volume-contract.json volume.
diagnostics.reclaim: PV reclaimPolicy musi być równe Retain.
diagnostics.phase: PV phase musi być równe Bound.
diagnostics.claimref: PV claimRef UID musi być równe PVC/ledger UID.
diagnostics.http: board:8080 musi być równe north-124.
diagnostics.original: PVC/ledger UID musi być równe original-claim-uid.
diagnostics.replacement: PVC/ledger UID musi różnić się od original-claim-uid.
