title: Odzyskiwanie i odzyskiwanie woluminów
brief: 'Pracuj w `~/quest` z `volume-contract.json`, `claim.json`, `board.json`, `service.json`, `client.json` i `original-claim-uid`.
  PersistentVolume (PV) to zasób danych, a PVC to jego żądanie. Kontrakt podaje oryginalną nazwę i UID PV. Ustaw politykę
  odzyskiwania na `Retain`; `storageClassName` musi odpowiadać nazwie wolumenu, a faza musi być `Bound`. UID claimRef PV musi
  odpowiadać bieżącemu UID PVC `ledger`. Domyślna polityka StorageClass nie zmienia istniejącego PV wstecz.


  W pierwszym etapie zachowaj oryginalny UID claimu. W drugim zatoka usuwa ten claim i wprowadza nowy: sprawdź, że stary zniknął,
  użyj warunków UID przed usunięciem starego claimRef i poczekaj na związanie nowego claimu. Jego UID musi różnić się od `original-claim-uid`.
  W obu etapach `board:8080` musi zwrócić `north-124`. Kontrola obserwuje bieżący PV, claim i odpowiedź, nie historię ponownego
  związania ani źródło odpowiedzi. Ten lokalny wolumen ćwiczeniowy nie znajduje się na VM ani NAS. Pracuj tylko w zatoce offline.'
debrief: Kontrole sprawdziły PV z Retain, tożsamości claimów i odpowiedzi board.
stages.0.brief: Pierwotny PV z Retain jest związany z pierwotnym claimem, a board zwraca `north-124`.
stages.0.objectives.0.text: Pierwotny PV z Retain jest związany z pierwotnym claimem, a board zwraca `north-124`.
stages.1.brief: Pierwotny PV z Retain jest związany z claimem o innym UID, a board zwraca `north-124`.
stages.1.objectives.0.text: Pierwotny PV z Retain jest związany z claimem o innym UID, a board zwraca `north-124`.
hints.0.text: Zamiast zakładać, że wartości domyślne StorageClass obowiązują z mocą wsteczną, sprawdź istniejącą politykę
  PV.
hints.1.text: Zwolniony zachowany PV może nadal nazywać usunięty claim UID.
hints.2.text: Sprawdź identities, usuń tylko przestarzały claimRef i poczekaj na powiązanie oczekującego zamiennika.
phrases.0: Zmieniłem politykę dotyczącą istniejącego PV.
phrases.1: Porównałem tożsamości pierwotnego i nowego claim.
phrases.2: Sprawdziłem odpowiedź board i zachowany PV.
questions.0.points.0: NIE; stare odniesienie claim może zachować Released.
questions.0.points.1: Połącz ponownie celowo po sprawdzeniu własności i danych.
questions.0.prompt: Czy Retain automatycznie podłącza wolumen do nowego claim?
questions.1.points.0: Istniejące PVs zachowują własne reclaim policy.
questions.1.points.1: Sprawdź i chroń rzeczywisty wolumin przed usunięciem claim.
questions.1.prompt: Czy wartość domyślna StorageClass zmienia istniejącą politykę PV?
