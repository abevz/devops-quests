title: Odzyskiwanie i odzyskiwanie woluminów
brief: 'Wnęka zawiera jeden syntetyczny local PV i board tylko do odczytu wyświetlającą north-124. Chroń
  ten istniejący wolumen, zmieniając jego zasady odzyskiwania z Delete na Retain, zachowując tożsamości
  PV i claim. Klasa StorageClass pozostaje tylko do odczytu: jej domyślna polityka nie chroni z mocą wsteczną
  istniejącego PVs. Na drugim etapie stary claim jest celowo usuwany, a zamiennik czeka na zachowany PV.
  Po sprawdzeniu, czy stary claim zniknął, wyczyść tylko stary claimRef za pomocą UID preconditions, aby
  nowy claim mógł powiązać te same dane. Ścieżka istnieje tylko wewnątrz posiadanego węzła kind, a nie
  w VM lub NAS.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `volume-contract.json`, `claim.json`,
  `board.json`, `service.json`, `client.json`, `original-claim-uid`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Oryginalny powiązany PV używa Retain, oryginalna claim pozostaje, a board
  obsługuje north-124.'
debrief: Retain zapobiega automatycznej regeneracji; jawne kontrole tożsamości i rebind odzyskały ten
  sam rekord.
