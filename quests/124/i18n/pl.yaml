title: Odzyskiwanie i odzyskiwanie woluminów
brief: "Wolumen musi pozostać użyteczny w dwóch stanach claimu. Zachowaj jego tożsamość i kontrakt retencji, przywracając\
  \ odpowiedź board.\n\nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `volume-contract.json`, `claim.json`,\
  \ `board.json`, `service.json`, `client.json`, `original-claim-uid`.\n\n**Requirements:**\n\n- Etap 1:\n  - Oryginalny\
  \ PV wskazany w `volume-contract.json` pozostaje, używa zasady odzyskiwania `Retain` i ma nazwę klasy składowania\
  \ równą nazwie wolumenu.\n  - PV jest `Bound` z bieżącym UID PVC `ledger`, a ten claim zachowuje pierwotny niepusty\
  \ UID.\n  - Z Deployment `client` adres `http://board:8080` zwraca `north-124`.\n- Etap 2:\n  - Oryginalny PV\
  \ wskazany w `volume-contract.json` pozostaje, używa zasady odzyskiwania `Retain` i ma nazwę klasy składowania\
  \ równą nazwie wolumenu.\n  - Ten sam PV jest `Bound` z bieżącym UID PVC `ledger`, który jest niepusty i różni\
  \ się od pierwotnego UID claimu.\n  - Z Deployment `client` adres `http://board:8080` zwraca `north-124`.\n\n\
  **Verify yourself before Check & finish:** Wykonaj te polecenia obserwacji z `~/quest` na stacji roboczej.\n\n\
  - Ustawienia, tożsamości i stan odpowiadają wymaganiom.\n\n  ```sh\n  cat volume-contract.json original-claim-uid\n\
  \  volume=$(jq -r .volume volume-contract.json)\n  kubectl get pv \"$volume\" -o yaml\n  kubectl get pvc ledger\
  \ -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Odbiorca otrzymuje\
  \ `north-124` na obu etapach.\n\nKontrole obserwują bieżący PV, claim i odpowiedź, nie historię ponownego wiązania\
  \ ani źródło odpowiedzi; lokalny wolumen ćwiczeniowy nie znajduje się na VM ani NAS."
debrief: Kontrole sprawdziły PV z Retain, tożsamości claimów i odpowiedzi board.
stages.0.brief: Oryginalny wolumen i claim muszą pozostać związane i użyteczne.
stages.1.brief: Zachowany wolumen musi być związany z zastępczym claimem i pozostać użyteczny.
hints.0.text: Zamiast zakładać, że wartości domyślne StorageClass obowiązują z mocą wsteczną, sprawdź istniejącą
  politykę PV.
hints.1.text: Zwolniony zachowany PV może nadal nazywać usunięty claim UID.
hints.2.text: Sprawdź identities, usuń tylko przestarzały claimRef i poczekaj na powiązanie oczekującego zamiennika.
  Sprawdź, czy stary claim zniknął, i użyj warunków UID przed wyczyszczeniem starego claimRef. Domyślne wartości
  StorageClass nie zmieniają istniejącego PV wstecz.
phrases.0: Zmieniłem politykę dotyczącą istniejącego PV.
phrases.1: Porównałem tożsamości pierwotnego i nowego claim.
phrases.2: Sprawdziłem odpowiedź board i zachowany PV.
questions.0.points.0: NIE; stare odniesienie claim może zachować Released.
questions.0.points.1: Połącz ponownie celowo po sprawdzeniu własności i danych.
questions.0.prompt: Czy Retain automatycznie podłącza wolumen do nowego claim?
questions.1.points.0: Istniejące PVs zachowują własne reclaim policy.
questions.1.points.1: Sprawdź i chroń rzeczywisty wolumin przed usunięciem claim.
questions.1.prompt: Czy wartość domyślna StorageClass zmienia istniejącą politykę PV?
diagnostics.volume: volume-contract.json volume musi być dostępne.
diagnostics.pv_uid_fact: volume-contract.json pv_uid musi być dostępne.
