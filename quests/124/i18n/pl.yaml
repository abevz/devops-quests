title: Odzyskiwanie i odzyskiwanie woluminów
brief: |-
  Wolumen musi pozostać użyteczny w dwóch stanach claimu. Zachowaj jego tożsamość i kontrakt retencji, przywracając odpowiedź board.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Etap 1:
    - Pierwotny wolumen wskazany przez `volume-contract.json` zachowuje tożsamość i klasę pamięci oraz dane po usunięciu claimu.
    - PV jest `Bound` z bieżącym UID PVC `ledger`, a ten claim zachowuje pierwotny niepusty UID.
    - Z Deployment `client` adres `http://board:8080` zwraca `north-124`.

  - Etap 2:
    - Pierwotny wolumen wskazany przez `volume-contract.json` zachowuje tożsamość i klasę pamięci oraz dane po usunięciu claimu.
    - Ten sam PV jest `Bound` z bieżącym UID PVC `ledger`, który jest niepusty i różni się od pierwotnego UID claimu.
    - Z Deployment `client` adres `http://board:8080` zwraca `north-124`.

  Kontrole obserwują bieżący PV, claim i odpowiedź, nie historię ponownego wiązania ani źródło odpowiedzi; lokalny wolumen ćwiczeniowy nie znajduje się na VM ani NAS.
debrief: Kontrole sprawdziły PV z Retain, tożsamości claimów i odpowiedzi board.
stages.0.brief: Oryginalny wolumen i claim muszą pozostać związane i użyteczne.
stages.1.brief: Zachowany wolumen musi być związany z zastępczym claimem i pozostać użyteczny.
hints.0.text: Zamiast zakładać, że wartości domyślne StorageClass obowiązują z mocą wsteczną, sprawdź
  istniejącą politykę PV.
hints.1.text: |-
  Zwolniony zachowany PV może nadal nazywać usunięty claim UID.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Sprawdź identities, usuń tylko przestarzały claimRef i poczekaj na powiązanie oczekującego zamiennika. Sprawdź, czy stary claim zniknął, i użyj warunków UID przed wyczyszczeniem starego claimRef. Domyślne wartości StorageClass nie zmieniają istniejącego PV wstecz.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-124` na obu etapach.
phrases.0: Zmieniłem politykę dotyczącą istniejącego PV.
phrases.1: Porównałem tożsamości pierwotnego i nowego claim.
phrases.2: Sprawdziłem odpowiedź board i zachowany PV.
questions.0.points.0: NIE; stare odniesienie claim może zachować Released.
questions.0.points.1: Połącz ponownie celowo po sprawdzeniu własności i danych.
questions.0.prompt: Czy Retain automatycznie podłącza wolumen do nowego claim?
questions.1.points.0: Istniejące PVs zachowują własne reclaim policy.
questions.1.points.1: Sprawdź i chroń rzeczywisty wolumin przed usunięciem claim.
questions.1.prompt: Czy wartość domyślna StorageClass zmienia istniejącą politykę PV?
