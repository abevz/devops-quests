title: Volumenrückgewinnung und -wiederherstellung
brief: |-
  Das Volume muss über zwei Claim-Zustände nutzbar bleiben. Bewahren Sie seine Identität und den Aufbewahrungsvertrag und stellen Sie die Board-Antwort her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stufe 1:
    - Das ursprüngliche Volume aus `volume-contract.json` behält Identität und Speicherklasse und bewahrt seine Daten nach dem Löschen des Claims.
    - Das PV ist `Bound` an die aktuelle UID des PVC `ledger`, und dieser Claim behält seine ursprüngliche nichtleere UID.
    - Von Deployment `client` liefert `http://board:8080` den Wert `north-124`.

  - Stufe 2:
    - Das ursprüngliche Volume aus `volume-contract.json` behält Identität und Speicherklasse und bewahrt seine Daten nach dem Löschen des Claims.
    - Dasselbe PV ist `Bound` an die aktuelle UID des PVC `ledger`, die nichtleer ist und von der ursprünglichen Claim-UID abweicht.
    - Von Deployment `client` liefert `http://board:8080` den Wert `north-124`.

  Die Prüfungen beobachten aktuelles PV, Claim und Antwort, nicht den Verlauf der Neuanbindung oder die Antwortquelle; das lokale Übungsvolume liegt nicht auf VM oder NAS.
debrief: Die Prüfungen beobachteten das PV mit Retain, Claim-Identitäten und Board-Antworten.
stages.0.brief: Ursprüngliches Volume und Claim müssen gebunden und nutzbar bleiben.
stages.1.brief: Das erhaltene Volume muss an den Ersatz-Claim gebunden und nutzbar sein.
hints.0.text: Überprüfen Sie die bestehende PV-Richtlinie, anstatt davon auszugehen, dass StorageClass
  defaults rückwirkend gilt.
hints.1.text: |-
  Ein freigegebener beibehaltener PV kann den gelöschten claim weiterhin als UID bezeichnen.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Überprüfen Sie identities, entfernen Sie nur das veraltete claimRef und lassen Sie den ausstehenden Ersatz binden. Prüfen Sie, dass der alte Claim weg ist, und verwenden Sie UID-Vorbedingungen vor dem Löschen seiner veralteten claimRef. StorageClass-Defaults ändern ein bestehendes PV nicht rückwirkend.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält in beiden Stufen `north-124`.
phrases.0: Ich habe die Richtlinie für den vorhandenen PV geändert.
phrases.1: Ich verglich die Identitäten des ursprünglichen und des neuen Claims.
phrases.2: Ich prüfte die Board-Antwort und das erhaltene PV.
questions.0.points.0: NEIN; Die alte Referenz claim kann sie behalten Released.
questions.0.points.1: Führen Sie eine erneute Bindung durch, nachdem Sie den Besitz und die Daten überprüft
  haben.
questions.0.prompt: Verbindet Retain das Volume automatisch mit einem neuen claim?
questions.1.points.0: Bestehende PVs behalten ihre eigenen reclaim policy.
questions.1.points.1: Überprüfen und schützen Sie das tatsächliche Volume vor dem Löschen von claim.
questions.1.prompt: Ändert ein StorageClass-Standard die bestehende PV-Richtlinie?
