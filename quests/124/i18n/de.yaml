stages.1.brief: 'Erfolgskriterien: Ein neuer claim bindet den ursprünglich beibehaltenen PV und liest
  den ursprünglichen "north-124"-Datensatz.'
stages.1.objectives.0.text: Ein neuer claim bindet den ursprünglich beibehaltenen PV und liest den ursprünglichen
