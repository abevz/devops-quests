title: Volumenrückgewinnung und -wiederherstellung
brief: |-
  Das Volume muss über zwei Claim-Zustände nutzbar bleiben. Bewahren Sie seine Identität und den Aufbewahrungsvertrag und stellen Sie die Board-Antwort her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `volume-contract.json`, `claim.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.

  **Requirements:**

  - Stufe 1:
    - Das ursprüngliche Volume aus `volume-contract.json` behält Identität und Speicherklasse und bewahrt seine Daten nach dem Löschen des Claims.
    - Das PV ist `Bound` an die aktuelle UID des PVC `ledger`, und dieser Claim behält seine ursprüngliche nichtleere UID.
    - Von Deployment `client` liefert `http://board:8080` den Wert `north-124`.

  - Stufe 2:
    - Das ursprüngliche Volume aus `volume-contract.json` behält Identität und Speicherklasse und bewahrt seine Daten nach dem Löschen des Claims.
    - Dasselbe PV ist `Bound` an die aktuelle UID des PVC `ledger`, die nichtleer ist und von der ursprünglichen Claim-UID abweicht.
    - Von Deployment `client` liefert `http://board:8080` den Wert `north-124`.

  Die Prüfungen beobachten aktuelles PV, Claim und Antwort, nicht den Verlauf der Neuanbindung oder die Antwortquelle; das lokale Übungsvolume liegt nicht auf VM oder NAS.
debrief: Die Prüfungen beobachteten das PV mit Retain, Claim-Identitäten und Board-Antworten.
stages.0.brief: Ursprüngliches Volume und Claim müssen gebunden und nutzbar bleiben.
stages.1.brief: Das erhaltene Volume muss an den Ersatz-Claim gebunden und nutzbar sein.
hints.0.text: Überprüfen Sie die bestehende PV-Richtlinie, anstatt davon auszugehen, dass StorageClass
  defaults rückwirkend gilt.
hints.1.text: |-
  Ein freigegebener beibehaltener PV kann den gelöschten claim weiterhin als UID bezeichnen.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  cat volume-contract.json original-claim-uid
    volume=$(jq -r .volume volume-contract.json)
    kubectl get pv "$volume" -o yaml
    kubectl get pvc ledger -o yaml
  ```
hints.2.text: |-
  Überprüfen Sie identities, entfernen Sie nur das veraltete claimRef und lassen Sie den ausstehenden Ersatz binden. Prüfen Sie, dass der alte Claim weg ist, und verwenden Sie UID-Vorbedingungen vor dem Löschen seiner veralteten claimRef. StorageClass-Defaults ändern ein bestehendes PV nicht rückwirkend.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält in beiden Stufen `north-124`.
phrases.0: Ich habe die Richtlinie für den vorhandenen PV geändert.
phrases.1: Ich verglich die Identitäten des ursprünglichen und des neuen Claims.
phrases.2: Ich prüfte die Board-Antwort und das erhaltene PV.
questions.0.points.0: NEIN; Die alte Referenz claim kann sie behalten Released.
questions.0.points.1: Führen Sie eine erneute Bindung durch, nachdem Sie den Besitz und die Daten überprüft
  haben.
questions.0.prompt: Verbindet Retain das Volume automatisch mit einem neuen claim?
questions.1.points.0: Bestehende PVs behalten ihre eigenen reclaim policy.
questions.1.points.1: Überprüfen und schützen Sie das tatsächliche Volume vor dem Löschen von claim.
questions.1.prompt: Ändert ein StorageClass-Standard die bestehende PV-Richtlinie?
stages.0.objectives.0.text: Das ursprüngliche Volume aus `volume-contract.json` behält Identität und Speicherklasse
  und bewahrt seine Daten nach dem Löschen des Claims.
stages.0.objectives.1.text: Das PV ist `Bound` an die aktuelle UID des PVC `ledger`, und dieser Claim
  behält seine ursprüngliche nichtleere UID.
stages.0.objectives.2.text: Von Deployment `client` liefert `http://board:8080` den Wert `north-124`.
stages.1.objectives.0.text: Das ursprüngliche Volume aus `volume-contract.json` behält Identität und Speicherklasse
  und bewahrt seine Daten nach dem Löschen des Claims.
stages.1.objectives.1.text: Dasselbe PV ist `Bound` an die aktuelle UID des PVC `ledger`, die nichtleer
  ist und von der ursprünglichen Claim-UID abweicht.
stages.1.objectives.2.text: Von Deployment `client` liefert `http://board:8080` den Wert `north-124`.
diagnostics.volume: Prüfe, ob der bereitgestellte Vertrag den Namen des Volumes enthält. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-contract-volume)
diagnostics.pv_uid_fact: Prüfe, ob der bereitgestellte Vertrag die UID des ursprünglichen PV enthält. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-contract-uid)
diagnostics.pv_uid: Der im Vertrag erfasste PV fehlt möglicherweise oder hat eine andere UID. Vergleiche die aktuelle UID mit pv_uid in volume-contract.json. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-live-identity)
diagnostics.class: Der PV hat möglicherweise einen anderen Wert für storageClassName. Vergleiche ihn mit volume in volume-contract.json. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-storage-class)
diagnostics.reclaim: Die Rückgewinnungsrichtlinie Retain fehlt möglicherweise am PV. Prüfe die aktuelle Richtlinie vor der Änderung des PVC. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-retain-policy)
diagnostics.phase: Der PV wartet möglicherweise noch auf einen passenden PVC. Prüfe, ob seine aktuelle Phase Bound ist. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-bound-phase)
diagnostics.claimref: Der PV verweist möglicherweise noch auf einen früheren ledger-PVC. Vergleiche claimRef.uid mit der UID des aktuellen ledger-PVC. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-current-claimref)
diagnostics.original: Der ledger-PVC fehlt möglicherweise oder wurde bereits ersetzt. In dieser Phase muss seine UID mit original-claim-uid übereinstimmen. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-original-claim)
diagnostics.replacement: Der neue ledger-PVC fehlt möglicherweise oder der ursprüngliche PVC ist noch vorhanden. Vergleiche in dieser Phase seine UID mit original-claim-uid und bestätige, dass sie sich unterscheiden. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-replacement-claim)
diagnostics.http: Der Client erreicht board:8080 möglicherweise nicht oder erhält andere Daten. Prüfe, ob die tatsächliche Antwort north-124 lautet. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q124-pv-board-content)
