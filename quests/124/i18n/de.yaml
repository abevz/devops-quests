title: Volumenrückgewinnung und -wiederherstellung
brief: 'Der Schacht verfügt über einen synthetischen local PV und einen schreibgeschützten board mit der
  Anzeige north-124. Schützen Sie dieses vorhandene Volume, indem Sie dessen reclaim policy von Delete
  in Retain ändern und dabei PV und claim beibehalten identities. Der StorageClass bleibt schreibgeschützt:
  Sein Standardwert policy schützt vorhandene PVs nicht rückwirkend. In Stufe zwei wird der alte claim
  bewusst entfernt und ein Ersatz wartet auf diesen beibehaltenen PV. Nachdem Sie überprüft haben, dass
  der alte claim nicht mehr vorhanden ist, löschen Sie nur den alten claimRef mit UID preconditions, damit
  der neue claim dieselben Daten binden kann. Der Pfad existiert nur innerhalb des eigenen kind-Knotens,
  nicht auf dem VM oder NAS.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `volume-contract.json`, `claim.json`,
  `board.json`, `service.json`, `client.json`, `original-claim-uid`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der ursprünglich gebundene PV verwendet Retain, der ursprüngliche claim bleibt
  bestehen und der board bedient north-124.'
debrief: Retain verhinderte die automatische Wiederherstellung; explizite Identitätsprüfungen und rebind
  haben denselben Datensatz wiederhergestellt.
stages.0.brief: 'Erfolgskriterien: Der ursprünglich gebundene PV verwendet Retain, der ursprüngliche claim
  bleibt erhalten und der board bedient north-124.'
stages.0.objectives.0.text: Der ursprünglich gebundene PV verwendet Retain, der ursprüngliche claim bleibt
