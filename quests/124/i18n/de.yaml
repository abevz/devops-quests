hints.0.text: Überprüfen Sie die bestehende PV-Richtlinie, anstatt davon auszugehen, dass StorageClass
  defaults rückwirkend gilt.
hints.1.text: Ein freigegebener beibehaltener PV kann den gelöschten claim weiterhin als UID bezeichnen.
hints.2.text: Überprüfen Sie identities, entfernen Sie nur das veraltete claimRef und lassen Sie den ausstehenden
  Ersatz binden.
phrases.0: Ich habe die Richtlinie für den vorhandenen PV geändert.
phrases.1: Ich habe den gelöschten claim identity vor dem erneuten Binden überprüft.
phrases.2: Ich habe die ursprünglichen Bytes wiederhergestellt, ohne den Speicher zu ersetzen.
