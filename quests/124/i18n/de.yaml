title: Volumenrückgewinnung und -wiederherstellung
brief: 'Arbeite in `~/quest` mit `volume-contract.json`, `claim.json`, `board.json`, `service.json`, `client.json` und `original-claim-uid`.
  Ein PersistentVolume (PV) ist die Speicherressource; ein PVC beansprucht sie. Der Vertrag liefert ursprünglichen PV-Namen
  und UID. Setze die Reclaim-Policy auf `Retain`; `storageClassName` muss dem Volume-Namen entsprechen und die Phase `Bound`
  sein. Die claimRef-UID des PV muss der aktuellen UID des PVC `ledger` entsprechen. Der StorageClass-Standard ändert ein
  bestehendes PV nicht rückwirkend.


  Bewahre in Phase eins die ursprüngliche Claim-UID. In Phase zwei entfernt die Umgebung diesen Claim und erstellt einen Ersatz:
  Prüfe, dass der alte Claim weg ist, nutze UID-Vorbedingungen vor dem Entfernen der alten claimRef und warte auf die Bindung
  des neuen Claims. Seine UID muss sich von `original-claim-uid` unterscheiden. In beiden Phasen muss `board:8080` `north-124`
  liefern. Die Prüfung beobachtet aktuelles PV, Claim und Antwort, nicht die Historie der Bindung oder die Quelle der Antwort.
  Dieses lokale Übungs-Volume liegt nicht auf VM oder NAS. Arbeite nur in der Offline-Umgebung.'
debrief: Die Prüfungen beobachteten das PV mit Retain, Claim-Identitäten und Board-Antworten.
stages.0.brief: Das ursprüngliche PV mit Retain ist an den ursprünglichen Claim gebunden und board liefert `north-124`.
stages.0.objectives.0.text: Das ursprüngliche PV mit Retain ist an den ursprünglichen Claim gebunden und board liefert `north-124`.
stages.1.brief: Das ursprüngliche PV mit Retain ist an einen Claim mit anderer UID gebunden und board liefert `north-124`.
stages.1.objectives.0.text: Das ursprüngliche PV mit Retain ist an einen Claim mit anderer UID gebunden und board liefert
  `north-124`.
hints.0.text: Überprüfen Sie die bestehende PV-Richtlinie, anstatt davon auszugehen, dass StorageClass defaults rückwirkend
  gilt.
hints.1.text: Ein freigegebener beibehaltener PV kann den gelöschten claim weiterhin als UID bezeichnen.
hints.2.text: Überprüfen Sie identities, entfernen Sie nur das veraltete claimRef und lassen Sie den ausstehenden Ersatz binden.
phrases.0: Ich habe die Richtlinie für den vorhandenen PV geändert.
phrases.1: Ich verglich die Identitäten des ursprünglichen und des neuen Claims.
phrases.2: Ich prüfte die Board-Antwort und das erhaltene PV.
questions.0.points.0: NEIN; Die alte Referenz claim kann sie behalten Released.
questions.0.points.1: Führen Sie eine erneute Bindung durch, nachdem Sie den Besitz und die Daten überprüft haben.
questions.0.prompt: Verbindet Retain das Volume automatisch mit einem neuen claim?
questions.1.points.0: Bestehende PVs behalten ihre eigenen reclaim policy.
questions.1.points.1: Überprüfen und schützen Sie das tatsächliche Volume vor dem Löschen von claim.
questions.1.prompt: Ändert ein StorageClass-Standard die bestehende PV-Richtlinie?
