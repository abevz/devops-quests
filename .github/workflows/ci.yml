name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DQ_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e '.[test]' ruff==0.17.1 build==1.3.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: ruff check .
      - run: python -m pytest -q
      - run: npm test
      - run: python scripts/validate_i18n.py
      - run: sha256sum --check deploy/web-bundles.sha256
      - run: python -m build
      - name: Public tree hygiene
        run: python scripts/public_hygiene.py
