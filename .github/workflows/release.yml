name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: python scripts/ci_dependencies.py
      - run: python -m pip install --no-index --find-links .ci-cache/wheelhouse setuptools wheel
      - run: python -m pip install --no-index --find-links .ci-cache/wheelhouse --no-build-isolation -e '.[test]' build==1.3.0
      - run: npm ci --offline --ignore-scripts --cache .ci-cache/npm
      - run: npm run build
      - name: Build pinned sandbox and Lab assets; do not start sandboxes
        run: python scripts/prepare_assets.py --release-build
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish immutable sandbox and Lab image identities
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_images.py "$RELEASE_TAG"
      - run: python -m build --no-isolation
      - name: Package verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp release-images.lock.json dist/
          python scripts/build_release.py "$RELEASE_TAG"
      - name: Create GitHub Release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --notes-file "docs/releases/$RELEASE_TAG.md"
