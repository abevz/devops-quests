#cloud-config
# Ubuntu 24.04 LTS amd64: 4 vCPU, 8 GiB RAM, >=40 GiB disk.
# Supply your own SSH key through the VM manager. No app account is created.
# Use only after this immutable release has been published; verify the release first.
package_update: true
packages: [docker.io, docker-compose-v2, curl, ca-certificates, python3]
runcmd:
  - [systemctl, enable, --now, docker]
  - - bash
    - -ceu
    - |
      install -d -m 0755 /opt/devops-quests
      cd /opt/devops-quests
      version=v1.0.0
      origin="https://github.com/abevz/devops-quests/releases/download/$version"
      curl --fail --show-error --location "$origin/SHA256SUMS" -o SHA256SUMS
      curl --fail --show-error --location "$origin/devops-quests-$version.tar.gz" -o "devops-quests-$version.tar.gz"
      sha256sum --ignore-missing --check SHA256SUMS
      python3 -c 'import sys,tarfile; tarfile.open(sys.argv[1]).extractall(".", filter="data")' "devops-quests-$version.tar.gz"
      docker compose up --detach --build
# Afterwards: cd /opt/devops-quests && sudo docker compose exec app python -m devops_quests init-admin --username YOUR_NAME
# App binds to loopback. Use SSH forwarding to reach it remotely; do not expose port 8766.
