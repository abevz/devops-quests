kubernetes:
  version: '1'
  title: {en: Kubernetes, ru: Kubernetes}
  description:
    en: A private three-node cluster, kubectl and persistent workspace. Cluster administration stays inside this Lab.
    ru: Отдельный кластер из трёх узлов, kubectl и сохраняемый рабочий каталог. Администрирование ограничено этим стендом.
  services: [kubernetes]
  workers: 2
  control_memory: 2g
ansible:
  version: '1'
  title: {en: Ansible, ru: Ansible}
  description:
    en: A controller and three SSH targets. Inventory, SSH keys, files and target changes survive stop/resume.
    ru: Управляющая среда и три SSH-хоста. Inventory, ключи, файлы и изменения на хостах сохраняются при остановке.
  services: [ansible]
opentofu:
  version: '1'
  title: {en: OpenTofu, ru: OpenTofu}
  description:
    en: Local state, cached providers and a private Docker daemon. No cloud account is connected.
    ru: Локальный state, готовые провайдеры и отдельный Docker. Облачная учётная запись не подключена.
  services: [tofu]
helm:
  version: '1'
  title: {en: Helm, ru: Helm}
  description:
    en: Helm, local charts and a private Kubernetes cluster. Releases and volumes survive stop/resume.
    ru: Helm, локальные чарты и отдельный Kubernetes. Релизы и тома сохраняются при остановке.
  services: [kubernetes]
  control_memory: 3g
gitops:
  version: '1'
  title: {en: GitOps, ru: GitOps}
  description:
    en: A local Git repository, Gitea, Argo CD and a private Kubernetes cluster with no external repositories.
    ru: Локальный Git, Gitea, Argo CD и отдельный Kubernetes без подключения внешних репозиториев.
  services: [kubernetes, gitea, argocd]
  control_memory: 3g
