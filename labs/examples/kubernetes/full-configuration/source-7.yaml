apiVersion: v1
kind: Pod
metadata:
  name: projected
  namespace: vg-k8s
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: input
          mountPath: /input
          readOnly: true
  volumes:
    - name: input
      projected:
        sources:
          - configMap:
              name: settings
          - downwardAPI:
              items:
                - path: pod-name
                  fieldRef:
                    fieldPath: metadata.name
          - serviceAccountToken:
              path: token
              audience: example-consumer
              expirationSeconds: 3600
