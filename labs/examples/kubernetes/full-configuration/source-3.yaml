apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: vg-k8s
data:
  mode: blue
---
apiVersion: v1
kind: Pod
metadata:
  name: config-reader
  namespace: vg-k8s
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      env:
        - name: MODE
          valueFrom:
            configMapKeyRef:
              name: settings
              key: mode
      volumeMounts:
        - name: config
          mountPath: /config
        - name: config
          mountPath: /single
          subPath: mode
  volumes:
    - name: config
      configMap:
        name: settings
