apiVersion: v1
kind: Pod
metadata:
  name: resize
  namespace: vg-k8s
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: RestartContainer
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
