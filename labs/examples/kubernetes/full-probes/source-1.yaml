apiVersion: v1
kind: Pod
metadata:
  name: probes
  namespace: vg-k8s
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 30
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 1
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3
