apiVersion: v1
kind: Pod
metadata:
  name: placed
  namespace: vg-k8s
spec:
  nodeSelector:
    kubernetes.io/hostname: vg-k8s-worker
  tolerations:
    - key: dedicated
      operator: Equal
      value: reserved
      effect: NoSchedule
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
