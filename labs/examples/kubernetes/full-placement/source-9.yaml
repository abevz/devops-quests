apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vg-k8s-important
value: 10000
globalDefault: false
preemptionPolicy: Never
description: "Important work without preemption"
---
apiVersion: v1
kind: Pod
metadata:
  name: important
  namespace: vg-k8s
spec:
  priorityClassName: vg-k8s-important
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 20m
          memory: 16Mi
