apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: vg-k8s
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: stored
  namespace: vg-k8s
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo durable >/data/value; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
