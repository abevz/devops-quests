apiVersion: v1
kind: Pod
metadata:
  name: missing-image
spec:
  restartPolicy: Never
  containers:
    - name: app
      # A closed port on the owned kind node; no external registry is contacted.
      image: localhost:9/lab-missing:1
      imagePullPolicy: Always
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-limit
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: REPLACE_WITH_LAB_IMAGE
      imagePullPolicy: Never
      command: [sh, -c, "exec dd if=/dev/zero of=/mem/blob bs=1M count=48"]
      resources:
        requests: {memory: 16Mi, cpu: 10m}
        limits: {memory: 16Mi, cpu: 100m}
      volumeMounts: [{name: memory, mountPath: /mem}]
  volumes:
    - name: memory
      emptyDir: {medium: Memory, sizeLimit: 64Mi}
