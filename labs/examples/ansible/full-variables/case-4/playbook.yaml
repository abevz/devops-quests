- name: Follow a value through tasks
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  vars:
    app_port: 8080
  tasks:
    - name: Read text from a process
      ansible.builtin.command:
        argv: [/usr/bin/printf, hello]
      register: r
      changed_when: false
    - name: Store a derived host value
      ansible.builtin.set_fact:
        answer: "{{ r.stdout | upper }}"
    - name: Show values
      ansible.builtin.debug:
        msg: "{{ answer }}: {{ app_port }}"
    - name: Check expected input
      ansible.builtin.assert:
        that:
          - answer == 'HELLO'
          - app_port | int == 9090
