- name: Repeat safely
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Create directory
      ansible.builtin.file:
        path: /tmp/ansible-visual-guide/app
        state: directory
        mode: "0755"
    - name: Write file
      ansible.builtin.copy:
        content: "port=8080\n"
        dest: /tmp/ansible-visual-guide/app/config
        mode: "0644"
      notify: Report change
    - name: Create marker once
      ansible.builtin.command:
        argv:
          - /usr/bin/touch
          - /tmp/ansible-visual-guide/app/marker
        creates: /tmp/ansible-visual-guide/app/marker
  handlers:
    - name: Report change
      ansible.builtin.debug:
        msg: handler ran
