- hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/settings.conf"
        regexp: '^color='
        line: color=green
        create: true
        mode: '0600'
      register: result
    - ansible.builtin.debug:
        msg: "{{ result.changed }}"
