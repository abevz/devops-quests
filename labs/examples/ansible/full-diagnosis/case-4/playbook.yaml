- name: Inspect a result structure
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Read text
      ansible.builtin.command:
        argv: [/usr/bin/printf, hello]
      register: r
      changed_when: false
    - name: Inspect useful fields
      ansible.builtin.debug:
        msg:
          rc: "{{ r.rc }}"
          stdout: "{{ r.stdout }}"
