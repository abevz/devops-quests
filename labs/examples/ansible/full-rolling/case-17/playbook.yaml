- name: Launch and join an async job
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_async_dir: /tmp/ansible-visual-guide/async
  tasks:
    - name: Launch harmless wait
      ansible.builtin.command:
        argv: [/usr/bin/sleep, "1"]
      async: 10
      poll: 0
      register: job
      changed_when: false
    - name: Wait for completion
      ansible.builtin.async_status:
        jid: "{{ job.ansible_job_id }}"
      register: done
      until: done.finished
      retries: 5
      delay: 1
      changed_when: false
    - name: Remove status file
      ansible.builtin.async_status:
        jid: "{{ job.ansible_job_id }}"
        mode: cleanup
      changed_when: false
