- hosts: web_lab
  connection: local
  gather_facts: false
  become: false
  serial: 1
  max_fail_percentage: 50
  tasks:
  - name: Start
    ansible.builtin.debug:
      msg: start
  - name: Fail first host
    ansible.builtin.fail:
      msg: intentional
    when: inventory_hostname == 'web1'
  - name: End
    ansible.builtin.debug:
      msg: end
