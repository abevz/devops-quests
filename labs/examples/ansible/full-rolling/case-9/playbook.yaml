- name: Simulate rolling order
  hosts: web_lab
  connection: local
  gather_facts: false
  become: false
  strategy: linear
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Simulate LB drain
      ansible.builtin.debug:
        msg: "Drain {{ inventory_hostname }}"
      delegate_to: localhost
  tasks:
    - name: Write host-specific demo configuration
      ansible.builtin.copy:
        content: "version=1\n"
        dest: "/tmp/ansible-visual-guide/{{ inventory_hostname }}.conf"
        mode: "0644"
      notify: Reload simulation
    - name: Reload before checking
      ansible.builtin.meta: flush_handlers
    - name: Check simulated health
      ansible.builtin.command:
        argv: [/usr/bin/true]
      changed_when: false
      register: health
      until: health.rc == 0
      retries: 2
      delay: 0
      throttle: 1
  post_tasks:
    - name: Simulate enabling in LB
      ansible.builtin.debug:
        msg: "Enable {{ inventory_hostname }}"
      delegate_to: localhost
  handlers:
    - name: Reload simulation
      ansible.builtin.debug:
        msg: reload simulation
