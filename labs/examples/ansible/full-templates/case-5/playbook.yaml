- name: Render host configuration
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  vars:
    users:
      - name: alice
        enabled: true
      - name: bob
        enabled: false
  tasks:
    - name: Render configuration
      ansible.builtin.template:
        src: app.conf.j2
        dest: /tmp/ansible-visual-guide/rendered.conf
        mode: "0644"
