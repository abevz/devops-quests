# reuse.yml
- name: Compare loading modes
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Static
      ansible.builtin.import_tasks: part.yml
      tags: [static]
    - name: Dynamic
      ansible.builtin.include_tasks: part.yml
      loop: [one, two]
      tags: [dynamic]
