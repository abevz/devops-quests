- hosts: fleet
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    fail_on: nobody
  tasks:
    - ansible.builtin.debug:
        msg: "begin {{ inventory_hostname }}"
    - ansible.builtin.assert:
        that: inventory_hostname != fail_on
    - ansible.builtin.copy:
        dest: /tmp/lab-rolling-marker
        content: "updated
"
