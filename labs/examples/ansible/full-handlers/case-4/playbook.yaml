- name: Explain handler queue
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Simulate a changed result
      ansible.builtin.debug:
        msg: changed event
      changed_when: true
      notify: configuration changed
    - name: Flush before continuing
      ansible.builtin.meta: flush_handlers
    - name: Continue after flush
      ansible.builtin.debug:
        msg: next task
  handlers:
    - name: Report reload
      ansible.builtin.debug:
        msg: handler ran
      listen: configuration changed
