- hosts: lab
  connection: local
  gather_facts: false
  become: false
  handlers:
  - name: H
    ansible.builtin.debug:
      msg: handler ran
  tasks:
  - name: Probe
    ansible.builtin.copy:
      content: 'v1

        '
      dest: /tmp/ansible-revision-jRYkFm/failure-config
      mode: '0644'
    notify: H
  - name: Fail
    ansible.builtin.command:
      argv:
      - /usr/bin/false
    changed_when: false
