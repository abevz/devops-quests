- name: Explain recovery flow
  hosts: lab
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Protected operation
      block:
        - name: Fail deliberately
          ansible.builtin.command:
            argv: [/usr/bin/false]
          changed_when: false
      rescue:
        - name: Show failure context
          ansible.builtin.debug:
            msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.rc }}"
      always:
        - name: Show cleanup path
          ansible.builtin.debug:
            msg: always
    - name: Continue after recovery
      ansible.builtin.debug:
        msg: next task
