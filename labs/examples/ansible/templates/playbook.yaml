- hosts: app1
  gather_facts: false
  vars:
    listen_port: 8080
    features: [health, metrics]
  tasks:
    - ansible.builtin.template:
        src: settings.j2
        dest: /tmp/lab-template.conf
        mode: '0644'
    - ansible.builtin.slurp:
        src: /tmp/lab-template.conf
      register: rendered
    - ansible.builtin.debug:
        msg: "{{ rendered.content | b64decode }}"
