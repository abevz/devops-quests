{{- if .Values.runMigration }}
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: {{ .Values.migrationImage | quote }}
        imagePullPolicy: Never
        command: [sh, -c, 'echo schema-v2 > /data/schema']
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: schema-data}}]
{{- end }}
