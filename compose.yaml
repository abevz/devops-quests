services:
  app:
    build:
      context: .
      dockerfile: deploy/Backend.Dockerfile
    network_mode: host
    working_dir: ${PWD:?Run docker compose from the extracted project directory}
    environment:
      PYTHONPATH: ${PWD}
      DQ_ADMIN_USER: ${DQ_ADMIN_USER:-}
      DQ_ADMIN_PASSWORD: ${DQ_ADMIN_PASSWORD:-}
      DQ_PORT: ${DQ_PORT:-8766}
      DQ_UPDATE_CHECK: ${DQ_UPDATE_CHECK:-0}
      DQ_UPDATE_REPO: ${DQ_UPDATE_REPO:-abevz/devops-quests}
      DQ_UPDATE_HINT: ${DQ_UPDATE_HINT:-none}
      DQ_UPDATE_DEPLOY_COMMAND: ${DQ_UPDATE_DEPLOY_COMMAND:-sudo /opt/devops-quests/operator/deploy.sh}
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    command: [python3, scripts/container_start.py]
    init: true
    stop_grace_period: 60s
