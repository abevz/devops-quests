[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-quests"
version = "1.2.1"
description = "Self-hosted DevOps incident practice with isolated sandboxes and persistent labs"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5",
    "bcrypt==5.0.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
devops-quests = "devops_quests.cli:main"

[tool.setuptools]
packages = ["devops_quests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff]
extend-exclude = ["vendor", "web/vendor", "artifacts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
