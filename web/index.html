<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title data-i18n="app.title"></title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23282828'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%23a9b665'%3E%E2%8C%98%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/vendor/xterm.css" />
    <script defer src="assets/vendor/terminal.js"></script>
    <script defer src="assets/vendor/markdown.js"></script>
    <script type="module" src="assets/app.js"></script>
  </head>
  <body class="app-shell">
    <header class="app-header">
      <a class="brand" href="./"
        ><span class="logo">⌘</span><span>SignalRail<small>DEVOPS QUESTS</small></span></a
      >
      <button id="nav-toggle" aria-controls="primary-navigation" aria-expanded="false" data-i18n="nav.menu"></button>
    </header>
    <aside class="app-sidebar" id="primary-navigation">
      <nav aria-label="Main navigation" data-i18n-aria="nav.main">
        <a id="map-tab" href="#map" data-screen="map" data-i18n="nav.map"></a>
        <a id="quest-tab" href="#quest" data-screen="bay" data-i18n="nav.bay"></a>
        <a id="guides-nav" href="guides" data-screen="guides" data-i18n="nav.guides"></a>
        <a id="labs-nav" href="labs" data-screen="labs" data-i18n="nav.labs"></a>
        <a id="interview-nav" href="interview" data-screen="interview" data-i18n="nav.interview"></a>
      </nav>
      <div class="sidebar-state"><a id="active-workspace" href="#quest" hidden data-i18n="nav.active_bay"></a></div>
      <nav class="account-navigation" aria-label="Account" data-i18n-aria="nav.account">
        <a id="profile-tab" href="profile" data-screen="profile" data-i18n="nav.profile" hidden></a>
        <button id="scoring-nav" data-i18n="scoring.title"></button>
        <button id="theme"></button>
        <button id="logout" data-i18n="nav.logout" hidden></button>
      </nav>
    </aside>
    <button
      id="nav-backdrop"
      class="nav-backdrop"
      tabindex="-1"
      aria-label="Close menu"
      data-i18n-aria="nav.close"
    ></button>
    <main>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="login" class="card signin">
        <span class="eyebrow" data-i18n="login.network"></span>
        <h1 data-i18n="login.title"></h1>
        <p data-i18n="login.subtitle"></p>
        <form id="login-form">
          <label
            ><span data-i18n="login.username"></span><input name="name" autocomplete="username" required maxlength="32"
          /></label>
          <label
            ><span data-i18n="login.password"></span
            ><input name="password" type="password" autocomplete="current-password" required maxlength="128"
          /></label>
          <button class="primary" data-i18n="login.enter"></button>
        </form>
        <small data-i18n="login.admin_help"></small>
      </section>
      <section id="map" hidden>
        <div class="page-title">
          <div>
            <span class="eyebrow" data-i18n="map.eyebrow"></span>
            <h1 data-i18n="map.title"></h1>
            <p data-i18n="map.subtitle" data-i18n-values='{"count":130,"bands":4}'></p>
          </div>
          <div class="card stats" id="stats"></div>
        </div>
        <section class="card map-controls" aria-labelledby="map-mode-label">
          <label id="map-mode-label"
            ><span data-i18n="map.mode"></span
            ><select id="play-mode">
              <option value="normal" data-i18n="mode.normal"></option>
              <option value="track" data-i18n="mode.track"></option>
              <option value="free" data-i18n="mode.free"></option></select
          ></label>
          <label id="path-control" hidden
            ><span data-i18n="map.path"></span
            ><select id="play-track"></select
          ></label>
          <p id="mode-help" class="muted"></p>
          <div class="map-filters">
            <label id="track-filter-control"
              ><span data-i18n="map.track"></span
              ><select id="filter-track"></select
            ></label>
            <label
              ><span data-i18n="map.difficulty"></span
              ><select id="filter-difficulty">
                <option value="" data-i18n="map.all"></option>
                <option value="basics" data-i18n="difficulty.basics"></option>
                <option value="medium" data-i18n="difficulty.medium"></option>
                <option value="complex" data-i18n="difficulty.complex"></option>
                <option value="expert" data-i18n="difficulty.expert"></option></select
            ></label>
            <label
              ><span data-i18n="map.status"></span
              ><select id="filter-status">
                <option value="" data-i18n="map.all"></option>
                <option value="new" data-i18n="map.not_started"></option>
                <option value="passed" data-i18n="map.passed"></option>
                <option value="hinted" data-i18n="map.hinted"></option></select
            ></label>
            <label class="search-filter"
              ><span data-i18n="map.search"></span><input id="filter-search" type="search" maxlength="100"
            /></label>
          </div>
          <p id="filter-count" role="status"></p>
        </section>
        <div class="card exam-bar">
          <div class="exam-description">
            <strong data-i18n="exam.title"></strong><small data-i18n="exam.help"></small>
            <small id="exam-availability" role="status" hidden></small>
          </div>
          <div class="exam-controls">
            <label
              ><span data-i18n="exam.minutes"></span
              ><input id="exam-minutes" type="number" min="1" max="120" value="15"
            /></label>
            <button id="exam-random" aria-describedby="exam-availability" data-i18n="exam.start"></button>
          </div>
        </div>
        <div id="levels"></div>
        <details class="card">
          <summary data-i18n="hint.history"></summary>
          <div id="attempt-history"></div>
        </details>
        <details class="card">
          <summary data-i18n="exam.record"></summary>
          <div id="exams"></div>
        </details>
      </section>
      <section id="preview" hidden>
        <div class="page-title">
          <div>
            <p id="preview-mode" class="eyebrow"></p>
            <h1 id="preview-title"></h1>
          </div>
          <div class="actions">
            <button id="preview-translate" hidden></button><button id="preview-back" data-i18n="nav.map"></button>
          </div>
        </div>
        <p class="callout" data-i18n="preview.no_resources"></p>
        <div class="preview-grid">
          <article class="card">
            <div id="preview-story"></div>
            <h2 data-i18n="preview.stages"></h2>
            <div id="preview-stages"></div>
          </article>
          <aside class="card">
            <h2 data-i18n="preview.resources"></h2>
            <p id="preview-time"></p>
            <ul id="preview-dependencies"></ul>
            <div id="preview-facts"></div>
            <p id="preview-score"></p>
            <p id="preview-best"></p>
            <p data-i18n="scoring.best_rule"></p>
            <p id="preview-availability" role="status"></p>
            <button id="preview-run" class="primary" data-i18n="preview.run"></button>
          </aside>
        </div>
        <section class="card">
          <h2 data-i18n="quest.need_hint"></h2>
          <p id="preview-hint-policy"></p>
          <button id="preview-hint" data-i18n="quest.hint"></button>
          <div id="preview-hints"></div>
        </section>
      </section>
      <section id="labs" hidden>
        <h1 data-i18n="nav.labs"></h1>
        <p data-i18n="lab.intro"></p>
        <p class="muted" data-i18n="lab.persistence"></p>
        <div id="lab-profiles" class="lab-profiles"></div>
        <div id="lab-workspace" hidden>
          <button id="lab-list-back" data-i18n="lab.all"></button>
          <div class="lab-heading">
            <h2 id="lab-title"></h2>
            <span id="lab-status" role="status"></span>
          </div>
          <div id="lab-actions" class="actions"></div>
          <p id="lab-error" role="alert"></p>
          <div class="lab-grid">
            <article class="card" id="lab-help"></article>
            <div id="lab-workbench" class="workbench"></div>
          </div>
        </div>
      </section>
      <section id="guides" hidden>
        <div id="guide-reader" hidden>
          <button id="guide-list-back" data-i18n="guide.catalog"></button>
          <h1 id="guide-heading"></h1>
          <div class="actions">
            <button id="guide-lab" data-i18n="guide.lab"></button
            ><button
              id="guide-expand-all"
              aria-controls="guide-lesson guide-reference guide-used-levels"
              aria-expanded="false"
              data-i18n="guide.expand_all"
            ></button
            ><button id="guide-translate" hidden></button>
          </div>
          <p id="guide-warning" role="status"></p>
          <article id="guide-lesson" class="card markdown"></article>
          <div id="guide-reference"></div>
          <details class="card">
            <summary data-i18n="guide.used_in"></summary>
            <ul id="guide-used-levels"></ul>
          </details>
        </div>
        <div id="guide-catalog">
          <h1 data-i18n="nav.guides"></h1>
          <p data-i18n="guide.reading_free"></p>
          <label><span data-i18n="guide.search"></span><input id="guide-search" type="search" /></label>
          <div id="guide-groups"></div>
        </div>
      </section>
      <dialog id="scoring-modal" class="card">
        <h2 data-i18n="scoring.title"></h2>
        <div id="scoring-content"></div>
        <form method="dialog"><button data-i18n="scoring.close"></button></form>
      </dialog>
      <dialog id="hint-confirm" class="card">
        <p id="hint-confirm-message"></p>
        <form method="dialog" class="actions">
          <button value="cancel" data-i18n="hint.cancel"></button>
          <button value="confirm" class="primary" data-i18n="quest.hint"></button>
        </form>
      </dialog>
      <section id="profile" hidden>
        <div class="page-title">
          <h1 data-i18n="profile.title"></h1>
          <button id="profile-back" data-i18n="nav.map"></button>
        </div>
        <div class="profile-grid">
          <section class="card">
            <h2 data-i18n="profile.languages"></h2>
            <div id="language-settings" class="language-settings"></div>
            <p class="muted" data-i18n="profile.translation_help"></p>
          </section>
          <section class="card">
            <h2 data-i18n="profile.password"></h2>
            <p class="muted" data-i18n="profile.password_help"></p>
            <form id="password-form">
              <label
                ><span data-i18n="profile.current_password"></span
                ><input type="password" name="current" autocomplete="current-password" required maxlength="128"
              /></label>
              <label
                ><span data-i18n="profile.new_password"></span
                ><input
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  required
                  minlength="12"
                  maxlength="128"
              /></label>
              <label
                ><span data-i18n="profile.confirm_password"></span
                ><input
                  type="password"
                  name="confirmation"
                  autocomplete="new-password"
                  required
                  minlength="12"
                  maxlength="128" /></label
              ><button data-i18n="profile.change_password"></button>
            </form>
          </section>
        </div>
        <section id="admin" class="card" hidden>
          <h2 data-i18n="users.title"></h2>
          <p class="muted" data-i18n="users.help"></p>
          <form id="user-form" class="account-create">
            <label
              ><span data-i18n="login.username"></span
              ><input name="name" autocomplete="off" pattern="[a-z][a-z0-9_-]{2,31}" required maxlength="32"
            /></label>
            <label
              ><span data-i18n="users.password"></span
              ><input
                type="password"
                name="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="128"
                required /></label
            ><button data-i18n="users.create"></button>
          </form>
          <div id="user-list"></div>
          <form id="reset-password-form" hidden>
            <h3 id="reset-password-title"></h3>
            <input name="user_id" type="hidden" />
            <label
              ><span data-i18n="profile.new_password"></span
              ><input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="128"
                required
            /></label>
            <button data-i18n="users.reset"></button
            ><button type="button" id="cancel-password-reset" data-i18n="actions.cancel"></button>
          </form>
        </section>
      </section>
      <section id="interview" hidden>
        <div class="page-title">
          <div>
            <h1 data-i18n="interview.title"></h1>
            <p data-i18n="interview.help"></p>
          </div>
          <button id="interview-translate" hidden></button>
        </div>
        <h2 data-i18n="interview.completed"></h2>
        <div id="interview-completed"></div>
        <h2 data-i18n="interview.theory"></h2>
        <div id="interview-theory"></div>
      </section>
      <section id="bay" hidden>
        <div class="bay-title">
          <div>
            <span class="eyebrow" id="quest-tag"></span>
            <h1 id="quest-title"></h1>
          </div>
          <div class="actions">
            <span id="clock" class="badge"></span><span id="live-score" class="badge"></span
            ><span id="hint-status" class="badge" hidden></span><button id="bay-translate" hidden></button
            ><button id="stop" class="danger" data-i18n="quest.stop"></button>
          </div>
        </div>
        <div class="bay-grid">
          <article class="card briefing">
            <details id="story-panel" open>
              <summary data-i18n="quest.story"></summary>
              <div id="brief"></div>
              <div id="stage"></div>
            </details>
            <details open>
              <summary data-i18n="quest.objectives"></summary>
              <ul id="objectives" class="objectives"></ul>
            </details>
            <div id="check-feedback" role="status" aria-live="polite"></div>
            <div class="actions">
              <button id="check" class="primary" data-i18n="quest.check"></button
              ><button id="reset" data-i18n="quest.reset"></button>
            </div>
            <div id="hint-box">
              <h3 data-i18n="quest.need_hint"></h3>
              <button id="hint" data-i18n="quest.hint"></button>
              <div id="hints"></div>
            </div>
            <details>
              <summary data-i18n="facts.title"></summary>
              <section id="bay-facts"></section>
            </details>
            <details class="topology">
              <summary data-i18n="topology.title"></summary>
              <svg id="topology" viewBox="0 0 650 105" role="img" data-i18n-aria="topology.status"></svg>
            </details>
            <details class="team">
              <summary data-i18n="npc.channel"></summary>
              <div id="events"></div>
            </details>
            <div id="debrief" hidden></div>
          </article>
          <div class="workbench" id="bay-workbench">
            <section class="card terminal-panel" id="shared-terminal">
              <div class="panel-label">
                <span data-i18n="terminal.workstation"></span><span><span data-i18n="terminal.isolated"></span></span
                ><button id="fullscreen" data-i18n-aria="terminal.fullscreen">⛶</button>
              </div>
              <div class="terminal-tabs" role="tablist" data-i18n-aria="terminal.sessions">
                <div id="terminal-tabs"></div>
                <button id="new-terminal" data-i18n="terminal.new" data-i18n-aria="terminal.new_label"></button>
              </div>
              <div id="terminal"></div>
              <div class="extra-keys">
                <button data-key="Ctrl">Ctrl</button><button data-key="Alt">Alt</button
                ><button data-key="Tab">Tab</button><button data-key="Esc">Esc</button><button data-key="Left">←</button
                ><button data-key="Down">↓</button><button data-key="Up">↑</button><button data-key="Right">→</button
                ><button data-key="Insert">Ins</button><button data-key="Delete">Del</button
                ><button data-key="Home">Home</button><button data-key="End">End</button
                ><button data-key="Backspace">⌫</button><button data-key="|">|</button><button data-key="~">~</button
                ><button data-key="/">/</button>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <footer data-i18n="footer.caption"></footer>
  </body>
</html>
